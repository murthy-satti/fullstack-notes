<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
  <title id="title">Operating system resource map</title>
  <desc id="desc">Applications request services from the operating system, which schedules the processor, manages memory, organizes files, and controls devices.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#315b7d"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.label{font-size:15px;font-weight:bold}.small{font-size:13px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="250" y="16" width="220" height="54" rx="9" class="box"/>
  <text x="360" y="39" text-anchor="middle" class="label">Applications</text>
  <text x="360" y="58" text-anchor="middle" class="small">request services</text>
  <rect x="250" y="91" width="220" height="58" rx="9" class="box"/>
  <text x="360" y="116" text-anchor="middle" class="label">Operating system</text>
  <text x="360" y="137" text-anchor="middle" class="small">coordinates shared resources</text>
  <path d="M360 70V84" class="line"/>
  <rect x="18" y="174" width="150" height="42" rx="8" class="box"/>
  <text x="93" y="200" text-anchor="middle" class="label">Processor</text>
  <rect x="194" y="174" width="150" height="42" rx="8" class="box"/>
  <text x="269" y="200" text-anchor="middle" class="label">Memory</text>
  <rect x="376" y="174" width="150" height="42" rx="8" class="box"/>
  <text x="451" y="200" text-anchor="middle" class="label">File systems</text>
  <rect x="552" y="174" width="150" height="42" rx="8" class="box"/>
  <text x="627" y="200" text-anchor="middle" class="label">Devices</text>
  <path d="M305 149L110 166" class="line"/>
  <path d="M335 149L285 166" class="line"/>
  <path d="M385 149L435 166" class="line"/>
  <path d="M415 149L610 166" class="line"/>
</svg>
