<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="mld-title mld-desc">
  <title id="mld-title">Spotting and tracking down a memory leak</title>
  <desc id="mld-desc">In a healthy process, heapUsed rises and garbage collection brings it back to the same level. In a leaking process, every low point is higher than the last. To find the leak, take heap snapshot A with v8.writeHeapSnapshot or the inspector's Memory tab, let traffic run for a few minutes, take snapshot B, compare them in Chrome DevTools to see which object types keep growing, follow their retainers to the code holding them, and fix the cause, such as bounding a cache, removing listeners, clearing timers or closing resources. Raising --max-old-space-size is not a fix, because a leak fills any limit.</desc>
  <defs>
    <marker id="mld-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="350" height="150" rx="10" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <rect x="406" y="20" width="350" height="150" rx="10" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="199" y="42" font-size="13" font-weight="700" fill="#294a2e">Healthy: GC returns to the same level</text>
    <text x="581" y="42" font-size="13" font-weight="700" fill="#6b241c">Leak: every low point is higher</text>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M44 56V152H356"/>
      <path d="M426 56V152H738"/>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="200" y="166">time</text>
      <text x="582" y="166">time</text>
    </g>
    <polyline points="48,140 88,96 94,138 134,96 140,138 180,96 186,138 226,96 232,138 272,96 278,138 318,96 324,138 350,110" fill="none" stroke="#53845b" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="430,142 470,118 476,136 516,108 522,126 562,98 568,116 608,88 614,106 654,78 660,96 700,68 706,86 734,64" fill="none" stroke="#b5473a" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="48" y="68" font-size="11" fill="#40566b" text-anchor="start">heapUsed</text>
    <text x="430" y="68" font-size="11" fill="#40566b" text-anchor="start">heapUsed</text>

    <rect x="24" y="204" width="220" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="134" y="226" font-size="14" font-weight="700" fill="#263e5a">1. Snapshot A</text>
    <text x="134" y="244" font-size="11.5" fill="#263e5a">v8.writeHeapSnapshot()</text>
    <rect x="280" y="204" width="220" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="226" font-size="14" font-weight="700" fill="#263e5a">2. Let traffic run</text>
    <text x="390" y="244" font-size="11.5" fill="#263e5a">a few minutes of real load</text>
    <rect x="536" y="204" width="220" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="646" y="226" font-size="14" font-weight="700" fill="#263e5a">3. Snapshot B</text>
    <text x="646" y="244" font-size="11.5" fill="#263e5a">same method as A</text>

    <rect x="536" y="300" width="220" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="646" y="322" font-size="14" font-weight="700" fill="#66400f">4. Compare A and B</text>
    <text x="646" y="340" font-size="11.5" fill="#66400f">which object types grew?</text>
    <rect x="280" y="300" width="220" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="322" font-size="14" font-weight="700" fill="#66400f">5. Follow retainers</text>
    <text x="390" y="340" font-size="11.5" fill="#66400f">what still references them?</text>
    <rect x="24" y="300" width="220" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="134" y="322" font-size="14" font-weight="700" fill="#294a2e">6. Fix the cause</text>
    <text x="134" y="340" font-size="11.5" fill="#294a2e">bound cache, off(), clearInterval</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 232H278" marker-end="url(#mld-arrow)"/>
      <path d="M500 232H534" marker-end="url(#mld-arrow)"/>
      <path d="M646 260V298" marker-end="url(#mld-arrow)"/>
      <path d="M536 328H502" marker-end="url(#mld-arrow)"/>
      <path d="M280 328H246" marker-end="url(#mld-arrow)"/>
    </g>

    <rect x="24" y="392" width="732" height="44" rx="8" fill="#ffffff" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="390" y="419" font-size="12.5" fill="#6b241c"><tspan font-weight="700">Not a fix:</tspan> raising --max-old-space-size only delays the crash; a leak fills any limit.</text>
    <text x="390" y="476" font-size="13" fill="#40566b">A leak is memory that stays reachable; the retainer chain shows which code is holding it.</text>
  </g>
</svg>
