<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-labelledby="spa-title spa-desc">
  <title id="spa-title">Sequential awaits add up; parallel awaits overlap</title>
  <desc id="spa-desc">With two sequential awaits, fetchProfile takes 300 milliseconds and fetchSettings starts only afterwards and takes 200 milliseconds, so the result is ready at 500 milliseconds. With Promise.all both start at time zero, so the result is ready when the slower one finishes, at 300 milliseconds.</desc>
  <rect width="780" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g text-anchor="start">
      <text x="24" y="78" font-size="14" font-weight="700" fill="#36424e">Sequential</text>
      <text x="24" y="95" font-size="11.5" fill="#36424e">await, then await</text>
      <text x="24" y="188" font-size="14" font-weight="700" fill="#36424e">Parallel</text>
      <text x="24" y="205" font-size="11.5" fill="#36424e">await Promise.all([...])</text>
    </g>

    <g stroke="#dfe5ee" stroke-width="1">
      <path d="M200 40V262M300 40V262M400 40V262M500 40V262M600 40V262M700 40V262"/>
    </g>

    <rect x="200" y="56" width="300" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="350" y="75" font-size="12.5" fill="#263e5a">fetchProfile: 300 ms</text>
    <rect x="500" y="92" width="200" height="28" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="600" y="111" font-size="12.5" fill="#463365">fetchSettings: 200 ms</text>

    <rect x="200" y="166" width="300" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="350" y="185" font-size="12.5" fill="#263e5a">fetchProfile: 300 ms</text>
    <rect x="200" y="202" width="200" height="28" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="300" y="221" font-size="12.5" fill="#463365">fetchSettings: 200 ms</text>

    <g stroke-width="2.5" stroke-dasharray="5 4">
      <path d="M700 48V128" stroke="#b5473a"/>
      <path d="M500 158V238" stroke="#53845b"/>
    </g>
    <text x="706" y="62" font-size="12" font-weight="700" fill="#6b241c" text-anchor="start">ready</text>
    <text x="706" y="77" font-size="12" font-weight="700" fill="#6b241c" text-anchor="start">500 ms</text>
    <text x="506" y="226" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">ready at 300 ms</text>

    <path d="M200 262H720" stroke="#40566b" stroke-width="2"/>
    <g font-size="11.5" fill="#40566b">
      <path d="M200 262V268M300 262V268M400 262V268M500 262V268M600 262V268M700 262V268" stroke="#40566b" stroke-width="2"/>
      <text x="200" y="284">0 ms</text>
      <text x="300" y="284">100</text>
      <text x="400" y="284">200</text>
      <text x="500" y="284">300</text>
      <text x="600" y="284">400</text>
      <text x="700" y="284">500</text>
    </g>
    <text x="390" y="314" font-size="13" fill="#40566b">Start independent operations together; total time becomes the slowest one, not the sum.</text>
  </g>
</svg>
