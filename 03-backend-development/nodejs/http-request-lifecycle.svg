<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510" role="img" aria-labelledby="hrl-title hrl-desc">
  <title id="hrl-title">The life of one request in a node:http server</title>
  <desc id="hrl-desc">The client opens a TCP connection, or reuses a keep-alive one, and sends POST /tasks with headers. The server emits the request event, calling your listener with request and response. Body chunks arrive and the listener reads them with for await of request, enforcing a size limit and parsing JSON. The listener calls response.writeHead with 201 and headers, then response.end with the body, and the server sends HTTP/1.1 201 Created to the client. The connection stays open for the next request until keepAliveTimeout, 5 seconds by default.</desc>
  <defs>
    <marker id="hrl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="hrl-arrow-back" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="510" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="20" width="160" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="110" y="45" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <rect x="310" y="20" width="160" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="45" font-size="14" font-weight="700" fill="#263e5a">node:http server</text>
    <rect x="590" y="20" width="160" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="670" y="45" font-size="14" font-weight="700" fill="#66400f">your listener</text>

    <g stroke="#b9c2cc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 60V470M390 60V470M670 60V470"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 96H388" marker-end="url(#hrl-arrow)"/>
      <path d="M110 140H388" marker-end="url(#hrl-arrow)"/>
      <path d="M390 184H668" marker-end="url(#hrl-arrow)"/>
      <path d="M110 228H388" marker-end="url(#hrl-arrow)"/>
      <path d="M390 228H668" marker-end="url(#hrl-arrow)"/>
      <path d="M670 330H392" marker-end="url(#hrl-arrow)"/>
      <path d="M670 374H392" marker-end="url(#hrl-arrow)"/>
    </g>
    <path d="M390 418H112" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hrl-arrow-back)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="250" y="88">1. TCP connect (or reuse keep-alive)</text>
      <text x="250" y="132">2. POST /tasks + headers</text>
      <text x="530" y="176">3. "request" event (request, response)</text>
      <text x="250" y="220">4. body chunks</text>
      <text x="530" y="220">for await (const chunk of request)</text>
      <text x="530" y="322">6. response.writeHead(201, headers)</text>
      <text x="530" y="366">7. response.end(body)</text>
      <text x="250" y="410">8. HTTP/1.1 201 Created + body</text>
    </g>

    <rect x="560" y="250" width="200" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="660" y="270" font-size="12" font-weight="700" fill="#66400f">5. readJsonBody()</text>
    <text x="660" y="288" font-size="11.5" fill="#66400f">size limit, then JSON.parse</text>

    <rect x="24" y="440" width="190" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="119" y="459" font-size="12" font-weight="700" fill="#294a2e">9. connection stays open</text>
    <text x="119" y="476" font-size="11.5" fill="#294a2e">until keepAliveTimeout (5 s)</text>

    <text x="390" y="498" font-size="13" fill="#40566b">The request is a readable stream and the response a writable one; every request must end().</text>
  </g>
</svg>
