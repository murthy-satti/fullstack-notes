<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="sbp-title sbp-desc">
  <title id="sbp-title">How backpressure slows a fast stream down</title>
  <desc id="sbp-desc">Chunks flow from a readable file stream through a gzip transform into a writable response going to a slow client. Each write call adds a chunk to the writable's internal buffer. While the buffer is below highWaterMark, write returns true and the producer keeps writing. When the buffer reaches highWaterMark, write returns false and the producer pauses; the destination drains the buffer, the writable emits drain, and the producer resumes writing. pipe and pipeline do this automatically.</desc>
  <defs>
    <marker id="sbp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="190" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="119" y="45" font-size="14" font-weight="700" fill="#263e5a">Readable</text>
    <text x="119" y="63" font-size="11.5" fill="#263e5a">fs.createReadStream()</text>
    <rect x="295" y="24" width="190" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="45" font-size="14" font-weight="700" fill="#463365">Transform</text>
    <text x="390" y="63" font-size="11.5" fill="#463365">zlib.createGzip()</text>
    <rect x="566" y="24" width="190" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="661" y="45" font-size="14" font-weight="700" fill="#66400f">Writable</text>
    <text x="661" y="63" font-size="11.5" fill="#66400f">response to a slow client</text>

    <text x="661" y="100" font-size="11.5" fill="#40566b">internal buffer</text>
    <rect x="586" y="108" width="150" height="22" rx="4" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="587" y="109" width="122" height="20" rx="3" fill="#f4c27a"/>
    <path d="M691 102V136" stroke="#b5473a" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="691" y="150" font-size="11" font-weight="700" fill="#6b241c">highWaterMark</text>

    <rect x="230" y="176" width="320" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="195" font-size="14" font-weight="700" fill="#263e5a">producer calls write(chunk)</text>
    <text x="390" y="212" font-size="11.5" fill="#263e5a">chunk goes into the buffer</text>

    <path d="M390 240 500 272 390 304 280 272z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="269" font-size="12" font-weight="700" fill="#36424e">buffer at or above</text>
    <text x="390" y="283" font-size="12" font-weight="700" fill="#36424e">highWaterMark?</text>

    <rect x="24" y="250" width="180" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="114" y="269" font-size="14" font-weight="700" fill="#294a2e">returns true</text>
    <text x="114" y="286" font-size="11.5" fill="#294a2e">keep writing</text>

    <rect x="280" y="326" width="220" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="390" y="345" font-size="14" font-weight="700" fill="#6b241c">returns false</text>
    <text x="390" y="362" font-size="11.5" fill="#6b241c">producer pauses</text>

    <rect x="280" y="392" width="220" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="411" font-size="14" font-weight="700" fill="#36424e">client reads data</text>
    <text x="390" y="428" font-size="11.5" fill="#36424e">buffer drains</text>

    <rect x="566" y="392" width="190" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="661" y="411" font-size="14" font-weight="700" fill="#463365">"drain" event</text>
    <text x="661" y="428" font-size="11.5" fill="#463365">producer resumes</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M214 50H293" marker-end="url(#sbp-arrow)"/>
      <path d="M485 50H564" marker-end="url(#sbp-arrow)"/>
      <path d="M390 220V238" marker-end="url(#sbp-arrow)"/>
      <path d="M280 272H206" marker-end="url(#sbp-arrow)"/>
      <path d="M114 250V198H228" marker-end="url(#sbp-arrow)"/>
      <path d="M390 304V324" marker-end="url(#sbp-arrow)"/>
      <path d="M390 370V390" marker-end="url(#sbp-arrow)"/>
      <path d="M500 414H564" marker-end="url(#sbp-arrow)"/>
      <path d="M661 392V198H552" marker-end="url(#sbp-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="253" y="43">chunks</text>
      <text x="524" y="43">chunks</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="243" y="264">no</text>
      <text x="402" y="318" text-anchor="start">yes</text>
    </g>
    <text x="390" y="464" font-size="13" fill="#40566b">pipe() and pipeline() run this loop for you; manage it yourself only when calling write().</text>
  </g>
</svg>
