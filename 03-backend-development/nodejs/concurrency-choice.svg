<svg xmlns="http://www.w3.org/2000/svg" width="780" height="574" viewBox="0 0 780 574" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">Choosing between worker threads, child processes, cluster, and more instances</title>
  <desc id="cc-desc">If you need to run an external program, use a child process with spawn or execFile. If not, and the problem is CPU-heavy JavaScript: when the client must wait for the result, use a worker thread pool; otherwise use a background job queue. If the problem is HTTP throughput rather than CPU work: on one machine use cluster or PM2 cluster mode; across machines, run more instances behind a load balancer.</desc>
  <defs>
    <marker id="cc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="574" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="130" y="20" width="260" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="45" font-size="14" font-weight="700" fill="#36424e">What do you need?</text>

    <path d="M260 80 370 112 260 144 150 112z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="109" font-size="12" font-weight="700" fill="#36424e">run an external</text>
    <text x="260" y="123" font-size="12" font-weight="700" fill="#36424e">program?</text>
    <rect x="470" y="88" width="286" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="613" y="108" font-size="14" font-weight="700" fill="#66400f">Child process</text>
    <text x="613" y="125" font-size="11.5" fill="#66400f">spawn / execFile with an args array</text>

    <path d="M260 170 370 202 260 234 150 202z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="199" font-size="12" font-weight="700" fill="#36424e">CPU-heavy</text>
    <text x="260" y="213" font-size="12" font-weight="700" fill="#36424e">JavaScript?</text>

    <path d="M560 170 670 202 560 234 450 202z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="560" y="199" font-size="12" font-weight="700" fill="#36424e">client must wait</text>
    <text x="560" y="213" font-size="12" font-weight="700" fill="#36424e">for the result?</text>
    <rect x="420" y="270" width="160" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="500" y="293" font-size="14" font-weight="700" fill="#463365">Worker threads</text>
    <text x="500" y="311" font-size="11.5" fill="#463365">in a pool (Piscina)</text>
    <rect x="596" y="270" width="160" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="676" y="293" font-size="14" font-weight="700" fill="#294a2e">Job queue</text>
    <text x="676" y="311" font-size="11.5" fill="#294a2e">background workers</text>

    <path d="M260 282 370 314 260 346 150 314z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="311" font-size="12" font-weight="700" fill="#36424e">more HTTP</text>
    <text x="260" y="325" font-size="12" font-weight="700" fill="#36424e">throughput?</text>

    <path d="M260 394 370 426 260 458 150 426z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="423" font-size="12" font-weight="700" fill="#36424e">one machine</text>
    <text x="260" y="437" font-size="12" font-weight="700" fill="#36424e">or many?</text>
    <rect x="24" y="482" width="220" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="134" y="502" font-size="14" font-weight="700" fill="#263e5a">Cluster / PM2 -i max</text>
    <text x="134" y="519" font-size="11.5" fill="#263e5a">one process per CPU core</text>
    <rect x="420" y="402" width="336" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="588" y="422" font-size="14" font-weight="700" fill="#263e5a">More instances + load balancer</text>
    <text x="588" y="439" font-size="11.5" fill="#263e5a">containers; survives a machine failing</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 60V78" marker-end="url(#cc-arrow)"/>
      <path d="M370 112H468" marker-end="url(#cc-arrow)"/>
      <path d="M260 144V168" marker-end="url(#cc-arrow)"/>
      <path d="M370 202H448" marker-end="url(#cc-arrow)"/>
      <path d="M560 234V250H500V268" marker-end="url(#cc-arrow)"/>
      <path d="M670 202H676V268" marker-end="url(#cc-arrow)"/>
      <path d="M260 234V280" marker-end="url(#cc-arrow)"/>
      <path d="M260 346V392" marker-end="url(#cc-arrow)"/>
      <path d="M150 426H134V480" marker-end="url(#cc-arrow)"/>
      <path d="M370 426H418" marker-end="url(#cc-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="418" y="104">yes</text>
      <text x="272" y="160" text-anchor="start">no</text>
      <text x="408" y="194">yes</text>
      <text x="548" y="248" text-anchor="end">yes</text>
      <text x="684" y="240" text-anchor="start">no</text>
      <text x="272" y="262" text-anchor="start">no</text>
      <text x="272" y="378" text-anchor="start">yes</text>
      <text x="120" y="420" text-anchor="end">one</text>
      <text x="394" y="418">many</text>
    </g>
    <text x="390" y="560" font-size="13" fill="#40566b">Workers fix CPU work inside a request; more processes or instances add capacity.</text>
  </g>
</svg>
