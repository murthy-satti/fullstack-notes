<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-labelledby="rvs-title rvs-desc">
  <title id="rvs-title">Sending a large file: read it whole versus stream it in chunks</title>
  <desc id="rvs-desc">With fs.readFile followed by response.end, the whole file is read into memory before the first byte is sent, so memory use equals the file size. With fs.createReadStream piped to the response, small chunks are read and sent in turn, the first byte goes out almost immediately, and memory stays at a few chunks of about 64 KB each.</desc>
  <rect width="780" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g text-anchor="start">
      <text x="24" y="58" font-size="13" font-weight="700" fill="#36424e">fs.readFile</text>
      <text x="24" y="75" font-size="11.5" fill="#36424e">then response.end()</text>
      <text x="24" y="184" font-size="13" font-weight="700" fill="#36424e">createReadStream</text>
      <text x="24" y="201" font-size="11.5" fill="#36424e">pipeline(..., response)</text>
    </g>

    <rect x="180" y="46" width="380" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="370" y="68" font-size="12" font-weight="700" fill="#66400f">read the ENTIRE file into memory</text>
    <rect x="560" y="46" width="190" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="655" y="68" font-size="12" font-weight="700" fill="#263e5a">send it</text>
    <path d="M560 38V90" stroke="#b5473a" stroke-width="2.5"/>
    <text x="566" y="104" font-size="11.5" font-weight="700" fill="#6b241c" text-anchor="start">first byte sent</text>
    <rect x="180" y="114" width="300" height="22" rx="4" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="330" y="130" font-size="11.5" font-weight="700" fill="#6b241c">memory = file size (1 GB file = 1 GB)</text>

    <g stroke-width="1.5" font-size="11" font-weight="700">
      <rect x="180" y="172" width="45" height="34" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="225" y="172" width="45" height="34" rx="5" fill="#e5efff" stroke="#4774aa"/>
      <rect x="270" y="172" width="45" height="34" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="315" y="172" width="45" height="34" rx="5" fill="#e5efff" stroke="#4774aa"/>
      <rect x="360" y="172" width="45" height="34" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="405" y="172" width="45" height="34" rx="5" fill="#e5efff" stroke="#4774aa"/>
      <rect x="450" y="172" width="45" height="34" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="495" y="172" width="45" height="34" rx="5" fill="#e5efff" stroke="#4774aa"/>
      <rect x="540" y="172" width="45" height="34" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="585" y="172" width="45" height="34" rx="5" fill="#e5efff" stroke="#4774aa"/>
      <rect x="630" y="172" width="45" height="34" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="675" y="172" width="45" height="34" rx="5" fill="#e5efff" stroke="#4774aa"/>
      <text x="202" y="193" fill="#66400f">read</text>
      <text x="247" y="193" fill="#263e5a">send</text>
      <text x="292" y="193" fill="#66400f">read</text>
      <text x="337" y="193" fill="#263e5a">send</text>
      <text x="382" y="193" fill="#66400f">read</text>
      <text x="427" y="193" fill="#263e5a">send</text>
      <text x="472" y="193" fill="#66400f">read</text>
      <text x="517" y="193" fill="#263e5a">send</text>
      <text x="562" y="193" fill="#66400f">read</text>
      <text x="607" y="193" fill="#263e5a">send</text>
      <text x="652" y="193" fill="#66400f">read</text>
      <text x="697" y="193" fill="#263e5a">send</text>
    </g>
    <path d="M225 164V216" stroke="#53845b" stroke-width="2.5"/>
    <text x="231" y="230" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">first byte sent almost at once</text>
    <rect x="180" y="240" width="96" height="22" rx="4" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="284" y="256" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">memory = a few chunks (about 64 KB each)</text>

    <path d="M180 284H750" stroke="#40566b" stroke-width="1.5"/>
    <text x="750" y="300" font-size="11.5" fill="#40566b" text-anchor="end">time →</text>
    <text x="390" y="318" font-size="13" fill="#40566b">Streams keep memory flat and start the response immediately, whatever the file size.</text>
  </g>
</svg>
