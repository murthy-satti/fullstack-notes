<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="awr-title awr-desc">
  <title id="awr-title">Where Node.js sends asynchronous work</title>
  <desc id="awr-desc">The main thread starts an operation and returns immediately. Socket and HTTP work goes to the operating system's async I/O mechanism, timers are tracked by the event loop, and file system calls, dns.lookup, crypto.pbkdf2 and zlib run on the libuv thread pool of four threads, where extra jobs wait in a queue. When any of them finishes, the event loop queues the callback, which runs on the main thread when its call stack is empty.</desc>
  <defs>
    <marker id="awr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="awr-arrow-back" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="170" width="180" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="114" y="195" font-size="14" font-weight="700" fill="#66400f">Main thread</text>
    <text x="114" y="213" font-size="11.5" fill="#66400f">starts it, returns at once</text>

    <rect x="350" y="46" width="210" height="54" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="455" y="68" font-size="14" font-weight="700" fill="#36424e">OS async I/O</text>
    <text x="455" y="86" font-size="11.5" fill="#36424e">epoll / kqueue / IOCP</text>

    <rect x="350" y="173" width="210" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="455" y="195" font-size="14" font-weight="700" fill="#263e5a">Event loop timers</text>
    <text x="455" y="213" font-size="11.5" fill="#263e5a">no thread needed</text>

    <rect x="350" y="280" width="210" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="455" y="300" font-size="14" font-weight="700" fill="#463365">libuv thread pool</text>
    <g font-size="11" font-weight="700" fill="#463365">
      <rect x="373" y="310" width="34" height="20" rx="4" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
      <text x="390" y="324">T1</text>
      <rect x="415" y="310" width="34" height="20" rx="4" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
      <text x="432" y="324">T2</text>
      <rect x="457" y="310" width="34" height="20" rx="4" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
      <text x="474" y="324">T3</text>
      <rect x="499" y="310" width="34" height="20" rx="4" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
      <text x="516" y="324">T4</text>
    </g>
    <text x="455" y="349" font-size="11.5" fill="#463365">extra jobs wait in a queue</text>

    <rect x="610" y="170" width="146" height="60" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="683" y="195" font-size="14" font-weight="700" fill="#294a2e">Event loop</text>
    <text x="683" y="213" font-size="11.5" fill="#294a2e">queues the callback</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M204 190H230V73H348" marker-end="url(#awr-arrow)"/>
      <path d="M204 200H348" marker-end="url(#awr-arrow)"/>
      <path d="M204 210H230V320H348" marker-end="url(#awr-arrow)"/>
      <path d="M560 73H585V190H608" marker-end="url(#awr-arrow)"/>
      <path d="M560 200H608" marker-end="url(#awr-arrow)"/>
      <path d="M560 320H585V210H608" marker-end="url(#awr-arrow)"/>
    </g>
    <path d="M683 230V384H114V232" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#awr-arrow-back)"/>

    <g font-size="12" fill="#40566b" text-anchor="start">
      <text x="240" y="66">sockets, HTTP</text>
      <text x="240" y="193">setTimeout</text>
      <text x="240" y="297">fs, dns.lookup,</text>
      <text x="240" y="312">crypto, zlib</text>
    </g>
    <text x="398" y="377" font-size="12" font-weight="700" fill="#40566b">callback runs on the main thread when its call stack is empty</text>
    <text x="390" y="414" font-size="13" fill="#40566b">File, dns.lookup, crypto and zlib work use the thread pool; network I/O does not.</text>
  </g>
</svg>
