<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="mtd-title mtd-desc">
  <title id="mtd-title">How Node.js decides whether a file is CommonJS or an ES module</title>
  <desc id="mtd-desc">Node.js first looks at the file extension: .mjs is always an ES module and .cjs is always CommonJS. For a .js file it finds the nearest package.json and reads its type field: "module" means ES module, "commonjs" means CommonJS, and a missing type field means CommonJS, although recent Node.js versions can detect ES module syntax in that case.</desc>
  <defs>
    <marker id="mtd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="270" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="45" font-size="14" font-weight="700" fill="#36424e">node loads a file</text>

    <path d="M390 80 490 112 390 144 290 112z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="116" font-size="12" font-weight="700" fill="#36424e">file extension?</text>

    <rect x="40" y="168" width="170" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="125" y="188" font-size="14" font-weight="700" fill="#294a2e">ES module</text>
    <text x="125" y="205" font-size="11.5" fill="#294a2e">import / export</text>

    <rect x="570" y="168" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="655" y="188" font-size="14" font-weight="700" fill="#263e5a">CommonJS</text>
    <text x="655" y="205" font-size="11.5" fill="#263e5a">require / module.exports</text>

    <rect x="270" y="176" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="196" font-size="14" font-weight="700" fill="#66400f">Find nearest package.json</text>
    <text x="390" y="213" font-size="11.5" fill="#66400f">walk up from the file's folder</text>

    <path d="M390 246 490 278 390 310 290 278z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="275" font-size="12" font-weight="700" fill="#36424e">its "type"</text>
    <text x="390" y="289" font-size="12" font-weight="700" fill="#36424e">field?</text>

    <rect x="40" y="320" width="170" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="125" y="340" font-size="14" font-weight="700" fill="#294a2e">ES module</text>
    <text x="125" y="357" font-size="11.5" fill="#294a2e">.js parsed as ESM</text>

    <rect x="570" y="320" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="655" y="340" font-size="14" font-weight="700" fill="#263e5a">CommonJS</text>
    <text x="655" y="357" font-size="11.5" fill="#263e5a">.js parsed as CommonJS</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 60V78" marker-end="url(#mtd-arrow)"/>
      <path d="M290 112H125V166" marker-end="url(#mtd-arrow)"/>
      <path d="M490 112H655V166" marker-end="url(#mtd-arrow)"/>
      <path d="M390 144V174" marker-end="url(#mtd-arrow)"/>
      <path d="M390 224V244" marker-end="url(#mtd-arrow)"/>
      <path d="M290 278H125V318" marker-end="url(#mtd-arrow)"/>
      <path d="M490 278H655V318" marker-end="url(#mtd-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="208" y="104">.mjs</text>
      <text x="572" y="104">.cjs</text>
      <text x="402" y="162" text-anchor="start">.js</text>
      <text x="208" y="270">"module"</text>
      <text x="572" y="264">"commonjs"</text>
      <text x="572" y="296">or missing</text>
    </g>
    <text x="390" y="402" font-size="13" fill="#40566b">Set "type" explicitly: recent Node.js can detect ESM syntax without it, but it is clearer.</text>
  </g>
</svg>
