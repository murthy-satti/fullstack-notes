<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" role="img" aria-labelledby="fsa-title fsa-desc">
  <title id="fsa-title">readFileSync blocks the main thread; async fs calls do not</title>
  <desc id="fsa-desc">With fs.readFileSync inside a request handler, the main thread is blocked while the disk responds, so request B waits until the read finishes. With the promise or callback API, the main thread only starts the read, which runs on a libuv thread-pool thread; the main thread serves request B meanwhile, and the await or callback for request A resumes when the read completes.</desc>
  <rect width="780" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="40" font-size="14" font-weight="700" fill="#6b241c" text-anchor="start">readFileSync(path) in a handler</text>
    <text x="24" y="196" font-size="14" font-weight="700" fill="#294a2e" text-anchor="start">await fs.readFile(path) or fs.readFile(path, callback)</text>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="78">main thread</text>
      <text x="24" y="122">request B</text>
      <text x="24" y="234">main thread</text>
      <text x="24" y="276">thread pool</text>
      <text x="24" y="318">request B</text>
    </g>

    <rect x="150" y="60" width="70" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="185" y="79" font-size="11.5" fill="#66400f">handler A</text>
    <rect x="220" y="60" width="380" height="28" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="410" y="79" font-size="12" font-weight="700" fill="#6b241c">BLOCKED: waiting for the disk</text>
    <rect x="600" y="60" width="70" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="635" y="79" font-size="11.5" fill="#66400f">reply A</text>
    <rect x="670" y="60" width="80" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="710" y="79" font-size="11.5" fill="#263e5a">handle B</text>

    <rect x="260" y="106" width="410" height="26" rx="6" fill="#ffffff" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="465" y="124" font-size="11.5" fill="#6b241c">B arrived here, but must wait</text>

    <line x1="24" y1="160" x2="756" y2="160" stroke="#d5dce6" stroke-width="1.5"/>

    <rect x="150" y="216" width="70" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="185" y="235" font-size="11.5" fill="#66400f">handler A</text>
    <rect x="260" y="216" width="80" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="300" y="235" font-size="11.5" fill="#263e5a">handle B</text>
    <rect x="600" y="216" width="70" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="635" y="235" font-size="11.5" fill="#66400f">reply A</text>
    <text x="470" y="235" font-size="11.5" font-style="italic" fill="#294a2e">free for other work</text>

    <rect x="220" y="258" width="380" height="28" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="410" y="277" font-size="12" font-weight="700" fill="#463365">pool thread reads the file</text>

    <rect x="260" y="302" width="80" height="26" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="300" y="320" font-size="11.5" fill="#294a2e">served</text>

    <g fill="none" stroke="#40566b" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M220 244V258"/>
      <path d="M600 258V244"/>
    </g>
    <text x="390" y="354" font-size="13" fill="#40566b">Same file, same disk time: only the async version lets the server keep answering.</text>
  </g>
</svg>
