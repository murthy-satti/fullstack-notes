<svg xmlns="http://www.w3.org/2000/svg" width="800" height="478" viewBox="0 0 800 478" role="img" aria-labelledby="nla-title nla-desc">
  <title id="nla-title">The four tools of the Node Internals Lab and the runtime part each one exercises</title>
  <desc id="nla-desc">Streams: generate-log.js writes data/app.log of about 1.5 GB using write() and drain; log-analyzer.js reads it with readline into Map counters and prints a report with a peak of about 64 MB; extract-errors.js pipes it through a Transform and gzip into errors.log.gz with only 5xx lines. Event loop: curl requests to /fast, /block, and /chunked hit lag-monitor.js, a single main thread, while monitorEventLoopDelay records a histogram and prints p50, p99, and max every second. Worker threads: hash-files.js keeps a queue of file paths and sends them to worker 1 through worker N, which reply with digests. Signals: SIGTERM or Ctrl+C makes graceful-server.js answer 503 on /readyz, keep serving for a 2-second drain, call server.close() to wait for in-flight requests, and exit with code 0.</desc>
  <defs>
    <marker id="nla-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="478" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="28">Streams (milestones 2–4)</text>
      <text x="24" y="164">Event loop (milestones 5–6)</text>
      <text x="24" y="258">Worker threads (milestone 7)</text>
      <text x="24" y="390">Signals (milestone 8)</text>
    </g>
    <g stroke="#c9d1db" stroke-width="1.5">
      <path d="M24 140H776"/>
      <path d="M24 236H776"/>
      <path d="M24 368H776"/>
    </g>

    <rect x="24" y="62" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="79" font-size="12.5" font-weight="700" fill="#66400f">generate-log.js</text>
    <text x="94" y="94" font-size="11" fill="#66400f">write() + drain</text>
    <rect x="196" y="62" width="120" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="256" y="79" font-size="12.5" font-weight="700" fill="#36424e">data/app.log</text>
    <text x="256" y="94" font-size="11" fill="#36424e">about 1.5 GB</text>
    <rect x="358" y="38" width="210" height="38" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="463" y="54" font-size="12.5" font-weight="700" fill="#263e5a">log-analyzer.js</text>
    <text x="463" y="69" font-size="11" fill="#263e5a">readline, Map counters</text>
    <rect x="358" y="86" width="210" height="38" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="463" y="102" font-size="12.5" font-weight="700" fill="#263e5a">extract-errors.js</text>
    <text x="463" y="117" font-size="11" fill="#263e5a">Transform, then gzip</text>
    <rect x="608" y="38" width="168" height="38" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="692" y="54" font-size="12.5" font-weight="700" fill="#294a2e">report</text>
    <text x="692" y="69" font-size="11" fill="#294a2e">peak about 64 MB</text>
    <rect x="608" y="86" width="168" height="38" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="692" y="102" font-size="12.5" font-weight="700" fill="#294a2e">errors.log.gz</text>
    <text x="692" y="117" font-size="11" fill="#294a2e">5xx lines only</text>

    <rect x="24" y="174" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="94" y="192" font-size="12.5" font-weight="700" fill="#36424e">curl</text>
    <text x="94" y="208" font-size="11" fill="#36424e">/fast /block /chunked</text>
    <rect x="196" y="174" width="200" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="296" y="192" font-size="12.5" font-weight="700" fill="#66400f">lag-monitor.js</text>
    <text x="296" y="208" font-size="11" fill="#66400f">one main thread, one loop</text>
    <rect x="430" y="174" width="170" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="515" y="192" font-size="12" font-weight="700" fill="#463365">monitorEventLoopDelay</text>
    <text x="515" y="208" font-size="11" fill="#463365">histogram in nanoseconds</text>
    <rect x="632" y="174" width="144" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="704" y="192" font-size="12.5" font-weight="700" fill="#294a2e">p50 / p99 / max</text>
    <text x="704" y="208" font-size="11" fill="#294a2e">printed every second</text>

    <rect x="24" y="288" width="160" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="104" y="306" font-size="12.5" font-weight="700" fill="#66400f">hash-files.js</text>
    <text x="104" y="322" font-size="11" fill="#66400f">main thread: file queue</text>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <rect x="262" y="266" width="140" height="26" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="332" y="284">worker 1</text>
      <rect x="262" y="297" width="140" height="26" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="332" y="315">worker 2</text>
      <rect x="262" y="328" width="140" height="26" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="332" y="346">worker N (one per core)</text>
    </g>
    <rect x="470" y="288" width="306" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="623" y="306" font-size="12.5" font-weight="700" fill="#294a2e">digests + total time</text>
    <text x="623" y="322" font-size="11" fill="#294a2e">postMessage({ file, digest })</text>

    <rect x="24" y="402" width="134" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="91" y="420" font-size="12.5" font-weight="700" fill="#6b241c">SIGTERM</text>
    <text x="91" y="436" font-size="11" fill="#6b241c">or Ctrl+C (SIGINT)</text>
    <rect x="186" y="402" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="256" y="420" font-size="12.5" font-weight="700" fill="#463365">/readyz: 503</text>
    <text x="256" y="436" font-size="11" fill="#463365">still serving</text>
    <rect x="354" y="402" width="124" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="416" y="420" font-size="12.5" font-weight="700" fill="#36424e">drain 2 s</text>
    <text x="416" y="436" font-size="11" fill="#36424e">LB stops routing</text>
    <rect x="506" y="402" width="146" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="579" y="420" font-size="12.5" font-weight="700" fill="#263e5a">server.close()</text>
    <text x="579" y="436" font-size="11" fill="#263e5a">waits for in-flight</text>
    <rect x="680" y="402" width="96" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="728" y="429" font-size="12.5" font-weight="700" fill="#294a2e">exit 0</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M164 82H194" marker-end="url(#nla-arrow)"/>
      <path d="M316 82H336V57H356" marker-end="url(#nla-arrow)"/>
      <path d="M336 82V105H356" marker-end="url(#nla-arrow)"/>
      <path d="M568 57H606" marker-end="url(#nla-arrow)"/>
      <path d="M568 105H606" marker-end="url(#nla-arrow)"/>
      <path d="M164 196H194" marker-end="url(#nla-arrow)"/>
      <path d="M396 196H428" marker-end="url(#nla-arrow)"/>
      <path d="M600 196H630" marker-end="url(#nla-arrow)"/>
      <path d="M184 302 260 279" marker-end="url(#nla-arrow)"/>
      <path d="M184 310H260" marker-end="url(#nla-arrow)"/>
      <path d="M184 318 260 341" marker-end="url(#nla-arrow)"/>
      <path d="M402 279 468 302" marker-end="url(#nla-arrow)"/>
      <path d="M402 310H468" marker-end="url(#nla-arrow)"/>
      <path d="M402 341 468 318" marker-end="url(#nla-arrow)"/>
      <path d="M158 424H184" marker-end="url(#nla-arrow)"/>
      <path d="M326 424H352" marker-end="url(#nla-arrow)"/>
      <path d="M478 424H504" marker-end="url(#nla-arrow)"/>
      <path d="M652 424H678" marker-end="url(#nla-arrow)"/>
    </g>
    <text x="400" y="468" font-size="12.5" fill="#40566b">Each tool makes one part of the runtime measurable: streams, the event loop, workers, signals.</text>
  </g>
</svg>
