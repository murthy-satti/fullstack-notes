<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580" role="img" aria-labelledby="ep-title ep-desc">
  <title id="ep-title">What happens to a thrown error or rejected promise in Node.js</title>
  <desc id="ep-desc">A throw in synchronous code is handled if a try/catch up the call stack catches it; otherwise it becomes an uncaughtException. A rejected promise is handled by .catch or by await inside try/catch; otherwise it becomes an unhandledRejection, which by default is raised as an uncaught exception. Handled errors get a 4xx or 5xx response, a retry or a fallback. Unhandled ones should be logged and reported, then the process exits with code 1 and a process manager such as PM2, systemd, Docker or Kubernetes starts a fresh process with clean state.</desc>
  <defs>
    <marker id="ep-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="580" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="20" width="260" height="40" rx="20" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="45" font-size="14" font-weight="700" fill="#66400f">throw in synchronous code</text>
    <rect x="450" y="20" width="260" height="40" rx="20" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="580" y="45" font-size="14" font-weight="700" fill="#66400f">a promise rejects</text>

    <path d="M200 86 320 118 200 150 80 118z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="115" font-size="12" font-weight="700" fill="#36424e">try/catch up the</text>
    <text x="200" y="129" font-size="12" font-weight="700" fill="#36424e">call stack?</text>
    <path d="M580 86 700 118 580 150 460 118z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="115" font-size="12" font-weight="700" fill="#36424e">.catch() or await</text>
    <text x="580" y="129" font-size="12" font-weight="700" fill="#36424e">inside try/catch?</text>

    <rect x="70" y="180" width="260" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="200" y="200" font-size="13" font-weight="700" fill="#294a2e">handled where it happened</text>
    <text x="200" y="217" font-size="11.5" fill="#294a2e">respond 4xx/5xx, retry, or fall back</text>
    <rect x="450" y="180" width="260" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="200" font-size="13" font-weight="700" fill="#294a2e">handled where it happened</text>
    <text x="580" y="217" font-size="11.5" fill="#294a2e">respond 4xx/5xx, retry, or fall back</text>

    <rect x="70" y="268" width="260" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="200" y="288" font-size="13" font-weight="700" fill="#6b241c">process "uncaughtException"</text>
    <text x="200" y="305" font-size="11.5" fill="#6b241c">default: print stack, exit code 1</text>
    <rect x="450" y="268" width="260" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="288" font-size="13" font-weight="700" fill="#6b241c">process "unhandledRejection"</text>
    <text x="580" y="305" font-size="11.5" fill="#6b241c">default: raised as uncaught</text>

    <rect x="230" y="348" width="320" height="52" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="390" y="369" font-size="13" font-weight="700" fill="#6b241c">log + report, then process.exit(1)</text>
    <text x="390" y="387" font-size="11.5" fill="#6b241c">state may be corrupt: do not keep serving</text>

    <rect x="230" y="428" width="320" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="448" font-size="13" font-weight="700" fill="#36424e">process manager restarts it</text>
    <text x="390" y="465" font-size="11.5" fill="#36424e">PM2, systemd, Docker, Kubernetes</text>

    <rect x="270" y="500" width="240" height="38" rx="19" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="524" font-size="13" font-weight="700" fill="#294a2e">fresh process, clean state</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 60V84" marker-end="url(#ep-arrow)"/>
      <path d="M580 60V84" marker-end="url(#ep-arrow)"/>
      <path d="M200 150V178" marker-end="url(#ep-arrow)"/>
      <path d="M580 150V178" marker-end="url(#ep-arrow)"/>
      <path d="M80 118H44V292H68" marker-end="url(#ep-arrow)"/>
      <path d="M700 118H736V292H712" marker-end="url(#ep-arrow)"/>
      <path d="M200 316V374H228" marker-end="url(#ep-arrow)"/>
      <path d="M580 316V374H552" marker-end="url(#ep-arrow)"/>
      <path d="M390 400V426" marker-end="url(#ep-arrow)"/>
      <path d="M390 476V498" marker-end="url(#ep-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="212" y="170" text-anchor="start">yes</text>
      <text x="592" y="170" text-anchor="start">yes</text>
      <text x="56" y="110">no</text>
      <text x="724" y="110">no</text>
    </g>
    <text x="390" y="564" font-size="13" fill="#40566b">Handle expected errors in place; treat anything that escapes as a bug and restart.</text>
  </g>
</svg>
