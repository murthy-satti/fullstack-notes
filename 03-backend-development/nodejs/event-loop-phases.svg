<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" role="img" aria-labelledby="elp-title elp-desc">
  <title id="elp-title">How the Node.js event loop runs callbacks</title>
  <desc id="elp-desc">Node.js runs the main module, drains microtasks, then loops through the timers, pending callbacks, idle and prepare, poll, check, and close callbacks phases. After every callback the process.nextTick queue and then the Promise microtask queue are drained. After the close phase, the loop continues if timers, I/O, or handles are pending; otherwise the process exits.</desc>
  <defs>
    <marker id="elp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="540" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="110" y="56" font-size="13" font-weight="700" fill="#40566b">Startup</text>
    <text x="360" y="56" font-size="13" font-weight="700" fill="#40566b">Event loop: one iteration</text>

    <rect x="24" y="70" width="172" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="110" y="89" font-size="14" font-weight="700" fill="#36424e">Run main module</text>
    <text x="110" y="105" font-size="11.5" fill="#36424e">top-level code, once</text>
    <rect x="24" y="132" width="172" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="110" y="151" font-size="14" font-weight="700" fill="#36424e">Drain microtasks</text>
    <text x="110" y="167" font-size="11.5" fill="#36424e">nextTick, then promises</text>

    <rect x="250" y="70" width="220" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="360" y="89" font-size="14" font-weight="700" fill="#263e5a">timers</text>
    <text x="360" y="105" font-size="11.5" fill="#263e5a">due setTimeout / setInterval</text>
    <rect x="250" y="132" width="220" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="360" y="151" font-size="14" font-weight="700" fill="#36424e">pending callbacks</text>
    <text x="360" y="167" font-size="11.5" fill="#36424e">deferred system callbacks</text>
    <rect x="250" y="194" width="220" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="360" y="213" font-size="14" font-weight="700" fill="#36424e">idle, prepare</text>
    <text x="360" y="229" font-size="11.5" fill="#36424e">internal to Node.js</text>
    <rect x="250" y="256" width="220" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="360" y="275" font-size="14" font-weight="700" fill="#66400f">poll</text>
    <text x="360" y="291" font-size="11.5" fill="#66400f">I/O callbacks (waits when idle)</text>
    <rect x="250" y="318" width="220" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="360" y="337" font-size="14" font-weight="700" fill="#294a2e">check</text>
    <text x="360" y="353" font-size="11.5" fill="#294a2e">setImmediate callbacks</text>
    <rect x="250" y="380" width="220" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="360" y="399" font-size="14" font-weight="700" fill="#36424e">close callbacks</text>
    <text x="360" y="415" font-size="11.5" fill="#36424e">"close" event handlers</text>

    <path d="M360 434 440 464 360 494 280 464z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="360" y="461" font-size="11.5" font-weight="700" fill="#36424e">timers, I/O or</text>
    <text x="360" y="475" font-size="11.5" font-weight="700" fill="#36424e">handles pending?</text>

    <rect x="524" y="444" width="150" height="40" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="599" y="469" font-size="14" font-weight="700" fill="#6b241c">Process exits</text>

    <rect x="520" y="70" width="236" height="230" rx="10" fill="#faf7fe" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="638" y="92" font-size="13" font-weight="700" fill="#463365">Microtask queues</text>
    <text x="638" y="108" font-size="11.5" fill="#463365">drained after every callback</text>
    <rect x="540" y="122" width="196" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="638" y="141" font-size="14" font-weight="700" fill="#463365">1. process.nextTick</text>
    <text x="638" y="157" font-size="11.5" fill="#463365">whole queue drained</text>
    <rect x="540" y="186" width="196" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="638" y="205" font-size="14" font-weight="700" fill="#463365">2. Promise microtasks</text>
    <text x="638" y="221" font-size="11.5" fill="#463365">.then, await, queueMicrotask</text>
    <text x="638" y="256" font-size="11.5" fill="#463365">repeats until both queues</text>
    <text x="638" y="272" font-size="11.5" fill="#463365">are empty, then moves on</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 114V130" marker-end="url(#elp-arrow)"/>
      <path d="M360 114V130" marker-end="url(#elp-arrow)"/>
      <path d="M360 176V192" marker-end="url(#elp-arrow)"/>
      <path d="M360 238V254" marker-end="url(#elp-arrow)"/>
      <path d="M360 300V316" marker-end="url(#elp-arrow)"/>
      <path d="M360 362V378" marker-end="url(#elp-arrow)"/>
      <path d="M360 424V432" marker-end="url(#elp-arrow)"/>
      <path d="M638 166V184" marker-end="url(#elp-arrow)"/>
      <path d="M196 154H225"/>
      <path d="M280 464H225V92H248" marker-end="url(#elp-arrow)"/>
      <path d="M440 464H522" marker-end="url(#elp-arrow)"/>
      <path d="M736 208H748V144H738" marker-end="url(#elp-arrow)"/>
    </g>
    <circle cx="225" cy="154" r="3.5" fill="#40566b"/>

    <g fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M470 92H492M470 154H492M470 216H492M470 278H492M470 340H492M470 402H492M492 92V402"/>
    </g>
    <path d="M492 200H518" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="252" y="456" font-size="12" font-weight="700" fill="#40566b">yes</text>
    <text x="480" y="456" font-size="12" font-weight="700" fill="#40566b">no</text>
    <text x="390" y="522" font-size="13" fill="#40566b">Each iteration visits the phases in order; microtasks run between every callback.</text>
  </g>
</svg>
