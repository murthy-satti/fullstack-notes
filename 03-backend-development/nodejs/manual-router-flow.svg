<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640" role="img" aria-labelledby="mrt-title mrt-desc">
  <title id="mrt-title">How the framework-free JSON API routes a request</title>
  <desc id="mrt-desc">The listener builds a URL from request.url. GET /tasks returns 200 with all tasks. POST /tasks reads the JSON body; if title is not a non-empty string it returns 400, otherwise it returns 201 Created with a Location header. GET /tasks/ followed by an id returns 200 with the task if it exists, or 404 Task not found. Any other request returns 404 Route not found. Any thrown error is caught and answered with error.statusCode, or 500.</desc>
  <defs>
    <marker id="mrt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="20" width="200" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="170" y="45" font-size="14" font-weight="700" fill="#36424e">request arrives</text>
    <rect x="50" y="78" width="240" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="170" y="97" font-size="13" font-weight="700" fill="#263e5a">new URL(request.url, base)</text>
    <text x="170" y="114" font-size="11.5" fill="#263e5a">method + url.pathname</text>

    <path d="M170 132 270 160 170 188 70 160z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="170" y="164" font-size="12" font-weight="700" fill="#36424e">GET /tasks?</text>
    <path d="M170 232 270 260 170 288 70 260z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="170" y="264" font-size="12" font-weight="700" fill="#36424e">POST /tasks?</text>
    <path d="M170 372 270 400 170 428 70 400z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="170" y="397" font-size="12" font-weight="700" fill="#36424e">GET /tasks/:id?</text>
    <text x="170" y="411" font-size="11" fill="#36424e">(regex match)</text>

    <rect x="70" y="480" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="170" y="500" font-size="14" font-weight="700" fill="#6b241c">404 Not Found</text>
    <text x="170" y="517" font-size="11.5" fill="#6b241c">"Route not found"</text>

    <rect x="360" y="138" width="200" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="460" y="157" font-size="14" font-weight="700" fill="#294a2e">200 OK</text>
    <text x="460" y="174" font-size="11.5" fill="#294a2e">all tasks as JSON</text>

    <path d="M460 230 560 260 460 290 360 260z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="460" y="257" font-size="12" font-weight="700" fill="#36424e">readJsonBody: title</text>
    <text x="460" y="271" font-size="12" font-weight="700" fill="#36424e">non-empty string?</text>
    <rect x="360" y="316" width="200" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="460" y="335" font-size="14" font-weight="700" fill="#6b241c">400 Bad Request</text>
    <text x="460" y="352" font-size="11.5" fill="#6b241c">"title is required"</text>
    <rect x="596" y="236" width="164" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="678" y="256" font-size="14" font-weight="700" fill="#294a2e">201 Created</text>
    <text x="678" y="273" font-size="11.5" fill="#294a2e">Location: /tasks/2</text>

    <path d="M460 372 560 400 460 428 360 400z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="460" y="404" font-size="12" font-weight="700" fill="#36424e">task found?</text>
    <rect x="360" y="456" width="200" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="460" y="475" font-size="14" font-weight="700" fill="#6b241c">404 Not Found</text>
    <text x="460" y="492" font-size="11.5" fill="#6b241c">"Task not found"</text>
    <rect x="596" y="378" width="164" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="678" y="397" font-size="14" font-weight="700" fill="#294a2e">200 OK</text>
    <text x="678" y="414" font-size="11.5" fill="#294a2e">the task as JSON</text>

    <rect x="24" y="552" width="732" height="40" rx="8" fill="#ffffff" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="390" y="577" font-size="12" fill="#6b241c"><tspan font-weight="700">catch (error):</tspan> any throw above, such as 413 or invalid JSON, answers with error.statusCode ?? 500</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M170 60V76" marker-end="url(#mrt-arrow)"/>
      <path d="M170 122V130" marker-end="url(#mrt-arrow)"/>
      <path d="M270 160H358" marker-end="url(#mrt-arrow)"/>
      <path d="M170 188V230" marker-end="url(#mrt-arrow)"/>
      <path d="M270 260H358" marker-end="url(#mrt-arrow)"/>
      <path d="M560 260H594" marker-end="url(#mrt-arrow)"/>
      <path d="M460 290V314" marker-end="url(#mrt-arrow)"/>
      <path d="M170 288V370" marker-end="url(#mrt-arrow)"/>
      <path d="M270 400H358" marker-end="url(#mrt-arrow)"/>
      <path d="M560 400H594" marker-end="url(#mrt-arrow)"/>
      <path d="M460 428V454" marker-end="url(#mrt-arrow)"/>
      <path d="M170 428V478" marker-end="url(#mrt-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="312" y="152">yes</text>
      <text x="312" y="252">yes</text>
      <text x="312" y="392">yes</text>
      <text x="577" y="252">yes</text>
      <text x="577" y="392">yes</text>
      <text x="182" y="214" text-anchor="start">no</text>
      <text x="182" y="334" text-anchor="start">no</text>
      <text x="182" y="458" text-anchor="start">no</text>
      <text x="472" y="306" text-anchor="start">no</text>
      <text x="472" y="446" text-anchor="start">no</text>
    </g>
    <text x="390" y="620" font-size="13" fill="#40566b">Every branch must send exactly one response; a framework router replaces this if-chain.</text>
  </g>
</svg>
