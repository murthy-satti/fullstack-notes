<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="title description">
  <title id="title">A request moves through backend layers</title>
  <desc id="description">A client sends a request through middleware to an application route, which reads or updates a data service and returns a response to the client.</desc>
  <rect width="640" height="220" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="18" y="66" width="98" height="72" rx="9" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="67" y="96" font-size="16" font-weight="700" fill="#263e5a">Client</text>
    <text x="67" y="119" font-size="12" fill="#263e5a">browser / app</text>
    <rect x="151" y="66" width="108" height="72" rx="9" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="205" y="96" font-size="15" font-weight="700" fill="#294a2e">Middleware</text>
    <text x="205" y="119" font-size="12" fill="#294a2e">shared checks</text>
    <rect x="294" y="66" width="111" height="72" rx="9" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="349" y="96" font-size="15" font-weight="700" fill="#66400f">Route</text>
    <text x="349" y="119" font-size="12" fill="#66400f">app logic</text>
    <rect x="440" y="66" width="105" height="72" rx="9" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="492" y="96" font-size="15" font-weight="700" fill="#463365">Data</text>
    <text x="492" y="119" font-size="12" fill="#463365">storage / service</text>
    <path d="M117 88h28m-8-7 8 7-8 7M260 88h28m-8-7 8 7-8 7M406 88h28m-8-7 8 7-8 7" fill="none" stroke="#40566b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M439 119H126m8-7-8 7 8 7" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="181" font-size="13" fill="#40566b">A response returns after request processing completes.</text>
  </g>
</svg>
