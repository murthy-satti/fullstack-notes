<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="acu-title acu-desc">
  <title id="acu-title">An atomic conditional update removes the race</title>
  <desc id="acu-desc">Requests A and B both send a single statement, UPDATE products SET stock = stock - 1 WHERE stock >= 1, at nearly the same time. The database applies the two updates one at a time because the row is locked while it changes. A's update finds stock 1, matches, and leaves stock 0, so A gets one changed row and returns 201 Created. B's update then finds stock 0, the condition stock >= 1 is false, zero rows change, and B returns 409 Out of stock. Exactly one sale happens and stock never goes below zero.</desc>
  <defs>
    <marker id="acu-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="acu-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="22" width="120" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="150" y="44" font-size="13" font-weight="700" fill="#263e5a">Request A</text>
    <rect x="320" y="22" width="140" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="44" font-size="13" font-weight="700" fill="#463365">Database</text>
    <rect x="570" y="22" width="120" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="630" y="44" font-size="13" font-weight="700" fill="#66400f">Request B</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M150 56V330M390 56V330M630 56V330"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="230" y="84">SET stock = stock - 1</text>
      <text x="230" y="112">WHERE stock &gt;= 1</text>
      <text x="550" y="84">SET stock = stock - 1</text>
      <text x="550" y="112">WHERE stock &gt;= 1</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 94H312" marker-end="url(#acu-arrow)"/>
      <path d="M630 94H468" marker-end="url(#acu-arrow)"/>
    </g>
    <rect x="314" y="80" width="152" height="44" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="390" y="98" font-size="11.5" font-weight="700" fill="#463365">one at a time</text>
    <text x="390" y="114" font-size="11.5" fill="#463365">row locked during change</text>

    <rect x="310" y="150" width="160" height="40" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="390" y="166" font-size="11.5" font-weight="700" fill="#294a2e">A: stock 1 matches</text>
    <text x="390" y="182" font-size="11.5" fill="#294a2e">stock becomes 0</text>
    <rect x="310" y="236" width="160" height="40" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="390" y="252" font-size="11.5" font-weight="700" fill="#6b241c">B: stock 0 &gt;= 1 is false</text>
    <text x="390" y="268" font-size="11.5" fill="#6b241c">nothing changes</text>

    <g font-size="11.5" fill="#36424e">
      <text x="230" y="206">1 row: 201 Created</text>
      <text x="550" y="292">0 rows: 409 Out of stock</text>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M310 212H152" marker-end="url(#acu-ret)"/>
      <path d="M470 298H628" marker-end="url(#acu-ret)"/>
    </g>

    <rect x="140" y="346" width="500" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="365" font-size="14" font-weight="700" fill="#294a2e">Exactly one sale; stock never goes below 0</text>
    <text x="390" y="382" font-size="11.5" fill="#294a2e">the check and the change happen inside one database operation</text>
  </g>
</svg>
