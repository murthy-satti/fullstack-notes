<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="gcf-title gcf-desc">
  <title id="gcf-title">How a gRPC call travels, and the four call types</title>
  <desc id="gcf-desc">Client code calls client.getOrder with an ID. The generated client stub encodes the request as binary protobuf and sends it on an HTTP/2 stream to the path /orders.v1.OrderService/GetOrder. The server stub decodes it and calls the GetOrder handler, whose Order result is encoded and sent back, with grpc-status 0 for OK in the trailers. Unary calls send one request and one response; server streaming sends one request and many responses; client streaming sends many requests and one response; bidirectional streaming lets both sides send messages at any time.</desc>
  <defs>
    <marker id="gcf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="gcf-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="20" y="40" width="140" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="180" y="40" width="140" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="340" y="40" width="120" height="64" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="480" y="40" width="140" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="640" y="40" width="140" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <text x="90" y="64" font-size="14" font-weight="700" fill="#66400f">Client code</text>
    <text x="90" y="82" font-size="11" fill="#66400f">client.getOrder({ id })</text>
    <text x="250" y="64" font-size="14" font-weight="700" fill="#263e5a">Client stub</text>
    <text x="250" y="82" font-size="11" fill="#263e5a">generated; encodes</text>
    <text x="400" y="64" font-size="14" font-weight="700" fill="#36424e">HTTP/2</text>
    <text x="400" y="82" font-size="11" fill="#36424e">one stream</text>
    <text x="550" y="64" font-size="14" font-weight="700" fill="#263e5a">Server stub</text>
    <text x="550" y="82" font-size="11" fill="#263e5a">generated; decodes</text>
    <text x="710" y="64" font-size="14" font-weight="700" fill="#66400f">Handler</text>
    <text x="710" y="82" font-size="11" fill="#66400f">GetOrder(request)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M160 60H178" marker-end="url(#gcf-arrow)"/>
      <path d="M320 60H338" marker-end="url(#gcf-arrow)"/>
      <path d="M460 60H478" marker-end="url(#gcf-arrow)"/>
      <path d="M620 60H638" marker-end="url(#gcf-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3">
      <path d="M640 90H622" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M480 90H462" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M340 90H322" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M180 90H162" marker-end="url(#gcf-arrow-dash)"/>
    </g>

    <rect x="20" y="122" width="760" height="70" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="34" y="144"><tspan font-weight="700">Request:</tspan> :path /orders.v1.OrderService/GetOrder   content-type: application/grpc</text>
      <text x="34" y="162">body: binary protobuf message (id = "901"), a few bytes instead of JSON text</text>
      <text x="34" y="180"><tspan font-weight="700">Response:</tspan> Order message, then trailers with grpc-status: 0 (OK) or an error code</text>
    </g>

    <g font-size="12.5" font-weight="700" fill="#40566b">
      <text x="110" y="226">Unary</text>
      <text x="300" y="226">Server streaming</text>
      <text x="490" y="226">Client streaming</text>
      <text x="685" y="226">Bidirectional</text>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="3 3">
      <path d="M50 238V340M170 238V340"/>
      <path d="M240 238V340M360 238V340"/>
      <path d="M430 238V340M550 238V340"/>
      <path d="M625 238V340M745 238V340"/>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M50 256H168" marker-end="url(#gcf-arrow)"/>
      <path d="M240 256H358" marker-end="url(#gcf-arrow)"/>
      <path d="M430 256H548" marker-end="url(#gcf-arrow)"/>
      <path d="M430 276H548" marker-end="url(#gcf-arrow)"/>
      <path d="M430 296H548" marker-end="url(#gcf-arrow)"/>
      <path d="M625 256H743" marker-end="url(#gcf-arrow)"/>
      <path d="M625 296H743" marker-end="url(#gcf-arrow)"/>
      <path d="M625 332H743" marker-end="url(#gcf-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3">
      <path d="M170 282H52" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M360 278H242" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M360 298H242" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M360 318H242" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M550 322H432" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M745 276H627" marker-end="url(#gcf-arrow-dash)"/>
      <path d="M745 314H627" marker-end="url(#gcf-arrow-dash)"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="50" y="354">client</text><text x="170" y="354">server</text>
      <text x="240" y="354">client</text><text x="360" y="354">server</text>
      <text x="430" y="354">client</text><text x="550" y="354">server</text>
      <text x="625" y="354">client</text><text x="745" y="354">server</text>
    </g>
    <text x="400" y="386" font-size="13" fill="#40566b">Solid arrows are requests and dashed arrows responses; streams stay open on one HTTP/2 connection.</text>
  </g>
</svg>
