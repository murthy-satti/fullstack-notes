<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="lur-title lur-desc">
  <title id="lur-title">A lost update when two requests buy the last item</title>
  <desc id="lur-desc">Stock starts at 1. Request A reads stock and gets 1. Request B reads stock and also gets 1. A decides 1 is greater than 0 and sells; B makes the same decision. A writes stock = 0, then B writes stock = 0, overwriting A's write. Two items are sold although only one existed; one request should have been rejected.</desc>
  <defs>
    <marker id="lur-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lur-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="22" width="120" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="150" y="44" font-size="13" font-weight="700" fill="#263e5a">Request A</text>
    <rect x="320" y="22" width="140" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="44" font-size="13" font-weight="700" fill="#463365">Database</text>
    <rect x="570" y="22" width="120" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="630" y="44" font-size="13" font-weight="700" fill="#66400f">Request B</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M150 56V392M390 56V392M630 56V392"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="98">t1</text>
      <text x="24" y="152">t2</text>
      <text x="24" y="206">t3</text>
      <text x="24" y="246">t4</text>
      <text x="24" y="298">t5</text>
      <text x="24" y="352">t6</text>
    </g>

    <rect x="340" y="66" width="100" height="22" rx="4" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
    <text x="390" y="82" font-size="11.5" font-weight="700" fill="#463365">stock = 1</text>

    <rect x="90" y="190" width="120" height="26" rx="5" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="150" y="208" font-size="11.5" font-weight="700" fill="#263e5a">1 &gt; 0, so sell</text>
    <rect x="570" y="230" width="120" height="26" rx="5" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="630" y="248" font-size="11.5" font-weight="700" fill="#66400f">1 &gt; 0, so sell</text>

    <rect x="340" y="304" width="100" height="22" rx="4" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
    <text x="390" y="320" font-size="11.5" font-weight="700" fill="#463365">stock = 0</text>
    <rect x="310" y="358" width="160" height="22" rx="4" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="390" y="374" font-size="11.5" font-weight="700" fill="#6b241c">stock = 0 (A's write lost)</text>

    <g font-size="11.5" fill="#36424e">
      <text x="270" y="96">read stock</text>
      <text x="270" y="122">1</text>
      <text x="510" y="150">read stock</text>
      <text x="510" y="176">1</text>
      <text x="270" y="292">write stock = 0</text>
      <text x="510" y="346">write stock = 0</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 102H338" marker-end="url(#lur-arrow)"/>
      <path d="M630 156H442" marker-end="url(#lur-arrow)"/>
      <path d="M150 298H338" marker-end="url(#lur-arrow)"/>
      <path d="M630 352H472" marker-end="url(#lur-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M340 128H152" marker-end="url(#lur-ret)"/>
      <path d="M440 182H628" marker-end="url(#lur-ret)"/>
    </g>

    <rect x="140" y="408" width="500" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="390" y="427" font-size="14" font-weight="700" fill="#6b241c">Two items sold, but only one existed</text>
    <text x="390" y="444" font-size="11.5" fill="#6b241c">each request was correct alone; interleaved, one sale should have been rejected</text>
  </g>
</svg>
