<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="occv-title occv-desc">
  <title id="occv-title">Optimistic concurrency control with a version field</title>
  <desc id="occv-desc">Writers A and B both read document 7 at version 3. A updates it with a condition WHERE version = 3, which matches one row, so the update succeeds and the version becomes 4. B then sends the same condition WHERE version = 3, which now matches zero rows, so B gets a conflict, returned to its client as 409 Conflict or, over HTTP with If-Match, 412 Precondition Failed. B re-reads version 4, reapplies its change with WHERE version = 4, and succeeds with version 5. No update is silently overwritten.</desc>
  <defs>
    <marker id="occv-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="occv-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="occv-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="22" width="120" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="150" y="44" font-size="13" font-weight="700" fill="#263e5a">Writer A</text>
    <rect x="310" y="22" width="160" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="44" font-size="13" font-weight="700" fill="#463365">Database (doc 7)</text>
    <rect x="570" y="22" width="120" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="630" y="44" font-size="13" font-weight="700" fill="#66400f">Writer B</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M150 56V470M390 56V470M630 56V470"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="270" y="86">read</text>
      <text x="270" y="112">version 3</text>
      <text x="510" y="136">read</text>
      <text x="510" y="162">version 3</text>
      <text x="270" y="200">UPDATE ... WHERE version = 3</text>
      <text x="270" y="250">1 row changed</text>
      <text x="510" y="290">UPDATE ... WHERE version = 3</text>
      <text x="510" y="420">re-read, then WHERE version = 4</text>
      <text x="510" y="452">1 row changed: version 5</text>
    </g>
    <text x="510" y="316" font-size="11.5" font-weight="700" fill="#6b241c">0 rows changed: conflict</text>

    <rect x="330" y="214" width="120" height="22" rx="4" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="390" y="230" font-size="11.5" font-weight="700" fill="#294a2e">now version 4</text>

    <rect x="548" y="342" width="164" height="44" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="630" y="360" font-size="11.5" font-weight="700" fill="#6b241c">409 Conflict (HTTP: 412)</text>
    <text x="630" y="376" font-size="11.5" fill="#6b241c">reload and reapply</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 92H388" marker-end="url(#occv-arrow)"/>
      <path d="M630 142H392" marker-end="url(#occv-arrow)"/>
      <path d="M150 206H388" marker-end="url(#occv-arrow)"/>
      <path d="M630 296H392" marker-end="url(#occv-arrow)"/>
      <path d="M630 426H392" marker-end="url(#occv-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M390 118H152" marker-end="url(#occv-ret)"/>
      <path d="M390 168H628" marker-end="url(#occv-ret)"/>
      <path d="M390 256H152" marker-end="url(#occv-ret)"/>
      <path d="M390 458H628" marker-end="url(#occv-ret)"/>
    </g>
    <path d="M390 322H628" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#occv-bad)"/>
  </g>
</svg>
