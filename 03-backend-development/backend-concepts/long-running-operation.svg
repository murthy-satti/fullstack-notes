<svg xmlns="http://www.w3.org/2000/svg" width="780" height="556" viewBox="0 0 780 556" role="img" aria-labelledby="lro-title lro-desc">
  <title id="lro-title">A long-running operation with 202 Accepted and a status resource</title>
  <desc id="lro-desc">The client sends POST /api/reports. The API enqueues job 77 and immediately returns 202 Accepted with Location /api/report-jobs/77 and status queued. While a worker runs the job, the client polls GET /api/report-jobs/77 and receives status running with progress 40. When the worker finishes and records result r_77, the next poll returns status succeeded with a resultUrl, or a 303 See Other to the result. The client then fetches GET /api/reports/r_77 and receives the report.</desc>
  <defs>
    <marker id="lro-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lro-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="556" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="30" y="20" width="120" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="320" y="20" width="120" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="600" y="20" width="160" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <text x="90" y="43" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <text x="380" y="43" font-size="14" font-weight="700" fill="#66400f">API</text>
    <text x="680" y="43" font-size="14" font-weight="700" fill="#463365">Queue + worker</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M90 56V512"/>
      <path d="M380 56V512"/>
      <path d="M680 56V512"/>
    </g>
    <rect x="673" y="130" width="14" height="200" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="694" y="236" font-size="11.5" fill="#463365" text-anchor="start">job 77</text>
    <text x="694" y="252" font-size="11.5" fill="#463365" text-anchor="start">running</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M90 92H378" marker-end="url(#lro-arrow)"/>
      <path d="M380 124H671" marker-end="url(#lro-arrow)"/>
      <path d="M90 236H378" marker-end="url(#lro-arrow)"/>
      <path d="M673 330H382" marker-end="url(#lro-arrow)"/>
      <path d="M90 372H378" marker-end="url(#lro-arrow)"/>
      <path d="M90 462H378" marker-end="url(#lro-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4">
      <path d="M380 160H92" marker-end="url(#lro-arrow-dash)"/>
      <path d="M380 268H92" marker-end="url(#lro-arrow-dash)"/>
      <path d="M380 404H92" marker-end="url(#lro-arrow-dash)"/>
      <path d="M380 494H92" marker-end="url(#lro-arrow-dash)"/>
    </g>

    <g font-size="12" fill="#263e5a">
      <text x="235" y="84" font-weight="700">1. POST /api/reports</text>
      <text x="530" y="116">2. enqueue job 77</text>
      <text x="235" y="228" font-weight="700">4. GET /api/report-jobs/77</text>
      <text x="530" y="322">6. done: result r_77</text>
      <text x="235" y="364" font-weight="700">7. GET /api/report-jobs/77</text>
      <text x="235" y="454" font-weight="700">9. GET /api/reports/r_77</text>
    </g>
    <g font-size="12" font-weight="700" fill="#294a2e">
      <text x="235" y="152">3. 202 Accepted</text>
      <text x="235" y="260">5. 200 OK</text>
      <text x="235" y="396">8. 200 OK</text>
      <text x="235" y="486">10. 200 OK + report</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="235" y="176">Location: /api/report-jobs/77</text>
      <text x="235" y="191">{"status": "queued"}</text>
      <text x="235" y="284">{"status": "running", "progress": 40}</text>
      <text x="235" y="420">{"status": "succeeded", "resultUrl": ...}</text>
      <text x="235" y="435">(or 303 See Other to the result)</text>
    </g>
    <text x="390" y="540" font-size="13" fill="#40566b">The request returns at once; the client polls the status resource (or gets a webhook) until the job is done.</text>
  </g>
</svg>
