<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="bfb-title bfb-desc">
  <title id="bfb-title">The building blocks of a typical backend and how they connect</title>
  <desc id="bfb-desc">A browser or mobile app sends an HTTPS request to a load balancer or reverse proxy, which forwards it to one of several application servers. The application servers call external APIs, read and write the database, get and set cached copies, enqueue jobs on a message queue, and store files in object storage. Background workers consume jobs from the queue and write their results to the database.</desc>
  <defs>
    <marker id="bfb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="20" width="200" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="47" font-size="14" font-weight="700" fill="#36424e">Browser / mobile app</text>

    <rect x="270" y="98" width="240" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="119" font-size="14" font-weight="700" fill="#36424e">Load balancer / proxy</text>
    <text x="390" y="137" font-size="11.5" fill="#36424e">terminates TLS, spreads traffic</text>

    <rect x="278" y="174" width="240" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="270" y="182" width="240" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="205" font-size="14" font-weight="700" fill="#66400f">Application servers</text>
    <text x="390" y="223" font-size="11.5" fill="#66400f">your code: routes and logic</text>

    <rect x="590" y="186" width="170" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="675" y="206" font-size="14" font-weight="700" fill="#36424e">External APIs</text>
    <text x="675" y="223" font-size="11.5" fill="#36424e">payments, email, maps</text>

    <rect x="40" y="310" width="160" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="120" y="331" font-size="14" font-weight="700" fill="#263e5a">Database</text>
    <text x="120" y="349" font-size="11.5" fill="#263e5a">source of truth</text>
    <rect x="220" y="310" width="160" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="331" font-size="14" font-weight="700" fill="#263e5a">Cache</text>
    <text x="300" y="349" font-size="11.5" fill="#263e5a">fast copies (Redis)</text>
    <rect x="400" y="310" width="160" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="480" y="331" font-size="14" font-weight="700" fill="#463365">Message queue</text>
    <text x="480" y="349" font-size="11.5" fill="#463365">work for later</text>
    <rect x="580" y="310" width="160" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="660" y="331" font-size="14" font-weight="700" fill="#263e5a">Object storage</text>
    <text x="660" y="349" font-size="11.5" fill="#263e5a">uploads, PDFs (S3)</text>

    <rect x="390" y="404" width="180" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="480" y="425" font-size="14" font-weight="700" fill="#463365">Background workers</text>
    <text x="480" y="443" font-size="11.5" fill="#463365">send email, resize images</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 64V96" marker-end="url(#bfb-arrow)"/>
      <path d="M390 150V172" marker-end="url(#bfb-arrow)"/>
      <path d="M510 210H588" marker-end="url(#bfb-arrow)"/>
      <path d="M390 238V264H120V308" marker-end="url(#bfb-arrow)"/>
      <path d="M390 238V264H300V308" marker-end="url(#bfb-arrow)"/>
      <path d="M390 238V264H480V308" marker-end="url(#bfb-arrow)"/>
      <path d="M390 238V264H660V308" marker-end="url(#bfb-arrow)"/>
      <path d="M480 362V402" marker-end="url(#bfb-arrow)"/>
      <path d="M390 430H120V364" marker-end="url(#bfb-arrow)"/>
    </g>

    <g font-size="11.5" fill="#40566b" text-anchor="start">
      <text x="398" y="85">HTTPS request</text>
      <text x="398" y="166">forwards</text>
      <text x="126" y="292">reads, writes</text>
      <text x="306" y="292">get, set</text>
      <text x="486" y="292">enqueue job</text>
      <text x="666" y="292">store files</text>
      <text x="486" y="387">consume</text>
    </g>
    <text x="549" y="202" font-size="11.5" fill="#40566b">calls</text>
    <text x="255" y="422" font-size="11.5" fill="#40566b">write results</text>
    <text x="390" y="484" font-size="13" fill="#40566b">The application coordinates every other part; slow work goes through the queue to workers.</text>
  </g>
</svg>
