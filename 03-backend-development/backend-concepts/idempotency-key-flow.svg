<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="ikf-title ikf-desc">
  <title id="ikf-title">How a server handles an Idempotency-Key</title>
  <desc id="ikf-desc">A POST /payments request arrives with an Idempotency-Key header. The server claims the key atomically, for example with a unique insert or Redis SET NX. If the key is new, it performs the operation once, charging the card, stores the status and body with the key for about 24 hours, and returns 201 Created. If the key already existed and the request body differs, it returns 422 because the key was reused for a different request. If the body matches and the first attempt is done, it returns the stored response without charging again. If the first attempt is still running, it returns 409 Conflict.</desc>
  <defs>
    <marker id="ikf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="20" width="280" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="45" font-size="13" font-weight="700" fill="#36424e">POST /payments + Idempotency-Key</text>

    <rect x="80" y="84" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="200" y="104" font-size="14" font-weight="700" fill="#263e5a">Claim the key atomically</text>
    <text x="200" y="121" font-size="11.5" fill="#263e5a">unique insert, or Redis SET NX</text>

    <path d="M200 144 300 172 200 200 100 172z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="169" font-size="12" font-weight="700" fill="#36424e">key already</text>
    <text x="200" y="183" font-size="12" font-weight="700" fill="#36424e">existed?</text>

    <rect x="80" y="226" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="246" font-size="14" font-weight="700" fill="#66400f">Perform the operation</text>
    <text x="200" y="263" font-size="11.5" fill="#66400f">charge the card exactly once</text>

    <rect x="80" y="294" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="200" y="314" font-size="14" font-weight="700" fill="#263e5a">Store status + body</text>
    <text x="200" y="331" font-size="11.5" fill="#263e5a">saved with the key, ~24 h TTL</text>

    <rect x="80" y="362" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="200" y="382" font-size="14" font-weight="700" fill="#294a2e">201 Created</text>
    <text x="200" y="399" font-size="11.5" fill="#294a2e">first response returned</text>

    <path d="M470 144 560 172 470 200 380 172z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="470" y="169" font-size="12" font-weight="700" fill="#36424e">same request</text>
    <text x="470" y="183" font-size="12" font-weight="700" fill="#36424e">body?</text>

    <path d="M470 236 560 264 470 292 380 264z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="470" y="261" font-size="12" font-weight="700" fill="#36424e">first attempt</text>
    <text x="470" y="275" font-size="12" font-weight="700" fill="#36424e">finished?</text>

    <rect x="380" y="326" width="180" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="470" y="346" font-size="14" font-weight="700" fill="#294a2e">Return stored response</text>
    <text x="470" y="363" font-size="11.5" fill="#294a2e">no second charge</text>

    <rect x="610" y="148" width="150" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="685" y="168" font-size="14" font-weight="700" fill="#6b241c">422</text>
    <text x="685" y="185" font-size="11.5" fill="#6b241c">key reused, body differs</text>
    <rect x="610" y="240" width="150" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="685" y="260" font-size="14" font-weight="700" fill="#6b241c">409 Conflict</text>
    <text x="685" y="277" font-size="11.5" fill="#6b241c">duplicate still running</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 60V82" marker-end="url(#ikf-arrow)"/>
      <path d="M200 132V142" marker-end="url(#ikf-arrow)"/>
      <path d="M200 200V224" marker-end="url(#ikf-arrow)"/>
      <path d="M200 274V292" marker-end="url(#ikf-arrow)"/>
      <path d="M200 342V360" marker-end="url(#ikf-arrow)"/>
      <path d="M300 172H378" marker-end="url(#ikf-arrow)"/>
      <path d="M560 172H608" marker-end="url(#ikf-arrow)"/>
      <path d="M470 200V234" marker-end="url(#ikf-arrow)"/>
      <path d="M560 264H608" marker-end="url(#ikf-arrow)"/>
      <path d="M470 292V324" marker-end="url(#ikf-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="339" y="164">yes</text>
      <text x="212" y="217" text-anchor="start">no</text>
      <text x="584" y="164">no</text>
      <text x="482" y="221" text-anchor="start">yes</text>
      <text x="584" y="256">no</text>
      <text x="482" y="313" text-anchor="start">yes</text>
    </g>
    <text x="390" y="444" font-size="13" fill="#40566b">The client reuses one key for every retry of the same logical operation, so a retry can never charge twice.</text>
  </g>
</svg>
