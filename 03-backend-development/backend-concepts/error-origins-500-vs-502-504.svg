<svg xmlns="http://www.w3.org/2000/svg" width="780" height="552" viewBox="0 0 780 552" role="img" aria-labelledby="eor-title eor-desc">
  <title id="eor-title">Which layer produces 500, 502, 503, and 504</title>
  <desc id="eor-desc">A client sends a request to a load balancer or proxy. If the app throws an unhandled error, the app writes 500 and the proxy passes it through. If the app crashes or resets the connection, the proxy writes 502 Bad Gateway. If no healthy app instance exists, the proxy writes 503 Service Unavailable. If the app is still working when the proxy's timeout expires, the proxy writes 504 Gateway Timeout.</desc>
  <defs>
    <marker id="eor-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="eor-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="552" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="40" y="20" width="120" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="290" y="20" width="180" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="580" y="20" width="140" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <text x="100" y="43" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <text x="380" y="43" font-size="14" font-weight="700" fill="#36424e">Load balancer / proxy</text>
    <text x="650" y="43" font-size="14" font-weight="700" fill="#66400f">App server</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M100 56V512"/>
      <path d="M380 56V512"/>
      <path d="M650 56V512"/>
    </g>
    <g fill="none" stroke="#c9d1db" stroke-width="1.5">
      <path d="M24 192H756"/>
      <path d="M24 300H756"/>
      <path d="M24 402H756"/>
    </g>

    <rect x="590" y="114" width="120" height="28" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="650" y="133" font-size="12" font-weight="700" fill="#6b241c">throws (bug)</text>
    <rect x="580" y="222" width="140" height="28" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="650" y="241" font-size="12" font-weight="700" fill="#6b241c">crashes / resets</text>
    <rect x="300" y="316" width="160" height="30" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="380" y="336" font-size="12" font-weight="700" fill="#36424e">no healthy instance</text>
    <text x="650" y="336" font-size="12" font-style="italic" fill="#6b241c">all instances down</text>
    <rect x="643" y="428" width="14" height="72" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="666" y="468" font-size="11.5" fill="#66400f" text-anchor="start">still working</text>
    <rect x="300" y="440" width="160" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="380" y="459" font-size="12" font-weight="700" fill="#36424e">proxy timeout (60 s)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M100 80H378" marker-end="url(#eor-arrow)"/>
      <path d="M380 104H648" marker-end="url(#eor-arrow)"/>
      <path d="M380 212H648" marker-end="url(#eor-arrow)"/>
      <path d="M380 422H641" marker-end="url(#eor-arrow)"/>
    </g>
    <g fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4">
      <path d="M650 160H382" marker-end="url(#eor-arrow-red)"/>
      <path d="M380 160H102" marker-end="url(#eor-arrow-red)"/>
      <path d="M650 268H382" marker-end="url(#eor-arrow-red)"/>
      <path d="M380 268H102" marker-end="url(#eor-arrow-red)"/>
      <path d="M380 370H102" marker-end="url(#eor-arrow-red)"/>
      <path d="M380 488H102" marker-end="url(#eor-arrow-red)"/>
    </g>

    <g font-size="11.5" fill="#40566b">
      <text x="240" y="72">GET /api/orders</text>
      <text x="515" y="96">forwards</text>
      <text x="515" y="204">forwards</text>
      <text x="515" y="414">forwards</text>
    </g>
    <g font-size="12" font-weight="700" fill="#b5473a">
      <text x="515" y="152">500</text>
      <text x="240" y="152">500 Internal Server Error</text>
      <text x="515" y="260">connection reset</text>
      <text x="240" y="260">502 Bad Gateway</text>
      <text x="240" y="362">503 Service Unavailable</text>
      <text x="240" y="480">504 Gateway Timeout</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#36424e">
      <text x="240" y="176">written by your app</text>
      <text x="240" y="284">written by the proxy</text>
      <text x="240" y="386">written by the proxy</text>
      <text x="240" y="504">written by the proxy</text>
    </g>
    <text x="390" y="536" font-size="13" fill="#40566b">Only 500 comes from your code; the proxy writes 502, 503, and 504 when the app can't answer.</text>
  </g>
</svg>
