<svg xmlns="http://www.w3.org/2000/svg" width="760" height="664" viewBox="0 0 760 664" role="img" aria-labelledby="hms-title hms-desc">
  <title id="hms-title">Choosing the HTTP method for an endpoint</title>
  <desc id="hms-desc">If the request only reads data, use GET, or HEAD for headers only. If it removes the resource, use DELETE. If it creates a resource and the server chooses the ID, use POST on the collection and return 201 with Location. If it sends the whole resource to its own URL, use PUT. If it changes only some fields, use PATCH. Otherwise it is an action, so use POST on an action URL. GET is safe and idempotent; DELETE and PUT are idempotent; POST and PATCH are not idempotent by definition.</desc>
  <defs>
    <marker id="hms-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="760" height="664" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="20" width="240" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="43" font-size="14" font-weight="700" fill="#36424e">What should the request do?</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M220 84 340 116 220 148 100 116z"/>
      <path d="M220 176 340 208 220 240 100 208z"/>
      <path d="M220 268 340 300 220 332 100 300z"/>
      <path d="M220 360 340 392 220 424 100 392z"/>
      <path d="M220 452 340 484 220 516 100 484z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="220" y="113">only reads</text>
      <text x="220" y="127">data?</text>
      <text x="220" y="205">removes the</text>
      <text x="220" y="219">resource?</text>
      <text x="220" y="297">creates; server</text>
      <text x="220" y="311">chooses the ID?</text>
      <text x="220" y="389">sends the whole</text>
      <text x="220" y="403">resource to its URL?</text>
      <text x="220" y="481">changes only</text>
      <text x="220" y="495">some fields?</text>
    </g>

    <rect x="430" y="92" width="310" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="585" y="112" font-size="14" font-weight="700" fill="#294a2e">GET /orders/42</text>
    <text x="585" y="129" font-size="11.5" fill="#294a2e">HEAD for headers only; 200 OK</text>
    <rect x="430" y="184" width="310" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="585" y="204" font-size="14" font-weight="700" fill="#263e5a">DELETE /orders/42</text>
    <text x="585" y="221" font-size="11.5" fill="#263e5a">204 No Content</text>
    <rect x="430" y="276" width="310" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="585" y="296" font-size="14" font-weight="700" fill="#66400f">POST /orders</text>
    <text x="585" y="313" font-size="11.5" fill="#66400f">201 Created + Location</text>
    <rect x="430" y="368" width="310" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="585" y="388" font-size="14" font-weight="700" fill="#263e5a">PUT /orders/42</text>
    <text x="585" y="405" font-size="11.5" fill="#263e5a">create or fully replace; 200, 201, or 204</text>
    <rect x="430" y="460" width="310" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="585" y="480" font-size="14" font-weight="700" fill="#66400f">PATCH /orders/42</text>
    <text x="585" y="497" font-size="11.5" fill="#66400f">partial update; 200 or 204</text>
    <rect x="100" y="548" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="568" font-size="14" font-weight="700" fill="#66400f">POST /orders/42/cancel</text>
    <text x="220" y="585" font-size="11.5" fill="#66400f">an action, not a field update</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M220 56V82" marker-end="url(#hms-arrow)"/>
      <path d="M220 148V174" marker-end="url(#hms-arrow)"/>
      <path d="M220 240V266" marker-end="url(#hms-arrow)"/>
      <path d="M220 332V358" marker-end="url(#hms-arrow)"/>
      <path d="M220 424V450" marker-end="url(#hms-arrow)"/>
      <path d="M220 516V546" marker-end="url(#hms-arrow)"/>
      <path d="M340 116H428" marker-end="url(#hms-arrow)"/>
      <path d="M340 208H428" marker-end="url(#hms-arrow)"/>
      <path d="M340 300H428" marker-end="url(#hms-arrow)"/>
      <path d="M340 392H428" marker-end="url(#hms-arrow)"/>
      <path d="M340 484H428" marker-end="url(#hms-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="384" y="108">yes</text>
      <text x="384" y="200">yes</text>
      <text x="384" y="292">yes</text>
      <text x="384" y="384">yes</text>
      <text x="384" y="476">yes</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="228" y="166">no</text>
      <text x="228" y="258">no</text>
      <text x="228" y="350">no</text>
      <text x="228" y="442">no</text>
      <text x="228" y="536">no</text>
    </g>

    <g stroke-width="2">
      <rect x="120" y="618" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="300" y="618" width="16" height="16" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="452" y="618" width="16" height="16" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" fill="#36424e" text-anchor="start">
      <text x="144" y="631">safe and idempotent</text>
      <text x="324" y="631">idempotent</text>
      <text x="476" y="631">not idempotent by definition</text>
    </g>
  </g>
</svg>
