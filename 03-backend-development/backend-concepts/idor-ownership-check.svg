<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" role="img" aria-labelledby="idor-title idor-desc">
  <title id="idor-title">How an ownership check prevents IDOR</title>
  <desc id="idor-desc">Invoice 1002 belongs to user 9. User A, id 7, requests GET /api/invoices/1002. Without an ownership check the handler calls findById and returns user 9's invoice with 200 OK, leaking data. With an ownership check the handler queries by both the invoice ID and the current user's ID, finds nothing, and returns 404 Not Found, so the record stays private.</desc>
  <defs>
    <marker id="idor-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="360" height="310" rx="10" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <rect x="400" y="20" width="360" height="310" rx="10" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <text x="200" y="46" font-size="14" font-weight="700" fill="#6b241c">Without an ownership check</text>
    <text x="580" y="46" font-size="14" font-weight="700" fill="#294a2e">With an ownership check</text>
    <text x="200" y="64" font-size="11.5" fill="#40566b">invoice 1002 belongs to user 9</text>
    <text x="580" y="64" font-size="11.5" fill="#40566b">invoice 1002 belongs to user 9</text>

    <rect x="50" y="82" width="300" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="102" font-size="14" font-weight="700" fill="#36424e">User A (id 7)</text>
    <text x="200" y="119" font-size="11.5" fill="#36424e">GET /api/invoices/1002</text>
    <rect x="430" y="82" width="300" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="102" font-size="14" font-weight="700" fill="#36424e">User A (id 7)</text>
    <text x="580" y="119" font-size="11.5" fill="#36424e">GET /api/invoices/1002</text>

    <rect x="50" y="150" width="300" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="170" font-size="14" font-weight="700" fill="#66400f">Invoice.findById(1002)</text>
    <text x="200" y="187" font-size="11.5" fill="#66400f">loads any invoice by its ID</text>
    <rect x="430" y="150" width="300" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="580" y="170" font-size="14" font-weight="700" fill="#66400f">findOne by ID and owner</text>
    <text x="580" y="187" font-size="11.5" fill="#66400f">{ _id: 1002, ownerId: req.user.id }</text>

    <rect x="50" y="218" width="300" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="200" y="238" font-size="14" font-weight="700" fill="#6b241c">200 OK</text>
    <text x="200" y="255" font-size="11.5" fill="#6b241c">returns user 9's invoice</text>
    <rect x="430" y="218" width="300" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="238" font-size="14" font-weight="700" fill="#294a2e">404 Not Found</text>
    <text x="580" y="255" font-size="11.5" fill="#294a2e">no invoice 1002 for user 7</text>

    <text x="200" y="302" font-size="13" font-weight="700" fill="#6b241c">Data leak (IDOR)</text>
    <text x="580" y="302" font-size="13" font-weight="700" fill="#294a2e">Record stays private</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 130V148" marker-end="url(#idor-arrow)"/>
      <path d="M200 198V216" marker-end="url(#idor-arrow)"/>
      <path d="M580 130V148" marker-end="url(#idor-arrow)"/>
      <path d="M580 198V216" marker-end="url(#idor-arrow)"/>
    </g>
    <text x="390" y="358" font-size="13" fill="#40566b">Both users have the role customer; only a check against the record's owner stops the leak.</text>
  </g>
</svg>
