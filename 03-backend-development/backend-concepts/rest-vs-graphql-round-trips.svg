<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="rgr-title rgr-desc">
  <title id="rgr-title">Loading one screen with REST versus GraphQL</title>
  <desc id="rgr-desc">With REST, the client calls GET /books/42, reads the authorId from the full book, then calls GET /authors/a1 and GET /authors/a1/books, waiting for each response and receiving fields it does not use. With GraphQL, the client sends one POST /graphql query naming exactly the fields it needs; the server's resolvers fetch the book, the author, and the author's books, and one 200 response returns only the requested fields.</desc>
  <defs>
    <marker id="rgr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rgr-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="376" height="356" rx="10" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="408" y="16" width="376" height="356" rx="10" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="204" y="40" font-size="13" font-weight="700" fill="#40566b">REST: three round trips</text>
    <text x="596" y="40" font-size="13" font-weight="700" fill="#40566b">GraphQL: one round trip</text>

    <g stroke-width="2">
      <rect x="36" y="54" width="80" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="256" y="54" width="120" height="30" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="428" y="54" width="80" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="628" y="54" width="140" height="30" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="76" y="74" fill="#36424e">Client</text>
      <text x="316" y="74" fill="#66400f">REST API</text>
      <text x="468" y="74" fill="#36424e">Client</text>
      <text x="698" y="74" fill="#463365">GraphQL server</text>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M76 84V290"/>
      <path d="M316 84V290"/>
      <path d="M468 84V290"/>
      <path d="M698 84V290"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M76 112H314" marker-end="url(#rgr-arrow)"/>
      <path d="M76 182H314" marker-end="url(#rgr-arrow)"/>
      <path d="M76 252H314" marker-end="url(#rgr-arrow)"/>
      <path d="M468 112H696" marker-end="url(#rgr-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4">
      <path d="M316 140H78" marker-end="url(#rgr-arrow-dash)"/>
      <path d="M316 210H78" marker-end="url(#rgr-arrow-dash)"/>
      <path d="M316 280H78" marker-end="url(#rgr-arrow-dash)"/>
      <path d="M698 276H470" marker-end="url(#rgr-arrow-dash)"/>
    </g>
    <g font-size="12" fill="#263e5a">
      <text x="196" y="104" font-weight="700">1. GET /books/42</text>
      <text x="196" y="174" font-weight="700">2. GET /authors/a1</text>
      <text x="196" y="244" font-weight="700">3. GET /authors/a1/books</text>
      <text x="583" y="104" font-weight="700">POST /graphql</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="196" y="132">whole book, incl. authorId</text>
      <text x="196" y="202">whole author</text>
      <text x="196" y="272">whole list of books</text>
      <text x="583" y="268">200: exactly these fields</text>
    </g>

    <rect x="482" y="122" width="202" height="76" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1"/>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="492" y="140">book(id: 42) {</text>
      <text x="504" y="155">title</text>
      <text x="504" y="170">author { name</text>
      <text x="516" y="185">books { title } } }</text>
    </g>
    <rect x="626" y="206" width="144" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="698" y="223" font-size="11.5" font-weight="700" fill="#463365">resolvers fetch</text>
    <text x="698" y="238" font-size="11" fill="#463365">book, author, books</text>

    <text x="204" y="320" font-size="11.5" fill="#6b241c">Each call waits for the one before it,</text>
    <text x="204" y="336" font-size="11.5" fill="#6b241c">and responses carry fields the screen ignores.</text>
    <text x="596" y="320" font-size="11.5" fill="#294a2e">One request; the server joins the data</text>
    <text x="596" y="336" font-size="11.5" fill="#294a2e">and returns only the requested fields.</text>
    <text x="400" y="402" font-size="13" fill="#40566b">GraphQL moves the joining to the server: fewer round trips and no unused fields.</text>
  </g>
</svg>
