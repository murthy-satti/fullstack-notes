<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="rrm-title rrm-desc">
  <title id="rrm-title">Methods on a REST collection and item, with their status codes</title>
  <desc id="rrm-desc">GET /api/orders lists the collection with 200 OK, and POST /api/orders creates an order and returns 201 Created with a Location header such as /api/orders/902. On the item /api/orders/901, GET returns 200 with the order, PUT replaces it with 200, PATCH updates some fields with 200, and DELETE removes it with 204 No Content; a later GET returns 404 Not Found.</desc>
  <defs>
    <marker id="rrm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="140" y="38">Request</text>
      <text x="385" y="38">Resource</text>
      <text x="650" y="38">Response</text>
    </g>

    <rect x="300" y="56" width="170" height="100" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="385" y="100" font-size="14" font-weight="700" fill="#463365">/api/orders</text>
    <text x="385" y="118" font-size="11.5" fill="#463365">collection</text>
    <rect x="300" y="190" width="170" height="256" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="385" y="310" font-size="14" font-weight="700" fill="#463365">/api/orders/901</text>
    <text x="385" y="328" font-size="11.5" fill="#463365">single resource</text>

    <g stroke-width="2">
      <rect x="20" y="62" width="240" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="20" y="114" width="240" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="20" y="196" width="240" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="20" y="248" width="240" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="20" y="300" width="240" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="20" y="352" width="240" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="20" y="404" width="240" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="140" y="85" fill="#294a2e">GET /api/orders</text>
      <text x="140" y="137" fill="#66400f">POST /api/orders</text>
      <text x="140" y="219" fill="#294a2e">GET /api/orders/901</text>
      <text x="140" y="271" fill="#263e5a">PUT /api/orders/901</text>
      <text x="140" y="323" fill="#66400f">PATCH /api/orders/901</text>
      <text x="140" y="375" fill="#263e5a">DELETE /api/orders/901</text>
      <text x="140" y="427" fill="#294a2e">GET again, after DELETE</text>
    </g>

    <g stroke-width="2">
      <rect x="520" y="62" width="260" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="520" y="114" width="260" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="520" y="196" width="260" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="520" y="248" width="260" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="520" y="300" width="260" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="520" y="352" width="260" height="36" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="520" y="404" width="260" height="36" rx="8" fill="#fde8e6" stroke="#b5473a"/>
    </g>
    <g font-size="12.5" fill="#294a2e">
      <text x="650" y="85"><tspan font-weight="700">200 OK</tspan> + list of orders</text>
      <text x="650" y="137"><tspan font-weight="700">201 Created</tspan>, Location: /api/orders/902</text>
      <text x="650" y="219"><tspan font-weight="700">200 OK</tspan> + order 901</text>
      <text x="650" y="271"><tspan font-weight="700">200 OK</tspan>: whole order replaced</text>
      <text x="650" y="323"><tspan font-weight="700">200 OK</tspan>: some fields changed</text>
      <text x="650" y="375"><tspan font-weight="700">204 No Content</tspan>: deleted</text>
      <text x="650" y="427" fill="#6b241c"><tspan font-weight="700">404 Not Found</tspan>: it is gone</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M260 80H298" marker-end="url(#rrm-arrow)"/>
      <path d="M260 132H298" marker-end="url(#rrm-arrow)"/>
      <path d="M260 214H298" marker-end="url(#rrm-arrow)"/>
      <path d="M260 266H298" marker-end="url(#rrm-arrow)"/>
      <path d="M260 318H298" marker-end="url(#rrm-arrow)"/>
      <path d="M260 370H298" marker-end="url(#rrm-arrow)"/>
      <path d="M260 422H298" marker-end="url(#rrm-arrow)"/>
      <path d="M470 80H518" marker-end="url(#rrm-arrow)"/>
      <path d="M470 132H518" marker-end="url(#rrm-arrow)"/>
      <path d="M470 214H518" marker-end="url(#rrm-arrow)"/>
      <path d="M470 266H518" marker-end="url(#rrm-arrow)"/>
      <path d="M470 318H518" marker-end="url(#rrm-arrow)"/>
      <path d="M470 370H518" marker-end="url(#rrm-arrow)"/>
      <path d="M470 422H518" marker-end="url(#rrm-arrow)"/>
    </g>
    <text x="400" y="482" font-size="13" fill="#40566b">The URI names the resource, the method says what to do, and the status code reports the outcome.</text>
  </g>
</svg>
