<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="arc-title arc-desc">
  <title id="arc-title">Authentication, authorization, and ownership checks on every request</title>
  <desc id="arc-desc">A request is first authenticated; missing or invalid credentials return 401 Unauthorized. An authenticated user is then authorized by role; a disallowed action returns 403 Forbidden. Next the server checks that the user may access the specific record; if not it returns 404 Not Found or 403. Only then does the route handler run and return 200 OK.</desc>
  <defs>
    <marker id="arc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="760" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="110" y="24" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="49" font-size="14" font-weight="700" fill="#36424e">PATCH /api/orders/42</text>

    <path d="M230 84 340 116 230 148 120 116z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="113" font-size="12" font-weight="700" fill="#36424e">Authenticate:</text>
    <text x="230" y="127" font-size="12" font-weight="700" fill="#36424e">valid session/token?</text>

    <path d="M230 168 340 200 230 232 120 200z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="197" font-size="12" font-weight="700" fill="#36424e">Authorize:</text>
    <text x="230" y="211" font-size="12" font-weight="700" fill="#36424e">role allows action?</text>

    <path d="M230 252 340 284 230 316 120 284z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="281" font-size="12" font-weight="700" fill="#36424e">Ownership:</text>
    <text x="230" y="295" font-size="12" font-weight="700" fill="#36424e">may user edit #42?</text>

    <rect x="110" y="336" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="230" y="356" font-size="14" font-weight="700" fill="#66400f">Route handler</text>
    <text x="230" y="373" font-size="11.5" fill="#66400f">updates order 42</text>

    <rect x="110" y="404" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="230" y="424" font-size="14" font-weight="700" fill="#294a2e">200 OK</text>
    <text x="230" y="441" font-size="11.5" fill="#294a2e">updated order returned</text>

    <rect x="430" y="92" width="300" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="112" font-size="14" font-weight="700" fill="#6b241c">401 Unauthorized</text>
    <text x="580" y="129" font-size="11.5" fill="#6b241c">credentials missing, expired or invalid</text>

    <rect x="430" y="176" width="300" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="196" font-size="14" font-weight="700" fill="#6b241c">403 Forbidden</text>
    <text x="580" y="213" font-size="11.5" fill="#6b241c">known user, action not allowed</text>

    <rect x="430" y="260" width="300" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="280" font-size="14" font-weight="700" fill="#6b241c">404 Not Found (or 403)</text>
    <text x="580" y="297" font-size="11.5" fill="#6b241c">someone else's order stays hidden</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 64V82" marker-end="url(#arc-arrow)"/>
      <path d="M230 148V166" marker-end="url(#arc-arrow)"/>
      <path d="M230 232V250" marker-end="url(#arc-arrow)"/>
      <path d="M230 316V334" marker-end="url(#arc-arrow)"/>
      <path d="M230 384V402" marker-end="url(#arc-arrow)"/>
      <path d="M340 116H428" marker-end="url(#arc-arrow)"/>
      <path d="M340 200H428" marker-end="url(#arc-arrow)"/>
      <path d="M340 284H428" marker-end="url(#arc-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="240" y="162">yes: req.user set</text>
      <text x="240" y="246">yes</text>
      <text x="240" y="330">yes</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="384" y="109">no</text>
      <text x="384" y="193">no</text>
      <text x="384" y="277">no</text>
    </g>
    <text x="380" y="482" font-size="13" fill="#40566b">Identity comes from the verified session or token; each check fails closed.</text>
  </g>
</svg>
