<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="ehd-title ehd-desc">
  <title id="ehd-title">Deciding how to handle an error</title>
  <desc id="ehd-desc">When an error occurs, first ask whether it is an operational error, an expected failure in correct code. If it is operational and transient, such as a timeout, 503, or 429, retry with backoff only if the operation is idempotent; if it still fails, degrade gracefully or return 503 or 504. If it is operational and permanent, map it to a 4xx response such as 400, 404, or 409. If it is a programmer error, a bug, log full details and return a generic 500; if it escaped every handler as an uncaught exception or unhandled rejection, exit with a non-zero code so a supervisor restarts the process, then fix the bug and add a regression test.</desc>
  <defs>
    <marker id="ehd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="300" y="20" width="180" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="43" font-size="14" font-weight="700" fill="#36424e">An error occurs</text>

    <path d="M390 76 510 108 390 140 270 108z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="105" font-size="12" font-weight="700" fill="#36424e">Operational error?</text>
    <text x="390" y="120" font-size="11.5" fill="#36424e">expected in correct code</text>

    <path d="M200 168 300 200 200 232 100 200z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="197" font-size="12" font-weight="700" fill="#36424e">Transient?</text>
    <text x="200" y="212" font-size="11.5" fill="#36424e">timeout, 503, 429</text>

    <rect x="326" y="176" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="401" y="196" font-size="14" font-weight="700" fill="#263e5a">Map to a 4xx</text>
    <text x="401" y="213" font-size="11.5" fill="#263e5a">400, 404, 409 + message</text>

    <rect x="90" y="262" width="220" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="282" font-size="14" font-weight="700" fill="#66400f">Retry with backoff</text>
    <text x="200" y="299" font-size="11.5" fill="#66400f">only if the operation is idempotent</text>

    <rect x="90" y="340" width="220" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="360" font-size="14" font-weight="700" fill="#66400f">Still failing</text>
    <text x="200" y="377" font-size="11.5" fill="#66400f">degrade, or respond 503 / 504</text>

    <rect x="510" y="176" width="220" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="620" y="196" font-size="14" font-weight="700" fill="#6b241c">Programmer error (bug)</text>
    <text x="620" y="213" font-size="11.5" fill="#6b241c">log full details, generic 500</text>

    <rect x="510" y="262" width="220" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="620" y="282" font-size="14" font-weight="700" fill="#6b241c">Exit non-zero</text>
    <text x="620" y="299" font-size="11.5" fill="#6b241c">supervisor starts a fresh process</text>

    <rect x="510" y="340" width="220" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="620" y="360" font-size="14" font-weight="700" fill="#294a2e">Fix the bug</text>
    <text x="620" y="377" font-size="11.5" fill="#294a2e">and add a regression test</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 56V74" marker-end="url(#ehd-arrow)"/>
      <path d="M270 108H200V166" marker-end="url(#ehd-arrow)"/>
      <path d="M510 108H620V174" marker-end="url(#ehd-arrow)"/>
      <path d="M300 200H324" marker-end="url(#ehd-arrow)"/>
      <path d="M200 232V260" marker-end="url(#ehd-arrow)"/>
      <path d="M200 310V338" marker-end="url(#ehd-arrow)"/>
      <path d="M620 224V260" marker-end="url(#ehd-arrow)"/>
      <path d="M620 310V338" marker-end="url(#ehd-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="236" y="100">yes</text>
      <text x="548" y="100">no</text>
      <text x="312" y="192">no</text>
      <text x="214" y="252" text-anchor="start">yes</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="630" y="247">if uncaught or unhandled</text>
      <text x="630" y="329">then</text>
    </g>
    <text x="390" y="420" font-size="13" fill="#40566b">Handle operational errors; fix programmer errors, and restart when process state is unknown.</text>
  </g>
</svg>
