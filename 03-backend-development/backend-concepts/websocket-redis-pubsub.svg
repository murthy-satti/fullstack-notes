<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="wrp-title wrp-desc">
  <title id="wrp-title">Delivering WebSocket messages across instances with Redis pub/sub</title>
  <desc id="wrp-desc">A load balancer spreads WebSocket connections, so user A is connected to server 1 and user B to server 2. User A sends hi for room 7 to server 1. Server 1 publishes the message to the Redis channel chat:room-7. Redis delivers it to every server subscribed to that channel, including server 2. Server 2 holds user B's socket and pushes the message to B as a frame.</desc>
  <defs>
    <marker id="wrp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="22" width="200" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="41" font-size="14" font-weight="700" fill="#36424e">Load balancer</text>
    <text x="390" y="57" font-size="11.5" fill="#36424e">spreads new connections</text>

    <rect x="60" y="110" width="200" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="160" y="134" font-size="14" font-weight="700" fill="#66400f">Server 1</text>
    <text x="160" y="152" font-size="11.5" fill="#66400f">holds user A's socket</text>
    <rect x="520" y="110" width="200" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="620" y="134" font-size="14" font-weight="700" fill="#66400f">Server 2</text>
    <text x="620" y="152" font-size="11.5" fill="#66400f">holds user B's socket</text>

    <rect x="290" y="200" width="200" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="226" font-size="14" font-weight="700" fill="#463365">Redis pub/sub</text>
    <text x="390" y="246" font-size="11.5" fill="#463365">channel chat:room-7</text>
    <text x="390" y="262" font-size="11.5" fill="#463365">every server subscribes</text>

    <rect x="100" y="310" width="120" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="160" y="337" font-size="14" font-weight="700" fill="#263e5a">User A</text>
    <rect x="560" y="310" width="120" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="620" y="337" font-size="14" font-weight="700" fill="#263e5a">User B</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M340 66V86H160V108"/>
      <path d="M440 66V86H620V108"/>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 310V172" marker-end="url(#wrp-arrow)"/>
      <path d="M260 150H330V198" marker-end="url(#wrp-arrow)"/>
      <path d="M450 198V150H518" marker-end="url(#wrp-arrow)"/>
      <path d="M620 170V308" marker-end="url(#wrp-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="168" y="246" text-anchor="start">1. sends "hi"</text>
      <text x="168" y="262" text-anchor="start">to room-7</text>
      <text x="295" y="142">2. PUBLISH</text>
      <text x="484" y="142">3. delivered</text>
      <text x="612" y="246" text-anchor="end">4. pushes</text>
      <text x="612" y="262" text-anchor="end">a frame</text>
    </g>
    <text x="390" y="100" font-size="11.5" font-style="italic" fill="#40566b">open WebSockets</text>
    <text x="390" y="400" font-size="13" fill="#40566b">Each server publishes events and receives the ones for clients it holds, so A and B can talk.</text>
  </g>
</svg>
