<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="drl-title drl-desc">
  <title id="drl-title">Several app instances sharing one rate-limit counter in Redis</title>
  <desc id="drl-desc">Requests from user42 reach a load balancer that spreads them over instances A, B, and C. Each instance's rate-limit middleware runs an atomic INCR on the same Redis key for this user and minute, sets EXPIRE 60 when the count is 1, and reads back the shared count. If the count is at most 100 the request continues; above 100 it gets 429 with Retry-After. With separate in-memory counters instead, three instances would each allow 100, so 300 requests per minute would get through.</desc>
  <defs>
    <marker id="drl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="160" width="110" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="75" y="180" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <text x="75" y="197" font-size="11.5" fill="#36424e">user42</text>

    <rect x="170" y="160" width="120" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="180" font-size="14" font-weight="700" fill="#36424e">Load</text>
    <text x="230" y="197" font-size="14" font-weight="700" fill="#36424e">balancer</text>

    <rect x="330" y="70" width="140" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="90" font-size="14" font-weight="700" fill="#66400f">Instance A</text>
    <text x="400" y="107" font-size="11.5" fill="#66400f">limiter middleware</text>
    <rect x="330" y="160" width="140" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="180" font-size="14" font-weight="700" fill="#66400f">Instance B</text>
    <text x="400" y="197" font-size="11.5" fill="#66400f">limiter middleware</text>
    <rect x="330" y="250" width="140" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="270" font-size="14" font-weight="700" fill="#66400f">Instance C</text>
    <text x="400" y="287" font-size="11.5" fill="#66400f">limiter middleware</text>

    <rect x="570" y="70" width="190" height="228" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="665" y="98" font-size="14" font-weight="700" fill="#463365">Redis (shared)</text>
    <text x="665" y="132" font-size="11.5" fill="#463365">key ratelimit:user42:</text>
    <text x="665" y="148" font-size="11.5" fill="#463365">202611071432</text>
    <text x="665" y="182" font-size="11.5" font-weight="700" fill="#463365">INCR is atomic</text>
    <text x="665" y="200" font-size="11.5" fill="#463365">one count for all instances</text>
    <text x="665" y="234" font-size="11.5" fill="#463365">EXPIRE 60 when count = 1</text>
    <text x="665" y="268" font-size="11.5" fill="#463365">current count: 101</text>

    <rect x="20" y="326" width="370" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="205" y="346" font-size="13" font-weight="700" fill="#294a2e">count ≤ 100: next()</text>
    <text x="205" y="363" font-size="11.5" fill="#294a2e">count &gt; 100: 429 + Retry-After</text>
    <rect x="410" y="326" width="350" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="585" y="346" font-size="13" font-weight="700" fill="#6b241c">In-memory counters per instance instead</text>
    <text x="585" y="363" font-size="11.5" fill="#6b241c">3 instances × 100 = 300 requests allowed</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M130 184H168" marker-end="url(#drl-arrow)"/>
      <path d="M290 184H310V94H328" marker-end="url(#drl-arrow)"/>
      <path d="M290 184H328" marker-end="url(#drl-arrow)"/>
      <path d="M310 184V274H328" marker-end="url(#drl-arrow)"/>
      <path d="M470 94H568" marker-end="url(#drl-arrow)"/>
      <path d="M470 184H568" marker-end="url(#drl-arrow)"/>
      <path d="M470 274H568" marker-end="url(#drl-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="519" y="86">INCR, count</text>
      <text x="519" y="176">INCR, count</text>
      <text x="519" y="266">INCR, count</text>
    </g>
    <text x="390" y="404" font-size="13" fill="#40566b">Every instance increments the same key, so the limit holds no matter which instance serves the request.</text>
  </g>
</svg>
