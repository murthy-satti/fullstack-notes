<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 0 800 412" role="img" aria-labelledby="rqj-title rqj-desc">
  <title id="rqj-title">The journey of one HTTP request through a production backend</title>
  <desc id="rqj-desc">The browser parses the URL, looks up DNS, completes the TCP and TLS handshakes, and sends the request. An optional CDN returns a fresh cached copy if it has one; otherwise the request goes to a load balancer or reverse proxy, which terminates TLS, picks a healthy app server, and adds X-Forwarded headers. In the app server, middleware, the router, the controller, and the service run in order, and the service reads the cache and, on a miss, the database. The response travels back through every hop to the browser.</desc>
  <defs>
    <marker id="rqj-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rqj-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="412" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="16" y="60" width="144" height="230" rx="10" fill="#e5efff" stroke="#4774aa"/>
      <rect x="184" y="60" width="124" height="230" rx="10" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="332" y="60" width="150" height="230" rx="10" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="506" y="60" width="150" height="230" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="680" y="60" width="104" height="230" rx="10" fill="#e8f5e9" stroke="#53845b"/>
    </g>
    <text x="88" y="84" font-size="14" font-weight="700" fill="#263e5a">Browser</text>
    <text x="246" y="84" font-size="14" font-weight="700" fill="#36424e">CDN / edge</text>
    <text x="246" y="100" font-size="11.5" fill="#36424e">(optional)</text>
    <text x="407" y="84" font-size="14" font-weight="700" fill="#36424e">Load balancer</text>
    <text x="407" y="100" font-size="11.5" fill="#36424e">or reverse proxy</text>
    <text x="581" y="84" font-size="14" font-weight="700" fill="#66400f">App server</text>
    <text x="581" y="100" font-size="11.5" fill="#66400f">Node.js + Express</text>
    <text x="732" y="84" font-size="14" font-weight="700" fill="#294a2e">Data</text>

    <g fill="#ffffff" stroke-width="1.5">
      <rect x="28" y="96" width="120" height="30" rx="6" stroke="#4774aa"/>
      <rect x="28" y="134" width="120" height="30" rx="6" stroke="#4774aa"/>
      <rect x="28" y="172" width="120" height="30" rx="6" stroke="#4774aa"/>
      <rect x="28" y="210" width="120" height="30" rx="6" stroke="#4774aa"/>
      <rect x="28" y="248" width="120" height="30" rx="6" stroke="#4774aa"/>
      <rect x="344" y="122" width="126" height="34" rx="6" stroke="#8a96a3"/>
      <rect x="344" y="166" width="126" height="34" rx="6" stroke="#8a96a3"/>
      <rect x="344" y="210" width="126" height="34" rx="6" stroke="#8a96a3"/>
      <rect x="518" y="110" width="126" height="30" rx="6" stroke="#bd7a20"/>
      <rect x="518" y="150" width="126" height="30" rx="6" stroke="#bd7a20"/>
      <rect x="518" y="190" width="126" height="30" rx="6" stroke="#bd7a20"/>
      <rect x="518" y="230" width="126" height="30" rx="6" stroke="#bd7a20"/>
      <rect x="690" y="118" width="84" height="44" rx="6" stroke="#53845b"/>
      <rect x="690" y="196" width="84" height="44" rx="6" stroke="#53845b"/>
    </g>
    <g font-size="12" fill="#263e5a">
      <text x="88" y="115">1 parse URL</text>
      <text x="88" y="153">2 DNS lookup</text>
      <text x="88" y="191">3 TCP handshake</text>
      <text x="88" y="229">4 TLS handshake</text>
      <text x="88" y="267">5 send request</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="407" y="143">terminates TLS</text>
      <text x="407" y="187">picks healthy app</text>
      <text x="407" y="231">adds X-Forwarded-*</text>
    </g>
    <g font-size="12" fill="#66400f">
      <text x="581" y="129">6 middleware</text>
      <text x="581" y="169">7 router</text>
      <text x="581" y="209">8 controller</text>
      <text x="581" y="249">9 service</text>
    </g>
    <text x="732" y="137" font-size="12" font-weight="700" fill="#294a2e">10 cache</text>
    <text x="732" y="153" font-size="11" fill="#294a2e">Redis</text>
    <text x="732" y="215" font-size="12" font-weight="700" fill="#294a2e">database</text>
    <text x="732" y="231" font-size="11" fill="#294a2e">on a miss</text>

    <path d="M246 140 296 175 246 210 196 175z" fill="#ffffff" stroke="#8a96a3" stroke-width="2"/>
    <text x="246" y="172" font-size="12" font-weight="700" fill="#36424e">fresh</text>
    <text x="246" y="186" font-size="12" font-weight="700" fill="#36424e">copy?</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 175H194" marker-end="url(#rqj-arrow)"/>
      <path d="M296 175H330" marker-end="url(#rqj-arrow)"/>
      <path d="M482 175H504" marker-end="url(#rqj-arrow)"/>
      <path d="M656 175H678" marker-end="url(#rqj-arrow)"/>
      <path d="M732 162V194" marker-end="url(#rqj-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4">
      <path d="M732 290V330H88V294" marker-end="url(#rqj-arrow-dash)"/>
      <path d="M246 210V330"/>
    </g>
    <circle cx="246" cy="330" r="3.5" fill="#60788d"/>

    <text x="314" y="167" font-size="12" font-weight="700" fill="#40566b">no</text>
    <text x="254" y="232" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">yes</text>
    <text x="740" y="182" font-size="11.5" fill="#40566b" text-anchor="start">miss</text>
    <text x="410" y="352" font-size="12" fill="#36424e">11 response: status code, headers, JSON body   ·   12 browser parses it and updates the page</text>
    <text x="400" y="392" font-size="13" fill="#40566b">A fresh CDN copy answers early; otherwise the request crosses every hop and the response returns the same way.</text>
  </g>
</svg>
