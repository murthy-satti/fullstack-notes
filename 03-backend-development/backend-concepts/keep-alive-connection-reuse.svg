<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="kac-title kac-desc">
  <title id="kac-title">Keep-alive reuses one connection instead of repeating handshakes</title>
  <desc id="kac-desc">Without keep-alive, each of three requests pays for a TCP handshake and a TLS handshake before the GET is sent. With keep-alive, one TCP and one TLS handshake are followed by GET 1, GET 2, and GET 3 on the same connection, finishing much sooner and saving two TCP and two TLS handshakes.</desc>
  <defs>
    <marker id="kac-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="250" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="100" y="78" font-size="13" font-weight="700" fill="#40566b">New connection</text>
    <text x="100" y="95" font-size="11.5" fill="#40566b">for every request</text>
    <text x="100" y="158" font-size="13" font-weight="700" fill="#40566b">Keep-alive</text>
    <text x="100" y="175" font-size="11.5" fill="#40566b">one connection reused</text>

    <g stroke-width="2">
      <rect x="200" y="62" width="60" height="44" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="260" y="62" width="60" height="44" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="320" y="62" width="70" height="44" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="390" y="62" width="60" height="44" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="450" y="62" width="60" height="44" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="510" y="62" width="70" height="44" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="580" y="62" width="60" height="44" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="640" y="62" width="60" height="44" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="700" y="62" width="70" height="44" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="200" y="142" width="60" height="44" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="260" y="142" width="60" height="44" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="320" y="142" width="70" height="44" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="390" y="142" width="70" height="44" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="460" y="142" width="70" height="44" rx="6" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="230" y="89" fill="#36424e">TCP</text>
      <text x="290" y="89" fill="#463365">TLS</text>
      <text x="355" y="89" fill="#263e5a">GET 1</text>
      <text x="420" y="89" fill="#36424e">TCP</text>
      <text x="480" y="89" fill="#463365">TLS</text>
      <text x="545" y="89" fill="#263e5a">GET 2</text>
      <text x="610" y="89" fill="#36424e">TCP</text>
      <text x="670" y="89" fill="#463365">TLS</text>
      <text x="735" y="89" fill="#263e5a">GET 3</text>
      <text x="230" y="169" fill="#36424e">TCP</text>
      <text x="290" y="169" fill="#463365">TLS</text>
      <text x="355" y="169" fill="#263e5a">GET 1</text>
      <text x="425" y="169" fill="#263e5a">GET 2</text>
      <text x="495" y="169" fill="#263e5a">GET 3</text>
    </g>

    <path d="M534 164H766" fill="none" stroke="#53845b" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M766 154V174" fill="none" stroke="#53845b" stroke-width="2"/>
    <text x="650" y="156" font-size="12" font-weight="700" fill="#294a2e">time saved</text>
    <text x="650" y="182" font-size="11.5" fill="#294a2e">2 TCP + 2 TLS handshakes</text>

    <path d="M200 208H776" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#kac-arrow)"/>
    <text x="760" y="226" font-size="11.5" fill="#40566b" text-anchor="end">time</text>
    <text x="400" y="38" font-size="12" fill="#36424e">Each handshake costs at least one network round trip before any request data flows.</text>
  </g>
</svg>
