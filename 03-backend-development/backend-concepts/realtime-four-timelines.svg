<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="rt4-title rt4-desc">
  <title id="rt4-title">Short polling, long polling, SSE, and WebSocket as timelines</title>
  <desc id="rt4-desc">Four timelines show how an event on the server reaches the client. With short polling every 10 seconds, the polls before the event return empty lists and the event arrives only with the next poll, up to one interval late. With long polling the server holds the request until the event happens, responds at once, and the client immediately sends the next request, which is held until a timeout returns 204. With Server-Sent Events one request opens a text/event-stream response and the server writes each event into it. With WebSocket an upgrade request gets 101 Switching Protocols, then either side sends frames at any time, with ping and pong as a heartbeat.</desc>
  <defs>
    <marker id="rt4-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rt4-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="490" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5">
      <rect x="12" y="20" width="188" height="440" rx="10"/>
      <rect x="206" y="20" width="188" height="440" rx="10"/>
      <rect x="400" y="20" width="188" height="440" rx="10"/>
      <rect x="594" y="20" width="188" height="440" rx="10"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="106" y="44" fill="#36424e">Short polling</text>
      <text x="300" y="44" fill="#263e5a">Long polling</text>
      <text x="494" y="44" fill="#463365">SSE</text>
      <text x="688" y="44" fill="#294a2e">WebSocket</text>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="50" y="68">client</text><text x="162" y="68">server</text>
      <text x="244" y="68">client</text><text x="356" y="68">server</text>
      <text x="438" y="68">client</text><text x="550" y="68">server</text>
      <text x="632" y="68">client</text><text x="744" y="68">server</text>
    </g>
    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M50 76V412M162 76V412M244 76V412M356 76V412M438 76V412M550 76V412M632 76V412M744 76V412"/>
    </g>
    <rect x="352" y="98" width="8" height="98" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="352" y="222" width="8" height="158" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="546" y="104" width="8" height="300" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="740" y="104" width="8" height="300" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>

    <g fill="#bd7a20">
      <circle cx="162" cy="196" r="5"/><circle cx="356" cy="196" r="5"/><circle cx="550" cy="196" r="5"/><circle cx="744" cy="196" r="5"/>
      <circle cx="550" cy="298" r="5"/><circle cx="744" cy="298" r="5"/>
    </g>
    <g font-size="11" font-weight="700" fill="#66400f" text-anchor="start">
      <text x="168" y="192">event</text><text x="362" y="192">event</text><text x="556" y="192">event</text><text x="750" y="192">event</text>
      <text x="556" y="294">event</text><text x="750" y="294">event</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="1.8" stroke-linecap="round">
      <path d="M50 90L160 98" marker-end="url(#rt4-arrow)"/>
      <path d="M50 170L160 178" marker-end="url(#rt4-arrow)"/>
      <path d="M50 250L160 258" marker-end="url(#rt4-arrow)"/>
      <path d="M50 330L160 338" marker-end="url(#rt4-arrow)"/>
      <path d="M244 90L350 98" marker-end="url(#rt4-arrow)"/>
      <path d="M244 214L350 222" marker-end="url(#rt4-arrow)"/>
      <path d="M438 90L544 98" marker-end="url(#rt4-arrow)"/>
      <path d="M632 90L738 98" marker-end="url(#rt4-arrow)"/>
      <path d="M632 240L738 248" marker-end="url(#rt4-arrow)"/>
      <path d="M632 372L738 380" marker-end="url(#rt4-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M162 100L52 108" marker-end="url(#rt4-ret)"/>
      <path d="M162 180L52 188" marker-end="url(#rt4-ret)"/>
      <path d="M162 260L52 268" marker-end="url(#rt4-ret)"/>
      <path d="M162 340L52 348" marker-end="url(#rt4-ret)"/>
      <path d="M352 198L246 206" marker-end="url(#rt4-ret)"/>
      <path d="M352 382L246 390" marker-end="url(#rt4-ret)"/>
      <path d="M546 106L440 114" marker-end="url(#rt4-ret)"/>
      <path d="M546 198L440 206" marker-end="url(#rt4-ret)"/>
      <path d="M546 300L440 308" marker-end="url(#rt4-ret)"/>
      <path d="M740 106L634 114" marker-end="url(#rt4-ret)"/>
      <path d="M740 198L634 206" marker-end="url(#rt4-ret)"/>
      <path d="M740 300L634 308" marker-end="url(#rt4-ret)"/>
      <path d="M740 336L634 344" marker-end="url(#rt4-ret)"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="106" y="87">GET</text>
      <text x="106" y="124">[ ]</text>
      <text x="106" y="204">[ ] (too early)</text>
      <text x="106" y="284" font-weight="700" fill="#66400f">[event] late</text>
      <text x="106" y="364">[ ]</text>
      <text x="300" y="87">GET ?since=41</text>
      <text x="300" y="150">held open</text>
      <text x="300" y="194">200 [event]</text>
      <text x="300" y="238">GET ?since=42</text>
      <text x="300" y="304">held open</text>
      <text x="300" y="379">204 timeout</text>
      <text x="494" y="87">GET</text>
      <text x="494" y="130">200 event-stream</text>
      <text x="494" y="222">data: event</text>
      <text x="494" y="256">stream stays open</text>
      <text x="494" y="324">data: event</text>
      <text x="688" y="87">GET Upgrade</text>
      <text x="688" y="130">101 Switching</text>
      <text x="688" y="222">frame</text>
      <text x="688" y="264">frame</text>
      <text x="688" y="324">frame</text>
      <text x="688" y="360">ping</text>
      <text x="688" y="396">pong</text>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="106" y="432">late by up to</text><text x="106" y="448">one interval</text>
      <text x="300" y="432">held until data</text><text x="300" y="448">or timeout</text>
      <text x="494" y="432">one response,</text><text x="494" y="448">many events</text>
      <text x="688" y="432">either side sends</text><text x="688" y="448">at any time</text>
    </g>
    <text x="400" y="480" font-size="12.5" fill="#40566b">Time runs downward; the amber dot is the moment the event happens on the server.</text>
  </g>
</svg>
