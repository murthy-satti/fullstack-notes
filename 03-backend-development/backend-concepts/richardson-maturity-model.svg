<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="rmm-title rmm-desc">
  <title id="rmm-title">The Richardson Maturity Model as a staircase</title>
  <desc id="rmm-desc">Level 0 sends every call to one URL with one method, such as POST /api with an action field. Level 1 adds a URL per resource but still uses POST for everything. Level 2 adds proper HTTP methods and status codes, such as GET returning 200 and DELETE returning 204; most RESTful APIs stop here. Level 3 adds hypermedia links in responses that tell the client which actions it can take next.</desc>
  <defs>
    <marker id="rmm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e6ebf1">
      <rect x="20" y="300" width="176" height="76"/>
      <rect x="214" y="220" width="176" height="156"/>
      <rect x="408" y="140" width="176" height="236"/>
      <rect x="602" y="60" width="176" height="316"/>
    </g>
    <path d="M20 376H778" fill="none" stroke="#8a96a3" stroke-width="2"/>

    <rect x="20" y="284" width="176" height="92" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="108" y="305" font-size="14" font-weight="700" fill="#36424e">Level 0</text>
    <text x="108" y="322" font-size="11.5" fill="#36424e">one URL, one method</text>
    <text x="108" y="344" font-size="11.5" font-weight="700" fill="#36424e">POST /api</text>
    <text x="108" y="360" font-size="11" fill="#36424e">{"action": "getOrder"}</text>

    <rect x="214" y="204" width="176" height="92" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="302" y="225" font-size="14" font-weight="700" fill="#263e5a">Level 1: resources</text>
    <text x="302" y="242" font-size="11.5" fill="#263e5a">a URL per resource</text>
    <text x="302" y="264" font-size="11.5" font-weight="700" fill="#263e5a">POST /api/orders/901</text>
    <text x="302" y="280" font-size="11" fill="#263e5a">still POST for everything</text>

    <rect x="408" y="124" width="176" height="92" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="496" y="145" font-size="14" font-weight="700" fill="#294a2e">Level 2: HTTP verbs</text>
    <text x="496" y="162" font-size="11.5" fill="#294a2e">methods + status codes</text>
    <text x="496" y="184" font-size="11.5" font-weight="700" fill="#294a2e">GET /orders/901: 200</text>
    <text x="496" y="200" font-size="11.5" font-weight="700" fill="#294a2e">DELETE /orders/901: 204</text>

    <rect x="602" y="44" width="176" height="92" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="690" y="65" font-size="14" font-weight="700" fill="#463365">Level 3: hypermedia</text>
    <text x="690" y="82" font-size="11.5" fill="#463365">links to next actions</text>
    <text x="690" y="104" font-size="11.5" font-weight="700" fill="#463365">"_links": {</text>
    <text x="690" y="120" font-size="11" fill="#463365">"cancel": {"href": ...} }</text>

    <rect x="420" y="238" width="152" height="26" rx="13" fill="#ffffff" stroke="#53845b" stroke-width="1.5"/>
    <text x="496" y="256" font-size="11.5" font-weight="700" fill="#294a2e">most "RESTful" APIs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 284 C150 254 180 250 212 250" marker-end="url(#rmm-arrow)"/>
      <path d="M344 204 C344 174 374 170 406 170" marker-end="url(#rmm-arrow)"/>
      <path d="M538 124 C538 94 568 90 600 90" marker-end="url(#rmm-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="end">
      <text x="140" y="262">+ resources</text>
      <text x="334" y="182">+ verbs, codes</text>
      <text x="528" y="102">+ links</text>
    </g>
    <text x="400" y="404" font-size="13" fill="#40566b">Each level adds one idea to the one below; most well-designed public APIs stop at level 2.</text>
  </g>
</svg>
