<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="wsu-title wsu-desc">
  <title id="wsu-title">A WebSocket connection from upgrade to close</title>
  <desc id="wsu-desc">The browser sends GET /chat with Upgrade: websocket, a Sec-WebSocket-Key, its Origin, and its cookies. The server checks the Origin and authentication and replies 101 Switching Protocols with Sec-WebSocket-Accept. From then on, both sides exchange WebSocket frames over the same TCP connection: the browser sends a join message, the server pushes a new message, the server sends a ping every 30 seconds and the browser answers with a pong automatically. To finish, one side sends a close frame with code 1000, the other replies with a close frame, and the TCP connection is closed.</desc>
  <defs>
    <marker id="wsu-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="wsu-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="760" height="510" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="66" width="700" height="112" rx="8" fill="#eef1f5"/>
    <rect x="30" y="186" width="700" height="258" rx="8" fill="#e8f5e9" opacity="0.6"/>
    <text x="44" y="84" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="start">HTTP handshake</text>
    <text x="44" y="204" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">WebSocket frames, both directions, same TCP connection</text>

    <rect x="100" y="20" width="120" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="160" y="42" font-size="13" font-weight="700" fill="#263e5a">Browser</text>
    <rect x="540" y="20" width="120" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="600" y="42" font-size="13" font-weight="700" fill="#66400f">Server</text>
    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M160 54V460M600 54V460"/>
    </g>

    <rect x="606" y="118" width="116" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="664" y="134" font-size="11.5" font-weight="700" fill="#66400f">check Origin</text>
    <text x="664" y="150" font-size="11.5" fill="#66400f">and auth cookie</text>

    <g font-size="11.5" fill="#36424e">
      <text x="380" y="100">GET /chat  Upgrade: websocket</text>
      <text x="380" y="126">Sec-WebSocket-Key, Origin, cookie</text>
      <text x="380" y="156">101 Switching Protocols</text>
      <text x="380" y="226">text frame: join room-7</text>
      <text x="380" y="262">text frame: new message</text>
      <text x="380" y="298">ping (every 30 s)</text>
      <text x="380" y="334">pong (sent automatically)</text>
      <text x="380" y="378">close frame, code 1000</text>
      <text x="380" y="414">close frame, code 1000</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M160 108H598" marker-end="url(#wsu-arrow)"/>
      <path d="M160 232H598" marker-end="url(#wsu-arrow)"/>
      <path d="M160 340H598" marker-end="url(#wsu-arrow)"/>
      <path d="M160 384H598" marker-end="url(#wsu-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M600 162H162" marker-end="url(#wsu-ret)"/>
      <path d="M600 268H162" marker-end="url(#wsu-ret)"/>
      <path d="M600 304H162" marker-end="url(#wsu-ret)"/>
      <path d="M600 420H162" marker-end="url(#wsu-ret)"/>
    </g>
    <text x="380" y="476" font-size="12" font-weight="700" fill="#40566b">TCP connection closed</text>
    <text x="380" y="498" font-size="13" fill="#40566b">After 101, HTTP is finished: the same connection carries small frames in both directions.</text>
  </g>
</svg>
