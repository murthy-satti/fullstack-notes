<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" role="img" aria-labelledby="cps-title cps-desc">
  <title id="cps-title">A CORS preflight followed by the actual request</title>
  <desc id="cps-desc">Page JavaScript calls fetch with PATCH, an Authorization header, and a JSON body. The browser first sends OPTIONS /api/orders/42 with Origin, Access-Control-Request-Method PATCH, and Access-Control-Request-Headers authorization and content-type. The server answers 204 No Content with Access-Control-Allow-Origin, Allow-Methods, Allow-Headers, and Max-Age 600, and the browser caches the approval. The browser then sends the real PATCH with Origin, Authorization, and Content-Type. The server answers 200 OK with Access-Control-Allow-Origin, the browser confirms it matches, and the page's JavaScript can read the response.</desc>
  <defs>
    <marker id="cps-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cps-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="590" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="20" y="20" width="120" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="230" y="20" width="140" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="610" y="20" width="180" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
    </g>
    <text x="80" y="43" font-size="14" font-weight="700" fill="#66400f">Page JS</text>
    <text x="300" y="43" font-size="14" font-weight="700" fill="#263e5a">Browser</text>
    <text x="700" y="43" font-size="14" font-weight="700" fill="#36424e">api.example.com</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M80 56V556"/>
      <path d="M300 56V556"/>
      <path d="M700 56V556"/>
    </g>

    <rect x="196" y="304" width="208" height="26" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="300" y="322" font-size="11.5" font-weight="700" fill="#294a2e">approved; cached for 600 s</text>
    <rect x="196" y="482" width="208" height="26" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="300" y="500" font-size="11.5" font-weight="700" fill="#294a2e">Allow-Origin matches</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M80 92H298" marker-end="url(#cps-arrow)"/>
      <path d="M300 132H698" marker-end="url(#cps-arrow)"/>
      <path d="M300 366H698" marker-end="url(#cps-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4">
      <path d="M700 232H302" marker-end="url(#cps-arrow-dash)"/>
      <path d="M700 450H302" marker-end="url(#cps-arrow-dash)"/>
      <path d="M300 536H82" marker-end="url(#cps-arrow-dash)"/>
    </g>

    <text x="190" y="84" font-size="11.5" fill="#40566b">fetch(): PATCH + token + JSON</text>
    <text x="190" y="528" font-size="11.5" fill="#40566b">response readable</text>

    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="500" y="124">1. OPTIONS /api/orders/42 (preflight)</text>
      <text x="500" y="358">3. PATCH /api/orders/42 (actual request)</text>
    </g>
    <g font-size="12.5" font-weight="700" fill="#294a2e">
      <text x="500" y="224">2. 204 No Content</text>
      <text x="500" y="442">4. 200 OK</text>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="316" y="150">Origin: https://app.example.com</text>
      <text x="316" y="165">Access-Control-Request-Method: PATCH</text>
      <text x="316" y="180">Access-Control-Request-Headers:</text>
      <text x="316" y="195">    authorization, content-type</text>
      <text x="316" y="250">Access-Control-Allow-Origin: https://app.example.com</text>
      <text x="316" y="265">Access-Control-Allow-Methods: GET, POST, PATCH, DELETE</text>
      <text x="316" y="280">Access-Control-Allow-Headers: Authorization, Content-Type</text>
      <text x="316" y="295">Access-Control-Max-Age: 600</text>
      <text x="316" y="384">Origin: https://app.example.com</text>
      <text x="316" y="399">Authorization: Bearer eyJ...</text>
      <text x="316" y="414">Content-Type: application/json</text>
      <text x="316" y="468">Access-Control-Allow-Origin: https://app.example.com</text>
    </g>
    <text x="400" y="578" font-size="13" fill="#40566b">The PATCH is sent only after the preflight approves it; both responses need Allow-Origin.</text>
  </g>
</svg>
