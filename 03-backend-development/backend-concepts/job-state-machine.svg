<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="jsm-title jsm-desc">
  <title id="jsm-title">The states a background job moves through</title>
  <desc id="jsm-desc">A new job enters the waiting state. A worker takes it and it becomes active. If the handler succeeds, the job is completed. If it throws and attempts are left, the job moves to delayed, waits out its backoff, and returns to waiting for another attempt. If it throws and no attempts are left, it ends in the failed or dead-letter state, where it is kept for inspection and replay.</desc>
  <defs>
    <marker id="jsm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="56" width="150" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="115" y="79" font-size="13" font-weight="700" fill="#36424e">queue.add(job)</text>

    <rect x="40" y="150" width="150" height="56" rx="12" fill="#eef1f5" stroke="#8a96a3" stroke-width="2.5"/>
    <text x="115" y="176" font-size="15" font-weight="700" fill="#36424e">waiting</text>
    <text x="115" y="194" font-size="11.5" fill="#36424e">in the queue</text>

    <rect x="300" y="150" width="150" height="56" rx="12" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="375" y="176" font-size="15" font-weight="700" fill="#66400f">active</text>
    <text x="375" y="194" font-size="11.5" fill="#66400f">a worker is running it</text>

    <rect x="600" y="60" width="160" height="56" rx="12" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <text x="680" y="86" font-size="15" font-weight="700" fill="#294a2e">completed</text>
    <text x="680" y="104" font-size="11.5" fill="#294a2e">result stored</text>

    <rect x="600" y="240" width="160" height="56" rx="12" fill="#fde8e6" stroke="#b5473a" stroke-width="2.5"/>
    <text x="680" y="266" font-size="15" font-weight="700" fill="#6b241c">failed / DLQ</text>
    <text x="680" y="284" font-size="11.5" fill="#6b241c">kept for inspection, replay</text>

    <rect x="300" y="300" width="150" height="56" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="2.5"/>
    <text x="375" y="326" font-size="15" font-weight="700" fill="#463365">delayed</text>
    <text x="375" y="344" font-size="11.5" fill="#463365">waiting out the backoff</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M115 92V148" marker-end="url(#jsm-arrow)"/>
      <path d="M190 178H298" marker-end="url(#jsm-arrow)"/>
      <path d="M450 166H525V88H598" marker-end="url(#jsm-arrow)"/>
      <path d="M450 190H525V268H598" marker-end="url(#jsm-arrow)"/>
      <path d="M375 206V298" marker-end="url(#jsm-arrow)"/>
      <path d="M300 328H115V208" marker-end="url(#jsm-arrow)"/>
    </g>
    <g font-size="12" fill="#36424e">
      <text x="244" y="170" font-weight="700">worker takes it</text>
      <text x="562" y="80" font-weight="700">succeeds</text>
      <text x="533" y="232" text-anchor="start" font-weight="700">throws,</text>
      <text x="533" y="248" text-anchor="start">none left</text>
      <text x="385" y="246" text-anchor="start" font-weight="700">throws,</text>
      <text x="385" y="262" text-anchor="start">attempts left</text>
      <text x="208" y="320" font-weight="700">backoff elapsed</text>
    </g>
    <text x="390" y="400" font-size="13" fill="#40566b">Jobs added with a delay start in delayed; a job may run more than once, so make it idempotent.</text>
  </g>
</svg>
