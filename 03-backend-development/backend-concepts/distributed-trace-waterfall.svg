<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="dtw-title dtw-desc">
  <title id="dtw-title">One distributed trace across services and its span waterfall</title>
  <desc id="dtw-desc">A POST /checkout request enters through the API gateway, which calls the orders service, which queries its database and calls the payments service, which calls the card network. Each hop forwards the same trace ID in the traceparent header. The waterfall shows the spans: the whole request takes 1,820 milliseconds; validate cart takes 40, the cart query 25, the payments charge 1,500 of which the card network call takes 1,460, and the order insert 30. The card network call is the slow part.</desc>
  <defs>
    <marker id="dtw-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="34" font-size="13" font-weight="700" fill="#40566b">trace ID 4bf92f3577b34da6a3ce929d0e0e4736 travels in the traceparent header</text>

    <rect x="20" y="52" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="90" y="79" font-size="14" font-weight="700" fill="#36424e">API gateway</text>
    <rect x="220" y="52" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="290" y="79" font-size="14" font-weight="700" fill="#263e5a">orders</text>
    <rect x="420" y="52" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="490" y="79" font-size="14" font-weight="700" fill="#66400f">payments</text>
    <rect x="620" y="52" width="160" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="700" y="79" font-size="14" font-weight="700" fill="#66400f">card network</text>
    <rect x="220" y="132" width="140" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="290" y="157" font-size="14" font-weight="700" fill="#463365">orders DB</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M160 74H218" marker-end="url(#dtw-arrow)"/>
      <path d="M360 74H418" marker-end="url(#dtw-arrow)"/>
      <path d="M560 74H618" marker-end="url(#dtw-arrow)"/>
      <path d="M290 96V130" marker-end="url(#dtw-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="189" y="112">traceparent</text>
      <text x="389" y="112">traceparent</text>
      <text x="589" y="112">traceparent</text>
    </g>

    <text x="400" y="206" font-size="13" font-weight="700" fill="#40566b">Span waterfall for POST /checkout</text>
    <g stroke="#c9d2dc" stroke-width="1">
      <path d="M200 216V406M354 216V406M508 216V406M662 216V406"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="236">POST /checkout</text>
      <text x="24" y="266">orders: validate cart</text>
      <text x="24" y="296">orders: SELECT cart (db)</text>
      <text x="24" y="326">payments: POST /charge</text>
      <text x="36" y="356">card network call</text>
      <text x="24" y="386">orders: INSERT order (db)</text>
    </g>
    <rect x="200" y="224" width="560" height="16" rx="3" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="203" y="254" width="12" height="16" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="215" y="284" width="8" height="16" rx="2" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="228" y="314" width="461" height="16" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="234" y="344" width="449" height="16" rx="3" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <rect x="692" y="374" width="9" height="16" rx="2" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="223" y="267">40 ms</text>
      <text x="231" y="297">25 ms</text>
      <text x="694" y="327">1,500 ms</text>
      <text x="688" y="357">1,460 ms</text>
      <text x="709" y="387">30 ms</text>
    </g>
    <text x="480" y="236" font-size="11.5" font-weight="700" fill="#36424e">1,820 ms total</text>
    <text x="458" y="356" font-size="11.5" font-weight="700" fill="#6b241c">the slow part</text>
    <g font-size="11" fill="#40566b">
      <text x="200" y="422">0</text>
      <text x="354" y="422">500 ms</text>
      <text x="508" y="422">1,000 ms</text>
      <text x="662" y="422">1,500 ms</text>
    </g>
    <text x="400" y="454" font-size="13" fill="#40566b">Each bar is a span; nested spans show which call inside a service took the time.</text>
  </g>
</svg>
