<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="svt-title svt-desc">
  <title id="svt-title">Session-based versus token-based authentication</title>
  <desc id="svt-desc">In session-based authentication the browser logs in, the server creates a session ID in a session store and sets it in a cookie; later requests send the cookie and the server looks the session up; logout deletes the session so it is revoked immediately. In token-based authentication the server signs a JWT and returns it; later requests send it in the Authorization header and the server verifies the signature and expiry without a lookup; logout only discards the token on the client, so a copied token keeps working until it expires.</desc>
  <defs>
    <marker id="svt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="svt-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="490" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="376" height="458" rx="10" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <rect x="408" y="16" width="376" height="458" rx="10" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <text x="204" y="42" font-size="14" font-weight="700" fill="#263e5a">Session-based</text>
    <text x="596" y="42" font-size="14" font-weight="700" fill="#463365">Token-based (JWT)</text>

    <rect x="28" y="56" width="84" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="70" y="75" font-size="13" font-weight="700" fill="#36424e">Browser</text>
    <rect x="158" y="56" width="84" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="75" font-size="13" font-weight="700" fill="#66400f">Server</text>
    <rect x="280" y="56" width="100" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="330" y="75" font-size="13" font-weight="700" fill="#263e5a">Session store</text>

    <rect x="438" y="56" width="104" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="490" y="75" font-size="13" font-weight="700" fill="#36424e">Client</text>
    <rect x="638" y="56" width="104" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="690" y="75" font-size="13" font-weight="700" fill="#66400f">API server</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M70 84V436M200 84V436M330 84V436M490 84V436M690 84V436"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="135" y="124">1. POST /login</text>
      <text x="265" y="160">2. create sid</text>
      <text x="135" y="196">3. Set-Cookie: sid</text>
      <text x="135" y="244">4. GET /api/orders</text>
      <text x="135" y="262">Cookie: sid</text>
      <text x="265" y="286">5. look up sid</text>
      <text x="265" y="320">{ userId }</text>
      <text x="135" y="350">6. 200 OK</text>
      <text x="135" y="388">7. POST /logout</text>
      <text x="265" y="416">8. delete sid</text>

      <text x="590" y="124">1. POST /login</text>
      <text x="590" y="196">3. access token (JWT)</text>
      <text x="590" y="244">4. GET /api/orders</text>
      <text x="590" y="262">Authorization: Bearer</text>
      <text x="590" y="350">6. 200 OK</text>
    </g>

    <rect x="616" y="146" width="148" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="690" y="168" font-size="11.5" font-weight="700" fill="#463365">2. sign JWT, exp 15 min</text>
    <rect x="616" y="284" width="148" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="690" y="300" font-size="11.5" font-weight="700" fill="#463365">5. verify signature, exp</text>
    <text x="690" y="316" font-size="11.5" fill="#463365">no database lookup</text>
    <rect x="420" y="372" width="140" height="30" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="490" y="392" font-size="11.5" font-weight="700" fill="#36424e">7. logout: discard token</text>
    <rect x="606" y="404" width="168" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="690" y="424" font-size="11.5" font-weight="700" fill="#6b241c">copied token valid until exp</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M70 130H198" marker-end="url(#svt-arrow)"/>
      <path d="M200 166H328" marker-end="url(#svt-arrow)"/>
      <path d="M70 250H198" marker-end="url(#svt-arrow)"/>
      <path d="M200 292H328" marker-end="url(#svt-arrow)"/>
      <path d="M70 394H198" marker-end="url(#svt-arrow)"/>
      <path d="M200 422H328" marker-end="url(#svt-arrow)"/>
      <path d="M490 130H688" marker-end="url(#svt-arrow)"/>
      <path d="M490 250H688" marker-end="url(#svt-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M200 202H72" marker-end="url(#svt-ret)"/>
      <path d="M330 326H202" marker-end="url(#svt-ret)"/>
      <path d="M200 356H72" marker-end="url(#svt-ret)"/>
      <path d="M690 202H492" marker-end="url(#svt-ret)"/>
      <path d="M690 356H492" marker-end="url(#svt-ret)"/>
    </g>

    <text x="204" y="458" font-size="12" fill="#263e5a">State lives in the store; logout revokes at once.</text>
    <text x="596" y="458" font-size="12" fill="#463365">No server state; revoking needs expiry or a denylist.</text>
  </g>
</svg>
