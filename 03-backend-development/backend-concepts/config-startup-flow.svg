<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="csf-title csf-desc">
  <title id="csf-title">Loading and validating configuration at startup</title>
  <desc id="csf-desc">Configuration comes from five sources, each overriding the one before: defaults in code, a config file with non-secret settings, environment variables set per deploy, a secret manager for sensitive values, and occasional command-line flags. They are merged into one effective configuration and validated against a schema. If validation passes, the app starts with a typed config object that the rest of the code imports instead of reading process.env. If it fails, the app logs which value is wrong and exits with code 1, so a bad deploy fails in seconds.</desc>
  <defs>
    <marker id="csf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="120" y="44" font-size="13" font-weight="700" fill="#40566b">Sources: later overrides earlier</text>

    <rect x="20" y="60" width="200" height="42" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="78" font-size="12.5" font-weight="700" fill="#36424e">1. Defaults in code</text>
    <text x="120" y="94" font-size="11" fill="#36424e">PORT=3000, timeouts</text>
    <rect x="20" y="112" width="200" height="42" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="130" font-size="12.5" font-weight="700" fill="#36424e">2. Config file</text>
    <text x="120" y="146" font-size="11" fill="#36424e">non-secret settings</text>
    <rect x="20" y="164" width="200" height="42" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="120" y="182" font-size="12.5" font-weight="700" fill="#263e5a">3. Environment variables</text>
    <text x="120" y="198" font-size="11" fill="#263e5a">set for each deploy</text>
    <rect x="20" y="216" width="200" height="42" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="120" y="234" font-size="12.5" font-weight="700" fill="#463365">4. Secret manager</text>
    <text x="120" y="250" font-size="11" fill="#463365">DB password, API keys</text>
    <rect x="20" y="268" width="200" height="42" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="286" font-size="12.5" font-weight="700" fill="#36424e">5. Command-line flags</text>
    <text x="120" y="302" font-size="11" fill="#36424e">occasional overrides</text>

    <rect x="270" y="60" width="130" height="250" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="335" y="170" font-size="14" font-weight="700" fill="#66400f">Merge</text>
    <text x="335" y="190" font-size="11.5" fill="#66400f">one effective</text>
    <text x="335" y="206" font-size="11.5" fill="#66400f">config (strings)</text>

    <path d="M510 145 590 185 510 225 430 185z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="510" y="182" font-size="12" font-weight="700" fill="#36424e">valid against</text>
    <text x="510" y="196" font-size="12" font-weight="700" fill="#36424e">the schema?</text>

    <rect x="610" y="150" width="150" height="70" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="685" y="174" font-size="14" font-weight="700" fill="#294a2e">App starts</text>
    <text x="685" y="193" font-size="11.5" fill="#294a2e">typed config object;</text>
    <text x="685" y="209" font-size="11.5" fill="#294a2e">no process.env elsewhere</text>

    <rect x="430" y="266" width="160" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="510" y="288" font-size="14" font-weight="700" fill="#6b241c">Exit with code 1</text>
    <text x="510" y="307" font-size="11.5" fill="#6b241c">log which value is wrong</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M220 81H268" marker-end="url(#csf-arrow)"/>
      <path d="M220 133H268" marker-end="url(#csf-arrow)"/>
      <path d="M220 185H268" marker-end="url(#csf-arrow)"/>
      <path d="M220 237H268" marker-end="url(#csf-arrow)"/>
      <path d="M220 289H268" marker-end="url(#csf-arrow)"/>
      <path d="M400 185H428" marker-end="url(#csf-arrow)"/>
      <path d="M590 185H608" marker-end="url(#csf-arrow)"/>
      <path d="M510 225V264" marker-end="url(#csf-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="594" y="170">yes</text>
      <text x="522" y="248" text-anchor="start">no</text>
    </g>
    <text x="390" y="368" font-size="12" fill="#40566b">Required values present, PORT is a number, URLs are valid, LOG_LEVEL is a known level.</text>
    <text x="390" y="400" font-size="13" fill="#40566b">Fail fast: a bad deploy stops at startup with a clear message instead of serving errors for hours.</text>
  </g>
</svg>
