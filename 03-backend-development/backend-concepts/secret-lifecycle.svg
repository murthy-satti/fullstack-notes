<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="sl-title sl-desc">
  <title id="sl-title">Where secrets live, how they reach the app, and how they rotate</title>
  <desc id="sl-desc">Each environment, development, staging, and production, has its own secret store with its own credentials. The production app fetches its secrets from the production store at startup using its IAM role rather than a hard-coded key. To rotate a secret, a new version v2 is created in the store, the app reloads and accepts both v1 and v2 during the transition, and then v1 is revoked, all without a code change. Secrets must never flow into the git repository, log lines or error messages, or container images.</desc>
  <defs>
    <marker id="sl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sl-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="110" y="44" font-size="13" font-weight="700" fill="#40566b">One store per environment</text>
    <rect x="20" y="60" width="180" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="110" y="79" font-size="13" font-weight="700" fill="#463365">dev secrets</text>
    <text x="110" y="95" font-size="11" fill="#463365">local DB, test keys</text>
    <rect x="20" y="120" width="180" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="110" y="139" font-size="13" font-weight="700" fill="#463365">staging secrets</text>
    <text x="110" y="155" font-size="11" fill="#463365">fail if used in production</text>
    <rect x="20" y="180" width="180" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2.5"/>
    <text x="110" y="199" font-size="13" font-weight="700" fill="#463365">production secrets</text>
    <text x="110" y="215" font-size="11" fill="#463365">real DB, live API keys</text>

    <rect x="320" y="170" width="180" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="410" y="194" font-size="14" font-weight="700" fill="#66400f">App (production)</text>
    <text x="410" y="212" font-size="11.5" fill="#66400f">reads secrets at startup</text>
    <text x="410" y="227" font-size="11.5" fill="#66400f">using its IAM role</text>

    <text x="670" y="44" font-size="13" font-weight="700" fill="#40566b">Rotation, no code change</text>
    <rect x="570" y="60" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="670" y="85" font-size="12.5" font-weight="700" fill="#263e5a">1. create v2 in the store</text>
    <rect x="570" y="120" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="670" y="145" font-size="12.5" font-weight="700" fill="#263e5a">2. reload: accept v1 + v2</text>
    <rect x="570" y="180" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="670" y="205" font-size="12.5" font-weight="700" fill="#263e5a">3. revoke v1</text>

    <text x="40" y="284" font-size="12" font-weight="700" fill="#6b241c" text-anchor="start">Secrets must never flow into:</text>
    <rect x="40" y="330" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="140" y="350" font-size="13" font-weight="700" fill="#6b241c">git repository</text>
    <text x="140" y="367" font-size="11" fill="#6b241c">if committed, rotate at once</text>
    <rect x="310" y="330" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="410" y="350" font-size="13" font-weight="700" fill="#6b241c">logs and error messages</text>
    <text x="410" y="367" font-size="11" fill="#6b241c">redact password, authorization</text>
    <rect x="580" y="330" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="680" y="350" font-size="13" font-weight="700" fill="#6b241c">container images</text>
    <text x="680" y="367" font-size="11" fill="#6b241c">supply at runtime instead</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 202H318" marker-end="url(#sl-arrow)"/>
      <path d="M670 100V118" marker-end="url(#sl-arrow)"/>
      <path d="M670 160V178" marker-end="url(#sl-arrow)"/>
    </g>
    <path d="M568 140H540V190H502" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sl-arrow)"/>
    <g fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M380 234V302H140V328" marker-end="url(#sl-bad)"/>
      <path d="M410 234V328" marker-end="url(#sl-bad)"/>
      <path d="M440 234V302H680V328" marker-end="url(#sl-bad)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="259" y="194">fetched at startup</text>
      <text x="529" y="132">reload</text>
    </g>
    <text x="400" y="420" font-size="13" fill="#40566b">Each environment has its own credentials; rotation swaps values in the store, not in the code.</text>
    <text x="400" y="442" font-size="12" fill="#40566b">A staging key must not work in production, and developers do not need production secrets locally.</text>
  </g>
</svg>
