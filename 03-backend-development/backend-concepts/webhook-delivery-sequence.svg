<svg xmlns="http://www.w3.org/2000/svg" width="780" height="472" viewBox="0 0 780 472" role="img" aria-labelledby="wds-title wds-desc">
  <title id="wds-title">Webhook delivery with a failed attempt, a retry, and asynchronous processing</title>
  <desc id="wds-desc">A payment succeeds at the provider, which sends a signed POST /webhooks/payments to your API. The first attempt fails with a timeout or 500, so the provider waits with exponential backoff and retries the same event with the same ID. On the second attempt your API verifies the signature and timestamp, enqueues the event, and returns 200 OK within seconds. A worker then deduplicates by event ID and updates the order and sends the email.</desc>
  <defs>
    <marker id="wds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="wds-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="wds-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="472" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="40" y="20" width="140" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="330" y="20" width="140" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="590" y="20" width="160" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <text x="110" y="43" font-size="14" font-weight="700" fill="#36424e">Provider</text>
    <text x="400" y="43" font-size="14" font-weight="700" fill="#66400f">Your API</text>
    <text x="670" y="43" font-size="14" font-weight="700" fill="#463365">Queue + worker</text>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 56V432"/>
      <path d="M400 56V432"/>
      <path d="M670 56V432"/>
    </g>

    <rect x="46" y="72" width="128" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="110" y="90" font-size="11.5" font-weight="700" fill="#66400f">payment succeeds</text>
    <rect x="340" y="138" width="120" height="26" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="400" y="156" font-size="11.5" font-weight="700" fill="#6b241c">slow or down</text>
    <rect x="30" y="204" width="160" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="110" y="220" font-size="11.5" font-weight="700" fill="#66400f">retry with backoff</text>
    <text x="110" y="236" font-size="11" fill="#66400f">1 min, 5 min, 30 min ...</text>
    <rect x="316" y="282" width="168" height="26" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="400" y="300" font-size="11.5" font-weight="700" fill="#294a2e">verify signature + time</text>
    <rect x="663" y="336" width="14" height="80" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="654" y="372" font-size="11.5" fill="#463365" text-anchor="end">dedupe by event ID,</text>
    <text x="654" y="388" font-size="11.5" fill="#463365" text-anchor="end">then update order, send email</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 126H398" marker-end="url(#wds-arrow)"/>
      <path d="M110 266H398" marker-end="url(#wds-arrow)"/>
      <path d="M400 330H661" marker-end="url(#wds-arrow)"/>
    </g>
    <path d="M400 186H112" fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#wds-arrow-red)"/>
    <path d="M400 362H112" fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#wds-arrow-dash)"/>

    <g font-size="12" fill="#263e5a">
      <text x="255" y="118" font-weight="700">attempt 1: POST /webhooks/payments</text>
      <text x="255" y="258" font-weight="700">attempt 2: same event evt_8f2c1a</text>
      <text x="535" y="322">enqueue event</text>
    </g>
    <text x="255" y="178" font-size="12" font-weight="700" fill="#b5473a">timeout or 500</text>
    <text x="255" y="354" font-size="12" font-weight="700" fill="#294a2e">200 OK within seconds</text>
    <text x="390" y="458" font-size="13" fill="#40566b">Acknowledge fast and work later; the provider retries anything else, so expect duplicates.</text>
  </g>
</svg>
