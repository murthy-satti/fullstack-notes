<svg xmlns="http://www.w3.org/2000/svg" width="780" height="444" viewBox="0 0 780 444" role="img" aria-labelledby="rrc-title rrc-desc">
  <title id="rrc-title">The Express request-response cycle as a sequence</title>
  <desc id="rrc-desc">The client sends GET /api/users/42 to the node:http server, which calls app(req, res). Middleware runs in registration order: express.json, requestLogger, and requireAuth, each calling next. The first matching route handler runs and sends 200 OK with res.json back to the client. If anything throws or a promise rejects, the error goes to the error handler, which sends a 500 error response to the client.</desc>
  <defs>
    <marker id="rrc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rrc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="444" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="20" width="128" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="80" y="39" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <text x="80" y="55" font-size="11.5" fill="#36424e">browser / curl</text>
    <rect x="166" y="20" width="128" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="230" y="39" font-size="14" font-weight="700" fill="#263e5a">http.Server</text>
    <text x="230" y="55" font-size="11.5" fill="#263e5a">node:http</text>
    <rect x="321" y="20" width="128" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="385" y="39" font-size="14" font-weight="700" fill="#263e5a">Middleware</text>
    <text x="385" y="55" font-size="11.5" fill="#263e5a">registration order</text>
    <rect x="476" y="20" width="128" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="540" y="39" font-size="14" font-weight="700" fill="#66400f">Route handler</text>
    <text x="540" y="55" font-size="11.5" fill="#66400f">app.get(...)</text>
    <rect x="631" y="20" width="128" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="695" y="39" font-size="14" font-weight="700" fill="#6b241c">Error handler</text>
    <text x="695" y="55" font-size="11.5" fill="#6b241c">4 arguments</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M80 64V404"/>
      <path d="M230 64V404"/>
      <path d="M385 64V404"/>
      <path d="M540 64V404"/>
      <path d="M695 64V404"/>
    </g>
    <rect x="380" y="150" width="10" height="90" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>

    <rect x="150" y="314" width="616" height="80" rx="8" fill="none" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="160" y="330" font-size="11.5" font-weight="700" fill="#6b241c" text-anchor="start">if anything throws or rejects</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M80 104H228" marker-end="url(#rrc-arrow)"/>
      <path d="M230 140H378" marker-end="url(#rrc-arrow)"/>
      <path d="M390 258H538" marker-end="url(#rrc-arrow)"/>
      <path d="M540 346H693" marker-end="url(#rrc-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M540 292H82" marker-end="url(#rrc-arrow-ret)"/>
      <path d="M695 378H82" marker-end="url(#rrc-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="155" y="97">1. GET /api/users/42</text>
      <text x="307" y="133">2. app(req, res)</text>
      <text x="464" y="251">4. route matches</text>
      <text x="617" y="339">6. error thrown</text>
    </g>
    <g font-size="11.5" fill="#263e5a" text-anchor="start">
      <text x="398" y="168">3. express.json()</text>
      <text x="398" y="188">requestLogger</text>
      <text x="398" y="208">requireAuth</text>
      <text x="398" y="230" font-style="italic">each calls next()</text>
    </g>
    <rect x="186" y="275" width="250" height="15" fill="#f5f7fb"/>
    <text x="311" y="286" font-size="11.5" fill="#294a2e" font-weight="700">5. 200 OK via res.json({ id: "42" })</text>
    <rect x="316" y="361" width="146" height="15" fill="#f5f7fb"/>
    <text x="389" y="372" font-size="11.5" fill="#6b241c" font-weight="700">7. 500 error response</text>

    <text x="390" y="428" font-size="13" fill="#40566b">Every request ends in exactly one response: from a handler, a middleware, or the error handler.</text>
  </g>
</svg>
