<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="rmo-title rmo-desc">
  <title id="rmo-title">How Express finds the route for a request</title>
  <desc id="rmo-desc">For GET /users/me, Express takes the next entry from its list of routes and middleware in registration order. If no entries are left, a 404 is sent by your catch-all handler or Express's default. If the entry's method and path do not match, Express moves to the next entry. If they match, the route handler runs; for example app.get("/users/:id") matches with id equal to "me". If the handler sends a response, matching stops. If it calls next(), the next handler of the same route runs. If it calls next("route"), the remaining handlers are skipped and matching continues with later entries.</desc>
  <defs>
    <marker id="rmo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="760" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="210" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="330" y="45" font-size="14" font-weight="700" fill="#36424e">Request: GET /users/me</text>

    <rect x="210" y="84" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="330" y="104" font-size="14" font-weight="700" fill="#263e5a">Take the next entry</text>
    <text x="330" y="121" font-size="11.5" fill="#263e5a">in registration order</text>

    <path d="M330 148 430 176 330 204 230 176z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="330" y="180" font-size="12" font-weight="700" fill="#36424e">entries left?</text>

    <rect x="520" y="152" width="220" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="630" y="172" font-size="14" font-weight="700" fill="#6b241c">404 Not Found</text>
    <text x="630" y="189" font-size="11.5" fill="#6b241c">your catch-all, or the default</text>

    <path d="M330 232 430 262 330 292 230 262z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="330" y="259" font-size="12" font-weight="700" fill="#36424e">method + path</text>
    <text x="330" y="273" font-size="12" font-weight="700" fill="#36424e">match?</text>

    <rect x="210" y="316" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="330" y="336" font-size="14" font-weight="700" fill="#66400f">Run the route handler</text>
    <text x="330" y="353" font-size="11.5" fill="#66400f">app.get("/users/:id"), id = "me"</text>

    <path d="M330 378 430 408 330 438 230 408z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="330" y="405" font-size="12" font-weight="700" fill="#36424e">what does the</text>
    <text x="330" y="419" font-size="12" font-weight="700" fill="#36424e">handler do?</text>

    <rect x="210" y="462" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="330" y="482" font-size="14" font-weight="700" fill="#294a2e">Response sent</text>
    <text x="330" y="499" font-size="11.5" fill="#294a2e">matching stops here</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 60V82" marker-end="url(#rmo-arrow)"/>
      <path d="M330 132V146" marker-end="url(#rmo-arrow)"/>
      <path d="M430 176H518" marker-end="url(#rmo-arrow)"/>
      <path d="M330 204V230" marker-end="url(#rmo-arrow)"/>
      <path d="M330 292V314" marker-end="url(#rmo-arrow)"/>
      <path d="M330 364V376" marker-end="url(#rmo-arrow)"/>
      <path d="M330 438V460" marker-end="url(#rmo-arrow)"/>
      <path d="M230 262H120"/>
      <path d="M230 408H120V108H208" marker-end="url(#rmo-arrow)"/>
      <path d="M430 408H480V340H452" marker-end="url(#rmo-arrow)"/>
    </g>
    <circle cx="120" cy="262" r="3.5" fill="#40566b"/>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="474" y="168">no</text>
      <text x="175" y="254">no</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="340" y="222">yes</text>
      <text x="340" y="307">yes</text>
      <text x="340" y="453">res.json() / res.send()</text>
      <text x="126" y="400">next("route")</text>
      <text x="488" y="370">next(): next handler</text>
      <text x="488" y="385">of this same route</text>
    </g>
    <text x="380" y="540" font-size="13" fill="#40566b">The first matching route that sends a response ends the search; order of registration decides.</text>
  </g>
</svg>
