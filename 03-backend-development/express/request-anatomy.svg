<svg xmlns="http://www.w3.org/2000/svg" width="780" height="550" viewBox="0 0 780 550" role="img" aria-labelledby="ran-title ran-desc">
  <title id="ran-title">Where each part of an HTTP request appears on req</title>
  <desc id="ran-desc">For POST /api/v1/orders/77/items?notify=true handled by a router mounted at /api/v1/orders with route /:orderId/items: the method POST becomes req.method. The path gives req.params with orderId "77", and req.path "/77/items" with req.baseUrl "/api/v1/orders". The query string gives req.query with notify as the string "true". The Host header gives req.hostname. Content-Type and Authorization are read with req.get(). The Cookie header becomes req.cookies after cookie-parser, and the JSON body becomes req.body after express.json().</desc>
  <defs>
    <marker id="ran-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="550" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="732" height="44" rx="22" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="39" font-size="14" font-weight="700" fill="#36424e">POST /api/v1/orders/77/items?notify=true HTTP/1.1</text>
    <text x="390" y="56" font-size="11.5" fill="#36424e">handled by a router mounted at /api/v1/orders, route "/:orderId/items"</text>

    <text x="177" y="86" font-size="13" font-weight="700" fill="#40566b">Raw request, piece by piece</text>
    <text x="591" y="86" font-size="13" font-weight="700" fill="#40566b">What your handler reads</text>

    <g font-size="12" font-weight="700">
      <rect x="24" y="96" width="306" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="177" y="117" fill="#263e5a">POST</text>
      <rect x="24" y="140" width="306" height="78" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="177" y="183" fill="#263e5a">/api/v1/orders/77/items</text>
      <rect x="24" y="228" width="306" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="177" y="249" fill="#263e5a">?notify=true</text>
      <rect x="24" y="272" width="306" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="177" y="293" fill="#463365">Host: shop.example.com</text>
      <rect x="24" y="316" width="306" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="177" y="337" fill="#463365">Content-Type: application/json</text>
      <rect x="24" y="360" width="306" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="177" y="381" fill="#463365">Authorization: Bearer eyJhbGci...</text>
      <rect x="24" y="404" width="306" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="177" y="425" fill="#463365">Cookie: theme=dark</text>
      <rect x="24" y="448" width="306" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="177" y="469" fill="#66400f">{"productId":"p-9","quantity":2}</text>
    </g>

    <g font-size="12" fill="#36424e">
      <rect x="426" y="96" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="117">req.method = "POST"</text>
      <rect x="426" y="140" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="161">req.params = { orderId: "77" }</text>
      <rect x="426" y="184" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="205">req.path = "/77/items", req.baseUrl = "/api/v1/orders"</text>
      <rect x="426" y="228" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="249">req.query = { notify: "true" }  (a string)</text>
      <rect x="426" y="272" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="293">req.hostname = "shop.example.com"</text>
      <rect x="426" y="316" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="337">req.get("content-type") = "application/json"</text>
      <rect x="426" y="360" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="381">req.get("authorization") = "Bearer eyJ..."</text>
      <rect x="426" y="404" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="425">req.cookies = { theme: "dark" }</text>
      <rect x="426" y="448" width="330" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="591" y="469">req.body = { productId: "p-9", quantity: 2 }</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M330 113H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 157H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 201H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 245H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 289H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 333H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 377H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 421H424" marker-end="url(#ran-arrow)"/>
      <path d="M330 465H424" marker-end="url(#ran-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="377" y="415">cookie-parser</text>
      <text x="377" y="459">express.json()</text>
    </g>

    <g font-size="11.5" fill="#40566b" text-anchor="start">
      <rect x="24" y="500" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="44" y="511">request line</text>
      <rect x="134" y="500" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="154" y="511">headers</text>
      <rect x="222" y="500" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="242" y="511">body</text>
    </g>
    <text x="390" y="536" font-size="13" fill="#40566b">Everything on req comes from the client: convert, validate, and never trust it blindly.</text>
  </g>
</svg>
