<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630" role="img" aria-labelledby="mrf-title mrf-desc">
  <title id="mrf-title">How a request moves through Express middleware</title>
  <desc id="mrf-desc">A POST request passes through express.json and a logger, each calling next. An auth check sends 401 if the token is invalid. The router sends the request to a 404 handler if no route matches. The route handler either succeeds and sends 201 Created, or throws an error that goes to error-handling middleware, which sends a 500 response.</desc>
  <defs>
    <marker id="mrf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="760" height="630" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="24" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="49" font-size="14" font-weight="700" fill="#36424e">POST /api/orders arrives</text>

    <rect x="120" y="84" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="104" font-size="14" font-weight="700" fill="#263e5a">express.json()</text>
    <text x="240" y="121" font-size="11.5" fill="#263e5a">parses the body into req.body</text>

    <rect x="120" y="152" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="172" font-size="14" font-weight="700" fill="#263e5a">requestLogger</text>
    <text x="240" y="189" font-size="11.5" fill="#263e5a">logs method and path</text>

    <path d="M240 222 340 252 240 282 140 252z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="249" font-size="12" font-weight="700" fill="#36424e">requireAuth:</text>
    <text x="240" y="263" font-size="12" font-weight="700" fill="#36424e">token valid?</text>

    <path d="M240 304 340 334 240 364 140 334z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="331" font-size="12" font-weight="700" fill="#36424e">router: method +</text>
    <text x="240" y="345" font-size="12" font-weight="700" fill="#36424e">path matches?</text>

    <rect x="120" y="384" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="240" y="404" font-size="14" font-weight="700" fill="#66400f">Route handler</text>
    <text x="240" y="421" font-size="11.5" fill="#66400f">validates input, calls the service</text>

    <path d="M240 454 340 484 240 514 140 484z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="481" font-size="12" font-weight="700" fill="#36424e">throws or</text>
    <text x="240" y="495" font-size="12" font-weight="700" fill="#36424e">next(err)?</text>

    <rect x="120" y="534" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="240" y="554" font-size="14" font-weight="700" fill="#294a2e">201 Created</text>
    <text x="240" y="571" font-size="11.5" fill="#294a2e">res.status(201).json(order)</text>

    <rect x="440" y="228" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="248" font-size="14" font-weight="700" fill="#6b241c">401 Unauthorized</text>
    <text x="580" y="265" font-size="11.5" fill="#6b241c">responds without calling next()</text>

    <rect x="440" y="310" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="330" font-size="14" font-weight="700" fill="#6b241c">404 handler</text>
    <text x="580" y="347" font-size="11.5" fill="#6b241c">last app.use() sends 404 Not Found</text>

    <rect x="440" y="460" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="480" font-size="14" font-weight="700" fill="#6b241c">Error middleware</text>
    <text x="580" y="497" font-size="11.5" fill="#6b241c">(err, req, res, next) sends 500 JSON</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 64V82" marker-end="url(#mrf-arrow)"/>
      <path d="M240 132V150" marker-end="url(#mrf-arrow)"/>
      <path d="M240 200V220" marker-end="url(#mrf-arrow)"/>
      <path d="M240 282V302" marker-end="url(#mrf-arrow)"/>
      <path d="M240 364V382" marker-end="url(#mrf-arrow)"/>
      <path d="M240 432V452" marker-end="url(#mrf-arrow)"/>
      <path d="M240 514V532" marker-end="url(#mrf-arrow)"/>
      <path d="M340 252H438" marker-end="url(#mrf-arrow)"/>
      <path d="M340 334H438" marker-end="url(#mrf-arrow)"/>
      <path d="M340 484H438" marker-end="url(#mrf-arrow)"/>
    </g>

    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="250" y="146">next()</text>
      <text x="250" y="215">next()</text>
      <text x="250" y="297">yes: next()</text>
      <text x="250" y="379">yes</text>
      <text x="250" y="529">no</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="389" y="245">no</text>
      <text x="389" y="327">no</text>
      <text x="389" y="477">yes</text>
    </g>
    <text x="380" y="612" font-size="13" fill="#40566b">Middleware runs in registration order; each step either calls next() or ends the response.</text>
  </g>
</svg>
