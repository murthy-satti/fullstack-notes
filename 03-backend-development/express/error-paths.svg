<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="erp-title erp-desc">
  <title id="erp-title">How errors reach Express error-handling middleware, and which ones never do</title>
  <desc id="erp-desc">A synchronous throw, a rejected promise from an async handler in Express 5, and a call to next(err) all make Express skip the remaining normal middleware and routes and go to the first error handler with four arguments, registered after the routes. If that handler sends a response, the client gets an error response such as 404 or 500 JSON. If it calls next(err), the next error handler or Express's default handler responds with an HTML page that shows the stack only outside production. Errors Express never sees: in Express 4 an awaited rejection without try/catch is unhandled and the client waits until timeout; and a throw inside a setTimeout callback runs outside the promise Express watches and can crash the process.</desc>
  <defs>
    <marker id="erp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="erp-arrow-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="800" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Caught by Express</text>
    <rect x="24" y="40" width="220" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="134" y="60" font-size="14" font-weight="700" fill="#66400f">throw new Error()</text>
    <text x="134" y="77" font-size="11.5" fill="#66400f">synchronous code</text>
    <rect x="24" y="104" width="220" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="134" y="124" font-size="14" font-weight="700" fill="#66400f">await ... rejects</text>
    <text x="134" y="141" font-size="11.5" fill="#66400f">async handler, Express 5</text>
    <rect x="24" y="168" width="220" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="134" y="188" font-size="14" font-weight="700" fill="#66400f">next(err)</text>
    <text x="134" y="205" font-size="11.5" fill="#66400f">e.g. from a callback API</text>

    <rect x="330" y="100" width="230" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="445" y="123" font-size="13" font-weight="700" fill="#36424e">Express skips the remaining</text>
    <text x="445" y="142" font-size="13" font-weight="700" fill="#36424e">normal middleware and routes</text>

    <rect x="596" y="100" width="180" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="686" y="123" font-size="14" font-weight="700" fill="#6b241c">errorHandler</text>
    <text x="686" y="142" font-size="11.5" fill="#6b241c">(err, req, res, next), last</text>

    <path d="M686 192 771 220 686 248 601 220z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="686" y="217" font-size="11.5" font-weight="700" fill="#36424e">sends a</text>
    <text x="686" y="230" font-size="11.5" font-weight="700" fill="#36424e">response?</text>

    <rect x="596" y="280" width="180" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="686" y="300" font-size="14" font-weight="700" fill="#294a2e">Error response</text>
    <text x="686" y="317" font-size="11.5" fill="#294a2e">e.g. 404 or 500 JSON</text>

    <rect x="330" y="196" width="230" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="445" y="216" font-size="13" font-weight="700" fill="#36424e">Express default handler</text>
    <text x="445" y="233" font-size="11.5" fill="#36424e">HTML; stack only outside production</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 64H290"/>
      <path d="M244 128H290"/>
      <path d="M244 192H290"/>
      <path d="M290 64V192"/>
      <path d="M290 128H328" marker-end="url(#erp-arrow)"/>
      <path d="M560 128H594" marker-end="url(#erp-arrow)"/>
      <path d="M686 156V190" marker-end="url(#erp-arrow)"/>
      <path d="M686 248V278" marker-end="url(#erp-arrow)"/>
      <path d="M601 220H562" marker-end="url(#erp-arrow)"/>
    </g>
    <circle cx="290" cy="128" r="3.5" fill="#40566b"/>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="698" y="268" text-anchor="start">yes</text>
      <text x="566" y="211" text-anchor="start">next(err)</text>
    </g>

    <path d="M24 350H776" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="374" font-size="13" font-weight="700" fill="#6b241c" text-anchor="start">Never reach the error handler</text>
    <rect x="24" y="384" width="220" height="48" rx="8" fill="#fdf3f2" stroke="#b5473a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="134" y="404" font-size="13" font-weight="700" fill="#6b241c">Express 4: await rejects</text>
    <text x="134" y="421" font-size="11.5" fill="#6b241c">no try/catch, no wrapper</text>
    <rect x="290" y="384" width="190" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="385" y="404" font-size="13" font-weight="700" fill="#6b241c">Request hangs</text>
    <text x="385" y="421" font-size="11.5" fill="#6b241c">client waits for timeout</text>
    <rect x="510" y="384" width="266" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="643" y="404" font-size="13" font-weight="700" fill="#6b241c">throw inside setTimeout()</text>
    <text x="643" y="421" font-size="11.5" fill="#6b241c">uncaught exception: process may crash</text>
    <path d="M244 408H288" fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" marker-end="url(#erp-arrow-err)"/>

    <text x="400" y="456" font-size="13" fill="#40566b">Throws, rejections (Express 5), and next(err) all land in the error handler registered after the routes.</text>
  </g>
</svg>
