<svg xmlns="http://www.w3.org/2000/svg" width="780" height="534" viewBox="0 0 780 534" role="img" aria-labelledby="stf-title stf-desc">
  <title id="stf-title">What happens when a test calls supertest</title>
  <desc id="stf-desc">The test builds the app with createApp and a fake repository, without calling listen. It calls request(app).post("/tasks").send(...). supertest starts the app on a random free port and sends a real HTTP POST, so express.json, the route and validation all run. The route inserts the task into the test repository, which returns it, and Express responds 201 Created with a Location header and JSON body. supertest hands the response back to the test, which asserts on the status, headers and body.</desc>
  <defs>
    <marker id="stf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="stf-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="534" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="20" width="150" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="110" y="40" font-size="14" font-weight="700" fill="#294a2e">Test file</text>
    <text x="110" y="57" font-size="11.5" fill="#294a2e">node:test</text>
    <rect x="235" y="20" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="310" y="40" font-size="14" font-weight="700" fill="#263e5a">supertest</text>
    <text x="310" y="57" font-size="11.5" fill="#263e5a">temporary server</text>
    <rect x="435" y="20" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="510" y="40" font-size="14" font-weight="700" fill="#66400f">Express app</text>
    <text x="510" y="57" font-size="11.5" fill="#66400f">real middleware</text>
    <rect x="615" y="20" width="150" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="690" y="40" font-size="14" font-weight="700" fill="#463365">Test repository</text>
    <text x="690" y="57" font-size="11.5" fill="#463365">fake or test DB</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M110 68V86M110 122V436M110 472V486"/>
      <path d="M310 68V184M310 220V486"/>
      <path d="M510 68V486"/>
      <path d="M690 68V486"/>
    </g>

    <rect x="35" y="86" width="150" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="110" y="101" font-size="11.5" font-weight="700" fill="#294a2e">1. createApp(deps)</text>
    <text x="110" y="115" font-size="11.5" fill="#294a2e">exported, no listen()</text>
    <rect x="235" y="184" width="150" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="310" y="199" font-size="11.5" font-weight="700" fill="#263e5a">3. listen on a</text>
    <text x="310" y="213" font-size="11.5" fill="#263e5a">random free port</text>
    <rect x="35" y="436" width="150" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="110" y="451" font-size="11.5" font-weight="700" fill="#294a2e">9. assertions</text>
    <text x="110" y="465" font-size="11.5" fill="#294a2e">status, headers, body</text>

    <g text-anchor="start" fill="#36424e">
      <text x="122" y="146" font-size="12" font-weight="700">2. request(app)</text>
      <text x="122" y="160" font-size="11">.post("/tasks").send({ title })</text>
      <text x="322" y="244" font-size="12" font-weight="700">4. real HTTP POST /tasks</text>
      <text x="322" y="258" font-size="11">JSON body, full middleware</text>
      <text x="522" y="290" font-size="12" font-weight="700">5. insert(task)</text>
      <text x="522" y="322" font-size="12" font-weight="700">6. task</text>
      <text x="322" y="352" font-size="12" font-weight="700">7. 201 Created</text>
      <text x="322" y="366" font-size="11">Location header, JSON body</text>
      <text x="122" y="398" font-size="12" font-weight="700">8. res</text>
      <text x="122" y="412" font-size="11">server closed, response returned</text>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 170H308" stroke="#40566b" marker-end="url(#stf-arrow)"/>
      <path d="M310 268H508" stroke="#40566b" marker-end="url(#stf-arrow)"/>
      <path d="M510 300H688" stroke="#40566b" marker-end="url(#stf-arrow)"/>
      <path d="M690 332H512" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#stf-ret)"/>
      <path d="M510 376H312" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#stf-ret)"/>
      <path d="M310 422H112" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#stf-ret)"/>
    </g>
    <text x="390" y="514" font-size="13" fill="#40566b">No running server or fixed port: supertest drives the real HTTP stack inside the test process.</text>
  </g>
</svg>
