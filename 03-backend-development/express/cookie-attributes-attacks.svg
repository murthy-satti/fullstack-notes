<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="caa-title caa-desc">
  <title id="caa-title">Which cookie option stops which attack</title>
  <desc id="caa-desc">HttpOnly stops an injected script from reading the cookie through document.cookie. Secure stops the cookie being sent over plain HTTP where it could be copied on the network. SameSite Lax makes the browser leave the cookie off a cross-site POST, so a forged form from another site runs logged out. Signed cookies carry an HMAC signature, so an edited value fails verification and req.signedCookies shows false.</desc>
  <defs>
    <marker id="caa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="144" y="40">Attack</text>
      <text x="385" y="40">Cookie option</text>
      <text x="631" y="40">Result</text>
    </g>

    <rect x="24" y="56" width="240" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="144" y="76" font-size="14" font-weight="700" fill="#6b241c">XSS: injected script</text>
    <text x="144" y="93" font-size="11.5" fill="#6b241c">reads document.cookie</text>
    <rect x="300" y="56" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="385" y="76" font-size="14" font-weight="700" fill="#263e5a">httpOnly: true</text>
    <text x="385" y="93" font-size="11.5" fill="#263e5a">HttpOnly attribute</text>
    <rect x="506" y="56" width="250" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="631" y="76" font-size="14" font-weight="700" fill="#294a2e">Cookie hidden from JS</text>
    <text x="631" y="93" font-size="11.5" fill="#294a2e">document.cookie leaves it out</text>
    <text x="24" y="124" font-size="11.5" font-style="italic" fill="#b5473a" text-anchor="start">Without it: the script sends sid to the attacker, who takes over the session.</text>

    <rect x="24" y="148" width="240" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="144" y="168" font-size="14" font-weight="700" fill="#6b241c">Plain http:// request</text>
    <text x="144" y="185" font-size="11.5" fill="#6b241c">on a shared network</text>
    <rect x="300" y="148" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="385" y="168" font-size="14" font-weight="700" fill="#263e5a">secure: true</text>
    <text x="385" y="185" font-size="11.5" fill="#263e5a">Secure attribute</text>
    <rect x="506" y="148" width="250" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="631" y="168" font-size="14" font-weight="700" fill="#294a2e">Sent only over HTTPS</text>
    <text x="631" y="185" font-size="11.5" fill="#294a2e">no cookie on an http:// request</text>
    <text x="24" y="216" font-size="11.5" font-style="italic" fill="#b5473a" text-anchor="start">Without it: anyone watching the network can copy the cookie in transit.</text>

    <rect x="24" y="240" width="240" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="144" y="260" font-size="14" font-weight="700" fill="#6b241c">CSRF: evil.com form</text>
    <text x="144" y="277" font-size="11.5" fill="#6b241c">auto-submits a POST to you</text>
    <rect x="300" y="240" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="385" y="260" font-size="14" font-weight="700" fill="#263e5a">sameSite: "lax"</text>
    <text x="385" y="277" font-size="11.5" fill="#263e5a">SameSite=Lax</text>
    <rect x="506" y="240" width="250" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="631" y="260" font-size="14" font-weight="700" fill="#294a2e">Cookie left off</text>
    <text x="631" y="277" font-size="11.5" fill="#294a2e">the forged POST arrives logged out</text>
    <text x="24" y="308" font-size="11.5" font-style="italic" fill="#b5473a" text-anchor="start">With SameSite=None: the forged POST carries the cookie and runs as the user.</text>

    <rect x="24" y="332" width="240" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="144" y="352" font-size="14" font-weight="700" fill="#6b241c">User edits the value</text>
    <text x="144" y="369" font-size="11.5" fill="#6b241c">visits=3 changed to visits=999</text>
    <rect x="300" y="332" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="385" y="352" font-size="14" font-weight="700" fill="#263e5a">signed: true</text>
    <text x="385" y="369" font-size="11.5" fill="#263e5a">HMAC with the secret</text>
    <rect x="506" y="332" width="250" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="631" y="352" font-size="14" font-weight="700" fill="#294a2e">Signature mismatch</text>
    <text x="631" y="369" font-size="11.5" fill="#294a2e">req.signedCookies.visits is false</text>
    <text x="24" y="400" font-size="11.5" font-style="italic" fill="#b5473a" text-anchor="start">Without it: the server trusts whatever value the browser sends back.</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M264 80H298" marker-end="url(#caa-arrow)"/>
      <path d="M470 80H504" marker-end="url(#caa-arrow)"/>
      <path d="M264 172H298" marker-end="url(#caa-arrow)"/>
      <path d="M470 172H504" marker-end="url(#caa-arrow)"/>
      <path d="M264 264H298" marker-end="url(#caa-arrow)"/>
      <path d="M470 264H504" marker-end="url(#caa-arrow)"/>
      <path d="M264 356H298" marker-end="url(#caa-arrow)"/>
      <path d="M470 356H504" marker-end="url(#caa-arrow)"/>
    </g>
    <text x="390" y="432" font-size="13" fill="#40566b">Each option closes one specific attack; a session cookie normally needs all of the first three.</text>
  </g>
</svg>
