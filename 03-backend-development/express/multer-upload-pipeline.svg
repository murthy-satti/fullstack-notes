<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" role="img" aria-labelledby="mup-title mup-desc">
  <title id="mup-title">How Multer processes a multipart upload</title>
  <desc id="mup-desc">upload.single reads the multipart parts in order; text fields go to req.body. For a file part, an unexpected field or too many files produces a MulterError and 400. Next, fileFilter decides whether the type is accepted; a rejection passes an error with status 415. The storage engine then streams the bytes into memory or onto disk, and a file larger than limits.fileSize produces LIMIT_FILE_SIZE and 413. Otherwise req.file is set, next is called, and the route handler checks magic bytes, uploads the file, and returns 201.</desc>
  <defs>
    <marker id="mup-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="620" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="150" y="24" width="300" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="49" font-size="14" font-weight="700" fill="#36424e">POST multipart/form-data</text>

    <rect x="180" y="84" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="104" font-size="14" font-weight="700" fill="#263e5a">upload.single("avatar")</text>
    <text x="300" y="121" font-size="11.5" fill="#263e5a">busboy reads parts in order</text>

    <rect x="20" y="84" width="130" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="85" y="104" font-size="14" font-weight="700" fill="#36424e">Text fields</text>
    <text x="85" y="121" font-size="11.5" fill="#36424e">go to req.body</text>

    <path d="M300 138 410 168 300 198 190 168z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="165" font-size="12" font-weight="700" fill="#36424e">expected field,</text>
    <text x="300" y="179" font-size="12" font-weight="700" fill="#36424e">file count ok?</text>
    <path d="M300 228 410 258 300 288 190 258z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="255" font-size="12" font-weight="700" fill="#36424e">fileFilter</text>
    <text x="300" y="269" font-size="12" font-weight="700" fill="#36424e">accepts type?</text>

    <rect x="180" y="316" width="240" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="300" y="336" font-size="14" font-weight="700" fill="#463365">Storage engine</text>
    <text x="300" y="353" font-size="11.5" fill="#463365">memory: buffer, disk: path</text>

    <path d="M300 370 410 400 300 430 190 400z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="397" font-size="12" font-weight="700" fill="#36424e">size within</text>
    <text x="300" y="411" font-size="12" font-weight="700" fill="#36424e">limits.fileSize?</text>

    <rect x="180" y="458" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="300" y="478" font-size="14" font-weight="700" fill="#294a2e">req.file is set</text>
    <text x="300" y="495" font-size="11.5" fill="#294a2e">next() to the route</text>
    <rect x="180" y="526" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="300" y="546" font-size="14" font-weight="700" fill="#66400f">Route handler</text>
    <text x="300" y="563" font-size="11.5" fill="#66400f">check magic bytes, upload, 201</text>

    <text x="613" y="134" font-size="11.5" font-style="italic" fill="#b5473a">each error goes to next(err)</text>
    <rect x="470" y="144" width="286" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="613" y="164" font-size="14" font-weight="700" fill="#6b241c">400 Bad Request</text>
    <text x="613" y="181" font-size="11.5" fill="#6b241c">LIMIT_UNEXPECTED_FILE, _FILE_COUNT</text>
    <rect x="470" y="234" width="286" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="613" y="254" font-size="14" font-weight="700" fill="#6b241c">415 Unsupported Media Type</text>
    <text x="613" y="271" font-size="11.5" fill="#6b241c">fileFilter calls cb(err)</text>
    <rect x="470" y="376" width="286" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="613" y="396" font-size="14" font-weight="700" fill="#6b241c">413 Content Too Large</text>
    <text x="613" y="413" font-size="11.5" fill="#6b241c">MulterError LIMIT_FILE_SIZE</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 64V82" marker-end="url(#mup-arrow)"/>
      <path d="M300 132V136" marker-end="url(#mup-arrow)"/>
      <path d="M300 198V226" marker-end="url(#mup-arrow)"/>
      <path d="M300 288V314" marker-end="url(#mup-arrow)"/>
      <path d="M300 364V368" marker-end="url(#mup-arrow)"/>
      <path d="M300 430V456" marker-end="url(#mup-arrow)"/>
      <path d="M300 506V524" marker-end="url(#mup-arrow)"/>
      <path d="M410 168H468" marker-end="url(#mup-arrow)"/>
      <path d="M410 258H468" marker-end="url(#mup-arrow)"/>
      <path d="M410 400H468" marker-end="url(#mup-arrow)"/>
    </g>
    <path d="M180 108H152" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mup-arrow)"/>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="439" y="161">no</text>
      <text x="439" y="251">no</text>
      <text x="439" y="393">no</text>
      <text x="316" y="216">yes</text>
      <text x="316" y="306">yes</text>
      <text x="316" y="448">yes</text>
    </g>
    <text x="390" y="602" font-size="13" fill="#40566b">Limits and the filter stop bad uploads while they stream, before the route handler runs.</text>
  </g>
</svg>
