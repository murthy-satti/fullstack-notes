<svg xmlns="http://www.w3.org/2000/svg" width="780" height="780" viewBox="0 0 780 780" role="img" aria-labelledby="srp-title srp-desc">
  <title id="srp-title">Layered security controls a request passes before and after the handler</title>
  <desc id="srp-desc">A request arrives over HTTPS terminated at the proxy. The rate limiter rejects excess requests with 429 and Retry-After. helmet adds security headers. A body larger than the express.json limit is rejected with 413. A request without valid credentials gets 401, a user who is not allowed gets 403, and invalid input or extra fields get 400. Only then does the route handler run, using parameterized queries and execFile instead of exec. Errors thrown anywhere go to the error handler, which returns 500 with a generic message and logs the details; successful responses carry the helmet headers.</desc>
  <defs>
    <marker id="srp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="srp-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="780" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="160" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="45" font-size="14" font-weight="700" fill="#36424e">Request from the internet</text>

    <rect x="160" y="80" width="240" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="100" font-size="14" font-weight="700" fill="#36424e">TLS at the proxy</text>
    <text x="280" y="117" font-size="11.5" fill="#36424e">HTTPS only; HSTS keeps it so</text>

    <path d="M280 148 380 178 280 208 180 178z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="175" font-size="12" font-weight="700" fill="#36424e">under the</text>
    <text x="280" y="189" font-size="12" font-weight="700" fill="#36424e">rate limit?</text>

    <rect x="160" y="228" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="280" y="248" font-size="14" font-weight="700" fill="#263e5a">helmet()</text>
    <text x="280" y="265" font-size="11.5" fill="#263e5a">CSP, HSTS, nosniff, no X-Powered-By</text>

    <path d="M280 296 380 326 280 356 180 326z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="323" font-size="12" font-weight="700" fill="#36424e">body within</text>
    <text x="280" y="337" font-size="12" font-weight="700" fill="#36424e">express.json limit?</text>
    <path d="M280 376 380 406 280 436 180 406z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="403" font-size="12" font-weight="700" fill="#36424e">valid session</text>
    <text x="280" y="417" font-size="12" font-weight="700" fill="#36424e">or token?</text>
    <path d="M280 456 380 486 280 516 180 486z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="483" font-size="12" font-weight="700" fill="#36424e">allowed?</text>
    <text x="280" y="497" font-size="11" fill="#36424e">role and ownership</text>
    <path d="M280 536 380 566 280 596 180 566z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="563" font-size="12" font-weight="700" fill="#36424e">input valid?</text>
    <text x="280" y="577" font-size="11" fill="#36424e">types, no extra fields</text>

    <rect x="160" y="616" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="280" y="636" font-size="14" font-weight="700" fill="#66400f">Route handler</text>
    <text x="280" y="653" font-size="11.5" fill="#66400f">parameterized queries, execFile()</text>
    <rect x="160" y="690" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="280" y="710" font-size="14" font-weight="700" fill="#294a2e">Response</text>
    <text x="280" y="727" font-size="11.5" fill="#294a2e">with the helmet headers</text>

    <rect x="460" y="154" width="296" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="608" y="174" font-size="14" font-weight="700" fill="#6b241c">429 Too Many Requests</text>
    <text x="608" y="191" font-size="11.5" fill="#6b241c">+ Retry-After; slows brute force</text>
    <rect x="460" y="302" width="296" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="608" y="322" font-size="14" font-weight="700" fill="#6b241c">413 Content Too Large</text>
    <text x="608" y="339" font-size="11.5" fill="#6b241c">huge bodies are never parsed</text>
    <rect x="460" y="382" width="296" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="608" y="402" font-size="14" font-weight="700" fill="#6b241c">401 Unauthorized</text>
    <text x="608" y="419" font-size="11.5" fill="#6b241c">who is calling is unknown</text>
    <rect x="460" y="462" width="296" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="608" y="482" font-size="14" font-weight="700" fill="#6b241c">403 Forbidden</text>
    <text x="608" y="499" font-size="11.5" fill="#6b241c">logged in, but not allowed</text>
    <rect x="460" y="542" width="296" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="608" y="562" font-size="14" font-weight="700" fill="#6b241c">400 Bad Request</text>
    <text x="608" y="579" font-size="11.5" fill="#6b241c">wrong types or unexpected fields</text>
    <rect x="460" y="616" width="296" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="608" y="636" font-size="14" font-weight="700" fill="#6b241c">Error handler: 500</text>
    <text x="608" y="653" font-size="11.5" fill="#6b241c">generic message; details only in logs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M280 60V78" marker-end="url(#srp-arrow)"/>
      <path d="M280 128V146" marker-end="url(#srp-arrow)"/>
      <path d="M280 208V226" marker-end="url(#srp-arrow)"/>
      <path d="M280 276V294" marker-end="url(#srp-arrow)"/>
      <path d="M280 356V374" marker-end="url(#srp-arrow)"/>
      <path d="M280 436V454" marker-end="url(#srp-arrow)"/>
      <path d="M280 516V534" marker-end="url(#srp-arrow)"/>
      <path d="M280 596V614" marker-end="url(#srp-arrow)"/>
      <path d="M280 664V688" marker-end="url(#srp-arrow)"/>
      <path d="M380 178H458" marker-end="url(#srp-arrow)"/>
      <path d="M380 326H458" marker-end="url(#srp-arrow)"/>
      <path d="M380 406H458" marker-end="url(#srp-arrow)"/>
      <path d="M380 486H458" marker-end="url(#srp-arrow)"/>
      <path d="M380 566H458" marker-end="url(#srp-arrow)"/>
    </g>
    <path d="M400 640H458" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#srp-err)"/>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="419" y="171">no</text>
      <text x="419" y="319">no</text>
      <text x="419" y="399">no</text>
      <text x="419" y="479">no</text>
      <text x="419" y="559">no</text>
    </g>
    <text x="429" y="633" font-size="11.5" font-style="italic" fill="#b5473a">throws</text>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="290" y="222">yes</text>
      <text x="290" y="370">yes</text>
      <text x="290" y="450">yes</text>
      <text x="290" y="530">yes</text>
      <text x="290" y="610">yes</text>
    </g>
    <text x="390" y="764" font-size="13" fill="#40566b">Cheap checks run first, so abusive or invalid requests are rejected before they reach your data.</text>
  </g>
</svg>
