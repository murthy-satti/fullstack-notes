<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="als-title als-desc">
  <title id="als-title">What app.listen() sets up and how each request reaches the app</title>
  <desc id="als-desc">At startup, app.listen(3000, cb) makes Express call http.createServer(app), and the http.Server calls server.listen(3000) so the operating system binds TCP port 3000. If the port is free the callback runs and the server is listening; if not, the error is EADDRINUSE and Express 5 passes it to the callback. For every request, the client connects to port 3000, the operating system delivers the bytes, the http.Server emits a request event with req and res, and calls app(req, res), which runs middleware and routes. The response travels back to the client.</desc>
  <defs>
    <marker id="als-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="als-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="42" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">At startup: app.listen(3000, cb)</text>

    <rect x="24" y="56" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="104" y="80" font-size="14" font-weight="700" fill="#36424e">Your code</text>
    <text x="104" y="98" font-size="11.5" fill="#36424e">app.listen(3000, cb)</text>
    <rect x="214" y="56" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="294" y="80" font-size="14" font-weight="700" fill="#66400f">Express</text>
    <text x="294" y="98" font-size="11.5" fill="#66400f">http.createServer(app)</text>
    <rect x="404" y="56" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="484" y="80" font-size="14" font-weight="700" fill="#263e5a">http.Server</text>
    <text x="484" y="98" font-size="11.5" fill="#263e5a">server.listen(3000)</text>
    <rect x="594" y="56" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="674" y="80" font-size="14" font-weight="700" fill="#36424e">Operating system</text>
    <text x="674" y="98" font-size="11.5" fill="#36424e">binds TCP port 3000</text>

    <path d="M674 142 734 170 674 198 614 170z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="674" y="174" font-size="12" font-weight="700" fill="#36424e">port free?</text>

    <rect x="404" y="148" width="160" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="484" y="167" font-size="14" font-weight="700" fill="#294a2e">cb() runs</text>
    <text x="484" y="183" font-size="11.5" fill="#294a2e">server is listening</text>

    <rect x="594" y="222" width="160" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="674" y="242" font-size="14" font-weight="700" fill="#6b241c">EADDRINUSE</text>
    <text x="674" y="259" font-size="11.5" fill="#6b241c">Express 5: cb(error)</text>

    <text x="24" y="310" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">For every request</text>

    <rect x="24" y="324" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="104" y="348" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <text x="104" y="366" font-size="11.5" fill="#36424e">connects to :3000</text>
    <rect x="214" y="324" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="294" y="348" font-size="14" font-weight="700" fill="#36424e">Operating system</text>
    <text x="294" y="366" font-size="11.5" fill="#36424e">delivers the bytes</text>
    <rect x="404" y="324" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="484" y="348" font-size="14" font-weight="700" fill="#263e5a">http.Server</text>
    <text x="484" y="366" font-size="11.5" fill="#263e5a">emits "request"</text>
    <rect x="594" y="324" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="674" y="348" font-size="14" font-weight="700" fill="#66400f">app(req, res)</text>
    <text x="674" y="366" font-size="11.5" fill="#66400f">middleware, then routes</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M184 84H212" marker-end="url(#als-arrow)"/>
      <path d="M374 84H402" marker-end="url(#als-arrow)"/>
      <path d="M564 84H592" marker-end="url(#als-arrow)"/>
      <path d="M674 112V140" marker-end="url(#als-arrow)"/>
      <path d="M614 170H566" marker-end="url(#als-arrow)"/>
      <path d="M674 198V220" marker-end="url(#als-arrow)"/>
      <path d="M184 352H212" marker-end="url(#als-arrow)"/>
      <path d="M374 352H402" marker-end="url(#als-arrow)"/>
      <path d="M564 352H592" marker-end="url(#als-arrow)"/>
    </g>
    <path d="M674 380V404H104V382" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#als-arrow-ret)"/>

    <text x="590" y="162" font-size="12" font-weight="700" fill="#40566b">yes</text>
    <text x="690" y="214" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">no</text>
    <text x="389" y="422" font-size="11.5" fill="#40566b">response: res.json() / res.end() writes back on the same connection</text>
    <text x="390" y="454" font-size="13" fill="#40566b">app is just a (req, res) handler; app.listen() wraps it in a node:http server.</text>
  </g>
</svg>
