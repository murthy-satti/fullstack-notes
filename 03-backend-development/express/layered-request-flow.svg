<svg xmlns="http://www.w3.org/2000/svg" width="780" height="556" viewBox="0 0 780 556" role="img" aria-labelledby="lrf-title lrf-desc">
  <title id="lrf-title">One request through routes, controller, service, and repository</title>
  <desc id="lrf-desc">POST /api/tasks enters the router, which runs requireAuth and validation and calls the controller. The controller reads req.user.id and req.body and calls tasksService.create. The service applies the business rule and calls tasksRepository.insert, the only code that talks to the database. The stored task returns up the layers and the controller responds 201 Created with a Location header. If the service throws a ValidationError, the rejected promise reaches next(err) automatically in Express 5, and errorHandler turns the AppError into a 400 JSON error response.</desc>
  <defs>
    <marker id="lrf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lrf-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="lrf-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="556" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="190" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="310" y="45" font-size="14" font-weight="700" fill="#36424e">POST /api/tasks</text>

    <rect x="170" y="92" width="280" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="310" y="114" font-size="14" font-weight="700" fill="#263e5a">Routes: tasks.routes.js</text>
    <text x="310" y="133" font-size="11.5" fill="#263e5a">requireAuth, validate(createTaskSchema)</text>
    <rect x="170" y="180" width="280" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="310" y="202" font-size="14" font-weight="700" fill="#66400f">Controller: create(req, res)</text>
    <text x="310" y="221" font-size="11.5" fill="#66400f">knows HTTP, not the database</text>
    <rect x="170" y="268" width="280" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="310" y="290" font-size="14" font-weight="700" fill="#463365">Service: create(ownerId, data)</text>
    <text x="310" y="309" font-size="11.5" fill="#463365">business rules; no req, res, or status</text>
    <rect x="170" y="356" width="280" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="310" y="378" font-size="14" font-weight="700" fill="#36424e">Repository: insert(task)</text>
    <text x="310" y="397" font-size="11.5" fill="#36424e">the only layer that talks to the DB</text>
    <rect x="170" y="444" width="280" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="310" y="466" font-size="14" font-weight="700" fill="#36424e">Database</text>
    <text x="310" y="485" font-size="11.5" fill="#36424e">MongoDB, PostgreSQL, or in-memory</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M310 60V90" marker-end="url(#lrf-arrow)"/>
      <path d="M310 148V178" marker-end="url(#lrf-arrow)"/>
      <path d="M310 236V266" marker-end="url(#lrf-arrow)"/>
      <path d="M310 324V354" marker-end="url(#lrf-arrow)"/>
      <path d="M310 412V442" marker-end="url(#lrf-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="320" y="167">tasksController.create</text>
      <text x="320" y="255">tasksService.create(userId, body)</text>
      <text x="320" y="343">tasksRepository.insert(task)</text>
      <text x="320" y="431">insert query</text>
    </g>

    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 444V414" marker-end="url(#lrf-ret)"/>
      <path d="M210 356V326" marker-end="url(#lrf-ret)"/>
      <path d="M210 268V238" marker-end="url(#lrf-ret)"/>
      <path d="M170 208H150V40H188" marker-end="url(#lrf-ret)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#60788d" text-anchor="end">
      <text x="202" y="433">row</text>
      <text x="202" y="345">task</text>
      <text x="202" y="257">task</text>
      <text x="142" y="118">201 Created</text>
      <text x="142" y="133">+ Location</text>
    </g>

    <text x="628" y="346" font-size="12" font-weight="700" fill="#b5473a">error path, read bottom to top</text>
    <rect x="500" y="20" width="256" height="40" rx="20" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="628" y="45" font-size="14" font-weight="700" fill="#6b241c">400 Bad Request, JSON error</text>
    <rect x="500" y="92" width="256" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="628" y="114" font-size="14" font-weight="700" fill="#6b241c">errorHandler(err)</text>
    <text x="628" y="133" font-size="11.5" fill="#6b241c">AppError: res.status(err.status)</text>
    <rect x="500" y="180" width="256" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="628" y="202" font-size="14" font-weight="700" fill="#36424e">Promise rejects</text>
    <text x="628" y="221" font-size="11.5" fill="#36424e">Express 5 calls next(err)</text>
    <rect x="500" y="268" width="256" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="628" y="290" font-size="14" font-weight="700" fill="#6b241c">throw ValidationError</text>
    <text x="628" y="309" font-size="11.5" fill="#6b241c">status 400, VALIDATION_ERROR</text>

    <g fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M450 296H498" marker-end="url(#lrf-err)"/>
      <path d="M628 268V238" marker-end="url(#lrf-err)"/>
      <path d="M628 180V150" marker-end="url(#lrf-err)"/>
      <path d="M628 92V62" marker-end="url(#lrf-err)"/>
    </g>
    <text x="474" y="288" font-size="11.5" font-style="italic" fill="#b5473a">throws</text>
    <text x="390" y="536" font-size="13" fill="#40566b">Calls go down one layer at a time; results and errors travel back up to the HTTP layer.</text>
  </g>
</svg>
