<svg xmlns="http://www.w3.org/2000/svg" width="780" height="504" viewBox="0 0 780 504" role="img" aria-labelledby="nct-title nct-desc">
  <title id="nct-title">Where control goes for next(), next("route"), next("router"), and next(err)</title>
  <desc id="nct-desc">The app registers requestLogger, then mounts apiRouter at /api containing router.use(authenticate), router.get("/orders", checkCache, listOrders), and router.get("/orders", listOrdersLegacy); then app.get("/health"), the notFoundHandler, and errorHandler. While checkCache runs: next() runs listOrders in the same route; next("route") skips listOrders and continues with the next matching route, listOrdersLegacy; next("router") leaves apiRouter and continues with the entries after it, starting with app.get("/health"); next(err) skips all normal middleware and goes to errorHandler.</desc>
  <defs>
    <marker id="nct-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="nct-arrow-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="504" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="416" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="232" y="47" font-size="12.5" font-weight="700" fill="#263e5a">app.use(requestLogger)</text>

    <rect x="24" y="72" width="416" height="246" rx="10" fill="#faf7fe" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="40" y="91" font-size="12.5" font-weight="700" fill="#463365" text-anchor="start">app.use("/api", apiRouter)</text>
    <rect x="40" y="100" width="384" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="232" y="122" font-size="12.5" font-weight="700" fill="#463365">router.use(authenticate)</text>
    <rect x="40" y="144" width="384" height="118" rx="8" fill="#fffaf2" stroke="#bd7a20" stroke-width="2"/>
    <text x="232" y="162" font-size="12" font-weight="700" fill="#66400f">router.get("/orders", checkCache, listOrders)</text>
    <rect x="56" y="172" width="352" height="32" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="232" y="193" font-size="12.5" font-weight="700" fill="#66400f">checkCache (running now)</text>
    <rect x="56" y="220" width="352" height="32" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="232" y="241" font-size="12.5" fill="#66400f">listOrders</text>
    <rect x="40" y="272" width="384" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="232" y="294" font-size="12.5" font-weight="700" fill="#463365">router.get("/orders", listOrdersLegacy)</text>

    <rect x="24" y="330" width="416" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="232" y="352" font-size="12.5" font-weight="700" fill="#263e5a">app.get("/health", healthCheck)</text>
    <rect x="24" y="376" width="416" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="232" y="398" font-size="12.5" font-weight="700" fill="#36424e">app.use(notFoundHandler)</text>
    <rect x="24" y="422" width="416" height="34" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="232" y="444" font-size="12.5" font-weight="700" fill="#6b241c">app.use(errorHandler): (err, req, res, next)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M232 204V218" marker-end="url(#nct-arrow)"/>
      <path d="M408 180H470V289H426" marker-end="url(#nct-arrow)"/>
      <path d="M408 188H500V347H442" marker-end="url(#nct-arrow)"/>
    </g>
    <path d="M408 196H530V439H442" fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nct-arrow-err)"/>

    <g font-size="11" font-weight="700">
      <circle cx="252" cy="212" r="9" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
      <text x="252" y="216" fill="#40566b">1</text>
      <circle cx="470" cy="240" r="9" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
      <text x="470" y="244" fill="#40566b">2</text>
      <circle cx="500" cy="300" r="9" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
      <text x="500" y="304" fill="#40566b">3</text>
      <circle cx="530" cy="390" r="9" fill="#ffffff" stroke="#b5473a" stroke-width="1.5"/>
      <text x="530" y="394" fill="#6b241c">4</text>
    </g>

    <rect x="560" y="150" width="204" height="196" rx="10" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="662" y="171" font-size="12" font-weight="700" fill="#36424e">If checkCache calls...</text>
    <g font-size="11" font-weight="700">
      <circle cx="578" cy="192" r="9" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
      <text x="578" y="196" fill="#40566b">1</text>
      <circle cx="578" cy="232" r="9" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
      <text x="578" y="236" fill="#40566b">2</text>
      <circle cx="578" cy="272" r="9" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
      <text x="578" y="276" fill="#40566b">3</text>
      <circle cx="578" cy="312" r="9" fill="#ffffff" stroke="#b5473a" stroke-width="1.5"/>
      <text x="578" y="316" fill="#6b241c">4</text>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="594" y="196" font-weight="700">next()</text>
      <text x="594" y="211">listOrders runs next</text>
      <text x="594" y="236" font-weight="700">next("route")</text>
      <text x="594" y="251">next matching route</text>
      <text x="594" y="276" font-weight="700">next("router")</text>
      <text x="594" y="291">leaves apiRouter</text>
      <text x="594" y="316" font-weight="700" fill="#6b241c">next(err)</text>
      <text x="594" y="331" fill="#6b241c">jumps to errorHandler</text>
    </g>
    <text x="390" y="486" font-size="13" fill="#40566b">next() moves one step; "route", "router", and an error skip ahead by different amounts.</text>
  </g>
</svg>
