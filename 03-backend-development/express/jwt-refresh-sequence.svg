<svg xmlns="http://www.w3.org/2000/svg" width="780" height="708" viewBox="0 0 780 708" role="img" aria-labelledby="jrs-title jrs-desc">
  <title id="jrs-title">Short-lived access tokens with refresh-token rotation</title>
  <desc id="jrs-desc">At login the API stores a hash of a new refresh token and returns a 15-minute access token plus the refresh token in an HttpOnly cookie limited to /auth/refresh. API calls send the access token as a Bearer token and succeed. After the access token expires, a call returns 401 Token expired, so the client posts to /auth/refresh with the cookie. The API finds and deletes the old refresh hash, saves a new one, returns a new access token and a new refresh cookie, and the retried call succeeds.</desc>
  <defs>
    <marker id="jrs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="jrs-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="708" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="105" y="20" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="180" y="40" font-size="14" font-weight="700" fill="#263e5a">Client</text>
    <text x="180" y="57" font-size="11.5" fill="#263e5a">browser or app</text>
    <rect x="395" y="20" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="470" y="40" font-size="14" font-weight="700" fill="#66400f">Express API</text>
    <text x="470" y="57" font-size="11.5" fill="#66400f">/auth routes, requireJwt</text>
    <rect x="615" y="20" width="150" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="690" y="40" font-size="14" font-weight="700" fill="#463365">Refresh store</text>
    <text x="690" y="57" font-size="11.5" fill="#463365">hashed tokens</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M180 68V660"/>
      <path d="M470 68V660"/>
      <path d="M690 68V660"/>
    </g>
    <g stroke="#c3ccd7" stroke-width="1.5">
      <path d="M20 82H760M20 252H760M20 348H760M20 444H760"/>
    </g>
    <g font-size="12" font-weight="700" fill="#8062a8" text-anchor="start">
      <text x="24" y="100">Login</text>
      <text x="24" y="270">API calls</text>
      <text x="24" y="366">15 min later</text>
      <text x="24" y="462">Refresh</text>
    </g>

    <g text-anchor="start" fill="#36424e">
      <text x="192" y="104" font-size="12" font-weight="700">1. POST /auth/login</text>
      <text x="192" y="118" font-size="11">{ email, password }</text>
      <text x="482" y="150" font-size="12" font-weight="700">2. save sha256(refresh)</text>
      <text x="482" y="164" font-size="11">{ userId, expiresAt: +7 days }</text>
      <text x="192" y="198" font-size="12" font-weight="700">3. 200 { accessToken }, expires in 15m</text>
      <text x="192" y="212" font-size="11">Set-Cookie: refresh=...; HttpOnly; Secure;</text>
      <text x="192" y="226" font-size="11">Path=/auth/refresh; SameSite=Strict</text>
      <text x="192" y="276" font-size="12" font-weight="700">4. GET /orders</text>
      <text x="192" y="290" font-size="11">Authorization: Bearer &lt;access&gt;</text>
      <text x="192" y="322" font-size="12" font-weight="700">5. 200, jwt.verify() passed</text>
      <text x="192" y="372" font-size="12" font-weight="700">6. GET /orders, same token</text>
      <text x="192" y="404" font-size="12" font-weight="700" fill="#b5473a">7. 401 Token expired</text>
      <text x="192" y="418" font-size="11">WWW-Authenticate: Bearer</text>
      <text x="192" y="468" font-size="12" font-weight="700">8. POST /auth/refresh</text>
      <text x="192" y="482" font-size="11">Cookie: refresh=...</text>
      <text x="482" y="514" font-size="12" font-weight="700">9. find hash, delete it,</text>
      <text x="482" y="528" font-size="11">save a new one (rotation)</text>
      <text x="192" y="560" font-size="12" font-weight="700">10. 200 { new accessToken }</text>
      <text x="192" y="574" font-size="11">Set-Cookie: refresh=&lt;new token&gt;</text>
      <text x="192" y="606" font-size="12" font-weight="700">11. retry GET /orders, new Bearer</text>
      <text x="192" y="638" font-size="12" font-weight="700">12. 200 orders</text>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 128H468" stroke="#40566b" marker-end="url(#jrs-arrow)"/>
      <path d="M470 174H688" stroke="#40566b" marker-end="url(#jrs-arrow)"/>
      <path d="M470 236H182" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#jrs-ret)"/>
      <path d="M180 300H468" stroke="#40566b" marker-end="url(#jrs-arrow)"/>
      <path d="M470 332H182" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#jrs-ret)"/>
      <path d="M180 382H468" stroke="#40566b" marker-end="url(#jrs-arrow)"/>
      <path d="M470 428H182" stroke="#b5473a" stroke-dasharray="6 4" marker-end="url(#jrs-ret)"/>
      <path d="M180 492H468" stroke="#40566b" marker-end="url(#jrs-arrow)"/>
      <path d="M470 538H688" stroke="#40566b" marker-end="url(#jrs-arrow)"/>
      <path d="M470 584H182" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#jrs-ret)"/>
      <path d="M180 616H468" stroke="#40566b" marker-end="url(#jrs-arrow)"/>
      <path d="M470 648H182" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#jrs-ret)"/>
    </g>
    <text x="390" y="690" font-size="13" fill="#40566b">A stolen access token works for minutes; the refresh token is single-use and revocable.</text>
  </g>
</svg>
