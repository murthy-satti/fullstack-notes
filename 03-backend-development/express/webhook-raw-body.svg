<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="wrb-title wrb-desc">
  <title id="wrb-title">Verifying a webhook signature with the raw request body</title>
  <desc id="wrb-desc">The payment provider computes an HMAC-SHA256 signature over the raw body with a shared secret and sends the body with an X-Signature header. The webhook route uses express.raw, so req.body is a Buffer of the exact bytes. The route computes createHmac("sha256", secret).update(req.body) and compares it with the received signature using timingSafeEqual. If they differ it responds 401 Invalid signature. If they match it runs JSON.parse on the bytes, queues the event, and responds 204. If express.json ran first, the body would be parsed into an object and re-serialized, spaces or key order could change, and the HMAC over the new bytes would not match, so every genuine webhook would be rejected.</desc>
  <defs>
    <marker id="wrb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="wrb-arrow-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="20" width="340" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="42" font-size="14" font-weight="700" fill="#36424e">Payment provider</text>
    <text x="240" y="60" font-size="11.5" fill="#36424e">signature = HMAC-SHA256(secret, raw body)</text>

    <rect x="70" y="102" width="340" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="124" font-size="13" font-weight="700" fill="#263e5a">express.raw({ type: "application/json" })</text>
    <text x="240" y="142" font-size="11.5" fill="#263e5a">req.body = Buffer of the exact bytes</text>

    <rect x="70" y="178" width="340" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="240" y="200" font-size="12.5" font-weight="700" fill="#66400f">createHmac("sha256", secret).update(req.body)</text>
    <text x="240" y="218" font-size="11.5" fill="#66400f">expected = .digest()</text>

    <path d="M240 254 362 288 240 322 118 288z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="285" font-size="12" font-weight="700" fill="#36424e">timingSafeEqual(</text>
    <text x="240" y="299" font-size="12" font-weight="700" fill="#36424e">received, expected)?</text>

    <rect x="440" y="264" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="540" y="284" font-size="13" font-weight="700" fill="#6b241c">401 Invalid signature</text>
    <text x="540" y="301" font-size="11.5" fill="#6b241c">nothing is processed</text>

    <rect x="70" y="346" width="340" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="240" y="366" font-size="12.5" font-weight="700" fill="#66400f">JSON.parse(req.body.toString("utf8"))</text>
    <text x="240" y="383" font-size="11.5" fill="#66400f">only now read the event</text>

    <rect x="70" y="418" width="340" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="240" y="438" font-size="13" font-weight="700" fill="#294a2e">Queue the event</text>
    <text x="240" y="455" font-size="11.5" fill="#294a2e">res.sendStatus(204) quickly</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M240 72V100" marker-end="url(#wrb-arrow)"/>
      <path d="M240 154V176" marker-end="url(#wrb-arrow)"/>
      <path d="M240 230V252" marker-end="url(#wrb-arrow)"/>
      <path d="M362 288H438" marker-end="url(#wrb-arrow)"/>
      <path d="M240 322V344" marker-end="url(#wrb-arrow)"/>
      <path d="M240 394V416" marker-end="url(#wrb-arrow)"/>
    </g>
    <g font-size="11.5" fill="#40566b" text-anchor="start">
      <text x="250" y="90" font-style="italic">POST + X-Signature header</text>
      <text x="250" y="338" font-weight="700">match</text>
    </g>
    <text x="400" y="280" font-size="11.5" font-weight="700" fill="#40566b">differ</text>

    <rect x="470" y="20" width="306" height="216" rx="10" fill="#fffafa" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="623" y="42" font-size="13" font-weight="700" fill="#6b241c">Why not express.json() first?</text>
    <g font-size="11.5">
      <rect x="490" y="54" width="266" height="30" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="623" y="73" fill="#36424e">raw bytes from the provider</text>
      <rect x="490" y="100" width="266" height="30" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="623" y="119" fill="#263e5a">express.json(): bytes become an object</text>
      <rect x="490" y="146" width="266" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="623" y="165" fill="#66400f">re-serialized: spaces, key order change</text>
      <rect x="490" y="192" width="266" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="623" y="211" fill="#6b241c" font-weight="700">HMAC differs: real webhooks get 401</text>
    </g>
    <g fill="none" stroke="#b5473a" stroke-width="1.5" stroke-linecap="round">
      <path d="M623 84V98" marker-end="url(#wrb-arrow-err)"/>
      <path d="M623 130V144" marker-end="url(#wrb-arrow-err)"/>
      <path d="M623 176V190" marker-end="url(#wrb-arrow-err)"/>
    </g>
    <text x="400" y="488" font-size="13" fill="#40566b">Verify the signature over the exact bytes received, then parse; register this route before express.json().</text>
  </g>
</svg>
