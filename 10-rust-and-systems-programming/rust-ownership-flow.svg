<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-labelledby="title description">
  <title id="title">Rust ownership and borrowing</title>
  <desc id="description">An owned value can be borrowed for temporary shared reading or exclusive mutation, and the compiler checks that the borrow stays valid.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7b4b28"/>
    </marker>
  </defs>
  <rect width="720" height="190" rx="14" fill="#fbf6f0"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="32" y="61" width="160" height="62" rx="10" fill="#fff" stroke="#7b4b28" stroke-width="2"/>
    <text x="112" y="88" font-size="17" font-weight="600" fill="#4a2d19">Owned value</text>
    <text x="112" y="108" font-size="13" fill="#6a4b35">one owner</text>
    <rect x="280" y="24" width="182" height="55" rx="10" fill="#fff" stroke="#7b4b28" stroke-width="2"/>
    <text x="371" y="57" font-size="16" fill="#4a2d19">Shared borrow (&amp;T)</text>
    <rect x="280" y="111" width="182" height="55" rx="10" fill="#fff" stroke="#7b4b28" stroke-width="2"/>
    <text x="371" y="144" font-size="16" fill="#4a2d19">Mutable borrow (&amp;mut T)</text>
    <rect x="536" y="61" width="150" height="62" rx="10" fill="#fff" stroke="#7b4b28" stroke-width="2"/>
    <text x="611" y="88" font-size="16" font-weight="600" fill="#4a2d19">Compiler checks</text>
    <text x="611" y="108" font-size="13" fill="#6a4b35">valid, non-conflicting access</text>
    <g stroke="#7b4b28" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M198 73 L270 51"/>
      <path d="M198 112 L270 138"/>
      <path d="M468 51 L526 75"/>
      <path d="M468 138 L526 111"/>
    </g>
  </g>
</svg>
