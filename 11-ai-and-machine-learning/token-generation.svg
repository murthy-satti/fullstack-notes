<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Autoregressive token generation</title>
  <desc id="desc">A prompt is tokenized, the model estimates a distribution for the next token, a token is selected and appended, and the process repeats until a stop condition.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="25" y="80" width="145" height="80" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="97" y="113" font-size="17">Prompt</text><text x="97" y="138" font-size="13">token sequence</text>
    <rect x="220" y="80" width="165" height="80" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="302" y="113" font-size="17">Predict next</text><text x="302" y="138" font-size="13">token scores</text>
    <rect x="435" y="80" width="150" height="80" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="510" y="113" font-size="17">Select token</text><text x="510" y="138" font-size="13">decoding settings</text>
    <rect x="635" y="80" width="135" height="80" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="702" y="113" font-size="17">Append</text><text x="702" y="138" font-size="13">to sequence</text>
    <rect x="805" y="80" width="75" height="80" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="842" y="113" font-size="16">Stop?</text><text x="842" y="138" font-size="12">limit / token</text>
    <path d="M170 120H215 M385 120H430 M585 120H630 M770 120H800" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M842 165V205H302V165" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="575" y="225" font-size="13" fill="#465565">If not, predict another token; generation is not a database lookup.</text>
  </g>
</svg>
