<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Hands-on AI lab path</title>
  <desc id="desc">Learners progress through vectors, classification metrics, gradient descent, retrieval baselines, and evaluation experiments.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <g stroke-width="2"><rect x="20" y="75" width="165" height="82" rx="12" fill="#e8f1ff" stroke="#4776b8"/><rect x="220" y="75" width="165" height="82" rx="12" fill="#e9f7ef" stroke="#47845c"/><rect x="420" y="75" width="165" height="82" rx="12" fill="#fff4dd" stroke="#bd8730"/><rect x="620" y="75" width="165" height="82" rx="12" fill="#f3eaff" stroke="#8056aa"/><rect x="820" y="75" width="160" height="82" rx="12" fill="#fff0e8" stroke="#b7683e"/></g>
    <text x="102" y="108" font-size="16">Vectors</text><text x="102" y="134" font-size="13">similarity</text>
    <text x="302" y="108" font-size="16">Metrics</text><text x="302" y="134" font-size="13">precision + recall</text>
    <text x="502" y="108" font-size="16">Optimization</text><text x="502" y="134" font-size="13">gradient descent</text>
    <text x="702" y="108" font-size="16">Retrieval</text><text x="702" y="134" font-size="13">rank evidence</text>
    <text x="900" y="108" font-size="16">Evaluation</text><text x="900" y="134" font-size="13">compare versions</text>
    <path d="M185 116H215 M385 116H415 M585 116H615 M785 116H815" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="500" y="200" font-size="14" fill="#465565">Each lab creates a reusable test and a measurable expected result.</text>
  </g>
</svg>
