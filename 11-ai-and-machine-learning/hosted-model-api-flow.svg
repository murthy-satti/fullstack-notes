<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">Hosted model API flow</title>
  <desc id="desc">A browser sends input to the application backend. The backend checks identity, permissions, and limits, calls the provider with a server-side key, validates the response, and returns it.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="25" y="85" width="130" height="80" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="90" y="119" font-size="18">Browser</text><text x="90" y="144" font-size="13">no secret key</text>
    <rect x="205" y="85" width="170" height="80" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="290" y="119" font-size="18">Your backend</text><text x="290" y="144" font-size="13">auth + quota</text>
    <rect x="430" y="85" width="170" height="80" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="515" y="119" font-size="17">Provider API</text><text x="515" y="144" font-size="13">server credential</text>
    <rect x="655" y="85" width="230" height="80" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="770" y="119" font-size="17">Check and return</text><text x="770" y="144" font-size="13">schema + error handling</text>
    <path d="M155 125H200 M375 125H425 M600 125H650" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="290" y="205" font-size="14" fill="#465565">Keep provider credentials in server-side secret storage.</text>
  </g>
</svg>
