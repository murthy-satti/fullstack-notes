<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 250" role="img" aria-labelledby="title desc">
  <title id="title">Media file to model input</title>
  <desc id="desc">An image, audio, or video file is validated, decoded according to its format, preprocessed into model-compatible representations, then evaluated by a model.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="25" y="75" width="160" height="84" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="105" y="108" font-size="17">Media file</text><text x="105" y="133" font-size="13">PNG / MP4 / WAV</text>
    <rect x="230" y="75" width="160" height="84" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="310" y="108" font-size="17">Validate</text><text x="310" y="133" font-size="13">type + size + policy</text>
    <rect x="435" y="75" width="160" height="84" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="515" y="108" font-size="17">Decode</text><text x="515" y="133" font-size="13">pixels / samples / frames</text>
    <rect x="640" y="75" width="160" height="84" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="720" y="108" font-size="17">Preprocess</text><text x="720" y="133" font-size="13">resize / crop / resample</text>
    <rect x="845" y="75" width="150" height="84" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="920" y="108" font-size="17">Model input</text><text x="920" y="133" font-size="13">tensor / patches / tokens</text>
    <path d="M185 117H225 M390 117H430 M595 117H635 M800 117H840" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="510" y="210" font-size="14" fill="#465565">File extension is not proof of actual content or model compatibility.</text>
  </g>
</svg>
