<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
  <title id="title">Computer vision task outputs</title>
  <desc id="desc">The same image can be processed for a whole-image label, object boxes, pixel masks, or recognized text.</desc>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="560" y="34" font-size="19" font-weight="bold">Choose a vision task by the output you need</text>
    <g transform="translate(40 70)">
      <rect width="230" height="150" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
      <circle cx="115" cy="63" r="32" fill="#f4c95d" stroke="#b48120" stroke-width="2"/>
      <path d="M80 107 Q115 80 150 107" fill="#78a86b" stroke="#4776b8" stroke-width="2"/>
      <text x="115" y="137" font-size="15" font-weight="bold">Classification</text>
      <text x="115" y="168" font-size="13">One label for the image</text>
    </g>
    <g transform="translate(320 70)">
      <rect width="230" height="150" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
      <circle cx="115" cy="63" r="32" fill="#f4c95d" stroke="#b48120" stroke-width="2"/>
      <rect x="74" y="25" width="82" height="77" fill="none" stroke="#c45146" stroke-width="3"/>
      <text x="115" y="137" font-size="15" font-weight="bold">Detection</text>
      <text x="115" y="168" font-size="13">Labels + bounding boxes</text>
    </g>
    <g transform="translate(600 70)">
      <rect width="230" height="150" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
      <circle cx="115" cy="63" r="32" fill="#f4c95d" stroke="#b48120" stroke-width="2"/>
      <path d="M115 31 A32 32 0 0 1 144 77 L115 63 Z" fill="#7666aa"/>
      <path d="M115 63 L144 77 A32 32 0 0 1 85 81 Z" fill="#61a58a"/>
      <text x="115" y="137" font-size="15" font-weight="bold">Segmentation</text>
      <text x="115" y="168" font-size="13">Class or instance masks</text>
    </g>
    <g transform="translate(880 70)">
      <rect width="200" height="150" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
      <rect x="47" y="34" width="106" height="62" rx="4" fill="white" stroke="#8056aa" stroke-width="2"/>
      <path d="M62 50 H137 M62 64 H126 M62 78 H132" stroke="#526477" stroke-width="3"/>
      <text x="100" y="137" font-size="15" font-weight="bold">OCR</text>
      <text x="100" y="168" font-size="13">Recognized text</text>
    </g>
  </g>
</svg>
