<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Small model training lifecycle</title>
  <desc id="desc">A reproducible training exercise records data and configuration, fits a model, evaluates it, inspects errors, and only then uses it for inference.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="560" y="34" font-size="19" font-weight="bold">A small, reproducible training cycle</text>
    <rect x="36" y="82" width="190" height="112" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
    <text x="131" y="122" font-size="16" font-weight="bold">Dataset + split</text>
    <text x="131" y="152" font-size="13">Record seed + labels</text>
    <path d="M230 138 H260" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="268" y="82" width="190" height="112" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
    <text x="363" y="122" font-size="16" font-weight="bold">Fit pipeline</text>
    <text x="363" y="152" font-size="13">Train split only</text>
    <path d="M462 138 H492" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="500" y="82" width="190" height="112" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="595" y="122" font-size="16" font-weight="bold">Evaluate</text>
    <text x="595" y="152" font-size="13">Held-out metrics</text>
    <path d="M694 138 H724" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="732" y="82" width="160" height="112" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
    <text x="812" y="122" font-size="16" font-weight="bold">Inspect</text>
    <text x="812" y="152" font-size="13">Errors + limits</text>
    <path d="M896 138 H926" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="934" y="82" width="150" height="112" rx="12" fill="#e7f6f7" stroke="#42858a" stroke-width="2"/>
    <text x="1009" y="122" font-size="16" font-weight="bold">Predict</text>
    <text x="1009" y="152" font-size="13">New example</text>
  </g>
</svg>
