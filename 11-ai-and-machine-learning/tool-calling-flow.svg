<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Safe tool-calling flow</title>
  <desc id="desc">A model proposes a named tool and arguments. The backend validates the request, checks permissions and confirmation requirements, executes a narrow tool, and returns the result to the model for a final response.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="25" y="78" width="140" height="84" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="95" y="112" font-size="17">User request</text><text x="95" y="138" font-size="13">goal</text>
    <rect x="220" y="78" width="150" height="84" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="295" y="112" font-size="17">Model proposes</text><text x="295" y="138" font-size="13">tool + arguments</text>
    <rect x="425" y="55" width="175" height="130" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="512" y="95" font-size="17">Backend checks</text><text x="512" y="121" font-size="13">schema + permission</text><text x="512" y="145" font-size="13">confirm if needed</text>
    <rect x="655" y="78" width="130" height="84" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="720" y="112" font-size="17">Tool runs</text><text x="720" y="138" font-size="13">narrow action</text>
    <rect x="835" y="78" width="100" height="84" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="885" y="112" font-size="16">Result</text><text x="885" y="138" font-size="13">to model</text>
    <path d="M165 120H215 M370 120H420 M600 120H650 M785 120H830" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="480" y="224" font-size="14" fill="#465565">A model's request is data, not authorization to perform the action.</text>
  </g>
</svg>
