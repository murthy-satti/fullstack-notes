<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">Computer vision inference pipeline</title>
  <desc id="desc">An image is validated and decoded, preprocessed for a task-specific model, then its prediction is checked and presented.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="560" y="34" font-size="19" font-weight="bold">Computer vision inference pipeline</text>
    <rect x="22" y="78" width="196" height="120" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
    <text x="120" y="118" font-size="16" font-weight="bold">Image upload</text>
    <text x="120" y="148" font-size="13">Validate type + size</text>
    <path d="M222 138 H246" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="252" y="78" width="196" height="120" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
    <text x="350" y="118" font-size="16" font-weight="bold">Decode</text>
    <text x="350" y="148" font-size="13">Pixels + color channels</text>
    <path d="M452 138 H476" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="482" y="78" width="196" height="120" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="580" y="118" font-size="16" font-weight="bold">Preprocess</text>
    <text x="580" y="148" font-size="13">Resize + normalize</text>
    <path d="M682 138 H706" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="712" y="78" width="176" height="120" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
    <text x="800" y="118" font-size="16" font-weight="bold">Model</text>
    <text x="800" y="148" font-size="13">Task-specific output</text>
    <path d="M892 138 H916" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="922" y="78" width="176" height="120" rx="12" fill="#e7f6f7" stroke="#42858a" stroke-width="2"/>
    <text x="1010" y="118" font-size="16" font-weight="bold">Validate + show</text>
    <text x="1010" y="148" font-size="13">Label / box / mask</text>
  </g>
</svg>
