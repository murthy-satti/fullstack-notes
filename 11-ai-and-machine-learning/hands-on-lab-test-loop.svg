<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Repeatable hands-on lab test loop</title>
  <desc id="desc">A lab records a fixture and expected result, runs code or a model, compares observed output, and adds a regression check before changing one factor.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="30" y="76" width="190" height="86" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="125" y="111" font-size="17">Input fixture</text><text x="125" y="138" font-size="13">small + reproducible</text>
    <rect x="270" y="76" width="190" height="86" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="365" y="111" font-size="17">Expected result</text><text x="365" y="138" font-size="13">written before run</text>
    <rect x="510" y="76" width="190" height="86" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="605" y="111" font-size="17">Observed output</text><text x="605" y="138" font-size="13">code or model result</text>
    <rect x="750" y="76" width="210" height="86" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="855" y="111" font-size="17">Compare + test</text><text x="855" y="138" font-size="13">record regression</text>
    <path d="M220 119H265 M460 119H505 M700 119H745" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M855 168V204H125V168" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="495" y="226" font-size="13" fill="#465565">Change one variable, then rerun the same fixture.</text>
  </g>
</svg>
