<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" role="img" aria-labelledby="title desc">
  <title id="title">Prompt assembly</title>
  <desc id="desc">The application composes task instructions, trusted context, user input, constraints, and output format into a bounded prompt before inference, then validates the model response.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="25" y="38" width="165" height="48" rx="10" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="107" y="68" font-size="15">Task instructions</text>
    <rect x="25" y="103" width="165" height="48" rx="10" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="107" y="133" font-size="15">Trusted context</text>
    <rect x="25" y="168" width="165" height="48" rx="10" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="107" y="198" font-size="15">User input</text>
    <rect x="255" y="75" width="195" height="100" rx="14" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="352" y="113" font-size="17">Compose prompt</text><text x="352" y="141" font-size="13">limits + output schema</text>
    <rect x="520" y="75" width="160" height="100" rx="14" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="600" y="113" font-size="17">Model inference</text><text x="600" y="141" font-size="13">bounded context</text>
    <rect x="745" y="75" width="165" height="100" rx="14" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="827" y="113" font-size="17">Validate response</text><text x="827" y="141" font-size="13">parse + business rules</text>
    <path d="M190 62L250 97 M190 127H250 M190 192L250 154 M450 125H515 M680 125H740" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="470" y="235" font-size="14" fill="#465565">Prompt wording helps; application code enforces authorization and limits.</text>
  </g>
</svg>
