<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">AI application request flow</title>
  <desc id="desc">The browser sends a request to a backend, which authorizes it, optionally retrieves context or calls an approved tool, calls a model, checks the response, and returns it.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="20" y="88" width="130" height="76" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="85" y="121" font-size="18">Browser</text><text x="85" y="145" font-size="13">user request</text>
    <rect x="195" y="88" width="150" height="76" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="270" y="121" font-size="18">Backend</text><text x="270" y="145" font-size="13">auth + validation</text>
    <rect x="395" y="22" width="165" height="70" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="477" y="52" font-size="17">Authorized data</text><text x="477" y="74" font-size="13">retrieval / tools</text>
    <rect x="395" y="158" width="165" height="70" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="477" y="188" font-size="18">Model</text><text x="477" y="210" font-size="13">hosted or local</text>
    <rect x="625" y="88" width="145" height="76" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="697" y="121" font-size="17">Check output</text><text x="697" y="145" font-size="13">format + policy</text>
    <rect x="820" y="88" width="120" height="76" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="880" y="121" font-size="18">Response</text><text x="880" y="145" font-size="13">to user</text>
    <path d="M150 126H190 M345 108L390 72 M345 144L390 185 M560 193L620 145 M770 126H815" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
