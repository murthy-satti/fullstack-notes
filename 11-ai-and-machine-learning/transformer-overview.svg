<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">Simplified transformer flow</title>
  <desc id="desc">Input tokens become vectors with position information, pass through repeated attention and feed-forward layers, and produce contextual representations or output scores.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="25" y="96" width="135" height="84" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="92" y="130" font-size="17">Input tokens</text><text x="92" y="155" font-size="13">words / pieces</text>
    <rect x="205" y="96" width="150" height="84" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="280" y="130" font-size="17">Embeddings</text><text x="280" y="155" font-size="13">+ position signal</text>
    <rect x="400" y="65" width="190" height="62" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="495" y="103" font-size="17">Attention</text>
    <rect x="400" y="151" width="190" height="62" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="495" y="189" font-size="17">Feed-forward layer</text>
    <rect x="635" y="96" width="130" height="84" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="700" y="130" font-size="17">Output scores</text><text x="700" y="155" font-size="13">over vocabulary</text>
    <rect x="805" y="96" width="100" height="84" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="855" y="130" font-size="17">Next</text><text x="855" y="155" font-size="13">step / task</text>
    <path d="M160 138H200 M355 138H390 M590 96L630 126 M590 182L630 151 M765 138H800" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="495" y="244" font-size="14" fill="#465565">Attention and feed-forward blocks are repeated in the model.</text>
  </g>
</svg>
