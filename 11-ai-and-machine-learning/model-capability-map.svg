<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Model capabilities by input and output</title>
  <desc id="desc">Text, image, audio, and video inputs can be analyzed by suitable models; text, images, audio, video, labels, and vectors can be produced depending on model capability.</desc>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="460" y="34" font-size="20" font-weight="bold">Choose a model by the task, not the label</text>
    <g fill="#e8f1ff" stroke="#4776b8" stroke-width="2">
      <rect x="40" y="70" width="175" height="50" rx="10"/><rect x="40" y="137" width="175" height="50" rx="10"/><rect x="40" y="204" width="175" height="50" rx="10"/>
      <rect x="705" y="62" width="175" height="42" rx="10"/><rect x="705" y="112" width="175" height="42" rx="10"/><rect x="705" y="162" width="175" height="42" rx="10"/><rect x="705" y="212" width="175" height="42" rx="10"/>
    </g>
    <rect x="350" y="104" width="220" height="120" rx="18" fill="#f3eaff" stroke="#8056aa" stroke-width="3"/>
    <text x="127" y="101" font-size="16">Text / code</text><text x="127" y="168" font-size="16">Image</text><text x="127" y="235" font-size="16">Audio / video</text>
    <text x="460" y="152" font-size="20">Model capability</text><text x="460" y="180" font-size="14">text, vision, speech,</text><text x="460" y="201" font-size="14">generation, embedding</text>
    <text x="792" y="89" font-size="15">Text / code</text><text x="792" y="139" font-size="15">Image</text><text x="792" y="189" font-size="15">Audio</text><text x="792" y="239" font-size="15">Labels / vectors</text>
    <g stroke="#526477" stroke-width="2"><path d="M215 95L345 137"/><path d="M215 162H345"/><path d="M215 229L345 194"/><path d="M570 137L700 83"/><path d="M570 151L700 133"/><path d="M570 175L700 183"/><path d="M570 195L700 233"/></g>
    <text x="460" y="280" font-size="13" fill="#465565">Not every model accepts or generates every modality.</text>
  </g>
</svg>
