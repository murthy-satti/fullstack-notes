<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Model training lifecycle</title>
  <desc id="desc">Model development governs data, prepares inputs, pretrains a base model, post-trains behavior, evaluates capabilities and risks, then deploys and monitors a versioned model.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <g stroke-width="2"><rect x="20" y="82" width="135" height="82" rx="12" fill="#e8f1ff" stroke="#4776b8"/><rect x="180" y="82" width="135" height="82" rx="12" fill="#e9f7ef" stroke="#47845c"/><rect x="340" y="82" width="135" height="82" rx="12" fill="#fff4dd" stroke="#bd8730"/><rect x="500" y="82" width="135" height="82" rx="12" fill="#f3eaff" stroke="#8056aa"/><rect x="660" y="82" width="135" height="82" rx="12" fill="#fff0e8" stroke="#b7683e"/><rect x="820" y="82" width="120" height="82" rx="12" fill="#e8f1ff" stroke="#4776b8"/></g>
    <text x="87" y="116" font-size="15">Govern data</text><text x="87" y="141" font-size="12">rights + quality</text>
    <text x="247" y="116" font-size="15">Prepare</text><text x="247" y="141" font-size="12">tokens / inputs</text>
    <text x="407" y="116" font-size="15">Pretrain</text><text x="407" y="141" font-size="12">learn patterns</text>
    <text x="567" y="116" font-size="15">Post-train</text><text x="567" y="141" font-size="12">shape behavior</text>
    <text x="727" y="116" font-size="15">Evaluate</text><text x="727" y="141" font-size="12">capability + risk</text>
    <text x="880" y="116" font-size="15">Deploy</text><text x="880" y="141" font-size="12">monitor version</text>
    <path d="M155 123H175 M315 123H335 M475 123H495 M635 123H655 M795 123H815" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="480" y="213" font-size="14" fill="#465565">Each stage requires expertise, compute, evaluation, and ongoing operational work.</text>
  </g>
</svg>
