<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">Embedding and retrieval flow</title>
  <desc id="desc">Documents are authorized, split into chunks, converted to vectors, and indexed. At query time the query is embedded and similar permitted chunks are retrieved with their source references.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="242" y="38" font-size="17" font-weight="bold">Indexing</text>
    <rect x="25" y="65" width="125" height="66" rx="10" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="87" y="94" font-size="15">Documents</text><text x="87" y="115" font-size="12">check access</text>
    <rect x="190" y="65" width="125" height="66" rx="10" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="252" y="94" font-size="15">Chunks</text><text x="252" y="115" font-size="12">keep source IDs</text>
    <rect x="355" y="65" width="125" height="66" rx="10" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="417" y="94" font-size="15">Embed</text><text x="417" y="115" font-size="12">text to vector</text>
    <rect x="520" y="65" width="125" height="66" rx="10" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="582" y="94" font-size="15">Vector index</text><text x="582" y="115" font-size="12">vectors + metadata</text>
    <text x="765" y="38" font-size="17" font-weight="bold">Query time</text>
    <rect x="685" y="65" width="115" height="66" rx="10" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="742" y="94" font-size="15">Query</text><text x="742" y="115" font-size="12">embed + authorize</text>
    <rect x="835" y="65" width="105" height="66" rx="10" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="887" y="94" font-size="15">Top matches</text><text x="887" y="115" font-size="12">source linked</text>
    <path d="M150 98H185 M315 98H350 M480 98H515 M645 98H680 M800 98H830" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="480" y="190" font-size="16">Similarity helps find related content; it does not prove truth or grant access.</text>
    <text x="480" y="220" font-size="13" fill="#465565">Apply user and tenant permissions before returning matches to the model.</text>
  </g>
</svg>
