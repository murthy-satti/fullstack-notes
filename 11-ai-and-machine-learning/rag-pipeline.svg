<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval-augmented generation pipeline</title>
  <desc id="desc">Documents are prepared and indexed. For a question, the system authorizes access, retrieves relevant source passages, assembles context, generates an answer, and checks citations and output.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="470" y="30" font-size="17" font-weight="bold">Prepare sources before a user query</text>
    <rect x="30" y="48" width="150" height="52" rx="10" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="105" y="80" font-size="15">Chunk + embed</text>
    <rect x="235" y="48" width="155" height="52" rx="10" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="312" y="80" font-size="15">Index + metadata</text>
    <path d="M180 74H230" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="470" y="145" font-size="17" font-weight="bold">At question time</text>
    <g stroke-width="2">
      <rect x="25" y="168" width="125" height="72" rx="10" fill="#e8f1ff" stroke="#4776b8"/><rect x="185" y="168" width="135" height="72" rx="10" fill="#e9f7ef" stroke="#47845c"/><rect x="355" y="168" width="135" height="72" rx="10" fill="#fff4dd" stroke="#bd8730"/><rect x="525" y="168" width="135" height="72" rx="10" fill="#f3eaff" stroke="#8056aa"/><rect x="695" y="168" width="125" height="72" rx="10" fill="#fff0e8" stroke="#b7683e"/><rect x="850" y="168" width="95" height="72" rx="10" fill="#e8f1ff" stroke="#4776b8"/>
    </g>
    <text x="87" y="197" font-size="15">Question</text><text x="87" y="220" font-size="12">authenticate</text>
    <text x="252" y="197" font-size="15">Retrieve</text><text x="252" y="220" font-size="12">filter permissions</text>
    <text x="422" y="197" font-size="15">Passages</text><text x="422" y="220" font-size="12">with citations</text>
    <text x="592" y="197" font-size="15">Prompt + model</text><text x="592" y="220" font-size="12">bounded context</text>
    <text x="757" y="197" font-size="15">Check answer</text><text x="757" y="220" font-size="12">claims + sources</text>
    <text x="897" y="197" font-size="14">Respond</text><text x="897" y="220" font-size="12">or no answer</text>
    <path d="M150 204H180 M320 204H350 M490 204H520 M660 204H690 M820 204H845" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="480" y="273" font-size="13" fill="#465565">RAG can ground an answer in sources; it cannot guarantee correctness.</text>
  </g>
</svg>
