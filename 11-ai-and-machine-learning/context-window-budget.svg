<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Context-window budget</title>
  <desc id="desc">Instructions, conversation history, retrieved evidence, tool definitions, and generated output all compete for context capacity.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="560.0" y="34" font-size="19" font-weight="bold">Context-window budget</text>
    <rect x="24.0" y="78" width="242.5" height="112" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
    <text x="145.2" y="118" font-size="16" font-weight="bold">Instructions</text>
    <text x="145.2" y="146" font-size="13">Policy and task</text>
    <path d="M270.5 134.0 H295.5" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="300.5" y="78" width="242.5" height="112" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
    <text x="421.8" y="118" font-size="16" font-weight="bold">History + tools</text>
    <text x="421.8" y="146" font-size="13">Useful conversation state</text>
    <path d="M547.0 134.0 H572.0" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="577.0" y="78" width="242.5" height="112" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="698.2" y="118" font-size="16" font-weight="bold">Retrieved evidence</text>
    <text x="698.2" y="146" font-size="13">Relevant bounded chunks</text>
    <path d="M823.5 134.0 H848.5" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="853.5" y="78" width="242.5" height="112" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
    <text x="974.8" y="118" font-size="16" font-weight="bold">Output budget</text>
    <text x="974.8" y="146" font-size="13">Available tokens remain</text>
  </g>
</svg>
