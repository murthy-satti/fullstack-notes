<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">A recursive DNS lookup</title>
  <desc id="desc">The client asks a recursive resolver. On a cache miss the resolver asks root, top-level-domain, and authoritative DNS servers, then returns and caches the answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#718496;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style>
  </defs>
  <rect x="12" y="72" width="112" height="58" rx="8" class="box"/><text x="68" y="96" text-anchor="middle" class="title">Device</text><text x="68" y="114" text-anchor="middle" class="small">asks for a name</text>
  <rect x="158" y="72" width="130" height="58" rx="8" class="box"/><text x="223" y="96" text-anchor="middle" class="title">Recursive</text><text x="223" y="114" text-anchor="middle" class="small">resolver + cache</text>
  <rect x="322" y="72" width="104" height="58" rx="8" class="box"/><text x="374" y="96" text-anchor="middle" class="title">Root</text><text x="374" y="114" text-anchor="middle" class="small">refers to .com</text>
  <rect x="460" y="72" width="104" height="58" rx="8" class="box"/><text x="512" y="96" text-anchor="middle" class="title">.com TLD</text><text x="512" y="114" text-anchor="middle" class="small">refers to domain</text>
  <rect x="598" y="72" width="112" height="58" rx="8" class="box"/><text x="654" y="96" text-anchor="middle" class="title">Authoritative</text><text x="654" y="114" text-anchor="middle" class="small">returns record</text>
  <path d="M124 92H151M288 84H315M426 84H453M564 84H591" class="line"/>
  <path d="M591 118H564M453 118H426M315 118H288M151 118H124" class="return"/>
  <text x="360" y="171" text-anchor="middle" class="small">On a cache miss, referrals go out; the answer returns to the resolver and then the device.</text>
  <text x="360" y="190" text-anchor="middle" class="small">The resolver caches the answer for its TTL. A cache hit skips the referrals.</text>
</svg>
