<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" role="img" aria-labelledby="title desc">
  <title id="title">Simplified TLS handshake</title>
  <desc id="desc">The client and server negotiate parameters and key agreement, the server presents a certificate for validation, and both sides confirm keys before protected application data flows.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.head{font-size:14px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.back{stroke:#718496;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style>
  </defs>
  <text x="120" y="30" text-anchor="middle" class="head">Client</text><text x="580" y="30" text-anchor="middle" class="head">Server</text>
  <path d="M130 58H570" class="line"/><text x="350" y="52" text-anchor="middle" class="small">supported versions and key-agreement data</text>
  <path d="M570 95H130" class="back"/><text x="350" y="89" text-anchor="middle" class="small">selected parameters + certificate</text>
  <rect x="227" y="108" width="246" height="38" rx="7" fill="#fff7e6" stroke="#b37a16"/><text x="350" y="132" text-anchor="middle" class="small">Client checks trust, validity, and host name</text>
  <path d="M130 170H570" class="line"/><text x="350" y="164" text-anchor="middle" class="small">handshake confirmation</text>
  <path d="M130 211H570" class="line"/><text x="350" y="205" text-anchor="middle" class="small">application data protected with derived session keys</text>
</svg>
