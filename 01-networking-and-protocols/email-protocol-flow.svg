<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Email protocol flow</title>
  <desc id="desc">A sender submits email by SMTP, mail servers transfer it by SMTP, and a recipient reads the mailbox by IMAP or POP3.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="12" y="76" width="130" height="62" rx="8" class="box"/>
  <rect x="207" y="76" width="150" height="62" rx="8" class="box"/>
  <rect x="403" y="76" width="150" height="62" rx="8" class="box"/>
  <rect x="618" y="76" width="130" height="62" rx="8" class="box"/>
  <text x="77" y="101" text-anchor="middle" class="title">Sender client</text><text x="77" y="120" text-anchor="middle" class="small">mail app or webmail</text>
  <text x="282" y="101" text-anchor="middle" class="title">Sending provider</text><text x="282" y="120" text-anchor="middle" class="small">mail server</text>
  <text x="478" y="101" text-anchor="middle" class="title">Receiving provider</text><text x="478" y="120" text-anchor="middle" class="small">mail server + mailbox</text>
  <text x="683" y="101" text-anchor="middle" class="title">Recipient client</text><text x="683" y="120" text-anchor="middle" class="small">mail app or webmail</text>
  <path d="M142 92H199M357 92H395M553 122H610" class="line"/>
  <text x="171" y="65" text-anchor="middle" class="small">SMTP submission</text>
  <text x="380" y="65" text-anchor="middle" class="small">SMTP transfer</text>
  <text x="582" y="157" text-anchor="middle" class="small">IMAP or POP3</text>
  <text x="380" y="205" text-anchor="middle" class="small">DNS MX records help sending servers locate the receiving mail system.</text>
</svg>
