<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">Application and database port boundaries</title>
  <desc id="desc">A browser reaches a public HTTPS endpoint on port 443, which forwards to an application service; the application reaches a database on a private network while the database port is not exposed publicly.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.private{fill:#f4f7ed;stroke:#56723d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="20" y="88" width="130" height="62" rx="8" class="box"/>
  <rect x="220" y="88" width="150" height="62" rx="8" class="box"/>
  <rect x="444" y="88" width="142" height="62" rx="8" class="box"/>
  <rect x="620" y="88" width="125" height="62" rx="8" class="private"/>
  <text x="85" y="113" text-anchor="middle" class="title">Browser</text><text x="85" y="132" text-anchor="middle" class="small">client ephemeral port</text>
  <text x="295" y="113" text-anchor="middle" class="title">HTTPS edge</text><text x="295" y="132" text-anchor="middle" class="small">TCP or UDP 443</text>
  <text x="515" y="113" text-anchor="middle" class="title">Application</text><text x="515" y="132" text-anchor="middle" class="small">private service port</text>
  <text x="682" y="113" text-anchor="middle" class="title">Database</text><text x="682" y="132" text-anchor="middle" class="small">private TCP port</text>
  <path d="M150 119H213M370 119H437M586 119H613" class="line"/>
  <rect x="202" y="42" width="389" height="165" rx="16" fill="none" stroke="#8aa0b1" stroke-dasharray="6 5"/>
  <text x="396" y="230" text-anchor="middle" class="small">Expose only intended public endpoints; restrict database access to authorized application networks.</text>
</svg>
