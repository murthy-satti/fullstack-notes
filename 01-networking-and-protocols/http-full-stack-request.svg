<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">Full-stack HTTPS API request</title>
  <desc id="desc">The browser resolves the API domain, establishes a protected HTTPS connection to a reverse proxy, and the proxy forwards the request to the backend application, which returns a response.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#718496;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style>
  </defs>
  <rect x="14" y="75" width="120" height="60" rx="8" class="box"/>
  <rect x="178" y="75" width="120" height="60" rx="8" class="box"/>
  <rect x="342" y="75" width="140" height="60" rx="8" class="box"/>
  <rect x="526" y="75" width="130" height="60" rx="8" class="box"/>
  <rect x="700" y="75" width="106" height="60" rx="8" class="box"/>
  <text x="74" y="100" text-anchor="middle" class="title">Browser</text><text x="74" y="119" text-anchor="middle" class="small">frontend + fetch</text>
  <text x="238" y="100" text-anchor="middle" class="title">DNS resolver</text><text x="238" y="119" text-anchor="middle" class="small">find API address</text>
  <text x="412" y="100" text-anchor="middle" class="title">HTTPS / TLS</text><text x="412" y="119" text-anchor="middle" class="small">encrypted connection</text>
  <text x="591" y="100" text-anchor="middle" class="title">Reverse proxy</text><text x="591" y="119" text-anchor="middle" class="small">TLS + routing</text>
  <text x="753" y="100" text-anchor="middle" class="title">Backend</text><text x="753" y="119" text-anchor="middle" class="small">logic + data</text>
  <path d="M134 86H171M298 86H335M482 86H519M656 86H693" class="line"/>
  <text x="238" y="62" text-anchor="middle" class="small">resolve api.example</text>
  <text x="412" y="158" text-anchor="middle" class="small">HTTP request / response</text>
  <path d="M693 180H656M519 180H482M335 180H298M171 180H134" class="return"/>
  <text x="412" y="214" text-anchor="middle" class="small">The browser-to-API request and backend-to-database query are separate exchanges.</text>
</svg>
