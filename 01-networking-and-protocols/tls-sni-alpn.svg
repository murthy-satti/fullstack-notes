<svg xmlns="http://www.w3.org/2000/svg" width="740" height="245" viewBox="0 0 740 245" role="img" aria-labelledby="title desc">
  <title id="title">SNI and ALPN during TLS setup</title>
  <desc id="desc">A client hello includes the requested server name and supported application protocols; the server selects a matching certificate and protocol before protected HTTP traffic begins.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#718496;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style>
  </defs>
  <rect x="42" y="48" width="180" height="68" rx="8" class="box"/>
  <rect x="518" y="48" width="180" height="68" rx="8" class="box"/>
  <text x="132" y="76" text-anchor="middle" class="title">Client</text><text x="132" y="96" text-anchor="middle" class="small">browser or API client</text>
  <text x="608" y="76" text-anchor="middle" class="title">TLS endpoint</text><text x="608" y="96" text-anchor="middle" class="small">server or reverse proxy</text>
  <path d="M222 70H511" class="line"/>
  <text x="366" y="56" text-anchor="middle" class="small">ClientHello: SNI hostname + ALPN offers</text>
  <path d="M518 109H229" class="return"/>
  <text x="372" y="132" text-anchor="middle" class="small">Server selects certificate + application protocol</text>
  <rect x="160" y="166" width="420" height="48" rx="8" class="box"/>
  <text x="370" y="187" text-anchor="middle" class="title">Protected application traffic</text>
  <text x="370" y="203" text-anchor="middle" class="small">for example, HTTP/2 over TLS</text>
  <path d="M132 116V190H153M608 116V190H587" class="line"/>
  <text x="370" y="238" text-anchor="middle" class="small">SNI helps choose the TLS identity; HTTP host routing happens after the connection is established.</text>
</svg>
