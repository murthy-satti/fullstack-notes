<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">DHCPv4 address lease exchange</title>
  <desc id="desc">A client discovers DHCP servers, receives an offer, requests an address, and receives an acknowledgement.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:15px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="34" y="24" width="150" height="52" rx="8" class="box"/>
  <rect x="536" y="24" width="150" height="52" rx="8" class="box"/>
  <text x="109" y="47" text-anchor="middle" class="title">DHCP client</text>
  <text x="611" y="47" text-anchor="middle" class="title">DHCP server</text>
  <path d="M184 96H536" class="line"/>
  <text x="360" y="90" text-anchor="middle" class="small">1. Discover: find a server</text>
  <path d="M536 134H184" class="line"/>
  <text x="360" y="128" text-anchor="middle" class="small">2. Offer: propose configuration</text>
  <path d="M184 172H536" class="line"/>
  <text x="360" y="166" text-anchor="middle" class="small">3. Request: ask to use the offer</text>
  <path d="M536 210H184" class="line"/>
  <text x="360" y="204" text-anchor="middle" class="small">4. Acknowledge: grant the lease</text>
  <text x="360" y="238" text-anchor="middle" class="small">The lease can include an address, gateway, DNS resolver, and lifetime.</text>
</svg>
