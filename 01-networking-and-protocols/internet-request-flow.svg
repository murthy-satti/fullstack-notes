<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">What happens when a browser opens a website</title>
  <desc id="desc">The browser resolves a domain name, routes packets to the server, establishes a transport, protects HTTPS with TLS, and exchanges HTTP data.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:15px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="12" y="46" width="126" height="64" rx="8" class="box"/><text x="75" y="72" text-anchor="middle" class="title">Browser</text><text x="75" y="92" text-anchor="middle" class="small">reads the URL</text>
  <rect x="164" y="46" width="126" height="64" rx="8" class="box"/><text x="227" y="72" text-anchor="middle" class="title">DNS</text><text x="227" y="92" text-anchor="middle" class="small">name to address</text>
  <rect x="316" y="46" width="126" height="64" rx="8" class="box"/><text x="379" y="72" text-anchor="middle" class="title">IP routing</text><text x="379" y="92" text-anchor="middle" class="small">packets cross networks</text>
  <rect x="468" y="46" width="126" height="64" rx="8" class="box"/><text x="531" y="72" text-anchor="middle" class="title">Transport + TLS</text><text x="531" y="92" text-anchor="middle" class="small">connection + protection</text>
  <rect x="620" y="46" width="126" height="64" rx="8" class="box"/><text x="683" y="72" text-anchor="middle" class="title">HTTP</text><text x="683" y="92" text-anchor="middle" class="small">request and response</text>
  <path d="M138 78H157M290 78H309M442 78H461M594 78H613" class="line"/>
  <text x="380" y="151" text-anchor="middle" class="small">Each step solves a different part of delivering a web page.</text>
</svg>
