<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">DNS records for a web application</title>
  <desc id="desc">A domain's DNS records route the apex and www names to a web host and an api subdomain to an API gateway; mail uses a separate MX record.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="22" y="98" width="138" height="58" rx="8" class="box"/>
  <rect x="218" y="98" width="150" height="58" rx="8" class="box"/>
  <rect x="452" y="34" width="136" height="58" rx="8" class="box"/>
  <rect x="452" y="112" width="136" height="58" rx="8" class="box"/>
  <rect x="452" y="190" width="136" height="50" rx="8" class="box"/>
  <rect x="632" y="112" width="112" height="58" rx="8" class="box"/>
  <text x="91" y="122" text-anchor="middle" class="title">Browser</text><text x="91" y="141" text-anchor="middle" class="small">requests a host name</text>
  <text x="293" y="122" text-anchor="middle" class="title">DNS records</text><text x="293" y="141" text-anchor="middle" class="small">answer for each name</text>
  <text x="520" y="58" text-anchor="middle" class="title">Web hosting</text><text x="520" y="77" text-anchor="middle" class="small">apex / www</text>
  <text x="520" y="136" text-anchor="middle" class="title">API gateway</text><text x="520" y="155" text-anchor="middle" class="small">api.example.com</text>
  <text x="520" y="212" text-anchor="middle" class="title">Mail servers</text><text x="520" y="229" text-anchor="middle" class="small">MX records</text>
  <text x="688" y="136" text-anchor="middle" class="title">Backend API</text><text x="688" y="155" text-anchor="middle" class="small">HTTP routing</text>
  <path d="M160 127H211M368 113L445 63M368 127H445M368 141L445 211M588 141H625" class="line"/>
  <text x="380" y="252" text-anchor="middle" class="small">DNS points names to services; HTTPS certificates and application routes are configured separately.</text>
</svg>
