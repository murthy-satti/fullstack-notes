<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" viewBox="0 0 700 190" role="img" aria-labelledby="title desc">
  <title id="title">HTTP request and response</title>
  <desc id="desc">A client sends a method, target, headers, and optional body. The server responds with a status code, headers, and optional body.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:16px;font-weight:bold}.small{font-size:13px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.back{stroke:#718496;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="22" y="58" width="170" height="68" rx="8" class="box"/><text x="107" y="84" text-anchor="middle" class="title">Client</text><text x="107" y="105" text-anchor="middle" class="small">browser or app</text>
  <rect x="508" y="58" width="170" height="68" rx="8" class="box"/><text x="593" y="84" text-anchor="middle" class="title">Server</text><text x="593" y="105" text-anchor="middle" class="small">handles the request</text>
  <path d="M192 75H500" class="line"/><text x="346" y="67" text-anchor="middle" class="small">Request: method + target + headers + optional body</text>
  <path d="M508 112H200" class="back"/><text x="354" y="145" text-anchor="middle" class="small">Response: status + headers + optional body</text>
</svg>
