<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">Multi-instance WebSocket chat architecture</title>
  <desc id="desc">Two browser clients connect to separate application instances over secure WebSockets. The instances publish events through a shared broker so messages can reach clients connected to either instance.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.event{stroke:#718496;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="20" y="42" width="125" height="54" rx="8" class="box"/>
  <rect x="20" y="186" width="125" height="54" rx="8" class="box"/>
  <rect x="245" y="42" width="150" height="54" rx="8" class="box"/>
  <rect x="245" y="186" width="150" height="54" rx="8" class="box"/>
  <rect x="500" y="108" width="150" height="60" rx="8" class="box"/>
  <rect x="677" y="108" width="108" height="60" rx="8" class="box"/>
  <text x="82" y="65" text-anchor="middle" class="title">Browser A</text><text x="82" y="83" text-anchor="middle" class="small">wss:// chat</text>
  <text x="82" y="209" text-anchor="middle" class="title">Browser B</text><text x="82" y="227" text-anchor="middle" class="small">wss:// chat</text>
  <text x="320" y="65" text-anchor="middle" class="title">App instance 1</text><text x="320" y="83" text-anchor="middle" class="small">owns A's socket</text>
  <text x="320" y="209" text-anchor="middle" class="title">App instance 2</text><text x="320" y="227" text-anchor="middle" class="small">owns B's socket</text>
  <text x="575" y="133" text-anchor="middle" class="title">Shared event broker</text><text x="575" y="151" text-anchor="middle" class="small">cross-instance fan-out</text>
  <text x="731" y="133" text-anchor="middle" class="title">Message store</text><text x="731" y="151" text-anchor="middle" class="small">durable history</text>
  <path d="M145 69H238M145 213H238" class="line"/>
  <path d="M395 69L493 119M493 157L395 213" class="event"/>
  <path d="M650 138H670" class="line"/>
  <text x="400" y="264" text-anchor="middle" class="small">The application provides authorization, persistence, reconnect, and delivery semantics.</text>
</svg>
