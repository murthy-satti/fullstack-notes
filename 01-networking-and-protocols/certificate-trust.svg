<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
  <title id="title">How a browser checks a server certificate</title>
  <desc id="desc">The browser checks that the server certificate matches the hostname, is in date, and chains through trusted issuers to a trusted root.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.check{fill:#fff7e6;stroke:#a87519;stroke-width:1.5}.title{font-size:14px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect x="18" y="48" width="150" height="58" rx="8" class="box"/><text x="93" y="73" text-anchor="middle" class="title">Server certificate</text><text x="93" y="92" text-anchor="middle" class="small">identity + public key</text>
  <rect x="202" y="48" width="150" height="58" rx="8" class="check"/><text x="277" y="73" text-anchor="middle" class="title">Check hostname</text><text x="277" y="92" text-anchor="middle" class="small">matches requested site?</text>
  <rect x="386" y="48" width="150" height="58" rx="8" class="check"/><text x="461" y="73" text-anchor="middle" class="title">Check validity</text><text x="461" y="92" text-anchor="middle" class="small">within valid dates?</text>
  <rect x="570" y="48" width="132" height="58" rx="8" class="check"/><text x="636" y="73" text-anchor="middle" class="title">Check trust</text><text x="636" y="92" text-anchor="middle" class="small">trusted issuer chain?</text>
  <path d="M168 77H195M352 77H379M536 77H563" class="line"/>
  <rect x="184" y="137" width="352" height="54" rx="8" class="box"/><text x="360" y="160" text-anchor="middle" class="title">If checks pass, TLS can authenticate the host</text><text x="360" y="179" text-anchor="middle" class="small">It does not prove that the site or its content is trustworthy.</text>
  <path d="M636 106V124H536" class="line"/>
</svg>
