<svg xmlns="http://www.w3.org/2000/svg" width="740" height="250" viewBox="0 0 740 250" role="img" aria-labelledby="title desc">
  <title id="title">TCP connection lifecycle</title>
  <desc id="desc">A client and server establish a TCP connection with SYN, SYN-ACK, and ACK, exchange application bytes, and then close the connection.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:14px;font-weight:bold}.small{font-size:11px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <text x="126" y="32" text-anchor="middle" class="title">Client</text>
  <text x="614" y="32" text-anchor="middle" class="title">Server</text>
  <path d="M126 42V220M614 42V220" stroke="#718496" stroke-width="2"/>
  <path d="M130 65L608 85" class="line"/><text x="370" y="63" text-anchor="middle" class="small">SYN: request connection</text>
  <path d="M610 100L132 120" class="line"/><text x="370" y="102" text-anchor="middle" class="small">SYN-ACK: acknowledge and respond</text>
  <path d="M130 135L608 155" class="line"/><text x="370" y="137" text-anchor="middle" class="small">ACK: connection established</text>
  <path d="M130 169L608 188" class="line"/><text x="370" y="174" text-anchor="middle" class="small">Application bytes flow in both directions</text>
  <path d="M130 202L608 218" class="line"/><text x="370" y="204" text-anchor="middle" class="small">FIN: one side begins an orderly close</text>
  <text x="370" y="238" text-anchor="middle" class="small">ACK and FIN/ACK messages close each direction; exact timing varies.</text>
</svg>
