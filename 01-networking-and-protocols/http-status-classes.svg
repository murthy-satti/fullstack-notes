<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">HTTP response status code families</title>
  <desc id="desc">HTTP status codes are grouped into informational 1xx, success 2xx, redirection 3xx, client error 4xx, and server error 5xx responses.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.type{font-size:17px;font-weight:bold}.small{font-size:12px}</style></defs>
  <text x="360" y="28" text-anchor="middle" class="type">The first digit gives a broad response category</text>
  <rect x="12" y="52" width="132" height="72" rx="8" class="box"/><text x="78" y="80" text-anchor="middle" class="type">1xx</text><text x="78" y="103" text-anchor="middle" class="small">informational</text>
  <rect x="156" y="52" width="132" height="72" rx="8" class="box"/><text x="222" y="80" text-anchor="middle" class="type">2xx</text><text x="222" y="103" text-anchor="middle" class="small">success</text>
  <rect x="300" y="52" width="132" height="72" rx="8" class="box"/><text x="366" y="80" text-anchor="middle" class="type">3xx</text><text x="366" y="103" text-anchor="middle" class="small">redirection</text>
  <rect x="444" y="52" width="132" height="72" rx="8" class="box"/><text x="510" y="80" text-anchor="middle" class="type">4xx</text><text x="510" y="103" text-anchor="middle" class="small">client/request issue</text>
  <rect x="588" y="52" width="120" height="72" rx="8" class="box"/><text x="648" y="80" text-anchor="middle" class="type">5xx</text><text x="648" y="103" text-anchor="middle" class="small">server issue</text>
  <text x="360" y="157" text-anchor="middle" class="small">Examples: 200 OK, 301 redirect, 404 not found, 500 server error.</text>
  <text x="360" y="179" text-anchor="middle" class="small">A status describes the HTTP response, not the whole business outcome.</text>
</svg>
