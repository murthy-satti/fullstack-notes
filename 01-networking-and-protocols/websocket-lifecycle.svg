<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket connection lifecycle</title>
  <desc id="desc">A browser sends an HTTP-based opening handshake. If accepted, both sides exchange WebSocket messages until either side closes the connection.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.head{font-size:14px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.back{stroke:#718496;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style>
  </defs>
  <text x="120" y="28" text-anchor="middle" class="head">Browser</text><text x="580" y="28" text-anchor="middle" class="head">Server</text>
  <path d="M130 58H570" class="line"/><text x="350" y="52" text-anchor="middle" class="small">HTTP-based opening handshake</text>
  <path d="M570 91H130" class="back"/><text x="350" y="85" text-anchor="middle" class="small">accepted: switch to WebSocket framing</text>
  <path d="M130 127H570" class="line"/><text x="350" y="121" text-anchor="middle" class="small">message</text>
  <path d="M570 158H130" class="back"/><text x="350" y="152" text-anchor="middle" class="small">message or event</text>
  <path d="M130 190H570" class="line"/><text x="350" y="184" text-anchor="middle" class="small">close when finished; reconnect is application behavior</text>
</svg>
