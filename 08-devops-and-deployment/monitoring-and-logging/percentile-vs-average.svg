<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="pva-title pva-desc">
  <title id="pva-title">Percentiles compared with the average for one latency distribution</title>
  <desc id="pva-desc">A bar represents 1,000 TaskFlow requests sorted from fastest to slowest. 900 requests take about 40 ms, 80 take about 250 ms, and 20 take about 2,000 ms. Markers under the bar show the percentiles: p50 is 40 ms at request 500, p90 is 40 ms at request 900, p95 is 250 ms at request 950, and p99 is 2,000 ms at request 990. The average is 900 times 40 plus 80 times 250 plus 20 times 2,000, divided by 1,000, which is 96 ms. No request took 96 ms, and the average hides that 1 in 50 requests took 2 seconds. Percentiles show the typical user at p50 and the tail at p95 and p99.</desc>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">1,000 requests to GET /tasks, sorted from fastest to slowest</text>

    <text x="812" y="52" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="end">20 requests at ~2,000 ms</text>
    <text x="769" y="72" font-size="11.5" font-weight="700" fill="#66400f" text-anchor="end">80 requests at ~250 ms</text>
    <g fill="none" stroke-width="1.5">
      <path d="M812 56V84" stroke="#b5524b"/>
      <path d="M773 76V84" stroke="#bd7a20"/>
    </g>

    <rect x="40" y="86" width="702" height="44" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="742" y="86" width="62" height="44" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="804" y="86" width="16" height="44" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="391" y="113" font-size="13" font-weight="700" fill="#294a2e">900 requests at about 40 ms</text>

    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M430 130V146"/>
      <path d="M742 130V146"/>
      <path d="M781 130V168"/>
      <path d="M812 130V190"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="430" y="160">p50 = 40 ms</text>
      <text x="738" y="158" text-anchor="end">p90 = 40 ms</text>
      <text x="777" y="180" text-anchor="end">p95 = 250 ms</text>
      <text x="808" y="202" text-anchor="end">p99 = 2,000 ms</text>
    </g>
    <text x="40" y="150" font-size="11" fill="#40566b" text-anchor="start">request 1</text>
    <text x="40" y="166" font-size="11" fill="#40566b" text-anchor="start">(fastest)</text>

    <rect x="24" y="228" width="400" height="120" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="224" y="254" font-size="14" font-weight="700" fill="#6e2a24">Average (mean) = 96 ms</text>
    <text x="224" y="278" font-size="11.5" fill="#6e2a24">(900 x 40 + 80 x 250 + 20 x 2,000) / 1,000</text>
    <text x="224" y="300" font-size="11.5" fill="#6e2a24">no request took 96 ms</text>
    <text x="224" y="320" font-size="11.5" fill="#6e2a24">hides that 1 in 50 requests took 2 seconds</text>

    <rect x="444" y="228" width="392" height="120" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="640" y="254" font-size="14" font-weight="700" fill="#294a2e">Percentiles</text>
    <text x="640" y="278" font-size="11.5" fill="#294a2e">p50 = 40 ms: the typical request</text>
    <text x="640" y="300" font-size="11.5" fill="#294a2e">p95 = 250 ms, p99 = 2,000 ms: the tail</text>
    <text x="640" y="320" font-size="11.5" fill="#294a2e">alert and set SLOs on these, not on the mean</text>

    <text x="430" y="392" font-size="13" fill="#40566b">The mean blends fast and very slow requests into a number nobody experienced; track the tail.</text>
  </g>
</svg>
