<svg xmlns="http://www.w3.org/2000/svg" width="860" height="612" viewBox="0 0 860 612" role="img" aria-labelledby="stp-title stp-desc">
  <title id="stp-title">Should this condition page someone?</title>
  <desc id="stp-desc">A flowchart of four questions. First: are users hurt, or about to be? If no, show it on a dashboard only, with no alert, for example CPU at 80 percent while the SLO is fine. If yes, ask whether it needs a human within minutes. If no, open a ticket to fix during work hours, for example a disk that will be full in 5 days. If yes, ask whether the responder can act on it. If no, automate the fix or delete the alert, for example restarting a stuck worker. If yes, ask whether it is new, meaning nothing is already paging for the same problem. If no, group or inhibit it in Alertmanager, for example 40 pods alerting for one database outage. If yes, page the on-call engineer with a runbook link and a dashboard.</desc>
  <defs>
    <marker id="stp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="612" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="150" y="14" width="200" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="250" y="35" font-size="12.5" font-weight="700" fill="#36424e">A condition is detected</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <path d="M250 62 360 106 250 150 140 106Z"/>
      <path d="M250 172 360 216 250 260 140 216Z"/>
      <path d="M250 282 360 326 250 370 140 326Z"/>
      <path d="M250 392 360 436 250 480 140 436Z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="250" y="103">Are users hurt,</text>
      <text x="250" y="119">or about to be?</text>
      <text x="250" y="213">Needs a human</text>
      <text x="250" y="229">within minutes?</text>
      <text x="250" y="323">Can the responder</text>
      <text x="250" y="339">act on it?</text>
      <text x="250" y="433">Is it new? Nothing</text>
      <text x="250" y="449">else pages for it</text>
    </g>

    <rect x="480" y="78" width="356" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="658" y="101" font-size="13" font-weight="700" fill="#36424e">Dashboard only, no alert</text>
    <text x="658" y="120" font-size="11.5" fill="#36424e">e.g. CPU at 80% while the SLO is fine</text>
    <rect x="480" y="188" width="356" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="658" y="211" font-size="13" font-weight="700" fill="#463365">Ticket: fix during work hours</text>
    <text x="658" y="230" font-size="11.5" fill="#463365">e.g. disk will be full in 5 days</text>
    <rect x="480" y="298" width="356" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="658" y="321" font-size="13" font-weight="700" fill="#6e2a24">Automate the fix, or delete the alert</text>
    <text x="658" y="340" font-size="11.5" fill="#6e2a24">e.g. restart a stuck worker automatically</text>
    <rect x="480" y="408" width="356" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="658" y="431" font-size="13" font-weight="700" fill="#463365">Group or inhibit it in Alertmanager</text>
    <text x="658" y="450" font-size="11.5" fill="#463365">e.g. 40 pods alerting for one database outage</text>

    <rect x="130" y="506" width="240" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="250" y="529" font-size="13" font-weight="700" fill="#294a2e">Page the on-call engineer</text>
    <text x="250" y="548" font-size="11.5" fill="#294a2e">with a runbook link and dashboard</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M250 46V60" marker-end="url(#stp-arrow)"/>
      <path d="M250 150V170" marker-end="url(#stp-arrow)"/>
      <path d="M250 260V280" marker-end="url(#stp-arrow)"/>
      <path d="M250 370V390" marker-end="url(#stp-arrow)"/>
      <path d="M250 480V504" marker-end="url(#stp-arrow)"/>
      <path d="M360 106H478" marker-end="url(#stp-arrow)"/>
      <path d="M360 216H478" marker-end="url(#stp-arrow)"/>
      <path d="M360 326H478" marker-end="url(#stp-arrow)"/>
      <path d="M360 436H478" marker-end="url(#stp-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="419" y="99">no</text>
      <text x="419" y="209">no</text>
      <text x="419" y="319">no</text>
      <text x="419" y="429">no</text>
      <text x="266" y="165" text-anchor="start">yes</text>
      <text x="266" y="275" text-anchor="start">yes</text>
      <text x="266" y="385" text-anchor="start">yes</text>
      <text x="266" y="497" text-anchor="start">yes</text>
    </g>

    <text x="430" y="592" font-size="13" fill="#40566b">A page must be urgent, actionable, and new; everything else is a ticket, a dashboard, or automation.</text>
  </g>
</svg>
