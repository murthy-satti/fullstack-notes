<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="mam-title mam-desc">
  <title id="mam-title">How a multi-platform tag resolves to one image</title>
  <desc id="mam-desc">A server running linux/amd64 and a laptop running linux/arm64 both pull ghcr.io/example/taskflow-api:1.4.0. The registry returns the same image index, also called a manifest list, for that tag. The index lists one entry per platform: linux/amd64 pointing to manifest sha256:4f1a..., linux/arm64 pointing to manifest sha256:9c0e..., and unknown/unknown entries holding provenance attestations. The server follows the linux/amd64 entry and the laptop follows the linux/arm64 entry. Each then fetches its image manifest, which lists a config and the layer digests, and downloads only those layers. The index is built with docker buildx build with the platform flag set to linux/amd64,linux/arm64 and pushed with the tag.</desc>
  <defs>
    <marker id="mam-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="34">1. Both pull :1.4.0</text>
      <text x="270" y="34">2. Registry returns the image index</text>
      <text x="620" y="34">3. Matching manifest, layers</text>
    </g>

    <rect x="24" y="96" width="170" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="117" font-size="14" font-weight="700" fill="#66400f">Server</text>
    <text x="109" y="135" font-size="11.5" fill="#66400f">linux/amd64</text>
    <rect x="24" y="168" width="170" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="189" font-size="14" font-weight="700" fill="#66400f">Laptop</text>
    <text x="109" y="207" font-size="11.5" fill="#66400f">linux/arm64</text>

    <rect x="270" y="48" width="290" height="230" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="415" y="68" font-size="13" font-weight="700" fill="#463365">image index (manifest list)</text>
    <text x="415" y="86" font-size="11.5" fill="#463365">ghcr.io/example/taskflow-api:1.4.0</text>
    <g fill="#ffffff" stroke="#8062a8" stroke-width="1.5">
      <rect x="282" y="104" width="266" height="34" rx="6"/>
      <rect x="282" y="176" width="266" height="34" rx="6"/>
      <rect x="282" y="224" width="266" height="34" rx="6"/>
    </g>
    <g font-size="12" fill="#463365">
      <text x="415" y="126">linux/amd64 → sha256:4f1a...</text>
      <text x="415" y="198">linux/arm64 → sha256:9c0e...</text>
      <text x="415" y="246">unknown/unknown → attestations</text>
    </g>

    <rect x="620" y="96" width="216" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="728" y="117" font-size="13" font-weight="700" fill="#263e5a">image manifest (amd64)</text>
    <text x="728" y="135" font-size="11.5" fill="#263e5a">config + layer digests</text>
    <rect x="620" y="168" width="216" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="728" y="189" font-size="13" font-weight="700" fill="#263e5a">image manifest (arm64)</text>
    <text x="728" y="207" font-size="11.5" fill="#263e5a">config + layer digests</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M194 121H280" marker-end="url(#mam-arrow)"/>
      <path d="M194 193H280" marker-end="url(#mam-arrow)"/>
      <path d="M548 121H618" marker-end="url(#mam-arrow)"/>
      <path d="M548 193H618" marker-end="url(#mam-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="728" y="240">each machine downloads only</text>
      <text x="728" y="256">its own platform's layers</text>
    </g>

    <text x="24" y="302" font-size="11.5" fill="#36424e" text-anchor="start">Built with: docker buildx build --platform linux/amd64,linux/arm64 -t ghcr.io/example/taskflow-api:1.4.0 --push .</text>
    <text x="430" y="334" font-size="13" fill="#40566b">One tag points to an index; each machine follows the entry for its own platform.</text>
  </g>
</svg>
