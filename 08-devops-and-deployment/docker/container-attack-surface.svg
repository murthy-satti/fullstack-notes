<svg xmlns="http://www.w3.org/2000/svg" width="860" height="476" viewBox="0 0 860 476" role="img" aria-labelledby="ats-title ats-desc">
  <title id="ats-title">Container attack surface and the control for each layer</title>
  <desc id="ats-desc">Nine layers from the image inward to the host, each paired with the control that removes or reduces it. 1: the image contains a shell, a package manager, and outdated packages with CVEs; use a slim or distroless base, scan it, and rebuild often. 2: secrets copied into image layers during the build; use BuildKit secret mounts and a .dockerignore. 3: the process runs as root, UID 0; set USER node and use rootless Docker or user namespaces. 4: the default Linux capabilities such as CHOWN and NET_RAW; drop all with --cap-drop ALL and add back only what is needed. 5: a writable root filesystem; run with --read-only plus a tmpfs for /tmp. 6: setuid binaries that can raise privileges; set no-new-privileges. 7: dangerous system calls; keep Docker's default seccomp and AppArmor profiles. 8: host access through the Docker socket or --privileged; never mount the socket and never use --privileged. 9: the host kernel is shared by all containers; patch hosts and use gVisor or Kata Containers for untrusted code.</desc>
  <defs>
    <marker id="ats-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="476" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="214" y="34" font-size="13" font-weight="700" fill="#6e2a24">What an attacker can use</text>
    <text x="642" y="34" font-size="13" font-weight="700" fill="#294a2e">Control that removes or reduces it</text>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="24" y="50" width="380" height="34" rx="8"/>
      <rect x="24" y="92" width="380" height="34" rx="8"/>
      <rect x="24" y="134" width="380" height="34" rx="8"/>
      <rect x="24" y="176" width="380" height="34" rx="8"/>
      <rect x="24" y="218" width="380" height="34" rx="8"/>
      <rect x="24" y="260" width="380" height="34" rx="8"/>
      <rect x="24" y="302" width="380" height="34" rx="8"/>
      <rect x="24" y="344" width="380" height="34" rx="8"/>
      <rect x="24" y="386" width="380" height="34" rx="8"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="448" y="50" width="388" height="34" rx="8"/>
      <rect x="448" y="92" width="388" height="34" rx="8"/>
      <rect x="448" y="134" width="388" height="34" rx="8"/>
      <rect x="448" y="176" width="388" height="34" rx="8"/>
      <rect x="448" y="218" width="388" height="34" rx="8"/>
      <rect x="448" y="260" width="388" height="34" rx="8"/>
      <rect x="448" y="302" width="388" height="34" rx="8"/>
      <rect x="448" y="344" width="388" height="34" rx="8"/>
      <rect x="448" y="386" width="388" height="34" rx="8"/>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M404 67H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 109H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 151H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 193H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 235H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 277H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 319H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 361H446" marker-end="url(#ats-arrow)"/>
      <path d="M404 403H446" marker-end="url(#ats-arrow)"/>
    </g>
    <g font-size="12" fill="#6e2a24" text-anchor="start">
      <text x="36" y="71"><tspan font-weight="700">1. Image:</tspan> shell, package manager, old CVEs</text>
      <text x="36" y="113"><tspan font-weight="700">2. Build:</tspan> secrets copied into layers</text>
      <text x="36" y="155"><tspan font-weight="700">3. User:</tspan> process runs as root (UID 0)</text>
      <text x="36" y="197"><tspan font-weight="700">4. Capabilities:</tspan> CHOWN, NET_RAW, ...</text>
      <text x="36" y="239"><tspan font-weight="700">5. Filesystem:</tspan> writable root filesystem</text>
      <text x="36" y="281"><tspan font-weight="700">6. Escalation:</tspan> setuid binaries</text>
      <text x="36" y="323"><tspan font-weight="700">7. Syscalls:</tspan> the whole kernel API</text>
      <text x="36" y="365"><tspan font-weight="700">8. Host access:</tspan> docker.sock, --privileged</text>
      <text x="36" y="407"><tspan font-weight="700">9. Kernel:</tspan> shared by every container</text>
    </g>
    <g font-size="12" fill="#294a2e" text-anchor="start">
      <text x="460" y="71">slim or distroless base, scan, rebuild often</text>
      <text x="460" y="113">BuildKit secret mounts, .dockerignore</text>
      <text x="460" y="155">USER node; rootless Docker or user namespaces</text>
      <text x="460" y="197">--cap-drop ALL, add back only what is needed</text>
      <text x="460" y="239">--read-only, plus a tmpfs for /tmp</text>
      <text x="460" y="281">--security-opt no-new-privileges</text>
      <text x="460" y="323">keep the default seccomp and AppArmor profiles</text>
      <text x="460" y="365">never mount the socket; never use --privileged</text>
      <text x="460" y="407">patch hosts; gVisor or Kata for untrusted code</text>
    </g>

    <text x="430" y="456" font-size="13" fill="#40566b">Each layer an attacker gets past should meet another control: defense in depth, from image to kernel.</text>
  </g>
</svg>
