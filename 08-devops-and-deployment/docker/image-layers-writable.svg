<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="ilw-title ilw-desc">
  <title id="ilw-title">Image layers, writable layers, and copy-on-write</title>
  <desc id="ilw-desc">Left: one TaskFlow API image is a stack of read-only layers, from the bottom: FROM node:24-slim with Debian and Node.js at about 200 MB, COPY package.json and package-lock.json at under 1 MB, RUN npm ci omit dev at about 40 MB, and COPY src at about 1 MB. Two containers, A and B, run from this image; each has its own thin writable layer on top, while the image layers are stored once and shared. Right: overlayfs combines a lowerdir (the read-only image layers) and an upperdir (the container's writable layer) into the merged view the container sees at its root. Reading a file serves it from the highest layer that has it. Writing a file that came from the image first copies it up into the writable layer and changes the copy. Deleting a file places a whiteout in the writable layer that hides it, while the image still contains it. docker rm discards the writable layer and leaves the image untouched.</desc>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One image, two containers</text>
    <text x="460" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Copy-on-write with overlayfs</text>
    <path d="M444 20V350" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="48" width="196" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="122" y="67" font-size="12.5" font-weight="700" fill="#294a2e">container A</text>
    <text x="122" y="83" font-size="11.5" fill="#294a2e">writable layer</text>
    <rect x="234" y="48" width="196" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="332" y="67" font-size="12.5" font-weight="700" fill="#294a2e">container B</text>
    <text x="332" y="83" font-size="11.5" fill="#294a2e">writable layer</text>

    <g stroke-width="2">
      <rect x="24" y="104" width="406" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="24" y="144" width="406" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="24" y="184" width="406" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="24" y="224" width="406" height="34" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12" font-weight="700" text-anchor="start">
      <text x="36" y="125" fill="#463365">COPY src ./src</text>
      <text x="36" y="165" fill="#463365">RUN npm ci --omit=dev</text>
      <text x="36" y="205" fill="#463365">COPY package.json package-lock.json ./</text>
      <text x="36" y="245" fill="#263e5a">FROM node:24-slim (Debian + Node.js)</text>
    </g>
    <g font-size="11.5" text-anchor="end">
      <text x="418" y="125" fill="#463365">~1 MB</text>
      <text x="418" y="165" fill="#463365">~40 MB</text>
      <text x="418" y="205" fill="#463365">&lt; 1 MB</text>
      <text x="418" y="245" fill="#263e5a">~200 MB</text>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="282">Image layers: read-only, identified by sha256 digests,</text>
      <text x="24" y="298">stored once on disk and shared by every container.</text>
      <text x="24" y="322">Two containers cost ~240 MB of image plus two small</text>
      <text x="24" y="338">writable layers, not two full copies.</text>
    </g>

    <rect x="460" y="48" width="376" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="648" y="67" font-size="12.5" font-weight="700" fill="#36424e">merged view</text>
    <text x="648" y="83" font-size="11.5" fill="#36424e">what the container sees at /</text>
    <rect x="460" y="104" width="376" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="648" y="125" font-size="12" font-weight="700" fill="#294a2e">upperdir = container writable layer</text>
    <rect x="460" y="144" width="376" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="648" y="165" font-size="12" font-weight="700" fill="#463365">lowerdir = image layers (read-only)</text>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="460" y="206"><tspan font-weight="700">1. Read a file:</tspan> served directly from the</text>
      <text x="476" y="222">highest layer that contains it.</text>
      <text x="460" y="246"><tspan font-weight="700">2. Write an image file:</tspan> copied up to the</text>
      <text x="476" y="262">writable layer first, then changed there.</text>
      <text x="460" y="286"><tspan font-weight="700">3. Delete a file:</tspan> a whiteout in the writable</text>
      <text x="476" y="302">layer hides it; the image still has it.</text>
      <text x="460" y="326"><tspan font-weight="700">4. docker rm:</tspan> the writable layer is discarded;</text>
      <text x="476" y="342">the image layers are untouched.</text>
    </g>

    <text x="430" y="382" font-size="13" fill="#40566b">Layers are shared and immutable; every change a container makes lands in its own thin writable layer.</text>
  </g>
</svg>
