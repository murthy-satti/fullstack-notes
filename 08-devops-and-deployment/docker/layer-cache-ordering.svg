<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="lco-title lco-desc">
  <title id="lco-title">How instruction order decides which layers are rebuilt</title>
  <desc id="lco-desc">Scenario: a developer edits src/routes/tasks.js and runs docker build again. Slow order, on the left: FROM node:24-slim and WORKDIR /app are cache hits, but COPY . . sees changed files, so the cache breaks there and every later step is rebuilt: RUN npm ci omit dev runs again for about 60 seconds and CMD is rebuilt. The build takes about 65 seconds and produces a new 40 MB dependency layer to push. Fast order, on the right: FROM, WORKDIR, COPY package*.json, and RUN npm ci are all cache hits because the package files did not change; the cache breaks only at COPY . ., which takes about a second, and CMD is rebuilt instantly. The build takes about 2 seconds and only a new 1 MB source layer must be pushed.</desc>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Scenario: you edit src/routes/tasks.js and run docker build again</text>
    <text x="24" y="60" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Slow order: source copied before install</text>
    <text x="448" y="60" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Fast order: package files first, source last</text>
    <path d="M430 46V392" stroke="#c9d1db" stroke-width="1.5"/>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="24" y="74" width="266" height="32" rx="8"/>
      <rect x="24" y="122" width="266" height="32" rx="8"/>
      <rect x="24" y="170" width="266" height="32" rx="8"/>
      <rect x="24" y="218" width="266" height="32" rx="8"/>
      <rect x="24" y="266" width="266" height="32" rx="8"/>
      <rect x="448" y="74" width="266" height="32" rx="8"/>
      <rect x="448" y="122" width="266" height="32" rx="8"/>
      <rect x="448" y="170" width="266" height="32" rx="8"/>
      <rect x="448" y="218" width="266" height="32" rx="8"/>
      <rect x="448" y="266" width="266" height="32" rx="8"/>
      <rect x="448" y="314" width="266" height="32" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">
      <text x="36" y="95">FROM node:24-slim</text>
      <text x="36" y="143">WORKDIR /app</text>
      <text x="36" y="191">COPY . .</text>
      <text x="36" y="239">RUN npm ci --omit=dev</text>
      <text x="36" y="287">CMD ["node", "src/server.js"]</text>
      <text x="460" y="95">FROM node:24-slim</text>
      <text x="460" y="143">WORKDIR /app</text>
      <text x="460" y="191">COPY package*.json ./</text>
      <text x="460" y="239">RUN npm ci --omit=dev</text>
      <text x="460" y="287">COPY . .</text>
      <text x="460" y="335">CMD ["node", "src/server.js"]</text>
    </g>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="302" y="78" width="110" height="24" rx="12"/>
      <rect x="302" y="126" width="110" height="24" rx="12"/>
      <rect x="726" y="78" width="110" height="24" rx="12"/>
      <rect x="726" y="126" width="110" height="24" rx="12"/>
      <rect x="726" y="174" width="110" height="24" rx="12"/>
      <rect x="726" y="222" width="110" height="24" rx="12"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#294a2e">
      <text x="357" y="94">cache hit</text>
      <text x="357" y="142">cache hit</text>
      <text x="781" y="94">cache hit</text>
      <text x="781" y="142">cache hit</text>
      <text x="781" y="190">cache hit</text>
      <text x="781" y="238">cache hit</text>
    </g>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="302" y="174" width="110" height="24" rx="12"/>
      <rect x="302" y="222" width="110" height="24" rx="12"/>
      <rect x="302" y="270" width="110" height="24" rx="12"/>
      <rect x="726" y="270" width="110" height="24" rx="12"/>
      <rect x="726" y="318" width="110" height="24" rx="12"/>
    </g>
    <g font-size="11" font-weight="700" fill="#6e2a24">
      <text x="357" y="190">files changed</text>
      <text x="357" y="238">rebuilt: ~60 s</text>
      <text x="357" y="286">rebuilt</text>
      <text x="781" y="286">rebuilt: ~1 s</text>
      <text x="781" y="334">rebuilt</text>
    </g>

    <g stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4">
      <path d="M24 162H412"/>
      <path d="M448 258H836"/>
    </g>
    <rect x="98" y="155" width="118" height="14" fill="#f5f7fb"/>
    <text x="157" y="166" font-size="11.5" font-weight="700" fill="#6e2a24">cache breaks here</text>
    <rect x="522" y="251" width="118" height="14" fill="#f5f7fb"/>
    <text x="581" y="262" font-size="11.5" font-weight="700" fill="#6e2a24">cache breaks here</text>

    <text x="24" y="378" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">Total: ~65 s, and a new 40 MB layer to push</text>
    <text x="448" y="378" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">Total: ~2 s, and a new 1 MB layer to push</text>

    <text x="430" y="414" font-size="13" fill="#40566b">Once one step misses the cache, every step after it is rebuilt: put rarely changing steps first.</text>
  </g>
</svg>
