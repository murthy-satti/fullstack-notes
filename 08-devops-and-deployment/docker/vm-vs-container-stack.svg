<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="vmc-title vmc-desc">
  <title id="vmc-title">Virtual machines compared with containers</title>
  <desc id="vmc-desc">Left, virtual machines: the hardware runs a hypervisor such as KVM, Hyper-V, or ESXi. Each of three VMs contains its own guest operating system and kernel, then libraries and a runtime, then the application: TaskFlow API, TaskFlow Web, and a worker. Each VM boots a full operating system, is gigabytes in size, and takes tens of seconds to start, with strong isolation from separate kernels. Right, containers: the hardware runs one host operating system whose shared Linux kernel uses namespaces and cgroups. Each of three containers holds only libraries, a runtime, and the application. Each container is a host process, megabytes in size, starting in about a second or less, isolated by kernel features rather than separate kernels.</desc>
  <rect width="840" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Virtual machines: virtualize the hardware</text>
    <text x="432" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Containers: virtualize the OS view</text>
    <path d="M420 20V356" stroke="#c9d1db" stroke-width="1.5"/>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4">
      <rect x="24" y="48" width="120" height="160" rx="8"/>
      <rect x="156" y="48" width="120" height="160" rx="8"/>
      <rect x="288" y="48" width="120" height="160" rx="8"/>
      <rect x="432" y="92" width="120" height="116" rx="8"/>
      <rect x="564" y="92" width="120" height="116" rx="8"/>
      <rect x="696" y="92" width="120" height="116" rx="8"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="84" y="64">VM 1</text>
      <text x="216" y="64">VM 2</text>
      <text x="348" y="64">VM 3</text>
      <text x="492" y="108">container 1</text>
      <text x="624" y="108">container 2</text>
      <text x="756" y="108">container 3</text>
    </g>

    <g stroke="#bd7a20" stroke-width="1.5" fill="#fff0d9">
      <rect x="32" y="72" width="104" height="36" rx="8"/>
      <rect x="164" y="72" width="104" height="36" rx="8"/>
      <rect x="296" y="72" width="104" height="36" rx="8"/>
      <rect x="440" y="116" width="104" height="36" rx="8"/>
      <rect x="572" y="116" width="104" height="36" rx="8"/>
      <rect x="704" y="116" width="104" height="36" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#66400f">
      <text x="84" y="94">TaskFlow API</text>
      <text x="216" y="94">TaskFlow Web</text>
      <text x="348" y="94">Worker</text>
      <text x="492" y="138">TaskFlow API</text>
      <text x="624" y="138">TaskFlow Web</text>
      <text x="756" y="138">Worker</text>
    </g>

    <g stroke="#8a96a3" stroke-width="1.5" fill="#eef1f5">
      <rect x="32" y="116" width="104" height="36" rx="8"/>
      <rect x="164" y="116" width="104" height="36" rx="8"/>
      <rect x="296" y="116" width="104" height="36" rx="8"/>
      <rect x="440" y="160" width="104" height="36" rx="8"/>
      <rect x="572" y="160" width="104" height="36" rx="8"/>
      <rect x="704" y="160" width="104" height="36" rx="8"/>
    </g>
    <g font-size="12" fill="#36424e">
      <text x="84" y="138">Node + libs</text>
      <text x="216" y="138">nginx + libs</text>
      <text x="348" y="138">Node + libs</text>
      <text x="492" y="182">Node + libs</text>
      <text x="624" y="182">nginx + libs</text>
      <text x="756" y="182">Node + libs</text>
    </g>

    <g stroke="#4774aa" stroke-width="1.5" fill="#e5efff">
      <rect x="32" y="160" width="104" height="40" rx="8"/>
      <rect x="164" y="160" width="104" height="40" rx="8"/>
      <rect x="296" y="160" width="104" height="40" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="84" y="177" font-size="12.5" font-weight="700">Guest OS</text>
      <text x="84" y="192" font-size="11">own kernel</text>
      <text x="216" y="177" font-size="12.5" font-weight="700">Guest OS</text>
      <text x="216" y="192" font-size="11">own kernel</text>
      <text x="348" y="177" font-size="12.5" font-weight="700">Guest OS</text>
      <text x="348" y="192" font-size="11">own kernel</text>
    </g>

    <rect x="24" y="220" width="384" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="216" y="243" font-size="13" font-weight="700" fill="#463365">Hypervisor (KVM, Hyper-V, ESXi)</text>
    <rect x="24" y="264" width="384" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="216" y="287" font-size="13" font-weight="700" fill="#263e5a">Hardware: CPU, memory, disk, network</text>

    <rect x="432" y="220" width="384" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="624" y="243" font-size="13" font-weight="700" fill="#263e5a">Shared Linux kernel (namespaces, cgroups)</text>
    <rect x="432" y="264" width="384" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="624" y="287" font-size="13" font-weight="700" fill="#263e5a">Hardware: CPU, memory, disk, network</text>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="324">Each VM boots its own kernel and full OS</text>
      <text x="24" y="341">Size: gigabytes; start: tens of seconds</text>
      <text x="24" y="358">Isolation: separate kernels (strong)</text>
      <text x="432" y="324">Each container is an ordinary host process</text>
      <text x="432" y="341">Size: megabytes; start: about a second or less</text>
      <text x="432" y="358">Isolation: kernel features on one kernel</text>
    </g>

    <text x="420" y="400" font-size="13" fill="#40566b">A VM carries a whole operating system; a container carries only the app and its user-space files.</text>
  </g>
</svg>
