<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="sfl-title sfl-desc">
  <title id="sfl-title">Two firewall layers in front of one server</title>
  <desc id="sfl-desc">Four lanes cross two firewall layers: the cloud firewall or security group at the edge, then ufw on the host. Lane one: an admin at 198.51.100.7 reaches port 22; the security group allows 22 from the office VPN range and ufw rate-limits 22/tcp, so the connection reaches sshd. Lane two: a user anywhere reaches port 443; the security group allows 443 from anywhere and ufw allows 443/tcp, so it reaches nginx. Lane three: a scanner tries port 3001 and is dropped at the edge; even without that rule, node listens only on 127.0.0.1:3001 and is unreachable from outside. Lane four: a scanner tries port 27017, which a mistaken security group rule leaves open; the traffic skips ufw because Docker's NAT rules handle published ports before ufw's rules, and reaches a MongoDB container published with -p 27017:27017.</desc>
  <defs>
    <marker id="sfl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sfl-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="220" y="56" width="42" height="276" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="400" y="56" width="42" height="276" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <g font-size="12" font-weight="700">
      <text x="241" y="30" fill="#6e2a24">cloud firewall</text>
      <text x="241" y="46" fill="#6e2a24">(security group)</text>
      <text x="421" y="30" fill="#463365">ufw</text>
      <text x="421" y="46" fill="#463365">on the host</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="74" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="144" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="214" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="284" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="560" y="74" width="276" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="560" y="144" width="276" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="560" y="214" width="276" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="560" y="284" width="276" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="99" y="93">admin</text>
      <text x="99" y="163">user</text>
      <text x="99" y="233">scanner</text>
      <text x="99" y="303">scanner</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="99" y="110">198.51.100.7 to :22</text>
      <text x="99" y="180">anywhere to :443</text>
      <text x="99" y="250">anywhere to :3001</text>
      <text x="99" y="320">anywhere to :27017</text>
    </g>
    <g font-size="13" font-weight="700">
      <text x="698" y="93" fill="#263e5a">sshd :22</text>
      <text x="698" y="163" fill="#263e5a">nginx :443</text>
      <text x="698" y="233" fill="#294a2e">node on 127.0.0.1:3001</text>
      <text x="698" y="303" fill="#6e2a24">MongoDB container</text>
    </g>
    <g font-size="11">
      <text x="698" y="110" fill="#263e5a">reached through both layers</text>
      <text x="698" y="180" fill="#263e5a">reached through both layers</text>
      <text x="698" y="250" fill="#294a2e">loopback only: unreachable anyway</text>
      <text x="698" y="320" fill="#6e2a24">published with -p 27017:27017</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 96H558" marker-end="url(#sfl-arrow)"/>
      <path d="M174 166H558" marker-end="url(#sfl-arrow)"/>
      <path d="M174 236H216" marker-end="url(#sfl-arrow)"/>
    </g>
    <path d="M174 306H384V350H458V306H558" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfl-arrow-red)"/>
    <g stroke="#b5524b" stroke-width="3" stroke-linecap="round">
      <path d="M233 228 249 244"/>
      <path d="M249 228 233 244"/>
    </g>

    <g font-size="11" fill="#36424e">
      <text x="331" y="88">22 from office VPN</text>
      <text x="501" y="88">limit 22/tcp</text>
      <text x="331" y="158">443 from anywhere</text>
      <text x="501" y="158">allow 443/tcp</text>
      <text x="331" y="298">port 27017 open</text>
    </g>
    <text x="331" y="232" font-size="11" font-weight="700" fill="#6e2a24">dropped at the edge</text>
    <text x="421" y="370" font-size="11.5" font-weight="700" fill="#6e2a24">Docker's NAT rules skip ufw</text>

    <text x="430" y="408" font-size="13" fill="#40566b">The cloud firewall stops traffic before the VM; ufw guards the host, except ports Docker publishes.</text>
  </g>
</svg>
