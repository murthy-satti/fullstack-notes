<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="ssr-title ssr-desc">
  <title id="ssr-title">The request path on one server</title>
  <desc id="ssr-desc">A client sends HTTPS to nginx on port 443, which terminates TLS, gzips JSON, enforces client_max_body_size 10m, applies timeouts and buffering, and upgrades /ws/ to WebSocket. nginx passes requests to the upstream taskflow_api, which balances between 127.0.0.1:3001 and 127.0.0.1:3002, keeps 16 idle keep-alive connections, and retries on connection errors. The two upstream servers are the systemd instances taskflow-api@3001 and taskflow-api@3002, running Node 24 as the taskflow user. They query MongoDB over TLS on a private network and write stdout and stderr to journald. certbot.timer renews the certificate and its deploy hook reloads nginx. Only nginx faces the internet.</desc>
  <defs>
    <marker id="ssr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ssr-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">api.example.com on one Ubuntu server</text>

    <rect x="24" y="96" width="140" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="122" font-size="14" font-weight="700" fill="#66400f">Client</text>
    <text x="94" y="141" font-size="11.5" fill="#66400f">browser or app</text>

    <rect x="210" y="60" width="200" height="140" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="310" y="83" font-size="14" font-weight="700" fill="#263e5a">nginx :443</text>
    <g font-size="11" fill="#263e5a">
      <text x="310" y="106">TLS termination</text>
      <text x="310" y="124">gzip for JSON</text>
      <text x="310" y="142">client_max_body_size 10m</text>
      <text x="310" y="160">timeouts and buffering</text>
      <text x="310" y="178">/ws/ upgraded to WebSocket</text>
    </g>

    <rect x="456" y="60" width="180" height="140" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="546" y="83" font-size="12.5" font-weight="700" fill="#463365">upstream taskflow_api</text>
    <g font-size="11" fill="#463365">
      <text x="546" y="106">127.0.0.1:3001</text>
      <text x="546" y="124">127.0.0.1:3002</text>
      <text x="546" y="142">keepalive 16</text>
      <text x="546" y="160">retry on connect error</text>
    </g>

    <rect x="680" y="56" width="176" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="768" y="79" font-size="12.5" font-weight="700" fill="#66400f">taskflow-api@3001</text>
    <text x="768" y="98" font-size="11" fill="#66400f">Node 24, user taskflow</text>
    <rect x="680" y="146" width="176" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="768" y="169" font-size="12.5" font-weight="700" fill="#66400f">taskflow-api@3002</text>
    <text x="768" y="188" font-size="11" fill="#66400f">Node 24, user taskflow</text>

    <rect x="680" y="262" width="176" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="768" y="284" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="768" y="302" font-size="11" fill="#263e5a">TLS, private network</text>

    <rect x="456" y="262" width="180" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="546" y="284" font-size="14" font-weight="700" fill="#463365">journald</text>
    <text x="546" y="302" font-size="11" fill="#463365">stdout and stderr</text>

    <rect x="210" y="262" width="200" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="310" y="284" font-size="14" font-weight="700" fill="#463365">certbot.timer</text>
    <text x="310" y="302" font-size="11" fill="#463365">renew, then reload nginx</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 128H208" marker-end="url(#ssr-arrow)"/>
      <path d="M410 128H454" marker-end="url(#ssr-arrow)"/>
      <path d="M636 100 678 86" marker-end="url(#ssr-arrow)"/>
      <path d="M636 160 678 172" marker-end="url(#ssr-arrow)"/>
      <path d="M768 202V260" marker-end="url(#ssr-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M700 202V232H546V260" marker-end="url(#ssr-arrow-ret)"/>
      <path d="M310 262V202" marker-end="url(#ssr-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="186" y="120">HTTPS</text>
      <text x="623" y="226">stdout, stderr</text>
      <text x="806" y="236">queries</text>
      <text x="340" y="236">reload</text>
    </g>

    <text x="440" y="356" font-size="13" fill="#40566b">Only nginx faces the internet; both Node instances listen on loopback and log to the journal.</text>
  </g>
</svg>
