<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="cof-title cof-desc">
  <title id="cof-title">Overlapping cron runs compared with flock and systemd timers</title>
  <desc id="cof-desc">A job is scheduled every 5 minutes but each run takes 12 minutes. With plain cron, a new copy starts every 5 minutes regardless: runs start at 0, 5, 10, 15, 20 and 25 minutes, so up to three copies run at once, multiplying database load and duplicate work. With flock -n, the run at 0 holds the lock until 12; the attempts at 5 and 10 find the lock held and exit immediately; the run at 15 holds it until 27; the attempts at 20 and 25 are skipped. A systemd timer behaves the same way, because when the service is still active the timer leaves it running and starts no second instance.</desc>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">*/5 * * * * for a job that takes 12 minutes</text>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="82">plain cron</text>
      <text x="24" y="172">flock -n</text>
      <text x="24" y="222">systemd timer</text>
    </g>
    <text x="24" y="98" font-size="11" fill="#6e2a24" text-anchor="start">up to 3 at once</text>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="150" y="52" width="264" height="18" rx="4"/>
      <rect x="480" y="52" width="264" height="18" rx="4"/>
      <rect x="260" y="76" width="264" height="18" rx="4"/>
      <rect x="590" y="76" width="220" height="18" rx="4"/>
      <rect x="370" y="100" width="264" height="18" rx="4"/>
      <rect x="700" y="100" width="110" height="18" rx="4"/>
    </g>
    <g font-size="10.5" fill="#6e2a24">
      <text x="282" y="65">run 1</text>
      <text x="612" y="65">run 4</text>
      <text x="392" y="89">run 2</text>
      <text x="700" y="89">run 5</text>
      <text x="502" y="113">run 3</text>
      <text x="755" y="113">run 6</text>
    </g>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="150" y="156" width="264" height="22" rx="4"/>
      <rect x="480" y="156" width="264" height="22" rx="4"/>
      <rect x="150" y="206" width="264" height="22" rx="4"/>
      <rect x="480" y="206" width="264" height="22" rx="4"/>
    </g>
    <g font-size="11" fill="#294a2e">
      <text x="282" y="171">run 1 holds the lock</text>
      <text x="612" y="171">run 2 holds the lock</text>
      <text x="282" y="221">run 1 (unit active)</text>
      <text x="612" y="221">run 2</text>
    </g>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <circle cx="260" cy="146" r="5"/>
      <circle cx="370" cy="146" r="5"/>
      <circle cx="590" cy="146" r="5"/>
      <circle cx="700" cy="146" r="5"/>
      <circle cx="260" cy="196" r="5"/>
      <circle cx="370" cy="196" r="5"/>
      <circle cx="590" cy="196" r="5"/>
      <circle cx="700" cy="196" r="5"/>
    </g>
    <text x="480" y="134" font-size="11" fill="#60788d">grey dots: skipped, lock held, exit immediately</text>

    <path d="M150 252H810" stroke="#40566b" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="1.5">
      <path d="M150 248V256"/>
      <path d="M260 248V256"/>
      <path d="M370 248V256"/>
      <path d="M480 248V256"/>
      <path d="M590 248V256"/>
      <path d="M700 248V256"/>
      <path d="M810 248V256"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="150" y="272">0 min</text>
      <text x="260" y="272">5</text>
      <text x="370" y="272">10</text>
      <text x="480" y="272">15</text>
      <text x="590" y="272">20</text>
      <text x="700" y="272">25</text>
      <text x="810" y="272">30</text>
    </g>

    <text x="430" y="312" font-size="13" fill="#40566b">cron starts a new copy on schedule no matter what; flock -n and systemd timers do not.</text>
  </g>
</svg>
