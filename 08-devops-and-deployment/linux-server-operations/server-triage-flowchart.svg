<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" role="img" aria-labelledby="stf-title stf-desc">
  <title id="stf-title">Triage flowchart for a slow or failing server</title>
  <desc id="stf-desc">Start: users report slow or failing requests. First run uptime, dmesg -T piped to tail, and vmstat 1 5. Question 1: are there OOM kills or I/O errors in the kernel log? If yes, investigate memory or hardware with journalctl -k and systemctl status, looking for an oom-kill result. If no, question 2: is the run queue r above the CPU count, or are us plus sy near 100 percent? If yes, investigate CPU with top and pidstat; one core at 100 percent means the Node.js event loop is saturated. If no, question 3: is wa high, or are tasks blocked with b above 0? If yes, investigate disk with iostat -xz 1, df -h, df -i, and lsof +L1. If no, question 4: are si or so above 0 for minutes? If yes, investigate memory pressure with free -h available, swap, MemoryHigh, and leaks. If no, question 5: are there connection errors, or is DNS, TLS, or TCP slow? If yes, investigate the network with ss -tulpn, curl -w timings, dig, and mtr. If no, the problem is inside the app: logs, event-loop delay, and slow queries.</desc>
  <defs>
    <marker id="stf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="720" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="200" y="20" width="320" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="360" y="47" font-size="13.5" font-weight="700" fill="#66400f">Users report slow or failing requests</text>
    <rect x="200" y="84" width="320" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="360" y="104" font-size="13" font-weight="700" fill="#463365">First minute</text>
    <text x="360" y="120" font-size="11.5" fill="#463365">uptime, dmesg -T | tail, vmstat 1 5</text>

    <g fill="#ffffff" stroke="#40566b" stroke-width="2">
      <path d="M360 165 480 200 360 235 240 200z"/>
      <path d="M360 255 480 290 360 325 240 290z"/>
      <path d="M360 345 480 380 360 415 240 380z"/>
      <path d="M360 435 480 470 360 505 240 470z"/>
      <path d="M360 525 480 560 360 595 240 560z"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="360" y="197">OOM kills or I/O errors</text>
      <text x="360" y="212">in the kernel log?</text>
      <text x="360" y="287">r above CPU count, or</text>
      <text x="360" y="302">us + sy near 100%?</text>
      <text x="360" y="377">wa high, or tasks</text>
      <text x="360" y="392">blocked (b above 0)?</text>
      <text x="360" y="467">si / so above 0</text>
      <text x="360" y="482">for minutes?</text>
      <text x="360" y="557">connection errors, or</text>
      <text x="360" y="572">slow DNS, TCP, or TLS?</text>
    </g>

    <g stroke-width="2">
      <rect x="540" y="172" width="316" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="540" y="262" width="316" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="540" y="352" width="316" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="540" y="442" width="316" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="540" y="532" width="316" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="200" y="620" width="320" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="698" y="194" fill="#6e2a24">Memory or hardware</text>
      <text x="698" y="284" fill="#263e5a">CPU</text>
      <text x="698" y="374" fill="#263e5a">Disk</text>
      <text x="698" y="464" fill="#263e5a">Memory pressure</text>
      <text x="698" y="554" fill="#263e5a">Network</text>
      <text x="360" y="642" fill="#294a2e">Inside the app</text>
    </g>
    <g font-size="11">
      <text x="698" y="214" fill="#6e2a24">journalctl -k, systemctl status (oom-kill)</text>
      <text x="698" y="304" fill="#263e5a">top, pidstat: one core at 100% = event loop</text>
      <text x="698" y="394" fill="#263e5a">iostat -xz 1, df -h, df -i, lsof +L1</text>
      <text x="698" y="484" fill="#263e5a">free -h available, swap, MemoryHigh, leaks</text>
      <text x="698" y="574" fill="#263e5a">ss -tulpn, curl -w timings, dig, mtr</text>
      <text x="360" y="662" fill="#294a2e">logs, event-loop delay, slow queries</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M360 64V82" marker-end="url(#stf-arrow)"/>
      <path d="M360 128V163" marker-end="url(#stf-arrow)"/>
      <path d="M480 200H538" marker-end="url(#stf-arrow)"/>
      <path d="M480 290H538" marker-end="url(#stf-arrow)"/>
      <path d="M480 380H538" marker-end="url(#stf-arrow)"/>
      <path d="M480 470H538" marker-end="url(#stf-arrow)"/>
      <path d="M480 560H538" marker-end="url(#stf-arrow)"/>
      <path d="M360 235V253" marker-end="url(#stf-arrow)"/>
      <path d="M360 325V343" marker-end="url(#stf-arrow)"/>
      <path d="M360 415V433" marker-end="url(#stf-arrow)"/>
      <path d="M360 505V523" marker-end="url(#stf-arrow)"/>
      <path d="M360 595V618" marker-end="url(#stf-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="509" y="193">yes</text>
      <text x="509" y="283">yes</text>
      <text x="509" y="373">yes</text>
      <text x="509" y="463">yes</text>
      <text x="509" y="553">yes</text>
      <text x="376" y="249" text-anchor="start">no</text>
      <text x="376" y="339" text-anchor="start">no</text>
      <text x="376" y="429" text-anchor="start">no</text>
      <text x="376" y="519" text-anchor="start">no</text>
      <text x="376" y="612" text-anchor="start">no</text>
    </g>

    <text x="440" y="704" font-size="13" fill="#40566b">The kernel log and vmstat rule whole resources in or out within a minute; then go deep on one.</text>
  </g>
</svg>
