<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="bko-title bko-desc">
  <title id="bko-title">From production data to a verified restore</title>
  <desc id="bko-desc">Four kinds of data are backed up: the MongoDB database with TaskFlow's tasks and users, object storage with uploaded files, configuration and secrets, and infrastructure-as-code state. Scheduled backup jobs take nightly snapshots, capture the oplog continuously, and sync files. The backups are encrypted with a key held in a key management service in a separate account, then written to offsite, immutable storage in another region and another account, protected by Object Lock and kept according to a grandfather-father-son retention schedule. An automated restore test regularly restores the latest backup into a scratch environment and checks document counts, checksums, and an application smoke test. Its results feed a dashboard and alerts that show the last good backup and the last good restore.</desc>
  <defs>
    <marker id="bko-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="104" y="38">Data</text>
      <text x="324" y="38">Back up</text>
      <text x="544" y="38">Protect</text>
      <text x="765" y="38">Store offsite</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="24" y="52" width="160" height="44" rx="8"/>
      <rect x="24" y="106" width="160" height="44" rx="8"/>
      <rect x="24" y="160" width="160" height="44" rx="8"/>
      <rect x="24" y="214" width="160" height="44" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#263e5a">
      <text x="104" y="71">MongoDB</text>
      <text x="104" y="125">Object storage</text>
      <text x="104" y="179">Config, secrets</text>
      <text x="104" y="233">IaC state</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="104" y="87">tasks and users</text>
      <text x="104" y="141">uploaded files</text>
      <text x="104" y="195">encrypted copies</text>
      <text x="104" y="249">Terraform state</text>
    </g>

    <rect x="234" y="52" width="180" height="206" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="324" y="118" font-size="14" font-weight="700" fill="#463365">Backup jobs</text>
    <g font-size="11.5" fill="#463365">
      <text x="324" y="142">nightly snapshot</text>
      <text x="324" y="160">continuous oplog</text>
      <text x="324" y="178">file and state sync</text>
      <text x="324" y="196">on a schedule</text>
    </g>

    <rect x="464" y="112" width="160" height="92" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="544" y="144" font-size="14" font-weight="700" fill="#463365">Encrypt</text>
    <text x="544" y="164" font-size="11.5" fill="#463365">KMS key in a</text>
    <text x="544" y="181" font-size="11.5" fill="#463365">separate account</text>

    <rect x="674" y="52" width="182" height="206" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="765" y="110" font-size="14" font-weight="700" fill="#263e5a">Immutable copy</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="765" y="134">another region</text>
      <text x="765" y="152">another account</text>
      <text x="765" y="170">Object Lock</text>
      <text x="765" y="188">GFS retention</text>
    </g>

    <rect x="464" y="300" width="392" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="660" y="323" font-size="14" font-weight="700" fill="#294a2e">Automated restore test</text>
    <text x="660" y="342" font-size="11.5" fill="#294a2e">scratch environment: counts, checksums, smoke test</text>

    <rect x="234" y="300" width="180" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="324" y="323" font-size="14" font-weight="700" fill="#66400f">Dashboard + alerts</text>
    <text x="324" y="342" font-size="11" fill="#66400f">last good backup, restore</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M184 74H232" marker-end="url(#bko-arrow)"/>
      <path d="M184 128H232" marker-end="url(#bko-arrow)"/>
      <path d="M184 182H232" marker-end="url(#bko-arrow)"/>
      <path d="M184 236H232" marker-end="url(#bko-arrow)"/>
      <path d="M414 158H462" marker-end="url(#bko-arrow)"/>
      <path d="M624 158H672" marker-end="url(#bko-arrow)"/>
      <path d="M765 258V298" marker-end="url(#bko-arrow)"/>
      <path d="M464 328H416" marker-end="url(#bko-arrow)"/>
    </g>
    <text x="773" y="283" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">restore weekly</text>

    <text x="440" y="390" font-size="13" fill="#40566b">A backup counts only when a restore from it has been proven, on a schedule.</text>
  </g>
</svg>
