<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-labelledby="tlh-title tlh-desc">
  <title id="tlh-title">The TLS 1.3 full handshake</title>
  <desc id="tlh-desc">A sequence between a client and a server. The client sends ClientHello with supported_versions listing TLS 1.3, a key_share such as an X25519 public value, signature_algorithms, the server name (SNI), and ALPN. The server replies with ServerHello containing the chosen cipher suite and its own key_share. Both sides now derive handshake keys from the two key shares using ECDHE. The server then sends, encrypted with handshake keys, EncryptedExtensions including the chosen ALPN protocol h2, Certificate with the leaf and intermediates, CertificateVerify with a signature over the handshake made with its private key, and Finished with a MAC over the whole handshake. This first flight completes one round trip. The client verifies the chain, hostname, signature, and the server's Finished, then sends its own Finished and can immediately send application data. From then on application data flows both ways encrypted with traffic keys. Braces mean encrypted with handshake keys; square brackets mean encrypted with application traffic keys.</desc>
  <defs>
    <marker id="tlh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="tlh-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="tlh-arrow-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
    <marker id="tlh-arrow-ok-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="860" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="20" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="39" font-size="14" font-weight="700" fill="#66400f">Client</text>
    <text x="150" y="55" font-size="11.5" fill="#66400f">browser or Node.js</text>
    <rect x="640" y="20" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="39" font-size="14" font-weight="700" fill="#263e5a">Server</text>
    <text x="710" y="55" font-size="11.5" fill="#263e5a">api.example.com</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M150 64V484"/>
      <path d="M710 64V484"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 100H708" marker-end="url(#tlh-arrow)"/>
      <path d="M150 420H708" marker-end="url(#tlh-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M710 160H152" marker-end="url(#tlh-arrow-ret)"/>
      <path d="M710 244H152" marker-end="url(#tlh-arrow-ret)"/>
      <path d="M710 276H152" marker-end="url(#tlh-arrow-ret)"/>
      <path d="M710 308H152" marker-end="url(#tlh-arrow-ret)"/>
      <path d="M710 340H152" marker-end="url(#tlh-arrow-ret)"/>
    </g>
    <path d="M154 460H706" fill="none" stroke="#53845b" stroke-width="2.5" stroke-linecap="round" marker-start="url(#tlh-arrow-ok-start)" marker-end="url(#tlh-arrow-ok)"/>

    <g font-size="12.5" font-weight="700" fill="#36424e">
      <text x="430" y="92">ClientHello</text>
      <text x="430" y="152">ServerHello</text>
      <text x="430" y="238">{EncryptedExtensions}</text>
      <text x="430" y="270">{Certificate}</text>
      <text x="430" y="302">{CertificateVerify}</text>
      <text x="430" y="334">{Finished}</text>
      <text x="430" y="412">{Finished}</text>
    </g>
    <text x="430" y="452" font-size="12.5" font-weight="700" fill="#294a2e">[Application data] both ways</text>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="430" y="116">supported_versions: TLS 1.3, key_share (X25519), signature_algorithms, SNI, ALPN</text>
      <text x="430" y="176">chosen cipher suite, key_share: the server's public value</text>
      <text x="560" y="254" text-anchor="start">ALPN: h2</text>
      <text x="530" y="286" text-anchor="start">leaf + intermediates</text>
      <text x="548" y="318" text-anchor="start">signed with the private key</text>
      <text x="494" y="350" text-anchor="start">MAC over the handshake</text>
      <text x="430" y="476">encrypted with application traffic keys</text>
    </g>

    <rect x="200" y="192" width="460" height="24" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="430" y="208" font-size="11.5" fill="#463365">both sides derive handshake keys from the two key shares (ECDHE)</text>

    <rect x="154" y="362" width="352" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="330" y="383" font-size="11.5" fill="#294a2e">client verifies chain, name, signature, Finished</text>

    <path d="M790 100V340" fill="none" stroke="#bd7a20" stroke-width="2"/>
    <path d="M782 100H798M782 340H798" fill="none" stroke="#bd7a20" stroke-width="2"/>
    <text x="804" y="216" font-size="12" font-weight="700" fill="#66400f" text-anchor="start">1 RTT</text>
    <text x="804" y="232" font-size="11" fill="#66400f" text-anchor="start">to keys</text>

    <text x="24" y="512" font-size="11.5" fill="#36424e" text-anchor="start">{ } encrypted with handshake keys      [ ] encrypted with application traffic keys</text>
    <text x="430" y="544" font-size="13" fill="#40566b">One round trip to a secure channel; the certificate itself travels encrypted in TLS 1.3.</text>
  </g>
</svg>
