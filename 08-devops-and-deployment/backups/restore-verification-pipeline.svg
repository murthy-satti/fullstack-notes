<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="rvp-title rvp-desc">
  <title id="rvp-title">An automated restore verification pipeline</title>
  <desc id="rvp-desc">A scheduled job runs weekly. It fetches the latest backup and its manifest from the backup account using a read-only role, then restores into a fresh scratch MongoDB environment and records how long the restore took. Verification has four checks: the restore completed without errors; document counts per collection are within 0.5 percent of the manifest captured at backup time; data is fresh, meaning the newest updatedAt is within the RPO; and an application smoke test passes, with TaskFlow API started against the restored data answering /readyz and listing a test user's tasks. If every check passes, metrics are published (last successful restore time, restore duration as RTO evidence, and data age as RPO evidence) and the scratch environment is destroyed. If any check fails, a ticket or page is raised with the logs and the scratch environment is kept for investigation.</desc>
  <defs>
    <marker id="rvp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="160" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="104" y="66" font-size="14" font-weight="700" fill="#463365">Scheduled job</text>
    <text x="104" y="86" font-size="11.5" fill="#463365">weekly, in CI</text>
    <rect x="234" y="40" width="190" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="329" y="66" font-size="14" font-weight="700" fill="#263e5a">Fetch latest backup</text>
    <text x="329" y="86" font-size="11.5" fill="#263e5a">+ manifest, read-only role</text>
    <rect x="474" y="40" width="190" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="569" y="66" font-size="14" font-weight="700" fill="#263e5a">Restore to scratch</text>
    <text x="569" y="86" font-size="11.5" fill="#263e5a">fresh MongoDB, timed</text>

    <rect x="24" y="140" width="640" height="150" rx="10" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="40" y="162" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Verify</text>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="40" y="176" width="140" height="96" rx="8"/>
      <rect x="196" y="176" width="140" height="96" rx="8"/>
      <rect x="352" y="176" width="140" height="96" rx="8"/>
      <rect x="508" y="176" width="140" height="96" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#294a2e">
      <text x="110" y="200">1. Completed</text>
      <text x="266" y="200">2. Counts</text>
      <text x="422" y="200">3. Freshness</text>
      <text x="578" y="200">4. Smoke test</text>
    </g>
    <g font-size="11" fill="#294a2e">
      <text x="110" y="222">exit code 0,</text>
      <text x="110" y="238">no restore errors,</text>
      <text x="110" y="254">indexes rebuilt</text>
      <text x="266" y="222">per collection,</text>
      <text x="266" y="238">within 0.5% of</text>
      <text x="266" y="254">the manifest</text>
      <text x="422" y="222">newest updatedAt</text>
      <text x="422" y="238">within the RPO</text>
      <text x="422" y="254">(data age)</text>
      <text x="578" y="222">API on restored DB:</text>
      <text x="578" y="238">/readyz and a</text>
      <text x="578" y="254">task list query</text>
    </g>

    <rect x="704" y="140" width="152" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="780" y="166" font-size="13" font-weight="700" fill="#294a2e">All pass</text>
    <text x="780" y="184" font-size="11" fill="#294a2e">publish metrics,</text>
    <text x="780" y="199" font-size="11" fill="#294a2e">destroy scratch env</text>
    <rect x="704" y="220" width="152" height="70" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="780" y="246" font-size="13" font-weight="700" fill="#6e2a24">Any fails</text>
    <text x="780" y="264" font-size="11" fill="#6e2a24">ticket or page, keep</text>
    <text x="780" y="279" font-size="11" fill="#6e2a24">env for debugging</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M184 72H232" marker-end="url(#rvp-arrow)"/>
      <path d="M424 72H472" marker-end="url(#rvp-arrow)"/>
      <path d="M569 104V138" marker-end="url(#rvp-arrow)"/>
      <path d="M664 196 702 178" marker-end="url(#rvp-arrow)"/>
      <path d="M664 236 702 254" marker-end="url(#rvp-arrow)"/>
    </g>

    <rect x="24" y="316" width="832" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="440" y="339" font-size="12.5" font-weight="700" fill="#66400f">Metrics: last_successful_restore_timestamp, restore_duration_seconds, restored_data_age_seconds</text>
    <text x="440" y="358" font-size="11.5" fill="#66400f">Alert if no successful restore in 8 days; trend duration against the RTO and data age against the RPO</text>

    <text x="440" y="406" font-size="13" fill="#40566b">Every week, prove the latest backup restores, contains the right data, and runs the app.</text>
  </g>
</svg>
