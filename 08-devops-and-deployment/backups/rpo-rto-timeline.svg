<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="rrt-title rrt-desc">
  <title id="rrt-title">RPO and RTO on a timeline around a disaster</title>
  <desc id="rrt-desc">A timeline for TaskFlow. The last recoverable copy of the data was made at 02:00. The disaster, a regional outage, happens at 05:40. Everything written between 02:00 and 05:40 is lost: 3 hours 40 minutes of data, which must fit within the recovery point objective. Service is restored at 07:10, so users are down for 1 hour 30 minutes, which must fit within the recovery time objective. The recovery time breaks down into detecting the problem, deciding to fail over, provisioning and restoring, and verifying and switching traffic.</desc>
  <rect width="880" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="200" y="56" width="240" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="320" y="73" font-size="12.5" font-weight="700" fill="#66400f">data lost: 3 h 40 min</text>
    <text x="320" y="89" font-size="11" fill="#66400f">must be within the RPO</text>
    <rect x="440" y="56" width="260" height="40" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="570" y="73" font-size="12.5" font-weight="700" fill="#6e2a24">downtime: 1 h 30 min</text>
    <text x="570" y="89" font-size="11" fill="#6e2a24">must be within the RTO</text>

    <g fill="none" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M200 96V170" stroke="#bd7a20"/>
      <path d="M440 96V170" stroke="#b5524b"/>
      <path d="M700 96V170" stroke="#53845b"/>
    </g>

    <path d="M60 170H840" stroke="#8a96a3" stroke-width="2"/>
    <circle cx="200" cy="170" r="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <circle cx="440" cy="170" r="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <circle cx="700" cy="170" r="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="12" font-weight="700">
      <text x="200" y="198" fill="#263e5a">02:00</text>
      <text x="440" y="198" fill="#6e2a24">05:40</text>
      <text x="700" y="198" fill="#294a2e">07:10</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="200" y="215">last recoverable copy</text>
      <text x="440" y="215">disaster: region outage</text>
      <text x="700" y="215">service restored</text>
    </g>

    <text x="24" y="262" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">Inside the RTO</text>
    <g stroke-width="1.5">
      <rect x="440" y="244" width="40" height="26" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="480" y="244" width="40" height="26" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="520" y="244" width="140" height="26" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="244" width="40" height="26" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <text x="590" y="261" font-size="11" fill="#263e5a">provision + restore</text>
    <g font-size="11" fill="#36424e">
      <text x="460" y="290">detect</text>
      <text x="500" y="306">decide</text>
      <text x="680" y="290">verify, switch</text>
    </g>
    <g stroke="#8a96a3" stroke-width="1">
      <path d="M460 270V280"/>
      <path d="M500 270V296"/>
      <path d="M680 270V280"/>
    </g>

    <text x="440" y="342" font-size="13" fill="#40566b">RPO looks backwards from the disaster (data lost); RTO looks forwards (time down).</text>
  </g>
</svg>
