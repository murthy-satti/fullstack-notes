<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="ttf-title ttf-desc">
  <title id="ttf-title">TaskFlow organized with the four Team Topologies team types</title>
  <desc id="ttf-desc">Three stream-aligned teams each own a service end to end, building and running it: the Web team owns TaskFlow Web, the Reminders team owns task reminders, and the Tasks team owns the TaskFlow API. A delivery platform team provides CI/CD templates, Kubernetes, observability, and a developer portal to all three as X-as-a-Service, and also collaborates with the Web team for a limited time. A reliability enabling team teaches SRE practices and SLO coaching to the Reminders team in a facilitating interaction lasting six weeks. A scheduling engine team, a complicated-subsystem team, provides its engine to the Tasks team as X-as-a-Service. A legend shows solid arrows for X-as-a-Service, dashed green arrows for facilitating, and dashed purple double-headed arrows for time-boxed collaboration.</desc>
  <defs>
    <marker id="ttf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ttf-arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
    <marker id="ttf-arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
    <marker id="ttf-arrow-purple-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">TaskFlow organized with Team Topologies</text>

    <rect x="24" y="78" width="152" height="132" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="100" y="118" font-size="13" font-weight="700" fill="#294a2e">Reliability</text>
    <text x="100" y="135" font-size="13" font-weight="700" fill="#294a2e">enabling team</text>
    <text x="100" y="158" font-size="11.5" fill="#294a2e">SRE practices,</text>
    <text x="100" y="174" font-size="11.5" fill="#294a2e">SLO coaching</text>

    <rect x="196" y="78" width="150" height="132" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="271" y="104" font-size="13" font-weight="700" fill="#66400f">Web team</text>
    <text x="271" y="122" font-size="11" font-style="italic" fill="#66400f">stream-aligned</text>
    <text x="271" y="146" font-size="11.5" fill="#66400f">owns TaskFlow Web</text>
    <text x="271" y="164" font-size="11.5" fill="#66400f">builds it and</text>
    <text x="271" y="180" font-size="11.5" fill="#66400f">runs it</text>

    <rect x="366" y="78" width="150" height="132" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="441" y="104" font-size="13" font-weight="700" fill="#66400f">Reminders team</text>
    <text x="441" y="122" font-size="11" font-style="italic" fill="#66400f">stream-aligned</text>
    <text x="441" y="146" font-size="11.5" fill="#66400f">owns reminders</text>
    <text x="441" y="164" font-size="11.5" fill="#66400f">builds it and</text>
    <text x="441" y="180" font-size="11.5" fill="#66400f">runs it</text>

    <rect x="536" y="78" width="150" height="132" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="611" y="104" font-size="13" font-weight="700" fill="#66400f">Tasks team</text>
    <text x="611" y="122" font-size="11" font-style="italic" fill="#66400f">stream-aligned</text>
    <text x="611" y="146" font-size="11.5" fill="#66400f">owns TaskFlow API</text>
    <text x="611" y="164" font-size="11.5" fill="#66400f">builds it and</text>
    <text x="611" y="180" font-size="11.5" fill="#66400f">runs it</text>

    <rect x="706" y="78" width="150" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="781" y="104" font-size="13" font-weight="700" fill="#263e5a">Scheduling</text>
    <text x="781" y="121" font-size="13" font-weight="700" fill="#263e5a">engine team</text>
    <text x="781" y="144" font-size="11.5" fill="#263e5a">complicated</text>
    <text x="781" y="160" font-size="11.5" fill="#263e5a">subsystem</text>
    <path d="M706 128H690" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#ttf-arrow)"/>

    <path d="M100 78V58H441V76" fill="none" stroke="#53845b" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ttf-arrow-green)"/>
    <rect x="200" y="47" width="140" height="16" fill="#f5f7fb"/>
    <text x="270" y="59" font-size="11.5" font-style="italic" fill="#294a2e">facilitating, 6 weeks</text>

    <rect x="196" y="292" width="490" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="441" y="315" font-size="13" font-weight="700" fill="#463365">Delivery platform team</text>
    <text x="441" y="334" font-size="11.5" fill="#463365">CI/CD templates, Kubernetes, observability, developer portal</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M296 292V212" marker-end="url(#ttf-arrow)"/>
      <path d="M441 292V212" marker-end="url(#ttf-arrow)"/>
      <path d="M611 292V212" marker-end="url(#ttf-arrow)"/>
    </g>
    <text x="451" y="256" font-size="11.5" fill="#36424e" text-anchor="start">X-as-a-Service</text>
    <path d="M236 288V216" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-start="url(#ttf-arrow-purple-start)" marker-end="url(#ttf-arrow-purple)"/>
    <text x="226" y="246" font-size="11.5" fill="#463365" text-anchor="end">collaboration,</text>
    <text x="226" y="262" font-size="11.5" fill="#463365" text-anchor="end">time-boxed</text>

    <g text-anchor="start" font-size="11.5" fill="#36424e">
      <path d="M196 382H232" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ttf-arrow)"/>
      <text x="242" y="386">X-as-a-Service</text>
      <path d="M380 382H416" fill="none" stroke="#53845b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ttf-arrow-green)"/>
      <text x="426" y="386">facilitating</text>
      <path d="M540 382H576" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#ttf-arrow-purple-start)" marker-end="url(#ttf-arrow-purple)"/>
      <text x="586" y="386">collaboration (time-boxed)</text>
    </g>

    <text x="440" y="420" font-size="13" fill="#40566b">Stream-aligned teams own the flow of change; the other three team types exist to speed them up.</text>
  </g>
</svg>
