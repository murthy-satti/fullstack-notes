<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="dts-title dts-desc">
  <title id="dts-title">Where the timestamps for each delivery metric come from</title>
  <desc id="dts-desc">A timeline for one TaskFlow change: the commit at Monday 09:15, the pull request merged at 10:50, deploy number 41 finished at 11:40, an alert fires at 12:05, rollback deploy number 42 restores service at 12:15, and fix deploy number 43 ships at 16:30. Change lead time runs from the commit to deploy 41, 2 hours 25 minutes, a throughput metric. Failed deployment recovery time runs from deploy 41 to the restore at 12:15, 35 minutes, also a throughput metric. Deployment frequency counts deploys 41, 42, and 43. Change fail rate counts deploy 41 because it needed immediate intervention. Deployment rework rate counts deploys 42 and 43 because they were unplanned fixes for the incident. The commit time comes from git, the merge time from the code host, deploy times from the pipeline, and alert and restore times from the incident tracker.</desc>
  <rect width="880" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One change and five metrics: where each timestamp comes from</text>

    <path d="M60 120H840" stroke="#8a96a3" stroke-width="2"/>
    <g font-size="12" font-weight="700">
      <text x="90" y="88" fill="#66400f">commit</text>
      <text x="230" y="88" fill="#66400f">PR merged</text>
      <text x="380" y="88" fill="#263e5a">deploy #41</text>
      <text x="500" y="88" fill="#6e2a24">alert fires</text>
      <text x="620" y="88" fill="#6e2a24">rollback #42</text>
      <text x="790" y="88" fill="#263e5a">fix deploy #43</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="90" y="104">Mon 09:15</text>
      <text x="230" y="104">10:50</text>
      <text x="380" y="104">11:40</text>
      <text x="500" y="104">12:05</text>
      <text x="620" y="104">12:15</text>
      <text x="790" y="104">16:30</text>
    </g>
    <g stroke="#f5f7fb" stroke-width="2">
      <circle cx="90" cy="120" r="7" fill="#bd7a20"/>
      <circle cx="230" cy="120" r="7" fill="#bd7a20"/>
      <circle cx="380" cy="120" r="7" fill="#4774aa"/>
      <circle cx="500" cy="120" r="7" fill="#b5524b"/>
      <circle cx="620" cy="120" r="7" fill="#b5524b"/>
      <circle cx="790" cy="120" r="7" fill="#4774aa"/>
    </g>

    <path d="M90 142V152H380V142" fill="none" stroke="#53845b" stroke-width="2"/>
    <text x="235" y="172" font-size="12" font-weight="700" fill="#294a2e">change lead time: 2 h 25 min (throughput)</text>
    <path d="M380 188V198H620V188" fill="none" stroke="#b5524b" stroke-width="2"/>
    <text x="500" y="218" font-size="12" font-weight="700" fill="#6e2a24">failed deployment recovery time: 35 min (throughput)</text>

    <rect x="24" y="246" width="262" height="72" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="155" y="268" font-size="13" font-weight="700" fill="#263e5a">Deployment frequency</text>
    <text x="155" y="287" font-size="11.5" fill="#263e5a">counts #41, #42, and #43</text>
    <text x="155" y="305" font-size="11" font-style="italic" fill="#263e5a">throughput</text>

    <rect x="309" y="246" width="262" height="72" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="440" y="268" font-size="13" font-weight="700" fill="#6e2a24">Change fail rate</text>
    <text x="440" y="287" font-size="11.5" fill="#6e2a24">#41 needed immediate intervention</text>
    <text x="440" y="305" font-size="11" font-style="italic" fill="#6e2a24">instability</text>

    <rect x="594" y="246" width="262" height="72" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="725" y="268" font-size="13" font-weight="700" fill="#463365">Deployment rework rate</text>
    <text x="725" y="287" font-size="11.5" fill="#463365">#42 and #43 were unplanned fixes</text>
    <text x="725" y="305" font-size="11" font-style="italic" fill="#463365">instability</text>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="352">Sources: commit time from git; merge time from the code host; deploy times from the pipeline;</text>
      <text x="24" y="369">alert and restore times from the alerting system or incident tracker.</text>
    </g>

    <text x="440" y="424" font-size="13" fill="#40566b">Each metric is a difference or a ratio of a few timestamps; record them automatically at the source.</text>
  </g>
</svg>
