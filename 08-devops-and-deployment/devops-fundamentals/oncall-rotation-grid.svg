<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="org-title org-desc">
  <title id="org-title">On-call rotation size and the 25 percent rule</title>
  <desc id="org-desc">An eight-week grid for eight engineers, dev-a to dev-h, with weekly shifts and two people on call each week, a primary and a secondary. Each engineer is primary once and secondary once in the eight weeks, so each is on call two weeks in eight, 25 percent of their time. With five engineers and the same rotation, each would be on call two weeks in five, 40 percent, over the limit. The Google SRE book allows at most 25 percent of an SRE's time on call, which means at least eight engineers for a single-site 24/7 rotation, or six per site for a rotation shared by two sites.</desc>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Weekly primary and secondary shifts for eight engineers</text>

    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="136" y="62">wk 1</text><text x="192" y="62">wk 2</text><text x="248" y="62">wk 3</text><text x="304" y="62">wk 4</text>
      <text x="360" y="62">wk 5</text><text x="416" y="62">wk 6</text><text x="472" y="62">wk 7</text><text x="528" y="62">wk 8</text>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="end">
      <text x="98" y="91">dev-a</text><text x="98" y="123">dev-b</text><text x="98" y="155">dev-c</text><text x="98" y="187">dev-d</text>
      <text x="98" y="219">dev-e</text><text x="98" y="251">dev-f</text><text x="98" y="283">dev-g</text><text x="98" y="315">dev-h</text>
    </g>

    <rect x="106" y="68" width="452" height="260" rx="6" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <g stroke="#c9d1db" stroke-width="1">
      <path d="M164 68V328M220 68V328M276 68V328M332 68V328M388 68V328M444 68V328M500 68V328"/>
      <path d="M106 102H558M106 134H558M106 166H558M106 198H558M106 230H558M106 262H558M106 294H558"/>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="110" y="72" width="52" height="28" rx="4"/>
      <rect x="166" y="104" width="52" height="28" rx="4"/>
      <rect x="222" y="136" width="52" height="28" rx="4"/>
      <rect x="278" y="168" width="52" height="28" rx="4"/>
      <rect x="334" y="200" width="52" height="28" rx="4"/>
      <rect x="390" y="232" width="52" height="28" rx="4"/>
      <rect x="446" y="264" width="52" height="28" rx="4"/>
      <rect x="502" y="296" width="52" height="28" rx="4"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="136" y="91">P</text><text x="192" y="123">P</text><text x="248" y="155">P</text><text x="304" y="187">P</text>
      <text x="360" y="219">P</text><text x="416" y="251">P</text><text x="472" y="283">P</text><text x="528" y="315">P</text>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="110" y="200" width="52" height="28" rx="4"/>
      <rect x="166" y="232" width="52" height="28" rx="4"/>
      <rect x="222" y="264" width="52" height="28" rx="4"/>
      <rect x="278" y="296" width="52" height="28" rx="4"/>
      <rect x="334" y="72" width="52" height="28" rx="4"/>
      <rect x="390" y="104" width="52" height="28" rx="4"/>
      <rect x="446" y="136" width="52" height="28" rx="4"/>
      <rect x="502" y="168" width="52" height="28" rx="4"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="136" y="219">S</text><text x="192" y="251">S</text><text x="248" y="283">S</text><text x="304" y="315">S</text>
      <text x="360" y="91">S</text><text x="416" y="123">S</text><text x="472" y="155">S</text><text x="528" y="187">S</text>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <rect x="110" y="344" width="16" height="16" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="134" y="357">P = primary, answers pages</text>
      <rect x="330" y="344" width="16" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="354" y="357">S = secondary, backup</text>
    </g>

    <rect x="590" y="72" width="266" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="723" y="96" font-size="13" font-weight="700" fill="#294a2e">8 engineers, weekly shifts</text>
    <text x="723" y="116" font-size="11.5" fill="#294a2e">on call 2 weeks in 8</text>
    <text x="723" y="133" font-size="11.5" fill="#294a2e">= 25% of their time</text>

    <rect x="590" y="154" width="266" height="70" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="723" y="178" font-size="13" font-weight="700" fill="#6e2a24">5 engineers, same rotation</text>
    <text x="723" y="198" font-size="11.5" fill="#6e2a24">on call 2 weeks in 5</text>
    <text x="723" y="215" font-size="11.5" fill="#6e2a24">= 40%, over the 25% limit</text>

    <rect x="590" y="236" width="266" height="92" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="723" y="260" font-size="13" font-weight="700" fill="#263e5a">Google SRE book</text>
    <text x="723" y="280" font-size="11.5" fill="#263e5a">at most 25% of time on call;</text>
    <text x="723" y="297" font-size="11.5" fill="#263e5a">8 engineers for one site,</text>
    <text x="723" y="314" font-size="11.5" fill="#263e5a">6 per site for two sites</text>

    <text x="440" y="398" font-size="13" fill="#40566b">With two people on call per shift, a rotation needs at least eight people to stay at 25%.</text>
  </g>
</svg>
