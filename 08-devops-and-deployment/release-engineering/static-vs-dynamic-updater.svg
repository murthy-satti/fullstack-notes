<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="sdu-title sdu-desc">
  <title id="sdu-title">Static manifest compared with a dynamic update server</title>
  <desc id="sdu-desc">Left, a static manifest on a CDN: TaskFlow Desktop 1.9.0 on the stable channel fetches stable/latest.json from the CDN, which returns the same JSON to every install. The app itself decides whether the version is newer and whether it falls inside a staging percentage computed on the device, then downloads the installer and signature from the CDN. Strengths: cheap, cacheable, and very highly available, with nothing to operate beyond a file upload. Weaknesses: halting waits for the CDN cache to expire, the rollout logic lives in every installed client, and there is no targeting by tenant or customer. Right, a dynamic update server: the same app sends a check to an update service that evaluates rules on the channel, version range, tenant pin, whether the install bucket is below the rollout percentage, whether the release is halted, and blocked versions, then answers 200 with a manifest or 204 No Content; the installer and signature still come from the CDN at immutable URLs. Strengths: instant halts, cohorts, tenant pinning, forced updates below a floor, and a log of every check. Weaknesses: a service on every client's critical path that needs high availability and a static fallback. Static manifests are cheap and robust; a dynamic server buys control at the cost of running a service.</desc>
  <defs>
    <marker id="sdu-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sdu-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Static manifest on a CDN</text>
    <text x="464" y="28" font-size="13" font-weight="700" fill="#40566b">Dynamic update server</text>
    <path d="M440 16V352" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="44" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="36" y="64" font-size="13" font-weight="700" fill="#66400f">TaskFlow Desktop</text>
    <text x="36" y="82" font-size="11" fill="#66400f">1.9.0, stable channel</text>
    <rect x="254" y="44" width="164" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="266" y="64" font-size="13" font-weight="700" fill="#263e5a">CDN</text>
    <text x="266" y="82" font-size="11" fill="#263e5a">stable/latest.json</text>
    <path d="M174 62H252" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#sdu-arrow)"/>
    <path d="M254 80H176" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#sdu-arrow-ret)"/>
    <text x="214" y="56" font-size="11" fill="#36424e" text-anchor="middle">GET</text>
    <rect x="182" y="84" width="64" height="13" fill="#f5f7fb"/>
    <text x="214" y="94" font-size="10.5" fill="#36424e" text-anchor="middle">same for all</text>

    <rect x="24" y="114" width="394" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="36" y="134" font-size="11.5" fill="#66400f">the app decides: is it newer? is this install inside the</text>
    <text x="36" y="151" font-size="11.5" fill="#66400f">staging percentage (computed on the device)?</text>
    <path d="M99 94V112" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#sdu-arrow)"/>

    <rect x="254" y="184" width="164" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="266" y="202" font-size="12" font-weight="700" fill="#263e5a">CDN</text>
    <text x="266" y="219" font-size="11" fill="#263e5a">installer + signature</text>
    <path d="M336 164V182" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#sdu-arrow)"/>

    <g font-size="11.5">
      <text x="24" y="256" fill="#294a2e">+ cheap, cacheable, very highly available</text>
      <text x="24" y="274" fill="#294a2e">+ nothing to operate beyond a file upload</text>
      <text x="24" y="292" fill="#6e2a24">- a halt waits for the CDN cache to expire</text>
      <text x="24" y="310" fill="#6e2a24">- rollout logic lives in every installed client</text>
      <text x="24" y="328" fill="#6e2a24">- no targeting by tenant or customer</text>
    </g>

    <rect x="464" y="44" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="476" y="64" font-size="13" font-weight="700" fill="#66400f">TaskFlow Desktop</text>
    <text x="476" y="82" font-size="11" fill="#66400f">1.9.0, stable channel</text>
    <rect x="694" y="44" width="164" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="706" y="64" font-size="13" font-weight="700" fill="#463365">Update service</text>
    <text x="706" y="82" font-size="11" fill="#463365">evaluates rules per check</text>
    <path d="M614 62H692" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#sdu-arrow)"/>
    <path d="M694 80H616" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#sdu-arrow-ret)"/>
    <text x="654" y="56" font-size="11" fill="#36424e" text-anchor="middle">check</text>
    <rect x="622" y="84" width="64" height="13" fill="#f5f7fb"/>
    <text x="654" y="94" font-size="10.5" fill="#36424e" text-anchor="middle">per install</text>

    <rect x="464" y="114" width="394" height="62" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="476" y="134" font-size="11.5" fill="#463365">rules: channel, version range, tenant pin, install bucket</text>
    <text x="476" y="150" font-size="11.5" fill="#463365">below the rollout %, halted?, blocked versions</text>
    <text x="476" y="166" font-size="11.5" fill="#463365">answer: 200 with a manifest, or 204 No Content</text>
    <path d="M776 94V112" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#sdu-arrow)"/>

    <rect x="694" y="190" width="164" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="706" y="208" font-size="12" font-weight="700" fill="#263e5a">CDN</text>
    <text x="706" y="225" font-size="11" fill="#263e5a">immutable URLs</text>
    <path d="M776 176V188" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#sdu-arrow)"/>

    <g font-size="11.5">
      <text x="464" y="256" fill="#294a2e">+ instant halts, cohorts, tenant pinning</text>
      <text x="464" y="274" fill="#294a2e">+ forced updates below a floor; a log of every check</text>
      <text x="464" y="292" fill="#6e2a24">- a service on every client's critical path</text>
      <text x="464" y="310" fill="#6e2a24">- needs high availability and a static fallback</text>
    </g>

    <text x="440" y="382" font-size="13" fill="#40566b" text-anchor="middle">Static manifests are cheap and robust; a dynamic server buys control at the cost of running a service.</text>
  </g>
</svg>
