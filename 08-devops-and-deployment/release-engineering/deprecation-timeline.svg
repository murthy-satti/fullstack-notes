<svg xmlns="http://www.w3.org/2000/svg" width="860" height="364" viewBox="0 0 860 364" role="img" aria-labelledby="dpt-title dpt-desc">
  <title id="dpt-title">Deprecating and sunsetting API v1</title>
  <desc id="dpt-desc">A timeline for retiring TaskFlow API v1. On 2026-11-01 v2 is released. On 2026-12-01 v1 is deprecated: from then on every v1 response carries the header Deprecation: @1796083200, the header Sunset: Wed, 30 Jun 2027 23:59:59 GMT, and a Link header with rel deprecation pointing to the migration guide. On 2027-03-16 a one-hour brownout makes v1 fail on purpose, and on 2027-05-18 a one-day brownout does the same, so clients that ignored the notices find out before the deadline. On 2027-06-30 v1 is sunset and returns 410 Gone. A line chart underneath shows the share of API traffic still on v1 falling from 45 percent at the v2 release to 40 percent at deprecation, 12 percent at the first brownout, 3 percent at the second, and 0.4 percent at the sunset. Deprecation is only a signal; measured usage and brownouts make the sunset safe.</desc>
  <rect width="860" height="364" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Retiring TaskFlow API v1: announce, mark, measure, brown out, remove</text>

    <path d="M40 140H830" fill="none" stroke="#40566b" stroke-width="2"/>
    <g stroke-width="2">
      <circle cx="80" cy="140" r="7" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="230" cy="140" r="7" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="470" cy="140" r="7" fill="#fbe9e7" stroke="#b5524b"/>
      <circle cx="610" cy="140" r="7" fill="#fbe9e7" stroke="#b5524b"/>
      <circle cx="790" cy="140" r="7" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="80" y="104" fill="#294a2e">2026-11-01</text>
      <text x="230" y="104" fill="#463365">2026-12-01</text>
      <text x="470" y="104" fill="#6e2a24">2027-03-16</text>
      <text x="610" y="104" fill="#6e2a24">2027-05-18</text>
      <text x="790" y="104" fill="#263e5a">2027-06-30</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="80" y="121" fill="#294a2e">v2 released</text>
      <text x="230" y="121" fill="#463365">v1 deprecated</text>
      <text x="470" y="121" fill="#6e2a24">1-hour brownout</text>
      <text x="610" y="121" fill="#6e2a24">1-day brownout</text>
      <text x="790" y="121" fill="#263e5a">sunset: 410 Gone</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="236" y="70">headers on every v1 response from here on</text>
      <path d="M232 76V90" stroke="#8062a8" stroke-width="1.5"/>
    </g>

    <path d="M40 250H830" stroke="#c9d1db" stroke-width="1.5"/>
    <polyline points="80,178 230,186 470,231 610,245 790,249 830,250" fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <circle cx="80" cy="178" r="4"/>
      <circle cx="230" cy="186" r="4"/>
      <circle cx="470" cy="231" r="4"/>
      <circle cx="610" cy="245" r="4"/>
      <circle cx="790" cy="249" r="4"/>
    </g>
    <g font-size="11" font-weight="700" fill="#66400f">
      <text x="88" y="172">45%</text>
      <text x="238" y="180">40%</text>
      <text x="478" y="224">12%</text>
      <text x="618" y="238">3%</text>
      <text x="768" y="240">0.4%</text>
    </g>
    <text x="830" y="196" font-size="11.5" font-style="italic" fill="#66400f" text-anchor="end">share of API traffic still on v1</text>

    <rect x="24" y="266" width="812" height="60" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="36" y="285">Deprecation: @1796083200</text>
      <text x="260" y="285">Sunset: Wed, 30 Jun 2027 23:59:59 GMT</text>
      <text x="36" y="302">Link: &lt;https://docs.example.com/taskflow/v1-migration&gt;; rel="deprecation"</text>
      <text x="36" y="319">The Sunset date must not be earlier than the Deprecation date (RFC 9745).</text>
    </g>

    <text x="430" y="352" font-size="13" fill="#40566b" text-anchor="middle">Deprecation is only a signal; measured usage and brownouts make the sunset safe.</text>
  </g>
</svg>
