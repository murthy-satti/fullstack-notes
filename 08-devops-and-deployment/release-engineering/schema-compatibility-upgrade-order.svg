<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img" aria-labelledby="scu-title scu-desc">
  <title id="scu-title">Schema compatibility modes and upgrade order</title>
  <desc id="scu-desc">Three schema registry compatibility modes, side by side. BACKWARD, the registry default: consumers on the new schema can read data written with the previous one, so consumers are upgraded first and producers start writing the new version afterwards; allowed changes are deleting fields and adding fields only with default values. FORWARD: consumers on the previous schema can read data written with the new one, so producers are upgraded first and consumers afterwards, once data in the old format has expired; allowed changes are adding fields and deleting only optional fields. FULL: both guarantees hold between the new and the previous schema, so producers and consumers can be upgraded in any order; only optional fields may be added or deleted. A note says the TRANSITIVE variants check a new schema against every earlier version, not just the latest, which matters when consumers replay old events from a topic with long retention. Pick the mode per topic, and let the registry reject changes that would break a deployed reader.</desc>
  <defs>
    <marker id="scu-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="384" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Event schema compatibility modes decide which side deploys first</text>

    <g stroke-width="2">
      <rect x="16" y="42" width="272" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="304" y="42" width="272" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="592" y="42" width="272" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365" text-anchor="middle">
      <text x="152" y="61">BACKWARD</text>
      <text x="440" y="61">FORWARD</text>
      <text x="728" y="61">FULL</text>
    </g>
    <g font-size="11" fill="#463365" text-anchor="middle">
      <text x="152" y="78">the Schema Registry default</text>
      <text x="440" y="78">old readers, new data</text>
      <text x="728" y="78">both directions</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="24" y="108">consumers on the new schema can read</text>
      <text x="24" y="124">data written with the previous one</text>
      <text x="312" y="108">consumers on the previous schema can</text>
      <text x="312" y="124">read data written with the new one</text>
      <text x="600" y="108">both of the above hold between the</text>
      <text x="600" y="124">new and the previous schema</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="138" width="256" height="38" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="196" width="256" height="38" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="312" y="138" width="256" height="38" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="312" y="196" width="256" height="38" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="600" y="138" width="122" height="38" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="734" y="138" width="122" height="38" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="36" y="162" fill="#66400f">1. upgrade consumers</text>
      <text x="36" y="220" fill="#263e5a">2. then producers write v2</text>
      <text x="324" y="162" fill="#263e5a">1. upgrade producers</text>
      <text x="324" y="213" fill="#66400f">2. then consumers, once old-</text>
      <text x="324" y="228" fill="#66400f">format data has expired</text>
      <text x="661" y="162" fill="#263e5a" text-anchor="middle">producers</text>
      <text x="795" y="162" fill="#66400f" text-anchor="middle">consumers</text>
      <text x="612" y="206" fill="#36424e">upgrade in any order,</text>
      <text x="612" y="222" fill="#36424e">each side independently</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M152 176V194" marker-end="url(#scu-arrow)"/>
      <path d="M440 176V194" marker-end="url(#scu-arrow)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="24" y="256" font-weight="700">Allowed changes</text>
      <text x="24" y="273">delete fields; add fields only</text>
      <text x="24" y="289">with default values</text>
      <text x="312" y="256" font-weight="700">Allowed changes</text>
      <text x="312" y="273">add fields; delete only</text>
      <text x="312" y="289">optional fields</text>
      <text x="600" y="256" font-weight="700">Allowed changes</text>
      <text x="600" y="273">add or delete optional</text>
      <text x="600" y="289">fields only</text>
    </g>

    <rect x="16" y="304" width="848" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="28" y="322">The _TRANSITIVE variants check a new schema against every earlier version, not just the latest one:</text>
      <text x="28" y="338">use them when consumers may replay old events from a topic with long retention.</text>
    </g>

    <text x="440" y="372" font-size="13" fill="#40566b" text-anchor="middle">Pick the mode per topic, and let the registry reject changes that would break a deployed reader.</text>
  </g>
</svg>
