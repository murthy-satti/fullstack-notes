<svg xmlns="http://www.w3.org/2000/svg" width="860" height="425" viewBox="0 0 860 425" role="img" aria-labelledby="avm-title avm-desc">
  <title id="avm-title">Which artifact carries which version</title>
  <desc id="avm-desc">Two inputs, the Git commit 3f2a1c9 with tag v2.4.1 and CI run 873 of the build workflow, feed one CI step, scripts/version.mjs, which computes the version 2.4.1 and the full string 2.4.1+build.873.g3f2a1c exactly once. Arrows fan out from that step to four places that carry it: the container image, with tags 2.4.1 and sha-3f2a1c9 and the OCI version and revision labels; the running API, through GET /version, the X-App-Version response header, and the OpenTelemetry service.version attribute; the web bundle, through an __APP_VERSION__ build-time define and a /version.json file; and error tracking plus the deployment record, through the release name taskflow-api@2.4.1+build.873.g3f2a1c. A lower panel lists identifiers that are versioned on their own schedule and do not change on every app build: the API contract v2, the database schema at migration 0042, the event task.assigned v2, and store builds such as Android version code 30200 and iOS build 412.</desc>
  <defs>
    <marker id="avm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="425" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Compute the version once in CI, then stamp it into every artifact</text>

    <rect x="24" y="56" width="190" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="36" y="76" font-size="14" font-weight="700" fill="#66400f">Git</text>
    <text x="36" y="94" font-size="11.5" fill="#66400f">commit 3f2a1c9, tag v2.4.1</text>
    <rect x="24" y="124" width="190" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="36" y="144" font-size="14" font-weight="700" fill="#66400f">CI run</text>
    <text x="36" y="162" font-size="11.5" fill="#66400f">run 873 of build.yml</text>

    <rect x="246" y="80" width="230" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="258" y="101" font-size="14" font-weight="700" fill="#463365">scripts/version.mjs</text>
    <text x="258" y="120" font-size="11.5" fill="#463365">version 2.4.1</text>
    <text x="258" y="137" font-size="11.5" fill="#463365">full 2.4.1+build.873.g3f2a1c</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M214 81 244 100" marker-end="url(#avm-arrow)"/>
      <path d="M214 149 244 130" marker-end="url(#avm-arrow)"/>
      <path d="M476 104 518 73" marker-end="url(#avm-arrow)"/>
      <path d="M476 112 518 133" marker-end="url(#avm-arrow)"/>
      <path d="M476 122 518 193" marker-end="url(#avm-arrow)"/>
      <path d="M476 132 518 253" marker-end="url(#avm-arrow)"/>
    </g>

    <rect x="520" y="48" width="316" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="532" y="68" font-size="13" font-weight="700" fill="#263e5a">Container image</text>
    <text x="532" y="86" font-size="11" fill="#263e5a">tags 2.4.1 and sha-3f2a1c9; OCI version, revision labels</text>
    <rect x="520" y="108" width="316" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="532" y="128" font-size="13" font-weight="700" fill="#263e5a">Running API</text>
    <text x="532" y="146" font-size="11" fill="#263e5a">GET /version, X-App-Version header, service.version</text>
    <rect x="520" y="168" width="316" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="532" y="188" font-size="13" font-weight="700" fill="#66400f">Web bundle</text>
    <text x="532" y="206" font-size="11" fill="#66400f">__APP_VERSION__ build-time define and /version.json</text>
    <rect x="520" y="228" width="316" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="532" y="248" font-size="13" font-weight="700" fill="#463365">Error tracking and deploy record</text>
    <text x="532" y="266" font-size="11" fill="#463365">release taskflow-api@2.4.1+build.873.g3f2a1c</text>

    <path d="M16 296H844" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="318" font-size="13" font-weight="700" fill="#40566b">Versioned on their own schedule</text>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <rect x="24" y="330" width="130" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="89" y="349">API contract: v2</text>
      <rect x="164" y="330" width="172" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="250" y="349">schema: migration 0042</text>
      <rect x="346" y="330" width="180" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="436" y="349">event: task.assigned v2</text>
      <rect x="536" y="330" width="270" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="671" y="349">store builds: code 30200 / build 412</text>
    </g>
    <text x="24" y="382" font-size="11.5" fill="#36424e">These change when their own contract or package changes, not on every app build.</text>

    <text x="430" y="410" font-size="13" fill="#40566b" text-anchor="middle">Compute once, stamp everywhere; contracts, schemas, and store builds keep their own numbers.</text>
  </g>
</svg>
