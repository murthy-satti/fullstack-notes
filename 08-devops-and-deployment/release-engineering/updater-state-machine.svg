<svg xmlns="http://www.w3.org/2000/svg" width="880" height="386" viewBox="0 0 880 386" role="img" aria-labelledby="usm-title usm-desc">
  <title id="usm-title">A desktop updater as a state machine</title>
  <desc id="usm-desc">The updater starts idle. On launch or a timer it moves to checking. If the server answers 204 because there is no update, it goes back to idle. If an update is offered it moves to downloading; an interrupted download is resumed or retried with backoff. When the download completes it moves to verifying; if the signature or hash fails, the file is deleted, the failure is reported, and the app keeps version 1.9.0. If the signature is valid the update is ready and staged. On quit or restart it moves to installing; if the install fails, the old version stays and the error is reported. Once installed, the app is relaunched; if the new version crashes on its first run, the crash is reported and the server halts the rollout for everyone else. After a healthy start the app reports its new version and the result, and returns to idle. Failures before the install keep the old version; failures after it are reported so the rollout halts.</desc>
  <defs>
    <marker id="usm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="386" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">An updater as a state machine: fail safe before the install, report after it</text>

    <rect x="24" y="60" width="100" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <rect x="176" y="60" width="120" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="348" y="60" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="540" y="60" width="120" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="712" y="60" width="144" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="74" y="87" fill="#36424e">idle</text>
      <text x="236" y="87" fill="#263e5a">checking</text>
      <text x="418" y="87" fill="#263e5a">downloading</text>
      <text x="600" y="87" fill="#263e5a">verifying</text>
      <text x="784" y="87" fill="#463365">ready (staged)</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M124 82H174" marker-end="url(#usm-arrow)"/>
      <path d="M296 82H346" marker-end="url(#usm-arrow)"/>
      <path d="M488 82H538" marker-end="url(#usm-arrow)"/>
      <path d="M660 82H710" marker-end="url(#usm-arrow)"/>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="150" y="52">launch or timer</text>
      <text x="322" y="52">update offered</text>
      <text x="514" y="52">complete</text>
      <text x="686" y="52">signature OK</text>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-linecap="round">
      <path d="M236 104V126" marker-end="url(#usm-arrow)"/>
      <path d="M418 104V126" marker-end="url(#usm-arrow)"/>
      <path d="M600 104V126" marker-end="url(#usm-arrow)"/>
    </g>
    <rect x="150" y="128" width="170" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="162" y="146" font-size="11.5" font-weight="700" fill="#36424e">no update (204):</text>
    <text x="162" y="162" font-size="11" fill="#36424e">back to idle</text>
    <rect x="336" y="128" width="156" height="58" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="348" y="146" font-size="11.5" font-weight="700" fill="#36424e">interrupted:</text>
    <text x="348" y="162" font-size="11" fill="#36424e">resume the download</text>
    <text x="348" y="177" font-size="11" fill="#36424e">or retry with backoff</text>
    <rect x="508" y="128" width="144" height="62" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="520" y="146" font-size="11.5" font-weight="700" fill="#6e2a24">signature fails:</text>
    <text x="520" y="162" font-size="11" fill="#6e2a24">delete the file,</text>
    <text x="520" y="177" font-size="11" fill="#6e2a24">report, keep 1.9.0</text>

    <path d="M784 104V226" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#usm-arrow)"/>
    <text x="776" y="168" font-size="11" fill="#36424e" text-anchor="end">on quit or restart</text>

    <rect x="712" y="228" width="144" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="540" y="228" width="120" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="348" y="228" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="784" y="255" fill="#263e5a">installing</text>
      <text x="600" y="255" fill="#294a2e">relaunched</text>
      <text x="418" y="255" fill="#263e5a">report version</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M712 250H662" marker-end="url(#usm-arrow)"/>
      <path d="M540 250H490" marker-end="url(#usm-arrow)"/>
      <path d="M348 250H74V106" stroke-linejoin="round" marker-end="url(#usm-arrow)"/>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="686" y="222">installed</text>
      <text x="514" y="222">healthy start</text>
      <text x="211" y="242">version and result reported</text>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-linecap="round">
      <path d="M784 272V288" marker-end="url(#usm-arrow)"/>
      <path d="M600 272V288" marker-end="url(#usm-arrow)"/>
    </g>
    <rect x="712" y="290" width="144" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="724" y="308" font-size="11.5" font-weight="700" fill="#6e2a24">install fails:</text>
    <text x="724" y="324" font-size="11" fill="#6e2a24">the old version stays,</text>
    <text x="724" y="339" font-size="11" fill="#6e2a24">the error is reported</text>
    <rect x="516" y="290" width="152" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="528" y="308" font-size="11.5" font-weight="700" fill="#6e2a24">crash on first run:</text>
    <text x="528" y="324" font-size="11" fill="#6e2a24">report it; the server</text>
    <text x="528" y="339" font-size="11" fill="#6e2a24">halts the rollout</text>

    <text x="440" y="374" font-size="13" fill="#40566b" text-anchor="middle">Failures before the install keep the old version; failures after it are reported so the rollout halts.</text>
  </g>
</svg>
