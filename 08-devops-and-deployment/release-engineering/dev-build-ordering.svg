<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270" role="img" aria-labelledby="dbo-title dbo-desc">
  <title id="dbo-title">Where development builds sort in SemVer precedence</title>
  <desc id="dbo-desc">Six versions are placed on an axis from lower to higher SemVer precedence: 2.4.1-dev.5 built on Tuesday, 2.4.1 released on Monday, 2.4.2-dev.5 built on Tuesday, 2.4.2-dev.12 built on Thursday, 2.4.2-rc.1 built on Friday, and 2.4.2 released the next Monday. The first one is wrong: 2.4.1-dev.5 is a pre-release of 2.4.1, so it sorts before the release it was built after, and updaters treat it as older than 2.4.1. The right scheme names development builds as pre-releases of the next patch, so build order and precedence agree: dev.5 is lower than dev.12, which is lower than rc.1, which is lower than 2.4.2, because dev sorts before rc in ASCII order and 5 sorts before 12 as a number. Pre-release identifiers compare as numbers when numeric and in ASCII order otherwise.</desc>
  <defs>
    <marker id="dbo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="820" height="270" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Name dev builds after the next version, not the last one</text>

    <path d="M40 110H788" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#dbo-arrow)"/>
    <text x="790" y="132" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="end">higher precedence</text>
    <text x="40" y="132" font-size="11.5" font-style="italic" fill="#40566b">lower</text>

    <g stroke-width="2">
      <circle cx="110" cy="110" r="7" fill="#fbe9e7" stroke="#b5524b"/>
      <circle cx="230" cy="110" r="7" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="360" cy="110" r="7" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="480" cy="110" r="7" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="600" cy="110" r="7" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="720" cy="110" r="7" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="110" y="74" fill="#6e2a24">2.4.1-dev.5</text>
      <text x="230" y="74" fill="#294a2e">2.4.1</text>
      <text x="360" y="74" fill="#36424e">2.4.2-dev.5</text>
      <text x="480" y="74" fill="#36424e">2.4.2-dev.12</text>
      <text x="600" y="74" fill="#463365">2.4.2-rc.1</text>
      <text x="720" y="74" fill="#294a2e">2.4.2</text>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="110" y="90">built Tuesday</text>
      <text x="230" y="90">released Monday</text>
      <text x="360" y="90">built Tuesday</text>
      <text x="480" y="90">built Thursday</text>
      <text x="600" y="90">built Friday</text>
      <text x="720" y="90">released next Monday</text>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 118V146"/>
      <path d="M360 118V146"/>
      <path d="M480 118V146"/>
      <path d="M600 118V146"/>
      <path d="M720 118V146"/>
    </g>

    <rect x="24" y="146" width="306" height="76" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="36" y="166" font-size="13" font-weight="700" fill="#6e2a24">Wrong: 2.4.1-dev.5</text>
    <g font-size="11.5" fill="#6e2a24">
      <text x="36" y="184">a pre-release of 2.4.1, so it sorts</text>
      <text x="36" y="199">before the release it was built after;</text>
      <text x="36" y="214">updaters treat it as older than 2.4.1</text>
    </g>
    <rect x="346" y="146" width="450" height="76" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="358" y="166" font-size="13" font-weight="700" fill="#294a2e">Right: 2.4.2-dev.N</text>
    <g font-size="11.5" fill="#294a2e">
      <text x="358" y="184">dev builds are pre-releases of the next patch, so build order</text>
      <text x="358" y="199">and precedence agree: dev.5 &lt; dev.12 &lt; rc.1 &lt; 2.4.2</text>
      <text x="358" y="214">(dev sorts before rc in ASCII order; 5 before 12 as numbers)</text>
    </g>

    <text x="410" y="252" font-size="13" fill="#40566b" text-anchor="middle">Pre-release identifiers compare as numbers when numeric and in ASCII order otherwise.</text>
  </g>
</svg>
