<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="cwg-title cwg-desc">
  <title id="cwg-title">Code, configuration, and secrets: what goes where</title>
  <desc id="cwg-desc">A comparison of three kinds of values. Code is behavior that is the same everywhere, such as routes, business rules, and retry logic; it lives in Git and the build artifact, changes through a pull request and a deploy, and anyone with the repository can read it. Configuration is values that differ per environment, such as PORT, LOG_LEVEL, API URLs, and pool sizes; it lives in environment variables, ConfigMaps, or a config repository, changes through a config change and a restart, and operators can read it and it may appear in logs. Secrets are configuration that grants access, such as database passwords, API keys, and JWT signing keys; they live in a secret store and are injected at runtime, are changed by rotation by their owners only, and only the application and a few people may read them, never logs.</desc>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="160" y="30" width="220" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="270" y="57" font-size="14" font-weight="700" fill="#66400f">Code</text>
    <rect x="390" y="30" width="220" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="500" y="57" font-size="14" font-weight="700" fill="#263e5a">Configuration</text>
    <rect x="620" y="30" width="220" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="730" y="57" font-size="14" font-weight="700" fill="#6e2a24">Secrets</text>

    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="20" y="111">What it is</text>
      <text x="20" y="165">Examples</text>
      <text x="20" y="219">Where it lives</text>
      <text x="20" y="273">How it changes</text>
      <text x="20" y="327">Who may read it</text>
    </g>

    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="160" y="84" width="220" height="46" rx="8"/>
      <rect x="160" y="138" width="220" height="46" rx="8"/>
      <rect x="160" y="192" width="220" height="46" rx="8"/>
      <rect x="160" y="246" width="220" height="46" rx="8"/>
      <rect x="160" y="300" width="220" height="46" rx="8"/>
      <rect x="390" y="84" width="220" height="46" rx="8"/>
      <rect x="390" y="138" width="220" height="46" rx="8"/>
      <rect x="390" y="192" width="220" height="46" rx="8"/>
      <rect x="390" y="246" width="220" height="46" rx="8"/>
      <rect x="390" y="300" width="220" height="46" rx="8"/>
      <rect x="620" y="84" width="220" height="46" rx="8"/>
      <rect x="620" y="138" width="220" height="46" rx="8"/>
      <rect x="620" y="192" width="220" height="46" rx="8"/>
      <rect x="620" y="246" width="220" height="46" rx="8"/>
      <rect x="620" y="300" width="220" height="46" rx="8"/>
    </g>

    <g font-size="11.5" fill="#66400f">
      <text x="270" y="104">behavior that is the</text>
      <text x="270" y="120">same everywhere</text>
      <text x="270" y="158">routes, business rules,</text>
      <text x="270" y="174">retry logic</text>
      <text x="270" y="212">Git and the build</text>
      <text x="270" y="228">artifact</text>
      <text x="270" y="266">a pull request,</text>
      <text x="270" y="282">then a deploy</text>
      <text x="270" y="320">anyone with access</text>
      <text x="270" y="336">to the repository</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="500" y="104">values that differ</text>
      <text x="500" y="120">per environment</text>
      <text x="500" y="158">PORT, LOG_LEVEL,</text>
      <text x="500" y="174">API URLs, pool sizes</text>
      <text x="500" y="212">env vars, ConfigMaps,</text>
      <text x="500" y="228">a config repository</text>
      <text x="500" y="266">a reviewed config change,</text>
      <text x="500" y="282">then a restart or reload</text>
      <text x="500" y="320">operators; fine to log</text>
      <text x="500" y="336">at startup</text>
    </g>
    <g font-size="11.5" fill="#6e2a24">
      <text x="730" y="104">configuration that</text>
      <text x="730" y="120">grants access</text>
      <text x="730" y="158">DB passwords, API keys,</text>
      <text x="730" y="174">JWT signing keys</text>
      <text x="730" y="212">a secret store, injected</text>
      <text x="730" y="228">at deploy or start</text>
      <text x="730" y="266">rotation by owners,</text>
      <text x="730" y="282">with an overlap window</text>
      <text x="730" y="320">the app and a few people;</text>
      <text x="730" y="336">never logs or errors</text>
    </g>

    <text x="430" y="372" font-size="13" fill="#40566b">Litmus test: could the code be published today without exposing a single credential?</text>
  </g>
</svg>
