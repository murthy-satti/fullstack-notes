<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="cvf-title cvf-desc">
  <title id="cvf-title">Loading and validating configuration at startup</title>
  <desc id="cvf-desc">When the process starts, the config module reads process.env, where every value is a string. It coerces types, for example the string 3000 into the number 3000 and the string true into a boolean, and a comma-separated list into an array. It then validates required keys, ranges, formats such as URLs, and cross-field rules. If everything is valid, it freezes the config, logs a summary without secrets, and the server starts. If not, it reports every problem by variable name, never by value, and exits with code 1; in a rolling deploy the new instances never become ready, so the deploy halts and the old version keeps serving.</desc>
  <defs>
    <marker id="cvf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="60" width="110" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="75" y="86" font-size="14" font-weight="700" fill="#66400f">Process</text>
    <text x="75" y="104" font-size="11.5" fill="#66400f">starts</text>
    <rect x="150" y="60" width="110" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="205" y="86" font-size="14" font-weight="700" fill="#263e5a">Read env</text>
    <text x="205" y="104" font-size="11.5" fill="#263e5a">all strings</text>
    <rect x="280" y="60" width="110" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="335" y="86" font-size="14" font-weight="700" fill="#463365">Coerce</text>
    <text x="335" y="104" font-size="11.5" fill="#463365">types</text>
    <rect x="410" y="60" width="110" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="465" y="86" font-size="14" font-weight="700" fill="#463365">Validate</text>
    <text x="465" y="104" font-size="11.5" fill="#463365">every value</text>
    <path d="M600 45 645 90 600 135 555 90z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="600" y="94" font-size="12" font-weight="700" fill="#463365">valid?</text>
    <rect x="680" y="60" width="160" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="760" y="84" font-size="14" font-weight="700" fill="#294a2e">Freeze, start</text>
    <text x="760" y="102" font-size="11.5" fill="#294a2e">log summary, no secrets</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M130 90H148" marker-end="url(#cvf-arrow)"/>
      <path d="M260 90H278" marker-end="url(#cvf-arrow)"/>
      <path d="M390 90H408" marker-end="url(#cvf-arrow)"/>
      <path d="M520 90H553" marker-end="url(#cvf-arrow)"/>
      <path d="M645 90H678" marker-end="url(#cvf-arrow)"/>
      <path d="M600 135V198" marker-end="url(#cvf-arrow)"/>
      <path d="M680 225H698" marker-end="url(#cvf-arrow)"/>
    </g>
    <text x="662" y="82" font-size="11" font-weight="700" fill="#294a2e">yes</text>
    <text x="612" y="170" font-size="11" font-weight="700" fill="#6e2a24" text-anchor="start">no</text>

    <g font-size="11" font-style="italic" fill="#463365">
      <text x="335" y="142">"3000" to 3000</text>
      <text x="335" y="158">"true" to true</text>
      <text x="335" y="174">"a,b" to [a, b]</text>
      <text x="465" y="142">required keys</text>
      <text x="465" y="158">ranges, URLs</text>
      <text x="465" y="174">cross-field rules</text>
    </g>

    <rect x="520" y="200" width="160" height="54" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="600" y="223" font-size="14" font-weight="700" fill="#6e2a24">Report, exit 1</text>
    <text x="600" y="241" font-size="11.5" fill="#6e2a24">names only, never values</text>
    <rect x="700" y="200" width="140" height="54" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="770" y="223" font-size="13" font-weight="700" fill="#36424e">Deploy halts</text>
    <text x="770" y="241" font-size="11.5" fill="#36424e">old version serves</text>

    <text x="430" y="306" font-size="13" fill="#40566b">Fail at startup with a clear message, not on the first request that needs the missing value.</text>
  </g>
</svg>
