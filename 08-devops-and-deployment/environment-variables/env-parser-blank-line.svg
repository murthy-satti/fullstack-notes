<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="epb-title epb-desc">
  <title id="epb-title">A whitespace-only line breaks one env parser but not others</title>
  <desc id="epb-desc">Before: an env file has APP_ENV=staging on line 1, three spaces on line 2, MONGODB_URI on line 3, and PORT=3000 on line 4. The dotenv package version 18 and Bun 1.4 skip line 2 and set all three keys. Node 22.12 with --env-file joins line 2 with line 3 into one broken key name, so MONGODB_URI is missing, while APP_ENV and PORT are set. After: line 2 is truly empty, and every loader sets all three keys. Startup validation would have reported MONGODB_URI as missing either way. To debug, print each expected key name and whether it is set, never the value, and inspect the file with cat -A or a hex dump to reveal spaces, tabs, CRLF line endings, a byte order mark, or UTF-16 encoding.</desc>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="32" font-size="13" font-weight="700" fill="#6e2a24">Before: line 2 holds three spaces</text>
    <text x="440" y="32" font-size="13" font-weight="700" fill="#294a2e">After: line 2 is truly empty</text>

    <rect x="20" y="44" width="400" height="104" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="24" y="76" width="392" height="20" fill="#fbe9e7"/>
    <g font-size="12" fill="#36424e">
      <text x="34" y="66" fill="#8a96a3">1</text>
      <text x="54" y="66">APP_ENV=staging</text>
      <text x="34" y="90" fill="#8a96a3">2</text>
      <text x="54" y="90" fill="#b5524b" font-weight="700">· · ·</text>
      <text x="96" y="90" font-size="11" font-style="italic" fill="#6e2a24">(three spaces)</text>
      <text x="34" y="114" fill="#8a96a3">3</text>
      <text x="54" y="114">MONGODB_URI=mongodb://db:27017/taskflow</text>
      <text x="34" y="138" fill="#8a96a3">4</text>
      <text x="54" y="138">PORT=3000</text>
    </g>

    <rect x="440" y="44" width="400" height="104" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="12" fill="#36424e">
      <text x="454" y="66" fill="#8a96a3">1</text>
      <text x="474" y="66">APP_ENV=staging</text>
      <text x="454" y="90" fill="#8a96a3">2</text>
      <text x="454" y="114" fill="#8a96a3">3</text>
      <text x="474" y="114">MONGODB_URI=mongodb://db:27017/taskflow</text>
      <text x="454" y="138" fill="#8a96a3">4</text>
      <text x="474" y="138">PORT=3000</text>
    </g>

    <rect x="20" y="162" width="400" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="220" y="181" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="middle">dotenv 18 and Bun 1.4: skip line 2</text>
    <text x="220" y="198" font-size="11.5" fill="#294a2e" text-anchor="middle">APP_ENV, MONGODB_URI, PORT all set</text>
    <rect x="20" y="214" width="400" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="220" y="233" font-size="12.5" font-weight="700" fill="#6e2a24" text-anchor="middle">Node 22.12 --env-file: joins lines 2 and 3</text>
    <text x="220" y="250" font-size="11.5" fill="#6e2a24" text-anchor="middle">one broken key name; MONGODB_URI is missing</text>

    <rect x="440" y="162" width="400" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="640" y="181" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="middle">Every loader agrees</text>
    <text x="640" y="198" font-size="11.5" fill="#294a2e" text-anchor="middle">APP_ENV, MONGODB_URI, PORT all set</text>
    <rect x="440" y="214" width="400" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="640" y="233" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="middle">Startup validation catches it either way</text>
    <text x="640" y="250" font-size="11.5" fill="#263e5a" text-anchor="middle">"MONGODB_URI: required" instead of a silent default</text>

    <rect x="20" y="278" width="820" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="430" y="300" font-size="12" font-weight="700" fill="#463365" text-anchor="middle">Debug: print each expected key and whether it is set, never its value.</text>
    <text x="430" y="320" font-size="11.5" fill="#463365" text-anchor="middle">Inspect the file with cat -A or a hex dump: spaces, tabs, CRLF, a byte order mark, UTF-16.</text>

    <text x="430" y="368" font-size="13" fill="#40566b" text-anchor="middle">Parsers disagree on edge cases; keep env files plain, and validate what the process actually received.</text>
  </g>
</svg>
