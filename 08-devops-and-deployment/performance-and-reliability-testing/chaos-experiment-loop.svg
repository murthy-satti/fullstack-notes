<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="cel-title cel-desc">
  <title id="cel-title">The chaos experiment loop</title>
  <desc id="cel-desc">A chaos experiment runs in seven steps. One: define steady state as a metric users feel, such as p99 latency and error rate. Two: state a hypothesis: if X fails, steady state holds because of Y. Three: limit the blast radius to one pod or one percent of traffic and have stop conditions ready. Four: inject the fault, such as killing, delaying, dropping, stressing, or exhausting something. Five: observe, comparing with the control group and the steady state. If a stop condition is hit, halt, restore, and investigate. Six: learn and fix, with a blameless review that fixes the weakness. Seven: automate the experiment as a regression test, then widen the scope, and return to step one.</desc>
  <defs>
    <marker id="cel-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cel-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="cel-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One chaos experiment, from steady state to an automated regression test</text>

    <g stroke-width="2">
      <rect x="24" y="56" width="190" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="238" y="56" width="190" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="452" y="56" width="190" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="666" y="56" width="190" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="666" y="210" width="190" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="452" y="210" width="190" height="70" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="238" y="210" width="190" height="70" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="666" y="316" width="190" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g fill="#263e5a">
      <text x="119" y="80" font-size="13" font-weight="700">1. Steady state</text>
      <text x="119" y="100" font-size="11.5">a metric users feel,</text>
      <text x="119" y="116" font-size="11.5">such as p99 and errors</text>
      <text x="333" y="80" font-size="13" font-weight="700">2. Hypothesis</text>
      <text x="333" y="100" font-size="11.5">if X fails, steady state</text>
      <text x="333" y="116" font-size="11.5">holds because of Y</text>
      <text x="547" y="80" font-size="13" font-weight="700">3. Limit blast radius</text>
      <text x="547" y="100" font-size="11.5">one pod, 1% of traffic,</text>
      <text x="547" y="116" font-size="11.5">stop conditions ready</text>
    </g>
    <g fill="#66400f">
      <text x="761" y="80" font-size="13" font-weight="700">4. Inject the fault</text>
      <text x="761" y="100" font-size="11.5">kill, delay, drop,</text>
      <text x="761" y="116" font-size="11.5">stress, exhaust</text>
    </g>
    <g fill="#463365">
      <text x="761" y="234" font-size="13" font-weight="700">5. Observe</text>
      <text x="761" y="254" font-size="11.5">compare with control</text>
      <text x="761" y="270" font-size="11.5">and steady state</text>
    </g>
    <g fill="#294a2e">
      <text x="547" y="234" font-size="13" font-weight="700">6. Learn and fix</text>
      <text x="547" y="254" font-size="11.5">blameless review,</text>
      <text x="547" y="270" font-size="11.5">fix the weakness</text>
      <text x="333" y="234" font-size="13" font-weight="700">7. Automate it</text>
      <text x="333" y="254" font-size="11.5">re-run as a regression,</text>
      <text x="333" y="270" font-size="11.5">then widen the scope</text>
    </g>
    <text x="761" y="339" font-size="13" font-weight="700" fill="#6e2a24">Stop condition hit</text>
    <text x="761" y="358" font-size="11.5" fill="#6e2a24">halt, restore, learn</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M214 91H236" marker-end="url(#cel-arrow)"/>
      <path d="M428 91H450" marker-end="url(#cel-arrow)"/>
      <path d="M642 91H664" marker-end="url(#cel-arrow)"/>
      <path d="M761 126V208" marker-end="url(#cel-arrow)"/>
      <path d="M666 245H644" marker-end="url(#cel-arrow)"/>
      <path d="M452 245H430" marker-end="url(#cel-arrow)"/>
    </g>
    <path d="M761 280V314" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cel-arrow-red)"/>
    <path d="M666 344H547V282" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#cel-arrow-red)"/>
    <path d="M238 245H119V128" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#cel-arrow-ret)"/>
    <rect x="70" y="176" width="98" height="16" fill="#f5f7fb"/>
    <text x="119" y="188" font-size="11.5" font-style="italic" fill="#40566b">next experiment</text>
    <rect x="770" y="288" width="76" height="16" fill="#f5f7fb"/>
    <text x="808" y="300" font-size="11.5" font-style="italic" fill="#6e2a24">if needed</text>

    <text x="440" y="402" font-size="13" fill="#40566b">Each experiment tries to disprove a hypothesis about steady state, inside a blast radius you can stop.</text>
  </g>
</svg>
