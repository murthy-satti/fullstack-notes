<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" role="img" aria-labelledby="gdt-title gdt-desc">
  <title id="gdt-title">A game day from planning to follow-up</title>
  <desc id="gdt-desc">A timeline in three phases. Before: weeks ahead, write the scenario and hypothesis, assign roles, notify stakeholders, and check access. During the game day: at T minus 30 minutes, a briefing covers goals, roles, and abort rules; at T zero, the baseline confirms steady state is normal; at T plus 5 minutes, the fault is injected; from T plus 5 to T plus 45, the team detects, responds, and notes every timestamp; at T plus 50, the fault ends and steady state is confirmed. After: at T plus 60, a hot debrief asks what surprised people, and within a week a written review produces action items and runbook updates. Four roles take part: the facilitator runs the plan and calls the abort, operators respond exactly as on call, the scribe timestamps everything, and the communications lead keeps stakeholders informed.</desc>
  <rect width="880" height="344" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b">A game day, from planning to follow-up</text>

    <rect x="40" y="140" width="95" height="20" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="145" y="140" width="555" height="20" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="710" y="140" width="146" height="20" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <g font-size="11" font-weight="700" text-anchor="middle">
      <text x="110" y="154" fill="#36424e">before</text>
      <text x="355" y="154" fill="#66400f">game day</text>
      <text x="800" y="154" fill="#294a2e">after</text>
    </g>
    <g fill="#f5f7fb" stroke="#40566b" stroke-width="2">
      <circle cx="70" cy="150" r="6"/>
      <circle cx="190" cy="150" r="6"/>
      <circle cx="300" cy="150" r="6"/>
      <circle cx="410" cy="150" r="6"/>
      <circle cx="520" cy="150" r="6"/>
      <circle cx="620" cy="150" r="6"/>
      <circle cx="740" cy="150" r="6"/>
      <circle cx="830" cy="150" r="6"/>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M70 124V142M300 124V142M520 124V142M740 124V142"/>
      <path d="M190 158V172M410 158V172M620 158V172M830 158V172"/>
    </g>

    <g fill="#36424e">
      <text x="40" y="86" font-size="12" font-weight="700">Weeks before</text>
      <text x="40" y="102" font-size="11.5">scenario and hypothesis</text>
      <text x="40" y="118" font-size="11.5">roles, notice, access</text>
      <text x="300" y="102" font-size="12" font-weight="700" text-anchor="middle">T0: baseline</text>
      <text x="300" y="118" font-size="11.5" text-anchor="middle">steady state is normal</text>
      <text x="520" y="86" font-size="12" font-weight="700" text-anchor="middle">T+5 to T+45</text>
      <text x="520" y="102" font-size="11.5" text-anchor="middle">detect, respond, and</text>
      <text x="520" y="118" font-size="11.5" text-anchor="middle">note every timestamp</text>
      <text x="740" y="102" font-size="12" font-weight="700" text-anchor="middle">T+60: hot debrief</text>
      <text x="740" y="118" font-size="11.5" text-anchor="middle">what surprised us?</text>
      <text x="190" y="188" font-size="12" font-weight="700" text-anchor="middle">T-30 min: briefing</text>
      <text x="190" y="204" font-size="11.5" text-anchor="middle">goals, roles, abort rules</text>
      <text x="410" y="188" font-size="12" font-weight="700" text-anchor="middle">T+5: inject</text>
      <text x="410" y="204" font-size="11.5" text-anchor="middle">the fault begins</text>
      <text x="620" y="188" font-size="12" font-weight="700" text-anchor="middle">T+50: restore</text>
      <text x="620" y="204" font-size="11.5" text-anchor="middle">end the fault, confirm</text>
      <text x="620" y="220" font-size="11.5" text-anchor="middle">steady state</text>
      <text x="856" y="188" font-size="12" font-weight="700" text-anchor="end">Within a week</text>
      <text x="856" y="204" font-size="11.5" text-anchor="end">written review,</text>
      <text x="856" y="220" font-size="11.5" text-anchor="end">action items, runbooks</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="244" width="196" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="236" y="244" width="196" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="448" y="244" width="196" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="660" y="244" width="196" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g text-anchor="middle">
      <text x="122" y="264" font-size="12.5" font-weight="700" fill="#66400f">Facilitator</text>
      <text x="122" y="281" font-size="11.5" fill="#66400f">runs the plan, calls abort</text>
      <text x="334" y="264" font-size="12.5" font-weight="700" fill="#263e5a">Operators</text>
      <text x="334" y="281" font-size="11.5" fill="#263e5a">respond as when on call</text>
      <text x="546" y="264" font-size="12.5" font-weight="700" fill="#463365">Scribe</text>
      <text x="546" y="281" font-size="11.5" fill="#463365">timestamps everything</text>
      <text x="758" y="264" font-size="12.5" font-weight="700" fill="#294a2e">Comms lead</text>
      <text x="758" y="281" font-size="11.5" fill="#294a2e">keeps stakeholders informed</text>
    </g>

    <text x="440" y="324" font-size="13" fill="#40566b" text-anchor="middle">Rehearse the failure with the people who would handle it, then turn every surprise into an action.</text>
  </g>
</svg>
