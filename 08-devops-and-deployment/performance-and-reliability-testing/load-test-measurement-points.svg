<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="lmp-title lmp-desc">
  <title id="lmp-title">Where to measure during a load test</title>
  <desc id="lmp-desc">Requests flow from the load generator, k6 on one or more hosts, to the load balancer (an ALB, Nginx, or an ingress), to all TaskFlow API instances, and on to MongoDB and other dependencies. Above each component is what to watch: for the load generator, CPU below about 80 percent, dropped iterations equal to zero, and an achieved rate equal to the target; for the load balancer, request count and 5xx responses, latency at the balancer, and rejected connections; for the API, RED metrics per route, event-loop delay and CPU, and heap, garbage collection, and connection pool waiters; for MongoDB, CPU, disk and cache hits, slow queries, and connections and locks. A bracket under the load balancer, API, and database shows that k6 sees all of this as end-to-end latency, errors, and throughput. A second bracket under the API and database shows that the application sees RED per route and USE per resource. If client latency is far above server latency, requests are queueing before the application, or the generator is saturated.</desc>
  <defs>
    <marker id="lmp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b">Where to measure during a load test</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="24" y="48" width="190" height="72" rx="8"/>
      <rect x="238" y="48" width="190" height="72" rx="8"/>
      <rect x="452" y="48" width="190" height="72" rx="8"/>
      <rect x="666" y="48" width="190" height="72" rx="8"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="36" y="70">CPU below ~80%</text>
      <text x="36" y="88">dropped_iterations = 0</text>
      <text x="36" y="106">achieved rate = target</text>
      <text x="250" y="70">request count and 5xx</text>
      <text x="250" y="88">latency at the balancer</text>
      <text x="250" y="106">rejected connections</text>
      <text x="464" y="70">RED per route</text>
      <text x="464" y="88">event-loop delay, CPU</text>
      <text x="464" y="106">heap, GC, pool waiters</text>
      <text x="678" y="70">CPU, disk, cache hits</text>
      <text x="678" y="88">slow queries</text>
      <text x="678" y="106">connections, locks</text>
    </g>
    <path d="M119 120V148M333 120V148M547 120V148M761 120V148" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="24" y="150" width="190" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="119" y="176" font-size="14" font-weight="700" fill="#66400f" text-anchor="middle">Load generator</text>
    <text x="119" y="196" font-size="11.5" fill="#66400f" text-anchor="middle">k6 on one or more hosts</text>
    <rect x="238" y="150" width="190" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="333" y="176" font-size="14" font-weight="700" fill="#263e5a" text-anchor="middle">Load balancer</text>
    <text x="333" y="196" font-size="11.5" fill="#263e5a" text-anchor="middle">ALB, Nginx, or ingress</text>
    <rect x="452" y="150" width="190" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="547" y="176" font-size="14" font-weight="700" fill="#263e5a" text-anchor="middle">TaskFlow API</text>
    <text x="547" y="196" font-size="11.5" fill="#263e5a" text-anchor="middle">all instances</text>
    <rect x="666" y="150" width="190" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="761" y="176" font-size="14" font-weight="700" fill="#263e5a" text-anchor="middle">MongoDB</text>
    <text x="761" y="196" font-size="11.5" fill="#263e5a" text-anchor="middle">and other dependencies</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M214 180H236" marker-end="url(#lmp-arrow)"/>
      <path d="M428 180H450" marker-end="url(#lmp-arrow)"/>
      <path d="M642 180H664" marker-end="url(#lmp-arrow)"/>
    </g>

    <path d="M238 226V234H856V226" fill="none" stroke="#bd7a20" stroke-width="2"/>
    <text x="547" y="252" font-size="11.5" fill="#66400f" text-anchor="middle">k6 sees all of this: end-to-end latency, errors, throughput</text>
    <path d="M452 266V274H856V266" fill="none" stroke="#4774aa" stroke-width="2"/>
    <text x="654" y="292" font-size="11.5" fill="#263e5a" text-anchor="middle">the app sees this: RED per route, USE per resource</text>
    <text x="440" y="326" font-size="11.5" fill="#6e2a24" text-anchor="middle">Client latency far above server latency? Requests are queueing before the app, or the generator is saturated.</text>

    <text x="440" y="358" font-size="13" fill="#40566b" text-anchor="middle">Read both sides: the load tool shows what users felt; server metrics show why.</text>
  </g>
</svg>
