<svg xmlns="http://www.w3.org/2000/svg" width="880" height="348" viewBox="0 0 880 348" role="img" aria-labelledby="cpq-title cpq-desc">
  <title id="cpq-title">Little's law inside a database connection pool</title>
  <desc id="cpq-desc">One API instance receives 120 requests per second and each request runs 2 queries, so 240 queries per second need a connection. Requests wait in the driver's wait queue, which is unbounded by default and grows every second, for one of the 20 connections of the pool (maxPoolSize 20), of which 19 are busy. The connections run queries on MongoDB, whose CPU is at 92 percent and whose queries take about 80 ms because of an unindexed sort. Before the fix, busy connections equal 240 queries per second times 0.080 seconds, which is 19.2: the pool of 20 is full, requests queue for a connection, and a bigger pool only adds load to a database at 92 percent CPU. After an index that follows the equality, sort, range guideline, busy connections equal 240 queries per second times 0.002 seconds, which is 0.48: the pool is almost idle, database CPU drops, and the knee moves to a higher rate where the next bottleneck must be found.</desc>
  <defs>
    <marker id="cpq-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="348" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Little's law inside the connection pool of one API instance</text>

    <rect x="24" y="48" width="150" height="100" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="70" font-size="13" font-weight="700" fill="#66400f">Requests</text>
    <text x="99" y="92" font-size="11.5" fill="#66400f">120/s per instance</text>
    <text x="99" y="110" font-size="11.5" fill="#66400f">× 2 queries each</text>
    <text x="99" y="128" font-size="11.5" fill="#66400f">= 240 queries/s</text>

    <rect x="214" y="48" width="170" height="100" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="299" y="70" font-size="13" font-weight="700" fill="#463365">Wait queue</text>
    <g fill="#e2d6f5" stroke="#8062a8" stroke-width="1.5">
      <rect x="226" y="82" width="22" height="18" rx="3"/>
      <rect x="254" y="82" width="22" height="18" rx="3"/>
      <rect x="282" y="82" width="22" height="18" rx="3"/>
      <rect x="310" y="82" width="22" height="18" rx="3"/>
      <rect x="338" y="82" width="22" height="18" rx="3"/>
    </g>
    <text x="299" y="122" font-size="11.5" fill="#463365">grows every second</text>
    <text x="299" y="139" font-size="11.5" fill="#463365">unbounded by default</text>

    <rect x="424" y="48" width="240" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="544" y="70" font-size="13" font-weight="700" fill="#263e5a">Pool: maxPoolSize 20</text>
    <g fill="#4774aa" stroke="#263e5a" stroke-width="1">
      <rect x="436" y="80" width="18" height="18" rx="3"/>
      <rect x="458" y="80" width="18" height="18" rx="3"/>
      <rect x="480" y="80" width="18" height="18" rx="3"/>
      <rect x="502" y="80" width="18" height="18" rx="3"/>
      <rect x="524" y="80" width="18" height="18" rx="3"/>
      <rect x="546" y="80" width="18" height="18" rx="3"/>
      <rect x="568" y="80" width="18" height="18" rx="3"/>
      <rect x="590" y="80" width="18" height="18" rx="3"/>
      <rect x="612" y="80" width="18" height="18" rx="3"/>
      <rect x="634" y="80" width="18" height="18" rx="3"/>
      <rect x="436" y="102" width="18" height="18" rx="3"/>
      <rect x="458" y="102" width="18" height="18" rx="3"/>
      <rect x="480" y="102" width="18" height="18" rx="3"/>
      <rect x="502" y="102" width="18" height="18" rx="3"/>
      <rect x="524" y="102" width="18" height="18" rx="3"/>
      <rect x="546" y="102" width="18" height="18" rx="3"/>
      <rect x="568" y="102" width="18" height="18" rx="3"/>
      <rect x="590" y="102" width="18" height="18" rx="3"/>
      <rect x="612" y="102" width="18" height="18" rx="3"/>
    </g>
    <rect x="634" y="102" width="18" height="18" rx="3" fill="#f5f7fb" stroke="#4774aa" stroke-width="1"/>
    <text x="544" y="139" font-size="11.5" fill="#263e5a">19 busy, 1 free</text>

    <rect x="704" y="48" width="152" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="780" y="70" font-size="13" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="780" y="92" font-size="11.5" fill="#263e5a">CPU 92%</text>
    <text x="780" y="110" font-size="11.5" fill="#263e5a">queries ~80 ms</text>
    <text x="780" y="128" font-size="11.5" fill="#263e5a">unindexed sort</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 98H212" marker-end="url(#cpq-arrow)"/>
      <path d="M384 98H422" marker-end="url(#cpq-arrow)"/>
      <path d="M664 98H702" marker-end="url(#cpq-arrow)"/>
    </g>

    <rect x="24" y="172" width="404" height="120" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="40" y="198" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Before: an unindexed sort</text>
    <g fill="#6e2a24" text-anchor="start">
      <text x="40" y="222" font-size="12">busy connections = 240 queries/s × 0.080 s = 19.2</text>
      <text x="40" y="244" font-size="11.5">the pool of 20 is full: requests queue for a connection</text>
      <text x="40" y="266" font-size="11.5">a bigger pool only adds load to a database at 92% CPU</text>
    </g>
    <rect x="452" y="172" width="404" height="120" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="468" y="198" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">After an ESR index</text>
    <g fill="#294a2e" text-anchor="start">
      <text x="468" y="222" font-size="12">busy connections = 240 queries/s × 0.002 s = 0.48</text>
      <text x="468" y="244" font-size="11.5">the pool is almost idle and database CPU drops</text>
      <text x="468" y="266" font-size="11.5">the knee moves to a higher rate: find the next one</text>
    </g>

    <text x="440" y="326" font-size="13" fill="#40566b">A full pool is usually a symptom: fix the slow query before you raise maxPoolSize.</text>
  </g>
</svg>
