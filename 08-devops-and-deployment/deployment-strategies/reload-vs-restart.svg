<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="rvr-title rvr-desc">
  <title id="rvr-title">pm2 restart compared with pm2 reload in cluster mode</title>
  <desc id="rvr-desc">Left, pm2 restart: all four workers w0 to w3 run version 1, all stop at the same moment, nothing listens for a gap while version 2 starts, and requests in that gap fail. Right, pm2 reload in cluster mode: for each worker in turn, a new version 2 worker starts, becomes ready, and only then is the old version 1 worker stopped, so every worker slot keeps serving throughout. In fork mode with a single process, reload falls back to a restart.</desc>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="36" font-size="13" font-weight="700" fill="#6e2a24">pm2 restart: all workers at once</text>
    <text x="450" y="36" font-size="13" font-weight="700" fill="#294a2e">pm2 reload (cluster): one worker at a time</text>
    <path d="M430 20V286" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="30" y="85">w0</text>
      <text x="30" y="125">w1</text>
      <text x="30" y="165">w2</text>
      <text x="30" y="205">w3</text>
      <text x="450" y="85">w0</text>
      <text x="450" y="125">w1</text>
      <text x="450" y="165">w2</text>
      <text x="450" y="205">w3</text>
    </g>

    <g stroke-width="1.5">
      <rect x="60" y="70" width="100" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="110" width="100" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="150" width="100" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="190" width="100" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="280" y="70" width="120" height="22" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="280" y="110" width="120" height="22" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="280" y="150" width="120" height="22" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="280" y="190" width="120" height="22" rx="3" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <rect x="164" y="62" width="112" height="158" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="220" y="136" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="middle">nothing</text>
    <text x="220" y="153" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="middle">listening</text>
    <g font-size="11.5" font-weight="700" text-anchor="middle">
      <text x="110" y="85" fill="#263e5a">v1</text>
      <text x="340" y="85" fill="#294a2e">v2</text>
    </g>

    <g stroke-width="1.5">
      <rect x="480" y="68" width="50" height="12" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="500" y="84" width="320" height="12" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="480" y="108" width="125" height="12" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="575" y="124" width="245" height="12" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="480" y="148" width="200" height="12" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="650" y="164" width="170" height="12" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="480" y="188" width="275" height="12" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="725" y="204" width="95" height="12" rx="3" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M530 62V100"/>
      <path d="M605 102V140"/>
      <path d="M680 142V180"/>
      <path d="M755 182V220"/>
    </g>
    <text x="536" y="62" font-size="11" font-style="italic" fill="#40566b">new ready, old stops</text>

    <path d="M60 236H400" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <path d="M480 236H820" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <text x="400" y="252" font-size="11" fill="#40566b" text-anchor="end">time</text>
    <text x="820" y="252" font-size="11" fill="#40566b" text-anchor="end">time</text>

    <text x="230" y="274" font-size="11.5" fill="#6e2a24" text-anchor="middle">requests in the gap get refused or 502</text>
    <text x="650" y="274" font-size="11.5" fill="#294a2e" text-anchor="middle">every worker slot keeps serving throughout</text>

    <rect x="300" y="290" width="14" height="10" rx="2" fill="#e5efff" stroke="#4774aa" stroke-width="1.2"/>
    <text x="320" y="299" font-size="11" fill="#36424e">v1 worker</text>
    <rect x="400" y="290" width="14" height="10" rx="2" fill="#e7f3e9" stroke="#53845b" stroke-width="1.2"/>
    <text x="420" y="299" font-size="11" fill="#36424e">v2 worker</text>
    <rect x="500" y="290" width="14" height="10" rx="2" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.2"/>
    <text x="520" y="299" font-size="11" fill="#36424e">gap</text>

    <text x="430" y="326" font-size="13" fill="#40566b" text-anchor="middle">Reload replaces workers one at a time; in fork mode with one process it falls back to a restart.</text>
  </g>
</svg>
