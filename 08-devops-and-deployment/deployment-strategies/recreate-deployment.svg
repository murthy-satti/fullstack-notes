<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-labelledby="rcd-title rcd-desc">
  <title id="rcd-title">A recreate deployment and its downtime window</title>
  <desc id="rcd-desc">Version 1 serves traffic until the deploy starts. Step 1 stops every v1 instance, so the load balancer has no healthy targets and returns 503. Step 2 optionally changes the database schema, which is allowed to break v1 because nothing old is running. Step 3 starts v2 and waits until it is ready, and only then does v2 serve traffic. The time between the last v1 instance stopping and the first v2 instance becoming ready is downtime.</desc>
  <defs>
    <marker id="rcd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="310" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="20" y="79">v1 (old)</text>
      <text x="20" y="123">v2 (new)</text>
    </g>
    <rect x="120" y="60" width="210" height="28" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="225" y="79" font-size="12" font-weight="700" fill="#263e5a">v1 serving</text>
    <rect x="560" y="104" width="260" height="28" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="690" y="123" font-size="12" font-weight="700" fill="#294a2e">v2 serving</text>
    <rect x="334" y="50" width="222" height="92" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="445" y="92" font-size="14" font-weight="700" fill="#6e2a24">downtime</text>
    <text x="445" y="110" font-size="11.5" fill="#6e2a24">load balancer returns 503</text>

    <path d="M120 162H820" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcd-arrow)"/>
    <g fill="#40566b">
      <circle cx="120" cy="162" r="4"/>
      <circle cx="332" cy="162" r="4"/>
      <circle cx="445" cy="162" r="4"/>
      <circle cx="558" cy="162" r="4"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="120" y="182">deploy starts</text>
      <text x="332" y="182">v1 stopped</text>
      <text x="445" y="182">migrate (opt.)</text>
      <text x="558" y="182">v2 ready</text>
      <text x="800" y="182">time</text>
    </g>

    <rect x="40" y="206" width="220" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="150" y="227" font-size="14" font-weight="700" fill="#6e2a24">1. Stop every v1</text>
    <text x="150" y="245" font-size="11.5" fill="#6e2a24">scale to zero</text>
    <rect x="320" y="206" width="220" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="227" font-size="14" font-weight="700" fill="#263e5a">2. Change schema</text>
    <text x="430" y="245" font-size="11.5" fill="#263e5a">optional, may break v1</text>
    <rect x="600" y="206" width="220" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="710" y="227" font-size="14" font-weight="700" fill="#294a2e">3. Start v2</text>
    <text x="710" y="245" font-size="11.5" fill="#294a2e">wait until ready</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M260 231H318" marker-end="url(#rcd-arrow)"/>
      <path d="M540 231H598" marker-end="url(#rcd-arrow)"/>
    </g>

    <text x="430" y="290" font-size="13" fill="#40566b">Simplest and cheapest, but every deploy is an outage; use it only where downtime is acceptable.</text>
  </g>
</svg>
