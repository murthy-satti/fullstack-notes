<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="cvs-title cvs-desc">
  <title id="cvs-title">Active client versions and the minimum supported version</title>
  <desc id="cvs-desc">Active installs of the TaskFlow desktop app by version: 1.9.1, the current version, 62 percent; 1.9.0, 9 percent; 1.8.x, 18 percent; 1.6.x, 7 percent; and 1.2 or older, 4 percent. A line below 1.6.x marks the minimum supported version, 1.6.0: older clients receive an update-required response. The API must stay compatible with every version above the line.</desc>
  <rect width="860" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b">Active installs by version this week</text>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="20" y="66">1.9.1 (current)</text>
      <text x="20" y="104">1.9.0</text>
      <text x="20" y="142">1.8.x</text>
      <text x="20" y="180">1.6.x</text>
      <text x="20" y="254">1.2 and older</text>
    </g>
    <rect x="160" y="50" width="496" height="24" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="160" y="88" width="72" height="24" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="160" y="126" width="144" height="24" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="160" y="164" width="56" height="24" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="160" y="238" width="32" height="24" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="664" y="66">62%</text>
      <text x="240" y="104">9%</text>
      <text x="312" y="142">18%</text>
      <text x="224" y="180">7%</text>
      <text x="200" y="254">4%: get "update required"</text>
    </g>

    <path d="M20 210H690" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="160" y="228" font-size="11.5" font-weight="700" fill="#6e2a24">minimum supported version: 1.6.0</text>

    <path d="M710 50V188" fill="none" stroke="#53845b" stroke-width="2"/>
    <path d="M704 50H710M704 188H710" fill="none" stroke="#53845b" stroke-width="2"/>
    <g font-size="11.5" fill="#294a2e">
      <text x="720" y="100">the API must</text>
      <text x="720" y="116">stay compatible</text>
      <text x="720" y="132">with all of these</text>
    </g>

    <text x="430" y="306" font-size="13" fill="#40566b" text-anchor="middle">Client versions live for months: support them, measure them, and set a floor you can enforce.</text>
  </g>
</svg>
