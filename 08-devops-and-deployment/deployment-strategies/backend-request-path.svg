<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="brp-title brp-desc">
  <title id="brp-title">Request path from client through nginx to API instances and the database</title>
  <desc id="brp-desc">A client sends an HTTPS request to nginx or a load balancer, which terminates TLS, routes requests, and probes each API instance with GET /readyz every 5 seconds. Instances api-1 and api-2 run version 1.8, answer ready with 200, and receive requests, which they serve by querying the MongoDB replica set. Instance api-3 is stopping: its readiness check answers 503, so the load balancer sends it no new requests while it finishes the requests it already has and then closes its database connections.</desc>
  <defs>
    <marker id="brp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="brp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="134" width="120" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="80" y="158" font-size="14" font-weight="700" fill="#66400f">Client</text>
    <text x="80" y="176" font-size="11.5" fill="#66400f">browser or app</text>

    <rect x="190" y="118" width="170" height="88" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="275" y="142" font-size="14" font-weight="700" fill="#263e5a">nginx / load balancer</text>
    <text x="275" y="161" font-size="11.5" fill="#263e5a">TLS, routing, retries</text>
    <text x="275" y="178" font-size="11.5" fill="#263e5a">probes GET /readyz</text>
    <text x="275" y="195" font-size="11.5" fill="#263e5a">every 5 s</text>

    <path d="M140 162H188" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#brp-arrow)"/>
    <rect x="144" y="141" width="40" height="14" fill="#f5f7fb"/>
    <text x="164" y="152" font-size="11.5" fill="#36424e">HTTPS</text>

    <rect x="440" y="40" width="170" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="525" y="64" font-size="14" font-weight="700" fill="#294a2e">api-1 (v1.8)</text>
    <text x="525" y="82" font-size="11.5" fill="#294a2e">ready: 200</text>
    <rect x="440" y="134" width="170" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="525" y="158" font-size="14" font-weight="700" fill="#294a2e">api-2 (v1.8)</text>
    <text x="525" y="176" font-size="11.5" fill="#294a2e">ready: 200</text>
    <rect x="440" y="228" width="170" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="525" y="252" font-size="14" font-weight="700" fill="#6e2a24">api-3 (stopping)</text>
    <text x="525" y="270" font-size="11.5" fill="#6e2a24">ready: 503, draining</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M360 148 438 72" marker-end="url(#brp-arrow)"/>
      <path d="M360 162H438" marker-end="url(#brp-arrow)"/>
    </g>
    <path d="M360 178 438 252" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="300" y="232" font-size="11.5" font-style="italic" fill="#6e2a24">no new requests</text>
    <text x="300" y="247" font-size="11.5" font-style="italic" fill="#6e2a24">while not ready</text>

    <rect x="690" y="134" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="765" y="158" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="765" y="176" font-size="11.5" fill="#263e5a">replica set</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M610 72 688 150" marker-end="url(#brp-arrow)"/>
      <path d="M610 162H688" marker-end="url(#brp-arrow)"/>
    </g>
    <path d="M610 252 688 176" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#brp-arrow-ret)"/>
    <text x="700" y="250" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">finishes in-flight work,</text>
    <text x="700" y="265" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">then closes connections</text>

    <text x="430" y="320" font-size="13" fill="#40566b">Only instances that answer ready receive traffic; a stopping instance drains before it exits.</text>
  </g>
</svg>
