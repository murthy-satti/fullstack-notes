<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="bgs-title bgs-desc">
  <title id="bgs-title">Blue-green deployment before and after the router switch</title>
  <desc id="bgs-desc">Before the switch: users reach a router or load balancer, which sends 100 percent of traffic to the blue environment running version 1.7 on four instances. The green environment already runs version 1.8, warmed up, and receives only smoke tests through a private URL. After the switch: the router sends 100 percent of traffic to green running version 1.8, and blue stays idle but running so the router can be switched back as a rollback. In both phases the blue and green environments share one MongoDB database, so the schema must work for both versions.</desc>
  <defs>
    <marker id="bgs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="bgs-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="30" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Before the switch</text>
    <text x="450" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">After the switch</text>
    <path d="M430 20V340" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="404" y="158" width="52" height="22" rx="11" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="430" y="173" font-size="11.5" font-weight="700" fill="#294a2e">switch</text>

    <rect x="150" y="40" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="65" font-size="14" font-weight="700" fill="#66400f">Users</text>
    <rect x="140" y="106" width="160" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="220" y="133" font-size="14" font-weight="700" fill="#463365">Router / LB</text>
    <rect x="30" y="190" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="3"/>
    <text x="115" y="214" font-size="14" font-weight="700" fill="#263e5a">Blue: v1.7</text>
    <text x="115" y="232" font-size="11.5" fill="#263e5a">live, 4 instances</text>
    <rect x="240" y="190" width="170" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="325" y="214" font-size="14" font-weight="700" fill="#294a2e">Green: v1.8</text>
    <text x="325" y="232" font-size="11.5" fill="#294a2e">deployed, warmed up</text>
    <rect x="120" y="290" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="220" y="315" font-size="14" font-weight="700" fill="#263e5a">Shared MongoDB</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M220 80V104" marker-end="url(#bgs-arrow)"/>
      <path d="M200 150 122 188" marker-end="url(#bgs-arrow)"/>
      <path d="M115 246 186 288" marker-end="url(#bgs-arrow)"/>
      <path d="M325 246 254 288" marker-end="url(#bgs-arrow)"/>
    </g>
    <path d="M240 150 318 188" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#bgs-arrow-ret)"/>
    <text x="146" y="166" font-size="11.5" font-weight="700" fill="#263e5a" text-anchor="end">100%</text>
    <text x="290" y="166" font-size="11.5" fill="#36424e" text-anchor="start">smoke tests</text>

    <rect x="570" y="40" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="640" y="65" font-size="14" font-weight="700" fill="#66400f">Users</text>
    <rect x="560" y="106" width="160" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="640" y="133" font-size="14" font-weight="700" fill="#463365">Router / LB</text>
    <rect x="450" y="190" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="535" y="214" font-size="14" font-weight="700" fill="#263e5a">Blue: v1.7</text>
    <text x="535" y="232" font-size="11.5" fill="#263e5a">idle, kept for rollback</text>
    <rect x="660" y="190" width="170" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="3"/>
    <text x="745" y="214" font-size="14" font-weight="700" fill="#294a2e">Green: v1.8</text>
    <text x="745" y="232" font-size="11.5" fill="#294a2e">live, 4 instances</text>
    <rect x="540" y="290" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="640" y="315" font-size="14" font-weight="700" fill="#263e5a">Shared MongoDB</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M640 80V104" marker-end="url(#bgs-arrow)"/>
      <path d="M660 150 738 188" marker-end="url(#bgs-arrow)"/>
      <path d="M535 246 606 288" marker-end="url(#bgs-arrow)"/>
      <path d="M745 246 674 288" marker-end="url(#bgs-arrow)"/>
    </g>
    <path d="M620 150 542 188" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#bgs-arrow-ret)"/>
    <text x="566" y="166" font-size="11.5" fill="#36424e" text-anchor="end">switch back</text>
    <text x="714" y="166" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">100%</text>

    <text x="430" y="372" font-size="13" fill="#40566b">The release is one router change and so is the rollback; both colors share the database.</text>
  </g>
</svg>
