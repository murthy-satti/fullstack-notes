<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-labelledby="spa-title spa-desc">
  <title id="spa-title">Fallback routing for a single-page application</title>
  <desc id="spa-desc">A request for GET /tasks/42 arrives at the static host. If a file exists at that path, the host serves the file. If not, the host checks whether the path is under /assets/ or has a file extension; if so, it returns 404 Not Found, so a missing script is a visible error rather than an HTML page. Otherwise it serves index.html with status 200 and no-cache, and the client-side router in the browser renders the task 42 view.</desc>
  <defs>
    <marker id="spa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="320" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="66" width="130" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="85" y="90" font-size="14" font-weight="700" fill="#66400f">Request</text>
    <text x="85" y="108" font-size="11.5" fill="#66400f">GET /tasks/42</text>

    <path d="M265 54 345 94 265 134 185 94z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="265" y="91" font-size="11.5" font-weight="700" fill="#463365">file exists</text>
    <text x="265" y="105" font-size="11.5" font-weight="700" fill="#463365">at this path?</text>
    <path d="M495 50 585 94 495 138 405 94z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="495" y="91" font-size="11.5" font-weight="700" fill="#463365">/assets/* or a</text>
    <text x="495" y="105" font-size="11.5" font-weight="700" fill="#463365">file extension?</text>

    <rect x="640" y="66" width="200" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="740" y="90" font-size="14" font-weight="700" fill="#263e5a">Serve index.html</text>
    <text x="740" y="108" font-size="11.5" fill="#263e5a">status 200, no-cache</text>

    <rect x="185" y="196" width="160" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="265" y="220" font-size="14" font-weight="700" fill="#294a2e">Serve the file</text>
    <text x="265" y="238" font-size="11.5" fill="#294a2e">with its cache headers</text>
    <rect x="415" y="196" width="160" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="495" y="220" font-size="14" font-weight="700" fill="#6e2a24">404 Not Found</text>
    <text x="495" y="238" font-size="11.5" fill="#6e2a24">a real error, not HTML</text>
    <rect x="640" y="196" width="200" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="740" y="220" font-size="14" font-weight="700" fill="#66400f">Client router</text>
    <text x="740" y="238" font-size="11.5" fill="#66400f">renders the task 42 view</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M150 94H183" marker-end="url(#spa-arrow)"/>
      <path d="M345 94H403" marker-end="url(#spa-arrow)"/>
      <path d="M585 94H638" marker-end="url(#spa-arrow)"/>
      <path d="M265 134V194" marker-end="url(#spa-arrow)"/>
      <path d="M495 138V194" marker-end="url(#spa-arrow)"/>
      <path d="M740 122V194" marker-end="url(#spa-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="374" y="86">no</text>
      <text x="611" y="86">no</text>
      <text x="277" y="170" text-anchor="start">yes</text>
      <text x="507" y="170" text-anchor="start">yes</text>
      <text x="752" y="170" text-anchor="start">in the browser</text>
    </g>

    <text x="430" y="296" font-size="13" fill="#40566b">Fall back to index.html only for page routes; missing assets must stay 404.</text>
  </g>
</svg>
