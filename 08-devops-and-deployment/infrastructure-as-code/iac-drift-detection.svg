<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="idd-title idd-desc">
  <title id="idd-title">Detecting and resolving infrastructure drift</title>
  <desc id="idd-desc">On day 1, apply leaves code and reality matching. On day 3, someone uses the console to open port 22 to the whole internet on the API security group, so reality no longer matches the code. Every night, CI runs terraform plan with -detailed-exitcode. Exit code 0 means no drift. Exit code 2 means changes are present: drift is found, an alert fires and an issue is opened. The team then either reverts by applying the code, which closes the port again, or adopts the change by updating the code in a reviewed pull request. Either way the next plan exits 0.</desc>
  <defs>
    <marker id="idd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="50" width="160" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="100" y="74" font-size="14" font-weight="700" fill="#294a2e">Day 1: apply</text>
    <text x="100" y="93" font-size="11.5" fill="#294a2e">code = reality</text>
    <rect x="210" y="50" width="190" height="60" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="305" y="74" font-size="14" font-weight="700" fill="#6e2a24">Day 3: console edit</text>
    <text x="305" y="93" font-size="11.5" fill="#6e2a24">port 22 open to 0.0.0.0/0</text>
    <rect x="430" y="50" width="170" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="515" y="74" font-size="14" font-weight="700" fill="#463365">Nightly plan</text>
    <text x="515" y="93" font-size="11.5" fill="#463365">-detailed-exitcode</text>
    <path d="M680 40 730 80 680 120 630 80z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="680" y="84" font-size="12" font-weight="700" fill="#463365">exit code?</text>
    <rect x="760" y="56" width="80" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="800" y="77" font-size="12.5" font-weight="700" fill="#294a2e">0</text>
    <text x="800" y="94" font-size="11" fill="#294a2e">no drift</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M180 80H208" marker-end="url(#idd-arrow)"/>
      <path d="M400 80H428" marker-end="url(#idd-arrow)"/>
      <path d="M600 80H628" marker-end="url(#idd-arrow)"/>
      <path d="M730 80H758" marker-end="url(#idd-arrow)"/>
      <path d="M680 120V166" marker-end="url(#idd-arrow)"/>
    </g>
    <text x="692" y="146" font-size="11" font-weight="700" fill="#66400f" text-anchor="start">2</text>

    <rect x="560" y="168" width="240" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="680" y="192" font-size="14" font-weight="700" fill="#66400f">Drift found</text>
    <text x="680" y="211" font-size="11.5" fill="#66400f">alert fires, issue opened</text>

    <path d="M620 224V248H210V270" fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round" marker-end="url(#idd-arrow)"/>
    <path d="M740 224V270" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#idd-arrow)"/>

    <rect x="80" y="272" width="260" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="210" y="294" font-size="13" font-weight="700" fill="#263e5a">Revert: apply the code</text>
    <text x="210" y="312" font-size="11.5" fill="#263e5a">port 22 closes again</text>
    <rect x="600" y="272" width="240" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="720" y="294" font-size="13" font-weight="700" fill="#263e5a">Adopt: update the code</text>
    <text x="720" y="312" font-size="11.5" fill="#263e5a">in a reviewed pull request</text>

    <text x="430" y="348" font-size="13" fill="#40566b">Either way the next plan exits 0, and the code is again the truth about the infrastructure.</text>
  </g>
</svg>
