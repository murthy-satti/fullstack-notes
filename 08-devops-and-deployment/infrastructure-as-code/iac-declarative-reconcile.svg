<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="idr-title idr-desc">
  <title id="idr-title">Declarative IaC: desired state compared with actual state produces a plan</title>
  <desc id="idr-desc">The desired state in code says: bucket uploads with versioning on, policy uploads-rw, and a new bucket logs. The actual state, from the state file and the cloud, has bucket uploads with versioning off because someone changed it, policy uploads-rw, and bucket old-exports, which is still in state but was removed from the code. The tool compares them and produces a plan: create bucket logs, update bucket uploads to turn versioning on, destroy bucket old-exports, and leave policy uploads-rw unchanged. Apply makes the actual state equal the desired state, so the next plan shows no changes. Below, an imperative script that says create bucket logs fails when run a second time because the bucket already exists, while the declarative statement that bucket logs exists produces no changes when run again.</desc>
  <defs>
    <marker id="idr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="40" width="270" height="120" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="155" y="64" font-size="14" font-weight="700" fill="#66400f">Desired state (code)</text>
    <g font-size="11.5" fill="#66400f" text-anchor="start">
      <text x="36" y="90">bucket uploads: versioning on</text>
      <text x="36" y="112">policy uploads-rw</text>
      <text x="36" y="134">bucket logs (new)</text>
    </g>

    <rect x="20" y="186" width="270" height="120" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="155" y="210" font-size="14" font-weight="700" fill="#263e5a">Actual state (state + cloud)</text>
    <g font-size="11.5" fill="#263e5a" text-anchor="start">
      <text x="36" y="236">bucket uploads: versioning off</text>
      <text x="36" y="258">policy uploads-rw</text>
      <text x="36" y="280">bucket old-exports (removed in code)</text>
    </g>

    <rect x="340" y="90" width="290" height="166" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="485" y="114" font-size="14" font-weight="700" fill="#463365">Plan (the difference)</text>
    <g font-size="11.5" text-anchor="start">
      <text x="356" y="144" fill="#294a2e" font-weight="700">+ create</text>
      <text x="436" y="144" fill="#294a2e">bucket logs</text>
      <text x="356" y="172" fill="#66400f" font-weight="700">~ update</text>
      <text x="436" y="172" fill="#66400f">bucket uploads: versioning</text>
      <text x="356" y="200" fill="#6e2a24" font-weight="700">- destroy</text>
      <text x="436" y="200" fill="#6e2a24">bucket old-exports</text>
      <text x="356" y="228" fill="#36424e" font-weight="700">no-op</text>
      <text x="436" y="228" fill="#36424e">policy uploads-rw</text>
    </g>

    <rect x="670" y="128" width="170" height="90" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="755" y="154" font-size="14" font-weight="700" fill="#294a2e">Apply</text>
    <text x="755" y="176" font-size="11.5" fill="#294a2e">actual = desired</text>
    <text x="755" y="196" font-size="11.5" fill="#294a2e">next plan: no changes</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M290 100 338 140" marker-end="url(#idr-arrow)"/>
      <path d="M290 246 338 206" marker-end="url(#idr-arrow)"/>
      <path d="M630 173H668" marker-end="url(#idr-arrow)"/>
    </g>
    <text x="300" y="176" font-size="11" font-style="italic" fill="#40566b">compare</text>

    <path d="M20 330H840" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="20" y="346" width="400" height="54" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="220" y="368" font-size="12.5" font-weight="700" fill="#6e2a24">Imperative: "create bucket logs"</text>
    <text x="220" y="387" font-size="11.5" fill="#6e2a24">second run fails: the bucket already exists</text>
    <rect x="440" y="346" width="400" height="54" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="640" y="368" font-size="12.5" font-weight="700" fill="#294a2e">Declarative: "bucket logs exists"</text>
    <text x="640" y="387" font-size="11.5" fill="#294a2e">second run: no changes (idempotent)</text>

    <text x="430" y="426" font-size="13" fill="#40566b">You describe the end state; the tool computes and applies only the difference.</text>
  </g>
</svg>
