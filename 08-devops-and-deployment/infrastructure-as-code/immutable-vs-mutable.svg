<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="ivm-title ivm-desc">
  <title id="ivm-title">Mutable in-place changes compared with immutable replacement</title>
  <desc id="ivm-desc">Left, mutable: three servers start identical on version 1. Engineers change them in place over SSH: upgrade packages, edit configuration, apply hotfixes. Over time they diverge: server 1 runs v2 patched, server 2 runs v2 but missed a hotfix, and server 3 runs v2 with a manual edit nobody recorded. They have become snowflakes. Right, immutable: an image for v2 is built once by Packer or Docker and tested. Three new instances are launched from that same image, traffic shifts to them, and the old v1 instances are terminated. Every instance is identical to what was tested, and rolling back means launching the previous image.</desc>
  <defs>
    <marker id="ivm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="30" font-size="14" font-weight="700" fill="#6e2a24">Mutable: change servers in place</text>
    <text x="640" y="30" font-size="14" font-weight="700" fill="#294a2e">Immutable: replace servers</text>
    <path d="M430 16V346" stroke="#c9d1db" stroke-width="1.5"/>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="30" y="50" width="116" height="46" rx="8"/>
      <rect x="162" y="50" width="116" height="46" rx="8"/>
      <rect x="294" y="50" width="116" height="46" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="88" y="70">server-1</text>
      <text x="220" y="70">server-2</text>
      <text x="352" y="70">server-3</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="88" y="86">v1</text>
      <text x="220" y="86">v1</text>
      <text x="352" y="86">v1</text>
    </g>

    <rect x="60" y="128" width="320" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="149" font-size="12.5" font-weight="700" fill="#66400f">SSH: upgrade, edit config, hotfix</text>
    <text x="220" y="167" font-size="11" fill="#66400f">by hand, server by server, over months</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M220 96V126" marker-end="url(#ivm-arrow)"/>
      <path d="M220 178V208" marker-end="url(#ivm-arrow)"/>
    </g>

    <rect x="30" y="210" width="116" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="162" y="210" width="116" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="294" y="210" width="116" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <g font-size="12.5" font-weight="700">
      <text x="88" y="232" fill="#294a2e">server-1</text>
      <text x="220" y="232" fill="#6e2a24">server-2</text>
      <text x="352" y="232" fill="#66400f">server-3</text>
    </g>
    <g font-size="11">
      <text x="88" y="250" fill="#294a2e">v2, patched</text>
      <text x="220" y="250" fill="#6e2a24">missed a hotfix</text>
      <text x="352" y="250" fill="#66400f">unrecorded edit</text>
    </g>
    <text x="220" y="296" font-size="11.5" font-style="italic" fill="#6e2a24">snowflakes: no two servers are the same</text>

    <rect x="530" y="50" width="220" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="640" y="73" font-size="13" font-weight="700" fill="#463365">Image v2, built once</text>
    <text x="640" y="91" font-size="11.5" fill="#463365">Packer or Docker, then tested</text>
    <path d="M640 106V134" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ivm-arrow)"/>
    <text x="652" y="125" font-size="11" fill="#36424e" text-anchor="start">launch 3 from the same image</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="450" y="136" width="116" height="46" rx="8"/>
      <rect x="582" y="136" width="116" height="46" rx="8"/>
      <rect x="714" y="136" width="116" height="46" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#294a2e">
      <text x="508" y="156">new-1</text>
      <text x="640" y="156">new-2</text>
      <text x="772" y="156">new-3</text>
    </g>
    <g font-size="11" fill="#294a2e">
      <text x="508" y="172">v2</text>
      <text x="640" y="172">v2</text>
      <text x="772" y="172">v2</text>
    </g>
    <path d="M640 182V210" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ivm-arrow)"/>
    <text x="652" y="201" font-size="11" fill="#36424e" text-anchor="start">shift traffic</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4">
      <rect x="450" y="212" width="116" height="46" rx="8"/>
      <rect x="582" y="212" width="116" height="46" rx="8"/>
      <rect x="714" y="212" width="116" height="46" rx="8"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="508" y="232">old v1</text>
      <text x="640" y="232">old v1</text>
      <text x="772" y="232">old v1</text>
      <text x="508" y="248">terminated</text>
      <text x="640" y="248">terminated</text>
      <text x="772" y="248">terminated</text>
    </g>
    <text x="640" y="296" font-size="11.5" font-style="italic" fill="#294a2e">identical to what was tested; rollback = previous image</text>

    <text x="430" y="378" font-size="13" fill="#40566b">Change the image, not the server: replacement keeps every instance identical and reproducible.</text>
  </g>
</svg>
