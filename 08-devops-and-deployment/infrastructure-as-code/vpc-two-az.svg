<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" role="img" aria-labelledby="vpc-title vpc-desc">
  <title id="vpc-title">A VPC with public, private, and database subnets across two Availability Zones</title>
  <desc id="vpc-desc">Users on the internet reach an internet gateway attached to the TaskFlow VPC, 10.20.0.0/16, in one region. The VPC spans two Availability Zones, a and b. Each zone has three subnets. The public subnets, 10.20.0.0/24 and 10.20.1.0/24, route to the internet gateway and hold a load balancer node, whose security group accepts 443, and a NAT gateway for outbound traffic only. The private app subnets, 10.20.10.0/24 and 10.20.11.0/24, send outbound traffic through the NAT gateway in the same zone and hold API tasks, whose security group accepts port 3000 only from the load balancer. The database subnets, 10.20.20.0/24 and 10.20.21.0/24, have no internet route and hold the database primary in zone a and a replicating standby in zone b, accepting the database port only from the API.</desc>
  <defs>
    <marker id="vpc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="vpc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="580" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="350" y="14" width="160" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="36" font-size="13" font-weight="700" fill="#66400f">Users on the internet</text>

    <rect x="20" y="66" width="820" height="470" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="34" y="84" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">Region eu-west-1</text>
    <rect x="36" y="96" width="788" height="428" rx="10" fill="#ffffff" stroke="#4774aa" stroke-width="2"/>
    <text x="50" y="116" font-size="13" font-weight="700" fill="#263e5a" text-anchor="start">VPC taskflow-prod 10.20.0.0/16</text>

    <rect x="360" y="82" width="140" height="30" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="102" font-size="12" font-weight="700" fill="#263e5a">Internet gateway</text>
    <path d="M430 48V80" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#vpc-arrow)"/>

    <rect x="50" y="128" width="374" height="384" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="436" y="128" width="374" height="384" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="150" y="146" font-size="12" font-weight="700" fill="#40566b">Availability Zone a</text>
    <text x="710" y="146" font-size="12" font-weight="700" fill="#40566b">Availability Zone b</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="58" y="156" width="358" height="96" rx="8"/>
      <rect x="444" y="156" width="358" height="96" rx="8"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="58" y="270" width="358" height="96" rx="8"/>
      <rect x="444" y="270" width="358" height="96" rx="8"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="58" y="384" width="358" height="96" rx="8"/>
      <rect x="444" y="384" width="358" height="96" rx="8"/>
    </g>

    <g font-size="10.5" text-anchor="start">
      <text x="66" y="192" font-weight="700" fill="#294a2e">Public</text>
      <text x="66" y="208" fill="#294a2e">10.20.0.0/24</text>
      <text x="66" y="224" fill="#294a2e">route: IGW</text>
      <text x="452" y="192" font-weight="700" fill="#294a2e">Public</text>
      <text x="452" y="208" fill="#294a2e">10.20.1.0/24</text>
      <text x="452" y="224" fill="#294a2e">route: IGW</text>
      <text x="66" y="306" font-weight="700" fill="#263e5a">Private app</text>
      <text x="66" y="322" fill="#263e5a">10.20.10.0/24</text>
      <text x="66" y="338" fill="#263e5a">route: NAT a</text>
      <text x="452" y="306" font-weight="700" fill="#263e5a">Private app</text>
      <text x="452" y="322" fill="#263e5a">10.20.11.0/24</text>
      <text x="452" y="338" fill="#263e5a">route: NAT b</text>
      <text x="66" y="420" font-weight="700" fill="#463365">Database</text>
      <text x="66" y="436" fill="#463365">10.20.20.0/24</text>
      <text x="66" y="452" fill="#463365">no internet</text>
      <text x="452" y="420" font-weight="700" fill="#463365">Database</text>
      <text x="452" y="436" fill="#463365">10.20.21.0/24</text>
      <text x="452" y="452" fill="#463365">no internet</text>
    </g>

    <g fill="#ffffff" stroke-width="1.5">
      <rect x="156" y="186" width="128" height="48" rx="6" stroke="#53845b"/>
      <rect x="290" y="186" width="120" height="48" rx="6" stroke="#53845b"/>
      <rect x="542" y="186" width="128" height="48" rx="6" stroke="#53845b"/>
      <rect x="676" y="186" width="120" height="48" rx="6" stroke="#53845b"/>
      <rect x="156" y="300" width="128" height="48" rx="6" stroke="#4774aa"/>
      <rect x="290" y="300" width="120" height="48" rx="6" stroke="#4774aa"/>
      <rect x="542" y="300" width="128" height="48" rx="6" stroke="#4774aa"/>
      <rect x="676" y="300" width="120" height="48" rx="6" stroke="#4774aa"/>
      <rect x="200" y="414" width="180" height="48" rx="6" stroke="#8062a8"/>
      <rect x="586" y="414" width="180" height="48" rx="6" stroke="#8062a8"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="220" y="206" fill="#294a2e">Load balancer</text>
      <text x="350" y="206" fill="#294a2e">NAT gateway</text>
      <text x="606" y="206" fill="#294a2e">Load balancer</text>
      <text x="736" y="206" fill="#294a2e">NAT gateway</text>
      <text x="220" y="320" fill="#263e5a">API task</text>
      <text x="350" y="320" fill="#263e5a">API task</text>
      <text x="606" y="320" fill="#263e5a">API task</text>
      <text x="736" y="320" fill="#263e5a">API task</text>
      <text x="290" y="434" fill="#463365">Database primary</text>
      <text x="676" y="434" fill="#463365">Database standby</text>
    </g>
    <g font-size="11">
      <text x="220" y="223" fill="#294a2e">SG: 443 open</text>
      <text x="350" y="223" fill="#294a2e">outbound only</text>
      <text x="606" y="223" fill="#294a2e">SG: 443 open</text>
      <text x="736" y="223" fill="#294a2e">outbound only</text>
      <text x="220" y="337" fill="#263e5a">SG: 3000 from LB</text>
      <text x="350" y="337" fill="#263e5a">SG: 3000 from LB</text>
      <text x="606" y="337" fill="#263e5a">SG: 3000 from LB</text>
      <text x="736" y="337" fill="#263e5a">SG: 3000 from LB</text>
      <text x="290" y="451" fill="#463365">SG: DB port from API</text>
      <text x="676" y="451" fill="#463365">SG: DB port from API</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M400 112 222 184" marker-end="url(#vpc-arrow)"/>
      <path d="M460 112 604 184" marker-end="url(#vpc-arrow)"/>
      <path d="M220 234V298" marker-end="url(#vpc-arrow)"/>
      <path d="M606 234V298" marker-end="url(#vpc-arrow)"/>
      <path d="M220 348 270 412" marker-end="url(#vpc-arrow)"/>
      <path d="M606 348 656 412" marker-end="url(#vpc-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M350 300V236" marker-end="url(#vpc-arrow-ret)"/>
      <path d="M736 300V236" marker-end="url(#vpc-arrow-ret)"/>
    </g>
    <path d="M380 438H584" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="2 4"/>
    <rect x="440" y="424" width="80" height="14" fill="#ffffff"/>
    <text x="480" y="435" font-size="11" font-style="italic" fill="#463365">replication</text>

    <text x="430" y="562" font-size="13" fill="#40566b">Only the load balancer and NAT sit in public subnets; each Availability Zone can fail on its own.</text>
  </g>
</svg>
