<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="pap-title pap-desc">
  <title id="pap-title">Promoting one artifact through environments with an approval gate</title>
  <desc id="pap-desc">A merge to main builds the image once and pushes it to the registry, where it is identified by digest sha256:9f2c. The pipeline deploys that digest to dev automatically; when smoke tests pass, it deploys the same digest to staging. When end-to-end tests are green, the production job waits at an approval gate: the production environment requires a reviewer, allows deployments only from main, and prevents self-review. After approval the same digest is deployed to production, first as a canary and then to all traffic. Every deployment writes a record with the environment, digest, commit, workflow run, approver, and time, so the history shows that dev, staging, and production all ran sha256:9f2c from commit a1b2c3d.</desc>
  <defs>
    <marker id="pap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="60" width="150" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="95" y="85" font-size="13" font-weight="700" fill="#463365">Build once</text>
    <text x="95" y="103" font-size="11" fill="#463365">merge to main, a1b2c3d</text>
    <rect x="200" y="60" width="170" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="285" y="85" font-size="13" font-weight="700" fill="#263e5a">Registry</text>
    <text x="285" y="103" font-size="11" fill="#263e5a">taskflow-api@sha256:9f2c</text>
    <rect x="410" y="60" width="130" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="475" y="85" font-size="13" font-weight="700" fill="#263e5a">dev</text>
    <text x="475" y="103" font-size="11" fill="#263e5a">automatic</text>
    <rect x="700" y="60" width="160" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="780" y="85" font-size="13" font-weight="700" fill="#263e5a">staging</text>
    <text x="780" y="103" font-size="11" fill="#263e5a">automatic</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M170 90H198" marker-end="url(#pap-arrow)"/>
      <path d="M370 90H408" marker-end="url(#pap-arrow)"/>
      <path d="M540 90H698" marker-end="url(#pap-arrow)"/>
      <path d="M780 120V196" marker-end="url(#pap-arrow)"/>
      <path d="M600 230H546" marker-end="url(#pap-arrow)"/>
      <path d="M300 230H282" marker-end="url(#pap-arrow)"/>
    </g>
    <rect x="565" y="78" width="110" height="24" rx="12" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="620" y="94" font-size="11" font-weight="700" fill="#294a2e">smoke tests pass</text>
    <rect x="725" y="146" width="110" height="24" rx="12" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="780" y="162" font-size="11" font-weight="700" fill="#294a2e">e2e tests green</text>

    <g font-size="10.5" font-weight="700" fill="#463365">
      <rect x="430" y="34" width="90" height="18" rx="9" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.2"/>
      <text x="475" y="47">sha256:9f2c</text>
      <rect x="735" y="34" width="90" height="18" rx="9" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.2"/>
      <text x="780" y="47">sha256:9f2c</text>
      <rect x="377" y="166" width="90" height="18" rx="9" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.2"/>
      <text x="422" y="179">sha256:9f2c</text>
    </g>

    <rect x="600" y="196" width="260" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="730" y="218" font-size="13" font-weight="700" fill="#66400f">Approval gate (production)</text>
    <g font-size="11" fill="#66400f">
      <text x="730" y="236">required reviewer, prevent self-review</text>
      <text x="730" y="252">deploys allowed from main only</text>
      <text x="730" y="266">environment secrets released after</text>
    </g>
    <rect x="300" y="196" width="244" height="68" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="422" y="219" font-size="13" font-weight="700" fill="#294a2e">production</text>
    <text x="422" y="237" font-size="11" fill="#294a2e">same digest: canary 5%, then 100%</text>
    <text x="422" y="253" font-size="11" fill="#294a2e">rollback = redeploy previous digest</text>
    <rect x="20" y="196" width="260" height="68" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="150" y="219" font-size="13" font-weight="700" fill="#36424e">Deployment record</text>
    <text x="150" y="237" font-size="11" fill="#36424e">environment, digest, commit,</text>
    <text x="150" y="253" font-size="11" fill="#36424e">run, approver, time, result</text>

    <path d="M24 296H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="320" font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">Deployment history: one digest, three environments</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="344" font-weight="700">environment</text>
      <text x="150" y="344" font-weight="700">digest</text>
      <text x="280" y="344" font-weight="700">commit</text>
      <text x="380" y="344" font-weight="700">approved by</text>
      <text x="520" y="344" font-weight="700">time</text>
      <text x="24" y="362">dev</text>
      <text x="150" y="362">sha256:9f2c</text>
      <text x="280" y="362">a1b2c3d</text>
      <text x="380" y="362">(automatic)</text>
      <text x="520" y="362">10:02</text>
      <text x="24" y="380">staging</text>
      <text x="150" y="380">sha256:9f2c</text>
      <text x="280" y="380">a1b2c3d</text>
      <text x="380" y="380">(automatic)</text>
      <text x="520" y="380">10:09</text>
      <text x="24" y="398">production</text>
      <text x="150" y="398">sha256:9f2c</text>
      <text x="280" y="398">a1b2c3d</text>
      <text x="380" y="398">release lead</text>
      <text x="520" y="398">11:40</text>
    </g>

    <text x="440" y="428" font-size="13" fill="#40566b">Gates decide whether the artifact moves on; the artifact itself never changes.</text>
  </g>
</svg>
