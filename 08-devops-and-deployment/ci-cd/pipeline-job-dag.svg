<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="pjd-title pjd-desc">
  <title id="pjd-title">A pipeline as a job graph, with its critical path</title>
  <desc id="pjd-desc">Four independent jobs start in parallel: lint (1 minute), unit tests (2 minutes), integration tests (4 minutes), and dependency audit (1 minute). The build image job needs all four and takes 3 minutes. Deploy to staging needs the build and takes 2 minutes, end-to-end tests against staging take 6 minutes, and after an approval deploy to production takes 3 minutes. The critical path is integration tests, build, staging, end-to-end tests, and production: 4 plus 3 plus 2 plus 6 plus 3 equals 18 minutes, excluding the approval wait. Running the same eight jobs one after another would take 1 plus 2 plus 4 plus 1 plus 3 plus 2 plus 6 plus 3 equals 22 minutes. Shortening the critical path, here the integration and end-to-end tests, is the only way to make the pipeline faster.</desc>
  <defs>
    <marker id="pjd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pjd-arrow-crit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#bd7a20"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="90" y="34">parallel checks</text>
      <text x="285" y="34">package</text>
      <text x="445" y="34">staging</text>
      <text x="610" y="34">verify</text>
      <text x="795" y="34">release</text>
    </g>

    <g stroke-width="2" fill="#f0e9fb" stroke="#8062a8">
      <rect x="20" y="48" width="140" height="44" rx="8"/>
      <rect x="20" y="104" width="140" height="44" rx="8"/>
      <rect x="20" y="160" width="140" height="44" rx="8" stroke="#bd7a20" stroke-width="3"/>
      <rect x="20" y="216" width="140" height="44" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="90" y="67">lint</text>
      <text x="90" y="123">unit tests</text>
      <text x="90" y="179">integration tests</text>
      <text x="90" y="235">dependency audit</text>
    </g>
    <g font-size="11" fill="#463365">
      <text x="90" y="83">1 min</text><text x="90" y="139">2 min</text>
      <text x="90" y="195">4 min</text><text x="90" y="251">1 min</text>
    </g>

    <rect x="220" y="132" width="130" height="56" rx="8" fill="#e5efff" stroke="#bd7a20" stroke-width="3"/>
    <text x="285" y="156" font-size="12.5" font-weight="700" fill="#263e5a">build image</text>
    <text x="285" y="174" font-size="11" fill="#263e5a">3 min</text>
    <rect x="385" y="132" width="120" height="56" rx="8" fill="#e5efff" stroke="#bd7a20" stroke-width="3"/>
    <text x="445" y="156" font-size="12.5" font-weight="700" fill="#263e5a">deploy staging</text>
    <text x="445" y="174" font-size="11" fill="#263e5a">2 min</text>
    <rect x="540" y="132" width="140" height="56" rx="8" fill="#e5efff" stroke="#bd7a20" stroke-width="3"/>
    <text x="610" y="156" font-size="12.5" font-weight="700" fill="#263e5a">end-to-end tests</text>
    <text x="610" y="174" font-size="11" fill="#263e5a">6 min</text>
    <rect x="730" y="132" width="130" height="56" rx="8" fill="#e7f3e9" stroke="#bd7a20" stroke-width="3"/>
    <text x="795" y="156" font-size="12.5" font-weight="700" fill="#294a2e">deploy prod</text>
    <text x="795" y="174" font-size="11" fill="#294a2e">3 min</text>

    <g fill="none" stroke="#40566b" stroke-width="1.8">
      <path d="M160 70 218 146" marker-end="url(#pjd-arrow)"/>
      <path d="M160 126 218 154" marker-end="url(#pjd-arrow)"/>
      <path d="M160 238 218 176" marker-end="url(#pjd-arrow)"/>
    </g>
    <g fill="none" stroke="#bd7a20" stroke-width="3">
      <path d="M160 182 218 166" marker-end="url(#pjd-arrow-crit)"/>
      <path d="M350 160H383" marker-end="url(#pjd-arrow-crit)"/>
      <path d="M505 160H538" marker-end="url(#pjd-arrow-crit)"/>
      <path d="M680 160H728" marker-end="url(#pjd-arrow-crit)"/>
    </g>
    <rect x="684" y="110" width="40" height="16" fill="#f5f7fb"/>
    <text x="705" y="122" font-size="11" font-style="italic" fill="#66400f">approve</text>
    <text x="285" y="214" font-size="11" fill="#40566b">needs: all four</text>
    <text x="610" y="214" font-size="12" font-weight="700" fill="#66400f">critical path: 4 + 3 + 2 + 6 + 3 = 18 min</text>

    <path d="M24 278H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="304" font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">Wall-clock time (excluding the approval wait), 30 px per minute</text>
    <text x="24" y="333" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">serial</text>
    <rect x="100" y="318" width="660" height="22" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="770" y="334" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">22 min</text>
    <text x="24" y="369" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">job graph</text>
    <rect x="100" y="354" width="540" height="22" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="650" y="370" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">18 min</text>

    <text x="440" y="404" font-size="13" fill="#40566b">Run independent jobs in parallel; total time equals the critical path, so speed up the jobs on it.</text>
  </g>
</svg>
