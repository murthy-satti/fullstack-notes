<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="qgf-title qgf-desc">
  <title id="qgf-title">Quality gates ordered by cost and speed</title>
  <desc id="qgf-desc">A funnel of six gates, widest and cheapest at the top. First, editor and pre-commit checks format and lint changed files in seconds before a push. Second, static analysis on every pull request: lint, type check, and secret scan, in seconds. Third, unit tests on every pull request in under a minute. Fourth, integration tests of the API against a MongoDB service container on every pull request, in one to three minutes. Fifth, end-to-end tests against a preview or staging environment, in five to fifteen minutes, on the pull request or after merge. Sixth, performance budgets and canary analysis after merge and in production. Moving down, checks become fewer, slower, more expensive, and more realistic; each gate stops failures as early and cheaply as possible.</desc>
  <defs>
    <marker id="qgf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="100" y="30" width="700" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="140" y="86" width="620" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="180" y="142" width="540" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="220" y="198" width="460" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="260" y="254" width="380" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="300" y="310" width="300" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12.5" font-weight="700">
      <text x="450" y="51" fill="#294a2e">Editor and pre-commit: format, lint changed files</text>
      <text x="450" y="107" fill="#294a2e">Static analysis: lint, type check, secret scan</text>
      <text x="450" y="163" fill="#263e5a">Unit tests</text>
      <text x="450" y="219" fill="#263e5a">Integration tests: API + MongoDB</text>
      <text x="450" y="275" fill="#463365">End-to-end on preview or staging</text>
      <text x="450" y="331" fill="#66400f">Performance budgets, canary</text>
    </g>
    <g font-size="11">
      <text x="450" y="69" fill="#294a2e">seconds, before every push</text>
      <text x="450" y="125" fill="#294a2e">seconds, every PR</text>
      <text x="450" y="181" fill="#263e5a">under a minute, every PR</text>
      <text x="450" y="237" fill="#263e5a">1-3 minutes, every PR (service container)</text>
      <text x="450" y="293" fill="#463365">5-15 minutes, PR or after merge</text>
      <text x="450" y="349" fill="#66400f">after merge and in production</text>
    </g>

    <path d="M50 34V350" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#qgf-arrow)"/>
    <g font-size="11" fill="#40566b" text-anchor="start">
      <text x="24" y="376">fewer, slower, costlier,</text>
      <text x="24" y="391">more realistic checks</text>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="start">
      <text x="606" y="390">a failure stops the change at</text>
      <text x="606" y="405">the cheapest gate that sees it</text>
    </g>

    <text x="430" y="428" font-size="13" fill="#40566b">Run many fast, cheap checks first; spend slow, expensive tests only on changes that already passed.</text>
  </g>
</svg>
