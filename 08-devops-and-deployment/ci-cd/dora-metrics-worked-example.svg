<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="dme-title dme-desc">
  <title id="dme-title">Computing the DORA metrics for one service over one week</title>
  <desc id="dme-desc">A timeline from Monday to Friday shows 20 production deployments of the TaskFlow API, four per day. On Monday one change is committed at 09:10 and is live at 11:40. On Tuesday the second deployment fails and is rolled back, with service recovered in 35 minutes. On Thursday the third deployment fails, and an unplanned hotfix deployment restores service after 50 minutes. The resulting metrics: deployment frequency 4 per day (20 deployments in 5 days); change lead time 2 hours 30 minutes for that change; failed deployment recovery time 42.5 minutes, the mean of 35 and 50; change fail rate 10 percent, 2 of 20 deployments needed intervention; deployment rework rate 5 percent, 1 of 20 deployments was an unplanned fix for an incident. The first three are throughput metrics and the last two are instability metrics.</desc>
  <rect width="880" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">TaskFlow API production deployments, one week</text>

    <g stroke="#c9d1db" stroke-width="1.5">
      <path d="M232 112V196"/><path d="M384 112V196"/><path d="M536 112V196"/><path d="M688 112V196"/>
    </g>
    <path d="M80 150H840" stroke="#8a96a3" stroke-width="2"/>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="156" y="210">Mon</text><text x="308" y="210">Tue</text><text x="460" y="210">Wed</text>
      <text x="612" y="210">Thu</text><text x="764" y="210">Fri</text>
    </g>

    <path d="M95 106V98H140V106" fill="none" stroke="#8062a8" stroke-width="1.5"/>
    <path d="M95 106V144" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M140 106V142" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M95 141 99 145 95 149 91 145z" fill="#8062a8"/>
    <text x="118" y="70" font-size="11" font-weight="700" fill="#463365">lead time 2 h 30 min</text>
    <text x="118" y="86" font-size="10.5" fill="#463365">commit 09:10, live 11:40</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <circle cx="105" cy="150" r="6"/><circle cx="140" cy="150" r="6"/><circle cx="175" cy="150" r="6"/><circle cx="210" cy="150" r="6"/>
      <circle cx="257" cy="150" r="6"/><circle cx="327" cy="150" r="6"/><circle cx="362" cy="150" r="6"/>
      <circle cx="409" cy="150" r="6"/><circle cx="444" cy="150" r="6"/><circle cx="479" cy="150" r="6"/><circle cx="514" cy="150" r="6"/>
      <circle cx="561" cy="150" r="6"/><circle cx="596" cy="150" r="6"/>
      <circle cx="713" cy="150" r="6"/><circle cx="748" cy="150" r="6"/><circle cx="783" cy="150" r="6"/><circle cx="818" cy="150" r="6"/>
    </g>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="2">
      <circle cx="292" cy="150" r="7"/><circle cx="631" cy="150" r="7"/>
    </g>
    <circle cx="666" cy="150" r="7" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>

    <g font-size="10.5" fill="#6e2a24">
      <text x="292" y="128" font-weight="700">failed: rollback</text>
      <text x="292" y="182">recovered in 35 min</text>
      <text x="631" y="128" font-weight="700">failed</text>
      <text x="631" y="182">recovered in 50 min</text>
    </g>
    <text x="684" y="102" font-size="10.5" font-weight="700" fill="#66400f" text-anchor="end">hotfix (rework)</text>
    <path d="M666 108V141" stroke="#bd7a20" stroke-width="1.2" stroke-dasharray="2 2"/>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="265" y="234">Throughput</text>
      <text x="695" y="234">Instability</text>
    </g>
    <g stroke-width="2">
      <rect x="20" y="242" width="160" height="90" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="190" y="242" width="160" height="90" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="360" y="242" width="160" height="90" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="530" y="242" width="160" height="90" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="700" y="242" width="160" height="90" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="100" y="262">Deployment</text><text x="100" y="277">frequency</text>
      <text x="270" y="262">Change</text><text x="270" y="277">lead time</text>
      <text x="440" y="262">Failed deployment</text><text x="440" y="277">recovery time</text>
    </g>
    <g font-size="12" font-weight="700" fill="#6e2a24">
      <text x="610" y="262">Change</text><text x="610" y="277">fail rate</text>
      <text x="780" y="262">Deployment</text><text x="780" y="277">rework rate</text>
    </g>
    <g font-size="16" font-weight="700">
      <text x="100" y="303" fill="#263e5a">4 per day</text>
      <text x="270" y="303" fill="#263e5a">2 h 30 min</text>
      <text x="440" y="303" fill="#263e5a">42.5 min</text>
      <text x="610" y="303" fill="#6e2a24">10%</text>
      <text x="780" y="303" fill="#6e2a24">5%</text>
    </g>
    <g font-size="10.5">
      <text x="100" y="322" fill="#263e5a">20 deploys / 5 days</text>
      <text x="270" y="322" fill="#263e5a">09:10 to 11:40</text>
      <text x="440" y="322" fill="#263e5a">mean of 35 and 50 min</text>
      <text x="610" y="322" fill="#6e2a24">2 of 20 needed a fix</text>
      <text x="780" y="322" fill="#6e2a24">1 of 20 unplanned</text>
    </g>

    <text x="440" y="368" font-size="13" fill="#40566b">Compute the metrics from deployment records per service, then watch the trend instead of setting targets.</text>
  </g>
</svg>
