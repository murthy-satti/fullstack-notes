<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="nga-title nga-desc">
  <title id="nga-title">NAT gateway and its cheaper alternatives</title>
  <desc id="nga-desc">TaskFlow API tasks in a private subnet of a VPC in us-east-1 reach four kinds of destination through four paths, with November 2026 list prices. Through a NAT gateway, at $0.045 per hour plus $0.045 per GB processed, to third-party APIs on the IPv4 internet. Through an S3 gateway endpoint, at no charge, to S3 and DynamoDB. Through interface endpoints (PrivateLink), at $0.01 per hour per zone plus $0.01 per GB, to AWS service APIs such as ECR, CloudWatch Logs, and Secrets Manager. Through an egress-only internet gateway, with no gateway charge and only normal data transfer, to the IPv6 internet. A summary box says one terabyte a month sent to S3 costs $46.08 in NAT processing through the NAT gateway and nothing through the gateway endpoint.</desc>
  <defs>
    <marker id="nga-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e">Four ways out of a private subnet (us-east-1, Nov 2026 list prices)</text>

    <rect x="20" y="52" width="610" height="352" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="32" y="70" font-size="11.5" fill="#40566b" text-anchor="start">VPC</text>
    <rect x="36" y="168" width="250" height="120" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="48" y="186" font-size="11.5" fill="#40566b" text-anchor="start">private subnet</text>
    <rect x="66" y="204" width="190" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="161" y="231" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="161" y="250" font-size="11.5" fill="#66400f">tasks (no public IPs)</text>

    <g stroke-width="2">
      <rect x="370" y="74" width="230" height="60" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="370" y="160" width="230" height="60" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="370" y="246" width="230" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="370" y="332" width="230" height="60" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="13.5" font-weight="700">
      <text x="485" y="99" fill="#6e2a24">NAT gateway</text>
      <text x="485" y="185" fill="#294a2e">S3 gateway endpoint</text>
      <text x="485" y="271" fill="#463365">Interface endpoints</text>
      <text x="485" y="357" fill="#294a2e">Egress-only IGW (IPv6)</text>
    </g>
    <g font-size="11.5">
      <text x="485" y="119" fill="#6e2a24">$0.045/h + $0.045/GB processed</text>
      <text x="485" y="205" fill="#294a2e">no charge</text>
      <text x="485" y="291" fill="#463365">$0.01/h per zone + $0.01/GB</text>
      <text x="485" y="377" fill="#294a2e">no gateway charge; transfer applies</text>
    </g>

    <g stroke-width="2">
      <rect x="660" y="74" width="180" height="60" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="160" width="180" height="60" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="246" width="180" height="60" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="332" width="180" height="60" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="13" font-weight="700" fill="#263e5a">
      <text x="750" y="99">Third-party APIs</text>
      <text x="750" y="185">S3, DynamoDB</text>
      <text x="750" y="271">AWS service APIs</text>
      <text x="750" y="357">IPv6 internet</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="750" y="119">IPv4 internet</text>
      <text x="750" y="205">same region</text>
      <text x="750" y="291">ECR, Logs, Secrets Mgr</text>
      <text x="750" y="377">outbound only</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M256 220C310 220 318 104 368 104" marker-end="url(#nga-arrow)"/>
      <path d="M256 230C310 230 318 190 368 190" marker-end="url(#nga-arrow)"/>
      <path d="M256 242C310 242 318 276 368 276" marker-end="url(#nga-arrow)"/>
      <path d="M256 252C310 252 318 362 368 362" marker-end="url(#nga-arrow)"/>
      <path d="M600 104H658" marker-end="url(#nga-arrow)"/>
      <path d="M600 190H658" marker-end="url(#nga-arrow)"/>
      <path d="M600 276H658" marker-end="url(#nga-arrow)"/>
      <path d="M600 362H658" marker-end="url(#nga-arrow)"/>
    </g>

    <rect x="120" y="420" width="620" height="38" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="430" y="444" font-size="12.5" font-weight="700" fill="#294a2e">1 TB a month to S3: $46.08 of NAT processing, or $0 through the gateway endpoint</text>

    <text x="430" y="484" font-size="13" fill="#40566b">Route AWS-service traffic around the NAT gateway; keep NAT for the real internet.</text>
  </g>
</svg>
