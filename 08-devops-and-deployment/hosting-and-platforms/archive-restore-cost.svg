<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="arc-title arc-desc">
  <title id="arc-title">Yearly cost of keeping 5 TB with one full restore</title>
  <desc id="arc-desc">Horizontal stacked bars for ten options, each split into twelve months of storage and the cost of one full restore, with the time to get the data back on the right. Prices are US list prices from November 2026. S3 Standard: $1,413, all storage, immediate. S3 Standard-IA: $819, immediate. Cloudflare R2 Infrequent Access: $667, immediate. Wasabi: $479, all storage, immediate. Backblaze B2: $417, all storage, immediate. S3 Glacier Instant Retrieval: $399, of which $154 is the restore, immediate. Google Cloud Archive: $330, of which $256 is the restore, immediate. S3 Glacier Flexible Retrieval with bulk restore: $233, 5 to 12 hours. Azure Archive with standard rehydration: $166, hours per blob and days in bulk. S3 Glacier Deep Archive with bulk restore: $86, within 48 hours.</desc>
  <rect width="860" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="26" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">5 TB kept for 12 months with one full restore (US list prices, Nov 2026)</text>
    <rect x="290" y="38" width="14" height="14" rx="3" fill="#4774aa"/>
    <text x="310" y="50" font-size="12" fill="#36424e">12 months of storage</text>
    <rect x="450" y="38" width="14" height="14" rx="3" fill="#bd7a20"/>
    <text x="470" y="50" font-size="12" fill="#36424e">one full restore (retrieval, requests, temporary copy)</text>
    <text x="712" y="70" font-size="12" font-weight="700" fill="#40566b">time to data</text>

    <g stroke="#c9d1db" stroke-width="1" stroke-dasharray="3 4">
      <path d="M415 76V428M540 76V428"/>
    </g>
    <path d="M290 76V428" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="290" y="444">$0</text>
      <text x="415" y="444">$500</text>
      <text x="540" y="444">$1,000</text>
    </g>

    <g font-size="12.5" fill="#36424e" text-anchor="end">
      <text x="280" y="97">S3 Standard</text>
      <text x="280" y="133">S3 Standard-IA</text>
      <text x="280" y="169">R2 Infrequent Access</text>
      <text x="280" y="205">Wasabi</text>
      <text x="280" y="241">Backblaze B2</text>
      <text x="280" y="277">S3 Glacier Instant Retrieval</text>
      <text x="280" y="313">Google Cloud Archive</text>
      <text x="280" y="349">S3 Glacier Flexible, bulk</text>
      <text x="280" y="385">Azure Archive, standard</text>
      <text x="280" y="421">S3 Deep Archive, bulk</text>
    </g>

    <g fill="#4774aa">
      <rect x="290" y="81" width="353.3" height="22"/>
      <rect x="290" y="117" width="192" height="22"/>
      <rect x="290" y="153" width="153.6" height="22"/>
      <rect x="290" y="189" width="119.9" height="22"/>
      <rect x="290" y="225" width="104.3" height="22"/>
      <rect x="290" y="261" width="61.4" height="22"/>
      <rect x="290" y="297" width="18.4" height="22"/>
      <rect x="290" y="333" width="55.3" height="22"/>
      <rect x="290" y="369" width="15.2" height="22"/>
      <rect x="290" y="405" width="15.2" height="22"/>
    </g>
    <g fill="#bd7a20">
      <rect x="482" y="117" width="12.8" height="22"/>
      <rect x="443.6" y="153" width="13" height="22"/>
      <rect x="351.4" y="261" width="38.4" height="22"/>
      <rect x="308.4" y="297" width="64.1" height="22"/>
      <rect x="345.3" y="333" width="2.9" height="22"/>
      <rect x="305.2" y="369" width="26.2" height="22"/>
      <rect x="305.2" y="405" width="6.2" height="22"/>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="651" y="97">$1,413</text>
      <text x="503" y="133">$819</text>
      <text x="465" y="169">$667</text>
      <text x="418" y="205">$479</text>
      <text x="403" y="241">$417</text>
      <text x="398" y="277">$399</text>
      <text x="381" y="313">$330</text>
      <text x="357" y="349">$233</text>
      <text x="340" y="385">$166</text>
      <text x="320" y="421">$86</text>
    </g>
    <g font-size="11.5" fill="#294a2e">
      <text x="712" y="97">immediate</text>
      <text x="712" y="133">immediate</text>
      <text x="712" y="169">immediate</text>
      <text x="712" y="205">immediate</text>
      <text x="712" y="241">immediate</text>
      <text x="712" y="277">immediate</text>
      <text x="712" y="313">immediate</text>
    </g>
    <g font-size="11.5" fill="#6e2a24">
      <text x="712" y="349">5 to 12 hours</text>
      <text x="712" y="385">hours to days</text>
      <text x="712" y="421">within 48 hours</text>
    </g>

    <text x="430" y="482" font-size="13" fill="#40566b" text-anchor="middle">Archive tiers win when restores are rare and slow restores are acceptable; retrieval fees can flip the order.</text>
  </g>
</svg>
