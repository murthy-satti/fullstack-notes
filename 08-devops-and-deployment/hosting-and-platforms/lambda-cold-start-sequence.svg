<svg xmlns="http://www.w3.org/2000/svg" width="860" height="492" viewBox="0 0 860 492" role="img" aria-labelledby="lcs-title lcs-desc">
  <title id="lcs-title">A cold start and a warm invocation on AWS Lambda</title>
  <desc id="lcs-desc">Cold path: 1, the client sends GET /tasks/42 to the function URL. Lambda finds no free execution environment, so 2, it creates a Firecracker microVM and loads the code. The INIT phase starts the Node runtime and runs module-scope code: 3, the environment connects to MongoDB and 4, the connection is ready. 5, Lambda invokes the handler, which 6 runs findOne and 7 receives the document; 8, the result returns to Lambda and the 200 response reaches the client, slowed by the cold start. Warm path: 9, the next request GET /tasks/43 arrives; 10, Lambda invokes the same warm environment and INIT is skipped; 11, the handler runs findOne on the reused connection and 12 receives the document; the fast 200 response returns to the client.</desc>
  <defs>
    <marker id="lcs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lcs-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="492" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="16" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="43" font-size="14" font-weight="700" fill="#66400f">Client</text>
    <rect x="260" y="16" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="330" y="35" font-size="14" font-weight="700" fill="#463365">Lambda service</text>
    <text x="330" y="51" font-size="11" fill="#463365">function URL</text>
    <rect x="470" y="16" width="180" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="560" y="35" font-size="14" font-weight="700" fill="#263e5a">Execution environment</text>
    <text x="560" y="51" font-size="11" fill="#263e5a">Firecracker microVM</text>
    <rect x="690" y="16" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="760" y="43" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 60V452"/>
      <path d="M330 60V452"/>
      <path d="M560 60V452"/>
      <path d="M760 60V452"/>
    </g>

    <rect x="548" y="146" width="24" height="60" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="24" y="86" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Cold</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 96H328" marker-end="url(#lcs-arrow)"/>
      <path d="M330 136H546" marker-end="url(#lcs-arrow)"/>
      <path d="M572 166H758" marker-end="url(#lcs-arrow)"/>
      <path d="M330 224H558" marker-end="url(#lcs-arrow)"/>
      <path d="M560 244H758" marker-end="url(#lcs-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M760 190H574" marker-end="url(#lcs-arrow-ret)"/>
      <path d="M760 266H562" marker-end="url(#lcs-arrow-ret)"/>
      <path d="M560 288H332" marker-end="url(#lcs-arrow-ret)"/>
      <path d="M330 308H112" marker-end="url(#lcs-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="220" y="89">1. GET /tasks/42</text>
      <rect x="266" y="108" width="128" height="14" fill="#f5f7fb"/>
      <text x="330" y="119">no free environment</text>
      <text x="438" y="129">2. create microVM, load code</text>
      <text x="665" y="159">3. connect (module scope)</text>
      <text x="665" y="183">4. connected</text>
      <text x="444" y="217">5. invoke handler</text>
      <text x="660" y="237">6. findOne</text>
      <text x="660" y="259">7. document</text>
      <text x="446" y="281">8. result</text>
      <text x="220" y="301">200, slow: includes INIT</text>
    </g>
    <text x="600" y="214" font-size="11" font-weight="700" fill="#463365" text-anchor="start">INIT</text>

    <path d="M24 330H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="352" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Warm</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 364H328" marker-end="url(#lcs-arrow)"/>
      <path d="M330 386H558" marker-end="url(#lcs-arrow)"/>
      <path d="M560 404H758" marker-end="url(#lcs-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M760 424H562" marker-end="url(#lcs-arrow-ret)"/>
      <path d="M560 444H112" marker-end="url(#lcs-arrow-ret)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="220" y="357">9. GET /tasks/43</text>
      <text x="444" y="379">10. invoke, INIT skipped</text>
      <text x="660" y="397">11. findOne (reused)</text>
      <text x="660" y="417">12. document</text>
    </g>
    <text x="220" y="437" font-size="11.5" fill="#36424e">200, fast</text>

    <text x="430" y="478" font-size="13" fill="#40566b">Module-scope work runs once per environment; every concurrent burst pays it again.</text>
  </g>
</svg>
