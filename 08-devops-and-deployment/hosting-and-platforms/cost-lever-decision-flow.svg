<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-labelledby="cld-title cld-desc">
  <title id="cld-title">Which cost lever to pull first</title>
  <desc id="cld-desc">A decision flow that starts with the question which cost lever first. First: is a large share of spend untagged or unowned? Yes leads to attributing first: accounts per environment, cost allocation tags, and budgets. No leads to: are resources idle or oversized? Yes leads to cleaning up and rightsizing: delete, schedule, rightsize, Graviton, gp3. No leads to: is there a steady baseline for a year or more? Yes leads to committing to the baseline with Savings Plans, reservations, or committed use discounts. No leads to: is there interruptible work such as batch jobs, CI, or queue workers? Yes leads to Spot capacity, diversified across types and zones, with checkpoints. No leads to architecture levers: CDN, NAT endpoints, log volume, and lifecycle rules. A banner says to repeat monthly: inform, optimize, operate.</desc>
  <defs>
    <marker id="cld-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="14" width="300" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="37" font-size="13.5" font-weight="700" fill="#66400f">Which cost lever first?</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M100 110 250 70 400 110 250 150z"/>
      <path d="M100 210 250 170 400 210 250 250z"/>
      <path d="M100 310 250 270 400 310 250 350z"/>
      <path d="M100 410 250 370 400 410 250 450z"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="250" y="107">Much spend untagged</text>
      <text x="250" y="124">or unowned?</text>
      <text x="250" y="207">Idle or oversized</text>
      <text x="250" y="224">resources?</text>
      <text x="250" y="307">Steady baseline for</text>
      <text x="250" y="324">a year or more?</text>
      <text x="250" y="407">Interruptible work</text>
      <text x="250" y="424">(batch, CI, workers)?</text>
    </g>

    <g stroke-width="2">
      <rect x="480" y="82" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="182" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="282" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="382" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="70" y="480" width="360" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="13.5" font-weight="700">
      <text x="660" y="105" fill="#263e5a">Attribute first</text>
      <text x="660" y="205" fill="#263e5a">Clean up and rightsize</text>
      <text x="660" y="305" fill="#263e5a">Commit to the baseline</text>
      <text x="660" y="405" fill="#263e5a">Use Spot capacity</text>
      <text x="250" y="503" fill="#294a2e">Architecture levers</text>
    </g>
    <g font-size="11.5">
      <text x="660" y="125" fill="#263e5a">accounts per env, cost allocation tags, budgets</text>
      <text x="660" y="225" fill="#263e5a">delete, schedule, rightsize, Graviton, gp3</text>
      <text x="660" y="325" fill="#263e5a">Savings Plans, reservations, CUDs</text>
      <text x="660" y="425" fill="#263e5a">diversify types and zones, checkpoint</text>
      <text x="250" y="523" fill="#294a2e">CDN, NAT endpoints, log volume, lifecycle rules</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M250 50V68" marker-end="url(#cld-arrow)"/>
      <path d="M400 110H478" marker-end="url(#cld-arrow)"/>
      <path d="M250 150V168" marker-end="url(#cld-arrow)"/>
      <path d="M400 210H478" marker-end="url(#cld-arrow)"/>
      <path d="M250 250V268" marker-end="url(#cld-arrow)"/>
      <path d="M400 310H478" marker-end="url(#cld-arrow)"/>
      <path d="M250 350V368" marker-end="url(#cld-arrow)"/>
      <path d="M400 410H478" marker-end="url(#cld-arrow)"/>
      <path d="M250 450V478" marker-end="url(#cld-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#294a2e">
      <text x="439" y="103">yes</text>
      <text x="439" y="203">yes</text>
      <text x="439" y="303">yes</text>
      <text x="439" y="403">yes</text>
    </g>
    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="258" y="164">no</text>
      <text x="258" y="264">no</text>
      <text x="258" y="364">no</text>
      <text x="258" y="468">no</text>
    </g>

    <rect x="70" y="556" width="770" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="455" y="578" font-size="12.5" font-weight="700" fill="#463365">Repeat every month: inform (allocate, report), optimize, operate (budgets, policies, reviews).</text>

    <text x="430" y="622" font-size="13" fill="#40566b">Attribute, clean up, then commit; architecture fixes the rest.</text>
  </g>
</svg>
