<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-labelledby="vhd-title vhd-desc">
  <title id="vhd-title">Choosing where to host video</title>
  <desc id="vhd-desc">A decision flow that starts with the question where should this video live. First: is it public marketing or tutorial video? Yes leads to YouTube or Vimeo, for free reach with their player and branding. No leads to: is live streaming needed? Yes leads to a managed live service: Amazon IVS, Cloudflare Stream Live, or Mux live. No means an on-demand library, followed by: is it a small team or a team without video expertise? Yes leads to a managed video platform: Mux, Cloudflare Stream, or Bunny Stream. No leads to: must the files stay in your own cloud account? Yes leads to building on AWS with S3, MediaConvert, CloudFront, and signed URLs. No leads to comparing Bunny Stream with a do-it-yourself build using flat-rate CDN pricing, on delivery cost.</desc>
  <defs>
    <marker id="vhd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="14" width="300" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="37" font-size="13.5" font-weight="700" fill="#66400f">Where should this video live?</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M100 110 250 70 400 110 250 150z"/>
      <path d="M100 210 250 170 400 210 250 250z"/>
      <path d="M100 360 250 320 400 360 250 400z"/>
      <path d="M100 460 250 420 400 460 250 500z"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="250" y="107">Public marketing or</text>
      <text x="250" y="124">tutorial video?</text>
      <text x="250" y="207">Live streaming</text>
      <text x="250" y="224">needed?</text>
      <text x="250" y="357">Small team or no</text>
      <text x="250" y="374">video expertise?</text>
      <text x="250" y="457">Files must stay in</text>
      <text x="250" y="474">your own account?</text>
    </g>

    <rect x="150" y="268" width="200" height="32" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="250" y="289" font-size="13" font-weight="700" fill="#263e5a">On-demand library</text>

    <g stroke-width="2">
      <rect x="480" y="82" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="182" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="332" width="360" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="480" y="432" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="70" y="530" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="13.5" font-weight="700">
      <text x="660" y="105" fill="#263e5a">YouTube or Vimeo</text>
      <text x="660" y="205" fill="#263e5a">Managed live service</text>
      <text x="660" y="355" fill="#294a2e">Managed video platform</text>
      <text x="660" y="455" fill="#263e5a">Build it on AWS</text>
      <text x="250" y="553" fill="#263e5a">Compare on delivery cost</text>
    </g>
    <g font-size="11.5">
      <text x="660" y="125" fill="#263e5a">free reach, their player and branding</text>
      <text x="660" y="225" fill="#263e5a">Amazon IVS, Cloudflare Stream Live, Mux live</text>
      <text x="660" y="375" fill="#294a2e">Mux, Cloudflare Stream, or Bunny Stream</text>
      <text x="660" y="475" fill="#263e5a">S3 + MediaConvert + CloudFront, signed URLs</text>
      <text x="250" y="573" fill="#263e5a">Bunny Stream vs DIY with flat-rate CDN pricing</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M250 50V68" marker-end="url(#vhd-arrow)"/>
      <path d="M400 110H478" marker-end="url(#vhd-arrow)"/>
      <path d="M250 150V168" marker-end="url(#vhd-arrow)"/>
      <path d="M400 210H478" marker-end="url(#vhd-arrow)"/>
      <path d="M250 250V266" marker-end="url(#vhd-arrow)"/>
      <path d="M250 300V318" marker-end="url(#vhd-arrow)"/>
      <path d="M400 360H478" marker-end="url(#vhd-arrow)"/>
      <path d="M250 400V418" marker-end="url(#vhd-arrow)"/>
      <path d="M400 460H478" marker-end="url(#vhd-arrow)"/>
      <path d="M250 500V528" marker-end="url(#vhd-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#294a2e">
      <text x="439" y="103">yes</text>
      <text x="439" y="203">yes</text>
      <text x="439" y="353">yes</text>
      <text x="439" y="453">yes</text>
    </g>
    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="258" y="164">no</text>
      <text x="258" y="262">no</text>
      <text x="258" y="414">no</text>
      <text x="258" y="518">no</text>
    </g>

    <text x="430" y="622" font-size="13" fill="#40566b">Buy the pipeline unless video is your product or your volume is large and steady.</text>
  </g>
</svg>
