<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="fhc-title fhc-desc">
  <title id="fhc-title">Monthly cost of hosting TaskFlow Web at 50 million and 1 million page views</title>
  <desc id="fhc-desc">Horizontal bars show the monthly cost at 50 million page views, which is 25,000 GB and 500 million CDN requests, at US list prices in November 2026. Cloudflare static assets cost $0. DigitalOcean App Platform about $466. CloudFront flat-rate Premium plan $1,000. S3 with CloudFront pay-as-you-go about $2,454. Firebase Hosting about $3,748. Render about $3,749. Amplify Hosting about $3,751. Netlify credit plans about $4,010. Vercel Pro with usage-based CDN billing about $4,750. Azure Static Web Apps about $4,989. A side column gives the same hosts at 1 million page views: Cloudflare $0, DigitalOcean $9, CloudFront flat-rate $15, CloudFront pay-as-you-go $0, Firebase $73, Render $74, Amplify $76, Netlify $90, Vercel $40 (Pro plus the $20 Flat Rate CDN tier), Azure $89. Bars for hosts that sell CDN capacity directly are blue; bars for platforms that resell transfer are purple.</desc>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">TaskFlow Web: monthly cost at US list prices (November 2026)</text>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="220" y="58">50M page views: 25,000 GB and 500M requests</text>
      <text x="830" y="58" text-anchor="end">1M views</text>
    </g>
    <path d="M740 44V368" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="12" fill="#36424e" text-anchor="end">
      <text x="210" y="88">Cloudflare static assets</text>
      <text x="210" y="116">DigitalOcean App Platform</text>
      <text x="210" y="144">CloudFront flat-rate</text>
      <text x="210" y="172">S3 + CloudFront (PAYG)</text>
      <text x="210" y="200">Firebase Hosting</text>
      <text x="210" y="228">Render static</text>
      <text x="210" y="256">Amplify Hosting</text>
      <text x="210" y="284">Netlify (credits)</text>
      <text x="210" y="312">Vercel Pro</text>
      <text x="210" y="340">Azure Static Web Apps</text>
    </g>

    <path d="M220 70V352" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke-width="1.5">
      <rect x="220" y="104" width="36" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="220" y="132" width="76" height="16" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="220" y="160" width="187" height="16" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="220" y="188" width="286" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="220" y="216" width="286" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="220" y="244" width="286" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="220" y="272" width="306" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="220" y="300" width="362" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="220" y="328" width="380" height="16" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="228" y="88" fill="#294a2e">$0 (static requests and transfer not billed)</text>
      <text x="264" y="116">~$466</text>
      <text x="304" y="144">$1,000 (Premium plan)</text>
      <text x="415" y="172">~$2,454</text>
      <text x="514" y="200">~$3,748</text>
      <text x="514" y="228">~$3,749</text>
      <text x="514" y="256">~$3,751</text>
      <text x="534" y="284">~$4,010</text>
      <text x="590" y="312">~$4,750</text>
      <text x="608" y="340">~$4,989</text>
    </g>

    <g font-size="12" fill="#36424e" text-anchor="end">
      <text x="830" y="88">$0</text>
      <text x="830" y="116">~$9</text>
      <text x="830" y="144">$15</text>
      <text x="830" y="172">$0</text>
      <text x="830" y="200">~$73</text>
      <text x="830" y="228">~$74</text>
      <text x="830" y="256">~$76</text>
      <text x="830" y="284">~$90</text>
      <text x="830" y="312">$40</text>
      <text x="830" y="340">$89</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <rect x="220" y="376" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="240" y="388">CDN bought directly</text>
      <rect x="400" y="376" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="420" y="388">platform reselling transfer</text>
    </g>
    <text x="430" y="424" font-size="13" fill="#40566b" text-anchor="middle">Below a million views the gap is tens of dollars; at 25 TB the per-GB price decides the bill.</text>
  </g>
</svg>
