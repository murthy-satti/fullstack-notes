<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="tgt-title tgt-desc">
  <title id="tgt-title">A target tracking scaling loop with numbers</title>
  <desc id="tgt-desc">An Application Load Balancer receives 15,000 requests per minute and reports the RequestCountPerTarget metric to CloudWatch every minute. The target tracking policy has a target of 1,000 requests per target per minute; the metric is 1,500 because 10 instances share the load, so the alarm fires. The policy sets the Auto Scaling group's desired capacity from 10 to 15. The group launches 5 instances from launch template version 7, which holds the golden AMI and user data, and registers them with the load balancer's target group. In numbers: 15,000 requests over 10 instances is 1,500 per target; capacity needed is about 10 times 1,500 divided by 1,000, which is 15 instances, inside the group's minimum of 6 and maximum of 40. After the new instances finish warming up, 15,000 requests over 15 instances is 1,000 per target, on target. At night, traffic of 4,000 requests per minute would need only 4 instances, but the minimum size keeps 6, and the maximum of 40 caps a runaway scale-out.</desc>
  <defs>
    <marker id="tgt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="tgt-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="200" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="124" y="63" font-size="13.5" font-weight="700" fill="#263e5a">Load balancer</text>
    <text x="124" y="82" font-size="11.5" fill="#263e5a">15,000 requests/min</text>

    <rect x="270" y="40" width="200" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="370" y="63" font-size="13.5" font-weight="700" fill="#463365">CloudWatch metric</text>
    <text x="370" y="82" font-size="11.5" fill="#463365">RequestCountPerTarget</text>

    <rect x="270" y="200" width="200" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="370" y="223" font-size="13.5" font-weight="700" fill="#463365">Target tracking policy</text>
    <text x="370" y="242" font-size="11.5" fill="#463365">target 1,000 per target</text>

    <rect x="24" y="200" width="200" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="124" y="223" font-size="13.5" font-weight="700" fill="#66400f">Auto Scaling group</text>
    <text x="124" y="242" font-size="11.5" fill="#66400f">desired 10 → 15</text>

    <rect x="24" y="332" width="446" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="247" y="353" font-size="13" font-weight="700" fill="#36424e">Launch template version 7</text>
    <text x="247" y="371" font-size="11.5" fill="#36424e">golden AMI, instance type, user data, IAM role</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M224 69H268" marker-end="url(#tgt-arrow)"/>
      <path d="M370 98V198" marker-end="url(#tgt-arrow)"/>
      <path d="M270 229H226" marker-end="url(#tgt-arrow)"/>
      <path d="M124 200V100" marker-end="url(#tgt-arrow)"/>
    </g>
    <path d="M124 330V260" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tgt-arrow-ret)"/>
    <g font-size="11.5" fill="#36424e">
      <text x="246" y="32">each minute</text>
      <text x="378" y="146" text-anchor="start">1,500 &gt; 1,000:</text>
      <text x="378" y="162" text-anchor="start">alarm fires</text>
      <text x="248" y="222">set</text>
      <text x="116" y="146" text-anchor="end">launch 5,</text>
      <text x="116" y="162" text-anchor="end">register targets</text>
      <text x="132" y="300" text-anchor="start">instances built from it</text>
    </g>

    <rect x="494" y="40" width="342" height="344" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="510" y="64" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">The arithmetic</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="510" y="90">now: 15,000 requests/min over 10 instances</text>
      <text x="510" y="108">= 1,500 per target (target: 1,000)</text>
      <text x="510" y="134" font-weight="700" fill="#263e5a">needed ≈ 10 × 1,500 / 1,000 = 15 instances</text>
      <text x="510" y="152">within min size 6 and max size 40: scale to 15</text>
      <text x="510" y="186" font-weight="700" fill="#294a2e">after the new instances warm up</text>
      <text x="510" y="204">15,000 / 15 = 1,000 per target: on target,</text>
      <text x="510" y="222">no further change</text>
      <text x="510" y="256" font-weight="700" fill="#66400f">at night: 4,000 requests/min</text>
      <text x="510" y="274">4,000 / 1,000 = 4 instances, but min size</text>
      <text x="510" y="292">keeps 6, and scale-in happens gradually</text>
      <text x="510" y="326" font-weight="700" fill="#6e2a24">cost guard</text>
      <text x="510" y="344">max size 40 stops a retry storm or bot</text>
      <text x="510" y="362">flood from launching hundreds of instances</text>
    </g>

    <text x="430" y="416" font-size="11.5" fill="#36424e">The metric must fall as instances are added: requests per target and CPU do; latency and raw queue length do not.</text>
    <text x="430" y="452" font-size="13" fill="#40566b">Target tracking works like a thermostat: pick the metric and the value, and the group adjusts its size.</text>
  </g>
</svg>
