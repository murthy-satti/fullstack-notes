<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="dtf-title dtf-desc">
  <title id="dtf-title">Troubleshooting a name that does not resolve or resolves wrongly</title>
  <desc id="dtf-desc">A flowchart. Start: a name does not resolve, or resolves wrongly. Question 1: does an authoritative server give the right answer when asked directly with dig at the nameserver and norecurse? If no, fix the zone: a typo, a doubled name such as the zone appended twice, a CNAME conflict, or a missing record. If yes, question 2: does the delegation point at those servers, as dig +trace shows? If no, fix the nameservers at the registrar or the lame server. If yes, question 3: do validating resolvers fail while dig +cd works? If yes, it is a DNSSEC problem: the DS and DNSKEY disagree; check with delv or DNSViz. If no, question 4: do resolvers still serve the old answer, with TTL left in dig at a public resolver? If yes, the caches are stale: wait for the TTL or flush public caches. If no, DNS is fine: check TLS, the host configuration, firewalls, and the application.</desc>
  <defs>
    <marker id="dtf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="540" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="20" width="300" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="230" y="45" font-size="13" font-weight="700" fill="#66400f">Name fails or resolves wrongly</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M230 72 380 110 230 148 80 110z"/>
      <path d="M230 162 380 200 230 238 80 200z"/>
      <path d="M230 252 380 290 230 328 80 290z"/>
      <path d="M230 342 380 380 230 418 80 380z"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="230" y="106">Authoritative answer right?</text>
      <text x="230" y="196">Delegation points there?</text>
      <text x="230" y="286">Validating resolvers fail?</text>
      <text x="230" y="376">Resolvers serve old data?</text>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="230" y="122">dig @ns name +norecurse</text>
      <text x="230" y="212">dig +trace name</text>
      <text x="230" y="302">and dig +cd works</text>
      <text x="230" y="392">TTL left at 1.1.1.1</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M230 60V70" marker-end="url(#dtf-arrow)"/>
      <path d="M230 148V160" marker-end="url(#dtf-arrow)"/>
      <path d="M230 238V250" marker-end="url(#dtf-arrow)"/>
      <path d="M230 328V340" marker-end="url(#dtf-arrow)"/>
      <path d="M230 418V446" marker-end="url(#dtf-arrow)"/>
      <path d="M380 110H468" marker-end="url(#dtf-arrow)"/>
      <path d="M380 200H468" marker-end="url(#dtf-arrow)"/>
      <path d="M380 290H468" marker-end="url(#dtf-arrow)"/>
      <path d="M380 380H468" marker-end="url(#dtf-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="248" y="158" text-anchor="start">yes</text>
      <text x="248" y="248" text-anchor="start">yes</text>
      <text x="248" y="338" text-anchor="start">no</text>
      <text x="248" y="436" text-anchor="start">no</text>
      <text x="424" y="104">no</text>
      <text x="424" y="194">no</text>
      <text x="424" y="284">yes</text>
      <text x="424" y="374">yes</text>
    </g>

    <g stroke-width="2">
      <rect x="470" y="82" width="386" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="470" y="172" width="386" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="470" y="262" width="386" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="470" y="352" width="386" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="663" y="105" fill="#6e2a24">Fix the zone</text>
      <text x="663" y="195" fill="#6e2a24">Fix the delegation</text>
      <text x="663" y="285" fill="#6e2a24">DNSSEC problem</text>
      <text x="663" y="375" fill="#66400f">Caches are stale</text>
    </g>
    <g font-size="11.5">
      <text x="663" y="124" fill="#6e2a24">typo, doubled name, CNAME conflict, missing record</text>
      <text x="663" y="214" fill="#6e2a24">nameservers at the registrar, or a lame server</text>
      <text x="663" y="304" fill="#6e2a24">DS and DNSKEY disagree: check with delv or DNSViz</text>
      <text x="663" y="394" fill="#66400f">wait for the TTL or flush public caches</text>
    </g>

    <rect x="80" y="448" width="300" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="230" y="467" font-size="13" font-weight="700" fill="#294a2e">DNS is fine</text>
    <text x="230" y="484" font-size="11.5" fill="#294a2e">check TLS, host config, firewall, app</text>

    <text x="440" y="524" font-size="13" fill="#40566b">Work outward from the zone: answer, delegation, DNSSEC, caches; then leave DNS.</text>
  </g>
</svg>
