<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="cdo-title cdo-desc">
  <title id="cdo-title">Onboarding a custom domain on a hosting platform</title>
  <desc id="cdo-desc">A sequence between you, the DNS host, the hosting platform, and the certificate authority. 1, you add app.example.com in the platform's dashboard. 2, the platform tells you which records to create: a CNAME to its hostname and a verification TXT record if it needs one. 3, you create the records at the DNS host. 4, the platform polls DNS until both records resolve. 5, the platform orders a certificate for app.example.com from the CA. 6a, the CA looks up the CAA records at the DNS host. 6b, the CA performs an HTTP-01 check, which now reaches the platform through the CNAME. 7, the CA issues the certificate. 8, the platform serves app.example.com over HTTPS and renews the certificate by itself. Wildcard names need the DNS-01 challenge instead, so the platform needs your nameservers or a delegated _acme-challenge name.</desc>
  <defs>
    <marker id="cdo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cdo-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="452" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="47" font-size="14" font-weight="700" fill="#66400f">You</text>
    <rect x="255" y="20" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="330" y="47" font-size="14" font-weight="700" fill="#263e5a">DNS host</text>
    <rect x="485" y="20" width="150" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="560" y="47" font-size="13" font-weight="700" fill="#463365">Hosting platform</text>
    <rect x="706" y="20" width="150" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="781" y="47" font-size="14" font-weight="700" fill="#294a2e">Certificate CA</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M99 64V370"/>
      <path d="M330 64V370"/>
      <path d="M560 64V370"/>
      <path d="M781 64V370"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M99 96H558" marker-end="url(#cdo-arrow)"/>
      <path d="M99 156H328" marker-end="url(#cdo-arrow)"/>
      <path d="M560 186H332" marker-end="url(#cdo-arrow)"/>
      <path d="M560 216H779" marker-end="url(#cdo-arrow)"/>
      <path d="M781 246H332" marker-end="url(#cdo-arrow)"/>
      <path d="M781 276H562" marker-end="url(#cdo-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M560 126H101" marker-end="url(#cdo-arrow-ret)"/>
      <path d="M781 306H562" marker-end="url(#cdo-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="330" y="90">1. add app.example.com to the project</text>
      <text x="330" y="120">2. create a CNAME (and a verification TXT if asked)</text>
      <text x="214" y="150">3. create the records</text>
      <text x="445" y="180">4. poll until both resolve</text>
      <text x="670" y="210">5. order a certificate</text>
      <text x="445" y="240">6a. look up CAA</text>
      <text x="670" y="270">6b. HTTP-01 via the CNAME</text>
      <text x="670" y="300">7. certificate issued</text>
    </g>

    <rect x="460" y="326" width="200" height="30" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="560" y="346" font-size="12" font-weight="700" fill="#294a2e">8. serves HTTPS, renews</text>

    <text x="440" y="408" font-size="13" fill="#40566b">The platform issues and renews certificates; you own the DNS records and a CAA set that allows its CA.</text>
    <text x="440" y="428" font-size="13" fill="#40566b">Wildcard names need DNS-01: give the platform your nameservers or delegate _acme-challenge.</text>
  </g>
</svg>
