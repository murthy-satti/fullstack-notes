<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="cka-title cka-desc">
  <title id="cka-title">What goes into a CDN cache key</title>
  <desc id="cka-desc">A request: GET https://www.example.com/api/public/templates?page=2&amp;utm_source=newsletter with the headers Accept-Encoding br, Accept-Language en, a session Cookie, and an Authorization bearer token. Four outcomes. In the cache key: the host www.example.com, the path /api/public/templates, the query parameter page=2, and the normalized Accept-Encoding. Forwarded to the origin but not in the key: Accept-Language, which is safe only if the response does not depend on it. Dropped: utm_source=newsletter, so newsletter links share one cache entry. Never in a shared key: the Cookie and Authorization headers; per-user requests bypass the cache. The resulting key is www.example.com plus /api/public/templates plus page=2 plus br. A value in the key that the origin ignores only lowers the hit ratio; a value the origin uses but the key ignores serves the wrong content.</desc>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One request, and what the cache key keeps</text>

    <rect x="24" y="40" width="832" height="92" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="40" y="64" font-size="12.5" font-weight="700" fill="#66400f" text-anchor="start">GET https://www.example.com/api/public/templates?page=2&amp;utm_source=newsletter</text>
    <g font-size="11.5" fill="#66400f" text-anchor="start">
      <text x="40" y="90">Accept-Encoding: br</text>
      <text x="40" y="112">Accept-Language: en</text>
      <text x="300" y="90">Cookie: session=&lt;id&gt;</text>
      <text x="300" y="112">Authorization: Bearer &lt;token&gt;</text>
    </g>

    <rect x="24" y="152" width="196" height="132" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="236" y="152" width="196" height="132" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="448" y="152" width="196" height="132" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <rect x="660" y="152" width="196" height="132" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g font-size="13" font-weight="700">
      <text x="122" y="176" fill="#294a2e">In the cache key</text>
      <text x="334" y="176" fill="#463365">Forwarded only</text>
      <text x="546" y="176" fill="#36424e">Dropped</text>
      <text x="758" y="176" fill="#6e2a24">Never in a shared key</text>
    </g>
    <g font-size="11">
      <text x="122" y="200" fill="#294a2e">host: www.example.com</text>
      <text x="122" y="218" fill="#294a2e">path: /api/public/templates</text>
      <text x="122" y="236" fill="#294a2e">query: page=2</text>
      <text x="122" y="254" fill="#294a2e">Accept-Encoding, normalized</text>
      <text x="334" y="200" fill="#463365">Accept-Language</text>
      <text x="334" y="226" fill="#463365">safe only if the</text>
      <text x="334" y="242" fill="#463365">response does not</text>
      <text x="334" y="258" fill="#463365">depend on it</text>
      <text x="546" y="200" fill="#36424e">utm_source=newsletter</text>
      <text x="546" y="226" fill="#36424e">newsletter links</text>
      <text x="546" y="242" fill="#36424e">share one cache</text>
      <text x="546" y="258" fill="#36424e">entry</text>
      <text x="758" y="200" fill="#6e2a24">Cookie, Authorization</text>
      <text x="758" y="226" fill="#6e2a24">per-user requests</text>
      <text x="758" y="242" fill="#6e2a24">bypass the cache</text>
      <text x="758" y="258" fill="#6e2a24">entirely</text>
    </g>

    <rect x="140" y="304" width="600" height="40" rx="8" fill="#ffffff" stroke="#53845b" stroke-width="2"/>
    <text x="440" y="329" font-size="12.5" font-weight="700" fill="#294a2e">key = www.example.com + /api/public/templates + page=2 + br</text>

    <text x="440" y="378" font-size="13" fill="#40566b">A value in the key that the origin ignores only lowers the hit ratio.</text>
    <text x="440" y="398" font-size="13" fill="#40566b">A value the origin uses but the key ignores serves the wrong content.</text>
  </g>
</svg>
