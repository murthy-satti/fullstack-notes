<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="ocl-title ocl-desc">
  <title id="ocl-title">Origin cloaking: the edge must be the only way to reach the origin</title>
  <desc id="ocl-desc">Users send HTTPS requests to the CDN edge, which applies the WAF, DDoS protection, rate limits, and bot controls, and then forwards to the origin load balancer with a secret header. The origin is guarded in two ways: its security group allows only the edge's managed IP list, and its listener requires the secret header and otherwise returns a fixed 403. An attacker who found the origin's address and sends a direct request is dropped by the security group or refused with a 403. The best option is no public origin at all: with a CloudFront VPC origin or Cloudflare Tunnel, the origin has no public address to attack. Origin addresses leak through old DNS records, unproxied subdomains, mail headers, and certificate logs, so assume they are known.</desc>
  <defs>
    <marker id="ocl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ocl-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Origin cloaking: the edge must be the only way in</text>

    <rect x="24" y="56" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="75" font-size="12.5" font-weight="700" fill="#66400f">Users</text>
    <text x="99" y="91" font-size="11" fill="#66400f">browsers and apps</text>
    <rect x="230" y="50" width="220" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="340" y="73" font-size="12.5" font-weight="700" fill="#463365">CDN edge</text>
    <text x="340" y="90" font-size="11" fill="#463365">WAF, DDoS, rate limits, bots</text>
    <rect x="580" y="50" width="256" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="708" y="73" font-size="12.5" font-weight="700" fill="#263e5a">Origin load balancer</text>
    <text x="708" y="90" font-size="11" fill="#263e5a">TaskFlow API behind it</text>

    <rect x="580" y="140" width="256" height="74" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="708" y="160" font-size="12.5" font-weight="700" fill="#263e5a">Origin guards</text>
    <text x="708" y="180" font-size="11" fill="#263e5a">1. SG allows only the edge's IP list</text>
    <text x="708" y="198" font-size="11" fill="#263e5a">2. listener needs the secret header</text>
    <path d="M708 106V138" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="24" y="158" width="150" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="99" y="177" font-size="12.5" font-weight="700" fill="#6e2a24">Attacker</text>
    <text x="99" y="193" font-size="11" fill="#6e2a24">found the origin IP</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 78H228" marker-end="url(#ocl-arrow)"/>
      <path d="M450 78H578" marker-end="url(#ocl-arrow)"/>
    </g>
    <path d="M174 180H578" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#ocl-arrow-red)"/>
    <g font-size="11" fill="#36424e">
      <text x="201" y="70">HTTPS</text>
      <text x="514" y="96">secret header</text>
    </g>
    <text x="376" y="172" font-size="11" fill="#6e2a24">direct request, skipping the edge</text>
    <text x="376" y="198" font-size="11" fill="#6e2a24">dropped by the SG, or a fixed 403</text>

    <rect x="230" y="242" width="606" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="533" y="263" font-size="12.5" font-weight="700" fill="#294a2e">Best: no public origin at all</text>
    <text x="533" y="281" font-size="11" fill="#294a2e">CloudFront VPC origin or Cloudflare Tunnel: the origin has no public address to attack</text>

    <text x="430" y="326" font-size="11" fill="#36424e">Origin addresses leak through old DNS records, unproxied subdomains, mail headers, and certificate logs: assume they are known.</text>
    <text x="430" y="362" font-size="13" fill="#40566b">If attackers can reach the origin directly, every protection at the edge is optional.</text>
  </g>
</svg>
