<svg xmlns="http://www.w3.org/2000/svg" width="860" height="464" viewBox="0 0 860 464" role="img" aria-labelledby="haf-title haf-desc">
  <title id="haf-title">An engineer signs in to production through SSO and receives short-lived credentials</title>
  <desc id="haf-desc">Four lifelines: the engineer on a laptop with the CLI, the corporate identity provider, IAM Identity Center, and the production account role ProdViewOnly. Step 1: the engineer runs aws sso login against the start URL. Step 2: the engineer signs in at the identity provider with MFA, preferably a passkey. Step 3: the identity provider sends IAM Identity Center a SAML assertion with the user's groups. Step 4: Identity Center maps the group to the ProdViewOnly permission set in the production account. Step 5: Identity Center returns temporary credentials valid for one hour. Step 6: the engineer's API calls to production are signed with those temporary credentials. Step 7: CloudTrail records each call with the user's identity. No long-lived keys exist, so removing the user in the identity provider ends access at the next sign-in.</desc>
  <defs>
    <marker id="haf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="haf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="464" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Human access to production: federated, MFA-protected, short-lived</text>

    <rect x="25" y="44" width="170" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="64" font-size="13" font-weight="700" fill="#66400f">Engineer</text>
    <text x="110" y="81" font-size="11" fill="#66400f">laptop and CLI</text>
    <rect x="255" y="44" width="170" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="340" y="64" font-size="13" font-weight="700" fill="#463365">Identity provider</text>
    <text x="340" y="81" font-size="11" fill="#463365">corporate IdP</text>
    <rect x="485" y="44" width="170" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="570" y="64" font-size="13" font-weight="700" fill="#463365">IAM Identity Center</text>
    <text x="570" y="81" font-size="11" fill="#463365">permission sets</text>
    <rect x="665" y="44" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="750" y="64" font-size="13" font-weight="700" fill="#263e5a">Production account</text>
    <text x="750" y="81" font-size="11" fill="#263e5a">ProdViewOnly role</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 92V420"/>
      <path d="M340 92V420"/>
      <path d="M570 92V420"/>
      <path d="M750 92V420"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 124H568" marker-end="url(#haf-arrow)"/>
      <path d="M110 164H338" marker-end="url(#haf-arrow)"/>
      <path d="M340 204H568" marker-end="url(#haf-arrow)"/>
      <path d="M110 336H748" marker-end="url(#haf-arrow)"/>
    </g>
    <path d="M570 296H112" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#haf-arrow-ret)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="225" y="117">1. aws sso login (start URL)</text>
      <text x="225" y="157">2. sign in with MFA (passkey)</text>
      <text x="455" y="197">3. SAML assertion with groups</text>
      <text x="222" y="289">5. temporary credentials (1 hour)</text>
    </g>
    <rect x="280" y="318" width="350" height="14" fill="#f5f7fb"/>
    <text x="455" y="329" font-size="11.5" fill="#36424e">6. API calls signed with the temporary credentials</text>

    <rect x="460" y="226" width="220" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="570" y="242" font-size="11" fill="#463365">4. map group to permission set:</text>
    <text x="570" y="258" font-size="11" fill="#463365">ProdViewOnly in production</text>
    <rect x="616" y="356" width="220" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="726" y="372" font-size="11" fill="#263e5a">7. CloudTrail records each call</text>
    <text x="726" y="388" font-size="11" fill="#263e5a">with the user's identity</text>

    <text x="430" y="448" font-size="13" fill="#40566b">No long-lived keys: removing the user in the IdP ends access at the next sign-in.</text>
  </g>
</svg>
