<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="plo-title plo-desc">
  <title id="plo-title">The layers of a TaskFlow deployment, who patches each one, and how</title>
  <desc id="plo-desc">Seven layers from top to bottom. Application dependencies, the npm packages in the lockfile, are patched by the team through a bot pull request, CI, and the normal deploy. The language runtime, Node.js 24 inside the image, is patched by the team by moving to a base image with the fixed Node release. Image OS packages, the Debian packages in node:24-slim, are patched by the team through scheduled rebuilds and digest-bump pull requests. The host OS, Ubuntu on virtual machines and worker nodes, is patched by the team with an image refresh or a patch service. The Kubernetes cluster, its version and node images, is shared: planned upgrades following the provider's releases. A dashed line marks the shared responsibility boundary. Below it, managed services such as MongoDB Atlas, load balancers, and caches are patched by the provider in a maintenance window you choose, and the hypervisor and hardware, the cloud's physical hosts, are patched by the provider and invisible to you.</desc>
