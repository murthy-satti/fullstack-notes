    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="236" y="78">npm packages in the lockfile</text>
      <text x="236" y="128">Node.js 24 inside the image</text>
      <text x="236" y="178">Debian packages, node:24-slim</text>
