<svg xmlns="http://www.w3.org/2000/svg" width="860" height="404" viewBox="0 0 860 404" role="img" aria-labelledby="crs-title crs-desc">
  <title id="crs-title">How OWASP CRS anomaly scoring decides to block or allow two requests</title>
  <desc id="crs-desc">Left, request A is an injection attempt: POST /api/tasks/search with the body {"q": "x' OR 1=1--"}. It matches rule 942100, SQL injection detected via libinjection, severity CRITICAL, which adds 5 points at paranoia level 1. The inbound anomaly score reaches 5, equal to the default threshold of 5, so the request is blocked with a 403 by rule 949110, inbound anomaly score exceeded. Right, request B is a script calling GET /api/tasks with no User-Agent header. At paranoia level 2 it matches rule 920320, Missing User Agent Header, severity NOTICE, which adds 2 points. The score of 2 stays below the threshold, so the request is allowed and logged. Paranoia level 1 is the default with few false positives; levels 2 to 4 add stricter rules and need more exclusions.</desc>
  <defs>
    <marker id="crs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="404" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">OWASP CRS anomaly scoring: matching rules add points, one threshold decides</text>
    <path d="M430 42V330" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="40" y="58" font-size="12.5" font-weight="700" fill="#6e2a24" text-anchor="start">Request A: injection attempt</text>
    <text x="460" y="58" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="start">Request B: script without a User-Agent</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="40" y="68" width="360" height="44" rx="8"/>
      <rect x="460" y="68" width="360" height="44" rx="8"/>
    </g>
    <text x="220" y="87" font-size="12.5" font-weight="700" fill="#66400f">POST /api/tasks/search</text>
    <text x="220" y="103" font-size="11" fill="#66400f">body: {"q": "x' OR 1=1--"}</text>
    <text x="640" y="87" font-size="12.5" font-weight="700" fill="#66400f">GET /api/tasks</text>
    <text x="640" y="103" font-size="11" fill="#66400f">no User-Agent header</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="40" y="134" width="360" height="44" rx="8"/>
      <rect x="460" y="134" width="360" height="44" rx="8"/>
    </g>
    <text x="220" y="153" font-size="12.5" font-weight="700" fill="#463365">942100: SQL injection (libinjection)</text>
    <text x="220" y="169" font-size="11" fill="#463365">severity CRITICAL: +5 (paranoia level 1)</text>
    <text x="640" y="153" font-size="12.5" font-weight="700" fill="#463365">920320: Missing User Agent Header</text>
    <text x="640" y="169" font-size="11" fill="#463365">severity NOTICE: +2 (paranoia level 2)</text>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="60" y="210">inbound anomaly score = 5</text>
      <text x="480" y="210">inbound anomaly score = 2</text>
    </g>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="60" y="218" width="320" height="20" rx="4"/>
      <rect x="480" y="218" width="320" height="20" rx="4"/>
    </g>
    <rect x="60" y="218" width="160" height="20" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="480" y="218" width="64" height="20" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="2" stroke-dasharray="4 3">
      <path d="M220 215V244"/>
      <path d="M640 215V244"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="60" y="256">0</text>
      <text x="220" y="256">threshold 5</text>
      <text x="380" y="256">10</text>
      <text x="480" y="256">0</text>
      <text x="640" y="256">threshold 5</text>
      <text x="800" y="256">10</text>
    </g>

    <rect x="40" y="282" width="360" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="220" y="301" font-size="12.5" font-weight="700" fill="#6e2a24">Blocked with 403</text>
    <text x="220" y="317" font-size="11" fill="#6e2a24">rule 949110: inbound anomaly score exceeded</text>
    <rect x="460" y="282" width="360" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="640" y="301" font-size="12.5" font-weight="700" fill="#294a2e">Allowed and logged</text>
    <text x="640" y="317" font-size="11" fill="#294a2e">below the threshold; fix the client later</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M220 112V132" marker-end="url(#crs-arrow)"/>
      <path d="M640 112V132" marker-end="url(#crs-arrow)"/>
      <path d="M220 178V196" marker-end="url(#crs-arrow)"/>
      <path d="M640 178V196" marker-end="url(#crs-arrow)"/>
      <path d="M220 262V280" marker-end="url(#crs-arrow)"/>
      <path d="M640 262V280" marker-end="url(#crs-arrow)"/>
    </g>

    <text x="430" y="356" font-size="11.5" fill="#36424e">Paranoia level 1 is the default, with few false positives; levels 2 to 4 add stricter rules and need more exclusions.</text>
    <text x="430" y="386" font-size="13" fill="#40566b">One critical match reaches the default threshold; low-severity oddities only add up.</text>
  </g>
</svg>
