<svg xmlns="http://www.w3.org/2000/svg" width="780" height="566" viewBox="0 0 780 566" role="img" aria-labelledby="ipe-title ipe-desc">
  <title id="ipe-title">How AWS evaluates a request against IAM policies</title>
  <desc id="ipe-desc">A request carries the principal, the action, the resource, and context such as source IP and MFA status. Check 1: is there an explicit Deny in any applicable policy, including SCPs, RCPs, identity-based, resource-based, permissions boundary, and session policies? If yes, the request is denied, because an explicit deny always wins. Check 2: if the account is in an organization, do the SCPs and RCPs allow it? If not, it is denied. Check 3: does an identity-based or a resource-based policy allow it? Within one account the union counts; across accounts both sides must allow. If not, it is denied by default. Check 4: if the principal has a permissions boundary, does the boundary allow it? Check 5: if the session was created with a session policy, does that policy allow it? Only when every check passes is the request allowed.</desc>
  <defs>
    <marker id="ipe-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ipe-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="780" height="566" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One request, checked in order (single account, simplified)</text>

    <rect x="40" y="48" width="400" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="240" y="67" font-size="13" font-weight="700" fill="#66400f">Request</text>
    <text x="240" y="84" font-size="11" fill="#66400f">principal, action, resource, and context (IP, MFA, tags)</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="40" y="116" width="400" height="48" rx="8"/>
      <rect x="40" y="188" width="400" height="48" rx="8"/>
      <rect x="40" y="260" width="400" height="48" rx="8"/>
      <rect x="40" y="332" width="400" height="48" rx="8"/>
      <rect x="40" y="404" width="400" height="48" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#36424e">
      <text x="240" y="136">1. Explicit Deny in any policy?</text>
      <text x="240" y="208">2. Do SCPs and RCPs allow it?</text>
      <text x="240" y="280">3. Identity or resource policy allows?</text>
      <text x="240" y="352">4. Permissions boundary allows?</text>
      <text x="240" y="424">5. Session policy allows?</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="240" y="154">SCPs, RCPs, identity, resource, boundary, session</text>
      <text x="240" y="226">only when the account is in an organization</text>
      <text x="240" y="298">union within one account; both sides cross-account</text>
      <text x="240" y="370">only if the principal has a boundary</text>
      <text x="240" y="442">only for sessions created with a policy</text>
    </g>

    <rect x="40" y="476" width="400" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="240" y="495" font-size="14" font-weight="700" fill="#294a2e">Allowed</text>
    <text x="240" y="512" font-size="11" fill="#294a2e">every applicable policy type agreed</text>

    <rect x="530" y="116" width="216" height="336" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="638" y="262" font-size="14" font-weight="700" fill="#6e2a24">Denied</text>
    <g font-size="11.5" fill="#6e2a24">
      <text x="638" y="284">an explicit deny always wins;</text>
      <text x="638" y="300">anything not allowed is</text>
      <text x="638" y="316">denied by default</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M240 92V114" marker-end="url(#ipe-arrow)"/>
      <path d="M240 164V186" marker-end="url(#ipe-arrow)"/>
      <path d="M240 236V258" marker-end="url(#ipe-arrow)"/>
      <path d="M240 308V330" marker-end="url(#ipe-arrow)"/>
      <path d="M240 380V402" marker-end="url(#ipe-arrow)"/>
      <path d="M240 452V474" marker-end="url(#ipe-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#294a2e" text-anchor="start">
      <text x="250" y="180">no</text>
      <text x="250" y="252">yes</text>
      <text x="250" y="324">yes</text>
      <text x="250" y="396">yes</text>
      <text x="250" y="468">yes</text>
    </g>

    <g fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round">
      <path d="M440 140H528" marker-end="url(#ipe-arrow-red)"/>
      <path d="M440 212H528" marker-end="url(#ipe-arrow-red)"/>
      <path d="M440 284H528" marker-end="url(#ipe-arrow-red)"/>
      <path d="M440 356H528" marker-end="url(#ipe-arrow-red)"/>
      <path d="M440 428H528" marker-end="url(#ipe-arrow-red)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#6e2a24">
      <text x="484" y="133">yes</text>
      <text x="484" y="205">no</text>
      <text x="484" y="277">no</text>
      <text x="484" y="349">no</text>
      <text x="484" y="421">no</text>
    </g>

    <text x="390" y="550" font-size="13" fill="#40566b">A request is allowed only when nothing denies it and every applicable policy type allows it.</text>
  </g>
</svg>
