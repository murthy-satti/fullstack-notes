<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="csr-title csr-desc">
  <title id="csr-title">Who is responsible for each layer under three cloud service models</title>
  <desc id="csr-desc">Seven layers are compared for virtual machines, managed services such as managed containers and databases, and software as a service. Data, its classification and retention is always the customer's responsibility. Identities and access, meaning who can do what, is always the customer's. Application code is the customer's on virtual machines and managed services, and the provider's for software as a service. Configuration, such as network rules, encryption settings, and logging, is the customer's on virtual machines and shared on managed services and software as a service, where the provider offers the settings and the customer chooses them. The operating system, runtime, and patching are the customer's on virtual machines and the provider's on the other two. Hosts, virtualization, and network hardware, and the physical data centers, are always the provider's. The provider's audit reports cover its side of the line; the customer's audit covers the rest.</desc>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="355" y="38">Virtual machines</text>
      <text x="555" y="38">Managed services</text>
      <text x="755" y="38">Software as a service</text>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="355" y="54">EC2, Compute Engine</text>
      <text x="555" y="54">Fargate, RDS, Cloud Run</text>
      <text x="755" y="54">email, CRM, ticketing</text>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="20" y="93">Data, classification, retention</text>
      <text x="20" y="137">Identities and access</text>
      <text x="20" y="181">Application code</text>
      <text x="20" y="225">Configuration (rules, keys, logs)</text>
      <text x="20" y="269">OS, runtime, patching</text>
      <text x="20" y="313">Hosts, virtualization, network</text>
      <text x="20" y="357">Physical data centers</text>
    </g>

    <g stroke-width="1.5">
      <rect x="260" y="70" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="460" y="70" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="660" y="70" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>

      <rect x="260" y="114" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="460" y="114" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="660" y="114" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>

      <rect x="260" y="158" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="460" y="158" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="660" y="158" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="260" y="202" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="460" y="202" width="190" height="36" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="660" y="202" width="190" height="36" rx="6" fill="#f0e9fb" stroke="#8062a8"/>

      <rect x="260" y="246" width="190" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="460" y="246" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="246" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="260" y="290" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="460" y="290" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="290" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="260" y="334" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="460" y="334" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="334" width="190" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="11.5">
      <text x="355" y="92" fill="#66400f">you</text>
      <text x="555" y="92" fill="#66400f">you</text>
      <text x="755" y="92" fill="#66400f">you</text>
      <text x="355" y="136" fill="#66400f">you</text>
      <text x="555" y="136" fill="#66400f">you</text>
      <text x="755" y="136" fill="#66400f">you: users, roles, MFA</text>
      <text x="355" y="180" fill="#66400f">you</text>
      <text x="555" y="180" fill="#66400f">you</text>
      <text x="755" y="180" fill="#263e5a">provider</text>
      <text x="355" y="224" fill="#66400f">you</text>
      <text x="555" y="224" fill="#463365">shared: you choose</text>
      <text x="755" y="224" fill="#463365">shared: you choose</text>
      <text x="355" y="268" fill="#66400f">you</text>
      <text x="555" y="268" fill="#263e5a">provider</text>
      <text x="755" y="268" fill="#263e5a">provider</text>
      <text x="355" y="312" fill="#263e5a">provider</text>
      <text x="555" y="312" fill="#263e5a">provider</text>
      <text x="755" y="312" fill="#263e5a">provider</text>
      <text x="355" y="356" fill="#263e5a">provider</text>
      <text x="555" y="356" fill="#263e5a">provider</text>
      <text x="755" y="356" fill="#263e5a">provider</text>
    </g>

    <rect x="260" y="388" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="282" y="400" font-size="11.5" fill="#36424e" text-anchor="start">you: your audit covers it</text>
    <rect x="460" y="388" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="482" y="400" font-size="11.5" fill="#36424e" text-anchor="start">shared</text>
    <rect x="560" y="388" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="582" y="400" font-size="11.5" fill="#36424e" text-anchor="start">provider: its reports cover it</text>

    <text x="430" y="434" font-size="13" fill="#40566b">However much you outsource, your data and who can reach it stay your responsibility.</text>
  </g>
</svg>
