<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="cdl-title cdl-desc">
  <title id="cdl-title">What happens to each copy of a user's data after an erasure request</title>
  <desc id="cdl-desc">A user's data lives in five places from the day the account is created. When the user asks for erasure, a deletion job removes the records from the primary database and from search indexes and caches within days, well inside the one-month response deadline that GDPR sets for requests. Backups are not edited; they age out when their 35-day retention ends, and any restore re-applies the list of completed deletions first. Application logs keep only pseudonymous identifiers and age out after 90 days. Invoices are kept, with restricted access, until the legal retention period for accounting records ends, because a legal obligation applies to them.</desc>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="20" y="79">Primary database</text>
      <text x="20" y="124">Search and caches</text>
      <text x="20" y="169">Backups (35 days)</text>
      <text x="20" y="214">Application logs (90 days)</text>
      <text x="20" y="259">Invoices</text>
    </g>

    <path d="M520 46V284" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M600 46V284" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="3 4"/>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="220" y="62" width="300" height="26" rx="4"/>
      <rect x="220" y="107" width="300" height="26" rx="4"/>
      <rect x="220" y="152" width="300" height="26" rx="4"/>
      <rect x="220" y="197" width="300" height="26" rx="4"/>
      <rect x="220" y="242" width="300" height="26" rx="4"/>
    </g>
    <text x="370" y="79" font-size="11.5" fill="#263e5a" text-anchor="middle">account in active use</text>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <path d="M534 66 542 75 534 84 526 75z"/>
      <path d="M534 111 542 120 534 129 526 120z"/>
    </g>
    <rect x="546" y="66" width="186" height="17" fill="#f5f7fb"/>
    <rect x="546" y="111" width="164" height="17" fill="#f5f7fb"/>
    <g font-size="11.5" fill="#6e2a24">
      <text x="550" y="79">deleted by the erasure job</text>
      <text x="550" y="124">deleted by the same job</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="520" y="152" width="160" height="26" rx="4"/>
      <rect x="520" y="197" width="220" height="26" rx="4"/>
      <rect x="520" y="242" width="320" height="26" rx="4"/>
    </g>
    <g font-size="11" fill="#66400f" text-anchor="middle">
      <text x="600" y="169">ages out, not edited</text>
      <text x="630" y="214">pseudonymous, ages out</text>
      <text x="680" y="259">kept: legal obligation, restricted</text>
    </g>

    <rect x="452" y="26" width="136" height="18" rx="9" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="520" y="39" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="middle">erasure request</text>
    <text x="606" y="39" font-size="11" fill="#463365">1-month deadline</text>

    <path d="M220 300H840" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="220" y="318">account created</text>
      <text x="520" y="318">day 0</text>
      <text x="600" y="318">+30 days</text>
      <text x="680" y="318">+35 days</text>
      <text x="800" y="318">years later</text>
    </g>
    <text x="20" y="344" font-size="11.5" fill="#36424e">A restore from backup first re-applies the list of completed erasures, so deleted users do not come back.</text>

    <text x="430" y="368" font-size="13" fill="#40566b" text-anchor="middle">Erasure is a set of jobs with deadlines: every copy of the data has its own clock.</text>
  </g>
</svg>
