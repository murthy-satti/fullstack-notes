<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="raf-title raf-desc">
  <title id="raf-title">From Conventional Commits to a published release</title>
  <desc id="raf-desc">Two automation styles. With release-please: Conventional Commits such as feat and fix land on main; on every push to main the release-please action updates a standing Release PR that bumps package.json to 2.4.0 and adds the new entries to CHANGELOG.md; a person merges the Release PR when they want to ship; release-please then creates the tag v2.4.0 and a GitHub Release with notes; a release workflow builds once and publishes the container image and release assets. With semantic-release: the same commits land on main; CI runs the tests on the push; semantic-release analyzes the commits since the last tag, computes 2.4.0, and in the same run creates the tag, the GitHub Release, and publishes the package, with no pull request in between.</desc>
  <defs>
    <marker id="raf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="36" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">release-please: a Release PR you merge when ready</text>

    <rect x="20" y="52" width="150" height="66" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="95" y="74" font-size="12.5" font-weight="700" fill="#66400f">Commits on main</text>
    <text x="95" y="92" font-size="11" fill="#66400f">feat(tasks): due dates</text>
    <text x="95" y="107" font-size="11" fill="#66400f">fix: empty title</text>
    <rect x="200" y="52" width="150" height="66" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="275" y="78" font-size="12.5" font-weight="700" fill="#463365">release-please</text>
    <text x="275" y="96" font-size="11" fill="#463365">runs on push to main</text>
    <rect x="380" y="52" width="170" height="66" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="465" y="74" font-size="12.5" font-weight="700" fill="#463365">Release PR</text>
    <text x="465" y="92" font-size="11" fill="#463365">package.json: 2.4.0</text>
    <text x="465" y="107" font-size="11" fill="#463365">CHANGELOG.md entries</text>
    <rect x="580" y="52" width="120" height="66" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="640" y="78" font-size="12.5" font-weight="700" fill="#66400f">Merge it</text>
    <text x="640" y="96" font-size="11" fill="#66400f">you pick when</text>
    <rect x="730" y="52" width="130" height="66" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="795" y="78" font-size="12.5" font-weight="700" fill="#263e5a">Tag v2.4.0</text>
    <text x="795" y="96" font-size="11" fill="#263e5a">+ GitHub Release</text>
    <rect x="530" y="150" width="330" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="695" y="171" font-size="12.5" font-weight="700" fill="#294a2e">Release workflow</text>
    <text x="695" y="189" font-size="11" fill="#294a2e">build once, push image, attach assets</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M170 85H198" marker-end="url(#raf-arrow)"/>
      <path d="M350 85H378" marker-end="url(#raf-arrow)"/>
      <path d="M550 85H578" marker-end="url(#raf-arrow)"/>
      <path d="M700 85H728" marker-end="url(#raf-arrow)"/>
      <path d="M795 118V148" marker-end="url(#raf-arrow)"/>
    </g>
    <text x="465" y="140" font-size="11" font-style="italic" fill="#40566b">updated on every merge</text>

    <path d="M24 226H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="256" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">semantic-release: every qualifying push releases</text>

    <rect x="20" y="272" width="150" height="66" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="95" y="294" font-size="12.5" font-weight="700" fill="#66400f">Commits on main</text>
    <text x="95" y="312" font-size="11" fill="#66400f">feat(tasks): due dates</text>
    <text x="95" y="327" font-size="11" fill="#66400f">fix: empty title</text>
    <rect x="200" y="272" width="150" height="66" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="275" y="298" font-size="12.5" font-weight="700" fill="#263e5a">CI on push</text>
    <text x="275" y="316" font-size="11" fill="#263e5a">tests pass</text>
    <rect x="380" y="272" width="170" height="66" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="465" y="294" font-size="12.5" font-weight="700" fill="#463365">semantic-release</text>
    <text x="465" y="312" font-size="11" fill="#463365">commits since last tag</text>
    <text x="465" y="327" font-size="11" fill="#463365">feat, fix: next is 2.4.0</text>
    <rect x="580" y="272" width="280" height="66" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="720" y="294" font-size="12.5" font-weight="700" fill="#294a2e">Same run, no PR</text>
    <text x="720" y="312" font-size="11" fill="#294a2e">tag v2.4.0, GitHub Release,</text>
    <text x="720" y="327" font-size="11" fill="#294a2e">publish to the registry</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M170 305H198" marker-end="url(#raf-arrow)"/>
      <path d="M350 305H378" marker-end="url(#raf-arrow)"/>
      <path d="M550 305H578" marker-end="url(#raf-arrow)"/>
    </g>

    <text x="440" y="372" font-size="11.5" fill="#36424e">Both read Conventional Commits: feat bumps minor, fix bumps patch, ! or BREAKING CHANGE bumps major.</text>
    <text x="440" y="402" font-size="13" fill="#40566b">Commit messages become the version number, the changelog, and the release notes.</text>
  </g>
</svg>
