<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="tbd-title tbd-desc">
  <title id="tbd-title">Trunk-based development timeline</title>
  <desc id="tbd-desc">A single long-lived branch, main, runs from left to right with a commit every few hours. Five short-lived branches leave main and merge back quickly: a fix branch living three hours, a feature branch living one day with two commits, a refactor living five hours, a feature whose code merges while hidden behind a feature flag that is off, and a small same-day pull request. CI runs on every merge. Deploy markers below main show releases taken directly from main at three different commits, because any green commit on main can ship. A red build on main is fixed or reverted within minutes.</desc>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Short-lived branches merge into main at least daily</text>

    <text x="24" y="155" font-size="13" font-weight="700" fill="#263e5a" text-anchor="start">main</text>
    <path d="M100 150H830" stroke="#4774aa" stroke-width="4" stroke-linecap="round"/>

    <g fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M130 150L160 95L190 150"/>
      <path d="M250 150L275 205H305L320 150"/>
      <path d="M390 150L420 95L460 150"/>
      <path d="M530 150L555 205H585L600 150"/>
      <path d="M670 150L700 95L740 150"/>
    </g>
    <g fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M390 158V246"/>
      <path d="M670 158V246"/>
      <path d="M800 158V246"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="130" cy="150" r="8"/><circle cx="190" cy="150" r="8"/>
      <circle cx="250" cy="150" r="8"/><circle cx="320" cy="150" r="8"/>
      <circle cx="390" cy="150" r="8"/><circle cx="460" cy="150" r="8"/>
      <circle cx="530" cy="150" r="8"/><circle cx="600" cy="150" r="8"/>
      <circle cx="670" cy="150" r="8"/><circle cx="740" cy="150" r="8"/>
      <circle cx="800" cy="150" r="8"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <circle cx="160" cy="95" r="7"/>
      <circle cx="275" cy="205" r="7"/><circle cx="305" cy="205" r="7"/>
      <circle cx="420" cy="95" r="7"/>
      <circle cx="555" cy="205" r="7"/><circle cx="585" cy="205" r="7"/>
      <circle cx="700" cy="95" r="7"/>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="160" y="78">fix: 3 hours</text>
      <text x="290" y="230">feature: 1 day</text>
      <text x="425" y="78">refactor: 5 hours</text>
      <text x="570" y="230">new code behind a flag (off)</text>
      <text x="705" y="78">small PR, same day</text>
    </g>

    <g font-size="11" font-weight="700" fill="#294a2e">
      <rect x="362" y="248" width="56" height="20" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="390" y="262">deploy</text>
      <rect x="642" y="248" width="56" height="20" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="670" y="262">deploy</text>
      <rect x="772" y="248" width="56" height="20" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="800" y="262">deploy</text>
    </g>

    <text x="430" y="298" font-size="11.5" fill="#36424e">CI runs on every merge; a red main is fixed or reverted within minutes, before anything else merges.</text>
    <text x="430" y="324" font-size="13" fill="#40566b">Any green commit on main can ship; unfinished features hide behind flags, not long branches.</text>
  </g>
</svg>
