<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="rbt-title rbt-desc">
  <title id="rbt-title">Trunk-based development with release branches</title>
  <desc id="rbt-desc">All development happens on main. release/2.3 is cut from main and stabilized; its first build is tagged v2.3.0. Later a security fix lands on main first and is cherry-picked with -x onto release/2.3, which is tagged v2.3.1. Development continues on main, and release/2.4 is cut later and tagged v2.4.0. Another fix lands on main and is backported to both supported release branches, producing v2.4.1 and v2.3.2. Release branches never merge back into main; fixes flow one way, from main to the release branches.</desc>
  <defs>
    <marker id="rbt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" text-anchor="start">
      <text x="24" y="105" fill="#263e5a">main</text>
      <text x="24" y="205" fill="#294a2e">release/2.3</text>
      <text x="24" y="285" fill="#294a2e">release/2.4</text>
    </g>
    <path d="M110 100H840" stroke="#4774aa" stroke-width="4" stroke-linecap="round"/>
    <g fill="none" stroke="#53845b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M260 100L290 200H810"/>
      <path d="M610 100L640 280H810"/>
    </g>
    <g fill="none" stroke="#8062a8" stroke-width="1.6" stroke-dasharray="5 4">
      <path d="M404 108 437 191" marker-end="url(#rbt-arrow)"/>
      <path d="M752 108 760 270" marker-end="url(#rbt-arrow)"/>
      <path d="M756 107 787 192" marker-end="url(#rbt-arrow)"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="140" cy="100" r="8"/><circle cx="200" cy="100" r="8"/><circle cx="260" cy="100" r="8"/>
      <circle cx="330" cy="100" r="8"/><circle cx="400" cy="100" r="8"/><circle cx="470" cy="100" r="8"/>
      <circle cx="540" cy="100" r="8"/><circle cx="610" cy="100" r="8"/><circle cx="680" cy="100" r="8"/>
      <circle cx="750" cy="100" r="8"/><circle cx="810" cy="100" r="8"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <circle cx="320" cy="200" r="7"/><circle cx="440" cy="200" r="7"/><circle cx="790" cy="200" r="7"/>
      <circle cx="670" cy="280" r="7"/><circle cx="760" cy="280" r="7"/>
    </g>
    <g font-size="11" font-weight="700" fill="#463365">
      <rect x="292" y="214" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="320" y="228">v2.3.0</text>
      <rect x="412" y="214" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="440" y="228">v2.3.1</text>
      <rect x="762" y="214" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="790" y="228">v2.3.2</text>
      <rect x="642" y="294" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="670" y="308">v2.4.0</text>
      <rect x="732" y="294" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="760" y="308">v2.4.1</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="260" y="80">cut release/2.3</text>
      <text x="400" y="62">security fix lands</text>
      <text x="400" y="76">on main first</text>
      <text x="610" y="80">cut release/2.4</text>
      <text x="750" y="62">fix backported</text>
      <text x="750" y="76">to both releases</text>
    </g>
    <rect x="368" y="146" width="84" height="16" fill="#f5f7fb"/>
    <text x="410" y="158" font-size="11" font-weight="700" fill="#463365">cherry-pick -x</text>
    <text x="545" y="190" font-size="11" font-style="italic" fill="#294a2e">stabilize, then only fixes</text>

    <text x="430" y="342" font-size="13" fill="#40566b">Develop on main; cut a branch per release, tag from it, and backport fixes from main with cherry-pick.</text>
  </g>
</svg>
