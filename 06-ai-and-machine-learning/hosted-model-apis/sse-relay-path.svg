<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="srp-title srp-desc">
  <title id="srp-title">The path of a streamed answer from provider to browser</title>
  <desc id="srp-desc">Five hops from left to right. The model provider sends server-sent events: typed JSON events with text deltas, completed or failed events, and possible mid-stream errors. The SDK stream turns them into an async iterator read with for await, and its abort signal closes the upstream socket. The Express relay re-encodes them as its own SSE events: it calls flushHeaders, sets X-Accel-Buffering no, writes heartbeat comments and waits for drain. nginx or the load balancer must pass bytes through: proxy_buffering off, a read timeout longer than the longest gap, no gzip on the stream, and HTTP/1.1 to the upstream. TaskFlow Web reads the body with fetch and a reader, parses event blocks, treats a missing done event as a cut-off stream, shows the partial text, and aborts when the user presses Stop. A red band notes that one buffering hop, such as a proxy, gzip or a CDN, turns the stream back into one late response. A dashed arrow below the hops shows that an abort travels back from the browser to the provider through closed connections at every hop.</desc>
  <defs>
    <marker id="srp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="srp-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="40" width="156" height="58" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="98" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Model provider</text>
    <text x="98" y="83" text-anchor="middle" font-size="11.5" fill="#263e5a">server-sent events</text>
    <rect x="194" y="40" width="156" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="272" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">SDK stream</text>
    <text x="272" y="83" text-anchor="middle" font-size="11.5" fill="#463365">event objects</text>
    <rect x="368" y="40" width="156" height="58" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="446" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Express relay</text>
    <text x="446" y="83" text-anchor="middle" font-size="11.5" fill="#263e5a">your own SSE events</text>
    <rect x="542" y="40" width="156" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="620" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">nginx or LB</text>
    <text x="620" y="83" text-anchor="middle" font-size="11.5" fill="#463365">must not buffer</text>
    <rect x="716" y="40" width="144" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="788" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">TaskFlow Web</text>
    <text x="788" y="83" text-anchor="middle" font-size="11.5" fill="#66400f">fetch + reader</text>

    <line x1="176" y1="69" x2="192" y2="69" stroke="#40566b" stroke-width="1.6" marker-end="url(#srp-arrow)"/>
    <line x1="350" y1="69" x2="366" y2="69" stroke="#40566b" stroke-width="1.6" marker-end="url(#srp-arrow)"/>
    <line x1="524" y1="69" x2="540" y2="69" stroke="#40566b" stroke-width="1.6" marker-end="url(#srp-arrow)"/>
    <line x1="698" y1="69" x2="714" y2="69" stroke="#40566b" stroke-width="1.6" marker-end="url(#srp-arrow)"/>

    <line x1="788" y1="122" x2="100" y2="122" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#srp-ret)"/>
    <rect x="290" y="114" width="300" height="16" fill="#f5f7fb"/>
    <text x="440" y="126" text-anchor="middle" font-size="12" fill="#36424e">abort travels back: each hop closes its connection</text>

    <rect x="20" y="144" width="156" height="86" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="98" y="164" text-anchor="middle" font-size="11.5" fill="#36424e">typed JSON events</text>
    <text x="98" y="181" text-anchor="middle" font-size="11.5" fill="#36424e">text deltas</text>
    <text x="98" y="198" text-anchor="middle" font-size="11.5" fill="#36424e">completed / failed</text>
    <text x="98" y="215" text-anchor="middle" font-size="11.5" fill="#36424e">mid-stream errors</text>
    <rect x="194" y="144" width="156" height="86" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="272" y="164" text-anchor="middle" font-size="11.5" fill="#36424e">async iterator</text>
    <text x="272" y="181" text-anchor="middle" font-size="11.5" fill="#36424e">for await (event)</text>
    <text x="272" y="198" text-anchor="middle" font-size="11.5" fill="#36424e">signal closes the</text>
    <text x="272" y="215" text-anchor="middle" font-size="11.5" fill="#36424e">upstream socket</text>
    <rect x="368" y="144" width="156" height="86" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="446" y="164" text-anchor="middle" font-size="11.5" fill="#36424e">flushHeaders()</text>
    <text x="446" y="181" text-anchor="middle" font-size="11.5" fill="#36424e">X-Accel-Buffering</text>
    <text x="446" y="198" text-anchor="middle" font-size="11.5" fill="#36424e">heartbeat comments</text>
    <text x="446" y="215" text-anchor="middle" font-size="11.5" fill="#36424e">await drain</text>
    <rect x="542" y="144" width="156" height="86" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="620" y="164" text-anchor="middle" font-size="11.5" fill="#36424e">proxy_buffering off</text>
    <text x="620" y="181" text-anchor="middle" font-size="11.5" fill="#36424e">read timeout &gt; gap</text>
    <text x="620" y="198" text-anchor="middle" font-size="11.5" fill="#36424e">no gzip on stream</text>
    <text x="620" y="215" text-anchor="middle" font-size="11.5" fill="#36424e">HTTP/1.1 upstream</text>
    <rect x="716" y="144" width="144" height="86" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="788" y="164" text-anchor="middle" font-size="11.5" fill="#36424e">parse event blocks</text>
    <text x="788" y="181" text-anchor="middle" font-size="11.5" fill="#36424e">no done = cut off</text>
    <text x="788" y="198" text-anchor="middle" font-size="11.5" fill="#36424e">show partial text</text>
    <text x="788" y="215" text-anchor="middle" font-size="11.5" fill="#36424e">abort on Stop</text>

    <rect x="20" y="250" width="840" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="440" y="275" text-anchor="middle" font-size="12" fill="#6e2a24">One buffering hop (proxy, gzip, CDN) turns the stream back into one late response, even though every other hop streams.</text>

    <text x="440" y="326" text-anchor="middle" font-size="13" fill="#40566b">Every hop must pass bytes on as they arrive, and must pass a cancel back the other way.</text>
  </g>
</svg>
