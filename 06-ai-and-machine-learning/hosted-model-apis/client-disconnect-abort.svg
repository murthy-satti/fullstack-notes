<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="cda-title cda-desc">
  <title id="cda-title">Propagating a client disconnect to the model provider</title>
  <desc id="cda-desc">A sequence diagram with five lifelines: TaskFlow Web, nginx, the Express relay, the model provider, and MongoDB. While the summary streams, the provider sends text deltas to the Express relay, which forwards delta events through nginx to the browser. The user presses Stop or closes the tab, so the browser closes its connection. nginx closes its upstream connection to Express. In Express the response emits its close event before it finished, and the route calls controller.abort. The SDK closes the request to the provider, and the provider stops generating. Express then saves the partial summary in MongoDB with the status cancelled. Without the abort, the provider would keep generating output that is billed and never read.</desc>
  <defs>
    <marker id="cda-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="cda-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
    <marker id="cda-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#b5524b"/></marker>
  </defs>
  <rect width="880" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="25" y="28" width="130" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="90" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">TaskFlow Web</text>
    <rect x="205" y="28" width="130" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="270" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">nginx</text>
    <rect x="385" y="28" width="130" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="450" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Express relay</text>
    <rect x="565" y="28" width="130" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="630" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Model provider</text>
    <rect x="735" y="28" width="130" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="800" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">MongoDB</text>

    <g stroke="#8a96a3" stroke-dasharray="4 4">
      <line x1="90" y1="72" x2="90" y2="470"/>
      <line x1="270" y1="72" x2="270" y2="470"/>
      <line x1="450" y1="72" x2="450" y2="470"/>
      <line x1="630" y1="72" x2="630" y2="470"/>
      <line x1="800" y1="72" x2="800" y2="470"/>
    </g>

    <line x1="630" y1="104" x2="452" y2="104" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#cda-ret)"/>
    <rect x="502" y="87" width="76" height="15" fill="#f5f7fb"/>
    <text x="540" y="98" text-anchor="middle" font-size="12" fill="#36424e">text deltas</text>
    <line x1="450" y1="128" x2="272" y2="128" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#cda-ret)"/>
    <rect x="318" y="111" width="84" height="15" fill="#f5f7fb"/>
    <text x="360" y="122" text-anchor="middle" font-size="12" fill="#36424e">event: delta</text>
    <line x1="270" y1="152" x2="92" y2="152" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#cda-ret)"/>
    <rect x="138" y="135" width="84" height="15" fill="#f5f7fb"/>
    <text x="180" y="146" text-anchor="middle" font-size="12" fill="#36424e">event: delta</text>

    <rect x="20" y="170" width="140" height="42" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="90" y="188" text-anchor="middle" font-size="11.5" fill="#36424e">user presses Stop</text>
    <text x="90" y="204" text-anchor="middle" font-size="11.5" fill="#36424e">or closes the tab</text>

    <line x1="90" y1="236" x2="268" y2="236" stroke="#b5524b" stroke-width="1.6" marker-end="url(#cda-red)"/>
    <rect x="118" y="219" width="124" height="15" fill="#f5f7fb"/>
    <text x="180" y="230" text-anchor="middle" font-size="12" fill="#6e2a24">connection closed</text>
    <line x1="270" y1="264" x2="448" y2="264" stroke="#b5524b" stroke-width="1.6" marker-end="url(#cda-red)"/>
    <rect x="302" y="247" width="116" height="15" fill="#f5f7fb"/>
    <text x="360" y="258" text-anchor="middle" font-size="12" fill="#6e2a24">upstream closed</text>

    <rect x="370" y="280" width="160" height="42" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="450" y="298" text-anchor="middle" font-size="11.5" fill="#36424e">res emits "close" early</text>
    <text x="450" y="314" text-anchor="middle" font-size="11.5" fill="#36424e">controller.abort()</text>

    <line x1="450" y1="346" x2="628" y2="346" stroke="#b5524b" stroke-width="1.6" marker-end="url(#cda-red)"/>
    <rect x="466" y="329" width="148" height="15" fill="#f5f7fb"/>
    <text x="540" y="340" text-anchor="middle" font-size="12" fill="#6e2a24">SDK closes the request</text>
    <rect x="560" y="360" width="140" height="28" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="630" y="379" text-anchor="middle" font-size="11.5" fill="#294a2e">stops generating</text>

    <line x1="450" y1="420" x2="798" y2="420" stroke="#40566b" stroke-width="1.6" marker-end="url(#cda-arrow)"/>
    <rect x="636" y="403" width="150" height="15" fill="#f5f7fb"/>
    <text x="711" y="414" text-anchor="middle" font-size="12" fill="#36424e">save partial: cancelled</text>

    <text x="440" y="502" text-anchor="middle" font-size="13" fill="#40566b">Without the abort, the provider keeps generating output that is billed and never read.</text>
  </g>
</svg>
