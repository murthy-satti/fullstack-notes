<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="pab-title pab-desc">
  <title id="pab-title">Sticky A/B split between two prompt releases</title>
  <desc id="pab-desc">The user with ID user-42 asks to create a task. The API hashes the experiment key and the user ID with SHA-256, takes the first 4 bytes modulo 10,000, and gets bucket 2658. The bucket range is split: buckets 0 to 8999, 90 percent of users, get control release task-parser-2026-10-02 with prompt version 3; buckets 9000 to 9999, 10 percent, get candidate release task-parser-2026-11-10 with prompt version 4. User user-42 falls in the control range and always will for this experiment key. After the test window, control drafts were accepted without edits 62.0 percent of the time (5,580 of 9,000) and candidate drafts 66.8 percent (668 of 1,000). A two-proportion z-test gives z of 2.97 and p of 0.003, so the decision is to ramp the candidate to 50 percent while latency, errors, and cost stay within their guardrails.</desc>
  <defs>
    <marker id="pab-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="900" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="210" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="129" y="47" font-size="14" font-weight="700" fill="#66400f">User ID user-42</text>
    <text x="129" y="67" font-size="11.5" fill="#66400f">creates a task by text</text>
    <rect x="274" y="24" width="330" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="439" y="47" font-size="13" font-weight="700" fill="#463365">SHA-256("task-parser-2026-11:user-42")</text>
    <text x="439" y="67" font-size="11.5" fill="#463365">first 4 bytes, modulo 10,000</text>
    <rect x="644" y="24" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="724" y="47" font-size="14" font-weight="700" fill="#263e5a">bucket 2658</text>
    <text x="724" y="67" font-size="11.5" fill="#263e5a">same every request</text>

    <rect x="60" y="130" width="702" height="40" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="411" y="155" font-size="12" font-weight="700" fill="#263e5a">control: task-parser-2026-10-02 (prompt @3), buckets 0-8999, 90%</text>
    <rect x="762" y="130" width="78" height="40" rx="4" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="801" y="155" font-size="12" font-weight="700" fill="#463365">10%</text>
    <text x="801" y="190" font-size="11" fill="#463365">candidate</text>
    <text x="801" y="204" font-size="11" fill="#463365">2026-11-10 (@4)</text>
    <text x="60" y="190" font-size="11" fill="#36424e" text-anchor="start">0</text>
    <text x="762" y="122" font-size="11" fill="#36424e">9000</text>
    <text x="267" y="104" font-size="11" fill="#36424e">user-42</text>

    <rect x="60" y="226" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="249" font-size="14" font-weight="700" fill="#263e5a">Control: 62.0% accepted</text>
    <text x="240" y="269" font-size="11.5" fill="#263e5a">5,580 of 9,000 drafts kept without edits</text>
    <rect x="480" y="226" width="360" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="660" y="249" font-size="14" font-weight="700" fill="#463365">Candidate: 66.8% accepted</text>
    <text x="660" y="269" font-size="11.5" fill="#463365">668 of 1,000 drafts kept without edits</text>

    <rect x="200" y="318" width="500" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="450" y="341" font-size="14" font-weight="700" fill="#294a2e">z = 2.97, p = 0.003: ramp the candidate to 50%</text>
    <text x="450" y="361" font-size="11.5" fill="#294a2e">while latency, error rate, and cost stay inside their guardrails</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M234 52H272" marker-end="url(#pab-arrow)"/>
      <path d="M604 52H642" marker-end="url(#pab-arrow)"/>
      <path d="M267 108V128" marker-end="url(#pab-arrow)"/>
      <path d="M240 282 L330 316" marker-end="url(#pab-arrow)"/>
      <path d="M660 282 L570 316" marker-end="url(#pab-arrow)"/>
    </g>

    <text x="450" y="398" font-size="13" fill="#40566b">Hashing makes the split sticky per user and needs no stored assignment table.</text>
  </g>
</svg>
