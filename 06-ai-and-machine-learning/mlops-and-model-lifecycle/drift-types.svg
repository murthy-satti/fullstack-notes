<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="dty-title dty-desc">
  <title id="dty-title">Three kinds of drift</title>
  <desc id="dty-desc">Left panel, data drift, where P(X) changes: the distribution of title length this week sits to the left of the training distribution because quick-add tasks have short titles; it is detected with PSI or a KS test on the inputs and needs no labels. Middle panel, label shift, where P(Y) changes: the share of urgent tasks rises from 20 percent in training to 35 percent this week; it is detected by comparing label rates or predicted score shares. Right panel, concept drift, where P(Y given X) changes: for the same days until due, the probability that a support task is urgent is now lower than in training, because a new triage team handles urgent support work; the inputs can look unchanged, so it is detected only by measuring performance on labels.</desc>
  <rect width="900" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="264" height="300" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="318" y="20" width="264" height="300" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="612" y="20" width="264" height="300" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="156" y="46" font-size="14" font-weight="700" fill="#263e5a">Data drift</text>
    <text x="156" y="66" font-size="11.5" fill="#36424e">P(X) changes</text>
    <text x="450" y="46" font-size="14" font-weight="700" fill="#263e5a">Label shift</text>
    <text x="450" y="66" font-size="11.5" fill="#36424e">P(Y) changes</text>
    <text x="744" y="46" font-size="14" font-weight="700" fill="#263e5a">Concept drift</text>
    <text x="744" y="66" font-size="11.5" fill="#36424e">P(Y | X) changes</text>

    <path d="M44 220H268" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M100 220 C125 220 132 130 145 130 C158 130 165 220 190 220" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <path d="M110 220 C150 220 160 160 180 160 C200 160 210 220 250 220" fill="none" stroke="#4774aa" stroke-width="2"/>
    <text x="145" y="122" font-size="11" fill="#66400f">this week</text>
    <text x="215" y="156" font-size="11" fill="#263e5a">training</text>
    <text x="156" y="238" font-size="11" fill="#36424e">title length</text>

    <path d="M338 220H562" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="380" y="180" width="60" height="40" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="470" y="150" width="60" height="70" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="410" y="172" font-size="12" font-weight="700" fill="#263e5a">20%</text>
    <text x="500" y="142" font-size="12" font-weight="700" fill="#66400f">35%</text>
    <text x="410" y="238" font-size="11" fill="#36424e">training</text>
    <text x="500" y="238" font-size="11" fill="#36424e">this week</text>

    <path d="M632 220H856" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M632 100V220" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M640 110 C700 112 740 190 850 205" fill="none" stroke="#4774aa" stroke-width="2"/>
    <path d="M640 165 C700 167 740 205 850 214" fill="none" stroke="#bd7a20" stroke-width="2"/>
    <text x="700" y="104" font-size="11" fill="#263e5a" text-anchor="start">training</text>
    <text x="650" y="186" font-size="11" fill="#66400f" text-anchor="start">this week</text>
    <text x="744" y="238" font-size="11" fill="#36424e">days until due (support tasks)</text>
    <text x="640" y="94" font-size="11" fill="#36424e" text-anchor="start">P(urgent)</text>

    <text x="156" y="272" font-size="12" font-weight="700" fill="#294a2e">Detect: PSI, KS on inputs</text>
    <text x="156" y="292" font-size="11.5" fill="#36424e">no labels needed</text>
    <text x="450" y="272" font-size="12" font-weight="700" fill="#294a2e">Detect: label and score rates</text>
    <text x="450" y="292" font-size="11.5" fill="#36424e">labels, or predicted shares</text>
    <text x="744" y="272" font-size="12" font-weight="700" fill="#6e2a24">Detect: performance on labels</text>
    <text x="744" y="292" font-size="11.5" fill="#36424e">inputs can look unchanged</text>

    <text x="450" y="350" font-size="13" fill="#40566b">Input monitoring catches the first two early; only labels reveal concept drift.</text>
  </g>
</svg>
