<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="rra-title rra-desc">
  <title id="rra-title">What one tracked training run records</title>
  <desc id="rra-desc">Four inputs feed one MLflow run in the taskflow-priority experiment: code (git commit 3d75f43 and a git_dirty tag), data (the dated snapshot tasks-2026-10.parquet with dataset digests f9096fbd and 1ced825d), configuration (learning_rate, max_iter, max_leaf_nodes, random_state), and environment (requirements.txt and python_env.yaml with Python 3.12.6 and scikit-learn 1.9.1). The run produces metrics (test ROC AUC 0.698, average precision 0.422), a logged model with an m- identifier containing model.skops and MLmodel, and a signature with an input example of seven columns returning two probabilities. Because the run passes registered_model_name, the logged model also becomes version 1 of the registered model taskflow-priority.</desc>
  <defs>
    <marker id="rra-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="154" y="22" font-size="12" font-weight="700" fill="#40566b">Inputs (make it reproducible)</text>
    <text x="740" y="22" font-size="12" font-weight="700" fill="#40566b">Outputs (make it comparable)</text>

    <rect x="24" y="30" width="260" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="154" y="54" font-size="14" font-weight="700" fill="#66400f">Code</text>
    <text x="154" y="76" font-size="11.5" fill="#66400f">git commit 3d75f43, git_dirty tag</text>

    <rect x="24" y="110" width="260" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="154" y="134" font-size="14" font-weight="700" fill="#263e5a">Data</text>
    <text x="154" y="156" font-size="11.5" fill="#263e5a">tasks-2026-10.parquet, digests</text>

    <rect x="24" y="190" width="260" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="154" y="214" font-size="14" font-weight="700" fill="#66400f">Configuration</text>
    <text x="154" y="236" font-size="11.5" fill="#66400f">learning_rate, random_state, ...</text>

    <rect x="24" y="270" width="260" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="154" y="294" font-size="14" font-weight="700" fill="#263e5a">Environment</text>
    <text x="154" y="316" font-size="11.5" fill="#263e5a">Python 3.12.6, scikit-learn 1.9.1</text>

    <rect x="324" y="120" width="240" height="140" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="444" y="156" font-size="14" font-weight="700" fill="#463365">MLflow run</text>
    <text x="444" y="180" font-size="11.5" fill="#463365">experiment taskflow-priority</text>
    <text x="444" y="200" font-size="11.5" fill="#463365">params, tags, dataset inputs</text>
    <text x="444" y="220" font-size="11.5" fill="#463365">metrics, artifacts</text>
    <text x="444" y="240" font-size="11.5" fill="#463365">run id 3819fc3b...</text>

    <rect x="604" y="40" width="272" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="740" y="64" font-size="14" font-weight="700" fill="#294a2e">Metrics</text>
    <text x="740" y="86" font-size="11.5" fill="#294a2e">ROC AUC 0.698, avg precision 0.422</text>

    <rect x="604" y="130" width="272" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="740" y="154" font-size="14" font-weight="700" fill="#263e5a">Logged model m-4aa69ab4...</text>
    <text x="740" y="176" font-size="11.5" fill="#263e5a">model.skops, MLmodel, environment</text>

    <rect x="604" y="220" width="272" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="740" y="244" font-size="14" font-weight="700" fill="#263e5a">Signature + input example</text>
    <text x="740" y="266" font-size="11.5" fill="#263e5a">7 input columns -> 2 probabilities</text>

    <rect x="324" y="310" width="240" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="444" y="334" font-size="14" font-weight="700" fill="#294a2e">Registered model</text>
    <text x="444" y="354" font-size="11.5" fill="#294a2e">taskflow-priority, version 1</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M284 62 L322 150" marker-end="url(#rra-arrow)"/>
      <path d="M284 142 L322 176" marker-end="url(#rra-arrow)"/>
      <path d="M284 222 L322 204" marker-end="url(#rra-arrow)"/>
      <path d="M284 302 L322 232" marker-end="url(#rra-arrow)"/>
      <path d="M564 150 L602 72" marker-end="url(#rra-arrow)"/>
      <path d="M564 190 L602 162" marker-end="url(#rra-arrow)"/>
      <path d="M564 230 L602 252" marker-end="url(#rra-arrow)"/>
      <path d="M444 260 V308" marker-end="url(#rra-arrow)"/>
    </g>
    <text x="452" y="289" font-size="11" font-style="italic" fill="#36424e" text-anchor="start">registered_model_name</text>

    <text x="450" y="402" font-size="13" fill="#40566b">Metrics alone are not a record: without the four inputs nobody can rebuild or audit the model.</text>
  </g>
</svg>
