<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="lrm-title lrm-desc">
  <title id="lrm-title">What an LLM feature release pins</title>
  <desc id="lrm-desc">Five inputs define one release of the task parser: the prompt version task-parser@4 kept in Git, the model ID read from the TASK_PARSER_MODEL_NEXT environment variable, parameters such as max_output_tokens 400, the output schema task_draft in strict JSON mode, and the versions of any tools or retrieval index the feature uses. Together they form release task-parser-2026-11-10 with a fingerprint hash. The release ID is then used by the rollout configuration (a 90 and 10 percent split with a kill switch), written into every call's log line with prompt, model, and tokens, reported by CI evaluations, and used to break down traces and dashboards by release.</desc>
  <defs>
    <marker id="lrm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="900" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="30" width="250" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="149" y="51" font-size="14" font-weight="700" fill="#66400f">Prompt version</text>
    <text x="149" y="70" font-size="11.5" fill="#66400f">task-parser@4, kept in Git</text>
    <rect x="24" y="92" width="250" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="149" y="113" font-size="14" font-weight="700" fill="#263e5a">Model ID</text>
    <text x="149" y="132" font-size="11.5" fill="#263e5a">from TASK_PARSER_MODEL_NEXT</text>
    <rect x="24" y="154" width="250" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="149" y="175" font-size="14" font-weight="700" fill="#66400f">Parameters</text>
    <text x="149" y="194" font-size="11.5" fill="#66400f">max_output_tokens 400</text>
    <rect x="24" y="216" width="250" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="149" y="237" font-size="14" font-weight="700" fill="#263e5a">Output schema</text>
    <text x="149" y="256" font-size="11.5" fill="#263e5a">task_draft, strict JSON</text>
    <rect x="24" y="278" width="250" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="149" y="299" font-size="14" font-weight="700" fill="#263e5a">Tools, retrieval index</text>
    <text x="149" y="318" font-size="11.5" fill="#263e5a">their versions, when used</text>

    <rect x="330" y="120" width="240" height="120" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="450" y="156" font-size="14" font-weight="700" fill="#463365">Release</text>
    <text x="450" y="180" font-size="12" fill="#463365">task-parser-2026-11-10</text>
    <text x="450" y="202" font-size="11.5" fill="#463365">fingerprint f64a7f2544d8</text>
    <text x="450" y="222" font-size="11.5" fill="#463365">never edited, only replaced</text>

    <rect x="626" y="40" width="250" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="751" y="63" font-size="14" font-weight="700" fill="#463365">Rollout config</text>
    <text x="751" y="83" font-size="11.5" fill="#463365">90% / 10% split, kill switch</text>
    <rect x="626" y="116" width="250" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="751" y="139" font-size="14" font-weight="700" fill="#263e5a">Every call's log line</text>
    <text x="751" y="159" font-size="11.5" fill="#263e5a">release, prompt, model, tokens</text>
    <rect x="626" y="192" width="250" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="751" y="215" font-size="14" font-weight="700" fill="#294a2e">CI evaluation report</text>
    <text x="751" y="235" font-size="11.5" fill="#294a2e">scores per release</text>
    <rect x="626" y="268" width="250" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="751" y="291" font-size="14" font-weight="700" fill="#263e5a">Traces and dashboards</text>
    <text x="751" y="311" font-size="11.5" fill="#263e5a">quality and cost by release</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M274 55 L328 140" marker-end="url(#lrm-arrow)"/>
      <path d="M274 117 L328 160" marker-end="url(#lrm-arrow)"/>
      <path d="M274 179 H328" marker-end="url(#lrm-arrow)"/>
      <path d="M274 241 L328 200" marker-end="url(#lrm-arrow)"/>
      <path d="M274 303 L328 222" marker-end="url(#lrm-arrow)"/>
      <path d="M570 140 L624 70" marker-end="url(#lrm-arrow)"/>
      <path d="M570 165 L624 144" marker-end="url(#lrm-arrow)"/>
      <path d="M570 195 L624 218" marker-end="url(#lrm-arrow)"/>
      <path d="M570 220 L624 294" marker-end="url(#lrm-arrow)"/>
    </g>

    <text x="450" y="378" font-size="13" fill="#40566b">One release ID names the whole behavior; change any input and it becomes a new release.</text>
  </g>
</svg>
