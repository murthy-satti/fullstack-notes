<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="pgf-title pgf-desc">
  <title id="pgf-title">Promotion gate for a new model version</title>
  <desc id="pgf-desc">Top row: train and log the run with train.py, register version N, set the challenger alias on version N, then score both the champion and the challenger on a newer holdout set, overall and per slice. A decision asks whether the challenger's overall AUC is not lower and no slice drops by more than 0.02. If no, version N is rejected: it is tagged rejected and the champion keeps serving. If yes, version N is promoted: the previous alias moves to the old champion and the champion alias moves to version N. Online validation with shadow or canary traffic follows; if it is healthy, serving takes all traffic by loading the champion alias, and if metrics are worse the champion alias is moved back to the previous version.</desc>
  <defs>
    <marker id="pgf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pgf-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="900" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="30" width="190" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="119" y="55" font-size="14" font-weight="700" fill="#66400f">Train and log</text>
    <text x="119" y="75" font-size="11.5" fill="#66400f">train.py, one MLflow run</text>
    <rect x="244" y="30" width="190" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="339" y="55" font-size="14" font-weight="700" fill="#263e5a">Register version N</text>
    <text x="339" y="75" font-size="11.5" fill="#263e5a">registered_model_name</text>
    <rect x="464" y="30" width="190" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="559" y="55" font-size="14" font-weight="700" fill="#463365">Set @challenger</text>
    <text x="559" y="75" font-size="11.5" fill="#463365">alias on version N</text>
    <rect x="684" y="30" width="190" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="779" y="55" font-size="14" font-weight="700" fill="#263e5a">Score both models</text>
    <text x="779" y="75" font-size="11.5" fill="#263e5a">newer holdout, per slice</text>

    <path d="M700 144 L820 200 L700 256 L580 200 Z" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="700" y="190" font-size="11.5" font-weight="700" fill="#66400f">Overall AUC not lower</text>
    <text x="700" y="205" font-size="11.5" font-weight="700" fill="#66400f">and no slice drops</text>
    <text x="700" y="220" font-size="11.5" font-weight="700" fill="#66400f">more than 0.02?</text>

    <rect x="330" y="165" width="220" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="440" y="188" font-size="14" font-weight="700" fill="#294a2e">Promote version N</text>
    <text x="440" y="207" font-size="11.5" fill="#294a2e">@previous = old champion</text>
    <text x="440" y="224" font-size="11.5" fill="#294a2e">@champion = version N</text>

    <rect x="330" y="290" width="220" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="315" font-size="14" font-weight="700" fill="#263e5a">Online validation</text>
    <text x="440" y="335" font-size="11.5" fill="#263e5a">shadow or canary traffic</text>

    <rect x="24" y="170" width="250" height="60" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="149" y="195" font-size="14" font-weight="700" fill="#6e2a24">Roll back</text>
    <text x="149" y="215" font-size="11.5" fill="#6e2a24">@champion = @previous</text>

    <rect x="24" y="290" width="250" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="149" y="315" font-size="14" font-weight="700" fill="#294a2e">Serve all traffic</text>
    <text x="149" y="335" font-size="11.5" fill="#294a2e">scoring server loads @champion</text>

    <rect x="600" y="310" width="260" height="60" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="730" y="335" font-size="14" font-weight="700" fill="#6e2a24">Reject version N</text>
    <text x="730" y="355" font-size="11.5" fill="#6e2a24">tag rejected, keep the champion</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M214 60H242" marker-end="url(#pgf-arrow)"/>
      <path d="M434 60H462" marker-end="url(#pgf-arrow)"/>
      <path d="M654 60H682" marker-end="url(#pgf-arrow)"/>
      <path d="M779 90V116H700V142" marker-end="url(#pgf-arrow)"/>
      <path d="M580 200H552" marker-end="url(#pgf-arrow)"/>
      <path d="M440 235V288" marker-end="url(#pgf-arrow)"/>
      <path d="M330 320H276" marker-end="url(#pgf-arrow)"/>
    </g>
    <g fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round">
      <path d="M700 256V308" marker-end="url(#pgf-arrow-red)"/>
      <path d="M330 300L276 222" stroke-dasharray="6 4" marker-end="url(#pgf-arrow-red)"/>
    </g>
    <rect x="552" y="180" width="28" height="14" fill="#f5f7fb"/>
    <text x="566" y="191" font-size="11.5" font-weight="700" fill="#294a2e">yes</text>
    <text x="710" y="286" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="start">no</text>
    <rect x="280" y="330" width="48" height="14" fill="#f5f7fb"/>
    <text x="304" y="341" font-size="11" fill="#294a2e">healthy</text>
    <rect x="288" y="244" width="40" height="14" fill="#f5f7fb"/>
    <text x="308" y="255" font-size="11" fill="#6e2a24">worse</text>

    <text x="450" y="412" font-size="13" fill="#40566b">Gate on data neither model trained on; aliases make promotion and rollback reversible.</text>
  </g>
</svg>
