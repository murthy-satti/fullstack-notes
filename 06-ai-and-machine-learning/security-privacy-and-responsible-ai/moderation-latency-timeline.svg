<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="mlt-title mlt-desc">
  <title id="mlt-title">Where moderation adds latency</title>
  <desc id="mlt-desc">Three timelines on a scale from 0 to 1,200 milliseconds, with illustrative timings: a 150 millisecond check and a 900 millisecond model call. Sequential: the input check runs from 0 to 150, the model from 150 to 1,050, and the output check from 1,050 to 1,200, so the user waits 1,200 milliseconds. Parallel input check: the input check and the model both start at 0; the check finishes at 150 while the model runs to 900, then the output check runs to 1,050, so the input check adds no latency. Streaming with sentence checks: the input check runs from 0 to 150 while the model streams from 0 to 900; each finished sentence, at about 300, 500, 700 and 900 milliseconds, gets a 100 millisecond output check before it is shown, so the first text appears at about 400 milliseconds and the answer is complete at about 1,000. Caption: running the input check alongside the model hides its latency, and checking streamed output sentence by sentence keeps the time to first text low.</desc>
  <rect width="900" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Where moderation adds latency (illustrative: 150 ms check, 900 ms model call)</text>

    <!-- row labels -->
    <text x="30" y="96" font-size="13" font-weight="bold" fill="#36424e">Sequential</text>
    <text x="30" y="176" font-size="13" font-weight="bold" fill="#36424e">Parallel input</text>
    <text x="30" y="193" font-size="13" font-weight="bold" fill="#36424e">check</text>
    <text x="30" y="268" font-size="13" font-weight="bold" fill="#36424e">Streaming with</text>
    <text x="30" y="285" font-size="13" font-weight="bold" fill="#36424e">sentence checks</text>

    <!-- row 1: sequential -->
    <rect x="170" y="78" width="82.5" height="28" rx="5" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="211" y="97" font-size="11.5" fill="#463365" text-anchor="middle">check</text>
    <rect x="252.5" y="78" width="495" height="28" rx="5" fill="#e5efff" stroke="#4774aa"/>
    <text x="500" y="97" font-size="11.5" fill="#263e5a" text-anchor="middle">model call</text>
    <rect x="747.5" y="78" width="82.5" height="28" rx="5" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="789" y="97" font-size="11.5" fill="#463365" text-anchor="middle">check</text>
    <text x="838" y="97" font-size="12" font-weight="bold" fill="#6e2a24">1,200</text>

    <!-- row 2: parallel input check -->
    <rect x="170" y="148" width="82.5" height="20" rx="5" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="211" y="162" font-size="11" fill="#463365" text-anchor="middle">check</text>
    <rect x="170" y="172" width="495" height="28" rx="5" fill="#e5efff" stroke="#4774aa"/>
    <text x="417" y="191" font-size="11.5" fill="#263e5a" text-anchor="middle">model call</text>
    <rect x="665" y="172" width="82.5" height="28" rx="5" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="706" y="191" font-size="11.5" fill="#463365" text-anchor="middle">check</text>
    <text x="756" y="191" font-size="12" font-weight="bold" fill="#294a2e">1,050</text>

    <!-- row 3: streaming -->
    <rect x="170" y="238" width="82.5" height="20" rx="5" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="211" y="252" font-size="11" fill="#463365" text-anchor="middle">check</text>
    <rect x="170" y="262" width="495" height="28" rx="5" fill="#e5efff" stroke="#4774aa"/>
    <text x="250" y="281" font-size="11.5" fill="#263e5a" text-anchor="middle">model streams</text>
    <g stroke="#263e5a" stroke-width="1.6">
      <line x1="335" y1="262" x2="335" y2="290"/>
      <line x1="445" y1="262" x2="445" y2="290"/>
      <line x1="555" y1="262" x2="555" y2="290"/>
      <line x1="665" y1="262" x2="665" y2="290"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8">
      <rect x="335" y="294" width="55" height="16" rx="4"/>
      <rect x="445" y="294" width="55" height="16" rx="4"/>
      <rect x="555" y="294" width="55" height="16" rx="4"/>
      <rect x="665" y="294" width="55" height="16" rx="4"/>
    </g>
    <g fill="#53845b">
      <circle cx="390" cy="302" r="4"/>
      <circle cx="500" cy="302" r="4"/>
      <circle cx="610" cy="302" r="4"/>
      <circle cx="720" cy="302" r="4"/>
    </g>
    <text x="398" y="327" font-size="12" fill="#294a2e">first text shown at ~400 ms</text>
    <text x="728" y="306" font-size="12" font-weight="bold" fill="#294a2e">~1,000</text>

    <!-- axis -->
    <line x1="170" y1="350" x2="830" y2="350" stroke="#8a96a3" stroke-width="1.4"/>
    <g stroke="#8a96a3" stroke-width="1.4">
      <line x1="170" y1="350" x2="170" y2="356"/>
      <line x1="335" y1="350" x2="335" y2="356"/>
      <line x1="500" y1="350" x2="500" y2="356"/>
      <line x1="665" y1="350" x2="665" y2="356"/>
      <line x1="830" y1="350" x2="830" y2="356"/>
    </g>
    <g font-size="12" fill="#36424e" text-anchor="middle">
      <text x="170" y="371">0</text>
      <text x="335" y="371">300</text>
      <text x="500" y="371">600</text>
      <text x="665" y="371">900</text>
      <text x="830" y="371">1,200 ms</text>
    </g>

    <text x="30" y="404" font-size="13" fill="#40566b">Running the input check alongside the model hides its latency. Checking streamed output</text>
    <text x="30" y="422" font-size="13" fill="#40566b">sentence by sentence (purple) before showing it (green dots) keeps the time to first text low.</text>
  </g>
</svg>
