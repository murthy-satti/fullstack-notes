<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="eat-title eat-desc">
  <title id="eat-title">EU AI Act application timeline as of November 2026</title>
  <desc id="eat-desc">A timeline from mid-2024 to the end of 2028. On 1 August 2024 the AI Act entered into force. From 2 February 2025, the prohibited practices and AI literacy duties apply. From 2 August 2025, obligations for general-purpose AI models, governance, and penalties apply. On 27 July 2026 the Digital Omnibus on AI entered into force and moved the high-risk dates. On 2 August 2026 the Act became generally applicable, including the Article 50 transparency duties. A marker shows November 2026, where this page was written. From 2 December 2026, the new bans on non-consensual intimate deepfakes and child sexual abuse material apply. From 2 December 2027, high-risk rules for Annex III areas such as employment and education apply. From 2 August 2028, high-risk rules for AI in regulated products under Annex I apply. Caption: dates as published by the European Commission on 19 October 2026; check the current text before relying on them.</desc>
  <rect width="940" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">EU AI Act: when obligations apply (as of November 2026)</text>

    <!-- axis -->
    <line x1="60" y1="230" x2="511" y2="230" stroke="#40566b" stroke-width="3"/>
    <line x1="511" y1="230" x2="900" y2="230" stroke="#60788d" stroke-width="3" stroke-dasharray="8 5"/>
    <g font-size="11.5" fill="#40566b" text-anchor="middle">
      <line x1="155" y1="224" x2="155" y2="236" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="155" y="252">2025</text>
      <line x1="345" y1="224" x2="345" y2="236" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="345" y="252">2026</text>
      <line x1="536" y1="224" x2="536" y2="236" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="547" y="252">2027</text>
      <line x1="726" y1="224" x2="726" y2="236" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="726" y="252">2028</text>
    </g>

    <!-- leader lines -->
    <g stroke="#8a96a3" stroke-width="1.2">
      <line x1="76" y1="160" x2="76" y2="224"/>
      <line x1="171" y1="236" x2="171" y2="290"/>
      <line x1="267" y1="118" x2="267" y2="224"/>
      <line x1="454" y1="236" x2="454" y2="290"/>
      <line x1="457" y1="118" x2="457" y2="224"/>
      <line x1="520" y1="236" x2="520" y2="350"/>
      <line x1="710" y1="118" x2="710" y2="224"/>
      <line x1="837" y1="236" x2="837" y2="290"/>
    </g>

    <!-- markers -->
    <g stroke-width="2">
      <circle cx="76" cy="230" r="7" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="171" cy="230" r="7" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="267" cy="230" r="7" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="454" cy="230" r="7" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="520" cy="230" r="7" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="710" cy="230" r="7" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="837" cy="230" r="7" fill="#e5efff" stroke="#4774aa"/>
    </g>

    <!-- today -->
    <line x1="511" y1="150" x2="511" y2="230" stroke="#bd7a20" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="516" y="146" width="112" height="20" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="572" y="160" font-size="12" font-weight="bold" fill="#66400f" text-anchor="middle">Nov 2026: today</text>

    <!-- above-axis boxes -->
    <rect x="20" y="120" width="150" height="40" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="32" y="136" font-size="12" font-weight="bold" fill="#294a2e">1 Aug 2024</text>
    <text x="32" y="152" font-size="11.5" fill="#36424e">enters into force</text>

    <rect x="190" y="60" width="185" height="58" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="202" y="77" font-size="12" font-weight="bold" fill="#294a2e">2 Aug 2025</text>
    <text x="202" y="93" font-size="11.5" fill="#36424e">general-purpose AI model</text>
    <text x="202" y="109" font-size="11.5" fill="#36424e">duties, governance, fines</text>

    <rect x="390" y="60" width="200" height="58" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="402" y="77" font-size="12" font-weight="bold" fill="#294a2e">2 Aug 2026</text>
    <text x="402" y="93" font-size="11.5" fill="#36424e">applies generally, including</text>
    <text x="402" y="109" font-size="11.5" fill="#36424e">Article 50 transparency</text>

    <rect x="640" y="60" width="200" height="58" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="652" y="77" font-size="12" font-weight="bold" fill="#263e5a">2 Dec 2027</text>
    <text x="652" y="93" font-size="11.5" fill="#36424e">high-risk, Annex III areas</text>
    <text x="652" y="109" font-size="11.5" fill="#36424e">(employment, education...)</text>

    <!-- below-axis boxes -->
    <rect x="95" y="290" width="200" height="58" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="107" y="307" font-size="12" font-weight="bold" fill="#294a2e">2 Feb 2025</text>
    <text x="107" y="323" font-size="11.5" fill="#36424e">prohibited practices and</text>
    <text x="107" y="339" font-size="11.5" fill="#36424e">AI literacy</text>

    <rect x="310" y="290" width="185" height="58" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="322" y="307" font-size="12" font-weight="bold" fill="#294a2e">27 Jul 2026</text>
    <text x="322" y="323" font-size="11.5" fill="#36424e">Digital Omnibus in force;</text>
    <text x="322" y="339" font-size="11.5" fill="#36424e">high-risk dates moved</text>

    <rect x="510" y="350" width="215" height="58" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="522" y="367" font-size="12" font-weight="bold" fill="#263e5a">2 Dec 2026</text>
    <text x="522" y="383" font-size="11.5" fill="#36424e">new bans: intimate deepfakes</text>
    <text x="522" y="399" font-size="11.5" fill="#36424e">without consent, CSAM</text>

    <rect x="740" y="290" width="185" height="58" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="752" y="307" font-size="12" font-weight="bold" fill="#263e5a">2 Aug 2028</text>
    <text x="752" y="323" font-size="11.5" fill="#36424e">high-risk AI in regulated</text>
    <text x="752" y="339" font-size="11.5" fill="#36424e">products (Annex I)</text>

    <text x="30" y="436" font-size="13" fill="#40566b">Dates as published by the European Commission on 19 October 2026, after the Digital Omnibus.</text>
    <text x="30" y="453" font-size="13" fill="#40566b">Green: already applies. Blue: still to come. Check the current text before relying on any date.</text>
  </g>
</svg>
