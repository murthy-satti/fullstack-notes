<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="prr-title prr-desc">
  <title id="prr-title">Redacting personal data before the model and restoring it after</title>
  <desc id="prr-desc">The original note reads: call Lee at a phone number or an email address; a card number was charged twice. The redact step replaces the phone, email and card with the placeholders PHONE_1, EMAIL_1 and CARD_1, and writes each placeholder and its original value to a vault that lives in the API's memory for this request only. The text sent to the model provider contains only placeholders. The model's output says: action, email EMAIL_1 about the duplicate charge on CARD_1. The restore step reads the vault and puts back only the allowed types, email and phone, so the user sees the real email address while the card stays masked. A red note explains that cards, IBANs and secrets are mask-only types and are never restored. Caption: the provider sees placeholders only, and the vault never leaves the API.</desc>
  <defs>
    <marker id="prr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Redact before the model, restore after, and only for allowed types</text>

    <!-- top row -->
    <rect x="30" y="60" width="250" height="110" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="45" y="82" font-size="13" font-weight="bold" fill="#66400f">Original note</text>
    <text x="45" y="102" font-size="11.5" fill="#36424e">Call Lee at +1 202 555 0199</text>
    <text x="45" y="119" font-size="11.5" fill="#36424e">or lee@example.com. Card</text>
    <text x="45" y="136" font-size="11.5" fill="#36424e">4111 1111 1111 1111 was</text>
    <text x="45" y="153" font-size="11.5" fill="#36424e">charged twice.</text>

    <rect x="340" y="60" width="250" height="110" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="355" y="82" font-size="13" font-weight="bold" fill="#263e5a">Sent to the model</text>
    <text x="355" y="102" font-size="11.5" fill="#36424e">Call Lee at [PHONE_1]</text>
    <text x="355" y="119" font-size="11.5" fill="#36424e">or [EMAIL_1]. Card</text>
    <text x="355" y="136" font-size="11.5" fill="#36424e">[CARD_1] was</text>
    <text x="355" y="153" font-size="11.5" fill="#36424e">charged twice.</text>

    <rect x="650" y="60" width="220" height="110" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="760" y="104" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Model provider</text>
    <text x="760" y="124" font-size="11.5" fill="#36424e" text-anchor="middle">sees placeholders only</text>

    <!-- vault -->
    <rect x="340" y="205" width="250" height="110" rx="8" fill="#ffffff" stroke="#4774aa" stroke-width="1.6"/>
    <text x="355" y="227" font-size="13" font-weight="bold" fill="#263e5a">Vault, per request</text>
    <text x="355" y="246" font-size="11.5" fill="#36424e">[PHONE_1] = +1 202 555 0199</text>
    <text x="355" y="263" font-size="11.5" fill="#36424e">[EMAIL_1] = lee@example.com</text>
    <text x="355" y="280" font-size="11.5" fill="#36424e">[CARD_1] = 4111 ... 1111</text>
    <text x="355" y="301" font-size="11" fill="#40566b">in API memory; never sent</text>

    <!-- bottom row -->
    <rect x="30" y="345" width="250" height="100" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="45" y="368" font-size="13" font-weight="bold" fill="#6e2a24">Mask-only types</text>
    <text x="45" y="388" font-size="11.5" fill="#36424e">cards, IBANs, and secrets</text>
    <text x="45" y="405" font-size="11.5" fill="#36424e">stay as placeholders in</text>
    <text x="45" y="422" font-size="11.5" fill="#36424e">every answer</text>

    <rect x="340" y="345" width="250" height="100" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="355" y="368" font-size="13" font-weight="bold" fill="#294a2e">Shown to the user</text>
    <text x="355" y="388" font-size="11.5" fill="#36424e">Action: email lee@example.com</text>
    <text x="355" y="405" font-size="11.5" fill="#36424e">about the duplicate charge</text>
    <text x="355" y="422" font-size="11.5" fill="#36424e">on [CARD_1].</text>

    <rect x="650" y="345" width="220" height="100" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="665" y="368" font-size="13" font-weight="bold" fill="#463365">Model output</text>
    <text x="665" y="388" font-size="11.5" fill="#36424e">Action: email [EMAIL_1]</text>
    <text x="665" y="405" font-size="11.5" fill="#36424e">about the duplicate charge</text>
    <text x="665" y="422" font-size="11.5" fill="#36424e">on [CARD_1].</text>

    <!-- arrows -->
    <g stroke="#40566b" stroke-width="1.6" fill="none">
      <line x1="280" y1="115" x2="338" y2="115" marker-end="url(#prr-arrow)"/>
      <line x1="590" y1="115" x2="648" y2="115" marker-end="url(#prr-arrow)"/>
      <line x1="760" y1="170" x2="760" y2="343" marker-end="url(#prr-arrow)"/>
      <line x1="650" y1="395" x2="592" y2="395" marker-end="url(#prr-arrow)"/>
    </g>
    <g stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
      <line x1="309" y1="124" x2="338" y2="235" marker-end="url(#prr-arrow)"/>
      <line x1="590" y1="285" x2="620" y2="386" marker-end="url(#prr-arrow)"/>
    </g>
    <g font-size="12" fill="#36424e">
      <rect x="283" y="88" width="52" height="15" fill="#f5f7fb"/>
      <text x="286" y="100">redact</text>
      <rect x="600" y="88" width="40" height="15" fill="#f5f7fb"/>
      <text x="603" y="100">send</text>
      <rect x="290" y="182" width="42" height="15" fill="#f5f7fb"/>
      <text x="292" y="194">writes</text>
      <rect x="600" y="318" width="40" height="15" fill="#f5f7fb"/>
      <text x="602" y="330">reads</text>
      <rect x="594" y="402" width="54" height="44" fill="#f5f7fb"/>
      <text x="597" y="414">restore</text>
      <text x="597" y="428" font-size="10.5">email,</text>
      <text x="597" y="441" font-size="10.5">phone</text>
    </g>

    <text x="30" y="482" font-size="13" fill="#40566b">The provider sees placeholders only, and the vault never leaves the API. Restoring is a</text>
    <text x="30" y="500" font-size="13" fill="#40566b">per-type decision: show contact details to the signed-in user, never cards or secrets.</text>
  </g>
</svg>
