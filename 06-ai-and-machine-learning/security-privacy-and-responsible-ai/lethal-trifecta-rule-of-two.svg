<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="ltr-title ltr-desc">
  <title id="ltr-title">The lethal trifecta and the Rule of Two</title>
  <desc id="ltr-desc">Three capabilities sit at the corners of a triangle. A, untrusted input: shared notes, emails, web pages, files and tool results. B, private data: the user's tasks and projects, workspace members and secrets. C, external action: tools that change state or send data, and links or images that load. Each side of the triangle is a pair that can run on its own. A plus B is the meeting-notes summary, which reads shared notes and the user's tasks with no tools and filtered output. A plus C is a web import that reads a public page and creates a draft in a sandbox project with no private data. B plus C is the task agent, which acts on the user's own request and reads no outside content, where notes written by others count as outside. In the middle, A plus B plus C is red: an injection can leak data or act, so a person approves the exact action, or the design removes one leg. Caption: any two capabilities can run on their own; a session that gains the third needs a person or a redesign.</desc>
  <rect width="900" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="40" font-size="15" font-weight="bold" fill="#36424e">The lethal trifecta (Willison) and the Rule of Two (Meta)</text>

    <!-- triangle edges -->
    <g stroke="#8a96a3" stroke-width="2">
      <line x1="165" y1="108" x2="735" y2="108"/>
      <line x1="165" y1="108" x2="450" y2="508"/>
      <line x1="735" y1="108" x2="450" y2="508"/>
    </g>

    <!-- capability A -->
    <rect x="30" y="70" width="270" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="45" y="94" font-size="14" font-weight="bold" fill="#66400f">A  Untrusted input</text>
    <text x="45" y="113" font-size="11.5" fill="#36424e">shared notes, emails, web pages,</text>
    <text x="45" y="130" font-size="11.5" fill="#36424e">files, tool results</text>

    <!-- capability B -->
    <rect x="600" y="70" width="270" height="76" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="615" y="94" font-size="14" font-weight="bold" fill="#263e5a">B  Private data</text>
    <text x="615" y="113" font-size="11.5" fill="#36424e">your tasks and projects,</text>
    <text x="615" y="130" font-size="11.5" fill="#36424e">workspace members, secrets</text>

    <!-- capability C -->
    <rect x="315" y="470" width="270" height="76" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="330" y="494" font-size="14" font-weight="bold" fill="#463365">C  External action</text>
    <text x="330" y="513" font-size="11.5" fill="#36424e">tools that change or send data,</text>
    <text x="330" y="530" font-size="11.5" fill="#36424e">links and images that load</text>

    <!-- pair A + B -->
    <rect x="315" y="75" width="270" height="66" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="330" y="96" font-size="12.5" font-weight="bold" fill="#294a2e">A + B: meeting-notes summary</text>
    <text x="330" y="114" font-size="12" fill="#36424e">reads shared notes and your tasks;</text>
    <text x="330" y="131" font-size="12" fill="#36424e">no tools, filtered output</text>

    <!-- pair A + C -->
    <rect x="25" y="270" width="250" height="84" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="40" y="291" font-size="12.5" font-weight="bold" fill="#294a2e">A + C: web import</text>
    <text x="40" y="309" font-size="12" fill="#36424e">reads a public page and creates</text>
    <text x="40" y="326" font-size="12" fill="#36424e">a draft in a sandbox project</text>
    <text x="40" y="343" font-size="12" fill="#36424e">with no private data</text>

    <!-- pair B + C -->
    <rect x="625" y="270" width="250" height="84" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="640" y="291" font-size="12.5" font-weight="bold" fill="#294a2e">B + C: task agent</text>
    <text x="640" y="309" font-size="12" fill="#36424e">acts on your own request</text>
    <text x="640" y="326" font-size="12" fill="#36424e">and reads no outside content</text>
    <text x="640" y="343" font-size="12" fill="#36424e">(others' notes count as outside)</text>

    <!-- all three -->
    <rect x="315" y="196" width="270" height="96" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.6"/>
    <text x="450" y="220" font-size="14" font-weight="bold" fill="#6e2a24" text-anchor="middle">A + B + C</text>
    <text x="450" y="240" font-size="11.5" fill="#36424e" text-anchor="middle">an injection can leak data or act:</text>
    <text x="450" y="258" font-size="11.5" fill="#36424e" text-anchor="middle">a person approves the exact action,</text>
    <text x="450" y="276" font-size="11.5" fill="#36424e" text-anchor="middle">or the design removes one leg</text>

    <text x="30" y="572" font-size="13" fill="#40566b">Any two capabilities can run on their own. A session that gains the third needs a person</text>
    <text x="30" y="590" font-size="13" fill="#40566b">to approve the exact action, or a redesign that removes one leg.</text>
  </g>
</svg>
