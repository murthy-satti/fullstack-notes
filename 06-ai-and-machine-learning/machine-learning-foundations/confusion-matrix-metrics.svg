<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="cmm-title cmm-desc">
  <title id="cmm-title">A confusion matrix and the metrics derived from it</title>
  <desc id="cmm-desc">The spam model at the max-F1 threshold of 0.197 on 6,000 test signups. The confusion matrix has actual classes as rows and predictions as columns: 86 true positives, spam that was caught; 100 false negatives, spam that was missed; 152 false positives, legitimate signups flagged by mistake; and 5,662 true negatives, legitimate signups left alone. A callout explains the accuracy trap: always predicting not spam scores accuracy 0.969, higher than this model's 0.958, yet catches no spam at all, while this model catches 86 of 186. Below, every metric is a ratio of the four counts: precision is TP over TP plus FP, 86 over 238, 0.361; recall is TP over TP plus FN, 86 over 186, 0.462; F1 is 2 TP over 2 TP plus FP plus FN, 172 over 424, 0.406; the false positive rate is FP over FP plus TN, 152 over 5,814, 0.026; and accuracy is TP plus TN over all, 5,748 over 6,000, 0.958.</desc>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Confusion matrix at the max-F1 threshold (0.197): 6,000 test signups</text>

    <g font-size="12.5" font-weight="700" fill="#36424e" text-anchor="middle">
      <text x="245" y="70">predicted spam</text>
      <text x="397" y="70">predicted not spam</text>
    </g>
    <g font-size="12.5" font-weight="700" fill="#36424e" text-anchor="end">
      <text x="160" y="131">actually spam</text>
      <text x="160" y="211">actually not spam</text>
    </g>
    <rect x="170" y="84" width="150" height="76" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="245" y="116" font-size="15" font-weight="700" fill="#294a2e" text-anchor="middle">TP 86</text>
    <text x="245" y="138" font-size="12" fill="#294a2e" text-anchor="middle">spam caught</text>
    <rect x="322" y="84" width="150" height="76" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="397" y="116" font-size="15" font-weight="700" fill="#6e2a24" text-anchor="middle">FN 100</text>
    <text x="397" y="138" font-size="12" fill="#6e2a24" text-anchor="middle">spam missed</text>
    <rect x="170" y="164" width="150" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="245" y="196" font-size="15" font-weight="700" fill="#66400f" text-anchor="middle">FP 152</text>
    <text x="245" y="218" font-size="12" fill="#66400f" text-anchor="middle">false alarms</text>
    <rect x="322" y="164" width="150" height="76" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="397" y="196" font-size="15" font-weight="700" fill="#263e5a" text-anchor="middle">TN 5,662</text>
    <text x="397" y="218" font-size="12" fill="#263e5a" text-anchor="middle">left alone</text>

    <rect x="510" y="84" width="320" height="156" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g fill="#6e2a24">
      <text x="670" y="110" font-size="13" font-weight="700" text-anchor="middle">The accuracy trap</text>
      <text x="530" y="138" font-size="12">always "not spam": accuracy 0.969</text>
      <text x="530" y="160" font-size="12">this model: accuracy 0.958</text>
      <text x="530" y="182" font-size="12">but it catches 86 of 186 spam signups,</text>
      <text x="530" y="204" font-size="12">and the baseline catches none.</text>
      <text x="530" y="226" font-size="12">At 3% spam, accuracy hides failure.</text>
    </g>

    <rect x="40" y="262" width="780" height="112" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="12" fill="#36424e">
      <text x="60" y="290">precision = TP / (TP + FP) = 86 / 238 = 0.361</text>
      <text x="60" y="316">recall = TP / (TP + FN) = 86 / 186 = 0.462</text>
      <text x="60" y="342">F1 = 2TP / (2TP + FP + FN) = 172 / 424 = 0.406</text>
      <text x="450" y="290">FPR = FP / (FP + TN) = 152 / 5,814 = 0.026</text>
      <text x="450" y="316">accuracy = (TP + TN) / all = 5,748 / 6,000 = 0.958</text>
      <text x="450" y="342">ROC-AUC and PR-AUC summarize all thresholds</text>
    </g>

    <text x="430" y="402" font-size="13" fill="#40566b" text-anchor="middle">Every threshold metric is a ratio of these four counts; pick the one that matches the costs.</text>
  </g>
</svg>
