<svg xmlns="http://www.w3.org/2000/svg" width="860" height="458" viewBox="0 0 860 458" role="img" aria-labelledby="ltl-title ltl-desc">
  <title id="ltl-title">Leakage: only features known at prediction time are safe</title>
  <desc id="ltl-desc">A timeline of one TaskFlow task: it is created, which is when the overdue-risk model predicts; later it reaches its due date, is completed late, and finally appears in a data export. Everything after creation is unknown when the model predicts. Safe features are known at creation: estimate, priority, days to due and team; the assignee's open tasks right now; and the late rate of the assignee's tasks that finished before creation. Leaky features come from the future: comment_count taken from the export, a late rate over all of the assignee's tasks including later ones, and random rows from the test months placed in training. A bar chart of validation ROC-AUC with the same LightGBM settings shows honest features with a time split at 0.713; adding the export-time comment_count at 0.888; the same model scored with creation-time inputs at 0.535; adding the all-tasks late rate at 0.751; and honest features with a random split at 0.723.</desc>
  <rect width="860" height="458" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Leakage: a feature is safe only if it is known when the model predicts</text>

    <rect x="40" y="48" width="150" height="62" rx="8" fill="#e7f3e9"/>
    <rect x="190" y="48" width="630" height="62" rx="8" fill="#fbe9e7"/>
    <text x="115" y="66" font-size="11.5" fill="#294a2e" text-anchor="middle">known at creation</text>
    <text x="505" y="66" font-size="11.5" fill="#6e2a24" text-anchor="middle">unknown when the model predicts</text>
    <path d="M60 90H800" stroke="#40566b" stroke-width="2"/>
    <path d="M190 48V110" stroke="#40566b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g fill="#40566b">
      <circle cx="190" cy="90" r="6"/>
      <circle cx="470" cy="90" r="6"/>
      <circle cx="600" cy="90" r="6"/>
      <circle cx="760" cy="90" r="6"/>
    </g>
    <g font-size="12" fill="#36424e" text-anchor="middle">
      <text x="190" y="130">created: model predicts</text>
      <text x="470" y="130">due date</text>
      <text x="600" y="130">completed (late)</text>
      <text x="760" y="130">data export</text>
    </g>

    <rect x="40" y="152" width="380" height="118" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g fill="#294a2e">
      <text x="230" y="176" font-size="13" font-weight="700" text-anchor="middle">Known at creation: safe</text>
      <text x="60" y="204" font-size="12">- estimate, priority, days to due, team</text>
      <text x="60" y="228" font-size="12">- the assignee's open tasks right now</text>
      <text x="60" y="252" font-size="12">- late rate of tasks finished before creation</text>
    </g>
    <rect x="440" y="152" width="380" height="118" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g fill="#6e2a24">
      <text x="630" y="176" font-size="13" font-weight="700" text-anchor="middle">From the future: leakage</text>
      <text x="460" y="204" font-size="12">- comment_count taken from the export</text>
      <text x="460" y="228" font-size="12">- late rate over all tasks, later ones included</text>
      <text x="460" y="252" font-size="12">- random rows from the test months in training</text>
    </g>

    <text x="40" y="304" font-size="12" font-weight="700" fill="#36424e">Validation ROC-AUC, same LightGBM settings</text>
    <g font-size="11.5" fill="#36424e">
      <text x="40" y="326">honest features, time split</text>
      <text x="40" y="346">+ comment_count from the export</text>
      <text x="40" y="366">same model, creation-time inputs</text>
      <text x="40" y="386">+ late rate over all tasks</text>
      <text x="40" y="406">honest features, random split</text>
    </g>
    <rect x="330" y="315" width="213" height="14" rx="2" fill="#53845b"/>
    <g fill="#b5524b">
      <rect x="330" y="335" width="388" height="14" rx="2"/>
      <rect x="330" y="355" width="35" height="14" rx="2"/>
      <rect x="330" y="375" width="251" height="14" rx="2"/>
      <rect x="330" y="395" width="223" height="14" rx="2"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="549" y="326">0.713</text>
      <text x="724" y="346">0.888 offline</text>
      <text x="371" y="366">0.535 in production</text>
      <text x="587" y="386">0.751</text>
      <text x="559" y="406">0.723</text>
    </g>
    <path d="M330 416H730" stroke="#8a96a3" stroke-width="1"/>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="330" y="429">0.5</text>
      <text x="430" y="429">0.6</text>
      <text x="530" y="429">0.7</text>
      <text x="630" y="429">0.8</text>
      <text x="730" y="429">0.9</text>
    </g>

    <text x="430" y="450" font-size="13" fill="#40566b" text-anchor="middle">Ask of every feature: would the API know this value at the moment it predicts?</text>
  </g>
</svg>
