<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="tts-title tts-desc">
  <title id="tts-title">Time-based versus random split of the TaskFlow task history</title>
  <desc id="tts-desc">Top: a time-based split of 24,000 TaskFlow tasks created from January 2025 to June 2026. Training holds 15,252 tasks due before 1 January 2026, whose outcomes were known at the cutoff, and fits the trees. A small red block of 649 tasks created before 1 January 2026 but due after it is left out. Validation holds 4,018 tasks created from January to March 2026 and is used for early stopping. Test holds 4,081 tasks created from April to June 2026 and is used once. Bottom: a random 80/20 split mixes validation rows into every month, so the model is graded on months it trained around. With the same features and model, the random split estimated ROC-AUC 0.723, while the time split scored 0.713 on the quarter after training.</desc>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Splitting the TaskFlow task history for the overdue-risk model</text>

    <text x="60" y="56" font-size="13" font-weight="700" fill="#36424e">Time-based split</text>
    <text x="548" y="77" font-size="11.5" fill="#6e2a24" text-anchor="end">649 left out: created before 1 Jan 2026, due after it</text>
    <path d="M536 80V86" stroke="#b5524b" stroke-width="2"/>

    <rect x="60" y="86" width="460" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="290" y="109" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">Training: 15,252 tasks due before 1 Jan 2026</text>
    <text x="290" y="128" font-size="12" fill="#263e5a" text-anchor="middle">outcomes already known at the cutoff</text>
    <rect x="522" y="86" width="29" height="56" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="553" y="86" width="122" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <g fill="#463365" text-anchor="middle">
      <text x="614" y="105" font-size="13" font-weight="700">Validation</text>
      <text x="614" y="121" font-size="12">4,018 tasks</text>
      <text x="614" y="135" font-size="11.5">Jan-Mar 2026</text>
    </g>
    <rect x="677" y="86" width="123" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <g fill="#66400f" text-anchor="middle">
      <text x="738" y="105" font-size="13" font-weight="700">Test</text>
      <text x="738" y="121" font-size="12">4,081 tasks</text>
      <text x="738" y="135" font-size="11.5">Apr-Jun 2026</text>
    </g>

    <path d="M60 158H800" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M60 154V162"/>
      <path d="M307 154V162"/>
      <path d="M553 154V162"/>
      <path d="M677 154V162"/>
      <path d="M800 154V162"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="60" y="176">Jan 2025</text>
      <text x="307" y="176">Jul 2025</text>
      <text x="553" y="176">Jan 2026</text>
      <text x="677" y="176">Apr 2026</text>
      <text x="800" y="176">Jul 2026</text>
    </g>
    <g font-size="12" fill="#36424e" text-anchor="middle">
      <text x="290" y="198">fits the trees</text>
      <text x="614" y="198">early stopping</text>
      <text x="738" y="198">used once</text>
    </g>

    <path d="M40 216H820" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="60" y="244" font-size="13" font-weight="700" fill="#36424e">Random 80/20 split</text>
    <g>
      <rect x="60" y="256" width="740" height="28" fill="#e5efff"/>
      <rect x="100" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <rect x="200" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <rect x="280" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <rect x="320" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <rect x="440" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <rect x="540" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <rect x="620" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <rect x="720" y="256" width="20" height="28" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    </g>
    <rect x="60" y="256" width="740" height="28" rx="4" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="60" y="304" font-size="12" fill="#36424e">Validation rows (purple) come from every month, so the model is graded on months it trained around.</text>

    <rect x="60" y="324" width="355" height="54" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="237" y="346" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="middle">Random split estimate: ROC-AUC 0.723</text>
    <text x="237" y="366" font-size="12" fill="#6e2a24" text-anchor="middle">looks better than the model will do</text>
    <rect x="445" y="324" width="355" height="54" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="622" y="346" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">Time split, next quarter: ROC-AUC 0.713</text>
    <text x="622" y="366" font-size="12" fill="#294a2e" text-anchor="middle">what the model scores on unseen months</text>

    <text x="430" y="410" font-size="13" fill="#40566b" text-anchor="middle">Split by time when the model predicts the future, and touch the test set once.</text>
  </g>
</svg>
