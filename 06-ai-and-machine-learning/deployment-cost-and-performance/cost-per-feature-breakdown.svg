<svg xmlns="http://www.w3.org/2000/svg" width="880" height="375" viewBox="0 0 880 375" role="img" aria-labelledby="cpf-title cpf-desc">
  <title id="cpf-title">Monthly model cost per TaskFlow feature in relative units</title>
  <desc id="cpf-desc">Horizontal stacked bars of monthly cost in millions of relative units, where one unit is one uncached input token. Task creation, at 300,000 requests, costs 234 million: 60 uncached input, 54 cached input, and 120 output. Meeting summaries, at 20,000 requests, cost 160 million: 120 uncached input and 40 output. Project Q&amp;A, at 100,000 requests, costs about 552 million: 400 uncached input, mostly retrieved passages, 1.5 cached input, and 150 output. A note says that retrieving the top 4 passages instead of 8 cuts Q&amp;A by 200 million units, to about 352.</desc>
  <rect width="880" height="375" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="210" y="24" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa"/>
    <text x="230" y="36" font-size="12" fill="#36424e">uncached input</text>
    <rect x="350" y="24" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="370" y="36" font-size="12" fill="#36424e">cached input</text>
    <rect x="480" y="24" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="500" y="36" font-size="12" fill="#36424e">output</text>
    <text x="210" y="64" font-size="12" fill="#36424e">Monthly cost, millions of relative units (1 unit = one uncached input token)</text>

    <text x="20" y="106" font-size="13" font-weight="bold" fill="#263e5a">Task creation</text>
    <text x="20" y="124" font-size="12" fill="#36424e">300,000 requests</text>
    <rect x="210" y="90" width="60" height="40" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="240" y="115" font-size="12" text-anchor="middle" fill="#263e5a">60</text>
    <rect x="270" y="90" width="54" height="40" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="297" y="115" font-size="12" text-anchor="middle" fill="#463365">54</text>
    <rect x="324" y="90" width="120" height="40" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="384" y="115" font-size="12" text-anchor="middle" fill="#66400f">120</text>
    <text x="452" y="115" font-size="13" font-weight="bold" fill="#263e5a">234</text>

    <text x="20" y="176" font-size="13" font-weight="bold" fill="#263e5a">Meeting summaries</text>
    <text x="20" y="194" font-size="12" fill="#36424e">20,000 requests</text>
    <rect x="210" y="160" width="120" height="40" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="270" y="185" font-size="12" text-anchor="middle" fill="#263e5a">120</text>
    <rect x="330" y="160" width="40" height="40" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="350" y="185" font-size="12" text-anchor="middle" fill="#66400f">40</text>
    <text x="378" y="185" font-size="13" font-weight="bold" fill="#263e5a">160</text>

    <text x="20" y="246" font-size="13" font-weight="bold" fill="#263e5a">Project Q&amp;A</text>
    <text x="20" y="264" font-size="12" fill="#36424e">100,000 requests</text>
    <rect x="210" y="230" width="400" height="40" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="410" y="255" font-size="12" text-anchor="middle" fill="#263e5a">400: mostly retrieved passages</text>
    <rect x="610" y="230" width="2" height="40" fill="#f0e9fb" stroke="#8062a8"/>
    <rect x="612" y="230" width="150" height="40" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="687" y="255" font-size="12" text-anchor="middle" fill="#66400f">150</text>
    <text x="770" y="255" font-size="13" font-weight="bold" fill="#6e2a24">552</text>

    <rect x="210" y="290" width="560" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="490" y="313" font-size="12" text-anchor="middle" fill="#294a2e">Top 4 passages instead of 8: Q&amp;A drops by 200 million units, to about 352</text>

    <text x="440" y="356" font-size="13" text-anchor="middle" fill="#40566b">Volume times tokens decides the bill: here retrieved context, not output, dominates.</text>
  </g>
</svg>
