<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="cbt-title cbt-desc">
  <title id="cbt-title">Static batching compared with continuous batching</title>
  <desc id="cbt-desc">A timeline of twelve decode steps for four batch slots. With static batching, requests A, B, C, and D start together at step 1; A finishes after step 3, C after step 5, and B after step 6, but their slots stay idle until D, the longest, finishes after step 8; requests E and F arrive at step 2 and wait in the queue until step 9, so E finishes after step 11 and F after step 12. With continuous batching, the scheduler decides at every step: E joins slot 1 at step 4 as soon as A finishes, and F joins slot 3 at step 6 as soon as C finishes, so E finishes after step 6 and F after step 9, and the batch stays full.</desc>
  <rect width="880" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="32" font-size="12" fill="#36424e">decode step</text>
    <text x="196" y="32" font-size="12" text-anchor="middle" fill="#36424e">1</text>
    <text x="248" y="32" font-size="12" text-anchor="middle" fill="#36424e">2</text>
    <text x="300" y="32" font-size="12" text-anchor="middle" fill="#36424e">3</text>
    <text x="352" y="32" font-size="12" text-anchor="middle" fill="#36424e">4</text>
    <text x="404" y="32" font-size="12" text-anchor="middle" fill="#36424e">5</text>
    <text x="456" y="32" font-size="12" text-anchor="middle" fill="#36424e">6</text>
    <text x="508" y="32" font-size="12" text-anchor="middle" fill="#36424e">7</text>
    <text x="560" y="32" font-size="12" text-anchor="middle" fill="#36424e">8</text>
    <text x="612" y="32" font-size="12" text-anchor="middle" fill="#36424e">9</text>
    <text x="664" y="32" font-size="12" text-anchor="middle" fill="#36424e">10</text>
    <text x="716" y="32" font-size="12" text-anchor="middle" fill="#36424e">11</text>
    <text x="768" y="32" font-size="12" text-anchor="middle" fill="#36424e">12</text>

    <rect x="20" y="44" width="840" height="200" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="40" y="68" font-size="14" font-weight="bold" fill="#263e5a">Static batching: the batch runs until its longest request ends</text>
    <text x="40" y="102" font-size="12" fill="#36424e">slot 1</text>
    <text x="40" y="134" font-size="12" fill="#36424e">slot 2</text>
    <text x="40" y="166" font-size="12" fill="#36424e">slot 3</text>
    <text x="40" y="198" font-size="12" fill="#36424e">slot 4</text>

    <rect x="170" y="84" width="156" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="248" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">A</text>
    <rect x="326" y="84" width="260" height="26" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="5 4"/>
    <text x="456" y="102" font-size="12" text-anchor="middle" fill="#36424e">idle until D finishes</text>
    <rect x="586" y="84" width="156" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="664" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">E</text>

    <rect x="170" y="116" width="312" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="326" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">B</text>
    <rect x="482" y="116" width="104" height="26" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="5 4"/>
    <text x="534" y="134" font-size="12" text-anchor="middle" fill="#36424e">idle</text>
    <rect x="586" y="116" width="208" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="690" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">F</text>

    <rect x="170" y="148" width="260" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="300" y="166" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">C</text>
    <rect x="430" y="148" width="156" height="26" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="5 4"/>
    <text x="508" y="166" font-size="12" text-anchor="middle" fill="#36424e">idle</text>

    <rect x="170" y="180" width="416" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="378" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">D (longest)</text>

    <text x="40" y="230" font-size="12" fill="#6e2a24">E and F arrive at step 2 but wait in the queue until step 9.</text>

    <rect x="20" y="258" width="840" height="200" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="40" y="282" font-size="14" font-weight="bold" fill="#263e5a">Continuous batching: the scheduler fills free slots at every step</text>
    <text x="40" y="316" font-size="12" fill="#36424e">slot 1</text>
    <text x="40" y="348" font-size="12" fill="#36424e">slot 2</text>
    <text x="40" y="380" font-size="12" fill="#36424e">slot 3</text>
    <text x="40" y="412" font-size="12" fill="#36424e">slot 4</text>

    <rect x="170" y="298" width="156" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="248" y="316" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">A</text>
    <rect x="326" y="298" width="156" height="26" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="404" y="316" font-size="13" font-weight="bold" text-anchor="middle" fill="#294a2e">E joins</text>

    <rect x="170" y="330" width="312" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="326" y="348" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">B</text>

    <rect x="170" y="362" width="260" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="300" y="380" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">C</text>
    <rect x="430" y="362" width="208" height="26" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="534" y="380" font-size="13" font-weight="bold" text-anchor="middle" fill="#294a2e">F joins</text>

    <rect x="170" y="394" width="416" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="378" y="412" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">D (longest)</text>

    <text x="40" y="444" font-size="12" fill="#294a2e">E finishes after step 6 instead of 11, and F after step 9 instead of 12.</text>

    <text x="440" y="494" font-size="13" text-anchor="middle" fill="#40566b">Deciding at every step keeps the batch full and cuts queueing for new requests.</text>
  </g>
</svg>
