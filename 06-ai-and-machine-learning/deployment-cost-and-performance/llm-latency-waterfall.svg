<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="llw-title llw-desc">
  <title id="llw-title">Latency waterfall of one LLM request before and after optimization</title>
  <desc id="llw-desc">Two timelines drawn to the same scale, from 0 to 12 seconds. Before: 0.1 seconds of network, 0.2 seconds of queueing, and 0.9 seconds of prefill put the first token at 1.2 seconds; decoding 399 more tokens at 40 tokens per second takes 10.0 seconds, so the request ends at 11.2 seconds. After: network and queueing are unchanged, prefill drops to 0.3 seconds thanks to a cached prefix, so the first token arrives at 0.6 seconds; decoding 149 tokens takes 3.7 seconds and the request ends at 4.3 seconds. Decode time dominates both runs.</desc>
  <rect width="880" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="110" y="28" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a96a3"/>
    <text x="130" y="40" font-size="12" fill="#36424e">network</text>
    <rect x="210" y="28" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="230" y="40" font-size="12" fill="#36424e">queue</text>
    <rect x="300" y="28" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa"/>
    <text x="320" y="40" font-size="12" fill="#36424e">prefill (until the first token)</text>
    <rect x="520" y="28" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="540" y="40" font-size="12" fill="#36424e">decode (one token per step)</text>

    <text x="20" y="112" font-size="13" font-weight="bold" fill="#263e5a">Before</text>
    <text x="110" y="82" font-size="12" fill="#36424e">network 0.1 s, queue 0.2 s, prefill 0.9 s (long, uncached prompt)</text>
    <rect x="110" y="90" width="6" height="34" rx="2" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="116" y="90" width="12" height="34" rx="2" fill="#f0e9fb" stroke="#8062a8"/>
    <rect x="128" y="90" width="54" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <rect x="182" y="90" width="600" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="482" y="112" font-size="12.5" text-anchor="middle" fill="#66400f">decode: 399 tokens at 40 tokens/s = 10.0 s</text>
    <text x="790" y="112" font-size="13" font-weight="bold" fill="#263e5a">11.2 s</text>
    <line x1="182" y1="88" x2="182" y2="136" stroke="#40566b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="182" y="150" font-size="12" text-anchor="middle" fill="#40566b">first token at 1.2 s</text>

    <text x="20" y="222" font-size="13" font-weight="bold" fill="#263e5a">After</text>
    <text x="110" y="192" font-size="12" fill="#36424e">network 0.1 s, queue 0.2 s, prefill 0.3 s (cached prefix, less context)</text>
    <rect x="110" y="200" width="6" height="34" rx="2" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="116" y="200" width="12" height="34" rx="2" fill="#f0e9fb" stroke="#8062a8"/>
    <rect x="128" y="200" width="18" height="34" rx="3" fill="#e5efff" stroke="#4774aa"/>
    <rect x="146" y="200" width="224" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="258" y="222" font-size="12.5" text-anchor="middle" fill="#66400f">decode: 149 tokens = 3.7 s</text>
    <text x="378" y="222" font-size="13" font-weight="bold" fill="#294a2e">4.3 s</text>
    <line x1="146" y1="198" x2="146" y2="246" stroke="#40566b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="146" y="260" font-size="12" text-anchor="middle" fill="#40566b">first token at 0.6 s</text>

    <line x1="110" y1="292" x2="830" y2="292" stroke="#8a96a3" stroke-width="1"/>
    <line x1="110" y1="288" x2="110" y2="296" stroke="#8a96a3"/>
    <line x1="230" y1="288" x2="230" y2="296" stroke="#8a96a3"/>
    <line x1="350" y1="288" x2="350" y2="296" stroke="#8a96a3"/>
    <line x1="470" y1="288" x2="470" y2="296" stroke="#8a96a3"/>
    <line x1="590" y1="288" x2="590" y2="296" stroke="#8a96a3"/>
    <line x1="710" y1="288" x2="710" y2="296" stroke="#8a96a3"/>
    <line x1="830" y1="288" x2="830" y2="296" stroke="#8a96a3"/>
    <text x="110" y="310" font-size="12" text-anchor="middle" fill="#36424e">0 s</text>
    <text x="230" y="310" font-size="12" text-anchor="middle" fill="#36424e">2 s</text>
    <text x="350" y="310" font-size="12" text-anchor="middle" fill="#36424e">4 s</text>
    <text x="470" y="310" font-size="12" text-anchor="middle" fill="#36424e">6 s</text>
    <text x="590" y="310" font-size="12" text-anchor="middle" fill="#36424e">8 s</text>
    <text x="710" y="310" font-size="12" text-anchor="middle" fill="#36424e">10 s</text>
    <text x="830" y="310" font-size="12" text-anchor="middle" fill="#36424e">12 s</text>

    <text x="440" y="345" font-size="13" text-anchor="middle" fill="#40566b">Decode time dominates long answers: cut output tokens first, then trim and cache the prompt.</text>
  </g>
</svg>
