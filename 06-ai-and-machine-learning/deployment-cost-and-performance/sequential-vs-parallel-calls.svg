<svg xmlns="http://www.w3.org/2000/svg" width="880" height="395" viewBox="0 0 880 395" role="img" aria-labelledby="svp-title svp-desc">
  <title id="svp-title">Sequential compared with parallel lookups before a model call</title>
  <desc id="svp-desc">Two timelines at the same scale, from 0 to 5 seconds, for answering a project question. Sequential: a document search of 1.2 seconds, an open-tasks lookup of 0.8 seconds, and a permission check of 0.3 seconds run one after another; the streamed model call then has a 0.6 second time to first token and 1.9 seconds of decoding, so the first visible text appears at 2.9 seconds and the answer ends at 4.8 seconds. Parallel: the three lookups start together and finish when the slowest, the 1.2 second search, ends; the model call starts at 1.2 seconds, the first text appears at 1.8 seconds, and the answer ends at 3.7 seconds.</desc>
  <rect width="880" height="395" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="150" y="26" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa"/>
    <text x="170" y="38" font-size="12" fill="#36424e">data lookup</text>
    <rect x="270" y="26" width="14" height="14" rx="3" fill="#ffffff" stroke="#bd7a20"/>
    <text x="290" y="38" font-size="12" fill="#36424e">model call until the first token</text>
    <rect x="500" y="26" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="520" y="38" font-size="12" fill="#36424e">streamed answer</text>

    <text x="20" y="102" font-size="13" font-weight="bold" fill="#263e5a">Sequential</text>
    <rect x="150" y="80" width="168" height="34" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="234" y="101" font-size="11.5" text-anchor="middle" fill="#263e5a">docs search 1.2 s</text>
    <rect x="318" y="80" width="112" height="34" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="374" y="101" font-size="11.5" text-anchor="middle" fill="#263e5a">tasks 0.8 s</text>
    <rect x="430" y="80" width="42" height="34" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="451" y="101" font-size="11.5" text-anchor="middle" fill="#263e5a">auth</text>
    <rect x="472" y="80" width="84" height="34" rx="6" fill="#ffffff" stroke="#bd7a20"/>
    <text x="514" y="101" font-size="11.5" text-anchor="middle" fill="#66400f">TTFT 0.6</text>
    <rect x="556" y="80" width="266" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="689" y="101" font-size="11.5" text-anchor="middle" fill="#66400f">streamed answer 1.9 s</text>
    <text x="828" y="102" font-size="13" font-weight="bold" fill="#6e2a24">4.8 s</text>
    <line x1="556" y1="74" x2="556" y2="128" stroke="#40566b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="556" y="142" font-size="12" text-anchor="middle" fill="#40566b">first text at 2.9 s</text>

    <text x="20" y="212" font-size="13" font-weight="bold" fill="#263e5a">Parallel</text>
    <rect x="150" y="190" width="168" height="30" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="234" y="209" font-size="11.5" text-anchor="middle" fill="#263e5a">docs search 1.2 s</text>
    <rect x="318" y="190" width="84" height="30" rx="6" fill="#ffffff" stroke="#bd7a20"/>
    <text x="360" y="209" font-size="11.5" text-anchor="middle" fill="#66400f">TTFT 0.6</text>
    <rect x="402" y="190" width="266" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="535" y="209" font-size="11.5" text-anchor="middle" fill="#66400f">streamed answer 1.9 s</text>
    <text x="674" y="210" font-size="13" font-weight="bold" fill="#294a2e">3.7 s</text>
    <rect x="150" y="226" width="112" height="30" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="206" y="245" font-size="11.5" text-anchor="middle" fill="#263e5a">tasks 0.8 s</text>
    <rect x="150" y="262" width="42" height="30" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="171" y="281" font-size="11.5" text-anchor="middle" fill="#263e5a">auth</text>
    <line x1="402" y1="184" x2="402" y2="300" stroke="#40566b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="402" y="314" font-size="12" text-anchor="middle" fill="#40566b">first text at 1.8 s</text>

    <line x1="150" y1="336" x2="850" y2="336" stroke="#8a96a3" stroke-width="1"/>
    <line x1="150" y1="332" x2="150" y2="340" stroke="#8a96a3"/>
    <line x1="290" y1="332" x2="290" y2="340" stroke="#8a96a3"/>
    <line x1="430" y1="332" x2="430" y2="340" stroke="#8a96a3"/>
    <line x1="570" y1="332" x2="570" y2="340" stroke="#8a96a3"/>
    <line x1="710" y1="332" x2="710" y2="340" stroke="#8a96a3"/>
    <line x1="850" y1="332" x2="850" y2="340" stroke="#8a96a3"/>
    <text x="150" y="354" font-size="12" text-anchor="middle" fill="#36424e">0 s</text>
    <text x="290" y="354" font-size="12" text-anchor="middle" fill="#36424e">1 s</text>
    <text x="430" y="354" font-size="12" text-anchor="middle" fill="#36424e">2 s</text>
    <text x="570" y="354" font-size="12" text-anchor="middle" fill="#36424e">3 s</text>
    <text x="710" y="354" font-size="12" text-anchor="middle" fill="#36424e">4 s</text>
    <text x="850" y="354" font-size="12" text-anchor="middle" fill="#36424e">5 s</text>

    <text x="440" y="382" font-size="13" text-anchor="middle" fill="#40566b">Only steps with no data dependency can overlap; the model call still waits for the slowest lookup.</text>
  </g>
</svg>
