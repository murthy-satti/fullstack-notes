<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="osk-title osk-desc">
  <title id="osk-title">Serving an open model on Kubernetes</title>
  <desc id="osk-desc">TaskFlow API pods call the vllm-chat Service, a ClusterIP Service on port 80; a NetworkPolicy admits only the API pods on port 8000. The Service routes to vLLM pod 1, which is ready on a tainted GPU node pool: it requests one nvidia.com/gpu, mounts a memory-backed emptyDir at /dev/shm, and passed its startup probe on /health. vLLM pod 2 is still starting, downloading and loading weights, so it is not ready and gets no traffic. Below the node pool, a persistent volume claim holds the model cache so weights survive restarts, and a Secret and ConfigMap supply the Hugging Face token and MODEL_ID. Prometheus scrapes /metrics from the pods, KEDA reads the num_requests_waiting queue metric from Prometheus, and KEDA scales the Deployment's replicas.</desc>
  <defs>
    <marker id="osk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="30" y="150" width="170" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="115" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">TaskFlow API pods</text>
    <text x="115" y="200" font-size="12" text-anchor="middle" fill="#66400f">namespace taskflow</text>

    <line x1="200" y1="185" x2="288" y2="185" stroke="#40566b" stroke-width="1.6" marker-end="url(#osk-arrow)"/>

    <rect x="290" y="150" width="170" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="375" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Service vllm-chat</text>
    <text x="375" y="200" font-size="12" text-anchor="middle" fill="#263e5a">ClusterIP, port 80</text>

    <rect x="195" y="232" width="200" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="295" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#463365">NetworkPolicy</text>
    <text x="295" y="267" font-size="12" text-anchor="middle" fill="#463365">only API pods, port 8000</text>

    <rect x="500" y="40" width="360" height="290" rx="8" fill="#ffffff" stroke="#4774aa" stroke-dasharray="6 4"/>
    <text x="516" y="64" font-size="14" font-weight="bold" fill="#263e5a">GPU node pool (tainted)</text>

    <rect x="516" y="80" width="328" height="100" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="532" y="102" font-size="13" font-weight="bold" fill="#263e5a">vLLM pod 1: ready</text>
    <text x="532" y="122" font-size="12" fill="#263e5a">requests nvidia.com/gpu: 1</text>
    <text x="532" y="140" font-size="12" fill="#263e5a">/dev/shm: memory-backed emptyDir</text>
    <text x="532" y="158" font-size="12" fill="#263e5a">startup probe passed on /health</text>

    <rect x="516" y="196" width="328" height="84" rx="8" fill="#ffffff" stroke="#4774aa" stroke-dasharray="5 4"/>
    <text x="532" y="218" font-size="13" font-weight="bold" fill="#263e5a">vLLM pod 2: starting</text>
    <text x="532" y="238" font-size="12" fill="#36424e">downloading and loading weights</text>
    <text x="532" y="256" font-size="12" fill="#36424e">not ready, so it gets no traffic</text>

    <text x="516" y="312" font-size="12" fill="#36424e">toleration: nvidia.com/gpu</text>

    <line x1="460" y1="175" x2="514" y2="135" stroke="#40566b" stroke-width="1.6" marker-end="url(#osk-arrow)"/>

    <rect x="500" y="350" width="175" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="587" y="373" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">PVC: model cache</text>
    <text x="587" y="392" font-size="12" text-anchor="middle" fill="#263e5a">survives restarts</text>
    <line x1="587" y1="350" x2="587" y2="333" stroke="#60788d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#osk-arrow)"/>

    <rect x="685" y="350" width="175" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="772" y="373" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">Secret + ConfigMap</text>
    <text x="772" y="392" font-size="12" text-anchor="middle" fill="#463365">HF token, MODEL_ID</text>
    <line x1="772" y1="350" x2="772" y2="333" stroke="#60788d" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#osk-arrow)"/>

    <path d="M500 300 H115 V348" fill="none" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#osk-arrow)"/>
    <rect x="236" y="291" width="128" height="18" rx="4" fill="#f5f7fb"/>
    <text x="300" y="304" font-size="11.5" text-anchor="middle" fill="#36424e">scrape /metrics</text>

    <rect x="30" y="350" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="115" y="373" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">Prometheus</text>
    <text x="115" y="392" font-size="12" text-anchor="middle" fill="#463365">stores metrics</text>

    <line x1="200" y1="378" x2="288" y2="378" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#osk-arrow)"/>

    <rect x="290" y="350" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="375" y="373" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">KEDA ScaledObject</text>
    <text x="375" y="392" font-size="12" text-anchor="middle" fill="#463365">num_requests_waiting</text>

    <line x1="460" y1="365" x2="498" y2="322" stroke="#40566b" stroke-width="1.6" marker-end="url(#osk-arrow)"/>
    <rect x="456" y="327" width="40" height="16" rx="4" fill="#f5f7fb"/>
    <text x="476" y="339" font-size="11.5" text-anchor="middle" fill="#36424e">scale</text>

    <text x="440" y="462" font-size="13" text-anchor="middle" fill="#40566b">New GPU replicas take minutes to become ready, so scale on queue length and keep headroom.</text>
  </g>
</svg>
