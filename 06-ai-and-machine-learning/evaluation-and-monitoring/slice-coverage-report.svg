<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" role="img" aria-labelledby="scr-title scr-desc">
  <title id="scr-title">Per-slice pass rates with 95 percent intervals</title>
  <desc id="scr-desc">A per-slice report drawn as interval bars on a scale from 40 to 100 percent, with a dashed target line at 90 percent. Overall, 242 cases: 93.8 percent, interval 90.0 to 96.2, meets the target. Relative dates, 156 cases: 94.2 percent, interval 89.4 to 96.9, unclear because the interval crosses the target. Late evening, 36 cases: 83.3 percent, interval 68.1 to 92.1, unclear. Absolute dates, 14 cases: 71.4 percent, interval 45.4 to 88.3, below the target and thin. Non-English, 14 cases: 71.4 percent, interval 45.4 to 88.3, below the target and thin. Injection, 12 cases: 100 percent, interval 75.7 to 100, thin, so still unproven. A legend explains green for meets target, orange for unclear, red for below target. The overall score meets the target while three slices are below it or unproven.</desc>
  <rect width="820" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g stroke="#c9d1db" stroke-width="1">
      <path d="M280 48V350M360 48V350M440 48V350M520 48V350M600 48V350M760 48V350"/>
    </g>
    <path d="M680 40V350" stroke="#40566b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="680" y="32" font-size="11.5" fill="#40566b" text-anchor="middle">target 90%</text>
    <path d="M280 350H760" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="280" y="368">40%</text>
      <text x="360" y="368">50%</text>
      <text x="440" y="368">60%</text>
      <text x="520" y="368">70%</text>
      <text x="600" y="368">80%</text>
      <text x="680" y="368">90%</text>
      <text x="760" y="368">100%</text>
    </g>

    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="24" y="70">overall, n = 242</text>
      <text x="24" y="120">date = relative, n = 156</text>
      <text x="24" y="170">late evening, n = 36</text>
      <text x="24" y="220">date = absolute, n = 14</text>
      <text x="24" y="270">non-English, n = 14</text>
      <text x="24" y="320">injection, n = 12</text>
    </g>
    <g font-size="11.5">
      <text x="24" y="86" fill="#294a2e">93.8%, interval 90.0 to 96.2</text>
      <text x="24" y="136" fill="#66400f">94.2%, interval 89.4 to 96.9</text>
      <text x="24" y="186" fill="#66400f">83.3%, interval 68.1 to 92.1</text>
      <text x="24" y="236" fill="#6e2a24">71.4%, thin and below target</text>
      <text x="24" y="286" fill="#6e2a24">71.4%, thin and below target</text>
      <text x="24" y="336" fill="#66400f">12 of 12 pass, still unproven</text>
    </g>

    <g stroke-width="7" stroke-linecap="round" stroke-opacity="0.45">
      <path d="M680 76H729.6" stroke="#53845b"/>
      <path d="M675.2 126H735.2" stroke="#bd7a20"/>
      <path d="M504.8 176H697.6" stroke="#bd7a20"/>
      <path d="M323.2 226H666.4" stroke="#b5524b"/>
      <path d="M323.2 276H666.4" stroke="#b5524b"/>
      <path d="M565.6 326H760" stroke="#bd7a20"/>
    </g>
    <circle cx="710.4" cy="76" r="6" fill="#53845b"/>
    <circle cx="713.6" cy="126" r="6" fill="#bd7a20"/>
    <circle cx="626.4" cy="176" r="6" fill="#bd7a20"/>
    <circle cx="531.2" cy="226" r="6" fill="#b5524b"/>
    <circle cx="531.2" cy="276" r="6" fill="#b5524b"/>
    <circle cx="760" cy="326" r="6" fill="#bd7a20"/>

    <g font-size="11.5" fill="#36424e">
      <circle cx="160" cy="396" r="6" fill="#53845b"/>
      <text x="172" y="400">meets target: interval above 90%</text>
      <circle cx="400" cy="396" r="6" fill="#bd7a20"/>
      <text x="412" y="400">unclear: interval crosses 90%</text>
      <circle cx="620" cy="396" r="6" fill="#b5524b"/>
      <text x="632" y="400">below: interval under 90%</text>
    </g>

    <text x="410" y="432" font-size="13" fill="#40566b" text-anchor="middle">93.8% overall clears the target while three slices are below it or still unproven.</text>
  </g>
</svg>
