<svg xmlns="http://www.w3.org/2000/svg" width="870" height="570" viewBox="0 0 870 570" role="img" aria-labelledby="rgt-title rgt-desc">
  <title id="rgt-title">The regression gate as a flowchart</title>
  <desc id="rgt-desc">Start with the candidate run and the baseline on the same cases and dataset version. First decision: did any critical case regress? If yes, block the merge. If no, second decision: is any metric below an absolute floor, such as schema validity below 100 percent or the overall pass rate below 88 percent? If yes, block the merge. If no, third decision: did the pass rate drop more than 2 points? If no, pass. If yes, fourth decision: is McNemar's paired test below 0.05? If yes, block the merge and list the regressions. If no, pass with a warning so that a reviewer reads the regressed cases. An example panel shows a run of 240 paired cases with 16 regressions and 3 fixes, a drop from 90.8 to 85.4 percent, and McNemar p of 0.004, so the gate blocks. Critical cases first, then floors, then a paired test, so noise does not block and real regressions do.</desc>
  <defs>
    <marker id="rgt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="870" height="570" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="20" width="260" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="250" y="42" font-size="13" font-weight="700" fill="#263e5a">Candidate run vs baseline</text>
    <text x="250" y="60" font-size="11.5" fill="#263e5a">same cases, same dataset version</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M250 85L380 120L250 155L120 120Z"/>
      <path d="M250 180L380 215L250 250L120 215Z"/>
      <path d="M250 275L380 310L250 345L120 310Z"/>
      <path d="M250 370L380 405L250 440L120 405Z"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="250" y="124">Critical case regressed?</text>
      <text x="250" y="219">Below an absolute floor?</text>
      <text x="250" y="314">Drop over 2 points?</text>
      <text x="250" y="409">McNemar p below 0.05?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M250 70V81" marker-end="url(#rgt-arrow)"/>
      <path d="M250 155V176" marker-end="url(#rgt-arrow)"/>
      <path d="M250 250V271" marker-end="url(#rgt-arrow)"/>
      <path d="M250 345V366" marker-end="url(#rgt-arrow)"/>
      <path d="M250 440V461" marker-end="url(#rgt-arrow)"/>
      <path d="M380 120H436" marker-end="url(#rgt-arrow)"/>
      <path d="M380 215H436" marker-end="url(#rgt-arrow)"/>
      <path d="M380 310H436" marker-end="url(#rgt-arrow)"/>
      <path d="M380 405H436" marker-end="url(#rgt-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="408" y="112">yes</text>
      <text x="408" y="207">yes</text>
      <text x="408" y="302">no</text>
      <text x="408" y="397">yes</text>
      <text x="266" y="170">no</text>
      <text x="266" y="265">no</text>
      <text x="268" y="360">yes</text>
      <text x="266" y="455">no</text>
    </g>

    <rect x="440" y="100" width="200" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="540" y="125" font-size="13" font-weight="700" fill="#6e2a24">Block the merge</text>
    <rect x="440" y="190" width="200" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="540" y="211" font-size="13" font-weight="700" fill="#6e2a24">Block the merge</text>
    <text x="540" y="229" font-size="11" fill="#6e2a24">schema 100%, overall 88%</text>
    <rect x="440" y="290" width="200" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="540" y="315" font-size="13" font-weight="700" fill="#294a2e">Pass</text>
    <rect x="440" y="380" width="200" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="540" y="401" font-size="13" font-weight="700" fill="#6e2a24">Block the merge</text>
    <text x="540" y="419" font-size="11" fill="#6e2a24">and list the regressions</text>

    <rect x="120" y="465" width="260" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="486" font-size="13" font-weight="700" fill="#66400f">Pass with a warning</text>
    <text x="250" y="504" font-size="11.5" fill="#66400f">reviewer reads the regressed cases</text>

    <rect x="664" y="290" width="186" height="150" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g fill="#263e5a">
      <text x="757" y="314" font-size="13" font-weight="700">Example run</text>
      <text x="757" y="338" font-size="11.5">240 paired cases</text>
      <text x="757" y="358" font-size="11.5">16 regressions, 3 fixes</text>
      <text x="757" y="378" font-size="11.5">90.8% to 85.4%</text>
      <text x="757" y="398" font-size="11.5">McNemar p = 0.004</text>
      <text x="757" y="424" font-size="12" font-weight="700" fill="#6e2a24">result: block</text>
    </g>

    <text x="435" y="550" font-size="13" fill="#40566b">Critical cases first, then floors, then a paired test: noise passes, real regressions block.</text>
  </g>
</svg>
