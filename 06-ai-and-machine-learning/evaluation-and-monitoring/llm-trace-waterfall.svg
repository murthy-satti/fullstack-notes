<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="ltw-title ltw-desc">
  <title id="ltw-title">Trace waterfall for one TaskFlow agent request</title>
  <desc id="ltw-desc">A trace waterfall for one TaskFlow agent request on a time axis from 0 to 4 seconds. The root span, POST /api/agent, a SERVER span, lasts 4.1 seconds. First child: chat with the configured model, a CLIENT span from 0.1 to 1.5 seconds, with 1,250 input tokens of which 1,024 were cached and 64 output tokens; it returns a tool call. Second child: execute_tool update_task, an INTERNAL span from 1.55 to 1.8 seconds, which contains a MongoDB update span. Third child: execute_tool notify_member from 1.82 to 1.95 seconds. Fourth child: a second chat span from 2.0 to 4.0 seconds with 1,410 input and 180 output tokens, which writes the final answer. A panel lists the attributes of the first chat span: gen_ai.operation.name chat, gen_ai.provider.name openai, gen_ai.request.model from configuration, gen_ai.response.model with the dated snapshot, gen_ai.prompt.name task-agent, gen_ai.prompt.version 7, gen_ai.conversation.id, input tokens, cached input tokens, and taskflow.feature agent. The second model call takes half the request time, and the versions on every span say exactly what ran.</desc>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b">Span</text>
    <text x="320" y="34" font-size="13" font-weight="700" fill="#40566b">Time (seconds)</text>

    <g stroke="#c9d1db" stroke-width="1">
      <path d="M320 46V278M440 46V278M560 46V278M680 46V278M800 46V278"/>
    </g>

    <g font-size="12.5" fill="#36424e">
      <text x="24" y="70">POST /api/agent</text>
      <text x="36" y="106">chat &lt;model&gt;</text>
      <text x="36" y="142">execute_tool update_task</text>
      <text x="52" y="178">mongodb update tasks</text>
      <text x="36" y="214">execute_tool notify_member</text>
      <text x="36" y="250">chat &lt;model&gt;</text>
    </g>
    <g font-size="11" fill="#60788d">
      <text x="230" y="70">SERVER</text>
      <text x="230" y="106">CLIENT</text>
      <text x="230" y="142">INTERNAL</text>
      <text x="230" y="178">CLIENT</text>
      <text x="230" y="214">INTERNAL</text>
      <text x="230" y="250">CLIENT</text>
    </g>

    <rect x="320" y="54" width="492" height="22" rx="5" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="332" y="90" width="168" height="22" rx="5" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="506" y="126" width="30" height="22" rx="5" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="512" y="162" width="14.4" height="22" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="538.4" y="198" width="15.6" height="22" rx="4" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="560" y="234" width="240" height="22" rx="5" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>

    <g font-size="11.5" fill="#36424e">
      <text x="660" y="70">4.1 s</text>
      <text x="508" y="106">1,250 in (1,024 cached), 64 out, tool call</text>
      <text x="544" y="142">0.25 s</text>
      <text x="562" y="214">0.13 s</text>
    </g>
    <text x="680" y="250" font-size="11.5" fill="#263e5a" text-anchor="middle">1,410 in, 180 out, answer: 2.0 s</text>

    <path d="M320 278H812" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="320" y="296">0</text>
      <text x="440" y="296">1</text>
      <text x="560" y="296">2</text>
      <text x="680" y="296">3</text>
      <text x="800" y="296">4</text>
    </g>

    <rect x="24" y="316" width="832" height="134" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="40" y="340" font-size="13" font-weight="700" fill="#263e5a">Attributes of the first chat span</text>
    <g font-size="12" fill="#263e5a">
      <text x="40" y="364">gen_ai.operation.name: chat</text>
      <text x="40" y="384">gen_ai.provider.name: openai</text>
      <text x="40" y="404">gen_ai.request.model: from CHAT_MODEL</text>
      <text x="40" y="424">gen_ai.response.model: the dated snapshot</text>
      <text x="40" y="444">gen_ai.prompt.name: task-agent</text>
      <text x="450" y="364">gen_ai.prompt.version: 7</text>
      <text x="450" y="384">gen_ai.conversation.id: conv_42</text>
      <text x="450" y="404">gen_ai.usage.input_tokens: 1250</text>
      <text x="450" y="424">gen_ai.usage.cache_read.input_tokens: 1024</text>
      <text x="450" y="444">taskflow.feature: agent</text>
    </g>

    <text x="440" y="480" font-size="13" fill="#40566b" text-anchor="middle">The second model call takes half the request; the versions on each span say exactly what ran.</text>
  </g>
</svg>
