<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="pcw-title pcw-desc">
  <title id="pcw-title">Shipping a prompt change like a code change</title>
  <desc id="pcw-desc">Six steps in a snake layout. Step 1, edit the template: change wording, rules, or examples in the repository. Step 2, bump the version: update prompts.lock.json in the same pull request. Step 3, unit tests: rendering, escaping, and the lock-file check. Step 4, the eval suite: golden, edge, and injection cases compared with the current version. Step 5, review: the prompt diff and the score diff side by side in the pull request. Step 6, gradual rollout: a feature flag sends 5 percent, then 50, then 100 percent of requests to the new version while quality metrics are watched. A dashed arrow from the rollout leads to a red box: a regression after release is handled by switching the flag back to task-assistant at version 2, with no redeploy. Version the prompt, test it against a baseline, release it gradually, and keep the old version one switch away.</desc>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <defs>
    <marker id="pcw-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b">Shipping a prompt change like a code change</text>

    <g stroke-width="1.5">
      <rect x="24" y="56" width="250" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="314" y="56" width="250" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="604" y="56" width="250" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="604" y="176" width="250" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="314" y="176" width="250" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="176" width="250" height="80" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="24" y="292" width="530" height="66" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>

    <g font-size="14" font-weight="700">
      <text x="38" y="82" fill="#66400f">1. Edit the template</text>
      <text x="328" y="82" fill="#463365">2. Bump the version</text>
      <text x="618" y="82" fill="#263e5a">3. Unit tests</text>
      <text x="618" y="202" fill="#263e5a">4. Eval suite</text>
      <text x="328" y="202" fill="#66400f">5. Review</text>
      <text x="38" y="202" fill="#294a2e">6. Gradual rollout</text>
      <text x="38" y="316" fill="#6e2a24">Regression after release?</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="38" y="103">Change wording, rules,</text>
      <text x="38" y="120">or examples in the repo</text>
      <text x="328" y="103">Update prompts.lock.json</text>
      <text x="328" y="120">in the same pull request</text>
      <text x="618" y="103">Rendering, escaping, and</text>
      <text x="618" y="120">the lock-file check</text>
      <text x="618" y="223">Golden, edge, and injection</text>
      <text x="618" y="240">cases vs the current version</text>
      <text x="328" y="223">Prompt diff and score diff</text>
      <text x="328" y="240">side by side in the PR</text>
      <text x="38" y="223">Flag: 5%, then 50%, 100%;</text>
      <text x="38" y="240">watch quality metrics</text>
      <text x="38" y="338">Switch the flag back to task-assistant@2; no redeploy is needed</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#pcw-arrow)">
      <path d="M274 96H312"/>
      <path d="M564 96H602"/>
      <path d="M729 136V174"/>
      <path d="M604 216H566"/>
      <path d="M314 216H276"/>
    </g>
    <path d="M149 256V290" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pcw-arrow)"/>

    <text x="440" y="384" font-size="13" fill="#40566b" text-anchor="middle">Version it, test it against a baseline, release it gradually, and keep the old version one switch away.</text>
  </g>
</svg>
