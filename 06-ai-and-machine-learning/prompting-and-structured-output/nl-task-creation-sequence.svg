<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" role="img" aria-labelledby="nts-title nts-desc">
  <title id="nts-title">Natural-language task creation in TaskFlow, end to end</title>
  <desc id="nts-desc">A sequence diagram with four lifelines: TaskFlow Web, TaskFlow API, the model provider, and MongoDB. TaskFlow Web sends POST task-drafts with the text. The API finds the project and its members in MongoDB, and the caller must be a member; MongoDB returns the members. The API renders the prompt with the user's local date and escaped text, then sends the instructions, messages, and JSON Schema to the model provider, which returns draft JSON in the schema's shape. The API checks the rules and repairs once if needed, then returns the draft and any clarifying question to TaskFlow Web; nothing is saved yet. The user reviews and confirms. TaskFlow Web sends POST tasks/from-draft with the edited fields. The API validates them again and calls insertOne on the tasks collection, then returns 201 with the new id. The model proposes; the user confirms; the API validates twice and is the only writer.</desc>
  <rect width="880" height="530" rx="14" fill="#f5f7fb"/>
  <defs>
    <marker id="nts-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="nts-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Natural-language task creation: the model proposes, the user confirms, the API writes</text>

    <g stroke-width="1.5">
      <rect x="65" y="42" width="130" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="295" y="42" width="130" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="535" y="42" width="130" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="730" y="42" width="120" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="130" y="67" fill="#66400f">TaskFlow Web</text>
      <text x="360" y="67" fill="#263e5a">TaskFlow API</text>
      <text x="600" y="67" fill="#463365">Model provider</text>
      <text x="790" y="67" fill="#263e5a">MongoDB</text>
    </g>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M130 82V492"/>
      <path d="M360 82V492"/>
      <path d="M600 82V492"/>
      <path d="M790 82V492"/>
    </g>

    <g stroke-width="1.5">
      <rect x="210" y="196" width="300" height="28" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="210" y="296" width="300" height="28" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="30" y="364" width="200" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="360" y="214" fill="#263e5a">render prompt: user's date, escaped text</text>
      <text x="360" y="314" fill="#263e5a">check rules; repair once if needed</text>
      <text x="130" y="382" fill="#66400f">user reviews and confirms</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#nts-arrow)">
      <path d="M130 116H358"/>
      <path d="M360 152H788"/>
      <path d="M360 250H598"/>
      <path d="M130 416H358"/>
      <path d="M360 450H788"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#nts-arrow-ret)">
      <path d="M790 180H362"/>
      <path d="M600 280H362"/>
      <path d="M360 348H132"/>
      <path d="M360 480H132"/>
    </g>

    <g fill="#f5f7fb">
      <rect x="410" y="133" width="330" height="16"/>
      <rect x="457" y="431" width="236" height="16"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="245" y="109">POST task-drafts { text }</text>
      <text x="575" y="145">find project and members (caller must be a member)</text>
      <text x="700" y="173">members</text>
      <text x="480" y="243">instructions + messages + schema</text>
      <text x="480" y="273">draft JSON in the schema's shape</text>
      <text x="245" y="341">draft + question (unsaved)</text>
      <text x="245" y="409">POST tasks/from-draft</text>
      <text x="575" y="443">validate again, then insertOne(task)</text>
      <text x="245" y="473">201 { id }</text>
    </g>

    <text x="440" y="516" font-size="13" fill="#40566b" text-anchor="middle">The model proposes, the user confirms, and the API validates twice and is the only writer.</text>
  </g>
</svg>
