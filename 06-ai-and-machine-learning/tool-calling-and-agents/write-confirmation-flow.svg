<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="wcf-title wcf-desc">
  <title id="wcf-title">Confirming a write before it runs</title>
  <desc id="wcf-desc">Sequence across four participants: the model, the TaskFlow assistant API, the web app with the user, and MongoDB. The model calls create_task. The API stores a pending action in MongoDB and answers the model with needs_confirmation and an action id. The API builds a confirmation card for the web app. When the user clicks Confirm, the web app posts to the confirm endpoint, the API atomically claims the action by moving it from pending to executing, inserts the task with the action id as its idempotency key, and returns done and the task id to the web app.</desc>
  <defs>
    <marker id="wcf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="24" width="120" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="100" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">Model</text>
    <rect x="270" y="24" width="160" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="350" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#463365">Assistant API</text>
    <rect x="510" y="24" width="160" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="590" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#66400f">Web app and user</text>
    <rect x="730" y="24" width="120" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="790" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>

    <line x1="100" y1="60" x2="100" y2="360" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="350" y1="60" x2="350" y2="360" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="590" y1="60" x2="590" y2="360" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="790" y1="60" x2="790" y2="360" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>

    <line x1="100" y1="96" x2="348" y2="96" stroke="#40566b" stroke-width="1.6" marker-end="url(#wcf-arrow)"/>
    <text x="225" y="88" text-anchor="middle" font-size="12" fill="#36424e">1. create_task(input)</text>

    <line x1="350" y1="130" x2="788" y2="130" stroke="#40566b" stroke-width="1.6" marker-end="url(#wcf-arrow)"/>
    <rect x="436" y="110" width="308" height="18" rx="4" fill="#f5f7fb"/>
    <text x="590" y="123" text-anchor="middle" font-size="12" fill="#36424e">2. upsert pending action (status pending)</text>

    <line x1="350" y1="164" x2="102" y2="164" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#wcf-arrow)"/>
    <text x="225" y="156" text-anchor="middle" font-size="12" fill="#36424e">3. needs_confirmation + id</text>

    <line x1="350" y1="198" x2="588" y2="198" stroke="#40566b" stroke-width="1.6" marker-end="url(#wcf-arrow)"/>
    <text x="470" y="190" text-anchor="middle" font-size="12" fill="#36424e">4. card built by the API</text>

    <line x1="590" y1="236" x2="352" y2="236" stroke="#40566b" stroke-width="1.6" marker-end="url(#wcf-arrow)"/>
    <text x="470" y="228" text-anchor="middle" font-size="12" fill="#36424e">5. user clicks Confirm: POST</text>

    <line x1="350" y1="272" x2="788" y2="272" stroke="#40566b" stroke-width="1.6" marker-end="url(#wcf-arrow)"/>
    <rect x="440" y="252" width="300" height="18" rx="4" fill="#f5f7fb"/>
    <text x="590" y="265" text-anchor="middle" font-size="12" fill="#36424e">6. claim: pending to executing (atomic)</text>

    <line x1="350" y1="306" x2="788" y2="306" stroke="#40566b" stroke-width="1.6" marker-end="url(#wcf-arrow)"/>
    <rect x="456" y="286" width="268" height="18" rx="4" fill="#f5f7fb"/>
    <text x="590" y="299" text-anchor="middle" font-size="12" fill="#36424e">7. insert task, idempotencyKey = id</text>

    <line x1="350" y1="340" x2="588" y2="340" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#wcf-arrow)"/>
    <text x="470" y="332" text-anchor="middle" font-size="12" fill="#36424e">8. done, task id</text>

    <text x="440" y="386" text-anchor="middle" font-size="13" fill="#40566b">The model can only propose; the user's click, checked again on the server, does the write.</text>
  </g>
</svg>
