<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="a2a-title a2a-desc">
  <title id="a2a-title">An A2A task from discovery to result</title>
  <desc id="a2a-desc">Top row: a client agent first fetches the remote agent's Agent Card from /.well-known/agent-card.json, then sends a message with SendMessage or SendStreamingMessage, then receives status and artifact updates over a stream or by push notification, and can poll with GetTask or stop with CancelTask. Below, the task's states in A2A 1.0: a task starts as submitted and moves to working. From working it can need more input from the client, input required, or new credentials, auth required, and return to working when they arrive. It ends in completed with artifacts such as a draft plan, or in failed, canceled or rejected.</desc>
  <defs>
    <marker id="a2a-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="24" width="190" height="64" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="115" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">1. Discover</text>
    <text x="115" y="70" text-anchor="middle" font-size="12" fill="#36424e">GET agent-card.json</text>
    <rect x="236" y="24" width="190" height="64" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="331" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">2. Send</text>
    <text x="331" y="70" text-anchor="middle" font-size="12" fill="#36424e">SendMessage (stream)</text>
    <rect x="452" y="24" width="190" height="64" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="547" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">3. Follow</text>
    <text x="547" y="70" text-anchor="middle" font-size="12" fill="#36424e">SSE updates or push</text>
    <rect x="668" y="24" width="190" height="64" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="763" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">4. Control</text>
    <text x="763" y="70" text-anchor="middle" font-size="12" fill="#36424e">GetTask, CancelTask</text>
    <line x1="210" y1="56" x2="234" y2="56" stroke="#40566b" stroke-width="1.6" marker-end="url(#a2a-arrow)"/>
    <line x1="426" y1="56" x2="450" y2="56" stroke="#40566b" stroke-width="1.6" marker-end="url(#a2a-arrow)"/>
    <line x1="642" y1="56" x2="666" y2="56" stroke="#40566b" stroke-width="1.6" marker-end="url(#a2a-arrow)"/>

    <line x1="20" y1="110" x2="860" y2="110" stroke="#c9d1db" stroke-width="1"/>
    <text x="30" y="136" font-size="13" font-weight="700" fill="#36424e">Task states (A2A 1.0)</text>

    <rect x="30" y="230" width="140" height="48" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="100" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#263e5a">SUBMITTED</text>
    <rect x="240" y="230" width="140" height="48" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="310" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#263e5a">WORKING</text>
    <line x1="170" y1="254" x2="238" y2="254" stroke="#40566b" stroke-width="1.6" marker-end="url(#a2a-arrow)"/>

    <rect x="200" y="150" width="220" height="48" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="310" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">INPUT_REQUIRED</text>
    <text x="310" y="189" text-anchor="middle" font-size="12" fill="#36424e">"Which project?"</text>
    <line x1="290" y1="228" x2="290" y2="200" stroke="#40566b" stroke-width="1.5" marker-end="url(#a2a-arrow)"/>
    <line x1="330" y1="200" x2="330" y2="228" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2a-arrow)"/>

    <rect x="200" y="320" width="220" height="48" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="310" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">AUTH_REQUIRED</text>
    <text x="310" y="359" text-anchor="middle" font-size="12" fill="#36424e">needs new credentials</text>
    <line x1="290" y1="280" x2="290" y2="318" stroke="#40566b" stroke-width="1.5" marker-end="url(#a2a-arrow)"/>
    <line x1="330" y1="318" x2="330" y2="282" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2a-arrow)"/>

    <rect x="540" y="150" width="300" height="48" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="690" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#294a2e">COMPLETED</text>
    <text x="690" y="189" text-anchor="middle" font-size="12" fill="#36424e">artifacts, e.g. a draft plan as JSON</text>
    <rect x="540" y="214" width="300" height="40" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="690" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#6e2a24">FAILED</text>
    <rect x="540" y="266" width="300" height="40" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="690" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#6e2a24">CANCELED</text>
    <rect x="540" y="318" width="300" height="40" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="690" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#6e2a24">REJECTED</text>
    <line x1="380" y1="246" x2="538" y2="176" stroke="#40566b" stroke-width="1.5" marker-end="url(#a2a-arrow)"/>
    <line x1="380" y1="252" x2="538" y2="234" stroke="#40566b" stroke-width="1.5" marker-end="url(#a2a-arrow)"/>
    <line x1="380" y1="258" x2="538" y2="286" stroke="#40566b" stroke-width="1.5" marker-end="url(#a2a-arrow)"/>
    <line x1="380" y1="264" x2="538" y2="336" stroke="#40566b" stroke-width="1.5" marker-end="url(#a2a-arrow)"/>
    <text x="455" y="135" text-anchor="middle" font-size="12" fill="#40566b">dashed: the client answers</text>

    <text x="440" y="408" text-anchor="middle" font-size="13" fill="#40566b">The task ID ties every message, update and artifact together across long runs.</text>
  </g>
</svg>
