<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="tcp-title tcp-desc">
  <title id="tcp-title">How a server handles one tool call</title>
  <desc id="tcp-desc">A tool_use block from the model passes through four gates on the server: find the tool by exact name, validate the input with a schema, authorize it against the signed-in user's scope, and act, where reads run immediately and writes only create a pending action. Any gate can reject the call; a rejection becomes an is_error result with a message the model can act on. Every outcome is shaped into a tool_result with the same id and a size cap, and all results go back in the next user message, which starts the next model request.</desc>
  <defs>
    <marker id="tcp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="tcp-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#b5524b"/></marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="50" width="150" height="84" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="95" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#66400f">Model response</text>
    <text x="95" y="100" text-anchor="middle" font-size="12" fill="#36424e">tool_use block</text>
    <text x="95" y="118" text-anchor="middle" font-size="12" fill="#36424e">id, name, input</text>

    <rect x="192" y="50" width="150" height="84" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="267" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#463365">1. Find tool</text>
    <text x="267" y="100" text-anchor="middle" font-size="12" fill="#36424e">Map lookup</text>
    <text x="267" y="118" text-anchor="middle" font-size="12" fill="#36424e">by exact name</text>

    <rect x="364" y="50" width="150" height="84" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="439" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#463365">2. Validate</text>
    <text x="439" y="100" text-anchor="middle" font-size="12" fill="#36424e">zod safeParse</text>
    <text x="439" y="118" text-anchor="middle" font-size="12" fill="#36424e">limits, formats</text>

    <rect x="536" y="50" width="150" height="84" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="611" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#463365">3. Authorize</text>
    <text x="611" y="100" text-anchor="middle" font-size="12" fill="#36424e">user from session</text>
    <text x="611" y="118" text-anchor="middle" font-size="12" fill="#36424e">project in scope?</text>

    <rect x="708" y="50" width="150" height="84" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="783" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">4. Act</text>
    <text x="783" y="100" text-anchor="middle" font-size="12" fill="#36424e">reads: run now</text>
    <text x="783" y="118" text-anchor="middle" font-size="12" fill="#36424e">writes: propose</text>

    <line x1="170" y1="92" x2="190" y2="92" stroke="#40566b" stroke-width="1.6" marker-end="url(#tcp-arrow)"/>
    <line x1="342" y1="92" x2="362" y2="92" stroke="#40566b" stroke-width="1.6" marker-end="url(#tcp-arrow)"/>
    <line x1="514" y1="92" x2="534" y2="92" stroke="#40566b" stroke-width="1.6" marker-end="url(#tcp-arrow)"/>
    <line x1="686" y1="92" x2="706" y2="92" stroke="#40566b" stroke-width="1.6" marker-end="url(#tcp-arrow)"/>

    <line x1="267" y1="134" x2="267" y2="178" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tcp-arrow-red)"/>
    <line x1="439" y1="134" x2="439" y2="178" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tcp-arrow-red)"/>
    <line x1="611" y1="134" x2="611" y2="178" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tcp-arrow-red)"/>

    <rect x="192" y="180" width="494" height="44" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="439" y="207" text-anchor="middle" font-size="12.5" fill="#6e2a24">Rejected: is_error result with a message the model can fix</text>

    <line x1="783" y1="134" x2="783" y2="258" stroke="#40566b" stroke-width="1.6" marker-end="url(#tcp-arrow)"/>
    <line x1="611" y1="224" x2="611" y2="258" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tcp-arrow-red)"/>

    <rect x="536" y="260" width="322" height="76" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="697" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">5. Shape the tool_result</text>
    <text x="697" y="306" text-anchor="middle" font-size="12" fill="#36424e">same id, JSON capped at 4,000 chars</text>
    <text x="697" y="324" text-anchor="middle" font-size="12" fill="#36424e">is_error: true for rejections</text>

    <line x1="536" y1="298" x2="332" y2="298" stroke="#40566b" stroke-width="1.6" marker-end="url(#tcp-arrow)"/>

    <rect x="20" y="260" width="310" height="76" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="175" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#66400f">Next user message</text>
    <text x="175" y="306" text-anchor="middle" font-size="12" fill="#36424e">tool_result blocks first,</text>
    <text x="175" y="324" text-anchor="middle" font-size="12" fill="#36424e">one message for all calls in the turn</text>

    <line x1="60" y1="258" x2="60" y2="136" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tcp-arrow)"/>
    <rect x="68" y="188" width="92" height="22" rx="4" fill="#f5f7fb"/>
    <text x="114" y="203" text-anchor="middle" font-size="12" fill="#36424e">next request</text>

    <text x="440" y="364" text-anchor="middle" font-size="13" fill="#40566b">Every call passes the same gates; a rejected call is still answered, never dropped.</text>
  </g>
</svg>
