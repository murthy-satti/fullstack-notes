<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="ptr-title ptr-desc">
  <title id="ptr-title">Returning results for parallel tool calls</title>
  <desc id="ptr-desc">One assistant turn contains a short text block, "Let me check first.", and two tool_use blocks, t1 and t2, both calling search_tasks. The executor runs both calls at the same time. The correct reply is one user message that holds tool_result t1 and tool_result t2, with any text after them. Sending a separate user message for each result is the pattern to avoid, because it teaches the model to stop making parallel calls.</desc>
  <defs>
    <marker id="ptr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="800" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="60" width="240" height="160" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="140" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#66400f">Assistant turn</text>
    <rect x="32" y="100" width="216" height="30" rx="6" fill="#ffffff" stroke="#bd7a20"/>
    <text x="140" y="120" text-anchor="middle" font-size="12" fill="#36424e">text: Let me check first.</text>
    <rect x="32" y="138" width="216" height="30" rx="6" fill="#ffffff" stroke="#bd7a20"/>
    <text x="140" y="158" text-anchor="middle" font-size="12" fill="#36424e">tool_use t1: search_tasks</text>
    <rect x="32" y="176" width="216" height="30" rx="6" fill="#ffffff" stroke="#bd7a20"/>
    <text x="140" y="196" text-anchor="middle" font-size="12" fill="#36424e">tool_use t2: search_tasks</text>

    <rect x="296" y="100" width="180" height="80" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="386" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">Executor</text>
    <text x="386" y="150" text-anchor="middle" font-size="12" fill="#36424e">runs t1 and t2 at once</text>
    <text x="386" y="167" text-anchor="middle" font-size="12" fill="#36424e">(Promise.all)</text>

    <line x1="260" y1="140" x2="294" y2="140" stroke="#40566b" stroke-width="1.6" marker-end="url(#ptr-arrow)"/>

    <rect x="516" y="30" width="264" height="130" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="648" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#294a2e">Do: one user message</text>
    <rect x="532" y="68" width="232" height="28" rx="6" fill="#ffffff" stroke="#53845b"/>
    <text x="648" y="87" text-anchor="middle" font-size="12" fill="#36424e">tool_result t1</text>
    <rect x="532" y="102" width="232" height="28" rx="6" fill="#ffffff" stroke="#53845b"/>
    <text x="648" y="121" text-anchor="middle" font-size="12" fill="#36424e">tool_result t2</text>
    <text x="648" y="149" text-anchor="middle" font-size="12" fill="#36424e">results first, any text after them</text>

    <rect x="516" y="180" width="264" height="120" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="648" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#6e2a24">Avoid: a message per result</text>
    <rect x="532" y="216" width="232" height="26" rx="6" fill="#ffffff" stroke="#b5524b"/>
    <text x="648" y="234" text-anchor="middle" font-size="12" fill="#36424e">user: tool_result t1</text>
    <rect x="532" y="248" width="232" height="26" rx="6" fill="#ffffff" stroke="#b5524b"/>
    <text x="648" y="266" text-anchor="middle" font-size="12" fill="#36424e">user: tool_result t2</text>
    <text x="648" y="291" text-anchor="middle" font-size="12" fill="#6e2a24">this discourages parallel calls</text>

    <line x1="476" y1="125" x2="514" y2="100" stroke="#40566b" stroke-width="1.6" marker-end="url(#ptr-arrow)"/>
    <line x1="476" y1="158" x2="514" y2="230" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ptr-arrow)"/>

    <text x="400" y="326" text-anchor="middle" font-size="13" fill="#40566b">Results for one turn travel together, matched to their calls by tool_use_id.</text>
  </g>
</svg>
