<svg xmlns="http://www.w3.org/2000/svg" width="860" height="424" viewBox="0 0 860 424" role="img" aria-labelledby="fwl-title fwl-desc">
  <title id="fwl-title">Layers of AI SDKs and frameworks</title>
  <desc id="fwl-desc">Five layers from bottom to top. Provider HTTP APIs, such as Responses, Messages, generateContent, and the realtime APIs, are the actual contract. Official provider SDKs, the openai, Anthropic, and Google Gen AI packages, are typed wrappers for one vendor. A unified model API, the Vercel AI SDK Core and UI or LangChain chat models, gives one call shape across many providers. Frameworks such as LangGraph, LangChain's createAgent, Mastra, and LlamaIndex add graphs, memory, retrieval, and durable execution. Agent SDKs such as the OpenAI Agents SDK, Google ADK, the Claude Agent SDK, and Microsoft Agent Framework run the agent loop with tools and handoffs. Moving up gives more built-in features and less code to write; moving down gives more control and easier debugging.</desc>
  <defs>
    <marker id="fwl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="424" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Where each SDK and framework sits</text>

    <rect x="30" y="60" width="690" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="46" y="84" font-size="13" font-weight="bold" fill="#463365">Agent SDKs</text>
    <text x="46" y="102" font-size="11" fill="#463365">agent loop, tools, handoffs</text>
    <text x="280" y="84" font-size="11.5" fill="#463365">OpenAI Agents SDK, Google ADK, Claude Agent SDK,</text>
    <text x="280" y="101" font-size="11.5" fill="#463365">Microsoft Agent Framework (Python and .NET)</text>

    <rect x="30" y="126" width="690" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="46" y="150" font-size="13" font-weight="bold" fill="#463365">Frameworks</text>
    <text x="46" y="168" font-size="11" fill="#463365">graphs, memory, retrieval</text>
    <text x="280" y="150" font-size="11.5" fill="#463365">LangGraph, LangChain createAgent, Mastra,</text>
    <text x="280" y="167" font-size="11.5" fill="#463365">LlamaIndex; Python: Pydantic AI, Haystack, DSPy</text>

    <rect x="30" y="192" width="690" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="46" y="216" font-size="13" font-weight="bold" fill="#263e5a">Unified model API</text>
    <text x="46" y="234" font-size="11" fill="#263e5a">one call shape, many providers</text>
    <text x="280" y="216" font-size="11.5" fill="#263e5a">Vercel AI SDK Core and UI (generateText, streamText,</text>
    <text x="280" y="233" font-size="11.5" fill="#263e5a">useChat); LangChain chat model classes</text>

    <rect x="30" y="258" width="690" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="46" y="282" font-size="13" font-weight="bold" fill="#263e5a">Provider SDKs</text>
    <text x="46" y="300" font-size="11" fill="#263e5a">official, typed, one vendor</text>
    <text x="280" y="282" font-size="11.5" fill="#263e5a">openai, @anthropic-ai/sdk, @google/genai</text>
    <text x="280" y="299" font-size="11.5" fill="#263e5a">(each also has an official Python package)</text>

    <rect x="30" y="324" width="690" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="46" y="348" font-size="13" font-weight="bold" fill="#36424e">Provider HTTP APIs</text>
    <text x="46" y="366" font-size="11" fill="#36424e">the actual contract</text>
    <text x="280" y="348" font-size="11.5" fill="#36424e">Responses, Messages, generateContent, realtime</text>
    <text x="280" y="365" font-size="11.5" fill="#36424e">speech APIs, embeddings, batch</text>

    <line x1="782" y1="200" x2="782" y2="76" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwl-arrow)"/>
    <line x1="782" y1="240" x2="782" y2="364" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwl-arrow)"/>
    <text x="782" y="62" font-size="11" fill="#36424e" text-anchor="middle">more built in</text>
    <text x="782" y="224" font-size="11" fill="#36424e" text-anchor="middle">trade-off</text>
    <text x="782" y="380" font-size="11" fill="#36424e" text-anchor="middle">more control</text>

    <text x="30" y="410" font-size="13" fill="#40566b">Every layer you add saves code and adds abstraction you must understand when something goes wrong.</text>
  </g>
</svg>
