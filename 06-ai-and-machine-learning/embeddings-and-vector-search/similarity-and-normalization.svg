<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img" aria-labelledby="san-title san-desc">
  <title id="san-title">Raw dot product compared with similarity on normalized vectors</title>
  <desc id="san-desc">Left panel: raw vectors of different lengths drawn from one origin. The query points between note A, which points almost the same way and has a similar length, and note C, which is much longer and points further away. Note B points in a different direction. On raw dot product, C scores 2.32, A 0.96, and B 0.42, so the long vector C wins. Right panel: the same directions normalized onto a unit circle. Now dot product equals cosine similarity: A scores 0.997, C 0.842, and B 0.416, and Euclidean distance gives the same order because squared distance equals 2 minus 2 times the cosine for unit vectors. Scores come from the four-dimensional demo in this lesson; the drawing shows directions only.</desc>
  <defs>
    <marker id="san-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="san-arrow-o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#bd7a20"/>
    </marker>
    <marker id="san-arrow-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#4774aa"/>
    </marker>
    <marker id="san-arrow-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
    <marker id="san-arrow-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="840" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="210" y="32" font-size="14" font-weight="700" fill="#6e2a24" text-anchor="middle">Raw vectors: dot product rewards length</text>
    <text x="630" y="32" font-size="14" font-weight="700" fill="#294a2e" text-anchor="middle">Unit vectors: dot product = cosine</text>
    <path d="M420 18V340" stroke="#c9d1db" stroke-width="1.5"/>

    <path d="M60 300H262M80 316V120" stroke="#c9d1db" stroke-width="1.2"/>
    <g fill="none" stroke-width="2.4" stroke-linecap="round">
      <path d="M80 300 101 186" stroke="#4774aa" marker-end="url(#san-arrow-b)"/>
      <path d="M80 300 239 112" stroke="#b5524b" marker-end="url(#san-arrow-r)"/>
      <path d="M80 300 203 251" stroke="#4774aa" marker-end="url(#san-arrow-b)"/>
      <path d="M80 300 182 242" stroke="#bd7a20" marker-end="url(#san-arrow-o)"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="92" y="172" fill="#263e5a">B: other topic</text>
      <text x="232" y="100" fill="#6e2a24" text-anchor="end">C: long, partly related</text>
      <text x="210" y="262" fill="#263e5a">A: same topic</text>
      <text x="188" y="238" fill="#66400f">query</text>
    </g>

    <rect x="272" y="96" width="136" height="138" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="340" y="118" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="middle">raw dot product</text>
    <g font-size="12" fill="#6e2a24">
      <text x="288" y="144" font-weight="700">1. C   2.32</text>
      <text x="288" y="166">2. A   0.96</text>
      <text x="288" y="188">3. B   0.42</text>
      <text x="288" y="212" font-size="11.5">C wins because it</text>
      <text x="288" y="227" font-size="11.5">is long, not close</text>
    </g>

    <circle cx="540" cy="250" r="100" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="540" y="372" font-size="11.5" fill="#36424e" text-anchor="middle">unit circle: every vector has length 1</text>
    <path d="M430 250H650M540 360V140" stroke="#c9d1db" stroke-width="1.2"/>
    <g fill="none" stroke-width="2.4" stroke-linecap="round">
      <path d="M540 250 557 152" stroke="#4774aa" marker-end="url(#san-arrow-b)"/>
      <path d="M540 250 604 174" stroke="#4774aa" marker-end="url(#san-arrow-b)"/>
      <path d="M540 250 633 213" stroke="#53845b" marker-end="url(#san-arrow-g)"/>
      <path d="M540 250 626 200" stroke="#bd7a20" marker-end="url(#san-arrow-o)"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="564" y="146" fill="#263e5a">B</text>
      <text x="610" y="170" fill="#263e5a">C</text>
      <text x="641" y="222" fill="#294a2e">A</text>
      <text x="632" y="196" fill="#66400f">query</text>
    </g>

    <rect x="672" y="96" width="148" height="186" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="746" y="118" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">cosine = unit dot</text>
    <g font-size="12" fill="#294a2e">
      <text x="688" y="144" font-weight="700">1. A   0.997</text>
      <text x="688" y="166">2. C   0.842</text>
      <text x="688" y="188">3. B   0.416</text>
      <text x="688" y="214" font-size="11.5">Euclidean: same order</text>
      <text x="688" y="236" font-size="11.5">for unit vectors:</text>
      <text x="688" y="258" font-size="11.5" font-weight="700">d² = 2 − 2 · cos</text>
    </g>

    <text x="420" y="396" font-size="13" fill="#40566b" text-anchor="middle">Normalize at write and query time; then dot product, cosine, and Euclidean rank alike.</text>
  </g>
</svg>
