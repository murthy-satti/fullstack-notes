<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="rlt-title rlt-desc">
  <title id="rlt-title">Measured recall compared with latency for HNSW and IVFFlat in pgvector</title>
  <desc id="rlt-desc">A chart of recall at 10 on the vertical axis, from 0.4 to 1.0, against milliseconds per query on a logarithmic horizontal axis from 1 to 40, measured with pgvector 0.8.7 inside PGlite on 50,000 clustered 128-dimension vectors with 100 queries. The HNSW curve: ef_search 10 gives recall 0.647 at 1.47 ms, 20 gives 0.772 at 1.49 ms, 40 gives 0.851 at 1.66 ms, 80 gives 0.887 at 2.5 ms, 160 gives 0.933 at 3.6 ms, and 320 gives 0.963 at 5.14 ms. The IVFFlat curve with 50 lists: 1 probe gives 0.464 at 1.63 ms, 2 probes 0.585 at 2.06 ms, 4 probes 0.652 at 2.53 ms, and 8 probes 0.747 at 4.0 ms. An exact scan without an index gives recall 1.0 at 29.6 ms. Building the HNSW index took 38.4 seconds and the IVFFlat index 2.1 seconds. Both indexes trade recall for speed, and here HNSW reaches higher recall at the same latency.</desc>
  <rect width="840" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="90" y="44" font-size="12.5" font-weight="700" fill="#36424e">recall@10</text>
    <rect x="90" y="60" width="510" height="300" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <g stroke="#e3e8ee" stroke-width="1">
      <path d="M90 110H600M90 160H600M90 210H600M90 260H600M90 310H600"/>
      <path d="M186 60V360M312.5 60V360M408 60V360M504 60V360"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="end">
      <text x="82" y="64">1.0</text><text x="82" y="114">0.9</text><text x="82" y="164">0.8</text><text x="82" y="214">0.7</text><text x="82" y="264">0.6</text><text x="82" y="314">0.5</text><text x="82" y="364">0.4</text>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="90" y="378">1</text><text x="186" y="378">2</text><text x="312.5" y="378">5</text><text x="408" y="378">10</text><text x="504" y="378">20</text><text x="600" y="378">40</text>
    </g>
    <text x="345" y="398" font-size="12.5" font-weight="700" fill="#36424e" text-anchor="middle">milliseconds per query (log scale)</text>

    <path d="M143 236.5 145 174 160 134.5 217 116.5 267 93.5 316 78.5" fill="none" stroke="#4774aa" stroke-width="2.5"/>
    <path d="M157.5 328 190 267.5 218 234 282 186.5" fill="none" stroke="#8062a8" stroke-width="2.5" stroke-dasharray="7 4"/>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="143" cy="236.5" r="5"/><circle cx="145" cy="174" r="5"/><circle cx="160" cy="134.5" r="5"/><circle cx="217" cy="116.5" r="5"/><circle cx="267" cy="93.5" r="5"/><circle cx="316" cy="78.5" r="5"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="152.5" y="323" width="10" height="10"/><rect x="185" y="262.5" width="10" height="10"/><rect x="213" y="229" width="10" height="10"/><rect x="277" y="181.5" width="10" height="10"/>
    </g>
    <circle cx="558" cy="60" r="6" fill="#e7f3e9" stroke="#53845b" stroke-width="2.4"/>

    <g font-size="11" fill="#263e5a">
      <text x="134" y="240" text-anchor="end">ef 10</text>
      <text x="137" y="178" text-anchor="end">20</text>
      <text x="152" y="130" text-anchor="end">40</text>
      <text x="214" y="105" text-anchor="middle">80</text>
      <text x="267" y="83" text-anchor="middle">160</text>
      <text x="324" y="82">320</text>
    </g>
    <g font-size="11" fill="#463365">
      <text x="170" y="337">1 probe</text>
      <text x="200" y="279">2</text>
      <text x="230" y="243">4</text>
      <text x="294" y="196">8 probes</text>
    </g>
    <text x="548" y="80" font-size="11" fill="#294a2e" text-anchor="end">exact scan: 1.0 at 29.6 ms</text>

    <rect x="400" y="250" width="186" height="96" rx="8" fill="#f5f7fb" stroke="#c9d1db" stroke-width="1.2"/>
    <path d="M414 272H444" stroke="#4774aa" stroke-width="2.5"/>
    <text x="452" y="276" font-size="12" fill="#263e5a">HNSW (ef_search)</text>
    <path d="M414 298H444" stroke="#8062a8" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="452" y="302" font-size="12" fill="#463365">IVFFlat (probes)</text>
    <circle cx="429" cy="324" r="5" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="452" y="328" font-size="12" fill="#294a2e">exact scan</text>

    <rect x="620" y="60" width="200" height="190" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="634" y="82" font-size="13" font-weight="700" fill="#263e5a">Measured run</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="634" y="104">pgvector 0.8.7 in PGlite</text>
      <text x="634" y="122">(PostgreSQL in WebAssembly)</text>
      <text x="634" y="140">50,000 clustered vectors</text>
      <text x="634" y="158">128 dimensions, cosine</text>
      <text x="634" y="176">100 queries, k = 10</text>
      <text x="634" y="200">HNSW build: 38.4 s</text>
      <text x="634" y="218">IVFFlat build: 2.1 s</text>
      <text x="634" y="236">(m 16, ef_construction 64)</text>
    </g>

    <text x="420" y="420" font-size="13" fill="#40566b" text-anchor="middle">Recall climbs fast, then flattens while latency keeps growing: tune to a target, not to a maximum.</text>
  </g>
</svg>
