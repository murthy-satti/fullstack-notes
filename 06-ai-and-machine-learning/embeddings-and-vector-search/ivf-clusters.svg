<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="ivc-title ivc-desc">
  <title id="ivc-title">How an IVF index scans only the nearest clusters</title>
  <desc id="ivc-desc">Stored vectors are grouped into five clusters, A to E, around centroids found by k-means. A query arrives between clusters B, C, and D. The index compares the query with the five centroids and, with probes set to 2, scans only the vectors of the two nearest clusters, B and C, drawn with green outlines. The true nearest neighbor of the query sits in cluster D, just across the boundary, and is drawn in red: it is missed because cluster D was not probed. On the right: step 1, build: k-means finds the centroids from data already loaded; step 2, compare the query with every centroid; step 3, scan only the nearest probes clusters; step 4, more probes raise recall and work together; the clusters reflect the data at build time, so rebuild when the data changes a lot.</desc>
  <defs>
    <marker id="ivc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="840" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="30" y="30" width="520" height="320" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>

    <g fill="none" stroke-width="1.8">
      <circle cx="120" cy="120" r="62" stroke="#8a96a3" stroke-dasharray="5 4"/>
      <circle cx="270" cy="110" r="62" stroke="#53845b" stroke-width="3"/>
      <circle cx="300" cy="262" r="62" stroke="#53845b" stroke-width="3"/>
      <circle cx="450" cy="190" r="62" stroke="#8a96a3" stroke-dasharray="5 4"/>
      <circle cx="130" cy="285" r="52" stroke="#8a96a3" stroke-dasharray="5 4"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="middle">
      <text x="120" y="50">A</text>
      <text x="270" y="42">B (probed)</text>
      <text x="300" y="343">C (probed)</text>
      <text x="450" y="120">D</text>
      <text x="80" y="236">E</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <circle cx="96" cy="100" r="4"/><circle cx="140" cy="96" r="4"/><circle cx="110" cy="148" r="4"/><circle cx="150" cy="136" r="4"/><circle cx="84" cy="128" r="4"/>
      <circle cx="246" cy="88" r="4"/><circle cx="292" cy="84" r="4"/><circle cx="256" cy="134" r="4"/><circle cx="300" cy="124" r="4"/><circle cx="232" cy="112" r="4"/>
      <circle cx="276" cy="242" r="4"/><circle cx="322" cy="238" r="4"/><circle cx="284" cy="288" r="4"/><circle cx="326" cy="282" r="4"/><circle cx="262" cy="266" r="4"/>
      <circle cx="470" cy="170" r="4"/><circle cx="480" cy="214" r="4"/><circle cx="440" cy="226" r="4"/><circle cx="430" cy="160" r="4"/>
      <circle cx="110" cy="270" r="4"/><circle cx="150" cy="296" r="4"/><circle cx="122" cy="310" r="4"/><circle cx="146" cy="262" r="4"/>
    </g>
    <g fill="#263e5a" font-size="14" font-weight="700" text-anchor="middle">
      <text x="120" y="125">+</text><text x="270" y="115">+</text><text x="300" y="267">+</text><text x="450" y="195">+</text><text x="130" y="290">+</text>
    </g>

    <g stroke="#40566b" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
      <path d="M330 185 272 113"/>
      <path d="M330 185 301 258"/>
    </g>
    <rect x="322" y="177" width="16" height="16" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.4"/>
    <text x="344" y="190" font-size="11.5" font-weight="700" fill="#66400f">query</text>

    <circle cx="397" cy="190" r="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="2.4"/>
    <text x="397" y="173" font-size="11" font-weight="700" fill="#6e2a24" text-anchor="middle">missed</text>

    <g font-size="12" fill="#36424e">
      <rect x="570" y="30" width="250" height="62" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="584" y="52" font-weight="700" fill="#463365">1. build (after loading data)</text>
      <text x="584" y="72" fill="#463365">k-means finds the centroids (+)</text>
      <rect x="570" y="106" width="250" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="584" y="133" font-weight="700" fill="#263e5a">2. compare query with centroids</text>
      <rect x="570" y="164" width="250" height="62" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="584" y="186" font-weight="700" fill="#294a2e">3. scan the nearest probes lists</text>
      <text x="584" y="206" fill="#294a2e">here probes = 2: B and C</text>
      <rect x="570" y="240" width="250" height="110" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
      <text x="584" y="262" font-weight="700" fill="#6e2a24">4. the true neighbor is in D</text>
      <text x="584" y="282" fill="#6e2a24">not probed, so it is missed</text>
      <text x="584" y="302" fill="#6e2a24">more probes: higher recall</text>
      <text x="584" y="322" fill="#6e2a24">and more work per query</text>
      <text x="584" y="340" fill="#6e2a24">rebuild when data drifts</text>
    </g>

    <text x="420" y="382" font-size="13" fill="#40566b" text-anchor="middle">IVF trades recall for speed by scanning a few clusters; neighbors near boundaries are the first to go.</text>
  </g>
</svg>
