<svg xmlns="http://www.w3.org/2000/svg" width="720" height="225" viewBox="0 0 720 225" role="img" aria-labelledby="title desc">
  <title id="title">Common DNS record types</title>
  <desc id="desc">A record points to IPv4, AAAA to IPv6, CNAME aliases a name, MX identifies mail servers, and TXT stores text data.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.type{font-size:15px;font-weight:bold}.meaning{font-size:12px}</style></defs>
  <text x="360" y="25" text-anchor="middle" class="type">DNS records answer different kinds of questions</text>
  <rect x="20" y="48" width="128" height="62" rx="8" class="box"/><text x="84" y="72" text-anchor="middle" class="type">A</text><text x="84" y="94" text-anchor="middle" class="meaning">IPv4 address</text>
  <rect x="164" y="48" width="128" height="62" rx="8" class="box"/><text x="228" y="72" text-anchor="middle" class="type">AAAA</text><text x="228" y="94" text-anchor="middle" class="meaning">IPv6 address</text>
  <rect x="308" y="48" width="128" height="62" rx="8" class="box"/><text x="372" y="72" text-anchor="middle" class="type">CNAME</text><text x="372" y="94" text-anchor="middle" class="meaning">alias name</text>
  <rect x="452" y="48" width="108" height="62" rx="8" class="box"/><text x="506" y="72" text-anchor="middle" class="type">MX</text><text x="506" y="94" text-anchor="middle" class="meaning">mail host</text>
  <rect x="576" y="48" width="128" height="62" rx="8" class="box"/><text x="640" y="72" text-anchor="middle" class="type">TXT</text><text x="640" y="94" text-anchor="middle" class="meaning">text data</text>
  <path d="M84 110V145H640M228 110V145M372 110V145M506 110V145M640 110V145" fill="none" stroke="#718496" stroke-width="1.5"/>
  <text x="360" y="178" text-anchor="middle" class="meaning">A DNS zone publishes records; a resolver returns the record type requested.</text>
  <text x="360" y="199" text-anchor="middle" class="meaning">Records are cached according to their TTL, so updates may take time to appear.</text>
</svg>
