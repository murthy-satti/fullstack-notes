<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Polling and WebSocket update patterns</title>
  <desc id="desc">Polling repeatedly asks the server for updates, while WebSocket keeps a connection open so either side can send messages when needed.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker><style>text{font-family:Arial,sans-serif;fill:#17324d}.title{font-size:14px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.back{stroke:#718496;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style></defs>
  <text x="360" y="25" text-anchor="middle" class="title">Polling: the client asks repeatedly</text>
  <text x="95" y="55" text-anchor="middle" class="small">Browser</text><text x="625" y="55" text-anchor="middle" class="small">Server</text>
  <path d="M110 72H610" class="line"/><text x="360" y="67" text-anchor="middle" class="small">request</text>
  <path d="M610 92H110" class="back"/><text x="360" y="88" text-anchor="middle" class="small">no update yet</text>
  <path d="M110 112H610" class="line"/>
  <path d="M610 132H110" class="back"/><text x="360" y="128" text-anchor="middle" class="small">new data</text>
  <path d="M25 151H695" stroke="#d0d9e0"/>
  <text x="360" y="176" text-anchor="middle" class="title">WebSocket: one connection supports ongoing two-way messages</text>
  <path d="M110 199H610" class="line"/><text x="360" y="194" text-anchor="middle" class="small">open connection</text>
  <path d="M610 222H110" class="back"/><text x="360" y="217" text-anchor="middle" class="small">server can push an update when it is ready</text>
</svg>
