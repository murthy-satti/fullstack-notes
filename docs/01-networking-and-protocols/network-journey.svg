<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-labelledby="title desc">
  <title id="title">Layers in a web request</title>
  <desc id="desc">A client resolves a name, sends packets over IP using a transport connection, and exchanges an application request and response with a server.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#315b7d"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.small{font-size:13px}.label{font-size:16px;font-weight:bold}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="18" y="58" width="122" height="66" rx="9" class="box"/>
  <text x="79" y="84" text-anchor="middle" class="label">Client</text>
  <text x="79" y="105" text-anchor="middle" class="small">application</text>
  <rect x="184" y="58" width="140" height="66" rx="9" class="box"/>
  <text x="254" y="84" text-anchor="middle" class="label">DNS lookup</text>
  <text x="254" y="105" text-anchor="middle" class="small">name → IP address</text>
  <rect x="368" y="58" width="148" height="66" rx="9" class="box"/>
  <text x="442" y="84" text-anchor="middle" class="label">Transport + IP</text>
  <text x="442" y="105" text-anchor="middle" class="small">delivery across networks</text>
  <rect x="560" y="58" width="142" height="66" rx="9" class="box"/>
  <text x="631" y="84" text-anchor="middle" class="label">Web server</text>
  <text x="631" y="105" text-anchor="middle" class="small">request ↔ response</text>
  <path d="M140 91H177" class="line"/>
  <path d="M324 91H361" class="line"/>
  <path d="M516 91H553" class="line"/>
  <text x="360" y="160" text-anchor="middle" class="small">Each layer has a distinct job; HTTPS adds protection to the application exchange.</text>
</svg>
