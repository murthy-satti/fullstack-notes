<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">TCP stream reads do not preserve application write boundaries</title>
  <desc id="desc">Two application writes are sent as one byte stream. The receiving program may read the bytes in different groupings, so it needs message framing.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.small{font-size:13px}.title{font-size:15px;font-weight:bold}</style></defs>
  <text x="360" y="27" text-anchor="middle" class="title">Sender writes two messages</text>
  <rect x="120" y="44" width="190" height="40" rx="6" class="box"/><text x="215" y="69" text-anchor="middle" class="small">write("HELLO")</text>
  <rect x="410" y="44" width="190" height="40" rx="6" class="box"/><text x="505" y="69" text-anchor="middle" class="small">write("WORLD")</text>
  <path d="M75 100H645" stroke="#315b7d" stroke-width="3"/>
  <text x="360" y="123" text-anchor="middle" class="title">TCP transports an ordered byte stream: HELLOWORLD</text>
  <text x="360" y="153" text-anchor="middle" class="small">One possible read: "HEL" then "LOWORLD"</text>
  <text x="360" y="177" text-anchor="middle" class="small">Another possible read: "HELLOWORLD"</text>
  <text x="360" y="205" text-anchor="middle" class="small">The application needs a length field, delimiter, or other framing rule.</text>
</svg>
