<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
  <title id="title">The five values that identify a network flow</title>
  <desc id="desc">A network flow is commonly identified by transport protocol, source IP address and port, and destination IP address and port.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:14px;font-weight:bold}.small{font-size:12px}</style></defs>
  <text x="360" y="27" text-anchor="middle" class="title">A flow is more than a port number</text>
  <rect x="12" y="52" width="118" height="70" rx="8" class="box"/><text x="71" y="79" text-anchor="middle" class="title">Protocol</text><text x="71" y="101" text-anchor="middle" class="small">TCP</text>
  <rect x="150" y="52" width="150" height="70" rx="8" class="box"/><text x="225" y="79" text-anchor="middle" class="title">Source address</text><text x="225" y="101" text-anchor="middle" class="small">192.168.1.25</text>
  <rect x="320" y="52" width="118" height="70" rx="8" class="box"/><text x="379" y="79" text-anchor="middle" class="title">Source port</text><text x="379" y="101" text-anchor="middle" class="small">53000</text>
  <rect x="458" y="52" width="132" height="70" rx="8" class="box"/><text x="524" y="79" text-anchor="middle" class="title">Destination IP</text><text x="524" y="101" text-anchor="middle" class="small">203.0.113.10</text>
  <rect x="610" y="52" width="98" height="70" rx="8" class="box"/><text x="659" y="79" text-anchor="middle" class="title">Dest. port</text><text x="659" y="101" text-anchor="middle" class="small">443</text>
  <text x="360" y="158" text-anchor="middle" class="small">Together these protocol, address, and port values distinguish this flow.</text>
  <text x="360" y="181" text-anchor="middle" class="small">A NAT gateway may rewrite an address or port and track the mapping for replies.</text>
</svg>
