<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" viewBox="0 0 700 190" role="img" aria-labelledby="title desc">
  <title id="title">IP packet route from a laptop to a public server</title>
  <desc id="desc">A laptop checks whether a destination is local. For a public destination it sends the packet to its default gateway, which forwards it to the next network.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:15px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="18" y="54" width="142" height="68" rx="8" class="box"/><text x="89" y="80" text-anchor="middle" class="title">Laptop</text><text x="89" y="101" text-anchor="middle" class="small">192.168.1.42/24</text>
  <rect x="202" y="54" width="142" height="68" rx="8" class="box"/><text x="273" y="80" text-anchor="middle" class="title">Default gateway</text><text x="273" y="101" text-anchor="middle" class="small">local router</text>
  <rect x="386" y="54" width="142" height="68" rx="8" class="box"/><text x="457" y="80" text-anchor="middle" class="title">Other networks</text><text x="457" y="101" text-anchor="middle" class="small">routers choose next hops</text>
  <rect x="570" y="54" width="112" height="68" rx="8" class="box"/><text x="626" y="80" text-anchor="middle" class="title">Server</text><text x="626" y="101" text-anchor="middle" class="small">destination IP</text>
  <path d="M160 88H195M344 88H379M528 88H563" class="line"/>
  <text x="350" y="157" text-anchor="middle" class="small">If the destination is outside the local prefix, send it to the gateway.</text>
</svg>
