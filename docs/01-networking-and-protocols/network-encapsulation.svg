<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" role="img" aria-labelledby="title desc">
  <title id="title">Encapsulation adds information at each network layer</title>
  <desc id="desc">HTTP application data is protected in a TLS record, carried by a TCP segment, placed in an IP packet, and wrapped in a local network frame.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.outer{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.inner{fill:#fff;stroke:#315b7d;stroke-width:1.5}.title{font-size:15px;font-weight:bold}.small{font-size:12px}</style>
  </defs>
  <rect x="18" y="36" width="684" height="112" rx="10" class="outer"/>
  <text x="360" y="61" text-anchor="middle" class="title">Local network frame</text>
  <rect x="74" y="73" width="572" height="57" rx="8" class="inner"/>
  <text x="360" y="96" text-anchor="middle" class="title">IP packet</text>
  <rect x="137" y="102" width="446" height="42" rx="7" class="outer"/>
  <text x="360" y="121" text-anchor="middle" class="small">TCP segment</text>
  <rect x="207" y="126" width="306" height="39" rx="7" class="inner"/>
  <text x="360" y="145" text-anchor="middle" class="small">TLS record</text>
  <rect x="274" y="151" width="172" height="38" rx="7" class="outer"/>
  <text x="360" y="175" text-anchor="middle" class="small">HTTP data</text>
  <text x="360" y="204" text-anchor="middle" class="small">Each layer adds control information; the receiver processes the layers in reverse.</text>
</svg>
