<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" viewBox="0 0 700 190" role="img" aria-labelledby="title desc">
  <title id="title">Client and server port endpoints</title>
  <desc id="desc">A browser connects from a temporary source port on its IP address to a web server's TCP port 443. Replies are matched to the client socket.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#eef5fa;stroke:#315b7d;stroke-width:2}.title{font-size:15px;font-weight:bold}.small{font-size:12px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.back{stroke:#718496;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style>
  </defs>
  <rect x="20" y="50" width="210" height="72" rx="8" class="box"/><text x="125" y="78" text-anchor="middle" class="title">Browser socket</text><text x="125" y="101" text-anchor="middle" class="small">192.168.1.25 : 53000</text>
  <rect x="470" y="50" width="210" height="72" rx="8" class="box"/><text x="575" y="78" text-anchor="middle" class="title">HTTPS server</text><text x="575" y="101" text-anchor="middle" class="small">203.0.113.10 : 443 / TCP</text>
  <path d="M230 70H462" class="line"/><text x="346" y="63" text-anchor="middle" class="small">request</text>
  <path d="M470 105H238" class="back"/><text x="354" y="130" text-anchor="middle" class="small">response returns to the client socket</text>
</svg>
