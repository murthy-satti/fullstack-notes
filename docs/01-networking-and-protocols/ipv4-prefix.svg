<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-labelledby="title desc">
  <title id="title">IPv4 address divided into network prefix and host bits</title>
  <desc id="desc">A 32-bit IPv4 address with a /24 prefix uses the first 24 bits for the network and the last 8 bits for addresses within that subnet.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.net{fill:#dcebf5;stroke:#315b7d;stroke-width:2}.host{fill:#fff1d6;stroke:#a87519;stroke-width:2}.title{font-size:16px;font-weight:bold}.small{font-size:13px}</style></defs>
  <text x="360" y="28" text-anchor="middle" class="title">192.168.1.42/24 = 32 address bits</text>
  <rect x="60" y="52" width="450" height="64" rx="7" class="net"/>
  <rect x="510" y="52" width="150" height="64" rx="7" class="host"/>
  <text x="285" y="79" text-anchor="middle" class="title">Network prefix: first 24 bits</text>
  <text x="285" y="101" text-anchor="middle" class="small">192.168.1</text>
  <text x="585" y="79" text-anchor="middle" class="title">8 host bits</text>
  <text x="585" y="101" text-anchor="middle" class="small">.42</text>
  <text x="360" y="145" text-anchor="middle" class="small">This address belongs to network 192.168.1.0/24.</text>
  <text x="360" y="166" text-anchor="middle" class="small">In a conventional IPv4 /24, .0 is the network and .255 is broadcast.</text>
</svg>
