<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" role="img" aria-labelledby="title desc">
  <title id="title">TCP and UDP communication models</title>
  <desc id="desc">TCP uses a three-way SYN, SYN-ACK, ACK handshake before an ordered stream. UDP sends individual datagrams without transport-level acknowledgements.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17324d}.head{font-size:16px;font-weight:bold}.label{font-size:13px}.line{stroke:#315b7d;stroke-width:2;marker-end:url(#arrow)}.back{stroke:#7a8792;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:5 4}</style>
  </defs>
  <text x="350" y="25" text-anchor="middle" class="head">TCP: connection setup, then an ordered byte stream</text>
  <text x="95" y="60" text-anchor="middle" class="label">Client</text><text x="600" y="60" text-anchor="middle" class="label">Server</text>
  <path d="M110 74H585" class="line"/><text x="350" y="70" text-anchor="middle" class="label">SYN</text>
  <path d="M585 94H110" class="back"/><text x="350" y="91" text-anchor="middle" class="label">SYN-ACK</text>
  <path d="M110 114H585" class="line"/><text x="350" y="111" text-anchor="middle" class="label">ACK; connection established</text>
  <path d="M110 134H585" class="line"/><text x="350" y="131" text-anchor="middle" class="label">ordered bytes; lost data can be retransmitted</text>
  <path d="M20 154H680" stroke="#d0d9e0"/>
  <text x="350" y="180" text-anchor="middle" class="head">UDP: independent datagrams</text>
  <path d="M110 204H585" class="line"/><text x="350" y="199" text-anchor="middle" class="label">datagram 1</text>
  <path d="M110 229H585" class="line"/><text x="350" y="224" text-anchor="middle" class="label">datagram 2; UDP itself does not acknowledge or reorder</text>
</svg>
