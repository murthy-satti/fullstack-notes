<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-labelledby="dma-title dma-desc">
  <title id="dma-title">DMARC alignment in three cases</title>
  <desc id="dma-desc">Three messages, all with the visible From address reminders@example.com. Case 1, custom return path: SPF passes for the envelope domain bounce.example.com, which aligns under relaxed alignment but not under strict alignment; DKIM passes with d=example.com, which aligns under both modes; DMARC passes. Case 2, provider defaults: SPF passes for amazonses.com and DKIM passes for provider.example.net, but neither belongs to example.com, so nothing aligns and DMARC fails despite two passes. Case 3, a forwarded message: SPF fails because the forwarder's IP is not listed, but DKIM with d=example.com still verifies, so DMARC passes through DKIM. DMARC needs one check that both passes and aligns with the From domain.</desc>
  <rect width="880" height="404" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="26" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Visible From: reminders@example.com in every case</text>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="119" y="50">Case</text>
      <text x="337" y="50">SPF (envelope MAIL FROM)</text>
      <text x="575" y="50">DKIM (d= domain)</text>
      <text x="777" y="50">DMARC</text>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="24" y="60" width="190" height="92" rx="8"/>
      <rect x="24" y="164" width="190" height="92" rx="8"/>
      <rect x="24" y="268" width="190" height="92" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="119" y="100">1. Custom</text>
      <text x="119" y="117">return path</text>
      <text x="119" y="204">2. Provider</text>
      <text x="119" y="221">defaults</text>
      <text x="119" y="308">3. Forwarded</text>
      <text x="119" y="325">message</text>
    </g>

    <rect x="222" y="60" width="230" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="460" y="60" width="230" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="698" y="60" width="158" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="222" y="164" width="230" height="92" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="460" y="164" width="230" height="92" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="698" y="164" width="158" height="92" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="222" y="268" width="230" height="92" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="460" y="268" width="230" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="698" y="268" width="158" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>

    <g font-size="12.5" font-weight="700">
      <text x="337" y="88" fill="#294a2e">bounce.example.com: pass</text>
      <text x="575" y="88" fill="#294a2e">example.com: pass</text>
      <text x="777" y="112" fill="#294a2e">pass</text>
      <text x="337" y="192" fill="#6e2a24">amazonses.com: pass</text>
      <text x="575" y="192" fill="#6e2a24">provider.example.net: pass</text>
      <text x="777" y="206" fill="#6e2a24">fail</text>
      <text x="337" y="296" fill="#6e2a24">fail at the forwarder</text>
      <text x="575" y="296" fill="#294a2e">example.com: pass</text>
      <text x="777" y="306" fill="#294a2e">pass</text>
    </g>
    <g font-size="11.5">
      <text x="337" y="110" fill="#294a2e">relaxed: aligned</text>
      <text x="337" y="128" fill="#294a2e">strict: not aligned</text>
      <text x="575" y="110" fill="#294a2e">aligned in relaxed</text>
      <text x="575" y="128" fill="#294a2e">and strict mode</text>
      <text x="337" y="214" fill="#6e2a24">not example.com:</text>
      <text x="337" y="232" fill="#6e2a24">not aligned</text>
      <text x="575" y="214" fill="#6e2a24">not example.com:</text>
      <text x="575" y="232" fill="#6e2a24">not aligned</text>
      <text x="777" y="226" fill="#6e2a24">despite two passes</text>
      <text x="337" y="318" fill="#6e2a24">the forwarder's IP</text>
      <text x="337" y="336" fill="#6e2a24">is not in the record</text>
      <text x="575" y="318" fill="#294a2e">the signature survives</text>
      <text x="575" y="336" fill="#294a2e">forwarding: aligned</text>
      <text x="777" y="326" fill="#294a2e">through DKIM</text>
    </g>

    <text x="440" y="388" font-size="13" fill="#40566b">DMARC needs one check that both passes and aligns with the From domain.</text>
  </g>
</svg>
