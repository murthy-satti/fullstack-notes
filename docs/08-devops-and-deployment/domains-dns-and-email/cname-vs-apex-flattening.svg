<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="cvf-title cvf-desc">
  <title id="cvf-title">A normal CNAME below the apex compared with an alias or flattened CNAME at the apex</title>
  <desc id="cvf-desc">Top, www.example.com with a normal CNAME: 1, the resolver asks the example.com nameservers for the A record of www.example.com; 2, they answer with a CNAME to taskflow-web.cdn.example.net with a TTL of 300; 3, the resolver asks the CDN's nameservers for that name; 4, the CDN answers with A records 203.0.113.50 and 203.0.113.51 chosen near the resolver. Bottom, the apex example.com with an alias record or flattened CNAME: 1, the resolver asks the example.com nameservers for the A record of example.com; a, the DNS host resolves taskflow-web.cdn.example.net itself; b, the CDN's nameservers return A records chosen for the DNS host's location; 2, the DNS host answers the resolver with those A records and no CNAME, so the apex can keep its SOA, NS, MX, and TXT records. The trade-off is that the CDN's DNS sees the DNS host's location rather than the user's resolver.</desc>
  <defs>
    <marker id="cvf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cvf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="cvf-arrow-int" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="880" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">www.example.com with a normal CNAME</text>

    <rect x="24" y="42" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="69" font-size="14" font-weight="700" fill="#66400f">Resolver</text>
    <rect x="365" y="42" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="61" font-size="13" font-weight="700" fill="#263e5a">example.com</text>
    <text x="440" y="77" font-size="11.5" fill="#263e5a">nameservers</text>
    <rect x="706" y="42" width="150" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="781" y="61" font-size="13" font-weight="700" fill="#463365">CDN's</text>
    <text x="781" y="77" font-size="11.5" fill="#463365">nameservers</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M99 86V196"/>
      <path d="M440 86V196"/>
      <path d="M781 86V196"/>
    </g>
    <path d="M99 108H438" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#cvf-arrow)"/>
    <path d="M440 132H101" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#cvf-arrow-ret)"/>
    <path d="M99 160H779" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#cvf-arrow)"/>
    <path d="M781 184H101" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#cvf-arrow-ret)"/>
    <g font-size="11.5" fill="#36424e">
      <text x="270" y="102">1. A? www.example.com</text>
      <text x="270" y="126">2. CNAME taskflow-web.cdn.example.net (TTL 300)</text>
      <text x="610" y="154">3. A? taskflow-web.cdn.example.net</text>
      <text x="610" y="178">4. A 203.0.113.50 and .51 (near the resolver)</text>
    </g>

    <path d="M24 212H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="236" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">example.com (the apex) with an alias record or flattened CNAME</text>

    <rect x="24" y="246" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="273" font-size="14" font-weight="700" fill="#66400f">Resolver</text>
    <rect x="365" y="246" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="265" font-size="13" font-weight="700" fill="#263e5a">example.com</text>
    <text x="440" y="281" font-size="11.5" fill="#263e5a">nameservers</text>
    <rect x="706" y="246" width="150" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="781" y="265" font-size="13" font-weight="700" fill="#463365">CDN's</text>
    <text x="781" y="281" font-size="11.5" fill="#463365">nameservers</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M99 290V396"/>
      <path d="M440 290V396"/>
      <path d="M781 290V396"/>
    </g>
    <path d="M99 314H438" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#cvf-arrow)"/>
    <path d="M440 338H779" fill="none" stroke="#8062a8" stroke-width="2" stroke-linecap="round" marker-end="url(#cvf-arrow-int)"/>
    <path d="M781 362H442" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#cvf-arrow-int)"/>
    <path d="M440 386H101" fill="none" stroke="#53845b" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#cvf-arrow-ret)"/>
    <g font-size="11.5" fill="#36424e">
      <text x="270" y="308">1. A? example.com</text>
      <text x="610" y="332" fill="#463365">a. DNS host resolves taskflow-web.cdn.example.net</text>
      <text x="610" y="356" fill="#463365">b. A records, chosen for the DNS host's location</text>
      <text x="270" y="380" font-weight="700" fill="#294a2e">2. A 203.0.113.50 and .51, no CNAME</text>
    </g>

    <text x="440" y="424" font-size="13" fill="#40566b">Below the apex a CNAME is fine; at the apex the DNS host resolves the target and answers with addresses.</text>
    <text x="440" y="444" font-size="13" fill="#40566b">Trade-off: the CDN's DNS sees the DNS host's location, not the user's resolver.</text>
  </g>
</svg>
