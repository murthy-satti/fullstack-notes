<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="hcf-title hcf-desc">
  <title id="hcf-title">A hotfix across release branches</title>
  <desc id="hcf-desc">Three lines of history: main, release/2.4 cut from main and tagged v2.4.0, and the older long-term support line release/2.3 tagged v2.3.6. A bug is reported in 2.4.0 and is also present in 2.3.6. The fix is merged to main first, with review and tests. It is then cherry-picked with the -x option into each supported branch: into release/2.4, where the new commit is tagged v2.4.1, and into release/2.3, adapted where the old code diverged, where it is tagged v2.3.7. Each branch is built once from its tag and shipped through a shortened rollout. Never fix only the branch, because the next release from main would bring the bug back.</desc>
  <defs>
    <marker id="hcf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">A hotfix across branches: fix main first, then cherry-pick into each supported line</text>

    <g font-size="12" font-weight="700">
      <text x="24" y="94" fill="#36424e">main</text>
      <text x="24" y="174" fill="#263e5a">release/2.4</text>
      <text x="24" y="254" fill="#463365">release/2.3 (LTS)</text>
    </g>

    <g fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M150 90H840" stroke="#8a96a3"/>
      <path d="M230 90C255 90 255 170 285 170H840" stroke="#4774aa"/>
      <path d="M150 250H840" stroke="#8062a8"/>
    </g>

    <g stroke-width="2">
      <circle cx="180" cy="90" r="8" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="230" cy="90" r="8" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="310" cy="90" r="8" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="380" cy="90" r="8" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="450" cy="90" r="9" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="540" cy="90" r="8" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="640" cy="90" r="8" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="760" cy="90" r="8" fill="#eef1f5" stroke="#8a96a3"/>

      <circle cx="330" cy="170" r="8" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="560" cy="170" r="9" fill="#e7f3e9" stroke="#53845b"/>

      <circle cx="190" cy="250" r="8" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="760" cy="250" r="9" fill="#e7f3e9" stroke="#53845b"/>
    </g>

    <text x="450" y="70" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="middle">1. fix merged to main first</text>

    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M457 97 551 163" marker-end="url(#hcf-arrow)"/>
      <path d="M456 99 752 243" marker-end="url(#hcf-arrow)"/>
    </g>
    <text x="566" y="122" font-size="11.5" font-weight="700" fill="#40566b">2. cherry-pick -x into each branch</text>

    <g font-size="11.5" font-weight="700" text-anchor="middle">
      <text x="330" y="194" fill="#263e5a">v2.4.0</text>
      <text x="560" y="194" fill="#294a2e">v2.4.1</text>
      <text x="190" y="274" fill="#463365">v2.3.6</text>
      <text x="760" y="274" fill="#294a2e">v2.3.7</text>
    </g>

    <rect x="160" y="200" width="150" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="170" y="215" font-size="11" fill="#6e2a24">bug reported in 2.4.0,</text>
    <text x="170" y="229" font-size="11" fill="#6e2a24">also present in 2.3.6</text>

    <rect x="24" y="290" width="826" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="36" y="309">1. Fix on main with review and tests.   2. Cherry-pick (-x records the source commit) into each supported branch.</text>
      <text x="36" y="327">3. Adapt where an old line diverged, tag each branch (v2.4.1, v2.3.7), build once, and ship a shortened rollout.</text>
    </g>

    <text x="430" y="358" font-size="13" fill="#40566b" text-anchor="middle">Never fix only the branch: the next release from main would bring the bug back.</text>
  </g>
</svg>
