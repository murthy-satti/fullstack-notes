<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="bco-title bco-desc">
  <title id="bco-title">Deploy order for a breaking API change</title>
  <desc id="bco-desc">Renaming the field dueDate to due takes three deploys and a wait, shown as five columns from left to right. Before: the TaskFlow API reads and writes dueDate, TaskFlow Web sends dueDate, installed apps send dueDate, and 100 percent of requests use dueDate. Deploy 1, expand the API on day 0: the API accepts both shapes and returns both fields, while web and apps are unchanged and usage stays at 100 percent. Deploy 2, switch clients from day 1: the web app sends and reads due, a new app build uses due while old builds remain, and usage of dueDate starts falling. Then wait for the support window: the API is unchanged but counts requests using dueDate, old tabs are asked to reload, and the minimum supported app version is raised past the last build that sends dueDate, until usage has been 0 percent for 14 days. Deploy 3, contract the API around day 60: the API handles due only and dueDate is removed, and every client sends due. A warning says the wrong order, contracting before clients switch or switching clients before the expand, breaks every request in the gap. Servers learn the new shape before any client uses it, and forget the old one only after no client does.</desc>
  <defs>
    <marker id="bco-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Renaming dueDate to due without breaking anyone: three deploys and a wait</text>

    <rect x="120" y="44" width="142" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <rect x="270" y="44" width="142" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="420" y="44" width="142" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="570" y="44" width="142" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="720" y="44" width="142" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="191" y="64" fill="#36424e">Before</text>
      <text x="341" y="64" fill="#263e5a">1. Expand API</text>
      <text x="491" y="64" fill="#66400f">2. Switch clients</text>
      <text x="641" y="64" fill="#463365">Wait</text>
      <text x="791" y="64" fill="#263e5a">3. Contract API</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="191" y="82" fill="#36424e">every client on dueDate</text>
      <text x="341" y="82" fill="#263e5a">day 0</text>
      <text x="491" y="82" fill="#66400f">web day 1, apps next</text>
      <text x="641" y="82" fill="#463365">the support window</text>
      <text x="791" y="82" fill="#263e5a">around day 60</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M262 68H268" marker-end="url(#bco-arrow)"/>
      <path d="M412 68H418" marker-end="url(#bco-arrow)"/>
      <path d="M562 68H568" marker-end="url(#bco-arrow)"/>
      <path d="M712 68H718" marker-end="url(#bco-arrow)"/>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="16" y="134">TaskFlow API</text>
      <text x="16" y="202">TaskFlow Web</text>
      <text x="16" y="270">Installed apps</text>
      <text x="16" y="328">Requests</text>
    </g>
    <text x="16" y="344" font-size="11" fill="#60788d">using dueDate</text>

    <g stroke-width="1.5">
      <rect x="120" y="104" width="142" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="270" y="104" width="142" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="420" y="104" width="142" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="570" y="104" width="142" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="720" y="104" width="142" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>

      <rect x="120" y="172" width="142" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="270" y="172" width="142" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="420" y="172" width="142" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="570" y="172" width="142" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="720" y="172" width="142" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="120" y="240" width="142" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="270" y="240" width="142" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="420" y="240" width="142" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="570" y="240" width="142" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="720" y="240" width="142" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="120" y="308" width="142" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="270" y="308" width="142" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="420" y="308" width="142" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="570" y="308" width="142" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="720" y="308" width="142" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="130" y="128">reads and writes</text>
      <text x="130" y="144">dueDate (a string)</text>
      <text x="280" y="128">accepts both shapes,</text>
      <text x="280" y="144">returns both fields</text>
      <text x="430" y="136">unchanged</text>
      <text x="580" y="128">unchanged; counts</text>
      <text x="580" y="144">requests using dueDate</text>
      <text x="730" y="128">due only;</text>
      <text x="730" y="144">dueDate removed</text>

      <text x="130" y="204">sends dueDate</text>
      <text x="280" y="204">unchanged</text>
      <text x="430" y="196">sends and reads due</text>
      <text x="430" y="212">(new deploy)</text>
      <text x="580" y="196">old tabs are asked</text>
      <text x="580" y="212">to reload</text>
      <text x="730" y="204">uses due</text>

      <text x="130" y="272">send dueDate</text>
      <text x="280" y="272">unchanged</text>
      <text x="430" y="264">new build uses due;</text>
      <text x="430" y="280">old builds remain</text>
      <text x="580" y="264">floor raised past the</text>
      <text x="580" y="280">last build with dueDate</text>
      <text x="730" y="272">all send due</text>

      <text x="130" y="334">100%</text>
      <text x="280" y="334">100%</text>
      <text x="430" y="334">falling</text>
      <text x="580" y="334">0% for 14 days</text>
      <text x="730" y="334">0%</text>
    </g>

    <rect x="120" y="366" width="742" height="34" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="132" y="388" font-size="11.5" fill="#6e2a24">Wrong order (contract before clients switch, or switch clients before the expand) breaks every request in the gap.</text>

    <text x="440" y="426" font-size="13" fill="#40566b" text-anchor="middle">Servers learn the new shape before any client uses it, and forget the old one only after no client does.</text>
  </g>
</svg>
