<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="afg-title afg-desc">
  <title id="afg-title">From a changed package to the apps that must rebuild and deploy</title>
  <desc id="afg-desc">The TaskFlow monorepo's project graph after a change to packages/shared-types. Arrows point from a package to the projects that depend on it. shared-types is changed. It is used directly by the API app and by the api-client package, so both are affected. api-client is used by the web app and the desktop app, so both are affected too, transitively. The ui package and the worker app do not depend on shared-types and are not affected. A separate box notes that global inputs, such as the root lockfile, turbo.json, and tsconfig.base.json, affect every project when they change. Summary: rebuild and test five projects (shared-types, api-client, api, web, desktop); deploy two apps, the API as an image and the web app as a static site; the desktop app is built and tested now and ships on its next release train; ui and worker run no tasks. The commands are turbo run build test --affected or nx affected -t build test. Affected means the changed projects plus everything that depends on them, transitively.</desc>
  <defs>
    <marker id="afg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">From one changed package to the apps that must rebuild and deploy</text>

    <rect x="60" y="48" width="150" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="135" y="68" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="middle">shared-types</text>
    <text x="135" y="85" font-size="11" fill="#6e2a24" text-anchor="middle">changed</text>

    <rect x="290" y="48" width="230" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="405" y="67" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="middle">global inputs: lockfile, turbo.json,</text>
    <text x="405" y="83" font-size="11.5" fill="#36424e" text-anchor="middle">tsconfig.base.json affect everything</text>

    <rect x="180" y="150" width="140" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="170" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">api-client</text>
    <text x="250" y="187" font-size="11" fill="#66400f" text-anchor="middle">affected</text>
    <rect x="370" y="150" width="120" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="430" y="170" font-size="13" font-weight="700" fill="#36424e" text-anchor="middle">ui</text>
    <text x="430" y="187" font-size="11" fill="#36424e" text-anchor="middle">not affected</text>

    <rect x="24" y="256" width="100" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="74" y="276" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">api</text>
    <text x="74" y="293" font-size="11" fill="#66400f" text-anchor="middle">affected</text>
    <rect x="150" y="256" width="100" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="276" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">web</text>
    <text x="200" y="293" font-size="11" fill="#66400f" text-anchor="middle">affected</text>
    <rect x="276" y="256" width="110" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="331" y="276" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">desktop</text>
    <text x="331" y="293" font-size="11" fill="#66400f" text-anchor="middle">affected</text>
    <rect x="412" y="256" width="100" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="462" y="276" font-size="13" font-weight="700" fill="#36424e" text-anchor="middle">worker</text>
    <text x="462" y="293" font-size="11" fill="#36424e" text-anchor="middle">not affected</text>

    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M100 94 76 254" stroke="#b5524b" marker-end="url(#afg-arrow)"/>
      <path d="M170 94 226 148" stroke="#b5524b" marker-end="url(#afg-arrow)"/>
      <path d="M230 196 208 254" stroke="#bd7a20" marker-end="url(#afg-arrow)"/>
      <path d="M280 196 318 254" stroke="#bd7a20" marker-end="url(#afg-arrow)"/>
      <path d="M400 196 236 256" stroke="#8a96a3" stroke-dasharray="5 4" marker-end="url(#afg-arrow)"/>
      <path d="M440 196 360 254" stroke="#8a96a3" stroke-dasharray="5 4" marker-end="url(#afg-arrow)"/>
    </g>
    <text x="24" y="326" font-size="11" fill="#60788d">Arrows point from a package to the projects that depend on it.</text>

    <rect x="560" y="48" width="300" height="270" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="574" y="70" font-size="13" font-weight="700" fill="#263e5a">What CI does for this change</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="574" y="94" font-weight="700">Rebuild and test (5 projects)</text>
      <text x="574" y="110">shared-types, api-client, api, web, desktop</text>
      <text x="574" y="136" font-weight="700">Deploy (2 apps)</text>
      <text x="574" y="152">api as an image, web as a static site</text>
      <text x="574" y="178" font-weight="700">Build only</text>
      <text x="574" y="194">desktop: tested now, ships on its next train</text>
      <text x="574" y="220" font-weight="700">Skip</text>
      <text x="574" y="236">ui and worker: no tasks run</text>
      <text x="574" y="262" font-weight="700">Commands</text>
      <text x="574" y="278">turbo run build test --affected</text>
      <text x="574" y="294">nx affected -t build test</text>
    </g>

    <text x="440" y="356" font-size="13" fill="#40566b" text-anchor="middle">Affected = the changed projects plus everything that depends on them, transitively.</text>
  </g>
</svg>
