<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="suc-title suc-desc">
  <title id="suc-title">SSH user certificates compared with authorized_keys</title>
  <desc id="suc-desc">1: the engineer signs in to the SSH certificate authority, such as step-ca, Vault, or Teleport, with SSO and MFA and sends a public key. 2: the CA returns a certificate that lists principals and is valid for 8 hours. 3: the engineer connects to a server with the key and the certificate. The server's sshd checks that the certificate is signed by a CA key listed in TrustedUserCAKeys, that it is within its validity window, and that one of its principals is allowed for the target user, then logs the engineer in as deploy. Below, a comparison: with authorized_keys on every server, 40 engineers times 30 servers means 1,200 entries, offboarding means editing 30 servers, and keys never expire. With certificates, 30 servers trust one CA public key, access ends when the 8-hour certificate expires, and every login records a key ID and principal.</desc>
  <defs>
    <marker id="suc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="suc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="150" width="170" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="176" font-size="14" font-weight="700" fill="#66400f">Engineer laptop</text>
    <text x="109" y="196" font-size="11.5" fill="#66400f">key + certificate</text>

    <rect x="330" y="40" width="200" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="66" font-size="14" font-weight="700" fill="#463365">SSH CA</text>
    <text x="430" y="86" font-size="11" fill="#463365">step-ca, Vault, or Teleport</text>

    <rect x="626" y="120" width="210" height="140" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="731" y="144" font-size="14" font-weight="700" fill="#263e5a">Server sshd checks</text>
    <g font-size="11" fill="#263e5a">
      <text x="731" y="168">signed by a trusted CA key</text>
      <text x="731" y="186">within its validity window</text>
      <text x="731" y="204">principal allowed for user</text>
    </g>
    <rect x="644" y="216" width="174" height="30" rx="15" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="731" y="236" font-size="11.5" font-weight="700" fill="#294a2e">all pass: login as deploy</text>

    <path d="M109 150V72H328" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#suc-arrow)"/>
    <path d="M430 104V170H196" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#suc-arrow-ret)"/>
    <path d="M194 204H624" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#suc-arrow)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="219" y="64">1. SSO + MFA, send public key</text>
      <text x="300" y="162">2. cert: principals, valid 8 h</text>
      <text x="410" y="196">3. ssh with key and certificate</text>
    </g>

    <rect x="24" y="290" width="392" height="104" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="220" y="314" font-size="13" font-weight="700" fill="#6e2a24">authorized_keys on every server</text>
    <g font-size="11.5" fill="#6e2a24">
      <text x="220" y="336">40 engineers x 30 servers = 1,200 entries</text>
      <text x="220" y="356">offboarding means editing 30 servers</text>
      <text x="220" y="376">keys never expire on their own</text>
    </g>
    <rect x="444" y="290" width="392" height="104" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="640" y="314" font-size="13" font-weight="700" fill="#294a2e">short-lived certificates</text>
    <g font-size="11.5" fill="#294a2e">
      <text x="640" y="336">30 servers trust 1 CA public key</text>
      <text x="640" y="356">access ends when the 8-hour certificate expires</text>
      <text x="640" y="376">every login records a key ID and principal</text>
    </g>

    <text x="430" y="424" font-size="13" fill="#40566b">Servers trust one CA key; short-lived certificates replace per-server lists of keys.</text>
  </g>
</svg>
