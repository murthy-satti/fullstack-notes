<svg xmlns="http://www.w3.org/2000/svg" width="860" height="456" viewBox="0 0 860 456" role="img" aria-labelledby="sdl-title sdl-desc">
  <title id="sdl-title">Where TaskFlow API's files live and who may write them</title>
  <desc id="sdl-desc">A table of paths with owner, mode, and purpose. /srv/taskflow is root-owned, mode 0755. Its releases 1.8.0 and 1.9.0 are root-owned and read-only to the app; 1.8.0 is kept for rollback. The symlink current points to releases/1.9.0 and is switched atomically on deploy. /srv/taskflow/shared is owned by taskflow:taskflow with mode 0750 and is the only path the app may write. /etc/taskflow is root-owned with mode 0700; api.env inside it is root-owned 0600 and holds non-secret settings read by systemd; credentials/mongodb-uri is root-owned 0600, a secret passed with LoadCredential. The unit file /etc/systemd/system/taskflow-api@.service is root-owned 0644. At runtime systemd creates /run/credentials/taskflow-api@3001.service, a read-only copy only the app's user can read. /var/log/nginx holds www-data:adm files with mode 0640, rotated daily by logrotate, and /var/log/journal holds the app's stdout and stderr, written by systemd-journald. A legend marks root-owned read-only paths in blue, app-writable paths in green, secrets in red, and paths written by systemd in purple.</desc>
  <rect width="860" height="456" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="36" y="40">Path</text>
      <text x="430" y="40">Owner and mode</text>
      <text x="590" y="40">Purpose</text>
    </g>
    <path d="M24 50H836" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="58" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="84" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="110" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="136" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="162" width="812" height="22" rx="4" fill="#e7f3e9"/>
    <rect x="24" y="194" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="220" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="246" width="812" height="22" rx="4" fill="#fbe9e7"/>
    <rect x="24" y="278" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="310" width="812" height="22" rx="4" fill="#f0e9fb"/>
    <rect x="24" y="342" width="812" height="22" rx="4" fill="#e5efff"/>
    <rect x="24" y="368" width="812" height="22" rx="4" fill="#f0e9fb"/>

    <g font-size="12" fill="#263e5a">
      <text x="36" y="74" font-weight="700">/srv/taskflow/</text>
      <text x="56" y="100">releases/1.8.0/</text>
      <text x="56" y="126">releases/1.9.0/</text>
      <text x="56" y="152">current -&gt; releases/1.9.0</text>
      <text x="56" y="178" fill="#294a2e" font-weight="700">shared/</text>
      <text x="36" y="210" font-weight="700">/etc/taskflow/</text>
      <text x="56" y="236">api.env</text>
      <text x="56" y="262" fill="#6e2a24" font-weight="700">credentials/mongodb-uri</text>
      <text x="36" y="294">/etc/systemd/system/taskflow-api@.service</text>
      <text x="36" y="326" fill="#463365">/run/credentials/taskflow-api@3001.service/</text>
      <text x="36" y="358">/var/log/nginx/*.log</text>
      <text x="36" y="384" fill="#463365">/var/log/journal/</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="430" y="74">root:root 0755</text>
      <text x="430" y="100">root:root 0755</text>
      <text x="430" y="126">root:root 0755</text>
      <text x="430" y="152">symlink, root</text>
      <text x="430" y="178" fill="#294a2e">taskflow:taskflow 0750</text>
      <text x="430" y="210">root:root 0700</text>
      <text x="430" y="236">root:root 0600</text>
      <text x="430" y="262" fill="#6e2a24">root:root 0600</text>
      <text x="430" y="294">root:root 0644</text>
      <text x="430" y="326" fill="#463365">app user, read-only</text>
      <text x="430" y="358">www-data:adm 0640</text>
      <text x="430" y="384" fill="#463365">systemd-journald</text>

      <text x="590" y="74">code lives here; root writes it</text>
      <text x="590" y="100">previous release, kept for rollback</text>
      <text x="590" y="126">read-only to the app</text>
      <text x="590" y="152">switched atomically on deploy</text>
      <text x="590" y="178" fill="#294a2e">the only path the app may write</text>
      <text x="590" y="210">configuration, read by systemd</text>
      <text x="590" y="236">non-secret settings</text>
      <text x="590" y="262" fill="#6e2a24">secret, passed with LoadCredential=</text>
      <text x="590" y="294">the service definition</text>
      <text x="590" y="326" fill="#463365">runtime copy only the app can read</text>
      <text x="590" y="358">access and error logs, rotated daily</text>
      <text x="590" y="384" fill="#463365">the app's stdout and stderr</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <rect x="24" y="404" width="18" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="50" y="416">root-owned, read-only to the app</text>
      <rect x="270" y="404" width="18" height="14" rx="3" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="296" y="416">app may write</text>
      <rect x="410" y="404" width="18" height="14" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
      <text x="436" y="416">secret</text>
      <rect x="500" y="404" width="18" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="526" y="416">written by systemd</text>
    </g>

    <text x="430" y="444" font-size="13" fill="#40566b" text-anchor="middle">Root owns code and config, the app writes only to shared/, and secrets reach it through systemd.</text>
  </g>
</svg>
