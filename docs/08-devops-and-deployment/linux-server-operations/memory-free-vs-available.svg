<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="mfa-title mfa-desc">
  <title id="mfa-title">Why free memory is small and available memory is what matters</title>
  <desc id="mfa-desc">Two bars for a server with 3.8 GiB of RAM. Healthy: processes use 1.2 GiB, cache that cannot be dropped (tmpfs, dirty or in-use pages) uses 0.2 GiB, reclaimable page cache uses 2.1 GiB, and 0.3 GiB is free. free -h reports used 1.4 GiB, calculated as total minus available, buff/cache 2.3 GiB, free 0.3 GiB, and available 2.4 GiB, which is free memory plus the reclaimable cache. Under pressure: a leaking process grows to 3.4 GiB, the kernel has already reclaimed most of the cache, 0.2 GiB of unreclaimable cache and 0.1 GiB free remain, and available falls to about 0.2 GiB. The kernel then swaps, which shows as si and so in vmstat, and finally the OOM killer ends the process with the highest badness score.</desc>
  <defs>
    <marker id="mfa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Healthy: little free memory, plenty available</text>

    <path d="M60 64H340" stroke="#40566b" stroke-width="1.5"/>
    <path d="M60 60V68M340 60V68" stroke="#40566b" stroke-width="1.5"/>
    <text x="200" y="56" font-size="11.5" font-weight="700" fill="#36424e">used 1.4 Gi = total - available</text>
    <path d="M340 64H820" stroke="#294a2e" stroke-width="1.5"/>
    <path d="M820 60V68" stroke="#294a2e" stroke-width="1.5"/>
    <text x="580" y="56" font-size="11.5" font-weight="700" fill="#294a2e">available 2.4 Gi = free + reclaimable cache</text>

    <g stroke-width="1.5">
      <rect x="60" y="76" width="240" height="44" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="300" y="76" width="40" height="44" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="340" y="76" width="420" height="44" fill="#e5efff" stroke="#4774aa"/>
      <rect x="760" y="76" width="60" height="44" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5">
      <text x="180" y="96" font-weight="700" fill="#66400f">processes</text>
      <text x="180" y="112" fill="#66400f">1.2 Gi</text>
      <text x="550" y="96" font-weight="700" fill="#263e5a">reclaimable page cache</text>
      <text x="550" y="112" fill="#263e5a">2.1 Gi: dropped when memory is needed</text>
      <text x="790" y="96" font-weight="700" fill="#294a2e">free</text>
      <text x="790" y="112" fill="#294a2e">0.3</text>
    </g>
    <path d="M300 128H760" stroke="#4774aa" stroke-width="1.5"/>
    <path d="M300 124V132M760 124V132" stroke="#4774aa" stroke-width="1.5"/>
    <text x="530" y="146" font-size="11.5" fill="#263e5a">buff/cache 2.3 Gi (includes 0.2 Gi tmpfs, dirty, and in-use pages that cannot be dropped)</text>

    <rect x="60" y="164" width="760" height="58" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="76" y="186" text-anchor="start">$ free -h</text>
      <text x="76" y="206" text-anchor="start">Mem:</text>
      <g text-anchor="end">
        <text x="300" y="186">total</text>
        <text x="380" y="186">used</text>
        <text x="460" y="186">free</text>
        <text x="540" y="186">shared</text>
        <text x="660" y="186">buff/cache</text>
        <text x="780" y="186">available</text>
        <text x="300" y="206">3.8Gi</text>
        <text x="380" y="206">1.4Gi</text>
        <text x="460" y="206">0.3Gi</text>
        <text x="540" y="206">0.1Gi</text>
        <text x="660" y="206">2.3Gi</text>
        <text x="780" y="206" font-weight="700" fill="#294a2e">2.4Gi</text>
      </g>
    </g>

    <path d="M24 244H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="270" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Under pressure: a leak grows until nothing is left to reclaim</text>
    <g stroke-width="1.5">
      <rect x="60" y="284" width="680" height="44" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="740" y="284" width="40" height="44" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="780" y="284" width="20" height="44" fill="#e5efff" stroke="#4774aa"/>
      <rect x="800" y="284" width="20" height="44" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <text x="400" y="304" font-size="11.5" font-weight="700" fill="#6e2a24">processes 3.4 Gi (one of them leaking)</text>
    <text x="400" y="320" font-size="11.5" fill="#6e2a24">available is about 0.2 Gi: the cache is already gone</text>

    <g font-size="11.5" fill="#36424e">
      <text x="200" y="356">1. kernel reclaims page cache</text>
      <text x="440" y="356">2. swaps: vmstat si / so &gt; 0</text>
      <text x="680" y="356">3. OOM killer ends the top scorer</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M294 352H336" marker-end="url(#mfa-arrow)"/>
      <path d="M534 352H572" marker-end="url(#mfa-arrow)"/>
    </g>

    <text x="430" y="400" font-size="13" fill="#40566b">Judge memory by "available", swap activity, and OOM messages; a small "free" is normal.</text>
  </g>
</svg>
