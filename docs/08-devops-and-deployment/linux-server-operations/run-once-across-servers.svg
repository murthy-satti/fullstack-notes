<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="ros-title ros-desc">
  <title id="ros-title">Running a scheduled job once across several servers</title>
  <desc id="ros-desc">Left: the same timer is installed on app-1, app-2 and app-3, so at 02:30 all three start the weekly digest job and every user receives three emails. Right: the same three timers fire, but each run first tries to take a lock in MongoDB with updateOne on the locks collection, filtering on the job name and an expired expiresAt, with upsert. app-1 inserts the lock document and runs the job; app-2 and app-3 get duplicate key error E11000 and exit. Alternatively a managed scheduler such as EventBridge Scheduler or Cloud Scheduler calls one endpoint or queue; these deliver at least once, so the job must still be idempotent.</desc>
  <defs>
    <marker id="ros-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ros-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="215" y="34" font-size="14" font-weight="700" fill="#6e2a24">A timer on every server</text>
    <text x="645" y="34" font-size="14" font-weight="700" fill="#294a2e">Timers plus a lock</text>
    <path d="M430 20V330" stroke="#c9d1db" stroke-width="1.5"/>

    <g stroke-width="2" fill="#e5efff" stroke="#4774aa">
      <rect x="30" y="56" width="120" height="44" rx="8"/>
      <rect x="30" y="120" width="120" height="44" rx="8"/>
      <rect x="30" y="184" width="120" height="44" rx="8"/>
      <rect x="460" y="56" width="120" height="44" rx="8"/>
      <rect x="460" y="120" width="120" height="44" rx="8"/>
      <rect x="460" y="184" width="120" height="44" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#263e5a">
      <text x="90" y="75">app-1</text>
      <text x="90" y="139">app-2</text>
      <text x="90" y="203">app-3</text>
      <text x="520" y="75">app-1</text>
      <text x="520" y="139">app-2</text>
      <text x="520" y="203">app-3</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="90" y="91">timer 02:30</text>
      <text x="90" y="155">timer 02:30</text>
      <text x="90" y="219">timer 02:30</text>
      <text x="520" y="91">timer 02:30</text>
      <text x="520" y="155">timer 02:30</text>
      <text x="520" y="219">timer 02:30</text>
    </g>

    <rect x="230" y="110" width="170" height="64" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="315" y="134" font-size="12.5" font-weight="700" fill="#6e2a24">weekly digest job</text>
    <text x="315" y="152" font-size="11.5" fill="#6e2a24">runs three times</text>
    <g fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round">
      <path d="M150 78 228 124" marker-end="url(#ros-arrow-red)"/>
      <path d="M150 142H228" marker-end="url(#ros-arrow-red)"/>
      <path d="M150 206 228 160" marker-end="url(#ros-arrow-red)"/>
    </g>
    <rect x="230" y="200" width="170" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="315" y="225" font-size="11.5" font-weight="700" fill="#6e2a24">3 emails to every user</text>

    <rect x="636" y="104" width="196" height="76" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="734" y="126" font-size="12.5" font-weight="700" fill="#463365">MongoDB locks</text>
    <text x="734" y="144" font-size="11" fill="#463365">updateOne({ _id: job,</text>
    <text x="734" y="159" font-size="11" fill="#463365">expiresAt: { $lt: now } },</text>
    <text x="734" y="174" font-size="11" fill="#463365">..., { upsert: true })</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M580 78 634 116" marker-end="url(#ros-arrow)"/>
      <path d="M580 142H634" marker-end="url(#ros-arrow)"/>
      <path d="M580 206 634 168" marker-end="url(#ros-arrow)"/>
    </g>

    <rect x="460" y="252" width="176" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="548" y="270" font-size="11.5" font-weight="700" fill="#294a2e">app-1: lock inserted</text>
    <text x="548" y="285" font-size="11" fill="#294a2e">runs the job once</text>
    <rect x="656" y="252" width="176" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="744" y="270" font-size="11.5" font-weight="700" fill="#36424e">app-2, app-3: E11000</text>
    <text x="744" y="285" font-size="11" fill="#36424e">lock held, exit</text>

    <rect x="460" y="304" width="372" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="646" y="322" font-size="11.5" font-weight="700" fill="#66400f">or: one managed scheduler calls one endpoint</text>
    <text x="646" y="337" font-size="11" fill="#66400f">delivery is at least once, so the job must still be idempotent</text>

    <text x="430" y="378" font-size="13" fill="#40566b">N servers with the same timer means N runs, unless something chooses exactly one.</text>
  </g>
</svg>
