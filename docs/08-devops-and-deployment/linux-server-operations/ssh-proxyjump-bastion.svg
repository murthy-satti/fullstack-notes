<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="spj-title spj-desc">
  <title id="spj-title">Reaching private servers through a bastion with ProxyJump</title>
  <desc id="spj-desc">Your laptop keeps its private keys. 1: it opens an outer SSH session to the bastion at 203.0.113.20 in the public subnet of the VPC 10.0.0.0/16; the bastion accepts port 22 only from 198.51.100.0/24 and allows only local TCP forwarding. 2: inside that session the bastion opens a TCP connection to app-1 at 10.0.2.10 port 22 in a private subnet. 3: the laptop runs a second, inner SSH session to app-1 through that connection, encrypted end to end, so the bastion only relays ciphertext. app-2 at 10.0.2.11 and MongoDB at 10.0.3.15 have no public IP addresses and accept SSH only from the bastion; MongoDB has no SSH at all. A warning box says to avoid agent forwarding, because anyone with root on the bastion can use your keys while you are connected.</desc>
  <defs>
    <marker id="spj-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="spj-arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="880" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="56" width="566" height="356" rx="10" fill="none" stroke="#4774aa" stroke-width="2"/>
    <text x="306" y="76" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">VPC 10.0.0.0/16</text>
    <rect x="306" y="120" width="184" height="280" rx="8" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="398" y="140" font-size="11.5" font-weight="700" fill="#40566b">public subnet</text>
    <rect x="500" y="120" width="340" height="280" rx="8" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="516" y="140" font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">private subnets</text>

    <rect x="24" y="152" width="140" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="176" font-size="14" font-weight="700" fill="#66400f">Your laptop</text>
    <text x="94" y="196" font-size="11.5" fill="#66400f">keys never leave</text>

    <rect x="320" y="152" width="160" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="400" y="176" font-size="14" font-weight="700" fill="#263e5a">bastion</text>
    <text x="400" y="196" font-size="11.5" fill="#263e5a">203.0.113.20 :22</text>
    <g font-size="11" fill="#36424e">
      <text x="400" y="236">port 22 open only to</text>
      <text x="400" y="251">198.51.100.0/24</text>
      <text x="400" y="266">AllowTcpForwarding local</text>
    </g>

    <rect x="600" y="152" width="160" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="680" y="176" font-size="14" font-weight="700" fill="#263e5a">app-1</text>
    <text x="680" y="196" font-size="11.5" fill="#263e5a">10.0.2.10 :22</text>
    <rect x="600" y="236" width="160" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="680" y="257" font-size="14" font-weight="700" fill="#263e5a">app-2</text>
    <text x="680" y="276" font-size="11.5" fill="#263e5a">10.0.2.11 :22</text>
    <rect x="600" y="304" width="160" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="680" y="325" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="680" y="344" font-size="11.5" fill="#263e5a">10.0.3.15, no SSH</text>
    <text x="675" y="384" font-size="11" fill="#36424e">no public IPs; SSH only from the bastion</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 182H318" marker-end="url(#spj-arrow)"/>
      <path d="M480 182H598" marker-end="url(#spj-arrow)"/>
    </g>
    <path d="M94 152V100H680V150" fill="none" stroke="#53845b" stroke-width="2" stroke-dasharray="7 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spj-arrow-green)"/>

    <text x="241" y="174" font-size="11.5" fill="#36424e">1. SSH to bastion</text>
    <g font-size="11.5" fill="#36424e">
      <text x="545" y="202">2. opens TCP</text>
      <text x="545" y="216">to app-1:22</text>
    </g>
    <rect x="118" y="80" width="538" height="16" fill="#f5f7fb"/>
    <text x="387" y="92" font-size="11.5" font-weight="700" fill="#294a2e">3. inner SSH session to app-1, end to end: the bastion only relays ciphertext</text>

    <rect x="24" y="262" width="250" height="96" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="149" y="284" font-size="12.5" font-weight="700" fill="#6e2a24">Avoid agent forwarding</text>
    <g font-size="11" fill="#6e2a24">
      <text x="149" y="304">ForwardAgent: anyone with root</text>
      <text x="149" y="320">on the bastion can use your keys</text>
      <text x="149" y="336">while you are connected</text>
    </g>

    <text x="440" y="440" font-size="13" fill="#40566b">ProxyJump: the bastion relays bytes it cannot read, and your keys stay on your laptop.</text>
  </g>
</svg>
