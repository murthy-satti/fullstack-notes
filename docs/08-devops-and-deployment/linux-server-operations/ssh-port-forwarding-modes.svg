<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="spf-title spf-desc">
  <title id="spf-title">Local, remote, and dynamic SSH port forwarding</title>
  <desc id="spf-desc">Three rows. Local forward with -L: the laptop listens on port 3300; connections travel through the SSH tunnel to the bastion, which opens a TCP connection to Grafana at 10.0.2.30 port 3000; the command is ssh -N -L 127.0.0.1:3300:10.0.2.30:3000 taskflow-bastion. Remote forward with -R: app-1 listens on port 9000; a client on app-1 connects to it, and the connection travels back through the tunnel to a development app on the laptop's port 3000; the command is ssh -N -R 127.0.0.1:9000:localhost:3000 taskflow-app-1. Dynamic forward with -D: the laptop runs a SOCKS proxy on port 1080, and for each request the bastion dials whatever host and port it can reach; the command is ssh -N -D 127.0.0.1:1080 taskflow-bastion. In short, -L brings a remote port to you, -R takes your port to the server, and -D turns the server into a SOCKS proxy.</desc>
  <defs>
    <marker id="spf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke="#c9d1db" stroke-width="1.5">
      <path d="M20 148H840"/>
      <path d="M20 262H840"/>
    </g>

    <g text-anchor="start" fill="#40566b">
      <text x="24" y="78" font-size="16" font-weight="700">-L</text>
      <text x="24" y="96" font-size="11.5">local forward</text>
      <text x="24" y="192" font-size="16" font-weight="700">-R</text>
      <text x="24" y="210" font-size="11.5">remote forward</text>
      <text x="24" y="306" font-size="16" font-weight="700">-D</text>
      <text x="24" y="324" font-size="11.5">dynamic (SOCKS)</text>
    </g>

    <g stroke-width="2">
      <rect x="150" y="56" width="160" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="440" y="56" width="160" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="56" width="176" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="150" y="170" width="160" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="440" y="170" width="160" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="170" width="176" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="150" y="284" width="160" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="440" y="284" width="160" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="660" y="284" width="176" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g stroke="#8062a8" stroke-width="1.5" fill="#f0e9fb">
      <rect x="310" y="73" width="130" height="14"/>
      <rect x="310" y="187" width="130" height="14"/>
      <rect x="310" y="301" width="130" height="14"/>
    </g>
    <g font-size="11" font-weight="700" fill="#463365">
      <text x="375" y="67">SSH tunnel</text>
      <text x="375" y="181">SSH tunnel</text>
      <text x="375" y="295">SSH tunnel</text>
    </g>

    <g font-size="14" font-weight="700">
      <text x="230" y="76" fill="#66400f">Laptop</text>
      <text x="520" y="76" fill="#263e5a">bastion</text>
      <text x="748" y="76" fill="#263e5a">Grafana</text>
      <text x="230" y="190" fill="#66400f">Laptop</text>
      <text x="520" y="190" fill="#263e5a">app-1</text>
      <text x="748" y="190" fill="#66400f">client on app-1</text>
      <text x="230" y="304" fill="#66400f">Laptop</text>
      <text x="520" y="304" fill="#263e5a">bastion</text>
      <text x="748" y="304" fill="#263e5a">any host:port</text>
    </g>
    <g font-size="11.5">
      <text x="230" y="94" fill="#66400f">listens on :3300</text>
      <text x="520" y="94" fill="#263e5a">opens the TCP hop</text>
      <text x="748" y="94" fill="#263e5a">10.0.2.30:3000</text>
      <text x="230" y="208" fill="#66400f">dev app on :3000</text>
      <text x="520" y="208" fill="#263e5a">listens on :9000</text>
      <text x="748" y="208" fill="#66400f">connects to :9000</text>
      <text x="230" y="322" fill="#66400f">SOCKS on :1080</text>
      <text x="520" y="322" fill="#263e5a">dials any target</text>
      <text x="748" y="322" fill="#263e5a">the bastion can reach</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M316 80H434" marker-end="url(#spf-arrow)"/>
      <path d="M600 80H658" marker-end="url(#spf-arrow)"/>
      <path d="M434 194H316" marker-end="url(#spf-arrow)"/>
      <path d="M660 194H602" marker-end="url(#spf-arrow)"/>
      <path d="M316 308H434" marker-end="url(#spf-arrow)"/>
      <path d="M600 308H658" marker-end="url(#spf-arrow)"/>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="150" y="128">ssh -N -L 127.0.0.1:3300:10.0.2.30:3000 taskflow-bastion</text>
      <text x="150" y="242">ssh -N -R 127.0.0.1:9000:localhost:3000 taskflow-app-1</text>
      <text x="150" y="356">ssh -N -D 127.0.0.1:1080 taskflow-bastion</text>
    </g>

    <text x="430" y="400" font-size="13" fill="#40566b">-L brings a remote port to you, -R takes your port to the server, -D makes the server a SOCKS proxy.</text>
  </g>
</svg>
