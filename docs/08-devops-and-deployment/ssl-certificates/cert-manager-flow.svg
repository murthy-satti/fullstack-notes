<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="cmf-title cmf-desc">
  <title id="cmf-title">How cert-manager issues and renews a certificate in Kubernetes</title>
  <desc id="cmf-desc">An Ingress for TaskFlow API carries the annotation cert-manager.io/cluster-issuer. cert-manager creates a Certificate resource with the DNS names and a secret name, then an Order and a Challenge, starting a temporary HTTP-01 solver. The ACME CA validates the challenge and issues the certificate. cert-manager stores it in a Secret containing tls.crt and tls.key. The ingress controller reads the Secret and serves the certificate to clients over HTTPS. cert-manager renews the certificate when two thirds of its lifetime has passed, by default, and updates the same Secret.</desc>
  <defs>
    <marker id="cmf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cmf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="24" y="40" width="180" height="70" rx="8"/>
      <rect x="241" y="40" width="180" height="70" rx="8"/>
      <rect x="458" y="40" width="180" height="70" rx="8"/>
      <rect x="458" y="190" width="180" height="70" rx="8"/>
      <rect x="241" y="190" width="180" height="70" rx="8"/>
    </g>
    <rect x="675" y="40" width="160" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="24" y="190" width="180" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>

    <g font-size="14" font-weight="700">
      <text x="114" y="66" fill="#263e5a">Ingress</text>
      <text x="331" y="66" fill="#263e5a">Certificate</text>
      <text x="548" y="66" fill="#263e5a">Order + Challenge</text>
      <text x="755" y="66" fill="#463365">ACME CA</text>
      <text x="548" y="216" fill="#263e5a">Secret</text>
      <text x="331" y="216" fill="#263e5a">Ingress controller</text>
      <text x="114" y="216" fill="#66400f">Clients</text>
    </g>
    <g font-size="11.5">
      <text x="114" y="86" fill="#263e5a">annotation:</text>
      <text x="114" y="102" fill="#263e5a">cluster-issuer</text>
      <text x="331" y="86" fill="#263e5a">dnsNames,</text>
      <text x="331" y="102" fill="#263e5a">secretName</text>
      <text x="548" y="86" fill="#263e5a">temporary HTTP-01</text>
      <text x="548" y="102" fill="#263e5a">solver pod</text>
      <text x="755" y="86" fill="#463365">validates,</text>
      <text x="755" y="102" fill="#463365">issues</text>
      <text x="548" y="236" fill="#263e5a">taskflow-api-tls</text>
      <text x="548" y="252" fill="#263e5a">tls.crt + tls.key</text>
      <text x="331" y="236" fill="#263e5a">reads the Secret,</text>
      <text x="331" y="252" fill="#263e5a">terminates TLS</text>
      <text x="114" y="236" fill="#66400f">HTTPS to</text>
      <text x="114" y="252" fill="#66400f">api.example.com</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 75H239" marker-end="url(#cmf-arrow)"/>
      <path d="M421 75H456" marker-end="url(#cmf-arrow)"/>
      <path d="M638 75H673" marker-end="url(#cmf-arrow)"/>
      <path d="M755 110V225H640" stroke-linejoin="round" marker-end="url(#cmf-arrow)"/>
      <path d="M458 225H423" marker-end="url(#cmf-arrow)"/>
      <path d="M241 225H206" marker-end="url(#cmf-arrow)"/>
    </g>
    <path d="M520 190 360 112" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cmf-arrow-ret)"/>
    <rect x="363" y="140" width="200" height="16" fill="#f5f7fb"/>
    <text x="463" y="152" font-size="11" font-style="italic" fill="#40566b">renews at 2/3 of the lifetime</text>
    <text x="760" y="170" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">signed</text>
    <text x="760" y="184" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">chain</text>

    <text x="430" y="300" font-size="12" fill="#36424e">Declare the names once; cert-manager creates, validates, stores, and renews the certificate.</text>
    <text x="430" y="330" font-size="13" fill="#40566b">The only artifact the ingress needs is a Secret that cert-manager keeps fresh.</text>
  </g>
</svg>
