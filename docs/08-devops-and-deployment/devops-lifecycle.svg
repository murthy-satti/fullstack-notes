<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="dvl-title dvl-desc">
  <title id="dvl-title">The DevOps lifecycle of one change</title>
  <desc id="dvl-desc">A change moves left to right through six stages. Code: commit and review in Git and GitHub. Integrate: test and build in CI/CD. Package: a tagged Docker image. Deploy: release safely with Kubernetes and rollout strategies. Operate: configuration, TLS, backups and disaster recovery. Observe: logs, metrics, traces and SLOs. The first four stages form the delivery pipeline that runs on every change; the last two are operations that run all the time. Infrastructure as Code sits under Deploy and Operate and provisions networks, clusters and DNS. A feedback arrow runs from Observe back to Code: incidents, SLO misses and user signals shape the next change.</desc>
  <defs>
    <marker id="dvl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="dvl-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="440" y="40" font-size="15" font-weight="700" fill="#263e5a">One change, from commit to production and back</text>

    <path d="M20 92H572" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M20 87V97M572 87V97" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="296" y="80" font-size="11.5" font-weight="700" fill="#40566b">delivery pipeline: runs on every change</text>
    <path d="M596 92H860" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M596 87V97M860 87V97" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="728" y="80" font-size="11.5" font-weight="700" fill="#40566b">operations: runs all the time</text>

    <rect x="20" y="110" width="120" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="80" y="138" font-size="14" font-weight="700" fill="#66400f">Code</text>
    <text x="80" y="160" font-size="11.5" fill="#66400f">commit, review</text>
    <text x="80" y="177" font-size="11.5" fill="#66400f">Git and GitHub</text>

    <rect x="164" y="110" width="120" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="224" y="138" font-size="14" font-weight="700" fill="#463365">Integrate</text>
    <text x="224" y="160" font-size="11.5" fill="#463365">test and build</text>
    <text x="224" y="177" font-size="11.5" fill="#463365">CI/CD</text>

    <rect x="308" y="110" width="120" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="368" y="138" font-size="14" font-weight="700" fill="#463365">Package</text>
    <text x="368" y="160" font-size="11.5" fill="#463365">tagged image</text>
    <text x="368" y="177" font-size="11.5" fill="#463365">Docker</text>

    <rect x="452" y="110" width="120" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="512" y="138" font-size="14" font-weight="700" fill="#263e5a">Deploy</text>
    <text x="512" y="160" font-size="11.5" fill="#263e5a">release safely</text>
    <text x="512" y="177" font-size="11.5" fill="#263e5a">K8s, rollouts</text>

    <rect x="596" y="110" width="120" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="656" y="138" font-size="14" font-weight="700" fill="#263e5a">Operate</text>
    <text x="656" y="160" font-size="11.5" fill="#263e5a">config, TLS</text>
    <text x="656" y="177" font-size="11.5" fill="#263e5a">backups, DR</text>

    <rect x="740" y="110" width="120" height="80" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="800" y="138" font-size="14" font-weight="700" fill="#294a2e">Observe</text>
    <text x="800" y="160" font-size="11.5" fill="#294a2e">logs, metrics</text>
    <text x="800" y="177" font-size="11.5" fill="#294a2e">traces, SLOs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M140 150H162" marker-end="url(#dvl-arrow)"/>
      <path d="M284 150H306" marker-end="url(#dvl-arrow)"/>
      <path d="M428 150H450" marker-end="url(#dvl-arrow)"/>
      <path d="M572 150H594" marker-end="url(#dvl-arrow)"/>
      <path d="M716 150H738" marker-end="url(#dvl-arrow)"/>
      <path d="M512 232V192" marker-end="url(#dvl-arrow)"/>
      <path d="M656 232V192" marker-end="url(#dvl-arrow)"/>
    </g>

    <rect x="452" y="232" width="264" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="584" y="252" font-size="13" font-weight="700" fill="#263e5a">Infrastructure as Code</text>
    <text x="584" y="270" font-size="11.5" fill="#263e5a">provisions networks, clusters, DNS</text>

    <path d="M800 190V318H80V194" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#dvl-arrow-ret)"/>
    <rect x="194" y="309" width="492" height="18" fill="#f5f7fb"/>
    <text x="440" y="322" font-size="11.5" font-style="italic" fill="#36424e">feedback: incidents, SLO misses, and user signals shape the next change</text>

    <text x="440" y="360" font-size="13" fill="#40566b">DevOps is a loop: automate the path to production, then let observation drive the next change.</text>
  </g>
</svg>
