<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="tw3-title tw3-desc">
  <title id="tw3-title">The Three Ways of DevOps</title>
  <desc id="tw3-desc">Three bands. The First Way, flow and systems thinking: work moves left to right from development to operations to the customer in small batches, quickly, and without passing known defects downstream; the goal is to optimize the whole value stream, not one silo. The Second Way, amplify feedback loops: information flows right to left from the customer to operations to development through monitoring, alerts, user feedback, and blameless reviews, so problems are found and fixed where they are cheapest to fix. The Third Way, continual experimentation and learning: teams run safe experiments, learn from failure, practice through game days, and improve daily work, then repeat the cycle to keep improving the system of work.</desc>
  <defs>
    <marker id="tw3-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="tw3-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="78" font-size="14" font-weight="700" fill="#263e5a">The First Way</text>
    <text x="24" y="96" font-size="12" font-weight="700" fill="#36424e">flow and systems thinking</text>
    <text x="24" y="116" font-size="11.5" fill="#36424e">optimize the whole value</text>
    <text x="24" y="132" font-size="11.5" fill="#36424e">stream, not one silo</text>

    <g text-anchor="middle">
      <rect x="280" y="62" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="355" y="89" font-size="14" font-weight="700" fill="#66400f">Development</text>
      <rect x="480" y="62" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="555" y="89" font-size="14" font-weight="700" fill="#263e5a">Operations</text>
      <rect x="680" y="62" width="160" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="760" y="89" font-size="14" font-weight="700" fill="#294a2e">Customer</text>
      <text x="560" y="130" font-size="11.5" fill="#36424e">small batches, fast flow, no known defects passed downstream</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2.5" stroke-linecap="round">
      <path d="M430 84H476" marker-end="url(#tw3-arrow)"/>
      <path d="M630 84H676" marker-end="url(#tw3-arrow)"/>
    </g>

    <path d="M24 154H856" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="186" font-size="14" font-weight="700" fill="#263e5a">The Second Way</text>
    <text x="24" y="204" font-size="12" font-weight="700" fill="#36424e">amplify feedback loops</text>
    <text x="24" y="224" font-size="11.5" fill="#36424e">fix problems where they</text>
    <text x="24" y="240" font-size="11.5" fill="#36424e">are cheapest to fix</text>

    <g text-anchor="middle">
      <rect x="280" y="170" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="355" y="197" font-size="14" font-weight="700" fill="#66400f">Development</text>
      <rect x="480" y="170" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="555" y="197" font-size="14" font-weight="700" fill="#263e5a">Operations</text>
      <rect x="680" y="170" width="160" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="760" y="197" font-size="14" font-weight="700" fill="#294a2e">Customer</text>
      <text x="560" y="238" font-size="11.5" fill="#36424e">monitoring, alerts, user feedback, blameless reviews</text>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round">
      <path d="M680 192H634" marker-end="url(#tw3-arrow-ret)"/>
      <path d="M480 192H434" marker-end="url(#tw3-arrow-ret)"/>
    </g>

    <path d="M24 262H856" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="294" font-size="14" font-weight="700" fill="#263e5a">The Third Way</text>
    <text x="24" y="312" font-size="12" font-weight="700" fill="#36424e">continual experimentation</text>
    <text x="24" y="328" font-size="12" font-weight="700" fill="#36424e">and learning</text>
    <text x="24" y="348" font-size="11.5" fill="#36424e">take smart risks, and practice</text>
    <text x="24" y="364" font-size="11.5" fill="#36424e">until it becomes routine</text>

    <g text-anchor="middle">
      <rect x="270" y="282" width="130" height="46" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="335" y="301" font-size="12" font-weight="700" fill="#66400f">run safe</text>
      <text x="335" y="318" font-size="12" fill="#66400f">experiments</text>
      <rect x="418" y="282" width="130" height="46" rx="10" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="483" y="301" font-size="12" font-weight="700" fill="#294a2e">learn from</text>
      <text x="483" y="318" font-size="12" fill="#294a2e">failure</text>
      <rect x="566" y="282" width="130" height="46" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="631" y="301" font-size="12" font-weight="700" fill="#463365">practice</text>
      <text x="631" y="318" font-size="12" fill="#463365">(game days)</text>
      <rect x="714" y="282" width="130" height="46" rx="10" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="779" y="301" font-size="12" font-weight="700" fill="#263e5a">improve</text>
      <text x="779" y="318" font-size="12" fill="#263e5a">daily work</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M400 305H416" marker-end="url(#tw3-arrow)"/>
      <path d="M548 305H564" marker-end="url(#tw3-arrow)"/>
      <path d="M696 305H712" marker-end="url(#tw3-arrow)"/>
    </g>
    <path d="M779 328V352H335V332" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tw3-arrow-ret)"/>
    <text x="557" y="372" font-size="11.5" font-style="italic" fill="#36424e" text-anchor="middle">repeat: keep improving the system of work</text>

    <text x="440" y="420" font-size="13" fill="#40566b" text-anchor="middle">Flow moves work left to right, feedback flows right to left, and learning keeps improving both.</text>
  </g>
</svg>
