<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="swb-title swb-desc">
  <title id="swb-title">Should we build an internal platform?</title>
  <desc id="swb-desc">A decision flowchart. First question: do three or more teams repeat the same delivery work? If no, not yet: a shared template repository, a wiki page, and managed services are enough. If yes, second question: does a managed product cover most of the need? If yes, adopt it, then add defaults, docs, and one golden path on top. If no, third question: can you staff the platform as a product, with ownership, support, and on-call? If no, build the thinnest viable platform: one golden path, owned part-time. If yes, build a platform as a product, starting from user research and a minimum viable golden path, and measure adoption.</desc>
  <defs>
    <marker id="swb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <path d="M130 92 250 46 370 92 250 138z"/>
      <path d="M130 214 250 168 370 214 250 260z"/>
      <path d="M130 336 250 290 370 336 250 382z"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#66400f">
      <text x="250" y="88">3 or more teams</text>
      <text x="250" y="105">repeat the same work?</text>
      <text x="250" y="210">A managed product</text>
      <text x="250" y="227">covers most of it?</text>
      <text x="250" y="332">Can you staff it</text>
      <text x="250" y="349">as a product?</text>
    </g>

    <rect x="430" y="66" width="426" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="643" y="88" font-size="12.5" font-weight="700" fill="#294a2e">Not yet: a shared template repository,</text>
    <text x="643" y="106" font-size="11.5" fill="#294a2e">a wiki page, and managed services are enough</text>
    <rect x="430" y="188" width="426" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="643" y="210" font-size="12.5" font-weight="700" fill="#294a2e">Adopt it, then add defaults, docs,</text>
    <text x="643" y="228" font-size="11.5" fill="#294a2e">and one golden path on top</text>
    <rect x="430" y="310" width="426" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="643" y="332" font-size="12.5" font-weight="700" fill="#263e5a">Thinnest viable platform:</text>
    <text x="643" y="350" font-size="11.5" fill="#263e5a">one golden path, owned part-time</text>
    <rect x="130" y="420" width="240" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="250" y="442" font-size="12.5" font-weight="700" fill="#463365">Platform as a product:</text>
    <text x="250" y="460" font-size="11.5" fill="#463365">user research, MVP, adoption</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M370 92H428" marker-end="url(#swb-arrow)"/>
      <path d="M250 138V166" marker-end="url(#swb-arrow)"/>
      <path d="M370 214H428" marker-end="url(#swb-arrow)"/>
      <path d="M250 260V288" marker-end="url(#swb-arrow)"/>
      <path d="M370 336H428" marker-end="url(#swb-arrow)"/>
      <path d="M250 382V418" marker-end="url(#swb-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="398" y="84">no</text>
      <text x="268" y="157">yes</text>
      <text x="398" y="206">yes</text>
      <text x="266" y="279">no</text>
      <text x="398" y="328">no</text>
      <text x="268" y="404">yes</text>
    </g>

    <text x="440" y="502" font-size="13" fill="#40566b">Build a platform only when several teams share the need and you can run it as a product.</text>
  </g>
</svg>
