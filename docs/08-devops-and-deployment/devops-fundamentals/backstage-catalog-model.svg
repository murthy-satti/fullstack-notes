<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="bcm-title bcm-desc">
  <title id="bcm-title">TaskFlow modeled in the Backstage software catalog</title>
  <desc id="bcm-desc">The Backstage catalog entities for TaskFlow. A domain named productivity contains the system named taskflow. Three components are part of the taskflow system: taskflow-reminders, a service owned by the reminders team; taskflow-api, a service owned by the tasks team; and taskflow-web, a website owned by the web team. The taskflow-api component depends on the resource taskflow-db, a database, and provides the API tasks-api, defined in OpenAPI. The taskflow-web component consumes the tasks-api API.</desc>
  <defs>
    <marker id="bcm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="355" y="36" width="170" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="440" y="54" font-size="11" font-style="italic" fill="#36424e">Domain</text>
    <text x="440" y="72" font-size="13" font-weight="700" fill="#36424e">productivity</text>
    <rect x="355" y="110" width="170" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="440" y="128" font-size="11" font-style="italic" fill="#36424e">System</text>
    <text x="440" y="146" font-size="13" font-weight="700" fill="#36424e">taskflow</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="110" y="200" width="190" height="64" rx="8"/>
      <rect x="345" y="200" width="190" height="64" rx="8"/>
      <rect x="580" y="200" width="190" height="64" rx="8"/>
    </g>
    <g fill="#66400f">
      <text x="205" y="218" font-size="11" font-style="italic">Component (service)</text>
      <text x="205" y="236" font-size="13" font-weight="700">taskflow-reminders</text>
      <text x="205" y="254" font-size="11.5">owner: reminders-team</text>
      <text x="440" y="218" font-size="11" font-style="italic">Component (service)</text>
      <text x="440" y="236" font-size="13" font-weight="700">taskflow-api</text>
      <text x="440" y="254" font-size="11.5">owner: tasks-team</text>
      <text x="675" y="218" font-size="11" font-style="italic">Component (website)</text>
      <text x="675" y="236" font-size="13" font-weight="700">taskflow-web</text>
      <text x="675" y="254" font-size="11.5">owner: web-team</text>
    </g>

    <rect x="110" y="316" width="190" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="205" y="334" font-size="11" font-style="italic" fill="#263e5a">Resource (database)</text>
    <text x="205" y="352" font-size="13" font-weight="700" fill="#263e5a">taskflow-db</text>
    <rect x="580" y="316" width="190" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="675" y="334" font-size="11" font-style="italic" fill="#463365">API (openapi)</text>
    <text x="675" y="352" font-size="13" font-weight="700" fill="#463365">tasks-api</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M440 110V82" marker-end="url(#bcm-arrow)"/>
      <path d="M205 200 398 156" marker-end="url(#bcm-arrow)"/>
      <path d="M440 200V156" marker-end="url(#bcm-arrow)"/>
      <path d="M675 200 482 156" marker-end="url(#bcm-arrow)"/>
      <path d="M400 264 262 314" marker-end="url(#bcm-arrow)"/>
      <path d="M480 264 618 314" marker-end="url(#bcm-arrow)"/>
      <path d="M690 264V314" marker-end="url(#bcm-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#36424e">
      <text x="450" y="100" text-anchor="start">partOf</text>
      <text x="450" y="185" text-anchor="start">partOf</text>
      <rect x="292" y="279" width="76" height="16" fill="#f5f7fb"/>
      <text x="330" y="291">dependsOn</text>
      <rect x="508" y="279" width="84" height="16" fill="#f5f7fb"/>
      <text x="550" y="291">providesApi</text>
      <text x="700" y="294" text-anchor="start">consumesApi</text>
    </g>

    <text x="440" y="404" font-size="13" fill="#40566b">The catalog answers who owns each piece, what it belongs to, and what it depends on.</text>
  </g>
</svg>
