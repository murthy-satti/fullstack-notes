<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="ltd-title ltd-desc">
  <title id="ltd-title">Distribution of change lead times for 27 TaskFlow commits</title>
  <desc id="ltd-desc">A histogram of change lead times for 27 commits deployed over two weeks: 2 took under 1 hour, 9 took 1 to 2 hours, 6 took 2 to 4 hours, 1 took 4 to 12 hours, 7 took 12 to 24 hours, 1 took 1 to 3 days, and 1 took more than 3 days. The 18 commits under 12 hours were deployed the same day, the 7 commits in the 12 to 24 hour range waited for the next day's deploy, and 2 waited over a weekend or on a long-lived branch. The median lead time is 2.3 hours, the mean is 12.2 hours, and the 90th percentile is 20.9 hours, so the mean is pulled far above the typical change by a few slow ones.</desc>
  <rect width="880" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Change lead time for 27 TaskFlow commits over two weeks</text>

    <path d="M80 300H800" stroke="#8a96a3" stroke-width="2"/>

    <g stroke-width="2">
      <rect x="95" y="256" width="70" height="44" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="195" y="102" width="70" height="198" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="295" y="168" width="70" height="132" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="395" y="278" width="70" height="22" rx="3" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="495" y="146" width="70" height="154" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="595" y="278" width="70" height="22" rx="3" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="695" y="278" width="70" height="22" rx="3" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="130" y="250">2</text>
      <text x="230" y="96">9</text>
      <text x="330" y="162">6</text>
      <text x="430" y="272">1</text>
      <text x="530" y="140">7</text>
      <text x="630" y="272">1</text>
      <text x="730" y="272">1</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="130" y="318">under 1 h</text>
      <text x="230" y="318">1-2 h</text>
      <text x="330" y="318">2-4 h</text>
      <text x="430" y="318">4-12 h</text>
      <text x="530" y="318">12-24 h</text>
      <text x="630" y="318">1-3 days</text>
      <text x="730" y="318">over 3 days</text>
    </g>

    <g fill="none" stroke-width="2" stroke-dasharray="5 4">
      <path d="M307 300V92" stroke="#294a2e"/>
      <path d="M496 300V76" stroke="#40566b"/>
      <path d="M547 300V92" stroke="#66400f"/>
    </g>
    <text x="307" y="86" font-size="12" font-weight="700" fill="#294a2e">median 2.3 h</text>
    <text x="490" y="70" font-size="12" font-weight="700" fill="#40566b" text-anchor="end">mean 12.2 h</text>
    <text x="553" y="86" font-size="12" font-weight="700" fill="#66400f" text-anchor="start">p90 20.9 h</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M95 334V340H465V334"/>
      <path d="M495 334V340H565V334"/>
      <path d="M595 334V340H765V334"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="280" y="356">deployed the same day: 18 commits</text>
      <text x="530" y="356">next day: 7</text>
      <text x="680" y="356">weekend or branch: 2</text>
    </g>

    <text x="440" y="392" font-size="13" fill="#40566b">Lead times are skewed: report the median and a high percentile, not the mean.</text>
  </g>
</svg>
