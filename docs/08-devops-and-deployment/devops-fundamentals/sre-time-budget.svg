<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="stb-title stb-desc">
  <title id="stb-title">The SRE time budget and its safety valve</title>
  <desc id="stb-desc">A bar splits an SRE team's time: at least 50 percent on engineering projects, at most 25 percent on call, and up to 25 percent on tickets and other operational work. Below, the safety valve: the team measures how much of its time goes to operational work each quarter. If operational work is not over 50 percent, the team keeps its engineering focus, automating toil and improving the service. If it is over 50 percent, the excess operational work is redirected to the product development team, which takes tickets and joins the pager rotation, until operational work is back under 50 percent. Developers who share the operational load are pushed to build systems that need less manual work.</desc>
  <defs>
    <marker id="stb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="stb-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b">An SRE team's time, as Google budgets it</text>
    <rect x="24" y="44" width="416" height="40" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="440" y="44" width="208" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="648" y="44" width="208" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="232" y="69" fill="#294a2e">engineering projects: at least 50%</text>
      <text x="544" y="69" fill="#263e5a">on-call: at most 25%</text>
      <text x="752" y="69" fill="#463365">other ops: up to 25%</text>
    </g>

    <path d="M24 108H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="134" font-size="13" font-weight="700" fill="#40566b">The safety valve when operational work grows</text>

    <rect x="24" y="152" width="180" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="114" y="175" font-size="13" font-weight="700" fill="#263e5a">Measure SRE time</text>
      <text x="114" y="194" font-size="11.5" fill="#263e5a">ops share each quarter</text>
    </g>

    <path d="M238 179 330 139 422 179 330 219z" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <g text-anchor="middle" fill="#66400f">
      <text x="330" y="175" font-size="12.5" font-weight="700">ops work</text>
      <text x="330" y="192" font-size="12.5" font-weight="700">over 50%?</text>
    </g>

    <rect x="470" y="152" width="272" height="54" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="606" y="175" font-size="13" font-weight="700" fill="#294a2e">Keep the engineering focus</text>
      <text x="606" y="194" font-size="11.5" fill="#294a2e">automate toil, improve the service</text>
    </g>

    <rect x="226" y="252" width="208" height="54" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="330" y="275" font-size="13" font-weight="700" fill="#6e2a24">Safety valve</text>
      <text x="330" y="294" font-size="11.5" fill="#6e2a24">redirect the excess work</text>
    </g>

    <rect x="470" y="252" width="272" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="606" y="275" font-size="13" font-weight="700" fill="#66400f">Product development team</text>
      <text x="606" y="294" font-size="11.5" fill="#66400f">takes tickets, joins the pager</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 179H236" marker-end="url(#stb-arrow)"/>
      <path d="M422 179H468" marker-end="url(#stb-arrow)"/>
      <path d="M330 219V250" marker-end="url(#stb-arrow)"/>
      <path d="M434 279H468" marker-end="url(#stb-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="433" y="170">no</text>
      <text x="340" y="240">yes</text>
    </g>
    <path d="M606 306V330H114V208" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stb-arrow-ret)"/>
    <rect x="236" y="322" width="236" height="16" fill="#f5f7fb"/>
    <text x="354" y="334" font-size="11.5" font-style="italic" fill="#36424e" text-anchor="middle">until ops work is back under 50%</text>

    <text x="440" y="372" font-size="13" fill="#40566b" text-anchor="middle">Developers who share the operational load are pushed to build systems that need less manual work.</text>
  </g>
</svg>
