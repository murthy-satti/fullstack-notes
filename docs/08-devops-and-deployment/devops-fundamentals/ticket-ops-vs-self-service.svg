<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="tvs-title tvs-desc">
  <title id="tvs-title">Getting a new database through tickets compared with self-service</title>
  <desc id="tvs-desc">Ticket-ops: a developer files a ticket, it waits about two working days in the platform team's queue, an engineer sets the database up by hand in about 45 minutes, and the credentials are shared by chat before the app is configured. That takes about three days per database, and 40 requests a month cost the platform team about 30 hours of manual work. Self-service: the developer asks through a portal form or CLI, policy checks validate size, backups, and encryption, automated setup provisions the database with infrastructure as code, and the secret is injected from the secret store. That takes about 15 minutes per database with no platform engineer time per request; the platform team spends its time building and improving the self-service path instead.</desc>
  <defs>
    <marker id="tvs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="14" font-weight="700" fill="#6e2a24" text-anchor="start">Ticket-ops: a new database for the reminders service</text>
    <rect x="24" y="48" width="180" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="114" y="70" font-size="12.5" font-weight="700" fill="#66400f">Developer files</text>
    <text x="114" y="88" font-size="11.5" fill="#66400f">a ticket</text>
    <rect x="224" y="48" width="200" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="324" y="70" font-size="12.5" font-weight="700" fill="#6e2a24">Waits in the queue</text>
    <text x="324" y="88" font-size="11.5" fill="#6e2a24">about 2 working days</text>
    <rect x="444" y="48" width="190" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="539" y="70" font-size="12.5" font-weight="700" fill="#6e2a24">Manual setup</text>
    <text x="539" y="88" font-size="11.5" fill="#6e2a24">45 min of engineer time</text>
    <rect x="654" y="48" width="202" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="755" y="70" font-size="12.5" font-weight="700" fill="#6e2a24">Credentials by chat</text>
    <text x="755" y="88" font-size="11.5" fill="#6e2a24">then the app is configured</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 74H222" marker-end="url(#tvs-arrow)"/>
      <path d="M424 74H442" marker-end="url(#tvs-arrow)"/>
      <path d="M634 74H652" marker-end="url(#tvs-arrow)"/>
    </g>
    <text x="24" y="126" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">About 3 days per database; 40 requests a month cost the platform team about 30 hours.</text>

    <path d="M24 146H856" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="176" font-size="14" font-weight="700" fill="#294a2e" text-anchor="start">Self-service: the same request</text>
    <rect x="24" y="190" width="180" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="114" y="212" font-size="12.5" font-weight="700" fill="#66400f">Developer asks</text>
    <text x="114" y="230" font-size="11.5" fill="#66400f">portal form or CLI</text>
    <rect x="224" y="190" width="200" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="324" y="212" font-size="12.5" font-weight="700" fill="#463365">Policy checks</text>
    <text x="324" y="230" font-size="11.5" fill="#463365">size, backups, encryption</text>
    <rect x="444" y="190" width="190" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="539" y="212" font-size="12.5" font-weight="700" fill="#263e5a">Automated setup</text>
    <text x="539" y="230" font-size="11.5" fill="#263e5a">infrastructure as code</text>
    <rect x="654" y="190" width="202" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="755" y="212" font-size="12.5" font-weight="700" fill="#294a2e">Secret injected</text>
    <text x="755" y="230" font-size="11.5" fill="#294a2e">from the secret store</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 216H222" marker-end="url(#tvs-arrow)"/>
      <path d="M424 216H442" marker-end="url(#tvs-arrow)"/>
      <path d="M634 216H652" marker-end="url(#tvs-arrow)"/>
    </g>
    <text x="24" y="268" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">About 15 minutes per database, with no platform engineer time per request.</text>

    <rect x="24" y="290" width="832" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="440" y="312" font-size="12.5" font-weight="700" fill="#463365">Where the platform team's time goes instead</text>
    <text x="440" y="330" font-size="11.5" fill="#463365">building the self-service path once, improving it from user feedback, and supporting the people who use it</text>

    <text x="440" y="384" font-size="13" fill="#40566b">Self-service turns a queue that grows with every team into a product that scales without more tickets.</text>
  </g>
</svg>
