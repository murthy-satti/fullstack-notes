<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="cap-title cap-desc">
  <title id="cap-title">Heavyweight external approval compared with streamlined change approval</title>
  <desc id="cap-desc">Top lane, heavyweight external approval: a change is ready, waits about two days for the weekly change advisory board, the board reviews a batch of 40 changes in one meeting, and they go out as one large release with higher risk per release. DORA found no evidence that external approval lowers change fail rates; it slows delivery and grows batches. Bottom lane, streamlined approval: a change is ready, gets peer review in the pull request within hours, passes automated checks for tests, scans, and policy, and is released with a progressive rollout and automatic rollback. If the automated risk check flags a high-risk change such as a migration, an authentication change, or infrastructure, it detours through an extra reviewer on a protected environment before the rollout. Every change leaves an audit trail of reviewer, checks, deploy, and approver, and emergency changes use the same path.</desc>
  <defs>
    <marker id="cap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="36" font-size="14" font-weight="700" fill="#6e2a24" text-anchor="start">Heavyweight external approval</text>
    <rect x="24" y="52" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="82" font-size="12.5" font-weight="700" fill="#66400f">Change ready</text>
    <rect x="196" y="52" width="180" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="286" y="73" font-size="12.5" font-weight="700" fill="#6e2a24">Wait for weekly CAB</text>
    <text x="286" y="91" font-size="11.5" fill="#6e2a24">about 2 days</text>
    <rect x="398" y="52" width="200" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="498" y="73" font-size="12.5" font-weight="700" fill="#6e2a24">CAB reviews a batch</text>
    <text x="498" y="91" font-size="11.5" fill="#6e2a24">of 40 changes</text>
    <rect x="620" y="52" width="236" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="738" y="73" font-size="12.5" font-weight="700" fill="#6e2a24">Large release</text>
    <text x="738" y="91" font-size="11.5" fill="#6e2a24">higher risk per release</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 77H194" marker-end="url(#cap-arrow)"/>
      <path d="M376 77H396" marker-end="url(#cap-arrow)"/>
      <path d="M598 77H618" marker-end="url(#cap-arrow)"/>
    </g>
    <text x="24" y="126" font-size="11.5" font-style="italic" fill="#6e2a24" text-anchor="start">DORA found no evidence that external approval lowers change fail rates; it slows delivery and grows batches.</text>

    <path d="M24 146H856" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="176" font-size="14" font-weight="700" fill="#294a2e" text-anchor="start">Streamlined approval</text>
    <rect x="24" y="192" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="222" font-size="12.5" font-weight="700" fill="#66400f">Change ready</text>
    <rect x="196" y="192" width="180" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="286" y="213" font-size="12.5" font-weight="700" fill="#294a2e">Peer review in PR</text>
    <text x="286" y="231" font-size="11.5" fill="#294a2e">within hours</text>
    <rect x="398" y="192" width="200" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="498" y="213" font-size="12.5" font-weight="700" fill="#463365">Automated checks</text>
    <text x="498" y="231" font-size="11.5" fill="#463365">tests, scans, policy</text>
    <rect x="620" y="192" width="236" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="738" y="213" font-size="12.5" font-weight="700" fill="#294a2e">Progressive rollout</text>
    <text x="738" y="231" font-size="11.5" fill="#294a2e">automatic rollback</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 217H194" marker-end="url(#cap-arrow)"/>
      <path d="M376 217H396" marker-end="url(#cap-arrow)"/>
      <path d="M598 217H618" marker-end="url(#cap-arrow)"/>
    </g>

    <rect x="398" y="292" width="200" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="498" y="313" font-size="12.5" font-weight="700" fill="#66400f">High-risk change</text>
    <text x="498" y="331" font-size="11.5" fill="#66400f">migration, auth, infra</text>
    <rect x="620" y="292" width="236" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="738" y="313" font-size="12.5" font-weight="700" fill="#263e5a">Extra reviewer</text>
    <text x="738" y="331" font-size="11.5" fill="#263e5a">via a protected environment</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M498 242V290" marker-end="url(#cap-arrow)"/>
      <path d="M598 317H618" marker-end="url(#cap-arrow)"/>
      <path d="M738 292V244" marker-end="url(#cap-arrow)"/>
    </g>
    <text x="508" y="270" font-size="11.5" font-style="italic" fill="#36424e" text-anchor="start">flagged</text>

    <rect x="24" y="364" width="832" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="440" y="386" font-size="12" fill="#463365">Audit trail for every change: reviewer, checks, deploy, approver. Emergency changes use the same path.</text>

    <text x="440" y="430" font-size="13" fill="#40566b">Peer review plus automation meets segregation of duties without batching changes for a meeting.</text>
  </g>
</svg>
