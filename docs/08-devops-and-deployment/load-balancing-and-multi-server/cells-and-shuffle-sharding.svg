<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="css-title css-desc">
  <title id="css-title">Regular sharding compared with shuffle sharding</title>
  <desc id="css-desc">Regular sharding, on the left: eight workers are grouped into four shards of two. Customer A sends a poison request that crashes the workers it reaches, so shard 2, workers 3 and 4, goes down, and every customer assigned to shard 2, a quarter of all customers, loses service. Shuffle sharding, on the right: each customer is assigned its own pseudo-random pair of the eight workers. Customer A's pair is workers 1 and 4, so the poison request takes down those two. Customer B's pair is workers 4 and 7, so B loses one worker but is still served by worker 7. Customer C's pair is workers 2 and 6 and is untouched. Eight workers allow 28 different pairs, so only customers with exactly A's pair lose both workers, about 1 in 28. Amazon Route 53 uses 2,048 virtual name servers and gives each domain 4 of them, about 730 billion possible shuffle shards. Cells apply the same isolation to whole copies of a stack.</desc>
  <defs>
    <marker id="css-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Regular sharding: 4 shards of 2 workers</text>
    <text x="448" y="32" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Shuffle sharding: each customer gets its own pair</text>
    <path d="M430 20V300" stroke="#c9d1db" stroke-width="1.5"/>

    <g stroke-width="1.5">
      <rect x="24" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="68" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="126" y="56" width="38" height="38" rx="6" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="170" y="56" width="38" height="38" rx="6" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="228" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="272" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="330" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="374" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="43" y="80" fill="#294a2e">w1</text>
      <text x="87" y="80" fill="#294a2e">w2</text>
      <text x="145" y="80" fill="#6e2a24">w3</text>
      <text x="189" y="80" fill="#6e2a24">w4</text>
      <text x="247" y="80" fill="#294a2e">w5</text>
      <text x="291" y="80" fill="#294a2e">w6</text>
      <text x="349" y="80" fill="#294a2e">w7</text>
      <text x="393" y="80" fill="#294a2e">w8</text>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M24 102V108H106V102"/>
      <path d="M126 102V108H208V102"/>
      <path d="M228 102V108H310V102"/>
      <path d="M330 102V108H412V102"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="65" y="124">shard 1</text>
      <text x="167" y="124" font-weight="700" fill="#6e2a24">shard 2: down</text>
      <text x="269" y="124">shard 3</text>
      <text x="371" y="124">shard 4</text>
    </g>
    <rect x="137" y="160" width="60" height="28" rx="14" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="167" y="179" font-size="12" font-weight="700" fill="#6e2a24">A</text>
    <path d="M167 160V132" fill="none" stroke="#b5524b" stroke-width="2" marker-end="url(#css-arrow)"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="222">Customer A's poison request crashes shard 2.</text>
      <text x="24" y="240">Every customer on shard 2 is down: 1 in 4,</text>
      <text x="24" y="258">25% of all customers.</text>
    </g>

    <g stroke-width="1.5">
      <rect x="448" y="56" width="38" height="38" rx="6" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="496" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="544" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="592" y="56" width="38" height="38" rx="6" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="640" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="688" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="736" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="784" y="56" width="38" height="38" rx="6" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="467" y="80" fill="#6e2a24">w1</text>
      <text x="515" y="80" fill="#294a2e">w2</text>
      <text x="563" y="80" fill="#294a2e">w3</text>
      <text x="611" y="80" fill="#6e2a24">w4</text>
      <text x="659" y="80" fill="#294a2e">w5</text>
      <text x="707" y="80" fill="#294a2e">w6</text>
      <text x="755" y="80" fill="#294a2e">w7</text>
      <text x="803" y="80" fill="#294a2e">w8</text>
    </g>

    <rect x="508" y="160" width="60" height="28" rx="14" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="538" y="179" font-size="12" font-weight="700" fill="#6e2a24">A</text>
    <rect x="652" y="160" width="60" height="28" rx="14" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="682" y="179" font-size="12" font-weight="700" fill="#66400f">B</text>
    <rect x="766" y="160" width="60" height="28" rx="14" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="796" y="179" font-size="12" font-weight="700" fill="#294a2e">C</text>

    <g fill="none" stroke-width="1.8" stroke-linecap="round">
      <path d="M526 160L469 96" stroke="#b5524b"/>
      <path d="M548 160L607 96" stroke="#b5524b"/>
      <path d="M668 160L616 96" stroke="#b5524b" stroke-dasharray="4 3"/>
      <path d="M696 160L752 96" stroke="#53845b"/>
      <path d="M780 160L712 96" stroke="#53845b"/>
    </g>
    <path d="M790 160C740 130 560 128 518 96" fill="none" stroke="#53845b" stroke-width="1.8"/>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="448" y="222">A's poison request crashes w1 and w4 (A's pair).</text>
      <text x="448" y="240">B (w4, w7) loses one worker but w7 still serves it;</text>
      <text x="448" y="258">C (w2, w6) is untouched. 8 workers give 28 pairs:</text>
      <text x="448" y="276">only customers with exactly A's pair lose both, ~1 in 28.</text>
    </g>

    <path d="M24 300H836" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="24" y="316" width="400" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="224" y="338" font-size="12.5" font-weight="700" fill="#263e5a">Amazon Route 53 (Builders' Library)</text>
    <text x="224" y="358" font-size="11.5" fill="#263e5a">2,048 virtual name servers; each domain gets 4:</text>
    <text x="224" y="376" font-size="11.5" fill="#263e5a">about 730 billion possible shuffle shards, so an</text>
    <text x="224" y="392" font-size="11.5" fill="#263e5a">attack on one domain rarely touches another's set</text>
    <rect x="436" y="316" width="400" height="84" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="636" y="338" font-size="12.5" font-weight="700" fill="#463365">Cells: the same idea for whole stacks</text>
    <text x="636" y="358" font-size="11.5" fill="#463365">AWS cell-based architecture, Slack's AZ cells,</text>
    <text x="636" y="376" font-size="11.5" fill="#463365">Shopify's pods: a failure stays inside one copy</text>
    <text x="636" y="392" font-size="11.5" fill="#463365">of the stack and its customers</text>

    <text x="430" y="446" font-size="13" fill="#40566b">Sharding limits a failure to one shard; shuffle sharding limits it to customers who share the exact same set.</text>
  </g>
</svg>
