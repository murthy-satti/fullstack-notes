<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="l47-title l47-desc">
  <title id="l47-title">Layer 4 compared with layer 7 load balancing</title>
  <desc id="l47-desc">Left, layer 4: a client opens one TCP connection and sends three requests on it. The layer 4 load balancer sees only IP addresses and ports, so it picks a backend once for the whole connection and forwards all three requests to server A, while servers B and C stay idle. It is fast, works for any TCP or UDP protocol, and can keep the client IP, but it cannot route by URL or retry a request. Right, layer 7: the same client connection with three requests reaches a layer 7 load balancer that terminates TLS and parses HTTP. It picks a backend for every request over its own pooled connections, so request 1 goes to A, request 2 to B, and request 3 to C. It can route by host, path, and header, retry, and run a WAF, but it costs more CPU and only speaks HTTP and gRPC.</desc>
  <defs>
    <marker id="l47-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="225" y="30" font-size="13" font-weight="700" fill="#263e5a">Layer 4: one decision per connection</text>
    <text x="665" y="30" font-size="13" font-weight="700" fill="#263e5a">Layer 7: one decision per request</text>
    <path d="M445 18V346" stroke="#c9d1db" stroke-width="1.5"/>

    <!-- left: L4 -->
    <rect x="125" y="46" width="200" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="225" y="65" font-size="13" font-weight="700" fill="#66400f">Client</text>
    <text x="225" y="81" font-size="11" fill="#66400f">1 connection, 3 requests</text>
    <path d="M225 90V136" fill="none" stroke="#40566b" stroke-width="3" marker-end="url(#l47-arrow)"/>
    <text x="236" y="118" font-size="11" fill="#36424e" text-anchor="start">TCP flow</text>
    <rect x="125" y="138" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="225" y="157" font-size="13" font-weight="700" fill="#263e5a">L4 load balancer</text>
    <text x="225" y="173" font-size="11" fill="#263e5a">sees IP addresses and ports</text>
    <path d="M190 182 104 252" fill="none" stroke="#40566b" stroke-width="3" marker-end="url(#l47-arrow)"/>
    <rect x="34" y="198" width="104" height="22" rx="6" fill="#f5f7fb"/>
    <text x="86" y="213" font-size="11" fill="#36424e">req 1, 2, 3</text>

    <rect x="40" y="254" width="110" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="95" y="273" font-size="13" font-weight="700" fill="#66400f">A</text>
    <text x="95" y="290" font-size="11" fill="#66400f">all 3 requests</text>
    <rect x="170" y="254" width="110" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="225" y="273" font-size="13" font-weight="700" fill="#36424e">B</text>
    <text x="225" y="290" font-size="11" fill="#36424e">idle</text>
    <rect x="300" y="254" width="110" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="355" y="273" font-size="13" font-weight="700" fill="#36424e">C</text>
    <text x="355" y="290" font-size="11" fill="#36424e">idle</text>

    <text x="225" y="322" font-size="11.5" fill="#294a2e">Fast, any TCP or UDP protocol, client IP kept</text>
    <text x="225" y="340" font-size="11.5" fill="#6e2a24">Cannot route by URL or retry a request</text>

    <!-- right: L7 -->
    <rect x="565" y="46" width="200" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="665" y="65" font-size="13" font-weight="700" fill="#66400f">Client</text>
    <text x="665" y="81" font-size="11" fill="#66400f">1 connection, 3 requests</text>
    <path d="M665 90V136" fill="none" stroke="#40566b" stroke-width="3" marker-end="url(#l47-arrow)"/>
    <text x="676" y="118" font-size="11" fill="#36424e" text-anchor="start">HTTPS</text>
    <rect x="565" y="138" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="665" y="157" font-size="13" font-weight="700" fill="#263e5a">L7 load balancer</text>
    <text x="665" y="173" font-size="11" fill="#263e5a">terminates TLS, parses HTTP</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M630 182 543 252" marker-end="url(#l47-arrow)"/>
      <path d="M665 182V252" marker-end="url(#l47-arrow)"/>
      <path d="M700 182 787 252" marker-end="url(#l47-arrow)"/>
    </g>
    <g font-size="11" fill="#36424e">
      <rect x="548" y="206" width="44" height="16" fill="#f5f7fb"/>
      <text x="570" y="218">req 1</text>
      <rect x="643" y="206" width="44" height="16" fill="#f5f7fb"/>
      <text x="665" y="218">req 2</text>
      <rect x="738" y="206" width="44" height="16" fill="#f5f7fb"/>
      <text x="760" y="218">req 3</text>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="480" y="254" width="110" height="46" rx="8"/>
      <rect x="610" y="254" width="110" height="46" rx="8"/>
      <rect x="740" y="254" width="110" height="46" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="535" y="273">A</text>
      <text x="665" y="273">B</text>
      <text x="795" y="273">C</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="535" y="290">request 1</text>
      <text x="665" y="290">request 2</text>
      <text x="795" y="290">request 3</text>
    </g>

    <text x="665" y="322" font-size="11.5" fill="#294a2e">Routes by host, path, header; retries; WAF</text>
    <text x="665" y="340" font-size="11.5" fill="#6e2a24">More CPU per request; HTTP and gRPC only</text>

    <text x="440" y="392" font-size="13" fill="#40566b">An L4 balancer picks a backend once per connection; an L7 balancer picks one for every request.</text>
  </g>
</svg>
