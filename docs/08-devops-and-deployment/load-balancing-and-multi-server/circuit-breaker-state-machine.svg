<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="cbs-title cbs-desc">
  <title id="cbs-title">Circuit breaker states and transitions</title>
  <desc id="cbs-desc">A circuit breaker starts Closed: calls pass through to the dependency and their results are recorded. When the failure rate reaches 50 percent of the last 20 calls, with at least 10 calls observed, it moves to Open. While Open, calls fail immediately with a circuit-open error, putting no load on the struggling dependency, and the caller serves a fallback such as cached or degraded data. After a 10 second cool-down the breaker moves to Half-open, where a small number of trial calls are allowed through while the rest still fail fast. If 2 trial calls succeed, the breaker returns to Closed and clears its history. If a trial call fails, it goes back to Open for another cool-down.</desc>
  <defs>
    <marker id="cbs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="140" width="200" height="72" rx="12" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="160" y="170" font-size="15" font-weight="700" fill="#294a2e">Closed</text>
    <text x="160" y="190" font-size="11.5" fill="#294a2e">calls pass; results recorded</text>

    <rect x="600" y="140" width="200" height="72" rx="12" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="700" y="170" font-size="15" font-weight="700" fill="#6e2a24">Open</text>
    <text x="700" y="190" font-size="11.5" fill="#6e2a24">calls fail fast</text>

    <rect x="330" y="300" width="200" height="72" rx="12" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="330" font-size="15" font-weight="700" fill="#66400f">Half-open</text>
    <text x="430" y="350" font-size="11.5" fill="#66400f">a few trial calls allowed</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 160H598" marker-end="url(#cbs-arrow)"/>
      <path d="M700 212V336H532" marker-end="url(#cbs-arrow)"/>
      <path d="M480 300V196H598" marker-end="url(#cbs-arrow)"/>
      <path d="M330 336H160V214" marker-end="url(#cbs-arrow)"/>
    </g>

    <text x="430" y="132" font-size="12" font-weight="700" fill="#6e2a24">failure rate ≥ 50% of the last 20 calls</text>
    <text x="430" y="150" font-size="11.5" fill="#6e2a24">(only after at least 10 calls)</text>
    <text x="708" y="270" font-size="12" font-weight="700" fill="#66400f" text-anchor="start">after a 10 s</text>
    <text x="708" y="286" font-size="12" font-weight="700" fill="#66400f" text-anchor="start">cool-down</text>
    <rect x="364" y="232" width="108" height="34" rx="4" fill="#f5f7fb"/>
    <text x="470" y="246" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="end">a trial call</text>
    <text x="470" y="262" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="end">fails</text>
    <text x="245" y="356" font-size="12" font-weight="700" fill="#294a2e">2 trial calls succeed</text>

    <rect x="560" y="40" width="276" height="76" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="572" y="62" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">While open</text>
    <text x="572" y="80" font-size="11.5" fill="#36424e" text-anchor="start">no load reaches the dependency;</text>
    <text x="572" y="97" font-size="11.5" fill="#36424e" text-anchor="start">callers serve cached or degraded data</text>

    <rect x="24" y="40" width="276" height="76" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="36" y="62" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">Count as failures</text>
    <text x="36" y="80" font-size="11.5" fill="#36424e" text-anchor="start">timeouts, connection errors, 5xx, 429;</text>
    <text x="36" y="97" font-size="11.5" fill="#36424e" text-anchor="start">not 4xx caused by the caller's input</text>

    <text x="430" y="420" font-size="13" fill="#40566b">Fail fast while a dependency is sick, then probe carefully before trusting it again.</text>
  </g>
</svg>
