<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="ail-title ail-desc">
  <title id="ail-title">An instance's life in an Auto Scaling group, with hooks and a warm pool</title>
  <desc id="ail-desc">Scale-out path: an instance waits pre-initialized in the warm pool in the Warmed:Stopped state, where only its volumes are billed. On scale-out it moves to Pending, then to Pending:Wait, where a launch lifecycle hook lets it finish setup such as warming caches before it continues. It then becomes InService: registered with the load balancer target group and health checked. Scale-in path: the group picks an instance that is not protected from scale-in. It enters Terminating, is deregistered from the target groups, and the load balancer's deregistration delay, 300 seconds by default on an Application Load Balancer, lets in-flight requests finish. In Terminating:Wait, a termination lifecycle hook, with a one hour heartbeat timeout by default, gives the instance time to flush logs and finish background jobs before it calls complete-lifecycle-action. The instance is then Terminated, or, with an instance reuse policy, returned to the warm pool.</desc>
  <defs>
    <marker id="ail-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ail-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Scale-out: launch path</text>

    <rect x="24" y="48" width="180" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="114" y="72" font-size="13" font-weight="700" fill="#463365">warm pool</text>
    <text x="114" y="90" font-size="11.5" fill="#463365">Warmed:Stopped</text>
    <text x="114" y="106" font-size="11" fill="#463365">only volumes billed</text>

    <rect x="236" y="48" width="180" height="70" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="326" y="78" font-size="13" font-weight="700" fill="#36424e">Pending</text>
    <text x="326" y="96" font-size="11.5" fill="#36424e">starting from the template</text>

    <rect x="448" y="48" width="180" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="538" y="72" font-size="13" font-weight="700" fill="#66400f">Pending:Wait</text>
    <text x="538" y="90" font-size="11.5" fill="#66400f">launch hook: finish setup,</text>
    <text x="538" y="106" font-size="11.5" fill="#66400f">warm caches</text>

    <rect x="660" y="48" width="176" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="748" y="72" font-size="13" font-weight="700" fill="#294a2e">InService</text>
    <text x="748" y="90" font-size="11.5" fill="#294a2e">registered in target</text>
    <text x="748" y="106" font-size="11.5" fill="#294a2e">group, health checked</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 83H234" marker-end="url(#ail-arrow)"/>
      <path d="M416 83H446" marker-end="url(#ail-arrow)"/>
      <path d="M628 83H658" marker-end="url(#ail-arrow)"/>
      <path d="M748 118V222" marker-end="url(#ail-arrow)"/>
    </g>
    <rect x="756" y="150" width="80" height="44" rx="6" fill="#f5f7fb"/>
    <text x="760" y="166" font-size="11" fill="#36424e" text-anchor="start">scale-in picks</text>
    <text x="760" y="181" font-size="11" fill="#36424e" text-anchor="start">an unprotected</text>
    <text x="760" y="196" font-size="11" fill="#36424e" text-anchor="start">instance</text>

    <path d="M24 136H740" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="236" y="160" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Scale-in: termination path (right to left)</text>

    <rect x="580" y="224" width="256" height="76" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="708" y="248" font-size="13" font-weight="700" fill="#263e5a">Terminating</text>
    <text x="708" y="266" font-size="11.5" fill="#263e5a">deregistered from target groups;</text>
    <text x="708" y="283" font-size="11.5" fill="#263e5a">deregistration delay (300 s default)</text>

    <rect x="302" y="224" width="246" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="425" y="248" font-size="13" font-weight="700" fill="#66400f">Terminating:Wait</text>
    <text x="425" y="266" font-size="11.5" fill="#66400f">termination hook (1 h default):</text>
    <text x="425" y="283" font-size="11.5" fill="#66400f">flush, finish jobs, then complete</text>

    <rect x="24" y="224" width="246" height="76" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="147" y="252" font-size="13" font-weight="700" fill="#6e2a24">Terminated</text>
    <text x="147" y="272" font-size="11.5" fill="#6e2a24">or, with a reuse policy,</text>
    <text x="147" y="289" font-size="11.5" fill="#6e2a24">back to the warm pool</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M580 262H550" marker-end="url(#ail-arrow)"/>
      <path d="M302 262H272" marker-end="url(#ail-arrow)"/>
    </g>
    <path d="M114 224V120" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ail-arrow-ret)"/>
    <rect x="122" y="176" width="100" height="16" fill="#f5f7fb"/>
    <text x="126" y="188" font-size="11" fill="#36424e" text-anchor="start">reuse on scale-in</text>

    <rect x="24" y="320" width="812" height="44" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="347" font-size="11.5" fill="#36424e">Scale-in protection keeps chosen instances (a worker mid-job) out of the selection; hooks never replace graceful SIGTERM handling.</text>

    <text x="430" y="400" font-size="13" fill="#40566b">Hooks and draining turn launch and termination into steps you control, not surprises.</text>
  </g>
</svg>
