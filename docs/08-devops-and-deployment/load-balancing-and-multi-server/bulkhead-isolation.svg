<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="bhi-title bhi-desc">
  <title id="bhi-title">Bulkheads keep one slow dependency from taking everything down</title>
  <desc id="bhi-desc">Without bulkheads, on the left, the API process has one shared pool of 50 concurrent request slots. The reports dependency becomes slow, every slot fills with a request stuck waiting on reports, and requests for tasks and for login have no free slot, queue, and time out: the whole API looks down although only reports is sick. With bulkheads, on the right, each dependency has its own limit: tasks 30 slots, reports 10 slots, and auth 10 slots. When reports becomes slow, its 10 slots fill and further reports calls are rejected immediately and answered with a fallback, while tasks and auth keep their own free slots and keep serving normally.</desc>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">One shared pool: reports is slow, everything fails</text>
    <text x="448" y="32" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Bulkheads: one pool per dependency</text>
    <path d="M430 20V330" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="48" width="390" height="150" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="36" y="68" font-size="12" font-weight="700" fill="#36424e" text-anchor="start">API process: 50 slots, all busy waiting on reports</text>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.2">
      <rect x="44" y="82" width="28" height="18" rx="3"/><rect x="80" y="82" width="28" height="18" rx="3"/><rect x="116" y="82" width="28" height="18" rx="3"/><rect x="152" y="82" width="28" height="18" rx="3"/><rect x="188" y="82" width="28" height="18" rx="3"/><rect x="224" y="82" width="28" height="18" rx="3"/><rect x="260" y="82" width="28" height="18" rx="3"/><rect x="296" y="82" width="28" height="18" rx="3"/><rect x="332" y="82" width="28" height="18" rx="3"/><rect x="368" y="82" width="28" height="18" rx="3"/>
      <rect x="44" y="104" width="28" height="18" rx="3"/><rect x="80" y="104" width="28" height="18" rx="3"/><rect x="116" y="104" width="28" height="18" rx="3"/><rect x="152" y="104" width="28" height="18" rx="3"/><rect x="188" y="104" width="28" height="18" rx="3"/><rect x="224" y="104" width="28" height="18" rx="3"/><rect x="260" y="104" width="28" height="18" rx="3"/><rect x="296" y="104" width="28" height="18" rx="3"/><rect x="332" y="104" width="28" height="18" rx="3"/><rect x="368" y="104" width="28" height="18" rx="3"/>
      <rect x="44" y="126" width="28" height="18" rx="3"/><rect x="80" y="126" width="28" height="18" rx="3"/><rect x="116" y="126" width="28" height="18" rx="3"/><rect x="152" y="126" width="28" height="18" rx="3"/><rect x="188" y="126" width="28" height="18" rx="3"/><rect x="224" y="126" width="28" height="18" rx="3"/><rect x="260" y="126" width="28" height="18" rx="3"/><rect x="296" y="126" width="28" height="18" rx="3"/><rect x="332" y="126" width="28" height="18" rx="3"/><rect x="368" y="126" width="28" height="18" rx="3"/>
      <rect x="44" y="148" width="28" height="18" rx="3"/><rect x="80" y="148" width="28" height="18" rx="3"/><rect x="116" y="148" width="28" height="18" rx="3"/><rect x="152" y="148" width="28" height="18" rx="3"/><rect x="188" y="148" width="28" height="18" rx="3"/><rect x="224" y="148" width="28" height="18" rx="3"/><rect x="260" y="148" width="28" height="18" rx="3"/><rect x="296" y="148" width="28" height="18" rx="3"/><rect x="332" y="148" width="28" height="18" rx="3"/><rect x="368" y="148" width="28" height="18" rx="3"/>
      <rect x="44" y="170" width="28" height="18" rx="3"/><rect x="80" y="170" width="28" height="18" rx="3"/><rect x="116" y="170" width="28" height="18" rx="3"/><rect x="152" y="170" width="28" height="18" rx="3"/><rect x="188" y="170" width="28" height="18" rx="3"/><rect x="224" y="170" width="28" height="18" rx="3"/><rect x="260" y="170" width="28" height="18" rx="3"/><rect x="296" y="170" width="28" height="18" rx="3"/><rect x="332" y="170" width="28" height="18" rx="3"/><rect x="368" y="170" width="28" height="18" rx="3"/>
    </g>

    <rect x="24" y="214" width="390" height="54" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="219" y="236" font-size="12" font-weight="700" fill="#6e2a24">tasks and login requests find no free slot,</text>
    <text x="219" y="254" font-size="12" font-weight="700" fill="#6e2a24">queue, and time out: the whole API looks down</text>

    <rect x="448" y="48" width="388" height="74" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="460" y="68" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">tasks: 30 slots, normal load</text>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.2">
      <rect x="460" y="78" width="28" height="16" rx="3"/><rect x="496" y="78" width="28" height="16" rx="3"/><rect x="532" y="78" width="28" height="16" rx="3"/><rect x="568" y="78" width="28" height="16" rx="3"/><rect x="604" y="78" width="28" height="16" rx="3"/><rect x="640" y="78" width="28" height="16" rx="3"/><rect x="676" y="78" width="28" height="16" rx="3"/><rect x="712" y="78" width="28" height="16" rx="3"/><rect x="748" y="78" width="28" height="16" rx="3"/><rect x="784" y="78" width="28" height="16" rx="3"/>
      <rect x="460" y="98" width="28" height="16" rx="3"/><rect x="496" y="98" width="28" height="16" rx="3"/><rect x="532" y="98" width="28" height="16" rx="3"/><rect x="568" y="98" width="28" height="16" rx="3"/><rect x="604" y="98" width="28" height="16" rx="3"/><rect x="640" y="98" width="28" height="16" rx="3"/><rect x="676" y="98" width="28" height="16" rx="3"/><rect x="712" y="98" width="28" height="16" rx="3"/><rect x="748" y="98" width="28" height="16" rx="3"/><rect x="784" y="98" width="28" height="16" rx="3"/>
    </g>

    <rect x="448" y="134" width="388" height="58" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="460" y="154" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">reports: 10 slots, all stuck on the slow dependency</text>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.2">
      <rect x="460" y="164" width="28" height="16" rx="3"/><rect x="496" y="164" width="28" height="16" rx="3"/><rect x="532" y="164" width="28" height="16" rx="3"/><rect x="568" y="164" width="28" height="16" rx="3"/><rect x="604" y="164" width="28" height="16" rx="3"/><rect x="640" y="164" width="28" height="16" rx="3"/><rect x="676" y="164" width="28" height="16" rx="3"/><rect x="712" y="164" width="28" height="16" rx="3"/><rect x="748" y="164" width="28" height="16" rx="3"/><rect x="784" y="164" width="28" height="16" rx="3"/>
    </g>

    <rect x="448" y="204" width="388" height="58" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="460" y="224" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">auth: 10 slots, normal load</text>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.2">
      <rect x="460" y="234" width="28" height="16" rx="3"/><rect x="496" y="234" width="28" height="16" rx="3"/><rect x="532" y="234" width="28" height="16" rx="3"/><rect x="568" y="234" width="28" height="16" rx="3"/><rect x="604" y="234" width="28" height="16" rx="3"/><rect x="640" y="234" width="28" height="16" rx="3"/><rect x="676" y="234" width="28" height="16" rx="3"/><rect x="712" y="234" width="28" height="16" rx="3"/><rect x="748" y="234" width="28" height="16" rx="3"/><rect x="784" y="234" width="28" height="16" rx="3"/>
    </g>

    <rect x="448" y="276" width="388" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="642" y="294" font-size="11.5" font-weight="700" fill="#66400f">extra reports calls rejected at once: serve a fallback</text>
    <text x="642" y="309" font-size="11.5" fill="#66400f">tasks and login keep working normally</text>

    <path d="M24 342H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="366" font-size="11.5" fill="#36424e">The same idea works at every scale: per-dependency pools in a process, separate fleets per workload, and cells per customer group.</text>
    <text x="430" y="410" font-size="13" fill="#40566b">Partition capacity so a failure can only drown its own compartment.</text>
  </g>
</svg>
