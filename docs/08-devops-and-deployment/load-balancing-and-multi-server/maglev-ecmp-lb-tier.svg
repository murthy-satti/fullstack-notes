<svg xmlns="http://www.w3.org/2000/svg" width="860" height="452" viewBox="0 0 860 452" role="img" aria-labelledby="mgl-title mgl-desc">
  <title id="mgl-title">A Maglev-style software load balancer tier behind ECMP</title>
  <desc id="mgl-desc">Users on the internet send packets to a service's virtual IP. Every Maglev machine announces that VIP to the router over BGP with the same cost, so the router spreads packets across all Maglev machines with equal-cost multipath routing. Each Maglev machine keeps a connection table and a Maglev hashing lookup table; because every machine builds the same lookup table, a given connection is sent to the same backend whichever Maglev receives its packets, so here Maglev 1 and Maglev 3 both forward one flow to backend B. Packets are forwarded to backends inside GRE encapsulation. Responses do not pass back through Maglev: backends send them directly toward the router, called direct server return. Capacity grows by adding Maglev machines, which gives N+1 redundancy instead of the 1+1 of a hardware load balancer pair.</desc>
  <defs>
    <marker id="mgl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="mgl-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="452" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="372" y="34" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">every Maglev announces the same VIP with equal cost</text>

    <rect x="24" y="176" width="120" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="84" y="200" font-size="13" font-weight="700" fill="#66400f">users</text>
    <text x="84" y="218" font-size="11" fill="#66400f">to the VIP</text>

    <rect x="176" y="166" width="136" height="76" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="244" y="192" font-size="13" font-weight="700" fill="#263e5a">router</text>
    <text x="244" y="210" font-size="11" fill="#263e5a">ECMP: spreads</text>
    <text x="244" y="225" font-size="11" fill="#263e5a">packets by flow hash</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="372" y="50" width="176" height="50" rx="8"/>
      <rect x="372" y="114" width="176" height="50" rx="8"/>
      <rect x="372" y="178" width="176" height="50" rx="8"/>
      <rect x="372" y="242" width="176" height="50" rx="8"/>
    </g>
    <g fill="#463365">
      <text x="460" y="71" font-size="12.5" font-weight="700">Maglev 1</text>
      <text x="460" y="88" font-size="10.5">connection + lookup table</text>
      <text x="460" y="135" font-size="12.5" font-weight="700">Maglev 2</text>
      <text x="460" y="152" font-size="10.5">connection + lookup table</text>
      <text x="460" y="199" font-size="12.5" font-weight="700">Maglev 3</text>
      <text x="460" y="216" font-size="10.5">connection + lookup table</text>
      <text x="460" y="263" font-size="12.5" font-weight="700">Maglev 4</text>
      <text x="460" y="280" font-size="10.5">connection + lookup table</text>
    </g>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="640" y="70" width="196" height="52" rx="8"/>
      <rect x="640" y="150" width="196" height="52" rx="8"/>
      <rect x="640" y="230" width="196" height="52" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="738" y="92" font-size="12.5" font-weight="700">backend A</text>
      <text x="738" y="109" font-size="11">service endpoint</text>
      <text x="738" y="172" font-size="12.5" font-weight="700">backend B</text>
      <text x="738" y="189" font-size="11">service endpoint</text>
      <text x="738" y="252" font-size="12.5" font-weight="700">backend C</text>
      <text x="738" y="269" font-size="11">service endpoint</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M144 204H174" marker-end="url(#mgl-arrow)"/>
      <path d="M312 190L370 78" marker-end="url(#mgl-arrow)"/>
      <path d="M312 198L370 140" marker-end="url(#mgl-arrow)"/>
      <path d="M312 206L370 203" marker-end="url(#mgl-arrow)"/>
      <path d="M312 214L370 266" marker-end="url(#mgl-arrow)"/>
      <path d="M548 76L638 168" marker-end="url(#mgl-arrow)"/>
      <path d="M548 202L638 184" marker-end="url(#mgl-arrow)"/>
    </g>
    <rect x="556" y="118" width="80" height="30" rx="4" fill="#f5f7fb"/>
    <text x="596" y="130" font-size="10.5" fill="#36424e">GRE to the</text>
    <text x="596" y="143" font-size="10.5" fill="#36424e">same backend</text>

    <path d="M738 282V318H244V244" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#mgl-arrow-ret)"/>
    <rect x="364" y="310" width="300" height="16" fill="#f5f7fb"/>
    <text x="514" y="322" font-size="11.5" fill="#36424e">responses bypass Maglev: direct server return</text>

    <rect x="24" y="344" width="812" height="62" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="366" font-size="11.5" fill="#36424e">Same lookup table on every Maglev: a flow keeps its backend even when ECMP moves it to another Maglev.</text>
    <text x="430" y="385" font-size="11.5" fill="#36424e">Add machines to add capacity: N+1 redundancy on commodity servers instead of a 1+1 hardware pair.</text>

    <text x="430" y="434" font-size="13" fill="#40566b">Google's Maglev (NSDI 2016): routers spread packets, software picks backends, responses skip the balancer.</text>
  </g>
</svg>
