<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="mso-title mso-desc">
  <title id="mso-title">Where each kind of instance state has to move</title>
  <desc id="mso-desc">Six rows compare state kept on one instance, why it breaks once there are two instances, and where it moves. Sessions in process memory: users are logged out after a reroute; move them to a Redis store or a short-lived signed token. Uploads on local disk: the file is missing on other instances; move them to object storage through presigned URLs. In-process caches: instances show different data; use a shared Redis cache and short local TTLs. A cron job in every instance: the job runs once per instance; claim each run in Redis or use one scheduler. WebSocket rooms in memory: events reach only some users; use a Redis pub/sub adapter. Rate-limit counters in memory: the limit is multiplied by the number of instances; keep counters in Redis or enforce limits at the edge.</desc>
  <defs>
    <marker id="mso-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700">
      <text x="154" y="34" fill="#6e2a24">On one instance</text>
      <text x="430" y="34" fill="#40566b">Breaks with two instances</text>
      <text x="698" y="34" fill="#294a2e">Shared or external</text>
    </g>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="2">
      <rect x="24" y="50" width="260" height="44" rx="8"/>
      <rect x="24" y="104" width="260" height="44" rx="8"/>
      <rect x="24" y="158" width="260" height="44" rx="8"/>
      <rect x="24" y="212" width="260" height="44" rx="8"/>
      <rect x="24" y="266" width="260" height="44" rx="8"/>
      <rect x="24" y="320" width="260" height="44" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#6e2a24">
      <text x="154" y="76">Sessions in process memory</text>
      <text x="154" y="130">Uploads on local disk</text>
      <text x="154" y="184">In-process caches</text>
      <text x="154" y="238">A cron job in every instance</text>
      <text x="154" y="292">WebSocket rooms in memory</text>
      <text x="154" y="346">Rate-limit counters in memory</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M286 72H558" marker-end="url(#mso-arrow)"/>
      <path d="M286 126H558" marker-end="url(#mso-arrow)"/>
      <path d="M286 180H558" marker-end="url(#mso-arrow)"/>
      <path d="M286 234H558" marker-end="url(#mso-arrow)"/>
      <path d="M286 288H558" marker-end="url(#mso-arrow)"/>
      <path d="M286 342H558" marker-end="url(#mso-arrow)"/>
    </g>
    <g fill="#f5f7fb">
      <rect x="335" y="63" width="190" height="16"/>
      <rect x="317" y="117" width="226" height="16"/>
      <rect x="324" y="171" width="212" height="16"/>
      <rect x="335" y="225" width="190" height="16"/>
      <rect x="327" y="279" width="206" height="16"/>
      <rect x="324" y="333" width="212" height="16"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#36424e">
      <text x="430" y="76">logged out after a reroute</text>
      <text x="430" y="130">file missing on other instances</text>
      <text x="430" y="184">instances show different data</text>
      <text x="430" y="238">job runs once per instance</text>
      <text x="430" y="292">events reach only some users</text>
      <text x="430" y="346">limit multiplied by instances</text>
    </g>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="560" y="50" width="276" height="44" rx="8"/>
      <rect x="560" y="104" width="276" height="44" rx="8"/>
      <rect x="560" y="158" width="276" height="44" rx="8"/>
      <rect x="560" y="212" width="276" height="44" rx="8"/>
      <rect x="560" y="266" width="276" height="44" rx="8"/>
      <rect x="560" y="320" width="276" height="44" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#294a2e">
      <text x="698" y="76">Redis store or short-lived token</text>
      <text x="698" y="130">Object storage, presigned URLs</text>
      <text x="698" y="184">Redis cache, short local TTLs</text>
      <text x="698" y="238">Claim each run, or one scheduler</text>
      <text x="698" y="292">Redis pub/sub adapter</text>
      <text x="698" y="346">Counters in Redis or at the edge</text>
    </g>

    <text x="430" y="402" font-size="13" fill="#40566b">An instance should hold nothing that another instance cannot rebuild or look up.</text>
  </g>
</svg>
