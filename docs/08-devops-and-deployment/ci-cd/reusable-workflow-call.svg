<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="rwc-title rwc-desc">
  <title id="rwc-title">How a caller workflow uses a reusable workflow</title>
  <desc id="rwc-desc">In the taskflow-api repository, the caller workflow release.yml has a job deploy-staging whose uses key points to the reusable workflow .github/workflows/deploy.yml (from another repository it would be referenced as org/repo/.github/workflows/deploy.yml at a tag such as v3). It passes inputs with: environment staging and the image digest, and passes secrets either mapped one by one or with secrets: inherit. The called deploy.yml declares on: workflow_call with typed inputs, the secrets it expects, and outputs. Its deploy job runs on its own runner, in the environment named by the input, so that environment's protection rules and secrets apply, and it authenticates to the cloud with OIDC. The job's output url is mapped to the workflow output and returned to the caller, where later jobs read it as needs.deploy-staging.outputs.url. Below, a comparison: a composite action bundles steps that run inside the caller's job on the caller's runner, while a reusable workflow supplies whole jobs with their own runners, environments, and secrets.</desc>
  <defs>
    <marker id="rwc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rwc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="24" width="360" height="270" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="46" font-size="13" font-weight="700" fill="#66400f">Caller: taskflow-api, workflows/release.yml</text>
    <g font-family="Courier New, monospace" font-size="11.5" fill="#66400f" text-anchor="start">
      <text x="36" y="76">jobs:</text>
      <text x="49.8" y="94">deploy-staging:</text>
      <text x="63.6" y="112">uses: ./.github/workflows/deploy.yml</text>
      <text x="63.6" y="130"># same repo: same commit</text>
      <text x="63.6" y="148">with:</text>
      <text x="77.4" y="166">environment: staging</text>
      <text x="77.4" y="184">image: ...@sha256:9f2c...</text>
      <text x="63.6" y="202">secrets: inherit</text>
      <text x="49.8" y="228">smoke-test:</text>
      <text x="63.6" y="246">needs: deploy-staging</text>
      <text x="63.6" y="264"># reads needs.deploy-staging</text>
      <text x="63.6" y="282">#   .outputs.url</text>
    </g>

    <rect x="500" y="24" width="360" height="270" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="680" y="46" font-size="13" font-weight="700" fill="#463365">Called: .github/workflows/deploy.yml</text>
    <text x="680" y="62" font-size="10.5" fill="#463365">from another repo: org/repo/.github/workflows/deploy.yml@v3</text>
    <g font-family="Courier New, monospace" font-size="11.5" fill="#463365" text-anchor="start">
      <text x="516" y="82">on:</text>
      <text x="529.8" y="98">workflow_call:</text>
      <text x="543.6" y="114">inputs: environment, image</text>
      <text x="543.6" y="130">secrets: (expected names)</text>
      <text x="543.6" y="148">outputs: url</text>
    </g>
    <rect x="516" y="164" width="328" height="112" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.8"/>
    <text x="680" y="186" font-size="12.5" font-weight="700" fill="#263e5a">job: deploy (its own runner)</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="680" y="206">environment: ${{ inputs.environment }}</text>
      <text x="680" y="224">protection rules and env secrets apply</text>
      <text x="680" y="242">OIDC login to the cloud, deploy image</text>
      <text x="680" y="262" font-weight="700">outputs: url</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M380 120H498" marker-end="url(#rwc-arrow)"/>
      <path d="M380 196H498" marker-end="url(#rwc-arrow)"/>
    </g>
    <path d="M500 262H382" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rwc-arrow-ret)"/>
    <g font-size="11" font-weight="700" fill="#40566b">
      <rect x="392" y="104" width="96" height="14" fill="#f5f7fb"/>
      <text x="440" y="115">uses + with</text>
      <rect x="392" y="180" width="96" height="14" fill="#f5f7fb"/>
      <text x="440" y="191">secrets</text>
      <rect x="392" y="246" width="96" height="14" fill="#f5f7fb"/>
      <text x="440" y="257">outputs.url</text>
    </g>

    <rect x="20" y="314" width="410" height="66" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="225" y="336" font-size="12.5" font-weight="700" fill="#36424e">Composite action (action.yml)</text>
    <text x="225" y="354" font-size="11.5" fill="#36424e">bundles steps; runs inside the caller's job</text>
    <text x="225" y="370" font-size="11.5" fill="#36424e">on the caller's runner; logged as one step</text>
    <rect x="450" y="314" width="410" height="66" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="655" y="336" font-size="12.5" font-weight="700" fill="#36424e">Reusable workflow (workflow_call)</text>
    <text x="655" y="354" font-size="11.5" fill="#36424e">supplies whole jobs with their own runners,</text>
    <text x="655" y="370" font-size="11.5" fill="#36424e">environments, and secrets; up to ten levels deep</text>

    <text x="440" y="412" font-size="13" fill="#40566b">Pin the called workflow to a tag or SHA; it runs as part of the caller's run, with the caller's context.</text>
  </g>
</svg>
