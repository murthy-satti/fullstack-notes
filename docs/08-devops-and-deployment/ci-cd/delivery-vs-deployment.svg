<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="dvd-title dvd-desc">
  <title id="dvd-title">Continuous integration, continuous delivery, and continuous deployment compared</title>
  <desc id="dvd-desc">Three lanes. Continuous integration only: a commit is built and tested by CI and main stays green, but releasing is a separate manual process that happens in batches every few weeks. Continuous delivery: the commit is built and tested, produces one artifact, is deployed to staging and tested, and then waits at a manual approval where a person decides when to deploy that already-tested artifact to production; every green build is releasable. Continuous deployment: the same pipeline, but the approval is replaced by automated gates such as tests, canary analysis, and metric checks, so every change that passes reaches production with no human step.</desc>
  <defs>
    <marker id="dvd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="20" y="40">Continuous integration only</text>
      <text x="20" y="150">Continuous delivery</text>
      <text x="20" y="260">Continuous deployment</text>
    </g>

    <g stroke-width="2">
      <rect x="20" y="52" width="110" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="150" y="52" width="110" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="280" y="52" width="110" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="410" y="52" width="450" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-dasharray="6 4"/>
    </g>
    <g font-size="12.5" font-weight="700">
      <text x="75" y="83" fill="#66400f">Commit</text>
      <text x="205" y="83" fill="#463365">CI: build, test</text>
      <text x="335" y="83" fill="#263e5a">main is green</text>
      <text x="635" y="75" fill="#6e2a24">Separate manual release process</text>
    </g>
    <text x="635" y="93" font-size="11.5" fill="#6e2a24">batched every few weeks, rebuilt and re-tested by hand</text>

    <g stroke-width="2">
      <rect x="20" y="162" width="110" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="150" y="162" width="110" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="280" y="162" width="110" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="410" y="162" width="120" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="550" y="162" width="150" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="720" y="162" width="140" height="52" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12.5" font-weight="700">
      <text x="75" y="193" fill="#66400f">Commit</text>
      <text x="205" y="193" fill="#463365">CI: build, test</text>
      <text x="335" y="193" fill="#263e5a">Artifact</text>
      <text x="470" y="193" fill="#263e5a">Staging tests</text>
      <text x="625" y="185" fill="#66400f">Person approves</text>
      <text x="790" y="193" fill="#294a2e">Production</text>
    </g>
    <text x="625" y="202" font-size="11" fill="#66400f">decides when</text>

    <g stroke-width="2">
      <rect x="20" y="272" width="110" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="150" y="272" width="110" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="280" y="272" width="110" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="410" y="272" width="120" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="550" y="272" width="150" height="52" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="720" y="272" width="140" height="52" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12.5" font-weight="700">
      <text x="75" y="303" fill="#66400f">Commit</text>
      <text x="205" y="303" fill="#463365">CI: build, test</text>
      <text x="335" y="303" fill="#263e5a">Artifact</text>
      <text x="470" y="303" fill="#263e5a">Staging tests</text>
      <text x="625" y="295" fill="#294a2e">Automated gates</text>
      <text x="790" y="303" fill="#294a2e">Production</text>
    </g>
    <text x="625" y="312" font-size="11" fill="#294a2e">canary, metric checks</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M130 78H148" marker-end="url(#dvd-arrow)"/>
      <path d="M260 78H278" marker-end="url(#dvd-arrow)"/>
      <path d="M390 78H408" marker-end="url(#dvd-arrow)"/>
      <path d="M130 188H148" marker-end="url(#dvd-arrow)"/>
      <path d="M260 188H278" marker-end="url(#dvd-arrow)"/>
      <path d="M390 188H408" marker-end="url(#dvd-arrow)"/>
      <path d="M530 188H548" marker-end="url(#dvd-arrow)"/>
      <path d="M700 188H718" marker-end="url(#dvd-arrow)"/>
      <path d="M130 298H148" marker-end="url(#dvd-arrow)"/>
      <path d="M260 298H278" marker-end="url(#dvd-arrow)"/>
      <path d="M390 298H408" marker-end="url(#dvd-arrow)"/>
      <path d="M530 298H548" marker-end="url(#dvd-arrow)"/>
      <path d="M700 298H718" marker-end="url(#dvd-arrow)"/>
    </g>
    <text x="580" y="236" font-size="11" font-style="italic" fill="#40566b">every green build is releasable; release is a business decision</text>
    <text x="580" y="346" font-size="11" font-style="italic" fill="#40566b">every change that passes ships; humans watch, they do not click</text>

    <text x="440" y="390" font-size="13" fill="#40566b">The pipeline is the same; what differs is who presses the deploy button, and when.</text>
  </g>
</svg>
