<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="pas-title pas-desc">
  <title id="pas-title">Attack surfaces of a CI/CD pipeline and their defenses</title>
  <desc id="pas-desc">Five stages of a pipeline, each with threats above and defenses below. Source and pull requests: threats are a stolen developer token, a malicious fork pull request, and a force push to main; defenses are two-factor authentication and branch rulesets, CODEOWNERS and required reviews, and signed commits. Workflows and triggers: threats are a pwn request where pull_request_target runs fork code with a write token, and script injection from pull request titles or branch names; defenses are using pull_request for fork code, passing untrusted input through env, and linting workflows with zizmor and actionlint. Actions and dependencies: threats are a retagged third-party action, as in the tj-actions incident, a malicious npm release, and typosquatting; defenses are pinning actions to commit SHAs, lockfiles with npm ci, dependency review, and a Dependabot cooldown. Runner and secrets: threats are secrets dumped to logs, long-lived cloud keys, cache poisoning, and persistent self-hosted runners; defenses are least-privilege permissions, OIDC short-lived credentials, environment-scoped secrets, and ephemeral runners. Artifacts and deploy: threats are an image replaced or retagged in the registry and unverified provenance; defenses are deploying by digest, attestations and SBOMs, and verifying before deploy.</desc>
  <defs>
    <marker id="pas-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
