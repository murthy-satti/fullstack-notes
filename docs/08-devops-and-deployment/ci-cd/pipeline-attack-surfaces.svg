    <g stroke-width="1.5" fill="#fbe9e7" stroke="#b5524b">
      <rect x="20" y="44" width="160" height="96" rx="8"/>
      <rect x="190" y="44" width="160" height="96" rx="8"/>
      <rect x="360" y="44" width="160" height="96" rx="8"/>
      <rect x="530" y="44" width="160" height="96" rx="8"/>
      <rect x="700" y="44" width="160" height="96" rx="8"/>
    </g>
    <g font-size="11" fill="#6e2a24">
      <text x="100" y="72">stolen developer token</text>
      <text x="100" y="92">malicious fork PR</text>
      <text x="100" y="112">force push to main</text>

      <text x="270" y="66">pwn request: fork code</text>
      <text x="270" y="82">runs with a write token</text>
      <text x="270" y="106">script injection from</text>
      <text x="270" y="122">PR titles, branch names</text>

      <text x="440" y="66">retagged third-party</text>
      <text x="440" y="82">action (tj-actions)</text>
      <text x="440" y="106">malicious npm release</text>
      <text x="440" y="126">typosquatting</text>

      <text x="610" y="66">secrets dumped to logs</text>
      <text x="610" y="84">long-lived cloud keys</text>
      <text x="610" y="102">cache poisoning</text>
      <text x="610" y="120">persistent runners</text>

      <text x="780" y="72">image replaced or</text>
      <text x="780" y="88">retagged in registry</text>
      <text x="780" y="112">unverified provenance</text>
    </g>

    <g stroke-width="2" fill="#e5efff" stroke="#4774aa">
      <rect x="20" y="176" width="160" height="50" rx="8"/>
      <rect x="190" y="176" width="160" height="50" rx="8"/>
      <rect x="360" y="176" width="160" height="50" rx="8"/>
      <rect x="530" y="176" width="160" height="50" rx="8"/>
      <rect x="700" y="176" width="160" height="50" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="100" y="206">Source and PRs</text>
      <text x="270" y="206">Workflows, triggers</text>
      <text x="440" y="206">Actions, dependencies</text>
      <text x="610" y="206">Runner and secrets</text>
      <text x="780" y="206">Artifacts, deploy</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M180 201H188" marker-end="url(#pas-arrow)"/>
      <path d="M350 201H358" marker-end="url(#pas-arrow)"/>
      <path d="M520 201H528" marker-end="url(#pas-arrow)"/>
      <path d="M690 201H698" marker-end="url(#pas-arrow)"/>
    </g>
    <g fill="none" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M100 140V174" marker-end="url(#pas-arrow)"/>
      <path d="M270 140V174" marker-end="url(#pas-arrow)"/>
      <path d="M440 140V174" marker-end="url(#pas-arrow)"/>
      <path d="M610 140V174" marker-end="url(#pas-arrow)"/>
      <path d="M780 140V174" marker-end="url(#pas-arrow)"/>
    </g>

    <text x="24" y="254" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="start">Defenses</text>
    <g stroke-width="1.5" fill="#e7f3e9" stroke="#53845b">
      <rect x="20" y="264" width="160" height="96" rx="8"/>
      <rect x="190" y="264" width="160" height="96" rx="8"/>
      <rect x="360" y="264" width="160" height="96" rx="8"/>
      <rect x="530" y="264" width="160" height="96" rx="8"/>
      <rect x="700" y="264" width="160" height="96" rx="8"/>
    </g>
    <g fill="none" stroke="#53845b" stroke-width="1.5">
      <path d="M100 226V262"/><path d="M270 226V262"/><path d="M440 226V262"/><path d="M610 226V262"/><path d="M780 226V262"/>
    </g>
    <g font-size="11" fill="#294a2e">
      <text x="100" y="292">2FA, branch rulesets</text>
      <text x="100" y="312">CODEOWNERS, reviews</text>
      <text x="100" y="332">signed commits</text>

      <text x="270" y="292">pull_request for forks</text>
      <text x="270" y="312">untrusted input via env:</text>
      <text x="270" y="332">zizmor, actionlint</text>

      <text x="440" y="286">pin actions to SHAs</text>
      <text x="440" y="304">lockfile + npm ci</text>
      <text x="440" y="322">dependency review</text>
      <text x="440" y="340">Dependabot cooldown</text>

      <text x="610" y="286">least-privilege token</text>
      <text x="610" y="304">OIDC, short-lived creds</text>
      <text x="610" y="322">env-scoped secrets</text>
      <text x="610" y="340">ephemeral runners</text>

      <text x="780" y="292">deploy by digest</text>
      <text x="780" y="312">attestations, SBOM</text>
      <text x="780" y="332">verify before deploy</text>
    </g>

    <text x="440" y="392" font-size="12.5" fill="#40566b">A pipeline holds credentials and runs other people's code: every input is a way in.</text>
    <text x="440" y="414" font-size="11.5" fill="#40566b">Secure the code, the workflow, its dependencies, its credentials, and its outputs.</text>
  </g>
</svg>
