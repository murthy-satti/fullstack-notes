<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="oid-title oid-desc">
  <title id="oid-title">OIDC token exchange between GitHub Actions and AWS</title>
  <desc id="oid-desc">Four lifelines: the GitHub Actions job, GitHub's OIDC provider at token.actions.githubusercontent.com, AWS STS, and AWS resources such as ECR and EKS. 1: the job, which has permissions id-token write, requests an ID token for the audience sts.amazonaws.com. 2: the OIDC provider returns a short-lived signed JWT whose claims include the issuer, the audience, the subject repo:example/taskflow-api:environment:production, the commit SHA, the ref, and the run. 3: the job calls AssumeRoleWithWebIdentity with the role ARN and the JWT. 4: STS verifies the token signature with the provider's published keys and checks the role's trust policy conditions on audience and subject. 5: STS returns temporary credentials that expire, by default after one hour. 6: the job uses them to push the image and deploy. No long-lived cloud keys are stored in GitHub, and a token from another repository, branch, or environment does not match the trust policy and is rejected.</desc>
  <defs>
    <marker id="oid-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="oid-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="20" width="160" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="42" font-size="13" font-weight="700" fill="#66400f">Actions job</text>
    <text x="110" y="59" font-size="11" fill="#66400f">id-token: write</text>
    <rect x="250" y="20" width="180" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="340" y="42" font-size="13" font-weight="700" fill="#463365">GitHub OIDC provider</text>
    <text x="340" y="59" font-size="10.5" fill="#463365">token.actions.githubusercontent.com</text>
    <rect x="490" y="20" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="570" y="42" font-size="13" font-weight="700" fill="#263e5a">AWS STS</text>
    <text x="570" y="59" font-size="11" fill="#263e5a">IAM role trust policy</text>
    <rect x="700" y="20" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="780" y="42" font-size="13" font-weight="700" fill="#263e5a">AWS resources</text>
    <text x="780" y="59" font-size="11" fill="#263e5a">ECR, EKS</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 70V390"/><path d="M340 70V390"/><path d="M570 70V390"/><path d="M780 70V390"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 110H338" marker-end="url(#oid-arrow)"/>
      <path d="M110 214H568" marker-end="url(#oid-arrow)"/>
      <path d="M110 346H778" marker-end="url(#oid-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M340 140H112" marker-end="url(#oid-arrow-ret)"/>
      <path d="M570 310H112" marker-end="url(#oid-arrow-ret)"/>
    </g>
    <path d="M570 236H600V272H572" fill="none" stroke="#40566b" stroke-width="1.8" marker-end="url(#oid-arrow)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="225" y="88">1. request ID token</text>
      <text x="225" y="103" font-size="11">audience: sts.amazonaws.com</text>
      <text x="225" y="133">2. signed JWT, valid for minutes</text>
    </g>
    <rect x="120" y="150" width="352" height="46" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.2"/>
    <g font-size="10.5" fill="#463365" text-anchor="start">
      <text x="130" y="166">sub: repo:example/taskflow-api:environment:production</text>
      <text x="130" y="184">iss, aud, sha, ref, workflow, run_id ...</text>
    </g>
    <rect x="250" y="200" width="220" height="16" fill="#f5f7fb"/>
    <text x="360" y="212" font-size="11.5" fill="#36424e">3. AssumeRoleWithWebIdentity(role, JWT)</text>
    <g font-size="11" fill="#263e5a" text-anchor="start">
      <text x="608" y="240">4. verify signature with</text>
      <text x="608" y="255">the provider's keys; check</text>
      <text x="608" y="270">aud and sub conditions</text>
    </g>
    <rect x="250" y="296" width="220" height="16" fill="#f5f7fb"/>
    <text x="360" y="308" font-size="11.5" fill="#36424e">5. temporary credentials (1 hour)</text>
    <rect x="300" y="332" width="320" height="16" fill="#f5f7fb"/>
    <text x="460" y="344" font-size="11.5" fill="#36424e">6. push image, deploy (short-lived credentials)</text>

    <rect x="30" y="400" width="400" height="38" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="230" y="424" font-size="12" font-weight="700" fill="#294a2e">No long-lived cloud keys stored in GitHub</text>
    <rect x="450" y="400" width="410" height="38" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="655" y="417" font-size="11.5" font-weight="700" fill="#6e2a24">Token from another repo, branch, or environment:</text>
    <text x="655" y="432" font-size="11.5" fill="#6e2a24">sub does not match the trust policy, so STS refuses</text>

    <text x="440" y="461" font-size="12.5" fill="#40566b">Identity is proven per run; the cloud decides what that run may do.</text>
  </g>
</svg>
