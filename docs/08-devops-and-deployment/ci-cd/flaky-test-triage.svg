<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="ftt-title ftt-desc">
  <title id="ftt-title">Triage flow for a failing, possibly flaky test</title>
  <desc id="ftt-desc">A test fails in CI. Rerun it on the same commit. If it fails again, it is a real failure: fix the code or revert the change. If it passes on rerun, the test is flaky: it gave both results for the same code. Record it with a flaky label and a count. If it blocks many pull requests, quarantine it: move it out of the required checks into a non-blocking job and open an issue with an owner and a deadline. Then find the root cause, commonly timing and fixed sleeps, shared state between tests, test order dependence, real external services, dates and time zones, or resource limits on the runner. Fix it, verify by running the test many times, for example 50 repetitions, and return it to the required suite. Never just keep retrying until green.</desc>
  <defs>
    <marker id="ftt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="30" width="180" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="120" y="52" font-size="13" font-weight="700" fill="#6e2a24">Test fails in CI</text>
    <text x="120" y="69" font-size="11" fill="#6e2a24">required check is red</text>

    <path d="M370 20 470 55 370 90 270 55z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="370" y="52" font-size="12" font-weight="700" fill="#463365">Rerun, same commit:</text>
    <text x="370" y="68" font-size="12" font-weight="700" fill="#463365">passes?</text>

    <rect x="560" y="30" width="290" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="705" y="52" font-size="13" font-weight="700" fill="#6e2a24">Real failure</text>
    <text x="705" y="69" font-size="11" fill="#6e2a24">fix the code or revert the change</text>

    <rect x="270" y="120" width="200" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="370" y="142" font-size="13" font-weight="700" fill="#66400f">Flaky test</text>
    <text x="370" y="159" font-size="11" fill="#66400f">label it, count occurrences</text>

    <path d="M370 200 470 235 370 270 270 235z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="370" y="232" font-size="12" font-weight="700" fill="#463365">Blocking many</text>
    <text x="370" y="248" font-size="12" font-weight="700" fill="#463365">PRs?</text>

    <rect x="560" y="200" width="290" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="705" y="222" font-size="13" font-weight="700" fill="#66400f">Quarantine</text>
    <text x="705" y="240" font-size="11" fill="#66400f">move to a non-required job</text>
    <text x="705" y="256" font-size="11" fill="#66400f">issue with an owner and a deadline</text>

    <rect x="30" y="300" width="380" height="96" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="220" y="322" font-size="13" font-weight="700" fill="#263e5a">Find the root cause</text>
    <g font-size="11" fill="#263e5a" text-anchor="start">
      <text x="46" y="344">timing and fixed sleeps</text>
      <text x="46" y="362">shared state between tests</text>
      <text x="46" y="380">test order dependence</text>
      <text x="230" y="344">real external services</text>
      <text x="230" y="362">dates and time zones</text>
      <text x="230" y="380">runner resource limits</text>
    </g>

    <rect x="560" y="310" width="290" height="76" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="705" y="333" font-size="13" font-weight="700" fill="#294a2e">Fix, verify, restore</text>
    <text x="705" y="352" font-size="11" fill="#294a2e">run it many times (for example 50)</text>
    <text x="705" y="368" font-size="11" fill="#294a2e">then back into the required suite</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round">
      <path d="M210 55H268" marker-end="url(#ftt-arrow)"/>
      <path d="M470 55H558" marker-end="url(#ftt-arrow)"/>
      <path d="M370 90V118" marker-end="url(#ftt-arrow)"/>
      <path d="M370 170V198" marker-end="url(#ftt-arrow)"/>
      <path d="M470 235H558" marker-end="url(#ftt-arrow)"/>
      <path d="M705 270V280H220V298" marker-end="url(#ftt-arrow)"/>
      <path d="M270 235H220V298" marker-end="url(#ftt-arrow)"/>
      <path d="M410 348H558" marker-end="url(#ftt-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="514" y="47">no</text>
      <text x="384" y="108" text-anchor="start">yes</text>
      <text x="514" y="227">yes</text>
      <text x="246" y="227">no: fix now</text>
    </g>

    <text x="440" y="432" font-size="13" fill="#40566b">A flaky test teaches people to ignore red: quarantine it quickly, fix it properly, never just retry until green.</text>
  </g>
</svg>
