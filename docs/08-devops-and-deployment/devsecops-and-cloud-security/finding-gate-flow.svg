<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img" aria-labelledby="fgf-title fgf-desc">
  <title id="fgf-title">Deciding whether one scanner finding blocks the pipeline</title>
  <desc id="fgf-desc">A finding from any scanner enters three decisions in turn. First: is it new in this change? If not, it is existing debt, so the check only reports it and it stays tracked in its own ticket. If it is new, second: is it high or critical severity and from a high-confidence rule? If not, the pull request shows a warning and a ticket asks for a fix within the SLA. If it is, third: is a fix or upgrade available? If not, the team records a time-boxed exception with an owner, a reason, and an expiry date. If a fix exists, the merge or release is blocked; the author fixes it and re-runs the check, and the change merges once it passes.</desc>
  <defs>
    <marker id="fgf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="336" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Gating one finding: block only what is new, serious, and fixable</text>

    <rect x="16" y="88" width="96" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="64" y="112" font-size="13" font-weight="700" fill="#463365">Finding</text>
    <text x="64" y="130" font-size="11" fill="#463365">any scanner</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M137 116 222 66 307 116 222 166z"/>
      <path d="M333 116 418 66 503 116 418 166z"/>
      <path d="M529 116 614 66 699 116 614 166z"/>
    </g>
    <g font-size="12" fill="#36424e">
      <text x="222" y="113">New in this</text>
      <text x="222" y="129">change?</text>
      <text x="418" y="104">HIGH or</text>
      <text x="418" y="118">CRITICAL and</text>
      <text x="418" y="132">confident?</text>
      <text x="614" y="113">Fix or upgrade</text>
      <text x="614" y="129">available?</text>
    </g>

    <rect x="736" y="88" width="128" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="800" y="112" font-size="12.5" font-weight="700" fill="#6e2a24">Block merge</text>
    <text x="800" y="130" font-size="11" fill="#6e2a24">or release</text>
    <rect x="736" y="226" width="128" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="800" y="250" font-size="12" font-weight="700" fill="#294a2e">Fix and re-run</text>
    <text x="800" y="268" font-size="11" fill="#294a2e">then merge</text>

    <rect x="137" y="226" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="222" y="250" font-size="12.5" font-weight="700" fill="#463365">Report only</text>
    <text x="222" y="268" font-size="11" fill="#463365">tracked in its ticket</text>
    <rect x="333" y="226" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="418" y="250" font-size="12.5" font-weight="700" fill="#463365">Warn in the PR</text>
    <text x="418" y="268" font-size="11" fill="#463365">fix within the SLA</text>
    <rect x="529" y="226" width="170" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="614" y="250" font-size="12.5" font-weight="700" fill="#66400f">Exception</text>
    <text x="614" y="268" font-size="11" fill="#66400f">owner, reason, expiry</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M112 116H135" marker-end="url(#fgf-arrow)"/>
      <path d="M307 116H331" marker-end="url(#fgf-arrow)"/>
      <path d="M503 116H527" marker-end="url(#fgf-arrow)"/>
      <path d="M699 116H734" marker-end="url(#fgf-arrow)"/>
      <path d="M222 166V224" marker-end="url(#fgf-arrow)"/>
      <path d="M418 166V224" marker-end="url(#fgf-arrow)"/>
      <path d="M614 166V224" marker-end="url(#fgf-arrow)"/>
      <path d="M800 144V224" marker-end="url(#fgf-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#294a2e">
      <text x="319" y="107">yes</text>
      <text x="515" y="107">yes</text>
      <text x="716" y="107">yes</text>
    </g>
    <g font-size="11" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="230" y="200">no</text>
      <text x="426" y="200">no</text>
      <text x="622" y="200">no</text>
    </g>

    <text x="440" y="318" font-size="13" fill="#40566b">Only new, serious, fixable findings stop the pipeline; the rest is tracked, not silently dropped.</text>
  </g>
</svg>
