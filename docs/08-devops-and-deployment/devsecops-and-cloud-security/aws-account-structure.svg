<svg xmlns="http://www.w3.org/2000/svg" width="860" height="458" viewBox="0 0 860 458" role="img" aria-labelledby="aas-title aas-desc">
  <title id="aas-title">A multi-account landing zone for TaskFlow in AWS Organizations</title>
  <desc id="aas-desc">At the top, the management account holds the organization and billing and runs no workloads; next to it, IAM Identity Center provides single sign-on with MFA and permission sets. Three organizational units sit below. The Security OU contains the Log Archive account with the organization trail and AWS Config logs, the Audit account with security tools and audit roles, and the emergency access account for break-glass users, with an alert on any use. The Workloads OU contains taskflow-staging, built with the same layout as production, and taskflow-production, which runs the API, database, and uploads; SCP guardrails on this OU restrict Regions, protect trails, and deny the root user. The Sandbox OU contains developer sandboxes, one per engineer with budgets, and SCP guardrails that limit instance types. A dashed path shows the CloudTrail organization trail delivering every account's API activity to the Log Archive account.</desc>
  <defs>
    <marker id="aas-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="458" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">A multi-account landing zone for TaskFlow</text>

    <rect x="290" y="44" width="280" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="66" font-size="13" font-weight="700" fill="#263e5a">Management account</text>
    <text x="430" y="84" font-size="11" fill="#263e5a">organization, billing, no workloads</text>
    <rect x="620" y="44" width="216" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="728" y="66" font-size="13" font-weight="700" fill="#463365">IAM Identity Center</text>
    <text x="728" y="84" font-size="11" fill="#463365">SSO, MFA, permission sets</text>
    <path d="M570 70H618" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4"/>

    <path d="M430 96V118M158 118H710M158 118V140M438 118V140M710 118V140" fill="none" stroke="#8a96a3" stroke-width="1.5"/>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4">
      <rect x="24" y="140" width="268" height="216" rx="10"/>
      <rect x="304" y="140" width="268" height="216" rx="10"/>
      <rect x="584" y="140" width="252" height="216" rx="10"/>
    </g>
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="158" y="162">Security OU</text>
      <text x="438" y="162">Workloads OU</text>
      <text x="710" y="162">Sandbox OU</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="44" y="176" width="228" height="48" rx="8"/>
      <rect x="44" y="234" width="228" height="48" rx="8"/>
      <rect x="44" y="292" width="228" height="48" rx="8"/>
      <rect x="324" y="176" width="228" height="48" rx="8"/>
      <rect x="324" y="234" width="228" height="48" rx="8"/>
      <rect x="604" y="176" width="212" height="48" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="158" y="196">Log Archive account</text>
      <text x="158" y="254">Audit account</text>
      <text x="158" y="312">Emergency access account</text>
      <text x="438" y="196">taskflow-staging</text>
      <text x="438" y="254">taskflow-production</text>
      <text x="710" y="196">Developer sandboxes</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="158" y="213">org trail and Config logs</text>
      <text x="158" y="271">security tools, audit roles</text>
      <text x="158" y="329">break-glass, alert on any use</text>
      <text x="438" y="213">same layout as production</text>
      <text x="438" y="271">API, database, uploads</text>
      <text x="710" y="213">one per engineer, budgets</text>
    </g>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="324" y="292" width="228" height="48" rx="8"/>
      <rect x="604" y="234" width="212" height="48" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#6e2a24">
      <text x="438" y="312">SCP guardrails</text>
      <text x="710" y="254">SCP guardrails</text>
    </g>
    <g font-size="11" fill="#6e2a24">
      <text x="438" y="329">Regions, trails, root user</text>
      <text x="710" y="271">limit instance types</text>
    </g>

    <path d="M710 356V388H158V358" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aas-arrow-ret)"/>
    <path d="M438 356V388" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
    <rect x="186" y="380" width="230" height="16" fill="#f5f7fb"/>
    <text x="301" y="392" font-size="11.5" font-style="italic" fill="#40566b">organization trail to Log Archive</text>

    <text x="430" y="436" font-size="13" fill="#40566b">Accounts are blast-radius boundaries: SCPs cap what any principal in an OU can do.</text>
  </g>
</svg>
