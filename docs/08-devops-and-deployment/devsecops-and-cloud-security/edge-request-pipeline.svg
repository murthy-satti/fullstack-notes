<svg xmlns="http://www.w3.org/2000/svg" width="800" height="556" viewBox="0 0 800 556" role="img" aria-labelledby="erp-title erp-desc">
  <title id="erp-title">Layers of edge protection that a request passes before reaching the origin</title>
  <desc id="erp-desc">All requests, from users, bots, and attackers, enter at the top. First, the anycast edge network absorbs volumetric floods, and SYN floods and UDP amplification are dropped. Second, IP reputation and geo rules block known-bad and anonymizer addresses. Third, WAF rules from managed rule groups and the OWASP Core Rule Set block injection and exploit payloads. Fourth, rate-based rules per IP, per path, or per key limit floods and password guessing. Fifth, bot management uses scores and challenges, so scripts and headless browsers are challenged. Sixth, the edge cache serves static and cacheable responses with no origin load. What remains reaches the origin, TaskFlow API, which accepts traffic from the edge only. The arrows narrow at each step because each layer removes one class of bad traffic.</desc>
  <defs>
    <marker id="erp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="556" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One request, filtered layer by layer at the edge</text>

    <rect x="60" y="44" width="300" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="210" y="61" font-size="13" font-weight="700" fill="#66400f">All requests</text>
    <text x="210" y="77" font-size="11" fill="#66400f">users, bots, and attackers</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="60" y="106" width="300" height="44" rx="8"/>
      <rect x="60" y="166" width="300" height="44" rx="8"/>
      <rect x="60" y="226" width="300" height="44" rx="8"/>
      <rect x="60" y="286" width="300" height="44" rx="8"/>
      <rect x="60" y="346" width="300" height="44" rx="8"/>
      <rect x="60" y="406" width="300" height="44" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="210" y="125">1. Anycast edge network</text>
      <text x="210" y="185">2. IP reputation and geo</text>
      <text x="210" y="245">3. WAF rules</text>
      <text x="210" y="305">4. Rate-based rules</text>
      <text x="210" y="365">5. Bot management</text>
      <text x="210" y="425">6. Edge cache</text>
    </g>
    <g font-size="11" fill="#463365">
      <text x="210" y="141">absorbs volumetric floods</text>
      <text x="210" y="201">managed IP lists</text>
      <text x="210" y="261">managed rule groups, OWASP CRS</text>
      <text x="210" y="321">per IP, per path, or per key</text>
      <text x="210" y="381">scores and challenges</text>
      <text x="210" y="441">static and cacheable responses</text>
    </g>

    <rect x="60" y="468" width="300" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="210" y="487" font-size="12.5" font-weight="700" fill="#263e5a">Origin: TaskFlow API</text>
    <text x="210" y="503" font-size="11" fill="#263e5a">accepts traffic from the edge only</text>

    <g fill="none" stroke="#40566b" stroke-linecap="butt">
      <path d="M210 84V104" stroke-width="12"/>
      <path d="M210 150V164" stroke-width="10"/>
      <path d="M210 210V224" stroke-width="8"/>
      <path d="M210 270V284" stroke-width="6"/>
      <path d="M210 330V344" stroke-width="5"/>
      <path d="M210 390V404" stroke-width="4"/>
    </g>
    <path d="M210 450V466" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#erp-arrow)"/>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="420" y="112" width="340" height="32" rx="16"/>
      <rect x="420" y="172" width="340" height="32" rx="16"/>
      <rect x="420" y="232" width="340" height="32" rx="16"/>
      <rect x="420" y="292" width="340" height="32" rx="16"/>
    </g>
    <g font-size="11.5" fill="#6e2a24">
      <text x="590" y="132">dropped: SYN floods, UDP amplification</text>
      <text x="590" y="192">blocked: known-bad and anonymizer IPs</text>
      <text x="590" y="252">blocked: injection and exploit payloads</text>
      <text x="590" y="312">limited: floods, password guessing</text>
    </g>
    <rect x="420" y="352" width="340" height="32" rx="16" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="590" y="372" font-size="11.5" fill="#66400f">challenged: scripts, headless browsers</text>
    <rect x="420" y="412" width="340" height="32" rx="16" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="590" y="432" font-size="11.5" fill="#294a2e">served from the edge: no origin load</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M360 128H418" marker-end="url(#erp-arrow)"/>
      <path d="M360 188H418" marker-end="url(#erp-arrow)"/>
      <path d="M360 248H418" marker-end="url(#erp-arrow)"/>
      <path d="M360 308H418" marker-end="url(#erp-arrow)"/>
      <path d="M360 368H418" marker-end="url(#erp-arrow)"/>
      <path d="M360 428H418" marker-end="url(#erp-arrow)"/>
    </g>

    <text x="400" y="540" font-size="13" fill="#40566b">Each layer removes one class of bad traffic, so the origin sees a fraction of it.</text>
  </g>
</svg>
