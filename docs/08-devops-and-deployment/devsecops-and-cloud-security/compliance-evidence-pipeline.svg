<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="cep-title cep-desc">
  <title id="cep-title">Turning controls into continuously collected audit evidence</title>
  <desc id="cep-desc">Four controls are each backed by an automated source of evidence. Changes are reviewed, mapped to ISO/IEC 27001 control A.8.32 and SOC 2 CC8.1, is evidenced by Git and CI records of pull request approvals and pipeline runs. Data is encrypted, mapped to ISO A.8.24 and PCI DSS requirements 3 and 4, is evidenced by policy as code: plan checks and cloud configuration rules. Access is reviewed, mapped to ISO A.5.18 and PCI DSS 7.2.4, is evidenced by identity provider exports and review tickets. Activity is logged, mapped to ISO A.8.15 and PCI DSS requirement 10, is evidenced by audit logs delivered to a locked bucket. All four sources feed an evidence store that is append-only, timestamped, and mapped to controls. During an audit, such as a SOC 2 Type 2 period or an ISO surveillance audit, the auditor samples this evidence instead of the team assembling screenshots.</desc>
  <defs>
    <marker id="cep-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="125" y="34">Control (the promise)</text>
      <text x="425" y="34">Automated evidence source</text>
      <text x="730" y="34">Evidence and audit</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="20" y="50" width="210" height="56" rx="8"/>
      <rect x="20" y="124" width="210" height="56" rx="8"/>
      <rect x="20" y="198" width="210" height="56" rx="8"/>
      <rect x="20" y="272" width="210" height="56" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="125" y="73">Changes are reviewed</text>
      <text x="125" y="147">Data is encrypted</text>
      <text x="125" y="221">Access is reviewed</text>
      <text x="125" y="295">Activity is logged</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="125" y="92">ISO A.8.32, SOC 2 CC8.1</text>
      <text x="125" y="166">ISO A.8.24, PCI DSS 3 and 4</text>
      <text x="125" y="240">ISO A.5.18, PCI DSS 7.2.4</text>
      <text x="125" y="314">ISO A.8.15, PCI DSS 10</text>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="320" y="50" width="210" height="56" rx="8"/>
      <rect x="320" y="124" width="210" height="56" rx="8"/>
      <rect x="320" y="198" width="210" height="56" rx="8"/>
      <rect x="320" y="272" width="210" height="56" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#463365">
      <text x="425" y="73">Git and CI</text>
      <text x="425" y="147">Policy as code</text>
      <text x="425" y="221">Identity provider</text>
      <text x="425" y="295">Cloud audit logs</text>
    </g>
    <g font-size="11" fill="#463365">
      <text x="425" y="92">PR approvals, pipeline runs</text>
      <text x="425" y="166">plan checks, Config rules</text>
      <text x="425" y="240">access exports, review tickets</text>
      <text x="425" y="314">CloudTrail to a locked bucket</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M230 78H318" marker-end="url(#cep-arrow)"/>
      <path d="M230 152H318" marker-end="url(#cep-arrow)"/>
      <path d="M230 226H318" marker-end="url(#cep-arrow)"/>
      <path d="M230 300H318" marker-end="url(#cep-arrow)"/>
      <path d="M530 78 618 162" marker-end="url(#cep-arrow)"/>
      <path d="M530 152 618 178" marker-end="url(#cep-arrow)"/>
      <path d="M530 226 618 194" marker-end="url(#cep-arrow)"/>
      <path d="M530 300 618 210" marker-end="url(#cep-arrow)"/>
      <path d="M730 238V270" marker-end="url(#cep-arrow)"/>
    </g>
    <text x="274" y="70" font-size="11" font-style="italic" fill="#40566b">shown by</text>

    <rect x="620" y="140" width="220" height="98" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="730" y="166" font-size="14" font-weight="700" fill="#263e5a">Evidence store</text>
    <text x="730" y="187" font-size="11.5" fill="#263e5a">append-only, timestamped</text>
    <text x="730" y="205" font-size="11.5" fill="#263e5a">mapped to controls</text>
    <text x="730" y="223" font-size="11.5" fill="#263e5a">kept for the audit period</text>

    <rect x="620" y="272" width="220" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="730" y="295" font-size="13" font-weight="700" fill="#294a2e">Auditor samples it</text>
    <text x="730" y="314" font-size="11" fill="#294a2e">SOC 2 Type 2, ISO surveillance</text>

    <rect x="20" y="350" width="820" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="430" y="372" font-size="12" fill="#463365">Every change produces its own evidence, so audit week is an export, not a scramble for screenshots.</text>

    <text x="430" y="406" font-size="13" fill="#40566b">Controls are promises; automated, timestamped evidence is what proves them over time.</text>
  </g>
</svg>
