<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="rng-title rng-desc">
  <title id="rng-title">Ring-based release from the team outward to everyone</title>
  <desc id="rng-desc">Four concentric rings. Ring 0 at the center is the owning team and test tenants, a tiny share of traffic, baked for about an hour. Ring 1 is all employees using the product for real work, baked for about a day. Ring 2 is opted-in beta customers and one small region, about 10 percent of users, baked for about a day including a peak period. Ring 3 is everyone. A release is promoted outward one ring at a time only while health checks pass. If any ring fails its checks, the release halts and rolls back, and the outer rings never receive it.</desc>
  <defs>
    <marker id="rng-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="220" cy="205" r="180" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <circle cx="220" cy="205" r="135" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <circle cx="220" cy="205" r="92" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <circle cx="220" cy="205" r="50" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="203" font-size="14" font-weight="700" fill="#66400f">Ring 0</text>
    <text x="220" y="220" font-size="11.5" fill="#66400f">team</text>
    <text x="220" y="137" font-size="12" font-weight="700" fill="#463365">Ring 1: staff</text>
    <text x="220" y="94" font-size="12" font-weight="700" fill="#263e5a">Ring 2: beta</text>
    <text x="220" y="52" font-size="12" font-weight="700" fill="#294a2e">Ring 3: everyone</text>
    <path d="M220 257V344" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rng-arrow)"/>
    <text x="220" y="368" font-size="11.5" font-style="italic" fill="#294a2e">promote outward</text>

    <rect x="450" y="30" width="390" height="66" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="645" y="52" font-size="13" font-weight="700" fill="#66400f">Ring 0: the owning team, test tenants</text>
    <text x="645" y="70" font-size="11.5" fill="#66400f">catches obvious breakage before any customer</text>
    <text x="645" y="86" font-size="11" font-style="italic" fill="#66400f">bake about 1 hour</text>
    <rect x="450" y="106" width="390" height="66" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="645" y="128" font-size="13" font-weight="700" fill="#463365">Ring 1: all employees (dogfood)</text>
    <text x="645" y="146" font-size="11.5" fill="#463365">real workflows, real data patterns</text>
    <text x="645" y="162" font-size="11" font-style="italic" fill="#463365">bake about 1 day</text>
    <rect x="450" y="182" width="390" height="66" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="645" y="204" font-size="13" font-weight="700" fill="#263e5a">Ring 2: beta customers, one small region</text>
    <text x="645" y="222" font-size="11.5" fill="#263e5a">about 10% of users, diverse data and devices</text>
    <text x="645" y="238" font-size="11" font-style="italic" fill="#263e5a">bake about 1 day, including a peak</text>
    <rect x="450" y="258" width="390" height="66" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="645" y="280" font-size="13" font-weight="700" fill="#294a2e">Ring 3: everyone</text>
    <text x="645" y="298" font-size="11.5" fill="#294a2e">the remaining users and regions</text>
    <text x="645" y="314" font-size="11" font-style="italic" fill="#294a2e">monitor; keep the previous version ready</text>

    <rect x="450" y="338" width="390" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="645" y="357" font-size="12" font-weight="700" fill="#6e2a24">Any ring fails its checks: halt and roll back</text>
    <text x="645" y="374" font-size="11.5" fill="#6e2a24">outer rings never receive the release</text>

    <text x="430" y="414" font-size="13" fill="#40566b">Each ring is bigger and less tolerant of risk; a release earns each ring by surviving the one inside it.</text>
  </g>
</svg>
