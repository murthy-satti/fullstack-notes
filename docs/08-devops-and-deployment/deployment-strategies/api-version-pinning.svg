<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-labelledby="avp-title avp-desc">
  <title id="avp-title">Pinned API versions served from one codebase</title>
  <desc id="avp-desc">Three clients call the same API, each pinned to a dated version through a header or an account setting: the web app uses the latest version 2026-11-01, a mobile app release is pinned to 2025-03-15, and a partner integration is pinned to 2024-06-01. The core handler always builds the response in the latest shape and returns it directly to the web app. For older versions, the response passes through version change modules in reverse order: the first undoes the 2026-11-01 change by mapping the new blocked status back to open, giving the 2025-03-15 shape for the mobile app; the second undoes the 2025-03-15 change by turning the due object back into a dueDate string, giving the 2024-06-01 shape for the partner. Usage of each version is tracked so old versions can be retired after notice.</desc>
  <defs>
    <marker id="avp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="avp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="320" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Clients and their pinned version</text>
    <text x="440" y="30" font-size="13" font-weight="700" fill="#40566b">One API codebase</text>

    <rect x="20" y="50" width="190" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="115" y="71" font-size="14" font-weight="700" fill="#66400f">Web app</text>
    <text x="115" y="89" font-size="11.5" fill="#66400f">latest: 2026-11-01</text>
    <rect x="20" y="130" width="190" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="115" y="151" font-size="14" font-weight="700" fill="#66400f">Mobile app 3.2</text>
    <text x="115" y="169" font-size="11.5" fill="#66400f">pinned: 2025-03-15</text>
    <rect x="20" y="210" width="190" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="115" y="231" font-size="14" font-weight="700" fill="#66400f">Partner integration</text>
    <text x="115" y="249" font-size="11.5" fill="#66400f">pinned: 2024-06-01</text>

    <rect x="330" y="50" width="220" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="71" font-size="14" font-weight="700" fill="#263e5a">Core handler</text>
    <text x="440" y="89" font-size="11.5" fill="#263e5a">builds the latest shape only</text>
    <rect x="330" y="130" width="220" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="440" y="151" font-size="13" font-weight="700" fill="#463365">Undo 2026-11-01 change</text>
    <text x="440" y="169" font-size="11.5" fill="#463365">status "blocked" becomes "open"</text>
    <rect x="330" y="210" width="220" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="440" y="231" font-size="13" font-weight="700" fill="#463365">Undo 2025-03-15 change</text>
    <text x="440" y="249" font-size="11.5" fill="#463365">due object back to dueDate</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M440 100V128" marker-end="url(#avp-arrow)"/>
      <path d="M440 180V208" marker-end="url(#avp-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M330 75H212" marker-end="url(#avp-arrow-ret)"/>
      <path d="M330 155H212" marker-end="url(#avp-arrow-ret)"/>
      <path d="M330 235H212" marker-end="url(#avp-arrow-ret)"/>
    </g>
    <g font-size="11" fill="#36424e">
      <rect x="236" y="56" width="72" height="13" fill="#f5f7fb"/>
      <text x="272" y="66">2026-11-01</text>
      <rect x="236" y="136" width="72" height="13" fill="#f5f7fb"/>
      <text x="272" y="146">2025-03-15</text>
      <rect x="236" y="216" width="72" height="13" fill="#f5f7fb"/>
      <text x="272" y="226">2024-06-01</text>
    </g>

    <rect x="600" y="90" width="240" height="130" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="720" y="114" font-size="14" font-weight="700" fill="#294a2e">Why it works</text>
    <g font-size="11.5" fill="#294a2e">
      <text x="720" y="138">old clients never break</text>
      <text x="720" y="158">new code knows one shape</text>
      <text x="720" y="178">usage tracked per version</text>
      <text x="720" y="198">old versions retired on notice</text>
    </g>

    <text x="430" y="300" font-size="13" fill="#40566b">Each release adds one backward transform; clients upgrade on their own schedule.</text>
  </g>
</svg>
