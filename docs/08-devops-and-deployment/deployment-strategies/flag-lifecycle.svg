<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="flc-title flc-desc">
  <title id="flc-title">Lifecycle of a release flag</title>
  <desc id="flc-desc">A release flag moves through six stages. 1, created: the flag exists and is off, and the guarded code is merged and deployed dark. 2, testing: the flag is on for staff and test accounts. 3, rolling out: the share grows from 1 percent to 100 percent. If a problem is found while testing or rolling out, the flag is switched off in seconds without a deploy, returning to the off state. 4, fully on: 100 percent for about a week while the old path is no longer used. 5, code cleanup: a pull request removes the flag checks and the old code path. 6, archived: the flag is deleted from the flag service. Skipping step 5 is how flag debt builds up. A release flag should live days to weeks; operational kill switches and permission flags are long-lived by design and never reach step 5.</desc>
  <defs>
    <marker id="flc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="flc-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="18" y="50" width="124" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="80" y="74" font-size="14" font-weight="700" fill="#66400f">1. Created</text>
    <text x="80" y="93" font-size="11.5" fill="#66400f">off, code merged</text>
    <rect x="158" y="50" width="124" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="220" y="74" font-size="14" font-weight="700" fill="#463365">2. Testing</text>
    <text x="220" y="93" font-size="11.5" fill="#463365">on for staff</text>
    <rect x="298" y="50" width="124" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="360" y="74" font-size="14" font-weight="700" fill="#263e5a">3. Rolling out</text>
    <text x="360" y="93" font-size="11.5" fill="#263e5a">1% to 100%</text>
    <rect x="438" y="50" width="124" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="500" y="74" font-size="14" font-weight="700" fill="#294a2e">4. Fully on</text>
    <text x="500" y="93" font-size="11.5" fill="#294a2e">100% for a week</text>
    <rect x="578" y="50" width="124" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="640" y="74" font-size="14" font-weight="700" fill="#66400f">5. Cleanup</text>
    <text x="640" y="93" font-size="11.5" fill="#66400f">remove checks</text>
    <rect x="718" y="50" width="124" height="60" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="780" y="74" font-size="14" font-weight="700" fill="#36424e">6. Archived</text>
    <text x="780" y="93" font-size="11.5" fill="#36424e">flag deleted</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M142 80H156" marker-end="url(#flc-arrow)"/>
      <path d="M282 80H296" marker-end="url(#flc-arrow)"/>
      <path d="M422 80H436" marker-end="url(#flc-arrow)"/>
      <path d="M562 80H576" marker-end="url(#flc-arrow)"/>
      <path d="M702 80H716" marker-end="url(#flc-arrow)"/>
    </g>

    <path d="M360 110V150H80V112" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#flc-arrow-red)"/>
    <path d="M220 110V150" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="106" y="143" width="228" height="14" fill="#f5f7fb"/>
    <text x="220" y="154" font-size="11.5" fill="#6e2a24">problem: switch off in seconds, no deploy</text>

    <path d="M500 126H640" fill="none" stroke="#b5524b" stroke-width="1.5"/>
    <path d="M500 120V132M640 120V132" fill="none" stroke="#b5524b" stroke-width="1.5"/>
    <text x="570" y="150" font-size="11.5" font-weight="700" fill="#6e2a24">skipped here = flag debt</text>

    <path d="M18 200H702" fill="none" stroke="#53845b" stroke-width="2"/>
    <path d="M18 194V206M702 194V206" fill="none" stroke="#53845b" stroke-width="2"/>
    <text x="360" y="222" font-size="12" font-weight="700" fill="#294a2e">release flag: days to weeks from step 1 to step 5</text>

    <rect x="18" y="242" width="824" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="430" y="262" font-size="12" font-weight="700" fill="#463365">Kill switches and permission flags are long-lived by design and never reach step 5,</text>
    <text x="430" y="278" font-size="11.5" fill="#463365">but they still need an owner and a review date.</text>

    <text x="430" y="314" font-size="13" fill="#40566b">A release flag is finished only when its code is deleted, not when it reaches 100%.</text>
  </g>
</svg>
