<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="eld-title eld-desc">
  <title id="eld-title">Promoting one artifact through an environment ladder with gates</title>
  <desc id="eld-desc">CI builds the TaskFlow API image once from commit 9f3e1c2 and pushes it to a registry, where it is identified by its digest. The same image digest is deployed to every environment. Development receives it automatically on merge. A gate requiring integration tests to pass promotes it to Test, which runs automated end-to-end tests. A gate requiring end-to-end tests and QA sign-off promotes it to Staging, a production-like environment. A gate requiring an approval and passing smoke tests promotes it to Production, which serves real users. Below each environment, its own configuration and secrets are injected at deploy time: a development database, seeded fixtures for test, large synthetic data for staging, and real user data only in production.</desc>
  <defs>
    <marker id="eld-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="eld-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="160" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="100" y="40" font-size="14" font-weight="700" fill="#66400f">CI: build once</text>
    <text x="100" y="57" font-size="11.5" fill="#66400f">commit 9f3e1c2</text>
    <rect x="320" y="20" width="220" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="40" font-size="14" font-weight="700" fill="#463365">Registry</text>
    <text x="430" y="57" font-size="11.5" fill="#463365">taskflow-api@sha256:4f2c...</text>
    <path d="M180 43H318" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#eld-arrow)"/>
    <rect x="212" y="30" width="76" height="14" fill="#f5f7fb"/>
    <text x="250" y="41" font-size="11.5" fill="#36424e">push image</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round">
      <path d="M430 66V92"/>
      <path d="M90 92H750"/>
      <path d="M90 92V118" marker-end="url(#eld-arrow)"/>
      <path d="M310 92V118" marker-end="url(#eld-arrow)"/>
      <path d="M530 92V118" marker-end="url(#eld-arrow)"/>
      <path d="M750 92V118" marker-end="url(#eld-arrow)"/>
    </g>
    <rect x="580" y="74" width="196" height="14" fill="#f5f7fb"/>
    <text x="678" y="85" font-size="11.5" font-style="italic" fill="#40566b">same image digest everywhere</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="20" y="120" width="140" height="56" rx="8"/>
      <rect x="240" y="120" width="140" height="56" rx="8"/>
      <rect x="460" y="120" width="140" height="56" rx="8"/>
      <rect x="680" y="120" width="140" height="56" rx="8" stroke-width="3"/>
    </g>
    <g font-size="14" font-weight="700" fill="#263e5a">
      <text x="90" y="144">Development</text>
      <text x="310" y="144">Test</text>
      <text x="530" y="144">Staging</text>
      <text x="750" y="144">Production</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="90" y="162">auto on merge</text>
      <text x="310" y="162">automated e2e</text>
      <text x="530" y="162">production-like</text>
      <text x="750" y="162">real users</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M160 148H238" marker-end="url(#eld-arrow)"/>
      <path d="M380 148H458" marker-end="url(#eld-arrow)"/>
      <path d="M600 148H678" marker-end="url(#eld-arrow)"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <path d="M200 140 208 148 200 156 192 148z"/>
      <path d="M420 140 428 148 420 156 412 148z"/>
      <path d="M640 140 648 148 640 156 632 148z"/>
    </g>
    <g font-size="11" font-weight="700" fill="#294a2e">
      <text x="200" y="194">integration</text>
      <text x="200" y="208">tests pass</text>
      <text x="420" y="194">e2e + QA</text>
      <text x="420" y="208">sign-off</text>
      <text x="640" y="194">approval +</text>
      <text x="640" y="208">smoke OK</text>
    </g>

    <g fill="none" stroke="#60788d" stroke-width="1.8" stroke-dasharray="5 4">
      <path d="M90 232V180" marker-end="url(#eld-arrow-ret)"/>
      <path d="M310 232V180" marker-end="url(#eld-arrow-ret)"/>
      <path d="M530 232V180" marker-end="url(#eld-arrow-ret)"/>
      <path d="M750 232V180" marker-end="url(#eld-arrow-ret)"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="20" y="234" width="140" height="52" rx="8"/>
      <rect x="240" y="234" width="140" height="52" rx="8"/>
      <rect x="460" y="234" width="140" height="52" rx="8"/>
      <rect x="680" y="234" width="140" height="52" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="90" y="256">dev config</text>
      <text x="310" y="256">test config</text>
      <text x="530" y="256">staging config</text>
      <text x="750" y="256">prod config</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="90" y="274">local database</text>
      <text x="310" y="274">seeded fixtures</text>
      <text x="530" y="274">large synthetic data</text>
      <text x="750" y="274">real data, own secrets</text>
    </g>
    <text x="430" y="314" font-size="11.5" font-style="italic" fill="#40566b">configuration and secrets are injected per environment at deploy time</text>

    <text x="430" y="350" font-size="13" fill="#40566b">Promotion moves the same artifact up the ladder; only configuration changes between rungs.</text>
  </g>
</svg>
