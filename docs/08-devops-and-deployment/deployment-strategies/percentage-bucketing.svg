<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="pbk-title pbk-desc">
  <title id="pbk-title">Stable percentage bucketing for a feature flag rollout</title>
  <desc id="pbk-desc">The flag key and user ID are joined as new-task-board:user-16 and hashed with SHA-256. The first 4 bytes, 0x3aa3e84c, are the number 983,820,364, and modulo 10,000 gives bucket 364. Four users have buckets 364 (user-16), 1828 (user-1), 3028 (user-512), and 5569 (user-17) on a line from 0 to 9,999. At a 10 percent rollout, buckets below 1,000 are on, so only user-16 is in. At 25 percent, buckets below 2,500 are on, adding user-1. At 50 percent, buckets below 5,000 are on, adding user-512, while user-17 is still out. Raising the percentage only adds users, because each user's bucket never changes.</desc>
  <defs>
    <marker id="pbk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="24" width="190" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="115" y="45" font-size="13" font-weight="700" fill="#66400f">flag key + user ID</text>
    <text x="115" y="63" font-size="11.5" fill="#66400f">new-task-board:user-16</text>
    <rect x="240" y="24" width="110" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="295" y="54" font-size="14" font-weight="700" fill="#463365">SHA-256</text>
    <rect x="380" y="24" width="200" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="480" y="45" font-size="13" font-weight="700" fill="#463365">first 4 bytes</text>
    <text x="480" y="63" font-size="11.5" fill="#463365">0x3aa3e84c = 983,820,364</text>
    <rect x="610" y="24" width="130" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="675" y="45" font-size="13" font-weight="700" fill="#263e5a">mod 10,000</text>
    <text x="675" y="63" font-size="11.5" fill="#263e5a">bucket 364</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M210 49H238" marker-end="url(#pbk-arrow)"/>
      <path d="M350 49H378" marker-end="url(#pbk-arrow)"/>
      <path d="M580 49H608" marker-end="url(#pbk-arrow)"/>
    </g>

    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="146" y="104">user-16</text>
      <text x="248" y="104">user-1</text>
      <text x="332" y="104">user-512</text>
      <text x="510" y="104">user-17</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="146" y="117">364</text>
      <text x="248" y="117">1828</text>
      <text x="332" y="117">3028</text>
      <text x="510" y="117">5569</text>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="20" y="146">rollout 10%</text>
      <text x="20" y="190">rollout 25%</text>
      <text x="20" y="234">rollout 50%</text>
    </g>
    <g fill="#ffffff" stroke="#8a96a3" stroke-width="1.5">
      <rect x="120" y="128" width="700" height="26" rx="4"/>
      <rect x="120" y="172" width="700" height="26" rx="4"/>
      <rect x="120" y="216" width="700" height="26" rx="4"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="120" y="128" width="70" height="26" rx="4"/>
      <rect x="120" y="172" width="175" height="26" rx="4"/>
      <rect x="120" y="216" width="350" height="26" rx="4"/>
    </g>
    <g stroke-width="1.5">
      <circle cx="146" cy="141" r="6" fill="#53845b" stroke="#294a2e"/>
      <circle cx="248" cy="141" r="6" fill="#ffffff" stroke="#8a96a3"/>
      <circle cx="332" cy="141" r="6" fill="#ffffff" stroke="#8a96a3"/>
      <circle cx="510" cy="141" r="6" fill="#ffffff" stroke="#8a96a3"/>
      <circle cx="146" cy="185" r="6" fill="#53845b" stroke="#294a2e"/>
      <circle cx="248" cy="185" r="6" fill="#53845b" stroke="#294a2e"/>
      <circle cx="332" cy="185" r="6" fill="#ffffff" stroke="#8a96a3"/>
      <circle cx="510" cy="185" r="6" fill="#ffffff" stroke="#8a96a3"/>
      <circle cx="146" cy="229" r="6" fill="#53845b" stroke="#294a2e"/>
      <circle cx="248" cy="229" r="6" fill="#53845b" stroke="#294a2e"/>
      <circle cx="332" cy="229" r="6" fill="#53845b" stroke="#294a2e"/>
      <circle cx="510" cy="229" r="6" fill="#ffffff" stroke="#8a96a3"/>
    </g>
    <g font-size="11" fill="#294a2e" text-anchor="start">
      <text x="600" y="145">on: bucket below 1,000</text>
      <text x="600" y="189">on: bucket below 2,500</text>
      <text x="600" y="233">on: bucket below 5,000</text>
    </g>

    <path d="M120 262H820" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M120 258V266"/>
      <path d="M295 258V266"/>
      <path d="M470 258V266"/>
      <path d="M645 258V266"/>
      <path d="M820 258V266"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="120" y="280">0</text>
      <text x="295" y="280">2,500</text>
      <text x="470" y="280">5,000</text>
      <text x="645" y="280">7,500</text>
      <text x="820" y="280">9,999</text>
    </g>

    <text x="430" y="318" font-size="13" fill="#40566b">Raising the percentage only adds users: a user's bucket never changes, so nobody flips back to off.</text>
  </g>
</svg>
