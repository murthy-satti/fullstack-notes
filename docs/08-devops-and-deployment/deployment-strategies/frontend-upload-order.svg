<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="fuo-title fuo-desc">
  <title id="fuo-title">Upload order for a static frontend deploy: safe compared with wrong</title>
  <desc id="fuo-desc">Safe order: first upload the new content-hashed assets such as assets/index-B7x9.js with a one-year immutable cache header; they have new names, so nothing old is overwritten. Second, upload index.html last with Cache-Control no-cache. Third, invalidate only /index.html at the CDN. Result: every page load works, and browser tabs still running the old version can still load their old assets. Wrong order: uploading index.html first makes it reference index-B7x9.js before that file exists, so the script returns 404 and users see a blank page; deleting old assets in the same step makes open tabs fail when they lazy-load chunks. The site stays broken until uploads and caches catch up.</desc>
  <defs>
    <marker id="fuo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="215" y="36" font-size="14" font-weight="700" fill="#294a2e">Safe order</text>
    <text x="645" y="36" font-size="14" font-weight="700" fill="#6e2a24">Wrong order</text>
    <path d="M430 20V360" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="20" y="56" width="390" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="215" y="79" font-size="14" font-weight="700" fill="#263e5a">1. Upload new hashed assets</text>
    <text x="215" y="98" font-size="11.5" fill="#263e5a">assets/index-B7x9.js, max-age=31536000, immutable</text>
    <rect x="20" y="136" width="390" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="215" y="159" font-size="14" font-weight="700" fill="#263e5a">2. Upload index.html last</text>
    <text x="215" y="178" font-size="11.5" fill="#263e5a">Cache-Control: no-cache</text>
    <rect x="20" y="216" width="390" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="215" y="239" font-size="14" font-weight="700" fill="#463365">3. Invalidate /index.html at the CDN</text>
    <text x="215" y="258" font-size="11.5" fill="#463365">hashed assets never need invalidating</text>
    <rect x="20" y="296" width="390" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="215" y="319" font-size="14" font-weight="700" fill="#294a2e">Every page load works</text>
    <text x="215" y="338" font-size="11.5" fill="#294a2e">old tabs still find their old assets, kept for days</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M215 114V134" marker-end="url(#fuo-arrow)"/>
      <path d="M215 194V214" marker-end="url(#fuo-arrow)"/>
      <path d="M215 274V294" marker-end="url(#fuo-arrow)"/>
    </g>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="2">
      <rect x="450" y="56" width="390" height="58" rx="8"/>
      <rect x="450" y="136" width="390" height="58" rx="8"/>
      <rect x="450" y="216" width="390" height="58" rx="8"/>
      <rect x="450" y="296" width="390" height="58" rx="8" stroke-width="3"/>
    </g>
    <g fill="#6e2a24">
      <text x="645" y="79" font-size="14" font-weight="700">1. Upload index.html first</text>
      <text x="645" y="98" font-size="11.5">it already points to index-B7x9.js</text>
      <text x="645" y="159" font-size="14" font-weight="700">2. That asset is not there yet</text>
      <text x="645" y="178" font-size="11.5">the script returns 404: a blank page</text>
      <text x="645" y="239" font-size="14" font-weight="700">3. Sync with --delete</text>
      <text x="645" y="258" font-size="11.5">open tabs fail to lazy-load their old chunks</text>
      <text x="645" y="319" font-size="14" font-weight="700">Broken for minutes or hours</text>
      <text x="645" y="338" font-size="11.5">until uploads finish and caches expire</text>
    </g>
    <g fill="none" stroke="#b5524b" stroke-width="2">
      <path d="M645 114V134" marker-end="url(#fuo-arrow)"/>
      <path d="M645 194V214" marker-end="url(#fuo-arrow)"/>
      <path d="M645 274V294" marker-end="url(#fuo-arrow)"/>
    </g>

    <text x="430" y="396" font-size="13" fill="#40566b">New files first, the entry point last, old files later: then no visitor ever sees a half-deployed site.</text>
  </g>
</svg>
