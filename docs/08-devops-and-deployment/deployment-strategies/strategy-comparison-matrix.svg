<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="scm-title scm-desc">
  <title id="scm-title">Four deployment strategies compared on five properties</title>
  <desc id="scm-desc">A matrix rates four strategies. Recreate: has downtime, no extra cost, slow rollback by redeploying, every user is exposed at once, lowest complexity. Rolling: no downtime, a small surge of extra capacity, medium rollback speed because the old version must be rolled back in, risk exposure that grows with each batch, low complexity. Blue-green: no downtime, double capacity during the deploy, instant rollback by switching back, every user is exposed at the switch, medium complexity. Canary: no downtime, small extra cost, fast rollback by setting the canary weight to 0 percent, a small share of users exposed first, high complexity because it needs metrics analysis. Green cells are favorable, amber cells are moderate, red cells are unfavorable.</desc>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Pattern chooser at a glance</text>
    <g font-size="12.5" font-weight="700" fill="#40566b">
      <text x="230" y="70">Downtime</text>
      <text x="364" y="70">Extra cost</text>
      <text x="498" y="70">Rollback speed</text>
      <text x="632" y="70">Risk exposure</text>
      <text x="766" y="70">Complexity</text>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="20" y="90" width="140" height="44" rx="8"/>
      <rect x="20" y="140" width="140" height="44" rx="8"/>
      <rect x="20" y="190" width="140" height="44" rx="8"/>
      <rect x="20" y="240" width="140" height="44" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="90" y="117">Recreate</text>
      <text x="90" y="167">Rolling</text>
      <text x="90" y="217">Blue-green</text>
      <text x="90" y="267">Canary</text>
    </g>

    <g stroke-width="1.5">
      <rect x="166" y="90" width="128" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="300" y="90" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="434" y="90" width="128" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="568" y="90" width="128" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="702" y="90" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="166" y="140" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="300" y="140" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="434" y="140" width="128" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="568" y="140" width="128" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="702" y="140" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="166" y="190" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="300" y="190" width="128" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="434" y="190" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="568" y="190" width="128" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="702" y="190" width="128" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>

      <rect x="166" y="240" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="300" y="240" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="434" y="240" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="568" y="240" width="128" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="702" y="240" width="128" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>

    <g font-size="11.5" font-weight="700">
      <text x="230" y="116" fill="#6e2a24">yes</text>
      <text x="364" y="116" fill="#294a2e">none</text>
      <text x="498" y="116" fill="#6e2a24">slow: redeploy</text>
      <text x="632" y="116" fill="#6e2a24">everyone</text>
      <text x="766" y="116" fill="#294a2e">lowest</text>

      <text x="230" y="166" fill="#294a2e">none</text>
      <text x="364" y="166" fill="#294a2e">small surge</text>
      <text x="498" y="166" fill="#66400f">medium: re-roll</text>
      <text x="632" y="166" fill="#66400f">grows per batch</text>
      <text x="766" y="166" fill="#294a2e">low</text>

      <text x="230" y="216" fill="#294a2e">none</text>
      <text x="364" y="216" fill="#6e2a24">double capacity</text>
      <text x="498" y="216" fill="#294a2e">instant switch</text>
      <text x="632" y="216" fill="#6e2a24">all at switch</text>
      <text x="766" y="216" fill="#66400f">medium</text>

      <text x="230" y="266" fill="#294a2e">none</text>
      <text x="364" y="266" fill="#294a2e">small</text>
      <text x="498" y="266" fill="#294a2e">fast: weight 0%</text>
      <text x="632" y="266" fill="#294a2e">small at first</text>
      <text x="766" y="266" fill="#6e2a24">high: metrics</text>
    </g>

    <rect x="250" y="302" width="14" height="14" rx="3" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="272" y="314" font-size="11.5" fill="#36424e" text-anchor="start">favorable</text>
    <rect x="370" y="302" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="392" y="314" font-size="11.5" fill="#36424e" text-anchor="start">moderate</text>
    <rect x="490" y="302" width="14" height="14" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="512" y="314" font-size="11.5" fill="#36424e" text-anchor="start">unfavorable</text>

    <text x="430" y="344" font-size="13" fill="#40566b">No strategy wins every column: you trade cost and complexity for safety and speed of rollback.</text>
  </g>
</svg>
