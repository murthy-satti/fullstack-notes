<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="rub-title rub-desc">
  <title id="rub-title">A rolling update with maxSurge 1 and maxUnavailable 0</title>
  <desc id="rub-desc">A Deployment has 4 replicas with maxSurge 1 and maxUnavailable 0. At the start, four v1 pods are ready. First, one extra v2 pod starts as surge, so five pods run but four are ready. When the v2 pod passes its readiness probe, one v1 pod starts draining and is removed, keeping four ready pods. The same happens for the next pods, so midway two v2 and two v1 pods are ready and both versions serve traffic at once. At the end, four v2 pods are ready. Capacity never drops below four ready pods.</desc>
  <rect width="860" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Deployment: replicas 4, maxSurge 1, maxUnavailable 0</text>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="20" y="82">start</text>
      <text x="20" y="128">surge: 1 new pod</text>
      <text x="20" y="174">new ready, old drains</text>
      <text x="20" y="220">repeat: half replaced</text>
      <text x="20" y="266">done</text>
    </g>

    <g stroke-width="1.5">
      <rect x="230" y="60" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="322" y="60" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="414" y="60" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="506" y="60" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="230" y="106" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="322" y="106" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="414" y="106" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="506" y="106" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="598" y="106" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-dasharray="5 4"/>

      <rect x="230" y="152" width="84" height="36" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-dasharray="5 4"/>
      <rect x="322" y="152" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="414" y="152" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="506" y="152" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="598" y="152" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="230" y="198" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="322" y="198" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="414" y="198" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="506" y="198" width="84" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="230" y="244" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="322" y="244" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="414" y="244" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="506" y="244" width="84" height="36" rx="6" fill="#e7f3e9" stroke="#53845b"/>
    </g>

    <g font-size="12" font-weight="700">
      <text x="272" y="76" fill="#263e5a">v1</text>
      <text x="364" y="76" fill="#263e5a">v1</text>
      <text x="456" y="76" fill="#263e5a">v1</text>
      <text x="548" y="76" fill="#263e5a">v1</text>
      <text x="272" y="122" fill="#263e5a">v1</text>
      <text x="364" y="122" fill="#263e5a">v1</text>
      <text x="456" y="122" fill="#263e5a">v1</text>
      <text x="548" y="122" fill="#263e5a">v1</text>
      <text x="640" y="122" fill="#294a2e">v2</text>
      <text x="272" y="168" fill="#6e2a24">v1</text>
      <text x="364" y="168" fill="#263e5a">v1</text>
      <text x="456" y="168" fill="#263e5a">v1</text>
      <text x="548" y="168" fill="#263e5a">v1</text>
      <text x="640" y="168" fill="#294a2e">v2</text>
      <text x="272" y="214" fill="#294a2e">v2</text>
      <text x="364" y="214" fill="#294a2e">v2</text>
      <text x="456" y="214" fill="#263e5a">v1</text>
      <text x="548" y="214" fill="#263e5a">v1</text>
      <text x="272" y="260" fill="#294a2e">v2</text>
      <text x="364" y="260" fill="#294a2e">v2</text>
      <text x="456" y="260" fill="#294a2e">v2</text>
      <text x="548" y="260" fill="#294a2e">v2</text>
    </g>
    <g font-size="11">
      <text x="272" y="90" fill="#263e5a">ready</text>
      <text x="364" y="90" fill="#263e5a">ready</text>
      <text x="456" y="90" fill="#263e5a">ready</text>
      <text x="548" y="90" fill="#263e5a">ready</text>
      <text x="272" y="136" fill="#263e5a">ready</text>
      <text x="364" y="136" fill="#263e5a">ready</text>
      <text x="456" y="136" fill="#263e5a">ready</text>
      <text x="548" y="136" fill="#263e5a">ready</text>
      <text x="640" y="136" fill="#294a2e">starting</text>
      <text x="272" y="182" fill="#6e2a24">draining</text>
      <text x="364" y="182" fill="#263e5a">ready</text>
      <text x="456" y="182" fill="#263e5a">ready</text>
      <text x="548" y="182" fill="#263e5a">ready</text>
      <text x="640" y="182" fill="#294a2e">ready</text>
      <text x="272" y="228" fill="#294a2e">ready</text>
      <text x="364" y="228" fill="#294a2e">ready</text>
      <text x="456" y="228" fill="#263e5a">ready</text>
      <text x="548" y="228" fill="#263e5a">ready</text>
      <text x="272" y="274" fill="#294a2e">ready</text>
      <text x="364" y="274" fill="#294a2e">ready</text>
      <text x="456" y="274" fill="#294a2e">ready</text>
      <text x="548" y="274" fill="#294a2e">ready</text>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="704" y="82">4 ready</text>
      <text x="704" y="128">4 ready, 5 running</text>
      <text x="704" y="174">4 ready</text>
      <text x="704" y="220">4 ready, 2 versions</text>
      <text x="704" y="266">4 ready</text>
    </g>

    <text x="430" y="330" font-size="13" fill="#40566b">Capacity never drops below 4 ready pods, but v1 and v2 serve side by side for the whole rollout.</text>
  </g>
</svg>
