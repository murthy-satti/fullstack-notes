<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490" role="img" aria-labelledby="cdh-title cdh-desc">
  <title id="cdh-title">A page load through a CDN with content-hashed assets</title>
  <desc id="cdh-desc">First visit after a deploy: 1, the browser requests index.html from the CDN edge. 2, the edge revalidates it with the origin bucket. 3, the origin returns the new HTML, which references index-B7x9.js. 4, the edge returns it to the browser with Cache-Control no-cache. 5, the browser requests assets/index-B7x9.js. 6, the edge misses because the file is new and fetches it from the origin once. 7, the origin returns it with max-age 31536000 and immutable. 8, the edge stores it and returns it, and the browser caches it too. Next visit: 9, the browser revalidates index.html. 10, it gets 304 Not Modified. 11, index-B7x9.js comes straight from the browser cache with no request at all.</desc>
  <defs>
    <marker id="cdh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cdh-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="490" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="20" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="130" y="47" font-size="14" font-weight="700" fill="#66400f">Browser</text>
    <rect x="360" y="20" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="39" font-size="14" font-weight="700" fill="#463365">CDN edge</text>
    <text x="430" y="55" font-size="11.5" fill="#463365">near the user</text>
    <rect x="660" y="20" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="730" y="39" font-size="14" font-weight="700" fill="#263e5a">Origin</text>
    <text x="730" y="55" font-size="11.5" fill="#263e5a">storage bucket</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M130 64V448"/>
      <path d="M430 64V448"/>
      <path d="M730 64V448"/>
    </g>

    <rect x="16" y="72" width="164" height="16" fill="#f5f7fb"/>
    <text x="20" y="84" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">First visit after a deploy</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M130 104H428" marker-end="url(#cdh-arrow)"/>
      <path d="M430 134H728" marker-end="url(#cdh-arrow)"/>
      <path d="M130 234H428" marker-end="url(#cdh-arrow)"/>
      <path d="M430 264H728" marker-end="url(#cdh-arrow)"/>
      <path d="M130 374H428" marker-end="url(#cdh-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M730 164H432" marker-end="url(#cdh-arrow-ret)"/>
      <path d="M430 194H132" marker-end="url(#cdh-arrow-ret)"/>
      <path d="M730 294H432" marker-end="url(#cdh-arrow-ret)"/>
      <path d="M430 324H132" marker-end="url(#cdh-arrow-ret)"/>
      <path d="M430 404H132" marker-end="url(#cdh-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <rect x="200" y="87" width="160" height="14" fill="#f5f7fb"/>
      <text x="280" y="98">1. GET /index.html</text>
      <rect x="480" y="117" width="200" height="14" fill="#f5f7fb"/>
      <text x="580" y="128">2. revalidate (If-None-Match)</text>
      <rect x="460" y="147" width="240" height="14" fill="#f5f7fb"/>
      <text x="580" y="158">3. 200: new HTML, refs index-B7x9.js</text>
      <rect x="180" y="177" width="200" height="14" fill="#f5f7fb"/>
      <text x="280" y="188">4. 200, Cache-Control: no-cache</text>
      <rect x="180" y="217" width="200" height="14" fill="#f5f7fb"/>
      <text x="280" y="228">5. GET /assets/index-B7x9.js</text>
      <rect x="500" y="247" width="160" height="14" fill="#f5f7fb"/>
      <text x="580" y="258">6. miss: fetch it once</text>
      <rect x="460" y="277" width="240" height="14" fill="#f5f7fb"/>
      <text x="580" y="288">7. 200, max-age=31536000, immutable</text>
      <rect x="150" y="307" width="260" height="14" fill="#f5f7fb"/>
      <text x="280" y="318">8. 200, now cached at edge and browser</text>
    </g>

    <path d="M20 344H840" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="20" y="362" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">Next visit</text>
    <g font-size="11.5" fill="#36424e">
      <rect x="180" y="357" width="200" height="14" fill="#f5f7fb"/>
      <text x="280" y="368">9. GET /index.html (revalidate)</text>
      <rect x="210" y="387" width="140" height="14" fill="#f5f7fb"/>
      <text x="280" y="398">10. 304 Not Modified</text>
    </g>
    <text x="142" y="436" font-size="11.5" font-style="italic" fill="#66400f" text-anchor="start">11. index-B7x9.js comes from the browser cache: no request at all</text>

    <text x="430" y="474" font-size="13" fill="#40566b">HTML is checked every time; hashed files are fetched once per version and then never again.</text>
  </g>
</svg>
