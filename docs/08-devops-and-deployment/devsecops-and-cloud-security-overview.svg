      <text x="742" y="328">audit logs, CVE SLAs</text>
    </g>

    <path d="M742 338V368H118V342" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dso-arrow-ret)"/>
    <rect x="222" y="360" width="416" height="16" fill="#f5f7fb"/>
    <text x="430" y="372" font-size="11.5" font-style="italic" fill="#40566b">findings, new CVEs, and incidents become tickets with SLAs</text>

    <text x="430" y="406" font-size="13" fill="#40566b">Controls at every stage catch problems early and limit the damage of anything that slips through.</text>
  </g>
</svg>
