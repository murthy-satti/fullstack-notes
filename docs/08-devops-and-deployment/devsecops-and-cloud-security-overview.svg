      <rect x="24" y="176" width="188" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="234" width="188" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="292" width="188" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="232" y="118" width="188" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
