    <rect x="24" y="52" width="188" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="118" y="73" font-size="14" font-weight="700" fill="#66400f">Code</text>
    <text x="118" y="90" font-size="11" fill="#66400f">laptop and pull request</text>
    <rect x="232" y="52" width="188" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="326" y="73" font-size="14" font-weight="700" fill="#463365">Build</text>
    <text x="326" y="90" font-size="11" fill="#463365">CI on main</text>
    <rect x="440" y="52" width="188" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="534" y="73" font-size="14" font-weight="700" fill="#263e5a">Deploy</text>
    <text x="534" y="90" font-size="11" fill="#263e5a">staging, then production</text>
    <rect x="648" y="52" width="188" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="742" y="73" font-size="14" font-weight="700" fill="#263e5a">Run</text>
    <text x="742" y="90" font-size="11" fill="#263e5a">live traffic and servers</text>

