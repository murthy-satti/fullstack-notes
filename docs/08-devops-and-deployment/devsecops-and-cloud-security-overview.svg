<svg xmlns="http://www.w3.org/2000/svg" width="860" height="424" viewBox="0 0 860 424" role="img" aria-labelledby="dso-title dso-desc">
  <title id="dso-title">Security controls placed along code, build, deploy, and run</title>
  <desc id="dso-desc">Four stages run left to right. Code, on the laptop and in the pull request: secret scanning on commit with a pre-commit hook and push protection, static analysis on pull requests with CodeQL or Semgrep, dependency review that blocks new known CVEs, and infrastructure-as-code scanning with Checkov or Trivy config. Build, in CI on main: an image scan that fails on fixable high or critical findings, an SBOM and provenance attested to the image digest, hardened CI with SHA-pinned actions and least-privilege tokens, and a secret scan of image layers and bundles. Deploy, to staging and then production: an OIDC deploy role with short-lived credentials, verification of attestations and policies before deploy, a ZAP baseline scan against staging, and approval through a protected production environment. Run, with live traffic and servers: edge protection with DDoS mitigation, a WAF, and rate limits; least-privilege IAM with roles and SSO with MFA; network segmentation with private subnets and security groups; and detection and patching with audit logs and CVE remediation SLAs. A dashed feedback arrow returns from Run to Code: findings, new CVEs, and incidents become tickets with SLAs.</desc>
  <defs>
    <marker id="dso-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="dso-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="424" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
