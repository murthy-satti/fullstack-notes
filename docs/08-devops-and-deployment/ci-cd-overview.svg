<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="cio-title cio-desc">
  <title id="cio-title">A CI/CD pipeline from commit to production and back</title>
  <desc id="cio-desc">A developer pushes a commit or opens a pull request. Continuous integration runs the checks: lint, tests, and build. The build produces one artifact, a container image identified by its digest. The pipeline deploys that artifact to staging and runs smoke and end-to-end tests. An approval gate, such as a required reviewer on the production environment, decides when to release. The same artifact is deployed to production, often progressively with a canary. Monitoring watches SLOs, errors, and delivery metrics, and feeds back to developers, who roll back or fix forward with a new commit. In continuous delivery every green build can reach production after one approval; in continuous deployment the approval gate is removed and passing changes ship automatically.</desc>
  <defs>
    <marker id="cio-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cio-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <path d="M30 52V44H620V52" fill="none" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="200" y="30" width="250" height="16" fill="#f5f7fb"/>
    <text x="325" y="42" font-size="12" font-weight="700" fill="#463365">Continuous integration: every commit</text>

    <rect x="30" y="66" width="170" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="115" y="96" font-size="13.5" font-weight="700" fill="#66400f">1. Commit or PR</text>
    <text x="115" y="115" font-size="11.5" fill="#66400f">push to GitHub</text>
    <rect x="240" y="66" width="170" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="325" y="96" font-size="13.5" font-weight="700" fill="#463365">2. CI checks</text>
    <text x="325" y="115" font-size="11.5" fill="#463365">lint, test, build</text>
    <rect x="450" y="66" width="170" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="535" y="96" font-size="13.5" font-weight="700" fill="#263e5a">3. Artifact</text>
    <text x="535" y="115" font-size="11.5" fill="#263e5a">image by digest, built once</text>
    <rect x="660" y="66" width="170" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="745" y="96" font-size="13.5" font-weight="700" fill="#263e5a">4. Staging</text>
    <text x="745" y="115" font-size="11.5" fill="#263e5a">deploy, smoke + e2e</text>

    <rect x="660" y="206" width="170" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="745" y="236" font-size="13.5" font-weight="700" fill="#66400f">5. Approval gate</text>
    <text x="745" y="255" font-size="11.5" fill="#66400f">required reviewer</text>
    <rect x="450" y="206" width="170" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="535" y="236" font-size="13.5" font-weight="700" fill="#294a2e">6. Production</text>
    <text x="535" y="255" font-size="11.5" fill="#294a2e">same artifact, canary</text>
    <rect x="240" y="206" width="170" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="325" y="236" font-size="13.5" font-weight="700" fill="#263e5a">7. Monitor</text>
    <text x="325" y="255" font-size="11.5" fill="#263e5a">SLOs, errors, DORA</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 101H238" marker-end="url(#cio-arrow)"/>
      <path d="M410 101H448" marker-end="url(#cio-arrow)"/>
      <path d="M620 101H658" marker-end="url(#cio-arrow)"/>
      <path d="M745 136V204" marker-end="url(#cio-arrow)"/>
      <path d="M660 241H622" marker-end="url(#cio-arrow)"/>
      <path d="M450 241H412" marker-end="url(#cio-arrow)"/>
    </g>
    <path d="M240 241H115V138" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cio-arrow-ret)"/>
    <g font-size="11" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="124" y="178">feedback: roll back</text>
      <text x="124" y="193">or fix forward</text>
    </g>
    <text x="756" y="176" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">all green</text>

    <path d="M24 300H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="12" fill="#36424e">
      <text x="430" y="324"><tspan font-weight="700">Continuous delivery:</tspan> every green build is releasable; a person approves step 5.</text>
      <text x="430" y="344"><tspan font-weight="700">Continuous deployment:</tspan> step 5 is automated, so passing changes ship on their own.</text>
    </g>
    <text x="430" y="374" font-size="13" fill="#40566b">Build once, test, promote the same artifact, and let production feedback drive the next change.</text>
  </g>
</svg>
