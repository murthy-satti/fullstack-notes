<svg xmlns="http://www.w3.org/2000/svg" width="880" height="504" viewBox="0 0 880 504" role="img" aria-labelledby="kex-title kex-desc">
  <title id="kex-title">Choosing a k6 executor from the question the test asks</title>
  <desc id="kex-desc">A decision flowchart. First question: is the target a rate, in requests per second? If yes, ask whether the rate changes during the test: yes leads to ramping-arrival-rate, an open model with a changing rate; no leads to constant-arrival-rate, an open model with a fixed rate. If the target is not a rate, ask whether the real system has a fixed number of users or workers. If yes, ask whether the number changes during the test: yes leads to ramping-vus, a closed model with ramping VUs; no leads to constant-vus, a closed model with fixed VUs. If not, ask whether the test is a fixed amount of work in iterations. If yes, ask whether every VU must run the same count: yes leads to per-vu-iterations, where each VU runs N iterations; no leads to shared-iterations, where all VUs share N iterations in total. If it is not a fixed amount of work either, rephrase the question as a rate. k6 version 2 removed the externally-controlled executor.</desc>
  <defs>
    <marker id="kex-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="504" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Choosing a k6 executor</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M24 100 160 58 296 100 160 142Z"/>
      <path d="M334 100 470 58 606 100 470 142Z"/>
      <path d="M24 230 160 188 296 230 160 272Z"/>
      <path d="M334 230 470 188 606 230 470 272Z"/>
      <path d="M24 360 160 318 296 360 160 402Z"/>
      <path d="M334 360 470 318 606 360 470 402Z"/>
    </g>
    <g font-size="12" fill="#36424e">
      <text x="160" y="96" font-weight="700">Is the target a rate?</text>
      <text x="160" y="114">requests per second</text>
      <text x="470" y="96" font-weight="700">Does the rate change</text>
      <text x="470" y="114">during the test?</text>
      <text x="160" y="226" font-weight="700">A fixed number of</text>
      <text x="160" y="244">users or workers?</text>
      <text x="470" y="226" font-weight="700">Does the number change</text>
      <text x="470" y="244">during the test?</text>
      <text x="160" y="356" font-weight="700">A fixed amount</text>
      <text x="160" y="374">of work (iterations)?</text>
      <text x="470" y="356" font-weight="700">Must every VU run</text>
      <text x="470" y="374">the same count?</text>
    </g>

    <rect x="640" y="52" width="216" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="748" y="69" font-size="13" font-weight="700" fill="#263e5a">ramping-arrival-rate</text>
    <text x="748" y="84" font-size="11" fill="#263e5a">open model, changing rate</text>
    <rect x="640" y="108" width="216" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="748" y="125" font-size="13" font-weight="700" fill="#263e5a">constant-arrival-rate</text>
    <text x="748" y="140" font-size="11" fill="#263e5a">open model, fixed rate</text>
    <rect x="640" y="182" width="216" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="748" y="199" font-size="13" font-weight="700" fill="#66400f">ramping-vus</text>
    <text x="748" y="214" font-size="11" fill="#66400f">closed model, ramping VUs</text>
    <rect x="640" y="238" width="216" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="748" y="255" font-size="13" font-weight="700" fill="#66400f">constant-vus</text>
    <text x="748" y="270" font-size="11" fill="#66400f">closed model, fixed VUs</text>
    <rect x="640" y="312" width="216" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="748" y="329" font-size="13" font-weight="700" fill="#463365">per-vu-iterations</text>
    <text x="748" y="344" font-size="11" fill="#463365">each VU runs N iterations</text>
    <rect x="640" y="368" width="216" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="748" y="385" font-size="13" font-weight="700" fill="#463365">shared-iterations</text>
    <text x="748" y="400" font-size="11" fill="#463365">all VUs share N in total</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M296 100H332" marker-end="url(#kex-arrow)"/>
      <path d="M296 230H332" marker-end="url(#kex-arrow)"/>
      <path d="M296 360H332" marker-end="url(#kex-arrow)"/>
      <path d="M606 100H620V72H638" marker-end="url(#kex-arrow)"/>
      <path d="M620 100V128H638" marker-end="url(#kex-arrow)"/>
      <path d="M606 230H620V202H638" marker-end="url(#kex-arrow)"/>
      <path d="M620 230V258H638" marker-end="url(#kex-arrow)"/>
      <path d="M606 360H620V332H638" marker-end="url(#kex-arrow)"/>
      <path d="M620 360V388H638" marker-end="url(#kex-arrow)"/>
      <path d="M160 142V186" marker-end="url(#kex-arrow)"/>
      <path d="M160 272V316" marker-end="url(#kex-arrow)"/>
      <path d="M160 402V422" marker-end="url(#kex-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="315" y="92">yes</text>
      <text x="315" y="222">yes</text>
      <text x="315" y="352">yes</text>
      <text x="606" y="88" text-anchor="end">yes</text>
      <text x="606" y="122" text-anchor="end">no</text>
      <text x="606" y="218" text-anchor="end">yes</text>
      <text x="606" y="252" text-anchor="end">no</text>
      <text x="606" y="348" text-anchor="end">yes</text>
      <text x="606" y="382" text-anchor="end">no</text>
      <text x="172" y="170" text-anchor="start">no</text>
      <text x="172" y="300" text-anchor="start">no</text>
      <text x="172" y="416" text-anchor="start">no</text>
    </g>

    <rect x="24" y="424" width="272" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="160" y="446" font-size="12" font-weight="700" fill="#66400f">rephrase the question as a rate</text>
    <text x="856" y="446" font-size="11.5" fill="#60788d" text-anchor="end">k6 v2 removed the externally-controlled executor</text>

    <text x="440" y="486" font-size="13" fill="#40566b">Pick the executor from the question: rates need arrival-rate executors, populations need VU executors.</text>
  </g>
</svg>
