<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="ovc-title ovc-desc">
  <title id="ovc-title">Closed and open workload models during the same slow period</title>
  <desc id="ovc-desc">Two timelines show the same period in which the server becomes slow, shaded in red. Left, the closed model: three virtual users each send a request, wait for the response, pause for think time, and repeat. While the server is slow each user's request takes much longer, so fewer new requests start; the load equals the number of virtual users divided by response time plus think time, and the test sends less exactly when the server struggles. Right, the open model: a new request starts at every tick of a fixed arrival schedule, whatever the server does. Requests that arrive during the slow period all take longer, so four of them are in flight at the same time instead of one; the load equals the arrival rate you set, and requests pile up in flight as they would in production.</desc>
  <defs>
    <marker id="ovc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b">The same slow period, seen by two workload models</text>
    <rect x="520" y="22" width="14" height="12" rx="2" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="540" y="32" font-size="12" fill="#36424e">request</text>
    <rect x="606" y="22" width="14" height="12" rx="2" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="626" y="32" font-size="12" fill="#36424e">slow request</text>
    <path d="M728 28H752" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="758" y="32" font-size="12" fill="#36424e">think time</text>

    <rect x="24" y="48" width="404" height="252" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="40" y="72" font-size="14" font-weight="700" fill="#36424e">Closed model: a fixed number of users</text>
    <text x="40" y="90" font-size="11.5" fill="#36424e">each VU sends, waits for the response, thinks, repeats</text>
    <rect x="250" y="112" width="90" height="100" fill="#fbe9e7"/>
    <g font-size="11.5" fill="#36424e">
      <text x="40" y="130">VU 1</text>
      <text x="40" y="162">VU 2</text>
      <text x="40" y="194">VU 3</text>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="3 3">
      <path d="M94 126H128M142 126H176M190 126H224M238 126H272M342 126H376M390 126H410"/>
      <path d="M110 158H144M158 158H192M206 158H240M254 158H288M358 158H392"/>
      <path d="M126 190H160M174 190H208M222 190H256M326 190H360M374 190H408"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="80" y="118" width="14" height="16" rx="3"/>
      <rect x="128" y="118" width="14" height="16" rx="3"/>
      <rect x="176" y="118" width="14" height="16" rx="3"/>
      <rect x="224" y="118" width="14" height="16" rx="3"/>
      <rect x="376" y="118" width="14" height="16" rx="3"/>
      <rect x="96" y="150" width="14" height="16" rx="3"/>
      <rect x="144" y="150" width="14" height="16" rx="3"/>
      <rect x="192" y="150" width="14" height="16" rx="3"/>
      <rect x="240" y="150" width="14" height="16" rx="3"/>
      <rect x="392" y="150" width="14" height="16" rx="3"/>
      <rect x="112" y="182" width="14" height="16" rx="3"/>
      <rect x="160" y="182" width="14" height="16" rx="3"/>
      <rect x="208" y="182" width="14" height="16" rx="3"/>
      <rect x="360" y="182" width="14" height="16" rx="3"/>
    </g>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="272" y="118" width="70" height="16" rx="3"/>
      <rect x="288" y="150" width="70" height="16" rx="3"/>
      <rect x="256" y="182" width="70" height="16" rx="3"/>
    </g>
    <path d="M80 226H412" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#ovc-arrow)"/>
    <text x="295" y="242" font-size="11.5" fill="#6e2a24" text-anchor="middle">server slow</text>
    <text x="412" y="242" font-size="11.5" fill="#36424e" text-anchor="end">time</text>
    <text x="40" y="268" font-size="12" font-weight="700" fill="#36424e">Load = VUs / (response time + think time)</text>
    <text x="40" y="288" font-size="11.5" fill="#6e2a24">The test sends less exactly when the server struggles.</text>

    <rect x="452" y="48" width="404" height="252" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="468" y="72" font-size="14" font-weight="700" fill="#36424e">Open model: a fixed arrival rate</text>
    <text x="468" y="90" font-size="11.5" fill="#36424e">requests start on schedule, whatever the server does</text>
    <rect x="700" y="112" width="90" height="100" fill="#fbe9e7"/>
    <text x="468" y="107" font-size="11.5" fill="#36424e">arrivals</text>
    <path d="M532 98V108M556 98V108M580 98V108M604 98V108M628 98V108M652 98V108M676 98V108M700 98V108M724 98V108M748 98V108M772 98V108M796 98V108M820 98V108" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="532" y="118" width="14" height="16" rx="3"/>
      <rect x="556" y="118" width="14" height="16" rx="3"/>
      <rect x="580" y="118" width="14" height="16" rx="3"/>
      <rect x="604" y="118" width="14" height="16" rx="3"/>
      <rect x="628" y="118" width="14" height="16" rx="3"/>
      <rect x="652" y="118" width="14" height="16" rx="3"/>
      <rect x="676" y="118" width="14" height="16" rx="3"/>
      <rect x="796" y="118" width="14" height="16" rx="3"/>
      <rect x="820" y="118" width="14" height="16" rx="3"/>
    </g>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="700" y="118" width="70" height="16" rx="3"/>
      <rect x="724" y="142" width="70" height="16" rx="3"/>
      <rect x="748" y="166" width="70" height="16" rx="3"/>
      <rect x="772" y="190" width="70" height="16" rx="3"/>
    </g>
    <path d="M530 226H842" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#ovc-arrow)"/>
    <text x="745" y="242" font-size="11.5" fill="#6e2a24" text-anchor="middle">server slow</text>
    <text x="842" y="242" font-size="11.5" fill="#36424e" text-anchor="end">time</text>
    <text x="468" y="268" font-size="12" font-weight="700" fill="#36424e">Load = the arrival rate you set</text>
    <text x="468" y="288" font-size="11.5" fill="#6e2a24">Requests pile up in flight, as in production.</text>

    <text x="440" y="330" font-size="13" fill="#40566b" text-anchor="middle">A closed test eases off when the server slows; an open test keeps up the pressure users apply.</text>
  </g>
</svg>
