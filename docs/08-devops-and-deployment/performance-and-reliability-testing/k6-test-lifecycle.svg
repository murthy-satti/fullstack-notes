<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="klc-title klc-desc">
  <title id="klc-title">The k6 test lifecycle and how it becomes an exit code</title>
  <desc id="klc-desc">A k6 test runs in five stages from left to right. Init code runs once per VU: imports, options, open, and SharedArray. setup runs once: it logs in test users and returns JSON data. VU code runs every iteration: executors start iterations, which make requests and run checks. teardown runs once and cleans up data created by the test. The end of the test runs once and produces the summary or calls handleSummary. The data returned by setup reaches every VU and teardown as a JSON copy. Below, thresholds are checked during the run over every sample collected so far; with abortOnFail the test stops early when one is crossed, and checks never fail a test without a threshold. The end of the test produces exit code 0 when every threshold passed, or exit code 99 when a threshold failed; other codes include 107 for a script error and 108 for test.abort.</desc>
  <defs>
    <marker id="klc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="klc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="36" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One k6 run, from the first line of the script to the exit code CI reads</text>

    <rect x="24" y="56" width="152" height="92" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="100" y="80" font-size="14" font-weight="700" fill="#463365">init code</text>
    <text x="100" y="98" font-size="12" font-weight="700" fill="#463365">once per VU</text>
    <text x="100" y="118" font-size="11.5" fill="#463365">imports, options,</text>
    <text x="100" y="134" font-size="11.5" fill="#463365">open(), SharedArray</text>

    <rect x="194" y="56" width="152" height="92" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="270" y="80" font-size="14" font-weight="700" fill="#263e5a">setup()</text>
    <text x="270" y="98" font-size="12" font-weight="700" fill="#263e5a">once</text>
    <text x="270" y="118" font-size="11.5" fill="#263e5a">log in test users,</text>
    <text x="270" y="134" font-size="11.5" fill="#263e5a">return JSON data</text>

    <rect x="364" y="56" width="152" height="92" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="440" y="80" font-size="14" font-weight="700" fill="#66400f">VU code</text>
    <text x="440" y="98" font-size="12" font-weight="700" fill="#66400f">every iteration</text>
    <text x="440" y="118" font-size="11.5" fill="#66400f">executors start</text>
    <text x="440" y="134" font-size="11.5" fill="#66400f">iterations; checks</text>

    <rect x="534" y="56" width="152" height="92" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="610" y="80" font-size="14" font-weight="700" fill="#263e5a">teardown()</text>
    <text x="610" y="98" font-size="12" font-weight="700" fill="#263e5a">once</text>
    <text x="610" y="118" font-size="11.5" fill="#263e5a">clean up data</text>
    <text x="610" y="134" font-size="11.5" fill="#263e5a">created by the test</text>

    <rect x="704" y="56" width="152" height="92" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="780" y="80" font-size="14" font-weight="700" fill="#463365">end of test</text>
    <text x="780" y="98" font-size="12" font-weight="700" fill="#463365">once</text>
    <text x="780" y="118" font-size="11.5" fill="#463365">summary or</text>
    <text x="780" y="134" font-size="11.5" fill="#463365">handleSummary()</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M176 102H192" marker-end="url(#klc-arrow)"/>
      <path d="M346 102H362" marker-end="url(#klc-arrow)"/>
      <path d="M516 102H532" marker-end="url(#klc-arrow)"/>
      <path d="M686 102H702" marker-end="url(#klc-arrow)"/>
    </g>
    <path d="M270 148V172H440V152M440 172H610V152" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#klc-arrow-ret)"/>
    <path d="M440 172V152" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#klc-arrow-ret)"/>
    <text x="440" y="190" font-size="11.5" fill="#40566b">setup() data reaches every VU and teardown() as a JSON copy</text>

    <rect x="24" y="210" width="404" height="96" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="40" y="234" font-size="14" font-weight="700" fill="#36424e" text-anchor="start">Thresholds</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="40" y="254">checked during the run, over every sample so far</text>
      <text x="40" y="272">abortOnFail: stop early when one is crossed</text>
      <text x="40" y="290">checks never fail a test without a threshold</text>
    </g>

    <rect x="452" y="210" width="404" height="38" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="654" y="234" font-size="12.5" font-weight="700" fill="#294a2e">exit code 0: every threshold passed</text>
    <rect x="452" y="262" width="404" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="654" y="280" font-size="12.5" font-weight="700" fill="#6e2a24">exit code 99: a threshold failed</text>
    <text x="654" y="298" font-size="11" fill="#6e2a24">other codes: 107 script error, 108 test.abort()</text>
    <path d="M780 148V206" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#klc-arrow)"/>
    <path d="M428 258H450" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#klc-arrow)"/>

    <text x="440" y="338" font-size="13" fill="#40566b">Only thresholds turn results into pass or fail; the exit code is what CI acts on.</text>
  </g>
</svg>
