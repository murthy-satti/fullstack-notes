<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="kaf-title kaf-desc">
  <title id="kaf-title">What happens after kubectl apply</title>
  <desc id="kaf-desc">Step 1: kubectl apply sends the Deployment YAML to the API server, which authenticates the request, authorizes it, runs admission checks, and validates it. Step 2: the API server stores the desired state in etcd. Step 3: controllers in the controller manager watch the API server; the Deployment controller creates a ReplicaSet and the ReplicaSet controller creates Pods. Step 4: the scheduler watches for Pods without a node and binds each one to a worker node. Step 5: the kubelet on that node sees the Pods bound to it and asks the container runtime, containerd through the CRI, to pull the image and start the containers, so the Pods run. kube-proxy on the node programs Service routing rules. Step 6: the kubelet reports Pod status back to the API server, which stores it in etcd.</desc>
  <defs>
    <marker id="kaf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="kaf-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#40566b"/>
    </marker>
    <marker id="kaf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="196" y="30" width="308" height="326" rx="10" fill="#e5efff" fill-opacity="0.35" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="208" y="50" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="start">control plane</text>
    <rect x="560" y="30" width="276" height="326" rx="10" fill="#e7f3e9" fill-opacity="0.35" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="572" y="50" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="start">worker node</text>

    <rect x="24" y="155" width="140" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="178" font-size="14" font-weight="700" fill="#66400f">kubectl apply</text>
    <text x="94" y="197" font-size="11.5" fill="#66400f">deployment.yaml</text>

    <rect x="208" y="64" width="136" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="276" y="86" font-size="13.5" font-weight="700" fill="#463365">controllers</text>
    <text x="276" y="104" font-size="11" fill="#463365">Deployment, ReplicaSet</text>
    <rect x="356" y="64" width="136" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="424" y="86" font-size="13.5" font-weight="700" fill="#463365">scheduler</text>
    <text x="424" y="104" font-size="11" fill="#463365">picks a node per Pod</text>

    <rect x="208" y="150" width="284" height="66" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="350" y="176" font-size="14" font-weight="700" fill="#263e5a">API server</text>
    <text x="350" y="196" font-size="11.5" fill="#263e5a">authn, authz, admission, validation</text>

    <rect x="208" y="270" width="284" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="350" y="292" font-size="14" font-weight="700" fill="#263e5a">etcd</text>
    <text x="350" y="310" font-size="11.5" fill="#263e5a">desired state and current status</text>

    <rect x="580" y="64" width="236" height="46" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="2"/>
    <text x="698" y="83" font-size="13" font-weight="700" fill="#36424e">kube-proxy</text>
    <text x="698" y="100" font-size="11" fill="#36424e">programs Service routing rules</text>
    <rect x="580" y="150" width="236" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="698" y="173" font-size="14" font-weight="700" fill="#263e5a">kubelet</text>
    <text x="698" y="192" font-size="11.5" fill="#263e5a">runs the Pods bound to this node</text>
    <rect x="580" y="226" width="236" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="698" y="246" font-size="13" font-weight="700" fill="#463365">containerd (via CRI)</text>
    <text x="698" y="263" font-size="11" fill="#463365">pulls images, starts containers</text>
    <rect x="580" y="292" width="110" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="635" y="313" font-size="12.5" font-weight="700" fill="#294a2e">Pod</text>
    <text x="635" y="330" font-size="11" fill="#294a2e">taskflow-api</text>
    <rect x="706" y="292" width="110" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="761" y="313" font-size="12.5" font-weight="700" fill="#294a2e">Pod</text>
    <text x="761" y="330" font-size="11" fill="#294a2e">taskflow-api</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 183H206" marker-end="url(#kaf-arrow)"/>
      <path d="M276 120V148" marker-start="url(#kaf-arrow-start)" marker-end="url(#kaf-arrow)"/>
      <path d="M424 120V148" marker-start="url(#kaf-arrow-start)" marker-end="url(#kaf-arrow)"/>
      <path d="M350 218V268" marker-start="url(#kaf-arrow-start)" marker-end="url(#kaf-arrow)"/>
      <path d="M492 166H578" marker-end="url(#kaf-arrow)"/>
      <path d="M698 206V224" marker-end="url(#kaf-arrow)"/>
      <path d="M635 272V290" marker-end="url(#kaf-arrow)"/>
      <path d="M761 272V290" marker-end="url(#kaf-arrow)"/>
    </g>
    <path d="M580 196H494" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#kaf-arrow-ret)"/>

    <g font-size="11" font-weight="700" fill="#ffffff">
      <circle cx="185" cy="166" r="9" fill="#40566b"/>
      <text x="185" y="170">1</text>
      <circle cx="366" cy="243" r="9" fill="#40566b"/>
      <text x="366" y="247">2</text>
      <circle cx="260" cy="134" r="9" fill="#40566b"/>
      <text x="260" y="138">3</text>
      <circle cx="440" cy="134" r="9" fill="#40566b"/>
      <text x="440" y="138">4</text>
      <circle cx="535" cy="152" r="9" fill="#40566b"/>
      <text x="535" y="156">5</text>
      <circle cx="535" cy="212" r="9" fill="#60788d"/>
      <text x="535" y="216">6</text>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="384"><tspan font-weight="700">1</tspan> kubectl apply sends YAML; the API server checks it</text>
      <text x="24" y="402"><tspan font-weight="700">2</tspan> the API server stores the desired state in etcd</text>
      <text x="24" y="420"><tspan font-weight="700">3</tspan> controllers create a ReplicaSet, then Pods</text>
      <text x="440" y="384"><tspan font-weight="700">4</tspan> the scheduler binds each new Pod to a node</text>
      <text x="440" y="402"><tspan font-weight="700">5</tspan> the kubelet asks containerd to start the containers</text>
      <text x="440" y="420"><tspan font-weight="700">6</tspan> the kubelet reports Pod status to the API server</text>
    </g>
    <text x="430" y="454" font-size="13" fill="#40566b">Every component talks only to the API server; each one watches for work and reconciles it.</text>
  </g>
</svg>
