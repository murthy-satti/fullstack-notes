<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="aus-title aus-desc">
  <title id="aus-title">Desktop auto-update: check, download, verify, install</title>
  <desc id="aus-desc">1, the installed app on version 1.8.0 asks the update server for updates, sending its platform, architecture, current version, channel stable, and an anonymous install ID. 2, the server checks whether a newer version exists on that channel, whether the rollout is halted, and whether the install ID falls inside the rollout percentage. 3, if so it returns a manifest with version 1.9.0, the download URL, the signature, and release notes; otherwise it returns 204 No Content. 4, the app downloads the installer from the CDN. 5, the CDN returns the file. 6, the app verifies the signature with the public key built into the app; on a mismatch it discards the file and reports the failure. 7, the update installs when the user quits or accepts a prompt, and the app relaunches as 1.9.0. 8, the app reports its new version and crash-free sessions, which decide whether the rollout continues.</desc>
  <defs>
    <marker id="aus-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="aus-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="20" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="140" y="39" font-size="14" font-weight="700" fill="#66400f">Installed app</text>
    <text x="140" y="55" font-size="11.5" fill="#66400f">version 1.8.0</text>
    <rect x="380" y="20" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="450" y="39" font-size="14" font-weight="700" fill="#263e5a">Update server</text>
    <text x="450" y="55" font-size="11.5" fill="#263e5a">manifest, rollout</text>
    <rect x="670" y="20" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="740" y="39" font-size="14" font-weight="700" fill="#463365">CDN</text>
    <text x="740" y="55" font-size="11.5" fill="#463365">installer files</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M140 64V436"/>
      <path d="M450 64V436"/>
      <path d="M740 64V436"/>
    </g>

    <path d="M140 96H448" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#aus-arrow)"/>
    <rect x="160" y="79" width="270" height="14" fill="#f5f7fb"/>
    <text x="295" y="90" font-size="11.5" fill="#36424e">1. check: windows x86_64 1.8.0, stable</text>

    <rect x="340" y="112" width="220" height="44" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="450" y="130" font-size="11.5" fill="#263e5a">2. newer version? not halted?</text>
    <text x="450" y="146" font-size="11.5" fill="#263e5a">install ID inside rollout %?</text>

    <path d="M450 180H142" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aus-arrow-ret)"/>
    <rect x="160" y="163" width="270" height="14" fill="#f5f7fb"/>
    <text x="295" y="174" font-size="11.5" fill="#36424e">3. 200: 1.9.0, url, signature (or 204)</text>

    <path d="M140 220H738" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#aus-arrow)"/>
    <rect x="480" y="203" width="230" height="14" fill="#f5f7fb"/>
    <text x="595" y="214" font-size="11.5" fill="#36424e">4. GET TaskFlow_1.9.0_x64-setup.exe</text>
    <path d="M740 256H142" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aus-arrow-ret)"/>
    <rect x="520" y="239" width="150" height="14" fill="#f5f7fb"/>
    <text x="595" y="250" font-size="11.5" fill="#36424e">5. installer bytes</text>

    <rect x="30" y="276" width="220" height="44" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="140" y="294" font-size="11.5" font-weight="700" fill="#294a2e">6. verify the signature</text>
    <text x="140" y="310" font-size="11.5" fill="#294a2e">with the key built into the app</text>
    <text x="262" y="303" font-size="11.5" font-style="italic" fill="#6e2a24" text-anchor="start">mismatch: discard the file, report it</text>

    <rect x="30" y="334" width="220" height="44" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="140" y="352" font-size="11.5" font-weight="700" fill="#66400f">7. install on quit or prompt</text>
    <text x="140" y="368" font-size="11.5" fill="#66400f">relaunch as 1.9.0</text>

    <path d="M140 410H448" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aus-arrow-ret)"/>
    <rect x="160" y="393" width="270" height="14" fill="#f5f7fb"/>
    <text x="295" y="404" font-size="11.5" fill="#36424e">8. report version and crash-free sessions</text>

    <text x="430" y="464" font-size="13" fill="#40566b">The server decides who gets an update; the app trusts only files signed with its own key.</text>
  </g>
</svg>
