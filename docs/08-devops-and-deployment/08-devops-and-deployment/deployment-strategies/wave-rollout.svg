<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-labelledby="wav-title wav-desc">
  <title id="wav-title">Wave rollout from one box to every region</title>
  <desc id="wav-desc">A change first goes to one box, a single host, and bakes for at least an hour. Wave 1 deploys to a low-traffic region one Availability Zone at a time and bakes for about 12 hours. Wave 2 deploys to a high-traffic region one Availability Zone at a time and bakes for 2 to 4 hours. Wave 3 deploys to a few more regions in parallel, and the last wave to all remaining regions in parallel. The share of customers exposed grows from left to right. An alarm at any stage rolls that stage back automatically and stops promotion.</desc>
  <defs>
    <marker id="wav-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="wav-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="310" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="20" y="40" width="156" height="78" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="188" y="40" width="156" height="78" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="356" y="40" width="156" height="78" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="524" y="40" width="156" height="78" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="692" y="40" width="148" height="78" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <text x="98" y="63" font-size="14" font-weight="700" fill="#66400f">One box</text>
    <text x="98" y="82" font-size="11.5" fill="#66400f">single host</text>
    <text x="98" y="101" font-size="11" font-style="italic" fill="#66400f">bake 1 h or more</text>
    <g fill="#263e5a">
      <text x="266" y="63" font-size="14" font-weight="700">Wave 1</text>
      <text x="266" y="82" font-size="11.5">low-traffic region</text>
      <text x="266" y="101" font-size="11" font-style="italic">AZ by AZ; bake 12 h</text>
      <text x="434" y="63" font-size="14" font-weight="700">Wave 2</text>
      <text x="434" y="82" font-size="11.5">high-traffic region</text>
      <text x="434" y="101" font-size="11" font-style="italic">AZ by AZ; bake 2-4 h</text>
      <text x="602" y="63" font-size="14" font-weight="700">Wave 3</text>
      <text x="602" y="82" font-size="11.5">a few more regions</text>
      <text x="602" y="101" font-size="11" font-style="italic">in parallel</text>
      <text x="766" y="63" font-size="14" font-weight="700">Last wave</text>
      <text x="766" y="82" font-size="11.5">all other regions</text>
      <text x="766" y="101" font-size="11" font-style="italic">in parallel</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M176 79H186" marker-end="url(#wav-arrow)"/>
      <path d="M344 79H354" marker-end="url(#wav-arrow)"/>
      <path d="M512 79H522" marker-end="url(#wav-arrow)"/>
      <path d="M680 79H690" marker-end="url(#wav-arrow)"/>
    </g>

    <path d="M20 168 840 136V168z" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="700" y="162" font-size="11.5" font-weight="700" fill="#294a2e">share of customers exposed</text>

    <path d="M430 210V186" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#wav-arrow-red)"/>
    <text x="440" y="202" font-size="11.5" font-style="italic" fill="#6e2a24" text-anchor="start">alarms watched at every stage</text>
    <rect x="200" y="212" width="460" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="430" y="233" font-size="14" font-weight="700" fill="#6e2a24">Alarm fires: automatic rollback</text>
    <text x="430" y="251" font-size="11.5" fill="#6e2a24">that stage reverts, promotion stops, later waves never see the change</text>

    <text x="430" y="292" font-size="13" fill="#40566b">Each wave is bigger than the last and must survive its bake time before the next one starts.</text>
  </g>
</svg>
