<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="ffe-title ffe-desc">
  <title id="ffe-title">How a feature flag is evaluated for one request</title>
  <desc id="ffe-desc">The request context, for example user-16 on the free plan, is evaluated against the rules of the flag new-task-board. First: is the flag enabled? If not, the off value is served. If enabled: is the user in the individual target list? If yes, the target's variant is served. If not: does a targeting rule match, such as plan equals beta or a staff email? If yes, the rule's variant is served. If not: is the user's bucket below the rollout percentage? If yes, the rollout value on is served; if not, the default fallthrough value off is served. For user-16 the flag is enabled, there is no target and no rule match, and bucket 364 is below the 10 percent threshold of 1000, so the flag is on. The SDK keeps the rules in memory and refreshes them in the background, so evaluation is a local function call; if rules never loaded, the default value written in the code is used.</desc>
  <defs>
    <marker id="ffe-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Evaluate new-task-board</text>

    <rect x="20" y="58" width="120" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="80" y="80" font-size="14" font-weight="700" fill="#66400f">Context</text>
    <text x="80" y="97" font-size="11.5" fill="#66400f">user-16</text>
    <text x="80" y="112" font-size="11.5" fill="#66400f">plan: free</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M215 52 267 90 215 128 163 90z"/>
      <path d="M365 52 417 90 365 128 313 90z"/>
      <path d="M515 52 567 90 515 128 463 90z"/>
      <path d="M665 52 717 90 665 128 613 90z"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#463365">
      <text x="215" y="87">flag</text>
      <text x="215" y="101">enabled?</text>
      <text x="365" y="87">user in</text>
      <text x="365" y="101">targets?</text>
      <text x="515" y="87">rule</text>
      <text x="515" y="101">matches?</text>
      <text x="665" y="87">bucket &lt;</text>
      <text x="665" y="101">rollout %?</text>
    </g>

    <rect x="745" y="62" width="95" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="792" y="86" font-size="14" font-weight="700" fill="#294a2e">serve on</text>
    <text x="792" y="104" font-size="11.5" fill="#294a2e">rollout</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M140 90H161" marker-end="url(#ffe-arrow)"/>
      <path d="M267 90H311" marker-end="url(#ffe-arrow)"/>
      <path d="M417 90H461" marker-end="url(#ffe-arrow)"/>
      <path d="M567 90H611" marker-end="url(#ffe-arrow)"/>
      <path d="M717 90H743" marker-end="url(#ffe-arrow)"/>
      <path d="M215 128V168" marker-end="url(#ffe-arrow)"/>
      <path d="M365 128V168" marker-end="url(#ffe-arrow)"/>
      <path d="M515 128V168" marker-end="url(#ffe-arrow)"/>
      <path d="M665 128V168" marker-end="url(#ffe-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="289" y="82">yes</text>
      <text x="439" y="82">no</text>
      <text x="589" y="82">no</text>
      <text x="730" y="82">yes</text>
      <text x="227" y="152" text-anchor="start">no</text>
      <text x="377" y="152" text-anchor="start">yes</text>
      <text x="527" y="152" text-anchor="start">yes</text>
      <text x="677" y="152" text-anchor="start">no</text>
    </g>

    <rect x="150" y="170" width="130" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="215" y="192" font-size="14" font-weight="700" fill="#6e2a24">serve off</text>
    <text x="215" y="210" font-size="11.5" fill="#6e2a24">flag disabled</text>
    <rect x="300" y="170" width="130" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="365" y="192" font-size="14" font-weight="700" fill="#263e5a">serve variant</text>
    <text x="365" y="210" font-size="11.5" fill="#263e5a">set for this user</text>
    <rect x="450" y="170" width="130" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="515" y="192" font-size="14" font-weight="700" fill="#263e5a">serve variant</text>
    <text x="515" y="210" font-size="11.5" fill="#263e5a">set for the rule</text>
    <rect x="600" y="170" width="130" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="665" y="192" font-size="14" font-weight="700" fill="#36424e">serve off</text>
    <text x="665" y="210" font-size="11.5" fill="#36424e">default rule</text>

    <rect x="20" y="246" width="820" height="66" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="430" y="268" font-size="12" font-weight="700" fill="#463365">For user-16: enabled, no target, no rule match, bucket 364 &lt; 1000 (10%), so the flag is on.</text>
    <text x="430" y="288" font-size="11.5" fill="#463365">The SDK keeps rules in memory and refreshes them in the background: evaluation is a local call.</text>
    <text x="430" y="304" font-size="11.5" fill="#463365">If rules never loaded, the default value written in the code is served.</text>

    <text x="430" y="348" font-size="13" fill="#40566b">Rules run in a fixed order; the first match decides, and every path ends in a safe value.</text>
  </g>
</svg>
