<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="rbw-title rbw-desc">
  <title id="rbw-title">Rainbow deployment: several versions live while long-lived connections drain</title>
  <desc id="rbw-desc">Three Deployments are named by commit. Deployment a1f3c9 takes new connections until 7d20e4 is released; from then on it only keeps its existing WebSocket connections, which drain slowly until it is deleted. Deployment 7d20e4 takes new connections until 3b9c51 is released, then drains and is deleted later. Deployment 3b9c51 takes all new connections from its release onward. At the marked moment, three versions run at the same time: two draining and one taking new connections. The Service always points new connections at the newest Deployment, and rollback means pointing it back at the previous one.</desc>
  <rect width="860" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="20" y="85">a1f3c9 (v1.6)</text>
      <text x="20" y="135">7d20e4 (v1.7)</text>
      <text x="20" y="185">3b9c51 (v1.8)</text>
    </g>

    <rect x="180" y="66" width="150" height="28" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="255" y="85" font-size="11.5" fill="#263e5a" text-anchor="middle">new connections</text>
    <rect x="330" y="66" width="230" height="28" rx="4" fill="#f5f7fb" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="445" y="85" font-size="11.5" fill="#263e5a" text-anchor="middle">existing connections drain</text>
    <text x="568" y="85" font-size="11.5" font-weight="700" fill="#6e2a24">deleted</text>

    <rect x="330" y="116" width="190" height="28" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="425" y="135" font-size="11.5" fill="#263e5a" text-anchor="middle">new connections</text>
    <rect x="520" y="116" width="240" height="28" rx="4" fill="#f5f7fb" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="640" y="135" font-size="11.5" fill="#263e5a" text-anchor="middle">existing connections drain</text>
    <text x="768" y="135" font-size="11.5" font-weight="700" fill="#6e2a24">deleted</text>

    <rect x="520" y="166" width="300" height="28" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="670" y="185" font-size="11.5" fill="#294a2e" text-anchor="middle">all new connections</text>

    <path d="M540 48V210" fill="none" stroke="#bd7a20" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="460" y="30" width="160" height="18" rx="9" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="540" y="43" font-size="11.5" font-weight="700" fill="#66400f" text-anchor="middle">now: 3 versions run</text>

    <path d="M180 228H820" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g fill="#40566b">
      <circle cx="180" cy="228" r="4"/>
      <circle cx="330" cy="228" r="4"/>
      <circle cx="520" cy="228" r="4"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="180" y="246">deploy a1f3c9</text>
      <text x="330" y="246">deploy 7d20e4</text>
      <text x="520" y="246">deploy 3b9c51</text>
      <text x="800" y="246">time</text>
    </g>

    <text x="20" y="280" font-size="11.5" fill="#36424e">The Service selector always names the newest Deployment; rollback points it back at the previous commit.</text>
    <text x="430" y="312" font-size="13" fill="#40566b" text-anchor="middle">Old versions are deleted only when their connection counts are near zero, not on a fixed schedule.</text>
  </g>
</svg>
