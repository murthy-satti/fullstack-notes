<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="pzt-title pzt-desc">
  <title id="pzt-title">Perimeter security compared with zero trust</title>
  <desc id="pzt-desc">Left, the perimeter model: a remote user with a VPN client passes one check at the VPN gateway and lands in a flat internal network, from which the admin app, the database, and the CI server are all reachable; a stolen VPN login reaches everything inside. Right, zero trust: an engineer on a managed laptop signed in with SSO goes through an identity-aware proxy that checks identity, device, and context on every request; the admin app is allowed because the engineer is on call, and the database is denied because the engineer has no role for it. Between services, the TaskFlow API calls a worker with mTLS and per-call authorization, and the worker verifies the caller's workload identity. Network location alone grants nothing.</desc>
  <defs>
    <marker id="pzt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pzt-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Perimeter: trust the network</text>
    <text x="444" y="30" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Zero trust: verify every request</text>
    <path d="M430 16V330" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="40" y="44" width="160" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="120" y="61" font-size="12.5" font-weight="700" fill="#66400f">Remote user</text>
    <text x="120" y="77" font-size="11" fill="#66400f">VPN client</text>
    <rect x="24" y="104" width="392" height="196" rx="12" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="408" y="122" font-size="11" font-style="italic" fill="#40566b" text-anchor="end">flat internal network</text>
    <rect x="40" y="132" width="160" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="120" y="151" font-size="12.5" font-weight="700" fill="#263e5a">VPN gateway</text>
    <text x="120" y="167" font-size="11" fill="#263e5a">one check at the edge</text>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="250" y="132" width="150" height="40" rx="8"/>
      <rect x="250" y="190" width="150" height="40" rx="8"/>
      <rect x="250" y="248" width="150" height="40" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="325" y="157">Admin app</text>
      <text x="325" y="215">Database</text>
      <text x="325" y="273">CI server</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M120 84V130" marker-end="url(#pzt-arrow)"/>
      <path d="M200 152H248" marker-end="url(#pzt-arrow)"/>
      <path d="M200 160L248 208" marker-end="url(#pzt-arrow)"/>
      <path d="M190 176L248 264" marker-end="url(#pzt-arrow)"/>
    </g>
    <text x="24" y="324" font-size="11.5" fill="#6e2a24" text-anchor="start">a stolen VPN login reaches everything inside</text>

    <rect x="454" y="44" width="210" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="559" y="61" font-size="12.5" font-weight="700" fill="#66400f">Engineer</text>
    <text x="559" y="77" font-size="11" fill="#66400f">managed laptop, SSO</text>
    <rect x="454" y="114" width="210" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="559" y="135" font-size="12.5" font-weight="700" fill="#463365">Identity-aware proxy</text>
    <text x="559" y="153" font-size="11" fill="#463365">identity, device, context</text>
    <rect x="690" y="108" width="146" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="763" y="125" font-size="12.5" font-weight="700" fill="#294a2e">Admin app</text>
    <text x="763" y="141" font-size="11" fill="#294a2e">allowed: on call</text>
    <rect x="690" y="164" width="146" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="763" y="181" font-size="12.5" font-weight="700" fill="#6e2a24">Database</text>
    <text x="763" y="197" font-size="11" fill="#6e2a24">denied: no role</text>

    <rect x="454" y="228" width="210" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="559" y="245" font-size="12.5" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="559" y="261" font-size="11" fill="#66400f">workload identity</text>
    <rect x="690" y="228" width="146" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="763" y="245" font-size="12.5" font-weight="700" fill="#263e5a">Worker</text>
    <text x="763" y="261" font-size="11" fill="#263e5a">verifies the caller</text>
    <text x="645" y="290" font-size="11" fill="#36424e">service to service: mTLS and per-call authorization</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M559 84V112" marker-end="url(#pzt-arrow)"/>
      <path d="M664 128H688" marker-end="url(#pzt-arrow)"/>
      <path d="M664 248H688" marker-end="url(#pzt-arrow)"/>
    </g>
    <path d="M664 156L688 178" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#pzt-arrow-red)"/>
    <text x="444" y="324" font-size="11.5" fill="#294a2e" text-anchor="start">network location alone grants nothing</text>

    <text x="430" y="362" font-size="13" fill="#40566b">Zero trust replaces network location with checks on identity, device, and context per request.</text>
  </g>
</svg>
