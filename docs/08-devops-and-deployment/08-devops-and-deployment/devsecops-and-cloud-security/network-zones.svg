<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="tnz-title tnz-desc">
  <title id="tnz-title">TaskFlow network zones with allowed and blocked paths</title>
  <desc id="tnz-desc">Users reach the load balancer in the public subnet on port 443; it is the only resource reachable from the internet. The load balancer forwards to the API tasks in the private app subnet on port 3000, and the API reaches the database through a PrivateLink endpoint in the isolated data subnet on port 27017. The API calls Secrets Manager through an interface endpoint on port 443 and S3 through a gateway endpoint, so these AWS service APIs are reached privately without the internet. Other outbound traffic leaves through the NAT gateway to an egress filter with a domain allowlist: the payment API is allowed, and an unknown host is blocked because it is not on the list. An attacker scanning the internet is blocked from the API and the database: there are no public IP addresses, and each security group accepts only the tier in front of it.</desc>
  <defs>
    <marker id="tnz-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="tnz-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Only the load balancer is reachable from the internet</text>

    <rect x="176" y="46" width="464" height="406" rx="12" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="192" y="66" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="start">VPC 10.20.0.0/16</text>

    <g fill="none" stroke="#c9d1db" stroke-width="1.5">
      <rect x="192" y="76" width="432" height="94" rx="8"/>
      <rect x="192" y="182" width="432" height="114" rx="8"/>
      <rect x="192" y="308" width="432" height="132" rx="8"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b" text-anchor="end">
      <text x="616" y="92">public subnet</text>
      <text x="616" y="198">private app subnet</text>
      <text x="616" y="324">isolated data subnet</text>
    </g>

    <rect x="214" y="104" width="170" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="299" y="125" font-size="12.5" font-weight="700" fill="#263e5a">Load balancer</text>
    <text x="299" y="142" font-size="11" fill="#263e5a">443 from anywhere</text>
    <rect x="432" y="104" width="170" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="517" y="125" font-size="12.5" font-weight="700" fill="#263e5a">NAT gateway</text>
    <text x="517" y="142" font-size="11" fill="#263e5a">outbound only</text>

    <rect x="214" y="212" width="170" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="299" y="233" font-size="12.5" font-weight="700" fill="#66400f">API tasks</text>
    <text x="299" y="250" font-size="11" fill="#66400f">3000 from the LB only</text>
    <rect x="432" y="212" width="170" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="517" y="233" font-size="12.5" font-weight="700" fill="#263e5a">Interface endpoint</text>
    <text x="517" y="250" font-size="11" fill="#263e5a">Secrets Manager, 443</text>

    <rect x="214" y="340" width="170" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="299" y="361" font-size="12.5" font-weight="700" fill="#263e5a">Database endpoint</text>
    <text x="299" y="378" font-size="11" fill="#263e5a">PrivateLink, API only</text>
    <rect x="432" y="340" width="170" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="517" y="361" font-size="12.5" font-weight="700" fill="#263e5a">S3 gateway endpoint</text>
    <text x="517" y="378" font-size="11" fill="#263e5a">no internet path</text>

    <rect x="24" y="104" width="136" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="92" y="125" font-size="12.5" font-weight="700" fill="#66400f">Users</text>
    <text x="92" y="142" font-size="11" fill="#66400f">HTTPS</text>
    <rect x="24" y="300" width="136" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="92" y="321" font-size="12.5" font-weight="700" fill="#6e2a24">Attacker</text>
    <text x="92" y="338" font-size="11" fill="#6e2a24">scans the internet</text>
    <g font-size="11" fill="#6e2a24" text-anchor="start">
      <text x="24" y="376">blocked: no public</text>
      <text x="24" y="391">IPs; each SG accepts</text>
      <text x="24" y="406">only the tier in front</text>
    </g>

    <rect x="666" y="104" width="170" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="751" y="125" font-size="12.5" font-weight="700" fill="#463365">Egress filter</text>
    <text x="751" y="142" font-size="11" fill="#463365">domain allowlist</text>
    <rect x="666" y="180" width="134" height="36" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="733" y="203" font-size="12" font-weight="700" fill="#294a2e">Payment API</text>
    <rect x="666" y="232" width="134" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="733" y="255" font-size="12" font-weight="700" fill="#6e2a24">Unknown host</text>
    <text x="733" y="286" font-size="11" fill="#6e2a24">blocked: not on the list</text>
    <rect x="666" y="316" width="170" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="751" y="350" font-size="12.5" font-weight="700" fill="#263e5a">AWS service APIs</text>
    <text x="751" y="367" font-size="11" fill="#263e5a">reached privately</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 129H212" marker-end="url(#tnz-arrow)"/>
      <path d="M299 154V210" marker-end="url(#tnz-arrow)"/>
      <path d="M299 262V338" marker-end="url(#tnz-arrow)"/>
      <path d="M384 230H430" marker-end="url(#tnz-arrow)"/>
      <path d="M370 212V178H517V156" marker-end="url(#tnz-arrow)"/>
      <path d="M602 129H664" marker-end="url(#tnz-arrow)"/>
      <path d="M720 154V178" marker-end="url(#tnz-arrow)"/>
      <path d="M384 248H408V365H430" marker-end="url(#tnz-arrow)"/>
      <path d="M602 237H652V340H664" marker-end="url(#tnz-arrow)"/>
      <path d="M602 372H664" marker-end="url(#tnz-arrow)"/>
    </g>
    <path d="M820 154V250H802" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tnz-arrow-red)"/>
    <g fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M160 316L212 250" marker-end="url(#tnz-arrow-red)"/>
      <path d="M160 336L212 358" marker-end="url(#tnz-arrow-red)"/>
    </g>

    <rect x="184" y="113" width="24" height="14" fill="#f5f7fb"/>
    <text x="196" y="124" font-size="11" fill="#36424e">443</text>
    <g font-size="11" fill="#36424e">
      <text x="318" y="204">3000</text>
      <text x="326" y="290">27017</text>
      <text x="407" y="222">443</text>
    </g>

    <text x="430" y="484" font-size="13" fill="#40566b">Only the load balancer is public; each tier accepts the one in front, and egress is filtered.</text>
  </g>
</svg>
