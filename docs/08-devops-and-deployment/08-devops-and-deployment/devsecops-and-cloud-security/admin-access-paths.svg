<svg xmlns="http://www.w3.org/2000/svg" width="860" height="452" viewBox="0 0 860 452" role="img" aria-labelledby="aap-title aap-desc">
  <title id="aap-title">Three ways to reach a private server: bastion host, Session Manager, and Identity-Aware Proxy</title>
  <desc id="aap-desc">Left, the bastion host, the traditional way: the engineer's SSH client and key connect to a bastion in a public subnet through port 22 opened to office IP ranges, then SSH to the private server's private IP; the drawbacks are an inbound port on the internet, SSH keys to issue and rotate, and an audit trail that lives on the box. Middle, AWS Systems Manager Session Manager: the engineer uses the AWS CLI or console over HTTPS with an IAM role obtained through SSO and MFA; Session Manager checks IAM and relays the session; the server's agent dials out on port 443 and the server has no inbound rules; there are no inbound ports, IAM decides who reaches which server, and sessions are logged centrally. Right, Google Cloud Identity-Aware Proxy TCP forwarding: the engineer uses gcloud with an IAP tunnel over HTTPS with a Google identity and IAM; IAP checks IAM on each request and connects from the range 35.235.240.0/20, which is the only source the VM's firewall allows; the VM needs no external IP, access requires the IAP-Secured Tunnel User role, and access is logged.</desc>
  <defs>
    <marker id="aap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="452" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Three ways to reach a server in a private subnet</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="24" y="42" width="256" height="44" rx="8"/>
      <rect x="302" y="42" width="256" height="44" rx="8"/>
      <rect x="580" y="42" width="256" height="44" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="152" y="61">Bastion host</text>
      <text x="430" y="61">Session Manager</text>
      <text x="708" y="61">Identity-Aware Proxy</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="152" y="78">the traditional way</text>
      <text x="430" y="78">AWS Systems Manager</text>
      <text x="708" y="78">Google Cloud</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="52" y="98" width="200" height="40" rx="8"/>
      <rect x="330" y="98" width="200" height="40" rx="8"/>
      <rect x="608" y="98" width="200" height="40" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#66400f">
      <text x="152" y="115">Engineer</text>
      <text x="430" y="115">Engineer</text>
      <text x="708" y="115">Engineer</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="152" y="131">SSH client and key</text>
      <text x="430" y="131">AWS CLI or console</text>
      <text x="708" y="131">gcloud with IAP tunnel</text>
    </g>

    <rect x="52" y="182" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="152" y="201" font-size="12.5" font-weight="700" fill="#263e5a">Bastion host</text>
    <text x="152" y="217" font-size="11" fill="#263e5a">public subnet</text>
    <rect x="330" y="182" width="200" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="201" font-size="12.5" font-weight="700" fill="#463365">Session Manager</text>
    <text x="430" y="217" font-size="11" fill="#463365">checks IAM, relays</text>
    <rect x="608" y="182" width="200" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="708" y="201" font-size="12.5" font-weight="700" fill="#463365">IAP TCP forwarding</text>
    <text x="708" y="217" font-size="11" fill="#463365">checks IAM per request</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="52" y="270" width="200" height="44" rx="8"/>
      <rect x="330" y="270" width="200" height="44" rx="8"/>
      <rect x="608" y="270" width="200" height="44" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="152" y="289">Private server</text>
      <text x="430" y="289">Private server</text>
      <text x="708" y="289">VM, no external IP</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="152" y="305">accepts SSH from bastion</text>
      <text x="430" y="305">no inbound rules</text>
      <text x="708" y="305">firewall allows IAP range</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M152 138V180" marker-end="url(#aap-arrow)"/>
      <path d="M152 226V268" marker-end="url(#aap-arrow)"/>
      <path d="M430 138V180" marker-end="url(#aap-arrow)"/>
      <path d="M430 270V228" marker-end="url(#aap-arrow)"/>
      <path d="M708 138V180" marker-end="url(#aap-arrow)"/>
      <path d="M708 226V268" marker-end="url(#aap-arrow)"/>
    </g>
    <g fill="#f5f7fb">
      <rect x="66" y="152" width="172" height="15"/>
      <rect x="80" y="240" width="144" height="15"/>
      <rect x="332" y="152" width="196" height="15"/>
      <rect x="356" y="240" width="148" height="15"/>
      <rect x="612" y="152" width="192" height="15"/>
      <rect x="622" y="240" width="172" height="15"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="152" y="163">SSH 22 open to office IPs</text>
      <text x="152" y="251">SSH to the private IP</text>
      <text x="430" y="163">HTTPS, IAM role via SSO + MFA</text>
      <text x="430" y="251">agent dials out on 443</text>
      <text x="708" y="163">HTTPS, Google identity + IAM</text>
      <text x="708" y="251">only from 35.235.240.0/20</text>
    </g>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="42" y="328" width="220" height="24" rx="12"/>
      <rect x="42" y="358" width="220" height="24" rx="12"/>
      <rect x="42" y="388" width="220" height="24" rx="12"/>
    </g>
    <g font-size="11" fill="#6e2a24">
      <text x="152" y="344">inbound port on the internet</text>
      <text x="152" y="374">SSH keys to issue and rotate</text>
      <text x="152" y="404">audit trail lives on the box</text>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="320" y="328" width="220" height="24" rx="12"/>
      <rect x="320" y="358" width="220" height="24" rx="12"/>
      <rect x="320" y="388" width="220" height="24" rx="12"/>
      <rect x="598" y="328" width="220" height="24" rx="12"/>
      <rect x="598" y="358" width="220" height="24" rx="12"/>
      <rect x="598" y="388" width="220" height="24" rx="12"/>
    </g>
    <g font-size="11" fill="#294a2e">
      <text x="430" y="344">no inbound ports at all</text>
      <text x="430" y="374">IAM decides who and where</text>
      <text x="430" y="404">sessions logged centrally</text>
      <text x="708" y="344">no external IP needed</text>
      <text x="708" y="374">IAP-Secured Tunnel User role</text>
      <text x="708" y="404">access logged</text>
    </g>

    <text x="430" y="438" font-size="13" fill="#40566b">Identity-checked tunnels beat open SSH ports: no inbound exposure, no keys, every session logged.</text>
  </g>
</svg>
