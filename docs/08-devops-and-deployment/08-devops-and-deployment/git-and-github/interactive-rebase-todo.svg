<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="irt-title irt-desc">
  <title id="irt-title">An interactive rebase todo list and the commits it produces</title>
  <desc id="irt-desc">Left: the feature branch has four commits, oldest first: a1 Add dueDate field, b2 fix typo, c3 Add tests, and d4 WIP debug logging. Middle: git rebase -i main opens a todo list where the developer writes pick a1, fixup b2, reword c3, and drop d4. Right: the result has two commits. a1 prime, Add dueDate field, now includes the typo fix from b2, whose message is discarded. c3 prime has a rewritten message, test(tasks): cover dueDate. d4 is dropped and does not appear. Below, the available commands: pick keeps a commit, reword edits its message, edit stops to amend it, squash combines it with the previous commit and keeps both messages for editing, fixup combines it and discards its message, drop removes it, and exec runs a shell command.</desc>
  <defs>
    <marker id="irt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="irt-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="140" y="50" font-size="13" font-weight="700" fill="#40566b">feature, oldest first</text>
    <text x="435" y="50" font-size="13" font-weight="700" fill="#40566b">git rebase -i main (todo list)</text>
    <text x="725" y="50" font-size="13" font-weight="700" fill="#40566b">result</text>

    <g stroke-width="1.8">
      <rect x="20" y="80" width="240" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="20" y="124" width="240" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="20" y="168" width="240" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="20" y="212" width="240" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" fill="#66400f" text-anchor="start">
      <text x="34" y="101"><tspan font-weight="700">a1</tspan>  Add dueDate field</text>
      <text x="34" y="145"><tspan font-weight="700">b2</tspan>  fix typo</text>
      <text x="34" y="189"><tspan font-weight="700">c3</tspan>  Add tests</text>
      <text x="34" y="233"><tspan font-weight="700">d4</tspan>  WIP debug logging</text>
    </g>

    <rect x="300" y="70" width="270" height="186" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.8"/>
    <g font-family="Courier New, monospace" font-size="12.5" text-anchor="start">
      <text x="316" y="101" fill="#263e5a"><tspan font-weight="700">pick  </tspan> a1 Add dueDate field</text>
      <text x="316" y="145" fill="#463365"><tspan font-weight="700">fixup </tspan> b2 fix typo</text>
      <text x="316" y="189" fill="#66400f"><tspan font-weight="700">reword</tspan> c3 Add tests</text>
      <text x="316" y="233" fill="#6e2a24"><tspan font-weight="700">drop  </tspan> d4 WIP debug logging</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="1.8" stroke-linecap="round">
      <path d="M260 97H298" marker-end="url(#irt-arrow)"/>
      <path d="M260 141H298" marker-end="url(#irt-arrow)"/>
      <path d="M260 185H298" marker-end="url(#irt-arrow)"/>
      <path d="M260 229H298" marker-end="url(#irt-arrow)"/>
      <path d="M570 97H608" marker-end="url(#irt-arrow)"/>
      <path d="M570 141 608 118" marker-end="url(#irt-arrow)"/>
      <path d="M570 185 608 178" marker-end="url(#irt-arrow)"/>
    </g>
    <path d="M570 229H608" fill="none" stroke="#b5524b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#irt-arrow-red)"/>

    <rect x="610" y="78" width="230" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="725" y="99" font-size="12" font-weight="700" fill="#263e5a">a1' Add dueDate field</text>
    <text x="725" y="117" font-size="11" fill="#263e5a">now includes the b2 typo fix</text>
    <rect x="610" y="152" width="230" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="725" y="173" font-size="12" font-weight="700" fill="#263e5a">c3' test(tasks): cover dueDate</text>
    <text x="725" y="191" font-size="11" fill="#263e5a">message rewritten</text>
    <rect x="610" y="214" width="230" height="30" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="725" y="234" font-size="12" font-weight="700" fill="#6e2a24">d4 dropped: not in the result</text>

    <path d="M24 274H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="40" y="298"><tspan font-weight="700">pick:</tspan> keep</text>
      <text x="160" y="298"><tspan font-weight="700">reword:</tspan> edit the message</text>
      <text x="360" y="298"><tspan font-weight="700">edit:</tspan> stop to amend</text>
      <text x="540" y="298"><tspan font-weight="700">squash:</tspan> combine, keep both messages</text>
      <text x="40" y="318"><tspan font-weight="700">fixup:</tspan> combine, discard its message</text>
      <text x="300" y="318"><tspan font-weight="700">drop:</tspan> remove the commit</text>
      <text x="480" y="318"><tspan font-weight="700">exec:</tspan> run a shell command (for example, tests)</text>
    </g>
    <text x="430" y="350" font-size="13" fill="#40566b">Interactive rebase tidies commits before review; every rewritten commit gets a new hash.</text>
  </g>
</svg>
