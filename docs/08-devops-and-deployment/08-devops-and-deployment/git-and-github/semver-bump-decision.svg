<svg xmlns="http://www.w3.org/2000/svg" width="860" height="486" viewBox="0 0 860 486" role="img" aria-labelledby="sbd-title sbd-desc">
  <title id="sbd-title">Deciding the Semantic Versioning bump for a release</title>
  <desc id="sbd-desc">Starting from the changes since v2.3.1, ask three questions in order. Does any change break the public API, such as a removed field or changed behavior that callers rely on? If yes, bump MAJOR: 2.3.1 becomes 3.0.0, signalled in Conventional Commits by an exclamation mark after the type or a BREAKING CHANGE footer. If not, does any change add backward-compatible functionality? If yes, bump MINOR: 2.3.1 becomes 2.4.0, signalled by a feat commit. If not, does any change fix a bug in a backward-compatible way? If yes, bump PATCH: 2.3.1 becomes 2.3.2, signalled by a fix commit. If none apply, as for docs, test, ci, chore, or refactor commits, no release is needed. Before 1.0.0 the public API is not considered stable.</desc>
  <defs>
    <marker id="sbd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="486" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="150" y="20" width="200" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="43" font-size="13" font-weight="700" fill="#66400f">Changes since v2.3.1</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M250 76 400 120 250 164 100 120z"/>
      <path d="M250 186 400 230 250 274 100 230z"/>
      <path d="M250 296 400 340 250 384 100 340z"/>
    </g>
    <g fill="#463365">
      <text x="250" y="117" font-size="12.5" font-weight="700">Breaks the public API?</text>
      <text x="250" y="134" font-size="11">removed field, changed behavior</text>
      <text x="250" y="227" font-size="12.5" font-weight="700">Adds functionality,</text>
      <text x="250" y="244" font-size="11">backward compatible?</text>
      <text x="250" y="337" font-size="12.5" font-weight="700">Fixes a bug,</text>
      <text x="250" y="354" font-size="11">backward compatible?</text>
    </g>

    <rect x="470" y="92" width="360" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="650" y="114" font-size="13" font-weight="700" fill="#6e2a24">MAJOR: 2.3.1 to 3.0.0</text>
    <text x="650" y="133" font-size="11.5" fill="#6e2a24">feat!: ... or a "BREAKING CHANGE:" footer</text>
    <rect x="470" y="202" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="650" y="224" font-size="13" font-weight="700" fill="#263e5a">MINOR: 2.3.1 to 2.4.0</text>
    <text x="650" y="243" font-size="11.5" fill="#263e5a">feat(tasks): add due dates</text>
    <rect x="470" y="312" width="360" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="650" y="334" font-size="13" font-weight="700" fill="#294a2e">PATCH: 2.3.1 to 2.3.2</text>
    <text x="650" y="353" font-size="11.5" fill="#294a2e">fix(tasks): reject an empty title</text>
    <rect x="100" y="408" width="300" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="427" font-size="13" font-weight="700" fill="#36424e">No release needed</text>
    <text x="250" y="444" font-size="11" fill="#36424e">docs:, test:, ci:, chore:, refactor:</text>
    <rect x="470" y="408" width="360" height="46" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="650" y="427" font-size="11.5" fill="#40566b">Before 1.0.0 (0.y.z) the public API is not stable:</text>
    <text x="650" y="444" font-size="11.5" fill="#40566b">anything may change in any release.</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M250 56V74" marker-end="url(#sbd-arrow)"/>
      <path d="M400 120H468" marker-end="url(#sbd-arrow)"/>
      <path d="M400 230H468" marker-end="url(#sbd-arrow)"/>
      <path d="M400 340H468" marker-end="url(#sbd-arrow)"/>
      <path d="M250 164V184" marker-end="url(#sbd-arrow)"/>
      <path d="M250 274V294" marker-end="url(#sbd-arrow)"/>
      <path d="M250 384V406" marker-end="url(#sbd-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="434" y="112">yes</text>
      <text x="434" y="222">yes</text>
      <text x="434" y="332">yes</text>
      <text x="264" y="179" text-anchor="start">no</text>
      <text x="264" y="289" text-anchor="start">no</text>
      <text x="264" y="400" text-anchor="start">no</text>
    </g>

    <text x="430" y="476" font-size="13" fill="#40566b">Bump the highest part that applies and reset the parts to its right: 3.0.0, 2.4.0, or 2.3.2.</text>
  </g>
</svg>
