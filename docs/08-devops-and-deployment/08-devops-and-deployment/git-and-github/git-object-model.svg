<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="gom-title gom-desc">
  <title id="gom-title">Git objects for two commits and the refs that point to them</title>
  <desc id="gom-desc">Two commits from a small repository. The older commit 7bfe7ed has no parent and points to root tree a657b86. The newer commit c115592 points to root tree 0cb0692 and to its parent 7bfe7ed. HEAD contains ref: refs/heads/main, and refs/heads/main contains c115592. The ref refs/tags/v1.0.0 points to the annotated tag object af18ce9, which points to commit c115592. Each root tree points to a src subtree: 3fb9f4d in the old snapshot and 523ce73 in the new one, which point to blob 7a8bc97 (app.js version 1) and blob dfcefac (app.js version 2). Both root trees point to the same blobs 713d500 for .gitignore and 1e7637d for package.json, because those files did not change: identical content has an identical hash and is stored once.</desc>
  <defs>
    <marker id="gom-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="175" y="76" font-size="11.5" font-style="italic" fill="#40566b">older commit</text>
    <text x="535" y="76" font-size="11.5" font-style="italic" fill="#40566b">newer commit</text>

    <rect x="60" y="86" width="230" height="74" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="175" y="108" font-size="14" font-weight="700" fill="#263e5a">commit 7bfe7ed</text>
    <text x="175" y="127" font-size="11.5" fill="#263e5a">tree a657b86, no parent</text>
    <text x="175" y="145" font-size="11.5" font-style="italic" fill="#263e5a">"Initial commit"</text>

    <rect x="420" y="86" width="230" height="74" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="535" y="108" font-size="14" font-weight="700" fill="#263e5a">commit c115592</text>
    <text x="535" y="127" font-size="11.5" fill="#263e5a">tree 0cb0692, parent 7bfe7ed</text>
    <text x="535" y="145" font-size="11.5" font-style="italic" fill="#263e5a">"Create the Express app"</text>

    <rect x="696" y="20" width="168" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="780" y="39" font-size="14" font-weight="700" fill="#66400f">HEAD</text>
    <text x="780" y="55" font-size="11" fill="#66400f">ref: refs/heads/main</text>
    <rect x="696" y="96" width="168" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="780" y="115" font-size="13" font-weight="700" fill="#66400f">refs/heads/main</text>
    <text x="780" y="131" font-size="11" fill="#66400f">c115592...</text>
    <rect x="696" y="172" width="168" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="780" y="194" font-size="14" font-weight="700" fill="#263e5a">tag af18ce9</text>
    <text x="780" y="212" font-size="11" fill="#263e5a">object c115592, "v1.0.0"</text>
    <rect x="696" y="258" width="168" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="780" y="283" font-size="13" font-weight="700" fill="#66400f">refs/tags/v1.0.0</text>

    <rect x="95" y="206" width="160" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="175" y="226" font-size="14" font-weight="700" fill="#463365">tree a657b86</text>
    <text x="175" y="243" font-size="11.5" fill="#463365">root directory</text>
    <rect x="455" y="206" width="160" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="535" y="226" font-size="14" font-weight="700" fill="#463365">tree 0cb0692</text>
    <text x="535" y="243" font-size="11.5" fill="#463365">root directory</text>

    <rect x="30" y="300" width="150" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="105" y="320" font-size="14" font-weight="700" fill="#463365">tree 3fb9f4d</text>
    <text x="105" y="337" font-size="11.5" fill="#463365">src/</text>
    <rect x="600" y="300" width="150" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="675" y="320" font-size="14" font-weight="700" fill="#463365">tree 523ce73</text>
    <text x="675" y="337" font-size="11.5" fill="#463365">src/</text>

    <rect x="30" y="400" width="150" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="105" y="420" font-size="13" font-weight="700" fill="#36424e">blob 7a8bc97</text>
    <text x="105" y="437" font-size="11.5" fill="#36424e">app.js, version 1</text>
    <rect x="230" y="400" width="150" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="305" y="420" font-size="13" font-weight="700" fill="#294a2e">blob 713d500</text>
    <text x="305" y="437" font-size="11.5" fill="#294a2e">.gitignore</text>
    <rect x="400" y="400" width="150" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="475" y="420" font-size="13" font-weight="700" fill="#294a2e">blob 1e7637d</text>
    <text x="475" y="437" font-size="11.5" fill="#294a2e">package.json</text>
    <rect x="600" y="400" width="150" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="675" y="420" font-size="13" font-weight="700" fill="#36424e">blob dfcefac</text>
    <text x="675" y="437" font-size="11.5" fill="#36424e">app.js, version 2</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M420 123H292" marker-end="url(#gom-arrow)"/>
      <path d="M780 64V94" marker-end="url(#gom-arrow)"/>
      <path d="M696 118H652" marker-end="url(#gom-arrow)"/>
      <path d="M780 258V228" marker-end="url(#gom-arrow)"/>
      <path d="M696 199 654 152" marker-end="url(#gom-arrow)"/>
      <path d="M175 160V204" marker-end="url(#gom-arrow)"/>
      <path d="M535 160V204" marker-end="url(#gom-arrow)"/>
      <path d="M140 252 110 298" marker-end="url(#gom-arrow)"/>
      <path d="M585 252 665 298" marker-end="url(#gom-arrow)"/>
      <path d="M105 346V398" marker-end="url(#gom-arrow)"/>
      <path d="M675 346V398" marker-end="url(#gom-arrow)"/>
    </g>
    <g fill="none" stroke="#53845b" stroke-width="1.8" stroke-linecap="round">
      <path d="M190 252 295 398" marker-end="url(#gom-arrow)"/>
      <path d="M215 252 462 398" marker-end="url(#gom-arrow)"/>
      <path d="M510 252 320 398" marker-end="url(#gom-arrow)"/>
      <path d="M540 252 488 398" marker-end="url(#gom-arrow)"/>
    </g>
    <rect x="326" y="108" width="60" height="14" fill="#f5f7fb"/>
    <text x="356" y="118" font-size="11" font-style="italic" fill="#40566b">parent</text>

    <text x="390" y="466" font-size="11.5" font-style="italic" fill="#294a2e">unchanged files: both trees point to the same blob, stored once</text>
    <text x="440" y="490" font-size="13" fill="#40566b">Each commit is a full snapshot (a tree), yet unchanged content is shared by hash, not copied.</text>
  </g>
</svg>
