<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="ffm-title ffm-desc">
  <title id="ffm-title">Fast-forward merge compared with a three-way merge</title>
  <desc id="ffm-desc">Left, fast-forward: main points at B and feature points at D, with C and D built directly on B, so main has not moved since the branch started. After git merge feature, main simply moves forward to D; no new commit is created and history stays linear. Right, three-way merge: main moved on to C while feature added D and E, both starting from B. B is the merge base. Git compares the base B with ours (C) and with theirs (E), takes changes made on only one side, reports a conflict where both sides changed the same lines, and records merge commit M with two parents, C and E. main moves to M.</desc>
  <defs>
    <marker id="ffm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="400" height="320" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="440" y="20" width="400" height="320" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="220" y="46" font-size="14" font-weight="700" fill="#294a2e">Fast-forward: main has not moved</text>
    <text x="640" y="46" font-size="14" font-weight="700" fill="#463365">Three-way merge: both sides moved</text>

    <text x="36" y="84" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">Before</text>
    <g fill="none" stroke="#40566b" stroke-width="1.8">
      <path d="M124 110H90" marker-end="url(#ffm-arrow)"/>
      <path d="M194 110H160" marker-end="url(#ffm-arrow)"/>
      <path d="M264 110H230" marker-end="url(#ffm-arrow)"/>
      <path d="M124 230H90" marker-end="url(#ffm-arrow)"/>
      <path d="M194 230H160" marker-end="url(#ffm-arrow)"/>
      <path d="M264 230H230" marker-end="url(#ffm-arrow)"/>
    </g>
    <g stroke-width="2">
      <circle cx="72" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="142" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="212" cy="110" r="16" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="282" cy="110" r="16" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="72" cy="230" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="142" cy="230" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="212" cy="230" r="16" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="282" cy="230" r="16" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="72" y="114">A</text><text x="142" y="114">B</text>
      <text x="212" y="114" fill="#66400f">C</text><text x="282" y="114" fill="#66400f">D</text>
      <text x="72" y="234">A</text><text x="142" y="234">B</text>
      <text x="212" y="234" fill="#66400f">C</text><text x="282" y="234" fill="#66400f">D</text>
    </g>
    <g font-size="11" font-weight="700">
      <rect x="120" y="134" width="44" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="142" y="148" fill="#263e5a">main</text>
      <rect x="252" y="134" width="60" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="282" y="148" fill="#66400f">feature</text>
      <rect x="260" y="254" width="44" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="282" y="268" fill="#263e5a">main</text>
      <rect x="252" y="278" width="60" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="282" y="292" fill="#66400f">feature</text>
    </g>
    <text x="36" y="196" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">After git merge feature</text>
    <text x="318" y="114" font-size="11" fill="#36424e" text-anchor="start">C, D built on B</text>
    <text x="318" y="268" font-size="11" font-weight="700" fill="#294a2e" text-anchor="start">main: B to D</text>
    <text x="220" y="324" font-size="11.5" font-style="italic" fill="#294a2e">No new commit: the main pointer just moves to D.</text>

    <g fill="none" stroke="#40566b" stroke-width="1.8">
      <path d="M546 120H508" marker-end="url(#ffm-arrow)"/>
      <path d="M634 120H582" marker-end="url(#ffm-arrow)"/>
      <path d="M776 120H670" marker-end="url(#ffm-arrow)"/>
      <path d="M636 200 578 133" marker-end="url(#ffm-arrow)"/>
      <path d="M706 210H670" marker-end="url(#ffm-arrow)"/>
      <path d="M782 134 736 197" marker-end="url(#ffm-arrow)"/>
    </g>
    <circle cx="564" cy="120" r="23" fill="none" stroke="#53845b" stroke-width="2" stroke-dasharray="4 3"/>
    <g stroke-width="2">
      <circle cx="490" cy="120" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="564" cy="120" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="652" cy="120" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="794" cy="120" r="16" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="652" cy="210" r="16" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="724" cy="210" r="16" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="490" y="124">A</text><text x="564" y="124">B</text><text x="652" y="124">C</text>
      <text x="794" y="124" fill="#463365">M</text>
      <text x="652" y="214" fill="#66400f">D</text><text x="724" y="214" fill="#66400f">E</text>
    </g>
    <text x="564" y="86" font-size="11" font-weight="700" fill="#294a2e">merge base</text>
    <text x="652" y="94" font-size="11" font-weight="700" fill="#263e5a">ours</text>
    <text x="724" y="246" font-size="11" font-weight="700" fill="#66400f">theirs</text>
    <rect x="772" y="66" width="44" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="794" y="80" font-size="11" font-weight="700" fill="#263e5a">main</text>
    <path d="M794 86V102" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#ffm-arrow)"/>
    <rect x="621" y="236" width="60" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="651" y="250" font-size="11" font-weight="700" fill="#66400f">feature</text>
    <text x="766" y="104" font-size="11" fill="#463365" text-anchor="end">2 parents</text>
    <g font-size="11.5" fill="#36424e">
      <text x="640" y="288">Git diffs base B against C (ours) and against E (theirs).</text>
      <text x="640" y="305">One-sided changes are taken; overlapping edits conflict.</text>
      <text x="640" y="324" font-style="italic" fill="#463365">Result: merge commit M with parents C and E.</text>
    </g>

    <text x="430" y="372" font-size="13" fill="#40566b">A fast-forward only moves a pointer; a three-way merge creates a new commit with two parents.</text>
  </g>
</svg>
