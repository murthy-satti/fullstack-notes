<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="gcd-title gcd-desc">
  <title id="gcd-title">The commit graph with branch, tag, remote-tracking, and HEAD pointers</title>
  <desc id="gcd-desc">Six commits form a directed acyclic graph in which every arrow points from a commit to its parent. On main, A is the root commit, B's parent is A, and C's parent is B. A feature branch started at B: D's parent is B and E's parent is D. Merge commit M has two parents, C and E. Labels point at commits: the tag v1.0.0 points at B, the remote-tracking branch origin/main points at C because that is where main was on GitHub at the last fetch, the branch main points at M, HEAD points at main, and the branch feature/due-dates points at E. Time runs from older commits on the left to newer commits on the right.</desc>
  <defs>
    <marker id="gcd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Arrows point from each commit to its parent(s)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M198 190H114" marker-end="url(#gcd-arrow)"/>
      <path d="M328 190H244" marker-end="url(#gcd-arrow)"/>
      <path d="M588 190H374" marker-end="url(#gcd-arrow)"/>
      <path d="M332 275 239 205" marker-end="url(#gcd-arrow)"/>
      <path d="M458 290H374" marker-end="url(#gcd-arrow)"/>
      <path d="M594 206 499 275" marker-end="url(#gcd-arrow)"/>
    </g>

    <g stroke="#4774aa" stroke-width="2" fill="#e5efff">
      <circle cx="90" cy="190" r="22"/>
      <circle cx="220" cy="190" r="22"/>
      <circle cx="350" cy="190" r="22"/>
      <circle cx="350" cy="290" r="22"/>
      <circle cx="480" cy="290" r="22"/>
      <circle cx="610" cy="190" r="22"/>
    </g>
    <g font-size="14" font-weight="700" fill="#263e5a">
      <text x="90" y="195">A</text>
      <text x="220" y="195">B</text>
      <text x="350" y="195">C</text>
      <text x="350" y="295">D</text>
      <text x="480" y="295">E</text>
      <text x="610" y="195">M</text>
    </g>
    <g font-size="11" font-style="italic" fill="#36424e">
      <text x="90" y="230">root commit</text>
      <text x="220" y="230">add tasks API</text>
      <text x="350" y="230">fix pagination</text>
      <text x="350" y="330">add dueDate</text>
      <text x="480" y="330">test dueDate</text>
    </g>
    <text x="640" y="214" font-size="11" font-style="italic" fill="#36424e" text-anchor="start">merge commit: parents C and E</text>

    <rect x="180" y="118" width="80" height="26" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="220" y="135" font-size="12" font-weight="700" fill="#463365">v1.0.0</text>
    <rect x="300" y="118" width="100" height="26" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="350" y="135" font-size="12" font-weight="700" fill="#263e5a">origin/main</text>
    <rect x="575" y="118" width="70" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="610" y="135" font-size="12" font-weight="700" fill="#66400f">main</text>
    <rect x="575" y="62" width="70" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="610" y="79" font-size="12" font-weight="700" fill="#66400f">HEAD</text>
    <rect x="540" y="277" width="150" height="26" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="615" y="294" font-size="12" font-weight="700" fill="#66400f">feature/due-dates</text>

    <g fill="none" stroke="#40566b" stroke-width="1.5" stroke-linecap="round">
      <path d="M220 144V166" marker-end="url(#gcd-arrow)"/>
      <path d="M350 144V166" marker-end="url(#gcd-arrow)"/>
      <path d="M610 144V166" marker-end="url(#gcd-arrow)"/>
      <path d="M610 88V116" marker-end="url(#gcd-arrow)"/>
      <path d="M540 290H504" marker-end="url(#gcd-arrow)"/>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="start">
      <text x="660" y="79">HEAD -&gt; main: you are on main</text>
      <text x="410" y="122">where main was on GitHub</text>
      <text x="410" y="137">at the last fetch</text>
    </g>

    <path d="M90 362H700" fill="none" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#gcd-arrow)"/>
    <rect x="320" y="354" width="150" height="16" fill="#f5f7fb"/>
    <text x="395" y="366" font-size="11" fill="#40566b">older to newer</text>

    <text x="430" y="396" font-size="13" fill="#40566b">Commits form a graph back to the root; branches, tags, and HEAD are only labels on commits.</text>
  </g>
</svg>
