<svg xmlns="http://www.w3.org/2000/svg" width="860" height="414" viewBox="0 0 860 414" role="img" aria-labelledby="dof-title dof-desc">
  <title id="dof-title">Why deleting an open log file does not free disk space</title>
  <desc id="dof-desc">Before: the directory /var/log/taskflow has an entry api.log that points to inode 4711, which holds 8.2 GB of data blocks; the node process with PID 4123 has the same inode open as file descriptor 3 and keeps appending. Someone runs rm api.log: the directory entry disappears, so the inode's link count drops to 0, but the process still holds file descriptor 3, so the inode and its blocks stay allocated and keep growing. du adds up the files it can find by name and reports about 1 GB for /var/log, while df counts allocated blocks and reports the disk as 97 percent full. lsof +L1 lists the deleted file still held open by PID 4123. Space comes back when the last descriptor closes: restart or signal the process to reopen its logs, or truncate the file through /proc/4123/fd/3.</desc>
  <defs>
    <marker id="dof-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="dof-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="414" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">After rm /var/log/taskflow/api.log while the app still writes to it</text>

    <rect x="24" y="60" width="220" height="120" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="134" y="82" font-size="13" font-weight="700" fill="#263e5a">/var/log/taskflow/</text>
    <rect x="44" y="96" width="180" height="30" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="134" y="116" font-size="12" fill="#6e2a24">api.log (entry removed)</text>
    <path d="M60 111H208" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="44" y="136" width="180" height="30" rx="6" fill="#ffffff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="134" y="156" font-size="12" fill="#263e5a">api.log.1 (900 MB)</text>

    <rect x="330" y="60" width="200" height="120" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="84" font-size="13" font-weight="700" fill="#463365">inode 4711</text>
    <g font-size="11.5" fill="#463365">
      <text x="430" y="106">link count: 0</text>
      <text x="430" y="124">8.2 GB of data blocks</text>
      <text x="430" y="142">still allocated, still growing</text>
      <text x="430" y="160">freed when the last fd closes</text>
    </g>

    <rect x="616" y="60" width="220" height="120" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="726" y="84" font-size="13" font-weight="700" fill="#66400f">node, PID 4123</text>
    <g font-size="11.5" fill="#66400f">
      <text x="726" y="106">fd 3 opened before the rm</text>
      <text x="726" y="124">keeps appending log lines</text>
      <text x="726" y="142">ls -l /proc/4123/fd/3 shows</text>
      <text x="726" y="160">"api.log (deleted)"</text>
    </g>

    <path d="M246 111H328" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#dof-arrow-red)"/>
    <rect x="252" y="90" width="70" height="14" fill="#f5f7fb"/>
    <text x="287" y="101" font-size="11" fill="#6e2a24">name gone</text>
    <path d="M614 120H532" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#dof-arrow)"/>
    <rect x="538" y="98" width="70" height="14" fill="#f5f7fb"/>
    <text x="573" y="109" font-size="11" fill="#36424e">fd 3</text>

    <rect x="24" y="210" width="396" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="222" y="234" font-size="13" font-weight="700" fill="#263e5a">du -sh /var/log  =  about 1 GB</text>
    <text x="222" y="256" font-size="11.5" fill="#263e5a">du walks directory entries,</text>
    <text x="222" y="274" font-size="11.5" fill="#263e5a">so it cannot see a file without a name</text>
    <rect x="440" y="210" width="396" height="80" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="638" y="234" font-size="13" font-weight="700" fill="#6e2a24">df -h /  =  97% used</text>
    <text x="638" y="256" font-size="11.5" fill="#6e2a24">df asks the file system how many blocks</text>
    <text x="638" y="274" font-size="11.5" fill="#6e2a24">are allocated, including inode 4711</text>

    <rect x="24" y="306" width="812" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="12" fill="#294a2e">
      <text x="430" y="326" font-weight="700">Find it: sudo lsof +L1</text>
      <text x="430" y="344">Fix it: restart the process or make it reopen its log, or truncate through /proc/4123/fd/3</text>
      <text x="430" y="361">Prevent it: log to stdout (journald) or rotate with logrotate, never with a bare rm</text>
    </g>

    <text x="430" y="398" font-size="13" fill="#40566b">A file's blocks are freed when its last name is removed and its last open descriptor is closed.</text>
  </g>
</svg>
