<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="csa-title csa-desc">
  <title id="csa-title">Anatomy of a cron line</title>
  <desc id="csa-desc">The line 30 2 * * 1-5 taskflow report.sh has seven parts: minute 30 (0 to 59), hour 2 (0 to 23), day of month * (1 to 31), month * (1 to 12 or jan to dec), day of week 1-5 (0 to 7, where 0 and 7 are Sunday), the user taskflow (a sixth field that exists only in /etc/crontab and /etc/cron.d files), and the command, run by /bin/sh. It means 02:30 on Monday to Friday in the server's time zone, the same as the systemd calendar expression Mon..Fri *-*-* 02:30:00. Examples: */15 * * * * runs every 15 minutes; 0 */6 * * * runs at 00:00, 06:00, 12:00 and 18:00; 0 3 1 * * runs at 03:00 on the first of each month. Two traps: 0 0 13 * 5 runs on the 13th and also on every Friday, because when both day fields are restricted either one matching is enough; and a percent sign in the command, as in date +%F, must be escaped as backslash percent, because cron turns an unescaped percent into a newline.</desc>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="50" y="40" width="80" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="160" y="40" width="80" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="270" y="40" width="80" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="380" y="40" width="80" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="490" y="40" width="80" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="605" y="40" width="90" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="720" y="40" width="116" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="20" font-weight="700" fill="#263e5a">
      <text x="90" y="72">30</text>
      <text x="200" y="72">2</text>
      <text x="310" y="72">*</text>
      <text x="420" y="72">*</text>
      <text x="530" y="72">1-5</text>
    </g>
    <text x="650" y="70" font-size="14" font-weight="700" fill="#463365">taskflow</text>
    <text x="778" y="70" font-size="14" font-weight="700" fill="#66400f">report.sh</text>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="90" y="112">minute</text>
      <text x="200" y="112">hour</text>
      <text x="310" y="112">day of month</text>
      <text x="420" y="112">month</text>
      <text x="530" y="112">day of week</text>
      <text x="650" y="112">user</text>
      <text x="778" y="112">command</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="90" y="128">0-59</text>
      <text x="200" y="128">0-23</text>
      <text x="310" y="128">1-31</text>
      <text x="420" y="128">1-12, jan-dec</text>
      <text x="530" y="128">0-7, 0 or 7 = Sun</text>
      <text x="650" y="128">system crontabs</text>
      <text x="778" y="128">run by /bin/sh</text>
    </g>

    <rect x="50" y="146" width="786" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="443" y="168" font-size="12.5" font-weight="700" fill="#294a2e">= 02:30 Monday to Friday, server time zone   (systemd: OnCalendar=Mon..Fri *-*-* 02:30:00)</text>

    <path d="M24 198H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="12" text-anchor="start">
      <text x="50" y="226" font-weight="700" fill="#263e5a">*/15 * * * *</text>
      <text x="250" y="226" fill="#36424e">every 15 minutes</text>
      <text x="50" y="252" font-weight="700" fill="#263e5a">0 */6 * * *</text>
      <text x="250" y="252" fill="#36424e">at 00:00, 06:00, 12:00, and 18:00</text>
      <text x="50" y="278" font-weight="700" fill="#263e5a">0 3 1 * *</text>
      <text x="250" y="278" fill="#36424e">03:00 on the first day of every month</text>
      <text x="50" y="304" font-weight="700" fill="#6e2a24">0 0 13 * 5</text>
      <text x="250" y="304" fill="#6e2a24">trap: the 13th AND every Friday (either day field matching is enough)</text>
      <text x="50" y="330" font-weight="700" fill="#6e2a24">... date +%F</text>
      <text x="250" y="330" fill="#6e2a24">trap: an unescaped % ends the command; write \% in crontabs</text>
    </g>

    <text x="430" y="378" font-size="13" fill="#40566b">Five time fields, then (in system crontabs) a user, then a command for /bin/sh.</text>
  </g>
</svg>
