<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="sss-title sss-desc">
  <title id="sss-title">The order of steps when setting up a fresh server</title>
  <desc id="sss-desc">Fourteen steps in a snake-shaped path. Row one, left to right: 1 update packages with apt-get upgrade; 2 create an admin user with sudo and an SSH key; 3 test the key login from a second terminal; 4 harden SSH with keys only and no root; 5 configure the firewall, allowing SSH first. Steps 3, 4 and 5 are marked as lockout risks. Row two, right to left: 6 automatic security updates with unattended-upgrades; 7 time sync with chrony and NTS; 8 a swap file with mkswap --file; 9 fail2ban with the sshd jail on; 10 Node.js 24 from the NodeSource apt repository. Row three, left to right: 11 the taskflow app user with no shell; 12 config and secret files, mode 0600 and root-owned; 13 backups and a snapshot; 14 audit and record the baseline. A legend marks lockout risks in red, system baseline steps in blue, application steps in orange, and verification in green.</desc>
  <defs>
    <marker id="sss-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">A fresh Ubuntu 26.04 LTS VPS, from first login to a recorded baseline</text>

    <g stroke-width="2">
      <rect x="24" y="56" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="194" y="56" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="364" y="56" width="150" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="534" y="56" width="150" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="704" y="56" width="150" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="704" y="150" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="534" y="150" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="364" y="150" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="194" y="150" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="24" y="150" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="244" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="194" y="244" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="364" y="244" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="534" y="244" width="150" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>

    <g font-size="12.5" font-weight="700">
      <text x="99" y="79" fill="#263e5a">1. Update</text>
      <text x="269" y="79" fill="#263e5a">2. Admin user</text>
      <text x="439" y="79" fill="#6e2a24">3. Test key login</text>
      <text x="609" y="79" fill="#6e2a24">4. Harden SSH</text>
      <text x="779" y="79" fill="#6e2a24">5. Firewall</text>
      <text x="779" y="173" fill="#263e5a">6. Auto updates</text>
      <text x="609" y="173" fill="#263e5a">7. Time sync</text>
      <text x="439" y="173" fill="#263e5a">8. Swap file</text>
      <text x="269" y="173" fill="#263e5a">9. fail2ban</text>
      <text x="99" y="173" fill="#66400f">10. Node.js 24</text>
      <text x="99" y="267" fill="#66400f">11. App user</text>
      <text x="269" y="267" fill="#66400f">12. Config files</text>
      <text x="439" y="267" fill="#263e5a">13. Backups</text>
      <text x="609" y="267" fill="#294a2e">14. Audit</text>
    </g>
    <g font-size="11">
      <text x="99" y="98" fill="#263e5a">apt-get upgrade</text>
      <text x="269" y="98" fill="#263e5a">sudo + SSH key</text>
      <text x="439" y="98" fill="#6e2a24">second terminal</text>
      <text x="609" y="98" fill="#6e2a24">keys only, no root</text>
      <text x="779" y="98" fill="#6e2a24">allow SSH first</text>
      <text x="779" y="192" fill="#263e5a">unattended-upgrades</text>
      <text x="609" y="192" fill="#263e5a">chrony with NTS</text>
      <text x="439" y="192" fill="#263e5a">mkswap --file</text>
      <text x="269" y="192" fill="#263e5a">sshd jail on</text>
      <text x="99" y="192" fill="#66400f">NodeSource apt</text>
      <text x="99" y="286" fill="#66400f">taskflow, no shell</text>
      <text x="269" y="286" fill="#66400f">0600, root-owned</text>
      <text x="439" y="286" fill="#263e5a">snapshot + dumps</text>
      <text x="609" y="286" fill="#294a2e">record the baseline</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 84H192" marker-end="url(#sss-arrow)"/>
      <path d="M344 84H362" marker-end="url(#sss-arrow)"/>
      <path d="M514 84H532" marker-end="url(#sss-arrow)"/>
      <path d="M684 84H702" marker-end="url(#sss-arrow)"/>
      <path d="M779 112V148" marker-end="url(#sss-arrow)"/>
      <path d="M704 178H686" marker-end="url(#sss-arrow)"/>
      <path d="M534 178H516" marker-end="url(#sss-arrow)"/>
      <path d="M364 178H346" marker-end="url(#sss-arrow)"/>
      <path d="M194 178H176" marker-end="url(#sss-arrow)"/>
      <path d="M99 206V242" marker-end="url(#sss-arrow)"/>
      <path d="M174 272H192" marker-end="url(#sss-arrow)"/>
      <path d="M344 272H362" marker-end="url(#sss-arrow)"/>
      <path d="M514 272H532" marker-end="url(#sss-arrow)"/>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <rect x="24" y="328" width="18" height="14" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
      <text x="50" y="340">lockout risk: keep a second session open</text>
      <rect x="320" y="328" width="18" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="346" y="340">system baseline</text>
      <rect x="470" y="328" width="18" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="496" y="340">application</text>
      <rect x="600" y="328" width="18" height="14" rx="3" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="626" y="340">verification</text>
    </g>

    <text x="440" y="392" font-size="13" fill="#40566b">Do the access steps first and carefully; everything after them is repeatable configuration.</text>
  </g>
</svg>
