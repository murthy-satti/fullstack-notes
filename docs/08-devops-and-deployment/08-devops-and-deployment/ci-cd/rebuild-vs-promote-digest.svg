<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="rvp-title rvp-desc">
  <title id="rvp-title">Rebuilding per environment compared with promoting one digest</title>
  <desc id="rvp-desc">Left, the anti-pattern: the same commit a1b2c3d is built separately for each environment. The staging build on Monday resolves dependency lib 4.1.0 on base image node:24-slim from that week and produces digest sha256:aa11. The production build on Thursday runs again; a new patch release lib 4.2.0 and an updated base image are picked up, producing a different digest sha256:bb22. Staging tested aa11, but production runs bb22, which was never tested. Right, the recommended approach: commit a1b2c3d is built once into digest sha256:9f2c. Staging deploys sha256:9f2c and tests it; production deploys the same sha256:9f2c after approval. What was tested is exactly what runs, and rollback means redeploying a previous digest.</desc>
  <defs>
    <marker id="rvp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="410" height="330" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="450" y="20" width="410" height="330" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="225" y="46" font-size="14" font-weight="700" fill="#6e2a24">Anti-pattern: rebuild per environment</text>
    <text x="655" y="46" font-size="14" font-weight="700" fill="#294a2e">Build once, promote by digest</text>

    <rect x="135" y="64" width="180" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="225" y="89" font-size="12.5" font-weight="700" fill="#66400f">commit a1b2c3d</text>
    <rect x="40" y="140" width="170" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="125" y="161" font-size="12" font-weight="700" fill="#463365">build for staging (Mon)</text>
    <text x="125" y="178" font-size="11" fill="#463365">lib 4.1.0, base image v1</text>
    <text x="125" y="194" font-size="11" font-weight="700" fill="#463365">sha256:aa11</text>
    <rect x="240" y="140" width="170" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="325" y="161" font-size="12" font-weight="700" fill="#463365">build for prod (Thu)</text>
    <text x="325" y="178" font-size="11" fill="#463365">lib 4.2.0, base image v2</text>
    <text x="325" y="194" font-size="11" font-weight="700" fill="#463365">sha256:bb22</text>
    <rect x="40" y="240" width="170" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="125" y="261" font-size="12.5" font-weight="700" fill="#263e5a">staging</text>
    <text x="125" y="278" font-size="11" fill="#263e5a">tested aa11</text>
    <rect x="240" y="240" width="170" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="325" y="261" font-size="12.5" font-weight="700" fill="#6e2a24">production</text>
    <text x="325" y="278" font-size="11" fill="#6e2a24">runs bb22, never tested</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M190 104 140 138" marker-end="url(#rvp-arrow)"/>
      <path d="M260 104 310 138" marker-end="url(#rvp-arrow)"/>
      <path d="M125 204V238" marker-end="url(#rvp-arrow)"/>
      <path d="M325 204V238" marker-end="url(#rvp-arrow)"/>
    </g>
    <text x="225" y="320" font-size="11.5" fill="#6e2a24">same commit, two different artifacts:</text>
    <text x="225" y="336" font-size="11.5" fill="#6e2a24">the tested bits are not the shipped bits</text>

    <rect x="565" y="64" width="180" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="655" y="89" font-size="12.5" font-weight="700" fill="#66400f">commit a1b2c3d</text>
    <rect x="555" y="140" width="200" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="655" y="161" font-size="12" font-weight="700" fill="#463365">build once (Mon)</text>
    <text x="655" y="178" font-size="11" fill="#463365">pushed to the registry</text>
    <text x="655" y="194" font-size="11" font-weight="700" fill="#463365">sha256:9f2c</text>
    <rect x="470" y="240" width="170" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="555" y="261" font-size="12.5" font-weight="700" fill="#263e5a">staging</text>
    <text x="555" y="278" font-size="11" fill="#263e5a">deploys and tests 9f2c</text>
    <rect x="670" y="240" width="170" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="755" y="261" font-size="12.5" font-weight="700" fill="#294a2e">production</text>
    <text x="755" y="278" font-size="11" fill="#294a2e">deploys the same 9f2c</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M655 104V138" marker-end="url(#rvp-arrow)"/>
      <path d="M620 204 570 238" marker-end="url(#rvp-arrow)"/>
      <path d="M690 204 740 238" marker-end="url(#rvp-arrow)"/>
    </g>
    <text x="655" y="320" font-size="11.5" fill="#294a2e">what was tested is exactly what runs;</text>
    <text x="655" y="336" font-size="11.5" fill="#294a2e">rollback = redeploy the previous digest</text>

    <text x="440" y="382" font-size="13" fill="#40566b">Tags and branches can move; a digest is a hash of the image itself, so it cannot.</text>
    <text x="440" y="402" font-size="11.5" fill="#40566b">Pin deployments to digests, keep tags as human-friendly labels.</text>
  </g>
</svg>
