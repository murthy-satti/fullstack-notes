<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="cfl-title cfl-desc">
  <title id="cfl-title">The continuous integration feedback loop</title>
  <desc id="cfl-desc">A developer makes a small change worth hours of work, not days, and pushes it or opens a pull request, which triggers CI. CI builds the code and runs the tests, with a target of about ten minutes. If the result is green, the change merges into main at least daily, and the main build verifies that the integrated result is still green; then the developer starts the next small change, repeating the loop many times a day. If the result is red, the author fixes the problem or reverts the change within minutes, with main's health taking priority, and the loop restarts. Four practices support the loop: everyone integrates into main at least daily, every push triggers a build, broken builds are fixed immediately, and the build is kept fast.</desc>
  <defs>
    <marker id="cfl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cfl-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="cfl-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <path d="M807 150V96H79V148" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#cfl-arrow-ret)"/>
    <rect x="300" y="86" width="260" height="18" fill="#f5f7fb"/>
    <text x="430" y="99" font-size="12" font-style="italic" fill="#40566b">next small change: many loops per day</text>

    <rect x="16" y="150" width="126" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="79" y="175" font-size="13" font-weight="700" fill="#66400f">Small change</text>
    <text x="79" y="193" font-size="11" fill="#66400f">hours, not days</text>
    <rect x="166" y="150" width="116" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="224" y="175" font-size="13" font-weight="700" fill="#66400f">Push or PR</text>
    <text x="224" y="193" font-size="11" fill="#66400f">triggers CI</text>
    <rect x="306" y="150" width="150" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="381" y="175" font-size="13" font-weight="700" fill="#463365">Build and test</text>
    <text x="381" y="193" font-size="11" fill="#463365">target about 10 minutes</text>
    <path d="M530 140 576 180 530 220 484 180z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="530" y="185" font-size="13" font-weight="700" fill="#36424e">green?</text>
    <rect x="606" y="150" width="120" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="666" y="175" font-size="13" font-weight="700" fill="#294a2e">Merge to main</text>
    <text x="666" y="193" font-size="11" fill="#294a2e">at least daily</text>
    <rect x="750" y="150" width="114" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="807" y="175" font-size="13" font-weight="700" fill="#263e5a">main build</text>
    <text x="807" y="193" font-size="11" fill="#263e5a">still green</text>

    <rect x="450" y="268" width="160" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="530" y="289" font-size="13" font-weight="700" fill="#6e2a24">Fix or revert</text>
    <text x="530" y="306" font-size="11" fill="#6e2a24">within minutes</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M142 180H164" marker-end="url(#cfl-arrow)"/>
      <path d="M282 180H304" marker-end="url(#cfl-arrow)"/>
      <path d="M456 180H482" marker-end="url(#cfl-arrow)"/>
      <path d="M576 180H604" marker-end="url(#cfl-arrow)"/>
      <path d="M726 180H748" marker-end="url(#cfl-arrow)"/>
    </g>
    <path d="M530 220V266" fill="none" stroke="#b5524b" stroke-width="2" marker-end="url(#cfl-arrow-red)"/>
    <path d="M450 293H79V212" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#cfl-arrow-red)"/>
    <g font-size="11.5" font-weight="700">
      <text x="590" y="172" fill="#294a2e">yes</text>
      <text x="544" y="246" fill="#6e2a24" text-anchor="start">no</text>
    </g>
    <text x="260" y="286" font-size="11" font-style="italic" fill="#6e2a24">a red main blocks everyone: it is the top priority</text>

    <g font-size="11.5" font-weight="700" fill="#463365">
      <rect x="16" y="334" width="196" height="26" rx="13" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="114" y="351">integrate at least daily</text>
      <rect x="228" y="334" width="196" height="26" rx="13" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="326" y="351">every push builds</text>
      <rect x="440" y="334" width="210" height="26" rx="13" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="545" y="351">fix broken builds first</text>
      <rect x="666" y="334" width="198" height="26" rx="13" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="765" y="351">keep the build fast</text>
    </g>
    <text x="440" y="386" font-size="13" fill="#40566b">Small batches plus fast feedback: problems are found minutes after they are made, while they are cheap.</text>
  </g>
</svg>
