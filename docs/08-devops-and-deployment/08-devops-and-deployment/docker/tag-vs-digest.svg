<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="tvd-title tvd-desc">
  <title id="tvd-title">A moving tag compared with a pinned digest</title>
  <desc id="tvd-desc">In the registry, the tag 1.4 pointed to image A (sha256:3e7a...) on day 1. On day 5, CI rebuilt the image with a patched base and pushed image B (sha256:b81c...) under the same tag, so the tag moved to B. Deploy by tag: a deployment that references taskflow-api:1.4 started node 1 on day 1, which pulled image A; a scale-out on day 5 started node 2, which pulled image B. Two different versions now run behind one name, B was never tested in this release, and rolling back to 1.4 is ambiguous. Deploy by digest: a deployment that references taskflow-api@sha256:3e7a... runs image A on node 1 on day 1 and on node 2 on day 5. Every node runs the tested image, and a new version requires a new reference committed to Git.</desc>
  <defs>
    <marker id="tvd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="tvd-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="812" height="116" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="36" y="42" font-size="12.5" font-weight="700" fill="#36424e" text-anchor="start">Registry: ghcr.io/example/taskflow-api</text>

    <rect x="120" y="62" width="180" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="210" y="84" font-size="13" font-weight="700" fill="#263e5a">image A</text>
    <text x="210" y="102" font-size="11.5" fill="#263e5a">sha256:3e7a...</text>
    <rect x="390" y="73" width="80" height="30" rx="15" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="93" font-size="12.5" font-weight="700" fill="#66400f">tag 1.4</text>
    <rect x="560" y="62" width="180" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="650" y="84" font-size="13" font-weight="700" fill="#263e5a">image B (rebuilt)</text>
    <text x="650" y="102" font-size="11.5" fill="#263e5a">sha256:b81c...</text>

    <path d="M390 88H302" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tvd-arrow-ret)"/>
    <path d="M470 88H558" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#tvd-arrow)"/>
    <text x="346" y="80" font-size="11.5" fill="#40566b">day 1</text>
    <text x="514" y="80" font-size="11.5" font-weight="700" fill="#40566b">day 5</text>
    <text x="430" y="126" font-size="11" fill="#36424e">the same tag now names different bytes</text>

    <text x="24" y="166" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Deploy by tag: image: ghcr.io/example/taskflow-api:1.4</text>
    <rect x="24" y="178" width="240" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="144" y="197" font-size="12.5" font-weight="700" fill="#36424e">node 1, day 1</text>
    <text x="144" y="214" font-size="11.5" fill="#36424e">pulls image A</text>
    <rect x="288" y="178" width="240" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="408" y="197" font-size="12.5" font-weight="700" fill="#36424e">node 2, day 5 (scale-out)</text>
    <text x="408" y="214" font-size="11.5" fill="#36424e">pulls image B</text>
    <rect x="552" y="178" width="284" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="694" y="197" font-size="12.5" font-weight="700" fill="#6e2a24">two versions behind one name</text>
    <text x="694" y="214" font-size="11.5" fill="#6e2a24">untested bytes; rollback is ambiguous</text>

    <text x="24" y="258" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Deploy by digest: image: ghcr.io/example/taskflow-api@sha256:3e7a...</text>
    <rect x="24" y="270" width="240" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="144" y="289" font-size="12.5" font-weight="700" fill="#36424e">node 1, day 1</text>
    <text x="144" y="306" font-size="11.5" fill="#36424e">pulls image A</text>
    <rect x="288" y="270" width="240" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="408" y="289" font-size="12.5" font-weight="700" fill="#36424e">node 2, day 5 (scale-out)</text>
    <text x="408" y="306" font-size="11.5" fill="#36424e">pulls image A</text>
    <rect x="552" y="270" width="284" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="694" y="289" font-size="12.5" font-weight="700" fill="#294a2e">every node runs the tested image</text>
    <text x="694" y="306" font-size="11.5" fill="#294a2e">a new version = a new reference in Git</text>

    <text x="430" y="352" font-size="13" fill="#40566b">Tags are mutable pointers; digests name exact bytes. Tag for people, deploy by digest.</text>
  </g>
</svg>
