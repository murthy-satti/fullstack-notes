<svg xmlns="http://www.w3.org/2000/svg" width="860" height="590" viewBox="0 0 860 590" role="img" aria-labelledby="cld-title cld-desc">
  <title id="cld-title">Debugging a container that restarts in a loop</title>
  <desc id="cld-desc">Start with a container that keeps restarting. First run docker ps -a and docker inspect to read the exit code, OOMKilled, RestartCount, and health. If OOMKilled is true, the memory limit was hit: raise the limit, cap the Node heap below it, and look for a leak. If not, branch on the exit code. Exit 1, or another application code: run docker logs --tail 100 and read the stack trace, often a missing environment variable or an unreachable database. Exit 126 or 127: the command is not executable or not found; check CMD, ENTRYPOINT, PATH, and the image architecture. Exit 137 or 143: the process was killed by a signal; docker events shows who stopped or killed it. Exit 139: native code crashed; rebuild native modules for this libc and architecture. If the cause is still unclear, reproduce interactively with docker run --rm -it --entrypoint sh, or override the command with sleep infinity and docker exec into the container.</desc>
  <defs>
    <marker id="cld-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="590" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="310" y="20" width="240" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="47" font-size="14" font-weight="700" fill="#66400f">Container restarts in a loop</text>

    <rect x="230" y="90" width="400" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="111" font-size="13" font-weight="700" fill="#263e5a">docker ps -a, then docker inspect</text>
    <text x="430" y="129" font-size="11.5" fill="#263e5a">ExitCode, OOMKilled, RestartCount, Health</text>

    <path d="M430 168 L506 202 L430 236 L354 202 Z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="207" font-size="13" font-weight="700" fill="#463365">OOMKilled?</text>

    <rect x="600" y="176" width="236" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="718" y="197" font-size="12.5" font-weight="700" fill="#6e2a24">Memory limit hit</text>
    <text x="718" y="215" font-size="11.5" fill="#6e2a24">raise limit, cap heap, find the leak</text>

    <path d="M430 262 L506 296 L430 330 L354 296 Z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="301" font-size="13" font-weight="700" fill="#463365">Exit code?</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M430 64V88" marker-end="url(#cld-arrow)"/>
      <path d="M430 142V166" marker-end="url(#cld-arrow)"/>
      <path d="M506 202H598" marker-end="url(#cld-arrow)"/>
      <path d="M430 236V260" marker-end="url(#cld-arrow)"/>
      <path d="M430 330V352"/>
      <path d="M121 352H739"/>
      <path d="M121 352V388" marker-end="url(#cld-arrow)"/>
      <path d="M327 352V388" marker-end="url(#cld-arrow)"/>
      <path d="M533 352V388" marker-end="url(#cld-arrow)"/>
      <path d="M739 352V388" marker-end="url(#cld-arrow)"/>
      <path d="M121 456V472H739V456"/>
      <path d="M430 472V494" marker-end="url(#cld-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="552" y="196">yes</text>
      <text x="444" y="252" text-anchor="start">no</text>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <rect x="92" y="363" width="58" height="14" fill="#f5f7fb"/>
      <text x="121" y="374">1, other</text>
      <rect x="292" y="363" width="70" height="14" fill="#f5f7fb"/>
      <text x="327" y="374">126, 127</text>
      <rect x="498" y="363" width="70" height="14" fill="#f5f7fb"/>
      <text x="533" y="374">137, 143</text>
      <rect x="719" y="363" width="40" height="14" fill="#f5f7fb"/>
      <text x="739" y="374">139</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="390" width="194" height="66" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="230" y="390" width="194" height="66" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="436" y="390" width="194" height="66" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="642" y="390" width="194" height="66" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <text x="121" y="410" font-size="12.5" font-weight="700" fill="#66400f">application error</text>
    <text x="121" y="427" font-size="11.5" fill="#66400f">docker logs --tail 100</text>
    <text x="121" y="443" font-size="11.5" fill="#66400f">env var? database down?</text>
    <text x="327" y="410" font-size="12.5" font-weight="700" fill="#463365">cannot run command</text>
    <text x="327" y="427" font-size="11.5" fill="#463365">check CMD, ENTRYPOINT,</text>
    <text x="327" y="443" font-size="11.5" fill="#463365">PATH, image architecture</text>
    <text x="533" y="410" font-size="12.5" font-weight="700" fill="#263e5a">killed by a signal</text>
    <text x="533" y="427" font-size="11.5" fill="#263e5a">docker events shows</text>
    <text x="533" y="443" font-size="11.5" fill="#263e5a">who stopped or killed it</text>
    <text x="739" y="410" font-size="12.5" font-weight="700" fill="#6e2a24">native code crashed</text>
    <text x="739" y="427" font-size="11.5" fill="#6e2a24">rebuild native modules</text>
    <text x="739" y="443" font-size="11.5" fill="#6e2a24">for this libc and CPU</text>

    <rect x="130" y="496" width="600" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="430" y="517" font-size="12.5" font-weight="700" fill="#294a2e">Still unclear? Reproduce it interactively</text>
    <text x="430" y="535" font-size="11.5" fill="#294a2e">docker run --rm -it --entrypoint sh IMAGE, or CMD sleep infinity and docker exec</text>

    <text x="430" y="574" font-size="13" fill="#40566b">Read the exit code and OOMKilled first: they tell you which half of the problem to look at.</text>
  </g>
</svg>
