<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="ira-title ira-desc">
  <title id="ira-title">The parts of an image reference</title>
  <desc id="ira-desc">The reference ghcr.io/example/taskflow-api:1.4.0@sha256:9f86d0... has five parts: the registry host ghcr.io (the default is docker.io), the namespace example (an owner or organization), the repository taskflow-api (the image name), the tag 1.4.0 after a colon (a mutable label), and the digest after an at sign (an immutable hash of the manifest). Short names are expanded with defaults: node:24-slim becomes docker.io/library/node:24-slim, nginx becomes docker.io/library/nginx:latest, and example/taskflow-api:1.4.0 becomes docker.io/example/taskflow-api:1.4.0. library is the namespace of Docker Official Images, and latest is used only when neither a tag nor a digest is given.</desc>
  <defs>
    <marker id="ira-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One fully qualified image reference</text>

    <rect x="100" y="52" width="100" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="150" y="77" font-size="14" font-weight="700" fill="#263e5a">ghcr.io</text>
    <text x="210" y="78" font-size="18" font-weight="700" fill="#40566b">/</text>
    <rect x="220" y="52" width="100" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="270" y="77" font-size="14" font-weight="700" fill="#36424e">example</text>
    <text x="330" y="78" font-size="18" font-weight="700" fill="#40566b">/</text>
    <rect x="340" y="52" width="130" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="405" y="77" font-size="14" font-weight="700" fill="#463365">taskflow-api</text>
    <text x="480" y="78" font-size="18" font-weight="700" fill="#40566b">:</text>
    <rect x="490" y="52" width="80" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="530" y="77" font-size="14" font-weight="700" fill="#66400f">1.4.0</text>
    <text x="580" y="78" font-size="18" font-weight="700" fill="#40566b">@</text>
    <rect x="590" y="52" width="170" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="675" y="77" font-size="14" font-weight="700" fill="#294a2e">sha256:9f86d0...</text>

    <g font-size="12" font-weight="700">
      <text x="150" y="114" fill="#263e5a">registry host</text>
      <text x="270" y="114" fill="#36424e">namespace</text>
      <text x="405" y="114" fill="#463365">repository</text>
      <text x="530" y="114" fill="#66400f">tag</text>
      <text x="675" y="114" fill="#294a2e">digest</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="150" y="130">default docker.io</text>
      <text x="270" y="130">owner or org</text>
      <text x="405" y="130">the image name</text>
      <text x="530" y="130">mutable label</text>
      <text x="675" y="130">immutable hash</text>
    </g>

    <path d="M24 152H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="178" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Short names are expanded with defaults</text>

    <g font-size="12" text-anchor="start">
      <rect x="60" y="192" width="240" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="72" y="211" fill="#36424e">node:24-slim</text>
      <rect x="380" y="192" width="300" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="392" y="211" fill="#263e5a">docker.io/library/node:24-slim</text>

      <rect x="60" y="228" width="240" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="72" y="247" fill="#36424e">nginx</text>
      <rect x="380" y="228" width="300" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="392" y="247" fill="#263e5a">docker.io/library/nginx:latest</text>

      <rect x="60" y="264" width="240" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="72" y="283" fill="#36424e">example/taskflow-api:1.4.0</text>
      <rect x="380" y="264" width="300" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="392" y="283" fill="#263e5a">docker.io/example/taskflow-api:1.4.0</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M300 206H378" marker-end="url(#ira-arrow)"/>
      <path d="M300 242H378" marker-end="url(#ira-arrow)"/>
      <path d="M300 278H378" marker-end="url(#ira-arrow)"/>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="694" y="204">library = Docker</text>
      <text x="694" y="218">Official Images</text>
      <text x="694" y="240">latest only when no</text>
      <text x="694" y="254">tag or digest given</text>
    </g>

    <text x="430" y="330" font-size="13" fill="#40566b">The tag says which version you meant; the digest proves which bytes you got.</text>
  </g>
</svg>
