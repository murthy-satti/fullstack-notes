<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="cso-title cso-desc">
  <title id="cso-title">Startup ordering with health conditions in Compose</title>
  <desc id="cso-desc">A timeline from 0 to 16 seconds after docker compose up. mongo and redis have no dependencies and start at once. redis passes its healthcheck at about 2 seconds; mongo is starting while its healthcheck fails, and becomes healthy at about 8 seconds. migrate depends on mongo with condition service_healthy, so it waits until 8 seconds, runs migrations, and exits with code 0 at about 11 seconds. api depends on redis and mongo being healthy and on migrate with condition service_completed_successfully, so it waits until 11 seconds, starts, and is healthy at about 14 seconds. Without conditions, api would start at 0 seconds, find MongoDB not ready, get connection refused, and exit or restart.</desc>
  <defs>
    <marker id="cso-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">docker compose up: what each service is doing over time</text>

    <g font-size="12.5" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="75">mongo</text>
      <text x="24" y="131">migrate</text>
      <text x="24" y="187">api</text>
      <text x="24" y="243">redis</text>
    </g>

    <rect x="170" y="56" width="320" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="330" y="75" font-size="11.5" fill="#36424e">starting: healthcheck not passing yet</text>
    <rect x="490" y="56" width="320" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="650" y="75" font-size="11.5" font-weight="700" fill="#294a2e">healthy</text>

    <rect x="170" y="112" width="320" height="28" rx="6" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="330" y="131" font-size="11.5" fill="#36424e">waiting (not created yet)</text>
    <rect x="490" y="112" width="120" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="550" y="131" font-size="11.5" fill="#263e5a">runs migrations</text>
    <rect x="614" y="112" width="70" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="649" y="131" font-size="11.5" font-weight="700" fill="#294a2e">exited 0</text>

    <rect x="170" y="168" width="440" height="28" rx="6" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="390" y="187" font-size="11.5" fill="#36424e">waiting for all three dependencies</text>
    <rect x="610" y="168" width="120" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="670" y="187" font-size="11.5" fill="#36424e">starting</text>
    <rect x="730" y="168" width="80" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="770" y="187" font-size="11.5" font-weight="700" fill="#294a2e">healthy</text>

    <rect x="170" y="224" width="80" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="210" y="243" font-size="11.5" fill="#36424e">starting</text>
    <rect x="250" y="224" width="560" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="530" y="243" font-size="11.5" font-weight="700" fill="#294a2e">healthy</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M490 84V110" marker-end="url(#cso-arrow)"/>
      <path d="M610 140V166" marker-end="url(#cso-arrow)"/>
      <path d="M250 224V198" marker-end="url(#cso-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="498" y="102">service_healthy</text>
      <text x="618" y="158">service_completed_successfully</text>
      <text x="258" y="216">service_healthy (met at 2 s)</text>
    </g>

    <path d="M170 272H810" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M170 268V276"/>
      <path d="M250 268V276"/>
      <path d="M330 268V276"/>
      <path d="M410 268V276"/>
      <path d="M490 268V276"/>
      <path d="M570 268V276"/>
      <path d="M650 268V276"/>
      <path d="M730 268V276"/>
      <path d="M810 268V276"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="170" y="290">0 s</text>
      <text x="250" y="290">2 s</text>
      <text x="330" y="290">4 s</text>
      <text x="410" y="290">6 s</text>
      <text x="490" y="290">8 s</text>
      <text x="570" y="290">10 s</text>
      <text x="650" y="290">12 s</text>
      <text x="730" y="290">14 s</text>
      <text x="810" y="290">16 s</text>
    </g>

    <rect x="24" y="306" width="812" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="430" y="331" font-size="12" fill="#6e2a24">Without conditions: api starts at 0 s, MongoDB is not ready, the connection is refused, and api exits or restarts.</text>

    <text x="430" y="378" font-size="13" fill="#40566b">depends_on with conditions waits for readiness, not just for a container to exist.</text>
  </g>
</svg>
