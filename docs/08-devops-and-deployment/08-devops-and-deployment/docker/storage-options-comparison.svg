<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="soc-title soc-desc">
  <title id="soc-title">Where container data can live</title>
  <desc id="soc-desc">Four options compared. Writable layer: a path such as /app/data with no mount is stored in the container's overlayfs upper layer; it does not survive docker rm, writes pay a copy-on-write cost, and it suits nothing important. Named volume: /data/db mounted with -v mongo-data:/data/db is stored in a Docker-managed directory under /var/lib/docker/volumes; it survives docker rm, writes at native disk speed, and suits databases and uploads. Bind mount: /app/src mounted with -v "$(pwd)/src:/app/src" is any host directory; it survives because the files belong to the host, is native speed on Linux but slower through Docker Desktop's VM, and suits source code and config files. tmpfs: /tmp mounted with --tmpfs /tmp lives in host memory and is never written to disk; it is lost when the container stops and suits secrets and scratch files.</desc>
  <defs>
    <marker id="soc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="121" y="32">writable layer</text>
      <text x="327" y="32">named volume</text>
      <text x="533" y="32">bind mount</text>
      <text x="739" y="32">tmpfs</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="24" y="44" width="194" height="48" rx="8"/>
      <rect x="230" y="44" width="194" height="48" rx="8"/>
      <rect x="436" y="44" width="194" height="48" rx="8"/>
      <rect x="642" y="44" width="194" height="48" rx="8"/>
    </g>
    <g fill="#66400f">
      <text x="121" y="64" font-size="12.5" font-weight="700">container</text>
      <text x="121" y="82" font-size="11.5">/app/data (no mount)</text>
      <text x="327" y="64" font-size="12.5" font-weight="700">container</text>
      <text x="327" y="82" font-size="11.5">/data/db</text>
      <text x="533" y="64" font-size="12.5" font-weight="700">container</text>
      <text x="533" y="82" font-size="11.5">/app/src</text>
      <text x="739" y="64" font-size="12.5" font-weight="700">container</text>
      <text x="739" y="82" font-size="11.5">/tmp</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M121 92V122" marker-end="url(#soc-arrow)"/>
      <path d="M327 92V122" marker-end="url(#soc-arrow)"/>
      <path d="M533 92V122" marker-end="url(#soc-arrow)"/>
      <path d="M739 92V122" marker-end="url(#soc-arrow)"/>
    </g>

    <rect x="24" y="124" width="194" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="121" y="146" font-size="12.5" font-weight="700" fill="#6e2a24">overlayfs upper layer</text>
    <text x="121" y="164" font-size="11.5" fill="#6e2a24">belongs to the container</text>
    <rect x="230" y="124" width="194" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="327" y="146" font-size="12.5" font-weight="700" fill="#263e5a">Docker-managed dir</text>
    <text x="327" y="164" font-size="11.5" fill="#263e5a">/var/lib/docker/volumes</text>
    <rect x="436" y="124" width="194" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="533" y="146" font-size="12.5" font-weight="700" fill="#263e5a">any host directory</text>
    <text x="533" y="164" font-size="11.5" fill="#263e5a">for example ./src</text>
    <rect x="642" y="124" width="194" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="739" y="146" font-size="12.5" font-weight="700" fill="#463365">host memory (RAM)</text>
    <text x="739" y="164" font-size="11.5" fill="#463365">never written to disk</text>

    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="24" y="190" width="194" height="128" rx="8"/>
      <rect x="230" y="190" width="194" height="128" rx="8"/>
      <rect x="436" y="190" width="194" height="128" rx="8"/>
      <rect x="642" y="190" width="194" height="128" rx="8"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="36" y="212"><tspan font-weight="700" fill="#6e2a24">docker rm:</tspan> data lost</text>
      <text x="36" y="232"><tspan font-weight="700">speed:</tspan> copy-on-write</text>
      <text x="36" y="252"><tspan font-weight="700">managed by:</tspan> Docker</text>
      <text x="36" y="272"><tspan font-weight="700">use for:</tspan> nothing that</text>
      <text x="36" y="288">must be kept</text>

      <text x="242" y="212"><tspan font-weight="700" fill="#294a2e">docker rm:</tspan> data kept</text>
      <text x="242" y="232"><tspan font-weight="700">speed:</tspan> native disk</text>
      <text x="242" y="252"><tspan font-weight="700">managed by:</tspan> docker volume</text>
      <text x="242" y="272"><tspan font-weight="700">use for:</tspan> databases,</text>
      <text x="242" y="288">uploads, caches</text>

      <text x="448" y="212"><tspan font-weight="700" fill="#294a2e">docker rm:</tspan> host files kept</text>
      <text x="448" y="232"><tspan font-weight="700">speed:</tspan> native on Linux,</text>
      <text x="448" y="248">slower via Docker Desktop</text>
      <text x="448" y="268"><tspan font-weight="700">managed by:</tspan> you</text>
      <text x="448" y="288"><tspan font-weight="700">use for:</tspan> source code,</text>
      <text x="448" y="304">config files</text>

      <text x="654" y="212"><tspan font-weight="700" fill="#6e2a24">stop or rm:</tspan> data lost</text>
      <text x="654" y="232"><tspan font-weight="700">speed:</tspan> memory</text>
      <text x="654" y="252"><tspan font-weight="700">managed by:</tspan> Docker</text>
      <text x="654" y="272"><tspan font-weight="700">use for:</tspan> secrets,</text>
      <text x="654" y="288">scratch, read-only roots</text>
    </g>

    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="121" y="342">(no flag)</text>
      <text x="327" y="342">-v mongo-data:/data/db</text>
      <text x="533" y="342">-v "$(pwd)/src:/app/src"</text>
      <text x="739" y="342">--tmpfs /tmp</text>
    </g>
    <path d="M24 362H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="388" font-size="12" fill="#36424e">An empty named volume is pre-filled from the image's files at that path; a bind mount hides them.</text>
    <text x="430" y="420" font-size="13" fill="#40566b">Keep state out of the writable layer: volumes for data, bind mounts for code, tmpfs for secrets.</text>
  </g>
</svg>
