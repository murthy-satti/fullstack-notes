<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img" aria-labelledby="lbo-title lbo-desc">
  <title id="lbo-title">The request path of a multi-server application</title>
  <desc id="lbo-desc">Step 1: a user's browser or mobile app looks up the API name in DNS, which answers with the address of a nearby edge location. Step 2: the client opens an HTTPS connection to a CDN or edge point of presence, which terminates TLS, serves cached static files, and filters attacks with a web application firewall. Step 3: API calls and cache misses travel to a region, for example eu-west-1, where a regional load balancer receives them. Step 4: the load balancer health-checks the application instances and sends each request to a healthy TaskFlow API instance in any of three Availability Zones, a, b, and c, each running two instances. Below the instances, a MongoDB replica set has its primary in zone a and secondaries in zones b and c, and data replicates across zones. Regional services shared by every instance hold sessions, rate limits, and locks (Redis) and user uploads (object storage). Every layer is redundant, so no single server, zone, or box takes the service down.</desc>
  <defs>
    <marker id="lbo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lbo-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="lbo-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="550" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="310" y="20" width="260" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="440" y="43" font-size="14" font-weight="700" fill="#66400f">Users</text>
    <text x="440" y="62" font-size="12" fill="#66400f">browsers and mobile apps</text>

    <rect x="650" y="20" width="206" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="753" y="43" font-size="14" font-weight="700" fill="#263e5a">DNS</text>
    <text x="753" y="62" font-size="12" fill="#263e5a">returns edge address</text>

    <path d="M576 47H644" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#lbo-arrow-start)" marker-end="url(#lbo-arrow-ret)"/>
    <text x="610" y="38" font-size="11" fill="#40566b">1. lookup</text>

    <path d="M440 74V112" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#lbo-arrow)"/>
    <text x="452" y="98" font-size="11.5" fill="#36424e" text-anchor="start">2. HTTPS</text>

    <rect x="260" y="114" width="360" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="440" y="137" font-size="14" font-weight="700" fill="#463365">CDN / edge point of presence</text>
    <text x="440" y="156" font-size="12" fill="#463365">TLS, cached static files, WAF</text>

    <path d="M440 168V224" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#lbo-arrow)"/>
    <text x="452" y="189" font-size="11.5" fill="#36424e" text-anchor="start">3. API call or cache miss</text>

    <rect x="24" y="200" width="832" height="300" rx="10" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="38" y="220" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">Region: eu-west-1</text>

    <rect x="290" y="226" width="300" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="249" font-size="14" font-weight="700" fill="#263e5a">Regional load balancer</text>
    <text x="440" y="268" font-size="12" fill="#263e5a">health checks across zones</text>
    <text x="600" y="258" font-size="11.5" fill="#36424e" text-anchor="start">4. healthy instance in any zone</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round">
      <path d="M440 280V290H169V298" marker-end="url(#lbo-arrow)"/>
      <path d="M440 280V298" marker-end="url(#lbo-arrow)"/>
      <path d="M440 290H711V298" marker-end="url(#lbo-arrow)"/>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <rect x="40" y="300" width="258" height="140" rx="8"/>
      <rect x="311" y="300" width="258" height="140" rx="8"/>
      <rect x="582" y="300" width="258" height="140" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="52" y="318">Availability Zone a</text>
      <text x="323" y="318">Availability Zone b</text>
      <text x="594" y="318">Availability Zone c</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="54" y="326" width="110" height="40" rx="8"/>
      <rect x="174" y="326" width="110" height="40" rx="8"/>
      <rect x="325" y="326" width="110" height="40" rx="8"/>
      <rect x="445" y="326" width="110" height="40" rx="8"/>
      <rect x="596" y="326" width="110" height="40" rx="8"/>
      <rect x="716" y="326" width="110" height="40" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="109" y="350">TaskFlow API</text>
      <text x="229" y="350">TaskFlow API</text>
      <text x="380" y="350">TaskFlow API</text>
      <text x="500" y="350">TaskFlow API</text>
      <text x="651" y="350">TaskFlow API</text>
      <text x="771" y="350">TaskFlow API</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="54" y="378" width="230" height="36" rx="8"/>
      <rect x="325" y="378" width="230" height="36" rx="8"/>
      <rect x="596" y="378" width="230" height="36" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="169" y="400">MongoDB primary</text>
      <text x="440" y="400">MongoDB secondary</text>
      <text x="711" y="400">MongoDB secondary</text>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M286 396H323" marker-end="url(#lbo-arrow-ret)"/>
      <path d="M557 396H594" marker-end="url(#lbo-arrow-ret)"/>
    </g>
    <text x="440" y="432" font-size="11" font-style="italic" fill="#40566b">data replicates across zones</text>

    <rect x="40" y="452" width="390" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="235" y="475" font-size="12" font-weight="700" fill="#463365">Redis: sessions, rate limits, locks</text>
    <rect x="450" y="452" width="390" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="645" y="475" font-size="12" font-weight="700" fill="#263e5a">Object storage: user uploads</text>

    <text x="440" y="530" font-size="13" fill="#40566b">Every layer is redundant, so no single server, zone, or box takes TaskFlow down.</text>
  </g>
</svg>
