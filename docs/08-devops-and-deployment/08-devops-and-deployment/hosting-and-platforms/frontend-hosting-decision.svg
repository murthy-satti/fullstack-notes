<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-labelledby="fhd-title fhd-desc">
  <title id="fhd-title">Decision flow for choosing a frontend host</title>
  <desc id="fhd-desc">Question 1: does the site need HTML rendered per request? If yes, choose a server-rendering host: Vercel for every Next.js feature with no setup, or OpenNext on AWS, Cloudflare, Amplify, or a container on Cloud Run for your own cloud. If no, question 2: is it a commercial product? If no, GitHub Pages or Cloudflare host it for free. If yes, question 3: is traffic above about 1 TB a month? If yes, use Cloudflare, or CloudFront with a flat-rate plan. If no, question 4: do preview deployments and zero setup matter most? If yes, use Vercel or Netlify. If no, use Cloudflare or S3 with CloudFront. A note says never to put patient data or secrets in static files, whichever host is chosen.</desc>
  <defs>
    <marker id="fhd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">Which frontend host? Start from the rendering mode.</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <path d="M230 50 400 90 230 130 60 90z"/>
      <path d="M230 146 400 186 230 226 60 186z"/>
      <path d="M230 242 400 282 230 322 60 282z"/>
      <path d="M230 338 400 378 230 418 60 378z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f" text-anchor="middle">
      <text x="230" y="86">HTML rendered</text>
      <text x="230" y="101">per request?</text>
      <text x="230" y="182">A commercial</text>
      <text x="230" y="197">product?</text>
      <text x="230" y="278">Traffic above about</text>
      <text x="230" y="293">1 TB a month?</text>
      <text x="230" y="374">Previews and zero setup</text>
      <text x="230" y="389">matter most?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M400 90H466" marker-end="url(#fhd-arrow)"/>
      <path d="M400 186H466" marker-end="url(#fhd-arrow)"/>
      <path d="M400 282H466" marker-end="url(#fhd-arrow)"/>
      <path d="M400 378H466" marker-end="url(#fhd-arrow)"/>
      <path d="M230 130V144" marker-end="url(#fhd-arrow)"/>
      <path d="M230 226V240" marker-end="url(#fhd-arrow)"/>
      <path d="M230 322V336" marker-end="url(#fhd-arrow)"/>
      <path d="M230 418V446" marker-end="url(#fhd-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="424" y="84">yes</text>
      <text x="426" y="180">no</text>
      <text x="424" y="276">yes</text>
      <text x="424" y="372">yes</text>
      <text x="240" y="141">no</text>
      <text x="240" y="237">yes</text>
      <text x="240" y="333">no</text>
      <text x="240" y="436">no</text>
    </g>

    <g stroke-width="2">
      <rect x="470" y="58" width="366" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="470" y="162" width="366" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="470" y="258" width="366" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="470" y="354" width="366" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="60" y="448" width="340" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="484" y="78" fill="#463365">Server-rendering host</text>
      <text x="484" y="182" fill="#294a2e">Free static hosting</text>
      <text x="484" y="278" fill="#263e5a">Cloudflare, or CloudFront flat-rate</text>
      <text x="484" y="374" fill="#463365">Vercel or Netlify</text>
      <text x="230" y="475" fill="#263e5a" text-anchor="middle">Cloudflare or S3 + CloudFront</text>
    </g>
    <g font-size="11.5">
      <text x="484" y="95" fill="#463365">Vercel for every Next.js feature; OpenNext on AWS,</text>
      <text x="484" y="111" fill="#463365">Cloudflare, Amplify, or Cloud Run for your own cloud</text>
      <text x="484" y="199" fill="#294a2e">GitHub Pages or Cloudflare</text>
      <text x="484" y="295" fill="#263e5a">no egress fees, or a fixed monthly price</text>
      <text x="484" y="391" fill="#463365">previews per pull request, atomic deploys</text>
    </g>

    <rect x="470" y="440" width="366" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="484" y="461" font-size="13" font-weight="700" fill="#6e2a24">Any host, any branch</text>
    <text x="484" y="480" font-size="11.5" fill="#6e2a24">Never put patient data or secrets in static files.</text>

    <text x="430" y="534" font-size="13" fill="#40566b" text-anchor="middle">Static and SPA frontends can use the cheapest hosts; only per-request rendering narrows the list.</text>
  </g>
</svg>
