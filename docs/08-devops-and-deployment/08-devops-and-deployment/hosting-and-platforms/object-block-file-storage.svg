<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="obf-title obf-desc">
  <title id="obf-title">Object, block, and file storage compared</title>
  <desc id="obf-desc">Three side-by-side panels. Object storage: a browser, an API server, and a CDN edge all send HTTPS PUT and GET requests to one bucket named taskflow-attachments, which holds objects under flat keys such as tasks/42/report.pdf, tasks/42/photo.jpg, and tasks/77/export.csv. Block storage: inside one availability zone, one virtual machine with an ext4 filesystem is attached to one EBS gp3 volume of 100 GB; the volume is that server's disk and is tied to the zone. File storage: three servers each mount the same NFS shared file system at /mnt/shared and see the same directory tree with uploads and config folders. Caption: object storage is shared over an API, block storage is one server's disk, file storage is a shared drive.</desc>
  <defs>
    <marker id="obf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="18" y="44" width="264" height="300" rx="10"/>
      <rect x="298" y="44" width="264" height="300" rx="10"/>
      <rect x="578" y="44" width="264" height="300" rx="10"/>
    </g>
    <g font-size="15" font-weight="700" fill="#36424e">
      <text x="150" y="32">Object storage</text>
      <text x="430" y="32">Block storage</text>
      <text x="710" y="32">File storage</text>
    </g>

    <!-- Object storage panel -->
    <g stroke="#bd7a20" stroke-width="2" fill="#fff0d9">
      <rect x="26" y="62" width="78" height="32" rx="8"/>
      <rect x="111" y="62" width="78" height="32" rx="8"/>
      <rect x="196" y="62" width="78" height="32" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="65" y="82">Browser</text>
      <text x="150" y="82">API server</text>
      <text x="235" y="82">CDN edge</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M65 94V158" marker-end="url(#obf-arrow)"/>
      <path d="M150 94V158" marker-end="url(#obf-arrow)"/>
      <path d="M235 94V158" marker-end="url(#obf-arrow)"/>
    </g>
    <rect x="96" y="116" width="108" height="18" fill="#ffffff"/>
    <text x="150" y="129" font-size="11.5" fill="#36424e">HTTPS PUT / GET</text>
    <rect x="40" y="162" width="220" height="140" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="150" y="184" font-size="14" font-weight="700" fill="#263e5a">Bucket</text>
    <text x="150" y="200" font-size="11.5" fill="#263e5a">taskflow-attachments</text>
    <g fill="#ffffff" stroke="#4774aa" stroke-width="1">
      <rect x="58" y="210" width="184" height="24" rx="6"/>
      <rect x="58" y="240" width="184" height="24" rx="6"/>
      <rect x="58" y="270" width="184" height="24" rx="6"/>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="150" y="226">tasks/42/report.pdf</text>
      <text x="150" y="256">tasks/42/photo.jpg</text>
      <text x="150" y="286">tasks/77/export.csv</text>
    </g>
    <text x="150" y="326" font-size="11.5" fill="#36424e">flat keys, whole-object writes</text>

    <!-- Block storage panel -->
    <rect x="314" y="58" width="232" height="246" rx="8" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="324" y="76" font-size="11.5" fill="#40566b" text-anchor="start">Availability Zone a</text>
    <rect x="350" y="96" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="119" font-size="14" font-weight="700" fill="#66400f">Virtual machine</text>
    <text x="430" y="138" font-size="11.5" fill="#66400f">ext4 filesystem</text>
    <path d="M430 152V206" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#obf-arrow)"/>
    <rect x="440" y="170" width="58" height="18" fill="#ffffff"/>
    <text x="469" y="183" font-size="11.5" fill="#36424e">attached</text>
    <rect x="350" y="210" width="160" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="236" font-size="14" font-weight="700" fill="#263e5a">EBS volume (gp3)</text>
    <text x="430" y="256" font-size="11.5" fill="#263e5a">100 GB, one VM</text>
    <text x="430" y="326" font-size="11.5" fill="#36424e">one server's disk, tied to a zone</text>

    <!-- File storage panel -->
    <g stroke="#bd7a20" stroke-width="2" fill="#fff0d9">
      <rect x="586" y="62" width="78" height="32" rx="8"/>
      <rect x="671" y="62" width="78" height="32" rx="8"/>
      <rect x="756" y="62" width="78" height="32" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="625" y="82">Server 1</text>
      <text x="710" y="82">Server 2</text>
      <text x="795" y="82">Server 3</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M625 94V158" marker-end="url(#obf-arrow)"/>
      <path d="M710 94V158" marker-end="url(#obf-arrow)"/>
      <path d="M795 94V158" marker-end="url(#obf-arrow)"/>
    </g>
    <rect x="670" y="116" width="80" height="18" fill="#ffffff"/>
    <text x="710" y="129" font-size="11.5" fill="#36424e">NFS mount</text>
    <rect x="600" y="162" width="220" height="140" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="184" font-size="14" font-weight="700" fill="#263e5a">Shared file system</text>
    <text x="710" y="200" font-size="11.5" fill="#263e5a">mounted at /mnt/shared</text>
    <g font-size="11.5" fill="#263e5a" text-anchor="start">
      <text x="640" y="228">/mnt/shared/</text>
      <text x="660" y="250">uploads/</text>
      <text x="660" y="272">config/</text>
    </g>
    <g fill="none" stroke="#4774aa" stroke-width="1.2">
      <path d="M648 232V268M648 246H656M648 268H656"/>
    </g>
    <text x="710" y="326" font-size="11.5" fill="#36424e">many servers mount the same tree</text>

    <text x="430" y="380" font-size="13" fill="#40566b">Object storage is shared over an API, block storage is one server's disk, file storage is a shared drive.</text>
  </g>
</svg>
