<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="gpf-title gpf-desc">
  <title id="gpf-title">How a git-push platform such as Vercel or Netlify deploys</title>
  <desc id="gpf-desc">Preview lane: a developer pushes a branch or opens a pull request; the platform's build service runs npm ci and npm run build; the output becomes an immutable deployment, dpl_7f3a, with its own URL; the preview URL is posted on the pull request. Production lane: merging to main triggers a production build with the same commands; the output becomes another immutable deployment, dpl_9c1e; the production alias app.example.com is switched to it atomically. The alias points the edge network at that deployment, which serves static files from cache and runs server-rendered and API routes as functions. A previous production deployment, dpl_5e2d, is kept; rolling back means pointing the alias back at it.</desc>
  <defs>
    <marker id="gpf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="gpf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="24" y="34">Preview</text>
      <text x="24" y="144">Production</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="46" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="204" y="46" width="180" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="414" y="46" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="614" y="46" width="222" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="24" y="156" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="204" y="156" width="180" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="414" y="156" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="614" y="156" width="222" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="414" y="262" width="150" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-dasharray="6 4"/>
      <rect x="614" y="262" width="222" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>

    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="99" y="70" fill="#66400f">Push a branch</text>
      <text x="294" y="70" fill="#463365">Build</text>
      <text x="489" y="70" fill="#263e5a">dpl_7f3a</text>
      <text x="725" y="70" fill="#294a2e">Preview URL</text>
      <text x="99" y="180" fill="#66400f">Merge to main</text>
      <text x="294" y="180" fill="#463365">Build</text>
      <text x="489" y="180" fill="#263e5a">dpl_9c1e</text>
      <text x="725" y="180" fill="#294a2e">Production alias</text>
      <text x="489" y="286" fill="#36424e">dpl_5e2d</text>
      <text x="725" y="286" fill="#263e5a">Edge network</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="99" y="88" fill="#66400f">or open a PR</text>
      <text x="294" y="88" fill="#463365">npm ci &amp;&amp; npm run build</text>
      <text x="489" y="88" fill="#263e5a">immutable, own URL</text>
      <text x="725" y="88" fill="#294a2e">posted on the pull request</text>
      <text x="99" y="198" fill="#66400f">production build</text>
      <text x="294" y="198" fill="#463365">same commands</text>
      <text x="489" y="198" fill="#263e5a">immutable, own URL</text>
      <text x="725" y="198" fill="#294a2e">app.example.com</text>
      <text x="489" y="304" fill="#36424e">previous production</text>
      <text x="725" y="304" fill="#263e5a">static from cache, SSR as functions</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 74H202" marker-end="url(#gpf-arrow)"/>
      <path d="M384 74H412" marker-end="url(#gpf-arrow)"/>
      <path d="M564 74H612" marker-end="url(#gpf-arrow)"/>
      <path d="M174 184H202" marker-end="url(#gpf-arrow)"/>
      <path d="M384 184H412" marker-end="url(#gpf-arrow)"/>
      <path d="M564 184H612" marker-end="url(#gpf-arrow)"/>
      <path d="M725 212V260" marker-end="url(#gpf-arrow)"/>
    </g>
    <path d="M564 280 638 214" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#gpf-arrow-ret)"/>
    <g font-size="11" fill="#36424e">
      <text x="588" y="176" text-anchor="middle">atomic</text>
      <text x="588" y="199" text-anchor="middle">switch</text>
      <text x="736" y="240">serves</text>
      <text x="404" y="342">rollback: point the alias back at the previous deployment</text>
    </g>

    <text x="430" y="382" font-size="13" fill="#40566b" text-anchor="middle">A deployment never changes; production is only a pointer, so switching and rolling back are instant.</text>
  </g>
</svg>
