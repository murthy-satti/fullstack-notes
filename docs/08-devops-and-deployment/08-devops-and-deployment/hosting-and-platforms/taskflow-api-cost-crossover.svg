<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="tcc-title tcc-desc">
  <title id="tcc-title">TaskFlow API monthly cost against request volume</title>
  <desc id="tcc-desc">A line chart with requests per month from 0 to 100 million on the horizontal axis and monthly cost from $0 to $130 on the vertical axis, at US list prices in November 2026 without free tiers, for 120 ms requests at 512 MB. Lambda with a function URL rises at $1.20 per million requests, reaching $120 at 100 million. Lambda behind an API Gateway HTTP API rises at $2.20 per million and passes $130 near 59 million. Cloud Run in the worst case, with no overlapping requests and each 120 ms request billed as 200 ms after rounding up to 100 ms, rises at about $5.45 per million and passes $130 near 24 million. One small EC2 VM is flat at $17.51 and two Fargate tasks with a load balancer are flat at $58.31. Lambda crosses the VM line at about 14.6 million requests and the Fargate line at about 48.6 million. The flat lines stay flat only until the instances run out of capacity.</desc>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">TaskFlow API: cost per month vs requests per month (120 ms, 512 MB, no free tiers)</text>

    <g stroke="#c9d1db" stroke-width="1">
      <path d="M110 280H710"/>
      <path d="M110 230H710"/>
      <path d="M110 180H710"/>
      <path d="M110 130H710"/>
      <path d="M110 80H710"/>
    </g>
    <path d="M110 70V330H710" fill="none" stroke="#8a96a3" stroke-width="1.5"/>

    <g font-size="11" fill="#36424e" text-anchor="end">
      <text x="102" y="334">$0</text>
      <text x="102" y="284">$25</text>
      <text x="102" y="234">$50</text>
      <text x="102" y="184">$75</text>
      <text x="102" y="134">$100</text>
      <text x="102" y="84">$125</text>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="110" y="348">0</text>
      <text x="230" y="348">20M</text>
      <text x="350" y="348">40M</text>
      <text x="470" y="348">60M</text>
      <text x="590" y="348">80M</text>
      <text x="710" y="348">100M</text>
      <text x="410" y="368" font-weight="700">requests per month</text>
    </g>

    <path d="M110 295H710" fill="none" stroke="#4774aa" stroke-width="2.5"/>
    <path d="M110 213.4H710" fill="none" stroke="#53845b" stroke-width="2.5"/>
    <path d="M110 330 710 90" fill="none" stroke="#bd7a20" stroke-width="2.5"/>
    <path d="M110 330 464.5 70" fill="none" stroke="#bd7a20" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M110 330 253.1 70" fill="none" stroke="#8062a8" stroke-width="2.5"/>

    <circle cx="197.6" cy="295" r="5" fill="#ffffff" stroke="#b5524b" stroke-width="2"/>
    <circle cx="401.6" cy="213.4" r="5" fill="#ffffff" stroke="#b5524b" stroke-width="2"/>
    <rect x="200" y="300" width="112" height="15" fill="#f5f7fb"/>
    <text x="206" y="311" font-size="11" font-weight="700" fill="#6e2a24">14.6M: Lambda = VM</text>
    <rect x="410" y="219" width="140" height="15" fill="#f5f7fb"/>
    <text x="414" y="230" font-size="11" font-weight="700" fill="#6e2a24">48.6M: Lambda = Fargate</text>

    <g font-size="11.5" font-weight="700">
      <text x="716" y="94" fill="#66400f">Lambda</text>
      <text x="716" y="109" fill="#66400f">$1.20 / 1M</text>
      <text x="470" y="64" fill="#66400f">Lambda + HTTP API ($2.20 / 1M)</text>
      <text x="250" y="62" fill="#463365" text-anchor="end">Cloud Run, worst case</text>
      <rect x="556" y="196" width="178" height="14" fill="#f5f7fb"/>
      <text x="560" y="207" fill="#294a2e">2 Fargate tasks + ALB: $58.31</text>
      <rect x="556" y="278" width="128" height="14" fill="#f5f7fb"/>
      <text x="560" y="289" fill="#263e5a">1 small VM: $17.51</text>
    </g>

    <rect x="110" y="384" width="600" height="34" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/>
    <text x="410" y="405" font-size="11.5" fill="#36424e" text-anchor="middle">Flat lines hold only until instances are full; then add an instance and the line steps up.</text>
    <text x="430" y="438" font-size="13" fill="#40566b" text-anchor="middle">Per-request pricing wins at low volume; always-on capacity wins past the crossover.</text>
  </g>
</svg>
