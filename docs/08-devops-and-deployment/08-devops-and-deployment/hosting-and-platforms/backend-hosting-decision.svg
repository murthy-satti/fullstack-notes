<svg xmlns="http://www.w3.org/2000/svg" width="860" height="650" viewBox="0 0 860 650" role="img" aria-labelledby="bhd-title bhd-desc">
  <title id="bhd-title">Decision tree for hosting a backend API</title>
  <desc id="bhd-desc">Question 1: does the API need long-lived connections or jobs longer than 15 minutes? If yes, use containers or VMs such as ECS, Kubernetes, or VMs; Cloud Run allows requests up to 60 minutes. If no, question 2: is the work event-driven or idle most of the time? If yes, use functions such as Lambda, Azure Functions, or Cloud Run functions. If no, question 3: is there no one to run infrastructure? If yes, use a platform or serverless containers such as Render, Railway, Fly.io, Cloud Run, or ECS Express Mode. If no, question 4: are there many services and a platform team? If yes, use Kubernetes on EKS, GKE, or AKS with an owner. If no, question 5: is the load large, steady, and cost-sensitive? If yes, use VMs or ECS on EC2 with Savings Plans or committed use discounts, or budget VMs. If no, the default is serverless containers on Cloud Run, Fargate, or Azure Container Apps. A side note: with healthcare data, use only services covered by the provider's BAA.</desc>
  <defs>
    <marker id="bhd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="650" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">Where should TaskFlow API run?</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <path d="M230 50 400 90 230 130 60 90z"/>
      <path d="M230 146 400 186 230 226 60 186z"/>
      <path d="M230 242 400 282 230 322 60 282z"/>
      <path d="M230 338 400 378 230 418 60 378z"/>
      <path d="M230 434 400 474 230 514 60 474z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f" text-anchor="middle">
      <text x="230" y="86">Long-lived connections or</text>
      <text x="230" y="101">jobs over 15 minutes?</text>
      <text x="230" y="182">Event-driven, or idle</text>
      <text x="230" y="197">most of the time?</text>
      <text x="230" y="278">No one to run</text>
      <text x="230" y="293">infrastructure?</text>
      <text x="230" y="374">Many services and</text>
      <text x="230" y="389">a platform team?</text>
      <text x="230" y="470">Large, steady,</text>
      <text x="230" y="485">cost-sensitive load?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M400 90H466" marker-end="url(#bhd-arrow)"/>
      <path d="M400 186H466" marker-end="url(#bhd-arrow)"/>
      <path d="M400 282H466" marker-end="url(#bhd-arrow)"/>
      <path d="M400 378H466" marker-end="url(#bhd-arrow)"/>
      <path d="M400 474H466" marker-end="url(#bhd-arrow)"/>
      <path d="M230 130V144" marker-end="url(#bhd-arrow)"/>
      <path d="M230 226V240" marker-end="url(#bhd-arrow)"/>
      <path d="M230 322V336" marker-end="url(#bhd-arrow)"/>
      <path d="M230 418V432" marker-end="url(#bhd-arrow)"/>
      <path d="M230 514V542" marker-end="url(#bhd-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="424" y="84">yes</text>
      <text x="424" y="180">yes</text>
      <text x="424" y="276">yes</text>
      <text x="424" y="372">yes</text>
      <text x="424" y="468">yes</text>
      <text x="240" y="141">no</text>
      <text x="240" y="237">no</text>
      <text x="240" y="333">no</text>
      <text x="240" y="429">no</text>
      <text x="240" y="532">no</text>
    </g>

    <g stroke-width="2">
      <rect x="470" y="66" width="366" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="470" y="162" width="366" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="470" y="258" width="366" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="470" y="354" width="366" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="470" y="450" width="366" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="544" width="340" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="484" y="86" fill="#263e5a">Containers or VMs</text>
      <text x="484" y="182" fill="#463365">Functions</text>
      <text x="484" y="278" fill="#294a2e">PaaS or serverless containers</text>
      <text x="484" y="374" fill="#263e5a">Kubernetes</text>
      <text x="484" y="470" fill="#263e5a">VMs or ECS on EC2 + commitments</text>
      <text x="230" y="564" fill="#294a2e" text-anchor="middle">Default: serverless containers</text>
    </g>
    <g font-size="11.5">
      <text x="484" y="103" fill="#263e5a">ECS, Kubernetes, VMs; Cloud Run up to 60 min</text>
      <text x="484" y="199" fill="#463365">Lambda, Azure Functions, Cloud Run functions</text>
      <text x="484" y="295" fill="#294a2e">Render, Railway, Fly.io, Cloud Run, ECS Express</text>
      <text x="484" y="391" fill="#263e5a">EKS, GKE, or AKS, with an owner</text>
      <text x="484" y="487" fill="#263e5a">Savings Plans, CUDs, or budget VMs</text>
      <text x="230" y="581" fill="#294a2e" text-anchor="middle">Cloud Run, Fargate, Container Apps</text>
    </g>

    <rect x="470" y="530" width="366" height="62" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="484" y="551" font-size="13" font-weight="700" fill="#6e2a24">Healthcare or other regulated data?</text>
    <g font-size="11.5" fill="#6e2a24">
      <text x="484" y="568">On any branch, use only services covered</text>
      <text x="484" y="583">by the provider's BAA or equivalent contract.</text>
    </g>

    <text x="430" y="628" font-size="13" fill="#40566b" text-anchor="middle">Constraints first, then who will operate it, then the shape of the traffic.</text>
  </g>
</svg>
