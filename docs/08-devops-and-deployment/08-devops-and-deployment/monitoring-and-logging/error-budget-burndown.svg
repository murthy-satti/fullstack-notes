<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="ebb-title ebb-desc">
  <title id="ebb-title">Error budget burn-down over a 30-day window</title>
  <desc id="ebb-desc">For a 99.9 percent availability SLO over 30 days the error budget is 43.2 minutes of full outage. The chart plots the budget remaining from 100 percent on day 0 to day 30. A dashed line shows an even spend reaching 0 percent on day 30. The actual line falls about 1 percent a day from background errors, to 91 percent on day 9, then drops by 41.7 percent to 49.3 percent because of an 18-minute outage. It continues at about 1 percent a day to 37.3 percent on day 21, then drops by 23.1 percent to 14.2 percent because a bad deploy caused 25 percent errors for 40 minutes. It ends at 5.2 percent on day 30. A red dashed policy line at 25 percent marks where the error budget policy freezes risky releases; the line is crossed on day 21.</desc>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">SLO 99.9% over 30 days: error budget = 43.2 minutes of full outage</text>

    <g fill="none" stroke="#c9d1db" stroke-width="1">
      <path d="M80 60H820"/>
      <path d="M80 180H820"/>
      <path d="M80 300H820"/>
    </g>
    <path d="M80 60V300H820" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11" fill="#40566b" text-anchor="end">
      <text x="72" y="64">100%</text>
      <text x="72" y="184">50%</text>
      <text x="72" y="244">25%</text>
      <text x="72" y="304">0%</text>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="80" y="318">day 0</text>
      <text x="203" y="318">5</text>
      <text x="327" y="318">10</text>
      <text x="450" y="318">15</text>
      <text x="573" y="318">20</text>
      <text x="697" y="318">25</text>
      <text x="820" y="318">30</text>
    </g>

    <path d="M80 240H820" fill="none" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="88" y="256" font-size="11.5" font-weight="700" fill="#6e2a24">error budget policy: freeze risky releases below 25%</text>

    <path d="M80 60L820 300" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M80 60L302 81.6V181.7L598 210.5V265.9L820 287.5" fill="none" stroke="#4774aa" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#4774aa">
      <circle cx="302" cy="181.7" r="3.5"/>
      <circle cx="598" cy="265.9" r="3.5"/>
      <circle cx="820" cy="287.5" r="3.5"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="294" y="200" font-weight="700" text-anchor="end">day 9: 18-minute outage</text>
      <text x="294" y="216" text-anchor="end">burns 41.7% of the budget</text>
      <text x="606" y="146" font-weight="700">day 21: bad deploy</text>
      <text x="606" y="162">25% errors for 40 minutes</text>
      <text x="606" y="178">burns 23.1% of the budget</text>
      <text x="812" y="278" text-anchor="end">5.2% left</text>
    </g>

    <path d="M560 344H590" stroke="#4774aa" stroke-width="2.5"/>
    <path d="M560 364H590" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g font-size="11.5" fill="#36424e">
      <text x="598" y="348">budget remaining (actual)</text>
      <text x="598" y="368">even spend over the window</text>
    </g>
    <text x="80" y="348" font-size="11.5" fill="#36424e">43.2 min = 30 d x 24 h x 60 min x (1 - 0.999)</text>
    <text x="80" y="368" font-size="11.5" fill="#36424e">18 min outage / 43.2 min = 41.7%</text>

    <text x="430" y="402" font-size="13" fill="#40566b" text-anchor="middle">Incidents show up as cliffs; the policy acts before the budget runs out.</text>
  </g>
</svg>
