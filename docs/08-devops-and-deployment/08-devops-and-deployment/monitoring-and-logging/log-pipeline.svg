<svg xmlns="http://www.w3.org/2000/svg" width="880" height="416" viewBox="0 0 880 416" role="img" aria-labelledby="lpl-title lpl-desc">
  <title id="lpl-title">A container log pipeline from stdout to a searchable store</title>
  <desc id="lpl-desc">TaskFlow API uses pino to write one JSON line per event to stdout. The container runtime stores those lines in files under /var/log/pods on the node, rotated by the kubelet. A log agent such as Vector or Fluent Bit, running once per node, tails the files and pushes events to a log store such as Loki, Elasticsearch, or CloudWatch Logs. Inside the agent each line is parsed as JSON, enriched with pod metadata, redacted for secrets, and sampled or stripped of debug lines before it is buffered and sent. The store keeps a hot tier of 14 to 30 days that is indexed for fast queries and an archive tier in object storage for a year or more. Engineers query the store with LogQL, KQL, or similar languages, and alert rules watch for error spikes. Passwords, tokens, cookies, Authorization headers, and card numbers must never be logged.</desc>
  <defs>
    <marker id="lpl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="416" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">From a console line to a searchable event</text>

    <rect x="24" y="56" width="140" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="84" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="94" y="104" font-size="11.5" fill="#66400f">pino: JSON lines</text>
    <text x="94" y="121" font-size="11.5" fill="#66400f">to stdout</text>

    <rect x="214" y="56" width="150" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="289" y="84" font-size="14" font-weight="700" fill="#263e5a">Container logs</text>
    <text x="289" y="104" font-size="11.5" fill="#263e5a">/var/log/pods/...</text>
    <text x="289" y="121" font-size="11.5" fill="#263e5a">rotated by kubelet</text>

    <rect x="414" y="56" width="180" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="504" y="84" font-size="14" font-weight="700" fill="#463365">Log agent</text>
    <text x="504" y="104" font-size="11.5" fill="#463365">Vector or Fluent Bit</text>
    <text x="504" y="121" font-size="11.5" fill="#463365">one per node</text>

    <rect x="644" y="56" width="212" height="216" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="750" y="84" font-size="14" font-weight="700" fill="#263e5a">Log store</text>
    <text x="750" y="104" font-size="11.5" fill="#263e5a">Loki, Elasticsearch,</text>
    <text x="750" y="121" font-size="11.5" fill="#263e5a">or CloudWatch Logs</text>
    <path d="M660 142H840" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="750" y="166" font-size="12" font-weight="700" fill="#263e5a">hot: 14-30 days</text>
    <text x="750" y="183" font-size="11.5" fill="#263e5a">indexed, fast queries</text>
    <text x="750" y="216" font-size="12" font-weight="700" fill="#263e5a">archive: 1+ years</text>
    <text x="750" y="233" font-size="11.5" fill="#263e5a">compressed object storage</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 96H212" marker-end="url(#lpl-arrow)"/>
      <path d="M364 96H412" marker-end="url(#lpl-arrow)"/>
      <path d="M594 96H642" marker-end="url(#lpl-arrow)"/>
      <path d="M694 272V294" marker-end="url(#lpl-arrow)"/>
      <path d="M806 272V294" marker-end="url(#lpl-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="189" y="116">stdout</text>
      <text x="389" y="116">tail</text>
      <text x="619" y="116">push</text>
    </g>

    <path d="M504 136V162" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="24" y="164" width="610" height="108" rx="8" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="38" y="188" font-size="12" font-weight="700" fill="#463365" text-anchor="start">Inside the agent, for every line</text>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="36" y="208" width="136" height="40" rx="8"/>
      <rect x="186" y="208" width="136" height="40" rx="8"/>
      <rect x="336" y="208" width="136" height="40" rx="8"/>
      <rect x="486" y="208" width="136" height="40" rx="8"/>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="104" y="232">parse JSON</text>
      <text x="254" y="232">add pod metadata</text>
      <text x="404" y="232">redact secrets</text>
      <text x="554" y="232">sample, drop debug</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="1.5" stroke-linecap="round">
      <path d="M172 228H184" marker-end="url(#lpl-arrow)"/>
      <path d="M322 228H334" marker-end="url(#lpl-arrow)"/>
      <path d="M472 228H484" marker-end="url(#lpl-arrow)"/>
    </g>
    <text x="329" y="264" font-size="11" font-style="italic" fill="#463365">then buffer on disk and retry until the store accepts the batch</text>

    <rect x="24" y="296" width="610" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="329" y="319" font-size="13" font-weight="700" fill="#6e2a24">Never log</text>
    <text x="329" y="339" font-size="11.5" fill="#6e2a24">passwords, tokens, cookies, Authorization headers, card numbers</text>

    <rect x="644" y="296" width="100" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="694" y="319" font-size="14" font-weight="700" fill="#263e5a">Query</text>
    <text x="694" y="338" font-size="11.5" fill="#263e5a">LogQL, KQL</text>
    <rect x="756" y="296" width="100" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="806" y="319" font-size="14" font-weight="700" fill="#263e5a">Alerts</text>
    <text x="806" y="338" font-size="11.5" fill="#263e5a">error spikes</text>

    <text x="440" y="392" font-size="13" fill="#40566b">Structure at the source, clean in the agent, keep only what you will query.</text>
  </g>
</svg>
