<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="sqa-title sqa-desc">
  <title id="sqa-title">Five telemetry signals and the question each one answers</title>
  <desc id="sqa-desc">A table of five signals. Logs record discrete events with time, level, message, request id, and fields, and answer what happened to this request, for example POST /tasks returned 500 with MongoServerError E11000. Metrics are counters, gauges, and histograms aggregated over time and cheap to keep; they answer how much, how fast, and whether it is getting worse, for example the p95 of POST /tasks rose from 80 ms to 400 ms. Traces are spans with parent links across services, each with a duration; they answer where the time went or where it failed, for example 320 of 400 ms spent in tasks.find on MongoDB. Profiles are stack samples of CPU and memory use over time; they answer which function burns the CPU, for example JSON.stringify of large task lists using 35 percent of CPU. Events are deploys, configuration changes, feature flag flips, scaling, and failovers; they answer what changed just before the problem, for example version 1.42.0 deployed at 14:02 and errors began at 14:03.</desc>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="24" y="40">Signal</text>
      <text x="190" y="40">What it records</text>
      <text x="476" y="40">Question it answers (TaskFlow example)</text>
    </g>

    <g fill="#eef1f5" stroke="#c9d1db" stroke-width="1.5">
      <rect x="190" y="56" width="270" height="56" rx="8"/>
      <rect x="476" y="56" width="360" height="56" rx="8"/>
      <rect x="190" y="124" width="270" height="56" rx="8"/>
      <rect x="476" y="124" width="360" height="56" rx="8"/>
      <rect x="190" y="192" width="270" height="56" rx="8"/>
      <rect x="476" y="192" width="360" height="56" rx="8"/>
      <rect x="190" y="260" width="270" height="56" rx="8"/>
      <rect x="476" y="260" width="360" height="56" rx="8"/>
      <rect x="190" y="328" width="270" height="56" rx="8"/>
      <rect x="476" y="328" width="360" height="56" rx="8"/>
    </g>

    <g stroke-width="2">
      <rect x="24" y="56" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="24" y="124" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="24" y="192" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="24" y="260" width="150" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="24" y="328" width="150" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g text-anchor="middle">
      <g font-size="14" font-weight="700" fill="#263e5a">
        <text x="99" y="80">Logs</text>
        <text x="99" y="148">Metrics</text>
        <text x="99" y="216">Traces</text>
      </g>
      <g font-size="14" font-weight="700" fill="#463365">
        <text x="99" y="284">Profiles</text>
        <text x="99" y="352">Events</text>
      </g>
      <g font-size="11.5" fill="#263e5a">
        <text x="99" y="99">discrete events</text>
        <text x="99" y="167">numbers over time</text>
        <text x="99" y="235">request paths</text>
      </g>
      <g font-size="11.5" fill="#463365">
        <text x="99" y="303">code-level cost</text>
        <text x="99" y="371">system changes</text>
      </g>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="204" y="80">One record per event: time, level,</text>
      <text x="204" y="97">message, request id, fields</text>
      <text x="204" y="148">Counters, gauges, histograms,</text>
      <text x="204" y="165">aggregated, cheap to keep</text>
      <text x="204" y="216">Spans with parent links across</text>
      <text x="204" y="233">services, each with a duration</text>
      <text x="204" y="284">Stack samples of CPU and memory</text>
      <text x="204" y="301">use, collected continuously</text>
      <text x="204" y="352">Deploys, config changes, flag</text>
      <text x="204" y="369">flips, scaling, failovers</text>
    </g>

    <g font-size="12.5" font-weight="700" fill="#36424e">
      <text x="490" y="80">What happened to this request?</text>
      <text x="490" y="148">How much, how fast, getting worse?</text>
      <text x="490" y="216">Where did the time go, or fail?</text>
      <text x="490" y="284">Which function burns the CPU?</text>
      <text x="490" y="352">What changed just before this?</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="490" y="99">POST /tasks 500: MongoServerError E11000</text>
      <text x="490" y="167">p95 of POST /tasks rose from 80 ms to 400 ms</text>
      <text x="490" y="235">320 of 400 ms spent in tasks.find on MongoDB</text>
      <text x="490" y="303">JSON.stringify of large task lists: 35% CPU</text>
      <text x="490" y="371">v1.42.0 deployed 14:02, errors began 14:03</text>
    </g>

    <text x="430" y="418" font-size="13" fill="#40566b" text-anchor="middle">Metrics tell you that something is wrong; logs, traces, and profiles tell you why.</text>
  </g>
</svg>
