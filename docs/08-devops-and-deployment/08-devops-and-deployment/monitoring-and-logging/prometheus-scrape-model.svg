<svg xmlns="http://www.w3.org/2000/svg" width="880" height="432" viewBox="0 0 880 432" role="img" aria-labelledby="psm-title psm-desc">
  <title id="psm-title">The Prometheus pull model</title>
  <desc id="psm-desc">The Prometheus server uses service discovery to find its targets, then scrapes each one every 15 seconds with an HTTP GET to /metrics: two TaskFlow API pods exposing prom-client metrics on port 9464, a node exporter reporting host CPU and disk, and a blackbox exporter that probes public URLs. Samples are stored in the local TSDB, which keeps 15 days by default, and recording and alerting rules run against them. Grafana sends PromQL queries to Prometheus for dashboards, Prometheus sends firing alerts to Alertmanager, and remote write copies samples to long-term storage such as Mimir or Thanos. A short-lived nightly backup job cannot be scraped, so it pushes its result to a Pushgateway, which keeps the last pushed value and is scraped like any other target.</desc>
  <defs>
    <marker id="psm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="432" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Targets</text>
    <text x="445" y="34" font-size="13" font-weight="700" fill="#40566b">Server</text>
    <text x="753" y="34" font-size="13" font-weight="700" fill="#40566b">Consumers</text>

    <rect x="24" y="56" width="170" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="76" font-size="14" font-weight="700" fill="#66400f">TaskFlow API 1</text>
    <text x="109" y="94" font-size="11.5" fill="#66400f">prom-client :9464</text>
    <rect x="24" y="120" width="170" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="140" font-size="14" font-weight="700" fill="#66400f">TaskFlow API 2</text>
    <text x="109" y="158" font-size="11.5" fill="#66400f">prom-client :9464</text>
    <rect x="24" y="184" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="109" y="204" font-size="14" font-weight="700" fill="#263e5a">Node exporter</text>
    <text x="109" y="222" font-size="11.5" fill="#263e5a">host CPU, disk</text>
    <rect x="24" y="248" width="170" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="109" y="268" font-size="14" font-weight="700" fill="#463365">Blackbox exporter</text>
    <text x="109" y="286" font-size="11.5" fill="#463365">probes public URLs</text>

    <rect x="330" y="56" width="230" height="240" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="445" y="80" font-size="14" font-weight="700" fill="#263e5a">Prometheus</text>
    <g fill="#f5f7fb" stroke="#4774aa" stroke-width="1.5">
      <rect x="346" y="94" width="198" height="36" rx="8"/>
      <rect x="346" y="142" width="198" height="36" rx="8"/>
      <rect x="346" y="190" width="198" height="36" rx="8"/>
      <rect x="346" y="238" width="198" height="36" rx="8"/>
    </g>
    <g font-size="12" fill="#263e5a">
      <text x="445" y="116">service discovery</text>
      <text x="445" y="164">scrape every 15 s</text>
      <text x="445" y="212">local TSDB, 15 d default</text>
      <text x="445" y="260">recording + alert rules</text>
    </g>

    <rect x="650" y="56" width="206" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="753" y="79" font-size="14" font-weight="700" fill="#263e5a">Grafana</text>
    <text x="753" y="98" font-size="11.5" fill="#263e5a">dashboards</text>
    <rect x="650" y="150" width="206" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="753" y="173" font-size="14" font-weight="700" fill="#463365">Alertmanager</text>
    <text x="753" y="192" font-size="11.5" fill="#463365">routes and notifies</text>
    <rect x="650" y="244" width="206" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="753" y="267" font-size="14" font-weight="700" fill="#263e5a">Long-term storage</text>
    <text x="753" y="286" font-size="11.5" fill="#263e5a">Mimir or Thanos</text>

    <rect x="24" y="336" width="170" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="356" font-size="14" font-weight="700" fill="#66400f">Batch job</text>
    <text x="109" y="374" font-size="11.5" fill="#66400f">nightly backup</text>
    <rect x="250" y="336" width="160" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="330" y="356" font-size="14" font-weight="700" fill="#463365">Pushgateway</text>
    <text x="330" y="374" font-size="11.5" fill="#463365">keeps last push</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M330 80H196" marker-end="url(#psm-arrow)"/>
      <path d="M330 144H196" marker-end="url(#psm-arrow)"/>
      <path d="M330 208H196" marker-end="url(#psm-arrow)"/>
      <path d="M330 272H196" marker-end="url(#psm-arrow)"/>
      <path d="M650 84H562" marker-end="url(#psm-arrow)"/>
      <path d="M560 178H648" marker-end="url(#psm-arrow)"/>
      <path d="M560 272H648" marker-end="url(#psm-arrow)"/>
      <path d="M194 360H248" marker-end="url(#psm-arrow)"/>
      <path d="M400 296 350 334" marker-end="url(#psm-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="262" y="72">GET /metrics</text>
      <text x="262" y="136">GET /metrics</text>
      <text x="262" y="200">GET /metrics</text>
      <text x="262" y="264">GET /metrics</text>
      <text x="605" y="76">PromQL</text>
      <text x="604" y="170">alerts</text>
      <text x="604" y="264">remote write</text>
      <text x="221" y="352">push</text>
      <text x="420" y="324" text-anchor="start">scrape</text>
    </g>

    <text x="440" y="414" font-size="13" fill="#40566b">Prometheus pulls from targets it discovers; only short-lived batch jobs push, via a Pushgateway.</text>
  </g>
</svg>
