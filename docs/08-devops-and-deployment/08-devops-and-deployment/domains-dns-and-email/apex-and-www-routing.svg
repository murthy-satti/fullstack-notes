<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-labelledby="awr-title awr-desc">
  <title id="awr-title">How www and the apex reach the same canonical site</title>
  <desc id="awr-desc">Top row, www.example.com is the canonical host: the browser asks for www.example.com; the DNS host answers with a CNAME to the platform hostname; the platform's DNS returns an edge near the user's resolver; the platform edge serves the site over HTTPS. Bottom row, a visitor types example.com: the DNS host answers for the apex with an alias or A record pointing to a redirect service; http://example.com first answers 301 to https on the same host, as HSTS preload requires; https://example.com sends the HSTS header and a 308 permanent redirect to www.example.com with the path kept. The browser caches the 308, so the next visit goes straight to www and the same canonical site.</desc>
  <defs>
    <marker id="awr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="awr-arrow-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="880" height="372" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">www.example.com, the canonical host: a CNAME lets the platform steer traffic</text>

    <rect x="24" y="44" width="180" height="66" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="241" y="44" width="180" height="66" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="458" y="44" width="180" height="66" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="675" y="44" width="180" height="66" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="114" y="68" fill="#66400f">Browser</text>
      <text x="331" y="68" fill="#263e5a">DNS host</text>
      <text x="548" y="68" fill="#463365">Platform DNS</text>
      <text x="765" y="68" fill="#294a2e">Platform edge</text>
    </g>
    <g font-size="11.5">
      <text x="114" y="88" fill="#66400f">asks for www.example.com</text>
      <text x="331" y="88" fill="#263e5a">www: CNAME to the</text>
      <text x="331" y="102" fill="#263e5a">platform hostname</text>
      <text x="548" y="88" fill="#463365">returns an edge near</text>
      <text x="548" y="102" fill="#463365">the user's resolver</text>
      <text x="765" y="88" fill="#294a2e">serves the site</text>
      <text x="765" y="102" fill="#294a2e">over HTTPS</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 77H239" marker-end="url(#awr-arrow)"/>
      <path d="M421 77H456" marker-end="url(#awr-arrow)"/>
      <path d="M638 77H673" marker-end="url(#awr-arrow)"/>
    </g>

    <path d="M24 140H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="168" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">A visitor types example.com: the apex only redirects</text>

    <rect x="24" y="182" width="180" height="78" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="241" y="182" width="180" height="78" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="458" y="182" width="180" height="78" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <rect x="675" y="182" width="180" height="78" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="114" y="206" fill="#66400f">Browser</text>
      <text x="331" y="206" fill="#263e5a">DNS host</text>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="548" y="206">http://example.com</text>
      <text x="765" y="206">https://example.com</text>
    </g>
    <g font-size="11.5">
      <text x="114" y="226" fill="#66400f">asks for example.com</text>
      <text x="331" y="226" fill="#263e5a">apex: alias or A record</text>
      <text x="331" y="242" fill="#263e5a">to a redirect service</text>
      <text x="548" y="226" fill="#36424e">301 to https on the</text>
      <text x="548" y="242" fill="#36424e">same host first</text>
      <text x="765" y="226" fill="#36424e">HSTS header, then 308</text>
      <text x="765" y="242" fill="#36424e">to www, path kept</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 221H239" marker-end="url(#awr-arrow)"/>
      <path d="M421 221H456" marker-end="url(#awr-arrow)"/>
      <path d="M638 221H673" marker-end="url(#awr-arrow)"/>
    </g>
    <path d="M765 182V112" fill="none" stroke="#53845b" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#awr-arrow-ok)"/>
    <rect x="773" y="148" width="94" height="14" fill="#f5f7fb"/>
    <text x="777" y="159" font-size="11" font-style="italic" fill="#294a2e" text-anchor="start">308 is cached</text>

    <text x="440" y="304" font-size="13" fill="#40566b">One canonical host; every other variant reaches it in at most two redirects, and browsers cache them.</text>
    <text x="440" y="324" font-size="13" fill="#40566b">With HSTS preload, upgrade to HTTPS on the same host before redirecting to www.</text>
    <text x="440" y="344" font-size="13" fill="#40566b">Keep APIs on their own name with no redirects in front.</text>
  </g>
</svg>
