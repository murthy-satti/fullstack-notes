<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="drt-title drt-desc">
  <title id="drt-title">Rolling out DMARC from monitoring to reject</title>
  <desc id="drt-desc">Four stages from left to right. 1, monitor: publish p=none with a rua address for the first weeks and inventory every service that sends as example.com. 2, fix senders: add DKIM with d=example.com, a custom return path so SPF aligns, or move the sender to its own subdomain. 3, quarantine: publish p=quarantine with t=y as a test, then p=quarantine, and watch the reports. 4, reject: publish p=reject with t=y, then p=reject, and set sp and np for subdomains. A dashed arrow from stages 3 and 4 back to stage 2 says that a new failing source sends you back to fixing it. Aggregate reports arrive daily during every stage and afterwards. Advance only when reports show every legitimate sender aligned; receivers that still implement RFC 7489 ignore t=y and apply the published policy.</desc>
  <defs>
    <marker id="drt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="drt-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="880" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">DMARC rollout for example.com (weeks to months)</text>

    <rect x="24" y="44" width="190" height="104" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="238" y="44" width="190" height="104" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="452" y="44" width="190" height="104" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="666" y="44" width="190" height="104" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="119" y="68" fill="#263e5a">1. Monitor</text>
      <text x="333" y="68" fill="#66400f">2. Fix senders</text>
      <text x="547" y="68" fill="#463365">3. Quarantine</text>
      <text x="761" y="68" fill="#294a2e">4. Reject</text>
    </g>
    <g font-size="11.5">
      <text x="119" y="90" fill="#263e5a">p=none; rua=...</text>
      <text x="119" y="108" fill="#263e5a">first weeks</text>
      <text x="119" y="126" fill="#263e5a">inventory all senders</text>
      <text x="333" y="90" fill="#66400f">DKIM d=example.com</text>
      <text x="333" y="108" fill="#66400f">custom return path</text>
      <text x="333" y="126" fill="#66400f">or own subdomain</text>
      <text x="547" y="90" fill="#463365">p=quarantine; t=y</text>
      <text x="547" y="108" fill="#463365">then p=quarantine</text>
      <text x="547" y="126" fill="#463365">watch the reports</text>
      <text x="761" y="90" fill="#294a2e">p=reject; t=y</text>
      <text x="761" y="108" fill="#294a2e">then p=reject</text>
      <text x="761" y="126" fill="#294a2e">set sp and np</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M214 96H236" marker-end="url(#drt-arrow)"/>
      <path d="M428 96H450" marker-end="url(#drt-arrow)"/>
      <path d="M642 96H664" marker-end="url(#drt-arrow)"/>
    </g>

    <g fill="none" stroke="#b5524b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M547 148V180H333V152" marker-end="url(#drt-arrow-ret)"/>
      <path d="M761 148V180H547"/>
    </g>
    <rect x="318" y="188" width="246" height="14" fill="#f5f7fb"/>
    <text x="441" y="199" font-size="11" font-style="italic" fill="#6e2a24">a new failing source: back to fixing</text>

    <rect x="24" y="222" width="832" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="440" y="243" font-size="12" fill="#36424e">Aggregate reports (rua) arrive daily during every stage, and keep arriving afterwards</text>

    <text x="440" y="290" font-size="13" fill="#40566b">Advance only when reports show every legitimate sender aligned.</text>
    <text x="440" y="310" font-size="13" fill="#40566b">Receivers that still implement RFC 7489 ignore t=y and apply the published policy.</text>
  </g>
</svg>
