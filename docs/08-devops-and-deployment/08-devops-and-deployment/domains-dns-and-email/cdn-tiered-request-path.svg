<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="ctr-title ctr-desc">
  <title id="ctr-title">How edge caches and an origin shield reduce origin traffic</title>
  <desc id="ctr-desc">Users in Europe, Asia, and the Americas send 1,000,000 requests in total to their nearest edge locations. Each edge answers 90% of requests from its cache, so 100,000 misses in total go on to one origin shield placed near the origin. The shield answers 80% of those misses from its own cache and merges simultaneous misses for the same object, so only 20,000 requests reach the origin, the S3 bucket or the API load balancer. A bar summarizes the split: edges answer 900,000 requests (90%), the shield 80,000 (8%), and the origin 20,000 (2%). The tiers multiply: 10% miss at the edge, 20% of those miss at the shield, so the origin sees 2%.</desc>
  <defs>
    <marker id="ctr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">1,000,000 requests a day for TaskFlow Web and its public API</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="24" y="44" width="140" height="44" rx="8"/>
      <rect x="24" y="124" width="140" height="44" rx="8"/>
      <rect x="24" y="204" width="140" height="44" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="94" y="71">Users, Europe</text>
      <text x="94" y="151">Users, Asia</text>
      <text x="94" y="231">Users, Americas</text>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="206" y="40" width="160" height="52" rx="8"/>
      <rect x="206" y="120" width="160" height="52" rx="8"/>
      <rect x="206" y="200" width="160" height="52" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#463365">
      <text x="286" y="62">Edge location</text>
      <text x="286" y="142">Edge location</text>
      <text x="286" y="222">Edge location</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="286" y="80">90% answered here</text>
      <text x="286" y="160">90% answered here</text>
      <text x="286" y="240">90% answered here</text>
    </g>

    <rect x="456" y="112" width="170" height="68" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="541" y="135" font-size="14" font-weight="700" fill="#463365">Origin shield</text>
    <text x="541" y="153" font-size="11.5" fill="#463365">near the origin</text>
    <text x="541" y="169" font-size="11.5" fill="#463365">80% of misses hit</text>

    <rect x="694" y="112" width="162" height="68" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="775" y="135" font-size="14" font-weight="700" fill="#263e5a">Origin</text>
    <text x="775" y="153" font-size="11.5" fill="#263e5a">S3 bucket or API LB</text>
    <text x="775" y="169" font-size="11.5" fill="#263e5a">20,000 requests</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 66H204" marker-end="url(#ctr-arrow)"/>
      <path d="M164 146H204" marker-end="url(#ctr-arrow)"/>
      <path d="M164 226H204" marker-end="url(#ctr-arrow)"/>
      <path d="M366 66 454 126" marker-end="url(#ctr-arrow)"/>
      <path d="M366 146H454" marker-end="url(#ctr-arrow)"/>
      <path d="M366 226 454 166" marker-end="url(#ctr-arrow)"/>
      <path d="M626 146H692" marker-end="url(#ctr-arrow)"/>
    </g>
    <rect x="384" y="186" width="56" height="14" fill="#f5f7fb"/>
    <text x="412" y="197" font-size="11" font-style="italic" fill="#40566b">misses</text>
    <text x="541" y="214" font-size="11.5" font-weight="700" fill="#40566b">100,000 misses arrive</text>
    <text x="541" y="230" font-size="11" fill="#40566b">same-object misses merged</text>
    <text x="659" y="138" font-size="11" font-style="italic" fill="#40566b">2%</text>

    <text x="24" y="284" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">Who answers the 1,000,000 requests</text>
    <rect x="24" y="294" width="749" height="24" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="773" y="294" width="66" height="24" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="839" y="294" width="17" height="24" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="398" y="311" font-size="12" font-weight="700" fill="#294a2e">edges: 900,000 (90%)</text>
    <text x="856" y="336" font-size="11.5" fill="#36424e" text-anchor="end">shield: 80,000 (8%), origin: 20,000 (2%)</text>

    <text x="440" y="366" font-size="13" fill="#40566b">Tiers multiply: 10% miss at the edge, 20% of those miss at the shield, so the origin sees 2%.</text>
  </g>
</svg>
