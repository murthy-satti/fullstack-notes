<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" role="img" aria-labelledby="eaf-title eaf-desc">
  <title id="eaf-title">How a receiving server authenticates one TaskFlow email</title>
  <desc id="eaf-desc">A sequence between TaskFlow API, the sending service, the receiving mail server, and DNS for example.com. 1, TaskFlow API asks the sending service to send a reminder from reminders@example.com. 2, the sending service signs the message with DKIM, d=example.com and selector s1. 3, it delivers the message over SMTP from 198.51.100.25 with the envelope MAIL FROM bounce.example.com. 4, the receiving server looks up the SPF record of bounce.example.com; the sending IP is listed, so SPF passes. 5, it fetches the DKIM key at s1._domainkey.example.com; the signature verifies, so DKIM passes. 6, it fetches the DMARC record at _dmarc.example.com and learns the policy and report address. 7, it checks alignment: both bounce.example.com and example.com belong to the From domain example.com, so DMARC passes. Outcomes: a DMARC pass lets reputation decide between inbox and spam; a failure with p=none is delivered and reported; with quarantine it goes to spam; with reject it is refused during SMTP. Once a day the receiver sends an aggregate report to the rua address.</desc>
  <defs>
    <marker id="eaf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="eaf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="512" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="47" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <rect x="255" y="20" width="150" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="330" y="47" font-size="14" font-weight="700" fill="#463365">Sending service</text>
    <rect x="485" y="20" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="560" y="39" font-size="13" font-weight="700" fill="#263e5a">Receiving server</text>
    <text x="560" y="55" font-size="11" fill="#263e5a">for example Gmail</text>
    <rect x="706" y="20" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="781" y="39" font-size="13" font-weight="700" fill="#263e5a">DNS</text>
    <text x="781" y="55" font-size="11" fill="#263e5a">example.com zone</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M99 64V396"/>
      <path d="M330 64V396"/>
      <path d="M560 64V396"/>
      <path d="M781 64V396"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M99 96H328" marker-end="url(#eaf-arrow)"/>
      <path d="M330 168H558" marker-end="url(#eaf-arrow)"/>
      <path d="M560 204H779" marker-end="url(#eaf-arrow)"/>
      <path d="M560 256H779" marker-end="url(#eaf-arrow)"/>
      <path d="M560 308H779" marker-end="url(#eaf-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M781 228H562" marker-end="url(#eaf-arrow-ret)"/>
      <path d="M781 280H562" marker-end="url(#eaf-arrow-ret)"/>
      <path d="M781 332H562" marker-end="url(#eaf-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="214" y="90">1. send from reminders@example.com</text>
      <text x="444" y="148">3. SMTP from 198.51.100.25,</text>
      <text x="444" y="162">MAIL FROM bounce.example.com</text>
      <text x="670" y="198">4. SPF: bounce.example.com</text>
      <text x="670" y="250">5. key at s1._domainkey</text>
      <text x="670" y="302">6. _dmarc.example.com</text>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="670" y="222">IP listed: SPF pass</text>
      <text x="670" y="274">signature verifies: pass</text>
      <text x="670" y="326">p=quarantine, rua=...</text>
    </g>

    <rect x="225" y="112" width="210" height="26" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="330" y="129" font-size="11.5" font-weight="700" fill="#463365">2. DKIM sign, d=example.com</text>
    <rect x="455" y="350" width="210" height="30" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="560" y="370" font-size="11.5" font-weight="700" fill="#294a2e">7. aligned with From: pass</text>

    <g stroke-width="2">
      <rect x="24" y="408" width="196" height="46" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="236" y="408" width="196" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="448" y="408" width="196" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="660" y="408" width="196" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="12.5" font-weight="700">
      <text x="122" y="426" fill="#294a2e">DMARC pass</text>
      <text x="334" y="426" fill="#36424e">fail, p=none</text>
      <text x="546" y="426" fill="#66400f">fail, p=quarantine</text>
      <text x="758" y="426" fill="#6e2a24">fail, p=reject</text>
    </g>
    <g font-size="11">
      <text x="122" y="444" fill="#294a2e">reputation picks the folder</text>
      <text x="334" y="444" fill="#36424e">delivered, and reported</text>
      <text x="546" y="444" fill="#66400f">spam folder</text>
      <text x="758" y="444" fill="#6e2a24">refused during SMTP</text>
    </g>

    <text x="440" y="482" font-size="13" fill="#40566b">Receivers check SPF, DKIM, and DMARC in DNS; DMARC ties a passing check to the visible From.</text>
    <text x="440" y="501" font-size="13" fill="#40566b">Once a day the receiver sends an aggregate report to the rua address.</text>
  </g>
</svg>
