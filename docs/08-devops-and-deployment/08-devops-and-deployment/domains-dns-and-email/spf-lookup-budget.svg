<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="slb-title slb-desc">
  <title id="slb-title">Counting SPF DNS lookups against the limit of 10</title>
  <desc id="slb-desc">The SPF record v=spf1 a mx include:_spf.mail.example.net include:_spf.support.example.net include:_spf.crm.example.net -all. Before: a uses one lookup, mx one, the mail provider's include four (one plus three nested includes), the support desk's include three (one plus two nested), and the CRM's include two (one plus one nested): eleven lookups, one past the limit of ten, so every SPF check returns permerror. After: a and mx are removed because the domain sends no mail from its web or MX hosts, and the CRM moves to crm.example.com with its own SPF record and its own budget of ten; example.com now needs seven lookups, leaving three spare.</desc>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Counting SPF lookups (limit: 10 per check, nested includes count)</text>
    <rect x="24" y="40" width="832" height="32" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="440" y="61" font-size="11.5" fill="#36424e">v=spf1 a mx include:_spf.mail.example.net include:_spf.support.example.net include:_spf.crm.example.net -all</text>

    <text x="24" y="102" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">Before</text>
    <text x="856" y="102" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="end">11 lookups: permerror, SPF fails for every message</text>
    <g stroke-width="1.5">
      <rect x="24" y="110" width="64" height="34" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="92" y="110" width="64" height="34" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="160" y="110" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="228" y="110" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="296" y="110" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="364" y="110" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="432" y="110" width="64" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="500" y="110" width="64" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="568" y="110" width="64" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="636" y="110" width="64" height="34" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="704" y="110" width="64" height="34" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="2.5"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="56" y="132">1</text>
      <text x="124" y="132">2</text>
      <text x="192" y="132">3</text>
      <text x="260" y="132">4</text>
      <text x="328" y="132">5</text>
      <text x="396" y="132">6</text>
      <text x="464" y="132">7</text>
      <text x="532" y="132">8</text>
      <text x="600" y="132">9</text>
      <text x="668" y="132">10</text>
      <text x="736" y="132" fill="#6e2a24">11</text>
    </g>
    <path d="M702 108V152" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="4 3"/>
    <g font-size="11" fill="#36424e">
      <text x="56" y="164">a</text>
      <text x="124" y="164">mx</text>
      <text x="294" y="164">mail provider: 1 + 3 nested</text>
      <text x="532" y="164">support desk: 1 + 2 nested</text>
      <text x="702" y="164">CRM: 1 + 1</text>
    </g>
    <text x="702" y="182" font-size="11" font-weight="700" fill="#6e2a24">limit</text>

    <text x="24" y="218" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">After</text>
    <text x="856" y="218" font-size="12" font-weight="700" fill="#294a2e" text-anchor="end">7 lookups at example.com, 3 spare</text>
    <g stroke-width="1.5">
      <rect x="24" y="226" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="92" y="226" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="160" y="226" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="228" y="226" width="64" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="296" y="226" width="64" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="364" y="226" width="64" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="432" y="226" width="64" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="4 3">
      <rect x="500" y="226" width="64" height="34" rx="4"/>
      <rect x="568" y="226" width="64" height="34" rx="4"/>
      <rect x="636" y="226" width="64" height="34" rx="4"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="158" y="280">mail provider: 4</text>
      <text x="396" y="280">support desk: 3</text>
      <text x="600" y="280">spare</text>
    </g>

    <rect x="24" y="296" width="400" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="224" y="321" font-size="11.5" fill="#66400f">CRM moved to crm.example.com: its own record, its own 10</text>
    <rect x="456" y="296" width="400" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="656" y="321" font-size="11.5" fill="#36424e">a and mx removed: no mail is sent from those hosts</text>

    <text x="440" y="364" font-size="13" fill="#40566b">Includes inside includes count too; give each sender its own subdomain to get a fresh budget of 10.</text>
  </g>
</svg>
