<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="dso-title dso-desc">
  <title id="dso-title">How traffic moves from v1 to v2 under four deployment strategies</title>
  <desc id="dso-desc">Four rows, each read left to right over four steps. Recreate: v1 serves 100 percent, then every v1 instance is stopped and nothing serves traffic, then v2 starts and warms up while nothing serves, then v2 serves 100 percent. Rolling: four v1 instances, then one batch is replaced by v2, then half are v2, then all four are v2. Blue-green: v1 serves 100 percent while v2 is deployed idle beside it, v2 is tested privately while v1 still serves everything, the router switches so v2 serves 100 percent, and v1 is kept running for a fast rollback. Canary: 1 percent of traffic goes to v2, then 10 percent once metrics look healthy, then 50 percent, then 100 percent when v2 is promoted. All four end at 100 percent v2; they differ in downtime, cost, and how many users a bad v2 can reach.</desc>
  <defs>
    <marker id="dso-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="840" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">How traffic moves from v1 to v2</text>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="266" y="46">step 1</text>
      <text x="424" y="46">step 2</text>
      <text x="582" y="46">step 3</text>
      <text x="740" y="46">step 4</text>
    </g>
    <path d="M192 58H812" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#dso-arrow)"/>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="20" y="70" width="160" height="56" rx="8"/>
      <rect x="20" y="154" width="160" height="56" rx="8"/>
      <rect x="20" y="238" width="160" height="56" rx="8"/>
      <rect x="20" y="322" width="160" height="56" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="100" y="94">Recreate</text>
      <text x="100" y="178">Rolling</text>
      <text x="100" y="262">Blue-green</text>
      <text x="100" y="346">Canary</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="100" y="112">downtime, simple</text>
      <text x="100" y="196">replace in batches</text>
      <text x="100" y="280">two full stacks</text>
      <text x="100" y="364">small % first</text>
    </g>

    <g stroke-width="1.5">
      <rect x="192" y="76" width="148" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="350" y="76" width="148" height="24" rx="4" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="508" y="76" width="148" height="24" rx="4" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="666" y="76" width="148" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="266" y="92" fill="#263e5a">v1 100%</text>
      <text x="424" y="92" fill="#6e2a24">no traffic served</text>
      <text x="582" y="92" fill="#6e2a24">no traffic served</text>
      <text x="740" y="92" fill="#294a2e">v2 100%</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="266" y="118">v1 serves all</text>
      <text x="424" y="118">stop every v1</text>
      <text x="582" y="118">start v2, warm up</text>
      <text x="740" y="118">v2 serves all</text>
    </g>

    <g stroke-width="1.5">
      <rect x="192" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="231" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="270" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="309" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="350" y="160" width="31" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="389" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="428" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="467" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="508" y="160" width="31" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="547" y="160" width="31" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="586" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="625" y="160" width="31" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="666" y="160" width="31" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="705" y="160" width="31" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="744" y="160" width="31" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="783" y="160" width="31" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="207.5" y="176" fill="#263e5a">v1</text>
      <text x="246.5" y="176" fill="#263e5a">v1</text>
      <text x="285.5" y="176" fill="#263e5a">v1</text>
      <text x="324.5" y="176" fill="#263e5a">v1</text>
      <text x="365.5" y="176" fill="#294a2e">v2</text>
      <text x="404.5" y="176" fill="#263e5a">v1</text>
      <text x="443.5" y="176" fill="#263e5a">v1</text>
      <text x="482.5" y="176" fill="#263e5a">v1</text>
      <text x="523.5" y="176" fill="#294a2e">v2</text>
      <text x="562.5" y="176" fill="#294a2e">v2</text>
      <text x="601.5" y="176" fill="#263e5a">v1</text>
      <text x="640.5" y="176" fill="#263e5a">v1</text>
      <text x="681.5" y="176" fill="#294a2e">v2</text>
      <text x="720.5" y="176" fill="#294a2e">v2</text>
      <text x="759.5" y="176" fill="#294a2e">v2</text>
      <text x="798.5" y="176" fill="#294a2e">v2</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="266" y="202">4 v1 instances</text>
      <text x="424" y="202">batch 1 replaced</text>
      <text x="582" y="202">half replaced</text>
      <text x="740" y="202">all four are v2</text>
    </g>

    <g stroke-width="1.5">
      <rect x="192" y="244" width="148" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="350" y="244" width="148" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="508" y="244" width="148" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="666" y="244" width="148" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="266" y="260" fill="#263e5a">v1 100%</text>
      <text x="424" y="260" fill="#263e5a">v1 100%</text>
      <text x="582" y="260" fill="#294a2e">v2 100%</text>
      <text x="740" y="260" fill="#294a2e">v2 100%</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="266" y="286">v2 idle beside v1</text>
      <text x="424" y="286">test v2 privately</text>
      <text x="582" y="286">router switched</text>
      <text x="740" y="286">v1 kept for rollback</text>
    </g>

    <g stroke-width="1.5">
      <rect x="192" y="328" width="144" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="336" y="328" width="4" height="24" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="350" y="328" width="133" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="483" y="328" width="15" height="24" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="508" y="328" width="74" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="582" y="328" width="74" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="666" y="328" width="148" height="24" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="264" y="344" fill="#263e5a">v1 99%</text>
      <text x="416" y="344" fill="#263e5a">v1 90%</text>
      <text x="545" y="344" fill="#263e5a">v1 50%</text>
      <text x="619" y="344" fill="#294a2e">v2 50%</text>
      <text x="740" y="344" fill="#294a2e">v2 100%</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="266" y="370">1% to v2</text>
      <text x="424" y="370">10%, metrics OK</text>
      <text x="582" y="370">50%, still healthy</text>
      <text x="740" y="370">100%: promoted</text>
    </g>

    <rect x="192" y="396" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="214" y="408" font-size="11.5" fill="#36424e" text-anchor="start">v1, old version</text>
    <rect x="360" y="396" width="14" height="14" rx="3" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="382" y="408" font-size="11.5" fill="#36424e" text-anchor="start">v2, new version</text>
    <rect x="528" y="396" width="14" height="14" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="550" y="408" font-size="11.5" fill="#36424e" text-anchor="start">nothing serving (downtime)</text>

    <text x="420" y="442" font-size="13" fill="#40566b">All four end at 100% v2; they differ in downtime, cost, and how many users a bad v2 can reach.</text>
  </g>
</svg>
