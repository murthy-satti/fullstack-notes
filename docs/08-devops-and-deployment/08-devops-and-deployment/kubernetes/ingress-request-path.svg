<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="irp-title irp-desc">
  <title id="irp-title">An external request through a load balancer and an ingress controller</title>
  <desc id="irp-desc">A browser sends HTTPS on port 443 for api.example.com or app.example.com. DNS points both names at a cloud load balancer, created for the ingress controller's LoadBalancer Service, which forwards TCP traffic to the ingress controller Pods. The controller terminates TLS with a certificate from a TLS Secret that cert-manager obtained from Let's Encrypt over ACME and keeps renewed. The controller watches Ingress or HTTPRoute rules: api.example.com goes to the taskflow-api Service and app.example.com goes to the taskflow-web Service. Each Service's EndpointSlice lists the ready Pods, two taskflow-api Pods and one taskflow-web Pod, and many controllers send traffic straight to those Pod IPs.</desc>
  <defs>
    <marker id="irp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="irp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="300" y="24" width="250" height="88" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="425" y="46" font-size="13" font-weight="700" fill="#463365">Ingress or HTTPRoute rules</text>
    <g font-size="11" fill="#463365">
      <text x="425" y="68">api.example.com → taskflow-api:80</text>
      <text x="425" y="86">app.example.com → taskflow-web:80</text>
      <text x="425" y="103">TLS: secret taskflow-tls</text>
    </g>

    <rect x="24" y="172" width="118" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="83" y="195" font-size="13.5" font-weight="700" fill="#66400f">browser</text>
    <text x="83" y="213" font-size="11" fill="#66400f">HTTPS :443</text>

    <rect x="166" y="172" width="118" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="225" y="195" font-size="13" font-weight="700" fill="#263e5a">cloud LB</text>
    <text x="225" y="213" font-size="11" fill="#263e5a">public IP, L4</text>

    <rect x="320" y="160" width="210" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="425" y="186" font-size="13.5" font-weight="700" fill="#263e5a">ingress controller</text>
    <text x="425" y="205" font-size="11.5" fill="#263e5a">Pods: terminate TLS,</text>
    <text x="425" y="222" font-size="11.5" fill="#263e5a">route by host and path</text>

    <rect x="320" y="298" width="210" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="425" y="320" font-size="13" font-weight="700" fill="#294a2e">cert-manager</text>
    <text x="425" y="338" font-size="11" fill="#294a2e">ACME with Let's Encrypt; writes</text>
    <text x="425" y="353" font-size="11" fill="#294a2e">and renews the TLS Secret</text>

    <rect x="584" y="112" width="128" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="648" y="133" font-size="12.5" font-weight="700" fill="#263e5a">Service</text>
    <text x="648" y="150" font-size="11" fill="#263e5a">taskflow-api</text>
    <rect x="584" y="250" width="128" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="648" y="271" font-size="12.5" font-weight="700" fill="#263e5a">Service</text>
    <text x="648" y="288" font-size="11" fill="#263e5a">taskflow-web</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="740" y="92" width="96" height="40" rx="8"/>
      <rect x="740" y="142" width="96" height="40" rx="8"/>
      <rect x="740" y="255" width="96" height="40" rx="8"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#294a2e">
      <text x="788" y="116">api Pod</text>
      <text x="788" y="166">api Pod</text>
      <text x="788" y="279">web Pod</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 200H164" marker-end="url(#irp-arrow)"/>
      <path d="M284 200H318" marker-end="url(#irp-arrow)"/>
      <path d="M530 184H556V137H582" marker-end="url(#irp-arrow)"/>
      <path d="M530 216H566V275H582" marker-end="url(#irp-arrow)"/>
      <path d="M712 130L738 113" marker-end="url(#irp-arrow)"/>
      <path d="M712 146L738 160" marker-end="url(#irp-arrow)"/>
      <path d="M712 275H738" marker-end="url(#irp-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M425 112V158" marker-end="url(#irp-arrow-ret)"/>
      <path d="M425 298V242" marker-end="url(#irp-arrow-ret)"/>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="433" y="140">watches</text>
      <text x="433" y="278">TLS Secret</text>
    </g>

    <path d="M24 386H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="408" font-size="11.5" fill="#36424e">DNS points both hostnames at the load balancer. Many controllers read EndpointSlices and send traffic straight to Pod IPs.</text>
    <text x="430" y="436" font-size="13" fill="#40566b">One entry point terminates TLS and routes every hostname and path to the right Service.</text>
  </g>
</svg>
