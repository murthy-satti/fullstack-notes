<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="srp-title srp-desc">
  <title id="srp-title">How a request to a Service reaches a Pod</title>
  <desc id="srp-desc">A client Pod on node 1 calls http://taskflow-api.taskflow:80. Step 1: it asks CoreDNS for taskflow-api.taskflow.svc.cluster.local. Step 2: CoreDNS answers with the ClusterIP 10.96.12.34. Step 3: the client opens a TCP connection to 10.96.12.34 port 80. Step 4: the packet never leaves node 1 as addressed: kernel rules that kube-proxy programmed from the EndpointSlice (iptables or nftables) rewrite the destination to one ready endpoint, here 10.244.2.7 port 3000, and the CNI network routes it to Pod B on node 2. Step 5: Pod B's response returns and the kernel reverses the address translation, so the client sees a reply from 10.96.12.34. kube-proxy wrote the rules ahead of time and is not in the data path.</desc>
  <defs>
    <marker id="srp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="srp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="20" width="160" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="120" y="41" font-size="13.5" font-weight="700" fill="#66400f">client Pod</text>
    <text x="120" y="59" font-size="11.5" fill="#66400f">node 1</text>
    <rect x="260" y="20" width="160" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="340" y="41" font-size="13.5" font-weight="700" fill="#463365">CoreDNS</text>
    <text x="340" y="59" font-size="11.5" fill="#463365">cluster DNS</text>
    <rect x="480" y="20" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="560" y="41" font-size="13.5" font-weight="700" fill="#263e5a">node 1 kernel</text>
    <text x="560" y="59" font-size="11.5" fill="#263e5a">rules from kube-proxy</text>
    <rect x="680" y="20" width="160" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="760" y="41" font-size="13.5" font-weight="700" fill="#294a2e">Pod B</text>
    <text x="760" y="59" font-size="11.5" fill="#294a2e">node 2, 10.244.2.7</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M120 70V332"/>
      <path d="M340 70V332"/>
      <path d="M560 70V332"/>
      <path d="M760 70V332"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M120 110H338" marker-end="url(#srp-arrow)"/>
      <path d="M120 200H558" marker-end="url(#srp-arrow)"/>
      <path d="M560 250H758" marker-end="url(#srp-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M340 150H122" marker-end="url(#srp-arrow-ret)"/>
      <path d="M760 300H122" marker-end="url(#srp-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="229" y="103">1. A? taskflow-api.taskflow.svc...</text>
      <text x="229" y="143">2. 10.96.12.34 (ClusterIP)</text>
      <text x="229" y="193">3. TCP to 10.96.12.34:80</text>
      <text x="659" y="242">4. DNAT to 10.244.2.7:3000</text>
    </g>
    <text x="450" y="193" font-size="11.5" font-style="italic" fill="#36424e">(no Pod owns this IP)</text>
    <text x="659" y="268" font-size="11.5" fill="#36424e">routed by the CNI to node 2</text>
    <text x="450" y="293" font-size="11.5" fill="#36424e">5. response, NAT reversed</text>

    <rect x="24" y="350" width="812" height="44" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="368" font-size="11.5" fill="#36424e">kube-proxy watched the EndpointSlice and wrote these rules earlier; it does not forward packets itself.</text>
    <text x="430" y="385" font-size="11.5" fill="#36424e">The endpoint is chosen per connection, so long-lived connections stay on one Pod.</text>

    <text x="430" y="416" font-size="13" fill="#40566b">A Service is a stable name and virtual IP; the kernel on each node does the load balancing.</text>
  </g>
</svg>
