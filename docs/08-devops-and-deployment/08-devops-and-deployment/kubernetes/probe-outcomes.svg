<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="pro-title pro-desc">
  <title id="pro-title">What each probe does on success and on failure</title>
  <desc id="pro-desc">startupProbe asks whether the app has finished starting. On its first success, the liveness and readiness probes begin and the startup probe never runs again. If it fails failureThreshold times in a row, failureThreshold times periodSeconds is exceeded, and the kubelet kills and restarts the container. readinessProbe asks whether the Pod can serve traffic now. On success the Pod is Ready and its address is marked ready in the EndpointSlice. On failure it is marked not ready and removed from load balancing, but it is not restarted. livenessProbe asks whether the container is stuck beyond self-recovery. Success changes nothing. Failure makes the kubelet kill the container, which restarts; repeated restarts lead to CrashLoopBackOff. On a timeline, the startup probe runs from container start until its first success, after which the readiness and liveness probes both run every periodSeconds for the rest of the Pod's life.</desc>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="256" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="152" y="46" font-size="14" font-weight="700" fill="#463365">startupProbe</text>
    <text x="152" y="65" font-size="11.5" fill="#463365">Has the app finished starting?</text>
    <rect x="302" y="24" width="256" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="46" font-size="14" font-weight="700" fill="#263e5a">readinessProbe</text>
    <text x="430" y="65" font-size="11.5" fill="#263e5a">Can it serve traffic right now?</text>
    <rect x="580" y="24" width="256" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="708" y="46" font-size="14" font-weight="700" fill="#66400f">livenessProbe</text>
    <text x="708" y="65" font-size="11.5" fill="#66400f">Is it stuck beyond self-recovery?</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="24" y="92" width="256" height="62" rx="8"/>
      <rect x="302" y="92" width="256" height="62" rx="8"/>
      <rect x="580" y="92" width="256" height="62" rx="8"/>
    </g>
    <g font-size="11.5" fill="#294a2e">
      <text x="152" y="112" font-weight="700">first success</text>
      <text x="152" y="129">liveness and readiness begin;</text>
      <text x="152" y="145">this probe never runs again</text>
      <text x="430" y="112" font-weight="700">success</text>
      <text x="430" y="129">Pod is Ready: its endpoint is</text>
      <text x="430" y="145">marked ready and gets traffic</text>
      <text x="708" y="112" font-weight="700">success</text>
      <text x="708" y="129">nothing happens;</text>
      <text x="708" y="145">no effect on traffic</text>
    </g>

    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="24" y="166" width="256" height="78" rx="8"/>
      <rect x="302" y="166" width="256" height="78" rx="8"/>
      <rect x="580" y="166" width="256" height="78" rx="8"/>
    </g>
    <g font-size="11.5" fill="#6e2a24">
      <text x="152" y="186" font-weight="700">failureThreshold failures</text>
      <text x="152" y="203">failureThreshold × periodSeconds</text>
      <text x="152" y="219">exceeded: the kubelet kills</text>
      <text x="152" y="235">and restarts the container</text>
      <text x="430" y="186" font-weight="700">failureThreshold failures</text>
      <text x="430" y="203">marked not ready: removed</text>
      <text x="430" y="219">from load balancing;</text>
      <text x="430" y="235">the container is NOT restarted</text>
      <text x="708" y="186" font-weight="700">failureThreshold failures</text>
      <text x="708" y="203">the kubelet kills the container</text>
      <text x="708" y="219">and it restarts; repeated</text>
      <text x="708" y="235">restarts: CrashLoopBackOff</text>
    </g>

    <path d="M24 266H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="290" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Over a container's life</text>

    <rect x="140" y="304" width="210" height="28" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="245" y="323" font-size="11.5" fill="#463365">startupProbe until first success</text>
    <rect x="350" y="304" width="486" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="593" y="323" font-size="11.5" fill="#263e5a">readinessProbe every periodSeconds, for the Pod's whole life</text>
    <rect x="350" y="340" width="486" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="593" y="359" font-size="11.5" fill="#66400f">livenessProbe every periodSeconds, for the Pod's whole life</text>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="24" y="323">container starts</text>
      <text x="24" y="359">time →</text>
    </g>
    <path d="M350 296V376" stroke="#40566b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="350" y="392" font-size="11" fill="#36424e">startup succeeded</text>

    <text x="430" y="432" font-size="13" fill="#40566b">Readiness controls traffic; liveness and startup control restarts.</text>
  </g>
</svg>
