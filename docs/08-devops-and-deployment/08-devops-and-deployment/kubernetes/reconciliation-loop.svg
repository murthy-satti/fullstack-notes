<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="rcl-title rcl-desc">
  <title id="rcl-title">The reconciliation loop of a Kubernetes controller</title>
  <desc id="rcl-desc">A controller runs a loop. It reads the desired state from the object's spec, for example replicas 3 and image 1.4.0. It observes the actual state through watches on the API server, for example 2 Pods running after a node failed. It computes the difference, here 1 Pod missing. It acts to close the gap by creating 1 Pod, which the scheduler binds to a healthy node. Then it observes again. The loop is level-triggered: it runs on every change and periodically, until actual equals desired. Example timeline when a node fails: at t0, 3 Pods run and match the spec; at t1, node-2 stops responding; at t2, about 5 minutes later by default, its Pod is evicted; at t3, the ReplicaSet controller sees 2 of 3; at t4, it creates 1 Pod and the scheduler binds it; at t5, the kubelet on node-3 starts it and 3 of 3 run again.</desc>
  <defs>
    <marker id="rcl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="200" y="30" width="200" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="300" y="52" font-size="13.5" font-weight="700" fill="#66400f">1. Desired state (spec)</text>
    <text x="300" y="70" font-size="11.5" fill="#66400f">replicas: 3</text>
    <text x="300" y="85" font-size="11.5" fill="#66400f">image: taskflow-api:1.4.0</text>

    <rect x="380" y="178" width="200" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="480" y="200" font-size="13.5" font-weight="700" fill="#263e5a">2. Observe (status)</text>
    <text x="480" y="218" font-size="11.5" fill="#263e5a">watch the API server:</text>
    <text x="480" y="233" font-size="11.5" fill="#263e5a">2 Pods running</text>

    <rect x="200" y="326" width="200" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="300" y="348" font-size="13.5" font-weight="700" fill="#463365">3. Compare</text>
    <text x="300" y="366" font-size="11.5" fill="#463365">desired 3, actual 2:</text>
    <text x="300" y="381" font-size="11.5" fill="#463365">1 Pod missing</text>

    <rect x="24" y="178" width="196" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="122" y="200" font-size="13.5" font-weight="700" fill="#294a2e">4. Act</text>
    <text x="122" y="218" font-size="11.5" fill="#294a2e">create 1 Pod; the scheduler</text>
    <text x="122" y="233" font-size="11.5" fill="#294a2e">binds it to a healthy node</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 62H480V176" marker-end="url(#rcl-arrow)"/>
      <path d="M480 242V358H402" marker-end="url(#rcl-arrow)"/>
      <path d="M200 358H122V244" marker-end="url(#rcl-arrow)"/>
      <path d="M122 176V62H198" marker-end="url(#rcl-arrow)"/>
    </g>

    <text x="300" y="196" font-size="12" font-weight="700" fill="#40566b">level-triggered loop</text>
    <text x="300" y="214" font-size="11.5" fill="#36424e">runs on every change</text>
    <text x="300" y="230" font-size="11.5" fill="#36424e">and periodically, until</text>
    <text x="300" y="246" font-size="11.5" fill="#36424e">actual = desired</text>

    <path d="M612 24V392" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="630" y="46" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Example: a node fails</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <circle cx="636" cy="76" r="5" fill="#53845b"/>
      <text x="648" y="80"><tspan font-weight="700">t0</tspan> 3 Pods running = spec</text>
      <circle cx="636" cy="112" r="5" fill="#b5524b"/>
      <text x="648" y="116"><tspan font-weight="700">t1</tspan> node-2 stops responding</text>
      <circle cx="636" cy="148" r="5" fill="#bd7a20"/>
      <text x="648" y="152"><tspan font-weight="700">t2</tspan> ~5 min later its Pod</text>
      <text x="667" y="168">is evicted (default)</text>
      <circle cx="636" cy="200" r="5" fill="#4774aa"/>
      <text x="648" y="204"><tspan font-weight="700">t3</tspan> ReplicaSet sees 2 of 3</text>
      <circle cx="636" cy="236" r="5" fill="#8062a8"/>
      <text x="648" y="240"><tspan font-weight="700">t4</tspan> creates 1 Pod; the</text>
      <text x="667" y="256">scheduler picks node-3</text>
      <circle cx="636" cy="288" r="5" fill="#53845b"/>
      <text x="648" y="292"><tspan font-weight="700">t5</tspan> kubelet starts it:</text>
      <text x="667" y="308">3 of 3 running again</text>
    </g>
    <path d="M636 82V106M636 118V142M636 154V194M636 206V230M636 242V282" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="430" y="416" font-size="13" fill="#40566b">Controllers do not run commands once; they keep pushing actual state toward the spec.</text>
  </g>
</svg>
