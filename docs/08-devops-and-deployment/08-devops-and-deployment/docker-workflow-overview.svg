<svg xmlns="http://www.w3.org/2000/svg" width="860" height="304" viewBox="0 0 860 304" role="img" aria-labelledby="dwo-title dwo-desc">
  <title id="dwo-title">From a Dockerfile to running containers</title>
  <desc id="dwo-desc">A Dockerfile plus the source code is turned into an image by docker build. The image is a stack of read-only layers with a tag such as taskflow-api:1.4.0 and a content digest. docker push uploads it to a registry such as GHCR or Docker Hub, which stores and serves images by tag or digest. On a server, docker pull downloads the image and docker run starts a container: the image plus a thin writable layer, running as an isolated process. The same image, referenced by digest, runs unchanged on a developer laptop, in CI tests, in staging, and in production.</desc>
  <defs>
    <marker id="dwo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="304" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Build once on a laptop or CI runner, then run the same image anywhere</text>

    <rect x="24" y="52" width="130" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="89" y="78" font-size="14" font-weight="700" fill="#66400f">Dockerfile</text>
    <text x="89" y="96" font-size="11.5" fill="#66400f">+ source code</text>

    <rect x="251" y="52" width="130" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="316" y="78" font-size="14" font-weight="700" fill="#463365">Image</text>
    <text x="316" y="96" font-size="11.5" fill="#463365">read-only layers</text>

    <rect x="478" y="52" width="130" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="543" y="78" font-size="14" font-weight="700" fill="#263e5a">Registry</text>
    <text x="543" y="96" font-size="11.5" fill="#263e5a">GHCR, Docker Hub</text>

    <rect x="706" y="52" width="130" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="771" y="78" font-size="14" font-weight="700" fill="#294a2e">Container</text>
    <text x="771" y="96" font-size="11.5" fill="#294a2e">running process</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M154 82H249" marker-end="url(#dwo-arrow)"/>
      <path d="M381 82H476" marker-end="url(#dwo-arrow)"/>
      <path d="M608 82H704" marker-end="url(#dwo-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="202" y="73">docker build</text>
      <text x="429" y="73">docker push</text>
      <text x="657" y="73">docker pull</text>
      <text x="657" y="100">docker run</text>
    </g>

    <g font-size="11" fill="#36424e">
      <text x="89" y="134">FROM, COPY, RUN, CMD</text>
      <text x="89" y="150">one instruction per step</text>
      <text x="316" y="134">taskflow-api:1.4.0</text>
      <text x="316" y="150">plus a sha256 digest</text>
      <text x="543" y="134">stores and serves</text>
      <text x="543" y="150">images by tag or digest</text>
      <text x="771" y="134">image + writable layer</text>
      <text x="771" y="150">isolated by the kernel</text>
    </g>

    <path d="M24 172H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="198" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Pulled by digest, the identical image runs in every environment</text>

    <g font-size="12" font-weight="700" fill="#294a2e">
      <rect x="24" y="214" width="188" height="32" rx="16" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="118" y="235">developer laptop</text>
      <rect x="232" y="214" width="188" height="32" rx="16" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="326" y="235">CI test job</text>
      <rect x="440" y="214" width="188" height="32" rx="16" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="534" y="235">staging</text>
      <rect x="648" y="214" width="188" height="32" rx="16" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="742" y="235">production</text>
    </g>

    <text x="430" y="284" font-size="13" fill="#40566b">Build once, push to a registry, then run the identical image wherever a container runtime exists.</text>
  </g>
</svg>
