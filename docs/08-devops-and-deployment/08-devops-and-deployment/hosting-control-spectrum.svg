<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" role="img" aria-labelledby="hcs-title hcs-desc">
  <title id="hcs-title">Hosting options from most control to most convenience, and storage from hot to cold</title>
  <desc id="hcs-desc">Compute options are listed top to bottom from most control to most convenience. Virtual machines such as EC2, Droplets, Hetzner, and Linode: you manage the OS, patches, runtime, and scaling, billed by instance-hours. Kubernetes on EKS, GKE, or AKS: you manage nodes, manifests, and upgrades, billed for nodes plus a cluster fee. Serverless containers on Cloud Run, Fargate, or Azure Container Apps: you supply a container image, billed by vCPU-seconds and GB-seconds. Platforms as a service such as Render, Heroku, App Service, and Fly.io: you supply code, config, and an instance size, billed per instance plan. Functions on Lambda, Azure Functions, or Cloud Run functions: you write handler code within timeouts, billed by requests and GB-seconds. Edge functions on Cloudflare Workers or CloudFront Functions: small handlers near users, billed by requests and CPU time. Static hosting with a CDN on S3 and CloudFront, Vercel, Netlify, or Cloudflare: you supply the build output, billed by GB served and requests. Below, data storage options run left to right from databases and block storage through file and object storage to archive storage: hotter and faster with a higher price per GB on the left, colder and slower to read with a lower price per GB on the right.</desc>
  <defs>
    <marker id="hcs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="hcs-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">Where code runs: most control at the top, most convenience at the bottom</text>

    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="240" y="56">Examples</text>
      <text x="462" y="56">You manage</text>
      <text x="676" y="56">Billed by</text>
    </g>
    <path d="M44 66V390" fill="none" stroke="#40566b" stroke-width="2" marker-start="url(#hcs-arrow-start)" marker-end="url(#hcs-arrow)"/>
    <g font-size="11" font-style="italic" fill="#40566b" text-anchor="middle">
      <text x="44" y="56">control</text>
      <text x="44" y="408">convenience</text>
    </g>

    <g stroke-width="1" stroke="#c9d1db" fill="#ffffff">
      <rect x="64" y="64" width="772" height="40" rx="8"/>
      <rect x="64" y="112" width="772" height="40" rx="8"/>
      <rect x="64" y="160" width="772" height="40" rx="8"/>
      <rect x="64" y="208" width="772" height="40" rx="8"/>
      <rect x="64" y="256" width="772" height="40" rx="8"/>
      <rect x="64" y="304" width="772" height="40" rx="8"/>
      <rect x="64" y="352" width="772" height="40" rx="8"/>
    </g>

    <g stroke-width="2">
      <rect x="64" y="64" width="164" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="64" y="112" width="164" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="64" y="160" width="164" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="64" y="208" width="164" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="64" y="256" width="164" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="64" y="304" width="164" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="64" y="352" width="164" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="146" y="89" fill="#263e5a">Virtual machines</text>
      <text x="146" y="137" fill="#263e5a">Kubernetes</text>
      <text x="146" y="180" fill="#463365">Serverless</text>
      <text x="146" y="195" fill="#463365">containers</text>
      <text x="146" y="233" fill="#463365">Platform (PaaS)</text>
      <text x="146" y="281" fill="#463365">Functions (FaaS)</text>
      <text x="146" y="329" fill="#66400f">Edge functions</text>
      <text x="146" y="377" fill="#66400f">Static + CDN</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="240" y="89">EC2, Droplets, Hetzner, Linode</text>
      <text x="462" y="89">OS, patches, runtime, scaling</text>
      <text x="676" y="89">instance-hours</text>

      <text x="240" y="137">EKS, GKE, AKS</text>
      <text x="462" y="137">nodes, manifests, upgrades</text>
      <text x="676" y="137">nodes + cluster fee</text>

      <text x="240" y="180">Cloud Run, Fargate,</text>
      <text x="240" y="195">Azure Container Apps</text>
      <text x="462" y="187">a container image</text>
      <text x="676" y="187">vCPU- and GB-seconds</text>

      <text x="240" y="228">Render, Heroku, Fly.io,</text>
      <text x="240" y="243">Azure App Service</text>
      <text x="462" y="233">code, config, instance size</text>
      <text x="676" y="233">plan per instance</text>

      <text x="240" y="276">Lambda, Azure Functions,</text>
      <text x="240" y="291">Cloud Run functions</text>
      <text x="462" y="283">handler code, timeouts</text>
      <text x="676" y="283">requests + GB-seconds</text>

      <text x="240" y="324">Cloudflare Workers,</text>
      <text x="240" y="339">CloudFront Functions</text>
      <text x="462" y="331">small handlers near users</text>
      <text x="676" y="331">requests + CPU time</text>

      <text x="240" y="372">S3 + CloudFront, Vercel,</text>
      <text x="240" y="387">Netlify, Cloudflare</text>
      <text x="462" y="379">the build output</text>
      <text x="676" y="379">GB served + requests</text>
    </g>

    <path d="M24 424H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="448" font-size="14" font-weight="700" fill="#40566b">Where data lives: hot on the left, cold on the right</text>

    <g stroke-width="2" fill="#e5efff" stroke="#4774aa">
      <rect x="64" y="462" width="148" height="62" rx="8"/>
      <rect x="220" y="462" width="148" height="62" rx="8"/>
      <rect x="376" y="462" width="148" height="62" rx="8"/>
      <rect x="532" y="462" width="148" height="62" rx="8"/>
      <rect x="688" y="462" width="148" height="62" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">
      <text x="138" y="483">Databases</text>
      <text x="294" y="483">Block storage</text>
      <text x="450" y="483">File storage</text>
      <text x="606" y="483">Object storage</text>
      <text x="762" y="483">Archive storage</text>
    </g>
    <g font-size="11" fill="#263e5a" text-anchor="middle">
      <text x="138" y="500">RDS, Atlas, Neon</text>
      <text x="138" y="515">queries in ms</text>
      <text x="294" y="500">EBS, Managed Disks</text>
      <text x="294" y="515">one VM's disk</text>
      <text x="450" y="500">EFS, Azure Files</text>
      <text x="450" y="515">shared by many VMs</text>
      <text x="606" y="500">S3, R2, B2, GCS</text>
      <text x="606" y="515">files over HTTP</text>
      <text x="762" y="500">S3 Glacier tiers</text>
      <text x="762" y="515">hours to retrieve</text>
    </g>

    <path d="M80 542H820" fill="none" stroke="#40566b" stroke-width="2" marker-start="url(#hcs-arrow-start)" marker-end="url(#hcs-arrow)"/>
    <g font-size="11.5" fill="#40566b">
      <text x="64" y="562">faster, higher price per GB</text>
      <text x="836" y="562" text-anchor="end">slower to read, lower price per GB</text>
    </g>
    <text x="430" y="588" font-size="13" fill="#40566b" text-anchor="middle">Go down to trade control for convenience; go right to trade speed for a lower storage price.</text>
  </g>
</svg>
