<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="swr-title swr-desc">
  <title id="swr-title">The version skew window during a rolling deploy</title>
  <desc id="swr-desc">Left: five bars show the 10 TaskFlow API pods during a rolling update. At t plus 0 none run the new version; at t plus 1.5 minutes 3 of 10 do, at t plus 3 minutes 6 of 10, at t plus 4.5 minutes 9 of 10, and at t plus 6 minutes all 10. A bracket under the middle three bars marks the skew window in which both versions serve requests. At 50 percent new pods, the chance that 20 requests from one page all reach the same version is 2 times 0.5 to the power 20, about 0.0002 percent, so in practice every active page talks to both versions. Right: a matrix of who talks to whom inside the window. An old web build calling API 2.4.0 and a new web build calling API 2.4.1 work because the versions match. An old web build calling API 2.4.1 needs backward compatibility: the new server accepts the old request shapes. A new web build calling API 2.4.0 needs forward compatibility: the new client must not rely on the new server yet. A note says that after the window closes, old tabs, installed desktop and mobile apps, and scripts keep calling 2.4.1 for hours, months, or forever, so the old-client row never fully disappears.</desc>
  <defs>
    <marker id="swr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">A rolling deploy mixes versions: any request can reach either one</text>

    <text x="24" y="56" font-size="12" font-weight="700" fill="#36424e">10 API pods during a rolling update</text>
    <g stroke-width="1.5">
      <rect x="40" y="70" width="44" height="160" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="104" y="70" width="44" height="112" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="104" y="182" width="44" height="48" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="168" y="70" width="44" height="64" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="168" y="134" width="44" height="96" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="232" y="70" width="44" height="16" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="232" y="86" width="44" height="144" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="296" y="70" width="44" height="160" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="62" y="248">t+0</text>
      <text x="126" y="248">t+1.5 min</text>
      <text x="190" y="248">t+3</text>
      <text x="254" y="248">t+4.5</text>
      <text x="318" y="248">t+6</text>
      <text x="62" y="263">0/10 new</text>
      <text x="126" y="263">3/10</text>
      <text x="190" y="263">6/10</text>
      <text x="254" y="263">9/10</text>
      <text x="318" y="263">10/10</text>
    </g>
    <path d="M104 274V280H276V274" fill="none" stroke="#b5524b" stroke-width="1.5"/>
    <text x="190" y="296" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="middle">skew window: both versions serve</text>
    <g font-size="11.5" fill="#36424e">
      <text x="24" y="316">At 50% new pods, the chance</text>
      <text x="24" y="331">that 20 requests from one page</text>
      <text x="24" y="346">all reach the same version is</text>
      <text x="24" y="361">2 x 0.5^20, about 0.0002%.</text>
    </g>
    <g font-size="11" fill="#36424e">
      <rect x="262" y="314" width="12" height="12" rx="3" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="280" y="324">2.4.0</text>
      <rect x="262" y="334" width="12" height="12" rx="3" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="280" y="344">2.4.1</text>
    </g>

    <path d="M352 48V362" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="368" y="56" font-size="12" font-weight="700" fill="#36424e">Who talks to whom inside the window</text>
    <g font-size="12" font-weight="700" fill="#263e5a" text-anchor="middle">
      <text x="566" y="84">API 2.4.0 (old)</text>
      <text x="752" y="84">API 2.4.1 (new)</text>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="368" y="126">old web build</text>
      <text x="368" y="202">new web build</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="368" y="142">tab opened earlier</text>
      <text x="368" y="218">just loaded</text>
    </g>

    <rect x="476" y="94" width="180" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="662" y="94" width="180" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="476" y="170" width="180" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="662" y="170" width="180" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="11.5">
      <text x="488" y="130" fill="#294a2e">same version: works</text>
      <text x="674" y="114" font-weight="700" fill="#463365">backward compatibility</text>
      <text x="674" y="130" fill="#463365">new server accepts the</text>
      <text x="674" y="146" fill="#463365">old request shapes</text>
      <text x="488" y="190" font-weight="700" fill="#463365">forward compatibility</text>
      <text x="488" y="206" fill="#463365">new client must not rely</text>
      <text x="488" y="222" fill="#463365">on the new server yet</text>
      <text x="674" y="206" fill="#294a2e">same version: works</text>
    </g>

    <rect x="368" y="254" width="474" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="380" y="276" font-size="12" font-weight="700" fill="#66400f">After the window closes, the old-client row never fully disappears</text>
    <g font-size="11.5" fill="#66400f">
      <text x="380" y="294">Old tabs keep calling 2.4.1 for hours, installed desktop and mobile</text>
      <text x="380" y="310">apps for months, and scripts or integrations sometimes forever.</text>
      <text x="380" y="326">Backward compatibility is needed long after the deploy.</text>
    </g>

    <text x="430" y="378" font-size="13" fill="#40566b" text-anchor="middle">Skew is not an edge case: during every rolling deploy, one page talks to two server versions.</text>
  </g>
</svg>
