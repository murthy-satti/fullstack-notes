<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="mvg-title mvg-desc">
  <title id="mvg-title">A minimum supported client version gate</title>
  <desc id="mvg-desc">A request arrives from TaskFlow Desktop 1.5.2 with the headers X-Client-Platform desktop and X-Client-Version 1.5.2. First decision: is the path exempt? If yes, such as /client-config, the API serves it normally so the update screen can still load. If no, second decision: is the version below the minimum 1.6.0? If yes, the API returns 426 Upgrade Required with the error code client_update_required and minVersion 1.6.0, and the app shows a blocking update screen with a link to the store or the installer. If no, third decision: is the version below the recommended 1.9.0? If yes, the API serves the request normally and adds the header X-Client-Update: recommended, and the app shows a dismissible banner so the user can update when convenient. If no, the API serves normally. A side note says that an unknown or missing version is logged and served, never blocked, because you cannot identify the client. Keep the floor in configuration so it moves without a deploy, and exempt what the update screen needs.</desc>
  <defs>
    <marker id="mvg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">A minimum-version gate in the TaskFlow API</text>

    <rect x="200" y="44" width="260" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="330" y="64" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">Request from desktop 1.5.2</text>
    <text x="330" y="81" font-size="11" fill="#66400f" text-anchor="middle">X-Client-Platform: desktop</text>
    <text x="330" y="96" font-size="11" fill="#66400f" text-anchor="middle">X-Client-Version: 1.5.2</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M330 124 430 154 330 184 230 154z"/>
      <path d="M330 214 430 244 330 274 230 244z"/>
      <path d="M330 304 430 334 330 364 230 334z"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e" text-anchor="middle">
      <text x="330" y="158">exempt path?</text>
      <text x="330" y="248">below minimum 1.6.0?</text>
      <text x="330" y="338">below recommended 1.9.0?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M330 104V122" marker-end="url(#mvg-arrow)"/>
      <path d="M330 184V212" marker-end="url(#mvg-arrow)"/>
      <path d="M330 274V302" marker-end="url(#mvg-arrow)"/>
      <path d="M330 364V392" marker-end="url(#mvg-arrow)"/>
      <path d="M430 154H558" marker-end="url(#mvg-arrow)"/>
      <path d="M430 244H558" marker-end="url(#mvg-arrow)"/>
      <path d="M700 274V292" marker-end="url(#mvg-arrow)"/>
      <path d="M230 334H198" marker-end="url(#mvg-arrow)"/>
      <path d="M106 362V380" marker-end="url(#mvg-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <rect x="480" y="138" width="28" height="14" fill="#f5f7fb"/>
      <text x="494" y="149" text-anchor="middle">yes</text>
      <rect x="480" y="228" width="28" height="14" fill="#f5f7fb"/>
      <text x="494" y="239" text-anchor="middle">yes</text>
      <text x="214" y="326" text-anchor="middle">yes</text>
      <text x="340" y="202">no</text>
      <text x="340" y="292">no</text>
      <text x="340" y="382">no</text>
    </g>

    <rect x="560" y="130" width="280" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="572" y="150" font-size="12" font-weight="700" fill="#294a2e">serve normally</text>
    <text x="572" y="167" font-size="11" fill="#294a2e">/client-config stays reachable for old apps</text>

    <rect x="560" y="214" width="280" height="60" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="572" y="234" font-size="12" font-weight="700" fill="#6e2a24">426 Upgrade Required</text>
    <text x="572" y="251" font-size="11" fill="#6e2a24">error: client_update_required</text>
    <text x="572" y="266" font-size="11" fill="#6e2a24">minVersion: 1.6.0</text>

    <rect x="560" y="294" width="280" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="572" y="313" font-size="12" font-weight="700" fill="#66400f">blocking update screen</text>
    <text x="572" y="329" font-size="11" fill="#66400f">links to the store or the installer</text>

    <rect x="16" y="306" width="180" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="28" y="325" font-size="12" font-weight="700" fill="#463365">serve normally, plus</text>
    <text x="28" y="341" font-size="11" fill="#463365">X-Client-Update:</text>
    <text x="28" y="355" font-size="11" fill="#463365">recommended</text>

    <rect x="16" y="382" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="28" y="401" font-size="12" font-weight="700" fill="#66400f">dismissible banner</text>
    <text x="28" y="417" font-size="11" fill="#66400f">update when convenient</text>

    <rect x="250" y="394" width="160" height="38" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="330" y="418" font-size="12" font-weight="700" fill="#294a2e" text-anchor="middle">serve normally</text>

    <rect x="560" y="362" width="280" height="64" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="572" y="382" font-size="12" font-weight="700" fill="#36424e">Unknown or missing version</text>
    <text x="572" y="399" font-size="11" fill="#36424e">log it and serve; never block a client</text>
    <text x="572" y="414" font-size="11" fill="#36424e">you cannot identify</text>

    <text x="430" y="462" font-size="13" fill="#40566b" text-anchor="middle">Keep the floor in config so it moves without a deploy, and exempt what the update screen needs.</text>
  </g>
</svg>
