<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="svs-title svs-desc">
  <title id="svs-title">Sticky sessions compared with a shared session store</title>
  <desc id="svs-desc">Left, sticky sessions: Alice's browser holds a cookie srv=app1, and the load balancer routes every one of her requests to app 1, which keeps her session in process memory, while app 2 has no session for her. Step 1: her requests are pinned to app 1. Step 2: app 1 crashes or is replaced during a deploy. Step 3: the load balancer reroutes her to app 2, which has no session, so Alice is logged out, and pinned users also make load uneven. Right, shared session store: Alice's browser holds only a session ID cookie, and the load balancer sends each request to any healthy app. Both app 1 and app 2 look up the session in Redis under sess:id with a TTL. When app 1 dies, app 2 reads the same session from Redis and Alice stays logged in. Keep instances stateless by putting sessions in a shared store or a signed token rather than in process memory.</desc>
  <defs>
    <marker id="svs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="svs-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="svs-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="32" font-size="13" font-weight="700" fill="#6e2a24">Sticky sessions: state on one instance</text>
    <text x="660" y="32" font-size="13" font-weight="700" fill="#294a2e">Shared store: state in Redis</text>
    <path d="M440 20V366" stroke="#c9d1db" stroke-width="1.5"/>

    <!-- left: sticky -->
    <rect x="150" y="50" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="69" font-size="13" font-weight="700" fill="#66400f">Alice's browser</text>
    <text x="220" y="85" font-size="11" fill="#66400f">cookie: srv=app1</text>
    <path d="M220 94V122" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#svs-arrow)"/>
    <rect x="150" y="124" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="220" y="143" font-size="13" font-weight="700" fill="#263e5a">Load balancer</text>
    <text x="220" y="159" font-size="11" fill="#263e5a">routes by srv cookie</text>

    <path d="M190 168 132 198" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#svs-arrow)"/>
    <path d="M250 168 308 198" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#svs-arrow-red)"/>
    <text x="118" y="182" font-size="11.5" fill="#36424e" text-anchor="end">1. pinned</text>
    <text x="322" y="182" font-size="11.5" fill="#6e2a24" text-anchor="start">3. rerouted</text>

    <rect x="50" y="200" width="140" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="120" y="221" font-size="13" font-weight="700" fill="#66400f">app 1</text>
    <rect x="60" y="234" width="120" height="24" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="120" y="250" font-size="11" fill="#463365">Alice's session</text>
    <circle cx="188" cy="204" r="11" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <path d="M182 198 194 210M194 198 182 210" stroke="#b5524b" stroke-width="2"/>
    <text x="120" y="290" font-size="11.5" fill="#6e2a24">2. app 1 dies</text>

    <rect x="250" y="200" width="140" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="320" y="221" font-size="13" font-weight="700" fill="#66400f">app 2</text>
    <text x="320" y="248" font-size="11" fill="#66400f">no Alice session</text>

    <rect x="40" y="320" width="360" height="34" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="220" y="342" font-size="12" font-weight="700" fill="#6e2a24">Alice is logged out; pinned users skew load</text>

    <!-- right: shared store -->
    <rect x="590" y="50" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="660" y="69" font-size="13" font-weight="700" fill="#66400f">Alice's browser</text>
    <text x="660" y="85" font-size="11" fill="#66400f">cookie: session ID</text>
    <path d="M660 94V122" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#svs-arrow)"/>
    <rect x="590" y="124" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="660" y="143" font-size="13" font-weight="700" fill="#263e5a">Load balancer</text>
    <text x="660" y="159" font-size="11" fill="#263e5a">any healthy app</text>

    <path d="M630 168 572 198" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#svs-arrow)"/>
    <path d="M690 168 748 198" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#svs-arrow)"/>

    <rect x="490" y="200" width="140" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="560" y="221" font-size="13" font-weight="700" fill="#66400f">app 1</text>
    <text x="560" y="238" font-size="11" fill="#66400f">stateless</text>
    <circle cx="628" cy="204" r="11" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <path d="M622 198 634 210M634 198 622 210" stroke="#b5524b" stroke-width="2"/>
    <rect x="690" y="200" width="140" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="760" y="221" font-size="13" font-weight="700" fill="#66400f">app 2</text>
    <text x="760" y="238" font-size="11" fill="#66400f">stateless</text>

    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M580 250 620 274" marker-end="url(#svs-arrow-ret)"/>
      <path d="M740 250 700 274" marker-end="url(#svs-arrow-ret)"/>
    </g>
    <rect x="560" y="276" width="200" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="660" y="293" font-size="13" font-weight="700" fill="#463365">Redis session store</text>
    <text x="660" y="309" font-size="11" fill="#463365">sess:id, with a TTL</text>

    <rect x="480" y="328" width="360" height="34" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="660" y="350" font-size="12" font-weight="700" fill="#294a2e">Any app can serve Alice: no logout on a crash</text>

    <text x="440" y="398" font-size="13" fill="#40566b">Keep instances stateless: sessions belong in a shared store or a signed token, not in process memory.</text>
  </g>
</svg>
