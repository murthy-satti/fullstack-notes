<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="any-title any-desc">
  <title id="any-title">Anycast: one address announced from every point of presence</title>
  <desc id="any-desc">Four points of presence, in London, Frankfurt, Virginia, and Singapore, all announce the same prefix 203.0.113.0/24 over BGP. Users in the UK reach London, users in Germany normally reach Frankfurt, users on the US East Coast reach Virginia, and users in Singapore reach Singapore, because internet routing prefers the best path to the nearest announcement. When the Frankfurt point of presence fails, it withdraws its announcement; after BGP converges, typically within seconds to minutes, users in Germany are routed to London instead, with no DNS change. Routing policy rather than geography decides the path, and a route change can break long-lived TCP connections that were in progress.</desc>
  <defs>
    <marker id="any-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="any-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
    <marker id="any-arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="440" y="32" font-size="13" font-weight="700" fill="#40566b">Every point of presence announces 203.0.113.0/24 over BGP</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="40" y="56" width="160" height="40" rx="8"/>
      <rect x="250" y="56" width="160" height="40" rx="8"/>
      <rect x="470" y="56" width="160" height="40" rx="8"/>
      <rect x="680" y="56" width="160" height="40" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="120" y="81">Users in the UK</text>
      <text x="330" y="81">Users in Germany</text>
      <text x="550" y="81">Users in US East</text>
      <text x="760" y="81">Users in Singapore</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M120 96V194" marker-end="url(#any-arrow)"/>
      <path d="M550 96V194" marker-end="url(#any-arrow)"/>
      <path d="M760 96V194" marker-end="url(#any-arrow)"/>
    </g>
    <path d="M330 96V194" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#any-arrow-red)"/>
    <path d="M300 96 176 194" fill="none" stroke="#53845b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#any-arrow-green)"/>
    <rect x="166" y="132" width="114" height="18" fill="#f5f7fb"/>
    <text x="223" y="145" font-size="11" fill="#294a2e">after failure</text>
    <text x="340" y="150" font-size="11" fill="#6e2a24" text-anchor="start">before</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="40" y="196" width="160" height="54" rx="8"/>
      <rect x="470" y="196" width="160" height="54" rx="8"/>
      <rect x="680" y="196" width="160" height="54" rx="8"/>
    </g>
    <rect x="250" y="196" width="160" height="54" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g font-size="13" font-weight="700">
      <text x="120" y="218" fill="#263e5a">PoP London</text>
      <text x="330" y="218" fill="#6e2a24">PoP Frankfurt</text>
      <text x="550" y="218" fill="#263e5a">PoP Virginia</text>
      <text x="760" y="218" fill="#263e5a">PoP Singapore</text>
    </g>
    <g font-size="11">
      <text x="120" y="237" fill="#263e5a">announces the prefix</text>
      <text x="330" y="237" fill="#6e2a24">fails, withdraws route</text>
      <text x="550" y="237" fill="#263e5a">announces the prefix</text>
      <text x="760" y="237" fill="#263e5a">announces the prefix</text>
    </g>
    <circle cx="404" cy="200" r="11" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <path d="M398 194 410 206M410 194 398 206" stroke="#b5524b" stroke-width="2"/>

    <g font-size="11.5" text-anchor="start">
      <rect x="40" y="276" width="390" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="56" y="298" font-weight="700" fill="#294a2e">What anycast gives you</text>
      <text x="56" y="318" fill="#294a2e">one stable address for every user</text>
      <text x="56" y="336" fill="#294a2e">failover without waiting for DNS caches</text>
      <text x="56" y="354" fill="#294a2e">attack traffic spread over many locations</text>
      <rect x="450" y="276" width="390" height="92" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
      <text x="466" y="298" font-weight="700" fill="#6e2a24">What to watch</text>
      <text x="466" y="318" fill="#6e2a24">routing policy, not distance, picks the PoP</text>
      <text x="466" y="336" fill="#6e2a24">BGP convergence takes seconds to minutes</text>
      <text x="466" y="354" fill="#6e2a24">route changes can break long TCP flows</text>
    </g>

    <text x="440" y="400" font-size="13" fill="#40566b">Same address everywhere: the network, not DNS, decides which location answers.</text>
  </g>
</svg>
