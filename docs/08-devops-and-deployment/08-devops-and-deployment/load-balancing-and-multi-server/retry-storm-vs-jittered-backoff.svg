<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-labelledby="rsj-title rsj-desc">
  <title id="rsj-title">Synchronized retries compared with full jitter</title>
  <desc id="rsj-desc">A simulation in which 1,000 clients fail at the same moment and each retries 3 times with a base backoff of 100 milliseconds; the charts count retry arrivals per 10 millisecond slot from 0 to 800 milliseconds on the same vertical scale. Without jitter, every client waits exactly 100, then 200, then 400 milliseconds, so all 1,000 retries arrive inside a single 10 millisecond slot at 100, 300, and 700 milliseconds: three synchronized waves that hit a recovering server at once. With full jitter, each wait is a random value between zero and 100, 200, and 400 milliseconds, so the same 3,000 retries spread over about 700 milliseconds, with at most 173 arrivals in any 10 millisecond slot in this run.</desc>
  <rect width="860" height="484" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">1,000 clients fail at 0 ms and retry 3 times (base 100 ms): arrivals per 10 ms slot</text>

    <text x="24" y="50" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">No jitter: every client waits exactly 100, then 200, then 400 ms</text>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="205" y="60" width="8.5" height="150"/>
      <rect x="375" y="60" width="8.5" height="150"/>
      <rect x="715" y="60" width="8.5" height="150"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="218" y="74">1,000 at once</text>
      <text x="388" y="74">1,000 at once</text>
      <text x="728" y="74">1,000 at once</text>
    </g>

    <path d="M120 210H800" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M120 206V214M205 206V214M290 206V214M375 206V214M460 206V214M545 206V214M630 206V214M715 206V214M800 206V214"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="120" y="228">0 ms</text>
      <text x="205" y="228">100</text>
      <text x="290" y="228">200</text>
      <text x="375" y="228">300</text>
      <text x="460" y="228">400</text>
      <text x="545" y="228">500</text>
      <text x="630" y="228">600</text>
      <text x="715" y="228">700</text>
      <text x="800" y="228">800</text>
    </g>

    <path d="M24 246H836" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="270" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">Full jitter: each wait is random in 0 to 100, 0 to 200, then 0 to 400 ms</text>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="0.8">
