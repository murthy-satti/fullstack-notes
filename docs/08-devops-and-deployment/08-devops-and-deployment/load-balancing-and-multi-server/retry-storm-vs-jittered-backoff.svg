    <text x="230" y="320" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">same 3,000 retries spread over about 700 ms:</text>
    <text x="230" y="337" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">at most 173 in any 10 ms slot (same scale as above)</text>

    <path d="M120 380H800" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M120 376V384M205 376V384M290 376V384M375 376V384M460 376V384M545 376V384M630 376V384M715 376V384M800 376V384"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="120" y="398">0 ms</text>
