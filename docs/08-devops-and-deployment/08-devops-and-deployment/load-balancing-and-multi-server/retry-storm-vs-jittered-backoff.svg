    <rect x="24" y="414" width="812" height="34" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="436" font-size="11.5" fill="#36424e">Synchronized waves hit a recovering server all at once; jitter turns the same retries into a load it can absorb.</text>

    <text x="430" y="472" font-size="13" fill="#40566b">Never retry on a fixed schedule: add jitter, cap the attempts, and spend from a retry budget.</text>
