<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="oms-title oms-desc">
  <title id="oms-title">Six stages from one server to many</title>
  <desc id="oms-desc">Six panels show how TaskFlow grows. Stage 1, one server: a single VPS runs Nginx, the Node.js API, MongoDB, cron jobs, and stores files; its next limit is that a reboot or full disk is an outage. Stage 2, separate database: an app server with Nginx and the API talks to a managed MongoDB that the provider backs up and fails over; the app server is still a single point of failure. Stage 3, load-balanced app tier: a load balancer spreads requests over three API instances, sessions move to Redis, and data stays in MongoDB; the next limit is state still left on instances, such as sessions, files, and cron. Stage 4, cache and CDN: a CDN serves static files in front of the load balancer, three API instances, a Redis cache, and MongoDB; the next limit is stale data and invalidation bugs. Stage 5, multiple Availability Zones: a load balancer spans two zones with two API instances in each, a database primary in zone a and a synchronous standby in zone b; the next limit is a whole-region outage and latency for far-away users. Stage 6, multiple regions: global DNS or anycast sends users to region 1 or region 2, writes go to the primary database and replicate asynchronously to the other region; the cost is replication lag, write conflicts, and more spend.</desc>
  <defs>
    <marker id="oms-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="510" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">From one server to many: each stage removes one limit and exposes the next</text>

    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="20" y="44" width="268" height="200" rx="10"/>
      <rect x="306" y="44" width="268" height="200" rx="10"/>
      <rect x="592" y="44" width="268" height="200" rx="10"/>
      <rect x="20" y="262" width="268" height="200" rx="10"/>
      <rect x="306" y="262" width="268" height="200" rx="10"/>
      <rect x="592" y="262" width="268" height="200" rx="10"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="34" y="66">1. One server</text>
      <text x="320" y="66">2. Separate database</text>
      <text x="606" y="66">3. Load-balanced app tier</text>
      <text x="34" y="284">4. Cache and CDN</text>
      <text x="320" y="284">5. Multiple zones</text>
      <text x="606" y="284">6. Multiple regions</text>
    </g>

    <!-- Stage 1 -->
    <rect x="44" y="76" width="220" height="104" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="154" y="93" font-size="12" font-weight="700" fill="#263e5a">One VPS</text>
    <rect x="50" y="102" width="100" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="158" y="102" width="100" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="50" y="136" width="100" height="26" rx="6" fill="#ffffff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="158" y="136" width="100" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11" fill="#36424e">
      <text x="100" y="119" fill="#66400f">Nginx</text>
      <text x="208" y="119" fill="#66400f">Node.js API</text>
      <text x="100" y="153" fill="#263e5a">MongoDB</text>
      <text x="208" y="153">cron, files</text>
    </g>

    <!-- Stage 2 -->
    <rect x="340" y="80" width="200" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="440" y="97" font-size="11.5" font-weight="700" fill="#66400f">App server: Nginx + API</text>
    <path d="M440 106V132" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#oms-arrow)"/>
    <rect x="340" y="134" width="200" height="26" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="440" y="151" font-size="11.5" font-weight="700" fill="#263e5a">Managed MongoDB</text>
    <text x="440" y="178" font-size="10.5" font-style="italic" fill="#40566b">backups and failover by the provider</text>

    <!-- Stage 3 -->
    <rect x="626" y="78" width="200" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="726" y="94" font-size="11.5" font-weight="700" fill="#263e5a">Load balancer</text>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="626" y="110" width="60" height="24" rx="6"/>
      <rect x="696" y="110" width="60" height="24" rx="6"/>
      <rect x="766" y="110" width="60" height="24" rx="6"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <text x="656" y="126">API</text>
      <text x="726" y="126">API</text>
      <text x="796" y="126">API</text>
    </g>
    <rect x="626" y="142" width="95" height="24" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="731" y="142" width="95" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="673" y="158" font-size="11" font-weight="700" fill="#463365">Redis</text>
    <text x="778" y="158" font-size="11" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="726" y="182" font-size="10.5" font-style="italic" fill="#40566b">sessions move to Redis</text>

    <!-- Stage 4 -->
    <rect x="54" y="294" width="200" height="22" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="154" y="309" font-size="11.5" font-weight="700" fill="#463365">CDN: static files</text>
    <rect x="54" y="322" width="200" height="22" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="154" y="337" font-size="11.5" font-weight="700" fill="#263e5a">Load balancer</text>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="54" y="350" width="60" height="22" rx="6"/>
      <rect x="124" y="350" width="60" height="22" rx="6"/>
      <rect x="194" y="350" width="60" height="22" rx="6"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <text x="84" y="365">API</text>
      <text x="154" y="365">API</text>
      <text x="224" y="365">API</text>
    </g>
    <rect x="54" y="378" width="95" height="22" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="159" y="378" width="95" height="22" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="101" y="393" font-size="11" font-weight="700" fill="#463365">Redis cache</text>
    <text x="206" y="393" font-size="11" font-weight="700" fill="#263e5a">MongoDB</text>

    <!-- Stage 5 -->
    <rect x="330" y="294" width="220" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="440" y="310" font-size="11.5" font-weight="700" fill="#263e5a">Load balancer, 2 zones</text>
    <rect x="330" y="326" width="105" height="24" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="445" y="326" width="105" height="24" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="382" y="342" font-size="11" font-weight="700" fill="#66400f">AZ a: API x2</text>
    <text x="497" y="342" font-size="11" font-weight="700" fill="#66400f">AZ b: API x2</text>
    <rect x="330" y="358" width="105" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="445" y="358" width="105" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="382" y="374" font-size="11" font-weight="700" fill="#263e5a">DB primary</text>
    <text x="497" y="374" font-size="11" font-weight="700" fill="#263e5a">DB standby</text>
    <text x="440" y="398" font-size="10.5" font-style="italic" fill="#40566b">synchronous standby in the other zone</text>

    <!-- Stage 6 -->
    <rect x="616" y="294" width="220" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="726" y="310" font-size="11.5" font-weight="700" fill="#263e5a">Global DNS or anycast</text>
    <rect x="616" y="326" width="105" height="24" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="731" y="326" width="105" height="24" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="668" y="342" font-size="11" font-weight="700" fill="#66400f">Region 1</text>
    <text x="783" y="342" font-size="11" font-weight="700" fill="#66400f">Region 2</text>
    <rect x="616" y="358" width="105" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="731" y="358" width="105" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="668" y="374" font-size="11" font-weight="700" fill="#263e5a">DB (writes)</text>
    <text x="783" y="374" font-size="11" font-weight="700" fill="#263e5a">DB (reads)</text>
    <text x="726" y="398" font-size="10.5" font-style="italic" fill="#40566b">async replication between regions</text>

    <!-- next-limit strips -->
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5">
      <rect x="30" y="198" width="248" height="36" rx="6"/>
      <rect x="316" y="198" width="248" height="36" rx="6"/>
      <rect x="602" y="198" width="248" height="36" rx="6"/>
      <rect x="30" y="416" width="248" height="36" rx="6"/>
      <rect x="316" y="416" width="248" height="36" rx="6"/>
      <rect x="602" y="416" width="248" height="36" rx="6"/>
    </g>
    <g font-size="11" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="40" y="212">Next limit</text>
      <text x="326" y="212">Next limit</text>
      <text x="612" y="212">Next limit</text>
      <text x="40" y="430">Next limit</text>
      <text x="326" y="430">Next limit</text>
      <text x="612" y="430">Cost</text>
    </g>
    <g font-size="11" fill="#6e2a24" text-anchor="start">
      <text x="40" y="227">a reboot or full disk is an outage</text>
      <text x="326" y="227">the app server is a single point</text>
      <text x="612" y="227">sessions, files, cron on instances</text>
      <text x="40" y="445">stale data and invalidation bugs</text>
      <text x="326" y="445">a region outage; far-away users</text>
      <text x="612" y="445">replication lag, conflicts, spend</text>
    </g>

    <text x="440" y="492" font-size="13" fill="#40566b">Move to the next stage when the current limit is measured, not imagined.</text>
  </g>
</svg>
