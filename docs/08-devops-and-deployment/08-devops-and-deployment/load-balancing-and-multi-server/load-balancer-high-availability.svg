<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="lha-title lha-desc">
  <title id="lha-title">Three ways to keep the load balancer itself available</title>
  <desc id="lha-desc">Left, an active-standby pair with keepalived and VRRP: clients send traffic to virtual IP 10.0.0.100, which LB 1 holds as the master while LB 2 waits as backup, receiving VRRP advertisements. If LB 1 dies, LB 2 claims the virtual IP within seconds and announces it with gratuitous ARP; the standby is idle, and cloud networks usually need an API call to move an IP instead of VRRP. Middle, a managed cloud load balancer: one DNS name resolves to load balancer nodes in Availability Zones a, b, and c, each forwarding to targets; the provider replaces failed nodes and scales them, and a zone whose targets are unhealthy can be removed from DNS. Right, an active-active layer 4 tier: routers announce the same virtual IP from four layer 4 balancers over BGP and spread flows with ECMP; the balancers use consistent hashing so a flow keeps reaching the same backend even if the set of balancers changes; this is how Google's Maglev and similar systems scale. Every hop needs redundancy, including the balancer.</desc>
  <defs>
    <marker id="lha-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lha-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="20" y="20" width="268" height="350" rx="10"/>
      <rect x="306" y="20" width="268" height="350" rx="10"/>
      <rect x="592" y="20" width="268" height="350" rx="10"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="154" y="44">Active-standby pair</text>
      <text x="440" y="44">Managed cloud load balancer</text>
      <text x="726" y="44">Active-active L4 tier</text>
    </g>

    <!-- left: keepalived -->
    <rect x="54" y="60" width="200" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="154" y="77" font-size="12" font-weight="700" fill="#66400f">Clients</text>
    <text x="154" y="92" font-size="11" fill="#66400f">to virtual IP 10.0.0.100</text>
    <path d="M110 100 82 136" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#lha-arrow)"/>
    <rect x="34" y="138" width="110" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="89" y="158" font-size="12" font-weight="700" fill="#294a2e">LB 1</text>
    <text x="89" y="175" font-size="11" fill="#294a2e">master, holds VIP</text>
    <rect x="164" y="138" width="110" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="219" y="158" font-size="12" font-weight="700" fill="#263e5a">LB 2</text>
    <text x="219" y="175" font-size="11" fill="#263e5a">backup, idle</text>
    <path d="M146 164H162" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#lha-arrow-ret)"/>
    <text x="154" y="210" font-size="11" fill="#36424e">VRRP advertisements</text>
    <rect x="34" y="226" width="240" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="154" y="244" font-size="11" fill="#6e2a24">LB 1 dies: LB 2 claims the VIP</text>
    <text x="154" y="260" font-size="11" fill="#6e2a24">in seconds (gratuitous ARP)</text>
    <g font-size="11" text-anchor="start">
      <text x="34" y="296" fill="#294a2e">+ simple, works on bare metal</text>
      <text x="34" y="314" fill="#6e2a24">- standby capacity sits idle</text>
      <text x="34" y="332" fill="#6e2a24">- clouds need API-based IP moves</text>
    </g>

    <!-- middle: managed -->
    <rect x="340" y="60" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="77" font-size="12" font-weight="700" fill="#263e5a">One DNS name</text>
    <text x="440" y="92" font-size="11" fill="#263e5a">returns node IPs per zone</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M400 100 367 136" marker-end="url(#lha-arrow)"/>
      <path d="M440 100V136" marker-end="url(#lha-arrow)"/>
      <path d="M480 100 513 136" marker-end="url(#lha-arrow)"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="322" y="138" width="72" height="44" rx="8"/>
      <rect x="404" y="138" width="72" height="44" rx="8"/>
      <rect x="486" y="138" width="72" height="44" rx="8"/>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="358" y="157" font-weight="700">node</text><text x="358" y="172">AZ a</text>
      <text x="440" y="157" font-weight="700">node</text><text x="440" y="172">AZ b</text>
      <text x="522" y="157" font-weight="700">node</text><text x="522" y="172">AZ c</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M358 182V206" marker-end="url(#lha-arrow)"/>
      <path d="M440 182V206" marker-end="url(#lha-arrow)"/>
      <path d="M522 182V206" marker-end="url(#lha-arrow)"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="322" y="208" width="72" height="26" rx="6"/>
      <rect x="404" y="208" width="72" height="26" rx="6"/>
      <rect x="486" y="208" width="72" height="26" rx="6"/>
    </g>
    <g font-size="11" font-weight="700" fill="#66400f">
      <text x="358" y="225">targets</text><text x="440" y="225">targets</text><text x="522" y="225">targets</text>
    </g>
    <g font-size="11" text-anchor="start">
      <text x="320" y="262" fill="#294a2e">+ provider replaces and scales nodes</text>
      <text x="320" y="280" fill="#294a2e">+ unhealthy zones leave DNS</text>
      <text x="320" y="298" fill="#6e2a24">- enable at least two zones</text>
      <text x="320" y="316" fill="#6e2a24">- clients must re-resolve the name</text>
    </g>

    <!-- right: ECMP -->
    <rect x="626" y="60" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="726" y="77" font-size="12" font-weight="700" fill="#263e5a">Routers (ECMP)</text>
    <text x="726" y="92" font-size="11" fill="#263e5a">one VIP announced over BGP</text>
    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M676 100 641 136" marker-end="url(#lha-arrow)"/>
      <path d="M708 100 697 136" marker-end="url(#lha-arrow)"/>
      <path d="M744 100 755 136" marker-end="url(#lha-arrow)"/>
      <path d="M776 100 811 136" marker-end="url(#lha-arrow)"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="612" y="138" width="54" height="40" rx="8"/>
      <rect x="670" y="138" width="54" height="40" rx="8"/>
      <rect x="728" y="138" width="54" height="40" rx="8"/>
      <rect x="786" y="138" width="54" height="40" rx="8"/>
    </g>
    <g font-size="11" font-weight="700" fill="#263e5a">
      <text x="639" y="162">L4</text><text x="697" y="162">L4</text><text x="755" y="162">L4</text><text x="813" y="162">L4</text>
    </g>
    <path d="M726 178V206" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#lha-arrow)"/>
    <rect x="626" y="208" width="200" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="726" y="225" font-size="11" font-weight="700" fill="#66400f">L7 proxies or backends</text>
    <g font-size="11" text-anchor="start">
      <text x="606" y="262" fill="#294a2e">+ every balancer carries traffic</text>
      <text x="606" y="280" fill="#294a2e">+ consistent hashing keeps flows</text>
      <text x="606" y="298" fill="#6e2a24">- needs BGP and network control</text>
      <text x="606" y="316" fill="#6e2a24">- used by Maglev-style systems</text>
    </g>

    <text x="440" y="404" font-size="13" fill="#40566b">The balancer is a single point of failure unless it is replicated: pair, managed fleet, or ECMP tier.</text>
  </g>
</svg>
