<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="maz-title maz-desc">
  <title id="maz-title">One region, three Availability Zones, sized to lose one</title>
  <desc id="maz-desc">A load balancer with a node in every zone sends traffic to TaskFlow API instances in Availability Zones a, b, and c, six instances per zone, while peak traffic needs twelve. The MongoDB primary runs in zone a and replicates to secondaries in zones b and c; with majority write concern, a write is acknowledged once two of the three members have it. When zone a fails, the load balancer stops sending traffic there, the twelve instances in zones b and c still cover peak without launching anything, and the secondaries elect a new primary, keeping every write that a majority acknowledged. Spreading over three zones and overprovisioning by 50 percent survives a zone without scaling during the incident.</desc>
  <defs>
    <marker id="maz-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="maz-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="840" height="356" rx="10" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="36" y="40" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">Region</text>

    <rect x="190" y="48" width="500" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="73" font-size="13" font-weight="700" fill="#263e5a">Load balancer, a node in every zone</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round">
      <path d="M440 88V100H169V118" marker-end="url(#maz-arrow)"/>
      <path d="M440 88V118" marker-end="url(#maz-arrow)"/>
      <path d="M440 100H711V118" marker-end="url(#maz-arrow)"/>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <rect x="40" y="120" width="258" height="240" rx="8"/>
      <rect x="311" y="120" width="258" height="240" rx="8"/>
      <rect x="582" y="120" width="258" height="240" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="52" y="140">Availability Zone a</text>
      <text x="323" y="140">Availability Zone b</text>
      <text x="594" y="140">Availability Zone c</text>
    </g>
    <circle cx="282" cy="136" r="11" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <path d="M276 130 288 142M288 130 276 142" stroke="#b5524b" stroke-width="2"/>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="64" y="154" width="210" height="44" rx="8"/>
      <rect x="335" y="154" width="210" height="44" rx="8"/>
      <rect x="606" y="154" width="210" height="44" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#66400f">
      <text x="169" y="174">TaskFlow API x 6</text>
      <text x="440" y="174">TaskFlow API x 6</text>
      <text x="711" y="174">TaskFlow API x 6</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="169" y="190">half of peak</text>
      <text x="440" y="190">half of peak</text>
      <text x="711" y="190">half of peak</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="64" y="236" width="210" height="48" rx="8"/>
      <rect x="335" y="236" width="210" height="48" rx="8"/>
      <rect x="606" y="236" width="210" height="48" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="169" y="256">MongoDB primary</text>
      <text x="440" y="256">MongoDB secondary</text>
      <text x="711" y="256">MongoDB secondary</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="169" y="273">takes all writes</text>
      <text x="440" y="273">elected primary if a fails</text>
      <text x="711" y="273">votes, holds a full copy</text>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M276 252H333" marker-end="url(#maz-arrow-ret)"/>
      <path d="M169 284V306H711V286" marker-end="url(#maz-arrow-ret)"/>
    </g>
    <rect x="282" y="299" width="316" height="16" fill="#f5f7fb"/>
    <text x="440" y="311" font-size="11" fill="#36424e">replication; majority writes wait for 2 of 3</text>

    <rect x="40" y="392" width="800" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="440" y="416" font-size="12" font-weight="700" fill="#294a2e">Zone a fails: the balancer stops routing there, 12 instances still serve peak, and no majority-acknowledged write is lost</text>

    <text x="440" y="458" font-size="13" fill="#40566b">Three zones with 50% spare capacity survive a zone failure without scaling during the incident.</text>
  </g>
</svg>
