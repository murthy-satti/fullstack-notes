<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="mrw-title mrw-desc">
  <title id="mrw-title">Three ways to handle writes across two regions</title>
  <desc id="mrw-desc">Read local, write global: users near regions A and B read from their local copy, but every write goes to the single writer in region A, which replicates asynchronously to region B; it is simple and has no conflicts, but writes from region B pay a cross-region round trip and reads in B can be stale. Home region per user: EU users write in region A and US users in region B, and each region replicates its partition to the other for recovery; most writes are local and there are no conflicts, but you need a routing directory and must handle travelers and data shared between partitions. Multi-writer: both regions accept writes for the same records and replicate in both directions; any region can write and survive the loss of the other, but concurrent updates need conflict resolution such as last writer wins or a merge, or synchronous consensus that makes every write slower.</desc>
  <defs>
    <marker id="mrw-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="mrw-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="mrw-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="20" y="20" width="268" height="360" rx="10"/>
      <rect x="306" y="20" width="268" height="360" rx="10"/>
      <rect x="592" y="20" width="268" height="360" rx="10"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="154" y="44">Read local, write global</text>
      <text x="440" y="44">Home region per user</text>
      <text x="726" y="44">Multi-writer</text>
    </g>

    <!-- 1: read local, write global -->
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="36" y="60" width="100" height="30" rx="6"/>
      <rect x="172" y="60" width="100" height="30" rx="6"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <text x="86" y="80">users near A</text>
      <text x="222" y="80">users near B</text>
    </g>
    <rect x="36" y="140" width="100" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="86" y="162" font-size="12" font-weight="700" fill="#263e5a">Region A</text>
    <text x="86" y="180" font-size="11" fill="#263e5a">the writer</text>
    <rect x="172" y="140" width="100" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="222" y="162" font-size="12" font-weight="700" fill="#36424e">Region B</text>
    <text x="222" y="180" font-size="11" fill="#36424e">replica</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M86 90V138" marker-end="url(#mrw-arrow)"/>
      <path d="M200 90 120 138" marker-end="url(#mrw-arrow)"/>
    </g>
    <path d="M244 90V138" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mrw-arrow-ret)"/>
    <text x="150" y="108" font-size="10.5" fill="#36424e">writes</text>
    <text x="262" y="122" font-size="10.5" fill="#36424e" text-anchor="start">reads</text>
    <path d="M136 168H170" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mrw-arrow-ret)"/>
    <text x="154" y="216" font-size="11" fill="#36424e">async replication</text>

    <!-- 2: home region -->
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="322" y="60" width="100" height="30" rx="6"/>
      <rect x="458" y="60" width="100" height="30" rx="6"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <text x="372" y="80">EU users</text>
      <text x="508" y="80">US users</text>
    </g>
    <rect x="322" y="140" width="100" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="372" y="162" font-size="12" font-weight="700" fill="#263e5a">Region A</text>
    <text x="372" y="180" font-size="11" fill="#263e5a">writes EU data</text>
    <rect x="458" y="140" width="100" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="508" y="162" font-size="12" font-weight="700" fill="#263e5a">Region B</text>
    <text x="508" y="180" font-size="11" fill="#263e5a">writes US data</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M372 90V138" marker-end="url(#mrw-arrow)"/>
      <path d="M508 90V138" marker-end="url(#mrw-arrow)"/>
    </g>
    <path d="M424 168H456" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#mrw-arrow-start)" marker-end="url(#mrw-arrow-ret)"/>
    <text x="440" y="216" font-size="11" fill="#36424e">each partition copied for recovery</text>

    <!-- 3: multi-writer -->
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="608" y="60" width="100" height="30" rx="6"/>
      <rect x="744" y="60" width="100" height="30" rx="6"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <text x="658" y="80">users near A</text>
      <text x="794" y="80">users near B</text>
    </g>
    <rect x="608" y="140" width="100" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="658" y="162" font-size="12" font-weight="700" fill="#263e5a">Region A</text>
    <text x="658" y="180" font-size="11" fill="#263e5a">writes anything</text>
    <rect x="744" y="140" width="100" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="794" y="162" font-size="12" font-weight="700" fill="#263e5a">Region B</text>
    <text x="794" y="180" font-size="11" fill="#263e5a">writes anything</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M658 90V138" marker-end="url(#mrw-arrow)"/>
      <path d="M794 90V138" marker-end="url(#mrw-arrow)"/>
    </g>
    <path d="M710 168H742" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#mrw-arrow-start)" marker-end="url(#mrw-arrow-ret)"/>
    <text x="726" y="216" font-size="11" fill="#6e2a24">same record, two writers</text>

    <!-- pros and cons -->
    <g font-size="11" text-anchor="start">
      <text x="34" y="252" fill="#294a2e">+ simple, no conflicts</text>
      <text x="34" y="270" fill="#294a2e">+ fast local reads everywhere</text>
      <text x="34" y="296" fill="#6e2a24">- writes from B cross regions</text>
      <text x="34" y="314" fill="#6e2a24">- reads in B can be stale</text>
      <text x="34" y="332" fill="#6e2a24">- failover promotes a replica</text>

      <text x="320" y="252" fill="#294a2e">+ most writes stay local</text>
      <text x="320" y="270" fill="#294a2e">+ no conflicts: one writer per record</text>
      <text x="320" y="296" fill="#6e2a24">- needs a home-region directory</text>
      <text x="320" y="314" fill="#6e2a24">- travelers, shared data, moves</text>
      <text x="320" y="332" fill="#6e2a24">- failover per partition</text>

      <text x="606" y="252" fill="#294a2e">+ any region writes, always</text>
      <text x="606" y="270" fill="#294a2e">+ survives a region with no promotion</text>
      <text x="606" y="296" fill="#6e2a24">- conflicts: last writer wins or merge</text>
      <text x="606" y="314" fill="#6e2a24">- or synchronous quorum: slow writes</text>
      <text x="606" y="332" fill="#6e2a24">- unique constraints get hard</text>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="154" y="364">Aurora Global Database style</text>
      <text x="440" y="364">cells and partitioned data</text>
      <text x="726" y="364">DynamoDB global tables, Spanner</text>
    </g>

    <text x="440" y="414" font-size="13" fill="#40566b">Most teams should pick one writer per record; true multi-writer is for data that tolerates merges.</text>
  </g>
</svg>
