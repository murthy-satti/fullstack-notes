      <rect x="747" y="228" width="6" height="16" rx="2"/>
    </g>
    <g font-size="12" font-weight="700" fill="#294a2e">
      <text x="776" y="233">40 small</text>
      <text x="776" y="249">releases</text>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="200" y="262">week 1</text><text x="360" y="262">week 2</text>
      <text x="520" y="262">week 3</text><text x="680" y="262">week 4</text>
    </g>
    <g font-size="12" fill="#294a2e">
      <text x="120" y="288">feedback on each change arrives within hours</text>
      <text x="120" y="306">a failure has 1 suspect, and a rollback removes 1 change</text>
    </g>

    <text x="440" y="358" font-size="13" fill="#40566b" text-anchor="middle">Same work, same four weeks: small batches give faster feedback, easier diagnosis, and cheaper rollbacks.</text>
  </g>
</svg>
