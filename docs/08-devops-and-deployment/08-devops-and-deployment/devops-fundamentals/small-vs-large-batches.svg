<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="svb-title svb-desc">
  <title id="svb-title">One large release compared with many small releases</title>
  <desc id="svb-desc">Two four-week timelines with the same 40 changes, two per working day. Large batch: each finished change is shown as a grey dot waiting to ship; the changes accumulate for four weeks and ship together in one release of 40 changes, so feedback on the first change arrives after about four weeks, a failure has 40 suspects, and a rollback removes all 40 changes. Small batches: each change is released on its own soon after it is written, giving 40 small releases, so feedback on each change arrives within hours, a failure has one suspect, and a rollback removes one change.</desc>
  <defs>
    <marker id="svb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="14" fill="#f5f7fb"/>
