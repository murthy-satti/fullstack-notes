    <g text-anchor="middle" fill="#6e2a24">
      <text x="818" y="97" font-size="12" font-weight="700">1 release</text>
      <text x="818" y="113" font-size="11.5">40 changes</text>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="middle">
