    <text x="156" y="40" font-size="11.5" fill="#36424e">40 changes wait for one release every four weeks</text>
    <text x="120" y="74" font-size="11.5" font-style="italic" fill="#36424e">each grey dot is a finished change waiting to ship</text>
    <path d="M120 100H760" stroke="#8a96a3" stroke-width="2"/>
