<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="pfl-title pfl-desc">
  <title id="pfl-title">The layers of an internal developer platform</title>
  <desc id="pfl-desc">Four layers from top to bottom. Product teams, who use the platform: the tasks team, the web team, and the reminders team. Interfaces, how they use it: a developer portal, a CLI and APIs, golden path templates, and docs and support. Capabilities, what the platform offers: CI/CD pipelines, environments and databases, observability, secrets and identity, and policy and security checks. Providers, what it is built on: a cloud provider for compute, storage, and networking, Kubernetes or another managed runtime, and SaaS tools for paging, scanning, and CI. A dashed outline marks the interfaces and capabilities layers as what the platform team builds and runs as a product.</desc>
  <defs>
    <marker id="pfl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g text-anchor="start">
      <text x="24" y="60" font-size="13" font-weight="700" fill="#36424e">Product teams</text>
      <text x="24" y="77" font-size="11" font-style="italic" fill="#36424e">who uses it</text>
      <text x="24" y="152" font-size="13" font-weight="700" fill="#36424e">Interfaces</text>
      <text x="24" y="169" font-size="11" font-style="italic" fill="#36424e">how they use it</text>
      <text x="24" y="230" font-size="13" font-weight="700" fill="#36424e">Capabilities</text>
      <text x="24" y="247" font-size="11" font-style="italic" fill="#36424e">what it offers</text>
      <text x="24" y="320" font-size="13" font-weight="700" fill="#36424e">Providers</text>
      <text x="24" y="337" font-size="11" font-style="italic" fill="#36424e">what it is built on</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="170" y="40" width="210" height="46" rx="8"/>
      <rect x="400" y="40" width="210" height="46" rx="8"/>
      <rect x="630" y="40" width="210" height="46" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="275" y="68">Tasks team</text>
      <text x="505" y="68">Web team</text>
      <text x="735" y="68">Reminders team</text>
    </g>

    <rect x="160" y="104" width="700" height="166" rx="10" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="170" y="122" font-size="11.5" font-style="italic" fill="#463365" text-anchor="start">the platform team builds and runs these two layers as a product</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="170" y="132" width="160" height="46" rx="8"/>
      <rect x="343" y="132" width="160" height="46" rx="8"/>
      <rect x="516" y="132" width="160" height="46" rx="8"/>
      <rect x="689" y="132" width="160" height="46" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="250" y="160">Developer portal</text>
      <text x="423" y="160">CLI and APIs</text>
      <text x="596" y="160">Golden paths</text>
      <text x="769" y="160">Docs and support</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="170" y="208" width="128" height="50" rx="8"/>
      <rect x="305" y="208" width="128" height="50" rx="8"/>
      <rect x="440" y="208" width="128" height="50" rx="8"/>
      <rect x="575" y="208" width="128" height="50" rx="8"/>
      <rect x="710" y="208" width="140" height="50" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="234" y="228" font-size="12" font-weight="700">CI/CD</text>
      <text x="234" y="245" font-size="11.5">pipelines</text>
      <text x="369" y="228" font-size="12" font-weight="700">Environments</text>
      <text x="369" y="245" font-size="11.5">and databases</text>
      <text x="504" y="228" font-size="12" font-weight="700">Observability</text>
      <text x="504" y="245" font-size="11.5">logs, metrics</text>
      <text x="639" y="228" font-size="12" font-weight="700">Secrets</text>
      <text x="639" y="245" font-size="11.5">and identity</text>
      <text x="780" y="228" font-size="12" font-weight="700">Policy and</text>
      <text x="780" y="245" font-size="11.5">security checks</text>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="170" y="298" width="210" height="50" rx="8"/>
      <rect x="400" y="298" width="210" height="50" rx="8"/>
      <rect x="630" y="298" width="210" height="50" rx="8"/>
    </g>
    <g fill="#36424e">
      <text x="275" y="318" font-size="12.5" font-weight="700">Cloud provider</text>
      <text x="275" y="336" font-size="11.5">compute, storage, network</text>
      <text x="505" y="318" font-size="12.5" font-weight="700">Kubernetes</text>
      <text x="505" y="336" font-size="11.5">or a managed runtime</text>
      <text x="735" y="318" font-size="12.5" font-weight="700">SaaS tools</text>
      <text x="735" y="336" font-size="11.5">paging, scanning, CI</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M596 86V130" marker-end="url(#pfl-arrow)"/>
      <path d="M596 178V206" marker-end="url(#pfl-arrow)"/>
      <path d="M596 258V296" marker-end="url(#pfl-arrow)"/>
    </g>

    <text x="440" y="392" font-size="13" fill="#40566b">The platform is a thin product layer between product teams and the providers underneath.</text>
  </g>
</svg>
