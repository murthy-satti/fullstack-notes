<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="som-title som-desc">
  <title id="som-title">What owning a service includes</title>
  <desc id="som-desc">The TaskFlow API sits in the center, owned end to end by the tasks team. Eight responsibilities surround it. Code and reviews, with CODEOWNERS and small pull requests. Pipeline and deploys, with one path to production. SLOs and dashboards that show what users experience. Alerts and on-call, through the team's own rotation. Runbooks and documentation kept next to the code. Architecture decision records explaining why it is built this way. Dependencies, with contracts and known failure modes. Cost and capacity, with budgets and load tests.</desc>
  <rect width="880" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M119 110V140H761V110"/>
      <path d="M333 110V140"/>
      <path d="M547 110V140"/>
      <path d="M440 140V170"/>
      <path d="M440 226V256"/>
      <path d="M119 286V256H761V286"/>
      <path d="M333 286V256"/>
      <path d="M547 286V256"/>
    </g>

    <rect x="24" y="50" width="190" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="119" y="75" font-size="13" font-weight="700" fill="#66400f">Code and reviews</text>
    <text x="119" y="94" font-size="11.5" fill="#66400f">CODEOWNERS, small PRs</text>
    <rect x="238" y="50" width="190" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="333" y="75" font-size="13" font-weight="700" fill="#463365">Pipeline and deploys</text>
    <text x="333" y="94" font-size="11.5" fill="#463365">one path to production</text>
    <rect x="452" y="50" width="190" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="547" y="75" font-size="13" font-weight="700" fill="#294a2e">SLOs and dashboards</text>
    <text x="547" y="94" font-size="11.5" fill="#294a2e">what users experience</text>
    <rect x="666" y="50" width="190" height="60" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="761" y="75" font-size="13" font-weight="700" fill="#6e2a24">Alerts and on-call</text>
    <text x="761" y="94" font-size="11.5" fill="#6e2a24">the team's own rotation</text>

    <rect x="290" y="170" width="300" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2.5"/>
    <text x="440" y="194" font-size="14" font-weight="700" fill="#294a2e">TaskFlow API</text>
    <text x="440" y="213" font-size="11.5" fill="#294a2e">owned end to end by the tasks team</text>

    <rect x="24" y="286" width="190" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="119" y="311" font-size="13" font-weight="700" fill="#263e5a">Runbooks and docs</text>
    <text x="119" y="330" font-size="11.5" fill="#263e5a">kept next to the code</text>
    <rect x="238" y="286" width="190" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="333" y="311" font-size="13" font-weight="700" fill="#66400f">Decisions (ADRs)</text>
    <text x="333" y="330" font-size="11.5" fill="#66400f">why it is built this way</text>
    <rect x="452" y="286" width="190" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="547" y="311" font-size="13" font-weight="700" fill="#263e5a">Dependencies</text>
    <text x="547" y="330" font-size="11.5" fill="#263e5a">contracts, failure modes</text>
    <rect x="666" y="286" width="190" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="761" y="311" font-size="13" font-weight="700" fill="#463365">Cost and capacity</text>
    <text x="761" y="330" font-size="11.5" fill="#463365">budgets, load tests</text>

    <text x="440" y="388" font-size="13" fill="#40566b">Owning a service means owning everything it needs in production, not only its code.</text>
  </g>
</svg>
