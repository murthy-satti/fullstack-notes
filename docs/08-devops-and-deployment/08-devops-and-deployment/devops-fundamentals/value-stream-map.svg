<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="vsm-title vsm-desc">
  <title id="vsm-title">Value stream map of one TaskFlow change, before and after</title>
  <desc id="vsm-desc">Current state of one TaskFlow API change from commit to production, as six steps, each with the time the work waits before the step and the time spent working on it: code review waits 20 hours and takes 30 minutes; CI build and tests wait 12 minutes and take 18 minutes; the weekly release cut waits 72 hours and takes 10 minutes; manual QA in staging waits 16 hours and takes 3 hours; the change advisory board waits 48 hours and takes 30 minutes; the production deploy waits 2 hours and takes 30 minutes. Lead time is 163.2 hours, or 6.8 days, of which 158.2 hours are waiting and 5.0 hours are work, a flow efficiency of 3.0 percent. After the team moves to small pull requests reviewed within 2 hours, automated tests in the pipeline, deploy on every merge with a canary, and peer review instead of the change board, lead time is 3.1 hours: 2.0 hours waiting and 1.1 hours of work, a flow efficiency of 35.8 percent.</desc>
  <defs>
    <marker id="vsm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b">Current state: one TaskFlow API change, commit to production</text>

    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="middle">
      <text x="85" y="62">wait 20 h</text>
      <text x="227" y="62">wait 12 min</text>
      <text x="369" y="62">wait 72 h</text>
      <text x="511" y="62">wait 16 h</text>
      <text x="653" y="62">wait 48 h</text>
      <text x="795" y="62">wait 2 h</text>
    </g>

    <g stroke="#4774aa" stroke-width="2" fill="#e5efff">
      <rect x="24" y="72" width="122" height="52" rx="8"/>
      <rect x="166" y="72" width="122" height="52" rx="8"/>
      <rect x="308" y="72" width="122" height="52" rx="8"/>
      <rect x="450" y="72" width="122" height="52" rx="8"/>
      <rect x="592" y="72" width="122" height="52" rx="8"/>
      <rect x="734" y="72" width="122" height="52" rx="8"/>
    </g>
    <g fill="#263e5a" text-anchor="middle">
      <text x="85" y="95" font-size="12.5" font-weight="700">Code</text>
      <text x="85" y="112" font-size="11.5">review</text>
      <text x="227" y="95" font-size="12.5" font-weight="700">CI build</text>
      <text x="227" y="112" font-size="11.5">and tests</text>
      <text x="369" y="95" font-size="12.5" font-weight="700">Weekly</text>
      <text x="369" y="112" font-size="11.5">release cut</text>
      <text x="511" y="95" font-size="12.5" font-weight="700">Manual QA</text>
      <text x="511" y="112" font-size="11.5">in staging</text>
      <text x="653" y="95" font-size="12.5" font-weight="700">Change</text>
      <text x="653" y="112" font-size="11.5">board (CAB)</text>
      <text x="795" y="95" font-size="12.5" font-weight="700">Production</text>
      <text x="795" y="112" font-size="11.5">deploy</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M146 98H164" marker-end="url(#vsm-arrow)"/>
      <path d="M288 98H306" marker-end="url(#vsm-arrow)"/>
      <path d="M430 98H448" marker-end="url(#vsm-arrow)"/>
      <path d="M572 98H590" marker-end="url(#vsm-arrow)"/>
      <path d="M714 98H732" marker-end="url(#vsm-arrow)"/>
    </g>

    <g font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="middle">
      <text x="85" y="142">work 30 min</text>
      <text x="227" y="142">work 18 min</text>
      <text x="369" y="142">work 10 min</text>
      <text x="511" y="142">work 3 h</text>
      <text x="653" y="142">work 30 min</text>
      <text x="795" y="142">work 30 min</text>
    </g>

    <path d="M24 160H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="182" font-size="12" font-weight="700" fill="#40566b">Share of lead time spent waiting and working (each bar is its own 100%)</text>

    <text x="24" y="202" font-size="11.5" fill="#36424e">before: lead time 163.2 h (6.8 days), flow efficiency 3.0%</text>
    <rect x="24" y="208" width="807" height="26" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="831" y="208" width="25" height="26" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="427" y="226" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="middle">waiting 158.2 h (97%)</text>
    <text x="856" y="252" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="end">work 5.0 h (3%)</text>

    <text x="24" y="276" font-size="11.5" fill="#36424e">after: lead time 3.1 h, flow efficiency 35.8%</text>
    <rect x="24" y="282" width="534" height="26" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="558" y="282" width="298" height="26" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="291" y="300" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="middle">waiting 2.0 h (64%)</text>
    <text x="707" y="300" font-size="12" font-weight="700" fill="#294a2e" text-anchor="middle">work 1.1 h (36%)</text>

    <text x="24" y="332" font-size="11.5" fill="#36424e">after: small pull requests reviewed within 2 h, tests automated in the pipeline,</text>
    <text x="24" y="349" font-size="11.5" fill="#36424e">every merge deployed with a canary, and peer review in place of the change board</text>

    <text x="440" y="388" font-size="13" fill="#40566b" text-anchor="middle">Most lead time is waiting, so removing queues helps far more than speeding up the work itself.</text>
  </g>
</svg>
