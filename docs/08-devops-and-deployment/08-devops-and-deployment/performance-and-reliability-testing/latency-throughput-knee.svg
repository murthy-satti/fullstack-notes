<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="ltk-title ltk-desc">
  <title id="ltk-title">The knee of the latency curve in a measured step test</title>
  <desc id="ltk-desc">Results of one local step test against a lab server whose database pool has 5 connections and queries of about 21 ms, with the offered load stepped from 100 to 300 requests per second, a 5 second ramp and a 20 second hold per step. Top chart, achieved throughput against offered load, with a dashed line where achieved equals offered: 98 requests per second at 100 offered, 144 at 150, 194 at 200, then a plateau of 232 at 250 and only 209 at 300, because 5 connections divided by 0.0215 seconds per query is about 233 requests per second. Bottom chart, p95 latency: 30 ms at 100, 29 ms at 150, 40 ms at 200, then 726 ms at 250 and 4,589 ms at 300. The knee is shaded between 200 and 250 requests per second. Event-loop utilization stayed at 4 to 6 percent, so the CPU was idle, and the pool's wait queue reached 995 requests.</desc>
  <rect width="880" height="452" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Finding the knee: one lab run, offered load stepped from 100 to 300 requests/s</text>

    <rect x="440" y="60" width="140" height="136" fill="#fbe9e7"/>
    <rect x="440" y="236" width="140" height="136" fill="#fbe9e7"/>
    <text x="510" y="74" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="middle">knee</text>

    <text x="120" y="52" font-size="12" font-weight="700" fill="#36424e">Achieved throughput (requests/s)</text>
    <path d="M120 150.7H760M120 105.3H760M120 60H760" fill="none" stroke="#c9d1db" stroke-width="1"/>
    <path d="M120 60V196H760" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="end">
      <text x="112" y="154.7">100</text>
      <text x="112" y="109.3">200</text>
      <text x="112" y="64">300</text>
    </g>
    <path d="M160 150.7 720 60" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M160 151.6 300 130.7 440 108.1 580 90.8 720 101.3" fill="none" stroke="#4774aa" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="160" cy="151.6" r="4"/>
      <circle cx="300" cy="130.7" r="4"/>
      <circle cx="440" cy="108.1" r="4"/>
      <circle cx="580" cy="90.8" r="4"/>
      <circle cx="720" cy="101.3" r="4"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#263e5a" text-anchor="middle">
      <text x="160" y="142">98</text>
      <text x="300" y="121">144</text>
      <text x="440" y="99">194</text>
      <text x="580" y="82">232</text>
      <text x="720" y="92">209</text>
    </g>
    <text x="750" y="140" font-size="11.5" fill="#263e5a" text-anchor="end">plateau near 232/s: 5 connections / 0.0215 s per query ≈ 233/s</text>

    <text x="120" y="228" font-size="12" font-weight="700" fill="#36424e">p95 latency (ms)</text>
    <path d="M120 344.8H760M120 304H760M120 236H760" fill="none" stroke="#c9d1db" stroke-width="1"/>
    <path d="M120 236V372H760" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="end">
      <text x="112" y="348.8">1,000</text>
      <text x="112" y="308">2,500</text>
      <text x="112" y="240">5,000</text>
    </g>
    <path d="M160 371.2 300 371.2 440 370.9 580 352.3 720 247.2" fill="none" stroke="#b5524b" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="2">
      <circle cx="160" cy="371.2" r="4"/>
      <circle cx="300" cy="371.2" r="4"/>
      <circle cx="440" cy="370.9" r="4"/>
      <circle cx="580" cy="352.3" r="4"/>
      <circle cx="720" cy="247.2" r="4"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="middle">
      <text x="160" y="362">30</text>
      <text x="300" y="362">29</text>
      <text x="440" y="361">40</text>
      <text x="580" y="342">726</text>
      <text x="708" y="251" text-anchor="end">4,589</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="140" y="262">event-loop utilization stayed at 4-6%: the CPU was idle</text>
      <text x="140" y="280">the pool's wait queue reached 995 requests</text>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="160" y="390">100</text>
      <text x="300" y="390">150</text>
      <text x="440" y="390">200</text>
      <text x="580" y="390">250</text>
      <text x="720" y="390">300</text>
    </g>
    <text x="440" y="410" font-size="11.5" fill="#36424e" text-anchor="middle">offered load (requests/s): a 5 s ramp and a 20 s hold per step</text>

    <path d="M772 80H790" fill="none" stroke="#4774aa" stroke-width="2.5"/>
    <text x="796" y="84" font-size="11.5" fill="#36424e">achieved</text>
    <path d="M772 100H790" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="796" y="104" font-size="11.5" fill="#36424e">offered</text>
    <path d="M772 260H790" fill="none" stroke="#b5524b" stroke-width="2.5"/>
    <text x="796" y="264" font-size="11.5" fill="#36424e">p95</text>

    <text x="440" y="438" font-size="13" fill="#40566b" text-anchor="middle">Throughput stops following the offered load and p95 explodes: here, a full 5-connection pool.</text>
  </g>
</svg>
