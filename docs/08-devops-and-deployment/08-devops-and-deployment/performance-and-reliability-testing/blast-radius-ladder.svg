<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="brl-title brl-desc">
  <title id="brl-title">Widening the blast radius of chaos experiments one rung at a time</title>
  <desc id="brl-desc">A ladder of five rungs, read from the bottom. Rung 1, local and CI: Toxiproxy in integration tests makes dependencies slow or unavailable; there is no risk to users; climb when the test passes on every build. Rung 2, a performance or staging environment: pod kills and network delay under a k6 load test; no users are at risk; climb when the hypothesis held twice and the stop conditions were tested. Rung 3, a production canary: one pod or 1 percent of traffic, off-peak, with an abort switch ready; a few users are briefly at risk; climb when alerts fired and the SLO did not burn. Rung 4, a production game day: stop the instances in one zone with the team watching; one zone is at risk; climb when the runbooks worked and the fixes shipped. Rung 5, continuous: small automated experiments on a schedule or with every release, with small, ongoing risk.</desc>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b">Widen the blast radius one rung at a time (read from the bottom)</text>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="middle">
      <text x="94" y="62">risk to users</text>
      <text x="390" y="62">rung and example experiment</text>
      <text x="736" y="62">climb when</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="74" width="140" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="24" y="142" width="140" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="24" y="210" width="140" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="278" width="140" height="52" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="24" y="346" width="140" height="52" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="94" y="105" fill="#6e2a24">small, ongoing</text>
      <text x="94" y="173" fill="#6e2a24">one zone</text>
      <text x="94" y="241" fill="#66400f">a few users, briefly</text>
      <text x="94" y="309" fill="#294a2e">none: no users</text>
      <text x="94" y="377" fill="#294a2e">none</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="180" y="74" width="420" height="52" rx="8"/>
      <rect x="180" y="142" width="420" height="52" rx="8"/>
      <rect x="180" y="210" width="420" height="52" rx="8"/>
      <rect x="180" y="278" width="420" height="52" rx="8"/>
      <rect x="180" y="346" width="420" height="52" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="196" y="96" font-size="13" font-weight="700">5. Continuous</text>
      <text x="196" y="114" font-size="11.5">small automated experiments on a schedule or per release</text>
      <text x="196" y="164" font-size="13" font-weight="700">4. Production game day</text>
      <text x="196" y="182" font-size="11.5">stop the instances in one zone with the team watching</text>
      <text x="196" y="232" font-size="13" font-weight="700">3. Production canary</text>
      <text x="196" y="250" font-size="11.5">one pod or 1% of traffic, off-peak, abort switch ready</text>
      <text x="196" y="300" font-size="13" font-weight="700">2. Performance or staging environment</text>
      <text x="196" y="318" font-size="11.5">pod kills and network delay under a k6 load test</text>
      <text x="196" y="368" font-size="13" font-weight="700">1. Local and CI</text>
      <text x="196" y="386" font-size="11.5">Toxiproxy in integration tests: slow or dead dependencies</text>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="616" y="74" width="240" height="52" rx="8"/>
      <rect x="616" y="142" width="240" height="52" rx="8"/>
      <rect x="616" y="210" width="240" height="52" rx="8"/>
      <rect x="616" y="278" width="240" height="52" rx="8"/>
      <rect x="616" y="346" width="240" height="52" rx="8"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="632" y="105">the top: keep each one small</text>
      <text x="632" y="164">runbooks worked and</text>
      <text x="632" y="182">the fixes have shipped</text>
      <text x="632" y="232">alerts fired and the SLO</text>
      <text x="632" y="250">did not burn</text>
      <text x="632" y="300">the hypothesis held twice;</text>
      <text x="632" y="318">stop conditions were tested</text>
      <text x="632" y="368">the test passes on</text>
      <text x="632" y="386">every build</text>
    </g>

    <text x="440" y="424" font-size="13" fill="#40566b" text-anchor="middle">Start where failure costs nothing; climb only when the rung below has become boring.</text>
  </g>
</svg>
