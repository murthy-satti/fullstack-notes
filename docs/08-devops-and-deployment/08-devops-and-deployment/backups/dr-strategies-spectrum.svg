<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="drs-title drs-desc">
  <title id="drs-title">Disaster recovery strategies from backup and restore to active/active</title>
  <desc id="drs-desc">Four strategies, showing what exists in the recovery region. Backup and restore: only backup copies of data exist; app servers are not deployed and no traffic is served; RPO and RTO are measured in hours. Pilot light: data is replicated live; app servers are defined in infrastructure as code but switched off; no traffic; RPO and RTO in tens of minutes. Warm standby: data is replicated live; app servers run at reduced scale; no user traffic, or test traffic only; RPO and RTO in minutes. Multi-site active/active: data is live in several regions; app servers run at full scale; the region serves users; RPO and RTO near zero, although data corruption still needs backups. From left to right, cost and complexity increase while RPO and RTO decrease. Characterization follows the AWS disaster recovery whitepaper.</desc>
  <defs>
    <marker id="drs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">What exists in the recovery region</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="24" y="46" width="196" height="270" rx="10"/>
      <rect x="236" y="46" width="196" height="270" rx="10"/>
      <rect x="448" y="46" width="196" height="270" rx="10"/>
      <rect x="660" y="46" width="196" height="270" rx="10"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="122" y="72">Backup and restore</text>
      <text x="334" y="72">Pilot light</text>
      <text x="546" y="72">Warm standby</text>
      <text x="758" y="72">Active/active</text>
    </g>

    <g stroke-width="1.5">
      <rect x="40" y="88" width="164" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="40" y="144" width="164" height="44" rx="8" fill="#f5f7fb" stroke="#8a96a3" stroke-dasharray="5 3"/>
      <rect x="40" y="200" width="164" height="44" rx="8" fill="#f5f7fb" stroke="#8a96a3" stroke-dasharray="5 3"/>

      <rect x="252" y="88" width="164" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="252" y="144" width="164" height="44" rx="8" fill="#f5f7fb" stroke="#8a96a3" stroke-dasharray="5 3"/>
      <rect x="252" y="200" width="164" height="44" rx="8" fill="#f5f7fb" stroke="#8a96a3" stroke-dasharray="5 3"/>

      <rect x="464" y="88" width="164" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="464" y="144" width="164" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="464" y="200" width="164" height="44" rx="8" fill="#f5f7fb" stroke="#8a96a3" stroke-dasharray="5 3"/>

      <rect x="676" y="88" width="164" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="676" y="144" width="164" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="676" y="200" width="164" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="122" y="106">Data</text>
      <text x="122" y="162">App servers</text>
      <text x="122" y="218">Traffic</text>
      <text x="334" y="106">Data</text>
      <text x="334" y="162">App servers</text>
      <text x="334" y="218">Traffic</text>
      <text x="546" y="106">Data</text>
      <text x="546" y="162">App servers</text>
      <text x="546" y="218">Traffic</text>
      <text x="758" y="106">Data</text>
      <text x="758" y="162">App servers</text>
      <text x="758" y="218">Traffic</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="122" y="123">backup copies</text>
      <text x="122" y="179">not deployed</text>
      <text x="122" y="235">none</text>
      <text x="334" y="123">live replica</text>
      <text x="334" y="179">in IaC, switched off</text>
      <text x="334" y="235">none</text>
      <text x="546" y="123">live replica</text>
      <text x="546" y="179">running, scaled down</text>
      <text x="546" y="235">none, or tests</text>
      <text x="758" y="123">live in every region</text>
      <text x="758" y="179">full scale</text>
      <text x="758" y="235">serving users</text>
    </g>

    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="122" y="276">RPO/RTO: hours</text>
      <text x="334" y="276">tens of minutes</text>
      <text x="546" y="276">minutes</text>
      <text x="758" y="276">near zero</text>
    </g>
    <g font-size="10.5" fill="#36424e">
      <text x="122" y="296">rebuild everything</text>
      <text x="334" y="296">switch on and scale</text>
      <text x="546" y="296">scale up</text>
      <text x="758" y="296">corruption needs backups</text>
    </g>

    <path d="M40 346H836" fill="none" stroke="#bd7a20" stroke-width="2.5" marker-end="url(#drs-arrow)"/>
    <text x="440" y="340" font-size="12" font-weight="700" fill="#66400f">cost and complexity increase</text>
    <path d="M836 376H44" fill="none" stroke="#53845b" stroke-width="2.5" marker-end="url(#drs-arrow)"/>
    <text x="440" y="370" font-size="12" font-weight="700" fill="#294a2e">RPO and RTO get longer</text>

    <text x="440" y="412" font-size="13" fill="#40566b">Pick the cheapest strategy whose RPO and RTO meet the business impact analysis.</text>
  </g>
</svg>
