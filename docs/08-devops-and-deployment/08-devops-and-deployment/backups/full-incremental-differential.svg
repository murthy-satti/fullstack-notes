<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="fid-title fid-desc">
  <title id="fid-title">Full, incremental, and differential backups over one week</title>
  <desc id="fid-desc">For 500 GB of data with 25 GB of new changes per day. Daily full backups store 500 GB every day from Sunday to Saturday, 3,500 GB for the week, and restoring Saturday needs only Saturday's full backup. Incremental backups store a 500 GB full on Sunday and then only the 25 GB changed since the previous backup each day, 650 GB for the week, but restoring Saturday needs Sunday's full plus all six incrementals, seven pieces in order. Differential backups store the Sunday full and then everything changed since that full, growing 25, 50, 75, 100, 125, and 150 GB, 1,025 GB for the week, and restoring Saturday needs Sunday's full plus Saturday's differential, two pieces.</desc>
  <rect width="880" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="185" y="40">Sun</text>
      <text x="255" y="40">Mon</text>
      <text x="325" y="40">Tue</text>
      <text x="395" y="40">Wed</text>
      <text x="465" y="40">Thu</text>
      <text x="535" y="40">Fri</text>
      <text x="605" y="40">Sat</text>
      <text x="700" y="40">Week total</text>
      <text x="806" y="40">Restore Sat</text>
    </g>

    <g text-anchor="start">
      <text x="24" y="78" font-size="13" font-weight="700" fill="#263e5a">Full every day</text>
      <text x="24" y="95" font-size="11" fill="#36424e">copy everything</text>
      <text x="24" y="158" font-size="13" font-weight="700" fill="#463365">Incremental</text>
      <text x="24" y="175" font-size="11" fill="#36424e">changes since last</text>
      <text x="24" y="238" font-size="13" font-weight="700" fill="#66400f">Differential</text>
      <text x="24" y="255" font-size="11" fill="#36424e">changes since full</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="154" y="58" width="62" height="50" rx="6"/>
      <rect x="224" y="58" width="62" height="50" rx="6"/>
      <rect x="294" y="58" width="62" height="50" rx="6"/>
      <rect x="364" y="58" width="62" height="50" rx="6"/>
      <rect x="434" y="58" width="62" height="50" rx="6"/>
      <rect x="504" y="58" width="62" height="50" rx="6"/>
      <rect x="574" y="58" width="62" height="50" rx="6"/>
      <rect x="154" y="138" width="62" height="50" rx="6"/>
      <rect x="154" y="218" width="62" height="50" rx="6"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="224" y="138" width="62" height="50" rx="6"/>
      <rect x="294" y="138" width="62" height="50" rx="6"/>
      <rect x="364" y="138" width="62" height="50" rx="6"/>
      <rect x="434" y="138" width="62" height="50" rx="6"/>
      <rect x="504" y="138" width="62" height="50" rx="6"/>
      <rect x="574" y="138" width="62" height="50" rx="6"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="224" y="218" width="62" height="50" rx="6"/>
      <rect x="294" y="218" width="62" height="50" rx="6"/>
      <rect x="364" y="218" width="62" height="50" rx="6"/>
      <rect x="434" y="218" width="62" height="50" rx="6"/>
      <rect x="504" y="218" width="62" height="50" rx="6"/>
      <rect x="574" y="218" width="62" height="50" rx="6"/>
    </g>

    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="185" y="82">500</text>
      <text x="255" y="82">500</text>
      <text x="325" y="82">500</text>
      <text x="395" y="82">500</text>
      <text x="465" y="82">500</text>
      <text x="535" y="82">500</text>
      <text x="605" y="82">500</text>
      <text x="185" y="162">500</text>
      <text x="185" y="242">500</text>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="255" y="162">25</text>
      <text x="325" y="162">25</text>
      <text x="395" y="162">25</text>
      <text x="465" y="162">25</text>
      <text x="535" y="162">25</text>
      <text x="605" y="162">25</text>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="255" y="242">25</text>
      <text x="325" y="242">50</text>
      <text x="395" y="242">75</text>
      <text x="465" y="242">100</text>
      <text x="535" y="242">125</text>
      <text x="605" y="242">150</text>
    </g>
    <g font-size="10.5" fill="#36424e">
      <text x="185" y="99">GB full</text>
      <text x="255" y="99">GB full</text>
      <text x="325" y="99">GB full</text>
      <text x="395" y="99">GB full</text>
      <text x="465" y="99">GB full</text>
      <text x="535" y="99">GB full</text>
      <text x="605" y="99">GB full</text>
      <text x="185" y="179">GB full</text>
      <text x="255" y="179">GB incr</text>
      <text x="325" y="179">GB incr</text>
      <text x="395" y="179">GB incr</text>
      <text x="465" y="179">GB incr</text>
      <text x="535" y="179">GB incr</text>
      <text x="605" y="179">GB incr</text>
      <text x="185" y="259">GB full</text>
      <text x="255" y="259">GB diff</text>
      <text x="325" y="259">GB diff</text>
      <text x="395" y="259">GB diff</text>
      <text x="465" y="259">GB diff</text>
      <text x="535" y="259">GB diff</text>
      <text x="605" y="259">GB diff</text>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="652" y="58" width="96" height="50" rx="6"/>
      <rect x="652" y="138" width="96" height="50" rx="6"/>
      <rect x="652" y="218" width="96" height="50" rx="6"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="700" y="88">3,500 GB</text>
      <text x="700" y="168">650 GB</text>
      <text x="700" y="248">1,025 GB</text>
    </g>

    <rect x="760" y="58" width="96" height="50" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="760" y="138" width="96" height="50" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="760" y="218" width="96" height="50" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <g font-size="12" font-weight="700">
      <text x="808" y="82" fill="#294a2e">1 piece</text>
      <text x="808" y="162" fill="#6e2a24">7 pieces</text>
      <text x="808" y="242" fill="#66400f">2 pieces</text>
    </g>
    <g font-size="10">
      <text x="808" y="99" fill="#294a2e">Sat full</text>
      <text x="808" y="179" fill="#6e2a24">Sun + 6 incr</text>
      <text x="808" y="259" fill="#66400f">Sun + Sat diff</text>
    </g>

    <text x="24" y="302" font-size="11.5" fill="#36424e" text-anchor="start">Assumes 500 GB of data and 25 GB (5%) of new changes per day, each day changing different data.</text>
    <text x="440" y="340" font-size="13" fill="#40566b">Incrementals save the most storage; fulls restore fastest; differentials sit in between.</text>
  </g>
</svg>
