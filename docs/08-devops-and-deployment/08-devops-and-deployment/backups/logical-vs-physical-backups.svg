<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="lvp-title lvp-desc">
  <title id="lvp-title">Logical compared with physical database backups</title>
  <desc id="lvp-desc">Logical backups, such as mongodump or pg_dump, read documents or rows through the database's query engine and write a portable dump file of BSON or SQL. Physical backups, such as volume snapshots, pg_basebackup, or Percona Backup physical mode, copy the database's data files or blocks directly. Compared: logical dumps are portable across versions and platforms, physical copies are tied to the same engine and major version. For large data, logical backup and restore are slow because they read every record and rebuild indexes, while physical copies are fast. Logical dumps can restore a single collection or table easily; physical copies usually restore the whole database. Logical dumps put query load on the source and churn its cache, while snapshots have little impact. Both support point-in-time recovery when combined with the oplog or WAL. Logical suits small databases, migrations, and selective restores; physical suits large databases and fast full restores.</desc>
  <defs>
    <marker id="lvp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="345" y="34" font-size="14" font-weight="700" fill="#463365">Logical</text>
    <text x="345" y="50" font-size="11" fill="#463365">mongodump, pg_dump</text>
    <text x="645" y="34" font-size="14" font-weight="700" fill="#263e5a">Physical</text>
    <text x="645" y="50" font-size="11" fill="#263e5a">snapshots, pg_basebackup</text>

    <g stroke-width="1.5">
      <rect x="210" y="64" width="80" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="400" y="64" width="80" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="510" y="64" width="80" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="700" y="64" width="80" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="250" y="81">query</text>
      <text x="250" y="96">engine</text>
      <text x="550" y="81">data files</text>
      <text x="550" y="96">or blocks</text>
      <text x="740" y="81">volume</text>
      <text x="740" y="96">snapshot</text>
    </g>
    <text x="440" y="81" font-size="11" fill="#463365">dump file</text>
    <text x="440" y="96" font-size="11" fill="#463365">BSON / SQL</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M290 84H398" marker-end="url(#lvp-arrow)"/>
      <path d="M590 84H698" marker-end="url(#lvp-arrow)"/>
    </g>
    <g font-size="10.5" font-style="italic" fill="#40566b">
      <text x="344" y="78">reads records</text>
      <text x="644" y="78">copies bytes</text>
    </g>

    <g fill="#eef1f5">
      <rect x="24" y="124" width="812" height="34"/>
      <rect x="24" y="192" width="812" height="34"/>
      <rect x="24" y="260" width="812" height="34"/>
      <rect x="24" y="328" width="812" height="34"/>
    </g>
    <rect x="24" y="124" width="812" height="272" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M200 124V396M495 124V396" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="36" y="146">Portability</text>
      <text x="36" y="180">Speed on large data</text>
      <text x="36" y="214">Selective restore</text>
      <text x="36" y="248">Load on the source</text>
      <text x="36" y="282">Point-in-time</text>
      <text x="36" y="316">Consistency</text>
      <text x="36" y="350">Restore time</text>
      <text x="36" y="384">Best for</text>
    </g>
    <g font-size="11.5" text-anchor="start">
      <text x="212" y="146" fill="#294a2e">across versions and platforms</text>
      <text x="212" y="180" fill="#6e2a24">slow: reads every record</text>
      <text x="212" y="214" fill="#294a2e">one collection or table, easily</text>
      <text x="212" y="248" fill="#6e2a24">queries load it and churn its cache</text>
      <text x="212" y="282" fill="#36424e">with the oplog or WAL</text>
      <text x="212" y="316" fill="#36424e">needs --oplog (MongoDB)</text>
      <text x="212" y="350" fill="#6e2a24">long: reinsert and rebuild indexes</text>
      <text x="212" y="384" fill="#36424e">small DBs, migrations, extracts</text>
      <text x="507" y="146" fill="#6e2a24">same engine and major version</text>
      <text x="507" y="180" fill="#294a2e">fast: block copies, incremental</text>
      <text x="507" y="214" fill="#6e2a24">usually the whole database</text>
      <text x="507" y="248" fill="#294a2e">little with copy-on-write snapshots</text>
      <text x="507" y="282" fill="#36424e">with the oplog or WAL</text>
      <text x="507" y="316" fill="#36424e">journal on the same volume, or a lock</text>
      <text x="507" y="350" fill="#294a2e">short: copy files and start</text>
      <text x="507" y="384" fill="#36424e">large DBs, fast full restores</text>
    </g>

    <text x="430" y="434" font-size="13" fill="#40566b">Most production setups use physical backups for recovery and logical dumps for portability.</text>
  </g>
</svg>
