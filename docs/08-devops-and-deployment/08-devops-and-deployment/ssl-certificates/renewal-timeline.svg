<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="rtl-title rtl-desc">
  <title id="rtl-title">Certificate renewal timelines with alert thresholds</title>
  <desc id="rtl-desc">Two certificate lifetimes on a 0 to 90 day axis. A 90-day certificate, the Let's Encrypt default, is valid with nothing to do until day 60; renewal starts at day 60 with 30 days left and the client retries daily; a ticket alert fires at day 69 when fewer than 21 days are left; a page fires at day 83 when fewer than 7 days are left; the certificate expires at day 90. A 45-day certificate, available through the tlsserver profile and planned as the default from 2028, starts renewal at day 30 with 15 days left, raises a ticket at day 35 with fewer than 10 days left, pages at day 41 with fewer than 4 days left, and expires at day 45. Green marks the valid period with nothing to do, orange the renewal window in which the client retries, and red the period in which someone must act.</desc>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="40" font-size="13" font-weight="700" fill="#40566b">90-day certificate (Let's Encrypt default)</text>
    <rect x="80" y="84" width="493.3" height="32" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="573.3" y="84" width="189.1" height="32" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="762.4" y="84" width="57.6" height="32" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="2">
      <path d="M573.3 76V124"/>
      <path d="M647.3 84V132"/>
      <path d="M762.4 76V124"/>
      <path d="M820 84V148"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="569" y="70" text-anchor="end">day 60: renewal starts, 30 days left</text>
      <text x="643" y="144" text-anchor="end">day 69: ticket (21 days left)</text>
      <text x="766" y="70">day 83: page</text>
      <text x="816" y="160" text-anchor="end">day 90: expires</text>
    </g>

    <text x="24" y="190" font-size="13" font-weight="700" fill="#40566b">45-day certificate (tlsserver profile; default planned from 2028)</text>
    <rect x="80" y="224" width="246.7" height="32" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="326.7" y="224" width="90.4" height="32" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="417.1" y="224" width="32.9" height="32" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="2">
      <path d="M326.7 216V264"/>
      <path d="M367.8 224V272"/>
      <path d="M417.1 216V264"/>
      <path d="M450 224V288"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="322" y="210" text-anchor="end">day 30: renewal starts, 15 days left</text>
      <text x="364" y="284" text-anchor="end">day 35: ticket (10 days left)</text>
      <text x="421" y="210">day 41: page</text>
      <text x="454" y="300">day 45: expires</text>
    </g>

    <path d="M80 316H820" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="80" y="332">day 0</text>
      <text x="203.3" y="332">15</text>
      <text x="326.7" y="332">30</text>
      <text x="450" y="332">45</text>
      <text x="573.3" y="332">60</text>
      <text x="696.7" y="332">75</text>
      <text x="820" y="332">90</text>
    </g>

    <g stroke-width="1.5">
      <rect x="80" y="346" width="14" height="14" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="260" y="346" width="14" height="14" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="500" y="346" width="14" height="14" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="100" y="358">valid, nothing to do</text>
      <text x="280" y="358">renewal window, client retries</text>
      <text x="520" y="358">page: a person must act</text>
    </g>

    <text x="430" y="388" font-size="13" fill="#40566b" text-anchor="middle">Alert on days left on the certificate actually served, scaled to its lifetime.</text>
  </g>
</svg>
