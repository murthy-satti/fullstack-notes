<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-labelledby="ttf-title ttf-desc">
  <title id="ttf-title">Troubleshooting a TLS error step by step</title>
  <desc id="ttf-desc">Start with a reported TLS error and run openssl s_client with -servername. First question: does the handshake complete? If no, it is a connection or protocol problem: check the port, firewall, TLS version, cipher suites, and SNI. If yes, is the verify return code 0, ok? If no, read the verify error number: 10 means expired, so renew and reload; 20 or 21 means a missing intermediate, so serve the full chain; 18 or 19 means a self-signed certificate, so use a trusted or private CA; 9 means not yet valid, so fix the server or client clock. If the code is 0, is the hostname in the subject alternative name list? If no, it is a name mismatch: reissue with the name or fix SNI routing. If yes, does it fail for one client only? If yes, the cause is on the client side: an old trust store, an intercepting proxy, or a pinned certificate. If no, the certificate and chain look right; scan the configuration with SSL Labs or testssl.sh.</desc>
  <defs>
    <marker id="ttf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="620" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="14" width="280" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="230" y="35" font-size="12.5" font-weight="700" fill="#36424e">TLS error: run openssl s_client</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <path d="M230 62 345 106 230 150 115 106Z"/>
      <path d="M230 172 345 216 230 260 115 216Z"/>
      <path d="M230 282 345 326 230 370 115 326Z"/>
      <path d="M230 392 345 436 230 480 115 436Z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="230" y="103">Does the handshake</text>
      <text x="230" y="119">complete?</text>
      <text x="230" y="213">Verify return</text>
      <text x="230" y="229">code 0 (ok)?</text>
      <text x="230" y="323">Hostname in the</text>
      <text x="230" y="339">SAN list?</text>
      <text x="230" y="433">Fails for one</text>
      <text x="230" y="449">client only?</text>
    </g>

    <rect x="470" y="78" width="366" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="653" y="101" font-size="13" font-weight="700" fill="#6e2a24">Connection or protocol problem</text>
    <text x="653" y="120" font-size="11.5" fill="#6e2a24">port, firewall, TLS version, ciphers, SNI</text>

    <rect x="470" y="166" width="366" height="100" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="653" y="186" font-size="13" font-weight="700" fill="#6e2a24">Read the verify error number</text>
    <g font-size="11.5" fill="#6e2a24">
      <text x="653" y="205">10 expired: renew and reload</text>
      <text x="653" y="221">20/21 missing intermediate: serve the full chain</text>
      <text x="653" y="237">18/19 self-signed: use a trusted or private CA</text>
      <text x="653" y="253">9 not yet valid: fix the server or client clock</text>
    </g>

    <rect x="470" y="298" width="366" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="653" y="321" font-size="13" font-weight="700" fill="#6e2a24">Name mismatch</text>
    <text x="653" y="340" font-size="11.5" fill="#6e2a24">reissue with the name, or fix SNI routing</text>

    <rect x="470" y="408" width="366" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="653" y="431" font-size="13" font-weight="700" fill="#463365">Client-side cause</text>
    <text x="653" y="450" font-size="11.5" fill="#463365">old trust store, intercepting proxy, pinned cert</text>

    <rect x="80" y="504" width="300" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="230" y="527" font-size="13" font-weight="700" fill="#294a2e">Certificate and chain look right</text>
    <text x="230" y="546" font-size="11.5" fill="#294a2e">scan with SSL Labs or testssl.sh</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M230 46V60" marker-end="url(#ttf-arrow)"/>
      <path d="M230 150V170" marker-end="url(#ttf-arrow)"/>
      <path d="M230 260V280" marker-end="url(#ttf-arrow)"/>
      <path d="M230 370V390" marker-end="url(#ttf-arrow)"/>
      <path d="M230 480V502" marker-end="url(#ttf-arrow)"/>
      <path d="M345 106H468" marker-end="url(#ttf-arrow)"/>
      <path d="M345 216H468" marker-end="url(#ttf-arrow)"/>
      <path d="M345 326H468" marker-end="url(#ttf-arrow)"/>
      <path d="M345 436H468" marker-end="url(#ttf-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="406" y="99">no</text>
      <text x="406" y="209">no</text>
      <text x="406" y="319">no</text>
      <text x="406" y="429">yes</text>
      <text x="246" y="165" text-anchor="start">yes</text>
      <text x="246" y="275" text-anchor="start">yes</text>
      <text x="246" y="385" text-anchor="start">yes</text>
      <text x="246" y="497" text-anchor="start">no</text>
    </g>

    <text x="430" y="598" font-size="13" fill="#40566b">Work from the connection up: handshake, chain, name, then the client's own environment.</text>
  </g>
</svg>
