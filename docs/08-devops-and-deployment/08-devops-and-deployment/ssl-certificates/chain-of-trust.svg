<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="cot-title cot-desc">
  <title id="cot-title">Certificate chain of trust: leaf, intermediate, and root</title>
  <desc id="cot-desc">Left, what the server sends in fullchain.pem: the leaf certificate for api.example.com, issued by Example TLS CA R1, with subject alternative name api.example.com, valid for 90 days, and basic constraints CA false; and the intermediate certificate Example TLS CA R1, issued by Example Root X1, with CA true and path length 0, valid for a few years and used online to issue certificates. Right, what the client already has: the root certificate Example Root X1, self-signed, stored in the operating system, browser, or runtime trust store, with its private key kept offline in a hardware security module. The client verifies the leaf's signature with the intermediate's public key and the intermediate's signature with the root's public key, then finds the root in its trust store. The server must send the leaf and every intermediate but not the root; a missing intermediate causes errors such as unable to get local issuer certificate.</desc>
  <defs>
    <marker id="cot-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="400" height="300" rx="8" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="40" y="46" font-size="13" font-weight="700" fill="#263e5a" text-anchor="start">Sent by the server (fullchain.pem)</text>
    <rect x="456" y="24" width="380" height="300" rx="8" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="472" y="46" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Already on the client (trust store)</text>

    <rect x="64" y="64" width="320" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="224" y="87" font-size="14" font-weight="700" fill="#263e5a">Leaf: api.example.com</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="224" y="107">issuer: Example TLS CA R1</text>
      <text x="224" y="124">SAN: api.example.com</text>
      <text x="224" y="141">valid 90 days</text>
      <text x="224" y="158">CA: false</text>
    </g>

    <rect x="64" y="204" width="320" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="224" y="227" font-size="14" font-weight="700" fill="#263e5a">Intermediate: Example TLS CA R1</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="224" y="247">issuer: Example Root X1</text>
      <text x="224" y="264">CA: true, path length 0</text>
      <text x="224" y="281">valid a few years</text>
      <text x="224" y="298">online, issues leaf certificates</text>
    </g>

    <rect x="496" y="204" width="300" height="100" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="646" y="227" font-size="14" font-weight="700" fill="#294a2e">Root: Example Root X1</text>
    <g font-size="11.5" fill="#294a2e">
      <text x="646" y="247">issuer: itself (self-signed)</text>
      <text x="646" y="264">in OS, browser, runtime stores</text>
      <text x="646" y="281">valid many years</text>
      <text x="646" y="298">private key offline in an HSM</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M224 164V202" marker-end="url(#cot-arrow)"/>
      <path d="M384 254H494" marker-end="url(#cot-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="234" y="187" text-anchor="start">signed by</text>
      <text x="439" y="246">signed by</text>
    </g>

    <rect x="496" y="64" width="300" height="100" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="646" y="88" font-size="13" font-weight="700" fill="#36424e">Client checks, bottom up</text>
    <g font-size="11.5" fill="#36424e">
      <text x="646" y="110">1. leaf signature with intermediate key</text>
      <text x="646" y="128">2. intermediate signature with root key</text>
      <text x="646" y="146">3. root present in the trust store</text>
    </g>

    <rect x="24" y="344" width="400" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="224" y="368" font-size="12.5" font-weight="700" fill="#294a2e">Serve: leaf + every intermediate</text>
    <text x="224" y="388" font-size="11.5" fill="#294a2e">not the root; clients already have it</text>
    <rect x="456" y="344" width="380" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="646" y="368" font-size="12.5" font-weight="700" fill="#6e2a24">Missing intermediate</text>
    <text x="646" y="388" font-size="11.5" fill="#6e2a24">"unable to get local issuer certificate"</text>

    <text x="430" y="444" font-size="13" fill="#40566b">Each certificate is signed by the one above it; trust ends at a root the client already holds.</text>
  </g>
</svg>
