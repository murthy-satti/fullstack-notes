<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="tor-title tor-desc">
  <title id="tor-title">The 3-2-1 backup rule and its 3-2-1-1-0 extension for TaskFlow</title>
  <desc id="tor-desc">Region A, in the production account, holds copy 1, the production MongoDB replica set on SSD volumes, and copy 2, a local backup of daily snapshots in object storage for fast restores. Copy 2 is copied to region B, in a separate backup account, as copy 3: an offsite backup in another region and account, protected by Object Lock so it is immutable and encrypted with its own KMS key. A mistake, ransomware, or a compromise of the production account can reach copies 1 and 2; copy 3 survives because it uses separate credentials and cannot be deleted early. Chips summarize the rule: 3 copies of the data, on 2 different storage types, with 1 offsite; the extension adds 1 immutable or offline copy and 0 errors, proven by restore tests.</desc>
  <defs>
    <marker id="tor-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="30" width="500" height="200" rx="10" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="40" y="52" font-size="13" font-weight="700" fill="#263e5a" text-anchor="start">Region A, production account</text>
    <rect x="564" y="30" width="272" height="200" rx="10" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="580" y="52" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Region B, backup account</text>

    <rect x="44" y="76" width="200" height="120" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="144" y="104" font-size="14" font-weight="700" fill="#263e5a">Copy 1: production</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="144" y="128">MongoDB replica set</text>
      <text x="144" y="146">SSD volumes</text>
      <text x="144" y="164">serves live traffic</text>
    </g>
    <rect x="304" y="76" width="200" height="120" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="404" y="104" font-size="14" font-weight="700" fill="#463365">Copy 2: local backup</text>
    <g font-size="11.5" fill="#463365">
      <text x="404" y="128">daily snapshots in</text>
      <text x="404" y="146">object storage</text>
      <text x="404" y="164">fast restores</text>
    </g>
    <rect x="584" y="76" width="232" height="120" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="700" y="104" font-size="14" font-weight="700" fill="#294a2e">Copy 3: offsite backup</text>
    <g font-size="11.5" fill="#294a2e">
      <text x="700" y="128">other region and account</text>
      <text x="700" y="146">Object Lock: immutable</text>
      <text x="700" y="164">encrypted, own KMS key</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M244 136H302" marker-end="url(#tor-arrow)"/>
      <path d="M504 136H582" marker-end="url(#tor-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="273" y="128">snapshot</text>
      <text x="543" y="128">copy</text>
    </g>

    <rect x="24" y="252" width="500" height="54" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="274" y="275" font-size="12.5" font-weight="700" fill="#6e2a24">Mistake, ransomware, or stolen admin keys</text>
    <text x="274" y="294" font-size="11.5" fill="#6e2a24">can reach copies 1 and 2</text>
    <rect x="564" y="252" width="272" height="54" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="700" y="275" font-size="12.5" font-weight="700" fill="#294a2e">Copy 3 survives</text>
    <text x="700" y="294" font-size="11.5" fill="#294a2e">separate credentials, no early delete</text>

    <g stroke-width="1.5">
      <rect x="24" y="330" width="150" height="40" rx="20" fill="#e5efff" stroke="#4774aa"/>
      <rect x="190" y="330" width="150" height="40" rx="20" fill="#e5efff" stroke="#4774aa"/>
      <rect x="356" y="330" width="150" height="40" rx="20" fill="#e5efff" stroke="#4774aa"/>
      <rect x="522" y="330" width="150" height="40" rx="20" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="688" y="330" width="148" height="40" rx="20" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="99" y="355" fill="#263e5a">3 copies</text>
      <text x="265" y="355" fill="#263e5a">2 storage types</text>
      <text x="431" y="355" fill="#263e5a">1 offsite</text>
      <text x="597" y="355" fill="#294a2e">+1 immutable</text>
      <text x="762" y="355" fill="#294a2e">+0 restore errors</text>
    </g>
    <text x="265" y="390" font-size="11" fill="#36424e">the 3-2-1 rule</text>
    <text x="679" y="390" font-size="11" fill="#36424e">the 3-2-1-1-0 extension</text>

    <text x="430" y="424" font-size="13" fill="#40566b">Keep at least one copy that the same mistake, attacker, or disaster cannot touch.</text>
  </g>
</svg>
