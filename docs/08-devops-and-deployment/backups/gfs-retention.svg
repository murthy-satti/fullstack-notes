<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="gfs-title gfs-desc">
  <title id="gfs-title">Grandfather-father-son retention</title>
  <desc id="gfs-desc">Three tiers of restore points, newest on the right. Son: daily backups kept for 7 days, seven restore points. Father: the weekly backup from each of the last 4 weeks, four restore points. Grandfather: the monthly backup from each of the last 12 months, twelve restore points. In total 23 restore points cover a full year, instead of 365 daily backups, with fine-grained choice for recent data and coarse choice for old data.</desc>
  <rect width="860" height="300" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g text-anchor="start">
      <text x="24" y="58" font-size="13" font-weight="700" fill="#66400f">Son: daily</text>
      <text x="24" y="75" font-size="11" fill="#36424e">keep 7 days</text>
      <text x="24" y="128" font-size="13" font-weight="700" fill="#463365">Father: weekly</text>
      <text x="24" y="145" font-size="11" fill="#36424e">keep 4 weeks</text>
      <text x="24" y="198" font-size="13" font-weight="700" fill="#263e5a">Grandfather: monthly</text>
      <text x="24" y="215" font-size="11" fill="#36424e">keep 12 months</text>
    </g>

    <g stroke="#c9d1db" stroke-width="1.5">
      <path d="M190 62H700"/>
      <path d="M190 132H700"/>
      <path d="M190 202H700"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <circle cx="400" cy="62" r="9"/>
      <circle cx="450" cy="62" r="9"/>
      <circle cx="500" cy="62" r="9"/>
      <circle cx="550" cy="62" r="9"/>
      <circle cx="600" cy="62" r="9"/>
      <circle cx="650" cy="62" r="9"/>
      <circle cx="700" cy="62" r="9"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <circle cx="400" cy="132" r="9"/>
      <circle cx="500" cy="132" r="9"/>
      <circle cx="600" cy="132" r="9"/>
      <circle cx="700" cy="132" r="9"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="190" cy="202" r="9"/>
      <circle cx="236.4" cy="202" r="9"/>
      <circle cx="282.7" cy="202" r="9"/>
      <circle cx="329.1" cy="202" r="9"/>
      <circle cx="375.5" cy="202" r="9"/>
      <circle cx="421.8" cy="202" r="9"/>
      <circle cx="468.2" cy="202" r="9"/>
      <circle cx="514.5" cy="202" r="9"/>
      <circle cx="560.9" cy="202" r="9"/>
      <circle cx="607.3" cy="202" r="9"/>
      <circle cx="653.6" cy="202" r="9"/>
      <circle cx="700" cy="202" r="9"/>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="400" y="90">6 days ago</text>
      <text x="700" y="90">today</text>
      <text x="400" y="160">3 weeks ago</text>
      <text x="700" y="160">this week</text>
      <text x="190" y="230">11 months ago</text>
      <text x="700" y="230">this month</text>
    </g>

    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="730" y="67">7 points</text>
      <text x="730" y="137">4 points</text>
      <text x="730" y="207">12 points</text>
    </g>

    <text x="430" y="272" font-size="13" fill="#40566b" text-anchor="middle">23 restore points cover a year: fine-grained for recent data, coarse for old data.</text>
  </g>
</svg>
