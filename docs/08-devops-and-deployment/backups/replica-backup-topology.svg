<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="rbt-title rbt-desc">
  <title id="rbt-title">Backing up from a hidden replica set member</title>
  <desc id="rbt-desc">TaskFlow API sends reads and writes to the primary of a MongoDB replica set, and may read from two normal secondaries. The primary replicates to the two secondaries and to a hidden member with priority 0, which applications never see and which can never become primary. The backup agent takes snapshots or dumps and captures the oplog from the hidden member, so the I/O and cache churn of backups does not affect application traffic. Backups go to object storage in another account. An optional delayed hidden member, one hour behind, gives a fast way to recover from a recent mistake but is not a substitute for backups.</desc>
  <defs>
    <marker id="rbt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rbt-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="140" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="164" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="99" y="183" font-size="11.5" fill="#66400f">reads and writes</text>

    <rect x="216" y="30" width="420" height="300" rx="10" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="232" y="52" font-size="13" font-weight="700" fill="#263e5a" text-anchor="start">MongoDB replica set</text>

    <rect x="246" y="140" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="321" y="164" font-size="14" font-weight="700" fill="#263e5a">Primary</text>
    <text x="321" y="183" font-size="11.5" fill="#263e5a">takes all writes</text>
    <rect x="456" y="70" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="536" y="92" font-size="13" font-weight="700" fill="#263e5a">Secondary 1</text>
    <text x="536" y="109" font-size="11" fill="#263e5a">may serve reads</text>
    <rect x="456" y="140" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="536" y="162" font-size="13" font-weight="700" fill="#263e5a">Secondary 2</text>
    <text x="536" y="179" font-size="11" fill="#263e5a">may serve reads</text>
    <rect x="456" y="210" width="160" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="536" y="232" font-size="13" font-weight="700" fill="#463365">Hidden member</text>
    <text x="536" y="249" font-size="11" fill="#463365">priority 0, no app use</text>
    <rect x="456" y="272" width="160" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="536" y="292" font-size="12" font-weight="700" fill="#36424e">Delayed member</text>
    <text x="536" y="308" font-size="11" fill="#36424e">optional, 1 h behind</text>

    <rect x="676" y="200" width="160" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="756" y="226" font-size="14" font-weight="700" fill="#463365">Backup agent</text>
    <text x="756" y="245" font-size="11" fill="#463365">snapshots or dumps</text>
    <text x="756" y="260" font-size="11" fill="#463365">plus oplog capture</text>
    <rect x="676" y="56" width="160" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="756" y="82" font-size="14" font-weight="700" fill="#294a2e">Object storage</text>
    <text x="756" y="101" font-size="11" fill="#294a2e">backup account,</text>
    <text x="756" y="116" font-size="11" fill="#294a2e">other region</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 168H244" marker-end="url(#rbt-arrow)"/>
      <path d="M396 158 454 100" marker-end="url(#rbt-arrow)"/>
      <path d="M396 166H454" marker-end="url(#rbt-arrow)"/>
      <path d="M396 176 454 230" marker-end="url(#rbt-arrow)"/>
      <path d="M396 186 454 290" marker-end="url(#rbt-arrow)"/>
      <path d="M616 235H674" marker-end="url(#rbt-arrow)"/>
      <path d="M756 200V128" marker-end="url(#rbt-arrow)"/>
    </g>
    <text x="321" y="230" font-size="11" font-style="italic" fill="#40566b">replicates the oplog</text>
    <text x="645" y="227" font-size="11" font-style="italic" fill="#40566b">reads</text>
    <text x="764" y="168" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">encrypted</text>
    <text x="764" y="182" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">upload</text>

    <text x="430" y="362" font-size="13" fill="#40566b">Back up from a member the application never uses, so backups do not slow users down.</text>
  </g>
</svg>
