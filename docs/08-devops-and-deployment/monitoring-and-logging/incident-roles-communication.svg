<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="irc-title irc-desc">
  <title id="irc-title">Incident roles and how information flows between them</title>
  <desc id="irc-desc">The incident commander sits at the centre: they coordinate and decide but do not debug. They exchange tasks and status with the operations lead, who directs the fix and works with subject experts for the database, application, and network. They give facts and the time of the next update to the communications lead, who owns all updates, posting to the status page for customers and briefing support and leadership. Decisions go to the scribe, who records the timeline. Every role posts in the incident channel and shared document, which is the single source of truth.</desc>
  <defs>
    <marker id="irc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="irc-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="330" y="30" width="200" height="56" rx="8"/>
      <rect x="40" y="120" width="200" height="56" rx="8"/>
      <rect x="40" y="260" width="200" height="56" rx="8"/>
      <rect x="620" y="120" width="200" height="56" rx="8"/>
    </g>
    <rect x="330" y="166" width="200" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="3"/>
    <g font-size="14" font-weight="700" fill="#66400f">
      <text x="430" y="54">Scribe</text>
      <text x="140" y="144">Operations lead</text>
      <text x="140" y="284">Subject experts</text>
      <text x="720" y="144">Communications lead</text>
      <text x="430" y="192">Incident commander</text>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="430" y="73">records the timeline</text>
      <text x="140" y="163">directs the fix</text>
      <text x="140" y="303">database, app, network</text>
      <text x="720" y="163">owns all updates</text>
      <text x="430" y="212">coordinates, decides</text>
      <text x="430" y="229">does not debug</text>
    </g>

    <rect x="330" y="300" width="200" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="324" font-size="14" font-weight="700" fill="#463365">Incident channel</text>
    <text x="430" y="343" font-size="11.5" fill="#463365">and shared document</text>

    <rect x="620" y="240" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="720" y="259" font-size="13" font-weight="700" fill="#263e5a">Status page</text>
    <text x="720" y="275" font-size="11" fill="#263e5a">customers</text>
    <rect x="620" y="300" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="720" y="319" font-size="13" font-weight="700" fill="#263e5a">Support and leadership</text>
    <text x="720" y="335" font-size="11" fill="#263e5a">internal briefings</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M244 150 326 192" marker-start="url(#irc-arrow-start)" marker-end="url(#irc-arrow)"/>
      <path d="M140 180V256" marker-start="url(#irc-arrow-start)" marker-end="url(#irc-arrow)"/>
      <path d="M534 192 616 150" marker-start="url(#irc-arrow-start)" marker-end="url(#irc-arrow)"/>
      <path d="M430 166V88" marker-end="url(#irc-arrow)"/>
      <path d="M720 176V238" marker-end="url(#irc-arrow)"/>
      <path d="M820 148H842V322H822" stroke-linejoin="round" marker-end="url(#irc-arrow)"/>
    </g>
    <path d="M430 242V298" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#irc-arrow-start)" marker-end="url(#irc-arrow)"/>

    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="284" y="206">tasks, status</text>
      <text x="576" y="206">facts, ETA</text>
      <text x="438" y="130" text-anchor="start">decisions</text>
      <text x="438" y="276" text-anchor="start">every update</text>
      <text x="728" y="213" text-anchor="start">every 30 min</text>
    </g>

    <text x="430" y="390" font-size="13" fill="#40566b">One person coordinates, one person talks to the outside, the rest fix; the channel holds the record.</text>
  </g>
</svg>
