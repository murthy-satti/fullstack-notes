<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="eel-title eel-desc">
  <title id="eel-title">The lifecycle of an error event, from throw to alert</title>
  <desc id="eel-desc">Step 1: an error is thrown in TaskFlow Web inside the minified bundle main.3f9a.js at line 1, column 4821. Step 2: the error tracking SDK captures the stack trace, breadcrumbs, release, environment, a pseudonymous user id, and the trace id. Step 3: a beforeSend hook scrubs emails and tokens, drops known noise, and samples if needed. Step 4: the tracker ingests the event, applying rate limits, quotas, and server-side scrubbing. Step 5: it symbolicates the stack with the private source map uploaded for that release, turning it into TaskList.tsx line 42. Step 6: it fingerprints the event, groups it into a new or existing issue, and counts affected users. Step 7: alert rules fire on a new issue in production, a regression, or a spike in error rate. Step 8: the team assigns and fixes it and resolves it in release 1.42.1; if it happens again it reopens as a regression. CI uploads source maps for each release to the tracker and deletes them from the deployed files. Passwords, tokens, full email addresses, and card data must never be sent.</desc>
  <defs>
    <marker id="eel-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="180" height="84" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="241" y="40" width="180" height="84" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="458" y="40" width="180" height="84" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="675" y="40" width="180" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="675" y="184" width="180" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="458" y="184" width="180" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="241" y="184" width="180" height="84" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="24" y="184" width="180" height="84" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>

    <g font-size="13" font-weight="700">
      <text x="114" y="62" fill="#66400f">1. Error thrown</text>
      <text x="331" y="62" fill="#463365">2. SDK captures</text>
      <text x="548" y="62" fill="#463365">3. beforeSend hook</text>
      <text x="765" y="62" fill="#263e5a">4. Ingest</text>
      <text x="765" y="206" fill="#263e5a">5. Symbolicate</text>
      <text x="548" y="206" fill="#263e5a">6. Fingerprint</text>
      <text x="331" y="206" fill="#463365">7. Alert rule</text>
      <text x="114" y="206" fill="#66400f">8. Team fixes it</text>
    </g>
    <g font-size="11">
      <g fill="#66400f">
        <text x="114" y="82">TaskFlow Web</text>
        <text x="114" y="98">minified main.3f9a.js</text>
        <text x="114" y="114">line 1, column 4821</text>
        <text x="114" y="226">assign, link a ticket</text>
        <text x="114" y="242">resolved in 1.42.1</text>
        <text x="114" y="258">regression reopens it</text>
      </g>
      <g fill="#463365">
        <text x="331" y="82">stack trace, breadcrumbs</text>
        <text x="331" y="98">release, environment</text>
        <text x="331" y="114">user id, trace id</text>
        <text x="548" y="82">scrub emails, tokens</text>
        <text x="548" y="98">drop known noise</text>
        <text x="548" y="114">sample if needed</text>
        <text x="331" y="226">new issue in production,</text>
        <text x="331" y="242">regression, or a spike</text>
        <text x="331" y="258">in the error rate</text>
      </g>
      <g fill="#263e5a">
        <text x="765" y="82">rate limits, quotas</text>
        <text x="765" y="98">server-side scrubbing</text>
        <text x="765" y="114">store the event</text>
        <text x="765" y="226">private source map</text>
        <text x="765" y="242">gives TaskList.tsx:42</text>
        <text x="765" y="258">readable stack trace</text>
        <text x="548" y="226">group into an issue</text>
        <text x="548" y="242">new or existing?</text>
        <text x="548" y="258">count users affected</text>
      </g>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 82H239" marker-end="url(#eel-arrow)"/>
      <path d="M421 82H456" marker-end="url(#eel-arrow)"/>
      <path d="M638 82H673" marker-end="url(#eel-arrow)"/>
      <path d="M765 124V182" marker-end="url(#eel-arrow)"/>
      <path d="M675 226H640" marker-end="url(#eel-arrow)"/>
      <path d="M458 226H423" marker-end="url(#eel-arrow)"/>
      <path d="M241 226H206" marker-end="url(#eel-arrow)"/>
    </g>

    <rect x="436" y="310" width="420" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="646" y="334" font-size="11.5" fill="#463365">CI uploads each release's source maps, then deletes them</text>
    <path d="M765 310V270" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#eel-arrow)"/>

    <rect x="24" y="310" width="392" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="220" y="334" font-size="11.5" fill="#6e2a24">Never send: passwords, tokens, full emails, card data</text>

    <text x="440" y="400" font-size="13" fill="#40566b">Thousands of identical throws become one issue with a readable stack, a release, and an owner.</text>
  </g>
</svg>
