<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="ocp-title ocp-desc">
  <title id="ocp-title">An OpenTelemetry Collector traces pipeline</title>
  <desc id="ocp-desc">TaskFlow API, the notifications service, and the queue worker each run the OpenTelemetry SDK and send spans over OTLP to a Collector running as a gateway. The otlp receiver listens on gRPC port 4317 and HTTP port 4318. Spans then pass through four processors in order: memory_limiter, attributes/scrub, tail_sampling, and batch. Two exporters send the result: otlp/tempo to Tempo or Jaeger, and otlp/vendor to an optional vendor APM as a second copy. The tail sampling policy keeps all error traces, all traces slower than one second, and 10 percent of the rest.</desc>
  <defs>
    <marker id="ocp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="24" y="100" width="160" height="48" rx="8"/>
      <rect x="24" y="160" width="160" height="48" rx="8"/>
      <rect x="24" y="220" width="160" height="48" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="104" y="120">TaskFlow API</text>
      <text x="104" y="180">Notifications</text>
      <text x="104" y="240">Queue worker</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="104" y="137">OTel SDK</text>
      <text x="104" y="197">OTel SDK</text>
      <text x="104" y="257">OTel SDK</text>
    </g>

    <rect x="232" y="56" width="424" height="234" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="444" y="78" font-size="14" font-weight="700" fill="#463365">OpenTelemetry Collector (gateway)</text>
    <g font-size="11.5" font-weight="700" fill="#463365">
      <text x="303" y="96">receivers</text>
      <text x="442" y="96">processors</text>
      <text x="583" y="96">exporters</text>
    </g>

    <g fill="#f5f7fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="248" y="104" width="110" height="166" rx="8"/>
      <rect x="372" y="104" width="140" height="34" rx="8"/>
      <rect x="372" y="148" width="140" height="34" rx="8"/>
      <rect x="372" y="192" width="140" height="34" rx="8"/>
      <rect x="372" y="236" width="140" height="34" rx="8"/>
      <rect x="526" y="192" width="114" height="34" rx="8"/>
      <rect x="526" y="236" width="114" height="34" rx="8"/>
    </g>
    <text x="303" y="170" font-size="13" font-weight="700" fill="#463365">otlp</text>
    <g font-size="11.5" fill="#463365">
      <text x="303" y="190">gRPC :4317</text>
      <text x="303" y="207">HTTP :4318</text>
      <text x="442" y="125">memory_limiter</text>
      <text x="442" y="169">attributes/scrub</text>
      <text x="442" y="213">tail_sampling</text>
      <text x="442" y="257">batch</text>
      <text x="583" y="213">otlp/vendor</text>
      <text x="583" y="257">otlp/tempo</text>
    </g>

    <rect x="700" y="184" width="156" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="778" y="200" font-size="13" font-weight="700" fill="#263e5a">Vendor APM</text>
    <text x="778" y="216" font-size="11" fill="#263e5a">optional second copy</text>
    <rect x="700" y="236" width="156" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="778" y="252" font-size="13" font-weight="700" fill="#263e5a">Tempo or Jaeger</text>
    <text x="778" y="268" font-size="11" fill="#263e5a">trace storage and UI</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M184 124H246" marker-end="url(#ocp-arrow)"/>
      <path d="M184 184H246" marker-end="url(#ocp-arrow)"/>
      <path d="M184 244H246" marker-end="url(#ocp-arrow)"/>
      <path d="M358 121H370" marker-end="url(#ocp-arrow)"/>
      <path d="M442 138V146" marker-end="url(#ocp-arrow)"/>
      <path d="M442 182V190" marker-end="url(#ocp-arrow)"/>
      <path d="M442 226V234" marker-end="url(#ocp-arrow)"/>
      <path d="M512 253H524" marker-end="url(#ocp-arrow)"/>
      <path d="M512 244 524 216" marker-end="url(#ocp-arrow)"/>
      <path d="M640 209H698" marker-end="url(#ocp-arrow)"/>
      <path d="M640 253H698" marker-end="url(#ocp-arrow)"/>
    </g>
    <text x="208" y="116" font-size="11" font-style="italic" fill="#40566b">OTLP</text>

    <text x="444" y="318" font-size="12" fill="#36424e">tail_sampling keeps every error trace, every trace slower than 1 s, and 10% of the rest</text>
    <text x="440" y="358" font-size="13" fill="#40566b">Apps send everything to one Collector; it protects, cleans, samples, and fans out the data.</text>
  </g>
</svg>
