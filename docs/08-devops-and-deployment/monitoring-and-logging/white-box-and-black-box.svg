<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="wbb-title wbb-desc">
  <title id="wbb-title">Black-box probes from outside compared with white-box telemetry from inside</title>
  <desc id="wbb-desc">On the left, black-box probes in three regions (us-east, eu-west, and ap-south) send real HTTPS requests through the public edge, which includes DNS, TLS, the CDN, and the load balancer, to TaskFlow API. They see exactly what users see: symptoms happening now, including failures outside the application such as an expired certificate or a DNS error. On the right, the API itself emits white-box telemetry: request metrics, structured logs, and spans, which flow to Prometheus, Loki, and Tempo. White-box signals show internals: causes and early warnings such as a filling connection pool.</desc>
  <defs>
    <marker id="wbb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="24" y="52" width="150" height="44" rx="8"/>
      <rect x="24" y="116" width="150" height="44" rx="8"/>
      <rect x="24" y="180" width="150" height="44" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#463365">
      <text x="99" y="79">Probe: us-east</text>
      <text x="99" y="143">Probe: eu-west</text>
      <text x="99" y="207">Probe: ap-south</text>
    </g>

    <rect x="250" y="96" width="170" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="335" y="124" font-size="14" font-weight="700" fill="#263e5a">Public edge</text>
    <text x="335" y="144" font-size="11.5" fill="#263e5a">DNS, TLS, CDN,</text>
    <text x="335" y="161" font-size="11.5" fill="#263e5a">load balancer</text>

    <rect x="496" y="40" width="180" height="196" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="586" y="66" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="516" y="82" width="140" height="36" rx="8"/>
      <rect x="516" y="130" width="140" height="36" rx="8"/>
      <rect x="516" y="178" width="140" height="36" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="586" y="104">request metrics</text>
      <text x="586" y="152">structured logs</text>
      <text x="586" y="200">spans</text>
    </g>

    <rect x="716" y="100" width="120" height="76" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="776" y="126" font-size="14" font-weight="700" fill="#263e5a">Stores</text>
    <text x="776" y="146" font-size="11.5" fill="#263e5a">Prometheus,</text>
    <text x="776" y="163" font-size="11.5" fill="#263e5a">Loki, Tempo</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 74 248 112" marker-end="url(#wbb-arrow)"/>
      <path d="M174 138H248" marker-end="url(#wbb-arrow)"/>
      <path d="M174 202 248 164" marker-end="url(#wbb-arrow)"/>
      <path d="M420 138H494" marker-end="url(#wbb-arrow)"/>
      <path d="M656 100 714 120" marker-end="url(#wbb-arrow)"/>
      <path d="M656 148H714" marker-end="url(#wbb-arrow)"/>
      <path d="M656 196 714 162" marker-end="url(#wbb-arrow)"/>
    </g>
    <text x="457" y="130" font-size="11" font-style="italic" fill="#40566b">HTTPS</text>

    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M24 262H420" stroke="#bd7a20"/>
      <path d="M496 262H836" stroke="#4774aa"/>
    </g>
    <text x="222" y="286" font-size="13" font-weight="700" fill="#66400f">Black-box: what users see</text>
    <text x="222" y="304" font-size="11.5" fill="#36424e">symptoms now, even outside your code</text>
    <text x="666" y="286" font-size="13" font-weight="700" fill="#263e5a">White-box: what the code sees</text>
    <text x="666" y="304" font-size="11.5" fill="#36424e">causes and early warnings</text>

    <text x="430" y="342" font-size="13" fill="#40566b">Black-box checks confirm user impact; white-box signals explain it.</text>
  </g>
</svg>
