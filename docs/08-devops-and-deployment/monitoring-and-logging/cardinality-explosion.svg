<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="cex-title cex-desc">
  <title id="cex-title">How one unbounded label explodes the number of time series</title>
  <desc id="cex-desc">With bounded labels, the request duration histogram has 5 method values times 40 route templates times 10 status codes times 14 series per histogram label set times 10 instances, which is 280,000 active series. The 14 series are 11 bucket boundaries, the +Inf bucket, _sum, and _count. Adding one unbounded label, user_id with 50,000 users, multiplies 280,000 by 50,000 and produces 14,000,000,000 series, which exhausts memory. The fix is to keep user IDs, request IDs, and raw paths in logs and spans, and to label metrics only with small, fixed sets such as route templates.</desc>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="40" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Bounded labels: http_request_duration_seconds</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="24" y="56" width="104" height="56" rx="8"/>
      <rect x="154" y="56" width="104" height="56" rx="8"/>
      <rect x="284" y="56" width="104" height="56" rx="8"/>
      <rect x="414" y="56" width="104" height="56" rx="8"/>
      <rect x="544" y="56" width="104" height="56" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="76" y="80">method</text>
      <text x="206" y="80">route</text>
      <text x="336" y="80">status_code</text>
      <text x="466" y="80">histogram</text>
      <text x="596" y="80">instance</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="76" y="99">5 values</text>
      <text x="206" y="99">40 templates</text>
      <text x="336" y="99">10 values</text>
      <text x="466" y="99">14 series</text>
      <text x="596" y="99">10 pods</text>
    </g>
    <g font-size="16" font-weight="700" fill="#40566b">
      <text x="141" y="90">×</text>
      <text x="271" y="90">×</text>
      <text x="401" y="90">×</text>
      <text x="531" y="90">×</text>
      <text x="661" y="90">=</text>
    </g>
    <rect x="674" y="56" width="162" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="755" y="80" font-size="14" font-weight="700" fill="#263e5a">280,000</text>
    <text x="755" y="99" font-size="11.5" fill="#263e5a">active series</text>
    <text x="24" y="136" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">14 = 11 bucket boundaries + the +Inf bucket + _sum + _count (prom-client default buckets)</text>

    <path d="M24 158H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="186" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Add one unbounded label</text>

    <rect x="24" y="202" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="109" y="226" font-size="14" font-weight="700" fill="#263e5a">280,000</text>
    <text x="109" y="245" font-size="11.5" fill="#263e5a">series from above</text>
    <text x="207" y="236" font-size="16" font-weight="700" fill="#40566b">×</text>
    <rect x="220" y="202" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="305" y="226" font-size="14" font-weight="700" fill="#463365">user_id</text>
    <text x="305" y="245" font-size="11.5" fill="#463365">50,000 users</text>
    <text x="403" y="236" font-size="16" font-weight="700" fill="#40566b">=</text>
    <rect x="416" y="202" width="260" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="546" y="226" font-size="14" font-weight="700" fill="#6e2a24">14,000,000,000</text>
    <text x="546" y="245" font-size="11.5" fill="#6e2a24">series: memory exhausted</text>

    <rect x="24" y="282" width="812" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="430" y="308" font-size="12" font-weight="700" fill="#294a2e">Fix: keep user IDs, request IDs, and raw paths in logs and spans;</text>
    <text x="430" y="328" font-size="12" fill="#294a2e">label metrics only with small, fixed sets such as method, route template, and status code.</text>

    <text x="430" y="380" font-size="13" fill="#40566b">Series count is the product of label value counts; one unbounded label multiplies everything.</text>
  </g>
</svg>
