<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="gsg-title gsg-desc">
  <title id="gsg-title">The four golden signals measured around TaskFlow API</title>
  <desc id="gsg-desc">Clients send requests to TaskFlow API, which sends queries to MongoDB through a connection pool. Four signal cards surround the API. Latency: how long requests take, with successful and failed requests measured separately, read as the p99 from the duration histogram. Traffic: how much demand arrives, as requests per second per route, read as rate of http_requests_total over 5 minutes. Errors: how many requests fail, counting 5xx responses, wrong answers, and responses slower than a policy limit, read as the ratio of 5xx to all requests. Saturation: how full the service is, starting with the most constrained resource, read as event loop lag and MongoDB pool connections in use. Latency, traffic, and errors match the RED method for services; saturation needs USE-style resource metrics.</desc>
  <defs>
    <marker id="gsg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="150" y="30" width="260" height="100" rx="8"/>
      <rect x="450" y="30" width="260" height="100" rx="8"/>
      <rect x="150" y="290" width="260" height="100" rx="8"/>
      <rect x="450" y="290" width="260" height="100" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365">
      <text x="280" y="54">Latency</text>
      <text x="580" y="54">Traffic</text>
      <text x="280" y="314">Errors</text>
      <text x="580" y="314">Saturation</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="280" y="76">How long requests take</text>
      <text x="280" y="94">successes and failures apart</text>
      <text x="580" y="76">How much demand arrives</text>
      <text x="580" y="94">requests per second per route</text>
      <text x="280" y="336">How many requests fail</text>
      <text x="280" y="354">5xx, wrong answers, or too slow</text>
      <text x="580" y="336">How full the service is</text>
      <text x="580" y="354">most constrained resource first</text>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="280" y="116">p99 from the duration histogram</text>
      <text x="580" y="116">rate(http_requests_total[5m])</text>
      <text x="280" y="376">5xx ratio of all requests</text>
      <text x="580" y="376">event loop lag, DB pool in use</text>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M380 130V170"/>
      <path d="M480 130V170"/>
      <path d="M380 250V290"/>
      <path d="M480 250V290"/>
    </g>

    <rect x="24" y="180" width="120" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="84" y="206" font-size="14" font-weight="700" fill="#66400f">Clients</text>
    <text x="84" y="224" font-size="11.5" fill="#66400f">web, mobile</text>
    <rect x="330" y="170" width="200" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="206" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="430" y="226" font-size="11.5" fill="#66400f">Express on Node.js</text>
    <rect x="716" y="180" width="120" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="776" y="206" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="776" y="224" font-size="11.5" fill="#263e5a">pool of 10</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M144 210H328" marker-end="url(#gsg-arrow)"/>
      <path d="M530 210H714" marker-end="url(#gsg-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="236" y="202">requests</text>
      <text x="622" y="202">queries</text>
    </g>

    <text x="430" y="422" font-size="13" fill="#40566b">Latency, traffic, and errors are RED for the service; saturation needs USE-style resource metrics.</text>
  </g>
</svg>
