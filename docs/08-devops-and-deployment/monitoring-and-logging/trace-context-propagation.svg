<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="tcp-title tcp-desc">
  <title id="tcp-title">The W3C traceparent header and how it propagates context</title>
  <desc id="tcp-desc">Top: the header traceparent 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01 split into four dash-separated fields: version 00; trace-id, 16 bytes as 32 hex characters, the same for every span in the trace; parent-id, 8 bytes as 16 hex characters, the span ID of the caller's span; and trace-flags, where 01 means sampled. Bottom: TaskFlow API has server span a1, client span b2, and producer span d4. It injects traceparent with trace 4bf9 and parent b2 into its HTTP call to the auth service, which extracts it and starts span c3 with parent b2 in the same trace. It also writes traceparent with parent d4 into the queue message headers; the worker extracts it and starts consumer span e5 with parent d4 in trace 4bf9.</desc>
  <defs>
    <marker id="tcp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">traceparent header, field by field</text>

    <g stroke-width="2">
      <rect x="110" y="44" width="60" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="190" y="44" width="290" height="34" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="500" y="44" width="170" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="690" y="44" width="60" height="34" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-family="Courier New, monospace" font-size="13" font-weight="700">
      <text x="140" y="66" fill="#36424e">00</text>
      <text x="335" y="66" fill="#263e5a">4bf92f3577b34da6a3ce929d0e0e4736</text>
      <text x="585" y="66" fill="#66400f">00f067aa0ba902b7</text>
      <text x="720" y="66" fill="#294a2e">01</text>
      <text x="180" y="66" fill="#40566b">-</text>
      <text x="490" y="66" fill="#40566b">-</text>
      <text x="680" y="66" fill="#40566b">-</text>
    </g>
    <g font-size="11.5">
      <text x="140" y="98" font-weight="700" fill="#36424e">version</text>
      <text x="140" y="114" fill="#36424e">always 00</text>
      <text x="335" y="98" font-weight="700" fill="#263e5a">trace-id (16 bytes)</text>
      <text x="335" y="114" fill="#263e5a">same for every span in the trace</text>
      <text x="585" y="98" font-weight="700" fill="#66400f">parent-id (8 bytes)</text>
      <text x="585" y="114" fill="#66400f">the caller's span ID</text>
      <text x="720" y="98" font-weight="700" fill="#294a2e">trace-flags</text>
      <text x="720" y="114" fill="#294a2e">01 = sampled</text>
    </g>

    <path d="M24 136H836" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="75" y="152" width="150" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="177" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <rect x="355" y="152" width="150" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="177" font-size="14" font-weight="700" fill="#66400f">Auth service</text>
    <rect x="635" y="152" width="150" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="710" y="177" font-size="14" font-weight="700" fill="#463365">Queue worker</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M150 192V420"/>
      <path d="M430 192V420"/>
      <path d="M710 192V420"/>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="60" y="204" width="180" height="62" rx="8"/>
      <rect x="340" y="294" width="180" height="40" rx="8"/>
      <rect x="620" y="374" width="180" height="42" rx="8"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="150" y="222">server span a1</text>
      <text x="150" y="239">client span b2 (child)</text>
      <text x="150" y="256">producer span d4 (child)</text>
      <text x="430" y="310">extract, start span c3</text>
      <text x="430" y="326">parent b2, trace 4bf9</text>
      <text x="710" y="391">consumer span e5</text>
      <text x="710" y="408">parent d4, trace 4bf9</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 286H428" marker-end="url(#tcp-arrow)"/>
      <path d="M150 360H708" marker-end="url(#tcp-arrow)"/>
    </g>
    <rect x="158" y="267" width="264" height="14" fill="#f5f7fb"/>
    <text x="290" y="278" font-size="11.5" fill="#36424e">HTTP: traceparent 00-4bf9...-b2...-01</text>
    <rect x="260" y="341" width="340" height="14" fill="#f5f7fb"/>
    <text x="430" y="352" font-size="11.5" fill="#36424e">message header: traceparent 00-4bf9...-d4...-01</text>

    <text x="430" y="452" font-size="13" fill="#40566b">Inject on the way out, extract on the way in: the trace ID stays, the parent ID changes per hop.</text>
  </g>
</svg>
