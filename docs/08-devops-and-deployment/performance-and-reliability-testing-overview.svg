<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="prt-title prt-desc">
  <title id="prt-title">Load shapes over time for six kinds of performance test</title>
  <desc id="prt-desc">Six small charts plot load, in requests per second or virtual users, against time, and each has a dashed line at the expected production load. Smoke test: a tiny plateau far below the expected load for a minute or two, answering whether the script and the system work at all. Average-load test: a ramp up to the expected load, a long plateau on it for 5 to 60 minutes, and a ramp down, answering whether the system meets its SLO at the normal peak. Stress test: a ramp to the expected load, then a second ramp to a plateau well above it, then a ramp down, answering how the system copes above peak. Spike test: a plateau at the expected load, a sudden jump to several times that level for a short time, a sudden drop back, and a ramp down, answering whether the system survives a sudden surge. Soak test: a quick ramp to the expected load held for hours, answering whether the system degrades over time. Breakpoint test: one steady ramp from zero upward until the system breaks, marked with a red cross labelled limit found, answering where exactly it breaks.</desc>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b">Load (requests per second or VUs) over time, by test type</text>
    <path d="M620 28H656" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="664" y="32" font-size="12" fill="#36424e">expected production load</text>

    <!-- Smoke -->
    <rect x="24" y="52" width="264" height="190" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="38" y="76" font-size="14" font-weight="700" fill="#294a2e">Smoke test</text>
    <text x="38" y="94" font-size="11.5" fill="#294a2e">minimal load, 1-2 minutes</text>
    <path d="M44 108V202H268" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M44 170H268" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M44 202 62 194H240L258 202" fill="none" stroke="#53845b" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="38" y="228" font-size="11.5" fill="#36424e">Does the script work at all?</text>

    <!-- Average load -->
    <rect x="308" y="52" width="264" height="190" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="322" y="76" font-size="14" font-weight="700" fill="#263e5a">Average-load test</text>
    <text x="322" y="94" font-size="11.5" fill="#263e5a">normal peak traffic, 5-60 minutes</text>
    <path d="M328 108V202H552" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M328 170H552" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M328 202 378 170H508L542 202" fill="none" stroke="#4774aa" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="322" y="228" font-size="11.5" fill="#36424e">Does it meet the SLO at peak?</text>

    <!-- Stress -->
    <rect x="592" y="52" width="264" height="190" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="606" y="76" font-size="14" font-weight="700" fill="#66400f">Stress test</text>
    <text x="606" y="94" font-size="11.5" fill="#66400f">above expected load, 5-60 minutes</text>
    <path d="M612 108V202H836" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M612 170H836" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M612 202 646 170H686L716 144H792L826 202" fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="606" y="228" font-size="11.5" fill="#36424e">How does it cope above peak?</text>

    <!-- Spike -->
    <rect x="24" y="258" width="264" height="190" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="38" y="282" font-size="14" font-weight="700" fill="#6e2a24">Spike test</text>
    <text x="38" y="300" font-size="11.5" fill="#6e2a24">sudden surge, a few minutes</text>
    <path d="M44 314V408H268" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M44 376H268" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M44 408 74 376H126L136 320H154L164 376H224L258 408" fill="none" stroke="#b5524b" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="38" y="434" font-size="11.5" fill="#36424e">Does it survive a sudden surge?</text>

    <!-- Soak -->
    <rect x="308" y="258" width="264" height="190" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="322" y="282" font-size="14" font-weight="700" fill="#463365">Soak test</text>
    <text x="322" y="300" font-size="11.5" fill="#463365">normal load for hours</text>
    <path d="M328 314V408H552" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M328 376H552" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M328 408 342 376H536L550 408" fill="none" stroke="#8062a8" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="322" y="434" font-size="11.5" fill="#36424e">Does it degrade over hours?</text>

    <!-- Breakpoint -->
    <rect x="592" y="258" width="264" height="190" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="606" y="282" font-size="14" font-weight="700" fill="#36424e">Breakpoint test</text>
    <text x="606" y="300" font-size="11.5" fill="#36424e">ramp until something breaks</text>
    <path d="M612 314V408H836" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M612 376H836" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M612 408 784 324" fill="none" stroke="#40566b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M778 318 790 330M778 330 790 318" fill="none" stroke="#b5524b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="772" y="318" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="end">limit found</text>
    <text x="606" y="434" font-size="11.5" fill="#36424e">Where exactly does it break?</text>

    <text x="440" y="482" font-size="13" fill="#40566b" text-anchor="middle">One script, six load shapes: each test type answers a different question about the system.</text>
  </g>
</svg>
