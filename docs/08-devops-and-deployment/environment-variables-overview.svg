<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="evo-title evo-desc">
  <title id="evo-title">Configuration sources feeding the process environment and a validated config module</title>
  <desc id="evo-desc">Four sources set environment variables for the TaskFlow API process: shell and CI variables, a .env file in local development loaded by Node, dotenv, Vite, or Bun, the process manager or orchestrator such as systemd, PM2, or Kubernetes, and a secret store such as Vault or AWS Secrets Manager whose values are injected at deploy or start time. All of them end up in one flat map of string keys and string values, process.env, for example PORT, APP_ENV, LOG_LEVEL, and MONGODB_URI. A config module reads that map once at startup, parses and validates it, and exits if anything is missing or wrong. The application code then uses only the typed, frozen configuration object.</desc>
  <defs>
    <marker id="evo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Sources</text>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="20" y="44" width="240" height="52" rx="8"/>
      <rect x="20" y="108" width="240" height="52" rx="8"/>
      <rect x="20" y="172" width="240" height="52" rx="8"/>
    </g>
    <rect x="20" y="236" width="240" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="13" font-weight="700" fill="#463365">
      <text x="140" y="65">Shell and CI variables</text>
      <text x="140" y="129">.env file (development)</text>
      <text x="140" y="193">Process manager, orchestrator</text>
    </g>
    <text x="140" y="257" font-size="13" font-weight="700" fill="#263e5a">Secret store</text>
    <g font-size="11.5" fill="#463365">
      <text x="140" y="84">export PORT=3000, CI secrets</text>
      <text x="140" y="148">loaded by Node, dotenv, Vite, Bun</text>
      <text x="140" y="212">systemd, PM2, Kubernetes</text>
    </g>
    <text x="140" y="276" font-size="11.5" fill="#263e5a">Vault, AWS Secrets Manager</text>

    <rect x="330" y="96" width="200" height="150" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="120" font-size="14" font-weight="700" fill="#263e5a">process.env</text>
    <g font-size="11.5" fill="#263e5a" text-anchor="start">
      <text x="346" y="146">PORT = "3000"</text>
      <text x="346" y="166">APP_ENV = "production"</text>
      <text x="346" y="186">LOG_LEVEL = "info"</text>
      <text x="346" y="206">MONGODB_URI = "&lt;secret&gt;"</text>
    </g>
    <text x="430" y="234" font-size="11" font-style="italic" fill="#263e5a">every value is a string</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M260 70 328 128" marker-end="url(#evo-arrow)"/>
      <path d="M260 134 328 156" marker-end="url(#evo-arrow)"/>
      <path d="M260 198 328 186" marker-end="url(#evo-arrow)"/>
      <path d="M260 262 328 214" marker-end="url(#evo-arrow)"/>
      <path d="M530 140H598" marker-end="url(#evo-arrow)"/>
      <path d="M720 170V206" marker-end="url(#evo-arrow)"/>
    </g>

    <rect x="600" y="110" width="240" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="720" y="134" font-size="14" font-weight="700" fill="#463365">Config module</text>
    <text x="720" y="153" font-size="11.5" fill="#463365">parse, validate, fail fast</text>
    <rect x="600" y="208" width="240" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="720" y="232" font-size="14" font-weight="700" fill="#66400f">TaskFlow API code</text>
    <text x="720" y="251" font-size="11.5" fill="#66400f">uses typed, frozen config only</text>
    <rect x="606" y="276" width="228" height="22" rx="11" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="720" y="291" font-size="11.5" fill="#6e2a24">invalid config: the app never starts</text>

    <text x="430" y="336" font-size="13" fill="#40566b">Many sources feed one flat map of strings; one module turns it into validated, typed configuration.</text>
  </g>
</svg>
