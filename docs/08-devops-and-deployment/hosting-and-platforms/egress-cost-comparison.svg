<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="egc-title egc-desc">
  <title id="egc-title">Monthly cost of storing 10 TB and serving 50 TB of downloads</title>
  <desc id="egc-desc">A horizontal stacked bar chart, one bar per option, each split into storage and delivery, using US list prices from November 2026. S3 served directly to the internet: about $4,643, of which $236 is storage. S3 plus CloudFront pay-as-you-go: about $4,297, $236 storage. DigitalOcean Spaces with its included CDN: about $707, $205 storage and base fee. Wasabi plus bunny.net CDN: about $592, $80 storage. Backblaze B2 plus bunny.net CDN: about $582, $70 storage. S3 plus a CloudFront Business flat-rate plan: about $436, $236 storage and a $200 plan. Backblaze B2 served directly: about $274, $70 storage. Cloudflare R2: about $154, almost all storage. Storage is under $240 in every option; the spread is delivery.</desc>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="26" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">10 TB stored, 50 TB downloaded per month: monthly cost (US list prices, Nov 2026)</text>
    <rect x="300" y="38" width="14" height="14" rx="3" fill="#4774aa"/>
    <text x="320" y="50" font-size="12" fill="#36424e">storage</text>
    <rect x="390" y="38" width="14" height="14" rx="3" fill="#bd7a20"/>
    <text x="410" y="50" font-size="12" fill="#36424e">delivery (egress, CDN, plan, requests)</text>

    <g stroke="#c9d1db" stroke-width="1" stroke-dasharray="3 4">
      <path d="M400 64V380M500 64V380M600 64V380M700 64V380"/>
    </g>
    <path d="M300 64V380" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="300" y="396">$0</text>
      <text x="400" y="396">$1,000</text>
      <text x="500" y="396">$2,000</text>
      <text x="600" y="396">$3,000</text>
      <text x="700" y="396">$4,000</text>
    </g>

    <g font-size="12.5" fill="#36424e" text-anchor="end">
      <text x="290" y="87">S3 direct to the internet</text>
      <text x="290" y="127">S3 + CloudFront pay-as-you-go</text>
      <text x="290" y="167">DigitalOcean Spaces (CDN included)</text>
      <text x="290" y="207">Wasabi + bunny.net CDN</text>
      <text x="290" y="247">Backblaze B2 + bunny.net CDN</text>
      <text x="290" y="287">S3 + CloudFront Business flat-rate</text>
      <text x="290" y="327">Backblaze B2 direct</text>
      <text x="290" y="367">Cloudflare R2</text>
    </g>

    <g fill="#4774aa">
      <rect x="300" y="70" width="23.6" height="24"/>
      <rect x="300" y="110" width="23.6" height="24"/>
      <rect x="300" y="150" width="20.5" height="24"/>
      <rect x="300" y="190" width="8" height="24"/>
      <rect x="300" y="230" width="7" height="24"/>
      <rect x="300" y="270" width="23.6" height="24"/>
      <rect x="300" y="310" width="7" height="24"/>
      <rect x="300" y="350" width="15.3" height="24"/>
    </g>
    <g fill="#bd7a20">
      <rect x="323.6" y="70" width="440.7" height="24"/>
      <rect x="323.6" y="110" width="406.1" height="24"/>
      <rect x="320.5" y="150" width="50.2" height="24"/>
      <rect x="308" y="190" width="51.2" height="24"/>
      <rect x="307" y="230" width="51.2" height="24"/>
      <rect x="323.6" y="270" width="20" height="24"/>
      <rect x="307" y="310" width="20.5" height="24"/>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="772" y="87">$4,643</text>
      <text x="738" y="127">$4,297</text>
      <text x="379" y="167">$707</text>
      <text x="367" y="207">$592</text>
      <text x="366" y="247">$582</text>
      <text x="352" y="287">$436</text>
      <text x="336" y="327">$274</text>
      <text x="324" y="367">$154</text>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="430" y="167">$5 base + $199.80 storage + $501.76 transfer</text>
      <text x="430" y="207">egress from Wasabi stays under stored data</text>
      <text x="430" y="247">B2 to partner CDN egress is free</text>
      <text x="430" y="287">plan $200 + storage $235.52, if the terms fit</text>
      <text x="430" y="327">30 TB free (3x stored), 20 TB at $0.01/GB</text>
      <text x="430" y="367">no egress fee; storage $153.45 + reads $0.36</text>
    </g>

    <text x="430" y="424" font-size="13" fill="#40566b" text-anchor="middle">Storage is under $240 in every option; the spread from $154 to $4,643 is delivery.</text>
  </g>
</svg>
