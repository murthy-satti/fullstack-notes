<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-labelledby="btd-title btd-desc">
  <title id="btd-title">Choosing a storage tier for a backup copy</title>
  <desc id="btd-desc">A decision flow that starts with the question where should this backup copy live. First: must it restore within minutes? Yes leads to a warm millisecond tier: S3 Standard-IA, Glacier Instant Retrieval, Azure Cool, Google Nearline, or Backblaze B2. No leads to: is it a compliance copy read less than once a year? Yes leads to an archive tier with object lock: Glacier Deep Archive, Azure Archive, or Google Archive. No leads to: will restores leave the cloud? Yes leads to an egress-inclusive provider: Backblaze B2, or Wasabi within its egress policy. No leads to: is the data deleted or rewritten within 90 days? Yes leads to a tier without long minimums: S3 Standard, Backblaze B2, or R2 Standard. No leads to a cold tier: Glacier Flexible Retrieval, Google Coldline, or Azure Cold. A banner at the bottom says that in every case the copy should be locked with object lock or immutability and kept in a separate account.</desc>
  <defs>
    <marker id="btd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="14" width="320" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="37" font-size="13.5" font-weight="700" fill="#66400f">Where should this backup copy live?</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M100 110 250 70 400 110 250 150z"/>
      <path d="M100 210 250 170 400 210 250 250z"/>
      <path d="M100 310 250 270 400 310 250 350z"/>
      <path d="M100 410 250 370 400 410 250 450z"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="250" y="107">Must it restore</text>
      <text x="250" y="124">within minutes?</text>
      <text x="250" y="207">Compliance copy, read</text>
      <text x="250" y="224">under once a year?</text>
      <text x="250" y="307">Will restores leave</text>
      <text x="250" y="324">the cloud?</text>
      <text x="250" y="407">Deleted or rewritten</text>
      <text x="250" y="424">within 90 days?</text>
    </g>

    <g stroke-width="2">
      <rect x="480" y="82" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="182" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="282" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="382" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="70" y="480" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="13.5" font-weight="700" fill="#263e5a">
      <text x="660" y="105">Warm, millisecond tier</text>
      <text x="660" y="205">Archive tier with object lock</text>
      <text x="660" y="305">Egress-inclusive provider</text>
      <text x="660" y="405">Tier without long minimums</text>
      <text x="250" y="503">Cold tier</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="660" y="125">S3 Standard-IA, Glacier IR, Cool, Nearline, B2</text>
      <text x="660" y="225">Deep Archive, Azure Archive, Google Archive</text>
      <text x="660" y="325">Backblaze B2, or Wasabi within its policy</text>
      <text x="660" y="425">S3 Standard, Backblaze B2, or R2 Standard</text>
      <text x="250" y="523">Glacier Flexible Retrieval, Coldline, Azure Cold</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M250 50V68" marker-end="url(#btd-arrow)"/>
      <path d="M400 110H478" marker-end="url(#btd-arrow)"/>
      <path d="M250 150V168" marker-end="url(#btd-arrow)"/>
      <path d="M400 210H478" marker-end="url(#btd-arrow)"/>
      <path d="M250 250V268" marker-end="url(#btd-arrow)"/>
      <path d="M400 310H478" marker-end="url(#btd-arrow)"/>
      <path d="M250 350V368" marker-end="url(#btd-arrow)"/>
      <path d="M400 410H478" marker-end="url(#btd-arrow)"/>
      <path d="M250 450V478" marker-end="url(#btd-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#294a2e">
      <text x="439" y="103">yes</text>
      <text x="439" y="203">yes</text>
      <text x="439" y="303">yes</text>
      <text x="439" y="403">yes</text>
    </g>
    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="258" y="164">no</text>
      <text x="258" y="264">no</text>
      <text x="258" y="364">no</text>
      <text x="258" y="468">no</text>
    </g>

    <rect x="70" y="556" width="770" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="455" y="578" font-size="12.5" font-weight="700" fill="#294a2e">In every case: lock the copy (Object Lock or immutability) and keep it in a separate account.</text>

    <text x="430" y="622" font-size="13" fill="#40566b">Match each copy's tier to its restore time first, then to its price.</text>
  </g>
</svg>
