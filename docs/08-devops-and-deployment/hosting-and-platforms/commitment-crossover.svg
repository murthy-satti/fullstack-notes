<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="cmc-title cmc-desc">
  <title id="cmc-title">Savings Plan break-even for one m7g.large</title>
  <desc id="cmc-desc">Line chart of the monthly cost of one m7g.large Linux instance in us-east-1 against the hours it is used in a month, from 0 to 730 hours, at November 2026 list prices. On-Demand at $0.0816 per hour rises in a straight line from $0 to $59.57 at 730 hours. A 1-year Compute Savings Plan at $0.0599 per hour is a flat $43.73 whatever the usage, and crosses the On-Demand line at 536 hours, 73 percent of the month. A 3-year Compute Savings Plan at $0.0414 per hour is a flat $30.22 and crosses at 370 hours, 51 percent. Below the break-even point the commitment costs more than On-Demand; above it, it saves money.</desc>
  <rect width="820" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="420" y="30" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">One m7g.large, us-east-1: On-Demand vs Compute Savings Plans (Nov 2026)</text>

    <g stroke="#c9d1db" stroke-width="1">
      <path d="M100 320H740M100 270H740M100 220H740M100 170H740M100 120H740M100 70H740"/>
    </g>
    <path d="M100 70V370H740" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11" fill="#40566b" text-anchor="end">
      <text x="92" y="374">$0</text>
      <text x="92" y="324">$10</text>
      <text x="92" y="274">$20</text>
      <text x="92" y="224">$30</text>
      <text x="92" y="174">$40</text>
      <text x="92" y="124">$50</text>
      <text x="92" y="74">$60</text>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="100" y="388">0</text>
      <text x="187.7" y="388">100</text>
      <text x="275.3" y="388">200</text>
      <text x="363" y="388">300</text>
      <text x="450.7" y="388">400</text>
      <text x="538.4" y="388">500</text>
      <text x="626" y="388">600</text>
      <text x="713.7" y="388">700</text>
    </g>
    <text x="420" y="410" font-size="12" fill="#36424e" text-anchor="middle">hours used in the month (730 = always on)</text>
    <text x="40" y="220" font-size="12" fill="#36424e" text-anchor="middle" transform="rotate(-90 40 220)">monthly cost for one m7g.large (USD)</text>

    <path d="M100 151.35H740" fill="none" stroke="#8062a8" stroke-width="3"/>
    <path d="M100 218.9H740" fill="none" stroke="#53845b" stroke-width="3"/>
    <path d="M100 370L740 72.15" fill="none" stroke="#b5524b" stroke-width="3"/>

    <g fill="none" stroke="#40566b" stroke-width="1.5" stroke-dasharray="3 3">
      <path d="M569.9 151.35V370"/>
      <path d="M424.4 218.9V370"/>
    </g>
    <circle cx="569.9" cy="151.35" r="5" fill="#ffffff" stroke="#40566b" stroke-width="2"/>
    <circle cx="424.4" cy="218.9" r="5" fill="#ffffff" stroke="#40566b" stroke-width="2"/>
    <rect x="530" y="340" width="80" height="18" fill="#f5f7fb"/>
    <text x="570" y="353" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="middle">536 h (73%)</text>
    <rect x="384" y="340" width="80" height="18" fill="#f5f7fb"/>
    <text x="424" y="353" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="middle">370 h (51%)</text>

    <g font-size="11.5" font-weight="700" text-anchor="end">
      <text x="728" y="62" fill="#6e2a24">On-Demand: $59.57 at 730 h</text>
      <text x="732" y="172" fill="#463365">1-year Compute SP: $43.73</text>
      <text x="732" y="240" fill="#294a2e">3-year Compute SP: $30.22</text>
    </g>
    <text x="112" y="192" font-size="11.5" fill="#40566b">below break-even, the commitment costs more</text>

    <text x="420" y="440" font-size="13" fill="#40566b" text-anchor="middle">Commit only to usage that runs above break-even: 73% of the month for 1 year, 51% for 3 years.</text>
  </g>
</svg>
