<svg xmlns="http://www.w3.org/2000/svg" width="860" height="650" viewBox="0 0 860 650" role="img" aria-labelledby="mdd-title mdd-desc">
  <title id="mdd-title">Decision tree for choosing a database service</title>
  <desc id="mdd-desc">Question 1: is the data relational, with joins, constraints, and reporting? If yes, use managed PostgreSQL on RDS, Cloud SQL, Neon, or Supabase, and Aurora at larger scale. If no, question 2: does the app already use MongoDB? If yes, use MongoDB Atlas, moving from Free and Flex to Dedicated M10 and above. If no, question 3: is access by known keys at huge or spiky scale? If yes, use DynamoDB, Cosmos DB, or Firestore with per-request billing, designing the keys first. If no, question 4: is it a web or mobile app that needs realtime sync and built-in auth? If yes, use Firestore or Supabase. If no, question 5: is the load steady, with database skills on the team and cost pressure? If yes, self-host on VMs with replication and tested restores. If no, the default is a small managed PostgreSQL instance, adding high availability before production traffic. A note: caches and sessions belong in managed Redis or Valkey such as ElastiCache, Upstash, or Redis Cloud, never as the only copy of data.</desc>
  <defs>
    <marker id="mdd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="650" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">Which database service? Choose the data model first.</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <path d="M230 50 400 90 230 130 60 90z"/>
      <path d="M230 146 400 186 230 226 60 186z"/>
      <path d="M230 242 400 282 230 322 60 282z"/>
      <path d="M230 338 400 378 230 418 60 378z"/>
      <path d="M230 434 400 474 230 514 60 474z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f" text-anchor="middle">
      <text x="230" y="86">Relational: joins,</text>
      <text x="230" y="101">constraints, reporting?</text>
      <text x="230" y="182">App already uses</text>
      <text x="230" y="197">MongoDB?</text>
      <text x="230" y="278">Key-based access at</text>
      <text x="230" y="293">huge or spiky scale?</text>
      <text x="230" y="374">Web or mobile app needing</text>
      <text x="230" y="389">realtime sync and auth?</text>
      <text x="230" y="470">Steady load, database skills,</text>
      <text x="230" y="485">and cost pressure?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M400 90H466" marker-end="url(#mdd-arrow)"/>
      <path d="M400 186H466" marker-end="url(#mdd-arrow)"/>
      <path d="M400 282H466" marker-end="url(#mdd-arrow)"/>
      <path d="M400 378H466" marker-end="url(#mdd-arrow)"/>
      <path d="M400 474H466" marker-end="url(#mdd-arrow)"/>
      <path d="M230 130V144" marker-end="url(#mdd-arrow)"/>
      <path d="M230 226V240" marker-end="url(#mdd-arrow)"/>
      <path d="M230 322V336" marker-end="url(#mdd-arrow)"/>
      <path d="M230 418V432" marker-end="url(#mdd-arrow)"/>
      <path d="M230 514V542" marker-end="url(#mdd-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="424" y="84">yes</text>
      <text x="424" y="180">yes</text>
      <text x="424" y="276">yes</text>
      <text x="424" y="372">yes</text>
      <text x="424" y="468">yes</text>
      <text x="240" y="141">no</text>
      <text x="240" y="237">no</text>
      <text x="240" y="333">no</text>
      <text x="240" y="429">no</text>
      <text x="240" y="532">no</text>
    </g>

    <g stroke-width="2" fill="#e5efff" stroke="#4774aa">
      <rect x="470" y="66" width="366" height="48" rx="8"/>
      <rect x="470" y="162" width="366" height="48" rx="8"/>
      <rect x="470" y="258" width="366" height="48" rx="8"/>
      <rect x="470" y="354" width="366" height="48" rx="8"/>
      <rect x="470" y="450" width="366" height="48" rx="8"/>
    </g>
    <rect x="60" y="544" width="340" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="13" font-weight="700" fill="#263e5a">
      <text x="484" y="86">Managed PostgreSQL</text>
      <text x="484" y="182">MongoDB Atlas</text>
      <text x="484" y="278">DynamoDB, Cosmos DB, Firestore</text>
      <text x="484" y="374">Firestore or Supabase</text>
      <text x="484" y="470">Self-host on VMs</text>
      <text x="230" y="564" fill="#294a2e" text-anchor="middle">Default: small managed PostgreSQL</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="484" y="103">RDS, Cloud SQL, Neon, Supabase; Aurora at scale</text>
      <text x="484" y="199">Free and Flex, then Dedicated (M10 and up)</text>
      <text x="484" y="295">per-request billing; design the keys first</text>
      <text x="484" y="391">client SDKs, realtime updates, built-in auth</text>
      <text x="484" y="487">with replication and tested restores</text>
      <text x="230" y="581" fill="#294a2e" text-anchor="middle">add HA before production traffic</text>
    </g>

    <rect x="470" y="530" width="366" height="62" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="484" y="551" font-size="13" font-weight="700" fill="#463365">Caches and sessions?</text>
    <g font-size="11.5" fill="#463365">
      <text x="484" y="568">Managed Redis or Valkey (ElastiCache, Upstash,</text>
      <text x="484" y="583">Redis Cloud), never the only copy of data.</text>
    </g>

    <text x="430" y="628" font-size="13" fill="#40566b" text-anchor="middle">The data model narrows the list; the traffic shape picks the billing model within it.</text>
  </g>
</svg>
