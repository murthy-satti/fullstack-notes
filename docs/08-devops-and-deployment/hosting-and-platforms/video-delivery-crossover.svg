<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="vdc-title vdc-desc">
  <title id="vdc-title">Per-GB versus per-minute video delivery cost</title>
  <desc id="vdc-desc">Line chart of delivery cost per 1,000 minutes watched, in US dollars, against the average bitrate watched, from 0.5 to 8 Mbps, at November 2026 US list prices. CloudFront pay-as-you-go at $0.085 per GB is a straight line rising from about $0.32 at 0.5 Mbps to $5.10 at 8 Mbps. Cloudflare Stream and Mux at the 1080p tier are flat at $1.00 per 1,000 minutes whatever the bitrate. bunny.net CDN at $0.01 per GB rises slowly from about $0.04 to $0.60. The CloudFront line crosses the $1.00 line at about 1.6 Mbps: below that bitrate CloudFront's per-GB list price is cheaper than per-minute pricing, above it per-minute pricing is cheaper, and the low per-GB CDN stays cheapest across the range.</desc>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="30" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Delivery cost per 1,000 minutes watched vs average bitrate (US list prices, Nov 2026)</text>

    <g stroke="#c9d1db" stroke-width="1">
      <path d="M100 330H780M100 280H780M100 230H780M100 180H780M100 130H780M100 80H780"/>
    </g>
    <path d="M100 80V380H780" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11" fill="#40566b" text-anchor="end">
      <text x="92" y="384">$0</text>
      <text x="92" y="334">$1</text>
      <text x="92" y="284">$2</text>
      <text x="92" y="234">$3</text>
      <text x="92" y="184">$4</text>
      <text x="92" y="134">$5</text>
      <text x="92" y="84">$6</text>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="100" y="398">0</text>
      <text x="185" y="398">1</text>
      <text x="270" y="398">2</text>
      <text x="355" y="398">3</text>
      <text x="440" y="398">4</text>
      <text x="525" y="398">5</text>
      <text x="610" y="398">6</text>
      <text x="695" y="398">7</text>
      <text x="780" y="398">8</text>
    </g>
    <text x="440" y="420" font-size="12" fill="#36424e" text-anchor="middle">average bitrate watched (Mbps)</text>
    <text x="40" y="230" font-size="12" fill="#36424e" text-anchor="middle" transform="rotate(-90 40 230)">cost per 1,000 minutes watched (USD)</text>

    <path d="M142.5 330H780" fill="none" stroke="#8062a8" stroke-width="3"/>
    <path d="M142.5 364.06L780 125" fill="none" stroke="#b5524b" stroke-width="3"/>
    <path d="M142.5 378.13L780 350" fill="none" stroke="#53845b" stroke-width="3"/>

    <path d="M233.3 330V380" fill="none" stroke="#40566b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="233.3" cy="330" r="5" fill="#ffffff" stroke="#40566b" stroke-width="2"/>
    <text x="242" y="352" font-size="11.5" font-weight="700" fill="#36424e">crossover: about 1.6 Mbps</text>
    <text x="772" y="114" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="end">$5.10 at 8 Mbps</text>
    <text x="776" y="344" font-size="11" font-weight="700" fill="#294a2e" text-anchor="end">$0.60</text>

    <rect x="120" y="92" width="420" height="78" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/>
    <path d="M134 112H164" stroke="#b5524b" stroke-width="3"/>
    <path d="M134 135H164" stroke="#8062a8" stroke-width="3"/>
    <path d="M134 158H164" stroke="#53845b" stroke-width="3"/>
    <g font-size="11.5" fill="#36424e">
      <text x="172" y="116">CloudFront pay-as-you-go: $0.085 per GB</text>
      <text x="172" y="139">Cloudflare Stream and Mux 1080p: $1.00 per 1,000 min</text>
      <text x="172" y="162">bunny.net CDN: $0.01 per GB</text>
    </g>

    <text x="440" y="452" font-size="13" fill="#40566b" text-anchor="middle">Per-minute pricing beats CloudFront's list rate above about 1.6 Mbps; low per-GB CDNs stay cheapest.</text>
  </g>
</svg>
