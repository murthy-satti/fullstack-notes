<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="mha-title mha-desc">
  <title id="mha-title">A managed PostgreSQL deployment with a standby, a read replica, and point-in-time recovery</title>
  <desc id="mha-desc">Three Availability Zones, A, B, and C. TaskFlow API instances in zones A and B connect through a pooler to the writer endpoint, a DNS name that points at the primary in zone A, which handles reads and writes. The primary replicates synchronously to a standby in zone B that takes no traffic; on failover the service promotes the standby and the writer endpoint moves to it. The primary also replicates asynchronously to a read replica in zone C, reached through a separate reader endpoint, for reads that can tolerate lag. The primary continuously sends automated snapshots and transaction logs to object storage, which allows point-in-time recovery: restoring a new instance to any second within the retention window.</desc>
  <defs>
    <marker id="mha-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="mha-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="mha-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g fill="none" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="6 4">
      <rect x="24" y="40" width="266" height="290" rx="10"/>
      <rect x="300" y="40" width="266" height="290" rx="10"/>
      <rect x="576" y="40" width="260" height="290" rx="10"/>
    </g>
    <g font-size="12" font-weight="700" fill="#8a96a3">
      <text x="36" y="60">Availability Zone A</text>
      <text x="312" y="60">Availability Zone B</text>
      <text x="588" y="60">Availability Zone C</text>
    </g>

    <g stroke-width="2">
      <rect x="60" y="72" width="190" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="336" y="72" width="190" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="60" y="138" width="466" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="612" y="138" width="190" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="60" y="200" width="190" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="336" y="200" width="190" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-dasharray="6 4"/>
      <rect x="612" y="200" width="190" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="160" y="352" width="540" height="52" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="155" y="97" fill="#66400f">TaskFlow API</text>
      <text x="431" y="97" fill="#66400f">TaskFlow API</text>
      <text x="293" y="160" fill="#463365">Writer endpoint (DNS name), through a pooler</text>
      <text x="707" y="160" fill="#463365">Reader endpoint</text>
      <text x="155" y="223" fill="#263e5a">Primary</text>
      <text x="431" y="223" fill="#263e5a">Standby</text>
      <text x="707" y="223" fill="#263e5a">Read replica</text>
      <text x="430" y="374" fill="#294a2e">Snapshots + transaction logs in object storage</text>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="155" y="242" fill="#263e5a">reads and writes</text>
      <text x="431" y="242" fill="#263e5a">no traffic until failover</text>
      <text x="707" y="242" fill="#263e5a">may lag (asynchronous)</text>
      <text x="430" y="393" fill="#294a2e">PITR: restore a new instance to any second in the window</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M155 112V136" marker-end="url(#mha-arrow)"/>
      <path d="M431 112V136" marker-end="url(#mha-arrow)"/>
      <path d="M155 172V198" marker-end="url(#mha-arrow)"/>
      <path d="M250 222H334" marker-end="url(#mha-arrow)"/>
      <path d="M707 172V198" marker-end="url(#mha-arrow)"/>
      <path d="M100 256V378H158" marker-end="url(#mha-arrow)"/>
    </g>
    <path d="M431 172V198" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#mha-arrow-red)"/>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M200 256V292H707V258" marker-end="url(#mha-arrow-ret)"/>
      <path d="M526 92H707V136" marker-end="url(#mha-arrow-ret)"/>
    </g>

    <rect x="262" y="204" width="62" height="14" fill="#f5f7fb"/>
    <text x="293" y="215" font-size="11" font-weight="700" fill="#36424e" text-anchor="middle">sync</text>
    <text x="440" y="190" font-size="11" font-weight="700" fill="#6e2a24">on failover</text>
    <rect x="360" y="285" width="150" height="14" fill="#f5f7fb"/>
    <text x="435" y="296" font-size="11" fill="#36424e" text-anchor="middle">asynchronous replication</text>
    <text x="544" y="86" font-size="11" fill="#36424e">reads that can lag</text>
    <text x="110" y="320" font-size="11" fill="#36424e">continuous backups</text>

    <text x="430" y="440" font-size="13" fill="#40566b" text-anchor="middle">The standby protects availability, the replica scales reads, and PITR protects against mistakes.</text>
  </g>
</svg>
