<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="scl-title scl-desc">
  <title id="scl-title">The Amazon S3 storage class ladder</title>
  <desc id="scl-desc">Eight S3 storage classes from hottest to coldest, with us-east-1 prices from November 2026. S3 Express One Zone: $0.11 per GB-month, no minimum duration, $0.0006 per GB retrieved, single-digit millisecond first byte. S3 Standard: $0.023, no minimum, no retrieval fee, milliseconds. S3 Intelligent-Tiering: $0.023 down to $0.004 depending on the tier S3 chooses, no minimum, no retrieval fee, milliseconds. S3 Standard-IA: $0.0125, 30 days and 128 KB minimum, $0.01 per GB, milliseconds. S3 One Zone-IA: $0.01, 30 days and 128 KB minimum, $0.01 per GB, milliseconds. Glacier Instant Retrieval: $0.004, 90 days and 128 KB minimum, $0.03 per GB, milliseconds. Glacier Flexible Retrieval: $0.0036, 90 days minimum, free to $0.03 per GB, minutes to 12 hours. Glacier Deep Archive: $0.00099, 180 days minimum, $0.0025 to $0.02 per GB, 12 to 48 hours. An arrow down the left says storage gets cheaper; an arrow down the right says reads get slower and dearer.</desc>
  <defs>
    <marker id="scl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="scl-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e">S3 storage classes, us-east-1 list prices (November 2026)</text>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="60" y="58" text-anchor="start">Storage class</text>
      <text x="365" y="58">$ per GB-month</text>
      <text x="480" y="58">Minimum</text>
      <text x="600" y="58">Retrieval per GB</text>
      <text x="735" y="58">First byte</text>
    </g>

    <g stroke-width="2">
      <rect x="60" y="70" width="230" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="60" y="114" width="230" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="158" width="230" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="60" y="202" width="230" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="246" width="230" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="290" width="230" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="334" width="230" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="60" y="378" width="230" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12.5" font-weight="700" text-anchor="start">
      <text x="74" y="93" fill="#463365">S3 Express One Zone</text>
      <text x="74" y="137" fill="#263e5a">S3 Standard</text>
      <text x="74" y="181" fill="#294a2e">S3 Intelligent-Tiering</text>
      <text x="74" y="225" fill="#263e5a">S3 Standard-IA</text>
      <text x="74" y="269" fill="#263e5a">S3 One Zone-IA</text>
      <text x="74" y="313" fill="#263e5a">Glacier Instant Retrieval</text>
      <text x="74" y="357" fill="#263e5a">Glacier Flexible Retrieval</text>
      <text x="74" y="401" fill="#263e5a">Glacier Deep Archive</text>
    </g>

    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="365" y="93">$0.11</text>
      <text x="365" y="137">$0.023</text>
      <text x="365" y="181">$0.023 to $0.004</text>
      <text x="365" y="225">$0.0125</text>
      <text x="365" y="269">$0.01</text>
      <text x="365" y="313">$0.004</text>
      <text x="365" y="357">$0.0036</text>
      <text x="365" y="401">$0.00099</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="480" y="93">none</text>
      <text x="480" y="137">none</text>
      <text x="480" y="181">none</text>
      <text x="480" y="225">30 days, 128 KB</text>
      <text x="480" y="269">30 days, 128 KB</text>
      <text x="480" y="313">90 days, 128 KB</text>
      <text x="480" y="357">90 days</text>
      <text x="480" y="401">180 days</text>

      <text x="600" y="93">$0.0006</text>
      <text x="600" y="137">none</text>
      <text x="600" y="181">none</text>
      <text x="600" y="225">$0.01</text>
      <text x="600" y="269">$0.01</text>
      <text x="600" y="313">$0.03</text>
      <text x="600" y="357">free to $0.03</text>
      <text x="600" y="401">$0.0025 to $0.02</text>

      <text x="735" y="93">single-digit ms</text>
      <text x="735" y="137">milliseconds</text>
      <text x="735" y="181">milliseconds</text>
      <text x="735" y="225">milliseconds</text>
      <text x="735" y="269">milliseconds</text>
      <text x="735" y="313">milliseconds</text>
      <text x="735" y="357">minutes to 12 hours</text>
      <text x="735" y="401">12 to 48 hours</text>
    </g>
    <g stroke="#c9d1db" stroke-width="1">
      <path d="M300 110H800M300 154H800M300 198H800M300 242H800M300 286H800M300 330H800M300 374H800"/>
    </g>

    <path d="M38 74V408" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#scl-arrow)"/>
    <text x="26" y="242" font-size="11.5" fill="#40566b" transform="rotate(-90 26 242)">storage gets cheaper</text>
    <path d="M822 74V408" fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round" marker-end="url(#scl-arrow-red)"/>
    <text x="846" y="242" font-size="11.5" fill="#6e2a24" transform="rotate(-90 846 242)">reads get slower and dearer</text>

    <text x="430" y="452" font-size="13" fill="#40566b">Each step down stores data more cheaply but adds minimums, retrieval fees, and slower reads.</text>
  </g>
</svg>
