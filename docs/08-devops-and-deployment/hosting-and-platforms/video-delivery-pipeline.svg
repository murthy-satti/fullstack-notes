<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="vdp-title vdp-desc">
  <title id="vdp-title">The video delivery pipeline</title>
  <desc id="vdp-desc">Top row, once per video: step 1, the creator uploads a source file with a resumable upload; step 2, a transcoder produces an adaptive bitrate ladder of four renditions, 1080p, 720p, 480p, and 360p; step 3, a packager cuts each rendition into 4-second segments and writes HLS and DASH playlists; step 4, the segments and playlists are stored in an origin bucket. Bottom row, on every view: step 5, a CDN edge near the viewer fetches segments from the origin on a cache miss and serves them; step 6, the player (hls.js, Shaka Player, or Safari) downloads segments with HTTP GET requests and switches renditions as bandwidth changes; access control checks signed URLs or tokens and a DRM licence server issues licences to the player. Caption: steps 1 to 4 run once per video; delivery and playback run on every view, so they dominate the bill.</desc>
  <defs>
    <marker id="vdp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="vdp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="55" y="56" font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">Once per video</text>
    <text x="55" y="202" font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">On every view</text>
    <path d="M24 176H856" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="55" y="68" width="170" height="78" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="255" y="68" width="170" height="78" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="455" y="68" width="170" height="78" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="655" y="68" width="170" height="78" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="140" y="92" fill="#66400f">1. Upload</text>
      <text x="340" y="92" fill="#463365">2. Transcode</text>
      <text x="540" y="92" fill="#463365">3. Package</text>
      <text x="740" y="92" fill="#263e5a">4. Store</text>
    </g>
    <g font-size="11.5">
      <text x="140" y="112" fill="#66400f">source file</text>
      <text x="140" y="128" fill="#66400f">resumable upload</text>
      <text x="340" y="112" fill="#463365">ABR ladder: 1080p,</text>
      <text x="340" y="128" fill="#463365">720p, 480p, 360p</text>
      <text x="540" y="112" fill="#463365">4-second segments,</text>
      <text x="540" y="128" fill="#463365">HLS + DASH playlists</text>
      <text x="740" y="112" fill="#263e5a">origin bucket:</text>
      <text x="740" y="128" fill="#263e5a">segments + playlists</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M225 107H253" marker-end="url(#vdp-arrow)"/>
      <path d="M425 107H453" marker-end="url(#vdp-arrow)"/>
      <path d="M625 107H653" marker-end="url(#vdp-arrow)"/>
      <path d="M740 146V212" marker-end="url(#vdp-arrow)"/>
    </g>
    <rect x="750" y="170" width="98" height="14" fill="#f5f7fb"/>
    <text x="799" y="181" font-size="11" fill="#36424e">fetch on miss</text>

    <rect x="55" y="214" width="170" height="78" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="355" y="214" width="170" height="78" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="655" y="214" width="170" height="78" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="140" y="238" fill="#294a2e">Access control</text>
      <text x="440" y="238" fill="#66400f">6. Play</text>
      <text x="740" y="238" fill="#463365">5. Deliver</text>
    </g>
    <g font-size="11.5">
      <text x="140" y="258" fill="#294a2e">signed URLs or tokens,</text>
      <text x="140" y="274" fill="#294a2e">DRM licence server</text>
      <text x="440" y="258" fill="#66400f">hls.js, Shaka, Safari;</text>
      <text x="440" y="274" fill="#66400f">switches renditions</text>
      <text x="740" y="258" fill="#463365">CDN edge cache</text>
      <text x="740" y="274" fill="#463365">near the viewer</text>
    </g>
    <path d="M655 253H527" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#vdp-arrow)"/>
    <rect x="533" y="230" width="116" height="16" fill="#f5f7fb"/>
    <text x="591" y="242" font-size="11" fill="#36424e">HTTP GET segments</text>
    <path d="M355 253H227" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#vdp-arrow-ret)"/>
    <rect x="236" y="230" width="110" height="16" fill="#f5f7fb"/>
    <text x="291" y="242" font-size="11" fill="#36424e">token or licence</text>

    <text x="440" y="330" font-size="13" fill="#40566b">Steps 1 to 4 run once per video; delivery and playback run on every view, so they dominate the bill.</text>
  </g>
</svg>
