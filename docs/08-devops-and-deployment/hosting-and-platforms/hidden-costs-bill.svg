<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="hcb-title hcb-desc">
  <title id="hcb-title">The compute price you expected compared with the monthly bill you get</title>
  <desc id="hcb-desc">Two horizontal bars for TaskFlow API on ECS Fargate in two Availability Zones, US East list prices. The first bar, what you priced, shows only two Fargate tasks at $36.04 per month. The second bar, what you pay, stacks the same $36.04 of Fargate, then NAT gateways at $70.20 for two gateways running 730 hours plus 100 GB processed, the Application Load Balancer at $22.27 including about one LCU, CloudWatch Logs at $15.90 for 30 GB ingested and stored, public IPv4 addresses at $14.60 for four addresses, and data transfer at $8.50 made of $4.00 cross-zone traffic and $4.50 internet egress after the free 100 GB, for $167.51 in total. Compute is about 22 percent of the bill. Cheaper layouts: S3 and DynamoDB gateway endpoints carry that traffic with no charge, a single NAT gateway saves $32.85 at the cost of a zone dependency, and logging only errors and sampled requests removes most of the log cost.</desc>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">TaskFlow API on ECS Fargate, two zones: the price you expected and the bill you get</text>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="24" y="77">What you priced</text>
      <text x="24" y="127">What you pay</text>
    </g>
    <rect x="170" y="58" width="126" height="28" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="233" y="77" font-size="11" font-weight="700" fill="#263e5a" text-anchor="middle">Fargate</text>
    <text x="306" y="77" font-size="12" font-weight="700" fill="#263e5a">$36.04</text>

    <g stroke-width="1.5">
      <rect x="170" y="108" width="126" height="28" fill="#e5efff" stroke="#4774aa"/>
      <rect x="296" y="108" width="246" height="28" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="542" y="108" width="78" height="28" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="620" y="108" width="56" height="28" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="676" y="108" width="51" height="28" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="727" y="108" width="30" height="28" fill="#dde3ea" stroke="#60788d"/>
    </g>
    <g font-size="11" font-weight="700" text-anchor="middle">
      <text x="233" y="127" fill="#263e5a">Fargate</text>
      <text x="419" y="127" fill="#6e2a24">NAT gateways</text>
      <text x="581" y="127" fill="#463365">ALB</text>
      <text x="648" y="127" fill="#66400f">Logs</text>
      <text x="701" y="127" fill="#36424e">IPv4</text>
    </g>
    <text x="764" y="127" font-size="12" font-weight="700" fill="#6e2a24">$167.51</text>

    <path d="M24 160H836" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="12" fill="#36424e">
      <rect x="24" y="178" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="46" y="190">Fargate: 2 tasks, 0.5 vCPU and 1 GB each, 730 h</text>
      <text x="400" y="190" text-anchor="end" font-weight="700">$36.04</text>

      <rect x="24" y="204" width="14" height="14" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
      <text x="46" y="216">NAT gateways: 2 x 730 h + 100 GB processed</text>
      <text x="400" y="216" text-anchor="end" font-weight="700">$70.20</text>

      <rect x="24" y="230" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="46" y="242">Load balancer: 730 h + about 1 LCU</text>
      <text x="400" y="242" text-anchor="end" font-weight="700">$22.27</text>

      <rect x="24" y="256" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="46" y="268">CloudWatch Logs: 30 GB in, 30 GB stored</text>
      <text x="400" y="268" text-anchor="end" font-weight="700">$15.90</text>

      <rect x="24" y="282" width="14" height="14" rx="3" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="46" y="294">Public IPv4: 4 addresses x $3.65</text>
      <text x="400" y="294" text-anchor="end" font-weight="700">$14.60</text>

      <rect x="24" y="308" width="14" height="14" rx="3" fill="#dde3ea" stroke="#60788d" stroke-width="1.5"/>
      <text x="46" y="320">Data: cross-zone $4.00 + internet $4.50</text>
      <text x="400" y="320" text-anchor="end" font-weight="700">$8.50</text>
    </g>

    <rect x="440" y="176" width="396" height="150" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="456" y="198" font-size="13" font-weight="700" fill="#294a2e">Cheaper layouts (trade-offs apply)</text>
    <g font-size="11.5" fill="#294a2e">
      <text x="456" y="222">S3 and DynamoDB gateway endpoints:</text>
      <text x="456" y="238">that traffic skips the NAT, no charge</text>
      <text x="456" y="262">One NAT gateway instead of two: -$32.85,</text>
      <text x="456" y="278">but one zone's outage cuts egress</text>
      <text x="456" y="302">Log errors and sampled requests only:</text>
      <text x="456" y="318">removes most of the $15.90</text>
    </g>

    <rect x="24" y="346" width="812" height="40" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/>
    <text x="40" y="371" font-size="12" fill="#36424e">US East list prices, November 2026. Fargate $0.04048/vCPU-h + $0.004445/GB-h; NAT $0.045/h + $0.045/GB; IPv4 $0.005/h.</text>

    <text x="430" y="414" font-size="13" fill="#40566b" text-anchor="middle">Compute was about 22% of the bill; networking, logging, and addresses made up the rest.</text>
  </g>
</svg>
