<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="dfo-title dfo-desc">
  <title id="dfo-title">From a wall between dev and ops to one shared loop</title>
  <desc id="dfo-desc">Left, before DevOps: a development team whose goal is to ship features and an operations team whose goal is to keep the system stable are separated by a wall. Releases are thrown over the wall every few weeks, and tickets and blame come back days later, so releases are large, feedback is slow, and the two teams have conflicting goals. Right, with DevOps: one team owns the service and takes each small change around a loop many times a day: plan, code, build and test, release, operate, observe, and back to plan. A shared self-service platform with pipelines, infrastructure as code and telemetry supports the loop.</desc>
  <defs>
    <marker id="dfo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="dfo-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="215" y="34" font-size="14" font-weight="700" fill="#6e2a24">Before: a wall between dev and ops</text>
    <text x="655" y="34" font-size="14" font-weight="700" fill="#294a2e">With DevOps: one team, one shared loop</text>
    <path d="M436 20V352" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="30" y="110" width="160" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="136" font-size="14" font-weight="700" fill="#66400f">Development</text>
    <text x="110" y="156" font-size="11.5" fill="#66400f">goal: ship features</text>
    <rect x="240" y="110" width="160" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="320" y="136" font-size="14" font-weight="700" fill="#263e5a">Operations</text>
    <text x="320" y="156" font-size="11.5" fill="#263e5a">goal: keep it stable</text>
    <rect x="205" y="88" width="20" height="112" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>

    <path d="M150 110C170 50 280 50 300 108" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#dfo-arrow)"/>
    <text x="225" y="56" font-size="11.5" fill="#36424e">release thrown over the wall</text>
    <path d="M320 174V214H110V178" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dfo-arrow-ret)"/>
    <text x="215" y="234" font-size="11.5" font-style="italic" fill="#36424e">tickets and blame, days later</text>

    <rect x="40" y="256" width="350" height="62" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="215" y="280" font-size="12" font-weight="700" fill="#6e2a24">big releases every few weeks</text>
    <text x="215" y="300" font-size="12" fill="#6e2a24">slow feedback, two goals in conflict</text>

    <text x="655" y="54" font-size="11.5" fill="#36424e">small changes go around the loop many times a day</text>

    <rect x="589" y="66" width="132" height="32" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="655" y="87" font-size="12.5" font-weight="700" fill="#66400f">Plan</text>
    <rect x="729" y="108" width="132" height="32" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="795" y="129" font-size="12.5" font-weight="700" fill="#66400f">Code</text>
    <rect x="729" y="196" width="132" height="32" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="795" y="217" font-size="12.5" font-weight="700" fill="#463365">Build and test</text>
    <rect x="589" y="238" width="132" height="32" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="655" y="259" font-size="12.5" font-weight="700" fill="#263e5a">Release</text>
    <rect x="449" y="196" width="132" height="32" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="515" y="217" font-size="12.5" font-weight="700" fill="#263e5a">Operate</text>
    <rect x="449" y="108" width="132" height="32" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="515" y="129" font-size="12.5" font-weight="700" fill="#294a2e">Observe</text>

    <rect x="590" y="140" width="130" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="655" y="160" font-size="12.5" font-weight="700" fill="#294a2e">one team</text>
    <text x="655" y="177" font-size="11.5" fill="#294a2e">owns the service</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M721 82Q762 84 782 106" marker-end="url(#dfo-arrow)"/>
      <path d="M795 140V194" marker-end="url(#dfo-arrow)"/>
      <path d="M782 228Q762 250 723 254" marker-end="url(#dfo-arrow)"/>
      <path d="M589 254Q548 250 528 230" marker-end="url(#dfo-arrow)"/>
      <path d="M515 196V142" marker-end="url(#dfo-arrow)"/>
      <path d="M528 108Q548 84 587 82" marker-end="url(#dfo-arrow)"/>
    </g>

    <rect x="466" y="292" width="378" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="655" y="312" font-size="13" font-weight="700" fill="#463365">Shared self-service platform</text>
    <text x="655" y="331" font-size="11.5" fill="#463365">pipelines, infrastructure as code, telemetry</text>

    <text x="440" y="392" font-size="13" fill="#40566b">DevOps replaces a hand-off over the wall with a loop that one team runs end to end.</text>
  </g>
</svg>
