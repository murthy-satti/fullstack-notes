<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="prl-title prl-desc">
  <title id="prl-title">Pull request lifecycle with the merge gate</title>
  <desc id="prl-desc">A developer pushes a branch, opens a draft pull request for early feedback while CI already runs, then marks it ready for review, which automatically requests the code owners. GitHub Actions runs the CI checks on the pull_request event and reports status checks into the merge gate. The gate allows merging only when the required status checks pass, the required approvals including code owners are given, all conversations are resolved, and the branch is up to date or goes through the merge queue. If a check fails or a reviewer requests changes, the author pushes fixes, which re-runs CI and may dismiss stale approvals, and the pull request returns to review. When the gate passes, the pull request is squash merged into main, and main's own pipeline builds and deploys it.</desc>
  <defs>
    <marker id="prl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="prl-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="880" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="480" y="22" width="220" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="590" y="39" font-size="12.5" font-weight="700" fill="#263e5a">CI on pull_request</text>
    <text x="590" y="55" font-size="11" fill="#263e5a">lint, typecheck, test, build</text>

    <rect x="20" y="112" width="125" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="82" y="136" font-size="13" font-weight="700" fill="#66400f">Push branch</text>
    <text x="82" y="154" font-size="11" fill="#66400f">feat/due-dates</text>
    <rect x="170" y="112" width="125" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="232" y="136" font-size="13" font-weight="700" fill="#66400f">Draft PR</text>
    <text x="232" y="154" font-size="11" fill="#66400f">early feedback</text>
    <rect x="312" y="112" width="142" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="383" y="136" font-size="13" font-weight="700" fill="#66400f">Ready for review</text>
    <text x="383" y="154" font-size="11" fill="#66400f">code owners requested</text>

    <rect x="480" y="82" width="220" height="118" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="590" y="104" font-size="13" font-weight="700" fill="#463365">Merge gate</text>
    <g font-size="11.5" fill="#463365" text-anchor="start">
      <text x="494" y="126">1. required checks pass</text>
      <text x="494" y="146">2. approvals, incl. code owners</text>
      <text x="494" y="166">3. conversations resolved</text>
      <text x="494" y="186">4. up to date or merge queue</text>
    </g>

    <rect x="730" y="112" width="130" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="795" y="136" font-size="13" font-weight="700" fill="#294a2e">Merge</text>
    <text x="795" y="154" font-size="11" fill="#294a2e">squash into main</text>
    <rect x="730" y="250" width="130" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="795" y="274" font-size="13" font-weight="700" fill="#263e5a">main pipeline</text>
    <text x="795" y="292" font-size="11" fill="#263e5a">build once, deploy</text>

    <rect x="480" y="250" width="220" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="590" y="274" font-size="13" font-weight="700" fill="#6e2a24">Check failed or</text>
    <text x="590" y="292" font-size="11.5" fill="#6e2a24">changes requested</text>
    <rect x="312" y="250" width="142" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="383" y="274" font-size="13" font-weight="700" fill="#66400f">Push fixes</text>
    <text x="383" y="292" font-size="11" fill="#66400f">CI re-runs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M145 141H168" marker-end="url(#prl-arrow)"/>
      <path d="M295 141H310" marker-end="url(#prl-arrow)"/>
      <path d="M454 141H478" marker-end="url(#prl-arrow)"/>
      <path d="M590 62V80" marker-end="url(#prl-arrow)"/>
      <path d="M700 141H728" marker-end="url(#prl-arrow)"/>
      <path d="M795 170V248" marker-end="url(#prl-arrow)"/>
      <path d="M383 250V172" marker-end="url(#prl-arrow)"/>
    </g>
    <g fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round">
      <path d="M590 200V248" marker-end="url(#prl-arrow-red)"/>
      <path d="M480 279H456" marker-end="url(#prl-arrow-red)"/>
    </g>
    <text x="232" y="196" font-size="11" font-style="italic" fill="#40566b">CI already runs on drafts</text>
    <text x="373" y="222" font-size="11" font-style="italic" fill="#40566b" text-anchor="end">new push may dismiss stale approvals</text>
    <text x="803" y="214" font-size="11" font-weight="700" fill="#294a2e" text-anchor="start">on push</text>

    <text x="440" y="350" font-size="13" fill="#40566b">A pull request merges only when every required check and review passes; feedback loops back as commits.</text>
  </g>
</svg>
