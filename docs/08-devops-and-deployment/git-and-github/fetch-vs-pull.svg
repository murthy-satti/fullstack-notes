<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="gfp-title gfp-desc">
  <title id="gfp-title">What git fetch and git merge each change in your clone</title>
  <desc id="gfp-desc">Three panels. In every panel GitHub's main branch has commits A, B, C, and two new commits X and Y pushed by teammates, with main pointing at Y. Panel 1, before fetch: your clone has only A, B, and C; both main and the remote-tracking branch origin/main point at C. Panel 2, after git fetch: your clone now also stores X and Y, and origin/main moves to Y, but your branch main still points at C and your files are unchanged. Panel 3, after git merge origin/main, or after git pull which runs fetch and merge together: main fast-forwards to Y, matching origin/main, and the working tree now contains the changes from X and Y.</desc>
  <defs>
    <marker id="gfp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">

    <g transform="translate(20 0)">
      <rect x="0" y="24" width="260" height="310" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="130" y="50" font-size="13" font-weight="700" fill="#40566b">1. Before fetch</text>
      <text x="12" y="98" font-size="11.5" font-weight="700" fill="#263e5a" text-anchor="start">GitHub (origin)</text>
      <g fill="none" stroke="#40566b" stroke-width="1.5">
        <path d="M57 126H43" marker-end="url(#gfp-arrow)"/>
        <path d="M99 126H85" marker-end="url(#gfp-arrow)"/>
        <path d="M141 126H127" marker-end="url(#gfp-arrow)"/>
        <path d="M183 126H169" marker-end="url(#gfp-arrow)"/>
        <path d="M57 226H43" marker-end="url(#gfp-arrow)"/>
        <path d="M99 226H85" marker-end="url(#gfp-arrow)"/>
      </g>
      <g stroke-width="1.5">
        <circle cx="28" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="70" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="112" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="154" cy="126" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="196" cy="126" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="28" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="70" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="112" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
      </g>
      <g font-size="11" font-weight="700" fill="#263e5a">
        <text x="28" y="130">A</text><text x="70" y="130">B</text><text x="112" y="130">C</text>
        <text x="154" y="130" fill="#294a2e">X</text><text x="196" y="130" fill="#294a2e">Y</text>
        <text x="28" y="230">A</text><text x="70" y="230">B</text><text x="112" y="230">C</text>
      </g>
      <rect x="174" y="146" width="44" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="196" y="160" font-size="11" font-weight="700" fill="#66400f">main</text>
      <path d="M8 182H252" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="12" y="200" font-size="11.5" font-weight="700" fill="#66400f" text-anchor="start">Your clone</text>
      <rect x="90" y="246" width="44" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="112" y="260" font-size="11" font-weight="700" fill="#66400f">main</text>
      <rect x="67" y="270" width="90" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="112" y="284" font-size="11" font-weight="700" fill="#263e5a">origin/main</text>
      <text x="130" y="318" font-size="11" font-style="italic" fill="#36424e">your files: A to C</text>
    </g>

    <g transform="translate(300 0)">
      <rect x="0" y="24" width="260" height="310" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="130" y="50" font-size="13" font-weight="700" fill="#40566b">2. After git fetch</text>
      <text x="12" y="98" font-size="11.5" font-weight="700" fill="#263e5a" text-anchor="start">GitHub (origin)</text>
      <g fill="none" stroke="#40566b" stroke-width="1.5">
        <path d="M57 126H43" marker-end="url(#gfp-arrow)"/>
        <path d="M99 126H85" marker-end="url(#gfp-arrow)"/>
        <path d="M141 126H127" marker-end="url(#gfp-arrow)"/>
        <path d="M183 126H169" marker-end="url(#gfp-arrow)"/>
        <path d="M57 226H43" marker-end="url(#gfp-arrow)"/>
        <path d="M99 226H85" marker-end="url(#gfp-arrow)"/>
        <path d="M141 226H127" marker-end="url(#gfp-arrow)"/>
        <path d="M183 226H169" marker-end="url(#gfp-arrow)"/>
      </g>
      <g stroke-width="1.5">
        <circle cx="28" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="70" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="112" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="154" cy="126" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="196" cy="126" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="28" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="70" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="112" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="154" cy="226" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="196" cy="226" r="13" fill="#e7f3e9" stroke="#53845b"/>
      </g>
      <g font-size="11" font-weight="700" fill="#263e5a">
        <text x="28" y="130">A</text><text x="70" y="130">B</text><text x="112" y="130">C</text>
        <text x="154" y="130" fill="#294a2e">X</text><text x="196" y="130" fill="#294a2e">Y</text>
        <text x="28" y="230">A</text><text x="70" y="230">B</text><text x="112" y="230">C</text>
        <text x="154" y="230" fill="#294a2e">X</text><text x="196" y="230" fill="#294a2e">Y</text>
      </g>
      <rect x="174" y="146" width="44" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="196" y="160" font-size="11" font-weight="700" fill="#66400f">main</text>
      <path d="M8 182H252" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="12" y="200" font-size="11.5" font-weight="700" fill="#66400f" text-anchor="start">Your clone</text>
      <rect x="90" y="246" width="44" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="112" y="260" font-size="11" font-weight="700" fill="#66400f">main</text>
      <rect x="151" y="246" width="90" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="196" y="260" font-size="11" font-weight="700" fill="#263e5a">origin/main</text>
      <text x="130" y="318" font-size="11" font-style="italic" fill="#36424e">your files: unchanged</text>
    </g>

    <g transform="translate(580 0)">
      <rect x="0" y="24" width="260" height="310" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="130" y="50" font-size="13" font-weight="700" fill="#40566b">3. After merge (or pull)</text>
      <text x="12" y="98" font-size="11.5" font-weight="700" fill="#263e5a" text-anchor="start">GitHub (origin)</text>
      <g fill="none" stroke="#40566b" stroke-width="1.5">
        <path d="M57 126H43" marker-end="url(#gfp-arrow)"/>
        <path d="M99 126H85" marker-end="url(#gfp-arrow)"/>
        <path d="M141 126H127" marker-end="url(#gfp-arrow)"/>
        <path d="M183 126H169" marker-end="url(#gfp-arrow)"/>
        <path d="M57 226H43" marker-end="url(#gfp-arrow)"/>
        <path d="M99 226H85" marker-end="url(#gfp-arrow)"/>
        <path d="M141 226H127" marker-end="url(#gfp-arrow)"/>
        <path d="M183 226H169" marker-end="url(#gfp-arrow)"/>
      </g>
      <g stroke-width="1.5">
        <circle cx="28" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="70" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="112" cy="126" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="154" cy="126" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="196" cy="126" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="28" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="70" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="112" cy="226" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="154" cy="226" r="13" fill="#e7f3e9" stroke="#53845b"/>
        <circle cx="196" cy="226" r="13" fill="#e7f3e9" stroke="#53845b"/>
      </g>
      <g font-size="11" font-weight="700" fill="#263e5a">
        <text x="28" y="130">A</text><text x="70" y="130">B</text><text x="112" y="130">C</text>
        <text x="154" y="130" fill="#294a2e">X</text><text x="196" y="130" fill="#294a2e">Y</text>
        <text x="28" y="230">A</text><text x="70" y="230">B</text><text x="112" y="230">C</text>
        <text x="154" y="230" fill="#294a2e">X</text><text x="196" y="230" fill="#294a2e">Y</text>
      </g>
      <rect x="174" y="146" width="44" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="196" y="160" font-size="11" font-weight="700" fill="#66400f">main</text>
      <path d="M8 182H252" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="12" y="200" font-size="11.5" font-weight="700" fill="#66400f" text-anchor="start">Your clone</text>
      <rect x="174" y="246" width="44" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="196" y="260" font-size="11" font-weight="700" fill="#66400f">main</text>
      <rect x="151" y="270" width="90" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="196" y="284" font-size="11" font-weight="700" fill="#263e5a">origin/main</text>
      <text x="130" y="318" font-size="11" font-style="italic" fill="#36424e">your files: now include X and Y</text>
    </g>

    <text x="430" y="362" font-size="13" fill="#40566b">fetch downloads commits and moves only origin/main; merge (or pull, which does both) moves your branch.</text>
  </g>
</svg>
