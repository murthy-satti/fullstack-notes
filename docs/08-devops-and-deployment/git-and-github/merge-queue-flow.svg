<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="mqf-title mqf-desc">
  <title id="mqf-title">How a merge queue tests pull requests together before merging</title>
  <desc id="mqf-desc">Three approved pull requests, #101, #102, and #103, are added to the merge queue in that order. For each one the queue creates a temporary branch that combines the latest main with every pull request ahead of it: main plus #101, main plus #101 plus #102, and main plus #101 plus #102 plus #103. A workflow triggered by the merge_group event runs the required checks on each temporary branch in parallel. main plus #101 passes, so #101 merges and main fast-forwards. main plus #101 plus #102 fails, so #102 is removed from the queue and its author is notified. The group for #103 contained #102, so it is discarded and rebuilt as main plus #101 plus #103, which passes, and #103 merges. Required checks always run on the exact commit that will land on main.</desc>
  <defs>
    <marker id="mqf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12.5" font-weight="700" fill="#40566b">
      <text x="90" y="60">Queue (in order)</text>
      <text x="325" y="60">Temporary branch tested</text>
      <text x="535" y="60">merge_group CI</text>
      <text x="740" y="60">Outcome</text>
    </g>

    <g stroke-width="2">
      <rect x="20" y="80" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="20" y="140" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="20" y="200" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="200" y="80" width="250" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="200" y="140" width="250" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="200" y="200" width="250" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="200" y="290" width="250" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#66400f">
      <text x="90" y="105">PR #101</text>
      <text x="90" y="165">PR #102</text>
      <text x="90" y="225">PR #103</text>
    </g>
    <g font-size="12" fill="#463365">
      <text x="325" y="105">main + #101</text>
      <text x="325" y="165">main + #101 + #102</text>
      <text x="325" y="225">main + #101 + #102 + #103</text>
      <text x="325" y="315" font-weight="700">rebuilt: main + #101 + #103</text>
    </g>

    <g font-size="12" font-weight="700">
      <rect x="490" y="86" width="90" height="28" rx="14" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="535" y="105" fill="#294a2e">pass</text>
      <rect x="490" y="146" width="90" height="28" rx="14" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
      <text x="535" y="165" fill="#6e2a24">fail</text>
      <rect x="490" y="206" width="90" height="28" rx="14" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="535" y="225" fill="#36424e">discarded</text>
      <rect x="490" y="296" width="90" height="28" rx="14" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="535" y="315" fill="#294a2e">pass</text>
    </g>

    <g stroke-width="2">
      <rect x="620" y="80" width="240" height="40" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="620" y="140" width="240" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="620" y="200" width="240" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="620" y="290" width="240" height="40" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12">
      <text x="740" y="105" fill="#294a2e">#101 merged, main fast-forwards</text>
      <text x="740" y="165" fill="#6e2a24">#102 removed, author notified</text>
      <text x="740" y="225" fill="#263e5a">group contained #102: rebuild</text>
      <text x="740" y="315" fill="#294a2e">#103 merged</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 100H198" marker-end="url(#mqf-arrow)"/>
      <path d="M160 160H198" marker-end="url(#mqf-arrow)"/>
      <path d="M160 220H198" marker-end="url(#mqf-arrow)"/>
      <path d="M450 100H488" marker-end="url(#mqf-arrow)"/>
      <path d="M450 160H488" marker-end="url(#mqf-arrow)"/>
      <path d="M450 220H488" marker-end="url(#mqf-arrow)"/>
      <path d="M450 310H488" marker-end="url(#mqf-arrow)"/>
      <path d="M580 100H618" marker-end="url(#mqf-arrow)"/>
      <path d="M580 160H618" marker-end="url(#mqf-arrow)"/>
      <path d="M580 220H618" marker-end="url(#mqf-arrow)"/>
      <path d="M580 310H618" marker-end="url(#mqf-arrow)"/>
      <path d="M740 240V262H325V288" marker-end="url(#mqf-arrow)"/>
    </g>
    <text x="40" y="270" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">tested in parallel,</text>
    <text x="40" y="285" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">merged in order</text>

    <text x="440" y="368" font-size="11.5" fill="#36424e">Checks run on the exact commit that will land, so logically conflicting PRs cannot break main.</text>
    <text x="440" y="398" font-size="13" fill="#40566b">Workflows must listen for merge_group; a failing PR leaves the queue without blocking the others.</text>
  </g>
</svg>
