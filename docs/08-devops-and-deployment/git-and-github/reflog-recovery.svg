<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="rfr-title rfr-desc">
  <title id="rfr-title">Recovering commits after a mistaken reset with the reflog</title>
  <desc id="rfr-desc">Left: the output of git reflog, newest first. HEAD@{0}: reset moving to HEAD~2, at a1b2c3d. HEAD@{1}: commit add due-date validation, at 9f8e7d6. HEAD@{2}: commit add dueDate field, at 5c4b3a2. HEAD@{3}: checkout moving from main to feat/due-dates. Right, before recovery: commit B a1b2c3d is where feat/due-dates now points; commits D 5c4b3a2 and E 9f8e7d6 still exist after B but no branch points at them, so they are unreachable. Running git branch rescue 9f8e7d6, or git reset --hard HEAD@{1} on the branch, creates a ref to E again, making D and E reachable. Unreachable commits survive until garbage collection prunes them, after the reflog entries expire, which takes weeks by default.</desc>
  <defs>
    <marker id="rfr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rfr-arrow-ghost" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8a96a3"/>
    </marker>
  </defs>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="38" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">$ git reflog (newest first)</text>
    <rect x="20" y="52" width="400" height="168" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.8"/>
    <g font-family="Courier New, monospace" font-size="12" fill="#36424e" text-anchor="start">
      <text x="34" y="80"><tspan font-weight="700">a1b2c3d</tspan> HEAD@{0}: reset: moving to HEAD~2</text>
      <text x="34" y="116"><tspan font-weight="700" fill="#294a2e">9f8e7d6</tspan> HEAD@{1}: commit: add due-date</text>
      <text x="34" y="132">        validation</text>
      <text x="34" y="168"><tspan font-weight="700">5c4b3a2</tspan> HEAD@{2}: commit: add dueDate field</text>
      <text x="34" y="204"><tspan font-weight="700">a1b2c3d</tspan> HEAD@{3}: checkout: main to feat</text>
    </g>
    <rect x="24" y="98" width="392" height="44" rx="6" fill="none" stroke="#53845b" stroke-width="1.8" stroke-dasharray="5 3"/>

    <text x="640" y="38" font-size="13" font-weight="700" fill="#40566b">After the reset</text>
    <g fill="none" stroke-width="1.8">
      <path d="M532 110H498" stroke="#40566b" marker-end="url(#rfr-arrow)"/>
      <path d="M632 110H568" stroke="#8a96a3" stroke-dasharray="4 3" marker-end="url(#rfr-arrow-ghost)"/>
      <path d="M732 110H668" stroke="#8a96a3" stroke-dasharray="4 3" marker-end="url(#rfr-arrow-ghost)"/>
    </g>
    <circle cx="480" cy="110" r="16" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <circle cx="550" cy="110" r="16" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <circle cx="650" cy="110" r="16" fill="#f5f7fb" stroke="#8a96a3" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="750" cy="110" r="16" fill="#f5f7fb" stroke="#8a96a3" stroke-width="2" stroke-dasharray="4 3"/>
    <g font-size="12" font-weight="700">
      <text x="480" y="114" fill="#263e5a">A</text>
      <text x="550" y="114" fill="#263e5a">B</text>
      <text x="650" y="114" fill="#60788d">D</text>
      <text x="750" y="114" fill="#60788d">E</text>
    </g>
    <g font-size="10.5" fill="#36424e">
      <text x="550" y="144">a1b2c3d</text>
      <text x="650" y="144">5c4b3a2</text>
      <text x="750" y="144">9f8e7d6</text>
    </g>
    <rect x="500" y="56" width="100" height="22" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="550" y="71" font-size="11" font-weight="700" fill="#66400f">feat/due-dates</text>
    <path d="M550 78V92" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#rfr-arrow)"/>
    <text x="700" y="172" font-size="11" font-style="italic" fill="#60788d">D and E: no ref points here</text>
    <text x="700" y="187" font-size="11" font-style="italic" fill="#60788d">(unreachable, not deleted)</text>

    <path d="M440 236H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="640" y="262" font-size="13" font-weight="700" fill="#294a2e">Recover: git branch rescue 9f8e7d6</text>
    <g fill="none" stroke="#40566b" stroke-width="1.8">
      <path d="M532 310H498" marker-end="url(#rfr-arrow)"/>
      <path d="M632 310H568" marker-end="url(#rfr-arrow)"/>
      <path d="M732 310H668" marker-end="url(#rfr-arrow)"/>
    </g>
    <g stroke-width="2">
      <circle cx="480" cy="310" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="550" cy="310" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="650" cy="310" r="16" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="750" cy="310" r="16" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="480" y="314" fill="#263e5a">A</text>
      <text x="550" y="314" fill="#263e5a">B</text>
      <text x="650" y="314" fill="#294a2e">D</text>
      <text x="750" y="314" fill="#294a2e">E</text>
    </g>
    <rect x="720" y="336" width="60" height="22" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="750" y="351" font-size="11" font-weight="700" fill="#294a2e">rescue</text>
    <path d="M750 336V328" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#rfr-arrow)"/>
    <text x="24" y="262" font-size="11.5" fill="#36424e" text-anchor="start">Or put the branch back where it was:</text>
    <text x="24" y="282" font-size="12" font-family="Courier New, monospace" font-weight="700" fill="#36424e" text-anchor="start">git reset --hard HEAD@{1}</text>
    <text x="24" y="314" font-size="11.5" fill="#36424e" text-anchor="start">Entries expire after 90 days (30 for</text>
    <text x="24" y="330" font-size="11.5" fill="#36424e" text-anchor="start">unreachable commits) before gc prunes.</text>

    <text x="430" y="378" font-size="13" fill="#40566b">The reflog records every move of HEAD and branches, so committed work is almost never truly lost.</text>
  </g>
</svg>
