<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="grm-title grm-desc">
  <title id="grm-title">What git reset --soft, --mixed, and --hard each change</title>
  <desc id="grm-desc">Starting state: commits A, B, and C, with main and HEAD at C. Running git reset with a mode and target B always moves the branch, and HEAD with it, from C back to B. With --soft, the index and the working tree are unchanged, so C's changes appear as staged changes ready to commit again. With --mixed, the default, the index is reset to match B, so C's changes become unstaged edits in the working tree, which is unchanged. With --hard, both the index and the working tree are reset to match B, so C's changes and any uncommitted edits are discarded from the working tree. In every mode commit C itself still exists and can be restored from the reflog or ORIG_HEAD, but uncommitted edits destroyed by --hard cannot be recovered.</desc>
  <defs>
    <marker id="grm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#40566b" stroke-width="1.8">
      <path d="M302 78H268" marker-end="url(#grm-arrow)"/>
      <path d="M382 78H348" marker-end="url(#grm-arrow)"/>
    </g>
    <g stroke-width="2">
      <circle cx="250" cy="78" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="320" cy="78" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="400" cy="78" r="16" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="250" y="82">A</text><text x="320" y="82">B</text><text x="400" y="82">C</text>
    </g>
    <rect x="372" y="28" width="56" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="400" y="42" font-size="11" font-weight="700" fill="#66400f">main</text>
    <path d="M400 48V60" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#grm-arrow)"/>
    <path d="M384 108Q360 124 332 100" fill="none" stroke="#bd7a20" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#grm-arrow)"/>
    <text x="460" y="74" font-size="12" fill="#36424e" text-anchor="start">git reset --soft | --mixed | --hard B</text>
    <text x="460" y="92" font-size="11.5" font-style="italic" fill="#36424e" text-anchor="start">the branch moves from C back to B in every mode</text>

    <g font-size="12.5" font-weight="700" fill="#40566b">
      <text x="100" y="150">Mode</text>
      <text x="295" y="150">Branch and HEAD</text>
      <text x="515" y="150">Index (staging area)</text>
      <text x="735" y="150">Working tree</text>
    </g>

    <g stroke-width="1.5">
      <rect x="20" y="162" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="190" y="162" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="410" y="162" width="210" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="630" y="162" width="210" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="20" y="228" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="190" y="228" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="410" y="228" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="630" y="228" width="210" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="20" y="294" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="190" y="294" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="410" y="294" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="630" y="294" width="210" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="100" y="187">--soft</text>
      <text x="100" y="253">--mixed</text>
      <text x="100" y="319">--hard</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="100" y="205">recommit differently</text>
      <text x="100" y="271">default: unstage</text>
      <text x="100" y="337">throw work away</text>
    </g>
    <g font-size="12" fill="#463365">
      <text x="295" y="187" font-weight="700">moves to B</text>
      <text x="295" y="205">C no longer on the branch</text>
      <text x="295" y="253" font-weight="700">moves to B</text>
      <text x="295" y="271">C no longer on the branch</text>
      <text x="295" y="319" font-weight="700">moves to B</text>
      <text x="295" y="337">C no longer on the branch</text>
      <text x="515" y="253" font-weight="700">reset to match B</text>
      <text x="515" y="271">C's changes are unstaged</text>
      <text x="515" y="319" font-weight="700">reset to match B</text>
      <text x="515" y="337">nothing staged</text>
    </g>
    <g font-size="12" fill="#294a2e">
      <text x="515" y="187" font-weight="700">unchanged</text>
      <text x="515" y="205">C's changes are staged</text>
      <text x="735" y="187" font-weight="700">unchanged</text>
      <text x="735" y="205">files still look like C</text>
      <text x="735" y="253" font-weight="700">unchanged</text>
      <text x="735" y="271">C's changes kept as edits</text>
    </g>
    <text x="735" y="319" font-size="12" font-weight="700" fill="#6e2a24">reset to match B</text>
    <text x="735" y="337" font-size="12" fill="#6e2a24">C's changes and edits discarded</text>

    <text x="430" y="378" font-size="11.5" fill="#36424e">Commit C still exists: git reset --hard ORIG_HEAD (or a reflog entry) brings it back.</text>
    <text x="430" y="406" font-size="13" fill="#40566b">Uncommitted edits destroyed by --hard were never saved by Git and cannot be recovered.</text>
  </g>
</svg>
