<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="gbs-title gbs-desc">
  <title id="gbs-title">git bisect halving the search for the first bad commit</title>
  <desc id="gbs-desc">Sixteen commits in order: commit 1 is tag v1.0.0 and known good, commit 16 is HEAD and known bad. Fifteen candidates remain. Step 1: Git checks out commit 8 in the middle; the test passes, so it is good and commits 1 to 8 are cleared. Step 2: Git checks out commit 12; the test fails, so it is bad and the range shrinks to 9 to 12. Step 3: commit 10 is good. Step 4: commit 11 is bad. Git reports commit 11 as the first bad commit after four tests. Each test halves the range, so the number of tests grows with the base-2 logarithm: about 10 tests for 1,000 commits.</desc>
  <defs>
    <marker id="gbs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="86" font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">History</text>
    <path d="M250 82H820" stroke="#8a96a3" stroke-width="2"/>
    <g stroke-width="1.8">
      <circle cx="250" cy="82" r="12" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="288" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="326" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="364" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="402" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="440" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="478" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="516" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="554" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="592" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="630" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="668" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="706" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="744" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="782" cy="82" r="12" fill="#eef1f5" stroke="#8a96a3"/>
      <circle cx="820" cy="82" r="12" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="10.5" font-weight="700" fill="#36424e">
      <text x="250" y="86" fill="#294a2e">1</text><text x="288" y="86">2</text><text x="326" y="86">3</text>
      <text x="364" y="86">4</text><text x="402" y="86">5</text><text x="440" y="86">6</text>
      <text x="478" y="86">7</text><text x="516" y="86">8</text><text x="554" y="86">9</text>
      <text x="592" y="86">10</text><text x="630" y="86">11</text><text x="668" y="86">12</text>
      <text x="706" y="86">13</text><text x="744" y="86">14</text><text x="782" y="86">15</text>
      <text x="820" y="86" fill="#6e2a24">16</text>
    </g>
    <text x="250" y="56" font-size="11" font-weight="700" fill="#294a2e">v1.0.0: good</text>
    <text x="820" y="56" font-size="11" font-weight="700" fill="#6e2a24">HEAD: bad</text>

    <g font-size="12" fill="#36424e" text-anchor="start">
      <text x="24" y="146"><tspan font-weight="700">Step 1:</tspan> #8 is good</text>
      <text x="24" y="196"><tspan font-weight="700">Step 2:</tspan> #12 is bad</text>
      <text x="24" y="246"><tspan font-weight="700">Step 3:</tspan> #10 is good</text>
      <text x="24" y="296"><tspan font-weight="700">Step 4:</tspan> #11 is bad</text>
    </g>
    <g font-size="11" fill="#60788d" text-anchor="start">
      <text x="140" y="146">15 suspects</text>
      <text x="140" y="196">8 suspects</text>
      <text x="140" y="246">4 suspects</text>
      <text x="140" y="296">2 suspects</text>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="274" y="128" width="560" height="26" rx="13"/>
      <rect x="540" y="178" width="294" height="26" rx="13"/>
      <rect x="540" y="228" width="142" height="26" rx="13"/>
      <rect x="616" y="278" width="66" height="26" rx="13"/>
    </g>
    <g stroke-width="2">
      <circle cx="516" cy="141" r="11" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="668" cy="191" r="11" fill="#fbe9e7" stroke="#b5524b"/>
      <circle cx="592" cy="241" r="11" fill="#e7f3e9" stroke="#53845b"/>
      <circle cx="630" cy="291" r="11" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="10.5" font-weight="700">
      <text x="516" y="145" fill="#294a2e">8</text>
      <text x="668" y="195" fill="#6e2a24">12</text>
      <text x="592" y="245" fill="#294a2e">10</text>
      <text x="630" y="295" fill="#6e2a24">11</text>
    </g>

    <rect x="560" y="322" width="140" height="28" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="630" y="341" font-size="12" font-weight="700" fill="#6e2a24">first bad: #11</text>
    <path d="M630 304V320" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#gbs-arrow)"/>
    <text x="24" y="341" font-size="11.5" fill="#36424e" text-anchor="start">Shaded bar: commits still suspected</text>

    <text x="430" y="384" font-size="13" fill="#40566b">Each test halves the range: 15 candidates take 4 tests, and 1,000 commits take about 10.</text>
  </g>
</svg>
