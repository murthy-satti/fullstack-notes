<svg xmlns="http://www.w3.org/2000/svg" width="860" height="514" viewBox="0 0 860 514" role="img" aria-labelledby="bsd-title bsd-desc">
  <title id="bsd-title">Choosing a branching strategy</title>
  <desc id="bsd-desc">Start: choose a branching strategy. First question: must you support several released versions at once, as with desktop, mobile, on-premises software, or libraries? If no, ask whether everyone can merge to main daily with fast CI and feature flags. If yes, use trunk-based development with daily merges and feature flags. If not yet, use GitHub flow with short branches and pull requests and work toward trunk-based development. If you must support several versions, ask whether a separate integration branch or long manual QA cycles are mandated. If no, use trunk-based development plus release branches, the common choice for versioned, mobile, and desktop products. If yes, GitFlow fits, accepting its merge overhead. In every case avoid environment branches such as dev, staging, and prod; build once and promote the same artifact instead.</desc>
  <defs>
    <marker id="bsd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="514" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="305" y="20" width="250" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="43" font-size="13" font-weight="700" fill="#66400f">Choose a branching strategy</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M430 76 600 132 430 188 260 132z"/>
      <path d="M215 214 380 270 215 326 50 270z"/>
      <path d="M645 214 810 270 645 326 480 270z"/>
    </g>
    <g font-size="12" fill="#463365">
      <text x="430" y="128">Must you support several</text>
      <text x="430" y="144">released versions at once?</text>
      <text x="215" y="266">Can everyone merge to main</text>
      <text x="215" y="282">daily, with fast CI and flags?</text>
      <text x="645" y="266">Mandated integration branch</text>
      <text x="645" y="282">or long manual QA cycles?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round">
      <path d="M430 56V74" marker-end="url(#bsd-arrow)"/>
      <path d="M260 132H215V212" marker-end="url(#bsd-arrow)"/>
      <path d="M600 132H645V212" marker-end="url(#bsd-arrow)"/>
      <path d="M50 270V376" marker-end="url(#bsd-arrow)"/>
      <path d="M215 326V352H315V376" marker-end="url(#bsd-arrow)"/>
      <path d="M645 326V352H545V376" marker-end="url(#bsd-arrow)"/>
      <path d="M810 270V376" marker-end="url(#bsd-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="236" y="124">no</text>
      <text x="624" y="124">yes</text>
      <text x="62" y="320" text-anchor="start">yes</text>
      <text x="228" y="346" text-anchor="start">not yet</text>
      <text x="632" y="346" text-anchor="end">no</text>
      <text x="798" y="320" text-anchor="end">yes</text>
    </g>

    <rect x="20" y="378" width="190" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="115" y="399" font-size="12.5" font-weight="700" fill="#294a2e">Trunk-based development</text>
    <text x="115" y="417" font-size="11" fill="#294a2e">daily merges, feature flags</text>
    <rect x="225" y="378" width="180" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="315" y="399" font-size="12.5" font-weight="700" fill="#263e5a">GitHub flow</text>
    <text x="315" y="417" font-size="11" fill="#263e5a">short branches and PRs</text>
    <rect x="440" y="378" width="210" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="545" y="399" font-size="12.5" font-weight="700" fill="#294a2e">Trunk + release branches</text>
    <text x="545" y="417" font-size="11" fill="#294a2e">versioned, mobile, desktop</text>
    <rect x="665" y="378" width="180" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="755" y="399" font-size="12.5" font-weight="700" fill="#66400f">GitFlow</text>
    <text x="755" y="417" font-size="11" fill="#66400f">accept the merge overhead</text>

    <rect x="20" y="446" width="825" height="30" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="432" y="466" font-size="12" font-weight="700" fill="#6e2a24">Avoid environment branches (dev, staging, prod): build once and promote the same artifact instead.</text>

    <text x="430" y="500" font-size="13" fill="#40566b">Most web teams land on trunk-based development or GitHub flow; versioned products add release branches.</text>
  </g>
</svg>
