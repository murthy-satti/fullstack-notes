<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="mmr-title mmr-desc">
  <title id="mmr-title">The history main gets from each pull request merge method</title>
  <desc id="mmr-desc">Starting point: main has commits A, B, and C; the pull request branch feat/due-dates started at B and has three commits D, E, and F. Create a merge commit: main gets merge commit M with two parents, C and F; D, E, and F stay in history with their original hashes and the branch shape is preserved. Squash and merge: main gets one new commit S whose single parent is C and whose changes equal D plus E plus F; the individual branch commits are not part of main. Rebase and merge: D, E, and F are replayed on top of C as new commits D prime, E prime, and F prime with new hashes, giving linear history with no merge commit.</desc>
  <defs>
    <marker id="mmr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Starting point: pull request feat/due-dates with three commits</text>
    <g fill="none" stroke="#40566b" stroke-width="1.6">
      <path d="M375 80H355" marker-end="url(#mmr-arrow)"/>
      <path d="M425 80H405" marker-end="url(#mmr-arrow)"/>
      <path d="M429 131 400 93" marker-end="url(#mmr-arrow)"/>
      <path d="M475 140H455" marker-end="url(#mmr-arrow)"/>
      <path d="M525 140H505" marker-end="url(#mmr-arrow)"/>
    </g>
    <g stroke-width="1.8">
      <circle cx="340" cy="80" r="13" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="390" cy="80" r="13" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="440" cy="80" r="13" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="440" cy="140" r="13" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="490" cy="140" r="13" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="540" cy="140" r="13" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="11" font-weight="700" fill="#263e5a">
      <text x="340" y="84">A</text><text x="390" y="84">B</text><text x="440" y="84">C</text>
      <text x="440" y="144" fill="#66400f">D</text><text x="490" y="144" fill="#66400f">E</text><text x="540" y="144" fill="#66400f">F</text>
    </g>
    <rect x="462" y="70" width="44" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="484" y="84" font-size="11" font-weight="700" fill="#263e5a">main</text>
    <rect x="566" y="130" width="110" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="621" y="144" font-size="11" font-weight="700" fill="#66400f">feat/due-dates</text>
    <path d="M24 176H856" stroke="#c9d1db" stroke-width="1.5"/>

    <g transform="translate(20 0)">
      <rect x="0" y="192" width="270" height="250" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="135" y="216" font-size="13" font-weight="700" fill="#463365">Create a merge commit</text>
      <g fill="none" stroke="#40566b" stroke-width="1.6">
        <path d="M50 260H40" marker-end="url(#mmr-arrow)"/>
        <path d="M90 260H80" marker-end="url(#mmr-arrow)"/>
        <path d="M210 260H120" marker-end="url(#mmr-arrow)"/>
        <path d="M95 312 72 272" marker-end="url(#mmr-arrow)"/>
        <path d="M130 320H120" marker-end="url(#mmr-arrow)"/>
        <path d="M170 320H160" marker-end="url(#mmr-arrow)"/>
        <path d="M215 270 194 309" marker-end="url(#mmr-arrow)"/>
      </g>
      <g stroke-width="1.8">
        <circle cx="25" cy="260" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="65" cy="260" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="105" cy="260" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="225" cy="260" r="13" fill="#f0e9fb" stroke="#8062a8"/>
        <circle cx="105" cy="320" r="13" fill="#fff0d9" stroke="#bd7a20"/>
        <circle cx="145" cy="320" r="13" fill="#fff0d9" stroke="#bd7a20"/>
        <circle cx="185" cy="320" r="13" fill="#fff0d9" stroke="#bd7a20"/>
      </g>
      <g font-size="11" font-weight="700" fill="#263e5a">
        <text x="25" y="264">A</text><text x="65" y="264">B</text><text x="105" y="264">C</text>
        <text x="225" y="264" fill="#463365">M</text>
        <text x="105" y="324" fill="#66400f">D</text><text x="145" y="324" fill="#66400f">E</text><text x="185" y="324" fill="#66400f">F</text>
      </g>
      <g font-size="11" fill="#36424e">
        <text x="135" y="372">All commits kept with original hashes.</text>
        <text x="135" y="389">M has two parents, C and F.</text>
        <text x="135" y="406">Shows when the branch was merged.</text>
        <text x="135" y="428" font-style="italic" fill="#463365">git merge --no-ff</text>
      </g>
    </g>

    <g transform="translate(305 0)">
      <rect x="0" y="192" width="270" height="250" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="135" y="216" font-size="13" font-weight="700" fill="#294a2e">Squash and merge</text>
      <g fill="none" stroke="#40566b" stroke-width="1.6">
        <path d="M70 280H60" marker-end="url(#mmr-arrow)"/>
        <path d="M110 280H100" marker-end="url(#mmr-arrow)"/>
        <path d="M150 280H140" marker-end="url(#mmr-arrow)"/>
      </g>
      <g stroke-width="1.8">
        <circle cx="45" cy="280" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="85" cy="280" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="125" cy="280" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="165" cy="280" r="13" fill="#e7f3e9" stroke="#53845b"/>
      </g>
      <g font-size="11" font-weight="700" fill="#263e5a">
        <text x="45" y="284">A</text><text x="85" y="284">B</text><text x="125" y="284">C</text>
        <text x="165" y="284" fill="#294a2e">S</text>
      </g>
      <text x="185" y="284" font-size="11" fill="#294a2e" text-anchor="start">= D + E + F</text>
      <g font-size="11" fill="#36424e">
        <text x="135" y="372">One new commit S with one parent.</text>
        <text x="135" y="389">D, E, F are not part of main.</text>
        <text x="135" y="406">One PR = one revertable commit.</text>
        <text x="135" y="428" font-style="italic" fill="#294a2e">git merge --squash, then commit</text>
      </g>
    </g>

    <g transform="translate(590 0)">
      <rect x="0" y="192" width="270" height="250" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="135" y="216" font-size="13" font-weight="700" fill="#66400f">Rebase and merge</text>
      <g fill="none" stroke="#40566b" stroke-width="1.6">
        <path d="M50 280H40" marker-end="url(#mmr-arrow)"/>
        <path d="M90 280H80" marker-end="url(#mmr-arrow)"/>
        <path d="M130 280H120" marker-end="url(#mmr-arrow)"/>
        <path d="M170 280H160" marker-end="url(#mmr-arrow)"/>
        <path d="M210 280H200" marker-end="url(#mmr-arrow)"/>
      </g>
      <g stroke-width="1.8">
        <circle cx="25" cy="280" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="65" cy="280" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="105" cy="280" r="13" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="145" cy="280" r="13" fill="#fff0d9" stroke="#bd7a20"/>
        <circle cx="185" cy="280" r="13" fill="#fff0d9" stroke="#bd7a20"/>
        <circle cx="225" cy="280" r="13" fill="#fff0d9" stroke="#bd7a20"/>
      </g>
      <g font-size="11" font-weight="700" fill="#263e5a">
        <text x="25" y="284">A</text><text x="65" y="284">B</text><text x="105" y="284">C</text>
        <text x="145" y="284" fill="#66400f">D'</text><text x="185" y="284" fill="#66400f">E'</text><text x="225" y="284" fill="#66400f">F'</text>
      </g>
      <g font-size="11" fill="#36424e">
        <text x="135" y="372">Each commit copied onto C.</text>
        <text x="135" y="389">New hashes, no merge commit.</text>
        <text x="135" y="406">Linear history, every commit kept.</text>
        <text x="135" y="428" font-style="italic" fill="#66400f">git rebase main, then fast-forward</text>
      </g>
    </g>

    <text x="440" y="476" font-size="13" fill="#40566b">Same pull request, three shapes of history: choose one per repository and enforce it.</text>
  </g>
</svg>
