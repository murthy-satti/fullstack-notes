<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="gfl-title gfl-desc">
  <title id="gfl-title">GitFlow branch timeline</title>
  <desc id="gfl-desc">Lanes from top to bottom: main, hotfix, release, develop, and two feature branches. main holds only released code and is tagged v1.0.0. develop branches from main and is the integration branch. feature/a branches from develop, gets two commits, and merges back into develop. feature/b branches from develop and lives for weeks before a large merge back into develop. release/1.1 is cut from develop, gets a version bump and a fix, then merges into main, which is tagged v1.1.0, and back into develop. hotfix/1.1.1 branches from main, gets a fix, and merges into main, tagged v1.1.1, and into develop. Release and hotfix branches always merge into both main and develop.</desc>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" text-anchor="start">
      <text x="24" y="74" fill="#263e5a">main</text>
      <text x="24" y="134" fill="#6e2a24">hotfix/*</text>
      <text x="24" y="194" fill="#294a2e">release/*</text>
      <text x="24" y="254" fill="#463365">develop</text>
      <text x="24" y="314" fill="#66400f">feature/a</text>
      <text x="24" y="364" fill="#66400f">feature/b</text>
    </g>
    <path d="M110 70H850" stroke="#4774aa" stroke-width="4" stroke-linecap="round"/>
    <path d="M170 250H850" stroke="#8062a8" stroke-width="4" stroke-linecap="round"/>

    <g fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M140 70L170 250" stroke="#8062a8"/>
      <path d="M170 250L200 310H250L300 250" stroke="#bd7a20"/>
      <path d="M300 250L330 360H780L820 250" stroke="#bd7a20"/>
      <path d="M420 250L450 190H500" stroke="#53845b"/>
      <path d="M500 190L560 70" stroke="#53845b"/>
      <path d="M500 190L590 250" stroke="#53845b"/>
      <path d="M560 70L630 130H670" stroke="#b5524b"/>
      <path d="M670 130L720 70" stroke="#b5524b"/>
      <path d="M670 130L750 250" stroke="#b5524b"/>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="140" cy="70" r="8"/><circle cx="560" cy="70" r="8"/><circle cx="720" cy="70" r="8"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <circle cx="170" cy="250" r="8"/><circle cx="300" cy="250" r="8"/><circle cx="420" cy="250" r="8"/>
      <circle cx="590" cy="250" r="8"/><circle cx="750" cy="250" r="8"/><circle cx="820" cy="250" r="8"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <circle cx="200" cy="310" r="7"/><circle cx="250" cy="310" r="7"/>
      <circle cx="330" cy="360" r="7"/><circle cx="440" cy="360" r="7"/><circle cx="550" cy="360" r="7"/>
      <circle cx="660" cy="360" r="7"/><circle cx="770" cy="360" r="7"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <circle cx="450" cy="190" r="7"/><circle cx="500" cy="190" r="7"/>
    </g>
    <g fill="#fbe9e7" stroke="#b5524b" stroke-width="2">
      <circle cx="630" cy="130" r="7"/><circle cx="670" cy="130" r="7"/>
    </g>

    <g font-size="11" font-weight="700" fill="#463365">
      <rect x="112" y="32" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="140" y="46">v1.0.0</text>
      <rect x="532" y="32" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="560" y="46">v1.1.0</text>
      <rect x="692" y="32" width="56" height="20" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="720" y="46">v1.1.1</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="475" y="178" fill="#294a2e">bump, fix</text>
      <text x="650" y="118" fill="#6e2a24">urgent fix</text>
      <text x="225" y="334" fill="#66400f">days</text>
      <text x="555" y="386" fill="#66400f">feature/b lives for weeks: a large, risky merge at the end</text>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="430" y="280">release merges to main and develop</text>
      <text x="764" y="150">hotfix merges</text>
      <text x="764" y="165">to both too</text>
    </g>

    <text x="440" y="414" font-size="13" fill="#40566b">Two long-lived branches and double merges: built for scheduled, explicitly versioned releases.</text>
  </g>
</svg>
