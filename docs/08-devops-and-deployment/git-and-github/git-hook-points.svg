<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="ghp-title ghp-desc">
  <title id="ghp-title">Where Git hooks run during commit and push</title>
  <desc id="ghp-desc">Commit, on the developer's machine: git commit runs the pre-commit hook, where lint-staged formats and lints staged files and a secret scanner runs; then prepare-commit-msg, which can fill in a template or ticket ID; then the editor; then commit-msg, where commitlint checks the message; then the commit is stored and post-commit runs for notifications. Any of the first three hooks can abort the commit by exiting non-zero, and git commit --no-verify skips pre-commit and commit-msg. Push: git push runs the pre-push hook on the client, for example quick tests, then sends objects over the network. On the server, pre-receive can reject the whole push, update runs once per ref, and after refs are updated post-receive triggers CI and webhooks. Client hooks are conveniences that developers can skip; enforcement belongs on the server. GitHub.com does not run custom server hooks, so use rulesets, push protection, and required status checks instead; GitHub Enterprise Server supports pre-receive hooks.</desc>
  <defs>
    <marker id="ghp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="40" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Commit: client-side hooks (git commit --no-verify skips pre-commit and commit-msg)</text>

    <rect x="20" y="58" width="150" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="95" y="83" font-size="13" font-weight="700" fill="#66400f">git commit</text>
    <text x="95" y="101" font-size="11" fill="#66400f">developer</text>
    <rect x="190" y="58" width="150" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="265" y="83" font-size="12.5" font-weight="700" fill="#463365">pre-commit</text>
    <text x="265" y="101" font-size="11" fill="#463365">lint, format, secrets</text>
    <rect x="360" y="58" width="150" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="435" y="83" font-size="12.5" font-weight="700" fill="#463365">prepare-commit-msg</text>
    <text x="435" y="101" font-size="11" fill="#463365">template, ticket ID</text>
    <rect x="530" y="58" width="150" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="605" y="83" font-size="12.5" font-weight="700" fill="#463365">commit-msg</text>
    <text x="605" y="101" font-size="11" fill="#463365">commitlint</text>
    <rect x="700" y="58" width="150" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="775" y="83" font-size="12.5" font-weight="700" fill="#263e5a">commit stored</text>
    <text x="775" y="101" font-size="11" fill="#263e5a">then post-commit</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M170 87H188" marker-end="url(#ghp-arrow)"/>
      <path d="M340 87H358" marker-end="url(#ghp-arrow)"/>
      <path d="M510 87H528" marker-end="url(#ghp-arrow)"/>
      <path d="M680 87H698" marker-end="url(#ghp-arrow)"/>
    </g>
    <text x="435" y="140" font-size="11.5" font-style="italic" fill="#6e2a24">a non-zero exit from pre-commit, prepare-commit-msg, or commit-msg aborts the commit</text>

    <path d="M24 162H856" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="190" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Push</text>
    <text x="180" y="190" font-size="11.5" font-weight="700" fill="#66400f">your machine</text>
    <text x="610" y="190" font-size="11.5" font-weight="700" fill="#263e5a">server</text>
    <path d="M352 176V300" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>

    <rect x="20" y="208" width="150" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="95" y="233" font-size="13" font-weight="700" fill="#66400f">git push</text>
    <text x="95" y="251" font-size="11" fill="#66400f">developer</text>
    <rect x="190" y="208" width="150" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="265" y="233" font-size="12.5" font-weight="700" fill="#463365">pre-push</text>
    <text x="265" y="251" font-size="11" fill="#463365">quick tests</text>
    <rect x="370" y="208" width="150" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="445" y="233" font-size="12.5" font-weight="700" fill="#263e5a">pre-receive</text>
    <text x="445" y="251" font-size="11" fill="#263e5a">can reject the push</text>
    <rect x="540" y="208" width="140" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="610" y="233" font-size="12.5" font-weight="700" fill="#263e5a">update</text>
    <text x="610" y="251" font-size="11" fill="#263e5a">once per ref</text>
    <rect x="700" y="208" width="150" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="775" y="233" font-size="12.5" font-weight="700" fill="#294a2e">post-receive</text>
    <text x="775" y="251" font-size="11" fill="#294a2e">CI, webhooks</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M170 237H188" marker-end="url(#ghp-arrow)"/>
      <path d="M340 237H368" marker-end="url(#ghp-arrow)"/>
      <path d="M520 237H538" marker-end="url(#ghp-arrow)"/>
      <path d="M680 237H698" marker-end="url(#ghp-arrow)"/>
    </g>
    <text x="180" y="290" font-size="11" font-style="italic" fill="#40566b">skippable: --no-verify</text>
    <text x="610" y="290" font-size="11" font-style="italic" fill="#40566b">enforced: developers cannot skip these</text>

    <rect x="20" y="314" width="830" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="435" y="336" font-size="12" font-weight="700" fill="#294a2e">GitHub.com runs no custom server hooks: enforce with rulesets, push protection, and required checks.</text>
    <text x="435" y="354" font-size="11.5" fill="#294a2e">GitHub Enterprise Server and self-hosted Git servers support pre-receive hooks.</text>

    <text x="440" y="398" font-size="13" fill="#40566b">Client hooks give fast feedback; anything that must hold for every commit is checked again in CI.</text>
  </g>
</svg>
