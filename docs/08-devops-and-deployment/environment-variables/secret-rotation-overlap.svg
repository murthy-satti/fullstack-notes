<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-labelledby="sro-title sro-desc">
  <title id="sro-title">Rotating a signing secret with an overlap window</title>
  <desc id="sro-desc">Five phases left to right. Phase 1, create v2: the new secret is stored but not used; v1 is current, new tokens are signed with v1, and verifiers accept only v1. Phase 2, accept both: verifiers load v2, so they accept v1 and v2, while signing still uses v1. Phase 3, switch: new tokens are signed with v2; v1 is still accepted but no longer used for signing. Phase 4, wait: tokens signed with v1 expire, for example after their 15-minute lifetime. Phase 5, revoke v1: v1 is deleted or disabled and verifiers accept only v2. At no moment is a valid token rejected.</desc>
  <rect width="860" height="320" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12.5" font-weight="700" fill="#40566b">
      <text x="190" y="36">1. Create v2</text>
      <text x="330" y="36">2. Accept both</text>
      <text x="470" y="36">3. Switch</text>
      <text x="610" y="36">4. Wait</text>
      <text x="750" y="36">5. Revoke v1</text>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="190" y="54">stored, unused</text>
      <text x="330" y="54">verifiers load v2</text>
      <text x="470" y="54">sign with v2</text>
      <text x="610" y="54">v1 tokens expire</text>
      <text x="750" y="54">delete or disable</text>
    </g>
    <g fill="none" stroke="#c9d1db" stroke-width="1.5">
      <path d="M260 66V256"/>
      <path d="M400 66V256"/>
      <path d="M540 66V256"/>
      <path d="M680 66V256"/>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="20" y="96">Secret v1</text>
      <text x="20" y="136">Secret v2</text>
      <text x="20" y="196">Signs with</text>
      <text x="20" y="236">Accepts</text>
    </g>

    <rect x="122" y="78" width="276" height="26" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="260" y="95" font-size="11.5" fill="#294a2e">current</text>
    <rect x="402" y="78" width="276" height="26" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="540" y="95" font-size="11.5" fill="#66400f">still accepted, no longer used</text>
    <rect x="682" y="78" width="138" height="26" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="751" y="95" font-size="11.5" fill="#6e2a24">revoked</text>

    <rect x="122" y="118" width="136" height="26" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="190" y="135" font-size="11.5" fill="#36424e">created</text>
    <rect x="262" y="118" width="136" height="26" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="330" y="135" font-size="11.5" fill="#66400f">accepted</text>
    <rect x="402" y="118" width="418" height="26" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="611" y="135" font-size="11.5" fill="#294a2e">current</text>

    <path d="M20 160H840" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="122" y="178" width="276" height="26" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="260" y="195" font-size="11.5" font-weight="700" fill="#263e5a">v1</text>
    <rect x="402" y="178" width="418" height="26" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="611" y="195" font-size="11.5" font-weight="700" fill="#263e5a">v2</text>

    <rect x="122" y="218" width="136" height="26" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="190" y="235" font-size="11.5" font-weight="700" fill="#263e5a">v1</text>
    <rect x="262" y="218" width="416" height="26" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="470" y="235" font-size="11.5" font-weight="700" fill="#263e5a">v1 and v2</text>
    <rect x="682" y="218" width="138" height="26" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="751" y="235" font-size="11.5" font-weight="700" fill="#263e5a">v2</text>

    <text x="610" y="272" font-size="11" font-style="italic" fill="#40566b">at least the longest token lifetime</text>
    <text x="430" y="300" font-size="13" fill="#40566b">Accept the new secret before using it, stop using the old one before revoking it: nothing breaks.</text>
  </g>
</svg>
