<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="wis-title wis-desc">
  <title id="wis-title">An application reads a secret using workload identity, with no stored credential</title>
  <desc id="wis-desc">1, the platform, for example Kubernetes with a projected service account token or a cloud metadata service, gives the TaskFlow API pod a short-lived, signed identity token. 2, the app sends that token to the cloud's security token service and asks to assume the role taskflow-api-prod. The token service checks the token signature and the role's trust policy, which only allows this service account in this cluster. 3, it returns temporary credentials that expire in about an hour. 4, the app calls the secret store to get taskflow/prod/mongodb, signing the request with the temporary credentials. The secret store checks the IAM policy, which allows this role to read only taskflow/prod secrets, and writes an audit log entry. 5, it returns the secret value. 6, the app keeps the value in memory and refreshes it, and its credentials, before they expire. No long-lived key is stored in the image, the repository, or an environment variable.</desc>
  <defs>
    <marker id="wis-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="wis-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="50" y="20" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="120" y="39" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="120" y="55" font-size="11.5" fill="#66400f">pod / instance</text>
    <rect x="250" y="20" width="150" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="325" y="39" font-size="14" font-weight="700" fill="#463365">Platform</text>
    <text x="325" y="55" font-size="11.5" fill="#463365">identity provider</text>
    <rect x="470" y="20" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="545" y="39" font-size="14" font-weight="700" fill="#263e5a">Token service</text>
    <text x="545" y="55" font-size="11.5" fill="#263e5a">cloud IAM / STS</text>
    <rect x="680" y="20" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="755" y="39" font-size="14" font-weight="700" fill="#263e5a">Secret store</text>
    <text x="755" y="55" font-size="11.5" fill="#263e5a">versioned, audited</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M120 64V404"/>
      <path d="M325 64V404"/>
      <path d="M545 64V404"/>
      <path d="M755 64V404"/>
    </g>

    <path d="M325 98H122" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#wis-arrow-ret)"/>
    <rect x="140" y="81" width="170" height="14" fill="#f5f7fb"/>
    <text x="225" y="92" font-size="11.5" fill="#36424e">1. signed identity token</text>

    <path d="M120 138H543" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#wis-arrow)"/>
    <rect x="345" y="121" width="190" height="14" fill="#f5f7fb"/>
    <text x="440" y="132" font-size="11.5" fill="#36424e">2. assume taskflow-api-prod</text>

    <rect x="450" y="152" width="190" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="545" y="168" font-size="11" fill="#263e5a">checks signature and trust:</text>
    <text x="545" y="183" font-size="11" fill="#263e5a">only this service account</text>

    <path d="M545 214H122" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#wis-arrow-ret)"/>
    <rect x="345" y="197" width="190" height="14" fill="#f5f7fb"/>
    <text x="440" y="208" font-size="11.5" fill="#36424e">3. temporary credentials, ~1 h</text>

    <path d="M120 254H753" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#wis-arrow)"/>
    <rect x="560" y="237" width="185" height="14" fill="#f5f7fb"/>
    <text x="652" y="248" font-size="11.5" fill="#36424e">4. get taskflow/prod/mongodb</text>

    <rect x="660" y="268" width="190" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="755" y="284" font-size="11" fill="#263e5a">policy: read taskflow/prod/*</text>
    <text x="755" y="299" font-size="11" fill="#263e5a">only; audit log entry</text>

    <path d="M755 330H122" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#wis-arrow-ret)"/>
    <rect x="560" y="313" width="140" height="14" fill="#f5f7fb"/>
    <text x="630" y="324" font-size="11.5" fill="#36424e">5. secret value</text>

    <rect x="30" y="346" width="180" height="44" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="120" y="364" font-size="11" fill="#294a2e">6. keep in memory, refresh</text>
    <text x="120" y="379" font-size="11" fill="#294a2e">before expiry</text>

    <text x="430" y="432" font-size="13" fill="#40566b">No long-lived key exists anywhere: identity comes from the platform, access from a narrow policy.</text>
  </g>
</svg>
