<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="oip-title oip-desc">
  <title id="oip-title">One container image, configured differently in each environment</title>
  <desc id="oip-desc">The TaskFlow API image, identified by digest sha256:4f2c, contains a node:24-alpine base, the npm dependencies, the application code, and ENV NODE_ENV=production as a safe default. It contains no secrets and no environment-specific values. The same image runs in three places. In development, Docker Compose supplies APP_ENV=development and LOG_LEVEL=debug and points MONGODB_URI at a local container. In staging, Kubernetes supplies APP_ENV=staging and LOG_LEVEL=info from a ConfigMap and MONGODB_URI from a Secret synced from the secret store. In production, Kubernetes supplies APP_ENV=production and LOG_LEVEL=info from a ConfigMap and MONGODB_URI from a Secret synced from the secret store.</desc>
  <defs>
    <marker id="oip-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="40" width="290" height="250" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="165" y="64" font-size="14" font-weight="700" fill="#263e5a">Image taskflow-api</text>
    <text x="165" y="82" font-size="11.5" fill="#263e5a">sha256:4f2c... (built once)</text>
    <g fill="#ffffff" stroke="#4774aa" stroke-width="1.5">
      <rect x="40" y="96" width="250" height="30" rx="6"/>
      <rect x="40" y="132" width="250" height="30" rx="6"/>
      <rect x="40" y="168" width="250" height="30" rx="6"/>
      <rect x="40" y="204" width="250" height="30" rx="6"/>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="165" y="115">node:24-alpine base</text>
      <text x="165" y="151">dependencies (npm ci)</text>
      <text x="165" y="187">application code</text>
      <text x="165" y="223">ENV NODE_ENV=production</text>
    </g>
    <rect x="40" y="244" width="250" height="32" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="165" y="264" font-size="11.5" fill="#6e2a24">no secrets, no per-env values</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M310 110 388 82" marker-end="url(#oip-arrow)"/>
      <path d="M310 165H388" marker-end="url(#oip-arrow)"/>
      <path d="M310 220 388 248" marker-end="url(#oip-arrow)"/>
    </g>

    <rect x="390" y="40" width="450" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="615" y="62" font-size="14" font-weight="700" fill="#66400f">Development (Docker Compose)</text>
    <text x="615" y="82" font-size="11.5" fill="#66400f">APP_ENV=development, LOG_LEVEL=debug</text>
    <text x="615" y="100" font-size="11.5" fill="#66400f">MONGODB_URI: the local database container</text>
    <rect x="390" y="128" width="450" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="615" y="150" font-size="14" font-weight="700" fill="#463365">Staging (Kubernetes)</text>
    <text x="615" y="170" font-size="11.5" fill="#463365">ConfigMap: APP_ENV=staging, LOG_LEVEL=info</text>
    <text x="615" y="188" font-size="11.5" fill="#463365">Secret: MONGODB_URI synced from the secret store</text>
    <rect x="390" y="216" width="450" height="80" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="615" y="238" font-size="14" font-weight="700" fill="#294a2e">Production (Kubernetes)</text>
    <text x="615" y="258" font-size="11.5" fill="#294a2e">ConfigMap: APP_ENV=production, LOG_LEVEL=info</text>
    <text x="615" y="276" font-size="11.5" fill="#294a2e">Secret: MONGODB_URI synced from the secret store</text>

    <text x="430" y="330" font-size="13" fill="#40566b">The image is identical everywhere; the platform supplies configuration when the container starts.</text>
  </g>
</svg>
