<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="epl-title epl-desc">
  <title id="epl-title">Which value wins: env file precedence in six tools</title>
  <desc id="epl-desc">Six ladders, highest priority at the top. Node with --env-file: variables already in the environment win, then a later --env-file, then an earlier --env-file. The dotenv package: variables already set win unless override is true, then the first file in the path list, then later files. Vite, for keys with the VITE_ prefix: the real process environment wins, then .env.[mode].local, then .env.[mode], then .env.local, then .env. Next.js: process.env, then .env.[NODE_ENV].local, then .env.local, which is skipped in test, then .env.[NODE_ENV], then .env. Bun's runtime: variables already set in the shell, then .env.[NODE_ENV].local, then .env.local, skipped in test, then .env.[NODE_ENV], then .env. Docker Compose, for a container's environment: docker compose run -e, then environment or env_file values interpolated from the shell or the .env file, then plain environment entries in compose.yaml, then env_file entries, then ENV in the image. Note that Vite ranks .env.[mode] above .env.local while Next.js ranks .env.local above .env.[NODE_ENV].</desc>
  <rect width="860" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="430" y="26" font-size="12" font-style="italic" fill="#40566b">highest priority at the top of each ladder</text>

    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="150" y="52">Node --env-file</text>
      <text x="430" y="52">dotenv package</text>
      <text x="710" y="52">Vite (VITE_* keys)</text>
      <text x="150" y="292">Next.js</text>
      <text x="430" y="292">Bun runtime</text>
      <text x="710" y="292">Docker Compose (container)</text>
    </g>

    <g stroke-width="1.5">
      <rect x="20" y="62" width="260" height="32" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="20" y="100" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="20" y="138" width="260" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>

      <rect x="300" y="62" width="260" height="32" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="300" y="100" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="300" y="138" width="260" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>

      <rect x="580" y="62" width="260" height="32" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="580" y="100" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="580" y="138" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="580" y="176" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="580" y="214" width="260" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>

      <rect x="20" y="302" width="260" height="32" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="20" y="340" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="20" y="378" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="20" y="416" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="20" y="454" width="260" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>

      <rect x="300" y="302" width="260" height="32" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="300" y="340" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="300" y="378" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="300" y="416" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="300" y="454" width="260" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>

      <rect x="580" y="302" width="260" height="32" rx="6" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="580" y="340" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="580" y="378" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="580" y="416" width="260" height="32" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="580" y="454" width="260" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="150" y="82">variables already in the environment</text>
      <text x="150" y="120">later --env-file</text>
      <text x="150" y="158">earlier --env-file</text>

      <text x="430" y="82">already set (unless override: true)</text>
      <text x="430" y="120">first file in the path list</text>
      <text x="430" y="158">later files in the list</text>

      <text x="710" y="82">real process env (prefixed keys)</text>
      <text x="710" y="120">.env.[mode].local</text>
      <text x="710" y="158">.env.[mode]</text>
      <text x="710" y="196">.env.local</text>
      <text x="710" y="234">.env</text>

      <text x="150" y="322">process.env</text>
      <text x="150" y="360">.env.[NODE_ENV].local</text>
      <text x="150" y="398">.env.local (skipped in test)</text>
      <text x="150" y="436">.env.[NODE_ENV]</text>
      <text x="150" y="474">.env</text>

      <text x="430" y="322">variables already set in the shell</text>
      <text x="430" y="360">.env.[NODE_ENV].local</text>
      <text x="430" y="398">.env.local (skipped in test)</text>
      <text x="430" y="436">.env.[NODE_ENV]</text>
      <text x="430" y="474">.env</text>

      <text x="710" y="322">docker compose run -e</text>
      <text x="710" y="360">values interpolated from shell or .env</text>
      <text x="710" y="398">environment: in compose.yaml</text>
      <text x="710" y="436">env_file: in compose.yaml</text>
      <text x="710" y="474">ENV in the image</text>
    </g>

    <text x="430" y="506" font-size="13" fill="#40566b">Note the trap: Vite ranks .env.[mode] above .env.local, Next.js ranks .env.local above .env.[NODE_ENV].</text>
  </g>
</svg>
