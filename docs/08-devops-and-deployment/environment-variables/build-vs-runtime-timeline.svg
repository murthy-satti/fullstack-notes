<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="bvr-title bvr-desc">
  <title id="bvr-title">A frontend value set at build time compared with one read at runtime</title>
  <desc id="bvr-desc">Top, build time: vite build runs in CI with VITE_API_URL set to the staging URL. The bundle dist/assets/index.js now contains the literal staging API address. Deployed to staging it calls the correct API, but when the same build is promoted to production, production still calls the staging API; fixing it needs a rebuild. Bottom, runtime: vite build runs once with no environment values. The bundle fetches /config.json before it renders. In staging, the platform serves a config.json pointing to the staging API; in production, a config.json pointing to the production API, so the same build is correct in both.</desc>
  <defs>
    <marker id="bvr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="32" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Build time: the value is frozen into the bundle</text>
    <rect x="20" y="56" width="200" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="120" y="80" font-size="14" font-weight="700" fill="#463365">vite build in CI</text>
    <text x="120" y="99" font-size="11.5" fill="#463365">VITE_API_URL = staging URL</text>
    <rect x="260" y="56" width="220" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="370" y="80" font-size="14" font-weight="700" fill="#263e5a">dist/assets/index.js</text>
    <text x="370" y="99" font-size="11.5" fill="#263e5a">contains "api.staging..." literally</text>
    <rect x="520" y="46" width="320" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="680" y="68" font-size="12" font-weight="700" fill="#294a2e">Staging: calls the staging API</text>
    <rect x="520" y="92" width="320" height="34" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="680" y="114" font-size="12" font-weight="700" fill="#6e2a24">Production: still calls the staging API</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M220 86H258" marker-end="url(#bvr-arrow)"/>
      <path d="M480 80 518 64" marker-end="url(#bvr-arrow)"/>
      <path d="M480 92 518 108" marker-end="url(#bvr-arrow)"/>
    </g>
    <text x="680" y="146" font-size="11.5" font-style="italic" fill="#6e2a24">fixing it needs a new build</text>

    <path d="M20 168H840" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="20" y="196" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Runtime: the bundle asks the environment</text>
    <rect x="20" y="220" width="200" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="120" y="244" font-size="14" font-weight="700" fill="#463365">vite build, once</text>
    <text x="120" y="263" font-size="11.5" fill="#463365">no environment values</text>
    <rect x="260" y="220" width="220" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="370" y="244" font-size="14" font-weight="700" fill="#263e5a">same bundle everywhere</text>
    <text x="370" y="263" font-size="11.5" fill="#263e5a">fetches /config.json first</text>
    <rect x="520" y="210" width="320" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="680" y="232" font-size="12" font-weight="700" fill="#294a2e">Staging config.json: staging API</text>
    <rect x="520" y="256" width="320" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="680" y="278" font-size="12" font-weight="700" fill="#294a2e">Production config.json: production API</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M220 250H258" marker-end="url(#bvr-arrow)"/>
      <path d="M480 244 518 228" marker-end="url(#bvr-arrow)"/>
      <path d="M480 256 518 272" marker-end="url(#bvr-arrow)"/>
    </g>

    <text x="430" y="336" font-size="13" fill="#40566b">Build-time values make each build environment-specific; runtime values let one build be promoted.</text>
  </g>
</svg>
