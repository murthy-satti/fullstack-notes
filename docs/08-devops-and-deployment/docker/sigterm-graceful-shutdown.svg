<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="sgs-title sgs-desc">
  <title id="sgs-title">What happens to SIGTERM with and without graceful shutdown</title>
  <desc id="sgs-desc">Signal ignored: docker stop sends SIGTERM to PID 1. When PID 1 is a shell from the shell form of CMD, or a Node process without a SIGTERM handler, the signal is ignored and the app keeps serving. After the 10 second timeout Docker sends SIGKILL, the container exits with code 137, and requests in flight are cut. Every deploy waits 10 seconds per container and drops requests. Signal handled: with the exec form, node is PID 1 (or runs under tini) and has a SIGTERM handler. It calls server.close so it stops accepting connections, finishes the requests already in flight, closes the MongoDB connection pool, and exits with code 0 after about one second. Kubernetes and Docker Compose use the same SIGTERM, wait, SIGKILL sequence.</desc>
  <defs>
    <marker id="sgs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Signal ignored: shell form, or node with no SIGTERM handler, as PID 1</text>

    <rect x="24" y="46" width="185" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="116" y="68" font-size="13" font-weight="700" fill="#66400f">SIGTERM</text>
    <text x="116" y="86" font-size="11.5" fill="#66400f">from docker stop</text>
    <rect x="233" y="46" width="185" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="325" y="68" font-size="13" font-weight="700" fill="#36424e">PID 1 ignores it</text>
    <text x="325" y="86" font-size="11.5" fill="#36424e">and keeps serving</text>
    <rect x="442" y="46" width="185" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="534" y="68" font-size="13" font-weight="700" fill="#6e2a24">SIGKILL</text>
    <text x="534" y="86" font-size="11.5" fill="#6e2a24">after the 10 s timeout</text>
    <rect x="651" y="46" width="185" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="743" y="68" font-size="13" font-weight="700" fill="#6e2a24">exit code 137</text>
    <text x="743" y="86" font-size="11.5" fill="#6e2a24">requests cut mid-flight</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M209 72H231" marker-end="url(#sgs-arrow)"/>
      <path d="M418 72H440" marker-end="url(#sgs-arrow)"/>
      <path d="M627 72H649" marker-end="url(#sgs-arrow)"/>
    </g>
    <text x="24" y="124" font-size="11.5" fill="#36424e" text-anchor="start">Every deploy waits the full timeout per container, and clients see connection resets and 502s.</text>

    <path d="M24 144H836" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="172" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Signal handled: exec form, node is PID 1 (or under tini), SIGTERM handler installed</text>

    <rect x="24" y="186" width="143" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="95" y="208" font-size="12.5" font-weight="700" fill="#66400f">SIGTERM</text>
    <text x="95" y="226" font-size="11.5" fill="#66400f">from docker stop</text>
    <rect x="191" y="186" width="143" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="262" y="208" font-size="12.5" font-weight="700" fill="#263e5a">server.close()</text>
    <text x="262" y="226" font-size="11.5" fill="#263e5a">stops accepting</text>
    <rect x="358" y="186" width="143" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="429" y="208" font-size="12.5" font-weight="700" fill="#263e5a">finish requests</text>
    <text x="429" y="226" font-size="11.5" fill="#263e5a">already in flight</text>
    <rect x="525" y="186" width="143" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="596" y="208" font-size="12.5" font-weight="700" fill="#263e5a">close MongoDB</text>
    <text x="596" y="226" font-size="11.5" fill="#263e5a">and other pools</text>
    <rect x="692" y="186" width="144" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="764" y="208" font-size="12.5" font-weight="700" fill="#294a2e">exit code 0</text>
    <text x="764" y="226" font-size="11.5" fill="#294a2e">after about 1 s</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M167 212H189" marker-end="url(#sgs-arrow)"/>
      <path d="M334 212H356" marker-end="url(#sgs-arrow)"/>
      <path d="M501 212H523" marker-end="url(#sgs-arrow)"/>
      <path d="M668 212H690" marker-end="url(#sgs-arrow)"/>
    </g>
    <text x="24" y="264" font-size="11.5" fill="#36424e" text-anchor="start">The deploy moves on in about a second, no request is dropped, and SIGKILL is never needed.</text>

    <text x="430" y="306" font-size="13" fill="#40566b">Docker, Compose, and Kubernetes all send SIGTERM, wait a grace period, then SIGKILL.</text>
  </g>
</svg>
