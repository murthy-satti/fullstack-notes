<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="cls-title cls-desc">
  <title id="cls-title">Container lifecycle states</title>
  <desc id="cls-desc">docker create makes a container in the created state: its filesystem is ready but no process runs yet. docker run is create plus start. docker start moves it to running, where the process is alive. From running, docker pause freezes the process with the cgroup freezer (paused) and docker unpause resumes it. When the process exits on its own, or after docker stop or docker kill, the container is exited and keeps its exit code and writable layer. docker start runs an exited container again. If a restart policy applies, the daemon moves an exited container to restarting, waits with an increasing backoff, and starts it running again. docker rm moves an exited container to removed, deleting its writable layer. Two rare states also exist: removing while rm is in progress, and dead when removal failed.</desc>
  <defs>
    <marker id="cls-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cls-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="300" y="40" width="130" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="365" y="59" font-size="14" font-weight="700" fill="#463365">paused</text>
    <text x="365" y="75" font-size="11.5" fill="#463365">cgroup freezer</text>

    <rect x="40" y="160" width="130" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="105" y="181" font-size="14" font-weight="700" fill="#263e5a">created</text>
    <text x="105" y="198" font-size="11.5" fill="#263e5a">no process yet</text>

    <rect x="300" y="160" width="130" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="365" y="181" font-size="14" font-weight="700" fill="#294a2e">running</text>
    <text x="365" y="198" font-size="11.5" fill="#294a2e">process alive</text>

    <rect x="560" y="160" width="130" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="625" y="181" font-size="14" font-weight="700" fill="#66400f">exited</text>
    <text x="625" y="198" font-size="11.5" fill="#66400f">exit code kept</text>

    <rect x="430" y="300" width="130" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="495" y="321" font-size="14" font-weight="700" fill="#66400f">restarting</text>
    <text x="495" y="338" font-size="11.5" fill="#66400f">with backoff</text>

    <rect x="690" y="300" width="130" height="48" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="755" y="321" font-size="14" font-weight="700" fill="#6e2a24">removed</text>
    <text x="755" y="338" font-size="11.5" fill="#6e2a24">layer deleted</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M105 120V158" marker-end="url(#cls-arrow)"/>
      <path d="M170 184H298" marker-end="url(#cls-arrow)"/>
      <path d="M430 184H558" marker-end="url(#cls-arrow)"/>
      <path d="M345 160V86" marker-end="url(#cls-arrow)"/>
      <path d="M385 84V158" marker-end="url(#cls-arrow)"/>
      <path d="M640 208V324H562" marker-end="url(#cls-arrow)"/>
      <path d="M430 324H345V210" marker-end="url(#cls-arrow)"/>
      <path d="M690 184H755V298" marker-end="url(#cls-arrow)"/>
    </g>
    <path d="M590 208C590 252 405 252 405 210" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#cls-arrow-ret)"/>

    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="105" y="110">docker create</text>
      <text x="234" y="176">docker start</text>
      <text x="494" y="176">exit, stop, kill</text>
      <text x="337" y="126" text-anchor="end">pause</text>
      <text x="393" y="126" text-anchor="start">unpause</text>
      <text x="648" y="268" text-anchor="start">restart policy</text>
      <text x="337" y="268" text-anchor="end">starts again</text>
      <text x="763" y="250" text-anchor="start">docker rm</text>
    </g>
    <rect x="452" y="243" width="86" height="14" fill="#f5f7fb"/>
    <text x="495" y="254" font-size="11.5" font-weight="700" fill="#60788d">docker start</text>

    <text x="105" y="232" font-size="11.5" fill="#36424e">docker run = create + start</text>

    <text x="24" y="382" font-size="11.5" fill="#36424e" text-anchor="start">Rare states: removing (docker rm in progress) and dead (removal failed). docker stop sends SIGTERM, then SIGKILL after 10 s.</text>
    <text x="430" y="412" font-size="13" fill="#40566b">Only a running container has a live process; an exited one keeps its writable layer until it is removed.</text>
  </g>
</svg>
