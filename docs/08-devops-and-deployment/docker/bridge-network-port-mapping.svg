<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="bnp-title bnp-desc">
  <title id="bnp-title">A user-defined bridge network with published ports</title>
  <desc id="bnp-desc">A client on the LAN connects to the Docker host's eth0 address 192.0.2.10 on port 8080. The host's NAT rules translate port 8080 to 172.18.0.2 port 3000, the api container on the user-defined bridge network taskflow_default. Another LAN client tries port 27017 and the connection is refused, because MongoDB's port is published only on 127.0.0.1. A developer on the host uses mongosh or Compass against 127.0.0.1:27017, which the mapping -p 127.0.0.1:27017:27017 forwards to the mongo container at 172.18.0.3 port 27017. Inside the network, api connects to mongo:27017; the name is resolved by Docker's embedded DNS server at 127.0.0.11. The default bridge docker0 offers no DNS by container name. Outbound traffic from containers is masqueraded to the host's IP address.</desc>
  <defs>
    <marker id="bnp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="bnp-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="176" y="36" width="660" height="376" rx="10" fill="#eef1f5" fill-opacity="0.5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="188" y="56" font-size="12.5" font-weight="700" fill="#36424e" text-anchor="start">Docker host (Linux)</text>

    <rect x="24" y="74" width="136" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="92" y="93" font-size="13" font-weight="700" fill="#66400f">LAN client</text>
    <text x="92" y="110" font-size="11.5" fill="#66400f">to host:8080</text>
    <rect x="24" y="150" width="136" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="92" y="169" font-size="13" font-weight="700" fill="#66400f">LAN client</text>
    <text x="92" y="186" font-size="11.5" fill="#66400f">to host:27017</text>
    <rect x="24" y="242" width="136" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="92" y="261" font-size="13" font-weight="700" fill="#66400f">you on the host</text>
    <text x="92" y="278" font-size="11.5" fill="#66400f">mongosh, Compass</text>

    <rect x="196" y="74" width="170" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="281" y="93" font-size="13" font-weight="700" fill="#263e5a">eth0</text>
    <text x="281" y="110" font-size="11.5" fill="#263e5a">192.0.2.10</text>
    <rect x="196" y="150" width="170" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="281" y="169" font-size="13" font-weight="700" fill="#6e2a24">connection refused</text>
    <text x="281" y="186" font-size="11.5" fill="#6e2a24">only on 127.0.0.1</text>
    <rect x="196" y="242" width="170" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="281" y="261" font-size="13" font-weight="700" fill="#263e5a">lo</text>
    <text x="281" y="278" font-size="11.5" fill="#263e5a">127.0.0.1</text>

    <rect x="396" y="74" width="180" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="486" y="97" font-size="13" font-weight="700" fill="#463365">NAT rules (DNAT)</text>
    <text x="486" y="116" font-size="11.5" fill="#463365">8080 → 172.18.0.2:3000</text>

    <rect x="396" y="330" width="180" height="56" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="2"/>
    <text x="486" y="353" font-size="13" font-weight="700" fill="#36424e">docker0</text>
    <text x="486" y="371" font-size="11.5" fill="#36424e">default bridge, no name DNS</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="196" y="346">outbound traffic is</text>
      <text x="196" y="362">masqueraded to the</text>
      <text x="196" y="378">host's IP (SNAT)</text>
    </g>

    <rect x="600" y="50" width="220" height="340" rx="10" fill="#e5efff" fill-opacity="0.4" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="612" y="72" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="start">taskflow_default</text>
    <text x="612" y="88" font-size="11" fill="#263e5a" text-anchor="start">user-defined bridge 172.18.0.0/16</text>

    <rect x="620" y="100" width="180" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="710" y="123" font-size="14" font-weight="700" fill="#66400f">api</text>
    <text x="710" y="142" font-size="11.5" fill="#66400f">172.18.0.2, port 3000</text>
    <rect x="620" y="236" width="180" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="259" font-size="14" font-weight="700" fill="#263e5a">mongo</text>
    <text x="710" y="278" font-size="11.5" fill="#263e5a">172.18.0.3, port 27017</text>
    <rect x="620" y="322" width="180" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="710" y="342" font-size="12.5" font-weight="700" fill="#463365">embedded DNS</text>
    <text x="710" y="359" font-size="11.5" fill="#463365">127.0.0.11 in each container</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 96H194" marker-end="url(#bnp-arrow)"/>
      <path d="M366 96H394" marker-end="url(#bnp-arrow)"/>
      <path d="M576 104H598V128H618" marker-end="url(#bnp-arrow)"/>
      <path d="M160 264H194" marker-end="url(#bnp-arrow)"/>
      <path d="M366 264H618" marker-end="url(#bnp-arrow)"/>
      <path d="M710 156V234" marker-end="url(#bnp-arrow)"/>
    </g>
    <path d="M160 172H194" fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round" marker-end="url(#bnp-arrow-red)"/>

    <rect x="406" y="257" width="156" height="14" fill="#f5f7fb"/>
    <text x="484" y="268" font-size="11.5" fill="#36424e">-p 127.0.0.1:27017:27017</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="718" y="190">mongo:27017,</text>
      <text x="718" y="206">name resolved</text>
      <text x="718" y="222">by DNS</text>
    </g>
    <text x="486" y="160" font-size="11.5" fill="#36424e">from -p 8080:3000</text>

    <text x="430" y="434" font-size="13" fill="#40566b">Published ports are NAT rules on the host; containers reach each other by name on a user-defined bridge.</text>
  </g>
</svg>
