<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="ess-title ess-desc">
  <title id="ess-title">Syncing secrets from an external store</title>
  <desc id="ess-desc">With the External Secrets Operator, an ExternalSecret object stored in Git says which keys to fetch and from which SecretStore. The operator reads it, authenticates to the external secret store, such as AWS Secrets Manager or HashiCorp Vault, using the Pod's workload identity instead of a stored password, fetches the values, and writes a Kubernetes Secret named taskflow-api-secrets. It repeats every refreshInterval, so a value rotated in the store reaches the Secret. The Pod consumes the Secret as a mounted volume, which updates in place, or as environment variables, which need a rollout to pick up changes. Three approaches compared: External Secrets Operator syncs external values into native Secrets; the Secrets Store CSI Driver mounts values from the store directly into the Pod as files, with optional syncing to a Secret; Sealed Secrets keeps values encrypted in Git and a controller in the cluster decrypts them into Secrets.</desc>
  <defs>
    <marker id="ess-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ess-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">External Secrets Operator: the store stays the source of truth</text>

    <rect x="24" y="60" width="190" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="119" y="84" font-size="13" font-weight="700" fill="#263e5a">external secret store</text>
    <text x="119" y="102" font-size="11.5" fill="#263e5a">Secrets Manager, Vault,</text>
    <text x="119" y="117" font-size="11.5" fill="#263e5a">Key Vault, Secret Manager</text>

    <rect x="290" y="60" width="200" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="84" font-size="13" font-weight="700" fill="#463365">External Secrets Operator</text>
    <text x="390" y="102" font-size="11.5" fill="#463365">controller in the cluster,</text>
    <text x="390" y="117" font-size="11.5" fill="#463365">repeats every refreshInterval</text>

    <rect x="290" y="186" width="200" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="208" font-size="13" font-weight="700" fill="#66400f">ExternalSecret (in Git)</text>
    <text x="390" y="226" font-size="11.5" fill="#66400f">which keys, from which store</text>

    <rect x="560" y="60" width="150" height="64" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="635" y="84" font-size="13" font-weight="700" fill="#6e2a24">Secret</text>
    <text x="635" y="102" font-size="11.5" fill="#6e2a24">taskflow-api-secrets</text>
    <text x="635" y="117" font-size="11.5" fill="#6e2a24">created and updated</text>

    <rect x="746" y="60" width="90" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="791" y="88" font-size="13" font-weight="700" fill="#294a2e">Pod</text>
    <text x="791" y="106" font-size="11.5" fill="#294a2e">file or env</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M390 186V126" marker-end="url(#ess-arrow)"/>
      <path d="M290 80H216" marker-end="url(#ess-arrow)"/>
      <path d="M490 92H558" marker-end="url(#ess-arrow)"/>
      <path d="M710 92H744" marker-end="url(#ess-arrow)"/>
    </g>
    <path d="M216 108H288" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ess-arrow-ret)"/>
    <g font-size="11" fill="#36424e">
      <text x="253" y="74">fetch</text>
      <text x="253" y="140">values</text>
      <text x="524" y="84">write</text>
      <text x="398" y="160" text-anchor="start">reads the spec</text>
    </g>
    <text x="24" y="150" font-size="11" fill="#36424e" text-anchor="start">authenticated with workload</text>
    <text x="24" y="165" font-size="11" fill="#36424e" text-anchor="start">identity, not a stored password</text>
    <text x="560" y="150" font-size="11" fill="#36424e" text-anchor="start">rotation in the store reaches the</text>
    <text x="560" y="165" font-size="11" fill="#36424e" text-anchor="start">Secret on the next refresh; mounted</text>
    <text x="560" y="180" font-size="11" fill="#36424e" text-anchor="start">files update, env vars need a rollout</text>

    <path d="M24 266H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="292" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Three common approaches</text>

    <g stroke-width="2">
      <rect x="24" y="306" width="260" height="92" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="300" y="306" width="260" height="92" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="576" y="306" width="260" height="92" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <text x="154" y="328" font-size="12.5" font-weight="700" fill="#463365">External Secrets Operator</text>
    <g font-size="11.5" fill="#463365">
      <text x="154" y="350">syncs store values into</text>
      <text x="154" y="367">native Kubernetes Secrets;</text>
      <text x="154" y="384">apps need no changes</text>
    </g>
    <text x="430" y="328" font-size="12.5" font-weight="700" fill="#263e5a">Secrets Store CSI Driver</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="430" y="350">mounts store values into the</text>
      <text x="430" y="367">Pod as files; syncing to a</text>
      <text x="430" y="384">Secret is optional</text>
    </g>
    <text x="706" y="328" font-size="12.5" font-weight="700" fill="#66400f">Sealed Secrets</text>
    <g font-size="11.5" fill="#66400f">
      <text x="706" y="350">encrypted values live in Git;</text>
      <text x="706" y="367">a controller in the cluster</text>
      <text x="706" y="384">decrypts them into Secrets</text>
    </g>

    <text x="430" y="432" font-size="13" fill="#40566b">Keep real secret values out of Git and out of images; let a controller deliver them.</text>
  </g>
</svg>
