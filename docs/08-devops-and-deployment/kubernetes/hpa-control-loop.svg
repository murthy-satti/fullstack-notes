<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="hpa-title hpa-desc">
  <title id="hpa-title">The HorizontalPodAutoscaler control loop with numbers</title>
  <desc id="hpa-desc">Four taskflow-api Pods each request 250m of CPU. The kubelets report their usage to metrics-server, which serves it through the metrics.k8s.io API. Every 15 seconds the HPA controller reads it and computes the desired replica count, then sets the Deployment's replicas from 4 to 6, and the ReplicaSet adds 2 Pods. If there is no room for the new Pods they stay Pending, and the Cluster Autoscaler or Karpenter adds a node. The calculation: current 4 replicas, average CPU 225m of the 250m request, which is 90 percent; target averageUtilization 60 percent; desired equals ceil of 4 times 90 divided by 60, which is ceil of 6.0, which is 6; that is within minReplicas 3 and maxReplicas 10, so the Deployment scales to 6. After the new Pods are ready, the same 900m of total usage spread over 6 Pods is 150m each, 60 percent, a ratio of 1.0 inside the 0.1 tolerance, so nothing changes. When load later drops to 20 percent, ceil of 6 times 20 divided by 60 equals 2, which is raised to minReplicas 3 and applied only after the 5 minute scale-down stabilization window.</desc>
  <defs>
    <marker id="hpa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="hpa-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="200" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="124" y="63" font-size="13.5" font-weight="700" fill="#294a2e">taskflow-api Pods</text>
    <text x="124" y="82" font-size="11.5" fill="#294a2e">4 running, request 250m</text>

    <rect x="270" y="40" width="200" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="370" y="63" font-size="13.5" font-weight="700" fill="#463365">metrics-server</text>
    <text x="370" y="82" font-size="11.5" fill="#463365">CPU usage via kubelets</text>

    <rect x="270" y="200" width="200" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="370" y="223" font-size="13.5" font-weight="700" fill="#263e5a">HPA controller</text>
    <text x="370" y="242" font-size="11.5" fill="#263e5a">every 15 s: compute</text>

    <rect x="24" y="200" width="200" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="124" y="223" font-size="13.5" font-weight="700" fill="#66400f">Deployment scale</text>
    <text x="124" y="242" font-size="11.5" fill="#66400f">replicas 4 → 6</text>

    <rect x="24" y="332" width="446" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="247" y="353" font-size="13" font-weight="700" fill="#36424e">Cluster Autoscaler or Karpenter</text>
    <text x="247" y="371" font-size="11.5" fill="#36424e">adds a node when the new Pods are Pending for lack of room</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M224 69H268" marker-end="url(#hpa-arrow)"/>
      <path d="M370 98V198" marker-end="url(#hpa-arrow)"/>
      <path d="M270 229H226" marker-end="url(#hpa-arrow)"/>
      <path d="M124 200V100" marker-end="url(#hpa-arrow)"/>
    </g>
    <path d="M124 258V330" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hpa-arrow-ret)"/>
    <g font-size="11.5" fill="#36424e">
      <text x="246" y="62">usage</text>
      <text x="378" y="146" text-anchor="start">metrics.k8s.io</text>
      <text x="378" y="162" text-anchor="start">API</text>
      <text x="248" y="222">set</text>
      <text x="116" y="146" text-anchor="end">ReplicaSet</text>
      <text x="116" y="162" text-anchor="end">adds 2 Pods</text>
      <text x="132" y="300" text-anchor="start">if no room</text>
    </g>

    <rect x="494" y="40" width="342" height="344" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="510" y="64" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">The calculation</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="510" y="90">current: 4 replicas</text>
      <text x="510" y="108">average CPU: 225m of 250m requested = 90%</text>
      <text x="510" y="126">target: averageUtilization 60%</text>
      <text x="510" y="152" font-weight="700" fill="#263e5a">desired = ceil(4 × 90 / 60) = ceil(6.0) = 6</text>
      <text x="510" y="170">within minReplicas 3, maxReplicas 10: scale to 6</text>
      <text x="510" y="204" font-weight="700" fill="#294a2e">after the new Pods are ready</text>
      <text x="510" y="222">900m spread over 6 Pods = 150m = 60%:</text>
      <text x="510" y="240">ratio 1.0, inside the 0.1 tolerance,</text>
      <text x="510" y="258">so nothing changes</text>
      <text x="510" y="292" font-weight="700" fill="#66400f">later, load drops to 20%</text>
      <text x="510" y="310">ceil(6 × 20 / 60) = 2, raised to</text>
      <text x="510" y="328">minReplicas 3, applied only after the</text>
      <text x="510" y="346">5-minute scale-down stabilization window</text>
    </g>

    <text x="430" y="420" font-size="12" fill="#36424e">desiredReplicas = ceil(currentReplicas × currentMetricValue / targetMetricValue)</text>
    <text x="430" y="452" font-size="13" fill="#40566b">Utilization is measured against requests: without CPU requests the HPA cannot compute a percentage.</text>
  </g>
</svg>
