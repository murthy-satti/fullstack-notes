<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="cpn-title cpn-desc">
  <title id="cpn-title">Kubernetes control plane and worker nodes</title>
  <desc id="cpn-desc">Users and automation (kubectl, CI/CD, GitOps) send requests to kube-apiserver in the control plane. kube-apiserver is the only component that talks to etcd, which holds the cluster state replicated with Raft. cloud-controller-manager, kube-scheduler, and kube-controller-manager each watch and update objects through the API server; cloud-controller-manager also calls the cloud provider API to create load balancers, disks, and VMs. Three worker nodes each run a kubelet, kube-proxy, and a container runtime such as containerd, and host Pods. The kubelets watch the API server for Pods bound to their node and report status back over the same connection.</desc>
  <defs>
    <marker id="cpn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cpn-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="180" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="114" y="44" font-size="13" font-weight="700" fill="#66400f">kubectl, CI/CD, GitOps</text>
    <text x="114" y="62" font-size="11.5" fill="#66400f">desired state in YAML</text>
    <rect x="620" y="24" width="200" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="720" y="44" font-size="13" font-weight="700" fill="#263e5a">cloud provider API</text>
    <text x="720" y="62" font-size="11.5" fill="#263e5a">load balancers, disks, VMs</text>

    <rect x="24" y="92" width="812" height="152" rx="10" fill="#e5efff" fill-opacity="0.35" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="36" y="112" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="start">control plane (managed for you on EKS, GKE, AKS)</text>

    <rect x="40" y="150" width="200" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="140" y="170" font-size="14" font-weight="700" fill="#263e5a">etcd</text>
    <text x="140" y="188" font-size="11.5" fill="#263e5a">cluster state (Raft)</text>

    <rect x="300" y="122" width="260" height="110" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="166" font-size="14" font-weight="700" fill="#263e5a">kube-apiserver</text>
    <text x="430" y="186" font-size="11.5" fill="#263e5a">REST API, authn, authz, admission;</text>
    <text x="430" y="202" font-size="11.5" fill="#263e5a">the only component that talks to etcd</text>

    <g stroke="#8062a8" stroke-width="2" fill="#f0e9fb">
      <rect x="620" y="122" width="200" height="32" rx="8"/>
      <rect x="620" y="162" width="200" height="32" rx="8"/>
      <rect x="620" y="202" width="200" height="32" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="720" y="143">cloud-controller-manager</text>
      <text x="720" y="183">kube-scheduler</text>
      <text x="720" y="223">kube-controller-manager</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M204 48H430V120" marker-end="url(#cpn-arrow)"/>
      <path d="M242 174H298" marker-start="url(#cpn-arrow-start)" marker-end="url(#cpn-arrow)"/>
      <path d="M562 138H618" marker-start="url(#cpn-arrow-start)" marker-end="url(#cpn-arrow)"/>
      <path d="M562 178H618" marker-start="url(#cpn-arrow-start)" marker-end="url(#cpn-arrow)"/>
      <path d="M562 218H618" marker-start="url(#cpn-arrow-start)" marker-end="url(#cpn-arrow)"/>
      <path d="M720 120V74" marker-end="url(#cpn-arrow)"/>
      <path d="M430 234V256"/>
