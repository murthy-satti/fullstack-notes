      <rect x="160" y="298" width="116" height="32" rx="8" fill="#ffffff" stroke="#8a96a3"/>
      <rect x="36" y="338" width="240" height="30" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="36" y="376" width="116" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="160" y="376" width="116" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="310" y="298" width="116" height="32" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="434" y="298" width="116" height="32" rx="8" fill="#ffffff" stroke="#8a96a3"/>
      <rect x="310" y="338" width="240" height="30" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="310" y="376" width="116" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="434" y="376" width="116" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="584" y="298" width="116" height="32" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="708" y="298" width="116" height="32" rx="8" fill="#ffffff" stroke="#8a96a3"/>
      <rect x="584" y="338" width="240" height="30" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="584" y="376" width="116" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="708" y="376" width="116" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="94" y="319" fill="#263e5a">kubelet</text>
      <text x="218" y="319" fill="#36424e">kube-proxy</text>
      <text x="156" y="358" fill="#463365">container runtime (containerd)</text>
      <text x="94" y="403" fill="#294a2e">Pod</text>
      <text x="218" y="403" fill="#294a2e">Pod</text>
      <text x="368" y="319" fill="#263e5a">kubelet</text>
      <text x="492" y="319" fill="#36424e">kube-proxy</text>
      <text x="430" y="358" fill="#463365">container runtime (containerd)</text>
      <text x="368" y="403" fill="#294a2e">Pod</text>
      <text x="492" y="403" fill="#294a2e">Pod</text>
      <text x="642" y="319" fill="#263e5a">kubelet</text>
      <text x="766" y="319" fill="#36424e">kube-proxy</text>
      <text x="704" y="358" fill="#463365">container runtime (containerd)</text>
      <text x="642" y="403" fill="#294a2e">Pod</text>
      <text x="766" y="403" fill="#294a2e">Pod</text>
    </g>

    <text x="430" y="462" font-size="13" fill="#40566b">The control plane decides; the nodes run. All communication goes through the API server.</text>
  </g>
</svg>
