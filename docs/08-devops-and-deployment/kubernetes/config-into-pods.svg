<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="cip-title cip-desc">
  <title id="cip-title">How ConfigMaps and Secrets reach a Pod</title>
  <desc id="cip-desc">The ConfigMap taskflow-api-config holds LOG_LEVEL: info, TASKS_PAGE_SIZE: 50, and a features.json file. The Secret taskflow-api-secrets, of type Opaque, holds mongodb-uri and jwt-secret as base64-encoded values. Four delivery paths lead into the taskflow-api Pod. envFrom turns the ConfigMap keys into environment variables, set once when the container starts. A ConfigMap volume mount places features.json at /etc/taskflow/features.json, a file the kubelet updates in place. A secretKeyRef sets the MONGODB_URI environment variable from the Secret. A Secret volume mounts jwt-secret as a file under /var/run/secrets/taskflow on in-memory tmpfs. Environment variables are read once at container start, while mounted files are refreshed by the kubelet, except when mounted with subPath. Secret values are base64-encoded, not encrypted; enable encryption at rest and restrict get and list with RBAC.</desc>
  <defs>
    <marker id="cip-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="30" width="260" height="130" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="154" y="54" font-size="13" font-weight="700" fill="#463365">ConfigMap taskflow-api-config</text>
    <g font-size="11.5" fill="#463365" text-anchor="start">
      <text x="40" y="82">LOG_LEVEL: info</text>
      <text x="40" y="104">TASKS_PAGE_SIZE: "50"</text>
      <text x="40" y="126">features.json: { ... }</text>
    </g>

    <rect x="24" y="190" width="260" height="130" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="154" y="214" font-size="13" font-weight="700" fill="#6e2a24">Secret taskflow-api-secrets</text>
    <g font-size="11.5" fill="#6e2a24" text-anchor="start">
      <text x="40" y="240">type: Opaque</text>
      <text x="40" y="264">mongodb-uri: bW9uZ29k... (base64)</text>
      <text x="40" y="288">jwt-secret: c2VjcmV0... (base64)</text>
    </g>

    <rect x="520" y="24" width="316" height="300" rx="10" fill="#e7f3e9" fill-opacity="0.4" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="532" y="44" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="start">Pod: taskflow-api</text>
    <g stroke-width="2">
      <rect x="532" y="56" width="292" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="532" y="120" width="292" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="532" y="184" width="292" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="532" y="248" width="292" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f" text-anchor="start">
      <text x="544" y="77">env LOG_LEVEL, TASKS_PAGE_SIZE</text>
      <text x="544" y="141">/etc/taskflow/features.json</text>
      <text x="544" y="205">env MONGODB_URI</text>
      <text x="544" y="269">/var/run/secrets/taskflow/jwt-secret</text>
    </g>
    <g font-size="11" fill="#66400f" text-anchor="start">
      <text x="544" y="96">set once when the container starts</text>
      <text x="544" y="160">file, updated in place by the kubelet</text>
      <text x="544" y="224">set once when the container starts</text>
      <text x="544" y="288">file on in-memory tmpfs, updated in place</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M284 82L530 82" marker-end="url(#cip-arrow)"/>
      <path d="M284 126L530 146" marker-end="url(#cip-arrow)"/>
      <path d="M284 264L530 210" marker-end="url(#cip-arrow)"/>
      <path d="M284 288L530 274" marker-end="url(#cip-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <rect x="362" y="68" width="90" height="14" fill="#f5f7fb"/>
      <text x="407" y="79">envFrom</text>
      <rect x="352" y="125" width="110" height="14" fill="#f5f7fb"/>
      <text x="407" y="136">volume mount</text>
      <rect x="352" y="230" width="110" height="14" fill="#f5f7fb"/>
      <text x="407" y="241">secretKeyRef</text>
      <rect x="352" y="274" width="110" height="14" fill="#f5f7fb"/>
      <text x="407" y="285">secret volume</text>
    </g>

    <path d="M24 344H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="366">Env vars are read once at container start; mounted files are refreshed by the kubelet (never with subPath).</text>
      <text x="24" y="386">Secret values are base64-encoded, not encrypted: enable encryption at rest and restrict get and list with RBAC.</text>
    </g>
    <text x="430" y="422" font-size="13" fill="#40566b">The same image runs everywhere; each environment supplies its own ConfigMaps and Secrets.</text>
  </g>
</svg>
