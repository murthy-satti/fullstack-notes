<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="sls-title sls-desc">
  <title id="sls-title">A Service selects Pods by label</title>
  <desc id="sls-desc">The Service taskflow-api has type ClusterIP with the virtual IP 10.96.12.34, maps port 80 to targetPort 3000, and selects Pods with the label app=taskflow-api. Four Pods exist. Pod A at 10.244.1.5 and Pod B at 10.244.2.7 carry app=taskflow-api and pass readiness. Pod C at 10.244.3.9 carries app=taskflow-api but its readiness probe is failing. Pod D at 10.244.1.8 carries app=taskflow-web and is not selected. The EndpointSlice controller writes an EndpointSlice for the Service listing 10.244.1.5:3000 ready, 10.244.2.7:3000 ready, and 10.244.3.9:3000 not ready. kube-proxy and cluster DNS read the EndpointSlice, so traffic to 10.96.12.34:80 goes only to Pods A and B.</desc>
  <defs>
    <marker id="sls-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="30" width="290" height="104" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="169" y="54" font-size="14" font-weight="700" fill="#263e5a">Service: taskflow-api</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="169" y="76">type ClusterIP, IP 10.96.12.34</text>
      <text x="169" y="94">port 80 → targetPort 3000</text>
      <text x="169" y="114" font-weight="700">selector: app=taskflow-api</text>
    </g>

    <rect x="24" y="190" width="290" height="132" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="169" y="214" font-size="13.5" font-weight="700" fill="#463365">EndpointSlice (generated)</text>
    <g font-size="11.5" text-anchor="start">
      <text x="44" y="242" fill="#294a2e">10.244.1.5:3000   ready</text>
      <text x="44" y="266" fill="#294a2e">10.244.2.7:3000   ready</text>
      <text x="44" y="290" fill="#6e2a24">10.244.3.9:3000   not ready</text>
    </g>
    <path d="M169 134V188" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#sls-arrow)"/>
    <rect x="177" y="154" width="128" height="14" fill="#f5f7fb"/>
    <text x="181" y="165" font-size="11" fill="#36424e" text-anchor="start">controller writes it</text>

    <rect x="420" y="30" width="416" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="436" y="53" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Pod A  10.244.1.5</text>
    <text x="436" y="73" font-size="11.5" fill="#294a2e" text-anchor="start">app=taskflow-api, ready</text>
    <rect x="420" y="100" width="416" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="436" y="123" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Pod B  10.244.2.7</text>
    <text x="436" y="143" font-size="11.5" fill="#294a2e" text-anchor="start">app=taskflow-api, ready</text>
    <rect x="420" y="170" width="416" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="436" y="193" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Pod C  10.244.3.9</text>
    <text x="436" y="213" font-size="11.5" fill="#6e2a24" text-anchor="start">app=taskflow-api, readiness probe failing</text>
    <rect x="420" y="240" width="416" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="436" y="263" font-size="13" font-weight="700" fill="#36424e" text-anchor="start">Pod D  10.244.1.8</text>
    <text x="436" y="283" font-size="11.5" fill="#36424e" text-anchor="start">app=taskflow-web: labels do not match, not selected</text>

    <g fill="none" stroke="#53845b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M314 70H360V58H418" marker-end="url(#sls-arrow)"/>
      <path d="M360 70V128H418" marker-end="url(#sls-arrow)"/>
      <path d="M360 128V198H418" marker-end="url(#sls-arrow)"/>
    </g>
    <rect x="322" y="20" width="76" height="14" fill="#f5f7fb"/>
    <text x="360" y="31" font-size="11" font-weight="700" fill="#294a2e">label match</text>

    <path d="M24 344H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="368" font-size="11.5" fill="#36424e" text-anchor="start">kube-proxy and cluster DNS read the EndpointSlice: traffic to 10.96.12.34:80 reaches only Pods A and B on port 3000.</text>
    <text x="430" y="402" font-size="13" fill="#40566b">Selection is by label, not by name; readiness decides which selected Pods receive traffic.</text>
  </g>
</svg>
