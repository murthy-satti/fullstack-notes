<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="cjp-title cjp-desc">
  <title id="cjp-title">CronJob, Job, and Pod over time</title>
  <desc id="cjp-desc">The CronJob task-digest runs on the schedule */15 * * * * in time zone Etc/UTC with concurrencyPolicy Forbid and keeps 3 successful and 1 failed Job in its history. At each schedule tick it creates a Job, whose spec sets completions 1, parallelism 1, backoffLimit 3, activeDeadlineSeconds 1800, and ttlSecondsAfterFinished 86400, and whose Pod template uses restartPolicy Never. At 02:00 a Job is created. Its first Pod exits with code 1, and after a back-off delay the Job controller creates a second Pod, which exits with code 0, so the Job completes at about 02:20. At 02:15 the earlier Job is still running, so with Forbid the CronJob skips that run. At 02:30 a new Job is created and its Pod is running. Failed Pods are replaced with exponential back-off delays of 10, 20, 40 seconds and so on, capped at six minutes, until backoffLimit is reached.</desc>
  <defs>
    <marker id="cjp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="250" height="124" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="149" y="47" font-size="14" font-weight="700" fill="#66400f">CronJob: task-digest</text>
    <g font-size="11.5" fill="#66400f" text-anchor="start">
      <text x="40" y="71">schedule: "*/15 * * * *"</text>
      <text x="40" y="90">timeZone: Etc/UTC</text>
      <text x="40" y="109">concurrencyPolicy: Forbid</text>
      <text x="40" y="128">history: 3 succeeded, 1 failed</text>
    </g>

    <rect x="330" y="24" width="506" height="124" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="583" y="47" font-size="14" font-weight="700" fill="#263e5a">jobTemplate: each run creates a Job</text>
    <g font-size="11.5" fill="#263e5a" text-anchor="start">
      <text x="346" y="71">completions: 1, parallelism: 1, backoffLimit: 3</text>
      <text x="346" y="90">activeDeadlineSeconds: 1800 (fail the run after 30 min)</text>
      <text x="346" y="109">ttlSecondsAfterFinished: 86400 (delete it a day later)</text>
      <text x="346" y="128">Pod template: restartPolicy: Never</text>
    </g>
    <path d="M274 86H328" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cjp-arrow)"/>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="206">schedule ticks</text>
      <text x="24" y="262">Jobs</text>
      <text x="24" y="318">Pods</text>
    </g>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="3 3">
      <path d="M300 176V340"/>
      <path d="M500 176V340"/>
      <path d="M700 176V340"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="300" y="172">02:00</text>
      <text x="500" y="172">02:15</text>
      <text x="700" y="172">02:30</text>
    </g>

    <rect x="306" y="190" width="100" height="24" rx="12" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="356" y="206" font-size="11" font-weight="700" fill="#294a2e">Job created</text>
    <rect x="506" y="190" width="150" height="24" rx="12" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="581" y="206" font-size="11" font-weight="700" fill="#66400f">skipped: still running</text>
    <rect x="706" y="190" width="100" height="24" rx="12" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="756" y="206" font-size="11" font-weight="700" fill="#294a2e">Job created</text>

    <rect x="300" y="244" width="267" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="433" y="263" font-size="11.5" fill="#294a2e">Job 02:00: Complete after 2 attempts</text>
    <rect x="700" y="244" width="136" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="768" y="263" font-size="11.5" fill="#263e5a">Job 02:30: active</text>

    <rect x="300" y="300" width="80" height="28" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="340" y="319" font-size="11.5" fill="#6e2a24">exit 1</text>
    <rect x="394" y="300" width="173" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="480" y="319" font-size="11.5" fill="#294a2e">retry after back-off: exit 0</text>
    <rect x="700" y="300" width="136" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="768" y="319" font-size="11.5" fill="#263e5a">Pod running</text>

    <path d="M24 356H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="380">Failed Pods are replaced after 10 s, 20 s, 40 s, ... (capped at 6 minutes) until backoffLimit is reached; then the Job fails.</text>
      <text x="24" y="400">With Forbid, a run that would overlap a running Job is skipped; Replace would stop the old Job; Allow would run both.</text>
      <text x="24" y="420">Schedules are "approximately once": make every run idempotent so a duplicate or missed run is harmless.</text>
    </g>
    <text x="430" y="454" font-size="13" fill="#40566b">The CronJob creates Jobs on a schedule; each Job retries Pods until one succeeds or it gives up.</text>
  </g>
</svg>
