<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="ssv-title ssv-desc">
  <title id="ssv-title">A StatefulSet with stable names and one volume per Pod</title>
  <desc id="ssv-desc">The StatefulSet mongo has 3 replicas, serviceName mongo, and a volumeClaimTemplate named data requesting 10Gi. The headless Service mongo, with clusterIP None, gives each Pod a DNS name such as mongo-0.mongo.taskflow.svc.cluster.local. The controller creates the Pods in order: mongo-0 first, mongo-1 once mongo-0 is Ready, then mongo-2. Each Pod gets its own PersistentVolumeClaim from the template, data-mongo-0, data-mongo-1, and data-mongo-2, each 10Gi with access mode ReadWriteOnce, and each claim is bound to its own dynamically provisioned PersistentVolume, a cloud disk in zones a, b, and c. If mongo-1 is rescheduled it keeps its name and reattaches data-mongo-1; scaling down removes mongo-2 first; the claims are kept unless the retention policy says Delete.</desc>
  <defs>
    <marker id="ssv-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="380" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="214" y="47" font-size="14" font-weight="700" fill="#66400f">StatefulSet: mongo</text>
    <text x="214" y="67" font-size="11.5" fill="#66400f">replicas: 3, serviceName: mongo</text>
    <text x="214" y="85" font-size="11.5" fill="#66400f">volumeClaimTemplates: data (10Gi)</text>

    <rect x="456" y="24" width="380" height="76" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="646" y="47" font-size="14" font-weight="700" fill="#263e5a">headless Service: mongo</text>
    <text x="646" y="67" font-size="11.5" fill="#263e5a">clusterIP: None, one DNS name per Pod</text>
    <text x="646" y="85" font-size="11.5" fill="#263e5a">mongo-0.mongo.taskflow.svc.cluster.local</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="24" y="150" width="252" height="60" rx="8"/>
      <rect x="304" y="150" width="252" height="60" rx="8"/>
      <rect x="584" y="150" width="252" height="60" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="150" y="174" font-size="14" font-weight="700">Pod mongo-0</text>
      <text x="150" y="194" font-size="11.5">mongo-0.mongo.taskflow.svc</text>
      <text x="430" y="174" font-size="14" font-weight="700">Pod mongo-1</text>
      <text x="430" y="194" font-size="11.5">mongo-1.mongo.taskflow.svc</text>
      <text x="710" y="174" font-size="14" font-weight="700">Pod mongo-2</text>
      <text x="710" y="194" font-size="11.5">mongo-2.mongo.taskflow.svc</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 100V148" marker-end="url(#ssv-arrow)"/>
      <path d="M214 100V124H430V148" marker-end="url(#ssv-arrow)"/>
      <path d="M300 100V116H710V148" marker-end="url(#ssv-arrow)"/>
      <path d="M150 210V248" marker-end="url(#ssv-arrow)"/>
      <path d="M430 210V248" marker-end="url(#ssv-arrow)"/>
      <path d="M710 210V248" marker-end="url(#ssv-arrow)"/>
      <path d="M150 300V338" marker-end="url(#ssv-arrow)"/>
      <path d="M430 300V338" marker-end="url(#ssv-arrow)"/>
      <path d="M710 300V338" marker-end="url(#ssv-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <rect x="114" y="117" width="28" height="14" fill="#f5f7fb"/>
      <text x="128" y="128">1st</text>
      <rect x="444" y="129" width="112" height="14" fill="#f5f7fb"/>
      <text x="500" y="140">2nd, after 0 Ready</text>
      <rect x="724" y="129" width="112" height="14" fill="#f5f7fb"/>
      <text x="780" y="140">3rd, after 1 Ready</text>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="158" y="233">mounts</text>
      <text x="438" y="233">mounts</text>
      <text x="718" y="233">mounts</text>
      <text x="158" y="323">bound</text>
      <text x="438" y="323">bound</text>
      <text x="718" y="323">bound</text>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="24" y="250" width="252" height="50" rx="8"/>
      <rect x="304" y="250" width="252" height="50" rx="8"/>
      <rect x="584" y="250" width="252" height="50" rx="8"/>
    </g>
    <g fill="#463365">
      <text x="150" y="271" font-size="12.5" font-weight="700">PVC data-mongo-0</text>
      <text x="150" y="289" font-size="11">10Gi, ReadWriteOnce</text>
      <text x="430" y="271" font-size="12.5" font-weight="700">PVC data-mongo-1</text>
      <text x="430" y="289" font-size="11">10Gi, ReadWriteOnce</text>
      <text x="710" y="271" font-size="12.5" font-weight="700">PVC data-mongo-2</text>
      <text x="710" y="289" font-size="11">10Gi, ReadWriteOnce</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="24" y="340" width="252" height="50" rx="8"/>
      <rect x="304" y="340" width="252" height="50" rx="8"/>
      <rect x="584" y="340" width="252" height="50" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="150" y="361" font-size="12.5" font-weight="700">PV: cloud disk</text>
      <text x="150" y="379" font-size="11">zone a, provisioned by CSI</text>
      <text x="430" y="361" font-size="12.5" font-weight="700">PV: cloud disk</text>
      <text x="430" y="379" font-size="11">zone b, provisioned by CSI</text>
      <text x="710" y="361" font-size="12.5" font-weight="700">PV: cloud disk</text>
      <text x="710" y="379" font-size="11">zone c, provisioned by CSI</text>
    </g>

    <path d="M24 408H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="430" font-size="11.5" fill="#36424e" text-anchor="start">A rescheduled mongo-1 keeps its name and reattaches data-mongo-1. Scale-down removes mongo-2 first; PVCs are kept by default.</text>
    <text x="430" y="464" font-size="13" fill="#40566b">Each replica owns a name, a DNS record, and a disk that follow it wherever it is scheduled.</text>
  </g>
</svg>
