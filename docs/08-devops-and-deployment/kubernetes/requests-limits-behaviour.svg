<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="rlb-title rlb-desc">
  <title id="rlb-title">What happens between and beyond requests and limits</title>
  <desc id="rlb-desc">CPU, for a container with a request of 250m and a limit of 500m: usage within the request is a guaranteed share of CPU time under contention; usage between the request and the limit uses idle CPU on the node when available; at the 500m limit the container is throttled in each 100 millisecond period, so it gets slower but is never killed. Memory, for a container with a request of 256Mi and a limit of 512Mi: usage within the request has the lowest eviction risk; usage above the request is allowed but makes the Pod among the first evicted when the node runs short of memory; reaching the 512Mi limit gets the container OOMKilled with exit code 137, and it is restarted. The scheduler places Pods using requests only. QoS classes: requests equal to limits for every container gives Guaranteed, some requests or limits gives Burstable, and none gives BestEffort, which is evicted first.</desc>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">CPU: request 250m, limit 500m (compressible)</text>
    <rect x="40" y="70" width="195" height="30" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="235" y="70" width="195" height="30" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="430" y="70" width="390" height="30" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <path d="M235 58V108M430 58V108" stroke="#40566b" stroke-width="2"/>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="235" y="54">request 250m</text>
      <text x="430" y="54">limit 500m</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="40" y="118" text-anchor="start">0</text>
      <text x="820" y="118" text-anchor="end">usage →</text>
    </g>
    <g font-size="11.5">
      <text x="137" y="140" font-weight="700" fill="#294a2e">within request</text>
      <text x="137" y="157" fill="#294a2e">guaranteed share of CPU</text>
      <text x="332" y="140" font-weight="700" fill="#263e5a">request to limit</text>
      <text x="332" y="157" fill="#263e5a">uses idle CPU if available</text>
      <text x="625" y="140" font-weight="700" fill="#66400f">at the limit</text>
      <text x="625" y="157" fill="#66400f">throttled every 100 ms period: slower, never killed</text>
    </g>

    <path d="M24 180H836" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="210" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Memory: request 256Mi, limit 512Mi (not compressible)</text>
    <rect x="40" y="248" width="260" height="30" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="300" y="248" width="260" height="30" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="560" y="248" width="260" height="30" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <path d="M300 236V286M560 236V286" stroke="#40566b" stroke-width="2"/>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="300" y="232">request 256Mi</text>
      <text x="560" y="232">limit 512Mi</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="40" y="296" text-anchor="start">0</text>
      <text x="820" y="296" text-anchor="end">usage →</text>
    </g>
    <g font-size="11.5">
      <text x="170" y="318" font-weight="700" fill="#294a2e">within request</text>
      <text x="170" y="335" fill="#294a2e">lowest eviction risk</text>
      <text x="430" y="318" font-weight="700" fill="#66400f">above request</text>
      <text x="430" y="335" fill="#66400f">first evicted under node memory pressure</text>
      <text x="690" y="318" font-weight="700" fill="#6e2a24">reaching the limit</text>
      <text x="690" y="335" fill="#6e2a24">OOMKilled (exit 137), restarted</text>
    </g>

    <path d="M24 358H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="380">The scheduler places Pods by their requests only; limits are enforced on the node by cgroups.</text>
      <text x="24" y="398">QoS: requests = limits for every container: Guaranteed; some set: Burstable; none: BestEffort (evicted first).</text>
    </g>
    <text x="430" y="434" font-size="13" fill="#40566b">Too little CPU makes a container slow; too little memory makes it die.</text>
  </g>
</svg>
