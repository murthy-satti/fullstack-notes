      <text x="470" y="194" fill="#66400f">you: the image</text>
      <text x="620" y="194" fill="#66400f">you: the image</text>
      <text x="770" y="194" fill="#263e5a">provider runtime</text>
      <text x="320" y="244" fill="#66400f">you</text>
      <text x="470" y="244" fill="#463365">managed nodes</text>
      <text x="620" y="244" fill="#263e5a">provider</text>
      <text x="770" y="244" fill="#263e5a">provider</text>
      <text x="320" y="294" fill="#263e5a">provider</text>
      <text x="470" y="294" fill="#263e5a">provider</text>
      <text x="620" y="294" fill="#263e5a">provider</text>
      <text x="770" y="294" fill="#263e5a">provider</text>
    </g>

    <path d="M258 336H832" fill="none" stroke="#40566b" stroke-width="2" marker-start="url(#csp-arrow-start)" marker-end="url(#csp-arrow)"/>
    <g font-size="11.5" fill="#40566b">
      <text x="250" y="356" text-anchor="start">more control, more to operate</text>
      <text x="840" y="356" text-anchor="end">less to operate, less control</text>
    </g>

    <rect x="250" y="372" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="270" y="384" font-size="11.5" fill="#36424e" text-anchor="start">you manage</text>
    <rect x="370" y="372" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="390" y="384" font-size="11.5" fill="#36424e" text-anchor="start">shared</text>
    <rect x="460" y="372" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="480" y="384" font-size="11.5" fill="#36424e" text-anchor="start">provider manages</text>

    <text x="430" y="408" font-size="13" fill="#40566b">Pick the rightmost option that still gives you the control your workload needs.</text>
  </g>
</svg>
