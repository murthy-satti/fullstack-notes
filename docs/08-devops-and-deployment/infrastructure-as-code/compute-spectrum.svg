<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="csp-title csp-desc">
  <title id="csp-title">Who manages what across compute options</title>
  <desc id="csp-desc">Four compute options are compared on five layers. Virtual machines: the provider manages hardware and virtualization; you manage the operating system and patching, the runtime, scaling and placement, and the application code. Kubernetes with a managed control plane: the provider manages hardware; operating system and node patching are shared through managed node groups; you build the runtime as a container image; scaling is shared because you configure autoscalers that the platform runs; you manage the code. Serverless containers such as Cloud Run or ECS on Fargate: the provider manages hardware and the operating system; you build the container image; scaling is shared through settings; you manage the code. Functions such as AWS Lambda: the provider manages hardware, operating system, runtime, and scaling; you manage only the code. Moving right gives you less control and less to operate.</desc>
  <defs>
    <marker id="csp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="csp-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="320" y="40">Virtual machines</text>
      <text x="470" y="40">Kubernetes</text>
      <text x="620" y="40">Serverless containers</text>
      <text x="770" y="40">Functions</text>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="320" y="56">EC2, Compute Engine</text>
      <text x="470" y="56">EKS, GKE, AKS</text>
      <text x="620" y="56">Cloud Run, Fargate</text>
      <text x="770" y="56">Lambda, Cloud Functions</text>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="20" y="94">Application code</text>
      <text x="20" y="144">Scaling and placement</text>
      <text x="20" y="194">Runtime, container image</text>
      <text x="20" y="244">OS and patching</text>
      <text x="20" y="294">Hardware, virtualization</text>
    </g>

    <g stroke-width="1.5">
      <rect x="250" y="70" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="400" y="70" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="550" y="70" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="700" y="70" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>

      <rect x="250" y="120" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="400" y="120" width="140" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="550" y="120" width="140" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="700" y="120" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="250" y="170" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="400" y="170" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="550" y="170" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="700" y="170" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="250" y="220" width="140" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="400" y="220" width="140" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="550" y="220" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="700" y="220" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>

      <rect x="250" y="270" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="400" y="270" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="550" y="270" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="700" y="270" width="140" height="40" rx="6" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="11.5">
      <text x="320" y="94" fill="#66400f">you</text>
      <text x="470" y="94" fill="#66400f">you</text>
      <text x="620" y="94" fill="#66400f">you</text>
      <text x="770" y="94" fill="#66400f">you</text>
      <text x="320" y="144" fill="#66400f">you</text>
      <text x="470" y="144" fill="#463365">you configure</text>
      <text x="620" y="144" fill="#463365">you configure</text>
      <text x="770" y="144" fill="#263e5a">provider</text>
