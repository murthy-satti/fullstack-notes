<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Database request and response</title>
  <desc id="desc">An application sends a query to a database. The database uses a model and optional index to find stored data and returns matching results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#315b8a"/>
    </marker>
    <style>
      .box { fill: #f3f7fb; stroke: #315b8a; stroke-width: 2; rx: 12; }
      .title { font: 700 20px sans-serif; fill: #18324b; }
      .text { font: 16px sans-serif; fill: #28445f; }
      .arrow { stroke: #315b8a; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font: 14px sans-serif; fill: #315b8a; }
    </style>
  </defs>
  <rect x="35" y="105" width="190" height="110" class="box"/>
  <text x="130" y="148" text-anchor="middle" class="title">Application</text>
  <text x="130" y="178" text-anchor="middle" class="text">asks for data</text>
  <rect x="340" y="45" width="220" height="100" class="box"/>
  <text x="450" y="85" text-anchor="middle" class="title">Query + rules</text>
  <text x="450" y="115" text-anchor="middle" class="text">filter and validate</text>
  <rect x="340" y="190" width="220" height="100" class="box"/>
  <text x="450" y="230" text-anchor="middle" class="title">Stored records</text>
  <text x="450" y="260" text-anchor="middle" class="text">tables or documents</text>
  <rect x="675" y="105" width="190" height="110" class="box"/>
  <text x="770" y="148" text-anchor="middle" class="title">Result</text>
  <text x="770" y="178" text-anchor="middle" class="text">matching data</text>
  <path d="M225 135 L330 100" class="arrow"/>
  <text x="267" y="100" class="label">query</text>
  <path d="M450 145 L450 180" class="arrow"/>
  <text x="464" y="168" class="label">lookup</text>
  <path d="M560 100 L665 135" class="arrow"/>
  <text x="594" y="100" class="label">response</text>
  <text x="450" y="318" text-anchor="middle" class="label">Indexes can speed up selected lookups; they have storage and write costs.</text>
</svg>
