<svg xmlns="http://www.w3.org/2000/svg" width="780" height="712" viewBox="0 0 780 712" role="img" aria-labelledby="rca-title rca-desc">
  <title id="rca-title">Cache-aside with Redis: reads, expiry with jitter, eviction, and invalidation</title>
  <desc id="rca-desc">For GET /products/17 the application calls redis.get on cache:v1:product:17. If Redis throws, it falls back to the loader and the request still succeeds. On a hit it returns the parsed cached value. On a miss it queries the database, then sets the key with EX withJitter(300), a TTL between 270 and 330 seconds. If maxmemory is reached, Redis evicts keys according to maxmemory-policy, such as allkeys-lfu, or with noeviction the write fails. Either way the value is returned. On the write path, PUT /products/17 updates the database, then UNLINKs the cache key, so the next GET misses and reloads fresh data.</desc>
  <defs>
    <marker id="rca-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="712" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="40" font-size="13" font-weight="700" fill="#8062a8" text-anchor="start">Read path</text>
    <rect x="130" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="45" font-size="14" font-weight="700" fill="#36424e">GET /products/17</text>

    <rect x="130" y="80" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="250" y="100" font-size="14" font-weight="700" fill="#263e5a">redis.get(key)</text>
    <text x="250" y="117" font-size="11.5" fill="#263e5a">key = cache:v1:product:17</text>

    <path d="M250 148 360 178 250 208 140 178z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="175" font-size="12" font-weight="700" fill="#36424e">Redis threw</text>
    <text x="250" y="189" font-size="12" font-weight="700" fill="#36424e">(down, timeout)?</text>
    <path d="M250 228 360 258 250 288 140 258z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="255" font-size="12" font-weight="700" fill="#36424e">value found</text>
    <text x="250" y="269" font-size="12" font-weight="700" fill="#36424e">(cache hit)?</text>

    <rect x="130" y="308" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="328" font-size="14" font-weight="700" fill="#66400f">loader(): query the DB</text>
    <text x="250" y="345" font-size="11.5" fill="#66400f">cache miss</text>
    <rect x="130" y="376" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="250" y="396" font-size="14" font-weight="700" fill="#263e5a">redis.set(key, json, { EX })</text>
    <text x="250" y="413" font-size="11.5" fill="#263e5a">EX withJitter(300): 270 to 330 s</text>
    <path d="M250 444 360 474 250 504 140 474z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="471" font-size="12" font-weight="700" fill="#36424e">maxmemory</text>
    <text x="250" y="485" font-size="12" font-weight="700" fill="#36424e">reached?</text>
    <rect x="130" y="526" width="240" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="250" y="551" font-size="14" font-weight="700" fill="#294a2e">Return the value</text>

    <rect x="440" y="154" width="300" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="590" y="174" font-size="14" font-weight="700" fill="#66400f">Fall back to loader()</text>
    <text x="590" y="191" font-size="11.5" fill="#66400f">the request still succeeds</text>
    <rect x="440" y="234" width="300" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="254" font-size="14" font-weight="700" fill="#294a2e">Return the cached value</text>
    <text x="590" y="271" font-size="11.5" fill="#294a2e">JSON.parse, no database query</text>
    <rect x="440" y="444" width="300" height="62" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="590" y="464" font-size="14" font-weight="700" fill="#463365">Evict by maxmemory-policy</text>
    <text x="590" y="482" font-size="11.5" fill="#463365">allkeys-lfu: least-used keys go</text>
    <text x="590" y="497" font-size="11.5" fill="#463365">noeviction: the SET fails instead</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 60V78" marker-end="url(#rca-arrow)"/>
      <path d="M250 128V146" marker-end="url(#rca-arrow)"/>
      <path d="M250 208V226" marker-end="url(#rca-arrow)"/>
      <path d="M250 288V306" marker-end="url(#rca-arrow)"/>
      <path d="M250 356V374" marker-end="url(#rca-arrow)"/>
      <path d="M250 424V442" marker-end="url(#rca-arrow)"/>
      <path d="M250 504V524" marker-end="url(#rca-arrow)"/>
      <path d="M360 178H438" marker-end="url(#rca-arrow)"/>
      <path d="M360 258H438" marker-end="url(#rca-arrow)"/>
      <path d="M360 474H438" marker-end="url(#rca-arrow)"/>
      <path d="M590 506V546H372" marker-end="url(#rca-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="399" y="171">yes</text>
      <text x="399" y="251">yes</text>
      <text x="399" y="467">yes</text>
      <text x="264" y="222">no</text>
      <text x="270" y="302">miss</text>
      <text x="264" y="520">no</text>
    </g>

    <path d="M20 588H760" stroke="#c3ccd7" stroke-width="1.5"/>
    <text x="24" y="610" font-size="13" font-weight="700" fill="#8062a8" text-anchor="start">Write path</text>
    <rect x="24" y="620" width="170" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="109" y="640" font-size="14" font-weight="700" fill="#36424e">PUT /products/17</text>
    <text x="109" y="657" font-size="11.5" fill="#36424e">new price</text>
    <rect x="216" y="620" width="170" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="301" y="640" font-size="14" font-weight="700" fill="#66400f">Update the DB</text>
    <text x="301" y="657" font-size="11.5" fill="#66400f">source of truth first</text>
    <rect x="408" y="620" width="170" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="493" y="640" font-size="14" font-weight="700" fill="#6b241c">UNLINK the key</text>
    <text x="493" y="657" font-size="11.5" fill="#6b241c">cache:v1:product:17</text>
    <rect x="600" y="620" width="156" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="678" y="640" font-size="14" font-weight="700" fill="#294a2e">Next GET misses</text>
    <text x="678" y="657" font-size="11.5" fill="#294a2e">reloads fresh data</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M194 644H214" marker-end="url(#rca-arrow)"/>
      <path d="M386 644H406" marker-end="url(#rca-arrow)"/>
      <path d="M578 644H598" marker-end="url(#rca-arrow)"/>
    </g>
    <text x="390" y="698" font-size="13" fill="#40566b">The application owns the logic: Redis never reads from or writes to the database itself.</text>
  </g>
</svg>
