<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="prt-title prt-desc">
  <title id="prt-title">Three commands without pipelining versus one pipeline</title>
  <desc id="prt-desc">With a round-trip time of 1 millisecond, sending SET a, SET b and SET c one at a time means waiting for each OK before sending the next: three round trips, about 3 milliseconds. With pipelining, the client sends all three commands without waiting and then reads the three OK replies: one round trip, about 1 millisecond. Pipelined commands are not atomic, because other clients' commands can run between them. At 10,000 commands the difference is about 10 seconds versus a few tens of milliseconds in batches.</desc>
  <defs>
    <marker id="prt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="prt-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="30" font-size="14" font-weight="700" fill="#36424e">Without pipelining (RTT 1 ms)</text>
    <text x="590" y="30" font-size="14" font-weight="700" fill="#36424e">With pipelining</text>
    <path d="M395 20V400" stroke="#c3ccd7" stroke-width="1.5"/>

    <rect x="94" y="44" width="92" height="32" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="140" y="65" font-size="13" font-weight="700" fill="#263e5a">Client</text>
    <rect x="284" y="44" width="92" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="330" y="65" font-size="13" font-weight="700" fill="#36424e">Redis</text>
    <rect x="484" y="44" width="92" height="32" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="530" y="65" font-size="13" font-weight="700" fill="#263e5a">Client</text>
    <rect x="664" y="44" width="92" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="710" y="65" font-size="13" font-weight="700" fill="#36424e">Redis</text>
    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M140 76V364M330 76V364M530 76V364M710 76V364"/>
    </g>

    <g font-size="11" fill="#40566b" text-anchor="end">
      <text x="80" y="94">0 ms</text>
      <text x="80" y="184">1 ms</text>
      <text x="80" y="274">2 ms</text>
      <text x="80" y="364">3 ms</text>
      <text x="470" y="94">0 ms</text>
      <text x="470" y="184">1 ms</text>
      <text x="470" y="274">2 ms</text>
      <text x="470" y="364">3 ms</text>
    </g>
    <g stroke="#c3ccd7" stroke-width="1">
      <path d="M86 90H136M86 180H136M86 270H136M86 360H136M476 90H526M476 180H526M476 270H526M476 360H526"/>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M140 90 328 135" stroke="#40566b" marker-end="url(#prt-arrow)"/>
      <path d="M330 135 142 180" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#prt-ret)"/>
      <path d="M140 180 328 225" stroke="#40566b" marker-end="url(#prt-arrow)"/>
      <path d="M330 225 142 270" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#prt-ret)"/>
      <path d="M140 270 328 315" stroke="#40566b" marker-end="url(#prt-arrow)"/>
      <path d="M330 315 142 360" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#prt-ret)"/>

      <path d="M530 90 708 135" stroke="#40566b" marker-end="url(#prt-arrow)"/>
      <path d="M530 102 708 147" stroke="#40566b" marker-end="url(#prt-arrow)"/>
      <path d="M530 114 708 159" stroke="#40566b" marker-end="url(#prt-arrow)"/>
      <path d="M710 135 532 180" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#prt-ret)"/>
      <path d="M710 147 532 192" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#prt-ret)"/>
      <path d="M710 159 532 204" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#prt-ret)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="200" y="100">SET a</text>
      <text x="200" y="190">SET b</text>
      <text x="200" y="280">SET c</text>
      <text x="580" y="94">SET a, SET b, SET c</text>
    </g>
    <g font-size="11.5" fill="#60788d" text-anchor="start">
      <text x="252" y="146">OK</text>
      <text x="252" y="236">OK</text>
      <text x="252" y="326">OK</text>
      <text x="580" y="214">OK, OK, OK</text>
    </g>

    <rect x="484" y="236" width="272" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="620" y="254" font-size="13" font-weight="700" fill="#294a2e">1 round trip, about 1 ms</text>
    <text x="620" y="271" font-size="11.5" fill="#294a2e">10,000 commands: tens of ms in batches</text>
    <rect x="484" y="292" width="272" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="620" y="310" font-size="13" font-weight="700" fill="#6b241c">Not atomic</text>
    <text x="620" y="327" font-size="11.5" fill="#6b241c">other clients can run in between</text>

    <rect x="94" y="372" width="282" height="40" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="235" y="390" font-size="13" font-weight="700" fill="#6b241c">3 round trips, about 3 ms</text>
    <text x="235" y="405" font-size="11.5" fill="#6b241c">10,000 commands: about 10 s</text>
    <text x="390" y="430" font-size="13" fill="#40566b">Time is spent waiting on the network, not in Redis; pipelining removes the waits.</text>
  </g>
</svg>
