<svg xmlns="http://www.w3.org/2000/svg" width="780" height="720" viewBox="0 0 780 720" role="img" aria-labelledby="cds-title cds-desc">
  <title id="cds-title">Choosing a Redis data structure for a job</title>
  <desc id="cds-desc">Ask the questions in order. A single value or counter is a string with SET, GET and INCR. An object whose fields change on their own is a hash. A queue or recent-items list is a list. Unique members with membership tests are a set. Members ordered by a score, such as a ranking or time index, are a sorted set. An event log that consumers replay is a stream. An approximate unique count in tiny memory is a HyperLogLog. Searching by distance from a point is a geospatial index. A yes or no flag per numeric ID is a bitmap. If nothing fits, store a serialized string or use the JSON type.</desc>
  <defs>
    <marker id="cds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="720" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="230" y="36" font-size="14" font-weight="700" fill="#36424e">What does the data need to do?</text>
    <text x="603" y="36" font-size="14" font-weight="700" fill="#36424e">Use this type</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M230 46 380 70 230 94 80 70z"/>
      <path d="M230 110 380 134 230 158 80 134z"/>
      <path d="M230 174 380 198 230 222 80 198z"/>
      <path d="M230 238 380 262 230 286 80 262z"/>
      <path d="M230 302 380 326 230 350 80 326z"/>
      <path d="M230 366 380 390 230 414 80 390z"/>
      <path d="M230 430 380 454 230 478 80 454z"/>
      <path d="M230 494 380 518 230 542 80 518z"/>
      <path d="M230 558 380 582 230 606 80 582z"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="230" y="74">A single value or a counter?</text>
      <text x="230" y="138">Fields that change on their own?</text>
      <text x="230" y="202">A queue or recent-items list?</text>
      <text x="230" y="266">Unique members, membership?</text>
      <text x="230" y="330">Ordered by a score?</text>
      <text x="230" y="394">An event log consumers replay?</text>
      <text x="230" y="458">Approximate unique count?</text>
      <text x="230" y="522">Search by distance from a point?</text>
      <text x="230" y="586">A yes/no flag per numeric ID?</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="450" y="48" width="306" height="44" rx="8"/>
      <rect x="450" y="112" width="306" height="44" rx="8"/>
      <rect x="450" y="176" width="306" height="44" rx="8"/>
      <rect x="450" y="240" width="306" height="44" rx="8"/>
      <rect x="450" y="304" width="306" height="44" rx="8"/>
      <rect x="450" y="368" width="306" height="44" rx="8"/>
      <rect x="450" y="432" width="306" height="44" rx="8"/>
      <rect x="450" y="496" width="306" height="44" rx="8"/>
      <rect x="450" y="560" width="306" height="44" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="603" y="66" font-size="14" font-weight="700">String</text>
      <text x="603" y="83" font-size="11.5">SET / GET, INCR for counters</text>
      <text x="603" y="130" font-size="14" font-weight="700">Hash</text>
      <text x="603" y="147" font-size="11.5">HSET, HGET, HINCRBY one field</text>
      <text x="603" y="194" font-size="14" font-weight="700">List</text>
      <text x="603" y="211" font-size="11.5">LPUSH + BRPOP, LTRIM to cap</text>
      <text x="603" y="258" font-size="14" font-weight="700">Set</text>
      <text x="603" y="275" font-size="11.5">SADD, SISMEMBER, SINTER</text>
      <text x="603" y="322" font-size="14" font-weight="700">Sorted set</text>
      <text x="603" y="339" font-size="11.5">ZADD, ZINCRBY, ZRANGE ... REV</text>
      <text x="603" y="386" font-size="14" font-weight="700">Stream</text>
      <text x="603" y="403" font-size="11.5">XADD, XRANGE, consumer groups</text>
      <text x="603" y="450" font-size="14" font-weight="700">HyperLogLog</text>
      <text x="603" y="467" font-size="11.5">PFADD, PFCOUNT: ~12 KB, ~0.81% error</text>
      <text x="603" y="514" font-size="14" font-weight="700">Geospatial index</text>
      <text x="603" y="531" font-size="11.5">GEOADD lon lat, GEOSEARCH</text>
      <text x="603" y="578" font-size="14" font-weight="700">Bitmap</text>
      <text x="603" y="595" font-size="11.5">SETBIT, BITCOUNT</text>
    </g>

    <rect x="80" y="630" width="300" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="230" y="648" font-size="14" font-weight="700" fill="#66400f">No single fit</text>
    <text x="230" y="665" font-size="11.5" fill="#66400f">JSON string, or the JSON type if available</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M380 70H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 134H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 198H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 262H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 326H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 390H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 454H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 518H448" marker-end="url(#cds-arrow)"/>
      <path d="M380 582H448" marker-end="url(#cds-arrow)"/>
      <path d="M230 94V108" marker-end="url(#cds-arrow)"/>
      <path d="M230 158V172" marker-end="url(#cds-arrow)"/>
      <path d="M230 222V236" marker-end="url(#cds-arrow)"/>
      <path d="M230 286V300" marker-end="url(#cds-arrow)"/>
      <path d="M230 350V364" marker-end="url(#cds-arrow)"/>
      <path d="M230 414V428" marker-end="url(#cds-arrow)"/>
      <path d="M230 478V492" marker-end="url(#cds-arrow)"/>
      <path d="M230 542V556" marker-end="url(#cds-arrow)"/>
      <path d="M230 606V628" marker-end="url(#cds-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="414" y="64">yes</text>
      <text x="414" y="128">yes</text>
      <text x="414" y="192">yes</text>
      <text x="414" y="256">yes</text>
      <text x="414" y="320">yes</text>
      <text x="414" y="384">yes</text>
      <text x="414" y="448">yes</text>
      <text x="414" y="512">yes</text>
      <text x="414" y="576">yes</text>
    </g>
    <text x="250" y="620" font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">no</text>
    <text x="390" y="704" font-size="13" fill="#40566b">Pick the type whose commands do the work on the server, so each update is one atomic command.</text>
  </g>
</svg>
