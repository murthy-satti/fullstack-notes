<svg xmlns="http://www.w3.org/2000/svg" width="780" height="530" viewBox="0 0 780 530" role="img" aria-labelledby="sfo-title sfo-desc">
  <title id="sfo-title">Automatic failover with Redis Sentinel</title>
  <desc id="sfo-desc">Three Sentinels with a quorum of 2 ping the primary and get no reply. At least two agree the primary is down, and they elect a leader Sentinel. The leader promotes replica A with REPLICAOF NO ONE and points replica B at A. Clients ask the Sentinels for the current primary with SENTINEL get-master-addr-by-name mymaster, receive A's address, and send their reads and writes to A. When the old primary returns, it is reconfigured as a replica of A.</desc>
  <defs>
    <marker id="sfo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sfo-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="530" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="120" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="80" y="40" font-size="14" font-weight="700" fill="#263e5a">Clients</text>
    <text x="80" y="57" font-size="11.5" fill="#263e5a">Sentinel-aware</text>
    <rect x="230" y="20" width="140" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="300" y="40" font-size="14" font-weight="700" fill="#463365">Sentinels x3</text>
    <text x="300" y="57" font-size="11.5" fill="#463365">quorum = 2</text>
    <rect x="400" y="20" width="100" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="450" y="40" font-size="14" font-weight="700" fill="#6b241c">Primary</text>
    <text x="450" y="57" font-size="11.5" fill="#6b241c">fails</text>
    <rect x="530" y="20" width="100" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="40" font-size="14" font-weight="700" fill="#36424e">Replica A</text>
    <text x="580" y="57" font-size="11.5" fill="#36424e">port 6379</text>
    <rect x="660" y="20" width="100" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="710" y="40" font-size="14" font-weight="700" fill="#36424e">Replica B</text>
    <text x="710" y="57" font-size="11.5" fill="#36424e">port 6379</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M80 68V484M300 68V146M300 198V484M580 68V236M580 266V484M710 68V484M450 450V484"/>
    </g>
    <path d="M450 68V450" stroke="#e3b5ae" stroke-width="1.5" stroke-dasharray="2 6"/>
    <path d="M442 92 458 108M458 92 442 108" stroke="#b5473a" stroke-width="2.5" stroke-linecap="round"/>

    <g text-anchor="start" fill="#36424e">
      <text x="312" y="118" font-size="12" font-weight="700">1. PING: no reply</text>
      <text x="312" y="226" font-size="12" font-weight="700">2. REPLICAOF NO ONE</text>
      <text x="312" y="306" font-size="12" font-weight="700">3. REPLICAOF &lt;A's address&gt;</text>
      <text x="92" y="346" font-size="12" font-weight="700">4. SENTINEL</text>
      <text x="92" y="360" font-size="11">get-master-addr-by-name mymaster</text>
      <text x="92" y="392" font-size="12" font-weight="700">5. A's host and port</text>
      <text x="92" y="428" font-size="12" font-weight="700">6. reads and writes now go to A</text>
      <text x="312" y="466" font-size="12" font-weight="700">7. REPLICAOF A, when it returns</text>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M300 126H446" stroke="#40566b" marker-end="url(#sfo-arrow)"/>
      <path d="M300 234H578" stroke="#40566b" marker-end="url(#sfo-arrow)"/>
      <path d="M300 314H708" stroke="#40566b" marker-end="url(#sfo-arrow)"/>
      <path d="M80 368H298" stroke="#40566b" marker-end="url(#sfo-arrow)"/>
      <path d="M300 400H82" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#sfo-ret)"/>
      <path d="M80 436H578" stroke="#40566b" marker-end="url(#sfo-arrow)"/>
      <path d="M300 474H448" stroke="#40566b" marker-end="url(#sfo-arrow)"/>
    </g>

    <rect x="215" y="146" width="170" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="300" y="166" font-size="11.5" font-weight="700" fill="#463365">2 of 3 agree it is down</text>
    <text x="300" y="181" font-size="11.5" fill="#463365">(quorum), then elect</text>
    <text x="300" y="194" font-size="11.5" fill="#463365">a leader Sentinel</text>
    <rect x="525" y="236" width="110" height="30" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="256" font-size="12" font-weight="700" fill="#294a2e">now primary</text>

    <text x="390" y="510" font-size="13" fill="#40566b">Writes the old primary acknowledged but never replicated are lost; WAIT narrows that window.</text>
  </g>
</svg>
