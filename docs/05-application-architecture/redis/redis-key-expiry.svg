<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="rke-title rke-desc">
  <title id="rke-title">How Redis removes expired keys: lazily on access and with an active cycle</title>
  <desc id="rke-desc">Lazy expiry: when a client reads a key such as GET session:9f3c, Redis checks whether its TTL has passed; if so it deletes the key and replies nil, otherwise it returns the value. Active expiry: a background cycle runs several times per second, samples a few keys that have a TTL, deletes the expired ones, and samples again while many of the sample were expired; otherwise it waits for the next cycle. Lazy expiry means no client ever reads an expired key, and the active cycle frees memory for keys nobody reads.</desc>
  <defs>
    <marker id="rke-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="36" font-size="14" font-weight="700" fill="#36424e">Lazy expiry: on access</text>
    <text x="580" y="36" font-size="14" font-weight="700" fill="#36424e">Active expiry: background cycle</text>
    <path d="M390 24V400" stroke="#c3ccd7" stroke-width="1.5"/>

    <rect x="80" y="56" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="200" y="76" font-size="14" font-weight="700" fill="#263e5a">GET session:9f3c</text>
    <text x="200" y="93" font-size="11.5" fill="#263e5a">a client reads the key</text>
    <path d="M200 124 300 154 200 184 100 154z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="151" font-size="12" font-weight="700" fill="#36424e">TTL already</text>
    <text x="200" y="165" font-size="12" font-weight="700" fill="#36424e">passed?</text>
    <rect x="30" y="214" width="160" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="110" y="234" font-size="14" font-weight="700" fill="#6b241c">Delete the key</text>
    <text x="110" y="251" font-size="11.5" fill="#6b241c">then reply (nil)</text>
    <rect x="210" y="214" width="160" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="290" y="234" font-size="14" font-weight="700" fill="#294a2e">Return the value</text>
    <text x="290" y="251" font-size="11.5" fill="#294a2e">key is still alive</text>

    <rect x="470" y="56" width="220" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="580" y="76" font-size="14" font-weight="700" fill="#463365">Expiry cycle starts</text>
    <text x="580" y="93" font-size="11.5" fill="#463365">several times per second</text>
    <rect x="470" y="130" width="220" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="150" font-size="14" font-weight="700" fill="#36424e">Sample keys with a TTL</text>
    <text x="580" y="167" font-size="11.5" fill="#36424e">a few at random, not all</text>
    <rect x="470" y="204" width="220" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="224" font-size="14" font-weight="700" fill="#6b241c">Delete the expired ones</text>
    <text x="580" y="241" font-size="11.5" fill="#6b241c">frees memory nobody reads</text>
    <path d="M580 274 680 304 580 334 480 304z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="301" font-size="12" font-weight="700" fill="#36424e">many of the</text>
    <text x="580" y="315" font-size="12" font-weight="700" fill="#36424e">sample expired?</text>
    <rect x="470" y="356" width="220" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="381" font-size="14" font-weight="700" fill="#36424e">Wait for the next cycle</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 104V122" marker-end="url(#rke-arrow)"/>
      <path d="M100 154H90V212" marker-end="url(#rke-arrow)"/>
      <path d="M300 154H310V212" marker-end="url(#rke-arrow)"/>
      <path d="M580 104V128" marker-end="url(#rke-arrow)"/>
      <path d="M580 178V202" marker-end="url(#rke-arrow)"/>
      <path d="M580 252V272" marker-end="url(#rke-arrow)"/>
      <path d="M480 304H440V154H468" marker-end="url(#rke-arrow)"/>
      <path d="M580 334V354" marker-end="url(#rke-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="72" y="190">yes</text>
      <text x="328" y="190">no</text>
      <text x="456" y="296">yes</text>
      <text x="594" y="349">no</text>
    </g>
    <text x="200" y="300" font-size="11.5" font-style="italic" fill="#40566b">no client ever reads</text>
    <text x="200" y="315" font-size="11.5" font-style="italic" fill="#40566b">an expired key</text>
    <text x="390" y="432" font-size="13" fill="#40566b">An expired key may sit in memory briefly, but both paths make sure it is never returned.</text>
  </g>
</svg>
