<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="adr-title adr-desc">
  <title id="adr-title">How an architecture decision is made and recorded in an ADR</title>
  <desc id="adr-desc">Drivers such as requirements and quality goals lead to at least two options, which are compared by their trade-offs, producing a decision. The decision is written as an ADR with status Proposed. After review it becomes Accepted, or Rejected if not adopted. When a later ADR replaces it, its status becomes Superseded; ADRs are never deleted. For example, ADR 007 "Use PostgreSQL for the orders service" was accepted and supersedes ADR 002.</desc>
  <defs>
    <marker id="adr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">1. Making the decision</text>
    <rect x="24" y="48" width="166" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="107" y="71" font-size="14" font-weight="700" fill="#36424e">Drivers</text>
    <text x="107" y="89" font-size="11.5" fill="#36424e">requirements, quality goals</text>
    <rect x="218" y="48" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="298" y="71" font-size="14" font-weight="700" fill="#263e5a">Options</text>
    <text x="298" y="89" font-size="11.5" fill="#263e5a">at least two considered</text>
    <rect x="406" y="48" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="486" y="71" font-size="14" font-weight="700" fill="#66400f">Trade-offs</text>
    <text x="486" y="89" font-size="11.5" fill="#66400f">gains vs costs of each</text>
    <rect x="594" y="48" width="162" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="675" y="71" font-size="14" font-weight="700" fill="#294a2e">Decision</text>
    <text x="675" y="89" font-size="11.5" fill="#294a2e">fits current goals best</text>

    <line x1="24" y1="140" x2="756" y2="140" stroke="#d5dce6" stroke-width="1.5"/>
    <text x="24" y="166" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">2. Recording it: ADR status lifecycle</text>

    <rect x="60" y="196" width="170" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="145" y="218" font-size="14" font-weight="700" fill="#263e5a">Proposed</text>
    <text x="145" y="236" font-size="11.5" fill="#263e5a">written with context</text>
    <rect x="320" y="196" width="170" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="405" y="218" font-size="14" font-weight="700" fill="#294a2e">Accepted</text>
    <text x="405" y="236" font-size="11.5" fill="#294a2e">in force, dated</text>
    <rect x="580" y="196" width="170" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="665" y="218" font-size="14" font-weight="700" fill="#36424e">Superseded</text>
    <text x="665" y="236" font-size="11.5" fill="#36424e">by ADR N, kept for history</text>
    <rect x="60" y="292" width="170" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="145" y="311" font-size="14" font-weight="700" fill="#6b241c">Rejected</text>
    <text x="145" y="328" font-size="11.5" fill="#6b241c">reason recorded</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 76H216" marker-end="url(#adr-arrow)"/>
      <path d="M378 76H404" marker-end="url(#adr-arrow)"/>
      <path d="M566 76H592" marker-end="url(#adr-arrow)"/>
      <path d="M675 104V124H145V194" marker-end="url(#adr-arrow)"/>
      <path d="M230 222H318" marker-end="url(#adr-arrow)"/>
      <path d="M490 222H578" marker-end="url(#adr-arrow)"/>
      <path d="M145 248V290" marker-end="url(#adr-arrow)"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="410" y="118">write ADR NNN</text>
      <text x="274" y="214">team review</text>
      <text x="534" y="214">later ADR</text>
      <text x="534" y="240">replaces it</text>
      <text x="157" y="274" text-anchor="start">not adopted</text>
    </g>

    <rect x="270" y="286" width="486" height="94" rx="8" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="286" y="308" font-size="12" font-weight="700" fill="#36424e" text-anchor="start">Example from this page</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="286" y="328">ADR 007 "Use PostgreSQL for the orders service"</text>
      <text x="286" y="346">Status: Accepted (2026-03-14). Supersedes ADR 002,</text>
      <text x="286" y="364">whose status now reads "Superseded by ADR 007".</text>
    </g>
    <text x="390" y="420" font-size="13" fill="#40566b">One decision per record; a changed decision gets a new ADR, never an edited or deleted one.</text>
  </g>
</svg>
