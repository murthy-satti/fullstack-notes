<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="cc2-title cc2-desc">
  <title id="cc2-title">Tight coupling and low cohesion versus loose coupling and high cohesion</title>
  <desc id="cc2-desc">Left: orders, users and invoices all import a utils.js file that mixes date helpers, email sending and tax rules; invoices imports a private helper from orders; and both orders and invoices write the same orders table, so one change can break all of them. Right: an orders module keeps its own rules and table and calls only the invoice module's createInvoice public API; the invoice module keeps calculation, numbering, formatting and its own table together and calls the tax module's taxFor and the email module's sendEmail APIs.</desc>
  <defs>
    <marker id="cc2-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cc2-arrow-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="358" height="384" rx="10" fill="none" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="390" y="16" width="374" height="384" rx="10" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="195" y="38" font-size="14" font-weight="700" fill="#6b241c">Tight coupling, low cohesion</text>
    <text x="577" y="38" font-size="14" font-weight="700" fill="#294a2e">Loose coupling, high cohesion</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="30" y="84" width="100" height="36" rx="8"/>
      <rect x="146" y="84" width="100" height="36" rx="8"/>
      <rect x="262" y="84" width="100" height="36" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#263e5a">
      <text x="80" y="107">orders</text>
      <text x="196" y="107">users</text>
      <text x="312" y="107">invoices</text>
    </g>
    <rect x="96" y="160" width="200" height="82" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="196" y="180" font-size="13" font-weight="700" fill="#6b241c">utils.js</text>
    <g font-size="11.5" fill="#6b241c">
      <text x="196" y="198">date helpers</text>
      <text x="196" y="214">email sending</text>
      <text x="196" y="230">tax rules</text>
    </g>
    <rect x="96" y="296" width="200" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="196" y="319" font-size="13" font-weight="700" fill="#463365">orders table</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 120V158" marker-end="url(#cc2-arrow)"/>
      <path d="M196 120V158" marker-end="url(#cc2-arrow)"/>
      <path d="M282 120V158" marker-end="url(#cc2-arrow)"/>
    </g>
    <g fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M312 84V68H80V82" stroke-dasharray="5 4" marker-end="url(#cc2-arrow-r)"/>
      <path d="M50 120V314H94" marker-end="url(#cc2-arrow-r)"/>
      <path d="M342 120V314H298" marker-end="url(#cc2-arrow-r)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#6b241c">
      <text x="196" y="62">invoices imports a private orders helper</text>
      <text x="60" y="284" text-anchor="start">writes</text>
      <text x="332" y="284" text-anchor="end">writes</text>
    </g>
    <text x="195" y="364" font-size="11.5" fill="#6b241c">One edit to utils.js or the orders table</text>
    <text x="195" y="380" font-size="11.5" fill="#6b241c">can break all three modules.</text>

    <rect x="404" y="70" width="150" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="479" y="90" font-size="13" font-weight="700" fill="#263e5a">orders module</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="479" y="112">order rules</text>
      <text x="479" y="128">own orders table</text>
    </g>
    <rect x="604" y="70" width="150" height="128" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="679" y="104" font-size="13" font-weight="700" fill="#294a2e">invoice module</text>
    <g font-size="11.5" fill="#294a2e">
      <text x="679" y="124">calculation</text>
      <text x="679" y="140">numbering</text>
      <text x="679" y="156">formatting</text>
      <text x="679" y="172">own invoices table</text>
    </g>
    <rect x="626" y="62" width="106" height="20" rx="4" fill="#ffffff" stroke="#53845b" stroke-width="1.5"/>
    <text x="679" y="76" font-size="11" font-weight="700" fill="#294a2e">createInvoice()</text>

    <rect x="404" y="262" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="479" y="300" font-size="13" font-weight="700" fill="#263e5a">email module</text>
    <rect x="432" y="254" width="94" height="20" rx="4" fill="#ffffff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="479" y="268" font-size="11" font-weight="700" fill="#263e5a">sendEmail()</text>
    <rect x="604" y="262" width="150" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="679" y="300" font-size="13" font-weight="700" fill="#263e5a">tax module</text>
    <rect x="639" y="254" width="80" height="20" rx="4" fill="#ffffff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="679" y="268" font-size="11" font-weight="700" fill="#263e5a">taxFor()</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M554 100H590V72H624" marker-end="url(#cc2-arrow)"/>
      <path d="M679 198V252" marker-end="url(#cc2-arrow)"/>
      <path d="M640 198V226H479V252" marker-end="url(#cc2-arrow)"/>
    </g>
    <text x="577" y="364" font-size="11.5" fill="#294a2e">Related code lives together; modules talk</text>
    <text x="577" y="380" font-size="11.5" fill="#294a2e">through small public APIs and own their data.</text>
    <text x="390" y="436" font-size="13" fill="#40566b">Count the arrows that cross a boundary, and what they reach into: that is your coupling.</text>
  </g>
</svg>
