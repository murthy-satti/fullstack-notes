<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="gb-title gb-desc">
  <title id="gb-title">An API gateway at the edge with a backend for each frontend</title>
  <desc id="gb-desc">The mobile app sends GET /mobile/home and the web app sends GET /web/dashboard to one API gateway. The gateway terminates TLS, validates the token, applies rate limits, adds a request ID and routes by path, with no business logic. Mobile requests go to the mobile BFF, which calls the catalog, orders and users services in parallel and returns one small response. Web requests go to the web BFF, which calls the orders and users services and returns richer data for the dashboard.</desc>
  <defs>
    <marker id="gb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="96" width="120" height="44" rx="22" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="84" y="123" font-size="13" font-weight="700" fill="#36424e">mobile app</text>
    <rect x="24" y="256" width="120" height="44" rx="22" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="84" y="283" font-size="13" font-weight="700" fill="#36424e">web app</text>

    <rect x="176" y="60" width="144" height="280" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="248" y="84" font-size="14" font-weight="700" fill="#66400f">API gateway</text>
    <g font-size="11.5" fill="#66400f">
      <text x="248" y="112">TLS termination</text>
      <text x="248" y="136">validate token</text>
      <text x="248" y="160">rate limiting</text>
      <text x="248" y="184">request ID, CORS</text>
      <text x="248" y="208">route by path</text>
    </g>
    <text x="248" y="318" font-size="11" font-style="italic" fill="#6b241c">no business logic</text>

    <rect x="380" y="92" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="460" y="114" font-size="14" font-weight="700" fill="#263e5a">mobile BFF</text>
    <text x="460" y="132" font-size="11" fill="#263e5a">small payload, one round trip</text>
    <rect x="380" y="250" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="460" y="272" font-size="14" font-weight="700" fill="#263e5a">web BFF</text>
    <text x="460" y="290" font-size="11" fill="#263e5a">rich dashboard data</text>

    <g fill="#e8f5e9" stroke="#53845b" stroke-width="2">
      <rect x="610" y="60" width="146" height="44" rx="8"/>
      <rect x="610" y="170" width="146" height="44" rx="8"/>
      <rect x="610" y="280" width="146" height="44" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#294a2e">
      <text x="683" y="87">catalog service</text>
      <text x="683" y="197">orders service</text>
      <text x="683" y="307">users service</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M144 118H174" marker-end="url(#gb-arrow)"/>
      <path d="M144 278H174" marker-end="url(#gb-arrow)"/>
      <path d="M320 120H378" marker-end="url(#gb-arrow)"/>
      <path d="M320 278H378" marker-end="url(#gb-arrow)"/>
      <path d="M540 108L608 84" marker-end="url(#gb-arrow)"/>
      <path d="M540 124L608 186" marker-end="url(#gb-arrow)"/>
      <path d="M540 136L608 290" marker-end="url(#gb-arrow)"/>
      <path d="M540 262L608 202" marker-end="url(#gb-arrow)"/>
      <path d="M540 284L608 302" marker-end="url(#gb-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      
      <text x="84" y="88">GET /mobile/home</text>
      
      <text x="84" y="248">GET /web/dashboard</text>
      <text x="349" y="112">/mobile/*</text>
      <text x="349" y="270">/web/*</text>
      
      
    </g>

    <rect x="24" y="364" width="732" height="50" rx="8" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="390" y="384" font-size="12" fill="#36424e"><tspan font-weight="700">Gateway:</tspan> one entry point for cross-cutting concerns, shared by every client.</text>
    <text x="390" y="403" font-size="12" fill="#36424e"><tspan font-weight="700">BFF:</tspan> owned by the client's team; combines and reshapes service data for its screens.</text>
    <text x="390" y="438" font-size="13" fill="#40566b">Keep shared business rules in the services, not in the gateway or the BFFs.</text>
  </g>
</svg>
