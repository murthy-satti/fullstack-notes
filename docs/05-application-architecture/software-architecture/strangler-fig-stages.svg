<svg xmlns="http://www.w3.org/2000/svg" width="780" height="570" viewBox="0 0 780 570" role="img" aria-labelledby="sfs-title sfs-desc">
  <title id="sfs-title">Strangler fig migration from a monolith to services, step by step</title>
  <desc id="sfs-desc">Step 1: a router is placed in front of the legacy monolith and sends it all routes. Step 2: payments is rebuilt as a new service that owns its data, and the router sends /payments/* to it while everything else still goes to the monolith. Step 3: catalog is extracted the same way, and the monolith keeps only users and orders. Step 4: every route goes to services, nothing routes to the monolith, and it is switched off.</desc>
  <defs>
    <marker id="sfs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="570" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5">
      <rect x="16" y="16" width="748" height="110" rx="10"/>
      <rect x="16" y="138" width="748" height="120" rx="10"/>
      <rect x="16" y="270" width="748" height="120" rx="10"/>
      <rect x="16" y="402" width="748" height="128" rx="10"/>
    </g>
    <g text-anchor="start">
      <text x="30" y="58" font-size="13" font-weight="700" fill="#36424e">1. Add a router</text>
      <text x="30" y="76" font-size="11.5" fill="#40566b">in front of the</text>
      <text x="30" y="91" font-size="11.5" fill="#40566b">monolith</text>
      <text x="30" y="186" font-size="13" font-weight="700" fill="#36424e">2. Extract one</text>
      <text x="30" y="202" font-size="13" font-weight="700" fill="#36424e">capability</text>
      <text x="30" y="220" font-size="11.5" fill="#40566b">route its URLs away</text>
      <text x="30" y="318" font-size="13" font-weight="700" fill="#36424e">3. Repeat</text>
      <text x="30" y="336" font-size="11.5" fill="#40566b">one capability</text>
      <text x="30" y="351" font-size="11.5" fill="#40566b">at a time</text>
      <text x="30" y="452" font-size="13" font-weight="700" fill="#36424e">4. Retire the</text>
      <text x="30" y="468" font-size="13" font-weight="700" fill="#36424e">monolith</text>
      <text x="30" y="486" font-size="11.5" fill="#40566b">nothing routes to it</text>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="170" y="54" width="74" height="32" rx="16"/>
      <rect x="170" y="182" width="74" height="32" rx="16"/>
      <rect x="170" y="314" width="74" height="32" rx="16"/>
      <rect x="170" y="450" width="74" height="32" rx="16"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#36424e">
      <text x="207" y="75">clients</text>
      <text x="207" y="203">clients</text>
      <text x="207" y="335">clients</text>
      <text x="207" y="471">clients</text>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="268" y="50" width="86" height="40" rx="8"/>
      <rect x="268" y="178" width="86" height="40" rx="8"/>
      <rect x="268" y="310" width="86" height="40" rx="8"/>
      <rect x="268" y="446" width="86" height="40" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="311" y="75">router</text>
      <text x="311" y="203">router</text>
      <text x="311" y="335">router</text>
      <text x="311" y="471">router</text>
    </g>

    <rect x="470" y="44" width="280" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="610" y="65" font-size="14" font-weight="700" fill="#36424e">legacy monolith</text>
    <text x="610" y="83" font-size="11.5" fill="#36424e">users, catalog, orders, payments</text>

    <rect x="470" y="150" width="160" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="550" y="173" font-size="13" font-weight="700" fill="#294a2e">payments service</text>
    <text x="640" y="173" font-size="11" font-style="italic" fill="#294a2e" text-anchor="start">owns its data now</text>
    <rect x="470" y="204" width="280" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="610" y="223" font-size="14" font-weight="700" fill="#36424e">legacy monolith</text>
    <text x="610" y="240" font-size="11.5" fill="#36424e">users, catalog, orders</text>

    <rect x="470" y="282" width="136" height="32" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="538" y="303" font-size="12.5" font-weight="700" fill="#294a2e">payments</text>
    <rect x="614" y="282" width="136" height="32" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="682" y="303" font-size="12.5" font-weight="700" fill="#294a2e">catalog</text>
    <rect x="470" y="334" width="220" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="353" font-size="14" font-weight="700" fill="#36424e">legacy monolith</text>
    <text x="580" y="370" font-size="11.5" fill="#36424e">users, orders</text>

    <g fill="#e8f5e9" stroke="#53845b" stroke-width="2">
      <rect x="470" y="414" width="136" height="30" rx="8"/>
      <rect x="614" y="414" width="136" height="30" rx="8"/>
      <rect x="470" y="452" width="136" height="30" rx="8"/>
      <rect x="614" y="452" width="136" height="30" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#294a2e">
      <text x="538" y="434">payments</text>
      <text x="682" y="434">catalog</text>
      <text x="538" y="472">orders</text>
      <text x="682" y="472">users</text>
    </g>
    <rect x="470" y="492" width="280" height="28" rx="8" fill="#ffffff" stroke="#b9c2cc" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="610" y="511" font-size="12" fill="#8a96a3">legacy monolith: switched off</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 70H266" marker-end="url(#sfs-arrow)"/>
      <path d="M244 198H266" marker-end="url(#sfs-arrow)"/>
      <path d="M244 330H266" marker-end="url(#sfs-arrow)"/>
      <path d="M244 466H266" marker-end="url(#sfs-arrow)"/>
      <path d="M354 70H468" marker-end="url(#sfs-arrow)"/>
      <path d="M354 192H400V168H468" marker-end="url(#sfs-arrow)"/>
      <path d="M354 204H400V226H468" marker-end="url(#sfs-arrow)"/>
      <path d="M354 324H400V298H468" marker-end="url(#sfs-arrow)"/>
      <path d="M354 336H400V356H468" marker-end="url(#sfs-arrow)"/>
      <path d="M354 460H400V429H468" marker-end="url(#sfs-arrow)"/>
      <path d="M354 472H468" marker-end="url(#sfs-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="411" y="64">all routes</text>
      <text x="434" y="162">/payments/*</text>
      <text x="462" y="242" text-anchor="end">everything else</text>
      <text x="394" y="292" text-anchor="end">/payments/*,</text>
      <text x="394" y="306" text-anchor="end">/catalog/*</text>
      <text x="462" y="374" text-anchor="end">everything else</text>
      <text x="434" y="424">all routes</text>
    </g>
    <text x="390" y="554" font-size="13" fill="#40566b">Each step is small and reversible: the router decides, URL by URL, which system answers.</text>
  </g>
</svg>
