<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="oa-title oa-desc">
  <title id="oa-title">The Order aggregate: one root, its parts, and the rules it protects</title>
  <desc id="oa-desc">The Order aggregate is changed as one unit in one transaction. Outside code, such as the PlaceOrder application service, calls only the aggregate root, for example order.addLine or order.place; setting line.quantity directly is not allowed. Inside the boundary, the Order root holds OrderLine entities, each with a productId, quantity and unitPrice, plus Money and ShippingAddress value objects. The root enforces the invariants: only draft orders change, quantity is between 1 and 100, one currency per order, an empty order cannot be placed, and the total equals the sum of the lines. Other aggregates, the Customer and the Catalog product, are referenced by ID only. A repository loads and saves the whole aggregate, and its OrderPlaced event is published after saving.</desc>
  <defs>
    <marker id="oa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="oa-arrow-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
    <marker id="oa-arrow-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="780" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="196" y="40" width="380" height="290" rx="14" fill="#fffaf2" stroke="#bd7a20" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="386" y="60" font-size="12.5" font-weight="700" fill="#66400f">Order aggregate: changed as one unit, in one transaction</text>

    <rect x="286" y="74" width="200" height="72" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="386" y="94" font-size="14" font-weight="700" fill="#66400f">Order (root)</text>
    <text x="386" y="112" font-size="11.5" fill="#66400f">id, customerId, status, total</text>
    <text x="386" y="130" font-size="11.5" fill="#66400f">addLine(), place(), pullEvents()</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="212" y="186" width="170" height="46" rx="8"/>
      <rect x="392" y="186" width="170" height="46" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="297" y="205" font-size="13" font-weight="700">OrderLine (entity)</text>
      <text x="297" y="222" font-size="11">productId, quantity, unitPrice</text>
      <text x="477" y="205" font-size="13" font-weight="700">OrderLine (entity)</text>
      <text x="477" y="222" font-size="11">productId, quantity, unitPrice</text>
    </g>
    <g fill="#e8f5e9" stroke="#53845b" stroke-width="2">
      <rect x="212" y="268" width="170" height="44" rx="8"/>
      <rect x="392" y="268" width="170" height="44" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="297" y="287" font-size="13" font-weight="700">Money</text>
      <text x="297" y="303" font-size="11">value object, immutable</text>
      <text x="477" y="287" font-size="13" font-weight="700">ShippingAddress</text>
      <text x="477" y="303" font-size="11">value object</text>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M346 146V166H297V184"/>
      <path d="M426 146V166H477V184"/>
      <path d="M297 232V266"/>
      <path d="M486 136H570V290H562"/>
    </g>
    <text x="307" y="252" font-size="10.5" font-style="italic" fill="#40566b" text-anchor="start">unitPrice</text>

    <rect x="20" y="84" width="156" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="98" y="105" font-size="13" font-weight="700" fill="#263e5a">PlaceOrder</text>
    <text x="98" y="122" font-size="11.5" fill="#263e5a">application service</text>
    <path d="M176 110H284" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#oa-arrow)"/>
    <text x="240" y="102" font-size="11" fill="#294a2e">order.place()</text>

    <rect x="20" y="190" width="156" height="38" rx="19" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="98" y="214" font-size="12.5" font-weight="700" fill="#36424e">other code</text>
    <path d="M176 209H208" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#oa-arrow-r)"/>
    <path d="M186 201 198 217M198 201 186 217" stroke="#b5473a" stroke-width="2.5"/>
    <text x="98" y="248" font-size="11" fill="#6b241c">line.quantity = 5</text>
    <text x="98" y="262" font-size="11" font-weight="700" fill="#6b241c">not allowed</text>

    <rect x="600" y="40" width="160" height="176" rx="10" fill="#ffffff" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="680" y="60" font-size="12.5" font-weight="700" fill="#66400f">Root enforces</text>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="612" y="82">• only DRAFT orders change</text>
      <text x="612" y="104">• quantity 1 to 100</text>
      <text x="612" y="126">• one currency per order</text>
      <text x="612" y="148">• no empty order is placed</text>
      <text x="612" y="170">• total = sum of the lines</text>
      <text x="612" y="192">• lines returned as copies</text>
    </g>

    <g fill="#ffffff" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="5 4">
      <rect x="600" y="232" width="160" height="40" rx="8"/>
      <rect x="600" y="286" width="160" height="40" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="680" y="250">Customer</text>
      <text x="680" y="304">Product (Catalog)</text>
    </g>
    <g font-size="10.5" fill="#463365">
      <text x="680" y="264">by customerId only</text>
      <text x="680" y="318">by productId only</text>
    </g>
    <g fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M486 86H588V252H598" marker-end="url(#oa-arrow-p)"/>
      <path d="M562 200H580V306H598" marker-end="url(#oa-arrow-p)"/>
    </g>
    <g font-size="10.5" font-style="italic" fill="#463365" text-anchor="end">
      
      
    </g>

    <rect x="20" y="352" width="740" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="374" font-size="12.5" font-weight="700" fill="#36424e">orderRepository.findById(id) and save(order) load and save the whole aggregate</text>
    <text x="390" y="394" font-size="11.5" fill="#36424e">after the save, pullEvents() hands OrderPlaced to the publisher; other aggregates update later</text>
    <text x="390" y="448" font-size="13" fill="#40566b">Every change goes through the root, so no code path can break the order's rules.</text>
  </g>
</svg>
