<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="dip-title dip-desc">
  <title id="dip-title">Dependency inversion: before and after for registerUser</title>
  <desc id="dip-desc">Before: registerUser imports MongoClient from the mongodb package and talks to the MongoDB server directly, so it cannot be tested without a database and changing databases means editing business code. After: a composition root calls makeRegisterUser with a userRepository and a passwordHasher. registerUser calls only the userRepository.create and passwordHasher.hash abstractions. A Mongo repository and an in-memory repository implement userRepository, and an argon2 hasher implements passwordHasher.</desc>
  <defs>
    <marker id="dip-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="dip-arrow-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
    <marker id="dip-arrow-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="780" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="340" height="380" rx="10" fill="none" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="372" y="16" width="392" height="380" rx="10" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="186" y="42" font-size="14" font-weight="700" fill="#6b241c">Before: rules import the driver</text>
    <text x="568" y="42" font-size="14" font-weight="700" fill="#294a2e">After: both sides depend on an abstraction</text>

    <rect x="66" y="66" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="186" y="86" font-size="14" font-weight="700" fill="#66400f">registerUser(data)</text>
    <text x="186" y="103" font-size="11.5" fill="#66400f">high-level business logic</text>
    <rect x="66" y="178" width="240" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="186" y="197" font-size="14" font-weight="700" fill="#36424e">mongodb driver</text>
    <text x="186" y="214" font-size="11.5" fill="#36424e">low-level detail</text>
    <rect x="66" y="262" width="240" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="186" y="287" font-size="14" font-weight="700" fill="#463365">MongoDB server</text>
    <path d="M186 114V176" fill="none" stroke="#b5473a" stroke-width="3" marker-end="url(#dip-arrow-r)"/>
    <text x="196" y="142" font-size="11.5" font-weight="700" fill="#6b241c" text-anchor="start">import { MongoClient }</text>
    <text x="196" y="157" font-size="11.5" font-weight="700" fill="#6b241c" text-anchor="start">from "mongodb"</text>
    <path d="M186 222V260" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#dip-arrow)"/>
    <g font-size="11.5" fill="#6b241c">
      <text x="186" y="334">Tests need a real database.</text>
      <text x="186" y="352">Changing the database means</text>
      <text x="186" y="368">editing business code.</text>
    </g>

    <rect x="408" y="60" width="320" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="568" y="80" font-size="13" font-weight="700" fill="#36424e">composition root</text>
    <text x="568" y="97" font-size="11.5" fill="#36424e">makeRegisterUser({ userRepository, passwordHasher })</text>
    <rect x="428" y="140" width="280" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="568" y="159" font-size="14" font-weight="700" fill="#66400f">registerUser</text>
    <text x="568" y="176" font-size="11.5" fill="#66400f">high-level business logic</text>

    <rect x="400" y="214" width="336" height="56" rx="10" fill="#ffffff" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="568" y="229" font-size="11" font-style="italic" fill="#463365">abstractions (what registerUser asks for)</text>
    <rect x="412" y="238" width="150" height="24" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="487" y="254" font-size="11.5" font-weight="700" fill="#463365">userRepository.create</text>
    <rect x="574" y="238" width="150" height="24" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="649" y="254" font-size="11.5" font-weight="700" fill="#463365">passwordHasher.hash</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="392" y="320" width="114" height="44" rx="8"/>
      <rect x="514" y="320" width="114" height="44" rx="8"/>
      <rect x="636" y="320" width="114" height="44" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="449" y="339" font-size="12.5" font-weight="700">Mongo repo</text>
      <text x="449" y="355" font-size="11">production</text>
      <text x="571" y="339" font-size="12.5" font-weight="700">In-memory repo</text>
      <text x="571" y="355" font-size="11">tests</text>
      <text x="693" y="339" font-size="12.5" font-weight="700">argon2 hasher</text>
      <text x="693" y="355" font-size="11">production</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M568 108V138" marker-end="url(#dip-arrow)"/>
      <path d="M568 184V212" marker-end="url(#dip-arrow)"/>
    </g>
    <text x="578" y="128" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">injects</text>
    <text x="578" y="202" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">calls only these</text>
    <g fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M449 320V264" marker-end="url(#dip-arrow-p)"/>
      <path d="M571 320V300H520V264" marker-end="url(#dip-arrow-p)"/>
      <path d="M693 320V264" marker-end="url(#dip-arrow-p)"/>
    </g>
    <text x="568" y="384" font-size="11.5" font-style="italic" fill="#463365">implementations point up to the abstraction they implement</text>
    <text x="390" y="430" font-size="13" fill="#40566b">The import arrow flips: detail code depends on what the business logic asked for.</text>
  </g>
</svg>
