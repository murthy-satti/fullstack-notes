<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img" aria-labelledby="chor-title chor-desc">
  <title id="chor-title">Choreography: services react to each other's events through a broker</title>
  <desc id="chor-desc">Orders publishes OrderPlaced to the broker, and Payments, which subscribes to it, charges the card. Payments publishes PaymentSucceeded, which Inventory receives and reacts to by reserving stock; Inventory publishes StockReserved, which Shipping receives to create the shipment. If the charge fails, Payments publishes PaymentFailed instead, and Orders receives it and cancels the order. No single service holds the whole flow.</desc>
  <defs>
    <marker id="chor-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="chor-arrow-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="320" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="24" y="36" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="214" y="36" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="404" y="36" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="594" y="36" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <text x="104" y="59" font-size="14" font-weight="700" fill="#66400f">Orders</text>
    <text x="104" y="77" font-size="11.5" fill="#66400f">creates the order</text>
    <text x="294" y="59" font-size="14" font-weight="700" fill="#263e5a">Payments</text>
    <text x="294" y="77" font-size="11.5" fill="#263e5a">charges the card</text>
    <text x="484" y="59" font-size="14" font-weight="700" fill="#263e5a">Inventory</text>
    <text x="484" y="77" font-size="11.5" fill="#263e5a">reserves stock</text>
    <text x="674" y="59" font-size="14" font-weight="700" fill="#263e5a">Shipping</text>
    <text x="674" y="77" font-size="11.5" fill="#263e5a">creates the shipment</text>

    <rect x="24" y="122" width="730" height="116" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="746" y="230" font-size="12" font-weight="700" fill="#463365" text-anchor="end">broker (topics)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 92V150H240V94" marker-end="url(#chor-arrow)"/>
      <path d="M300 92V178H430V94" marker-end="url(#chor-arrow)"/>
      <path d="M520 92V150H640V94" marker-end="url(#chor-arrow)"/>
    </g>
    <path d="M350 92V206H140V94" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chor-arrow-r)"/>

    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="155" y="144">1. OrderPlaced</text>
      <text x="365" y="172">2. PaymentSucceeded</text>
      <text x="580" y="144">3. StockReserved</text>
    </g>
    <text x="245" y="222" font-size="11.5" font-weight="700" fill="#6b241c">or: PaymentFailed → Orders cancels the order</text>

    <text x="390" y="270" font-size="12" fill="#36424e">Each service only publishes its own events and subscribes to the ones it cares about;</text>
    <text x="390" y="287" font-size="12" fill="#36424e">adding a reaction means adding a subscriber, with no change to the others.</text>
    <text x="390" y="310" font-size="13" fill="#40566b">No one is in charge: the business flow exists only as the chain of events.</text>
  </g>
</svg>
