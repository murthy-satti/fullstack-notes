<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="cm-title cm-desc">
  <title id="cm-title">Context map: Catalog, Sales, Inventory, Shipping and a legacy ERP</title>
  <desc id="cm-desc">Each bounded context has its own Product model. Catalog is upstream of Sales in a customer-supplier relationship; Sales copies the price at order time. Sales publishes OrderPlaced events in a documented published language, and Inventory and Shipping subscribe to them. Shipping protects its model from a legacy ERP with an anticorruption layer, makeErpProductTranslator, which turns ITEM_WT_LBS, DIM_STR and HAZ into weightKg, dimensionsCm and hazardous.</desc>
  <defs>
    <marker id="cm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="36" width="230" height="80" rx="10" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="139" y="60" font-size="14" font-weight="700" fill="#263e5a">Catalog context</text>
    <text x="139" y="80" font-size="11.5" fill="#263e5a">Product: name, description,</text>
    <text x="139" y="96" font-size="11.5" fill="#263e5a">images, categories, price</text>

    <rect x="390" y="36" width="230" height="80" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="505" y="60" font-size="14" font-weight="700" fill="#66400f">Sales context</text>
    <text x="505" y="80" font-size="11.5" fill="#66400f">Product: SKU, price at time</text>
    <text x="505" y="96" font-size="11.5" fill="#66400f">of order, tax category</text>

    <rect x="390" y="164" width="230" height="36" rx="18" fill="#ffffff" stroke="#8062a8" stroke-width="2"/>
    <text x="505" y="187" font-size="12.5" font-weight="700" fill="#463365">OrderPlaced event (schema)</text>

    <rect x="200" y="250" width="230" height="80" rx="10" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="315" y="274" font-size="14" font-weight="700" fill="#294a2e">Inventory context</text>
    <text x="315" y="294" font-size="11.5" fill="#294a2e">Product: SKU, quantity on hand,</text>
    <text x="315" y="310" font-size="11.5" fill="#294a2e">warehouse location, reorder level</text>

    <rect x="490" y="250" width="230" height="80" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="605" y="274" font-size="14" font-weight="700" fill="#463365">Shipping context</text>
    <text x="605" y="294" font-size="11.5" fill="#463365">Product: weight, dimensions,</text>
    <text x="605" y="310" font-size="11.5" fill="#463365">hazardous-goods flag</text>

    <rect x="490" y="356" width="230" height="44" rx="8" fill="#ffffff" stroke="#8062a8" stroke-width="2"/>
    <text x="605" y="375" font-size="12.5" font-weight="700" fill="#463365">anticorruption layer</text>
    <text x="605" y="391" font-size="11" fill="#463365">makeErpProductTranslator</text>

    <rect x="200" y="356" width="200" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="375" font-size="13" font-weight="700" fill="#36424e">legacy ERP</text>
    <text x="300" y="391" font-size="11" fill="#36424e">ITEM_WT_LBS, DIM_STR, HAZ</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M254 76H388" marker-end="url(#cm-arrow)"/>
      <path d="M505 116V162" marker-end="url(#cm-arrow)"/>
      <path d="M460 200V224H315V248" marker-end="url(#cm-arrow)"/>
      <path d="M560 200V224H605V248" marker-end="url(#cm-arrow)"/>
      <path d="M400 378H488" marker-end="url(#cm-arrow)"/>
      <path d="M605 356V332" marker-end="url(#cm-arrow)"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="321" y="66" font-weight="700">U → D</text>
      <text x="321" y="96">customer–supplier</text>
      <text x="517" y="146" text-anchor="start">publishes</text>
      <text x="300" y="220" text-anchor="end">published language:</text>
      <text x="300" y="236" text-anchor="end">consumers subscribe</text>
      <text x="444" y="370">translates</text>
      <text x="617" y="346" text-anchor="start">weightKg, hazardous</text>
    </g>

    <rect x="24" y="164" width="150" height="62" rx="8" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="34" y="182" font-weight="700">U = upstream</text>
      <text x="34" y="198" font-weight="700">D = downstream</text>
      <text x="34" y="214">arrows show data flow</text>
    </g>
    <text x="390" y="444" font-size="13" fill="#40566b">"Product" means something different in each context; the map shows how the models meet.</text>
    <text x="390" y="462" font-size="12" fill="#40566b">Shipping never sees ERP field names: the anticorruption layer translates them at the border.</text>
  </g>
</svg>
