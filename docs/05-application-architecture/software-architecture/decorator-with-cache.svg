<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="dwc-title dwc-desc">
  <title id="dwc-title">Decorator: withCache wraps a product repository</title>
  <desc id="dwc-desc">The caller calls products.findById(id) without knowing a decorator is there. withCache first runs cache.get on the key product:id in Redis. On a hit it parses the JSON and returns without touching the database. On a miss it delegates to the wrapped repository's findById, which queries the database. If a product is found, withCache stores it with cache.set and an expiry of ttlSeconds, then returns it; if not, it returns null without caching.</desc>
  <defs>
    <marker id="dwc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="200" height="44" rx="22" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="124" y="39" font-size="13" font-weight="700" fill="#36424e">caller</text>
    <text x="124" y="55" font-size="11.5" fill="#36424e">products.findById(id)</text>

    <rect x="16" y="84" width="574" height="366" rx="12" fill="#fff8ec" stroke="#bd7a20" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="30" y="106" font-size="13" font-weight="700" fill="#66400f" text-anchor="start">withCache(repository, cache, ttlSeconds): same interface, extra behavior</text>

    <rect x="44" y="124" width="200" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="144" y="143" font-size="13" font-weight="700" fill="#66400f">cache.get(key)</text>
    <text x="144" y="160" font-size="11.5" fill="#66400f">key = "product:" + id</text>
    <path d="M144 188 234 216 144 244 54 216z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="144" y="220" font-size="12" font-weight="700" fill="#36424e">cache hit?</text>
    <rect x="300" y="194" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="430" y="213" font-size="13" font-weight="700" fill="#294a2e">return JSON.parse(cached)</text>
    <text x="430" y="230" font-size="11.5" fill="#294a2e">database not touched</text>

    <rect x="44" y="276" width="256" height="76" rx="10" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="154" y="294" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">wrapped repository</text>
    <rect x="64" y="304" width="216" height="38" rx="8" fill="#ffffff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="172" y="328" font-size="13" font-weight="700" fill="#263e5a">repository.findById(id)</text>

    <path d="M390 294 460 316 390 338 320 316z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="320" font-size="11.5" font-weight="700" fill="#36424e">found?</text>

    <rect x="44" y="384" width="270" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="179" y="403" font-size="13" font-weight="700" fill="#66400f">cache.set(key, json, { EX: ttl })</text>
    <text x="179" y="420" font-size="11.5" fill="#66400f">then return the product</text>
    <rect x="350" y="384" width="220" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="460" y="403" font-size="13" font-weight="700" fill="#36424e">return null</text>
    <text x="460" y="420" font-size="11.5" fill="#36424e">nothing is cached</text>

    <rect x="616" y="118" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="686" y="137" font-size="13" font-weight="700" fill="#463365">Redis</text>
    <text x="686" y="154" font-size="11.5" fill="#463365">cache</text>
    <rect x="616" y="250" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="686" y="269" font-size="13" font-weight="700" fill="#463365">Database</text>
    <text x="686" y="286" font-size="11.5" fill="#463365">products</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M124 64V122" marker-end="url(#dwc-arrow)"/>
      <path d="M144 168V186" marker-end="url(#dwc-arrow)"/>
      <path d="M234 216H298" marker-end="url(#dwc-arrow)"/>
      <path d="M144 244V302" marker-end="url(#dwc-arrow)"/>
      <path d="M280 323H318" marker-end="url(#dwc-arrow)"/>
      <path d="M390 338V362H179V382" marker-end="url(#dwc-arrow)"/>
      <path d="M460 316H500V382" marker-end="url(#dwc-arrow)"/>
    </g>
    <g fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M244 140H614"/>
      <path d="M272 304V262H614"/>
    </g>
    <g font-size="11" font-style="italic" fill="#463365">
      <text x="430" y="134">GET product:id</text>
      <text x="430" y="256">query</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="266" y="208">yes</text>
      <text x="152" y="262" text-anchor="start">no: delegate</text>
      
      <text x="382" y="356" text-anchor="end">yes</text>
      <text x="472" y="308" text-anchor="start">no</text>
    </g>
    <text x="390" y="484" font-size="13" fill="#40566b">The decorator adds caching around the call; neither the caller nor the repository changes.</text>
  </g>
</svg>
