<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="ulk-title ulk-desc">
  <title id="ulk-title">Response time rises slowly with utilization, then explodes past the knee</title>
  <desc id="ulk-desc">A curve of response time as a multiple of service time, using the single-queue formula service time divided by one minus utilization. At 50 percent utilization requests take 2 times the service time, at 80 percent 5 times, at 90 percent 10 times, and at 95 percent 20 times. The target band is 50 to 70 percent at peak, the knee lies between 70 and 90 percent, and above 90 percent is the danger zone.</desc>
  <rect width="780" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="400" y="60" width="128" height="280" fill="#e8f5e9"/>
    <rect x="528" y="60" width="128" height="280" fill="#fff0d9"/>
    <rect x="656" y="60" width="64" height="280" fill="#fde8e6"/>
    <g font-size="11.5" font-weight="700">
      <text x="464" y="52" fill="#294a2e">target 50-70%</text>
      <text x="592" y="52" fill="#66400f">knee</text>
      <text x="688" y="52" fill="#6b241c">danger</text>
    </g>
    <path d="M80 270H720M80 200H720M80 130H720M80 60H720" stroke="#dde3ea" stroke-width="1"/>
    <path d="M80 60V340H720" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#40566b" text-anchor="end">
      <text x="72" y="330">1×</text><text x="72" y="274">5×</text><text x="72" y="204">10×</text><text x="72" y="134">15×</text><text x="72" y="64">20×</text>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="80" y="358">0%</text><text x="208" y="358">20%</text><text x="336" y="358">40%</text>
      <text x="464" y="358">60%</text><text x="592" y="358">80%</text><text x="720" y="358">100%</text>
      <text x="400" y="382">utilization of the busiest resource</text>
      <text x="0" y="0" transform="translate(30 200) rotate(-90)">response time / service time</text>
    </g>

    <path d="M80 326L144 324.5L208 322.5L272 320L336 316.7L400 312L464 305L528 293.4L560 284L592 270L624 246.6L656 200L668.8 165L681.6 106.6L688 60" fill="none" stroke="#263e5a" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#263e5a" stroke-width="2">
      <circle cx="400" cy="312" r="5"/><circle cx="592" cy="270" r="5"/><circle cx="656" cy="200" r="5"/><circle cx="688" cy="60" r="5"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a" text-anchor="end">
      <text x="394" y="300">50%: 2×</text>
      <text x="584" y="262">80%: 5×</text>
      <text x="648" y="194">90%: 10×</text>
      <text x="680" y="78">95%: 20×</text>
    </g>
    <text x="96" y="96" font-size="11.5" fill="#36424e" text-anchor="start">response time = service time / (1 - utilization)</text>
    <text x="390" y="420" font-size="13" fill="#40566b">Latency grows slowly, then explodes past the knee: plan to run at 50-70% at peak.</text>
  </g>
</svg>
