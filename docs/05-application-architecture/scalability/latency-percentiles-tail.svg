<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="lpt-title lpt-desc">
  <title id="lpt-title">A latency distribution with p50, average, p95, p99, and the long tail</title>
  <desc id="lpt-desc">A histogram of request latency for one endpoint with illustrative numbers: 30 percent of requests take 0 to 25 ms, 35 percent 25 to 50 ms, 20 percent 50 to 100 ms, 10 percent 100 to 200 ms, 3 percent 200 to 400 ms, 1.5 percent 400 to 800 ms, and 0.5 percent over 800 ms. The median p50 is about 40 ms, the average about 70 ms, p95 about 200 ms and p99 about 670 ms. The slowest 5 percent of requests, the tail, take over 200 ms.</desc>
  <rect width="780" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="30" font-size="13" font-weight="700" fill="#36424e">Latency of one endpoint, bucketed (illustrative numbers)</text>

    <g stroke-width="2">
      <rect x="103" y="140" width="64" height="180" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="193" y="110" width="64" height="210" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="283" y="200" width="64" height="120" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="373" y="260" width="64" height="60" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="463" y="302" width="64" height="18" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="553" y="311" width="64" height="9" rx="2" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="643" y="317" width="64" height="3" rx="1" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <path d="M90 320H720" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#40566b">
      <text x="135" y="338">0-25</text><text x="225" y="338">25-50</text><text x="315" y="338">50-100</text><text x="405" y="338">100-200</text>
      <text x="495" y="338">200-400</text><text x="585" y="338">400-800</text><text x="675" y="338">800+</text>
      <text x="405" y="358">latency bucket (ms), share of requests above each bar</text>
    </g>

    <g fill="none" stroke-width="2" stroke-dasharray="5 4">
      <path d="M231 94V320" stroke="#53845b"/>
      <path d="M308 94V320" stroke="#8a96a3"/>
      <path d="M450 94V320" stroke="#bd7a20"/>
      <path d="M600 94V320" stroke="#b5473a"/>
    </g>
    <g fill="#f5f7fb">
      <rect x="123" y="123" width="24" height="14"/><rect x="213" y="93" width="24" height="14"/>
      <rect x="303" y="183" width="24" height="14"/><rect x="393" y="243" width="24" height="14"/>
      <rect x="486" y="285" width="18" height="14"/><rect x="571" y="294" width="28" height="14"/>
      <rect x="661" y="300" width="28" height="14"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="135" y="134">30%</text><text x="225" y="104">35%</text><text x="315" y="194">20%</text><text x="405" y="254">10%</text>
      <text x="495" y="296">3%</text><text x="585" y="305">1.5%</text><text x="675" y="311">0.5%</text>
    </g>
    <g font-size="12" font-weight="700">
      <text x="231" y="68" fill="#294a2e">p50 ≈ 40 ms</text>
      <text x="308" y="86" fill="#36424e">average ≈ 70 ms</text>
      <text x="450" y="68" fill="#66400f">p95 ≈ 200 ms</text>
      <text x="600" y="86" fill="#6b241c">p99 ≈ 670 ms</text>
    </g>
    <g font-size="11.5" fill="#66400f" text-anchor="start">
      <text x="612" y="236">the tail: 5% of</text>
      <text x="612" y="252">requests take</text>
      <text x="612" y="268">over 200 ms</text>
    </g>
    <text x="390" y="386" font-size="11.5" fill="#36424e">The average describes almost nobody: half take under 40 ms, and 1 in 100 waits 670 ms or more.</text>
    <text x="390" y="414" font-size="13" fill="#40566b">Track p95 and p99 from histograms; averages hide the tail.</text>
  </g>
</svg>
