<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="vvh-title vvh-desc">
  <title id="vvh-title">Vertical scaling compared with horizontal scaling</title>
  <desc id="vvh-desc">Vertical scaling resizes one machine from 4 vCPU and 16 GB of RAM to 32 vCPU and 256 GB; it needs no code changes, but it has a ceiling at the largest machine, cost rises steeply, the one machine is a single point of failure, and resizing often means a restart or failover. Horizontal scaling puts a load balancer in front of identical app instances, app 1 to app 4 and more, which keep shared state in Redis and the database; instances can be added without downtime and losing one removes only part of the capacity, but the application must be stateless.</desc>
  <defs>
    <marker id="vvh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="32" font-size="14" font-weight="700" fill="#40566b">Vertical: scale up</text>
    <text x="600" y="32" font-size="14" font-weight="700" fill="#40566b">Horizontal: scale out</text>
    <path d="M400 20V390" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="230" y="48" width="120" height="30" rx="15" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="290" y="68" font-size="12.5" font-weight="700" fill="#36424e">clients</text>
    <text x="90" y="114" font-size="11" font-style="italic" fill="#40566b">before</text>
    <rect x="40" y="120" width="100" height="50" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="90" y="141" font-size="13" font-weight="700" fill="#36424e">4 vCPU</text>
    <text x="90" y="158" font-size="11.5" fill="#36424e">16 GB RAM</text>
    <rect x="200" y="98" width="170" height="104" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2.5"/>
    <text x="285" y="140" font-size="16" font-weight="700" fill="#263e5a">32 vCPU</text>
    <text x="285" y="160" font-size="12" fill="#263e5a">256 GB RAM</text>
    <text x="285" y="190" font-size="11" font-style="italic" fill="#263e5a">after: one bigger machine</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M140 145H198" marker-end="url(#vvh-arrow)"/>
      <path d="M290 78V96" marker-end="url(#vvh-arrow)"/>
    </g>
    <text x="169" y="138" font-size="11" font-weight="700" fill="#40566b">resize</text>

    <g font-size="11.5" font-weight="700">
      <rect x="40" y="228" width="330" height="28" rx="14" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="205" y="246" fill="#294a2e">no code changes</text>
      <rect x="40" y="266" width="330" height="28" rx="14" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="205" y="284" fill="#66400f">ceiling: the largest machine; cost rises steeply</text>
      <rect x="40" y="304" width="330" height="28" rx="14" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="205" y="322" fill="#6b241c">one machine: a single point of failure</text>
      <rect x="40" y="342" width="330" height="28" rx="14" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="205" y="360" fill="#6b241c">resizing often means a restart or failover</text>
    </g>

    <rect x="540" y="48" width="120" height="30" rx="15" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="600" y="68" font-size="12.5" font-weight="700" fill="#36424e">clients</text>
    <rect x="520" y="96" width="160" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="600" y="118" font-size="13" font-weight="700" fill="#36424e">load balancer</text>
    <g font-size="12.5" font-weight="700" fill="#66400f">
      <rect x="432" y="170" width="64" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="464" y="195">app 1</text>
      <rect x="508" y="170" width="64" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="540" y="195">app 2</text>
      <rect x="584" y="170" width="64" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="616" y="195">app 3</text>
      <rect x="660" y="170" width="64" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="692" y="195">app 4</text>
      <rect x="734" y="170" width="44" height="40" rx="8" fill="#f5f7fb" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="756" y="195">+N</text>
    </g>
    <rect x="460" y="236" width="290" height="32" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="605" y="257" font-size="12.5" font-weight="700" fill="#463365">Redis + database: shared state</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M600 78V94" marker-end="url(#vvh-arrow)"/>
      <path d="M570 130 470 168" marker-end="url(#vvh-arrow)"/>
      <path d="M585 130 542 168" marker-end="url(#vvh-arrow)"/>
      <path d="M615 130 616 168" marker-end="url(#vvh-arrow)"/>
      <path d="M630 130 688 168" marker-end="url(#vvh-arrow)"/>
    </g>
    <g fill="none" stroke="#8062a8" stroke-width="1.5" stroke-linecap="round">
      <path d="M464 210V234"/>
      <path d="M540 210V234"/>
      <path d="M616 210V234"/>
      <path d="M692 210V234"/>
    </g>

    <g font-size="11.5" font-weight="700">
      <rect x="430" y="290" width="346" height="28" rx="14" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="603" y="308" fill="#294a2e">add instances without downtime; no hard ceiling</text>
      <rect x="430" y="326" width="346" height="28" rx="14" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="603" y="344" fill="#294a2e">losing one instance removes only 1/N of capacity</text>
      <rect x="430" y="362" width="346" height="28" rx="14" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="603" y="380" fill="#66400f">the app must be stateless; needs load balancing</text>
    </g>
    <text x="400" y="408" font-size="12.5" fill="#40566b">Most systems scale the stateless app tier out and the database up first.</text>
  </g>
</svg>
