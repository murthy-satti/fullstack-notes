<svg xmlns="http://www.w3.org/2000/svg" width="800" height="404" viewBox="0 0 800 404" role="img" aria-labelledby="cap-title cap-desc">
  <title id="cap-title">During a network partition a CP system refuses requests while an AP system answers with possibly stale data</title>
  <desc id="cap-desc">In both cases a partition separates replica 1 in region A from replica 2 in region B, so replication is blocked. Client 1 withdraws 80 dollars at replica 1, leaving 20. Client 2 then reads the balance from replica 2, which still holds 100. A CP system refuses the read with an error or timeout until the partition heals, so nobody sees stale data but region B is unavailable. An AP system answers 100, which is stale, and the replicas reconcile after the partition heals.</desc>
  <defs>
    <marker id="cap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cap-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="800" height="404" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="205" y="30" font-size="13" font-weight="700" fill="#263e5a">CP: stay consistent, refuse requests</text>
    <text x="595" y="30" font-size="13" font-weight="700" fill="#66400f">AP: stay available, maybe stale</text>
    <path d="M400 20V330" stroke="#c9d1db" stroke-width="1.5"/>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="40" y="56" width="130" height="40" rx="8"/><rect x="240" y="56" width="130" height="40" rx="8"/>
      <rect x="430" y="56" width="130" height="40" rx="8"/><rect x="630" y="56" width="130" height="40" rx="8"/>
      <rect x="240" y="160" width="130" height="56" rx="8"/><rect x="630" y="160" width="130" height="56" rx="8"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="40" y="160" width="130" height="56" rx="8"/><rect x="430" y="160" width="130" height="56" rx="8"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="105" y="81" fill="#36424e">Client 1</text><text x="305" y="81" fill="#36424e">Client 2</text>
      <text x="495" y="81" fill="#36424e">Client 1</text><text x="695" y="81" fill="#36424e">Client 2</text>
      <text x="105" y="183" fill="#263e5a">Replica 1</text><text x="305" y="183" fill="#36424e">Replica 2</text>
      <text x="495" y="183" fill="#263e5a">Replica 1</text><text x="695" y="183" fill="#36424e">Replica 2</text>
    </g>
    <g font-size="11.5">
      <text x="105" y="201" fill="#263e5a">region A: $20</text><text x="305" y="201" fill="#36424e">region B: $100</text>
      <text x="495" y="201" fill="#263e5a">region A: $20</text><text x="695" y="201" fill="#36424e">region B: $100</text>
    </g>

    <g stroke="#b5473a" stroke-width="2.5" stroke-dasharray="6 5">
      <path d="M205 142V236"/><path d="M595 142V236"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#6b241c">
      <text x="205" y="136">partition</text><text x="595" y="136">partition</text>
      <text x="205" y="252">sync blocked</text><text x="595" y="252">sync blocked</text>
    </g>

    <rect x="240" y="268" width="130" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="305" y="288" font-size="14" font-weight="700" fill="#6b241c">Refuses</text>
    <text x="305" y="305" font-size="11.5" fill="#6b241c">error or timeout</text>
    <rect x="630" y="268" width="130" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="695" y="288" font-size="14" font-weight="700" fill="#66400f">Answers $100</text>
    <text x="695" y="305" font-size="11.5" fill="#66400f">stale: $80 missing</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M105 96V158" marker-end="url(#cap-arrow)"/>
      <path d="M305 96V158" marker-end="url(#cap-arrow)"/>
      <path d="M305 216V266" marker-end="url(#cap-arrow)"/>
      <path d="M495 96V158" marker-end="url(#cap-arrow)"/>
      <path d="M695 96V158" marker-end="url(#cap-arrow)"/>
      <path d="M695 216V266" marker-end="url(#cap-arrow)"/>
    </g>
    <g fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4">
      <path d="M170 176H238" marker-end="url(#cap-red)"/>
      <path d="M560 176H628" marker-end="url(#cap-red)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="97" y="130" text-anchor="end">withdraw $80</text><text x="313" y="130">read balance</text>
      <text x="487" y="130" text-anchor="end">withdraw $80</text><text x="703" y="130">read balance</text>
      <text x="313" y="246">answer</text><text x="703" y="246">answer</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="205" y="344">No stale reads, but region B</text>
      <text x="205" y="360">is unavailable until it heals.</text>
      <text x="595" y="344">Always answers, but may be stale;</text>
      <text x="595" y="360">replicas reconcile after the heal.</text>
    </g>
    <text x="400" y="392" font-size="13" fill="#40566b">During a partition a replicated store must refuse (CP) or answer with possibly stale data (AP).</text>
  </g>
</svg>
