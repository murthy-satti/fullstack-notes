<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="smr-title smr-desc">
  <title id="smr-title">In-memory sessions break behind a load balancer; sessions in Redis do not</title>
  <desc id="smr-desc">Before: the browser logs in with POST /login, the load balancer sends it to App 1, and the session abc is stored only in App 1's memory. The next request, GET /cart with the cookie sid=abc, is routed to App 2, which has no session abc, so it answers 401 and the user looks logged out. Sticky sessions hide this only until App 1 restarts or is scaled in. After: App 1 stores the session in Redis with SET sess:abc, and App 2 reads it with GET sess:abc, so any instance can serve the user. Uploaded files go to object storage and records to the database, so no state lives in the app instances.</desc>
  <defs>
    <marker id="smr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="205" y="30" font-size="13" font-weight="700" fill="#6b241c">Before: sessions in each app's memory</text>
    <text x="600" y="30" font-size="13" font-weight="700" fill="#294a2e">After: sessions in Redis</text>
    <path d="M400 18V380" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="12.5" font-weight="700" fill="#36424e">
      <rect x="145" y="46" width="120" height="30" rx="15" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="205" y="66">browser</text>
      <rect x="145" y="102" width="120" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="205" y="123">load balancer</text>
      <rect x="540" y="46" width="120" height="30" rx="15" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="600" y="66">browser</text>
      <rect x="540" y="102" width="120" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="600" y="123">load balancer</text>
    </g>

    <rect x="40" y="184" width="140" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="205" font-size="13.5" font-weight="700" fill="#66400f">App 1</text>
    <text x="110" y="223" font-size="11.5" fill="#66400f">sessions Map: abc</text>
    <rect x="230" y="184" width="140" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="300" y="205" font-size="13.5" font-weight="700" fill="#66400f">App 2</text>
    <text x="300" y="223" font-size="11.5" fill="#66400f">sessions Map: empty</text>
    <rect x="40" y="252" width="140" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="110" y="270" font-size="11" fill="#36424e">login lives only here</text>
    <rect x="230" y="252" width="140" height="44" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="300" y="270" font-size="11.5" font-weight="700" fill="#6b241c">no session abc</text>
    <text x="300" y="286" font-size="11.5" fill="#6b241c">401: looks logged out</text>
    <text x="205" y="332" font-size="11.5" font-style="italic" fill="#6b241c">Sticky sessions hide this only until</text>
    <text x="205" y="348" font-size="11.5" font-style="italic" fill="#6b241c">App 1 restarts or is scaled in.</text>

    <rect x="430" y="184" width="140" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="500" y="205" font-size="13.5" font-weight="700" fill="#66400f">App 1</text>
    <text x="500" y="223" font-size="11.5" fill="#66400f">no local state</text>
    <rect x="620" y="184" width="140" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="690" y="205" font-size="13.5" font-weight="700" fill="#66400f">App 2</text>
    <text x="690" y="223" font-size="11.5" fill="#66400f">no local state</text>

    <rect x="420" y="290" width="116" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="478" y="309" font-size="12.5" font-weight="700" fill="#463365">Redis</text>
    <text x="478" y="325" font-size="11" fill="#463365">sess:abc</text>
    <rect x="544" y="290" width="116" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="602" y="309" font-size="12.5" font-weight="700" fill="#263e5a">Object storage</text>
    <text x="602" y="325" font-size="11" fill="#263e5a">uploaded files</text>
    <rect x="668" y="290" width="112" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="724" y="309" font-size="12.5" font-weight="700" fill="#263e5a">Database</text>
    <text x="724" y="325" font-size="11" fill="#263e5a">records</text>
    <rect x="420" y="348" width="360" height="28" rx="14" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="600" y="366" font-size="11.5" font-weight="700" fill="#294a2e">App 2 finds the session: 200 OK on any instance</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M205 76V100" marker-end="url(#smr-arrow)"/>
      <path d="M180 134 112 182" marker-end="url(#smr-arrow)"/>
      <path d="M230 134 298 182" marker-end="url(#smr-arrow)"/>
      <path d="M600 76V100" marker-end="url(#smr-arrow)"/>
      <path d="M575 134 502 182" marker-end="url(#smr-arrow)"/>
      <path d="M625 134 688 182" marker-end="url(#smr-arrow)"/>
      <path d="M480 236V288" marker-end="url(#smr-arrow)"/>
      <path d="M650 236 520 288" marker-end="url(#smr-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="140" y="160" text-anchor="end">1. POST /login</text>
      <text x="270" y="160" text-anchor="start">2. GET /cart, sid=abc</text>
      <text x="535" y="160" text-anchor="end">1. POST /login</text>
      <text x="664" y="160" text-anchor="start">2. GET /cart, sid=abc</text>
      <text x="488" y="268" text-anchor="start">SET</text>
      <text x="620" y="272" text-anchor="start">GET sess:abc</text>
    </g>
    <text x="400" y="404" font-size="13" fill="#40566b">Move sessions, files, and other state into shared services so instances are interchangeable.</text>
  </g>
</svg>
