<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="ryw-title ryw-desc">
  <title id="ryw-title">Read replicas, replication lag, and read-your-writes</title>
  <desc id="ryw-desc">The app sends all writes to the primary, which replicates asynchronously to replica 1 and replica 2 with a lag of milliseconds to seconds; reads that can tolerate lag go to the replicas. Without a fix, a user updates their name to "Asha K" on the primary, reloads the page, the read goes to a replica that is 200 ms behind, and the user sees the old name "Asha" and thinks the save failed. With a fix, the app remembers the time of the user's last write and routes that user's reads to the primary for the next 10 seconds, so the user sees "Asha K". Other fixes are tracking the replication position or using causally consistent sessions.</desc>
  <defs>
    <marker id="ryw-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ryw-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="56" width="140" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="80" font-size="14" font-weight="700" fill="#66400f">App</text>
    <text x="110" y="98" font-size="11.5" fill="#66400f">routes reads/writes</text>
    <rect x="330" y="40" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2.5"/>
    <text x="410" y="64" font-size="14" font-weight="700" fill="#263e5a">Primary</text>
    <text x="410" y="82" font-size="11.5" fill="#263e5a">accepts all writes</text>
    <rect x="610" y="30" width="150" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="685" y="55" font-size="13" font-weight="700" fill="#36424e">Replica 1</text>
    <rect x="610" y="90" width="150" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="685" y="115" font-size="13" font-weight="700" fill="#36424e">Replica 2</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 74H328" marker-end="url(#ryw-arrow)"/>
      <path d="M110 112V158H685V132" marker-end="url(#ryw-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M490 56H608" marker-end="url(#ryw-arrow-ret)"/>
      <path d="M490 80 608 106" marker-end="url(#ryw-arrow-ret)"/>
    </g>
    <text x="254" y="66" font-size="11.5" font-weight="700" fill="#40566b">writes</text>
    <text x="549" y="44" font-size="11" fill="#40566b">async replication</text>
    <text x="549" y="134" font-size="11" fill="#40566b">lag: ms to seconds</text>
    <text x="398" y="176" font-size="11.5" font-weight="700" fill="#40566b">reads that can tolerate lag</text>

    <path d="M24 196H776" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="222" font-size="13" font-weight="700" fill="#6b241c" text-anchor="start">Without a fix</text>
    <rect x="24" y="232" width="236" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="142" y="252" font-size="12.5" font-weight="700" fill="#263e5a">1. PATCH /me: "Asha K"</text>
    <text x="142" y="270" font-size="11.5" fill="#263e5a">written to the primary</text>
    <rect x="284" y="232" width="236" height="50" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="402" y="252" font-size="12.5" font-weight="700" fill="#36424e">2. reload: GET /me</text>
    <text x="402" y="270" font-size="11.5" fill="#36424e">sent to a replica 200 ms behind</text>
    <rect x="544" y="232" width="232" height="50" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="660" y="252" font-size="12.5" font-weight="700" fill="#6b241c">shows the old name "Asha"</text>
    <text x="660" y="270" font-size="11.5" fill="#6b241c">"did my save fail?"</text>

    <text x="24" y="310" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Fix: read your own writes from the primary</text>
    <rect x="24" y="320" width="236" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="142" y="340" font-size="12.5" font-weight="700" fill="#263e5a">1. same write to the primary</text>
    <text x="142" y="358" font-size="11.5" fill="#263e5a">remember lastWriteAt for the user</text>
    <rect x="284" y="320" width="236" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="402" y="340" font-size="12.5" font-weight="700" fill="#66400f">2. GET /me within 10 s</text>
    <text x="402" y="358" font-size="11.5" fill="#66400f">routed to the primary</text>
    <rect x="544" y="320" width="232" height="50" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="660" y="340" font-size="12.5" font-weight="700" fill="#294a2e">shows "Asha K"</text>
    <text x="660" y="358" font-size="11.5" fill="#294a2e">other users still read replicas</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M260 257H282" marker-end="url(#ryw-arrow)"/>
      <path d="M520 257H542" marker-end="url(#ryw-arrow)"/>
      <path d="M260 345H282" marker-end="url(#ryw-arrow)"/>
      <path d="M520 345H542" marker-end="url(#ryw-arrow)"/>
    </g>
    <text x="400" y="400" font-size="12.5" fill="#40566b">Other fixes: track the replication position, or use causally consistent sessions (MongoDB).</text>
  </g>
</svg>
