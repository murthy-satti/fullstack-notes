<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="rlw-title rlw-desc">
  <title id="rlw-title">Where the time goes in one API request on a new HTTPS connection</title>
  <desc id="rlw-desc">A waterfall of one request taking 170 milliseconds with illustrative numbers: DNS lookup 20 ms, TCP handshake 20 ms, TLS handshake 20 ms, waiting for a worker 15 ms, application code 10 ms, database queries 60 ms made of 30 sequential queries at 2 ms each, serializing JSON 5 ms, and sending the response 20 ms. Batching the queries into one saves about 58 ms, and reusing the connection skips the 60 ms of DNS, TCP and TLS on later requests.</desc>
  <rect width="800" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="32" font-size="13" font-weight="700" fill="#36424e">One API request on a new HTTPS connection (illustrative numbers, 170 ms total)</text>
    <g stroke="#dde3ea" stroke-width="1">
      <path d="M230 52V314M290 52V314M350 52V314M410 52V314M470 52V314M530 52V314M590 52V314M650 52V314M710 52V314M770 52V314"/>
    </g>
    <path d="M170 52V314H770" fill="none" stroke="#8a96a3" stroke-width="1.5"/>

    <g font-size="12" fill="#36424e" text-anchor="end">
      <text x="158" y="76">DNS lookup</text>
      <text x="158" y="108">TCP handshake</text>
      <text x="158" y="140">TLS handshake</text>
      <text x="158" y="172">Wait for a worker</text>
      <text x="158" y="204">App code (CPU)</text>
      <text x="158" y="236">Database queries</text>
      <text x="158" y="268">Serialize JSON</text>
      <text x="158" y="300">Send response</text>
    </g>

    <g stroke-width="2">
      <rect x="170" y="62" width="60" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="94" width="60" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="290" y="126" width="60" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="350" y="158" width="45" height="20" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="395" y="190" width="30" height="20" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="425" y="222" width="180" height="20" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="605" y="254" width="15" height="20" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="620" y="286" width="60" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="236" y="76">20 ms</text>
      <text x="296" y="108">20 ms</text>
      <text x="356" y="140">20 ms</text>
      <text x="401" y="172">15 ms</text>
      <text x="431" y="204">10 ms</text>
      <text x="611" y="236" font-weight="700" fill="#463365">60 ms: 30 queries x 2 ms</text>
      <text x="626" y="268">5 ms</text>
      <text x="686" y="300">20 ms</text>
    </g>

    <g font-size="11.5" fill="#40566b">
      <text x="170" y="330">0</text><text x="230" y="330">20</text><text x="290" y="330">40</text><text x="350" y="330">60</text>
      <text x="410" y="330">80</text><text x="470" y="330">100</text><text x="530" y="330">120</text><text x="590" y="330">140</text>
      <text x="650" y="330">160</text><text x="710" y="330">180</text><text x="770" y="330">200 ms</text>
    </g>

    <g stroke-width="2">
      <rect x="196" y="344" width="14" height="12" rx="2" fill="#e5efff" stroke="#4774aa"/>
      <rect x="306" y="344" width="14" height="12" rx="2" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="416" y="344" width="14" height="12" rx="2" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="526" y="344" width="14" height="12" rx="2" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="216" y="354">network</text><text x="326" y="354">waiting</text><text x="436" y="354">app CPU</text><text x="546" y="354">database</text>
    </g>
    <text x="400" y="382" font-size="11.5" fill="#66400f">Batching the 30 queries into one saves about 58 ms; reusing the connection skips DNS, TCP and TLS (60 ms).</text>
    <text x="400" y="412" font-size="13" fill="#40566b">Most of the time is waiting on round trips and sequential queries, not on CPU.</text>
  </g>
</svg>
