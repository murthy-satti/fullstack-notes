<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="ats-title ats-desc">
  <title id="ats-title">Where the acknowledgement sits decides what a crash does</title>
  <desc id="ats-desc">At-most-once: the consumer receives, acks, then processes; a crash between ack and processing loses the message. At-least-once: the consumer receives, processes, then acks; a crash before the ack makes the broker redeliver, so the work runs twice. Effectively once: the consumer processes and saves the message ID in one transaction, then acks; after a crash the redelivered message is found by its ID and skipped, so the effect happens once.</desc>
  <defs>
    <marker id="ats-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="685" y="44" font-size="12" font-weight="700" fill="#6b241c">If it crashes at X:</text>
    <path d="M24 156H776M24 266H776" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="80" y="92" font-size="14" font-weight="700" fill="#36424e">At-most-once</text>
    <text x="80" y="110" font-size="11.5" fill="#40566b">ack, then process</text>
    <text x="80" y="202" font-size="14" font-weight="700" fill="#36424e">At-least-once</text>
    <text x="80" y="220" font-size="11.5" fill="#40566b">process, then ack</text>
    <text x="80" y="306" font-size="14" font-weight="700" fill="#36424e">Effectively</text>
    <text x="80" y="323" font-size="14" font-weight="700" fill="#36424e">once</text>
    <text x="80" y="340" font-size="11.5" fill="#40566b">dedupe, then ack</text>

    <g font-size="14" font-weight="700">
      <rect x="150" y="74" width="112" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="206" y="94" fill="#263e5a">receive</text>
      <rect x="300" y="74" width="112" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="356" y="94" fill="#36424e">ack</text>
      <rect x="450" y="74" width="112" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="506" y="94" fill="#66400f">process</text>

      <rect x="150" y="184" width="112" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="206" y="204" fill="#263e5a">receive</text>
      <rect x="300" y="184" width="112" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="356" y="204" fill="#66400f">process</text>
      <rect x="450" y="184" width="112" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="506" y="204" fill="#36424e">ack</text>

      <rect x="150" y="294" width="112" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="206" y="314" fill="#263e5a">receive</text>
      <rect x="300" y="294" width="112" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="356" y="314" fill="#66400f">process</text>
      <rect x="450" y="294" width="112" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="506" y="314" fill="#36424e">ack</text>
    </g>
    <g font-size="11.5">
      <text x="206" y="111" fill="#263e5a">from broker</text>
      <text x="356" y="111" fill="#36424e">message deleted</text>
      <text x="506" y="111" fill="#66400f">side effect</text>
      <text x="206" y="221" fill="#263e5a">from broker</text>
      <text x="356" y="221" fill="#66400f">side effect</text>
      <text x="506" y="221" fill="#36424e">message deleted</text>
      <text x="206" y="331" fill="#263e5a">from broker</text>
      <text x="356" y="331" fill="#66400f">+ save ID, 1 txn</text>
      <text x="506" y="331" fill="#36424e">message deleted</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M262 98H298" marker-end="url(#ats-arrow)"/>
      <path d="M412 98H448" marker-end="url(#ats-arrow)"/>
      <path d="M262 208H298" marker-end="url(#ats-arrow)"/>
      <path d="M412 208H448" marker-end="url(#ats-arrow)"/>
      <path d="M262 318H298" marker-end="url(#ats-arrow)"/>
      <path d="M412 318H448" marker-end="url(#ats-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#6b241c">
      <circle cx="430" cy="98" r="10" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
      <text x="430" y="102">X</text>
      <circle cx="430" cy="208" r="10" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
      <text x="430" y="212">X</text>
      <circle cx="430" cy="318" r="10" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
      <text x="430" y="322">X</text>
    </g>

    <rect x="590" y="72" width="190" height="52" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="685" y="94" font-size="14" font-weight="700" fill="#6b241c">Message lost</text>
    <text x="685" y="112" font-size="11.5" fill="#6b241c">acked but never processed</text>
    <rect x="590" y="182" width="190" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="685" y="204" font-size="14" font-weight="700" fill="#66400f">Processed twice</text>
    <text x="685" y="222" font-size="11.5" fill="#66400f">no ack: broker redelivers</text>
    <rect x="590" y="292" width="190" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="685" y="314" font-size="14" font-weight="700" fill="#294a2e">Effect happens once</text>
    <text x="685" y="332" font-size="11.5" fill="#294a2e">duplicate found, just ack</text>

    <text x="400" y="396" font-size="13" fill="#40566b">Where the ack sits relative to processing decides whether a crash loses or repeats work.</text>
  </g>
</svg>
