<svg xmlns="http://www.w3.org/2000/svg" width="780" height="484" viewBox="0 0 780 484" role="img" aria-labelledby="kra-title kra-desc">
  <title id="kra-title">With acks=all, the leader acknowledges a write only after the in-sync replicas have it</title>
  <desc id="kra-desc">1: the producer sends a record with acks=all to broker 1, the leader of partition P0. 2: the leader appends it to its log. 3: follower broker 2 fetches from offset n. 4: the leader returns record n. 5: broker 2's next fetch shows it has stored n. 6: the leader acks the producer because two in-sync copies exist. Broker 3 has fallen behind and is dropped from the in-sync replica set, so it is not waited for. With min.insync.replicas = 2, writes fail with NotEnoughReplicas instead of being silently lost if fewer replicas are in sync.</desc>
  <defs>
    <marker id="kra-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="kra-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="kra-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="780" height="484" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M100 74V372"/><path d="M290 74V372"/><path d="M470 74V372"/><path d="M650 74V372"/>
    </g>
    <rect x="25" y="24" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="100" y="45" font-size="14" font-weight="700" fill="#263e5a">Producer</text>
    <text x="100" y="63" font-size="11.5" fill="#263e5a">acks=all</text>
    <rect x="215" y="24" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="290" y="45" font-size="14" font-weight="700" fill="#66400f">Broker 1</text>
    <text x="290" y="63" font-size="11.5" fill="#66400f">leader of P0</text>
    <rect x="395" y="24" width="150" height="50" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="470" y="45" font-size="14" font-weight="700" fill="#294a2e">Broker 2</text>
    <text x="470" y="63" font-size="11.5" fill="#294a2e">follower, in ISR</text>
    <rect x="575" y="24" width="150" height="50" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="650" y="45" font-size="14" font-weight="700" fill="#36424e">Broker 3</text>
    <text x="650" y="63" font-size="11.5" fill="#36424e">follower, lagging</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 112H288" marker-end="url(#kra-arrow)"/>
      <path d="M290 136H322V160H294" marker-end="url(#kra-arrow)"/>
      <path d="M470 196H292" marker-end="url(#kra-arrow)"/>
      <path d="M470 258H292" marker-end="url(#kra-arrow)"/>
    </g>
    <path d="M290 222H468" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#kra-ret)"/>
    <path d="M290 300H102" fill="none" stroke="#53845b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#kra-ok)"/>
    <g font-size="11.5" fill="#40566b">
      <text x="195" y="106">1  produce(record)</text>
      <text x="330" y="154" text-anchor="start">2  append to log</text>
      <text x="380" y="190">3  fetch from offset n</text>
      <text x="380" y="216">4  record n</text>
      <text x="380" y="252">5  next fetch: has n</text>
      <text x="195" y="294" fill="#294a2e">6  ack: 2 in-sync copies</text>
    </g>

    <rect x="570" y="150" width="160" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="650" y="170" font-size="14" font-weight="700" fill="#6b241c">Broker 3 lags</text>
    <text x="650" y="187" font-size="11.5" fill="#6b241c">dropped from the ISR</text>

    <rect x="40" y="392" width="700" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="413" font-size="13" font-weight="700" fill="#36424e">min.insync.replicas = 2 with replication factor 3</text>
    <text x="390" y="432" font-size="11.5" fill="#36424e">Writes succeed while 2 replicas are in sync; below that the producer gets NotEnoughReplicas, not silent loss.</text>
    <text x="390" y="468" font-size="13" fill="#40566b">With acks=all the producer hears success only after every in-sync replica has the record.</text>
  </g>
</svg>
