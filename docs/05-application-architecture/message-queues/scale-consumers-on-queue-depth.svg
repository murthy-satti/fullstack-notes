<svg xmlns="http://www.w3.org/2000/svg" width="780" height="452" viewBox="0 0 780 452" role="img" aria-labelledby="scq-title scq-desc">
  <title id="scq-title">Scaling queue consumers on backlog, capped by what the database can take</title>
  <desc id="scq-desc">Producers publish bursty traffic into a queue whose depth is 12,000 and whose oldest message is 4 minutes old. Workers consume from the queue and write to a database that allows at most 200 connections. The queue exports depth and oldest-message age as metrics. An autoscaler checks whether the backlog per worker is above target; if yes it adds workers, up to maxWorkers, which keeps database connections below the limit; if not it holds or scales in. Workers needed equals arrival rate plus backlog divided by target delay, divided by the rate per worker, capped at maxWorkers.</desc>
  <defs>
    <marker id="scq-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="452" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="150" width="130" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="89" y="170" font-size="14" font-weight="700" fill="#263e5a">Producers</text>
    <text x="89" y="187" font-size="11.5" fill="#263e5a">bursty traffic</text>
    <rect x="200" y="140" width="170" height="68" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="285" y="162" font-size="14" font-weight="700" fill="#36424e">Queue</text>
    <text x="285" y="180" font-size="11.5" fill="#36424e">depth: 12,000</text>
    <text x="285" y="196" font-size="11.5" fill="#36424e">oldest: 4 min</text>

    <rect x="420" y="110" width="160" height="128" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="500" y="130" font-size="14" font-weight="700" fill="#66400f">Workers</text>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="436" y="140" width="128" height="24" rx="6"/>
      <rect x="436" y="170" width="128" height="24" rx="6"/>
      <rect x="436" y="200" width="128" height="24" rx="6"/>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="500" y="156">worker 1</text>
      <text x="500" y="186">worker 2</text>
      <text x="500" y="216">worker N</text>
    </g>

    <rect x="640" y="140" width="120" height="68" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="700" y="162" font-size="14" font-weight="700" fill="#263e5a">Database</text>
    <text x="700" y="180" font-size="11.5" fill="#263e5a">max 200</text>
    <text x="700" y="196" font-size="11.5" fill="#263e5a">connections</text>
    <text x="700" y="226" font-size="11.5" fill="#40566b">maxWorkers keeps</text>
    <text x="700" y="240" font-size="11.5" fill="#40566b">connections below it</text>

    <rect x="200" y="288" width="170" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="285" y="308" font-size="14" font-weight="700" fill="#463365">Queue metrics</text>
    <text x="285" y="325" font-size="11.5" fill="#463365">depth, oldest age</text>
    <path d="M500 280 600 312 500 344 400 312z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="500" y="309" font-size="12" font-weight="700" fill="#36424e">backlog per worker</text>
    <text x="500" y="323" font-size="12" font-weight="700" fill="#36424e">above target?</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M154 174H198" marker-end="url(#scq-arrow)"/>
      <path d="M370 174H418" marker-end="url(#scq-arrow)"/>
      <path d="M580 174H638" marker-end="url(#scq-arrow)"/>
      <path d="M285 208V286" marker-end="url(#scq-arrow)"/>
      <path d="M370 312H398" marker-end="url(#scq-arrow)"/>
      <path d="M500 280V240" marker-end="url(#scq-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="176" y="166">publish</text>
      <text x="394" y="166">consume</text>
      <text x="609" y="166">writes</text>
      <text x="293" y="252" text-anchor="start">exports</text>
      <text x="508" y="266" text-anchor="start">yes: add workers, up to maxWorkers</text>
      <text x="608" y="316" text-anchor="start">no: hold or scale in</text>
    </g>

    <rect x="24" y="370" width="736" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="392" y="395" font-size="12" fill="#36424e">workers = (arrival rate + backlog / target delay) / rate per worker, capped at maxWorkers</text>
    <text x="390" y="436" font-size="13" fill="#40566b">Scale on backlog, but never past what the downstream database can absorb.</text>
  </g>
</svg>
