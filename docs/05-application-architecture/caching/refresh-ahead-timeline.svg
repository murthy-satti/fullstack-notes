<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="rat-title rat-desc">
  <title id="rat-title">Refresh-ahead on a timeline with a 60-second TTL</title>
  <desc id="rat-desc">A value is cached at t equals 0 with a TTL of 60 seconds and a refresh threshold of 80 percent, which is 48 seconds. A read at 20 seconds simply returns the cached value. A read at 48 seconds returns the current value immediately and triggers one background reload from the database, which stores a fresh value and resets the TTL, so hot keys never hit an expiry gap. Without refresh-ahead, the entry would expire at 60 seconds and the next read would be a slow miss.</desc>
  <defs>
    <marker id="rat-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="300" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="26" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">TTL = 60 s, refresh threshold = 80% (48 s)</text>

    <rect x="80" y="70" width="512" height="28" rx="4" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="336" y="89" font-size="12" font-weight="700" fill="#463365">cached value (age under 48 s)</text>
    <rect x="592" y="70" width="128" height="28" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="656" y="89" font-size="12" font-weight="700" fill="#66400f">refresh window</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M293 52V68" marker-end="url(#rat-arrow)"/>
      <path d="M592 52V68" marker-end="url(#rat-arrow)"/>
      <path d="M598 98V118H612" marker-end="url(#rat-arrow)"/>
      <path d="M680 132V148" marker-end="url(#rat-arrow)"/>
    </g>
    <text x="293" y="47" font-size="11.5" fill="#36424e">read at 20 s: return value</text>
    <text x="580" y="47" font-size="11.5" fill="#36424e">read at 48 s: return now, start one reload</text>

    <rect x="614" y="108" width="132" height="24" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="680" y="124" font-size="11.5" font-weight="700" fill="#263e5a">background reload</text>

    <rect x="624" y="150" width="140" height="28" rx="4" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="694" y="169" font-size="12" font-weight="700" fill="#294a2e">fresh value, TTL reset</text>

    <path d="M80 206H740" stroke="#40566b" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="1.5">
      <path d="M80 201V211M187 201V211M293 201V211M400 201V211M507 201V211M613 201V211M720 201V211"/>
    </g>
    <path d="M592 60V206" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g font-size="11" fill="#40566b">
      <text x="80" y="226">0 s</text>
      <text x="187" y="226">10 s</text>
      <text x="293" y="226">20 s</text>
      <text x="400" y="226">30 s</text>
      <text x="507" y="226">40 s</text>
      <text x="613" y="226">50 s</text>
      <text x="720" y="226">60 s</text>
    </g>

    <text x="24" y="256" font-size="12" font-weight="700" fill="#6b241c" text-anchor="start">Without refresh-ahead:</text>
    <text x="170" y="256" font-size="12" fill="#6b241c" text-anchor="start">the entry expires at 60 s and the next read is a slow miss.</text>
    <text x="390" y="286" font-size="13" fill="#40566b">Hot keys are reloaded before they expire, so readers rarely wait for the database.</text>
  </g>
</svg>
