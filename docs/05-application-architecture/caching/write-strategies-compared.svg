<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="wsc-title wsc-desc">
  <title id="wsc-title">Write-through, write-behind, and write-around compared</title>
  <desc id="wsc-desc">Write-through: the app writes through the cache layer, which commits to the database and stores the value in the cache in the same operation, and acknowledges after both, so writes are slower and a partial failure can leave cache and database disagreeing. Write-behind: the app writes to the cache, which acknowledges immediately, and the value is flushed to the database later in batches, so writes are fast but a cache crash before the flush loses acknowledged writes. Write-around: the app commits to the database and deletes the cache key, then acknowledges; the cache is refilled by the next read, which is a miss.</desc>
  <defs>
    <marker id="wsc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="wsc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="140" y="36" font-size="14" font-weight="700" fill="#40566b">Write-through</text>
    <text x="400" y="36" font-size="14" font-weight="700" fill="#40566b">Write-behind</text>
    <text x="660" y="36" font-size="14" font-weight="700" fill="#40566b">Write-around</text>
    <path d="M270 24V340M530 24V340" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="13" font-weight="700">
      <rect x="30" y="54" width="220" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="140" y="79" fill="#36424e">App: write(x)</text>
      <rect x="290" y="54" width="220" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="400" y="79" fill="#36424e">App: write(x)</text>
      <rect x="550" y="54" width="220" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="660" y="79" fill="#36424e">App: write(x)</text>
    </g>

    <rect x="30" y="112" width="220" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="140" y="137" font-size="13" font-weight="700" fill="#463365">Cache layer</text>
    <rect x="30" y="170" width="220" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="140" y="187" font-size="12.5" font-weight="700" fill="#263e5a">DB commit + cache store</text>
    <text x="140" y="203" font-size="11" fill="#263e5a">one synchronous operation</text>
    <rect x="30" y="228" width="220" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="140" y="245" font-size="12.5" font-weight="700" fill="#66400f">ack after both writes</text>
    <text x="140" y="261" font-size="11" fill="#66400f">slower writes</text>

    <rect x="290" y="112" width="220" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="400" y="137" font-size="13" font-weight="700" fill="#463365">Cache: store value</text>
    <rect x="290" y="170" width="220" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="400" y="187" font-size="12.5" font-weight="700" fill="#294a2e">ack immediately</text>
    <text x="400" y="203" font-size="11" fill="#294a2e">fastest writes</text>
    <rect x="290" y="228" width="220" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="400" y="245" font-size="12.5" font-weight="700" fill="#263e5a">later: batch to Database</text>
    <text x="400" y="261" font-size="11" fill="#263e5a">seconds after the ack</text>

    <rect x="550" y="112" width="220" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="660" y="137" font-size="13" font-weight="700" fill="#263e5a">Database: commit</text>
    <rect x="550" y="170" width="220" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="660" y="187" font-size="12.5" font-weight="700" fill="#463365">Cache: DEL key</text>
    <text x="660" y="203" font-size="11" fill="#463365">cache skipped on writes</text>
    <rect x="550" y="228" width="220" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="660" y="245" font-size="12.5" font-weight="700" fill="#294a2e">ack</text>
    <text x="660" y="261" font-size="11" fill="#294a2e">normal write latency</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M140 94V110" marker-end="url(#wsc-arrow)"/>
      <path d="M140 152V168" marker-end="url(#wsc-arrow)"/>
      <path d="M140 210V226" marker-end="url(#wsc-arrow)"/>
      <path d="M400 94V110" marker-end="url(#wsc-arrow)"/>
      <path d="M400 152V168" marker-end="url(#wsc-arrow)"/>
      <path d="M660 94V110" marker-end="url(#wsc-arrow)"/>
      <path d="M660 152V168" marker-end="url(#wsc-arrow)"/>
      <path d="M660 210V226" marker-end="url(#wsc-arrow)"/>
    </g>
    <path d="M400 210V226" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" marker-end="url(#wsc-arrow-ret)"/>

    <rect x="30" y="286" width="220" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="140" y="305" font-size="12.5" font-weight="700" fill="#66400f">Risk: partial failure</text>
    <text x="140" y="321" font-size="11" fill="#66400f">one write fails, so cache and</text>
    <text x="140" y="334" font-size="11" fill="#66400f">database disagree</text>
    <rect x="290" y="286" width="220" height="54" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="400" y="305" font-size="12.5" font-weight="700" fill="#6b241c">Risk: data loss</text>
    <text x="400" y="321" font-size="11" fill="#6b241c">cache crashes before the flush:</text>
    <text x="400" y="334" font-size="11" fill="#6b241c">acknowledged writes disappear</text>
    <rect x="550" y="286" width="220" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="660" y="305" font-size="12.5" font-weight="700" fill="#66400f">Risk: slow first read</text>
    <text x="660" y="321" font-size="11" fill="#66400f">the next read after a write</text>
    <text x="660" y="334" font-size="11" fill="#66400f">misses and reloads</text>

    <text x="400" y="372" font-size="13" fill="#40566b">The difference is who writes the database, when the app gets its ack,</text>
    <text x="400" y="391" font-size="13" fill="#40566b">and what is lost or stale if something fails in between.</text>
  </g>
</svg>
