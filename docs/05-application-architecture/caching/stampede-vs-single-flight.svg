<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="ssf-title ssf-desc">
  <title id="ssf-title">A cache stampede compared with single-flight request coalescing</title>
  <desc id="ssf-desc">Stampede: when product:hot expires, requests 1 through 500 all miss and each runs the same SELECT, so the database receives 500 identical queries at once. Single-flight: the first request that misses starts the load and stores its promise as the in-flight load for the key; requests 2 through 500 await that same promise. The database runs one SELECT, the value is stored with a jittered TTL, and all 500 requests receive it. Across instances, a short Redis lock plays the same role.</desc>
  <defs>
    <marker id="ssf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ssf-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
    <marker id="ssf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="32" font-size="13" font-weight="700" fill="#6b241c">Stampede: product:hot expires</text>
    <text x="600" y="32" font-size="13" font-weight="700" fill="#294a2e">Single-flight: one load per key</text>
    <path d="M400 20V300" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="12" font-weight="700" fill="#36424e">
      <rect x="30" y="56" width="120" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="90" y="77">request 1: miss</text>
      <rect x="30" y="104" width="120" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="90" y="125">request 2: miss</text>
      <text x="90" y="166" font-size="14">...</text>
      <rect x="30" y="190" width="120" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="90" y="211">request 500: miss</text>

      <rect x="420" y="56" width="120" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="480" y="77">request 1: miss</text>
      <rect x="420" y="104" width="120" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="480" y="125">request 2: miss</text>
      <text x="480" y="166" font-size="14">...</text>
      <rect x="420" y="190" width="120" height="32" rx="16" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="480" y="211">request 500: miss</text>
    </g>

    <rect x="240" y="104" width="140" height="70" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="310" y="130" font-size="14" font-weight="700" fill="#6b241c">Database</text>
    <text x="310" y="148" font-size="11.5" fill="#6b241c">500 identical</text>
    <text x="310" y="163" font-size="11.5" fill="#6b241c">SELECTs at once</text>

    <g fill="none" stroke="#b5473a" stroke-width="1.8" stroke-linecap="round">
      <path d="M150 72 238 116" marker-end="url(#ssf-arrow-red)"/>
      <path d="M150 120 238 132" marker-end="url(#ssf-arrow-red)"/>
      <path d="M150 162 238 148" marker-end="url(#ssf-arrow-red)"/>
      <path d="M150 206 238 164" marker-end="url(#ssf-arrow-red)"/>
    </g>
    <text x="200" y="254" font-size="11.5" fill="#6b241c">every miss runs the same query:</text>
    <text x="200" y="270" font-size="11.5" fill="#6b241c">latency spikes, the database may fall over</text>

    <rect x="590" y="52" width="180" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="680" y="72" font-size="13" font-weight="700" fill="#66400f">in-flight load</text>
    <text x="680" y="89" font-size="11" fill="#66400f">inFlight.set(key, promise)</text>
    <rect x="590" y="150" width="180" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="680" y="170" font-size="13" font-weight="700" fill="#263e5a">Database</text>
    <text x="680" y="187" font-size="11.5" fill="#263e5a">1 SELECT</text>
    <rect x="590" y="232" width="180" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="680" y="250" font-size="12" font-weight="700" fill="#294a2e">SET with jittered TTL</text>
    <text x="680" y="265" font-size="11" fill="#294a2e">all 500 get the same value</text>

    <path d="M540 72H588" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#ssf-arrow)"/>
    <g fill="none" stroke="#60788d" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M540 120 588 90" marker-end="url(#ssf-arrow-ret)"/>
      <path d="M540 162 594 100" marker-end="url(#ssf-arrow-ret)"/>
      <path d="M540 206 604 100" marker-end="url(#ssf-arrow-ret)"/>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M680 100V148" marker-end="url(#ssf-arrow)"/>
      <path d="M680 198V230" marker-end="url(#ssf-arrow)"/>
    </g>
    <text x="563" y="64" font-size="11" font-weight="700" fill="#40566b">starts</text>
    <text x="566" y="236" font-size="11" font-style="italic" fill="#40566b" text-anchor="end">await the</text>
    <text x="566" y="250" font-size="11" font-style="italic" fill="#40566b" text-anchor="end">same promise</text>
    <text x="688" y="128" font-size="11" fill="#40566b" text-anchor="start">one query</text>

    <text x="400" y="320" font-size="13" fill="#40566b">Coalesce concurrent misses into one load (a Redis lock does the same across instances).</text>
    <text x="400" y="340" font-size="13" fill="#40566b">500 queries become 1.</text>
  </g>
</svg>
