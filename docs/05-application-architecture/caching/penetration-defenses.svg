<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590" role="img" aria-labelledby="pen-title pen-desc">
  <title id="pen-title">Defending against cache penetration with validation, a Bloom filter, and negative caching</title>
  <desc id="pen-desc">A request for GET /products/999999991 first has its id format validated; a malformed id gets 400 before any lookup. A Bloom filter of all existing ids then answers: definitely absent gives 404 without touching the database, while maybe present continues. False positives are possible, false negatives are not. The cache is checked next: a hit returns the product or a cached null, which becomes 404. Only real misses reach the database. If the row is found it is stored with SET key product EX 300 and returned; if not, SET key null EX 30 caches the not-found result briefly and 404 is returned, so repeated lookups are absorbed by the cache.</desc>
  <defs>
    <marker id="pen-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="590" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="20" width="280" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="45" font-size="14" font-weight="700" fill="#36424e">GET /products/999999991</text>

    <path d="M240 76 350 104 240 132 130 104z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="108" font-size="12" font-weight="700" fill="#36424e">valid id format?</text>
    <path d="M240 162 350 190 240 218 130 190z" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="240" y="187" font-size="12" font-weight="700" fill="#463365">Bloom filter:</text>
    <text x="240" y="201" font-size="12" font-weight="700" fill="#463365">might it exist?</text>
    <path d="M240 248 350 276 240 304 130 276z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="273" font-size="12" font-weight="700" fill="#36424e">key in the</text>
    <text x="240" y="287" font-size="12" font-weight="700" fill="#36424e">cache?</text>

    <rect x="100" y="328" width="280" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="348" font-size="14" font-weight="700" fill="#263e5a">Database: SELECT</text>
    <text x="240" y="365" font-size="11.5" fill="#263e5a">only real misses get here</text>

    <path d="M240 398 350 426 240 454 130 426z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="430" font-size="12" font-weight="700" fill="#36424e">row found?</text>

    <rect x="100" y="478" width="280" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="240" y="498" font-size="13" font-weight="700" fill="#294a2e">SET key product EX 300</text>
    <text x="240" y="515" font-size="11.5" fill="#294a2e">200 OK</text>

    <rect x="440" y="80" width="316" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="598" y="100" font-size="14" font-weight="700" fill="#6b241c">400 Bad Request</text>
    <text x="598" y="117" font-size="11.5" fill="#6b241c">rejected before any lookup</text>
    <rect x="440" y="166" width="316" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="598" y="186" font-size="14" font-weight="700" fill="#294a2e">404 Not Found</text>
    <text x="598" y="203" font-size="11.5" fill="#294a2e">definitely absent: the database is skipped</text>
    <rect x="440" y="252" width="316" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="598" y="272" font-size="14" font-weight="700" fill="#294a2e">Served from the cache</text>
    <text x="598" y="289" font-size="11.5" fill="#294a2e">the product, or a cached null (404)</text>
    <rect x="440" y="402" width="316" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="598" y="422" font-size="13" font-weight="700" fill="#463365">SET key null EX 30, then 404</text>
    <text x="598" y="439" font-size="11.5" fill="#463365">negative cache: repeats are absorbed</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M240 60V74" marker-end="url(#pen-arrow)"/>
      <path d="M350 104H438" marker-end="url(#pen-arrow)"/>
      <path d="M240 132V160" marker-end="url(#pen-arrow)"/>
      <path d="M350 190H438" marker-end="url(#pen-arrow)"/>
      <path d="M240 218V246" marker-end="url(#pen-arrow)"/>
      <path d="M350 276H438" marker-end="url(#pen-arrow)"/>
      <path d="M240 304V326" marker-end="url(#pen-arrow)"/>
      <path d="M240 376V396" marker-end="url(#pen-arrow)"/>
      <path d="M350 426H438" marker-end="url(#pen-arrow)"/>
      <path d="M240 454V476" marker-end="url(#pen-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="394" y="96">no</text>
      <text x="394" y="182">definitely not</text>
      <text x="394" y="268">yes</text>
      <text x="394" y="418">no</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="250" y="152">yes</text>
      <text x="250" y="238">maybe</text>
      <text x="250" y="320">no</text>
      <text x="250" y="470">yes</text>
    </g>
    <g font-size="11" font-style="italic" fill="#463365" text-anchor="end">
      <text x="122" y="184">false positives only,</text>
      <text x="122" y="198">never false negatives</text>
    </g>
    <text x="390" y="566" font-size="13" fill="#40566b">Requests for ids that do not exist are stopped early or answered from the cache, not the database.</text>
  </g>
</svg>
