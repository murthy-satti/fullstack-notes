<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="cdn-title cdn-desc">
  <title id="cdn-title">CDN edge hit, miss, and revalidation with ETag and 304</title>
  <desc id="cdn-desc">Fresh hit: the browser sends GET /api/catalog and the CDN edge answers 200 from its cache in about 10 ms. Miss: the edge forwards the GET to the origin, which returns 200 with ETag "v7-a1b2" and Cache-Control max-age=60; the edge stores a copy and returns 200. Stale after 60 seconds: the edge sends a conditional GET with If-None-Match "v7-a1b2"; if unchanged the origin answers 304 Not Modified with no body and the edge reuses its copy for another 60 seconds; if changed the origin sends 200 with a new body and a new ETag.</desc>
  <defs>
    <marker id="cdn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cdn-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="20" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="110" y="47" font-size="14" font-weight="700" fill="#36424e">Browser</text>
    <rect x="320" y="20" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="39" font-size="14" font-weight="700" fill="#263e5a">CDN edge</text>
    <text x="390" y="55" font-size="11.5" fill="#263e5a">near the user</text>
    <rect x="600" y="20" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="670" y="39" font-size="14" font-weight="700" fill="#66400f">Origin</text>
    <text x="670" y="55" font-size="11.5" fill="#66400f">your app, far away</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 64V424"/>
      <path d="M390 64V424"/>
      <path d="M670 64V424"/>
    </g>

    <rect x="60" y="82" width="700" height="70" rx="6" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="68" y="96" font-size="11" font-weight="700" fill="#294a2e" text-anchor="start">fresh (age &lt; max-age)</text>
    <rect x="60" y="160" width="700" height="108" rx="6" fill="none" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="68" y="174" font-size="11" font-weight="700" fill="#66400f" text-anchor="start">miss</text>
    <rect x="60" y="276" width="700" height="138" rx="6" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="68" y="290" font-size="11" font-weight="700" fill="#263e5a" text-anchor="start">stale after 60 s: revalidate</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 112H388" marker-end="url(#cdn-arrow)"/>
      <path d="M110 192H388" marker-end="url(#cdn-arrow)"/>
      <path d="M390 214H668" marker-end="url(#cdn-arrow)"/>
      <path d="M110 310H388" marker-end="url(#cdn-arrow)"/>
      <path d="M390 334H668" marker-end="url(#cdn-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M390 138H112" marker-end="url(#cdn-arrow-ret)"/>
      <path d="M670 236H392" marker-end="url(#cdn-arrow-ret)"/>
      <path d="M390 258H112" marker-end="url(#cdn-arrow-ret)"/>
      <path d="M670 358H392" marker-end="url(#cdn-arrow-ret)"/>
      <path d="M390 382H112" marker-end="url(#cdn-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="250" y="105">GET /api/catalog</text>
      <text x="250" y="131" font-weight="700" fill="#294a2e">200 from the edge cache, ~10 ms</text>
      <text x="250" y="185">GET /api/catalog</text>
      <text x="530" y="207">GET /api/catalog (~150+ ms away)</text>
      <text x="530" y="229">200 + ETag "v7-a1b2", max-age=60</text>
      <text x="250" y="251">200 (the edge stores a copy)</text>
      <text x="250" y="303">GET /api/catalog</text>
      <text x="530" y="327">GET + If-None-Match: "v7-a1b2"</text>
      <text x="530" y="351" font-weight="700" fill="#263e5a">304 Not Modified (no body)</text>
      <text x="250" y="375">200 from the reused copy</text>
      <text x="530" y="404" font-style="italic" fill="#66400f">if changed: 200 + new body + new ETag</text>
      <text x="250" y="404" font-style="italic" fill="#263e5a">fresh again for 60 s</text>
    </g>
    <text x="390" y="452" font-size="13" fill="#40566b">Fresh copies never reach the origin; stale ones cost a small 304 round trip instead of a full body.</text>
  </g>
</svg>
