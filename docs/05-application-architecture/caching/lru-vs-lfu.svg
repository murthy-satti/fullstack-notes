<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="lvl-title lvl-desc">
  <title id="lvl-title">The same access sequence under LRU and LFU with capacity 3</title>
  <desc id="lvl-desc">The keys are accessed in the order A, A, A, B, B, C, D, E in a cache that holds three entries. Under LRU, after C the order from most to least recent is C, B, A; reading D evicts A, the hottest key with three reads, and reading E evicts B. Under LFU with access counts, after C the counts are A 3, B 2, C 1; reading D evicts C, which has the lowest count, and reading E evicts D, so the frequently used keys A and B stay cached.</desc>
  <rect width="800" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="54">access</text>
      <text x="24" y="138">LRU</text>
      <text x="24" y="226">LFU</text>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="start">
      <text x="24" y="154">most recent first</text>
      <text x="24" y="242">key + read count</text>
    </g>

    <g font-size="15" font-weight="700" fill="#263e5a">
      <rect x="150" y="32" width="40" height="34" rx="17" fill="#e5efff" stroke="#4774aa" stroke-width="2"/><text x="170" y="55">A</text>
      <rect x="230" y="32" width="40" height="34" rx="17" fill="#e5efff" stroke="#4774aa" stroke-width="2"/><text x="250" y="55">A</text>
      <rect x="310" y="32" width="40" height="34" rx="17" fill="#e5efff" stroke="#4774aa" stroke-width="2"/><text x="330" y="55">A</text>
      <rect x="390" y="32" width="40" height="34" rx="17" fill="#e5efff" stroke="#4774aa" stroke-width="2"/><text x="410" y="55">B</text>
      <rect x="470" y="32" width="40" height="34" rx="17" fill="#e5efff" stroke="#4774aa" stroke-width="2"/><text x="490" y="55">B</text>
      <rect x="550" y="32" width="40" height="34" rx="17" fill="#e5efff" stroke="#4774aa" stroke-width="2"/><text x="570" y="55">C</text>
      <rect x="630" y="32" width="40" height="34" rx="17" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/><text x="650" y="55" fill="#66400f">D</text>
      <rect x="710" y="32" width="40" height="34" rx="17" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/><text x="730" y="55" fill="#66400f">E</text>
    </g>
    <text x="690" y="84" font-size="11" font-style="italic" fill="#66400f">cache full: must evict</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="134" y="100" width="72" height="70" rx="6"/>
      <rect x="214" y="100" width="72" height="70" rx="6"/>
      <rect x="294" y="100" width="72" height="70" rx="6"/>
      <rect x="374" y="100" width="72" height="70" rx="6"/>
      <rect x="454" y="100" width="72" height="70" rx="6"/>
      <rect x="534" y="100" width="72" height="70" rx="6"/>
      <rect x="614" y="100" width="72" height="70" rx="6"/>
      <rect x="694" y="100" width="72" height="70" rx="6"/>
      <rect x="134" y="188" width="72" height="70" rx="6"/>
      <rect x="214" y="188" width="72" height="70" rx="6"/>
      <rect x="294" y="188" width="72" height="70" rx="6"/>
      <rect x="374" y="188" width="72" height="70" rx="6"/>
      <rect x="454" y="188" width="72" height="70" rx="6"/>
      <rect x="534" y="188" width="72" height="70" rx="6"/>
      <rect x="614" y="188" width="72" height="70" rx="6"/>
      <rect x="694" y="188" width="72" height="70" rx="6"/>
    </g>

    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="170" y="128">A</text>
      <text x="250" y="128">A</text>
      <text x="330" y="128">A</text>
      <text x="410" y="128">B A</text>
      <text x="490" y="128">B A</text>
      <text x="570" y="128">C B A</text>
      <text x="650" y="128">D C B</text>
      <text x="730" y="128">E D C</text>
      <text x="170" y="216">A1</text>
      <text x="250" y="216">A2</text>
      <text x="330" y="216">A3</text>
      <text x="410" y="216">A3 B1</text>
      <text x="490" y="216">A3 B2</text>
      <text x="570" y="216">A3 B2 C1</text>
      <text x="650" y="216">A3 B2 D1</text>
      <text x="730" y="216">A3 B2 E1</text>
    </g>

    <g font-size="11.5" font-weight="700">
      <rect x="620" y="140" width="60" height="22" rx="11" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="650" y="155" fill="#6b241c">evicts A</text>
      <rect x="700" y="140" width="60" height="22" rx="11" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="730" y="155" fill="#6b241c">evicts B</text>
      <rect x="620" y="228" width="60" height="22" rx="11" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="650" y="243" fill="#294a2e">evicts C</text>
      <rect x="700" y="228" width="60" height="22" rx="11" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="730" y="243" fill="#294a2e">evicts D</text>
    </g>

    <text x="24" y="290" font-size="12.5" fill="#6b241c" text-anchor="start"><tspan font-weight="700">LRU</tspan> drops A, the hottest key (3 reads), because B and C were used more recently.</text>
    <text x="24" y="312" font-size="12.5" fill="#294a2e" text-anchor="start"><tspan font-weight="700">LFU</tspan> drops the keys read only once (C, then D), so A and B stay cached.</text>
    <text x="400" y="344" font-size="13" fill="#40566b">LRU bets on recency, LFU on popularity; real LFU also decays old counts.</text>
  </g>
</svg>
