<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="cba-title cba-desc">
  <title id="cba-title">How hashed asset filenames and a no-cache HTML page pick up a new deploy</title>
  <desc id="cba-desc">index.html is served with Cache-Control no-cache, so the browser revalidates it on every visit with If-None-Match. Before a deploy the origin answers 304, the cached HTML still references /assets/app.3f9a1c2b.js, and that file, cached as public, max-age one year, immutable, is used from the browser cache with no request. After a deploy the HTML's ETag has changed, so the origin answers 200 with new HTML that references /assets/app.7c4e9d10.js. That new URL is not in any cache, so it is downloaded once and then cached for a year. No purge is needed; the old file is simply no longer referenced.</desc>
  <defs>
    <marker id="cba-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="202" y="32" font-size="13" font-weight="700" fill="#40566b">Visit before a deploy</text>
    <text x="598" y="32" font-size="13" font-weight="700" fill="#40566b">Visit after a deploy</text>
    <path d="M400 20V330" stroke="#c9d1db" stroke-width="1.5"/>

    <g font-size="12.5" font-weight="700">
      <rect x="24" y="46" width="356" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="202" y="64" fill="#36424e">GET /index.html</text>
      <text x="202" y="79" font-size="11" font-weight="400" fill="#36424e">Cache-Control: no-cache, so always revalidate</text>
      <rect x="420" y="46" width="356" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="598" y="64" fill="#36424e">GET /index.html</text>
      <text x="598" y="79" font-size="11" font-weight="400" fill="#36424e">Cache-Control: no-cache, so always revalidate</text>

      <rect x="24" y="104" width="356" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="202" y="129" fill="#263e5a">If-None-Match: "html-v1"</text>
      <rect x="420" y="104" width="356" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="598" y="129" fill="#263e5a">If-None-Match: "html-v1"</text>

      <rect x="24" y="162" width="356" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
      <text x="202" y="187" fill="#294a2e">304 Not Modified: reuse cached HTML</text>
      <rect x="420" y="162" width="356" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="598" y="187" fill="#66400f">200 OK: new HTML, ETag "html-v2"</text>

      <rect x="24" y="220" width="356" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="202" y="245" fill="#463365">script src="/assets/app.3f9a1c2b.js"</text>
      <rect x="420" y="220" width="356" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="598" y="245" fill="#463365">script src="/assets/app.7c4e9d10.js"</text>

      <rect x="24" y="278" width="356" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
      <text x="202" y="298" fill="#294a2e">Browser cache hit: no request</text>
      <text x="202" y="315" font-size="11" font-weight="400" fill="#294a2e">public, max-age=31536000, immutable</text>
      <rect x="420" y="278" width="356" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="598" y="298" fill="#263e5a">New URL: downloaded once</text>
      <text x="598" y="315" font-size="11" font-weight="400" fill="#263e5a">then cached for a year, immutable</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M202 86V102" marker-end="url(#cba-arrow)"/>
      <path d="M202 144V160" marker-end="url(#cba-arrow)"/>
      <path d="M202 202V218" marker-end="url(#cba-arrow)"/>
      <path d="M202 260V276" marker-end="url(#cba-arrow)"/>
      <path d="M598 86V102" marker-end="url(#cba-arrow)"/>
      <path d="M598 144V160" marker-end="url(#cba-arrow)"/>
      <path d="M598 202V218" marker-end="url(#cba-arrow)"/>
      <path d="M598 260V276" marker-end="url(#cba-arrow)"/>
    </g>
    <text x="400" y="356" font-size="13" fill="#40566b">The HTML is cheap to revalidate; the big assets never are. A new deploy means new asset URLs,</text>
    <text x="400" y="374" font-size="13" fill="#40566b">so no purge is needed and the old file is simply no longer referenced.</text>
  </g>
</svg>
