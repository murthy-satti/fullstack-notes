<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="cas-title cas-desc">
  <title id="cas-title">Cache-aside reads and writes as a sequence</title>
  <desc id="cas-desc">Read: the app sends GET product:42 to the cache. On a hit the cache returns the value and the app uses it. On a miss the cache returns nil, the app runs SELECT on the database, receives the row, and stores it with SET product:42 value EX 300. Write: the app runs UPDATE on the database, receives the commit, and then sends DEL product:42 to the cache, so the next read misses and reloads the new row.</desc>
  <defs>
    <marker id="cas-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cas-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="20" width="140" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="47" font-size="14" font-weight="700" fill="#66400f">App</text>
    <rect x="350" y="20" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="420" y="39" font-size="14" font-weight="700" fill="#463365">Cache</text>
    <text x="420" y="55" font-size="11.5" fill="#463365">Redis</text>
    <rect x="590" y="20" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="660" y="39" font-size="14" font-weight="700" fill="#263e5a">Database</text>
    <text x="660" y="55" font-size="11.5" fill="#263e5a">source of truth</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M150 64V420"/>
      <path d="M420 64V420"/>
      <path d="M660 64V420"/>
    </g>

    <text x="24" y="100" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Read</text>
    <rect x="96" y="110" width="620" height="38" rx="6" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="104" y="124" font-size="11" font-weight="700" fill="#294a2e" text-anchor="start">hit</text>
    <rect x="96" y="154" width="620" height="112" rx="6" fill="none" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="104" y="168" font-size="11" font-weight="700" fill="#66400f" text-anchor="start">miss</text>

    <path d="M24 290H756" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="316" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Write</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 96H418" marker-end="url(#cas-arrow)"/>
      <path d="M150 204H658" marker-end="url(#cas-arrow)"/>
      <path d="M150 256H418" marker-end="url(#cas-arrow)"/>
      <path d="M150 320H658" marker-end="url(#cas-arrow)"/>
      <path d="M150 376H418" marker-end="url(#cas-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M420 136H152" marker-end="url(#cas-arrow-ret)"/>
      <path d="M420 180H152" marker-end="url(#cas-arrow-ret)"/>
      <path d="M660 230H152" marker-end="url(#cas-arrow-ret)"/>
      <path d="M660 346H152" marker-end="url(#cas-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="285" y="89">1. GET product:42</text>
      <text x="285" y="131">2a. value: use it</text>
      <text x="285" y="175">2b. nil</text>
      <text x="285" y="249">5. SET product:42 value EX 300</text>
      <text x="285" y="369">8. DEL product:42</text>
    </g>
    <rect x="460" y="188" width="170" height="14" fill="#f5f7fb"/>
    <text x="545" y="199" font-size="11.5" fill="#36424e">3. SELECT ... WHERE id = 42</text>
    <rect x="510" y="214" width="70" height="14" fill="#f5f7fb"/>
    <text x="545" y="225" font-size="11.5" fill="#36424e">4. row</text>
    <rect x="455" y="304" width="180" height="14" fill="#f5f7fb"/>
    <text x="545" y="315" font-size="11.5" fill="#36424e">6. UPDATE products SET ...</text>
    <rect x="495" y="330" width="100" height="14" fill="#f5f7fb"/>
    <text x="545" y="341" font-size="11.5" fill="#36424e">7. committed</text>
    <text x="430" y="400" font-size="11.5" font-style="italic" fill="#463365" text-anchor="start">next read misses and reloads the new row</text>

    <text x="390" y="452" font-size="13" fill="#40566b">The app owns the logic: read from the cache, fall back to the database, delete on write.</text>
  </g>
</svg>
