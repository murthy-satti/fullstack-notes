<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" role="img" aria-labelledby="avj-title avj-desc">
  <title id="avj-title">Cache avalanche from synchronized expiry, and how TTL jitter spreads it out</title>
  <desc id="avj-desc">A bulk job sets 10,000 keys at the same moment. With the same TTL of 300 seconds, every key expires at 300 seconds, so 10,000 misses for different keys hit the database at once. With TTL jitter of 300 seconds plus or minus 10 percent, expirations spread evenly between 270 and 330 seconds, about 170 misses per second, which the database can absorb.</desc>
  <rect width="780" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#6b241c" text-anchor="start">Same TTL: 10,000 keys set at once with EX 300</text>
    <text x="756" y="32" font-size="11.5" fill="#40566b" text-anchor="end">misses per second over time</text>

    <path d="M120 150H740" stroke="#40566b" stroke-width="1.5"/>
    <rect x="424" y="58" width="12" height="92" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="446" y="80" font-size="12" font-weight="700" fill="#6b241c" text-anchor="start">10,000 misses in the same second</text>
    <text x="446" y="96" font-size="11.5" fill="#6b241c" text-anchor="start">every key expires at 300 s: the database floods</text>
    <g stroke="#40566b" stroke-width="1.5">
      <path d="M120 146V154M244 146V154M430 146V154M616 146V154M740 146V154"/>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="120" y="168">250 s</text>
      <text x="244" y="168">270 s</text>
      <text x="430" y="168">300 s</text>
      <text x="616" y="168">330 s</text>
      <text x="740" y="168">350 s</text>
    </g>

    <path d="M24 186H756" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="212" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">TTL jitter: EX 300 ± 10% (a random 270 to 330 s per key)</text>

    <path d="M120 310H740" stroke="#40566b" stroke-width="1.5"/>
    <g fill="#e8f5e9" stroke="#53845b" stroke-width="1.5">
      <rect x="248" y="294" width="24" height="16"/>
      <rect x="279" y="294" width="24" height="16"/>
      <rect x="310" y="294" width="24" height="16"/>
      <rect x="341" y="294" width="24" height="16"/>
      <rect x="372" y="294" width="24" height="16"/>
      <rect x="403" y="294" width="24" height="16"/>
      <rect x="434" y="294" width="24" height="16"/>
      <rect x="465" y="294" width="24" height="16"/>
      <rect x="496" y="294" width="24" height="16"/>
      <rect x="527" y="294" width="24" height="16"/>
      <rect x="558" y="294" width="24" height="16"/>
      <rect x="589" y="294" width="24" height="16"/>
    </g>
    <text x="430" y="262" font-size="12" font-weight="700" fill="#294a2e">~170 misses per second, spread over 60 s</text>
    <text x="430" y="280" font-size="11.5" fill="#294a2e">the database absorbs the reloads</text>
    <g stroke="#40566b" stroke-width="1.5">
      <path d="M120 306V314M244 306V314M430 306V314M616 306V314M740 306V314"/>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="120" y="328">250 s</text>
      <text x="244" y="328">270 s</text>
      <text x="430" y="328">300 s</text>
      <text x="616" y="328">330 s</text>
      <text x="740" y="328">350 s</text>
    </g>
    <text x="390" y="356" font-size="13" fill="#40566b">Randomizing each key's TTL turns one huge spike into a steady trickle of misses.</text>
  </g>
</svg>
