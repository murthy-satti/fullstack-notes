<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="efl-title efl-desc">
  <title id="efl-title">Hit path, miss path, and the average latency at different hit ratios</title>
  <desc id="efl-desc">On a hit, the application's Redis GET finds the value and the response takes about 1 ms. On a miss, the Redis GET costs about 1 ms, the database query about 50 ms, and the value is then stored with SET product:42 EX 300, so the miss time is 51 ms. The average latency is hit ratio times 1 ms plus one minus hit ratio times 51 ms: with no cache every request takes 50.0 ms and the database handles 100 percent of reads; at a 0.90 hit ratio the average is 6.0 ms and the database handles 10 percent; at 0.99 it is 1.5 ms and the database handles 1 percent.</desc>
  <defs>
    <marker id="efl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="38" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Hit</text>
    <rect x="64" y="20" width="100" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="114" y="47" font-size="13" font-weight="700" fill="#36424e">App</text>
    <rect x="204" y="20" width="180" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="294" y="39" font-size="13" font-weight="700" fill="#294a2e">Redis GET: hit</text>
    <text x="294" y="55" font-size="11.5" fill="#294a2e">~1 ms</text>
    <rect x="424" y="20" width="180" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="514" y="47" font-size="13" font-weight="700" fill="#294a2e">response: 1 ms</text>

    <text x="24" y="112" font-size="13" font-weight="700" fill="#6b241c" text-anchor="start">Miss</text>
    <rect x="64" y="94" width="100" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="114" y="121" font-size="13" font-weight="700" fill="#36424e">App</text>
    <rect x="204" y="94" width="180" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="294" y="113" font-size="13" font-weight="700" fill="#36424e">Redis GET: miss</text>
    <text x="294" y="129" font-size="11.5" fill="#36424e">~1 ms</text>
    <rect x="424" y="94" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="499" y="113" font-size="13" font-weight="700" fill="#66400f">Database query</text>
    <text x="499" y="129" font-size="11.5" fill="#66400f">~50 ms</text>
    <rect x="614" y="94" width="162" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="695" y="113" font-size="12.5" font-weight="700" fill="#463365">SET product:42 EX 300</text>
    <text x="695" y="129" font-size="11.5" fill="#463365">ready for next time</text>
    <text x="294" y="160" font-size="12" font-weight="700" fill="#6b241c">miss time = 1 ms + 50 ms = 51 ms</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 42H202" marker-end="url(#efl-arrow)"/>
      <path d="M384 42H422" marker-end="url(#efl-arrow)"/>
      <path d="M164 116H202" marker-end="url(#efl-arrow)"/>
      <path d="M384 116H422" marker-end="url(#efl-arrow)"/>
      <path d="M574 116H612" marker-end="url(#efl-arrow)"/>
    </g>

    <path d="M24 180H776" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="400" y="206" font-size="13" font-weight="700" fill="#40566b">average = hit ratio × 1 ms + (1 − hit ratio) × 51 ms</text>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="242">no cache</text>
      <text x="24" y="286">hit ratio 0.90</text>
      <text x="24" y="330">hit ratio 0.99</text>
    </g>
    <rect x="140" y="224" width="600" height="28" rx="4" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="728" y="243" font-size="12" font-weight="700" fill="#6b241c" text-anchor="end">50.0 ms, database handles 100% of reads</text>
    <rect x="140" y="268" width="72" height="28" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="222" y="287" font-size="12" font-weight="700" fill="#66400f" text-anchor="start">6.0 ms, database handles 10%</text>
    <rect x="140" y="312" width="18" height="28" rx="4" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="168" y="331" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">1.5 ms, database handles 1%</text>
    <text x="400" y="374" font-size="13" fill="#40566b">Misses dominate the cost: 90% to 99% hits makes the average four times faster.</text>
  </g>
</svg>
