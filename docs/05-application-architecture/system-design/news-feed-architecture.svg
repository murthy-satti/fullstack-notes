<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530" role="img" aria-labelledby="nfa-title nfa-desc">
  <title id="nfa-title">News feed: the post write path and the feed read path</title>
  <desc id="nfa-desc">Write path: an author posts to the post service, which saves the post and emits a PostCreated event to Kafka. Fan-out workers read the event, look up the author's followers, skip celebrities and inactive users, and add the post ID to each follower's feed in the Redis feed cache. Read path: a reader asks the feed service for a page; it reads post IDs after the cursor from the feed cache, pulls recent posts from followed celebrities, hydrates posts, authors and counts, ranks and filters them, and returns a page with a next cursor. Images load from the CDN.</desc>
  <defs>
    <marker id="nfa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="530" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#8062a8" text-anchor="start">
      <text x="20" y="38">Write path</text>
      <text x="20" y="368">Read path</text>
    </g>

    <g stroke-width="2" fill="#e5efff" stroke="#4774aa">
      <rect x="20" y="50" width="110" height="52" rx="8"/>
      <rect x="20" y="380" width="110" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#263e5a">
      <text x="75" y="71">Author</text>
      <text x="75" y="401">Reader</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="75" y="89">creates a post</text>
      <text x="75" y="419">opens the feed</text>
    </g>

    <g stroke-width="2" fill="#fff0d9" stroke="#bd7a20">
      <rect x="180" y="50" width="150" height="52" rx="8"/>
      <rect x="560" y="50" width="220" height="52" rx="8"/>
      <rect x="180" y="380" width="160" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#66400f">
      <text x="255" y="71">Post service</text>
      <text x="670" y="71">Fan-out workers</text>
      <text x="260" y="401">Feed service</text>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="255" y="89">save, return 201</text>
      <text x="670" y="89">skip celebrities, inactive</text>
      <text x="260" y="419">merge, rank, filter</text>
    </g>

    <g stroke-width="2" fill="#eef1f5" stroke="#8a96a3">
      <rect x="392" y="50" width="118" height="52" rx="8"/>
      <rect x="580" y="380" width="200" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="451" y="71">Kafka</text>
      <text x="680" y="401">CDN</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="451" y="89">PostCreated</text>
      <text x="680" y="419">resized images</text>
    </g>

    <g stroke-width="2" fill="#f0e9fb" stroke="#8062a8">
      <rect x="170" y="210" width="170" height="52" rx="8"/>
      <rect x="380" y="210" width="130" height="52" rx="8"/>
      <rect x="560" y="210" width="220" height="52" rx="8"/>
      <rect x="400" y="380" width="140" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365">
      <text x="255" y="231">Posts DB + cache</text>
      <text x="445" y="231">Followers</text>
      <text x="670" y="231">Feed cache (Redis)</text>
      <text x="470" y="401">Users + counts</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="255" y="249">posts, author timelines</text>
      <text x="445" y="249">who follows whom</text>
      <text x="670" y="249">feed:{user} → post IDs</text>
      <text x="470" y="419">authors, likes</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M130 76H178" marker-end="url(#nfa-arrow)"/>
      <path d="M255 102V208" marker-end="url(#nfa-arrow)"/>
      <path d="M330 76H390" marker-end="url(#nfa-arrow)"/>
      <path d="M510 76H558" marker-end="url(#nfa-arrow)"/>
      <path d="M600 102L478 208" marker-end="url(#nfa-arrow)"/>
      <path d="M680 102V208" marker-end="url(#nfa-arrow)"/>
      <path d="M130 396H178" marker-end="url(#nfa-arrow)"/>
      <path d="M340 390L590 264" marker-end="url(#nfa-arrow)"/>
      <path d="M255 380V264" marker-end="url(#nfa-arrow)"/>
      <path d="M340 406H398" marker-end="url(#nfa-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M178 420H132" marker-end="url(#nfa-arrow)"/>
      <path d="M75 432V474H680V434" marker-end="url(#nfa-arrow)"/>
    </g>

    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="154" y="68">W1 post</text>
      <text x="265" y="160" text-anchor="start">W2 save</text>
      <text x="361" y="68">W3 event</text>
      <text x="534" y="68">W4 read</text>
      <text x="530" y="150" text-anchor="end">W5 followers</text>
      <text x="690" y="150" text-anchor="start">W6 add post ID</text>
      <text x="154" y="388">R1 GET</text>
      <text x="490" y="345" text-anchor="start">R2 IDs after the cursor</text>
      <text x="265" y="316" text-anchor="start">R3 celebrity posts,</text>
      <text x="265" y="331" text-anchor="start">hydrate posts</text>
      <text x="369" y="398">R4 users</text>
      <text x="155" y="448">R5 page + nextCursor</text>
      <text x="400" y="490">R6 images load from the CDN by URL</text>
    </g>
    <text x="400" y="516" font-size="13" fill="#40566b">Writes push post IDs into followers' feeds; reads merge them with celebrity posts and hydrate one page.</text>
  </g>
</svg>
