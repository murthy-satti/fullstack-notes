<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" role="img" aria-labelledby="sdp-title sdp-desc">
  <title id="sdp-title">The nine steps of a system design and how a 45-minute interview splits across them</title>
  <desc id="sdp-desc">Clarify requirements, agree scope, and estimate scale. Then define the API, the data model, and the high-level design. Then go into deep dives, find bottlenecks and trade-offs, and wrap up. In a 45-minute interview, requirements and scope take 5 to 8 minutes, estimates 3 to 5, API and data model 5 to 7, the high-level design 10 to 12, deep dives 10 to 15, and the wrap-up 3 to 5.</desc>
  <defs>
    <marker id="sdp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="760" height="424" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2">
      <rect x="25" y="24" width="210" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="275" y="24" width="210" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="525" y="24" width="210" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="25" y="118" width="210" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="275" y="118" width="210" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="525" y="118" width="210" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="25" y="212" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="275" y="212" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="525" y="212" width="210" height="56" rx="8" fill="#e8f5e9" stroke="#53845b"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="130" y="47" fill="#263e5a">1. Clarify requirements</text>
      <text x="380" y="47" fill="#263e5a">2. Agree scope</text>
      <text x="630" y="47" fill="#263e5a">3. Estimate scale</text>
      <text x="130" y="141" fill="#66400f">4. Define the API</text>
      <text x="380" y="141" fill="#66400f">5. Data model</text>
      <text x="630" y="141" fill="#66400f">6. High-level design</text>
      <text x="130" y="235" fill="#463365">7. Deep dives</text>
      <text x="380" y="235" fill="#463365">8. Find bottlenecks</text>
      <text x="630" y="235" fill="#294a2e">9. Wrap up</text>
    </g>
    <g font-size="11.5">
      <text x="130" y="66" fill="#263e5a">functional + non-functional</text>
      <text x="380" y="66" fill="#263e5a">core use cases, out of scope</text>
      <text x="630" y="66" fill="#263e5a">QPS, storage, bandwidth, cache</text>
      <text x="130" y="160" fill="#66400f">endpoints, inputs, outputs</text>
      <text x="380" y="160" fill="#66400f">entities, keys, indexes</text>
      <text x="630" y="160" fill="#66400f">components, read + write paths</text>
      <text x="130" y="254" fill="#463365">the 3–5 hardest parts</text>
      <text x="380" y="254" fill="#463365">trade-offs, failure modes</text>
      <text x="630" y="254" fill="#294a2e">summary, next steps</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M235 52H273" marker-end="url(#sdp-arrow)"/>
      <path d="M485 52H523" marker-end="url(#sdp-arrow)"/>
      <path d="M630 80V99H130V116" marker-end="url(#sdp-arrow)"/>
      <path d="M235 146H273" marker-end="url(#sdp-arrow)"/>
      <path d="M485 146H523" marker-end="url(#sdp-arrow)"/>
      <path d="M630 174V193H130V210" marker-end="url(#sdp-arrow)"/>
      <path d="M235 240H273" marker-end="url(#sdp-arrow)"/>
      <path d="M485 240H523" marker-end="url(#sdp-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="380" y="94">numbers agreed: now design</text>
      <text x="380" y="188">design drawn: now stress it</text>
    </g>

    <text x="380" y="302" font-size="13" font-weight="700" fill="#40566b">Interview time split (about 45 minutes)</text>
    <g stroke-width="2">
      <rect x="32" y="314" width="99" height="48" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="135" y="314" width="60" height="48" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="199" y="314" width="91" height="48" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="294" y="314" width="171" height="48" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="469" y="314" width="195" height="48" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="668" y="314" width="60" height="48" rx="6" fill="#e8f5e9" stroke="#53845b"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="81.5" y="334" fill="#263e5a">Requirements</text>
      <text x="165" y="334" fill="#263e5a">Estimate</text>
      <text x="244.5" y="334" fill="#66400f">API + data</text>
      <text x="379.5" y="334" fill="#66400f">High-level design</text>
      <text x="566.5" y="334" fill="#463365">Deep dives</text>
      <text x="698" y="334" fill="#294a2e">Wrap-up</text>
    </g>
    <g font-size="11.5">
      <text x="81.5" y="352" fill="#263e5a">5–8 min</text>
      <text x="165" y="352" fill="#263e5a">3–5 min</text>
      <text x="244.5" y="352" fill="#66400f">5–7 min</text>
      <text x="379.5" y="352" fill="#66400f">10–12 min</text>
      <text x="566.5" y="352" fill="#463365">10–15 min</text>
      <text x="698" y="352" fill="#294a2e">3–5 min</text>
    </g>
    <text x="380" y="400" font-size="13" fill="#40566b">Work in this order, but loop back when estimates or deep dives change a decision.</text>
  </g>
</svg>
