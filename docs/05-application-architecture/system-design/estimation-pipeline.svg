<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="bee-title bee-desc">
  <title id="bee-title">From daily active users to QPS, storage, cache, bandwidth, and server count</title>
  <desc id="bee-desc">100 million daily active users each load the feed 20 times and post twice a day, giving 2 billion reads and 200 million writes per day. Dividing by about 100,000 seconds gives 20,000 reads and 2,000 writes per second on average, and a peak factor of 3 gives 60,000 and 6,000. Writes per day times 500 bytes give 100 GB per day, about 110 TB a year with 3 replicas. Reads per day size the cache with the 80/20 rule. Average reads times a 10 KB response give 200 MB per second of egress. Peak reads divided by 900 usable requests per second per server give about 70 servers, about 105 with zone redundancy.</desc>
  <defs>
    <marker id="bee-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="24" width="260" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="170" y="45" font-size="14" font-weight="700" fill="#263e5a">100 M daily active users</text>
    <text x="170" y="64" font-size="11.5" fill="#263e5a">each: 20 feed loads, 2 posts/day</text>

    <rect x="40" y="110" width="260" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="170" y="132" font-size="14" font-weight="700" fill="#66400f">Requests per day</text>
    <text x="170" y="152" font-size="11.5" fill="#66400f">reads: 20 × 100 M = 2×10^9</text>
    <text x="170" y="170" font-size="11.5" fill="#66400f">writes: 2 × 100 M = 2×10^8</text>

    <rect x="40" y="230" width="260" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="170" y="252" font-size="14" font-weight="700" fill="#66400f">Average QPS</text>
    <text x="170" y="271" font-size="11.5" fill="#66400f">20,000 reads/s, 2,000 writes/s</text>

    <rect x="40" y="326" width="260" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="170" y="348" font-size="14" font-weight="700" fill="#66400f">Peak QPS</text>
    <text x="170" y="367" font-size="11.5" fill="#66400f">60,000 reads/s, 6,000 writes/s</text>

    <rect x="440" y="100" width="300" height="62" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="120" font-size="14" font-weight="700" fill="#294a2e">Storage</text>
    <text x="590" y="138" font-size="11.5" fill="#294a2e">2×10^8 posts × 500 B = 100 GB/day</text>
    <text x="590" y="154" font-size="11.5" fill="#294a2e">× 365 × 3 replicas ≈ 110 TB/year</text>

    <rect x="440" y="172" width="300" height="62" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="192" font-size="14" font-weight="700" fill="#294a2e">Cache memory</text>
    <text x="590" y="210" font-size="11.5" fill="#294a2e">0.2 × items read/day × item size</text>
    <text x="590" y="226" font-size="11.5" fill="#294a2e">80/20 rule: keep the hot 20%</text>

    <rect x="440" y="244" width="300" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="265" font-size="14" font-weight="700" fill="#294a2e">Bandwidth (egress)</text>
    <text x="590" y="284" font-size="11.5" fill="#294a2e">20,000/s × 10 KB = 200 MB/s ≈ 1.6 Gbit/s</text>

    <rect x="440" y="320" width="300" height="70" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="340" font-size="14" font-weight="700" fill="#294a2e">Servers</text>
    <text x="590" y="358" font-size="11.5" fill="#294a2e">60,000 ÷ 900 usable req/s ≈ 70</text>
    <text x="590" y="375" font-size="11.5" fill="#294a2e">+ survive losing 1 of 3 zones → ~105</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M170 76V108" marker-end="url(#bee-arrow)"/>
      <path d="M170 190V228" marker-end="url(#bee-arrow)"/>
      <path d="M170 286V324" marker-end="url(#bee-arrow)"/>
      <path d="M300 130H438" marker-end="url(#bee-arrow)"/>
      <path d="M300 180H438" marker-end="url(#bee-arrow)"/>
      <path d="M300 258H438" marker-end="url(#bee-arrow)"/>
      <path d="M300 354H438" marker-end="url(#bee-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="180" y="96" text-anchor="start">× actions per user</text>
      <text x="180" y="213" text-anchor="start">÷ 86,400 s (≈ 10^5)</text>
      <text x="180" y="309" text-anchor="start">× peak factor 3</text>
      <text x="369" y="123">writes × size</text>
      <text x="369" y="175">reads/day</text>
      <text x="369" y="251">× response size</text>
      <text x="369" y="347">÷ capacity/server</text>
    </g>
    <text x="390" y="420" font-size="13" fill="#40566b">Every result traces back to stated assumptions; change one input and recompute the chain.</text>
  </g>
</svg>
