<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="nta-title nta-desc">
  <title id="nta-title">Notification system: from producers to per-channel queues, providers, and delivery tracking</title>
  <desc id="nta-desc">Producers such as order, auth and campaign services call the notification API with an idempotency key and get 202. Immediate notifications go to the orchestrator; future ones wait in the scheduler until due. The orchestrator applies preferences, consent, quiet hours, suppressions, per-user rate limits and digests, renders templates, and puts one job per channel into the push, SMS, email or in-app queue. Workers send push through APNs or FCM, SMS and email through a primary provider with a failover provider, and in-app notifications to the inbox with a live badge. Provider results and webhooks update the delivery tracking database.</desc>
  <defs>
    <marker id="nta-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="30" width="140" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="90" y="52" font-size="14" font-weight="700" fill="#263e5a">Producers</text>
    <text x="90" y="69" font-size="11.5" fill="#263e5a">order, auth,</text>
    <text x="90" y="83" font-size="11.5" fill="#263e5a">campaigns</text>

    <g stroke-width="2" fill="#fff0d9" stroke="#bd7a20">
      <rect x="200" y="30" width="150" height="60" rx="8"/>
      <rect x="400" y="24" width="380" height="72" rx="8"/>
    </g>
    <text x="275" y="52" font-size="14" font-weight="700" fill="#66400f">Notification API</text>
    <text x="275" y="69" font-size="11.5" fill="#66400f">idempotency key</text>
    <text x="275" y="83" font-size="11.5" fill="#66400f">returns 202</text>
    <text x="590" y="45" font-size="14" font-weight="700" fill="#66400f">Orchestrator</text>
    <text x="590" y="63" font-size="11.5" fill="#66400f">preferences, consent, quiet hours, suppressions</text>
    <text x="590" y="80" font-size="11.5" fill="#66400f">per-user rate limits, digests, render templates</text>

    <g stroke-width="2" fill="#eef1f5" stroke="#8a96a3">
      <rect x="200" y="126" width="150" height="46" rx="8"/>
      <rect x="20" y="218" width="175" height="44" rx="8"/>
      <rect x="215" y="218" width="175" height="44" rx="8"/>
      <rect x="410" y="218" width="175" height="44" rx="8"/>
      <rect x="605" y="218" width="175" height="44" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="275" y="145">Scheduler</text>
      <text x="107" y="236">Push queue</text>
      <text x="302" y="236">SMS queue</text>
      <text x="497" y="236">Email queue</text>
      <text x="692" y="236">In-app queue</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="275" y="162">future sendAt</text>
      <text x="107" y="253">high + bulk lanes</text>
      <text x="302" y="253">high + bulk lanes</text>
      <text x="497" y="253">high + bulk lanes</text>
      <text x="692" y="253">high + bulk lanes</text>
    </g>

    <g stroke-width="2" fill="#e8f5e9" stroke="#53845b">
      <rect x="20" y="318" width="175" height="46" rx="8"/>
      <rect x="215" y="318" width="175" height="46" rx="8"/>
      <rect x="410" y="318" width="175" height="46" rx="8"/>
      <rect x="605" y="318" width="175" height="46" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#294a2e">
      <text x="107" y="337">APNs / FCM</text>
      <text x="302" y="337">SMS A ⇄ B</text>
      <text x="497" y="337">Email A ⇄ B</text>
      <text x="692" y="337">In-app inbox</text>
    </g>
    <g font-size="11.5" fill="#294a2e">
      <text x="107" y="355">Apple and Google push</text>
      <text x="302" y="355">primary + failover</text>
      <text x="497" y="355">primary + failover</text>
      <text x="692" y="355">+ live badge update</text>
    </g>

    <rect x="20" y="420" width="760" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="400" y="439" font-size="14" font-weight="700" fill="#463365">Delivery tracking (deliveries DB)</text>
    <text x="400" y="456" font-size="11.5" fill="#463365">queued → sending → sent → delivered → opened or read; failed, bounced, suppressed, expired</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 60H198" marker-end="url(#nta-arrow)"/>
      <path d="M350 60H398" marker-end="url(#nta-arrow)"/>
      <path d="M275 90V124" marker-end="url(#nta-arrow)"/>
      <path d="M350 149H470V98" marker-end="url(#nta-arrow)"/>
      <path d="M600 96V196H107V216" marker-end="url(#nta-arrow)"/>
      <path d="M600 96V196H302V216" marker-end="url(#nta-arrow)"/>
      <path d="M600 96V196H497V216" marker-end="url(#nta-arrow)"/>
      <path d="M600 96V196H692V216" marker-end="url(#nta-arrow)"/>
      <path d="M107 262V316" marker-end="url(#nta-arrow)"/>
      <path d="M302 262V316" marker-end="url(#nta-arrow)"/>
      <path d="M497 262V316" marker-end="url(#nta-arrow)"/>
      <path d="M692 262V316" marker-end="url(#nta-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round">
      <path d="M107 364V418" marker-end="url(#nta-arrow)"/>
      <path d="M302 364V418" marker-end="url(#nta-arrow)"/>
      <path d="M497 364V418" marker-end="url(#nta-arrow)"/>
      <path d="M692 364V418" marker-end="url(#nta-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="179" y="52">send</text>
      <text x="374" y="52">now</text>
      <text x="285" y="112" text-anchor="start">later</text>
      <text x="410" y="141">when due</text>
      <text x="610" y="150" text-anchor="start">one job per channel</text>
      <text x="117" y="294" text-anchor="start">workers</text>
      <text x="312" y="294" text-anchor="start">workers</text>
      <text x="507" y="294" text-anchor="start">workers</text>
      <text x="702" y="294" text-anchor="start">workers</text>
      <text x="117" y="396" text-anchor="start">accepted / failed</text>
      <text x="312" y="396" text-anchor="start">status webhooks</text>
      <text x="507" y="396" text-anchor="start">bounce webhooks</text>
      <text x="702" y="396" text-anchor="start">reads</text>
    </g>
    <text x="400" y="500" font-size="13" fill="#40566b">Each channel has its own queue and workers, so a slow email provider never delays push or SMS.</text>
  </g>
</svg>
