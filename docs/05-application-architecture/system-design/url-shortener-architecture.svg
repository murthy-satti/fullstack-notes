<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="usa-title usa-desc">
  <title id="usa-title">URL shortener: the create path and the redirect path</title>
  <desc id="usa-desc">Write path: the owner posts a long URL to the link API service, which takes the next ID from the ID allocator, checks the URL against phishing and malware lists, and inserts the code into the links store only if it is absent, then returns 201. Read path: a visitor requests a short code from the redirect service, which checks its local cache and Redis, reads the links store on a miss, and returns a 302 redirect. Each click is sent asynchronously to Kafka, where a stats aggregator writes daily counts to the stats database.</desc>
  <defs>
    <marker id="usa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#8062a8" text-anchor="start">
      <text x="20" y="28">Write path (create a link)</text>
      <text x="20" y="398">Read path (redirect)</text>
    </g>

    <rect x="20" y="40" width="120" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="80" y="61" font-size="14" font-weight="700" fill="#263e5a">Owner</text>
    <text x="80" y="79" font-size="11.5" fill="#263e5a">creates a link</text>
    <rect x="20" y="410" width="120" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="80" y="431" font-size="14" font-weight="700" fill="#263e5a">Visitor</text>
    <text x="80" y="449" font-size="11.5" fill="#263e5a">opens a short link</text>

    <g stroke-width="2" fill="#fff0d9" stroke="#bd7a20">
      <rect x="200" y="40" width="170" height="72" rx="8"/>
      <rect x="190" y="410" width="170" height="52" rx="8"/>
      <rect x="630" y="300" width="150" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#66400f">
      <text x="285" y="68">Link API service</text>
      <text x="275" y="431">Redirect service</text>
      <text x="705" y="321">Stats aggregator</text>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="285" y="86">validate, rate limit</text>
      <text x="285" y="101">generate the code</text>
      <text x="275" y="449">local LRU, then Redis</text>
      <text x="705" y="339">clicks per code/day</text>
    </g>

    <g stroke-width="2" fill="#eef1f5" stroke="#8a96a3">
      <rect x="440" y="20" width="180" height="44" rx="8"/>
      <rect x="440" y="80" width="180" height="44" rx="8"/>
      <rect x="630" y="410" width="150" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="530" y="38">ID allocator</text>
      <text x="530" y="98">URL safety check</text>
      <text x="705" y="431">Kafka</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="530" y="55">leases ID blocks</text>
      <text x="530" y="115">phishing, malware lists</text>
      <text x="705" y="449">click events</text>
    </g>

    <g stroke-width="2" fill="#f0e9fb" stroke="#8062a8">
      <rect x="300" y="230" width="200" height="56" rx="8"/>
      <rect x="420" y="410" width="160" height="52" rx="8"/>
      <rect x="630" y="200" width="150" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365">
      <text x="400" y="253">Links store</text>
      <text x="500" y="431">Redis cache</text>
      <text x="705" y="221">Stats DB</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="400" y="272">key-value, keyed by code</text>
      <text x="500" y="449">TTL ≤ link expiry</text>
      <text x="705" y="239">read by the stats API</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M140 60H198" marker-end="url(#usa-arrow)"/>
      <path d="M370 50H438" marker-end="url(#usa-arrow)"/>
      <path d="M370 102H438" marker-end="url(#usa-arrow)"/>
      <path d="M310 112L364 228" marker-end="url(#usa-arrow)"/>
      <path d="M140 428H188" marker-end="url(#usa-arrow)"/>
      <path d="M360 436H418" marker-end="url(#usa-arrow)"/>
      <path d="M300 410L368 288" marker-end="url(#usa-arrow)"/>
      <path d="M705 410V354" marker-end="url(#usa-arrow)"/>
      <path d="M705 300V254" marker-end="url(#usa-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M198 84H142" marker-end="url(#usa-arrow)"/>
      <path d="M188 452H142" marker-end="url(#usa-arrow)"/>
      <path d="M275 462V488H690V464" marker-end="url(#usa-arrow)"/>
    </g>

    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="170" y="53">W1 POST</text>
      <text x="170" y="104">201</text>
      <text x="404" y="43">W2 next ID</text>
      <text x="404" y="95">W3 check</text>
      <text x="330" y="176" text-anchor="end">W4 put if absent</text>
      <text x="164" y="421">R1 GET</text>
      <text x="164" y="476">302</text>
      <text x="389" y="429">R2 get</text>
      <text x="346" y="352" text-anchor="start">R3 miss: read</text>
      <text x="482" y="504">R4 click event (async, buffered)</text>
      <text x="715" y="386" text-anchor="start">consume</text>
      <text x="715" y="281" text-anchor="start">counts</text>
    </g>
    <text x="400" y="540" font-size="13" fill="#40566b">Redirects need only the cache and the links store; analytics go through Kafka, off the hot path.</text>
  </g>
</svg>
