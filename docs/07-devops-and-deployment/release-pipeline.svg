<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">A simple software delivery pipeline</title>
  <desc id="desc">A code change is checked and built, then released and observed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#466a45"/>
    </marker>
    <style>
      .box{fill:#f1f7ed;stroke:#466a45;stroke-width:2}.txt{font:16px sans-serif;fill:#253d24}.small{font:13px sans-serif;fill:#466a45}.line{stroke:#466a45;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="20" y="58" width="118" height="62" rx="10" class="box"/>
  <text x="79" y="84" text-anchor="middle" class="txt">Code change</text>
  <text x="79" y="104" text-anchor="middle" class="small">commit / PR</text>
  <rect x="180" y="58" width="118" height="62" rx="10" class="box"/>
  <text x="239" y="84" text-anchor="middle" class="txt">Checks</text>
  <text x="239" y="104" text-anchor="middle" class="small">tests and lint</text>
  <rect x="342" y="58" width="118" height="62" rx="10" class="box"/>
  <text x="401" y="84" text-anchor="middle" class="txt">Build</text>
  <text x="401" y="104" text-anchor="middle" class="small">versioned artifact</text>
  <rect x="502" y="58" width="118" height="62" rx="10" class="box"/>
  <text x="561" y="84" text-anchor="middle" class="txt">Release</text>
  <text x="561" y="104" text-anchor="middle" class="small">monitor behavior</text>
  <path d="M138 89H172" class="line"/>
  <path d="M298 89H334" class="line"/>
  <path d="M460 89H494" class="line"/>
  <text x="320" y="157" text-anchor="middle" class="small">Automation makes delivery repeatable; checks reduce risk but do not prove perfection.</text>
</svg>
