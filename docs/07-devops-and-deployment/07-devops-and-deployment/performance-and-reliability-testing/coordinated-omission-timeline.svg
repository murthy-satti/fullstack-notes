<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="com-title com-desc">
  <title id="com-title">Coordinated omission: one server pause recorded by a closed loop and by an open model</title>
  <desc id="com-desc">A timeline from 0 to 1,000 milliseconds with the server pausing from 300 to 800 milliseconds, for example during a garbage collection pause, a blocking call, or a full connection pool. Top, a closed loop with two virtual users and no pauses between requests: before and after the pause each user sends a steady stream of short requests, but during the pause each user is stuck on a single request, so only two slow samples are recorded and nothing else is sent. Bottom, an open model at 120 requests per second: requests keep arriving during the pause, about 60 of them, and each waits until the pause ends, so 60 slow samples are recorded, from 500 milliseconds for the first down to about 8 milliseconds for the last, forming a triangle. A table of three local runs against a lab server that paused for 500 milliseconds every 5 seconds, 30 seconds per scenario: the closed loop sent 3,249 to 3,468 requests with p90 of 16 to 20 milliseconds, p99 of 22 to 36 milliseconds, and a maximum of 516 to 523 milliseconds; the open model sent 3,600 to 3,601 requests with p90 of 60 to 68 milliseconds, p99 of 468 to 475 milliseconds, and a maximum of 510 to 558 milliseconds.</desc>
  <defs>
    <marker id="com-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b">One 500 ms server pause, recorded by a closed loop and by an open model</text>
    <text x="529" y="54" font-size="11.5" fill="#6e2a24" text-anchor="middle">the server pauses for 500 ms (a GC pause, a blocking call, a full pool)</text>
    <path d="M357 62V272M702 62V272" fill="none" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="24" y="84" font-size="13" font-weight="700" fill="#36424e">Closed loop</text>
    <text x="24" y="100" font-size="11.5" fill="#36424e">2 VUs, no pauses</text>
    <g fill="none" stroke="#4774aa" stroke-width="12" stroke-dasharray="10 2">
      <path d="M150 80H354"/>
      <path d="M709 80H840"/>
      <path d="M150 104H348"/>
      <path d="M707 104H840"/>
    </g>
    <rect x="355" y="74" width="352" height="12" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="349" y="98" width="356" height="12" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="362" y="118" width="334" height="16" fill="#f5f7fb"/>
    <text x="529" y="130" font-size="11.5" fill="#6e2a24" text-anchor="middle">each VU is stuck once: only 2 slow samples are recorded</text>

    <path d="M24 150H856" fill="none" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="178" font-size="13" font-weight="700" fill="#36424e">Open model</text>
    <text x="24" y="194" font-size="11.5" fill="#36424e">120 requests/s</text>
    <g fill="none" stroke="#4774aa" stroke-width="12" stroke-dasharray="10 2">
      <path d="M150 172H355"/>
      <path d="M706 172H840"/>
    </g>
    <path d="M357 166H702V238Z" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M415 178H702M472 190H702M530 202H702M587 214H702M645 226H702" fill="none" stroke="#b5524b" stroke-width="1"/>
    <rect x="236" y="246" width="586" height="16" fill="#f5f7fb"/>
    <text x="529" y="258" font-size="11.5" fill="#6e2a24" text-anchor="middle">about 60 requests arrive during the pause: 60 slow samples, from 500 ms down to 8 ms</text>

    <path d="M150 284H842" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#com-arrow)"/>
    <path d="M150 279V289M357 279V289M702 279V289" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="150" y="302">0 ms</text>
      <text x="357" y="302">300 ms</text>
      <text x="702" y="302">800 ms</text>
    </g>
    <text x="842" y="302" font-size="11.5" fill="#36424e" text-anchor="end">time</text>

    <text x="24" y="328" font-size="12" font-weight="700" fill="#40566b">Measured locally: lab server pausing 500 ms every 5 s, 30 s per scenario, 3 runs</text>
    <rect x="24" y="336" width="832" height="22" fill="#eef1f5" stroke="#c9d1db" stroke-width="1"/>
    <rect x="24" y="358" width="832" height="22" fill="#fbe9e7" stroke="#c9d1db" stroke-width="1"/>
    <rect x="24" y="380" width="832" height="22" fill="#e7f3e9" stroke="#c9d1db" stroke-width="1"/>
    <g font-size="12" fill="#36424e">
      <text x="36" y="351" font-weight="700">workload model</text>
      <text x="354" y="351" font-weight="700" text-anchor="middle">requests sent</text>
      <text x="504" y="351" font-weight="700" text-anchor="middle">p90</text>
      <text x="644" y="351" font-weight="700" text-anchor="middle">p99</text>
      <text x="785" y="351" font-weight="700" text-anchor="middle">max</text>
      <text x="36" y="373">closed loop, 2 VUs</text>
      <text x="354" y="373" text-anchor="middle">3,249-3,468</text>
      <text x="504" y="373" text-anchor="middle">16-20 ms</text>
      <text x="644" y="373" text-anchor="middle">22-36 ms</text>
      <text x="785" y="373" text-anchor="middle">516-523 ms</text>
      <text x="36" y="395">open model, 120/s</text>
      <text x="354" y="395" text-anchor="middle">3,600-3,601</text>
      <text x="504" y="395" text-anchor="middle">60-68 ms</text>
      <text x="644" y="395" text-anchor="middle">468-475 ms</text>
      <text x="785" y="395" text-anchor="middle">510-558 ms</text>
    </g>

    <text x="440" y="428" font-size="13" fill="#40566b" text-anchor="middle">Same server, same pauses: the closed loop hides almost all of the waiting users would feel.</text>
  </g>
</svg>
