<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="btf-title btf-desc">
  <title id="btf-title">Triage flowchart for a bottleneck found by a load test</title>
  <desc id="btf-desc">Start when p95 latency or errors rise under load. First ask whether the load generator is healthy, with no dropped iterations and CPU below 80 percent; if not, fix the test first with more VUs, more generator hosts, and stubbed third parties. If it is healthy, ask whether event-loop utilization is above about 80 percent; if yes, the service is CPU-bound in JavaScript: record a CPU profile with --cpu-prof under load, read the flame graph, and check garbage collection time. If not, ask whether there are connection pool waiters or slow queries in the database; if yes, look at the slow query log, explain plans, indexes, N+1 query patterns, and the pool size by Little's law. If not, ask whether traces show slow dependencies or network time; if yes, look at timeouts, connection reuse, caching, and the dependency's own limits. If not, check other limits such as rate limiters, file descriptors, and memory. After every fix, re-run the same test and compare with the baseline.</desc>
  <defs>
    <marker id="btf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Triage when latency or errors rise under load</text>

    <rect x="70" y="44" width="300" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="69" font-size="13" font-weight="700" fill="#66400f">p95 or errors rise under load</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M70 140 220 100 370 140 220 180Z"/>
      <path d="M70 250 220 210 370 250 220 290Z"/>
      <path d="M70 360 220 320 370 360 220 400Z"/>
      <path d="M70 470 220 430 370 470 220 510Z"/>
    </g>
    <g fill="#36424e">
      <text x="220" y="136" font-size="12" font-weight="700">Load generator healthy?</text>
      <text x="220" y="154" font-size="11.5">no drops, CPU below 80%</text>
      <text x="220" y="246" font-size="12" font-weight="700">Event-loop utilization</text>
      <text x="220" y="264" font-size="11.5">above about 80%?</text>
      <text x="220" y="356" font-size="12" font-weight="700">Pool waiters or slow</text>
      <text x="220" y="374" font-size="11.5">queries in the database?</text>
      <text x="220" y="466" font-size="12" font-weight="700">Slow dependencies or</text>
      <text x="220" y="484" font-size="11.5">network time in traces?</text>
    </g>

    <rect x="470" y="116" width="386" height="48" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="663" y="136" font-size="13" font-weight="700" fill="#6e2a24">Fix the test first</text>
    <text x="663" y="154" font-size="11.5" fill="#6e2a24">more VUs, more generator hosts, stub third parties</text>
    <rect x="470" y="226" width="386" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="663" y="246" font-size="13" font-weight="700" fill="#66400f">CPU-bound JavaScript</text>
    <text x="663" y="264" font-size="11.5" fill="#66400f">--cpu-prof under load, flame graph, GC time</text>
    <rect x="470" y="336" width="386" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="663" y="356" font-size="13" font-weight="700" fill="#263e5a">Database</text>
    <text x="663" y="374" font-size="11.5" fill="#263e5a">slow query log, explain(), indexes, N+1, pool size</text>
    <rect x="470" y="446" width="386" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="663" y="466" font-size="13" font-weight="700" fill="#463365">A dependency</text>
    <text x="663" y="484" font-size="11.5" fill="#463365">timeouts, connection reuse, caching, its own limits</text>
    <rect x="70" y="536" width="300" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="555" font-size="13" font-weight="700" fill="#36424e">Other limits</text>
    <text x="220" y="572" font-size="11.5" fill="#36424e">rate limiters, file descriptors, memory</text>
    <rect x="470" y="536" width="386" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="663" y="555" font-size="13" font-weight="700" fill="#294a2e">After every fix</text>
    <text x="663" y="572" font-size="11.5" fill="#294a2e">re-run the same test and compare with the baseline</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M220 84V98" marker-end="url(#btf-arrow)"/>
      <path d="M370 140H468" marker-end="url(#btf-arrow)"/>
      <path d="M220 180V208" marker-end="url(#btf-arrow)"/>
      <path d="M370 250H468" marker-end="url(#btf-arrow)"/>
      <path d="M220 290V318" marker-end="url(#btf-arrow)"/>
      <path d="M370 360H468" marker-end="url(#btf-arrow)"/>
      <path d="M220 400V428" marker-end="url(#btf-arrow)"/>
      <path d="M370 470H468" marker-end="url(#btf-arrow)"/>
      <path d="M220 510V534" marker-end="url(#btf-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="419" y="132">no</text>
      <text x="232" y="198" text-anchor="start">yes</text>
      <text x="419" y="242">yes</text>
      <text x="232" y="308" text-anchor="start">no</text>
      <text x="419" y="352">yes</text>
      <text x="232" y="418" text-anchor="start">no</text>
      <text x="419" y="462">yes</text>
      <text x="232" y="526" text-anchor="start">no</text>
    </g>

    <text x="440" y="616" font-size="13" fill="#40566b">Rule out the test, then CPU, then the database, then dependencies; re-run after every single fix.</text>
  </g>
</svg>
