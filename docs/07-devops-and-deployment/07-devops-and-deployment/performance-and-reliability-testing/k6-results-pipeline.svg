<svg xmlns="http://www.w3.org/2000/svg" width="880" height="444" viewBox="0 0 880 444" role="img" aria-labelledby="krp-title krp-desc">
  <title id="krp-title">Where k6 results go</title>
  <desc id="krp-desc">One k6 run feeds five destinations. The end-of-test summary, or a custom handleSummary function, writes results/summary.json, which CI keeps as an artifact. The exit code makes the CI step pass with 0 or fail with 99. The web dashboard is live on localhost port 5665 during the run, and can export an HTML report with K6_WEB_DASHBOARD_EXPORT. File outputs with --out json or csv keep raw samples for your own analysis. The opentelemetry output sends metrics to an OpenTelemetry Collector or a Prometheus OTLP receiver, and Grafana dashboards show them next to the application's own metrics. The influxdb and experimental-prometheus-rw outputs are deprecated since k6 2.4 and planned for removal in k6 3.</desc>
  <defs>
    <marker id="krp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="444" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Where the results of one k6 run go</text>

    <rect x="24" y="172" width="140" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="204" font-size="14" font-weight="700" fill="#66400f">k6 run</text>
    <text x="94" y="224" font-size="11.5" fill="#66400f">perf/average-load.js</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M164 210H184"/>
      <path d="M184 64V352"/>
      <path d="M184 64H212" marker-end="url(#krp-arrow)"/>
      <path d="M184 136H212" marker-end="url(#krp-arrow)"/>
      <path d="M184 208H212" marker-end="url(#krp-arrow)"/>
      <path d="M184 280H212" marker-end="url(#krp-arrow)"/>
      <path d="M184 352H212" marker-end="url(#krp-arrow)"/>
      <path d="M424 64H462" marker-end="url(#krp-arrow)"/>
      <path d="M424 136H462" marker-end="url(#krp-arrow)"/>
      <path d="M424 208H462" marker-end="url(#krp-arrow)"/>
      <path d="M424 280H462" marker-end="url(#krp-arrow)"/>
      <path d="M424 352H462" marker-end="url(#krp-arrow)"/>
      <path d="M664 352H702" marker-end="url(#krp-arrow)"/>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="214" y="42" width="210" height="44" rx="8"/>
      <rect x="214" y="114" width="210" height="44" rx="8"/>
      <rect x="214" y="186" width="210" height="44" rx="8"/>
      <rect x="214" y="258" width="210" height="44" rx="8"/>
      <rect x="214" y="330" width="210" height="44" rx="8"/>
    </g>
    <g fill="#463365">
      <text x="319" y="61" font-size="13" font-weight="700">end-of-test summary</text>
      <text x="319" y="77" font-size="11.5">or handleSummary()</text>
      <text x="319" y="133" font-size="13" font-weight="700">exit code</text>
      <text x="319" y="149" font-size="11.5">0 pass, 99 threshold failed</text>
      <text x="319" y="205" font-size="13" font-weight="700">web dashboard</text>
      <text x="319" y="221" font-size="11.5">K6_WEB_DASHBOARD=true</text>
      <text x="319" y="277" font-size="13" font-weight="700">file outputs</text>
      <text x="319" y="293" font-size="11.5">--out json=... --out csv=...</text>
      <text x="319" y="349" font-size="13" font-weight="700">opentelemetry output</text>
      <text x="319" y="365" font-size="11.5">-o opentelemetry</text>
    </g>

    <rect x="464" y="42" width="392" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="660" y="61" font-size="12.5" font-weight="700" fill="#36424e">results/summary.json</text>
    <text x="660" y="77" font-size="11.5" fill="#36424e">kept as a CI artifact, compared with the last baseline</text>
    <rect x="464" y="114" width="392" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="660" y="133" font-size="12.5" font-weight="700" fill="#294a2e">CI step passes or fails</text>
    <text x="660" y="149" font-size="11.5" fill="#294a2e">the gate that blocks a regression</text>
    <rect x="464" y="186" width="392" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="660" y="205" font-size="12.5" font-weight="700" fill="#36424e">live on localhost:5665, or an HTML report</text>
    <text x="660" y="221" font-size="11.5" fill="#36424e">K6_WEB_DASHBOARD_EXPORT=results/report.html</text>
    <rect x="464" y="258" width="392" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="660" y="277" font-size="12.5" font-weight="700" fill="#36424e">every sample, for your own analysis</text>
    <text x="660" y="293" font-size="11.5" fill="#36424e">large files: compress, keep briefly</text>
    <rect x="464" y="330" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="564" y="349" font-size="12" font-weight="700" fill="#263e5a">OTel Collector, or</text>
    <text x="564" y="365" font-size="11.5" fill="#263e5a">Prometheus OTLP receiver</text>
    <rect x="704" y="330" width="152" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="780" y="349" font-size="13" font-weight="700" fill="#263e5a">Grafana</text>
    <text x="780" y="365" font-size="11.5" fill="#263e5a">next to app metrics</text>

    <text x="440" y="400" font-size="11.5" fill="#60788d">The influxdb and experimental-prometheus-rw outputs are deprecated since k6 2.4 (removal planned for k6 3).</text>
    <text x="440" y="428" font-size="13" fill="#40566b">Gate on the exit code, keep summaries as artifacts, and stream metrics next to the app's own.</text>
  </g>
</svg>
