<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388" role="img" aria-labelledby="fgr-title fgr-desc">
  <title id="fgr-title">How to read a flame graph</title>
  <desc id="fgr-desc">An illustrative flame graph of on-CPU samples for TaskFlow's GET /tasks endpoint with a slow statistics builder. The bottom row holds all on-CPU samples. Above it, garbage collection takes 10 percent and the GET /tasks handler 90 percent. Above the handler, buildTaskStats appears in 70 percent of samples, the database driver's find in 5 percent, and res.json in 15 percent. Above buildTaskStats, JSON.parse and JSON.stringify take 25 percent each and the map callback 15 percent; above find, BSON decoding takes 4 percent; above res.json, JSON.stringify takes 12.5 percent. The widest top edges, the deep copies made with JSON.parse and JSON.stringify, are self time and the first place to look, and serializing the response is the second. Width shows the share of CPU samples, with frames sorted by name rather than by time; height is stack depth, so each box is called by the box below it.</desc>
  <defs>
    <marker id="fgr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="388" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Reading a flame graph (illustrative): GET /tasks with a slow statistics builder</text>

    <text x="320" y="70" font-size="11.5" font-weight="700" fill="#6e2a24">widest top edges = self time:</text>
    <text x="320" y="87" font-size="11.5" fill="#6e2a24">40 deep copies per request</text>
    <text x="770" y="70" font-size="11.5" font-weight="700" fill="#6e2a24">second place to look:</text>
    <text x="770" y="87" font-size="11.5" fill="#6e2a24">serializing the response</text>
    <g fill="none" stroke="#40566b" stroke-width="1.5" stroke-linecap="round">
      <path d="M260 96 220 194" marker-end="url(#fgr-arrow)"/>
      <path d="M380 96 420 194" marker-end="url(#fgr-arrow)"/>
      <path d="M770 96V194" marker-end="url(#fgr-arrow)"/>
    </g>

    <rect x="40" y="276" width="800" height="24" rx="3" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="440" y="293" font-size="12" fill="#36424e">all on-CPU samples</text>

    <rect x="40" y="250" width="80" height="24" rx="3" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="80" y="267" font-size="12" fill="#6e2a24">(GC)</text>
    <rect x="120" y="250" width="720" height="24" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="480" y="267" font-size="12" fill="#66400f">GET /tasks handler</text>

    <rect x="120" y="224" width="560" height="24" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="400" y="241" font-size="12" font-weight="700" fill="#66400f">buildTaskStats (70% of samples)</text>
    <rect x="680" y="224" width="40" height="24" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="700" y="241" font-size="11" fill="#263e5a">find</text>
    <rect x="720" y="224" width="120" height="24" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="780" y="241" font-size="12" fill="#66400f">res.json</text>

    <rect x="120" y="198" width="200" height="24" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="220" y="215" font-size="12" fill="#463365">JSON.parse</text>
    <rect x="320" y="198" width="200" height="24" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="420" y="215" font-size="12" fill="#463365">JSON.stringify</text>
    <rect x="520" y="198" width="120" height="24" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="580" y="215" font-size="12" fill="#66400f">map callback</text>
    <rect x="680" y="198" width="32" height="24" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="696" y="215" font-size="10" fill="#263e5a">BSON</text>
    <rect x="720" y="198" width="100" height="24" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="770" y="215" font-size="11" fill="#463365">JSON.stringify</text>

    <g font-size="11.5" fill="#36424e">
      <text x="440" y="322">width = share of CPU samples, frames sorted by name (not by time)</text>
      <text x="440" y="340">height = stack depth: each box is called by the box below it</text>
    </g>

    <text x="440" y="370" font-size="13" fill="#40566b">Read a flame graph from the top: the widest top edges are where the CPU time goes.</text>
  </g>
</svg>
