<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="lso-title lso-desc">
  <title id="lso-title">One Ubuntu server running TaskFlow API</title>
  <desc id="lso-desc">On the left, an engineer's laptop connects with ssh and an Ed25519 key, and users send HTTPS requests. Both pass a cloud firewall and ufw that leave only ports 22, 80 and 443 open. Inside the Ubuntu 26.04 LTS server at 203.0.113.10, sshd on port 22 accepts keys only and no root login; from that session the engineer runs systemctl and journalctl against systemd. nginx on port 443 terminates TLS, applies limits and proxies requests to 127.0.0.1 ports 3001 and 3002. systemd supervises two TaskFlow API instances, taskflow-api@3001 and taskflow-api@3002, running Node 24 as the taskflow user, restarting them on a crash and stopping them gracefully on deploys. Their stdout and stderr go to journald. systemd timers start scheduled jobs such as backups, log rotation and apt updates. The app instances talk to a managed MongoDB replica set over TLS on a private network.</desc>
  <defs>
    <marker id="lso-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lso-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">From a laptop and a browser to an app supervised by systemd</text>

    <rect x="24" y="92" width="140" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="115" font-size="14" font-weight="700" fill="#66400f">Your laptop</text>
    <text x="94" y="134" font-size="11.5" fill="#66400f">ssh + Ed25519 key</text>
    <rect x="24" y="300" width="140" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="323" font-size="14" font-weight="700" fill="#66400f">Users</text>
    <text x="94" y="342" font-size="11.5" fill="#66400f">HTTPS requests</text>

    <rect x="214" y="50" width="26" height="360" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="227" y="230" font-size="11.5" font-weight="700" fill="#6e2a24" transform="rotate(-90 227 230)">cloud firewall + ufw: only 22, 80, 443 open</text>

    <rect x="252" y="50" width="624" height="360" rx="10" fill="#ffffff" stroke="#4774aa" stroke-width="2"/>
    <text x="272" y="76" font-size="14" font-weight="700" fill="#263e5a" text-anchor="start">Ubuntu 26.04 LTS server, 203.0.113.10</text>

    <rect x="272" y="92" width="160" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="352" y="115" font-size="14" font-weight="700" fill="#463365">sshd :22</text>
    <text x="352" y="134" font-size="11.5" fill="#463365">keys only, no root</text>

    <rect x="272" y="300" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="352" y="323" font-size="14" font-weight="700" fill="#263e5a">nginx :443</text>
    <text x="352" y="342" font-size="11.5" fill="#263e5a">TLS, limits, proxy</text>
    <text x="352" y="376" font-size="11" fill="#36424e">proxies to 127.0.0.1</text>
    <text x="352" y="391" font-size="11" fill="#36424e">ports 3001 and 3002</text>

    <rect x="462" y="170" width="180" height="186" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="552" y="192" font-size="14" font-weight="700" fill="#463365">systemd</text>
    <rect x="477" y="206" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="552" y="225" font-size="12.5" font-weight="700" fill="#66400f">taskflow-api@3001</text>
    <text x="552" y="241" font-size="11" fill="#66400f">Node 24 as taskflow</text>
    <rect x="477" y="260" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="552" y="279" font-size="12.5" font-weight="700" fill="#66400f">taskflow-api@3002</text>
    <text x="552" y="295" font-size="11" fill="#66400f">Node 24 as taskflow</text>
    <text x="552" y="324" font-size="11" fill="#463365">restart on crash,</text>
    <text x="552" y="339" font-size="11" fill="#463365">graceful stop on deploy</text>

    <rect x="682" y="180" width="174" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="769" y="203" font-size="14" font-weight="700" fill="#463365">journald</text>
    <text x="769" y="222" font-size="11.5" fill="#463365">app and system logs</text>

    <rect x="682" y="300" width="174" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="769" y="323" font-size="14" font-weight="700" fill="#463365">systemd timers</text>
    <text x="769" y="342" font-size="11" fill="#463365">backups, logrotate, apt</text>

    <rect x="462" y="432" width="180" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="552" y="451" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="552" y="467" font-size="11.5" fill="#263e5a">managed replica set</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 120H270" marker-end="url(#lso-arrow)"/>
      <path d="M164 328H270" marker-end="url(#lso-arrow)"/>
      <path d="M432 314 475 230" marker-end="url(#lso-arrow)"/>
      <path d="M432 334 475 284" marker-end="url(#lso-arrow)"/>
      <path d="M642 208H680" marker-end="url(#lso-arrow)"/>
      <path d="M682 328H644" marker-end="url(#lso-arrow)"/>
      <path d="M552 356V430" marker-end="url(#lso-arrow)"/>
    </g>
    <path d="M432 120H552V168" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lso-arrow-ret)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="189" y="113">SSH</text>
      <text x="189" y="321">HTTPS</text>
      <text x="510" y="112">systemctl, journalctl</text>
      <text x="662" y="201">logs</text>
    </g>
    <text x="544" y="424" font-size="11" fill="#36424e" text-anchor="end">TLS, private network</text>

    <text x="450" y="505" font-size="13" fill="#40566b">You own every layer: access (SSH), entry (nginx), supervision (systemd), and evidence (journal).</text>
  </g>
</svg>
