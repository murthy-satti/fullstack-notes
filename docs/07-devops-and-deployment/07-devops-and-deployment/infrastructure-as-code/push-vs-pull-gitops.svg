<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="pvp-title pvp-desc">
  <title id="pvp-title">Push-based deployment compared with pull-based GitOps</title>
  <desc id="pvp-desc">Left, push: a developer merges to the Git repository, the CI pipeline runs, and CI applies manifests to the cluster with kubectl or helm. CI must hold credentials that can change the cluster, and after the run nothing notices if someone changes the cluster by hand. Right, pull with GitOps: CI in the application repository builds an image and opens a pull request that changes the image digest in the environment repository. Merging that pull request is the deployment. An agent running inside the cluster, Argo CD or Flux, pulls the environment repository every few minutes, compares it with the live cluster, and applies the difference. Cluster credentials never leave the cluster, every change is a Git commit, and manual changes are reverted automatically.</desc>
  <defs>
    <marker id="pvp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pvp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="30" font-size="14" font-weight="700" fill="#40566b">Push: CI deploys</text>
    <text x="640" y="30" font-size="14" font-weight="700" fill="#40566b">Pull: GitOps agent reconciles</text>
    <path d="M430 16V370" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="120" y="46" width="200" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="73" font-size="13" font-weight="700" fill="#66400f">Merge to the repository</text>
    <rect x="120" y="120" width="200" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="220" y="143" font-size="13" font-weight="700" fill="#463365">CI pipeline</text>
    <text x="220" y="161" font-size="11.5" fill="#463365">kubectl apply / helm upgrade</text>
    <rect x="60" y="190" width="320" height="28" rx="14" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="220" y="209" font-size="11.5" fill="#6e2a24">CI holds credentials that can change the cluster</text>
    <rect x="120" y="250" width="200" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="220" y="273" font-size="13" font-weight="700" fill="#263e5a">Cluster</text>
    <text x="220" y="291" font-size="11.5" fill="#263e5a">changed once, per run</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M220 90V118" marker-end="url(#pvp-arrow)"/>
      <path d="M320 148H396V278H322" stroke-linejoin="round" marker-end="url(#pvp-arrow)"/>
    </g>
    <text x="404" y="216" font-size="11" fill="#36424e" text-anchor="start">push</text>
    <text x="220" y="334" font-size="11.5" font-style="italic" fill="#6e2a24">manual changes later go unnoticed</text>

    <rect x="450" y="46" width="180" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="540" y="69" font-size="13" font-weight="700" fill="#66400f">App repo CI</text>
    <text x="540" y="87" font-size="11.5" fill="#66400f">builds image, opens PR</text>
    <rect x="660" y="46" width="180" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="750" y="69" font-size="13" font-weight="700" fill="#463365">Environment repo</text>
    <text x="750" y="87" font-size="11.5" fill="#463365">merged PR = deploy</text>
    <path d="M630 74H658" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#pvp-arrow)"/>

    <rect x="450" y="150" width="390" height="190" rx="10" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="466" y="172" font-size="13" font-weight="700" fill="#263e5a" text-anchor="start">Cluster</text>
    <rect x="660" y="180" width="160" height="56" rx="8" fill="#ffffff" stroke="#8062a8" stroke-width="2"/>
    <text x="740" y="203" font-size="13" font-weight="700" fill="#463365">GitOps agent</text>
    <text x="740" y="221" font-size="11.5" fill="#463365">Argo CD or Flux</text>
    <rect x="470" y="262" width="170" height="56" rx="8" fill="#ffffff" stroke="#4774aa" stroke-width="2"/>
    <text x="555" y="285" font-size="13" font-weight="700" fill="#263e5a">Workloads</text>
    <text x="555" y="303" font-size="11.5" fill="#263e5a">match the repo</text>

    <path d="M750 180V104" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pvp-arrow-ret)"/>
    <rect x="756" y="133" width="78" height="14" fill="#f5f7fb"/>
    <text x="795" y="144" font-size="11" fill="#36424e">pull, ~1 min</text>
    <path d="M700 236V290H642" fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round" marker-end="url(#pvp-arrow)"/>
    <text x="712" y="268" font-size="11" fill="#36424e" text-anchor="start">compare,</text>
    <text x="712" y="282" font-size="11" fill="#36424e" text-anchor="start">apply the diff</text>
    <text x="640" y="362" font-size="11.5" font-style="italic" fill="#294a2e">credentials stay inside; manual changes are reverted</text>

    <text x="430" y="410" font-size="13" fill="#40566b">In GitOps, Git is the only way in: the agent pulls desired state and keeps the cluster matching it.</text>
  </g>
</svg>
