<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="tmc-title tmc-desc">
  <title id="tmc-title">Root modules per environment composing shared modules</title>
  <desc id="tmc-desc">The production root module, envs/prod, holds the provider and backend configuration, the production variable values, and its own state file. It calls three shared modules: modules/network with a CIDR range of 10.20.0.0/16, modules/uploads-bucket with a bucket name, and modules/api-service with an image tag. The network module itself calls a public registry VPC module pinned to a version. The network module's output private_subnet_ids is passed by the root module into the api-service module's input. The development and staging root modules call the same modules with their own variable values and their own state.</desc>
  <defs>
    <marker id="tmc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="tmc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="110" width="230" height="130" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="135" y="136" font-size="14" font-weight="700" fill="#66400f">envs/prod (root)</text>
    <g font-size="11.5" fill="#66400f">
      <text x="135" y="162">provider and backend</text>
      <text x="135" y="184">production variable values</text>
      <text x="135" y="206">own state: prod/...tfstate</text>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="420" y="40" width="220" height="60" rx="8"/>
      <rect x="420" y="145" width="220" height="60" rx="8"/>
      <rect x="420" y="250" width="220" height="60" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365">
      <text x="530" y="64">modules/network</text>
      <text x="530" y="169">modules/uploads-bucket</text>
      <text x="530" y="274">modules/api-service</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="530" y="84">VPC, subnets, routing</text>
      <text x="530" y="189">bucket, IAM policy</text>
      <text x="530" y="294">service, scaling, alarms</text>
    </g>

    <rect x="690" y="40" width="150" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="765" y="64" font-size="13" font-weight="700" fill="#263e5a">Registry VPC module</text>
    <text x="765" y="84" font-size="11.5" fill="#263e5a">version pinned</text>
    <path d="M640 70H688" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#tmc-arrow)"/>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M250 140 418 74" marker-end="url(#tmc-arrow)"/>
      <path d="M250 175H418" marker-end="url(#tmc-arrow)"/>
      <path d="M250 210 418 276" marker-end="url(#tmc-arrow)"/>
    </g>
    <g font-size="11" fill="#36424e">
      <rect x="280" y="96" width="112" height="13" fill="#f5f7fb"/>
      <text x="336" y="106">cidr 10.20.0.0/16</text>
      <rect x="290" y="161" width="92" height="13" fill="#f5f7fb"/>
      <text x="336" y="171">bucket_name</text>
      <rect x="296" y="240" width="80" height="13" fill="#f5f7fb"/>
      <text x="336" y="250">image_tag</text>
    </g>

    <path d="M640 85H670V280H642" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#tmc-arrow-ret)"/>
    <text x="680" y="176" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">output</text>
    <text x="680" y="191" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">private_subnet_ids</text>
    <text x="680" y="206" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">passed by the root</text>

    <rect x="20" y="270" width="110" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="75" y="295" font-size="12" font-weight="700" fill="#66400f">envs/dev</text>
    <rect x="140" y="270" width="110" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="195" y="295" font-size="12" font-weight="700" fill="#66400f">envs/staging</text>
    <text x="135" y="330" font-size="11" font-style="italic" fill="#66400f">same modules, own values and state</text>

    <text x="430" y="364" font-size="13" fill="#40566b">Root modules hold environment choices and state; shared modules hold reusable, versioned design.</text>
  </g>
</svg>
