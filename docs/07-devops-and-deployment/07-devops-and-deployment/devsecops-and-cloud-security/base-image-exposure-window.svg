<svg xmlns="http://www.w3.org/2000/svg" width="860" height="424" viewBox="0 0 860 424" role="img" aria-labelledby="bew-title bew-desc">
  <title id="bew-title">How long a fixed base image package takes to reach production</title>
  <desc id="bew-desc">Top: the chain a fix travels. Debian ships a security update; the base image is updated with a new digest for the same tag, at least monthly and sooner for critical fixes; your image is rebuilt with the new base at your rebuild cadence; and production is patched only after the normal deploy pipeline runs. Bottom: the worst-case extra wait in your own pipeline once the base image is updated, on a scale from day 0 to day 30. A daily rebuild waits up to 1 day, then deploys. A weekly rebuild waits up to 7 days, then deploys. A digest-bump pull request from a bot that runs weekly waits for the bot's schedule, then for review and merge, then the deploy. A monthly rebuild waits up to 30 days, then deploys. An image that is never rebuilt waits until the next code change, which can be weeks to months. A rebuilt image that is never deployed protects nothing, so measure the age of what runs.</desc>
  <defs>
    <marker id="bew-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="bew-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="424" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">How a Debian fix reaches production</text>

    <rect x="20" y="46" width="160" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="100" y="66" font-size="12.5" font-weight="700" fill="#263e5a">Debian ships a fix</text>
    <text x="100" y="83" font-size="11.5" fill="#263e5a">security update</text>
    <rect x="236" y="46" width="160" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="316" y="66" font-size="12.5" font-weight="700" fill="#263e5a">Base image updated</text>
    <text x="316" y="83" font-size="11.5" fill="#263e5a">new digest, same tag</text>
    <rect x="452" y="46" width="160" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="532" y="66" font-size="12.5" font-weight="700" fill="#66400f">Your image rebuilt</text>
    <text x="532" y="83" font-size="11.5" fill="#66400f">with the new base</text>
    <rect x="668" y="46" width="172" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="754" y="66" font-size="12.5" font-weight="700" fill="#294a2e">Production patched</text>
    <text x="754" y="83" font-size="11.5" fill="#294a2e">after the deploy</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M180 69H234" marker-end="url(#bew-arrow)"/>
      <path d="M396 69H450" marker-end="url(#bew-arrow)"/>
      <path d="M612 69H666" marker-end="url(#bew-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="208" y="110">at least monthly,</text>
      <text x="208" y="124">sooner if critical</text>
      <text x="424" y="110">your rebuild</text>
      <text x="424" y="124">cadence (below)</text>
      <text x="640" y="110">the normal</text>
      <text x="640" y="124">deploy pipeline</text>
    </g>

    <path d="M24 140H836" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="24" y="166" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Worst-case extra wait in your pipeline once the base image is updated</text>
    <rect x="640" y="156" width="12" height="12" rx="2" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="658" y="166" font-size="11.5" fill="#36424e" text-anchor="start">waiting</text>
    <rect x="730" y="156" width="12" height="12" rx="2" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="748" y="166" font-size="11.5" fill="#36424e" text-anchor="start">deploy</text>

    <g font-size="11" fill="#40566b">
      <text x="230" y="186">day 0</text>
      <text x="370" y="186">7</text>
      <text x="510" y="186">14</text>
      <text x="650" y="186">21</text>
      <text x="830" y="186">30</text>
    </g>
    <g fill="none" stroke="#c9d1db" stroke-width="1" stroke-dasharray="3 3">
      <path d="M230 192V378"/>
      <path d="M370 192V378"/>
      <path d="M510 192V378"/>
      <path d="M650 192V378"/>
      <path d="M830 192V378"/>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="213">Daily rebuild</text>
      <text x="24" y="251">Weekly rebuild</text>
      <text x="24" y="289">Digest PR, weekly bot</text>
      <text x="24" y="327">Monthly rebuild</text>
      <text x="24" y="365">Never rebuilt</text>
    </g>

    <g stroke-width="1.5">
      <rect x="230" y="198" width="20" height="22" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="250" y="198" width="20" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="236" width="140" height="22" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="370" y="236" width="20" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="274" width="140" height="22" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="370" y="274" width="40" height="22" rx="3" fill="#f5f7fb" stroke="#8062a8" stroke-dasharray="4 3"/>
      <rect x="410" y="274" width="20" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="312" width="600" height="22" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="830" y="312" width="20" height="22" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="350" width="590" height="22" rx="3" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <path d="M820 361H846" fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round" marker-end="url(#bew-arrow-red)"/>

    <g fill="#f5f7fb">
      <rect x="276" y="203" width="172" height="14"/>
      <rect x="396" y="241" width="178" height="14"/>
      <rect x="436" y="279" width="266" height="14"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="280" y="213">up to 1 day, then deploy</text>
      <text x="400" y="251">up to 7 days, then deploy</text>
      <text x="440" y="289">bot schedule, then review, then deploy</text>
    </g>
    <text x="300" y="289" font-size="11" font-weight="700" fill="#463365">bot run</text>
    <text x="530" y="327" font-size="11.5" font-weight="700" fill="#66400f">up to 30 days, then deploy</text>
    <text x="525" y="365" font-size="11.5" font-weight="700" fill="#6e2a24">until the next code change: weeks to months</text>

    <text x="430" y="406" font-size="13" fill="#40566b">A rebuilt image that is never deployed protects nothing: measure the age of what runs.</text>
  </g>
</svg>
