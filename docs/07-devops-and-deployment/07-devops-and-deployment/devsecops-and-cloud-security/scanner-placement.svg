      <rect x="281" y="111" width="100" height="26" rx="13"/>
      <rect x="393" y="111" width="100" height="26" rx="13"/>
      <rect x="281" y="153" width="100" height="26" rx="13"/>
      <rect x="281" y="195" width="100" height="26" rx="13"/>
      <rect x="393" y="195" width="100" height="26" rx="13"/>
      <rect x="281" y="237" width="100" height="26" rx="13"/>
