<svg xmlns="http://www.w3.org/2000/svg" width="860" height="432" viewBox="0 0 860 432" role="img" aria-labelledby="spl-title spl-desc">
  <title id="spl-title">Where each security scanner runs and whether it blocks</title>
  <desc id="spl-desc">A matrix with six stages as columns: laptop (seconds), push and pull request (minutes), main build (minutes), registry (daily rescans), staging (after deploy), and production (continuous). Rows are scanner types. Secrets: a pre-commit hook blocks on the laptop, push protection blocks at push, an image-layer scan blocks the main build, and production gets leak alerts as monitoring. SAST: an IDE plugin reports on the laptop, new alerts block the pull request, and a full scan on main reports. SCA: npm audit reports on the laptop, new vulnerabilities block the pull request, fixable high findings block the main build, and new CVEs are monitored in production. IaC: new findings block the pull request, a plan scan blocks the main build, and drift and posture checks are monitored in production. Image scan: fixable high findings block the main build, the registry rescans daily, and live images are monitored. DAST: an API scan blocks on staging and production gets passive monitoring only. Green pills block the merge or release; purple pills report and open a ticket; a dash means not used at that stage.</desc>
