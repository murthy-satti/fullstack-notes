    <rect x="24" y="366" width="60" height="24" rx="12" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="54" y="382" font-size="11" fill="#294a2e">block</text>
    <text x="92" y="382" font-size="11.5" fill="#36424e" text-anchor="start">stops the merge or release</text>
    <rect x="320" y="366" width="72" height="24" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="356" y="382" font-size="11" fill="#463365">monitor</text>
    <text x="400" y="382" font-size="11.5" fill="#36424e" text-anchor="start">reports and opens a ticket</text>
    <path d="M640 378H650" stroke="#8a96a3" stroke-width="2" stroke-linecap="round"/>
    <text x="660" y="382" font-size="11.5" fill="#36424e" text-anchor="start">not used at this stage</text>

    <text x="430" y="418" font-size="13" fill="#40566b">Block where fixes are cheap; keep scanning later, because new CVEs appear in unchanged code.</text>
  </g>
</svg>
