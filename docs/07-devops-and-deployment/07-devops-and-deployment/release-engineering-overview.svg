<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="reo-title reo-desc">
  <title id="reo-title">One product with many versions in flight</title>
  <desc id="reo-desc">A snapshot of TaskFlow on one afternoon, layer by layer. Web app: new tabs run build 873 while a tab opened yesterday still runs build 861, so old hashed assets are kept for days and open tabs are prompted to reload. Installed apps: desktop 1.9.1, 1.8.4 and 1.6.2, iOS 3.2.0 build 412 and 3.0.1 build 377, and Android 3.1.0 version code 30100 are all in use, so the API serves every supported version and asks clients below the 1.6.0 floor to update. API contract: /v2 is current and /v1 is deprecated with a Sunset date of 2027-06-30; one codebase transforms v2 responses into the v1 shape until the sunset. API servers: a rolling deploy has 4 of 10 pods on 2.4.1 and 6 of 10 on 2.4.0, and one load balancer sends each request to either version. Events: producers publish task.assigned v2 and v1 until every consumer reads v2. Database: migration 0042 has expanded the schema so the old and new columns both exist and both API versions work during the rollout. Green marks the newest version in a layer, grey an older version that is still supported, and red a deprecated version with an announced end date. Each release changes one layer at a time, and every version still in use must keep working with its neighbours.</desc>
  <rect width="880" height="510" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b">TaskFlow on one afternoon: every layer runs more than one version</text>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="24" y="52">Layer</text>
      <text x="184" y="52">Versions in use right now</text>
      <text x="624" y="52">What keeps them compatible</text>
    </g>

    <g stroke="#c9d1db" stroke-width="1.5">
      <path d="M16 58H864"/>
      <path d="M16 117H864"/>
      <path d="M16 211H864"/>
      <path d="M16 271H864"/>
      <path d="M16 331H864"/>
      <path d="M16 391H864"/>
      <path d="M16 451H864"/>
      <path d="M610 58V451"/>
    </g>

    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="24" y="84">Web app</text>
      <text x="24" y="158">Installed apps</text>
      <text x="24" y="238">API contract</text>
      <text x="24" y="298">API servers</text>
      <text x="24" y="358">Events</text>
      <text x="24" y="418">Database</text>
    </g>
    <g font-size="11" fill="#60788d">
      <text x="24" y="100">TaskFlow Web in tabs</text>
      <text x="24" y="174">desktop and mobile</text>
      <text x="24" y="254">what clients call</text>
      <text x="24" y="314">TaskFlow API pods</text>
      <text x="24" y="374">on the message bus</text>
      <text x="24" y="434">schema migrations</text>
    </g>

    <g font-size="11" text-anchor="middle">
      <rect x="184" y="74" width="150" height="26" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="259" y="91" fill="#294a2e">build 873 (new tabs)</text>
      <rect x="344" y="74" width="254" height="26" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="471" y="91" fill="#36424e">build 861 (tab open since yesterday)</text>

      <rect x="184" y="132" width="104" height="26" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="236" y="149" fill="#294a2e">desktop 1.9.1</text>
      <rect x="296" y="132" width="104" height="26" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="348" y="149" fill="#36424e">desktop 1.8.4</text>
      <rect x="408" y="132" width="104" height="26" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="460" y="149" fill="#36424e">desktop 1.6.2</text>
      <rect x="184" y="168" width="120" height="26" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="244" y="185" fill="#294a2e">iOS 3.2.0 (412)</text>
      <rect x="312" y="168" width="120" height="26" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="372" y="185" fill="#36424e">iOS 3.0.1 (377)</text>
      <rect x="440" y="168" width="158" height="26" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="519" y="185" fill="#36424e">Android 3.1.0 (30100)</text>

      <rect x="184" y="228" width="110" height="26" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="239" y="245" fill="#294a2e">/v2 (current)</text>
      <rect x="304" y="228" width="254" height="26" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
      <text x="431" y="245" fill="#6e2a24">/v1 (deprecated, Sunset 2027-06-30)</text>

      <rect x="184" y="288" width="150" height="26" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="259" y="305" fill="#294a2e">2.4.1: 4 of 10 pods</text>
      <rect x="344" y="288" width="214" height="26" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="451" y="305" fill="#36424e">2.4.0: 6 of 10 pods, draining</text>

      <rect x="184" y="348" width="130" height="26" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="249" y="365" fill="#294a2e">task.assigned v2</text>
      <rect x="324" y="348" width="240" height="26" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="444" y="365" fill="#36424e">task.assigned v1 (still consumed)</text>

      <rect x="184" y="408" width="320" height="26" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="344" y="425" fill="#294a2e">migration 0042: old and new column both exist</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="624" y="84">keep old hashed assets for days;</text>
      <text x="624" y="100">prompt open tabs to reload</text>
      <text x="624" y="158">API serves every supported version;</text>
      <text x="624" y="174">below the 1.6.0 floor: ask to update</text>
      <text x="624" y="238">one codebase transforms v2</text>
      <text x="624" y="254">responses to v1 until the sunset</text>
      <text x="624" y="298">rolling deploy: the load balancer</text>
      <text x="624" y="314">sends each request to either one</text>
      <text x="624" y="358">producers publish both until</text>
      <text x="624" y="374">every consumer reads v2</text>
      <text x="624" y="418">expanded schema works with</text>
      <text x="624" y="434">API 2.4.0 and 2.4.1 at once</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <rect x="24" y="465" width="14" height="14" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="46" y="476">newest</text>
      <rect x="120" y="465" width="14" height="14" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="142" y="476">older, still supported</text>
      <rect x="300" y="465" width="14" height="14" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
      <text x="322" y="476">deprecated, end date announced</text>
    </g>

    <text x="440" y="500" font-size="13" fill="#40566b" text-anchor="middle">A release changes one layer at a time; every version still in use must work with its neighbours.</text>
  </g>
</svg>
