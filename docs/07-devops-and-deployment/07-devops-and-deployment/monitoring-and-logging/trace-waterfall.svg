<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="twf-title twf-desc">
  <title id="twf-title">Waterfall view of one TaskFlow trace</title>
  <desc id="twf-desc">A trace for POST /tasks lasting 412 ms, drawn as a waterfall on a 0 to 500 ms axis. The root server span in taskflow-api runs from 0 to 412 ms. Its child, the authenticate middleware, runs from 2 to 40 ms and contains a client span GET from 6 to 38 ms, whose child is the auth-service server span GET /introspect from 9 to 35 ms. The next child, a MongoDB find on the tasks collection, runs from 44 to 352 ms, 308 ms or 75 percent of the request, and is highlighted as the hot spot. Then insertOne on tasks takes 16 ms and publish task.created takes 12 ms. The response is sent at 412 ms. Later, from 430 to 505 ms, the worker's process task.created span runs as a consumer of the published message, connected to the publish span by a dashed link.</desc>
  <defs>
    <marker id="twf-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Trace 4bf92f35...: POST /tasks, 412 ms, 8 spans</text>

    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="300" y="50">0 ms</text>
      <text x="403" y="50">100</text>
      <text x="506" y="50">200</text>
      <text x="609" y="50">300</text>
      <text x="712" y="50">400</text>
      <text x="815" y="50">500</text>
    </g>
    <g fill="none" stroke="#c9d1db" stroke-width="1">
      <path d="M300 56V330"/>
      <path d="M403 56V330"/>
      <path d="M506 56V330"/>
      <path d="M609 56V330"/>
      <path d="M712 56V330"/>
      <path d="M815 56V330"/>
    </g>

    <g font-size="11" font-weight="700" fill="#36424e">
      <text x="24" y="83">taskflow-api</text>
      <text x="24" y="117">taskflow-api</text>
      <text x="24" y="151">taskflow-api</text>
      <text x="24" y="185">auth-service</text>
      <text x="24" y="219">taskflow-api</text>
      <text x="24" y="253">taskflow-api</text>
      <text x="24" y="287">taskflow-api</text>
      <text x="24" y="321">worker</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="120" y="83">POST /tasks</text>
      <text x="132" y="117">authenticate</text>
      <text x="144" y="151">GET (client)</text>
      <text x="156" y="185">GET /introspect</text>
      <text x="132" y="219">find tasks</text>
      <text x="132" y="253">insertOne tasks</text>
      <text x="132" y="287">publish task.created</text>
      <text x="144" y="321">process task.created</text>
    </g>

    <g stroke-width="1.5">
      <rect x="300" y="66" width="424.7" height="24" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="302.1" y="100" width="39.2" height="24" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="306.2" y="134" width="33" height="24" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="309.3" y="168" width="26.8" height="24" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="345.4" y="202" width="317.5" height="24" rx="4" fill="#e5efff" stroke="#b5524b" stroke-width="2.5"/>
      <rect x="667" y="236" width="16.5" height="24" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="687.6" y="270" width="12.4" height="24" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="743.2" y="304" width="77.3" height="24" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="310" y="82">412 ms</text>
      <text x="347" y="116">38 ms</text>
      <text x="345" y="150">32 ms</text>
      <text x="342" y="184">26 ms</text>
      <text x="662" y="252" text-anchor="end">16 ms</text>
      <text x="683" y="286" text-anchor="end">12 ms</text>
      <text x="782" y="320" text-anchor="middle">75 ms</text>
    </g>
    <text x="504" y="218" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="middle">308 ms: 75% of the request</text>

    <path d="M724.7 60V334" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="724.7" y="348" font-size="11" font-weight="700" fill="#294a2e" text-anchor="middle">response sent at 412 ms</text>
    <path d="M700 290C716 296 728 304 741 312" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#twf-arrow-ret)"/>

    <g stroke-width="1.5">
      <rect x="24" y="370" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="164" y="370" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="322" y="370" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="500" y="370" width="14" height="14" rx="3" fill="#e5efff" stroke="#b5524b" stroke-width="2.5"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="44" y="382">service code</text>
      <text x="184" y="382">database calls</text>
      <text x="342" y="382">queue (async)</text>
      <text x="520" y="382">where the time went</text>
    </g>

    <text x="430" y="422" font-size="13" fill="#40566b" text-anchor="middle">Read a waterfall for the longest bar on the critical path: here one unindexed find.</text>
  </g>
</svg>
