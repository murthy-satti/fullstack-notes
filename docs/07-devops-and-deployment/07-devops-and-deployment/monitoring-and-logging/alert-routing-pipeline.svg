<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="arp-title arp-desc">
  <title id="arp-title">From a firing alert rule to a paged engineer</title>
  <desc id="arp-desc">Prometheus evaluates alert rules and sends firing alerts, with labels such as severity and service, to an Alertmanager cluster. Alertmanager processes them in five stages: it deduplicates identical alerts from redundant Prometheus servers, groups alerts by alertname and service, inhibits lower-severity alerts such as tickets while a related page is firing, applies silences that an engineer added for planned maintenance, and routes by the severity label. Alerts labelled severity=ticket go to a ticket queue for the next business day, unmatched alerts go to the team chat channel, and severity=page alerts go to the pager service. The default timings are group_wait 30 seconds, group_interval 5 minutes, and repeat_interval 4 hours. The pager notifies the primary on-call, who should acknowledge within 5 minutes; with no acknowledgement the secondary on-call is paged after 5 minutes, and the engineering manager after 15 minutes.</desc>
  <defs>
    <marker id="arp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="86" width="150" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="99" y="110" font-size="14" font-weight="700" fill="#263e5a">Prometheus</text>
    <text x="99" y="130" font-size="11.5" fill="#263e5a">evaluates rules</text>
    <text x="99" y="147" font-size="11.5" fill="#263e5a">sends firing alerts</text>
    <text x="99" y="164" font-size="11" fill="#263e5a">severity, service</text>

    <rect x="24" y="214" width="150" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="233" font-size="13" font-weight="700" fill="#66400f">Engineer</text>
    <text x="99" y="250" font-size="11" fill="#66400f">adds a silence</text>

    <rect x="214" y="50" width="300" height="256" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="364" y="72" font-size="14" font-weight="700" fill="#463365">Alertmanager (cluster)</text>
    <g fill="#f5f7fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="234" y="86" width="260" height="34" rx="8"/>
      <rect x="234" y="130" width="260" height="34" rx="8"/>
      <rect x="234" y="174" width="260" height="34" rx="8"/>
      <rect x="234" y="218" width="260" height="34" rx="8"/>
      <rect x="234" y="262" width="260" height="34" rx="8"/>
    </g>
    <g font-size="12" fill="#463365">
      <text x="364" y="107">1. deduplicate identical alerts</text>
      <text x="364" y="151">2. group by alertname, service</text>
      <text x="364" y="195">3. inhibit: pages hide tickets</text>
      <text x="364" y="239">4. silence: planned maintenance</text>
      <text x="364" y="283">5. route by severity label</text>
    </g>
    <text x="364" y="330" font-size="11.5" fill="#36424e">defaults: group_wait 30s, group_interval 5m, repeat_interval 4h</text>

    <rect x="676" y="60" width="180" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="766" y="81" font-size="13" font-weight="700" fill="#263e5a">Team chat channel</text>
    <text x="766" y="99" font-size="11" fill="#263e5a">default route, no page</text>
    <rect x="676" y="150" width="180" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="766" y="171" font-size="13" font-weight="700" fill="#463365">Ticket queue</text>
    <text x="766" y="189" font-size="11" fill="#463365">next business day</text>
    <rect x="676" y="250" width="180" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="766" y="273" font-size="13" font-weight="700" fill="#6e2a24">Pager service</text>
    <text x="766" y="292" font-size="11" fill="#6e2a24">phone call and push</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="676" y="372" width="180" height="52" rx="8"/>
      <rect x="430" y="372" width="180" height="52" rx="8"/>
      <rect x="184" y="372" width="180" height="52" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="766" y="394">Primary on-call</text>
      <text x="520" y="394">Secondary on-call</text>
      <text x="274" y="394">Engineering manager</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="766" y="412">acknowledge within 5 min</text>
      <text x="520" y="412">paged after 5 min</text>
      <text x="274" y="412">paged after 15 min</text>
    </g>
    <text x="24" y="402" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Escalation</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 128H212" marker-end="url(#arp-arrow)"/>
      <path d="M174 236H232" marker-end="url(#arp-arrow)"/>
      <path d="M494 279H674" marker-end="url(#arp-arrow)"/>
      <path d="M494 276 674 180" marker-end="url(#arp-arrow)"/>
      <path d="M494 273 674 90" marker-end="url(#arp-arrow)"/>
      <path d="M766 306V370" marker-end="url(#arp-arrow)"/>
      <path d="M676 398H612" marker-end="url(#arp-arrow)"/>
      <path d="M430 398H366" marker-end="url(#arp-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <rect x="548" y="264" width="98" height="14" fill="#f5f7fb" stroke="none"/>
      <text x="597" y="275">severity=page</text>
      <rect x="560" y="201" width="104" height="14" fill="#f5f7fb" stroke="none"/>
      <text x="612" y="212">severity=ticket</text>
      <rect x="574" y="128" width="54" height="14" fill="#f5f7fb" stroke="none"/>
      <text x="601" y="139">default</text>
      <text x="644" y="390">no ack</text>
      <text x="398" y="390">no ack</text>
    </g>

    <text x="440" y="456" font-size="13" fill="#40566b">Alertmanager turns many raw alerts into a few routed notifications; escalation makes sure someone answers.</text>
  </g>
</svg>
