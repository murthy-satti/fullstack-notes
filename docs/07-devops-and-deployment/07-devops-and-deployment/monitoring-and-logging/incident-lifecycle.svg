<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="ilc-title ilc-desc">
  <title id="ilc-title">The incident lifecycle and an example timeline</title>
  <desc id="ilc-desc">Top: five phases in order. Detect: an alert, a probe, or a customer report. Triage: declare the incident, set severity, and assign roles. Mitigate: stop the user impact, for example by rolling back or failing over. Resolve: fix the underlying cause, verify, and close. Learn: write a postmortem with action items. A dashed arrow loops from Learn back to Detect because action items improve detection, response, and prevention. Bottom: an example TaskFlow SEV2 timeline in UTC, not to scale. At 14:02 release 1.42.0 is deployed; at 14:05 an alert fires; at 14:08 it is acknowledged; at 14:12 a SEV2 is declared; at 14:29 dropping a faulty index mitigates the impact; at 15:40 the fix is shipped and the incident is resolved; two days later the postmortem is reviewed. Detection took 3 minutes, response and mitigation 24 minutes, and users were affected for 27 minutes.</desc>
  <defs>
    <marker id="ilc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ilc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Incident lifecycle</text>

    <rect x="24" y="44" width="152" height="68" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="194" y="44" width="152" height="68" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="364" y="44" width="152" height="68" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="534" y="44" width="152" height="68" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="704" y="44" width="152" height="68" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="100" y="69" fill="#463365">Detect</text>
      <text x="270" y="69" fill="#66400f">Triage</text>
      <text x="440" y="69" fill="#6e2a24">Mitigate</text>
      <text x="610" y="69" fill="#294a2e">Resolve</text>
      <text x="780" y="69" fill="#263e5a">Learn</text>
    </g>
    <g font-size="11.5">
      <text x="100" y="88" fill="#463365">alert, probe, or</text>
      <text x="100" y="104" fill="#463365">customer report</text>
      <text x="270" y="88" fill="#66400f">declare + severity</text>
      <text x="270" y="104" fill="#66400f">assign roles</text>
      <text x="440" y="88" fill="#6e2a24">stop user impact:</text>
      <text x="440" y="104" fill="#6e2a24">roll back, fail over</text>
      <text x="610" y="88" fill="#294a2e">fix the cause,</text>
      <text x="610" y="104" fill="#294a2e">verify, close</text>
      <text x="780" y="88" fill="#263e5a">postmortem,</text>
      <text x="780" y="104" fill="#263e5a">action items</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M176 78H192" marker-end="url(#ilc-arrow)"/>
      <path d="M346 78H362" marker-end="url(#ilc-arrow)"/>
      <path d="M516 78H532" marker-end="url(#ilc-arrow)"/>
      <path d="M686 78H702" marker-end="url(#ilc-arrow)"/>
    </g>
    <path d="M780 112V142H100V116" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ilc-arrow-ret)"/>
    <rect x="248" y="135" width="384" height="14" fill="#f5f7fb"/>
    <text x="440" y="146" font-size="11" font-style="italic" fill="#40566b">action items improve detection, response, and prevention</text>

    <text x="24" y="196" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Example: TaskFlow SEV2 after a bad deploy (UTC, not to scale)</text>

    <rect x="80" y="210" width="110" height="18" rx="4" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="135" y="223" font-size="11" fill="#463365">detect: 3 min</text>
    <rect x="190" y="210" width="330" height="18" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="355" y="223" font-size="11" fill="#66400f">respond and mitigate: 24 min</text>
    <rect x="80" y="234" width="440" height="18" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="300" y="247" font-size="11" font-weight="700" fill="#6e2a24">users affected: 27 min</text>

    <path d="M60 268H840" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="2">
      <path d="M80 262V274"/>
      <path d="M190 262V274"/>
      <path d="M290 262V274"/>
      <path d="M390 262V274"/>
      <path d="M520 262V274"/>
      <path d="M680 262V274"/>
      <path d="M800 262V274"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="80" y="292">14:02</text>
      <text x="290" y="292">14:08</text>
      <text x="520" y="292">14:29</text>
      <text x="800" y="292">+2 days</text>
      <text x="190" y="328">14:05</text>
      <text x="390" y="328">14:12</text>
      <text x="680" y="328">15:40</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="80" y="307">deploy 1.42.0</text>
      <text x="290" y="307">acknowledged</text>
      <text x="520" y="307">index dropped: mitigated</text>
      <text x="800" y="307">postmortem review</text>
      <text x="190" y="343">alert fires</text>
      <text x="390" y="343">SEV2 declared</text>
      <text x="680" y="343">fix shipped: resolved</text>
    </g>

    <text x="440" y="382" font-size="13" fill="#40566b">Mitigate first, resolve second, learn always; every phase has a clock worth measuring.</text>
  </g>
</svg>
