<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="cid-title cid-desc">
  <title id="cid-title">A request ID and trace ID flowing across services and a queue</title>
  <desc id="cid-desc">The browser sends POST /tasks to the ingress. The ingress adds an X-Request-Id header with value 7f3a and a traceparent header carrying trace ID 4bf9, writes an access log line with reqId 7f3a, and forwards the request to TaskFlow API. The API logs reqId 7f3a and trace_id 4bf9, then calls the notifications service with POST /reminders, passing the same headers; the notifications service logs the same two IDs. The API publishes a job to the queue with the IDs in the message headers, then returns 201 with X-Request-Id 7f3a to the browser. Later the worker consumes the job and logs the same IDs. One log store query for trace_id 4bf9 returns the lines from the ingress, the API, the notifications service, and the worker.</desc>
  <defs>
    <marker id="cid-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cid-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="25" y="20" width="130" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="90" y="47" font-size="14" font-weight="700" fill="#66400f">Browser</text>
    <rect x="195" y="20" width="130" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="260" y="47" font-size="14" font-weight="700" fill="#263e5a">Ingress</text>
    <rect x="365" y="20" width="130" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="47" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <rect x="535" y="20" width="130" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="600" y="47" font-size="14" font-weight="700" fill="#66400f">Notifications</text>
    <rect x="705" y="20" width="130" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="770" y="39" font-size="14" font-weight="700" fill="#463365">Queue worker</text>
    <text x="770" y="55" font-size="11.5" fill="#463365">async job</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M90 64V396"/>
      <path d="M260 64V396"/>
      <path d="M430 64V396"/>
      <path d="M600 64V396"/>
      <path d="M770 64V396"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M90 104H258" marker-end="url(#cid-arrow)"/>
      <path d="M260 154H428" marker-end="url(#cid-arrow)"/>
      <path d="M430 236H598" marker-end="url(#cid-arrow)"/>
      <path d="M430 306H768" marker-end="url(#cid-arrow)"/>
    </g>
    <path d="M430 340H92" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#cid-arrow-ret)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="175" y="96">1. POST /tasks</text>
      <text x="345" y="130">2. adds X-Request-Id</text>
      <text x="345" y="146">and traceparent</text>
      <text x="515" y="228">3. POST /reminders</text>
      <text x="515" y="254">same two headers</text>
    </g>
    <rect x="492" y="287" width="216" height="14" fill="#f5f7fb"/>
    <text x="600" y="298" font-size="11.5" fill="#36424e">4. publish job, IDs in headers</text>
    <rect x="164" y="321" width="192" height="14" fill="#f5f7fb"/>
    <text x="260" y="332" font-size="11.5" fill="#36424e">5. 201, X-Request-Id: 7f3a</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="138" y="170" width="114" height="40" rx="8"/>
      <rect x="440" y="170" width="114" height="40" rx="8"/>
      <rect x="610" y="248" width="114" height="40" rx="8"/>
      <rect x="648" y="356" width="114" height="40" rx="8"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="195" y="186">reqId=7f3a</text>
      <text x="195" y="202">trace_id=4bf9</text>
      <text x="497" y="186">reqId=7f3a</text>
      <text x="497" y="202">trace_id=4bf9</text>
      <text x="667" y="264">reqId=7f3a</text>
      <text x="667" y="280">trace_id=4bf9</text>
      <text x="705" y="372">reqId=7f3a</text>
      <text x="705" y="388">trace_id=4bf9</text>
    </g>
    <text x="640" y="350" font-size="11" font-style="italic" fill="#463365" text-anchor="end">later: worker logs</text>

    <rect x="24" y="414" width="832" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="442" font-size="13" fill="#263e5a"><tspan font-weight="700">Log store:</tspan> trace_id="4bf9" returns lines from ingress, API, notifications, and worker</text>

    <text x="440" y="486" font-size="13" fill="#40566b">Generate the IDs once at the edge, pass them on every hop, and log them on every line.</text>
  </g>
</svg>
