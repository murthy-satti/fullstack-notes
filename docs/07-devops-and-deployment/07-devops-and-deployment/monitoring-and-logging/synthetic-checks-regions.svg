<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="scr-title scr-desc">
  <title id="scr-title">Synthetic checks from four regions with a quorum rule</title>
  <desc id="scr-desc">Probes in four regions test the public endpoint api.example.com through DNS, TLS, the CDN, and the load balancer. us-east gets 200 OK in 182 ms, us-west 200 OK in 240 ms, eu-west times out after 5 seconds, and ap-south gets 200 OK in 310 ms. Two kinds of check run: an HTTP check every 60 seconds that sends GET /healthz and expects status 200, the expected body, and a certificate valid for more than 14 days; and a browser check every 5 minutes that logs in, creates a task, and confirms it appears in the list. A quorum rule raises an alert only when two or more regions fail two consecutive runs. Right now one of four regions is failing, so the result is recorded and retried without paging, because it is most likely a local network problem.</desc>
  <defs>
    <marker id="scr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Probes outside your infrastructure, in the regions your users are in</text>

    <g stroke-width="2">
      <rect x="24" y="52" width="176" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="236" y="52" width="176" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="448" y="52" width="176" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="660" y="52" width="176" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="112" y="75" fill="#294a2e">Probe: us-east</text>
      <text x="324" y="75" fill="#294a2e">Probe: us-west</text>
      <text x="536" y="75" fill="#6e2a24">Probe: eu-west</text>
      <text x="748" y="75" fill="#294a2e">Probe: ap-south</text>
    </g>
    <g font-size="11.5">
      <text x="112" y="96" fill="#294a2e">200 OK, 182 ms</text>
      <text x="324" y="96" fill="#294a2e">200 OK, 240 ms</text>
      <text x="536" y="96" fill="#6e2a24">timeout after 5 s</text>
      <text x="748" y="96" fill="#294a2e">200 OK, 310 ms</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M112 108V150" marker-end="url(#scr-arrow)"/>
      <path d="M324 108V150" marker-end="url(#scr-arrow)"/>
      <path d="M536 108V150" marker-end="url(#scr-arrow)"/>
      <path d="M748 108V150" marker-end="url(#scr-arrow)"/>
    </g>

    <rect x="24" y="152" width="812" height="104" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="174" font-size="13" font-weight="700" fill="#263e5a">api.example.com, through DNS, TLS, the CDN, and the load balancer</text>
    <g fill="#f5f7fb" stroke="#4774aa" stroke-width="1.5">
      <rect x="40" y="188" width="380" height="54" rx="8"/>
      <rect x="440" y="188" width="380" height="54" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="230" y="210">HTTP check, every 60 s</text>
      <text x="630" y="210">Browser check, every 5 min</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="230" y="228">GET /healthz: 200, body ok, cert valid &gt; 14 days</text>
      <text x="630" y="228">log in, create a task, see it in the list</text>
    </g>

    <rect x="24" y="284" width="392" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="220" y="307" font-size="13" font-weight="700" fill="#463365">Quorum rule</text>
    <text x="220" y="326" font-size="11.5" fill="#463365">alert only when 2+ regions fail 2 runs in a row</text>
    <rect x="456" y="284" width="380" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="646" y="307" font-size="13" font-weight="700" fill="#36424e">Now: 1 of 4 regions failing</text>
    <text x="646" y="326" font-size="11.5" fill="#36424e">record and retry; no page (likely local network)</text>
    <path d="M416 312H454" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#scr-arrow)"/>

    <text x="430" y="378" font-size="13" fill="#40566b">One failing region is usually noise; several failing regions is an outage worth a page.</text>
  </g>
</svg>
