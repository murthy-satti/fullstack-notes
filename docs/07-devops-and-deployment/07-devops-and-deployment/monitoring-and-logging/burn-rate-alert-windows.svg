<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="brw-title brw-desc">
  <title id="brw-title">A multiwindow burn-rate alert during a 20-minute incident</title>
  <desc id="brw-desc">The SLO is 99.9 percent, so the page threshold for a burn rate of 14.4 is an error ratio of 1.44 percent. Over a 90-minute axis, the actual error ratio is 0.05 percent, jumps to 10 percent at minute 10, and returns to 0.05 percent at minute 30 when the fix lands. The 5-minute window average rises to 10 percent by minute 15 and falls back by minute 35. The 1-hour window average rises slowly to about 3.4 percent at minute 30, stays there until minute 70, and falls back by minute 90. The page fires only while both windows are above 1.44 percent, from about minute 18.4 to minute 34.3. With the 1-hour window alone, the alert would keep paging until about minute 81.6, 52 minutes after the fix.</desc>
  <rect width="860" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">SLO 99.9%, page when 1 h and 5 min error ratios both exceed 14.4 x 0.1% = 1.44%</text>

    <path d="M162.2 298.9V81.8H326.7V298.9Z" fill="#fbe9e7"/>
    <g fill="none" stroke="#c9d1db" stroke-width="1">
      <path d="M80 81.8H820"/>
      <path d="M80 190H820"/>
    </g>
    <path d="M80 60V300H820" fill="none" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M80 268.6H820" fill="none" stroke="#40566b" stroke-width="1.5" stroke-dasharray="6 4"/>

    <path d="M80 298.9H162.2L203.3 81.8H326.7L367.8 298.9H820" fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M80 298.9H162.2L326.7 226.5H655.6L820 298.9" fill="none" stroke="#4774aa" stroke-width="2.5" stroke-linejoin="round"/>

    <g font-size="11" fill="#40566b" text-anchor="end">
      <text x="72" y="86">10%</text>
      <text x="72" y="194">5%</text>
      <text x="72" y="272">1.44%</text>
      <text x="72" y="304">0%</text>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="80" y="318">0 min</text>
      <text x="203" y="318">15</text>
      <text x="327" y="318">30</text>
      <text x="450" y="318">45</text>
      <text x="573" y="318">60</text>
      <text x="697" y="318">75</text>
      <text x="820" y="318">90</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="214" y="100">errors at 10%</text>
      <text x="380" y="140">fix lands at minute 30</text>
      <text x="440" y="218">1 h window: about 3.4%</text>
      <text x="560" y="262">page threshold 1.44%</text>
    </g>

    <rect x="231.3" y="334" width="130.6" height="18" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="372" y="347" font-size="11.5" font-weight="700" fill="#6e2a24">page fires while both windows are high: minute 18.4 to 34.3</text>
    <rect x="231.3" y="362" width="519.5" height="18" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="240" y="375" font-size="11.5" fill="#36424e">1 h window alone: pages until minute 81.6, 52 min after the fix</text>

    <rect x="560" y="44" width="14" height="12" fill="#fbe9e7"/>
    <path d="M688 50H708" stroke="#bd7a20" stroke-width="2.5"/>
    <path d="M760 50H780" stroke="#4774aa" stroke-width="2.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="580" y="54">actual</text>
      <text x="714" y="54">5 min</text>
      <text x="786" y="54">1 h</text>
    </g>

    <text x="430" y="420" font-size="13" fill="#40566b" text-anchor="middle">The long window proves the burn is significant; the short window lets the page resolve fast.</text>
  </g>
</svg>
