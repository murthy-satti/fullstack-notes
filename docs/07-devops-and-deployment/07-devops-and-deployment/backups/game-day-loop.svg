<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="gdl-title gdl-desc">
  <title id="gdl-title">The game day and DR drill loop</title>
  <desc id="gdl-desc">A cycle of five steps. Plan: choose a scenario, such as losing the primary region or restoring the database to a point in time, state a hypothesis and success criteria such as an RTO under 1 hour, and limit the blast radius with an abort plan. Prepare: assign roles including an incident commander and observers, notify stakeholders, and check access and tools. Execute: inject the failure or start the restore, follow the runbook exactly, and timestamp every step. Observe: measure the actual RTO and RPO and note every gap, workaround, and surprise. Learn: hold a blameless review, create action items, update the runbook and DR plan, and schedule the next drill, which leads back to Plan.</desc>
  <defs>
    <marker id="gdl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="330" y="24" width="200" height="84" rx="10" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="48" font-size="14" font-weight="700" fill="#263e5a">1. Plan</text>
    <text x="430" y="67" font-size="11" fill="#263e5a">scenario, hypothesis,</text>
    <text x="430" y="82" font-size="11" fill="#263e5a">success criteria (RTO),</text>
    <text x="430" y="97" font-size="11" fill="#263e5a">blast radius, abort plan</text>

    <rect x="610" y="128" width="200" height="84" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="710" y="152" font-size="14" font-weight="700" fill="#463365">2. Prepare</text>
    <text x="710" y="171" font-size="11" fill="#463365">roles: IC, operators,</text>
    <text x="710" y="186" font-size="11" fill="#463365">observers; notify people;</text>
    <text x="710" y="201" font-size="11" fill="#463365">check access and tools</text>

    <rect x="530" y="290" width="200" height="84" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="630" y="314" font-size="14" font-weight="700" fill="#66400f">3. Execute</text>
    <text x="630" y="333" font-size="11" fill="#66400f">inject failure or restore,</text>
    <text x="630" y="348" font-size="11" fill="#66400f">follow the runbook exactly,</text>
    <text x="630" y="363" font-size="11" fill="#66400f">timestamp every step</text>

    <rect x="130" y="290" width="200" height="84" rx="10" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="230" y="314" font-size="14" font-weight="700" fill="#294a2e">4. Observe</text>
    <text x="230" y="333" font-size="11" fill="#294a2e">measure actual RTO, RPO;</text>
    <text x="230" y="348" font-size="11" fill="#294a2e">note gaps, workarounds,</text>
    <text x="230" y="363" font-size="11" fill="#294a2e">and surprises</text>

    <rect x="50" y="128" width="200" height="84" rx="10" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="150" y="152" font-size="14" font-weight="700" fill="#6e2a24">5. Learn</text>
    <text x="150" y="171" font-size="11" fill="#6e2a24">blameless review,</text>
    <text x="150" y="186" font-size="11" fill="#6e2a24">action items, update</text>
    <text x="150" y="201" font-size="11" fill="#6e2a24">runbook and DR plan</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M530 80 650 126" marker-end="url(#gdl-arrow)"/>
      <path d="M700 212 660 288" marker-end="url(#gdl-arrow)"/>
      <path d="M530 332H332" marker-end="url(#gdl-arrow)"/>
      <path d="M200 290 160 214" marker-end="url(#gdl-arrow)"/>
      <path d="M210 128 328 80" marker-end="url(#gdl-arrow)"/>
    </g>
    <text x="430" y="198" font-size="13" font-weight="700" fill="#40566b">Drill on a schedule:</text>
    <text x="430" y="216" font-size="12" fill="#40566b">tabletop quarterly, restore monthly,</text>
    <text x="430" y="233" font-size="12" fill="#40566b">regional failover yearly</text>
    <text x="252" y="88" font-size="11" font-style="italic" fill="#40566b">next drill</text>

    <text x="430" y="416" font-size="13" fill="#40566b">Each drill turns an assumed RTO into a measured one and leaves the runbook better.</text>
  </g>
</svg>
