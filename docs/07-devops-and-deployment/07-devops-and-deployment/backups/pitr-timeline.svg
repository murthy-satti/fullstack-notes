<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="pit-title pit-desc">
  <title id="pit-title">Point-in-time recovery: base backup plus log replay</title>
  <desc id="pit-desc">A timeline from Sunday 02:00 to Tuesday 16:00. A base backup of TaskFlow's database is taken on Sunday at 02:00. After that, the database's change log, the MongoDB oplog or the PostgreSQL write-ahead log, is archived continuously in small segments every few minutes. On Tuesday at 14:31 a bad migration deletes data. To recover, the base backup is restored and the archived log is replayed up to Tuesday 14:30:59, just before the mistake, producing a database as it was at that second. Log entries after 14:31 are not replayed; any good changes made after the mistake must be reapplied from application records or are lost. The recovery point can be any moment covered by an unbroken log since the base backup.</desc>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <path d="M60 300H840" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M80 294V306"/>
      <path d="M328 294V306"/>
      <path d="M576 294V306"/>
      <path d="M820 294V306"/>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="80" y="322">Sun 02:00</text>
      <text x="328" y="322">Mon 02:00</text>
      <text x="576" y="322">Tue 02:00</text>
      <text x="820" y="322">Tue 16:00</text>
    </g>

    <text x="24" y="44" font-size="13" font-weight="700" fill="#263e5a">Backups taken</text>
    <rect x="60" y="56" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="135" y="77" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">Base backup</text>
    <text x="135" y="94" font-size="11" fill="#263e5a" text-anchor="middle">snapshot, Sun 02:00</text>

    <rect x="80" y="122" width="760" height="22" fill="none" stroke="#8062a8" stroke-width="1.5"/>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1">
      <rect x="80" y="122" width="40" height="22"/>
      <rect x="120" y="122" width="40" height="22"/>
      <rect x="160" y="122" width="40" height="22"/>
      <rect x="200" y="122" width="40" height="22"/>
      <rect x="240" y="122" width="40" height="22"/>
      <rect x="280" y="122" width="40" height="22"/>
      <rect x="320" y="122" width="40" height="22"/>
      <rect x="360" y="122" width="40" height="22"/>
      <rect x="400" y="122" width="40" height="22"/>
      <rect x="440" y="122" width="40" height="22"/>
      <rect x="480" y="122" width="40" height="22"/>
      <rect x="520" y="122" width="40" height="22"/>
      <rect x="560" y="122" width="40" height="22"/>
      <rect x="600" y="122" width="40" height="22"/>
      <rect x="640" y="122" width="40" height="22"/>
      <rect x="680" y="122" width="40" height="22"/>
      <rect x="720" y="122" width="40" height="22"/>
      <rect x="760" y="122" width="40" height="22"/>
      <rect x="800" y="122" width="40" height="22"/>
    </g>
    <text x="230" y="112" font-size="11.5" fill="#463365">continuous log archive: oplog or WAL segments every few minutes</text>

    <path d="M706 60V290" stroke="#b5524b" stroke-width="2.5"/>
    <rect x="600" y="58" width="208" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="704" y="75" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="middle">Tue 14:31 bad migration</text>
    <text x="704" y="91" font-size="11" fill="#6e2a24" text-anchor="middle">deletes a field from tasks</text>

    <text x="24" y="182" font-size="13" font-weight="700" fill="#294a2e">Recovery</text>
    <rect x="80" y="196" width="80" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="120" y="217" font-size="11" font-weight="700" fill="#263e5a" text-anchor="middle">1. restore</text>
    <rect x="160" y="196" width="544" height="34" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="432" y="217" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="middle">2. replay the log up to Tue 14:30:59</text>
    <rect x="708" y="196" width="132" height="34" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="774" y="217" font-size="11" fill="#36424e" text-anchor="middle">not replayed</text>

    <text x="160" y="258" font-size="11.5" fill="#36424e">Result: the database exactly as it was one second before the mistake.</text>
    <text x="160" y="276" font-size="11.5" fill="#36424e">Good writes after 14:31 must be reapplied from other records, or are lost.</text>

    <text x="440" y="360" font-size="13" fill="#40566b" text-anchor="middle">PITR = base backup + an unbroken log since it, replayed to the moment you choose.</text>
  </g>
</svg>
