<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="sso-title sso-desc">
  <title id="sso-title">How a browser comes to trust api.example.com</title>
  <desc id="sso-desc">Top: the browser of a TaskFlow Web user, which has a built-in store of trusted root certificates, connects to api.example.com, served by nginx or a load balancer that holds the private key and certificate chain. Step 1: the browser sends ClientHello with the server name api.example.com and a key share. Step 2: the server answers with ServerHello, its key share, the certificate chain, and a signature proving it holds the private key. Step 3: both sides exchange Finished messages and then send encrypted HTTP. Bottom: in step 2 the browser verifies the chain: the leaf certificate for api.example.com is signed by an intermediate CA, which is signed by a root CA that is self-signed and kept offline; the root is found in the browser's trust store. The browser also checks that the hostname matches a subject alternative name entry, that the current date is within the validity period, and that every signature verifies up to the root.</desc>
  <defs>
    <marker id="sso-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sso-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="sso-arrow-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
    <marker id="sso-arrow-ok-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="170" height="136" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="96" font-size="14" font-weight="700" fill="#66400f">Browser</text>
    <text x="109" y="116" font-size="11.5" fill="#66400f">TaskFlow Web user</text>
    <text x="109" y="133" font-size="11.5" fill="#66400f">built-in trust store</text>

    <rect x="686" y="40" width="170" height="136" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="771" y="96" font-size="14" font-weight="700" fill="#263e5a">api.example.com</text>
    <text x="771" y="116" font-size="11.5" fill="#263e5a">nginx or load balancer</text>
    <text x="771" y="133" font-size="11.5" fill="#263e5a">private key + chain</text>

    <path d="M194 70H684" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#sso-arrow)"/>
    <path d="M686 110H196" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#sso-arrow-ret)"/>
    <path d="M198 150H682" fill="none" stroke="#53845b" stroke-width="2.5" stroke-linecap="round" marker-start="url(#sso-arrow-ok-start)" marker-end="url(#sso-arrow-ok)"/>
    <g font-size="11.5" fill="#36424e">
      <text x="440" y="62">1. ClientHello: SNI api.example.com, key share</text>
      <text x="440" y="102">2. ServerHello, key share, certificate chain, signature</text>
    </g>
    <text x="440" y="142" font-size="11.5" font-weight="700" fill="#294a2e">3. Finished both ways, then encrypted HTTP</text>

    <text x="24" y="210" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">What the browser verifies in step 2</text>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="24" y="230" width="170" height="60" rx="8"/>
      <rect x="264" y="230" width="170" height="60" rx="8"/>
      <rect x="504" y="230" width="170" height="60" rx="8"/>
    </g>
    <rect x="744" y="230" width="112" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="109" y="254" fill="#263e5a">Leaf certificate</text>
      <text x="349" y="254" fill="#263e5a">Intermediate CA</text>
      <text x="589" y="254" fill="#263e5a">Root CA</text>
      <text x="800" y="254" fill="#294a2e">Trust store</text>
    </g>
    <g font-size="11.5">
      <text x="109" y="274" fill="#263e5a">api.example.com</text>
      <text x="349" y="274" fill="#263e5a">issues leaf certs</text>
      <text x="589" y="274" fill="#263e5a">self-signed, offline</text>
      <text x="800" y="274" fill="#294a2e">root found</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M194 260H262" marker-end="url(#sso-arrow)"/>
      <path d="M434 260H502" marker-end="url(#sso-arrow)"/>
      <path d="M674 260H742" marker-end="url(#sso-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="228" y="252">signed by</text>
      <text x="468" y="252">signed by</text>
      <text x="708" y="252">in</text>
    </g>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="24" y="312" width="262" height="32" rx="16"/>
      <rect x="306" y="312" width="262" height="32" rx="16"/>
      <rect x="588" y="312" width="268" height="32" rx="16"/>
    </g>
    <g font-size="11.5" fill="#294a2e">
      <text x="155" y="333">hostname matches a SAN entry</text>
      <text x="437" y="333">current date within validity</text>
      <text x="722" y="333">signatures verify up to the root</text>
    </g>

    <text x="440" y="380" font-size="13" fill="#40566b">Trust is delegated: a trusted root vouches for the intermediate, which vouches for the site.</text>
  </g>
</svg>
