<svg xmlns="http://www.w3.org/2000/svg" width="860" height="376" viewBox="0 0 860 376" role="img" aria-labelledby="slm-title slm-desc">
  <title id="slm-title">A secret leaked into a layer compared with a BuildKit secret mount</title>
  <desc id="slm-desc">Leaks, on the left: the image is built FROM node:24-slim, then COPY .npmrc stores the token in its own layer, RUN npm ci installs node_modules, and RUN rm .npmrc only adds a whiteout that hides the file. Anyone who can pull the image can run docker save, extract the COPY layer, and read the token. Passing the token with ARG NPM_TOKEN leaks too, because the value is recorded in the image history. Safe, on the right: the image is built FROM node:24-slim and RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm ci makes the token available only while that one step runs; it is never written to a layer, and docker history shows the step but not the secret. The secret is supplied with docker build --secret id=npmrc,src=$HOME/.npmrc.</desc>
  <rect width="860" height="376" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Leaks: the token stays in the image</text>
    <text x="448" y="32" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Safe: a BuildKit secret mount</text>
    <path d="M430 20V330" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="46" width="388" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="24" y="86" width="388" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="24" y="126" width="388" height="34" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="24" y="166" width="388" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <g font-size="12" font-weight="700" text-anchor="start">
      <text x="36" y="67" fill="#36424e">RUN rm .npmrc</text>
      <text x="36" y="107" fill="#36424e">RUN npm ci</text>
      <text x="36" y="147" fill="#6e2a24">COPY .npmrc ./</text>
      <text x="36" y="187" fill="#263e5a">FROM node:24-slim</text>
    </g>
    <g font-size="11.5" text-anchor="end">
      <text x="400" y="67" fill="#36424e">whiteout only: hides the file</text>
      <text x="400" y="107" fill="#36424e">node_modules</text>
      <text x="400" y="147" fill="#6e2a24">the token is in this layer</text>
      <text x="400" y="187" fill="#263e5a">base layers</text>
    </g>

    <rect x="24" y="218" width="388" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="218" y="237" font-size="12.5" font-weight="700" fill="#6e2a24">Anyone who can pull the image</text>
    <text x="218" y="255" font-size="11.5" fill="#6e2a24">docker save, untar the COPY layer, read the token</text>
    <rect x="24" y="274" width="388" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="218" y="293" font-size="12.5" font-weight="700" fill="#6e2a24">ARG NPM_TOKEN leaks too</text>
    <text x="218" y="311" font-size="11.5" fill="#6e2a24">the value is recorded in the image history</text>

    <rect x="448" y="46" width="388" height="54" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="460" y="67" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">RUN --mount=type=secret,id=npmrc,</text>
    <text x="484" y="86" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">target=/root/.npmrc npm ci</text>
    <text x="824" y="77" font-size="11.5" fill="#294a2e" text-anchor="end">node_modules</text>
    <rect x="448" y="106" width="388" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="460" y="127" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">FROM node:24-slim</text>
    <text x="824" y="127" font-size="11.5" fill="#263e5a" text-anchor="end">base layers</text>

    <rect x="448" y="158" width="388" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="642" y="177" font-size="12.5" font-weight="700" fill="#294a2e">mounted only while that RUN executes</text>
    <text x="642" y="195" font-size="11.5" fill="#294a2e">never written to any layer</text>
    <rect x="448" y="214" width="388" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="642" y="233" font-size="12.5" font-weight="700" fill="#294a2e">docker history shows the step</text>
    <text x="642" y="251" font-size="11.5" fill="#294a2e">but not the secret's content</text>
    <rect x="448" y="270" width="388" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="642" y="289" font-size="12" font-weight="700" fill="#36424e">docker build --secret</text>
    <text x="642" y="307" font-size="11.5" fill="#36424e">id=npmrc,src=$HOME/.npmrc -t taskflow-api .</text>

    <text x="430" y="358" font-size="13" fill="#40566b">Deleting a secret in a later layer never removes it; keep it out of every layer from the start.</text>
  </g>
</svg>
