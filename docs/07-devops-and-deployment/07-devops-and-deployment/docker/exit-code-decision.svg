<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="ecd-title ecd-desc">
  <title id="ecd-title">What a container's exit code tells you</title>
  <desc id="ecd-desc">Codes above 128 mean the process was killed by a signal, and the code is 128 plus the signal number. 0: success; normal for a job, but a server should not exit, so ask why it stopped. 1: application error; read docker logs for the stack trace, missing configuration, or an unreachable database. 125: the docker run command itself failed, for example a bad flag or a name already in use. 126: the command cannot be executed, because it lacks execute permission or is not a program. 127: command not found; the CMD or ENTRYPOINT path is wrong or the tool is missing from the image. 130: SIGINT, 128 plus 2, from Ctrl+C in an interactive run. 137: SIGKILL, 128 plus 9; if OOMKilled is true the memory limit was hit, otherwise it was docker kill or a stop timeout. 139: SIGSEGV, 128 plus 11; native code crashed, often a native module, libc, or CPU architecture mismatch. 143: SIGTERM, 128 plus 15; stopped by docker stop or a deploy, and the app had no SIGTERM handler that exits cleanly.</desc>
  <rect width="860" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="32">Code</text>
      <text x="108" y="32">Meaning</text>
      <text x="400" y="32">What to check</text>
    </g>
    <rect x="24" y="44" width="812" height="32" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="65" font-size="12" fill="#36424e">Codes above 128 mean the process was killed by a signal: exit code = 128 + signal number.</text>

    <rect x="24" y="88" width="72" height="36" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="24" y="130" width="72" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="24" y="172" width="72" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="24" y="214" width="72" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="24" y="256" width="72" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="24" y="298" width="72" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="24" y="340" width="72" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="24" y="382" width="72" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="24" y="424" width="72" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="15" font-weight="700">
      <text x="60" y="111" fill="#294a2e">0</text>
      <text x="60" y="153" fill="#66400f">1</text>
      <text x="60" y="195" fill="#463365">125</text>
      <text x="60" y="237" fill="#463365">126</text>
      <text x="60" y="279" fill="#463365">127</text>
      <text x="60" y="321" fill="#263e5a">130</text>
      <text x="60" y="363" fill="#6e2a24">137</text>
      <text x="60" y="405" fill="#6e2a24">139</text>
      <text x="60" y="447" fill="#263e5a">143</text>
    </g>

    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="108" y="88" width="280" height="36" rx="8"/>
      <rect x="108" y="130" width="280" height="36" rx="8"/>
      <rect x="108" y="172" width="280" height="36" rx="8"/>
      <rect x="108" y="214" width="280" height="36" rx="8"/>
      <rect x="108" y="256" width="280" height="36" rx="8"/>
      <rect x="108" y="298" width="280" height="36" rx="8"/>
      <rect x="108" y="340" width="280" height="36" rx="8"/>
      <rect x="108" y="382" width="280" height="36" rx="8"/>
      <rect x="108" y="424" width="280" height="36" rx="8"/>
      <rect x="400" y="88" width="436" height="36" rx="8"/>
      <rect x="400" y="130" width="436" height="36" rx="8"/>
      <rect x="400" y="172" width="436" height="36" rx="8"/>
      <rect x="400" y="214" width="436" height="36" rx="8"/>
      <rect x="400" y="256" width="436" height="36" rx="8"/>
      <rect x="400" y="298" width="436" height="36" rx="8"/>
      <rect x="400" y="340" width="436" height="36" rx="8"/>
      <rect x="400" y="382" width="436" height="36" rx="8"/>
      <rect x="400" y="424" width="436" height="36" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="120" y="111">success, process finished</text>
      <text x="120" y="153">application error</text>
      <text x="120" y="195">docker could not run it</text>
      <text x="120" y="237">command not executable</text>
      <text x="120" y="279">command not found</text>
      <text x="120" y="321">SIGINT (128 + 2)</text>
      <text x="120" y="363">SIGKILL (128 + 9)</text>
      <text x="120" y="405">SIGSEGV (128 + 11)</text>
      <text x="120" y="447">SIGTERM (128 + 15)</text>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="412" y="111">normal for a job; a server should not exit, so ask why</text>
      <text x="412" y="153">docker logs: stack trace, missing config, database down</text>
      <text x="412" y="195">the docker run command failed: bad flag, name in use</text>
      <text x="412" y="237">no execute permission, or the path is not a program</text>
      <text x="412" y="279">wrong CMD or ENTRYPOINT path, or tool missing in image</text>
      <text x="412" y="321">Ctrl+C in an interactive docker run</text>
      <text x="412" y="363">OOMKilled: memory limit; else a kill or stop timeout</text>
      <text x="412" y="405">native code crashed: native module, libc, or CPU arch</text>
      <text x="412" y="447">docker stop or a deploy; no handler that exits cleanly</text>
    </g>

    <text x="430" y="496" font-size="13" fill="#40566b">137 is not always out of memory: check OOMKilled before raising limits.</text>
  </g>
</svg>
