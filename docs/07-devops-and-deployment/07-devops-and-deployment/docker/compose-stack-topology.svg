<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="cst-title cst-desc">
  <title id="cst-title">The TaskFlow Compose stack</title>
  <desc id="cst-desc">On your machine, a browser or curl calls localhost:3000, which Compose publishes to the api service; a browser on localhost:8081 reaches the optional mongo-express service, which only starts with the tools profile; the ./src folder on disk is synced into the api container by docker compose watch. Inside the project network taskflow_default, where service names resolve through Docker's DNS, the api service (built from the local Dockerfile, port 3000, waiting for healthy dependencies) connects to redis at redis://redis:6379 and to mongo at mongodb://mongo:27017, and mongo-express also connects to mongo. The mongo service stores its data in the named volume mongo-data mounted at /data/db, which survives docker compose down unless -v is passed.</desc>
  <defs>
    <marker id="cst-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cst-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Your machine</text>

    <rect x="232" y="44" width="604" height="284" rx="10" fill="#e5efff" fill-opacity="0.35" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="244" y="64" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="start">network: taskflow_default</text>
    <text x="244" y="80" font-size="11" fill="#263e5a" text-anchor="start">service names resolve through Docker DNS</text>

    <rect x="24" y="110" width="180" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="114" y="130" font-size="13" font-weight="700" fill="#66400f">browser, curl</text>
    <text x="114" y="147" font-size="11.5" fill="#66400f">localhost:3000</text>
    <rect x="24" y="186" width="180" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="114" y="206" font-size="13" font-weight="700" fill="#66400f">./src on disk</text>
    <text x="114" y="223" font-size="11.5" fill="#66400f">synced by compose watch</text>
    <rect x="24" y="262" width="180" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="114" y="282" font-size="13" font-weight="700" fill="#66400f">browser</text>
    <text x="114" y="299" font-size="11.5" fill="#66400f">localhost:8081</text>

    <rect x="260" y="100" width="170" height="150" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="345" y="124" font-size="14" font-weight="700" fill="#66400f">api</text>
    <g font-size="11.5" fill="#66400f">
      <text x="345" y="146">build: . (Dockerfile)</text>
      <text x="345" y="164">ports 3000:3000</text>
      <text x="345" y="182">watch: sync ./src</text>
      <text x="345" y="200">depends_on: healthy</text>
      <text x="345" y="218">MONGODB_URI, REDIS_URL</text>
    </g>

    <rect x="640" y="100" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="725" y="123" font-size="14" font-weight="700" fill="#463365">redis</text>
    <text x="725" y="142" font-size="11.5" fill="#463365">redis:7-alpine, :6379</text>
    <rect x="640" y="194" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="725" y="217" font-size="14" font-weight="700" fill="#263e5a">mongo</text>
    <text x="725" y="236" font-size="11.5" fill="#263e5a">mongo:8.0, :27017</text>
    <rect x="450" y="262" width="160" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="530" y="281" font-size="13" font-weight="700" fill="#463365">mongo-express</text>
    <text x="530" y="298" font-size="11" fill="#463365">profile: tools</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M204 134H258" marker-end="url(#cst-arrow)"/>
      <path d="M430 128H638" marker-end="url(#cst-arrow)"/>
      <path d="M430 222H638" marker-end="url(#cst-arrow)"/>
      <path d="M204 286H448" marker-end="url(#cst-arrow)"/>
      <path d="M610 284H700V252" marker-end="url(#cst-arrow)"/>
    </g>
    <path d="M204 210H258" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cst-arrow-ret)"/>

    <rect x="473" y="113" width="122" height="14" fill="#f5f7fb"/>
    <text x="534" y="124" font-size="11.5" fill="#36424e">redis://redis:6379</text>
    <rect x="461" y="207" width="146" height="14" fill="#f5f7fb"/>
    <text x="534" y="218" font-size="11.5" fill="#36424e">mongodb://mongo:27017</text>
    <rect x="296" y="279" width="96" height="14" fill="#f5f7fb"/>
    <text x="344" y="290" font-size="11.5" fill="#36424e">publish :8081</text>

    <path d="M810 222H826V364H812" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#cst-arrow-ret)"/>
    <rect x="640" y="342" width="170" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="725" y="361" font-size="12.5" font-weight="700" fill="#263e5a">volume: mongo-data</text>
    <text x="725" y="378" font-size="11" fill="#263e5a">mounted at /data/db</text>
    <text x="628" y="362" font-size="11.5" fill="#36424e" text-anchor="end">kept by docker compose down;</text>
    <text x="628" y="378" font-size="11.5" fill="#36424e" text-anchor="end">deleted by docker compose down -v</text>

    <text x="430" y="414" font-size="13" fill="#40566b">One file describes the whole stack; containers find each other by service name.</text>
  </g>
</svg>
