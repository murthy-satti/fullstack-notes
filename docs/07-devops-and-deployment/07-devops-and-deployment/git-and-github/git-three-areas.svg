<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="gta-title gta-desc">
  <title id="gta-title">The working tree, the index, and the repository, with the commands that move content between them</title>
  <desc id="gta-desc">Three boxes: the working tree (files on disk you edit), the staging area or index (the proposed next commit, stored in .git/index), and the local repository (HEAD points to main, which points to the last commit). Forward: git add copies a file from the working tree into the index; git commit records the index as a new commit; git commit -a stages changes to tracked files and commits in one step. Backward: git restore file copies the index version back over the working-tree file, discarding unstaged edits; git restore --staged file copies the HEAD version into the index, unstaging the change; git switch to another branch rewrites both the index and the working tree to match the new HEAD. Comparisons: git diff compares the working tree with the index, git diff --staged compares the index with HEAD, and git diff HEAD compares the working tree with the last commit.</desc>
  <defs>
    <marker id="gta-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="gta-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="150" width="200" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="130" y="176" font-size="14" font-weight="700" fill="#66400f">Working tree</text>
    <text x="130" y="196" font-size="11.5" fill="#66400f">files on disk you edit</text>
    <text x="130" y="213" font-size="11.5" fill="#66400f">modified and untracked</text>
    <rect x="330" y="150" width="200" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="176" font-size="14" font-weight="700" fill="#463365">Staging area (index)</text>
    <text x="430" y="196" font-size="11.5" fill="#463365">.git/index</text>
    <text x="430" y="213" font-size="11.5" fill="#463365">the proposed next commit</text>
    <rect x="630" y="150" width="200" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="730" y="176" font-size="14" font-weight="700" fill="#263e5a">Local repository</text>
    <text x="730" y="196" font-size="11.5" fill="#263e5a">HEAD -&gt; main -&gt; commit</text>
    <text x="730" y="213" font-size="11.5" fill="#263e5a">committed snapshots</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 150V118H410V148" marker-end="url(#gta-arrow)"/>
      <path d="M450 150V118H710V148" marker-end="url(#gta-arrow)"/>
      <path d="M60 150V70H800V148" marker-end="url(#gta-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="260" y="111">git add &lt;file&gt;</text>
      <text x="580" y="111">git commit</text>
      <text x="430" y="63">git commit -a: stage changes to tracked files and commit</text>
    </g>

    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M410 230V270H110V232" marker-end="url(#gta-arrow-ret)"/>
      <path d="M710 230V270H450V232" marker-end="url(#gta-arrow-ret)"/>
      <path d="M800 230V316H60V232" marker-end="url(#gta-arrow-ret)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="260" y="262">git restore &lt;file&gt;: discard edits</text>
      <text x="580" y="262">git restore --staged &lt;file&gt;: unstage</text>
      <text x="430" y="308">git switch &lt;branch&gt;: index and files follow the new HEAD</text>
    </g>

    <text x="24" y="346" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Compare</text>
    <g fill="none" stroke="#8062a8" stroke-width="1.5">
      <path d="M130 352V362H425V352"/>
      <path d="M435 352V362H730V352"/>
      <path d="M130 392V402H730V392"/>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="278" y="378">git diff: working tree vs index</text>
      <text x="582" y="378">git diff --staged: index vs HEAD</text>
      <text x="430" y="418">git diff HEAD: working tree vs last commit</text>
    </g>

    <text x="430" y="452" font-size="13" fill="#40566b">add and commit move changes right; restore and switch copy content back; diff compares any two areas.</text>
  </g>
</svg>
