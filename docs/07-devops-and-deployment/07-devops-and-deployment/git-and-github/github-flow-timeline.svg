<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="ghf-title ghf-desc">
  <title id="ghf-title">GitHub flow timeline</title>
  <desc id="ghf-desc">main runs left to right and is always deployable. Step 1: a developer creates a feature branch from main. Step 2: they commit and push. Step 3: they open a pull request. Step 4: CI checks and code review run on the pull request while the author pushes follow-up commits. Step 5: the pull request is squash merged into main. Step 6: main is deployed. Step 7: the branch is deleted. Meanwhile a second, smaller fix branch leaves main, is reviewed, merges independently, and is deployed on its own.</desc>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One branch and one pull request per change; main is always deployable</text>

    <text x="24" y="215" font-size="13" font-weight="700" fill="#263e5a" text-anchor="start">main</text>
    <path d="M100 210H830" stroke="#4774aa" stroke-width="4" stroke-linecap="round"/>

    <g fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M140 210L170 110H600L640 210"/>
      <path d="M250 210L280 280H420L450 210"/>
    </g>
    <path d="M340 132V140H580V132" fill="none" stroke="#8062a8" stroke-width="1.5"/>
    <text x="460" y="158" font-size="11.5" font-weight="700" fill="#463365">4. CI checks and review on the PR</text>

    <g fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M480 218V246"/>
      <path d="M700 218V246"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="140" cy="210" r="8"/><circle cx="250" cy="210" r="8"/>
      <circle cx="450" cy="210" r="8"/><circle cx="640" cy="210" r="8"/>
      <circle cx="760" cy="210" r="8"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <circle cx="230" cy="110" r="7"/><circle cx="290" cy="110" r="7"/>
      <circle cx="420" cy="110" r="7"/><circle cx="520" cy="110" r="7"/>
      <circle cx="320" cy="280" r="7"/><circle cx="380" cy="280" r="7"/>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="160" y="92">1. branch</text>
      <text x="260" y="92">2. commit and push</text>
      <text x="380" y="72">3. open pull request</text>
      <text x="470" y="92">review fixes</text>
      <text x="610" y="92">7. delete branch</text>
      <text x="350" y="304">a second, smaller PR merges independently</text>
    </g>
    <path d="M340 78V102" fill="none" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="652" y="178" font-size="11" font-weight="700" fill="#463365" text-anchor="start">5. squash merge</text>

    <g font-size="11" font-weight="700" fill="#294a2e">
      <rect x="452" y="248" width="56" height="20" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="480" y="262">deploy</text>
      <rect x="664" y="248" width="72" height="20" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="700" y="262">6. deploy</text>
    </g>

    <text x="430" y="328" font-size="13" fill="#40566b">Branch, pull request, green checks and review, merge, deploy, delete: then start the next change.</text>
  </g>
</svg>
