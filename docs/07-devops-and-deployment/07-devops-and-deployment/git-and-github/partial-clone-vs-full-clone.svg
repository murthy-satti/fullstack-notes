<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="pcc-title pcc-desc">
  <title id="pcc-title">What full, blobless, treeless, and shallow clones download</title>
  <desc id="pcc-desc">Each panel shows four commits from oldest to newest, each commit's root tree, and two file blobs per tree. A full clone downloads every commit, tree, and blob in history: largest, everything works offline. A blobless clone, git clone --filter=blob:none, downloads all commits and trees but only the blobs needed to check out the newest commit; older blobs are fetched on demand. It suits developers and build machines reused across builds. A treeless clone, --filter=tree:0, downloads all commits but only the newest commit's tree and blobs; older trees and blobs are fetched on demand. It suits one-off builds that still need commit history. A shallow clone, --depth=1, downloads only the newest commit with its tree and blobs; older history is not available at all. It suits throwaway CI builds and is discouraged for developers.</desc>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">

    <g transform="translate(20 0)">
      <rect x="0" y="20" width="200" height="300" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="100" y="44" font-size="13" font-weight="700" fill="#263e5a">Full clone</text>
      <text x="100" y="62" font-size="11" fill="#36424e">git clone &lt;url&gt;</text>
      <g stroke-width="1.8">
        <circle cx="35" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/><circle cx="78" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="121" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/><circle cx="164" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/>
        <path d="M35 136l12 20H23z" fill="#f0e9fb" stroke="#8062a8"/><path d="M78 136l12 20H66z" fill="#f0e9fb" stroke="#8062a8"/>
        <path d="M121 136l12 20H109z" fill="#f0e9fb" stroke="#8062a8"/><path d="M164 136l12 20H152z" fill="#f0e9fb" stroke="#8062a8"/>
        <rect x="24" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/><rect x="37" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/>
        <rect x="67" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/><rect x="80" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/>
        <rect x="110" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/><rect x="123" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/>
        <rect x="153" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/><rect x="166" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/>
      </g>
      <g font-size="11" fill="#36424e">
        <text x="100" y="226">everything local, works offline</text>
        <text x="100" y="244">largest download</text>
        <text x="100" y="290" font-weight="700" fill="#263e5a">small repos, any use</text>
      </g>
    </g>

    <g transform="translate(233 0)">
      <rect x="0" y="20" width="200" height="300" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="100" y="44" font-size="13" font-weight="700" fill="#263e5a">Blobless</text>
      <text x="100" y="62" font-size="11" fill="#36424e">--filter=blob:none</text>
      <g stroke-width="1.8">
        <circle cx="35" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/><circle cx="78" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="121" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/><circle cx="164" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/>
        <path d="M35 136l12 20H23z" fill="#f0e9fb" stroke="#8062a8"/><path d="M78 136l12 20H66z" fill="#f0e9fb" stroke="#8062a8"/>
        <path d="M121 136l12 20H109z" fill="#f0e9fb" stroke="#8062a8"/><path d="M164 136l12 20H152z" fill="#f0e9fb" stroke="#8062a8"/>
      </g>
      <g stroke-width="1.5" stroke-dasharray="3 2" fill="#f5f7fb" stroke="#8a96a3">
        <rect x="24" y="178" width="10" height="10"/><rect x="37" y="178" width="10" height="10"/>
        <rect x="67" y="178" width="10" height="10"/><rect x="80" y="178" width="10" height="10"/>
        <rect x="110" y="178" width="10" height="10"/><rect x="123" y="178" width="10" height="10"/>
      </g>
      <g stroke-width="1.8" fill="#e7f3e9" stroke="#53845b">
        <rect x="153" y="178" width="10" height="10"/><rect x="166" y="178" width="10" height="10"/>
      </g>
      <g font-size="11" fill="#36424e">
        <text x="100" y="226">all commits and trees;</text>
        <text x="100" y="244">old blobs fetched on demand</text>
        <text x="100" y="290" font-weight="700" fill="#263e5a">developers, reused CI</text>
      </g>
    </g>

    <g transform="translate(446 0)">
      <rect x="0" y="20" width="200" height="300" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="100" y="44" font-size="13" font-weight="700" fill="#263e5a">Treeless</text>
      <text x="100" y="62" font-size="11" fill="#36424e">--filter=tree:0</text>
      <g stroke-width="1.8">
        <circle cx="35" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/><circle cx="78" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/>
        <circle cx="121" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/><circle cx="164" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/>
      </g>
      <g stroke-width="1.5" stroke-dasharray="3 2" fill="#f5f7fb" stroke="#8a96a3">
        <path d="M35 136l12 20H23z"/><path d="M78 136l12 20H66z"/><path d="M121 136l12 20H109z"/>
        <rect x="24" y="178" width="10" height="10"/><rect x="37" y="178" width="10" height="10"/>
        <rect x="67" y="178" width="10" height="10"/><rect x="80" y="178" width="10" height="10"/>
        <rect x="110" y="178" width="10" height="10"/><rect x="123" y="178" width="10" height="10"/>
      </g>
      <g stroke-width="1.8">
        <path d="M164 136l12 20H152z" fill="#f0e9fb" stroke="#8062a8"/>
        <rect x="153" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/><rect x="166" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/>
      </g>
      <g font-size="11" fill="#36424e">
        <text x="100" y="226">all commits; old trees and</text>
        <text x="100" y="244">blobs fetched on demand</text>
        <text x="100" y="290" font-weight="700" fill="#263e5a">one-off builds needing history</text>
      </g>
    </g>

    <g transform="translate(659 0)">
      <rect x="0" y="20" width="200" height="300" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
      <text x="100" y="44" font-size="13" font-weight="700" fill="#263e5a">Shallow</text>
      <text x="100" y="62" font-size="11" fill="#36424e">--depth=1</text>
      <g stroke-width="1.2" stroke-dasharray="1 3" fill="none" stroke="#c9d1db">
        <circle cx="35" cy="96" r="11"/><circle cx="78" cy="96" r="11"/><circle cx="121" cy="96" r="11"/>
        <path d="M35 136l12 20H23z"/><path d="M78 136l12 20H66z"/><path d="M121 136l12 20H109z"/>
        <rect x="24" y="178" width="10" height="10"/><rect x="37" y="178" width="10" height="10"/>
        <rect x="67" y="178" width="10" height="10"/><rect x="80" y="178" width="10" height="10"/>
        <rect x="110" y="178" width="10" height="10"/><rect x="123" y="178" width="10" height="10"/>
      </g>
      <g stroke-width="1.8">
        <circle cx="164" cy="96" r="11" fill="#e5efff" stroke="#4774aa"/>
        <path d="M164 136l12 20H152z" fill="#f0e9fb" stroke="#8062a8"/>
        <rect x="153" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/><rect x="166" y="178" width="10" height="10" fill="#e7f3e9" stroke="#53845b"/>
      </g>
      <g font-size="11" fill="#36424e">
        <text x="100" y="226">newest snapshot only;</text>
        <text x="100" y="244">older history unavailable</text>
        <text x="100" y="290" font-weight="700" fill="#6e2a24">throwaway CI only</text>
      </g>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <circle cx="40" cy="342" r="7" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="52" y="346">commit</text>
      <path d="M118 334l8 14H110z" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="134" y="346">tree</text>
      <rect x="180" y="337" width="10" height="10" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="198" y="346">blob (file content)</text>
      <rect x="330" y="337" width="10" height="10" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="348" y="346">dashed: fetched on demand</text>
      <rect x="530" y="337" width="10" height="10" fill="none" stroke="#c9d1db" stroke-width="1.2" stroke-dasharray="1 3"/>
      <text x="548" y="346">dotted: not in the clone at all</text>
    </g>
    <text x="440" y="382" font-size="13" fill="#40566b">Filled shapes download at clone time; checking out the newest commit always needs its tree and blobs.</text>
  </g>
</svg>
