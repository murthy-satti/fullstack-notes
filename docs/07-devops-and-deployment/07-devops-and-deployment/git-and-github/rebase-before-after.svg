<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="rba-title rba-desc">
  <title id="rba-title">A branch before and after git rebase main</title>
  <desc id="rba-desc">Before: main has commits A, B, and C. The feature branch started at B and added D and E, so it does not contain C. The developer runs git switch feature and then git rebase main. After: Git replays the changes from D and E one at a time on top of C, creating new commits D prime and E prime with new parents and therefore new hashes, and moves feature to E prime. History is now linear: A, B, C, D prime, E prime. The original D and E still exist but no branch points to them; they are reachable only through ORIG_HEAD and the reflog until garbage collection removes them.</desc>
  <defs>
    <marker id="rba-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rba-arrow-ghost" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8a96a3"/>
    </marker>
  </defs>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="340" height="310" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="380" y="20" width="460" height="310" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="190" y="46" font-size="14" font-weight="700" fill="#40566b">Before</text>
    <text x="610" y="46" font-size="14" font-weight="700" fill="#40566b">After git rebase main</text>

    <g fill="none" stroke="#40566b" stroke-width="1.8">
      <path d="M122 110H90" marker-end="url(#rba-arrow)"/>
      <path d="M192 110H160" marker-end="url(#rba-arrow)"/>
      <path d="M197 189 152 124" marker-end="url(#rba-arrow)"/>
      <path d="M262 200H230" marker-end="url(#rba-arrow)"/>
    </g>
    <g stroke-width="2">
      <circle cx="72" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="142" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="212" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="212" cy="200" r="16" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="282" cy="200" r="16" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="72" y="114">A</text><text x="142" y="114">B</text><text x="212" y="114">C</text>
      <text x="212" y="204" fill="#66400f">D</text><text x="282" y="204" fill="#66400f">E</text>
    </g>
    <rect x="190" y="70" width="44" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="212" y="84" font-size="11" font-weight="700" fill="#263e5a">main</text>
    <rect x="252" y="224" width="60" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="282" y="238" font-size="11" font-weight="700" fill="#66400f">feature</text>
    <rect x="40" y="262" width="300" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="190" y="283" font-size="12" fill="#463365">git switch feature</text>
    <text x="190" y="301" font-size="12" fill="#463365">git rebase main</text>

    <g fill="none" stroke="#40566b" stroke-width="1.8">
      <path d="M462 110H430" marker-end="url(#rba-arrow)"/>
      <path d="M532 110H500" marker-end="url(#rba-arrow)"/>
      <path d="M602 110H570" marker-end="url(#rba-arrow)"/>
      <path d="M672 110H640" marker-end="url(#rba-arrow)"/>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M538 190 488 124" marker-end="url(#rba-arrow-ghost)"/>
      <path d="M602 200H570" marker-end="url(#rba-arrow-ghost)"/>
    </g>
    <g stroke-width="2">
      <circle cx="412" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="482" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="552" cy="110" r="16" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="622" cy="110" r="16" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="692" cy="110" r="16" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g stroke-width="1.5" stroke-dasharray="4 3" fill="#f5f7fb" stroke="#8a96a3">
      <circle cx="552" cy="200" r="16"/>
      <circle cx="622" cy="200" r="16"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="412" y="114">A</text><text x="482" y="114">B</text><text x="552" y="114">C</text>
      <text x="622" y="114" fill="#66400f">D'</text><text x="692" y="114" fill="#66400f">E'</text>
      <text x="552" y="204" fill="#8a96a3">D</text><text x="622" y="204" fill="#8a96a3">E</text>
    </g>
    <rect x="530" y="70" width="44" height="20" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="552" y="84" font-size="11" font-weight="700" fill="#263e5a">main</text>
    <rect x="662" y="70" width="60" height="20" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="692" y="84" font-size="11" font-weight="700" fill="#66400f">feature</text>
    <g font-size="11" text-anchor="start">
      <text x="722" y="114" font-weight="700" fill="#66400f">replayed copies:</text>
      <text x="722" y="130" fill="#66400f">same changes,</text>
      <text x="722" y="145" fill="#66400f">new parents,</text>
      <text x="722" y="160" fill="#66400f">new hashes</text>
      <text x="652" y="196" font-weight="700" fill="#60788d">originals D and E:</text>
      <text x="652" y="212" fill="#60788d">no branch points here;</text>
      <text x="652" y="227" fill="#60788d">kept in ORIG_HEAD and</text>
      <text x="652" y="242" fill="#60788d">the reflog until gc</text>
    </g>
    <text x="610" y="292" font-size="11.5" fill="#36424e">History is linear: A, B, C, D', E'.</text>
    <text x="610" y="310" font-size="11.5" fill="#36424e">Conflicts are resolved commit by commit as each one is replayed.</text>

    <text x="430" y="362" font-size="13" fill="#40566b">Rebase copies commits onto a new base; every copied hash changes, so never rebase shared commits.</text>
  </g>
</svg>
