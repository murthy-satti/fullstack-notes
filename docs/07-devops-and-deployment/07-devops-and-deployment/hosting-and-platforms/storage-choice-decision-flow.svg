<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-labelledby="scd-title scd-desc">
  <title id="scd-title">Choosing a storage type and provider</title>
  <desc id="scd-desc">A decision flow that starts with the question where should these bytes live. First decision: do many servers need a shared filesystem? Yes leads to managed file storage such as EFS, FSx, Filestore, or Azure Files. No leads to the second decision: is this a disk for one server, such as the operating system or a self-hosted database? Yes leads to block storage such as EBS, Persistent Disk, or Azure Managed Disks. No means use object storage, followed by the third decision: will monthly downloads exceed the stored data? Yes leads to a zero or low egress option: Cloudflare R2, Backblaze B2 with a partner CDN, or a flat-rate CDN plan. No leads to the fourth decision: is the data read mostly by compute in the same cloud? Yes leads to that cloud's object store (S3, GCS, or Blob) with lifecycle rules. No leads to the cheapest per terabyte store that fits compliance needs: Backblaze B2, Wasabi, or a cold storage class.</desc>
  <defs>
    <marker id="scd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="14" width="300" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="37" font-size="13.5" font-weight="700" fill="#66400f">Where should these bytes live?</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M100 110 250 70 400 110 250 150z"/>
      <path d="M100 210 250 170 400 210 250 250z"/>
      <path d="M100 360 250 320 400 360 250 400z"/>
      <path d="M100 460 250 420 400 460 250 500z"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="250" y="107">Do many servers need</text>
      <text x="250" y="124">a shared filesystem?</text>
      <text x="250" y="207">A disk for one server</text>
      <text x="250" y="224">(OS, self-hosted DB)?</text>
      <text x="250" y="357">Monthly downloads</text>
      <text x="250" y="374">exceed stored data?</text>
      <text x="250" y="457">Read mostly by compute</text>
      <text x="250" y="474">in the same cloud?</text>
    </g>

    <rect x="150" y="268" width="200" height="32" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="250" y="289" font-size="13" font-weight="700" fill="#263e5a">Use object storage</text>

    <g stroke-width="2">
      <rect x="480" y="82" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="182" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="480" y="332" width="360" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="480" y="432" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="70" y="530" width="360" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="13.5" font-weight="700">
      <text x="660" y="105" fill="#263e5a">Managed file storage</text>
      <text x="660" y="205" fill="#263e5a">Block storage</text>
      <text x="660" y="355" fill="#294a2e">Zero or low egress</text>
      <text x="660" y="455" fill="#263e5a">Your cloud's object store</text>
      <text x="250" y="553" fill="#263e5a">Cheapest per TB that fits compliance</text>
    </g>
    <g font-size="11.5">
      <text x="660" y="125" fill="#263e5a">EFS, FSx, Filestore, Azure Files</text>
      <text x="660" y="225" fill="#263e5a">EBS, Persistent Disk, Azure Managed Disks</text>
      <text x="660" y="375" fill="#294a2e">R2, B2 + partner CDN, or a flat-rate CDN plan</text>
      <text x="660" y="475" fill="#263e5a">S3, GCS, or Blob, with lifecycle rules</text>
      <text x="250" y="573" fill="#263e5a">Backblaze B2, Wasabi, or a cold storage class</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M250 50V68" marker-end="url(#scd-arrow)"/>
      <path d="M400 110H478" marker-end="url(#scd-arrow)"/>
      <path d="M250 150V168" marker-end="url(#scd-arrow)"/>
      <path d="M400 210H478" marker-end="url(#scd-arrow)"/>
      <path d="M250 250V266" marker-end="url(#scd-arrow)"/>
      <path d="M250 300V318" marker-end="url(#scd-arrow)"/>
      <path d="M400 360H478" marker-end="url(#scd-arrow)"/>
      <path d="M250 400V418" marker-end="url(#scd-arrow)"/>
      <path d="M400 460H478" marker-end="url(#scd-arrow)"/>
      <path d="M250 500V528" marker-end="url(#scd-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#294a2e">
      <text x="439" y="103">yes</text>
      <text x="439" y="203">yes</text>
      <text x="439" y="353">yes</text>
      <text x="439" y="453">yes</text>
    </g>
    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="258" y="164">no</text>
      <text x="258" y="262">no</text>
      <text x="258" y="414">no</text>
      <text x="258" y="518">no</text>
    </g>

    <text x="430" y="622" font-size="13" fill="#40566b">Pick the storage type first, then let egress and access patterns pick the provider.</text>
  </g>
</svg>
