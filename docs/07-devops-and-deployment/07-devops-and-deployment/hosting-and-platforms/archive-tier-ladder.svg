      <text x="197" y="133">no minimum, ms</text>
      <text x="391" y="116">$0.0208 per GB-month</text>
      <text x="391" y="133">no minimum, ms</text>
      <text x="585" y="116">$0.020 per GiB-month</text>
      <text x="585" y="133">no minimum, ms</text>
      <text x="779" y="116">$6.95/TB, $0.015/GB,</text>
