      <text x="391" y="194">$0.0152, $0.01/GB read</text>
      <text x="391" y="211">30 days, ms</text>
      <text x="585" y="194">$0.010, $0.01/GiB read</text>
      <text x="585" y="211">30 days, ms</text>
      <text x="779" y="194">$0.01, $0.01/GB read</text>
      <text x="779" y="211">30 days, ms</text>
    </g>

    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="197" y="254">S3 Glacier IR</text>
      <text x="391" y="254">Cold</text>
      <text x="585" y="254">Coldline</text>
      <text x="779" y="254">Spaces Cold Storage</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="197" y="272">$0.004, $0.03/GB read</text>
      <text x="197" y="289">90 days, ms</text>
      <text x="391" y="272">$0.0036, $0.03/GB read</text>
      <text x="391" y="289">90 days, ms</text>
      <text x="585" y="272">$0.004, $0.02/GiB read</text>
      <text x="585" y="289">90 days, ms</text>
      <text x="779" y="272">$0.007/GiB, $0.01 read</text>
      <text x="779" y="289">30 days</text>
    </g>

    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <text x="197" y="330">Glacier Flexible</text>
      <text x="197" y="382">Glacier Deep Archive</text>
      <text x="391" y="330">Archive (offline)</text>
      <text x="585" y="330">Archive</text>
      <text x="779" y="330">No archive tier</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="197" y="346">$0.0036, 90 days</text>
      <text x="197" y="362">minutes to 12 hours</text>
      <text x="197" y="398">$0.00099, 180 days</text>
      <text x="197" y="414">12 to 48 hours</text>
      <text x="391" y="348">$0.00099, 180 days</text>
      <text x="391" y="365">$0.02/GB rehydration</text>
      <text x="391" y="382">up to 15 hours</text>
      <text x="585" y="348">$0.0012, 365 days</text>
      <text x="585" y="365">$0.05/GiB read</text>
      <text x="585" y="382">milliseconds</text>
      <text x="779" y="348">B2, R2, and Wasabi</text>
      <text x="779" y="365">stop at hot or warm</text>
    </g>
    <path d="M116 368H278" stroke="#c9d1db" stroke-width="1"/>

    <text x="440" y="458" font-size="13" fill="#40566b">Each step colder is cheaper to keep and dearer or slower to read; only AWS and Azure archives go offline.</text>
  </g>
</svg>
