<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="atl-title atl-desc">
  <title id="atl-title">Storage tiers by temperature across providers</title>
  <desc id="atl-desc">A grid with four rows from hot to archive and four columns: AWS S3, Azure Blob, Google Cloud Storage, and others, using US list prices from November 2026. Hot: S3 Standard $0.023 per GB-month, Azure Hot $0.0208, Google Standard $0.020 per GiB-month, all with no minimum and millisecond reads; among others, Backblaze B2 at $6.95 per TB, Cloudflare R2 at $0.015 per GB, and Wasabi at $7.99 per TB with a 90-day minimum. Warm: S3 Standard-IA $0.0125 with $0.01 per GB reads, Azure Cool $0.0152 with $0.01 reads, Google Nearline $0.010 with $0.01 reads, and R2 Infrequent Access $0.01 with $0.01 reads, each with a 30-day minimum and millisecond access. Cold: S3 Glacier Instant Retrieval $0.004 with $0.03 reads, Azure Cold $0.0036 with $0.03 reads, Google Coldline $0.004 with $0.02 reads, each with a 90-day minimum and millisecond access, and DigitalOcean Spaces Cold Storage $0.007 per GiB with $0.01 reads and a 30-day minimum. Archive: S3 Glacier Flexible Retrieval $0.0036 with a 90-day minimum restored in minutes to 12 hours, and S3 Glacier Deep Archive $0.00099 with a 180-day minimum restored in 12 to 48 hours; Azure Archive $0.00099 with a 180-day minimum, offline, $0.02 per GB rehydration taking up to 15 hours; Google Archive $0.0012 with a 365-day minimum, $0.05 per GiB reads, in milliseconds; B2, R2, and Wasabi have no archive tier. An arrow down the left says colder tiers are cheaper to keep and dearer or slower to read.</desc>
  <defs>
    <marker id="atl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="440" y="26" font-size="14" font-weight="700" fill="#36424e">Storage tiers by temperature (US list prices, November 2026)</text>
    <g font-size="12.5" font-weight="700" fill="#40566b">
      <text x="197" y="60">AWS (S3)</text>
      <text x="391" y="60">Azure Blob</text>
      <text x="585" y="60">Google Cloud Storage</text>
      <text x="779" y="60">Others</text>
    </g>

    <path d="M30 78V424" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#atl-arrow)"/>
    <text x="20" y="252" font-size="11" fill="#40566b" transform="rotate(-90 20 252)">colder: cheaper to keep, dearer or slower to read</text>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="64" y="116">Hot</text>
      <text x="64" y="194">Warm</text>
      <text x="64" y="272">Cold</text>
      <text x="64" y="372">Archive</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="104" y="76" width="186" height="70" rx="8"/>
      <rect x="298" y="76" width="186" height="70" rx="8"/>
      <rect x="492" y="76" width="186" height="70" rx="8"/>
      <rect x="686" y="76" width="186" height="70" rx="8"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5">
      <rect x="104" y="154" width="186" height="70" rx="8"/>
      <rect x="298" y="154" width="186" height="70" rx="8"/>
      <rect x="492" y="154" width="186" height="70" rx="8"/>
      <rect x="686" y="154" width="186" height="70" rx="8"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="104" y="232" width="186" height="70" rx="8"/>
      <rect x="298" y="232" width="186" height="70" rx="8"/>
      <rect x="492" y="232" width="186" height="70" rx="8"/>
      <rect x="686" y="232" width="186" height="70" rx="8"/>
    </g>
    <g fill="#ffffff" stroke="#4774aa" stroke-width="1.5">
      <rect x="104" y="310" width="186" height="116" rx="8"/>
      <rect x="298" y="310" width="186" height="116" rx="8"/>
      <rect x="492" y="310" width="186" height="116" rx="8"/>
      <rect x="686" y="310" width="186" height="116" rx="8"/>
    </g>

    <g font-size="12.5" font-weight="700" fill="#66400f">
      <text x="197" y="98">S3 Standard</text>
      <text x="391" y="98">Hot</text>
      <text x="585" y="98">Standard</text>
      <text x="779" y="98">B2, R2, Wasabi</text>
    </g>
