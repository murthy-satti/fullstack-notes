<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="rmh-title rmh-desc">
  <title id="rmh-title">What the host must do for static sites, single-page apps, and server rendering</title>
  <desc id="rmh-desc">Three rows show one request for each kind of frontend. Static site: the browser requests /about and the CDN edge returns about.html, which was built ahead of time; there is no server code, so any static host works and billing is by GB and requests. Single-page app: the CDN edge rewrites a page route such as /tasks/42 to index.html, the browser runs the app, and the app fetches JSON from a separate API; the host needs a static host with an SPA rewrite plus an API somewhere. Server rendering or incremental regeneration: the CDN edge serves static assets and cached HTML, and on a cache miss server code in functions or a container renders HTML, so the host needs compute per request or per revalidation, billed per request.</desc>
  <defs>
    <marker id="rmh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="195" y="36" text-anchor="middle">Browser</text>
      <text x="390" y="36" text-anchor="middle">CDN edge</text>
      <text x="605" y="36" text-anchor="middle">Code at request time</text>
      <text x="710" y="36">Host needs</text>
    </g>

    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="24" y="85">Static site</text>
      <text x="24" y="175">Single-page</text>
      <text x="24" y="190">app (SPA)</text>
      <text x="24" y="265">SSR / ISR</text>
    </g>

    <g stroke-width="2">
      <rect x="130" y="52" width="130" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="300" y="52" width="180" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="520" y="52" width="170" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-dasharray="6 4"/>

      <rect x="130" y="142" width="130" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="300" y="142" width="180" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="520" y="142" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>

      <rect x="130" y="232" width="130" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="300" y="232" width="180" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="520" y="232" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>

    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="195" y="76" fill="#66400f">Browser</text>
      <text x="390" y="76" fill="#263e5a">CDN edge</text>
      <text x="605" y="76" fill="#36424e">No server code</text>
      <text x="195" y="166" fill="#66400f">Browser</text>
      <text x="390" y="166" fill="#263e5a">CDN edge</text>
      <text x="605" y="166" fill="#263e5a">API (separate)</text>
      <text x="195" y="256" fill="#66400f">Browser</text>
      <text x="390" y="256" fill="#263e5a">CDN edge</text>
      <text x="605" y="256" fill="#463365">Server code</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="195" y="94" fill="#66400f">requests /about</text>
      <text x="390" y="94" fill="#263e5a">returns about.html</text>
      <text x="605" y="94" fill="#36424e">HTML built ahead</text>
      <text x="195" y="184" fill="#66400f">runs the app</text>
      <text x="390" y="184" fill="#263e5a">/tasks/42 to index.html</text>
      <text x="605" y="184" fill="#263e5a">returns JSON</text>
      <text x="195" y="274" fill="#66400f">gets ready HTML</text>
      <text x="390" y="274" fill="#263e5a">assets + cached HTML</text>
      <text x="605" y="274" fill="#463365">functions or container</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M260 80H298" marker-end="url(#rmh-arrow)"/>
      <path d="M260 160H298" marker-end="url(#rmh-arrow)"/>
      <path d="M195 198V214H605V200" marker-end="url(#rmh-arrow)"/>
      <path d="M260 260H298" marker-end="url(#rmh-arrow)"/>
      <path d="M480 260H518" marker-end="url(#rmh-arrow)"/>
    </g>
    <rect x="330" y="207" width="150" height="14" fill="#f5f7fb"/>
    <text x="405" y="218" font-size="11" fill="#36424e" text-anchor="middle">fetch /api/tasks (data)</text>
    <text x="499" y="252" font-size="11" fill="#36424e" text-anchor="middle">miss</text>

    <g font-size="11.5" fill="#36424e">
      <text x="710" y="76">Any static host</text>
      <text x="710" y="92">billed by GB + requests</text>
      <text x="710" y="166">Static host with an</text>
      <text x="710" y="182">SPA rewrite, plus</text>
      <text x="710" y="198">an API somewhere</text>
      <text x="710" y="256">Compute per request</text>
      <text x="710" y="272">or per revalidation</text>
      <text x="710" y="288">billed per request</text>
    </g>

    <path d="M24 310H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="338" font-size="13" fill="#40566b" text-anchor="middle">Only server rendering needs your code at request time; the other two can use any static host.</text>
  </g>
</svg>
