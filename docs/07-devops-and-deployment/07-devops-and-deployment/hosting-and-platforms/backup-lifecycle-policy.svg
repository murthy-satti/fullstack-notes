<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="blp-title blp-desc">
  <title id="blp-title">Lifecycle of one nightly backup object in S3</title>
  <desc id="blp-desc">A timeline for one nightly backup object, not to scale after day 120. From day 0, an Object Lock retention in compliance mode blocks deletion and overwrites for 35 days, and restore tests read objects during their first 30 days. Day 0 to 30: S3 Standard at $0.023 per GB-month. At day 30 a lifecycle transition, costing $0.02 per 1,000 objects, moves it to Glacier Instant Retrieval at $0.004 per GB-month until day 120, exactly its 90-day minimum. At day 120 a transition costing $0.05 per 1,000 objects moves it to Glacier Deep Archive at $0.00099 per GB-month, more than its 180-day minimum. At day 2,555, seven years, the object is deleted. One 20 GB dump costs $0.46 plus $0.24 plus $1.58, about $2.28, over seven years with this rule, compared with $38.64 if kept in S3 Standard for 84 months.</desc>
  <rect width="860" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="430" y="26" font-size="14" font-weight="700" fill="#36424e">Lifecycle of one nightly backup object (S3, us-east-1, Nov 2026 prices)</text>

    <rect x="60" y="44" width="181" height="22" rx="5" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="150.5" y="59" font-size="11" font-weight="700" fill="#6e2a24">Object Lock</text>
    <text x="252" y="59" font-size="11.5" fill="#6e2a24" text-anchor="start">compliance mode: no delete or overwrite for 35 days</text>
    <rect x="60" y="74" width="170" height="20" rx="5" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="145" y="88" font-size="11" fill="#294a2e">restore tests read these</text>

    <g font-size="11" fill="#40566b">
      <text x="230" y="110">transition $0.02 / 1,000</text>
      <text x="430" y="110">transition $0.05 / 1,000</text>
    </g>

    <rect x="60" y="118" width="170" height="56" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="230" y="118" width="200" height="56" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="430" y="118" width="360" height="56" fill="#ffffff" stroke="#4774aa" stroke-width="2"/>
    <rect x="719" y="114" width="16" height="64" fill="#f5f7fb"/>
    <g fill="none" stroke="#4774aa" stroke-width="2">
      <path d="M716 112 722 180M732 112 738 180"/>
    </g>
    <text x="145" y="142" font-size="13" font-weight="700" fill="#263e5a">S3 Standard</text>
    <text x="145" y="161" font-size="11.5" fill="#263e5a">$0.023 per GB-month</text>
    <text x="330" y="142" font-size="12" font-weight="700" fill="#463365">Glacier Instant Retrieval</text>
    <text x="330" y="161" font-size="11.5" fill="#463365">$0.004 per GB-month</text>
    <text x="575" y="142" font-size="13" font-weight="700" fill="#263e5a">Glacier Deep Archive</text>
    <text x="575" y="161" font-size="11.5" fill="#263e5a">$0.00099 per GB-month</text>
    <circle cx="790" cy="146" r="9" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <path d="M785 141 795 151M795 141 785 151" stroke="#b5524b" stroke-width="2"/>

    <path d="M60 182H790" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M60 182V190M230 182V190M430 182V190M790 182V190"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="60" y="206">day 0</text>
      <text x="230" y="206">day 30</text>
      <text x="430" y="206">day 120</text>
      <text x="790" y="206">day 2,555</text>
    </g>
    <text x="790" y="222" font-size="11" fill="#6e2a24">delete (7 years)</text>

    <g fill="none" stroke="#53845b" stroke-width="1.5">
      <path d="M232 234V242H428V234"/>
      <path d="M432 234V242H714V234"/>
    </g>
    <g font-size="11" fill="#294a2e">
      <text x="330" y="258">90-day minimum met</text>
      <text x="573" y="258">180-day minimum met</text>
    </g>

    <rect x="60" y="280" width="360" height="78" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="240" y="303" font-size="13" font-weight="700" fill="#294a2e">One 20 GB dump with this rule</text>
    <text x="240" y="324" font-size="11.5" fill="#294a2e">$0.46 x 1 mo + $0.08 x 3 mo + $0.0198 x 80 mo</text>
    <text x="240" y="343" font-size="12" font-weight="700" fill="#294a2e">= $0.46 + $0.24 + $1.58 = about $2.28</text>
    <rect x="440" y="280" width="350" height="78" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="615" y="303" font-size="13" font-weight="700" fill="#6e2a24">The same dump left in S3 Standard</text>
    <text x="615" y="324" font-size="11.5" fill="#6e2a24">20 GB x $0.023 x 84 months</text>
    <text x="615" y="343" font-size="12" font-weight="700" fill="#6e2a24">= $38.64</text>

    <text x="430" y="392" font-size="13" fill="#40566b">Lifecycle rules tier backups by age and delete them on schedule, within each tier's minimum.</text>
  </g>
</svg>
