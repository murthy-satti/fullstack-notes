        <text x="263" y="108">you</text><text x="353" y="108">you</text><text x="443" y="108">you</text><text x="533" y="108">you</text><text x="623" y="108">you</text><text x="713" y="108">you</text><text x="803" y="108">you</text>
        <text x="263" y="148">you</text><text x="353" y="148">you</text><text x="443" y="148">you</text><text x="533" y="148">you</text><text x="623" y="148">you</text><text x="713" y="148">you</text><text x="803" y="148">your files</text>
        <text x="263" y="188">you</text><text x="353" y="188">you</text>
        <text x="263" y="228">you</text><text x="353" y="228">you</text><text x="443" y="228">in your image</text><text x="533" y="228">in your image</text>
        <text x="263" y="268">you</text><text x="353" y="268">you</text>
        <text x="263" y="308">you</text>
