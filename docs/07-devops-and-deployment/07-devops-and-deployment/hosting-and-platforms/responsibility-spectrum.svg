<svg xmlns="http://www.w3.org/2000/svg" width="870" height="450" viewBox="0 0 870 450" role="img" aria-labelledby="rsp-title rsp-desc">
  <title id="rsp-title">Who manages each layer in each hosting model</title>
  <desc id="rsp-desc">A grid with responsibility layers as rows and hosting models as columns. Columns from left to right: own servers, virtual machines, Kubernetes, serverless containers, platform as a service, functions, and static hosting, moving toward more provider management. Rows from top to bottom: data, identities, and access; application code; scaling and capacity; language runtime; operating system and patches; host and hypervisor; data center and hardware. Data, identities, and access and application code are yours in every column. Scaling is yours on own servers and virtual machines, shared on Kubernetes, serverless containers, and platforms, and the provider's for functions and static hosting. The runtime is yours through serverless containers because it is inside your image, and the provider's for platforms and functions; static hosting has no runtime. The operating system is yours on own servers and virtual machines, shared on Kubernetes because of the nodes, and the provider's from serverless containers onward. The host and the hardware are yours only with your own servers.</desc>
  <defs>
    <marker id="rsp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="870" height="450" rx="14" fill="#f5f7fb"/>
