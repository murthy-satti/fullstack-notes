    <path d="M220 26H840" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rsp-arrow)"/>
    <rect x="404" y="18" width="252" height="16" fill="#f5f7fb"/>
    <text x="530" y="30" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="middle">more managed by the provider</text>

    <g font-size="11.5" font-weight="700" fill="#36424e" text-anchor="middle">
      <text x="263" y="66">Own servers</text>
      <text x="353" y="66">VMs</text>
      <text x="443" y="66">Kubernetes</text>
      <text x="533" y="58">Serverless</text>
      <text x="533" y="72">containers</text>
      <text x="623" y="66">PaaS</text>
      <text x="713" y="66">Functions</text>
      <text x="803" y="66">Static</text>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
