<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="cmh-title cmh-desc">
  <title id="cmh-title">Virtual machine, container, and function compared layer by layer</title>
  <desc id="cmh-desc">Three stacks. Virtual machine, top to bottom: TaskFlow API code, Node.js that you install, a guest OS that you patch, the provider's hypervisor, and the physical server; it scales by adding VMs behind a load balancer, starts in tens of seconds to minutes, and bills per hour while running. Container: TaskFlow API code, Node.js inside the image, a container runtime, a host OS on a node or on Fargate, and the physical server; it scales by adding tasks or pods, starts in seconds, and bills per node or per vCPU-second and GB-second. Function: your handler code, a managed Node runtime, a Firecracker microVM per execution environment, the provider's host OS, and the physical server; it scales by creating a new environment for each concurrent request, which is a cold start, and bills per request and GB-second. Orange layers are yours, purple is configured by you and run by the provider, blue is the provider's.</desc>
  <rect width="860" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#40566b">
      <text x="150" y="34">Virtual machine</text>
      <text x="430" y="34">Container (ECS, Kubernetes)</text>
      <text x="710" y="34">Function (Lambda)</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="50" width="252" height="30" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="84" width="252" height="30" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="118" width="252" height="30" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="152" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="24" y="186" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>

      <rect x="304" y="50" width="252" height="30" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="304" y="84" width="252" height="30" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="304" y="118" width="252" height="30" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="304" y="152" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="304" y="186" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>

      <rect x="584" y="50" width="252" height="30" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="584" y="84" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="584" y="118" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="584" y="152" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="584" y="186" width="252" height="30" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="150" y="70" fill="#66400f">TaskFlow API code</text>
      <text x="150" y="104" fill="#66400f">Node.js (you install it)</text>
      <text x="150" y="138" fill="#66400f">Guest OS (you patch it)</text>
      <text x="150" y="172" fill="#263e5a">Hypervisor</text>
      <text x="150" y="206" fill="#263e5a">Physical server</text>

      <text x="430" y="70" fill="#66400f">TaskFlow API code</text>
      <text x="430" y="104" fill="#66400f">Node.js (inside your image)</text>
      <text x="430" y="138" fill="#463365">Container runtime</text>
      <text x="430" y="172" fill="#263e5a">Host OS (node or Fargate)</text>
      <text x="430" y="206" fill="#263e5a">Physical server</text>

      <text x="710" y="70" fill="#66400f">Your handler</text>
      <text x="710" y="104" fill="#263e5a">Node runtime (managed)</text>
      <text x="710" y="138" fill="#263e5a">Firecracker microVM</text>
      <text x="710" y="172" fill="#263e5a">Host OS (provider)</text>
      <text x="710" y="206" fill="#263e5a">Physical server</text>
    </g>

    <path d="M24 228H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="11" fill="#36424e">
      <text x="150" y="250">Scales: add VMs behind a load balancer</text>
      <text x="150" y="268">Starts: tens of seconds to minutes</text>
      <text x="150" y="286">Bills: per hour while running</text>

      <text x="430" y="250">Scales: add tasks or pods</text>
      <text x="430" y="268">Starts: seconds</text>
      <text x="430" y="286">Bills: per node, or vCPU-s + GB-s</text>

      <text x="710" y="250">Scales: one environment per concurrent</text>
      <text x="710" y="268">request; new ones start cold</text>
      <text x="710" y="286">Bills: requests + GB-seconds</text>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <rect x="180" y="306" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="200" y="318">yours</text>
      <rect x="290" y="306" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="310" y="318">you configure, provider runs</text>
      <rect x="530" y="306" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="550" y="318">provider's</text>
    </g>
    <text x="430" y="352" font-size="13" fill="#40566b">Each step right removes layers you patch and adds limits you must design around.</text>
  </g>
</svg>
