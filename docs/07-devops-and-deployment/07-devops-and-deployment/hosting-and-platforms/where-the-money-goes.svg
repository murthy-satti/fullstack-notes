<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="wmg-title wmg-desc">
  <title id="wmg-title">Where TaskFlow's monthly AWS bill goes</title>
  <desc id="wmg-desc">Horizontal bars for the seven parts of TaskFlow's $1,216.94 monthly AWS bill at us-east-1 list prices from November 2026, largest first, each with its main levers. Internet egress, about 3 TB to the internet: $267.48, 22 percent; levers: CDN, compression, zero-egress storage. Database, three nodes with disks and snapshots: $256.70, 21 percent; levers: rightsize, commit, managed versus self-run. Network plumbing, meaning NAT gateways, the load balancer, public IPv4 addresses, and cross-zone traffic: $194.37, 16 percent; levers: gateway endpoints, fewer NAT gateways, IPv6. Compute, three m7g.large API instances: $178.70, 15 percent; levers: rightsize, Graviton, Savings Plans, Spot. Logs, 300 GB ingested: $159.00, 13 percent; levers: levels, sampling, retention, log class. Idle resources, staging running all the time and loose disks: $113.58, 9 percent; levers: schedules and cleanup. Storage, 2 TB in S3: $47.10, 4 percent; lever: lifecycle rules. Server instances total $357.40, 29 percent of the bill.</desc>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="26" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Where TaskFlow's $1,216.94 monthly AWS bill goes (us-east-1, Nov 2026 list prices)</text>
    <rect x="200" y="38" width="14" height="14" rx="3" fill="#4774aa"/>
    <text x="220" y="50" font-size="11.5" fill="#36424e">servers and their disks</text>
    <rect x="370" y="38" width="14" height="14" rx="3" fill="#bd7a20"/>
    <text x="390" y="50" font-size="11.5" fill="#36424e">everything else</text>
    <text x="575" y="50" font-size="12" font-weight="700" fill="#40566b">main levers</text>

    <g text-anchor="end">
      <g font-size="12.5" font-weight="700" fill="#36424e">
        <text x="190" y="76">Internet egress</text>
        <text x="190" y="122">Database</text>
        <text x="190" y="168">Network plumbing</text>
        <text x="190" y="214">Compute</text>
        <text x="190" y="260">Logs</text>
        <text x="190" y="306">Idle resources</text>
        <text x="190" y="352">Storage</text>
      </g>
      <g font-size="11" fill="#40566b">
        <text x="190" y="91">~3 TB to the internet</text>
        <text x="190" y="137">3 nodes, disks, snapshots</text>
        <text x="190" y="183">NAT, ALB, IPv4, cross-AZ</text>
        <text x="190" y="229">3 x m7g.large API</text>
        <text x="190" y="275">300 GB ingested</text>
        <text x="190" y="321">staging 24/7, loose disks</text>
        <text x="190" y="367">2 TB in S3</text>
      </g>
    </g>

    <g fill="#bd7a20">
      <rect x="200" y="66" width="260" height="24" rx="3"/>
      <rect x="200" y="158" width="188.9" height="24" rx="3"/>
      <rect x="200" y="250" width="154.5" height="24" rx="3"/>
      <rect x="200" y="296" width="110.4" height="24" rx="3"/>
      <rect x="200" y="342" width="45.8" height="24" rx="3"/>
    </g>
    <g fill="#4774aa">
      <rect x="200" y="112" width="249.5" height="24" rx="3"/>
      <rect x="200" y="204" width="173.7" height="24" rx="3"/>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="468" y="83">$267.48 (22%)</text>
      <text x="457" y="129">$256.70 (21%)</text>
      <text x="397" y="175">$194.37 (16%)</text>
      <text x="382" y="221">$178.70 (15%)</text>
      <text x="363" y="267">$159.00 (13%)</text>
      <text x="319" y="313">$113.58 (9%)</text>
      <text x="254" y="359">$47.10 (4%)</text>
    </g>
    <g font-size="11" fill="#294a2e">
      <text x="575" y="83">CDN, compression, zero-egress storage</text>
      <text x="575" y="129">rightsize, commit, managed vs self-run</text>
      <text x="575" y="175">gateway endpoints, fewer NAT, IPv6</text>
      <text x="575" y="221">rightsize, Graviton, Savings Plans, Spot</text>
      <text x="575" y="267">levels, sampling, retention, log class</text>
      <text x="575" y="313">schedules and cleanup</text>
      <text x="575" y="359">lifecycle rules</text>
    </g>

    <path d="M24 384H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="402" font-size="12" font-weight="700" fill="#36424e" text-anchor="middle">Total $1,216.94; server instances $357.40 (29%)</text>
    <text x="430" y="426" font-size="13" fill="#40566b" text-anchor="middle">Most of the bill is transfer, plumbing, logs, and waste, which no discount program touches.</text>
