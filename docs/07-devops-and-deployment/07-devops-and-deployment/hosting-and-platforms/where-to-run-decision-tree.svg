<svg xmlns="http://www.w3.org/2000/svg" width="860" height="650" viewBox="0 0 860 650" role="img" aria-labelledby="wrt-title wrt-desc">
  <title id="wrt-title">Decision tree for choosing where to run a workload</title>
  <desc id="wrt-desc">Start at the top. Question 1: is the output only static files after the build? If yes, use static hosting with a CDN such as Cloudflare, Vercel, Netlify, or S3 with CloudFront. If no, question 2: does the code need long-lived connections, GPUs, or a full operating system? If yes, use VMs or containers such as EC2, Droplets, Hetzner, ECS, Kubernetes, or Fly.io. If no, question 3: is the workload idle most of the time or very spiky? If yes, use functions or scale-to-zero containers such as Lambda, Cloud Run, or Azure Container Apps. If no, question 4: is there no one to run infrastructure? If yes, use a platform as a service or serverless containers such as Render, Railway, Cloud Run, or ECS Express Mode. If no, question 5: is the load large and steady all month? If yes, use containers or VMs with committed discounts such as ECS or EKS on EC2 with Savings Plans or GKE with committed use discounts. If no, the default is serverless containers or a platform. A side note says that if a compliance contract such as a HIPAA BAA is required, keep only providers and services covered by it on every branch.</desc>
  <defs>
    <marker id="wrt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="650" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">Where should this workload run? Answer the hard constraints first.</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <path d="M230 50 400 90 230 130 60 90z"/>
      <path d="M230 146 400 186 230 226 60 186z"/>
      <path d="M230 242 400 282 230 322 60 282z"/>
      <path d="M230 338 400 378 230 418 60 378z"/>
      <path d="M230 434 400 474 230 514 60 474z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f" text-anchor="middle">
      <text x="230" y="86">Is the output only static</text>
      <text x="230" y="101">files after the build?</text>
      <text x="230" y="182">Long-lived connections, GPUs,</text>
      <text x="230" y="197">or a full OS needed?</text>
      <text x="230" y="278">Idle most of the time</text>
      <text x="230" y="293">or very spiky?</text>
      <text x="230" y="374">No one to run</text>
      <text x="230" y="389">infrastructure?</text>
      <text x="230" y="470">Large, steady load</text>
      <text x="230" y="485">all month?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M400 90H466" marker-end="url(#wrt-arrow)"/>
      <path d="M400 186H466" marker-end="url(#wrt-arrow)"/>
      <path d="M400 282H466" marker-end="url(#wrt-arrow)"/>
      <path d="M400 378H466" marker-end="url(#wrt-arrow)"/>
      <path d="M400 474H466" marker-end="url(#wrt-arrow)"/>
      <path d="M230 130V144" marker-end="url(#wrt-arrow)"/>
      <path d="M230 226V240" marker-end="url(#wrt-arrow)"/>
      <path d="M230 322V336" marker-end="url(#wrt-arrow)"/>
      <path d="M230 418V432" marker-end="url(#wrt-arrow)"/>
      <path d="M230 514V542" marker-end="url(#wrt-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="424" y="84">yes</text>
      <text x="424" y="180">yes</text>
      <text x="424" y="276">yes</text>
      <text x="424" y="372">yes</text>
      <text x="424" y="468">yes</text>
      <text x="240" y="141">no</text>
      <text x="240" y="237">no</text>
      <text x="240" y="333">no</text>
      <text x="240" y="429">no</text>
      <text x="240" y="532">no</text>
    </g>

    <g stroke-width="2">
      <rect x="470" y="66" width="366" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="470" y="162" width="366" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="470" y="258" width="366" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="470" y="354" width="366" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="470" y="450" width="366" height="48" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="50" y="544" width="360" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="484" y="86" fill="#294a2e">Static hosting + CDN</text>
      <text x="484" y="182" fill="#263e5a">VMs or containers</text>
      <text x="484" y="278" fill="#463365">Functions or scale-to-zero containers</text>
      <text x="484" y="374" fill="#463365">PaaS or serverless containers</text>
      <text x="484" y="470" fill="#263e5a">Containers or VMs with commitments</text>
      <text x="230" y="569" fill="#463365" text-anchor="middle">Default: serverless containers or a PaaS</text>
    </g>
    <g font-size="11.5">
      <text x="484" y="103" fill="#294a2e">Cloudflare, Vercel, Netlify, S3 + CloudFront</text>
      <text x="484" y="199" fill="#263e5a">EC2, Droplets, Hetzner, ECS, Kubernetes, Fly.io</text>
      <text x="484" y="295" fill="#463365">Lambda, Cloud Run, Azure Container Apps</text>
      <text x="484" y="391" fill="#463365">Render, Railway, Cloud Run, ECS Express Mode</text>
      <text x="484" y="487" fill="#263e5a">ECS/EKS on EC2 + Savings Plans, GKE + CUDs</text>
    </g>

    <rect x="470" y="530" width="366" height="62" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="484" y="551" font-size="13" font-weight="700" fill="#6e2a24">Compliance contract required?</text>
    <g font-size="11.5" fill="#6e2a24">
      <text x="484" y="568">Keep only providers and services covered by it</text>
      <text x="484" y="583">(for example a HIPAA BAA) on every branch.</text>
    </g>

    <text x="430" y="628" font-size="13" fill="#40566b" text-anchor="middle">Hard constraints pick the family; traffic shape and team size pick the option within it.</text>
  </g>
</svg>
