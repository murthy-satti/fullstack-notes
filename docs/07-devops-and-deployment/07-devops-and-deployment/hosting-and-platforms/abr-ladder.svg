      <rect x="202" y="150" width="73.5" height="30" rx="4"/><rect x="279.5" y="150" width="73.5" height="30" rx="4"/><rect x="357" y="150" width="73.5" height="30" rx="4"/><rect x="434.5" y="150" width="73.5" height="30" rx="4"/><rect x="512" y="150" width="73.5" height="30" rx="4"/><rect x="589.5" y="150" width="73.5" height="30" rx="4"/><rect x="667" y="150" width="73.5" height="30" rx="4"/><rect x="744.5" y="150" width="73.5" height="30" rx="4"/>
      <rect x="202" y="190" width="73.5" height="30" rx="4"/><rect x="279.5" y="190" width="73.5" height="30" rx="4"/><rect x="357" y="190" width="73.5" height="30" rx="4"/><rect x="434.5" y="190" width="73.5" height="30" rx="4"/><rect x="512" y="190" width="73.5" height="30" rx="4"/><rect x="589.5" y="190" width="73.5" height="30" rx="4"/><rect x="667" y="190" width="73.5" height="30" rx="4"/><rect x="744.5" y="190" width="73.5" height="30" rx="4"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="202" y="150" width="73.5" height="30" rx="4"/>
      <rect x="279.5" y="110" width="73.5" height="30" rx="4"/>
      <rect x="357" y="70" width="73.5" height="30" rx="4"/>
      <rect x="434.5" y="70" width="73.5" height="30" rx="4"/>
