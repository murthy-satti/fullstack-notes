<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="abr-title abr-desc">
  <title id="abr-title">Adaptive bitrate: four renditions and one player path</title>
  <desc id="abr-desc">Four renditions of the same video, each cut into eight aligned 4-second segments: 1080p at 5 Mbps, 720p at 3 Mbps, 480p at 1.2 Mbps, and 360p at 0.8 Mbps. Below them, bars show the bandwidth available to the player for each segment: 2, 4.5, 7, 7, 1, 1.2, 4.5, and 4.5 Mbps. The player's path through the ladder starts at 480p, climbs to 720p and then 1080p for two segments, drops to 360p for two segments when bandwidth falls to about 1 Mbps, and recovers to 720p. Switches happen only at segment boundaries at 0, 4, 8, up to 32 seconds, which requires keyframes aligned across every rendition.</desc>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Adaptive bitrate: four renditions, one player path</text>
    <text x="200" y="54" font-size="11.5" fill="#40566b">each rung is cut into aligned 4-second segments</text>

    <g font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="end">
      <text x="188" y="90">1080p, 5 Mbps</text>
      <text x="188" y="130">720p, 3 Mbps</text>
      <text x="188" y="170">480p, 1.2 Mbps</text>
      <text x="188" y="210">360p, 0.8 Mbps</text>
    </g>

    <g fill="#e5efff" stroke="#c9d1db" stroke-width="1">
      <rect x="202" y="70" width="73.5" height="30" rx="4"/><rect x="279.5" y="70" width="73.5" height="30" rx="4"/><rect x="357" y="70" width="73.5" height="30" rx="4"/><rect x="434.5" y="70" width="73.5" height="30" rx="4"/><rect x="512" y="70" width="73.5" height="30" rx="4"/><rect x="589.5" y="70" width="73.5" height="30" rx="4"/><rect x="667" y="70" width="73.5" height="30" rx="4"/><rect x="744.5" y="70" width="73.5" height="30" rx="4"/>
