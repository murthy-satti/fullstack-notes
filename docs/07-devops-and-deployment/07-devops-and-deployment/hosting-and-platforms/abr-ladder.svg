      <rect x="680" y="286.25" width="48" height="33.75"/>
      <rect x="757.5" y="286.25" width="48" height="33.75"/>
    </g>
    <g font-size="11" fill="#463365" text-anchor="middle">
      <text x="239" y="300">2 Mbps</text>
      <text x="316.5" y="281">4.5 Mbps</text>
      <text x="394" y="262">7 Mbps</text>
      <text x="471.5" y="262">7 Mbps</text>
      <text x="549" y="307">1 Mbps</text>
      <text x="626.5" y="306">1.2 Mbps</text>
      <text x="704" y="281">4.5 Mbps</text>
      <text x="781.5" y="281">4.5 Mbps</text>
    </g>
    <path d="M200 320H820" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1">
      <path d="M200 320V326M277.5 320V326M355 320V326M432.5 320V326M510 320V326M587.5 320V326M665 320V326M742.5 320V326M820 320V326"/>
    </g>
    <g font-size="11" fill="#40566b" text-anchor="middle">
      <text x="200" y="340">0 s</text>
      <text x="277.5" y="340">4 s</text>
      <text x="355" y="340">8 s</text>
      <text x="432.5" y="340">12 s</text>
      <text x="510" y="340">16 s</text>
      <text x="587.5" y="340">20 s</text>
      <text x="665" y="340">24 s</text>
      <text x="742.5" y="340">28 s</text>
      <text x="820" y="340">32 s</text>
    </g>
    <text x="510" y="362" font-size="11.5" fill="#40566b" text-anchor="middle">playback time; switches happen only at segment boundaries</text>

    <text x="430" y="400" font-size="13" fill="#40566b" text-anchor="middle">The player picks a rung per segment, so keyframes must line up across every rendition.</text>
  </g>
</svg>
