    <path d="M238.75 165L316.25 125L393.75 85L471.25 85L548.75 205L626.25 205L703.75 125L781.25 125" fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#bd7a20">
      <circle cx="238.75" cy="165" r="4"/><circle cx="316.25" cy="125" r="4"/><circle cx="393.75" cy="85" r="4"/><circle cx="471.25" cy="85" r="4"/><circle cx="548.75" cy="205" r="4"/><circle cx="626.25" cy="205" r="4"/><circle cx="703.75" cy="125" r="4"/><circle cx="781.25" cy="125" r="4"/>
