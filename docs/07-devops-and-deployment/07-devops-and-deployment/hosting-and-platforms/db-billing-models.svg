<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="dbm-title dbm-desc">
  <title id="dbm-title">How provisioned, serverless-capacity, and per-request databases bill over one day</title>
  <desc id="dbm-desc">Three small charts share one day of TaskFlow traffic, drawn as a grey dashed curve that is low at night and peaks in the afternoon. Provisioned instance, such as RDS, Cloud SQL, or Atlas Dedicated: the cost per hour is a flat line sized for the peak, so quiet hours are paid for but unused. Serverless capacity, such as Aurora Serverless v2 or Neon: the cost follows the load in steps above a minimum floor, or drops to zero when paused. Per request, such as DynamoDB on-demand, Firestore, or Cosmos DB serverless: the cost follows operations exactly and is near zero at night. Below, the meters that apply to every model: storage per GB-month, I/O or request units, backups beyond the free allowance, egress and cross-zone transfer, and a second copy for high availability.</desc>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#40566b">Cost per hour across one day of traffic (grey dashed line)</text>

    <g stroke-width="2" fill="#ffffff">
      <rect x="24" y="46" width="260" height="214" rx="8" stroke="#4774aa"/>
      <rect x="300" y="46" width="260" height="214" rx="8" stroke="#8062a8"/>
      <rect x="576" y="46" width="260" height="214" rx="8" stroke="#53845b"/>
    </g>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="154" y="68" fill="#263e5a">Provisioned instance</text>
      <text x="430" y="68" fill="#463365">Serverless capacity</text>
      <text x="706" y="68" fill="#294a2e">Per request</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="154" y="84" fill="#263e5a">RDS, Cloud SQL, Atlas Dedicated</text>
      <text x="430" y="84" fill="#463365">Aurora Serverless v2, Neon</text>
      <text x="706" y="84" fill="#294a2e">DynamoDB on-demand, Firestore,</text>
      <text x="706" y="98" fill="#294a2e">Cosmos DB serverless</text>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M44 106V226H264"/>
      <path d="M320 106V226H540"/>
      <path d="M596 106V226H816"/>
    </g>
    <g font-size="10.5" fill="#60788d" text-anchor="middle">
      <text x="44" y="240">0:00</text><text x="154" y="240">12:00</text><text x="264" y="240">24:00</text>
      <text x="320" y="240">0:00</text><text x="430" y="240">12:00</text><text x="540" y="240">24:00</text>
      <text x="596" y="240">0:00</text><text x="706" y="240">12:00</text><text x="816" y="240">24:00</text>
    </g>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M44 214 74 216 104 210 124 186 154 146 184 136 214 156 244 196 264 210"/>
      <path d="M320 214 350 216 380 210 400 186 430 146 460 136 490 156 520 196 540 210"/>
    </g>
    <path d="M44 120H264" fill="none" stroke="#4774aa" stroke-width="3"/>
    <path d="M320 206H390V184H410V160H425V140H485V160H505V184H525V206H540" fill="none" stroke="#8062a8" stroke-width="3"/>
    <path d="M596 214 626 216 656 210 676 186 706 146 736 136 766 156 796 196 816 210" fill="none" stroke="#53845b" stroke-width="3"/>

    <rect x="80" y="196" width="112" height="14" fill="#ffffff"/>
    <text x="84" y="207" font-size="11" fill="#6e2a24">paid but unused</text>
    <text x="330" y="200" font-size="10.5" fill="#463365">floor (or 0)</text>
    <text x="600" y="203" font-size="10.5" fill="#294a2e">near zero</text>

    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="154" y="252">same price every hour</text>
      <text x="430" y="252">follows load in steps</text>
      <text x="706" y="252">follows operations exactly</text>
    </g>

    <text x="24" y="292" font-size="13" font-weight="700" fill="#40566b">Meters on every model</text>
    <g stroke-width="1.5" fill="#fff0d9" stroke="#bd7a20">
      <rect x="24" y="304" width="152" height="30" rx="15"/>
      <rect x="188" y="304" width="152" height="30" rx="15"/>
      <rect x="352" y="304" width="152" height="30" rx="15"/>
      <rect x="516" y="304" width="160" height="30" rx="15"/>
      <rect x="688" y="304" width="148" height="30" rx="15"/>
    </g>
    <g font-size="11.5" fill="#66400f" text-anchor="middle">
      <text x="100" y="323">storage per GB-month</text>
      <text x="264" y="323">I/O or request units</text>
      <text x="428" y="323">backups beyond free</text>
      <text x="596" y="323">egress and cross-zone</text>
      <text x="762" y="323">HA copy: about x2</text>
    </g>

    <text x="430" y="378" font-size="13" fill="#40566b" text-anchor="middle">Match the billing shape to the traffic shape: flat for steady load, elastic for spiky or idle load.</text>
  </g>
</svg>
