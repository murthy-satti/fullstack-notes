<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="dow-title dow-desc">
  <title id="dow-title">Deployment, ReplicaSets, and Pods</title>
  <desc id="dow-desc">The Deployment taskflow-api declares 3 replicas of image 1.4.0 with the RollingUpdate strategy. It owns two ReplicaSets. The current ReplicaSet, taskflow-api-7c9d8f, has the pod-template-hash 7c9d8f and 3 desired replicas, and it owns three Pods named taskflow-api-7c9d8f followed by a random suffix. The previous ReplicaSet, taskflow-api-5b6f4d, holds the old template with image 1.3.0 and is scaled to 0 Pods but kept for rollback; kubectl rollout undo scales it back up and the current one down. Every child carries an ownerReference to its parent, so deleting the Deployment deletes its ReplicaSets and Pods by cascading deletion.</desc>
  <defs>
    <marker id="dow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="24" width="280" height="72" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="46" font-size="14" font-weight="700" fill="#66400f">Deployment: taskflow-api</text>
    <text x="430" y="65" font-size="11.5" fill="#66400f">replicas: 3, image: taskflow-api:1.4.0</text>
    <text x="430" y="82" font-size="11.5" fill="#66400f">strategy: RollingUpdate</text>

    <rect x="80" y="140" width="300" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="230" y="163" font-size="13.5" font-weight="700" fill="#463365">ReplicaSet taskflow-api-7c9d8f</text>
    <text x="230" y="183" font-size="11.5" fill="#463365">current template (1.4.0), desired 3</text>

    <rect x="480" y="140" width="300" height="60" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="630" y="163" font-size="13.5" font-weight="700" fill="#36424e">ReplicaSet taskflow-api-5b6f4d</text>
    <text x="630" y="183" font-size="11.5" fill="#36424e">previous template (1.3.0), desired 0</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M380 96V118H230V138" marker-end="url(#dow-arrow)"/>
      <path d="M480 96V118H630V138" marker-end="url(#dow-arrow)"/>
      <path d="M230 200V224H94V248" marker-end="url(#dow-arrow)"/>
      <path d="M230 200V248" marker-end="url(#dow-arrow)"/>
      <path d="M230 224H366V248" marker-end="url(#dow-arrow)"/>
    </g>
    <rect x="404" y="111" width="52" height="14" fill="#f5f7fb"/>
    <text x="430" y="122" font-size="11.5" font-weight="700" fill="#40566b">owns</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="30" y="250" width="128" height="52" rx="8"/>
      <rect x="166" y="250" width="128" height="52" rx="8"/>
      <rect x="302" y="250" width="128" height="52" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="94" y="272" font-size="13" font-weight="700">Pod</text>
      <text x="94" y="290" font-size="11.5">7c9d8f-x2k4p</text>
      <text x="230" y="272" font-size="13" font-weight="700">Pod</text>
      <text x="230" y="290" font-size="11.5">7c9d8f-9qv7m</text>
      <text x="366" y="272" font-size="13" font-weight="700">Pod</text>
      <text x="366" y="290" font-size="11.5">7c9d8f-hz5ln</text>
    </g>

    <rect x="480" y="236" width="300" height="74" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="630" y="258" font-size="12" font-weight="700" fill="#36424e">0 Pods, kept for rollback</text>
    <text x="630" y="277" font-size="11.5" fill="#36424e">kubectl rollout undo scales this one up</text>
    <text x="630" y="294" font-size="11.5" fill="#36424e">and the current one down</text>
    <path d="M630 200V234" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4"/>

    <path d="M24 330H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="354" font-size="11.5" fill="#36424e" text-anchor="start">Each child has an ownerReference to its parent: deleting the Deployment deletes its ReplicaSets and Pods (cascading delete).</text>
    <text x="430" y="392" font-size="13" fill="#40566b">You manage the Deployment; it manages ReplicaSets; each ReplicaSet keeps its Pod count.</text>
  </g>
</svg>
