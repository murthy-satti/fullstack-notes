<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="rus-title rus-desc">
  <title id="rus-title">A rolling update of 4 replicas with maxSurge 1 and maxUnavailable 1</title>
  <desc id="rus-desc">A Deployment with 4 replicas uses the default maxSurge of 25 percent, which rounds up to 1 Pod, and maxUnavailable of 25 percent, which rounds down to 1 Pod, so at most 5 Pods exist and at least 3 are available. Step 0: four v1 Pods are ready. Step 1: the controller creates one v2 Pod, which is starting, and stops one v1 Pod; three v1 Pods are available. Step 2: the first v2 Pod is ready, so another v2 Pod starts and another v1 Pod stops; two v1 and one v2 are available. Step 3: one v1 and two v2 are available while a third v2 starts and a v1 stops. Step 4: three v2 are available while the fourth v2 starts and the last v1 stops. Step 5: four v2 Pods are ready and the rollout is complete. A new Pod counts as available only after its readiness probe passes and minReadySeconds have elapsed, so a v2 that never becomes ready stops the rollout with three Pods still serving.</desc>
  <rect width="860" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">replicas 4, maxSurge 25% = 1 (rounded up), maxUnavailable 25% = 1 (rounded down)</text>
    <text x="24" y="52" font-size="12" fill="#36424e" text-anchor="start">So: at most 4 + 1 = 5 Pods exist, and at least 4 − 1 = 3 are available at every moment.</text>

    <g font-size="12.5" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="95">step 0</text>
      <text x="24" y="149">step 1</text>
      <text x="24" y="203">step 2</text>
      <text x="24" y="257">step 3</text>
      <text x="24" y="311">step 4</text>
      <text x="24" y="365">step 5</text>
    </g>

    <g stroke-width="1.5">
      <rect x="100" y="72" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="210" y="72" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="320" y="72" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="430" y="72" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>

      <rect x="100" y="126" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="210" y="126" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="320" y="126" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="430" y="126" width="100" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-dasharray="5 4"/>
      <rect x="540" y="126" width="100" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-dasharray="5 4"/>

      <rect x="100" y="180" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="210" y="180" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="320" y="180" width="100" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-dasharray="5 4"/>
      <rect x="430" y="180" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="540" y="180" width="100" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-dasharray="5 4"/>

      <rect x="100" y="234" width="100" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="210" y="234" width="100" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-dasharray="5 4"/>
      <rect x="320" y="234" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="430" y="234" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="540" y="234" width="100" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-dasharray="5 4"/>

      <rect x="100" y="288" width="100" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-dasharray="5 4"/>
      <rect x="210" y="288" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="320" y="288" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="430" y="288" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="540" y="288" width="100" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-dasharray="5 4"/>

      <rect x="100" y="342" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="210" y="342" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="320" y="342" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="430" y="342" width="100" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>

    <g font-size="12" font-weight="700">
      <g fill="#263e5a">
        <text x="150" y="95">v1 ready</text>
        <text x="260" y="95">v1 ready</text>
        <text x="370" y="95">v1 ready</text>
        <text x="480" y="95">v1 ready</text>
        <text x="150" y="149">v1 ready</text>
        <text x="260" y="149">v1 ready</text>
        <text x="370" y="149">v1 ready</text>
        <text x="150" y="203">v1 ready</text>
        <text x="260" y="203">v1 ready</text>
        <text x="150" y="257">v1 ready</text>
      </g>
      <g fill="#6e2a24">
        <text x="480" y="149">v1 stopping</text>
        <text x="370" y="203">v1 stopping</text>
        <text x="260" y="257">v1 stopping</text>
        <text x="150" y="311">v1 stopping</text>
      </g>
      <g fill="#66400f">
        <text x="590" y="149">v2 starting</text>
        <text x="590" y="203">v2 starting</text>
        <text x="590" y="257">v2 starting</text>
        <text x="590" y="311">v2 starting</text>
      </g>
      <g fill="#294a2e">
        <text x="480" y="203">v2 ready</text>
        <text x="370" y="257">v2 ready</text>
        <text x="480" y="257">v2 ready</text>
        <text x="260" y="311">v2 ready</text>
        <text x="370" y="311">v2 ready</text>
        <text x="480" y="311">v2 ready</text>
        <text x="150" y="365">v2 ready</text>
        <text x="260" y="365">v2 ready</text>
        <text x="370" y="365">v2 ready</text>
        <text x="480" y="365">v2 ready</text>
      </g>
    </g>

    <g font-size="12" text-anchor="start" fill="#36424e">
      <text x="664" y="95"><tspan font-weight="700">4</tspan> available</text>
      <text x="664" y="149"><tspan font-weight="700">3</tspan> available, 5 Pods</text>
      <text x="664" y="203"><tspan font-weight="700">3</tspan> available, 5 Pods</text>
      <text x="664" y="257"><tspan font-weight="700">3</tspan> available, 5 Pods</text>
      <text x="664" y="311"><tspan font-weight="700">3</tspan> available, 5 Pods</text>
      <text x="664" y="365" fill="#294a2e"><tspan font-weight="700">4</tspan> available: done</text>
    </g>

    <path d="M24 396H836" stroke="#c9d1db" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="420">A v2 Pod counts as available only after its readiness probe passes (and minReadySeconds elapse).</text>
      <text x="24" y="438">If v2 never becomes ready, the rollout stops at step 1 with three v1 Pods still serving.</text>
    </g>
    <text x="430" y="480" font-size="13" fill="#40566b">maxSurge buys speed with extra capacity; maxUnavailable buys speed with less capacity.</text>
  </g>
</svg>
