<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="hcr-title hcr-desc">
  <title id="hcr-title">From a Helm chart and values to a release</title>
  <desc id="hcr-desc">The chart taskflow-api contains Chart.yaml with its name and version, values.yaml with default values, and templates for the Deployment, Service, and HPA plus a _helpers.tpl file. Environment values come from values-production.yaml and a --set image.tag=1.5.0 flag; precedence is the chart's values.yaml, then -f files in order, then --set. helm upgrade --install merges the values and renders the templates into plain Kubernetes manifests (Deployment, Service, HPA), which are sent to the Kubernetes API and applied. Helm records each revision of the release taskflow-api as a Secret in the namespace: revision 1 with 1.4.0 and revision 2 with 1.4.1 are superseded, and revision 3 with 1.5.0 is deployed. helm rollback taskflow-api 2 re-applies revision 2's manifests and records the result as revision 4.</desc>
  <defs>
    <marker id="hcr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="hcr-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="30" width="240" height="196" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="144" y="54" font-size="13.5" font-weight="700" fill="#66400f">chart: taskflow-api/</text>
    <g font-size="11.5" fill="#66400f" text-anchor="start">
      <text x="40" y="82">Chart.yaml (name, version)</text>
      <text x="40" y="104">values.yaml (defaults)</text>
      <text x="40" y="126">templates/deployment.yaml</text>
      <text x="40" y="148">templates/service.yaml</text>
      <text x="40" y="170">templates/hpa.yaml</text>
      <text x="40" y="192">templates/_helpers.tpl</text>
    </g>

    <rect x="24" y="250" width="240" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="144" y="274" font-size="12.5" font-weight="700" fill="#463365">-f values-production.yaml</text>
    <text x="144" y="296" font-size="12" font-weight="700" fill="#463365">--set image.tag=1.5.0</text>
    <g font-size="11" fill="#36424e">
      <text x="144" y="342">precedence: chart values.yaml,</text>
      <text x="144" y="358">then -f files in order, then --set</text>
    </g>

    <rect x="320" y="130" width="210" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="425" y="156" font-size="13.5" font-weight="700" fill="#263e5a">helm upgrade --install</text>
    <text x="425" y="176" font-size="11.5" fill="#263e5a">merge values, render the</text>
    <text x="425" y="193" font-size="11.5" fill="#263e5a">templates into manifests</text>

    <rect x="590" y="30" width="246" height="64" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="2"/>
    <text x="713" y="54" font-size="13" font-weight="700" fill="#36424e">rendered manifests</text>
    <text x="713" y="74" font-size="11.5" fill="#36424e">Deployment, Service, HPA (plain YAML)</text>

    <rect x="590" y="128" width="246" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="713" y="151" font-size="13" font-weight="700" fill="#263e5a">Kubernetes API</text>
    <text x="713" y="170" font-size="11.5" fill="#263e5a">objects created or updated</text>

    <rect x="590" y="220" width="246" height="128" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="713" y="243" font-size="12.5" font-weight="700" fill="#294a2e">release taskflow-api (history)</text>
    <g font-size="11.5" text-anchor="start">
      <text x="606" y="268" fill="#36424e">rev 1: 1.4.0, superseded</text>
      <text x="606" y="288" fill="#36424e">rev 2: 1.4.1, superseded</text>
      <text x="606" y="308" fill="#294a2e" font-weight="700">rev 3: 1.5.0, deployed</text>
      <text x="606" y="332" fill="#36424e">stored as Secrets in the namespace</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M264 150H318" marker-end="url(#hcr-arrow)"/>
      <path d="M264 285H292V190H318" marker-end="url(#hcr-arrow)"/>
      <path d="M530 150H560V62H588" marker-end="url(#hcr-arrow)"/>
      <path d="M713 94V126" marker-end="url(#hcr-arrow)"/>
    </g>
    <path d="M530 190H560V284H588" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#hcr-arrow-ret)"/>
    <text x="552" y="246" font-size="11" fill="#36424e" text-anchor="end">records</text>
    <text x="552" y="262" font-size="11" fill="#36424e" text-anchor="end">revision</text>

    <rect x="320" y="376" width="516" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="578" y="401" font-size="12" fill="#6e2a24">helm rollback taskflow-api 2: re-applies revision 2, recorded as revision 4</text>

    <text x="430" y="444" font-size="13" fill="#40566b">A chart is a template; values make it an environment; each install or upgrade is a revision.</text>
  </g>
</svg>
