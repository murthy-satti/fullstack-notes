<svg xmlns="http://www.w3.org/2000/svg" width="880" height="466" viewBox="0 0 880 466" role="img" aria-labelledby="dct-title dct-desc">
  <title id="dct-title">The DNSSEC chain of trust from the root to a record</title>
  <desc id="dct-desc">Three zones stacked from top to bottom. Root zone: the root DNSKEY, which validating resolvers already trust as their trust anchor, signs the root's DS record for .com. The .com zone: the .com DNSKEY's hash matches the root's DS record, and that key signs the DS record for example.com, which came from your registrar. The example.com zone: the example.com DNSKEY's hash matches the .com DS record, and that key signs an RRSIG over each record set, such as the A records for api.example.com. On the right, the validating resolver starts from the root key it already trusts, checks each signature and each DS hash down to the record, and returns SERVFAIL if any link is broken; DNSSEC signs answers but does not encrypt them. At the bottom, the typical failure: the DS at .com no longer matches example.com's DNSKEY, for example after a DNS provider change, so validating resolvers answer SERVFAIL until the DS is fixed and the cached DS expires.</desc>
  <defs>
    <marker id="dct-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="466" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#c9d1db" stroke-width="1.5">
      <rect x="24" y="24" width="576" height="96" rx="10"/>
      <rect x="24" y="150" width="576" height="96" rx="10"/>
      <rect x="24" y="276" width="576" height="96" rx="10"/>
    </g>
    <g font-size="13" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="40" y="44">Root zone (.)</text>
      <text x="40" y="170">.com zone</text>
      <text x="40" y="296">example.com zone</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="40" y="56" width="220" height="50" rx="8"/>
      <rect x="40" y="182" width="220" height="50" rx="8"/>
      <rect x="40" y="308" width="220" height="50" rx="8"/>
    </g>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="360" y="56" width="220" height="50" rx="8"/>
      <rect x="360" y="182" width="220" height="50" rx="8"/>
    </g>
    <rect x="360" y="308" width="220" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>

    <g font-size="13" font-weight="700">
      <text x="150" y="77" fill="#263e5a">root DNSKEY</text>
      <text x="150" y="203" fill="#263e5a">.com DNSKEY</text>
      <text x="150" y="329" fill="#263e5a">example.com DNSKEY</text>
      <text x="470" y="77" fill="#463365">DS for .com</text>
      <text x="470" y="203" fill="#463365">DS for example.com</text>
      <text x="470" y="329" fill="#294a2e">RRSIG over api A</text>
    </g>
    <g font-size="11.5">
      <text x="150" y="95" fill="#263e5a">trust anchor in resolvers</text>
      <text x="150" y="221" fill="#263e5a">hash matches the root's DS</text>
      <text x="150" y="347" fill="#263e5a">hash matches the .com DS</text>
      <text x="470" y="95" fill="#463365">signed by the root key</text>
      <text x="470" y="221" fill="#463365">sent by your registrar</text>
      <text x="470" y="347" fill="#294a2e">signs each record set</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 81H358" marker-end="url(#dct-arrow)"/>
      <path d="M260 207H358" marker-end="url(#dct-arrow)"/>
      <path d="M260 333H358" marker-end="url(#dct-arrow)"/>
      <path d="M470 106V130H200V180" marker-end="url(#dct-arrow)"/>
      <path d="M470 232V256H200V306" marker-end="url(#dct-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="309" y="74">signs</text>
      <text x="309" y="200">signs</text>
      <text x="309" y="326">signs</text>
      <text x="335" y="144">DS hash must match</text>
      <text x="335" y="270">DS hash must match</text>
    </g>

    <rect x="630" y="24" width="226" height="348" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="743" y="52" font-size="14" font-weight="700" fill="#66400f">Validating resolver</text>
    <g font-size="11.5" fill="#66400f">
      <text x="743" y="84">starts from the root key</text>
      <text x="743" y="100">it already trusts</text>
      <text x="743" y="136">checks each signature</text>
      <text x="743" y="152">and each DS hash</text>
      <text x="743" y="168">down to the record</text>
      <text x="743" y="204">one broken link:</text>
      <text x="743" y="220" font-weight="700">SERVFAIL, no answer</text>
      <text x="743" y="256">non-validating resolvers</text>
      <text x="743" y="272">still answer normally</text>
      <text x="743" y="308">DNSSEC signs answers;</text>
      <text x="743" y="324">it does not encrypt them</text>
    </g>

    <rect x="24" y="386" width="832" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="40" y="404" font-size="12" font-weight="700" fill="#6e2a24" text-anchor="start">Typical failure: after a DNS provider change, the DS at .com no longer matches the zone's DNSKEY.</text>
    <text x="40" y="421" font-size="11.5" fill="#6e2a24" text-anchor="start">Validating resolvers return SERVFAIL until the DS is fixed and the cached DS expires (24 hours at .com).</text>

    <text x="440" y="454" font-size="13" fill="#40566b">Each parent vouches for its child's key with a DS record; resolvers validate from the root down.</text>
  </g>
</svg>
