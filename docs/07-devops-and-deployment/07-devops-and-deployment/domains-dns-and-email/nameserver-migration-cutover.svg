<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="nmc-title nmc-desc">
  <title id="nmc-title">Moving a zone to a new DNS provider</title>
  <desc id="nmc-desc">Five steps in a row. 1, copy: export or list every record at the old provider, translate provider-specific records, and import them into the new provider. 2, compare: query both providers' nameservers for every name and type. 3, DNSSEC: if the zone is signed, remove the DS record at the registrar and wait at least a day. 4, switch: change the nameservers at the registrar. 5, finish: after the delegation TTL plus a margin, sign the zone at the new provider, publish its DS, and delete the old zone. Below, the overlap: before the switch the old provider serves all traffic and the new zone is imported but receives no queries. After the switch at step 4, for up to two days resolvers that still cache the old .com delegation keep asking the old provider while the rest ask the new one, so both zones must stay identical: apply every change to both, or freeze changes. After the overlap the old provider receives no queries and the new one serves everything.</desc>
  <defs>
    <marker id="nmc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="24" y="24" width="152" height="70" rx="8"/>
      <rect x="194" y="24" width="152" height="70" rx="8"/>
      <rect x="534" y="24" width="152" height="70" rx="8"/>
      <rect x="704" y="24" width="152" height="70" rx="8"/>
    </g>
    <rect x="364" y="24" width="152" height="70" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g font-size="13" font-weight="700">
      <text x="100" y="46" fill="#263e5a">1. Copy</text>
      <text x="270" y="46" fill="#263e5a">2. Compare</text>
      <text x="440" y="46" fill="#6e2a24">3. DNSSEC first</text>
      <text x="610" y="46" fill="#263e5a">4. Switch NS</text>
      <text x="780" y="46" fill="#263e5a">5. Finish</text>
    </g>
    <g font-size="11.5">
      <text x="100" y="66" fill="#263e5a">export, translate,</text>
      <text x="100" y="82" fill="#263e5a">import every record</text>
      <text x="270" y="66" fill="#263e5a">dig both providers</text>
      <text x="270" y="82" fill="#263e5a">for every name</text>
      <text x="440" y="66" fill="#6e2a24">remove the DS,</text>
      <text x="440" y="82" fill="#6e2a24">wait a day</text>
      <text x="610" y="66" fill="#263e5a">new nameservers</text>
      <text x="610" y="82" fill="#263e5a">at the registrar</text>
      <text x="780" y="66" fill="#263e5a">sign, new DS,</text>
      <text x="780" y="82" fill="#263e5a">delete old zone</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M176 59H192" marker-end="url(#nmc-arrow)"/>
      <path d="M346 59H362" marker-end="url(#nmc-arrow)"/>
      <path d="M516 59H532" marker-end="url(#nmc-arrow)"/>
      <path d="M686 59H702" marker-end="url(#nmc-arrow)"/>
    </g>

    <text x="24" y="134" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Who answers queries for example.com</text>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="170">old</text>
      <text x="24" y="186">provider</text>
      <text x="24" y="228">new</text>
      <text x="24" y="244">provider</text>
    </g>

    <rect x="96" y="158" width="234" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="330" y="158" width="380" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="710" y="158" width="146" height="34" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="213" y="180" font-size="11.5" fill="#263e5a">all traffic</text>
    <text x="520" y="180" font-size="11.5" fill="#263e5a">resolvers with the old delegation cached</text>
    <text x="783" y="180" font-size="11.5" fill="#36424e">no queries</text>

    <rect x="96" y="216" width="234" height="34" rx="6" fill="#f5f7fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="330" y="216" width="380" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="710" y="216" width="146" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="213" y="238" font-size="11.5" fill="#463365">imported, no queries yet</text>
    <text x="520" y="238" font-size="11.5" fill="#463365">a growing share of resolvers</text>
    <text x="783" y="238" font-size="11.5" fill="#463365">all traffic</text>

    <path d="M330 104V268" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M610 94V104H330" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M710 148V268" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="338" y="124" font-size="11" font-style="italic" fill="#6e2a24" text-anchor="start">NS change at the registrar</text>

    <path d="M330 284H710" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <path d="M330 276V292" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <path d="M710 276V292" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <text x="520" y="306" font-size="12" font-weight="700" fill="#6e2a24">overlap: up to 2 days (.com delegation TTL)</text>
    <text x="520" y="322" font-size="11.5" fill="#36424e">both zones must stay identical: change both, or freeze</text>

    <text x="440" y="366" font-size="13" fill="#40566b">The registry's delegation is cached for up to two days, so both providers answer during the overlap.</text>
  </g>
</svg>
