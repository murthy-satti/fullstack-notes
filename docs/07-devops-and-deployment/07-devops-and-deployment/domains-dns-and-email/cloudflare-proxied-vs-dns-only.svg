<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="cpd-title cpd-desc">
  <title id="cpd-title">A Cloudflare DNS-only record compared with a proxied record</title>
  <desc id="cpd-desc">Left, DNS only (grey cloud): the browser asks for www.example.com and DNS returns the origin's address 203.0.113.10 with the TTL you set; the browser connects straight to the origin server, which terminates TLS with its own certificate and sees the real client IP; nothing filters or caches the traffic. Right, proxied (orange cloud): DNS returns Cloudflare anycast addresses with an automatic 300-second TTL; the browser connects to the nearest Cloudflare location, which terminates TLS with an edge certificate and applies caching, WAF, and DDoS rules; Cloudflare then connects to the origin according to the SSL/TLS mode, and Full (strict) validates the origin certificate; the origin sees the visitor's IP in the CF-Connecting-IP header. Bottom note: MX and TXT records are always DNS-only, only HTTP and HTTPS traffic is proxied, and a DNS-only record on the origin's IP reveals it.</desc>
  <defs>
    <marker id="cpd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="452" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="222" y="32" font-size="13" font-weight="700" fill="#40566b">DNS only (grey cloud)</text>
    <text x="658" y="32" font-size="13" font-weight="700" fill="#40566b">Proxied (orange cloud)</text>
    <path d="M440 18V340" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="122" y="44" width="200" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="222" y="69" font-size="14" font-weight="700" fill="#66400f">Browser</text>
    <rect x="558" y="44" width="200" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="658" y="69" font-size="14" font-weight="700" fill="#66400f">Browser</text>

    <rect x="72" y="104" width="300" height="34" rx="17" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="222" y="126" font-size="12" fill="#36424e">DNS answer: 203.0.113.10, your TTL</text>
    <rect x="508" y="104" width="300" height="34" rx="17" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="658" y="126" font-size="12" fill="#36424e">DNS answer: anycast IPs, TTL 300</text>

    <rect x="72" y="160" width="300" height="70" rx="8" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="222" y="190" font-size="12" font-style="italic" fill="#40566b">nothing in between:</text>
    <text x="222" y="208" font-size="12" font-style="italic" fill="#40566b">no cache, no WAF, no DDoS filter</text>

    <rect x="508" y="160" width="300" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="658" y="184" font-size="14" font-weight="700" fill="#463365">Cloudflare edge</text>
    <text x="658" y="203" font-size="11.5" fill="#463365">TLS with an edge certificate</text>
    <text x="658" y="219" font-size="11.5" fill="#463365">cache, WAF, and DDoS rules</text>

    <rect x="72" y="252" width="300" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="222" y="276" font-size="14" font-weight="700" fill="#263e5a">Origin server</text>
    <text x="222" y="295" font-size="11.5" fill="#263e5a">TLS with its own certificate</text>
    <text x="222" y="311" font-size="11.5" fill="#263e5a">sees the real client IP</text>

    <rect x="508" y="252" width="300" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="658" y="276" font-size="14" font-weight="700" fill="#263e5a">Origin server</text>
    <text x="658" y="295" font-size="11.5" fill="#263e5a">Full (strict): validated HTTPS</text>
    <text x="658" y="311" font-size="11.5" fill="#263e5a">client IP in CF-Connecting-IP</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M222 84V102" marker-end="url(#cpd-arrow)"/>
      <path d="M658 84V102" marker-end="url(#cpd-arrow)"/>
      <path d="M658 138V158" marker-end="url(#cpd-arrow)"/>
      <path d="M658 230V250" marker-end="url(#cpd-arrow)"/>
    </g>
    <path d="M222 138V158" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round"/>
    <path d="M222 230V250" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#cpd-arrow)"/>

    <rect x="24" y="350" width="832" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="440" y="370" font-size="12" fill="#6e2a24">MX and TXT records are always DNS-only, and only HTTP and HTTPS traffic is proxied.</text>
    <text x="440" y="388" font-size="12" fill="#6e2a24">A DNS-only record on the origin's IP reveals it: allow only Cloudflare's ranges at the origin.</text>

    <text x="440" y="432" font-size="13" fill="#40566b">Proxying changes the DNS answer, where TLS ends, and what the origin sees; plan for all three.</text>
  </g>
</svg>
