<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="cbp-title cbp-desc">
  <title id="cbp-title">Cache behaviors chosen by path pattern</title>
  <desc id="cbp-desc">A request at the edge is matched against path patterns in order, and the first match wins. 1, /api/public/* goes to the API origin with a shared cache of 60 seconds and stale-while-revalidate, keyed on path and query. 2, /api/* goes to the API origin with caching disabled; Authorization and cookies are forwarded and nothing is stored. 3, /images/* is resized at the edge and cached, with only allowed widths and formats, which are part of the key. 4, /assets/* goes to the S3 origin and is cached for a year because the names are hashed and immutable; the key is the path only. 5, the default pattern, including / and /index.html, goes to the S3 origin with no-cache, so the HTML is revalidated on every request. Personal API paths bypass the cache entirely.</desc>
  <defs>
    <marker id="cbp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="334" y="28" font-size="12" font-weight="700" fill="#40566b">path patterns, first match wins</text>
    <text x="663" y="28" font-size="12" font-weight="700" fill="#40566b">what the edge does</text>

    <rect x="24" y="178" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="202" font-size="14" font-weight="700" fill="#66400f">Request</text>
    <text x="99" y="220" font-size="11.5" fill="#66400f">at the edge</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="244" y="40" width="180" height="56" rx="8"/>
      <rect x="244" y="112" width="180" height="56" rx="8"/>
      <rect x="244" y="184" width="180" height="56" rx="8"/>
      <rect x="244" y="256" width="180" height="56" rx="8"/>
      <rect x="244" y="328" width="180" height="56" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="334" y="73">1. /api/public/*</text>
      <text x="334" y="145">2. /api/*</text>
      <text x="334" y="217">3. /images/*</text>
      <text x="334" y="289">4. /assets/*</text>
      <text x="334" y="361">5. default (*)</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="1.8" stroke-linecap="round">
      <path d="M174 196 242 70" marker-end="url(#cbp-arrow)"/>
      <path d="M174 201 242 142" marker-end="url(#cbp-arrow)"/>
      <path d="M174 206H242" marker-end="url(#cbp-arrow)"/>
      <path d="M174 211 242 282" marker-end="url(#cbp-arrow)"/>
      <path d="M174 216 242 354" marker-end="url(#cbp-arrow)"/>
      <path d="M424 68H468" marker-end="url(#cbp-arrow)"/>
      <path d="M424 140H468" marker-end="url(#cbp-arrow)"/>
      <path d="M424 212H468" marker-end="url(#cbp-arrow)"/>
      <path d="M424 284H468" marker-end="url(#cbp-arrow)"/>
      <path d="M424 356H468" marker-end="url(#cbp-arrow)"/>
    </g>

    <rect x="470" y="40" width="386" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="470" y="112" width="386" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="470" y="184" width="386" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="470" y="256" width="386" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="470" y="328" width="386" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="13" font-weight="700">
      <text x="663" y="62" fill="#463365">API origin, shared cache for 60 s</text>
      <text x="663" y="134" fill="#6e2a24">API origin, caching disabled</text>
      <text x="663" y="206" fill="#294a2e">Resize at the edge, then cache</text>
      <text x="663" y="278" fill="#294a2e">S3 origin, cached for a year</text>
      <text x="663" y="350" fill="#263e5a">S3 origin, no-cache HTML</text>
    </g>
    <g font-size="11">
      <text x="663" y="82" fill="#463365">s-maxage=60, stale-while-revalidate; key: path + query</text>
      <text x="663" y="154" fill="#6e2a24">Authorization and cookies forwarded; never stored</text>
      <text x="663" y="226" fill="#294a2e">allowed widths and formats only; they are in the key</text>
      <text x="663" y="298" fill="#294a2e">hashed names, immutable; key: path only</text>
      <text x="663" y="370" fill="#263e5a">/ and /index.html revalidated on every request</text>
    </g>

    <text x="440" y="414" font-size="13" fill="#40566b">Each path gets its own TTL, key, and origin; personal API paths bypass the cache entirely.</text>
  </g>
</svg>
