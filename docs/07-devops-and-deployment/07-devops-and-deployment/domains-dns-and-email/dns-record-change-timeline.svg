<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-labelledby="drc-title drc-desc">
  <title id="drc-title">Changing a DNS record with zero downtime</title>
  <desc id="drc-desc">A timeline, not to scale, for moving api.example.com from an old load balancer to a new one. At T minus 48 hours the TTL is lowered from 86400 to 300 seconds; until T minus 24 hours, resolvers may still hold copies cached with the long TTL. From T minus 24 hours the short TTL is in place everywhere and the change is ready. At T minus 1 hour the new load balancer is tested with curl --resolve and receives only test traffic. At T0 the record is changed; during the next 300 seconds resolvers switch one by one, so both load balancers receive traffic. After T0 plus 300 seconds every resolver sees the new address; the old load balancer stays up but idle as a safety net. At T plus 1 day the TTL is raised again and the old load balancer is retired.</desc>
  <defs>
    <marker id="drc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="372" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Moving api.example.com to a new load balancer (time not to scale)</text>

    <rect x="70" y="44" width="178" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="252" y="44" width="266" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="522" y="44" width="116" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="642" y="44" width="136" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <g font-size="12" font-weight="700">
      <text x="159" y="66" fill="#66400f">long-TTL copies</text>
      <text x="385" y="66" fill="#294a2e">short TTL in place</text>
      <text x="580" y="66" fill="#463365">both LBs</text>
      <text x="710" y="66" fill="#36424e">old LB idle</text>
    </g>
    <g font-size="11.5">
      <text x="159" y="84" fill="#66400f">may still be cached</text>
      <text x="385" y="84" fill="#294a2e">caches turn over in 300 s</text>
      <text x="580" y="84" fill="#463365">get traffic</text>
      <text x="710" y="84" fill="#36424e">a safety net</text>
    </g>

    <path d="M40 124H852" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-end="url(#drc-arrow)"/>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M70 116V132"/>
      <path d="M250 116V132"/>
      <path d="M400 116V132"/>
      <path d="M520 116V132"/>
      <path d="M640 116V132"/>
      <path d="M780 116V132"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="70" y="150">T-48h</text>
      <text x="250" y="150">T-24h</text>
      <text x="400" y="150">T-1h</text>
      <text x="520" y="150">T0</text>
      <text x="640" y="150">T0 + 300 s</text>
      <text x="780" y="150">T+1 day</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="70" y="168">lower TTL</text>
      <text x="70" y="183">86400 to 300</text>
      <text x="250" y="168">old copies</text>
      <text x="250" y="183">have expired</text>
      <text x="400" y="168">test with</text>
      <text x="400" y="183">curl --resolve</text>
      <text x="520" y="168">change the</text>
      <text x="520" y="183">record</text>
      <text x="640" y="168">all resolvers</text>
      <text x="640" y="183">see the new IP</text>
      <text x="780" y="168">raise TTL,</text>
      <text x="780" y="183">retire old LB</text>
    </g>

    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="230">old LB</text>
      <text x="24" y="272">new LB</text>
    </g>
    <rect x="70" y="214" width="570" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="640" y="214" width="140" height="24" rx="6" fill="#f5f7fb" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="355" y="231" font-size="11.5" fill="#263e5a">serves all traffic, then a falling share</text>
    <text x="710" y="231" font-size="11.5" fill="#263e5a">up, no traffic</text>

    <rect x="400" y="256" width="120" height="24" rx="6" fill="#f5f7fb" stroke="#53845b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="520" y="256" width="336" height="24" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="460" y="273" font-size="11.5" fill="#294a2e">test traffic</text>
    <text x="688" y="273" font-size="11.5" fill="#294a2e">serves a growing share, then everything</text>

    <path d="M520 200V292" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="440" y="324" font-size="13" fill="#40566b">Lower the TTL one old TTL ahead, switch, and keep the old target until its traffic is gone.</text>
    <text x="440" y="344" font-size="13" fill="#40566b">The worst case after the switch is one new TTL (300 s), not one old TTL (a day).</text>
  </g>
</svg>
