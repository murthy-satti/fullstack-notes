<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="ctp-title ctp-desc">
  <title id="ctp-title">Where contract tests run in per-service pipelines</title>
  <desc id="ctp-desc">Two independent pipelines share a Pact Broker. The consumer pipeline for TaskFlow Web runs unit and pact tests, publishes the pact with the commit SHA as its version and its branch, asks the broker can-i-deploy to production, deploys taskflow-web, and records the deployment. The provider pipeline for the tasks API runs unit tests, verifies the pacts of the consumers' main branch and of every deployed or released consumer version and publishes the results, asks can-i-deploy to production, deploys tasks-api, and records the deployment. The broker stores the pacts, the verification results, and which version of each service is deployed in each environment, so every can-i-deploy answer is based on what is actually running. When a pact changes, the broker can trigger the provider's verification through a webhook. Each pipeline asks the broker before it deploys and tells it afterwards.</desc>
  <defs>
    <marker id="ctp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ctp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Contract tests in two independent pipelines</text>
    <text x="24" y="52" font-size="12" font-weight="700" fill="#66400f">TaskFlow Web pipeline (consumer)</text>

    <g stroke-width="2">
      <rect x="24" y="60" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="194" y="60" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="364" y="60" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="534" y="60" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="704" y="60" width="150" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="36" y="80">test</text>
      <text x="206" y="80">publish pact</text>
      <text x="376" y="80">can-i-deploy</text>
      <text x="546" y="80">deploy</text>
      <text x="716" y="80">record</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="36" y="98">unit and pact tests</text>
      <text x="206" y="98">version = commit SHA</text>
      <text x="376" y="98">to production?</text>
      <text x="546" y="98">taskflow-web</text>
      <text x="716" y="98">record-deployment</text>
    </g>

    <rect x="270" y="164" width="340" height="62" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="440" y="186" font-size="14" font-weight="700" fill="#463365" text-anchor="middle">Pact Broker</text>
    <text x="440" y="204" font-size="11.5" fill="#463365" text-anchor="middle">pacts, verification results, and which</text>
    <text x="440" y="219" font-size="11.5" fill="#463365" text-anchor="middle">version is deployed in which environment</text>

    <g stroke-width="2">
      <rect x="24" y="282" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="194" y="282" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="364" y="282" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="534" y="282" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="704" y="282" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="36" y="302">test</text>
      <text x="206" y="302">verify pacts</text>
      <text x="376" y="302">can-i-deploy</text>
      <text x="546" y="302">deploy</text>
      <text x="716" y="302">record</text>
    </g>
    <g font-size="11" fill="#263e5a">
      <text x="36" y="320">unit tests</text>
      <text x="206" y="320">main + deployed/released</text>
      <text x="376" y="320">to production?</text>
      <text x="546" y="320">tasks-api</text>
      <text x="716" y="320">record-deployment</text>
    </g>
    <text x="24" y="352" font-size="12" font-weight="700" fill="#263e5a">Tasks API pipeline (provider)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 85H192" marker-end="url(#ctp-arrow)"/>
      <path d="M344 85H362" marker-end="url(#ctp-arrow)"/>
      <path d="M514 85H532" marker-end="url(#ctp-arrow)"/>
      <path d="M684 85H702" marker-end="url(#ctp-arrow)"/>
      <path d="M174 307H192" marker-end="url(#ctp-arrow)"/>
      <path d="M344 307H362" marker-end="url(#ctp-arrow)"/>
      <path d="M514 307H532" marker-end="url(#ctp-arrow)"/>
      <path d="M684 307H702" marker-end="url(#ctp-arrow)"/>

      <path d="M269 110 300 162" marker-end="url(#ctp-arrow)"/>
      <path d="M779 110 604 162" marker-end="url(#ctp-arrow)"/>
      <path d="M330 280 360 228" marker-end="url(#ctp-arrow)"/>
      <path d="M779 282 604 228" marker-end="url(#ctp-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M439 164V112" marker-end="url(#ctp-arrow-ret)"/>
      <path d="M439 226V280" marker-end="url(#ctp-arrow-ret)"/>
      <path d="M286 226 256 280" marker-end="url(#ctp-arrow-ret)"/>
    </g>
    <g font-size="11" fill="#40566b">
      <rect x="226" y="129" width="40" height="14" fill="#f5f7fb"/>
      <text x="230" y="140">pact</text>
      <rect x="447" y="129" width="54" height="14" fill="#f5f7fb"/>
      <text x="451" y="140">yes / no</text>
      <rect x="686" y="129" width="64" height="14" fill="#f5f7fb"/>
      <text x="690" y="140">deployed</text>
      <rect x="160" y="245" width="92" height="14" fill="#f5f7fb"/>
      <text x="164" y="256">pacts to verify</text>
      <rect x="348" y="245" width="50" height="14" fill="#f5f7fb"/>
      <text x="352" y="256">results</text>
      <rect x="447" y="245" width="54" height="14" fill="#f5f7fb"/>
      <text x="451" y="256">yes / no</text>
      <rect x="686" y="245" width="64" height="14" fill="#f5f7fb"/>
      <text x="690" y="256">deployed</text>
    </g>

    <text x="440" y="376" font-size="13" fill="#40566b" text-anchor="middle">Each pipeline asks the broker before it deploys and tells it afterwards.</text>
  </g>
</svg>
