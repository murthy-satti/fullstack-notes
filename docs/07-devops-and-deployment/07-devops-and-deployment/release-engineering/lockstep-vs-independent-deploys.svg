<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="lvi-title lvi-desc">
  <title id="lvi-title">Lock-step releases compared with independent deploys</title>
  <desc id="lvi-desc">Left, a lock-step release, the distributed monolith: release 14 on Thursday at 22:00 must deploy the tasks API first, the notifier second, search third, and the web app fourth, in that order, and all four services read one shared database with the tasks, users, and notifications tables. Consequences: a deploy-order spreadsheet and a release window, one failing service blocks all four, rollback means rolling back all four, and teams wait for each other. Right, independent deploys: the tasks API, the notifier, search, and the web app each have their own database and deploy on their own days of the week, several times for some. Contracts between services are versioned APIs and event schemas checked in CI with contract tests and a schema registry, and every change is backward compatible, so any service can deploy any day. Consequences: a failure stays in one service, rollback is one service, and teams ship on their own schedule. Services you must deploy together are one deployable split across a network.</desc>
  <defs>
    <marker id="lvi-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#6e2a24">Lock-step release (a distributed monolith)</text>
    <text x="456" y="30" font-size="13" font-weight="700" fill="#294a2e">Independent deploys</text>
    <path d="M440 16V340" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="44" width="400" height="168" rx="8" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="36" y="64" font-size="12" font-weight="700" fill="#6e2a24">Release 14: Thursday 22:00, in this order</text>
    <g stroke-width="2">
      <rect x="38" y="78" width="88" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="136" y="78" width="88" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="234" y="78" width="88" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="332" y="78" width="80" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="11.5" font-weight="700" text-anchor="middle">
      <text x="82" y="97" fill="#263e5a">1. tasks</text>
      <text x="82" y="112" fill="#263e5a">API</text>
      <text x="180" y="97" fill="#263e5a">2. notifier</text>
      <text x="278" y="97" fill="#263e5a">3. search</text>
      <text x="372" y="97" fill="#66400f">4. web</text>
      <text x="372" y="112" fill="#66400f">app</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M126 100H134" marker-end="url(#lvi-arrow)"/>
      <path d="M224 100H232" marker-end="url(#lvi-arrow)"/>
      <path d="M322 100H330" marker-end="url(#lvi-arrow)"/>
    </g>
    <rect x="52" y="152" width="344" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="224" y="171" font-size="12" font-weight="700" fill="#263e5a" text-anchor="middle">one shared database</text>
    <text x="224" y="187" font-size="11" fill="#263e5a" text-anchor="middle">tasks, users, notifications tables</text>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M82 122V150"/>
      <path d="M180 122V150"/>
      <path d="M278 122V150"/>
    </g>
    <g font-size="11.5" fill="#6e2a24">
      <text x="24" y="238">- a deploy-order spreadsheet and a release window</text>
      <text x="24" y="256">- one failing service blocks all four</text>
      <text x="24" y="274">- rollback means rolling back all four</text>
      <text x="24" y="292">- teams wait for each other</text>
    </g>

    <g font-size="11.5" font-weight="700" fill="#36424e">
      <text x="456" y="66">tasks API, own DB</text>
      <text x="456" y="102">notifier, own DB</text>
      <text x="456" y="138">search, own index</text>
      <text x="456" y="174">web app</text>
    </g>
    <g stroke="#c9d1db" stroke-width="2">
      <path d="M600 62H850"/>
      <path d="M600 98H850"/>
      <path d="M600 134H850"/>
      <path d="M600 170H850"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <circle cx="630" cy="62" r="6"/>
      <circle cx="735" cy="62" r="6"/>
      <circle cx="790" cy="62" r="6"/>
      <circle cx="660" cy="98" r="6"/>
      <circle cx="830" cy="98" r="6"/>
      <circle cx="615" cy="134" r="6"/>
      <circle cx="760" cy="134" r="6"/>
      <circle cx="640" cy="170" r="6"/>
      <circle cx="690" cy="170" r="6"/>
      <circle cx="745" cy="170" r="6"/>
      <circle cx="840" cy="170" r="6"/>
    </g>
    <g font-size="11" fill="#60788d" text-anchor="middle">
      <text x="625" y="198">Mon</text>
      <text x="680" y="198">Tue</text>
      <text x="735" y="198">Wed</text>
      <text x="790" y="198">Thu</text>
      <text x="840" y="198">Fri</text>
    </g>
    <rect x="456" y="212" width="394" height="62" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="11.5" fill="#294a2e">
      <text x="468" y="231">Contracts: versioned APIs and event schemas, checked in</text>
      <text x="468" y="247">CI by contract tests and a schema registry; every change</text>
      <text x="468" y="263">is backward compatible, so any service deploys any day.</text>
    </g>
    <g font-size="11.5" fill="#294a2e">
      <text x="456" y="292">+ a failure stays in one service; rollback is one service</text>
      <text x="456" y="310">+ teams ship on their own schedule</text>
    </g>

    <text x="440" y="378" font-size="13" fill="#40566b" text-anchor="middle">Services you must deploy together are one deployable split across a network.</text>
  </g>
</svg>
