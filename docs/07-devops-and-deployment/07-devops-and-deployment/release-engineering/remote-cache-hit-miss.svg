<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img" aria-labelledby="rch-title rch-desc">
  <title id="rch-title">Remote build cache hit and miss</title>
  <desc id="rch-desc">To run the task web#build, the build tool first computes a hash from its inputs: the source files in apps/web, the hashes of its internal dependencies, the declared environment variables VITE_* and APP_VERSION, the task definition in turbo.json, and the resolved external dependencies from the lockfile. The result is a hash such as 8f3c91e2. If the local or the remote cache has an entry for that hash, it is a hit: the tool downloads the dist folder and the logs, checks the HMAC signature, and replays the logs in about 5 seconds. On a miss it runs vite build, which takes about 2 minutes, and then stores the outputs and logs in the remote cache, signed, with only CI allowed to write. Worked numbers: 40 tasks at 2 minutes each are 80 minutes of work; with an 85 percent hit rate only 6 tasks run, 12 minutes, plus 34 restores of a few seconds each. Wrong inputs give wrong hits: if VITE_API_URL is not declared, a staging build can be restored for production. A cache hit is only as correct as the list of inputs that went into the hash.</desc>
  <defs>
    <marker id="rch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="384" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">A remote build cache: hash the inputs, then restore or run</text>

    <rect x="24" y="48" width="240" height="138" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="36" y="70" font-size="13" font-weight="700" fill="#463365">Inputs of web#build</text>
    <g font-size="11" fill="#463365">
      <text x="36" y="92">source files in apps/web</text>
      <text x="36" y="110">hashes of internal dependencies</text>
      <text x="36" y="128">env: VITE_*, APP_VERSION</text>
      <text x="36" y="146">task definition in turbo.json</text>
      <text x="36" y="164">resolved external deps (lockfile)</text>
    </g>

    <rect x="300" y="94" width="120" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="360" y="113" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">hash</text>
    <text x="360" y="130" font-size="11.5" fill="#263e5a" text-anchor="middle">8f3c91e2</text>

    <path d="M540 73 626 117 540 161 454 117z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="540" y="113" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="middle">local or remote</text>
    <text x="540" y="129" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="middle">cache hit?</text>

    <rect x="666" y="72" width="194" height="90" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="678" y="93" font-size="13" font-weight="700" fill="#294a2e">Restore</text>
    <g font-size="11" fill="#294a2e">
      <text x="678" y="112">download dist/ and the logs</text>
      <text x="678" y="129">check the HMAC signature</text>
      <text x="678" y="146">replay the logs: about 5 s</text>
    </g>

    <rect x="440" y="202" width="200" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="452" y="224" font-size="13" font-weight="700" fill="#66400f">Run the task</text>
    <text x="452" y="243" font-size="11" fill="#66400f">vite build: about 2 min</text>

    <rect x="666" y="202" width="194" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="678" y="224" font-size="13" font-weight="700" fill="#263e5a">Store</text>
    <text x="678" y="243" font-size="11" fill="#263e5a">signed outputs + logs; CI writes</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M264 117H298" marker-end="url(#rch-arrow)"/>
      <path d="M420 117H452" marker-end="url(#rch-arrow)"/>
      <path d="M626 117H664" marker-end="url(#rch-arrow)"/>
      <path d="M540 161V200" marker-end="url(#rch-arrow)"/>
      <path d="M640 229H664" marker-end="url(#rch-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="633" y="108">hit</text>
      <text x="548" y="186">miss</text>
    </g>

    <rect x="24" y="280" width="836" height="58" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="36" y="300">40 tasks x 2 min = 80 min of work. With 85% hits, 6 tasks run (12 min), plus 34 restores of a few seconds each.</text>
      <text x="36" y="320">Wrong inputs give wrong hits: if VITE_API_URL is not declared, a staging build can be restored for production.</text>
    </g>

    <text x="440" y="368" font-size="13" fill="#40566b" text-anchor="middle">A cache hit is only as correct as the list of inputs that went into the hash.</text>
  </g>
</svg>
