<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" role="img" aria-labelledby="rtt-title rtt-desc">
  <title id="rtt-title">A two-week release train</title>
  <desc id="rtt-desc">Three overlapping trains across six weeks. Train 2026.11.1: commits land on main in weeks 1 and 2, the release branch is cut at the end of week 2, week 3 stabilizes it with release candidates, week 4 is the phased rollout, and from week 5 it is supported with hotfixes only. Train 2026.11.2: commits land on main in weeks 3 and 4, it is cut at the end of week 4, stabilized in week 5, and rolled out in week 6. Train 2026.12.1 collects commits on main in weeks 5 and 6. Every two weeks a train leaves: the branch is cut from main on a Monday, stabilized for a week, then rolled out. A feature that misses the cut rides the next train two weeks later, or ships dark behind a flag. In week 5 three versions are active at once: 2026.11.1 supported, 2026.11.2 stabilizing, and 2026.12.1 in development. A fixed schedule makes releases small and predictable because the next train is always two weeks away.</desc>
  <rect width="880" height="356" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">A two-week release train: a new train leaves every second Monday</text>

    <g font-size="11.5" font-weight="700" fill="#40566b" text-anchor="middle">
      <text x="217" y="52">week 1</text>
      <text x="332" y="52">week 2</text>
      <text x="447" y="52">week 3</text>
      <text x="562" y="52">week 4</text>
      <text x="677" y="52">week 5</text>
      <text x="792" y="52">week 6</text>
    </g>
    <g stroke="#c9d1db" stroke-width="1">
      <path d="M160 58V224"/>
      <path d="M275 58V224"/>
      <path d="M390 58V224"/>
      <path d="M505 58V224"/>
      <path d="M620 58V224"/>
      <path d="M735 58V224"/>
      <path d="M850 58V224"/>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="24" y="84">2026.11.1</text>
      <text x="24" y="142">2026.11.2</text>
      <text x="24" y="200">2026.12.1</text>
    </g>
    <g font-size="10.5" fill="#60788d">
      <text x="24" y="98">release/2026.11.1</text>
      <text x="24" y="156">release/2026.11.2</text>
      <text x="24" y="214">on main</text>
    </g>

    <g stroke-width="1.5">
      <rect x="160" y="70" width="230" height="30" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="390" y="70" width="115" height="30" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="505" y="70" width="115" height="30" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="620" y="70" width="230" height="30" rx="4" fill="#f5f7fb" stroke="#8a96a3" stroke-dasharray="5 4"/>

      <rect x="390" y="128" width="230" height="30" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="620" y="128" width="115" height="30" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="735" y="128" width="115" height="30" rx="4" fill="#e7f3e9" stroke="#53845b"/>

      <rect x="620" y="186" width="230" height="30" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="275" y="89" fill="#36424e">commits land on main</text>
      <text x="447" y="89" fill="#463365">stabilize: RCs</text>
      <text x="562" y="89" fill="#294a2e">phased rollout</text>
      <text x="735" y="89" fill="#36424e">supported: hotfixes only</text>
      <text x="505" y="147" fill="#36424e">commits land on main</text>
      <text x="677" y="147" fill="#463365">stabilize: RCs</text>
      <text x="792" y="147" fill="#294a2e">phased rollout</text>
      <text x="735" y="205" fill="#36424e">commits land on main</text>
    </g>

    <g stroke="#40566b" stroke-width="2.5">
      <path d="M390 64V106"/>
      <path d="M620 122V164"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="396" y="66">cut</text>
      <text x="626" y="124">cut</text>
    </g>

    <rect x="24" y="236" width="826" height="62" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <g font-size="11.5" fill="#36424e">
      <text x="36" y="255">Every two weeks a train leaves: the branch is cut from main on Monday, stabilized for a week, then rolled out.</text>
      <text x="36" y="272">Missed the cut? The feature rides the next train two weeks later, or ships dark behind a flag.</text>
      <text x="36" y="289">In week 5, three versions are active at once: 2026.11.1 supported, 2026.11.2 stabilizing, 2026.12.1 in development.</text>
    </g>

    <g font-size="11" fill="#36424e">
      <rect x="24" y="308" width="14" height="14" rx="3" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="44" y="319">commits on main</text>
      <rect x="160" y="308" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="180" y="319">stabilization: fixes only, candidates to beta testers</text>
      <rect x="470" y="308" width="14" height="14" rx="3" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="490" y="319">phased rollout</text>
      <rect x="600" y="308" width="14" height="14" rx="3" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="620" y="319">supported: hotfixes only</text>
    </g>

    <text x="440" y="344" font-size="13" fill="#40566b" text-anchor="middle">A fixed schedule keeps releases small and predictable: the next train is always two weeks away.</text>
  </g>
</svg>
