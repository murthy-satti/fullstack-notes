<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="vsa-title vsa-desc">
  <title id="vsa-title">Anatomy of the version string 2.4.1-rc.2+build.873.g3f2a1c</title>
  <desc id="vsa-desc">The string splits into four parts. The version core 2.4.1 is MAJOR.MINOR.PATCH, the compatibility promise: MAJOR breaks the API, MINOR adds, PATCH fixes. The pre-release -rc.2 says the version is not final: it sorts before 2.4.1, and rc.2 sorts before rc.10 because numeric identifiers compare as numbers. After the plus sign comes build metadata: build.873 is the CI run number, which increases with every build and finds the exact pipeline run, and g3f2a1c is the git describe convention of g plus the short commit SHA, which identifies the source. A bracket over the build metadata notes that it is ignored when comparing precedence. Examples underneath: 2.4.1-rc.2 is lower than 2.4.1-rc.10, which is lower than 2.4.1, while 2.4.1+build.873 and 2.4.1+build.874 have equal precedence. Each part answers a different question: is it compatible, is it final, which build, and which source.</desc>
  <rect width="820" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">One string, four jobs: 2.4.1-rc.2+build.873.g3f2a1c</text>

    <path d="M364 62V56H702V62" fill="none" stroke="#60788d" stroke-width="1.5"/>
    <text x="533" y="49" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="middle">build metadata: ignored when comparing precedence</text>

    <g font-size="24" font-weight="700" text-anchor="middle">
      <rect x="118" y="66" width="120" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="178" y="100" fill="#263e5a">2.4.1</text>
      <rect x="246" y="66" width="110" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="301" y="100" fill="#463365">-rc.2</text>
      <rect x="364" y="66" width="180" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="454" y="100" fill="#66400f">+build.873</text>
      <rect x="552" y="66" width="150" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="627" y="100" fill="#66400f">.g3f2a1c</text>
    </g>
    <text x="178" y="136" font-size="11" fill="#263e5a" text-anchor="middle">MAJOR.MINOR.PATCH</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5">
      <path d="M150 142 110 166"/>
      <path d="M301 118 310 166"/>
      <path d="M454 118 510 166"/>
      <path d="M627 118 710 166"/>
    </g>

    <rect x="15" y="166" width="190" height="90" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="215" y="166" width="190" height="90" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="415" y="166" width="190" height="90" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="615" y="166" width="190" height="90" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="27" y="188" fill="#263e5a">Version core</text>
      <text x="227" y="188" fill="#463365">Pre-release</text>
      <text x="427" y="188" fill="#66400f">Build number</text>
      <text x="627" y="188" fill="#66400f">Commit</text>
    </g>
    <g font-size="11.5">
      <text x="27" y="208" fill="#263e5a">the compatibility promise:</text>
      <text x="27" y="224" fill="#263e5a">MAJOR breaks the API,</text>
      <text x="27" y="240" fill="#263e5a">MINOR adds, PATCH fixes</text>
      <text x="227" y="208" fill="#463365">not final yet: sorts before</text>
      <text x="227" y="224" fill="#463365">2.4.1, and rc.2 sorts before</text>
      <text x="227" y="240" fill="#463365">rc.10 (numbers compare)</text>
      <text x="427" y="208" fill="#66400f">CI run 873: increases with</text>
      <text x="427" y="224" fill="#66400f">every build and points to</text>
      <text x="427" y="240" fill="#66400f">the exact pipeline run</text>
      <text x="627" y="208" fill="#66400f">g + short SHA, the git</text>
      <text x="627" y="224" fill="#66400f">describe convention: the</text>
      <text x="627" y="240" fill="#66400f">source that was built</text>
    </g>

    <g font-size="12" fill="#36424e" text-anchor="middle">
      <text x="410" y="282">2.4.1-rc.2 &lt; 2.4.1-rc.10 &lt; 2.4.1, while 2.4.1+build.873 and 2.4.1+build.874 have equal precedence</text>
    </g>
    <text x="410" y="314" font-size="13" fill="#40566b" text-anchor="middle">Each part answers a different question: is it compatible, is it final, which build, which source?</text>
  </g>
</svg>
