<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="aar-title aar-desc">
  <title id="aar-title">Active-active in two regions with home regions and asynchronous replication</title>
  <desc id="aar-desc">Global routing at the edge reads each user's home region from a token claim or cookie. EU users go to eu-west-1 and US users go to us-east-1, so each region serves its own users at local latency. In eu-west-1, a load balancer and TaskFlow API instances write EU users' data to the primary of the EU partition and also hold a read-only replica of the US partition. In us-east-1 the arrangement is mirrored: the primary of the US partition and a replica of the EU partition. Each partition replicates asynchronously to the other region with a lag of seconds, which is the recovery point objective. Because every record has exactly one writing region, there are no write conflicts. If eu-west-1 fails, operators promote the EU partition replica in us-east-1 and route EU users there; writes not yet replicated are lost, and us-east-1 must have capacity for both user groups.</desc>
  <defs>
    <marker id="aar-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="aar-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="20" width="160" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="120" y="45" font-size="12" font-weight="700" fill="#66400f">EU users</text>
    <rect x="680" y="20" width="160" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="760" y="45" font-size="12" font-weight="700" fill="#66400f">US users</text>
    <rect x="250" y="20" width="380" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="37" font-size="12.5" font-weight="700" fill="#263e5a">Global routing at the edge</text>
    <text x="440" y="52" font-size="11" fill="#263e5a">home region from a token claim or cookie</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M200 40H248" marker-end="url(#aar-arrow)"/>
      <path d="M680 40H632" marker-end="url(#aar-arrow)"/>
      <path d="M330 60 220 106" marker-end="url(#aar-arrow)"/>
      <path d="M550 60 660 106" marker-end="url(#aar-arrow)"/>
    </g>
    <text x="246" y="94" font-size="11" fill="#36424e" text-anchor="end">EU users</text>
    <text x="634" y="94" font-size="11" fill="#36424e" text-anchor="start">US users</text>

    <rect x="20" y="108" width="400" height="250" rx="10" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="460" y="108" width="400" height="250" rx="10" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="36" y="128" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">eu-west-1</text>
    <text x="476" y="128" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">us-east-1</text>

    <rect x="120" y="138" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="220" y="163" font-size="12" font-weight="700" fill="#263e5a">Load balancer</text>
    <rect x="560" y="138" width="200" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="660" y="163" font-size="12" font-weight="700" fill="#263e5a">Load balancer</text>
    <path d="M220 178V196" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#aar-arrow)"/>
    <path d="M660 178V196" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#aar-arrow)"/>
    <rect x="120" y="198" width="200" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="223" font-size="12" font-weight="700" fill="#66400f">TaskFlow API</text>
    <rect x="560" y="198" width="200" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="660" y="223" font-size="12" font-weight="700" fill="#66400f">TaskFlow API</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M180 238 135 266" marker-end="url(#aar-arrow)"/>
      <path d="M620 238 575 266" marker-end="url(#aar-arrow)"/>
    </g>
    <path d="M260 238 300 266" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#aar-arrow-ret)"/>
    <path d="M700 238 740 266" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#aar-arrow-ret)"/>
    <text x="150" y="254" font-size="10.5" fill="#36424e" text-anchor="end">writes</text>
    <text x="290" y="254" font-size="10.5" fill="#36424e" text-anchor="start">reads</text>
    <text x="590" y="254" font-size="10.5" fill="#36424e" text-anchor="end">writes</text>
    <text x="730" y="254" font-size="10.5" fill="#36424e" text-anchor="start">reads</text>

    <rect x="36" y="268" width="176" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="124" y="287" font-size="12" font-weight="700" fill="#263e5a">EU partition</text>
    <text x="124" y="304" font-size="11" fill="#263e5a">primary (writes)</text>
    <rect x="228" y="268" width="176" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="316" y="287" font-size="12" font-weight="700" fill="#36424e">US partition</text>
    <text x="316" y="304" font-size="11" fill="#36424e">read-only replica</text>
    <rect x="476" y="268" width="176" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="564" y="287" font-size="12" font-weight="700" fill="#263e5a">US partition</text>
    <text x="564" y="304" font-size="11" fill="#263e5a">primary (writes)</text>
    <rect x="668" y="268" width="176" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="756" y="287" font-size="12" font-weight="700" fill="#36424e">EU partition</text>
    <text x="756" y="304" font-size="11" fill="#36424e">read-only replica</text>

    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M124 314V340H756V316" marker-end="url(#aar-arrow-ret)"/>
      <path d="M564 314V328H316V316" marker-end="url(#aar-arrow-ret)"/>
    </g>
    <rect x="378" y="333" width="124" height="15" fill="#f5f7fb"/>
    <text x="440" y="344" font-size="11" fill="#36424e">async, lag = RPO</text>

    <rect x="40" y="376" width="390" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <g font-size="11.5" fill="#294a2e" text-anchor="start">
      <text x="56" y="398" font-weight="700">Normal operation</text>
      <text x="56" y="416">each user writes only in the home region</text>
      <text x="56" y="434">local latency and no write conflicts</text>
    </g>
    <rect x="450" y="376" width="390" height="70" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <g font-size="11.5" fill="#6e2a24" text-anchor="start">
      <text x="466" y="398" font-weight="700">If eu-west-1 fails</text>
      <text x="466" y="416">promote the EU replica in us-east-1 and reroute;</text>
      <text x="466" y="434">unreplicated writes are lost; capacity for both</text>
    </g>

    <text x="440" y="476" font-size="13" fill="#40566b">Give every record one writing region: active-active serving without multi-writer conflicts.</text>
  </g>
</svg>
