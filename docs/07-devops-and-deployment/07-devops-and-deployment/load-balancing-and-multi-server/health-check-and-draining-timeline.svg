<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="hcd-title hcd-desc">
  <title id="hcd-title">Health check removal, draining, and slow start over 90 seconds</title>
  <desc id="hcd-desc">Three lanes share a 0 to 90 second axis. Unplanned failure: an instance crashes at 0 seconds; health checks every 10 seconds fail at 10, 20, and 30 seconds, and only after the third failure is the instance removed, so requests sent to it can fail during the first 30 seconds; after that it is out of rotation. Planned removal with a 30-second deregistration delay: at 0 seconds the instance is deregistered and starts draining, receiving no new requests; its last in-flight request finishes at about 12 seconds; at 30 seconds it is deregistered and safe to stop. New instance with a healthy threshold of 2 checks and a 60-second slow start: it is registered at 0 seconds, passes checks at 5 and 15 seconds, enters service at 15 seconds, and its share of traffic rises linearly from 0 to 100 percent until 75 seconds, after which it takes its full share. Detection takes the check interval times the failure threshold; draining and slow start protect requests on the way out and in.</desc>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g text-anchor="start">
      <text x="24" y="92" font-size="12" font-weight="700" fill="#36424e">Unplanned failure</text>
      <text x="24" y="108" font-size="11" fill="#36424e">every 10 s, 3 failures</text>
      <text x="24" y="192" font-size="12" font-weight="700" fill="#36424e">Planned removal</text>
      <text x="24" y="208" font-size="11" fill="#36424e">deregistration</text>
      <text x="24" y="222" font-size="11" fill="#36424e">delay 30 s</text>
      <text x="24" y="292" font-size="12" font-weight="700" fill="#36424e">New instance</text>
      <text x="24" y="308" font-size="11" fill="#36424e">healthy after 2 checks</text>
      <text x="24" y="322" font-size="11" fill="#36424e">slow start 60 s</text>
    </g>

    <!-- lane 1 -->
    <text x="190" y="72" font-size="11" fill="#6e2a24" text-anchor="start">crash</text>
    <rect x="190" y="84" width="219" height="26" rx="5" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="300" y="101" font-size="11" fill="#6e2a24">requests can still fail</text>
    <rect x="409" y="84" width="437" height="26" rx="5" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="627" y="101" font-size="11" fill="#36424e">out of rotation: no requests</text>
    <g stroke="#b5524b" stroke-width="2">
      <path d="M258 70 268 80M268 70 258 80"/>
      <path d="M331 70 341 80M341 70 331 80"/>
      <path d="M404 70 414 80M414 70 404 80"/>
    </g>
    <text x="422" y="78" font-size="11" fill="#6e2a24" text-anchor="start">3rd failure: removed</text>

    <!-- lane 2 -->
    <text x="190" y="176" font-size="11" fill="#66400f" text-anchor="start">deregister: draining starts</text>
    <rect x="190" y="184" width="219" height="26" rx="5" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="343" y="201" font-size="11" fill="#66400f">no new requests</text>
    <rect x="409" y="184" width="437" height="26" rx="5" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="627" y="201" font-size="11" fill="#36424e">deregistered: safe to stop the instance</text>
    <path d="M277 180V214" stroke="#53845b" stroke-width="2"/>
    <text x="277" y="230" font-size="11" fill="#294a2e">last in-flight request done (12 s)</text>

    <!-- lane 3 -->
    <text x="190" y="276" font-size="11" fill="#263e5a" text-anchor="start">registered</text>
    <rect x="190" y="284" width="109" height="26" rx="5" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="262" y="326" font-size="11" fill="#36424e">2 passing checks</text>
    <circle cx="226" cy="297" r="5" fill="#ffffff" stroke="#53845b" stroke-width="2"/>
    <circle cx="299" cy="297" r="5" fill="#ffffff" stroke="#53845b" stroke-width="2"/>
    <path d="M299 310 737 284 737 310Z" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="518" y="276" font-size="11" fill="#294a2e">slow start: share of traffic rises from 0 to 100%</text>
    <rect x="737" y="284" width="109" height="26" rx="5" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="791" y="301" font-size="11" font-weight="700" fill="#294a2e">full share</text>

    <!-- axis -->
    <path d="M190 350H846" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M190 346V354"/><path d="M299 346V354"/><path d="M409 346V354"/><path d="M518 346V354"/>
      <path d="M627 346V354"/><path d="M737 346V354"/><path d="M846 346V354"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="190" y="368">0 s</text><text x="299" y="368">15 s</text><text x="409" y="368">30 s</text><text x="518" y="368">45 s</text>
      <text x="627" y="368">60 s</text><text x="737" y="368">75 s</text><text x="846" y="368">90 s</text>
    </g>
    <g stroke="#c9d1db" stroke-width="1" stroke-dasharray="3 4">
      <path d="M409 120V176"/><path d="M409 216V340"/>
    </g>

    <text x="440" y="406" font-size="13" fill="#40566b">Detection takes interval x failures; draining and slow start protect requests on the way out and in.</text>
  </g>
</svg>
