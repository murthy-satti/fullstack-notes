<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="nre-title nre-desc">
  <title id="nre-title">Netflix region evacuation before and after Project Nimble</title>
  <desc id="nre-desc">Netflix's 2018 Project Nimble post breaks down a regional failover that used to take about 50 minutes: about 5 minutes to decide whether to fail over, 3 to 5 minutes to provision capacity in the destination regions, about 25 minutes for services to start up, register with Eureka and with load balancers, 10 minutes or more of proxying traffic between regions through Zuul tunnels to cover DNS TTL delays and let instances warm up, and about 5 minutes for the DNS cut-over to take effect. Nimble's goal and result was a failover in under 10 minutes that consists of flipping DNS records. It relies on dark capacity: in the healthy region, spare instances already run in a separate shadow Auto Scaling group that is not attached to the service's load balancers and that a shared library keeps in Eureka's STARTING state, so no traffic reaches them. On evacuation the dark capacity is made available, DNS sends users from the failing region to the healthy one, and the instances are ready immediately.</desc>
  <defs>
    <marker id="nre-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="start">Before: a region failover took about 50 minutes</text>
    <g stroke-width="1.5">
      <rect x="120" y="42" width="70" height="34" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="190" y="42" width="70" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="260" y="42" width="350" height="34" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="610" y="42" width="140" height="34" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="750" y="42" width="70" height="34" rx="4" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="11">
      <text x="155" y="63" fill="#36424e">decide</text>
      <text x="225" y="63" fill="#263e5a">scale up</text>
      <text x="435" y="63" fill="#66400f">services start, register with Eureka and ELBs: ~25 min</text>
      <text x="680" y="63" fill="#463365">Zuul tunnels: 10+</text>
      <text x="785" y="63" fill="#263e5a">DNS: ~5</text>
    </g>
    <path d="M120 84H820" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M120 80V88M260 80V88M400 80V88M540 80V88M680 80V88M820 80V88"/>
    </g>
    <g font-size="10.5" fill="#36424e">
      <text x="120" y="100">0 min</text>
      <text x="260" y="100">10</text>
      <text x="400" y="100">20</text>
      <text x="540" y="100">30</text>
      <text x="680" y="100">40</text>
      <text x="820" y="100">50</text>
    </g>

    <text x="24" y="132" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">With Nimble: under 10 minutes, mostly flipping DNS</text>
    <rect x="120" y="144" width="140" height="34" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="190" y="165" font-size="11" fill="#294a2e">flip DNS</text>
    <text x="272" y="165" font-size="11.5" fill="#36424e" text-anchor="start">capacity is already running and warm, so nothing waits for boot or warmup</text>

    <path d="M24 200H836" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="216" width="250" height="150" rx="10" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="149" y="240" font-size="13" font-weight="700" fill="#6e2a24">failing region</text>
    <text x="149" y="262" font-size="11.5" fill="#6e2a24">users are moved away</text>
    <rect x="44" y="282" width="210" height="60" rx="8" fill="#ffffff" stroke="#b5524b" stroke-width="1.5"/>
    <text x="149" y="306" font-size="12" font-weight="700" fill="#6e2a24">services impaired</text>
    <text x="149" y="324" font-size="11" fill="#6e2a24">root cause not yet needed</text>

    <rect x="330" y="216" width="506" height="150" rx="10" fill="#e5efff" fill-opacity="0.4" stroke="#4774aa" stroke-width="2"/>
    <text x="583" y="240" font-size="13" font-weight="700" fill="#263e5a">healthy region</text>
    <rect x="350" y="254" width="226" height="96" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="463" y="278" font-size="12.5" font-weight="700" fill="#294a2e">main Auto Scaling group</text>
    <text x="463" y="297" font-size="11" fill="#294a2e">UP in Eureka, behind the ELB,</text>
    <text x="463" y="313" font-size="11" fill="#294a2e">serving its own users</text>
    <rect x="596" y="254" width="220" height="96" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="706" y="278" font-size="12.5" font-weight="700" fill="#463365">dark capacity</text>
    <text x="706" y="297" font-size="11" fill="#463365">shadow group, not behind the ELB,</text>
    <text x="706" y="313" font-size="11" fill="#463365">held STARTING in Eureka;</text>
    <text x="706" y="329" font-size="11" fill="#463365">made available on evacuation</text>

    <path d="M274 300H348" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#nre-arrow)"/>
    <rect x="282" y="306" width="58" height="30" rx="4" fill="#f5f7fb"/>
    <text x="311" y="318" font-size="10.5" fill="#36424e">DNS sends</text>
    <text x="311" y="331" font-size="10.5" fill="#36424e">users here</text>

    <rect x="24" y="384" width="812" height="44" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="402" font-size="11.5" fill="#36424e">Evacuation is a generic mitigation: move users first, debug the failing region afterwards.</text>
    <text x="430" y="419" font-size="11.5" fill="#36424e">It only works if the healthy regions can absorb the traffic, so the capacity must exist before the incident.</text>

    <text x="430" y="456" font-size="13" fill="#40566b">Failover speed is set by what must start after the decision: make it nothing but DNS.</text>
  </g>
</svg>
