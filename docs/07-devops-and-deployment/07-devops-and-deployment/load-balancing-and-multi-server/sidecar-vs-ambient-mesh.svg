<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="sva-title sva-desc">
  <title id="sva-title">Sidecar mesh compared with Istio ambient mode</title>
  <desc id="sva-desc">Sidecar mode, on the left: a node runs three Pods, and each Pod contains its app and its own sidecar proxy, so the node runs three proxies; every Pod pays the proxy's memory and CPU, every request passes through two full L7 proxies, and upgrading the proxy means restarting the Pods. Ambient mode in Istio, on the right: a node runs three Pods that contain only their apps. One ztunnel per node provides mutual TLS, L4 authorization, and L4 telemetry for every Pod on the node, and traffic that needs L7 features such as HTTP routing, retries, or L7 authorization passes through an optional waypoint proxy that runs per namespace or per service. Ambient mode reached general availability in Istio 1.24 in November 2024. Linkerd keeps a sidecar design with a small purpose-built proxy.</desc>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Sidecar mode: one proxy per Pod</text>
    <text x="448" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Istio ambient mode: per-node L4, optional L7</text>
    <path d="M430 20V330" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="46" width="390" height="190" rx="10" fill="#e5efff" fill-opacity="0.3" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="36" y="66" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">node</text>
    <g fill="#ffffff" stroke="#8a96a3" stroke-width="1.5">
      <rect x="40" y="78" width="114" height="140" rx="8"/>
      <rect x="164" y="78" width="114" height="140" rx="8"/>
      <rect x="288" y="78" width="114" height="140" rx="8"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="50" y="90" width="94" height="52" rx="6"/>
      <rect x="174" y="90" width="94" height="52" rx="6"/>
      <rect x="298" y="90" width="94" height="52" rx="6"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="50" y="152" width="94" height="52" rx="6"/>
      <rect x="174" y="152" width="94" height="52" rx="6"/>
      <rect x="298" y="152" width="94" height="52" rx="6"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="97" y="121" fill="#66400f">app</text>
      <text x="221" y="121" fill="#66400f">app</text>
      <text x="345" y="121" fill="#66400f">app</text>
      <text x="97" y="183" fill="#263e5a">proxy</text>
      <text x="221" y="183" fill="#263e5a">proxy</text>
      <text x="345" y="183" fill="#263e5a">proxy</text>
    </g>

    <rect x="448" y="46" width="388" height="190" rx="10" fill="#e5efff" fill-opacity="0.3" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="460" y="66" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">node</text>
    <g fill="#ffffff" stroke="#8a96a3" stroke-width="1.5">
      <rect x="464" y="78" width="112" height="66" rx="8"/>
      <rect x="586" y="78" width="112" height="66" rx="8"/>
      <rect x="708" y="78" width="112" height="66" rx="8"/>
    </g>
    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <rect x="474" y="88" width="92" height="46" rx="6"/>
      <rect x="596" y="88" width="92" height="46" rx="6"/>
      <rect x="718" y="88" width="92" height="46" rx="6"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="520" y="116">app</text>
      <text x="642" y="116">app</text>
      <text x="764" y="116">app</text>
    </g>
    <rect x="464" y="166" width="356" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="642" y="187" font-size="13" font-weight="700" fill="#463365">ztunnel (one per node)</text>
    <text x="642" y="205" font-size="11.5" fill="#463365">mutual TLS, L4 authorization, L4 metrics</text>
    <g fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="4 3">
      <path d="M520 144V164"/>
      <path d="M642 144V164"/>
      <path d="M764 144V164"/>
    </g>

    <rect x="448" y="252" width="388" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="642" y="273" font-size="13" font-weight="700" fill="#263e5a">waypoint proxy (optional)</text>
    <text x="642" y="291" font-size="11.5" fill="#263e5a">per namespace or service: L7 routing, retries, L7 policy</text>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="24" y="262">every Pod pays proxy memory and CPU</text>
      <text x="24" y="280">each request crosses two full L7 proxies</text>
      <text x="24" y="298">proxy upgrades restart application Pods</text>
      <text x="24" y="316">simple model; Linkerd stays sidecar-based</text>
    </g>

    <path d="M24 342H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="366" font-size="11.5" fill="#36424e">Istio ambient mode has been generally available since Istio 1.24 (November 2024); sidecar mode remains supported.</text>
    <text x="430" y="402" font-size="13" fill="#40566b">Ambient pays for L7 proxies only where L7 features are used.</text>
  </g>
</svg>
