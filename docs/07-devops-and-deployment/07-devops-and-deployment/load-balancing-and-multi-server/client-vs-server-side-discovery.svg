<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="cvs-title cvs-desc">
  <title id="cvs-title">Client-side compared with server-side service discovery</title>
  <desc id="cvs-desc">Client-side discovery, on the left: three instances of the tasks service register with a service registry such as Consul or Eureka and keep their registration alive with heartbeats or health checks. The client, the orders service, asks the registry for healthy tasks instances (step 1), receives the list 10.0.1.5, 10.0.2.7, and 10.0.3.9 and caches it (step 2), picks one itself, for example by round robin or zone preference, and calls it directly (step 3). Server-side discovery, on the right: the client calls a stable name or virtual IP (step 1); a load balancer or Kubernetes Service receives the call (step 2), looks up the current healthy instances from its own registry or endpoint list, and forwards the request to one of them (step 3); the instances are registered by the platform. Client-side discovery saves a hop and allows smart balancing but needs a library in every language; server-side discovery keeps clients simple but adds a hop and a component to run.</desc>
  <defs>
    <marker id="cvs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cvs-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Client-side discovery</text>
    <text x="448" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Server-side discovery</text>
    <path d="M430 20V360" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="24" y="52" width="170" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="109" y="75" font-size="13" font-weight="700" fill="#66400f">orders service</text>
    <text x="109" y="93" font-size="11" fill="#66400f">client + discovery library</text>
    <rect x="246" y="52" width="164" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="328" y="75" font-size="13" font-weight="700" fill="#463365">service registry</text>
    <text x="328" y="93" font-size="11" fill="#463365">Consul, Eureka</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M194 70H244" marker-end="url(#cvs-arrow)"/>
    </g>
    <path d="M246 92H196" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cvs-arrow-ret)"/>
    <text x="220" y="64" font-size="11" font-weight="700" fill="#40566b">1</text>
    <text x="220" y="108" font-size="11" font-weight="700" fill="#60788d">2</text>

    <rect x="24" y="128" width="170" height="42" rx="6" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="109" y="145" font-size="11" fill="#36424e">cached list: 10.0.1.5,</text>
    <text x="109" y="160" font-size="11" fill="#36424e">10.0.2.7, 10.0.3.9</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="24" y="232" width="118" height="46" rx="8"/>
      <rect x="158" y="232" width="118" height="46" rx="8"/>
      <rect x="292" y="232" width="118" height="46" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="83" y="252" font-size="12" font-weight="700">tasks</text>
      <text x="83" y="268" font-size="11">10.0.1.5</text>
      <text x="217" y="252" font-size="12" font-weight="700">tasks</text>
      <text x="217" y="268" font-size="11">10.0.2.7</text>
      <text x="351" y="252" font-size="12" font-weight="700">tasks</text>
      <text x="351" y="268" font-size="11">10.0.3.9</text>
    </g>
    <path d="M109 170V230" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cvs-arrow)"/>
    <rect x="117" y="186" width="110" height="28" rx="4" fill="#f5f7fb"/>
    <text x="121" y="198" font-size="11" fill="#36424e" text-anchor="start"><tspan font-weight="700">3</tspan> picks one and</text>
    <text x="121" y="212" font-size="11" fill="#36424e" text-anchor="start">calls it directly</text>
    <path d="M351 232V110" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cvs-arrow-ret)"/>
    <rect x="270" y="160" width="76" height="30" rx="4" fill="#f5f7fb"/>
    <text x="342" y="172" font-size="11" fill="#36424e" text-anchor="end">register,</text>
    <text x="342" y="186" font-size="11" fill="#36424e" text-anchor="end">heartbeat</text>

    <rect x="448" y="52" width="170" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="533" y="75" font-size="13" font-weight="700" fill="#66400f">orders service</text>
    <text x="533" y="93" font-size="11" fill="#66400f">calls tasks.internal</text>
    <rect x="666" y="52" width="170" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="751" y="75" font-size="13" font-weight="700" fill="#263e5a">load balancer or</text>
    <text x="751" y="92" font-size="13" font-weight="700" fill="#263e5a">Kubernetes Service</text>
    <text x="751" y="112" font-size="11" fill="#263e5a">knows healthy instances</text>
    <path d="M618 80H664" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cvs-arrow)"/>
    <text x="641" y="72" font-size="11" font-weight="700" fill="#40566b">1</text>
    <text x="751" y="148" font-size="11" font-weight="700" fill="#40566b">2 chooses</text>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="448" y="232" width="118" height="46" rx="8"/>
      <rect x="582" y="232" width="118" height="46" rx="8"/>
      <rect x="716" y="232" width="118" height="46" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="507" y="252" font-size="12" font-weight="700">tasks</text>
      <text x="507" y="268" font-size="11">10.0.1.5</text>
      <text x="641" y="252" font-size="12" font-weight="700">tasks</text>
      <text x="641" y="268" font-size="11">10.0.2.7</text>
      <text x="775" y="252" font-size="12" font-weight="700">tasks</text>
      <text x="775" y="268" font-size="11">10.0.3.9</text>
    </g>
    <path d="M751 132V180H641V230" fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round" marker-end="url(#cvs-arrow)"/>
    <text x="649" y="208" font-size="11" fill="#36424e" text-anchor="start"><tspan font-weight="700">3</tspan> forwards</text>
    <text x="448" y="300" font-size="11" fill="#36424e" text-anchor="start">instances registered by the platform</text>
    <text x="448" y="315" font-size="11" fill="#36424e" text-anchor="start">(target groups, EndpointSlices)</text>

    <text x="24" y="300" font-size="11" fill="#36424e" text-anchor="start">no extra hop; smart balancing possible;</text>
    <text x="24" y="315" font-size="11" fill="#36424e" text-anchor="start">needs a library per language</text>

    <path d="M24 336H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="362" font-size="11.5" fill="#36424e">A service mesh is server-side discovery moved into a proxy next to each client: the app calls a name, the proxy picks.</text>
    <text x="430" y="400" font-size="11.5" fill="#36424e">Kubernetes Services, cloud internal load balancers, and DNS are server-side; Eureka with Spring Cloud and gRPC xDS are client-side.</text>
    <text x="430" y="428" font-size="13" fill="#40566b">Either way, something must keep the list of healthy instances current.</text>
  </g>
</svg>
