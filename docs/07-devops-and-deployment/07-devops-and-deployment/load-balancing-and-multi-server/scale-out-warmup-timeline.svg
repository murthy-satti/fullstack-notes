<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="sow-title sow-desc">
  <title id="sow-title">Why new capacity arrives minutes after a traffic spike</title>
  <desc id="sow-desc">A timeline from 0 to 10 minutes. At minute 0 the offered load rises from 10,000 to 15,000 requests per minute. For the first few minutes the scaling metric is above target while the alarm collects enough datapoints; at about minute 3 the alarm fires and the group raises desired capacity from 10 to 15 and launches 5 instances. From about minute 3 to minute 6 the new instances boot and start the application, from minute 6 to 7 they pass load balancer health checks, and from minute 7 they serve traffic while their warmup period keeps their metrics out of the group average until about minute 9. Meanwhile the existing 10 instances are overloaded from minute 0 to about minute 7, with high CPU and latency, and return near target once the new instances take traffic. Headroom from a lower target, warm pools, scheduled or predictive scaling, and faster boot from golden images shorten or hide this gap.</desc>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="54">offered load</text>
      <text x="24" y="104">metric and alarm</text>
      <text x="24" y="154">scaling activity</text>
      <text x="24" y="204">new instances</text>
      <text x="24" y="254">existing 10</text>
    </g>

    <rect x="150" y="36" width="660" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="480" y="55" font-size="11.5" fill="#66400f">15,000 requests/min from minute 0 (was 10,000)</text>

    <rect x="150" y="86" width="198" height="28" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="249" y="105" font-size="11.5" fill="#463365">above target, collecting datapoints</text>
    <rect x="348" y="86" width="96" height="28" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="396" y="105" font-size="11.5" font-weight="700" fill="#6e2a24">alarm fires</text>

    <rect x="348" y="136" width="196" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="446" y="155" font-size="11.5" fill="#263e5a">desired 10 → 15, launch 5</text>

    <rect x="348" y="186" width="198" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="447" y="205" font-size="11.5" fill="#36424e">boot and start the app</text>
    <rect x="546" y="186" width="66" height="28" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="579" y="205" font-size="11" fill="#36424e">health</text>
    <rect x="612" y="186" width="132" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="678" y="205" font-size="11.5" fill="#294a2e">serving, warmup</text>
    <rect x="744" y="186" width="66" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="777" y="205" font-size="11" fill="#294a2e">counted</text>

    <rect x="150" y="236" width="462" height="28" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="381" y="255" font-size="11.5" fill="#6e2a24">overloaded: CPU and latency high, some timeouts</text>
    <rect x="612" y="236" width="198" height="28" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="711" y="255" font-size="11.5" fill="#294a2e">back near target</text>

    <path d="M150 28V276" stroke="#40566b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M612 28V276" stroke="#53845b" stroke-width="1.5" stroke-dasharray="3 3"/>

    <path d="M150 292H810" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M150 288V296"/>
      <path d="M216 288V296"/>
      <path d="M282 288V296"/>
      <path d="M348 288V296"/>
      <path d="M414 288V296"/>
      <path d="M480 288V296"/>
      <path d="M546 288V296"/>
      <path d="M612 288V296"/>
      <path d="M678 288V296"/>
      <path d="M744 288V296"/>
      <path d="M810 288V296"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="150" y="310">0 min</text>
      <text x="216" y="310">1</text>
      <text x="282" y="310">2</text>
      <text x="348" y="310">3</text>
      <text x="414" y="310">4</text>
      <text x="480" y="310">5</text>
      <text x="546" y="310">6</text>
      <text x="612" y="310">7</text>
      <text x="678" y="310">8</text>
      <text x="744" y="310">9</text>
      <text x="810" y="310">10</text>
    </g>

    <rect x="24" y="326" width="812" height="56" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="349" font-size="11.5" fill="#36424e">Reactive scaling always lags: detection, launch, boot, and health checks happen in sequence.</text>
    <text x="430" y="368" font-size="11.5" fill="#36424e">Headroom (a lower target), warm pools, scheduled or predictive scaling, and faster boot shrink the red bar.</text>

    <text x="430" y="414" font-size="13" fill="#40566b">Size the fleet for the spike you cannot react to in time, not for the average.</text>
  </g>
</svg>
