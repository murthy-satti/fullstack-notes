<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="gda-title gda-desc">
  <title id="gda-title">GeoDNS answers depend on where the query appears to come from</title>
  <desc id="gda-desc">Four users look up api.taskflow.example.com. A user in Frankfurt asks an ISP resolver in Frankfurt, which asks the authoritative GeoDNS server; the server maps the resolver's address to Europe and answers with the eu-west-1 load balancer, 203.0.113.10. A user in Virginia asks an ISP resolver in Virginia and receives the us-east-1 answer, 198.51.100.20. A user in Singapore uses a resolver that forwards the client's subnet with the EDNS Client Subnet option, so the server sees a Singapore subnet and answers with ap-southeast-1, 192.0.2.30. Another user in Singapore uses a public resolver in the United States that does not send the client subnet, so the server sees a US address and answers with us-east-1, which is too far away for that user. GeoDNS sees the resolver, or the subnet it forwards, rather than the user, and every answer is cached for its TTL.</desc>
  <defs>
    <marker id="gda-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="gda-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="99" y="40">1. User looks up the API</text>
      <text x="304" y="40">2. Resolver asks</text>
      <text x="530" y="40">3. GeoDNS decides</text>
      <text x="761" y="40">4. Answer (cached for TTL)</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="24" y="60" width="150" height="44" rx="8"/>
      <rect x="24" y="140" width="150" height="44" rx="8"/>
      <rect x="24" y="220" width="150" height="44" rx="8"/>
      <rect x="24" y="300" width="150" height="44" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="99" y="87">User in Frankfurt</text>
      <text x="99" y="167">User in Virginia</text>
      <text x="99" y="247">User in Singapore</text>
      <text x="99" y="327">User in Singapore</text>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="214" y="60" width="180" height="44" rx="8"/>
      <rect x="214" y="140" width="180" height="44" rx="8"/>
      <rect x="214" y="220" width="180" height="44" rx="8"/>
      <rect x="214" y="300" width="180" height="44" rx="8"/>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="304" y="87">ISP resolver, Frankfurt</text>
      <text x="304" y="167">ISP resolver, Virginia</text>
      <text x="304" y="247">resolver sends ECS /24</text>
      <text x="304" y="327">US resolver, no ECS</text>
    </g>

    <rect x="440" y="60" width="180" height="284" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="530" y="168" font-size="13" font-weight="700" fill="#263e5a">Authoritative GeoDNS</text>
    <text x="530" y="190" font-size="11" fill="#263e5a">maps the resolver IP or</text>
    <text x="530" y="206" font-size="11" fill="#263e5a">the ECS subnet to a place,</text>
    <text x="530" y="222" font-size="11" fill="#263e5a">then picks a region</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M174 82H212" marker-end="url(#gda-arrow)"/>
      <path d="M174 162H212" marker-end="url(#gda-arrow)"/>
      <path d="M174 242H212" marker-end="url(#gda-arrow)"/>
      <path d="M174 322H212" marker-end="url(#gda-arrow)"/>
      <path d="M394 82H438" marker-end="url(#gda-arrow)"/>
      <path d="M394 162H438" marker-end="url(#gda-arrow)"/>
      <path d="M394 242H438" marker-end="url(#gda-arrow)"/>
      <path d="M394 322H438" marker-end="url(#gda-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M620 82H664" marker-end="url(#gda-arrow-ret)"/>
      <path d="M620 162H664" marker-end="url(#gda-arrow-ret)"/>
      <path d="M620 242H664" marker-end="url(#gda-arrow-ret)"/>
      <path d="M620 322H664" marker-end="url(#gda-arrow-ret)"/>
    </g>

    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="666" y="60" width="190" height="44" rx="8"/>
      <rect x="666" y="140" width="190" height="44" rx="8"/>
      <rect x="666" y="220" width="190" height="44" rx="8"/>
    </g>
    <rect x="666" y="300" width="190" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g font-size="11.5" font-weight="700">
      <text x="761" y="79" fill="#294a2e">eu-west-1</text>
      <text x="761" y="159" fill="#294a2e">us-east-1</text>
      <text x="761" y="239" fill="#294a2e">ap-southeast-1</text>
      <text x="761" y="319" fill="#6e2a24">us-east-1 (too far)</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="761" y="95">203.0.113.10</text>
      <text x="761" y="175">198.51.100.20</text>
      <text x="761" y="255">192.0.2.30</text>
      <text x="761" y="335">198.51.100.20</text>
    </g>

    <text x="440" y="378" font-size="11.5" font-style="italic" fill="#40566b">ECS (RFC 7871) forwards a shortened client subnet, so the server can see where the user really is.</text>
    <text x="440" y="414" font-size="13" fill="#40566b">GeoDNS sees the resolver (or the subnet it forwards), not the user, and answers are cached for the TTL.</text>
  </g>
</svg>
