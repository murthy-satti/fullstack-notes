<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="mdc-title mdc-desc">
  <title id="mdc-title">Service mesh control plane and data plane</title>
  <desc id="mdc-desc">The control plane, for example istiod or the Linkerd control plane, watches the Kubernetes API for services and endpoints, reads routing and security policies, and acts as a certificate authority. It pushes configuration to every proxy over xDS-style discovery APIs and issues each workload a short-lived certificate for its identity. In the data plane, Pod A runs the orders app next to a sidecar proxy, and Pod B runs the tasks app next to its own proxy. When orders calls tasks, the request goes from the app to its local proxy over localhost, then across the network as mutual TLS to the other proxy, which hands it to the tasks app. The proxies apply timeouts, retries, traffic splits, and authorization policy, and report metrics, logs, and trace spans to observability backends such as Prometheus and a tracing system. The application code makes plain calls and does not implement these features itself.</desc>
  <defs>
    <marker id="mdc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="mdc-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="200" y="24" width="460" height="86" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="48" font-size="14" font-weight="700" fill="#463365">control plane (istiod, Linkerd control plane)</text>
    <text x="430" y="70" font-size="11.5" fill="#463365">watches services and endpoints, reads routing and security policy,</text>
    <text x="430" y="88" font-size="11.5" fill="#463365">acts as certificate authority for workload identities</text>

    <rect x="24" y="150" width="812" height="170" rx="10" fill="#e5efff" fill-opacity="0.3" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="36" y="170" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="start">data plane</text>

    <rect x="48" y="186" width="320" height="116" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="60" y="204" font-size="12" font-weight="700" fill="#36424e" text-anchor="start">Pod A</text>
    <rect x="62" y="214" width="130" height="72" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="127" y="244" font-size="13" font-weight="700" fill="#66400f">orders app</text>
    <text x="127" y="262" font-size="11" fill="#66400f">plain HTTP call</text>
    <rect x="224" y="214" width="130" height="72" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="289" y="244" font-size="13" font-weight="700" fill="#263e5a">proxy</text>
    <text x="289" y="262" font-size="11" fill="#263e5a">sidecar</text>

    <rect x="492" y="186" width="320" height="116" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="504" y="204" font-size="12" font-weight="700" fill="#36424e" text-anchor="start">Pod B</text>
    <rect x="506" y="214" width="130" height="72" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="571" y="244" font-size="13" font-weight="700" fill="#263e5a">proxy</text>
    <text x="571" y="262" font-size="11" fill="#263e5a">sidecar</text>
    <rect x="668" y="214" width="130" height="72" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="733" y="244" font-size="13" font-weight="700" fill="#66400f">tasks app</text>
    <text x="733" y="262" font-size="11" fill="#66400f">receives plain HTTP</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M192 250H222" marker-end="url(#mdc-arrow)"/>
      <path d="M354 250H504" marker-end="url(#mdc-arrow)"/>
      <path d="M636 250H666" marker-end="url(#mdc-arrow)"/>
    </g>
    <rect x="378" y="232" width="102" height="16" fill="#f5f7fb"/>
    <text x="429" y="244" font-size="11.5" font-weight="700" fill="#294a2e">mutual TLS</text>
    <text x="207" y="298" font-size="10.5" fill="#36424e">localhost</text>
    <text x="651" y="298" font-size="10.5" fill="#36424e">localhost</text>

    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M330 110V212" marker-end="url(#mdc-arrow-ret)"/>
      <path d="M600 110V212" marker-end="url(#mdc-arrow-ret)"/>
    </g>
    <rect x="338" y="124" width="184" height="30" rx="4" fill="#f5f7fb"/>
    <text x="430" y="136" font-size="11" fill="#36424e">config over xDS, plus a</text>
    <text x="430" y="150" font-size="11" fill="#36424e">short-lived certificate per workload</text>

    <rect x="24" y="340" width="812" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="430" y="358" font-size="11.5" fill="#294a2e">Proxies apply timeouts, retries, traffic splits, and authorization, and report metrics, logs, and trace spans</text>
    <text x="430" y="375" font-size="11.5" fill="#294a2e">to Prometheus and a tracing backend, without any of that code living in the applications.</text>

    <text x="430" y="420" font-size="13" fill="#40566b">The control plane decides; the proxies on the request path do the work.</text>
  </g>
</svg>
