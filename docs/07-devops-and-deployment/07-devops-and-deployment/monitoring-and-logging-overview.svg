<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="mlo-title mlo-desc">
  <title id="mlo-title">How logs, traces, and metrics travel from an app to the person on call</title>
  <desc id="mlo-desc">TaskFlow API, instrumented with the pino logger, prom-client, and the OpenTelemetry SDK, emits three signals. Logs are written as JSON to stdout, collected by a log agent such as Fluent Bit or Vector, and stored in Loki or Elasticsearch. Traces are sent over OTLP to an OpenTelemetry Collector that batches, samples, and exports them to a trace store such as Tempo or Jaeger. Metrics are scraped from the /metrics endpoint by Prometheus and stored in a time-series database such as Prometheus or Mimir. All three stores feed Grafana for dashboards, exploration, and trace ID links between signals. The metrics store also feeds alert rules; firing alerts go to Alertmanager, which groups, routes, and deduplicates them and pages the on-call engineer with a runbook link. The engineer then investigates in Grafana.</desc>
  <defs>
    <marker id="mlo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="mlo-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Instrument, collect, store, then look and get alerted</text>

    <rect x="24" y="52" width="140" height="196" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="128" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="94" y="152" font-size="11.5" fill="#66400f">pino logger</text>
    <text x="94" y="170" font-size="11.5" fill="#66400f">prom-client</text>
    <text x="94" y="188" font-size="11.5" fill="#66400f">OpenTelemetry SDK</text>

    <rect x="244" y="52" width="180" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="334" y="74" font-size="14" font-weight="700" fill="#463365">Log agent</text>
    <text x="334" y="93" font-size="11.5" fill="#463365">Fluent Bit or Vector</text>
    <rect x="244" y="124" width="180" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="334" y="146" font-size="14" font-weight="700" fill="#463365">OTel Collector</text>
    <text x="334" y="165" font-size="11.5" fill="#463365">batch, sample, export</text>
    <rect x="244" y="196" width="180" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="334" y="218" font-size="14" font-weight="700" fill="#463365">Prometheus</text>
    <text x="334" y="237" font-size="11.5" fill="#463365">scrapes GET /metrics</text>

    <rect x="474" y="52" width="180" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="564" y="74" font-size="14" font-weight="700" fill="#263e5a">Log store</text>
    <text x="564" y="93" font-size="11.5" fill="#263e5a">Loki or Elasticsearch</text>
    <rect x="474" y="124" width="180" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="564" y="146" font-size="14" font-weight="700" fill="#263e5a">Trace store</text>
    <text x="564" y="165" font-size="11.5" fill="#263e5a">Tempo or Jaeger</text>
    <rect x="474" y="196" width="180" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="564" y="218" font-size="14" font-weight="700" fill="#263e5a">Metrics TSDB</text>
    <text x="564" y="237" font-size="11.5" fill="#263e5a">Prometheus or Mimir</text>

    <rect x="704" y="52" width="152" height="196" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="780" y="128" font-size="14" font-weight="700" fill="#263e5a">Grafana</text>
    <text x="780" y="152" font-size="11.5" fill="#263e5a">dashboards</text>
    <text x="780" y="170" font-size="11.5" fill="#263e5a">explore queries</text>
    <text x="780" y="188" font-size="11.5" fill="#263e5a">trace ID links</text>

    <rect x="244" y="300" width="180" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="334" y="322" font-size="14" font-weight="700" fill="#463365">Alert rules</text>
    <text x="334" y="341" font-size="11.5" fill="#463365">SLO burn-rate queries</text>
    <rect x="474" y="300" width="180" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="564" y="322" font-size="14" font-weight="700" fill="#463365">Alertmanager</text>
    <text x="564" y="341" font-size="11.5" fill="#463365">group, route, dedupe</text>
    <rect x="704" y="300" width="152" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="780" y="322" font-size="14" font-weight="700" fill="#66400f">On-call engineer</text>
    <text x="780" y="341" font-size="11.5" fill="#66400f">paged, with runbook</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 78H242" marker-end="url(#mlo-arrow)"/>
      <path d="M164 150H242" marker-end="url(#mlo-arrow)"/>
      <path d="M164 222H242" marker-end="url(#mlo-arrow)"/>
      <path d="M424 78H472" marker-end="url(#mlo-arrow)"/>
      <path d="M424 150H472" marker-end="url(#mlo-arrow)"/>
      <path d="M424 222H472" marker-end="url(#mlo-arrow)"/>
      <path d="M654 78H702" marker-end="url(#mlo-arrow)"/>
      <path d="M654 150H702" marker-end="url(#mlo-arrow)"/>
      <path d="M654 222H702" marker-end="url(#mlo-arrow)"/>
      <path d="M520 248 410 298" marker-end="url(#mlo-arrow)"/>
      <path d="M424 326H472" marker-end="url(#mlo-arrow)"/>
      <path d="M654 326H702" marker-end="url(#mlo-arrow)"/>
    </g>
    <path d="M780 300V250" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#mlo-arrow-ret)"/>

    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="203" y="71">logs</text>
      <text x="203" y="143">traces</text>
      <text x="203" y="215">metrics</text>
      <text x="770" y="279" text-anchor="end">investigates</text>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="203" y="96">JSON stdout</text>
      <text x="203" y="168">OTLP</text>
      <text x="203" y="240">pull</text>
    </g>

    <text x="440" y="398" font-size="13" fill="#40566b">Each signal answers a different question; alerts reach a person only when users are hurt.</text>
  </g>
</svg>
