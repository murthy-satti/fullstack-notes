<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="rri-title rri-desc">
  <title id="rri-title">A rolling restart of two instances on one server</title>
  <desc id="rri-desc">A timeline from 0 to 33 seconds. At 0 seconds the deploy script switches the current symlink to release 1.9.0 and restarts taskflow-api@3001: it drains and then closes until 7 seconds, starts the new code from 7 to 10 seconds, and serves 1.9.0 from 10 seconds. Meanwhile taskflow-api@3002 keeps serving 1.8.0. At 11 seconds the script has confirmed that 3001 is ready and reports version 1.9.0, so it restarts 3002, which drains and closes until 18 seconds, starts from 18 to 21 seconds, and serves 1.9.0 from 21 seconds. nginx sends requests to both instances for the first 5 seconds, to 3002 only from 5 to 10 seconds while 3001 refuses connections, to both with mixed versions from 10 to 16 seconds, to 3001 only from 16 to 21 seconds, and to both on 1.9.0 after that. One instance always accepts connections, and both versions serve traffic for a few seconds.</desc>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M170 60V228"/>
      <path d="M390 60V228"/>
      <path d="M590 60V228"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="174" y="52">switch symlink, restart 3001</text>
      <text x="394" y="52">3001 ready: restart 3002</text>
      <text x="594" y="52">3002 ready: done</text>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="98">taskflow-api@3001</text>
      <text x="24" y="148">taskflow-api@3002</text>
      <text x="24" y="198">nginx sends to</text>
    </g>

    <g stroke-width="1.5">
      <rect x="170" y="78" width="140" height="30" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="310" y="78" width="60" height="30" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="370" y="78" width="460" height="30" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="170" y="128" width="220" height="30" fill="#e5efff" stroke="#4774aa"/>
      <rect x="390" y="128" width="140" height="30" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="530" y="128" width="60" height="30" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="590" y="128" width="240" height="30" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="170" y="178" width="100" height="30" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="270" y="178" width="100" height="30" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="370" y="178" width="120" height="30" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="490" y="178" width="100" height="30" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="590" y="178" width="240" height="30" fill="#eef1f5" stroke="#8a96a3"/>
    </g>
    <g font-size="11">
      <text x="240" y="97" fill="#66400f">drain, then close</text>
      <text x="340" y="97" fill="#463365">start</text>
      <text x="600" y="97" fill="#294a2e">serving 1.9.0</text>
      <text x="280" y="147" fill="#263e5a">serving 1.8.0</text>
      <text x="460" y="147" fill="#66400f">drain, then close</text>
      <text x="560" y="147" fill="#463365">start</text>
      <text x="710" y="147" fill="#294a2e">serving 1.9.0</text>
      <text x="220" y="197" fill="#36424e">both</text>
      <text x="320" y="197" fill="#36424e">3002 only</text>
      <text x="430" y="197" fill="#36424e">both, mixed</text>
      <text x="540" y="197" fill="#36424e">3001 only</text>
      <text x="710" y="197" fill="#36424e">both on 1.9.0</text>
    </g>

    <path d="M170 240H830" stroke="#40566b" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="1.5">
      <path d="M170 236V244"/>
      <path d="M270 236V244"/>
      <path d="M370 236V244"/>
      <path d="M470 236V244"/>
      <path d="M570 236V244"/>
      <path d="M670 236V244"/>
      <path d="M770 236V244"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="170" y="260">0 s</text>
      <text x="270" y="260">5 s</text>
      <text x="370" y="260">10 s</text>
      <text x="470" y="260">15 s</text>
      <text x="570" y="260">20 s</text>
      <text x="670" y="260">25 s</text>
      <text x="770" y="260">30 s</text>
    </g>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <rect x="24" y="304" width="18" height="14" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="50" y="316">1.8.0 serving</text>
      <rect x="170" y="304" width="18" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="196" y="316">SIGTERM: drain, then close</text>
      <rect x="390" y="304" width="18" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="416" y="316">starting the new release</text>
      <rect x="590" y="304" width="18" height="14" rx="3" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="616" y="316">1.9.0 serving</text>
    </g>

    <text x="430" y="362" font-size="13" fill="#40566b">One instance always accepts connections, and both versions serve traffic for a few seconds.</text>
  </g>
</svg>
