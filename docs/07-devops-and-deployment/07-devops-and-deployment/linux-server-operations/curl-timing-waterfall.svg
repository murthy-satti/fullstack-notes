<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="ctw-title ctw-desc">
  <title id="ctw-title">Where the time goes in one HTTPS request, from curl -w</title>
  <desc id="ctw-desc">A waterfall for one request to https://api.example.com/tasks, measured with curl -w. time_namelookup is 0.012 seconds, so DNS took 12 ms. time_connect is 0.048, so the TCP handshake took 36 ms, about one network round trip. time_appconnect is 0.084, so the TLS 1.3 handshake took another 36 ms, one more round trip. time_starttransfer is 0.312, so 228 ms passed between finishing TLS and receiving the first byte; one round trip of that is network time, which leaves about 192 ms spent in nginx, the app, and the database. time_total is 0.320, so transferring the body took 8 ms. The conclusion: most of the time is server processing, so look at the app and its queries, not the network.</desc>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">curl -w for GET https://api.example.com/tasks (cumulative times in seconds)</text>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="80">DNS lookup</text>
      <text x="24" y="120">TCP connect</text>
      <text x="24" y="160">TLS handshake</text>
      <text x="24" y="200">waiting (TTFB)</text>
      <text x="24" y="240">download body</text>
    </g>

    <g stroke-width="1.5">
      <rect x="150" y="64" width="24" height="24" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="174" y="104" width="72" height="24" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="246" y="144" width="72" height="24" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="318" y="184" width="456" height="24" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="774" y="224" width="16" height="24" rx="3" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <path d="M318 184H390V208H318z" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>

    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="184" y="81">12 ms</text>
      <text x="256" y="121">36 ms: about 1 round trip</text>
      <text x="328" y="161">36 ms: TLS 1.3 needs 1 round trip</text>
    </g>
    <text x="582" y="201" font-size="11.5" font-weight="700" fill="#66400f">about 192 ms in nginx, app, and database</text>
    <text x="354" y="201" font-size="11" fill="#263e5a">1 RTT</text>
    <text x="760" y="241" font-size="11.5" fill="#294a2e" text-anchor="end">8 ms</text>

    <path d="M150 272H790" stroke="#40566b" stroke-width="1.5"/>
    <g stroke="#40566b" stroke-width="1.5">
      <path d="M150 268V276"/>
      <path d="M174 268V276"/>
      <path d="M246 268V276"/>
      <path d="M318 268V276"/>
      <path d="M774 268V276"/>
      <path d="M790 268V276"/>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="150" y="292">0</text>
      <text x="174" y="306">0.012</text>
      <text x="246" y="292">0.048</text>
      <text x="318" y="306">0.084</text>
      <text x="774" y="292">0.312</text>
      <text x="806" y="306">0.320</text>
    </g>
    <g font-size="10.5" fill="#60788d">
      <text x="174" y="320">namelookup</text>
      <text x="246" y="320">connect</text>
      <text x="318" y="320">appconnect</text>
      <text x="740" y="320">starttransfer</text>
      <text x="814" y="334">total</text>
    </g>

    <text x="430" y="362" font-size="13" fill="#40566b">Subtract consecutive timestamps: here the server's own work, not the network, dominates.</text>
  </g>
</svg>
