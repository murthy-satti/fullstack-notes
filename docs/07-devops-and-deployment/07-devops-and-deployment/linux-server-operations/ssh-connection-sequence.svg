<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="scs-title scs-desc">
  <title id="scs-title">What happens during an SSH connection</title>
  <desc id="scs-desc">Transport: 1, the ssh client on your laptop opens a TCP connection to sshd on port 22. 2, both sides send version strings and algorithm lists. 3, the client sends its key share for mlkem768x25519-sha256. 4, the server replies with its key share, its host key, and a signature; both sides now hold the same session keys and everything after this is encrypted. Host check: 5, the client compares the host key with ~/.ssh/known_hosts; on a match it continues, for an unknown key it asks, and for a changed key it refuses. User authentication: 6, the client offers its Ed25519 public key. 7, the server finds the key in authorized_keys. 8, the server asks the client to prove it holds the private key. 9, the client sends a signature over the session identifier. 10, the server reports success. Session: 11, the client opens channels for a shell, a command, port forwards, or sftp. The server proves its identity first and the user second, and private keys never cross the network.</desc>
  <defs>
    <marker id="scs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="scs-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="820" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="20" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="180" y="39" font-size="14" font-weight="700" fill="#66400f">ssh client</text>
    <text x="180" y="55" font-size="11.5" fill="#66400f">your laptop</text>
    <rect x="550" y="20" width="180" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="640" y="39" font-size="14" font-weight="700" fill="#263e5a">sshd</text>
    <text x="640" y="55" font-size="11.5" fill="#263e5a">server, port 22</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M180 64V512"/>
      <path d="M640 64V512"/>
    </g>
    <g stroke="#c9d1db" stroke-width="1.5">
      <path d="M20 238H800"/>
      <path d="M20 310H800"/>
      <path d="M20 468H800"/>
    </g>

    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="20" y="90">Transport</text>
      <text x="20" y="258">Host check</text>
      <text x="20" y="330">User auth</text>
      <text x="20" y="488">Session</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M180 100H638" marker-end="url(#scs-arrow)"/>
      <path d="M180 128H638" marker-end="url(#scs-arrow)"/>
      <path d="M180 178H638" marker-end="url(#scs-arrow)"/>
      <path d="M180 338H638" marker-end="url(#scs-arrow)"/>
      <path d="M180 428H638" marker-end="url(#scs-arrow)"/>
      <path d="M180 500H638" marker-end="url(#scs-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M640 150H182" marker-end="url(#scs-arrow-ret)"/>
      <path d="M640 206H182" marker-end="url(#scs-arrow-ret)"/>
      <path d="M640 402H182" marker-end="url(#scs-arrow-ret)"/>
      <path d="M640 454H182" marker-end="url(#scs-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="410" y="94">1. TCP connection to port 22</text>
      <text x="410" y="122">2. version string and algorithm lists</text>
      <text x="410" y="144">version string and algorithm lists</text>
      <text x="410" y="172">3. key share for mlkem768x25519-sha256</text>
      <text x="410" y="200">4. key share, host key, and signature</text>
      <text x="410" y="332">6. publickey: offer the Ed25519 public key</text>
      <text x="410" y="396">8. OK: prove you hold the private key</text>
      <text x="410" y="422">9. signature over the session identifier</text>
      <text x="410" y="448">10. authentication succeeded</text>
      <text x="410" y="494">11. open channels: shell, exec, -L/-R forwards, sftp</text>
    </g>
    <text x="410" y="226" font-size="11" font-style="italic" fill="#463365">both sides now share session keys; everything after this point is encrypted</text>

    <rect x="192" y="248" width="340" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="362" y="268" font-size="12" font-weight="700" fill="#463365">5. compare host key with ~/.ssh/known_hosts</text>
    <text x="362" y="287" font-size="11" fill="#463365">match: continue · unknown: ask · changed: refuse</text>

    <rect x="360" y="350" width="268" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="494" y="372" font-size="11.5" font-weight="700" fill="#294a2e">7. key found in authorized_keys</text>

    <text x="410" y="540" font-size="13" fill="#40566b">The server proves who it is first, then you prove who you are; private keys never cross the wire.</text>
  </g>
</svg>
