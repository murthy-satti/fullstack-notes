<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="sst-title sst-desc">
  <title id="sst-title">The life of a systemd service with Restart=on-failure</title>
  <desc id="sst-desc">A state machine. From inactive (dead), systemctl start moves the service to activating, where ExecStart runs. When the process has been executed, it becomes active (running). systemctl stop moves it to deactivating, where SIGTERM is sent and SIGKILL follows after TimeoutStopSec; when all processes have exited it returns to inactive. If the process crashes, exits with an error, or is killed by the OOM killer, Restart=on-failure moves it to auto-restart, which waits RestartSec, growing with RestartSteps to 2, 4, 8 seconds and so on, and then starts it again through activating. If the start limit is hit, for example 5 starts within 10 seconds, the service ends in failed with result start-limit-hit, and stays there until someone runs systemctl reset-failed and starts it again.</desc>
  <defs>
    <marker id="sst-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sst-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="175" width="150" height="50" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="99" y="197" font-size="13.5" font-weight="700" fill="#36424e">inactive</text>
    <text x="99" y="214" font-size="11" fill="#36424e">(dead)</text>

    <rect x="250" y="64" width="160" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="330" y="86" font-size="13.5" font-weight="700" fill="#463365">activating</text>
    <text x="330" y="103" font-size="11" fill="#463365">ExecStart runs</text>

    <rect x="480" y="175" width="170" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="565" y="197" font-size="13.5" font-weight="700" fill="#294a2e">active</text>
    <text x="565" y="214" font-size="11" fill="#294a2e">(running)</text>

    <rect x="250" y="300" width="160" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="330" y="322" font-size="13.5" font-weight="700" fill="#66400f">deactivating</text>
    <text x="330" y="339" font-size="11" fill="#66400f">SIGTERM sent</text>

    <rect x="690" y="64" width="150" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="765" y="86" font-size="13.5" font-weight="700" fill="#463365">auto-restart</text>
    <text x="765" y="103" font-size="11" fill="#463365">waits RestartSec</text>

    <rect x="690" y="300" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="765" y="322" font-size="13.5" font-weight="700" fill="#6e2a24">failed</text>
    <text x="765" y="339" font-size="11" fill="#6e2a24">start-limit-hit</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M99 175V89H248" marker-end="url(#sst-arrow)"/>
      <path d="M410 89H565V173" marker-end="url(#sst-arrow)"/>
      <path d="M565 225V325H412" marker-end="url(#sst-arrow)"/>
      <path d="M250 325H99V227" marker-end="url(#sst-arrow)"/>
      <path d="M765 64V40H330V62" marker-end="url(#sst-arrow)"/>
    </g>
    <path d="M620 175V140H735V116" fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sst-arrow-red)"/>
    <path d="M800 114V298" fill="none" stroke="#b5524b" stroke-width="2" stroke-linecap="round" marker-end="url(#sst-arrow-red)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="173" y="81">systemctl start</text>
      <text x="487" y="81">exec succeeded</text>
      <text x="573" y="270" text-anchor="start">systemctl stop</text>
      <text x="175" y="317">all processes exited</text>
      <text x="548" y="33">after RestartSec (RestartSteps grow it: 2 s, 4 s, 8 s ...)</text>
    </g>
    <text x="727" y="133" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="end">crash, error exit, OOM kill</text>
    <g font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="end">
      <text x="792" y="236">start limit hit:</text>
      <text x="792" y="252">5 starts in 10 s</text>
    </g>
    <g font-size="11" fill="#36424e">
      <text x="330" y="368">SIGKILL after TimeoutStopSec</text>
      <text x="765" y="368">systemctl reset-failed,</text>
      <text x="765" y="383">then start again</text>
    </g>

    <text x="430" y="415" font-size="13" fill="#40566b">Restart= recovers from crashes, the start limit stops crash loops, and TimeoutStopSec bounds a stop.</text>
  </g>
</svg>
