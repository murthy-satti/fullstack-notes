<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="gho-title gho-desc">
  <title id="gho-title">How a change moves between the four Git areas</title>
  <desc id="gho-desc">Four lanes: the working tree with the files you edit, the staging area (the index), the local repository inside .git, and the remote repository on GitHub. Sharing a change: 1, git add copies the file from the working tree into the staging area; 2, git commit records the staged snapshot as a commit in the local repository; 3, git push origin main uploads the new commits to the remote. Updating: 4, git fetch origin downloads new commits from the remote into the local repository and moves only the remote-tracking branch origin/main; 5, git merge origin/main brings those commits into your branch and updates the files in the working tree; git pull does both steps, fetch followed by merge or rebase, in one command.</desc>
  <defs>
    <marker id="gho-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="gho-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="20" width="170" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="115" y="44" font-size="14" font-weight="700" fill="#66400f">Working tree</text>
    <text x="115" y="62" font-size="11.5" fill="#66400f">the files you edit</text>
    <rect x="240" y="20" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="325" y="44" font-size="14" font-weight="700" fill="#463365">Staging area</text>
    <text x="325" y="62" font-size="11.5" fill="#463365">the index: next commit</text>
    <rect x="450" y="20" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="535" y="44" font-size="14" font-weight="700" fill="#263e5a">Local repository</text>
    <text x="535" y="62" font-size="11.5" fill="#263e5a">.git: commits, branches</text>
    <rect x="660" y="20" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="745" y="44" font-size="14" font-weight="700" fill="#263e5a">Remote repository</text>
    <text x="745" y="62" font-size="11.5" fill="#263e5a">origin on GitHub</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M115 76V360"/>
      <path d="M325 76V360"/>
      <path d="M535 76V360"/>
      <path d="M745 76V360"/>
    </g>

    <text x="24" y="100" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Share</text>
    <path d="M24 222H836" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="246" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Update</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M115 122H323" marker-end="url(#gho-arrow)"/>
      <path d="M325 162H533" marker-end="url(#gho-arrow)"/>
      <path d="M535 202H743" marker-end="url(#gho-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M745 266H537" marker-end="url(#gho-arrow-ret)"/>
      <path d="M535 310H117" marker-end="url(#gho-arrow-ret)"/>
      <path d="M745 346H117" marker-end="url(#gho-arrow-ret)"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="220" y="115">1. git add src/app.js</text>
      <text x="430" y="155">2. git commit -m "Add tasks"</text>
      <text x="640" y="195">3. git push origin main</text>
      <text x="640" y="259">4. git fetch origin</text>
    </g>
    <text x="548" y="284" font-size="11" font-style="italic" fill="#263e5a" text-anchor="start">only origin/main moves</text>
    <rect x="243" y="296" width="164" height="14" fill="#f5f7fb"/>
    <text x="325" y="307" font-size="11.5" fill="#36424e">5. git merge origin/main</text>
    <rect x="300" y="332" width="260" height="14" fill="#f5f7fb"/>
    <text x="430" y="343" font-size="11.5" font-weight="700" fill="#36424e">git pull = fetch + merge (or rebase)</text>

    <text x="430" y="392" font-size="13" fill="#40566b">Add, commit, and push move work to the right; fetch and pull bring other people's work back.</text>
  </g>
</svg>
