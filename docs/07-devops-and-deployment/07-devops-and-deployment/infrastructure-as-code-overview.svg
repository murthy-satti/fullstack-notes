<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="iao-title iao-desc">
  <title id="iao-title">Infrastructure as code: change, plan, review, apply, with remote state</title>
  <desc id="iao-desc">1, an engineer changes Terraform code in a branch. 2, a pull request triggers CI to run init, validate, and plan; plan reads the remote state to know what already exists and compares it with the code and the real resources. 3, a reviewer reads the plan, for example 2 to add, 1 to change, 0 to destroy, and approves. 4, on merge, CI applies exactly that change: it takes the state lock, calls the cloud provider APIs, and writes the new state. The provider creates or updates real resources such as an S3 bucket, an IAM policy, and a VPC. A scheduled plan compares code, state, and reality and shows any drift as a diff.</desc>
  <defs>
    <marker id="iao-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="iao-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="50" width="170" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="105" y="75" font-size="14" font-weight="700" fill="#66400f">1. Change code</text>
    <text x="105" y="94" font-size="11.5" fill="#66400f">.tf files in a branch</text>
    <rect x="230" y="50" width="170" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="315" y="75" font-size="14" font-weight="700" fill="#463365">2. Plan in CI</text>
    <text x="315" y="94" font-size="11.5" fill="#463365">init, validate, plan</text>
    <rect x="440" y="50" width="170" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="525" y="75" font-size="14" font-weight="700" fill="#294a2e">3. Review the plan</text>
    <text x="525" y="94" font-size="11.5" fill="#294a2e">+2 add, ~1 change, -0</text>
    <rect x="650" y="50" width="170" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="735" y="75" font-size="14" font-weight="700" fill="#463365">4. Apply on merge</text>
    <text x="735" y="94" font-size="11.5" fill="#463365">exactly the plan reviewed</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M190 80H228" marker-end="url(#iao-arrow)"/>
      <path d="M400 80H438" marker-end="url(#iao-arrow)"/>
      <path d="M610 80H648" marker-end="url(#iao-arrow)"/>
    </g>

    <rect x="230" y="190" width="170" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="315" y="215" font-size="14" font-weight="700" fill="#263e5a">Remote state</text>
    <text x="315" y="234" font-size="11.5" fill="#263e5a">with a lock</text>
    <path d="M280 188V112" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#iao-arrow-ret)"/>
    <text x="272" y="156" font-size="11" fill="#36424e" text-anchor="end">read</text>
    <path d="M700 110V150H360V188" fill="none" stroke="#40566b" stroke-width="2" stroke-linejoin="round" marker-end="url(#iao-arrow)"/>
    <rect x="450" y="143" width="150" height="14" fill="#f5f7fb"/>
    <text x="525" y="154" font-size="11" fill="#36424e">lock, then write new state</text>

    <rect x="650" y="190" width="170" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="735" y="215" font-size="14" font-weight="700" fill="#263e5a">Cloud APIs</text>
    <text x="735" y="234" font-size="11.5" fill="#263e5a">create, update, delete</text>
    <path d="M770 110V188" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#iao-arrow)"/>

    <rect x="650" y="290" width="170" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="735" y="315" font-size="14" font-weight="700" fill="#263e5a">Real resources</text>
    <text x="735" y="334" font-size="11.5" fill="#263e5a">bucket, IAM policy, VPC</text>
    <path d="M735 250V288" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#iao-arrow)"/>

    <rect x="20" y="290" width="580" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="310" y="315" font-size="12.5" font-weight="700" fill="#463365">Scheduled plan: compare code, state, and reality</text>
    <text x="310" y="334" font-size="11.5" fill="#463365">manual changes in the console show up as drift in the diff</text>

    <text x="430" y="382" font-size="13" fill="#40566b">Infrastructure changes go through the same review and automation as application code.</text>
  </g>
</svg>
