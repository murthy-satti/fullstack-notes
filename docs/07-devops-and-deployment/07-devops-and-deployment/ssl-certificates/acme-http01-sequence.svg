<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-labelledby="ahs-title ahs-desc">
  <title id="ahs-title">ACME certificate issuance with the HTTP-01 challenge</title>
  <desc id="ahs-desc">Three participants: the ACME client (certbot on the server), the web server nginx listening on port 80 for api.example.com, and the ACME CA, Let's Encrypt. 1: the client sends newOrder for api.example.com to the CA. 2: the CA returns an authorization with an http-01 challenge and a token. 3: the client writes the key authorization file into the web root. 4: the client tells the CA the challenge is ready. 5: the CA's validators, from several network vantage points, request http://api.example.com/.well-known/acme-challenge/ followed by the token on port 80. 6: nginx returns 200 with the key authorization, the token plus the account key thumbprint. 7: the CA marks the authorization valid. 8: the client finalizes the order with a CSR for a new key pair. 9: the CA returns the certificate chain. 10: the client installs the certificate and reloads nginx.</desc>
  <defs>
    <marker id="ahs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ahs-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="20" width="180" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="130" y="39" font-size="14" font-weight="700" fill="#463365">ACME client</text>
    <text x="130" y="55" font-size="11.5" fill="#463365">certbot on the server</text>
    <rect x="310" y="20" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="39" font-size="14" font-weight="700" fill="#66400f">nginx :80</text>
    <text x="400" y="55" font-size="11.5" fill="#66400f">api.example.com</text>
    <rect x="620" y="20" width="180" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="39" font-size="14" font-weight="700" fill="#263e5a">ACME CA</text>
    <text x="710" y="55" font-size="11.5" fill="#263e5a">Let's Encrypt</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M130 64V480"/>
      <path d="M400 64V480"/>
      <path d="M710 64V480"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M130 100H708" marker-end="url(#ahs-arrow)"/>
      <path d="M130 176H398" marker-end="url(#ahs-arrow)"/>
      <path d="M130 220H708" marker-end="url(#ahs-arrow)"/>
      <path d="M710 260H402" marker-end="url(#ahs-arrow)"/>
      <path d="M130 376H708" marker-end="url(#ahs-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M710 138H132" marker-end="url(#ahs-arrow-ret)"/>
      <path d="M400 308H708" marker-end="url(#ahs-arrow-ret)"/>
      <path d="M710 342H132" marker-end="url(#ahs-arrow-ret)"/>
      <path d="M710 410H132" marker-end="url(#ahs-arrow-ret)"/>
    </g>

    <g fill="#f5f7fb">
      <rect x="320" y="81" width="200" height="14"/>
      <rect x="272" y="119" width="296" height="14"/>
      <rect x="340" y="201" width="160" height="14"/>
      <rect x="340" y="323" width="160" height="14"/>
      <rect x="290" y="357" width="260" height="14"/>
      <rect x="350" y="391" width="140" height="14"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="420" y="92">1. newOrder: api.example.com</text>
      <text x="420" y="130">2. authorization: http-01 challenge, token</text>
      <text x="265" y="168">3. write key authorization</text>
      <text x="420" y="212">4. challenge is ready</text>
      <text x="555" y="252">5. GET /.well-known/acme-challenge/</text>
      <text x="555" y="300">6. 200: token.thumbprint</text>
      <text x="420" y="334">7. authorization valid</text>
      <text x="420" y="368">8. finalize: CSR for a new key pair</text>
      <text x="420" y="402">9. certificate chain</text>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="265" y="192">into the web root</text>
      <text x="555" y="276">port 80, from several regions</text>
    </g>

    <rect x="40" y="430" width="280" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="180" y="455" font-size="11.5" fill="#294a2e">10. install fullchain.pem, reload nginx</text>

    <text x="24" y="508" font-size="11.5" fill="#36424e" text-anchor="start">key authorization = token + "." + base64url(SHA-256 thumbprint of the ACME account public key)</text>
    <text x="430" y="542" font-size="13" fill="#40566b">The CA proves you control the domain by fetching a file only you could have placed there.</text>
  </g>
</svg>
