<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="mth-title mth-desc">
  <title id="mth-title">Mutual TLS: both sides present certificates</title>
  <desc id="mth-desc">A TaskFlow worker, acting as the client, connects to the internal reports service. 1: the worker sends ClientHello. 2: the server replies with ServerHello and, encrypted, a CertificateRequest listing the CAs it accepts. 3: the server sends its own Certificate, CertificateVerify, and Finished. The worker verifies the server certificate as in normal TLS. 4: the worker sends its client Certificate, whose SAN is the URI spiffe://example.com/ns/taskflow/sa/worker. 5: the worker sends CertificateVerify, signed with its client private key. 6: the worker sends Finished. The server verifies the client chain against the internal CA, maps the SAN to the identity worker, and authorizes the request. 7: application data flows both ways.</desc>
  <defs>
    <marker id="mth-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="mth-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="mth-arrow-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
    <marker id="mth-arrow-ok-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="860" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="20" width="160" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="39" font-size="14" font-weight="700" fill="#66400f">Worker (client)</text>
    <text x="150" y="55" font-size="11.5" fill="#66400f">has a client cert</text>
    <rect x="630" y="20" width="160" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="39" font-size="14" font-weight="700" fill="#263e5a">Reports service</text>
    <text x="710" y="55" font-size="11.5" fill="#263e5a">requires client certs</text>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M150 64V420"/>
      <path d="M710 64V420"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 96H708" marker-end="url(#mth-arrow)"/>
      <path d="M150 244H708" marker-end="url(#mth-arrow)"/>
      <path d="M150 280H708" marker-end="url(#mth-arrow)"/>
      <path d="M150 316H708" marker-end="url(#mth-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M710 136H152" marker-end="url(#mth-arrow-ret)"/>
      <path d="M710 172H152" marker-end="url(#mth-arrow-ret)"/>
    </g>
    <path d="M154 400H706" fill="none" stroke="#53845b" stroke-width="2.5" stroke-linecap="round" marker-start="url(#mth-arrow-ok-start)" marker-end="url(#mth-arrow-ok)"/>

    <g font-size="11.5" fill="#36424e">
      <text x="430" y="88">1. ClientHello</text>
      <text x="430" y="128">2. ServerHello, {CertificateRequest: accepted CAs}</text>
      <text x="430" y="164">3. {Certificate} {CertificateVerify} {Finished} (server's)</text>
      <text x="430" y="236">4. {Certificate}: SAN URI spiffe://example.com/ns/taskflow/sa/worker</text>
      <text x="430" y="272">5. {CertificateVerify}: signed with the client private key</text>
      <text x="430" y="308">6. {Finished}</text>
    </g>
    <text x="430" y="392" font-size="11.5" font-weight="700" fill="#294a2e">7. application data, both identities proven</text>

    <rect x="156" y="190" width="264" height="30" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="288" y="210" font-size="11.5" fill="#294a2e">worker verifies the server as usual</text>

    <rect x="400" y="330" width="300" height="46" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="550" y="349" font-size="11.5" fill="#294a2e">server verifies the client chain against</text>
    <text x="550" y="366" font-size="11.5" fill="#294a2e">the internal CA, maps SAN to "worker"</text>

    <text x="430" y="456" font-size="13" fill="#40566b">mTLS authenticates the caller at the connection, before any application code runs.</text>
  </g>
</svg>
