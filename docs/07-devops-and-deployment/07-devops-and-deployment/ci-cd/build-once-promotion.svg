<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="bop-title bop-desc">
  <title id="bop-title">Build once, then promote the same artifact with per-environment configuration</title>
  <desc id="bop-desc">Commit a1b2c3d on main is built exactly once by the CI build job, producing the image ghcr.io/example/taskflow-api at digest sha256:9f2c, tagged sha-a1b2c3d. The registry stores it. The same digest is deployed to dev, then to staging, then to production. At deploy time each environment injects its own configuration and secrets, such as the MongoDB connection string, log level, and API keys, from that environment's store; nothing environment-specific is baked into the image. Tests run against dev and staging prove the exact bits that later run in production, and every deployment record names the same digest.</desc>
  <defs>
    <marker id="bop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="bop-arrow-cfg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="40" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="95" y="63" font-size="13" font-weight="700" fill="#66400f">Commit a1b2c3d</text>
    <text x="95" y="81" font-size="11" fill="#66400f">merged to main</text>
    <rect x="200" y="40" width="150" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="275" y="63" font-size="13" font-weight="700" fill="#463365">Build job</text>
    <text x="275" y="81" font-size="11" fill="#463365">runs exactly once</text>
    <rect x="380" y="34" width="480" height="68" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="620" y="57" font-size="13" font-weight="700" fill="#263e5a">Registry: ghcr.io/example/taskflow-api</text>
    <text x="620" y="75" font-size="12" font-weight="700" fill="#263e5a">@sha256:9f2c... (immutable digest)</text>
    <text x="620" y="92" font-size="11" fill="#263e5a">tags: sha-a1b2c3d, 2.4.0</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M170 68H198" marker-end="url(#bop-arrow)"/>
      <path d="M350 68H378" marker-end="url(#bop-arrow)"/>
    </g>

    <g stroke-width="2">
      <rect x="60" y="170" width="200" height="66" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="340" y="170" width="200" height="66" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="620" y="170" width="200" height="66" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="160" y="194" fill="#263e5a">dev</text>
      <text x="440" y="194" fill="#263e5a">staging</text>
      <text x="720" y="194" fill="#294a2e">production</text>
    </g>
    <g font-size="11.5">
      <text x="160" y="212" fill="#263e5a">runs sha256:9f2c...</text>
      <text x="160" y="228" fill="#263e5a">smoke tests</text>
      <text x="440" y="212" fill="#263e5a">runs sha256:9f2c...</text>
      <text x="440" y="228" fill="#263e5a">e2e tests pass</text>
      <text x="720" y="212" fill="#294a2e">runs sha256:9f2c...</text>
      <text x="720" y="228" fill="#294a2e">after approval</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M620 102 170 168" marker-end="url(#bop-arrow)"/>
      <path d="M620 102 445 168" marker-end="url(#bop-arrow)"/>
      <path d="M620 102 715 168" marker-end="url(#bop-arrow)"/>
      <path d="M260 203H338" marker-end="url(#bop-arrow)"/>
      <path d="M540 203H618" marker-end="url(#bop-arrow)"/>
    </g>
    <text x="299" y="196" font-size="11" font-style="italic" fill="#40566b">promote</text>
    <text x="579" y="196" font-size="11" font-style="italic" fill="#40566b">promote</text>
    <rect x="424" y="126" width="212" height="16" fill="#f5f7fb"/>
    <text x="530" y="138" font-size="11" font-weight="700" fill="#263e5a">same digest, pulled by each env</text>

    <g stroke-width="1.5" fill="#f0e9fb" stroke="#8062a8">
      <rect x="60" y="282" width="200" height="56" rx="8"/>
      <rect x="340" y="282" width="200" height="56" rx="8"/>
      <rect x="620" y="282" width="200" height="56" rx="8"/>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="160" y="304" font-weight="700">dev config and secrets</text>
      <text x="160" y="321" font-size="11">MONGODB_URI, LOG_LEVEL=debug</text>
      <text x="440" y="304" font-weight="700">staging config and secrets</text>
      <text x="440" y="321" font-size="11">MONGODB_URI, LOG_LEVEL=info</text>
      <text x="720" y="304" font-weight="700">prod config and secrets</text>
      <text x="720" y="321" font-size="11">MONGODB_URI, LOG_LEVEL=info</text>
    </g>
    <g fill="none" stroke="#8062a8" stroke-width="1.8" stroke-dasharray="5 4">
      <path d="M160 282V238" marker-end="url(#bop-arrow-cfg)"/>
      <path d="M440 282V238" marker-end="url(#bop-arrow-cfg)"/>
      <path d="M720 282V238" marker-end="url(#bop-arrow-cfg)"/>
    </g>
    <text x="440" y="264" font-size="11" font-style="italic" fill="#463365">injected at deploy time, never baked into the image</text>

    <text x="440" y="378" font-size="13" fill="#40566b">Production runs the exact bits that passed every earlier stage; only configuration differs.</text>
  </g>
</svg>
