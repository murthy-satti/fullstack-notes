<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="dde-title dde-desc">
  <title id="dde-title">Who controls which part of example.com</title>
  <desc id="dde-desc">Top row, three separate roles: the registrar, where you register example.com and choose its nameservers; the .com registry, which publishes the delegation as NS records plus a DS record when DNSSEC is on; and the DNS host, whose authoritative nameservers serve the example.com zone. The registrar sets the nameservers at the registry, the registry delegates to the DNS host, and the DNS host answers queries from the zone. The zone holds five kinds of records: app.example.com, a CNAME to the CDN edge that serves TaskFlow Web files; api.example.com, an A or alias record for the load balancer in front of TaskFlow API; MX records pointing to the mail provider with the inbound mailboxes; TXT records with SPF, DKIM, and DMARC for the sending service that sends TaskFlow's app email; and a CAA record naming the allowed certificate authority, letsencrypt.org. Changing nameservers moves the whole zone; changing one record moves one service.</desc>
  <defs>
    <marker id="dde-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Who controls which part of example.com</text>

    <rect x="24" y="46" width="230" height="74" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="139" y="70" font-size="14" font-weight="700" fill="#463365">Registrar</text>
    <text x="139" y="90" font-size="11.5" fill="#463365">you register example.com</text>
    <text x="139" y="106" font-size="11.5" fill="#463365">and choose its nameservers</text>

    <rect x="325" y="46" width="230" height="74" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="70" font-size="14" font-weight="700" fill="#263e5a">.com registry</text>
    <text x="440" y="90" font-size="11.5" fill="#263e5a">publishes the delegation:</text>
    <text x="440" y="106" font-size="11.5" fill="#263e5a">NS records (+ DS for DNSSEC)</text>

    <rect x="626" y="46" width="230" height="74" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="741" y="70" font-size="14" font-weight="700" fill="#263e5a">DNS host</text>
    <text x="741" y="90" font-size="11.5" fill="#263e5a">authoritative nameservers</text>
    <text x="741" y="106" font-size="11.5" fill="#263e5a">serve the example.com zone</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M254 86H323" marker-end="url(#dde-arrow)"/>
      <path d="M555 86H624" marker-end="url(#dde-arrow)"/>
      <path d="M741 120V148" marker-end="url(#dde-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="289" y="78">sets NS</text>
      <text x="590" y="78">delegates</text>
      <text x="752" y="139" text-anchor="start">answers queries</text>
    </g>

    <rect x="14" y="150" width="852" height="118" rx="10" fill="none" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="28" y="170" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">example.com zone (records at the DNS host)</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="24" y="182" width="152" height="50" rx="8"/>
      <rect x="194" y="182" width="152" height="50" rx="8"/>
      <rect x="364" y="182" width="152" height="50" rx="8"/>
      <rect x="534" y="182" width="152" height="50" rx="8"/>
      <rect x="704" y="182" width="152" height="50" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="100" y="203">app.example.com</text>
      <text x="270" y="203">api.example.com</text>
      <text x="440" y="203">MX records</text>
      <text x="610" y="203">TXT records</text>
      <text x="780" y="203">CAA record</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="100" y="222">CNAME to the CDN</text>
      <text x="270" y="222">A or alias record</text>
      <text x="440" y="222">inbound mail</text>
      <text x="610" y="222">SPF, DKIM, DMARC</text>
      <text x="780" y="222">allowed CAs</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M100 232V298" marker-end="url(#dde-arrow)"/>
      <path d="M270 232V298" marker-end="url(#dde-arrow)"/>
      <path d="M440 232V298" marker-end="url(#dde-arrow)"/>
      <path d="M610 232V298" marker-end="url(#dde-arrow)"/>
      <path d="M780 232V298" marker-end="url(#dde-arrow)"/>
    </g>

    <rect x="24" y="300" width="152" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="194" y="300" width="152" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="364" y="300" width="152" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="534" y="300" width="152" height="58" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="704" y="300" width="152" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="14" font-weight="700">
      <text x="100" y="324" fill="#463365">CDN edge</text>
      <text x="270" y="324" fill="#263e5a">Load balancer</text>
      <text x="440" y="324" fill="#263e5a">Mail provider</text>
      <text x="610" y="324" fill="#463365">Sending service</text>
      <text x="780" y="324" fill="#294a2e">Allowed CA</text>
    </g>
    <g font-size="11.5">
      <text x="100" y="343" fill="#463365">TaskFlow Web files</text>
      <text x="270" y="343" fill="#263e5a">TaskFlow API</text>
      <text x="440" y="343" fill="#263e5a">inbound mailboxes</text>
      <text x="610" y="343" fill="#463365">TaskFlow app email</text>
      <text x="780" y="343" fill="#294a2e">letsencrypt.org</text>
    </g>

    <text x="440" y="392" font-size="13" fill="#40566b">Three separate roles; the zone's records decide where web, API, and mail traffic go.</text>
    <text x="440" y="412" font-size="13" fill="#40566b">Changing nameservers moves the whole zone; changing a record moves one service.</text>
  </g>
</svg>
