<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="pel-title pel-desc">
  <title id="pel-title">Lifecycle of a per-pull-request preview environment</title>
  <desc id="pel-desc">A developer opens pull request 123. CI builds an image tagged with the pull request's commit, deploys it into its own namespace pr-123, seeds the preview database with synthetic users and tasks, and posts the preview link as a comment on the pull request. Every new push rebuilds and redeploys the same preview. Reviewers test the live preview. When the pull request is merged or closed, a webhook event triggers the destroy step, which deletes the namespace, the database, and the DNS record, so nothing is left running and the cost returns to zero. As a safety net, a scheduled TTL reaper deletes any preview idle for more than 72 hours in case the close event was missed.</desc>
  <defs>
    <marker id="pel-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pel-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">While the pull request is open</text>

    <rect x="20" y="50" width="140" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="90" y="74" font-size="14" font-weight="700" fill="#66400f">PR opened</text>
    <text x="90" y="92" font-size="11.5" fill="#66400f">#123</text>
    <rect x="190" y="50" width="140" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="260" y="74" font-size="14" font-weight="700" fill="#463365">Build image</text>
    <text x="260" y="92" font-size="11.5" fill="#463365">tag = commit SHA</text>
    <rect x="360" y="50" width="140" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="74" font-size="14" font-weight="700" fill="#263e5a">Deploy preview</text>
    <text x="430" y="92" font-size="11.5" fill="#263e5a">namespace pr-123</text>
    <rect x="530" y="50" width="140" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="600" y="74" font-size="14" font-weight="700" fill="#263e5a">Seed data</text>
    <text x="600" y="92" font-size="11.5" fill="#263e5a">synthetic users</text>
    <rect x="700" y="50" width="140" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="770" y="74" font-size="14" font-weight="700" fill="#463365">Comment link</text>
    <text x="770" y="92" font-size="11.5" fill="#463365">on the PR</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M160 78H188" marker-end="url(#pel-arrow)"/>
      <path d="M330 78H358" marker-end="url(#pel-arrow)"/>
      <path d="M500 78H528" marker-end="url(#pel-arrow)"/>
      <path d="M670 78H698" marker-end="url(#pel-arrow)"/>
    </g>

    <path d="M770 106V136H260V108" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#pel-arrow-ret)"/>
    <rect x="420" y="129" width="200" height="14" fill="#f5f7fb"/>
    <text x="520" y="140" font-size="11.5" fill="#36424e">new push: rebuild and redeploy</text>

    <path d="M90 106V194" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#pel-arrow)"/>
    <text x="100" y="160" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">reviewers test the live preview</text>

    <path d="M20 178H840" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="840" y="170" font-size="13" font-weight="700" fill="#40566b" text-anchor="end">When the pull request ends</text>

    <rect x="20" y="196" width="180" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="220" font-size="14" font-weight="700" fill="#66400f">Merged or closed</text>
    <text x="110" y="238" font-size="11.5" fill="#66400f">webhook event</text>
    <rect x="250" y="196" width="190" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="345" y="220" font-size="14" font-weight="700" fill="#6e2a24">Destroy preview</text>
    <text x="345" y="238" font-size="11.5" fill="#6e2a24">namespace, DB, DNS record</text>
    <rect x="490" y="196" width="180" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="220" font-size="14" font-weight="700" fill="#294a2e">Nothing running</text>
    <text x="580" y="238" font-size="11.5" fill="#294a2e">cost returns to zero</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M200 224H248" marker-end="url(#pel-arrow)"/>
      <path d="M440 224H488" marker-end="url(#pel-arrow)"/>
    </g>

    <rect x="250" y="292" width="190" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="345" y="312" font-size="13" font-weight="700" fill="#463365">TTL reaper (scheduled)</text>
    <text x="345" y="329" font-size="11.5" fill="#463365">deletes previews idle &gt; 72 h</text>
    <path d="M345 292V254" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pel-arrow-ret)"/>
    <text x="452" y="320" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">safety net when the close event is missed</text>

    <text x="430" y="368" font-size="13" fill="#40566b">A preview lives exactly as long as its pull request; anything else becomes cost and risk.</text>
  </g>
</svg>
