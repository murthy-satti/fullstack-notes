<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="cts-title cts-desc">
  <title id="cts-title">Canary rollout in steps with automatic analysis and an abort branch</title>
  <desc id="cts-desc">Version 2 is deployed with 0 percent of traffic. It then receives 1 percent for a 10-minute soak, followed by a check. If the check passes, it receives 10 percent for 10 minutes and is checked again; if that passes, 50 percent for 20 minutes and a third check; if that passes, the canary is promoted to 100 percent. Each check compares the canary with a baseline on 5xx rate, p99 latency, saturation, and key business events. If any check fails, the rollout aborts automatically: the canary weight returns to 0 percent, the canary is scaled down, and the team is alerted.</desc>
  <defs>
    <marker id="cts-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cts-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5524b"/>
    </marker>
  </defs>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="430" y="40" font-size="11.5" fill="#40566b">Each check compares the canary with a baseline: 5xx rate, p99 latency, saturation, key business events.</text>

    <rect x="20" y="85" width="92" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="66" y="106" font-size="14" font-weight="700" fill="#66400f">Deploy</text>
    <text x="66" y="124" font-size="11.5" fill="#66400f">v2 at 0%</text>
    <rect x="132" y="85" width="92" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="178" y="106" font-size="14" font-weight="700" fill="#263e5a">1%</text>
    <text x="178" y="124" font-size="11.5" fill="#263e5a">10 min soak</text>
    <rect x="338" y="85" width="92" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="384" y="106" font-size="14" font-weight="700" fill="#263e5a">10%</text>
    <text x="384" y="124" font-size="11.5" fill="#263e5a">10 min soak</text>
    <rect x="544" y="85" width="92" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="590" y="106" font-size="14" font-weight="700" fill="#263e5a">50%</text>
    <text x="590" y="124" font-size="11.5" fill="#263e5a">20 min soak</text>
    <rect x="750" y="85" width="92" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="796" y="106" font-size="14" font-weight="700" fill="#294a2e">Promote</text>
    <text x="796" y="124" font-size="11.5" fill="#294a2e">100% to v2</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M274 82 310 110 274 138 238 110z"/>
      <path d="M480 82 516 110 480 138 444 110z"/>
      <path d="M686 82 722 110 686 138 650 110z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="274" y="114">pass?</text>
      <text x="480" y="114">pass?</text>
      <text x="686" y="114">pass?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M112 110H130" marker-end="url(#cts-arrow)"/>
      <path d="M224 110H236" marker-end="url(#cts-arrow)"/>
      <path d="M310 110H336" marker-end="url(#cts-arrow)"/>
      <path d="M430 110H442" marker-end="url(#cts-arrow)"/>
      <path d="M516 110H542" marker-end="url(#cts-arrow)"/>
      <path d="M636 110H648" marker-end="url(#cts-arrow)"/>
      <path d="M722 110H748" marker-end="url(#cts-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#294a2e">
      <text x="324" y="102">yes</text>
      <text x="530" y="102">yes</text>
      <text x="736" y="102">yes</text>
    </g>

    <g fill="none" stroke="#b5524b" stroke-width="2" stroke-linejoin="round">
      <path d="M274 138V200H686V138"/>
      <path d="M480 138V200"/>
      <path d="M480 200V226" marker-end="url(#cts-arrow-red)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#6e2a24" text-anchor="start">
      <text x="280" y="164">no</text>
      <text x="486" y="164">no</text>
      <text x="692" y="164">no</text>
    </g>

    <rect x="300" y="228" width="360" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="480" y="251" font-size="14" font-weight="700" fill="#6e2a24">Abort: roll back automatically</text>
    <text x="480" y="270" font-size="11.5" fill="#6e2a24">canary weight to 0%, scale it down, alert the team</text>

    <text x="430" y="322" font-size="13" fill="#40566b">Small steps limit how many users a bad version reaches; every step must earn the next.</text>
  </g>
</svg>
