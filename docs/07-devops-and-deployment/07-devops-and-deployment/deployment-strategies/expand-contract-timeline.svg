<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="ect-title ect-desc">
  <title id="ect-title">Renaming a column with expand and contract over six steps</title>
  <desc id="ect-desc">Renaming the tasks column notes to description takes six steps. Step 1, expand: a migration adds an empty description column; code v1 still reads and writes notes; rolling back to anything is safe. Step 2, deploy v2: the schema has notes and description; v2 reads notes and writes both; it can roll back to v1. Step 3, a batched backfill fills description for old rows; code still reads notes and writes both; rollback to v1 is still safe. Step 4, deploy v3: both columns are complete and in sync; v3 reads description and writes both; it can roll back to v2 or v1. Step 5, deploy v4: notes becomes stale; v4 reads and writes description only; it can roll back only to v3. Step 6, contract: weeks later a migration drops notes, leaving description only; from here only rolling forward from v4 is possible.</desc>
  <rect width="860" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="12.5" font-weight="700" fill="#40566b">
      <text x="24" y="42">Step</text>
      <text x="222" y="42">Schema</text>
      <text x="420" y="42">Code reads</text>
      <text x="553" y="42">Code writes</text>
      <text x="686" y="42">Safe rollback to</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="54" width="190" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="24" y="102" width="190" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="150" width="190" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="24" y="198" width="190" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="246" width="190" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="24" y="294" width="190" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="36" y="79" fill="#263e5a">1. Expand: add column</text>
      <text x="36" y="127" fill="#66400f">2. Deploy v2</text>
      <text x="36" y="175" fill="#463365">3. Backfill in batches</text>
      <text x="36" y="223" fill="#66400f">4. Deploy v3</text>
      <text x="36" y="271" fill="#66400f">5. Deploy v4</text>
      <text x="36" y="319" fill="#6e2a24">6. Contract: drop notes</text>
    </g>

    <g fill="#ffffff" stroke="#c9d1db" stroke-width="1.5">
      <rect x="222" y="54" width="190" height="40" rx="8"/>
      <rect x="222" y="102" width="190" height="40" rx="8"/>
      <rect x="222" y="150" width="190" height="40" rx="8"/>
      <rect x="222" y="198" width="190" height="40" rx="8"/>
      <rect x="222" y="246" width="190" height="40" rx="8"/>
      <rect x="222" y="294" width="190" height="40" rx="8"/>
      <rect x="420" y="54" width="125" height="40" rx="8"/>
      <rect x="420" y="102" width="125" height="40" rx="8"/>
      <rect x="420" y="150" width="125" height="40" rx="8"/>
      <rect x="420" y="198" width="125" height="40" rx="8"/>
      <rect x="420" y="246" width="125" height="40" rx="8"/>
      <rect x="420" y="294" width="125" height="40" rx="8"/>
      <rect x="553" y="54" width="125" height="40" rx="8"/>
      <rect x="553" y="102" width="125" height="40" rx="8"/>
      <rect x="553" y="150" width="125" height="40" rx="8"/>
      <rect x="553" y="198" width="125" height="40" rx="8"/>
      <rect x="553" y="246" width="125" height="40" rx="8"/>
      <rect x="553" y="294" width="125" height="40" rx="8"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="1.5">
      <rect x="686" y="54" width="150" height="40" rx="8"/>
      <rect x="686" y="102" width="150" height="40" rx="8"/>
      <rect x="686" y="150" width="150" height="40" rx="8"/>
      <rect x="686" y="198" width="150" height="40" rx="8"/>
    </g>
    <rect x="686" y="246" width="150" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="686" y="294" width="150" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>

    <g font-size="11.5" fill="#263e5a" text-anchor="middle">
      <text x="317" y="78">description added, empty</text>
      <text x="317" y="126">notes + description</text>
      <text x="317" y="174">old rows backfilled</text>
      <text x="317" y="222">both complete, in sync</text>
      <text x="317" y="270">notes stale, unused</text>
      <text x="317" y="318">description only</text>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="482" y="78">notes</text>
      <text x="482" y="126">notes</text>
      <text x="482" y="174">notes</text>
      <text x="482" y="222" font-weight="700">description</text>
      <text x="482" y="270">description</text>
      <text x="482" y="318">description</text>
      <text x="615" y="78">notes</text>
      <text x="615" y="126" font-weight="700">both</text>
      <text x="615" y="174">both</text>
      <text x="615" y="222">both</text>
      <text x="615" y="270" font-weight="700">description</text>
      <text x="615" y="318">description</text>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="761" y="78" fill="#294a2e">anything</text>
      <text x="761" y="126" fill="#294a2e">v1</text>
      <text x="761" y="174" fill="#294a2e">v1</text>
      <text x="761" y="222" fill="#294a2e">v2 or v1</text>
      <text x="761" y="270" fill="#66400f">v3 only</text>
      <text x="761" y="318" fill="#6e2a24">v4 (roll forward)</text>
    </g>

    <text x="430" y="370" font-size="13" fill="#40566b" text-anchor="middle">Each step changes either the schema or the code, so every deploy can be undone by one step.</text>
  </g>
</svg>
