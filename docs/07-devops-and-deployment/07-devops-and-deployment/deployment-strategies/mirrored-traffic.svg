<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="mir-title mir-desc">
  <title id="mir-title">Shadow (mirrored) traffic to a new version</title>
  <desc id="mir-desc">A client sends a request to a proxy such as nginx with the mirror module or an Istio mirror rule. The proxy forwards the request to v1, the primary, which reads and writes the production database, and v1's response goes back to the client. The proxy also sends an asynchronous copy of the request to v2, the shadow, which talks only to a sandbox with test data and stubbed side effects; v2's response is discarded. Both responses can be recorded and compared offline for differences in status, body, and latency.</desc>
  <defs>
    <marker id="mir-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="mir-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="mir-arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="140" width="120" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="80" y="164" font-size="14" font-weight="700" fill="#66400f">Client</text>
    <text x="80" y="182" font-size="11.5" fill="#66400f">real user</text>

    <rect x="190" y="130" width="160" height="76" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="270" y="158" font-size="14" font-weight="700" fill="#463365">Proxy</text>
    <text x="270" y="176" font-size="11.5" fill="#463365">nginx mirror or</text>
    <text x="270" y="192" font-size="11.5" fill="#463365">Istio mirror rule</text>

    <rect x="430" y="40" width="170" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="515" y="64" font-size="14" font-weight="700" fill="#263e5a">v1 (primary)</text>
    <text x="515" y="82" font-size="11.5" fill="#263e5a">its response is used</text>
    <rect x="430" y="240" width="170" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="515" y="264" font-size="14" font-weight="700" fill="#294a2e">v2 (shadow)</text>
    <text x="515" y="282" font-size="11.5" fill="#294a2e">response discarded</text>
    <rect x="430" y="140" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="515" y="164" font-size="13" font-weight="700" fill="#463365">Compare offline</text>
    <text x="515" y="182" font-size="11.5" fill="#463365">status, body, latency</text>

    <rect x="680" y="40" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="760" y="64" font-size="14" font-weight="700" fill="#263e5a">Production DB</text>
    <text x="760" y="82" font-size="11.5" fill="#263e5a">real reads, writes</text>
    <rect x="680" y="240" width="160" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="760" y="264" font-size="14" font-weight="700" fill="#6e2a24">Sandbox only</text>
    <text x="760" y="282" font-size="11.5" fill="#6e2a24">test DB, stubbed email</text>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M140 162H188" marker-end="url(#mir-arrow)"/>
      <path d="M350 142 428 74" marker-end="url(#mir-arrow)"/>
      <path d="M600 68H678" marker-end="url(#mir-arrow)"/>
      <path d="M600 268H678" marker-end="url(#mir-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4">
      <path d="M430 92 356 156" marker-end="url(#mir-arrow-ret)"/>
      <path d="M190 182H142" marker-end="url(#mir-arrow-ret)"/>
      <path d="M515 96V138" marker-end="url(#mir-arrow-ret)"/>
      <path d="M515 240V198" marker-end="url(#mir-arrow-ret)"/>
    </g>
    <path d="M350 196 428 262" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mir-arrow-purple)"/>

    <text x="360" y="92" font-size="11.5" fill="#36424e" text-anchor="end">request</text>
    <text x="398" y="172" font-size="11.5" fill="#36424e">response</text>
    <text x="356" y="250" font-size="11.5" font-style="italic" fill="#463365" text-anchor="end">async copy</text>

    <text x="430" y="324" font-size="13" fill="#40566b">Users only ever get v1's answer; v2 sees real traffic but must cause no real side effects.</text>
  </g>
</svg>
