<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="abc-title abc-desc">
  <title id="abc-title">A canary release compared with an A/B test</title>
  <desc id="abc-desc">Left, a canary asks whether v2 is safe: users' requests are split at random, 95 percent to v1 as the baseline and 5 percent to the v2 canary. It measures 5xx rate, p99 latency, and saturation, and it ends within minutes to hours by promoting v2 to 100 percent or rolling back. Right, an A/B test asks which variant users prefer: each user is assigned by a sticky hash of their user ID, 50 percent to variant A and 50 percent to variant B, and both variants are healthy. It measures conversion, retention, and task completion, and it ends after days or weeks with enough samples, when the team ships the winner and deletes the losing variant.</desc>
  <defs>
    <marker id="abc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="30" font-size="13" font-weight="700" fill="#40566b">Canary: is v2 safe?</text>
    <text x="640" y="30" font-size="13" font-weight="700" fill="#40566b">A/B test: which variant do users prefer?</text>
    <path d="M430 16V330" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="150" y="44" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="69" font-size="14" font-weight="700" fill="#66400f">Requests</text>
    <rect x="40" y="116" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="120" y="137" font-size="14" font-weight="700" fill="#263e5a">v1 (baseline)</text>
    <text x="120" y="155" font-size="11.5" fill="#263e5a">95% of requests</text>
    <rect x="240" y="116" width="160" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="320" y="137" font-size="14" font-weight="700" fill="#294a2e">v2 (canary)</text>
    <text x="320" y="155" font-size="11.5" fill="#294a2e">5% of requests</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M200 84 132 114" marker-end="url(#abc-arrow)"/>
      <path d="M240 84 308 114" marker-end="url(#abc-arrow)"/>
    </g>
    <text x="220" y="188" font-size="11.5" font-style="italic" fill="#40566b">split: random requests or pods</text>
    <rect x="40" y="202" width="360" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="220" y="222" font-size="13" font-weight="700" fill="#463365">Measures technical health</text>
    <text x="220" y="240" font-size="11.5" fill="#463365">5xx rate, p99 latency, saturation</text>
    <rect x="40" y="264" width="360" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="220" y="284" font-size="13" font-weight="700" fill="#294a2e">Ends in minutes to hours</text>
    <text x="220" y="302" font-size="11.5" fill="#294a2e">promote to 100% or roll back</text>

    <rect x="570" y="44" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="640" y="69" font-size="14" font-weight="700" fill="#66400f">Users</text>
    <rect x="460" y="116" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="540" y="137" font-size="14" font-weight="700" fill="#263e5a">Variant A</text>
    <text x="540" y="155" font-size="11.5" fill="#263e5a">50% of users</text>
    <rect x="660" y="116" width="160" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="740" y="137" font-size="14" font-weight="700" fill="#263e5a">Variant B</text>
    <text x="740" y="155" font-size="11.5" fill="#263e5a">50% of users</text>
    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M620 84 552 114" marker-end="url(#abc-arrow)"/>
      <path d="M660 84 728 114" marker-end="url(#abc-arrow)"/>
    </g>
    <text x="640" y="188" font-size="11.5" font-style="italic" fill="#40566b">split: sticky hash of the user ID</text>
    <rect x="460" y="202" width="360" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="640" y="222" font-size="13" font-weight="700" fill="#463365">Measures user behavior</text>
    <text x="640" y="240" font-size="11.5" fill="#463365">conversion, retention, task completion</text>
    <rect x="460" y="264" width="360" height="48" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="640" y="284" font-size="13" font-weight="700" fill="#294a2e">Ends after days or weeks</text>
    <text x="640" y="302" font-size="11.5" fill="#294a2e">ship the winner, delete the losing variant</text>

    <text x="430" y="358" font-size="13" fill="#40566b">A canary tests the software; an A/B test tests a product idea. Both split traffic, for different reasons.</text>
  </g>
</svg>
