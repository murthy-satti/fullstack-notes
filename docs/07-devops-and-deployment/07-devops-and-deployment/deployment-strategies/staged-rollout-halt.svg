<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="srh-title srh-desc">
  <title id="srh-title">A staged client rollout that is halted and replaced by a fix</title>
  <desc id="srh-desc">Rollout percentage over seven days. Version 1.9.0 goes to 1 percent of installs on day 0, 5 percent on day 1, and 20 percent on day 2. On day 2.5 crash-free sessions for 1.9.0 drop from 99.8 percent to 98.9 percent, so the rollout is halted: no new users receive 1.9.0, but the 20 percent who already installed it keep it, because installed copies cannot be rolled back. The fix, version 1.9.1, starts on day 3 at 5 percent, reaches 25 percent on day 4, 50 percent on day 5, and 100 percent on day 6, replacing 1.9.0 wherever it lands.</desc>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b">Share of installs offered each version</text>

    <g fill="none" stroke="#c9d1db" stroke-width="1">
      <path d="M90 245H810"/>
      <path d="M90 190H810"/>
      <path d="M90 135H810"/>
      <path d="M90 80H810"/>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="end">
      <text x="82" y="304">0%</text>
      <text x="82" y="249">25%</text>
      <text x="82" y="194">50%</text>
      <text x="82" y="139">75%</text>
      <text x="82" y="84">100%</text>
    </g>

    <path d="M90 298H193V289H296V256H347" fill="none" stroke="#4774aa" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M347 256H707" fill="none" stroke="#b5524b" stroke-width="2.5" stroke-dasharray="7 5"/>
    <path d="M399 300V289H501V245H604V190H707V80H810" fill="none" stroke="#53845b" stroke-width="2.5" stroke-linejoin="round"/>

    <circle cx="347" cy="256" r="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="200" y="210" width="290" height="30" fill="#f5f7fb"/>
    <text x="210" y="222" font-size="11.5" font-weight="700" fill="#6e2a24">day 2.5: crash-free sessions 99.8% to 98.9%</text>
    <text x="210" y="237" font-size="11.5" fill="#6e2a24">halt: no new users get 1.9.0</text>
    <rect x="520" y="262" width="186" height="14" fill="#f5f7fb"/>
    <text x="524" y="273" font-size="11" font-style="italic" fill="#6e2a24">installed copies stay until 1.9.1</text>
    <text x="716" y="74" font-size="11.5" font-weight="700" fill="#294a2e">1.9.1 at 100%</text>

    <path d="M90 300H810" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="90" y="318">day 0</text>
      <text x="193" y="318">1</text>
      <text x="296" y="318">2</text>
      <text x="399" y="318">3</text>
      <text x="501" y="318">4</text>
      <text x="604" y="318">5</text>
      <text x="707" y="318">6</text>
      <text x="810" y="318">7</text>
    </g>

    <path d="M150 346H186" fill="none" stroke="#4774aa" stroke-width="2.5"/>
    <text x="194" y="350" font-size="11.5" fill="#36424e">1.9.0 rollout</text>
    <path d="M310 346H346" fill="none" stroke="#b5524b" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="354" y="350" font-size="11.5" fill="#36424e">1.9.0 halted</text>
    <path d="M470 346H506" fill="none" stroke="#53845b" stroke-width="2.5"/>
    <text x="514" y="350" font-size="11.5" fill="#36424e">1.9.1 (the fix) rollout</text>

    <text x="430" y="384" font-size="13" fill="#40566b" text-anchor="middle">Halting stops the spread but cannot recall installs; the only way back is forward, to a fixed version.</text>
  </g>
</svg>
