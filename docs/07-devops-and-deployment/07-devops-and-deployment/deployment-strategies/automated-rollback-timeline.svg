<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="arb-title arb-desc">
  <title id="arb-title">Error rate after a bad deploy: automatic rollback compared with manual rollback</title>
  <desc id="arb-desc">A chart of 5xx error rate over 20 minutes. The normal rate is 0.2 percent. A bad version is deployed at minute 2 and the error rate climbs to 4 percent by minute 3. The alarm threshold is 1 percent and the alarm needs three consecutive one-minute data points above it, so it fires at minute 6. With automatic rollback, the deploy tool starts rolling back at minute 6 and the error rate returns to normal by minute 9, about 7 minutes after the deploy. With manual rollback, the alarm pages a person, who acknowledges, investigates, and rolls back; errors stay at 4 percent until minute 16 and return to normal at minute 19, about 17 minutes after the deploy.</desc>
  <rect width="860" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b">5xx error rate after a bad deploy</text>

    <g fill="none" stroke="#c9d1db" stroke-width="1">
      <path d="M80 256H820"/>
      <path d="M80 212H820"/>
      <path d="M80 168H820"/>
      <path d="M80 124H820"/>
      <path d="M80 80H820"/>
    </g>
    <g font-size="11" fill="#36424e" text-anchor="end">
      <text x="72" y="304">0%</text>
      <text x="72" y="260">1%</text>
      <text x="72" y="216">2%</text>
      <text x="72" y="172">3%</text>
      <text x="72" y="128">4%</text>
      <text x="72" y="84">5%</text>
    </g>

    <path d="M80 256H820" fill="none" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="500" y="240" width="118" height="14" fill="#f5f7fb"/>
    <text x="559" y="251" font-size="11" fill="#6e2a24" text-anchor="middle">alarm threshold 1%</text>

    <g fill="none" stroke-width="1.5" stroke-dasharray="3 4">
      <path d="M154 80V300" stroke="#40566b"/>
      <path d="M302 80V300" stroke="#b5524b"/>
      <path d="M413 80V300" stroke="#4774aa"/>
      <path d="M783 80V300" stroke="#bd7a20"/>
    </g>
    <g font-size="11" font-weight="700" text-anchor="middle">
      <text x="154" y="72" fill="#40566b">deploy</text>
      <text x="302" y="72" fill="#6e2a24">alarm fires</text>
      <text x="413" y="72" fill="#263e5a">auto recovered</text>
      <text x="770" y="72" fill="#66400f">manual recovered</text>
    </g>

    <path d="M80 291H154L191 124H302L339 168L376 234L413 291H820" fill="none" stroke="#4774aa" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M302 124H672L783 291" fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round"/>

    <rect x="196" y="100" width="100" height="16" fill="#f5f7fb"/>
    <text x="246" y="112" font-size="11" fill="#36424e" text-anchor="middle">3 min above 1%</text>
    <rect x="452" y="100" width="180" height="16" fill="#f5f7fb"/>
    <text x="542" y="112" font-size="11" fill="#66400f" text-anchor="middle">waiting for a person to act</text>

    <path d="M80 300H820" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="80" y="318">0</text>
      <text x="154" y="318">2</text>
      <text x="228" y="318">4</text>
      <text x="302" y="318">6</text>
      <text x="376" y="318">8</text>
      <text x="450" y="318">10</text>
      <text x="524" y="318">12</text>
      <text x="598" y="318">14</text>
      <text x="672" y="318">16</text>
      <text x="746" y="318">18</text>
      <text x="820" y="318">20 min</text>
    </g>

    <path d="M160 348H196" fill="none" stroke="#4774aa" stroke-width="2.5"/>
    <text x="204" y="352" font-size="11.5" fill="#36424e">automatic rollback: errors for about 7 minutes</text>
    <path d="M500 348H536" fill="none" stroke="#bd7a20" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="544" y="352" font-size="11.5" fill="#36424e">manual rollback: about 17 minutes</text>

    <text x="430" y="390" font-size="13" fill="#40566b" text-anchor="middle">Detection time plus rollback time is the incident; automating the decision removes the slowest part.</text>
  </g>
</svg>
