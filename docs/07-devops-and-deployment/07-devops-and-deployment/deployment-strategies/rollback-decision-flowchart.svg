<svg xmlns="http://www.w3.org/2000/svg" width="860" height="630" viewBox="0 0 860 630" role="img" aria-labelledby="rdf-title rdf-desc">
  <title id="rdf-title">Deciding between turning off a flag, rolling back, and rolling forward</title>
  <desc id="rdf-desc">Errors or latency rise after a release. First question: did the problem start with the release? If not, it is not caused by the release and normal incident response continues. If yes: is the change behind a feature flag? If yes, turn the flag off, which takes seconds and needs no deploy. If not: is rollback safe, meaning the schema and data are compatible with the previous version and the change caused no irreversible side effects? If yes, roll back now and investigate after recovery. If not: is a small fix faster than mitigating? If yes, roll forward with a small hotfix through an expedited pipeline. If not, mitigate first by scaling, shedding load, or disabling the feature, then fix forward.</desc>
  <defs>
    <marker id="rdf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="630" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="20" width="260" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="250" y="47" font-size="14" font-weight="700" fill="#6e2a24">Errors rise after a release</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <path d="M250 82 360 122 250 162 140 122z"/>
      <path d="M250 192 360 232 250 272 140 232z"/>
      <path d="M250 302 360 342 250 382 140 342z"/>
      <path d="M250 412 360 452 250 492 140 452z"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#463365">
      <text x="250" y="119">Did it start with</text>
      <text x="250" y="134">the release?</text>
      <text x="250" y="229">Is the change behind</text>
      <text x="250" y="244">a feature flag?</text>
      <text x="250" y="339">Is rollback safe?</text>
      <text x="250" y="354" font-weight="400">(schema, data, side effects)</text>
      <text x="250" y="449">Is a small fix faster</text>
      <text x="250" y="464">than mitigating?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M250 64V80" marker-end="url(#rdf-arrow)"/>
      <path d="M250 162V190" marker-end="url(#rdf-arrow)"/>
      <path d="M250 272V300" marker-end="url(#rdf-arrow)"/>
      <path d="M250 382V410" marker-end="url(#rdf-arrow)"/>
      <path d="M250 492V528" marker-end="url(#rdf-arrow)"/>
      <path d="M360 122H478" marker-end="url(#rdf-arrow)"/>
      <path d="M360 232H478" marker-end="url(#rdf-arrow)"/>
      <path d="M360 342H478" marker-end="url(#rdf-arrow)"/>
      <path d="M360 452H478" marker-end="url(#rdf-arrow)"/>
    </g>
    <g font-size="11" font-weight="700" fill="#40566b">
      <text x="419" y="114">no</text>
      <text x="419" y="224">yes</text>
      <text x="419" y="334">yes</text>
      <text x="419" y="444">yes</text>
      <text x="262" y="181" text-anchor="start">yes</text>
      <text x="262" y="291" text-anchor="start">no</text>
      <text x="262" y="401" text-anchor="start">no</text>
      <text x="262" y="515" text-anchor="start">no</text>
    </g>

    <rect x="480" y="96" width="360" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="660" y="118" font-size="14" font-weight="700" fill="#36424e">Not caused by the release</text>
    <text x="660" y="136" font-size="11.5" fill="#36424e">continue normal incident response</text>
    <rect x="480" y="206" width="360" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="660" y="228" font-size="14" font-weight="700" fill="#294a2e">Turn the flag off</text>
    <text x="660" y="246" font-size="11.5" fill="#294a2e">seconds, no deploy needed</text>
    <rect x="480" y="316" width="360" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="660" y="338" font-size="14" font-weight="700" fill="#294a2e">Roll back now</text>
    <text x="660" y="356" font-size="11.5" fill="#294a2e">restore service, investigate after recovery</text>
    <rect x="480" y="426" width="360" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="660" y="448" font-size="14" font-weight="700" fill="#66400f">Roll forward</text>
    <text x="660" y="466" font-size="11.5" fill="#66400f">a small hotfix through an expedited pipeline</text>
    <rect x="80" y="530" width="340" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="552" font-size="14" font-weight="700" fill="#66400f">Mitigate first</text>
    <text x="250" y="570" font-size="11.5" fill="#66400f">scale, shed load, disable the feature; then fix</text>

    <text x="430" y="612" font-size="13" fill="#40566b">Restore service first and find the cause later; rollback is the default whenever it is safe.</text>
  </g>
</svg>
