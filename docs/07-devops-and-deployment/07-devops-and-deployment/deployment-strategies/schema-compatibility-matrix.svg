<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="scx-title scx-desc">
  <title id="scx-title">Which code versions work with which schema versions</title>
  <desc id="scx-desc">Rows are schema versions: S0 has only notes, S1 has notes and description, S2 has only description. Columns are code versions: v1 reads and writes notes, v2 writes both and reads notes, v3 writes both and reads description, v4 reads and writes description. With S0, only v1 works; v2, v3, and v4 fail on the missing description column. With S1, v1, v2, and v4 work, and v3 works if the backfill has run. With S2, v1, v2, and v3 fail on the missing notes column and only v4 works. The safe sequence, numbered 1 to 6, is S0 with v1, then S1 with v1, then S1 with v2, then S1 with v3, then S1 with v4, then S2 with v4: each step changes either the schema or the code, never both.</desc>
  <rect width="860" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="20" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Schema (rows) against code (columns)</text>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="285" y="58">v1</text>
      <text x="445" y="58">v2</text>
      <text x="605" y="58">v3</text>
      <text x="765" y="58">v4</text>
    </g>
    <g font-size="11" fill="#66400f">
      <text x="285" y="74">r/w notes</text>
      <text x="445" y="74">writes both,</text>
      <text x="445" y="88">reads notes</text>
      <text x="605" y="74">writes both,</text>
      <text x="605" y="88">reads description</text>
      <text x="765" y="74">r/w description</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="20" y="100" width="180" height="50" rx="8"/>
      <rect x="20" y="160" width="180" height="50" rx="8"/>
      <rect x="20" y="220" width="180" height="50" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="110" y="121" font-size="13" font-weight="700">S0</text>
      <text x="110" y="138" font-size="11.5">notes only</text>
      <text x="110" y="181" font-size="13" font-weight="700">S1</text>
      <text x="110" y="198" font-size="11.5">notes + description</text>
      <text x="110" y="241" font-size="13" font-weight="700">S2</text>
      <text x="110" y="258" font-size="11.5">description only</text>
    </g>

    <g stroke-width="1.5">
      <rect x="210" y="100" width="150" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="370" y="100" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="530" y="100" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="690" y="100" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="210" y="160" width="150" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="370" y="160" width="150" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="530" y="160" width="150" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="690" y="160" width="150" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="210" y="220" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="370" y="220" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="530" y="220" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="690" y="220" width="150" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="285" y="129" fill="#294a2e">works</text>
      <text x="445" y="129" fill="#6e2a24">missing column</text>
      <text x="605" y="129" fill="#6e2a24">missing column</text>
      <text x="765" y="129" fill="#6e2a24">missing column</text>
      <text x="285" y="189" fill="#294a2e">works</text>
      <text x="445" y="189" fill="#294a2e">works</text>
      <text x="605" y="185" fill="#294a2e">works</text>
      <text x="605" y="200" font-size="11" font-weight="400" fill="#294a2e">once backfilled</text>
      <text x="765" y="189" fill="#294a2e">works</text>
      <text x="285" y="249" fill="#6e2a24">missing column</text>
      <text x="445" y="249" fill="#6e2a24">missing column</text>
      <text x="605" y="249" fill="#6e2a24">missing column</text>
      <text x="765" y="249" fill="#294a2e">works</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5">
      <circle cx="344" cy="111" r="8"/>
      <circle cx="344" cy="171" r="8"/>
      <circle cx="504" cy="171" r="8"/>
      <circle cx="664" cy="171" r="8"/>
      <circle cx="824" cy="171" r="8"/>
      <circle cx="824" cy="231" r="8"/>
    </g>
    <g font-size="10.5" font-weight="700" fill="#66400f">
      <text x="344" y="115">1</text>
      <text x="344" y="175">2</text>
      <text x="504" y="175">3</text>
      <text x="664" y="175">4</text>
      <text x="824" y="175">5</text>
      <text x="824" y="235">6</text>
    </g>

    <circle cx="160" cy="298" r="9" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="176" y="302" font-size="11.5" fill="#36424e" text-anchor="start">the safe order: each step changes the schema or the code, never both at once</text>

    <text x="430" y="334" font-size="13" fill="#40566b">During a rolling deploy two adjacent columns run together, so both must work on the current row.</text>
  </g>
</svg>
