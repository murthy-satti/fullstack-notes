<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="cel-title cel-desc">
  <title id="cel-title">Cells limit the blast radius of a bad deploy</title>
  <desc id="cel-desc">Customers reach a thin cell router that maps each tenant ID to one of six cells. Every cell is a complete copy of the stack with its own API instances and its own MongoDB. A new version, v1.9, is deployed to cell 1 first and has a bug, so only the customers mapped to cell 1, about one sixth or 17 percent, are affected. Cells 2 to 6 still run v1.8 and are unaffected. The deploy proceeds cell by cell only while each cell stays healthy.</desc>
  <defs>
    <marker id="cel-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="30" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="195" y="59" font-size="14" font-weight="700" fill="#66400f">Customers</text>
    <rect x="330" y="30" width="200" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="50" font-size="14" font-weight="700" fill="#463365">Cell router</text>
    <text x="430" y="68" font-size="11.5" fill="#463365">tenant ID to cell</text>
    <path d="M270 54H328" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cel-arrow)"/>

    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M380 78 92 116" marker-end="url(#cel-arrow)"/>
      <path d="M400 78 228 116" marker-end="url(#cel-arrow)"/>
      <path d="M420 78 364 116" marker-end="url(#cel-arrow)"/>
      <path d="M440 78 500 116" marker-end="url(#cel-arrow)"/>
      <path d="M460 78 636 116" marker-end="url(#cel-arrow)"/>
      <path d="M480 78 772 116" marker-end="url(#cel-arrow)"/>
    </g>

    <rect x="30" y="118" width="124" height="112" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2.5"/>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2">
      <rect x="166" y="118" width="124" height="112" rx="8"/>
      <rect x="302" y="118" width="124" height="112" rx="8"/>
      <rect x="438" y="118" width="124" height="112" rx="8"/>
      <rect x="574" y="118" width="124" height="112" rx="8"/>
      <rect x="710" y="118" width="124" height="112" rx="8"/>
    </g>
    <text x="92" y="139" font-size="14" font-weight="700" fill="#6e2a24">Cell 1</text>
    <g font-size="14" font-weight="700" fill="#294a2e">
      <text x="228" y="139">Cell 2</text>
      <text x="364" y="139">Cell 3</text>
      <text x="500" y="139">Cell 4</text>
      <text x="636" y="139">Cell 5</text>
      <text x="772" y="139">Cell 6</text>
    </g>
    <g fill="#ffffff" stroke-width="1.5">
      <rect x="42" y="150" width="100" height="30" rx="6" stroke="#b5524b"/>
      <rect x="42" y="188" width="100" height="30" rx="6" stroke="#4774aa"/>
      <rect x="178" y="150" width="100" height="30" rx="6" stroke="#53845b"/>
      <rect x="178" y="188" width="100" height="30" rx="6" stroke="#4774aa"/>
      <rect x="314" y="150" width="100" height="30" rx="6" stroke="#53845b"/>
      <rect x="314" y="188" width="100" height="30" rx="6" stroke="#4774aa"/>
      <rect x="450" y="150" width="100" height="30" rx="6" stroke="#53845b"/>
      <rect x="450" y="188" width="100" height="30" rx="6" stroke="#4774aa"/>
      <rect x="586" y="150" width="100" height="30" rx="6" stroke="#53845b"/>
      <rect x="586" y="188" width="100" height="30" rx="6" stroke="#4774aa"/>
      <rect x="722" y="150" width="100" height="30" rx="6" stroke="#53845b"/>
      <rect x="722" y="188" width="100" height="30" rx="6" stroke="#4774aa"/>
    </g>
    <g font-size="11.5">
      <text x="92" y="169" font-weight="700" fill="#6e2a24">API v1.9 (bug)</text>
      <text x="228" y="169" fill="#294a2e">API v1.8</text>
      <text x="364" y="169" fill="#294a2e">API v1.8</text>
      <text x="500" y="169" fill="#294a2e">API v1.8</text>
      <text x="636" y="169" fill="#294a2e">API v1.8</text>
      <text x="772" y="169" fill="#294a2e">API v1.8</text>
      <text x="92" y="207" fill="#263e5a">own MongoDB</text>
      <text x="228" y="207" fill="#263e5a">own MongoDB</text>
      <text x="364" y="207" fill="#263e5a">own MongoDB</text>
      <text x="500" y="207" fill="#263e5a">own MongoDB</text>
      <text x="636" y="207" fill="#263e5a">own MongoDB</text>
      <text x="772" y="207" fill="#263e5a">own MongoDB</text>
    </g>

    <path d="M30 246H154" fill="none" stroke="#b5524b" stroke-width="2"/>
    <path d="M30 240V252M154 240V252" fill="none" stroke="#b5524b" stroke-width="2"/>
    <text x="92" y="270" font-size="11.5" font-weight="700" fill="#6e2a24">1 of 6 cells: ~17%</text>
    <path d="M166 246H834" fill="none" stroke="#53845b" stroke-width="2"/>
    <path d="M166 240V252M834 240V252" fill="none" stroke="#53845b" stroke-width="2"/>
    <text x="500" y="270" font-size="11.5" font-weight="700" fill="#294a2e">5 cells unaffected, still on v1.8</text>

    <text x="430" y="310" font-size="13" fill="#40566b">A bad deploy to one cell reaches only that cell's customers; deploy cell by cell.</text>
  </g>
</svg>
