<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="mdm-title mdm-desc">
  <title id="mdm-title">The four tables behind the delivery metrics</title>
  <desc id="mdm-desc">Four tables form a chain. commits holds each sha and its committed_at time, loaded from git log. deployment_commits links a deployment_id to each sha it shipped, built with git rev-list from the previous deployed sha. deployments holds the id, service, environment, deployed sha, finished_at time, status, and an unplanned flag, recorded by the deploy pipeline. incidents holds an id, the deployment_id that caused it, and detected_at and restored_at times, from the incident tracker. All four feed three queries: lead-time.sql joins the first three tables to compute the median and 90th percentile per week; deploy-frequency.sql reads only deployments to count deploys, deploy days, and the longest gap; instability.sql joins deployments and incidents to compute change fail rate, rework rate, and recovery time.</desc>
  <defs>
    <marker id="mdm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Four tables are enough for all five metrics</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="24" y="48" width="170" height="146" rx="8"/>
      <rect x="220" y="48" width="196" height="146" rx="8"/>
      <rect x="442" y="48" width="196" height="146" rx="8"/>
      <rect x="664" y="48" width="192" height="146" rx="8"/>
    </g>
    <g stroke="#4774aa" stroke-width="1.5">
      <path d="M24 80H194"/>
      <path d="M220 80H416"/>
      <path d="M442 80H638"/>
      <path d="M664 80H856"/>
    </g>
    <g font-size="13" font-weight="700" fill="#263e5a">
      <text x="109" y="69">commits</text>
      <text x="318" y="69">deployment_commits</text>
      <text x="540" y="69">deployments</text>
      <text x="760" y="69">incidents</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="109" y="102">sha (key)</text>
      <text x="109" y="120">committed_at</text>
      <text x="318" y="102">deployment_id</text>
      <text x="318" y="120">sha</text>
      <text x="540" y="102">id (key)</text>
      <text x="540" y="120">service, environment</text>
      <text x="540" y="138">sha, finished_at</text>
      <text x="540" y="156">status, unplanned</text>
      <text x="760" y="102">id (key)</text>
      <text x="760" y="120">deployment_id</text>
      <text x="760" y="138">detected_at</text>
      <text x="760" y="156">restored_at</text>
    </g>
    <g font-size="11" font-style="italic" fill="#36424e">
      <text x="109" y="182">from git log</text>
      <text x="318" y="182">from git rev-list</text>
      <text x="540" y="182">from the pipeline</text>
      <text x="760" y="182">from incident records</text>
    </g>
    <g stroke="#40566b" stroke-width="2">
      <path d="M194 112H220"/>
      <path d="M416 112H442"/>
      <path d="M638 112H664"/>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M109 194V214H760V194"/>
      <path d="M318 194V214"/>
      <path d="M540 194V214"/>
      <path d="M155 214V240" marker-end="url(#mdm-arrow)"/>
      <path d="M440 214V240" marker-end="url(#mdm-arrow)"/>
      <path d="M725 214V240" marker-end="url(#mdm-arrow)"/>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="24" y="242" width="262" height="72" rx="8"/>
      <rect x="309" y="242" width="262" height="72" rx="8"/>
      <rect x="594" y="242" width="262" height="72" rx="8"/>
    </g>
    <g fill="#463365">
      <text x="155" y="264" font-size="13" font-weight="700">lead-time.sql</text>
      <text x="155" y="283" font-size="11.5">median and 90th percentile</text>
      <text x="155" y="300" font-size="11" font-style="italic">joins the first three tables</text>
      <text x="440" y="264" font-size="13" font-weight="700">deploy-frequency.sql</text>
      <text x="440" y="283" font-size="11.5">deploys, deploy days, longest gap</text>
      <text x="440" y="300" font-size="11" font-style="italic">reads deployments only</text>
      <text x="725" y="264" font-size="13" font-weight="700">instability.sql</text>
      <text x="725" y="283" font-size="11.5">change fail, rework, recovery</text>
      <text x="725" y="300" font-size="11" font-style="italic">joins deployments and incidents</text>
    </g>

    <text x="440" y="354" font-size="13" fill="#40566b">Store raw events, not finished numbers, so every metric can be recomputed when a definition changes.</text>
  </g>
</svg>
