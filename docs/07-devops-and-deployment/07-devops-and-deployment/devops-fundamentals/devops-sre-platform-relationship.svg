<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="dsp-title dsp-desc">
  <title id="dsp-title">How DevOps, SRE, and platform engineering relate</title>
  <desc id="dsp-desc">At the top, DevOps is the shared philosophy: culture, automation, lean, measurement, sharing, and the Three Ways. Two disciplines implement it. Site Reliability Engineering implements the reliability side with SLOs, error budgets, toil limits, and incident response. Platform engineering implements self-service with golden paths, paved roads, and a developer portal. Both serve the stream-aligned product teams, which build and run their own services. SRE gives product teams SLOs, coaching, and on-call help, and receives incidents and SLO data back from them. The platform gives product teams self-service tools, and receives their needs and points of friction back.</desc>
  <defs>
    <marker id="dsp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="dsp-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="170" y="30" width="540" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="440" y="54" font-size="14" font-weight="700" fill="#66400f">DevOps: the shared philosophy</text>
    <text x="440" y="74" font-size="11.5" fill="#66400f">culture, automation, lean, measurement, sharing; the Three Ways</text>

    <rect x="60" y="140" width="330" height="76" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="225" y="164" font-size="14" font-weight="700" fill="#263e5a">Site Reliability Engineering</text>
    <text x="225" y="184" font-size="11.5" font-style="italic" fill="#263e5a">implements reliability</text>
    <text x="225" y="202" font-size="11.5" fill="#263e5a">SLOs, error budgets, toil limits, incidents</text>

    <rect x="490" y="140" width="330" height="76" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="655" y="164" font-size="14" font-weight="700" fill="#463365">Platform engineering</text>
    <text x="655" y="184" font-size="11.5" font-style="italic" fill="#463365">implements self-service</text>
    <text x="655" y="202" font-size="11.5" fill="#463365">golden paths, paved roads, developer portal</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M330 88 250 138" marker-end="url(#dsp-arrow)"/>
      <path d="M550 88 630 138" marker-end="url(#dsp-arrow)"/>
    </g>
    <rect x="248" y="104" width="76" height="16" fill="#f5f7fb"/>
    <text x="286" y="116" font-size="11.5" font-style="italic" fill="#36424e">implements</text>
    <rect x="556" y="104" width="76" height="16" fill="#f5f7fb"/>
    <text x="594" y="116" font-size="11.5" font-style="italic" fill="#36424e">implements</text>

    <rect x="170" y="296" width="540" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="440" y="320" font-size="14" font-weight="700" fill="#294a2e">Stream-aligned product teams</text>
    <text x="440" y="340" font-size="11.5" fill="#294a2e">build and run their own services: you build it, you run it</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 216V294" marker-end="url(#dsp-arrow)"/>
      <path d="M630 216V294" marker-end="url(#dsp-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M250 296V218" marker-end="url(#dsp-arrow-ret)"/>
      <path d="M580 296V218" marker-end="url(#dsp-arrow-ret)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="190" y="252" text-anchor="end">SLOs, coaching,</text>
      <text x="190" y="268" text-anchor="end">on-call help</text>
      <text x="260" y="252" text-anchor="start" font-style="italic">incidents,</text>
      <text x="260" y="268" text-anchor="start" font-style="italic">SLO data</text>
      <text x="570" y="252" text-anchor="end" font-style="italic">needs and</text>
      <text x="570" y="268" text-anchor="end" font-style="italic">friction</text>
      <text x="640" y="252" text-anchor="start">self-service</text>
      <text x="640" y="268" text-anchor="start">tools</text>
    </g>

    <text x="440" y="396" font-size="13" fill="#40566b">DevOps is the interface; SRE and platform engineering are two ways to implement it for product teams.</text>
  </g>
</svg>
