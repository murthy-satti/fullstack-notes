<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="rpc-title rpc-desc">
  <title id="rpc-title">ROC and precision-recall curves for a rare-event classifier</title>
  <desc id="rpc-desc">Two charts for the logistic regression spam model on 6,000 test signups, 3.1 percent of them spam. Left, the ROC curve plots true positive rate against false positive rate; it rises steeply above the dashed diagonal of a random model, with ROC-AUC 0.90. Right, the precision-recall curve plots precision against recall; it starts high and falls quickly, and the dashed random baseline is a flat line at precision 0.031, the spam rate; PR-AUC, the average precision, is 0.37. Two operating points are marked on both curves: the max-F1 threshold 0.197 with recall 0.46, precision 0.36 and false positive rate 0.026, and the min-cost threshold 0.03 with recall 0.77, precision 0.13 and false positive rate 0.17. The same model looks excellent on ROC and modest on precision-recall.</desc>
  <rect width="860" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">One spam model, two curves: 6,000 test signups, 3.1% spam</text>
    <text x="240.0" y="54" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">ROC curve</text>
    <text x="650.0" y="54" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">Precision-recall curve</text>
    <rect x="90" y="84" width="300" height="300" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M90.0 384V389M85 384.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="90.0" y="402" font-size="11" fill="#36424e" text-anchor="middle">0</text>
    <text x="81" y="388.0" font-size="11" fill="#36424e" text-anchor="end">0</text>
    <path d="M240.0 384V389M85 234.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="240.0" y="402" font-size="11" fill="#36424e" text-anchor="middle">0.5</text>
    <text x="81" y="238.0" font-size="11" fill="#36424e" text-anchor="end">0.5</text>
    <path d="M390.0 384V389M85 84.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="390.0" y="402" font-size="11" fill="#36424e" text-anchor="middle">1</text>
    <text x="81" y="88.0" font-size="11" fill="#36424e" text-anchor="end">1</text>
    <text x="240.0" y="420" font-size="12" fill="#36424e" text-anchor="middle">false positive rate</text>
    <text x="90" y="76" font-size="12" fill="#36424e">true positive rate (recall)</text>
    <rect x="500" y="84" width="300" height="300" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M500.0 384V389M495 384.0H500" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="500.0" y="402" font-size="11" fill="#36424e" text-anchor="middle">0</text>
    <text x="491" y="388.0" font-size="11" fill="#36424e" text-anchor="end">0</text>
    <path d="M650.0 384V389M495 234.0H500" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="650.0" y="402" font-size="11" fill="#36424e" text-anchor="middle">0.5</text>
    <text x="491" y="238.0" font-size="11" fill="#36424e" text-anchor="end">0.5</text>
    <path d="M800.0 384V389M495 84.0H500" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="800.0" y="402" font-size="11" fill="#36424e" text-anchor="middle">1</text>
    <text x="491" y="88.0" font-size="11" fill="#36424e" text-anchor="end">1</text>
    <text x="650.0" y="420" font-size="12" fill="#36424e" text-anchor="middle">recall</text>
    <text x="500" y="76" font-size="12" fill="#36424e">precision</text>
    <path d="M90 384L390 84" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <path d="M500 374.7H800" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <path d="M90.0 384.0 L93.0 293.7 L95.7 261.4 L98.9 245.3 L101.9 230.8 L105.8 222.7 L107.9 211.4 L110.9 200.1 L113.9 192.1 L117.2 175.9 L119.7 171.1 L123.2 166.3 L125.8 159.8 L128.4 156.6 L133.3 155.0 L142.7 153.4 L146.3 148.5 L151.7 145.3 L152.6 142.1 L157.3 138.8 L158.5 135.6 L162.0 129.1 L166.4 125.9 L170.0 124.3 L174.1 122.7 L178.7 121.1 L179.6 117.9 L181.0 113.0 L187.3 111.4 L187.5 109.8 L194.0 108.2 L194.7 106.6 L197.9 101.7 L215.0 100.1 L231.9 98.5 L232.4 96.9 L240.1 95.3 L241.6 95.3 L254.2 93.7 L254.6 92.1 L265.8 90.4 L295.2 88.8 L306.8 87.2 L312.0 85.6 L362.1 84.0 L362.2 84.0 L390.0 84.0" stroke="#4774aa" stroke-width="2.5" fill="none"/>
    <path d="M500.0 84.0 L503.2 84.0 L506.4 84.0 L509.7 84.0 L511.3 121.5 L514.5 114.0 L517.7 109.0 L521.0 105.4 L524.2 134.0 L527.4 141.2 L530.7 156.0 L532.2 153.2 L535.5 156.4 L538.7 178.3 L541.9 178.7 L545.1 184.0 L548.4 179.5 L551.6 175.3 L553.2 189.9 L556.5 189.6 L559.7 218.3 L562.9 234.0 L566.1 237.6 L569.4 235.7 L572.6 235.7 L575.8 232.4 L577.4 230.8 L580.6 235.5 L583.9 234.0 L587.1 232.6 L590.3 237.9 L593.5 239.0 L596.8 237.7 L598.4 238.8 L601.6 237.5 L604.9 248.6 L608.1 253.5 L611.3 251.3 L614.5 258.7 L617.8 259.6 L619.3 261.4 L622.6 262.1 L625.8 268.7 L629.0 268.1 L632.3 270.1 L635.5 272.0 L638.7 284.4 L640.3 286.3 L643.5 287.6 L646.8 291.4 L650.0 294.3 L653.2 296.6 L656.5 302.9 L659.7 304.0 L661.3 310.3 L664.5 309.5 L667.7 309.2 L671.0 313.2 L674.2 315.4 L677.4 316.8 L680.7 318.0 L682.2 317.9 L685.5 322.8 L688.7 322.9 L691.9 322.8 L695.1 323.0 L698.4 324.0 L701.6 324.8 L703.2 324.6 L706.5 324.6 L709.7 326.9 L712.9 328.1 L716.1 330.3 L719.4 332.4 L722.6 333.5 L725.8 335.3 L727.4 336.2 L730.6 347.1 L733.9 348.6 L737.1 349.3 L740.3 350.9 L743.5 351.7 L746.8 352.7 L748.4 352.8 L751.6 353.4 L754.9 353.5 L758.1 354.8 L761.3 356.9 L764.5 357.9 L767.8 357.8 L769.3 357.9 L772.6 359.3 L775.8 360.5 L779.0 360.4 L782.3 360.8 L785.5 365.9 L788.7 366.8 L790.3 367.9 L793.5 368.8 L796.8 371.4 L800.0 374.7" stroke="#8062a8" stroke-width="2.5" fill="none"/>
    <g stroke="#ffffff" stroke-width="1.5">
      <circle cx="97.8" cy="245.3" r="5.5" fill="#53845b"/>
      <circle cx="141.0" cy="153.4" r="5.5" fill="#bd7a20"/>
      <circle cx="638.7" cy="275.6" r="5.5" fill="#53845b"/>
      <circle cx="730.6" cy="346.1" r="5.5" fill="#bd7a20"/>
    </g>
    <g font-size="12" fill="#36424e">
      <text x="240" y="320">ROC-AUC 0.90</text>
      <text x="240" y="340" fill="#60788d">dashed: random, 0.5</text>
      <text x="650" y="144">PR-AUC 0.37</text>
      <text x="510" y="366.7" fill="#60788d">dashed: random = spam rate 0.031</text>
    </g>
    <g font-size="12" fill="#36424e">
      <circle cx="70" cy="446" r="5.5" fill="#53845b"/>
      <text x="82" y="450">max F1 (0.197): recall 0.46, precision 0.36</text>
      <circle cx="456" cy="446" r="5.5" fill="#bd7a20"/>
      <text x="468" y="450">min cost (0.03): recall 0.77, precision 0.13</text>
    </g>
    <text x="430" y="472" font-size="13" fill="#40566b" text-anchor="middle">With rare positives, ROC flatters the model; precision-recall shows what reviewers will see.</text>
  </g>
</svg>
