<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="cvc-title cvc-desc">
  <title id="cvc-title">Collaborative and content-based filtering compared</title>
  <desc id="cvc-desc">Collaborative filtering compared with content-based filtering. Left: a user-item matrix with users Ana, Ben, Chen and Dev and templates Sprint, Bug, Launch, SEO and New; filled cells show use. Ana and Ben both used Sprint and Bug, so Dev, who used Sprint, is offered Bug, without reading any text. The New template has no usage yet, so collaborative filtering cannot rank it. Right: content-based filtering compares item text. A user profile, the average text of the templates Dev used, is compared by cosine similarity with each item's text, including a new Release checklist in the engineering topic. It works for brand-new items but finds more of the same and misses what the text cannot express.</desc>
  <defs>
    <marker id="cvc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430.0" y="30" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Two ways to say "you might also like"</text>
    <text x="40" y="62" font-size="13" font-weight="700" fill="#263e5a">Collaborative filtering: who used what</text>
    <text x="125" y="88" font-size="11.5" fill="#36424e" text-anchor="middle">Sprint</text>
    <text x="177" y="88" font-size="11.5" fill="#36424e" text-anchor="middle">Bug</text>
    <text x="229" y="88" font-size="11.5" fill="#36424e" text-anchor="middle">Launch</text>
    <text x="281" y="88" font-size="11.5" fill="#36424e" text-anchor="middle">SEO</text>
    <text x="333" y="88" font-size="11.5" fill="#36424e" text-anchor="middle">New</text>
    <text x="92" y="118" font-size="11.5" fill="#36424e" text-anchor="end">Ana</text>
    <rect x="101" y="98" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="153" y="98" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="205" y="98" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="257" y="98" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="309" y="98" width="46" height="28" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="92" y="152" font-size="11.5" fill="#36424e" text-anchor="end">Ben</text>
    <rect x="101" y="132" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="153" y="132" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="205" y="132" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="257" y="132" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="309" y="132" width="46" height="28" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="92" y="186" font-size="11.5" fill="#36424e" text-anchor="end">Chen</text>
    <rect x="101" y="166" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="153" y="166" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="205" y="166" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="257" y="166" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="309" y="166" width="46" height="28" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="92" y="220" font-size="11.5" fill="#36424e" text-anchor="end">Dev</text>
    <rect x="101" y="200" width="46" height="28" rx="4" fill="#4774aa" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="153" y="200" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="205" y="200" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="257" y="200" width="46" height="28" rx="4" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="309" y="200" width="46" height="28" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <rect x="149" y="232" width="10" height="10" fill="#f5f7fb"/>
    <text x="40" y="258" font-size="12" fill="#36424e">Ana and Ben both used Sprint and Bug, so Dev, who</text>
    <text x="40" y="276" font-size="12" fill="#36424e">used Sprint, is offered Bug. No text needed.</text>
    <text x="40" y="294" font-size="12" fill="#36424e">The New template has no usage yet: CF cannot rank it.</text>
    <path d="M430 56V330" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="460" y="62" font-size="13" font-weight="700" fill="#463365">Content-based: what the items say</text>
    <rect x="460" y="80" width="170" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="545.0" y="102" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">Item text</text>
    <text x="545.0" y="122" font-size="11.5" fill="#463365" text-anchor="middle">"Sprint board"</text>
    <text x="545.0" y="139" font-size="11.5" fill="#463365" text-anchor="middle">engineering</text>
    <rect x="660" y="80" width="170" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="745.0" y="102" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">New item text</text>
    <text x="745.0" y="122" font-size="11.5" fill="#463365" text-anchor="middle">"Release checklist"</text>
    <text x="745.0" y="139" font-size="11.5" fill="#463365" text-anchor="middle">engineering</text>
    <rect x="460" y="180" width="170" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="545.0" y="202" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">User profile</text>
    <text x="545.0" y="222" font-size="11.5" fill="#66400f" text-anchor="middle">average text of the</text>
    <text x="545.0" y="239" font-size="11.5" fill="#66400f" text-anchor="middle">templates Dev used</text>
    <path d="M545 150V176" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cvc-arrow)"/>
    <path d="M630 215 C700 215 745 190 745 154" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cvc-arrow)"/>
    <text x="700" y="240" font-size="11.5" fill="#463365">cosine similarity</text>
    <text x="460" y="280" font-size="12" fill="#36424e">Works for brand-new items, but only finds more</text>
    <text x="460" y="298" font-size="12" fill="#36424e">of the same, and misses what text cannot see.</text>
    <text x="430.0" y="366" font-size="13" fill="#40566b" text-anchor="middle">Collaborative filtering learns from behaviour; content handles the cold start. Hybrids use both.</text>
  </g>
</svg>
