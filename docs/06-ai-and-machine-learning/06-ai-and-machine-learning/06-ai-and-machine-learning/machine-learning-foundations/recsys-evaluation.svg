<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="rer-title rer-desc">
  <title id="rer-title">Offline evaluation of six recommenders</title>
  <desc id="rer-desc">How the recommenders were evaluated and how they scored. Each user's templates are ordered in time; the earlier ones are training data and the last two are held out as the test. Recall at 10 is the share of the two held-out templates that appear in the top 10; new-item recall is the same for the 60 templates absent from training. Results: most popular 0.019 and 0; item-item collaborative filtering 0.113 and 0; matrix factorization 0.106 and 0; content-based 0.077 and 0.079; a two-tower model relying on IDs only 0.088 and 0.002; and the two-tower model with ID dropout and popularity correction 0.164 and 0.106, best on both.</desc>
  <defs>
    <marker id="rer-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430.0" y="30" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Six recommenders on the same leave-last-two-out test (synthetic data)</text>
    <text x="40" y="62" font-size="13" font-weight="700" fill="#36424e">Leave-last-two-out split, per user</text>
    <rect x="40" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="70" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="100" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="130" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="160" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="190" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="220" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="250" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="280" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="310" y="74" width="26" height="22" rx="3" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="340" y="74" width="26" height="22" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="370" y="74" width="26" height="22" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="40" y="114" font-size="11.5" fill="#36424e">earlier templates: training</text>
    <text x="340" y="114" font-size="11.5" fill="#66400f">last two: test</text>
    <text x="440" y="80" font-size="12" fill="#36424e">Recall@10: share of the two held-out templates</text>
    <text x="440" y="97" font-size="12" fill="#36424e">that appear in the top 10. New-item recall: the</text>
    <text x="440" y="114" font-size="12" fill="#36424e">same, for 60 templates absent from training.</text>
    <text x="210" y="140" font-size="11.5" font-weight="700" fill="#36424e">recall@10</text>
    <text x="540" y="140" font-size="11.5" font-weight="700" fill="#36424e">new-item recall</text>
    <text x="200" y="161" font-size="12" fill="#36424e" text-anchor="end">most popular</text>
    <rect x="210" y="149" width="24.7" height="16" rx="2" fill="#4774aa"/>
    <text x="240.7" y="162" font-size="11.5" fill="#36424e">0.019</text>
    <rect x="540" y="149" width="1.0" height="16" rx="2" fill="#53845b"/>
    <text x="546.0" y="162" font-size="11.5" fill="#36424e">0.000</text>
    <text x="200" y="195" font-size="12" fill="#36424e" text-anchor="end">item-item CF</text>
    <rect x="210" y="183" width="146.9" height="16" rx="2" fill="#4774aa"/>
    <text x="362.9" y="196" font-size="11.5" fill="#36424e">0.113</text>
    <rect x="540" y="183" width="1.0" height="16" rx="2" fill="#53845b"/>
    <text x="546.0" y="196" font-size="11.5" fill="#36424e">0.000</text>
    <text x="200" y="229" font-size="12" fill="#36424e" text-anchor="end">matrix factorization</text>
    <rect x="210" y="217" width="137.8" height="16" rx="2" fill="#4774aa"/>
    <text x="353.8" y="230" font-size="11.5" fill="#36424e">0.106</text>
    <rect x="540" y="217" width="1.0" height="16" rx="2" fill="#53845b"/>
    <text x="546.0" y="230" font-size="11.5" fill="#36424e">0.000</text>
    <text x="200" y="263" font-size="12" fill="#36424e" text-anchor="end">content-based</text>
    <rect x="210" y="251" width="100.1" height="16" rx="2" fill="#4774aa"/>
    <text x="316.1" y="264" font-size="11.5" fill="#36424e">0.077</text>
    <rect x="540" y="251" width="102.7" height="16" rx="2" fill="#53845b"/>
    <text x="648.7" y="264" font-size="11.5" fill="#36424e">0.079</text>
    <text x="200" y="297" font-size="12" fill="#36424e" text-anchor="end">two-tower, IDs only</text>
    <rect x="210" y="285" width="114.4" height="16" rx="2" fill="#4774aa"/>
    <text x="330.4" y="298" font-size="11.5" fill="#36424e">0.088</text>
    <rect x="540" y="285" width="2.6" height="16" rx="2" fill="#53845b"/>
    <text x="548.6" y="298" font-size="11.5" fill="#36424e">0.002</text>
    <text x="200" y="331" font-size="12" fill="#36424e" text-anchor="end">two-tower, ID dropout</text>
    <rect x="210" y="319" width="213.2" height="16" rx="2" fill="#4774aa"/>
    <text x="429.2" y="332" font-size="11.5" fill="#36424e">0.164</text>
    <rect x="540" y="319" width="137.8" height="16" rx="2" fill="#53845b"/>
    <text x="683.8" y="332" font-size="11.5" fill="#36424e">0.106</text>
    <text x="430.0" y="366" font-size="13" fill="#40566b" text-anchor="middle">Collaborative signals win on known items; only text-aware models reach new ones.</text>
  </g>
</svg>
