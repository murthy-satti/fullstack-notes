<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="ttm-title ttm-desc">
  <title id="ttm-title">A two-tower retrieval model</title>
  <desc id="ttm-desc">A two-tower retrieval model. The user tower takes the templates a user used, as a multi-hot vector, and their average text, and a linear layer turns them into a user embedding of 32 numbers. The item tower takes a template's TF-IDF text plus a learned ID embedding and produces an item embedding of the same size. The score is the dot product of the two embeddings. Training uses a softmax over each batch, so the other items in the batch act as negatives, subtracts the log of each item's frequency to correct the bias towards popular items, and hides the ID embedding for 30 percent of examples so the text path learns to work alone. Offline, every item is embedded, new items from text alone, and loaded into an approximate nearest-neighbour index; at request time the user embedding is computed from fresh history and the index returns the top 100 candidates.</desc>
  <defs>
    <marker id="ttm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430.0" y="30" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Two towers meet at a dot product: train on pairs, serve with a vector index</text>
    <rect x="40" y="60" width="230" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="155.0" y="82" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">User tower input</text>
    <text x="155.0" y="102" font-size="11.5" fill="#66400f" text-anchor="middle">templates used (multi-hot)</text>
    <text x="155.0" y="119" font-size="11.5" fill="#66400f" text-anchor="middle">and their average text</text>
    <rect x="590" y="60" width="230" height="76" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="705.0" y="82" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">Item tower input</text>
    <text x="705.0" y="102" font-size="11.5" fill="#463365" text-anchor="middle">template text (TF-IDF)</text>
    <text x="705.0" y="119" font-size="11.5" fill="#463365" text-anchor="middle">plus an ID embedding</text>
    <rect x="40" y="166" width="230" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="155.0" y="188" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">Linear layer</text>
    <text x="155.0" y="208" font-size="11.5" fill="#66400f" text-anchor="middle">user embedding, 32 numbers</text>
    <rect x="590" y="166" width="230" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="705.0" y="188" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">Linear layer + ID</text>
    <text x="705.0" y="208" font-size="11.5" fill="#463365" text-anchor="middle">item embedding, 32 numbers</text>
    <path d="M155 136V162" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ttm-arrow)"/>
    <path d="M705 136V162" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ttm-arrow)"/>
    <rect x="330" y="166" width="200" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430.0" y="188" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">Dot product</text>
    <text x="430.0" y="208" font-size="11.5" fill="#263e5a" text-anchor="middle">score = user . item</text>
    <path d="M270 194H326" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ttm-arrow)"/>
    <path d="M590 194H534" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ttm-arrow)"/>
    <rect x="300" y="252" width="260" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="430.0" y="274" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">Training</text>
    <text x="430.0" y="294" font-size="11.5" fill="#294a2e" text-anchor="middle">softmax over the batch: the other</text>
    <text x="430.0" y="311" font-size="11.5" fill="#294a2e" text-anchor="middle">items are negatives; subtract</text>
    <text x="430.0" y="328" font-size="11.5" fill="#294a2e" text-anchor="middle">log(item frequency); hide IDs 30%</text>
    <path d="M430 222V248" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#ttm-arrow)"/>
    <rect x="40" y="252" width="230" height="92" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="155.0" y="274" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">At request time</text>
    <text x="155.0" y="294" font-size="11.5" fill="#66400f" text-anchor="middle">compute the user embedding</text>
    <text x="155.0" y="311" font-size="11.5" fill="#66400f" text-anchor="middle">from fresh history; search</text>
    <text x="155.0" y="328" font-size="11.5" fill="#66400f" text-anchor="middle">the index for the top 100</text>
    <rect x="590" y="252" width="230" height="92" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="705.0" y="274" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">Offline</text>
    <text x="705.0" y="294" font-size="11.5" fill="#463365" text-anchor="middle">embed every item, new</text>
    <text x="705.0" y="311" font-size="11.5" fill="#463365" text-anchor="middle">items from text alone, and</text>
    <text x="705.0" y="328" font-size="11.5" fill="#463365" text-anchor="middle">load an ANN index</text>
    <path d="M705 344V358H155V348" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ttm-arrow)"/>
    <text x="430" y="372" font-size="11.5" fill="#36424e" text-anchor="middle">the index serves the embeddings computed offline</text>
    <text x="430.0" y="396" font-size="13" fill="#40566b" text-anchor="middle">Items are embedded once, offline; only the user tower runs per request.</text>
  </g>
</svg>
