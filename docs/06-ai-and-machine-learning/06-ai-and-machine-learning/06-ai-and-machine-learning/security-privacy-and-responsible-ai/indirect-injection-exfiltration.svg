<svg xmlns="http://www.w3.org/2000/svg" width="940" height="690" viewBox="0 0 940 690" role="img" aria-labelledby="iie-title iie-desc">
  <title id="iie-title">Indirect prompt injection that leaks data through an image URL</title>
  <desc id="iie-desc">A sequence with six lifelines: attacker, notes database, TaskFlow API, model, the user's browser, and attacker.example. Step 1: the attacker plants a note with hidden instructions. Step 2: the user asks the assistant to summarize this week's notes. Step 3: the API finds the notes and gets them back, including the planted one. Step 4: the API sends the prompt and the notes to the model; control A, applied by the API here, labels and datamarks the notes and gives this call no tools. Step 5: the model, obeying the note, returns a summary that contains a Markdown image. Step 6: the API sends the Markdown to the browser to render; control B, the output filter at the API, removes images from unknown hosts. Step 7: the browser automatically requests the image from attacker.example with task ids in the query string; control C, the Content-Security-Policy img-src rule, blocks the request in the browser. Without B and C, the data lands in the attacker's log. Caption: a planted note is enough; A makes obeying less likely, while B and C stop the leak even when the model obeys.</desc>
  <defs>
    <marker id="iie-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="940" height="690" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Indirect prompt injection: a planted note leaks data through an image URL</text>

    <!-- lifeline headers -->
    <rect x="25" y="56" width="130" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="90" y="81" font-size="13" font-weight="bold" fill="#6e2a24" text-anchor="middle">Attacker</text>
    <rect x="175" y="56" width="130" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="240" y="81" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Notes DB</text>
    <rect x="325" y="56" width="130" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="390" y="81" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">TaskFlow API</text>
    <rect x="475" y="56" width="130" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="540" y="81" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Model</text>
    <rect x="620" y="56" width="140" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="690" y="81" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">User's browser</text>
    <rect x="770" y="56" width="150" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="845" y="81" font-size="13" font-weight="bold" fill="#6e2a24" text-anchor="middle">attacker.example</text>

    <!-- lifelines -->
    <g stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4">
      <line x1="90" y1="96" x2="90" y2="548"/>
      <line x1="240" y1="96" x2="240" y2="548"/>
      <line x1="390" y1="96" x2="390" y2="548"/>
      <line x1="540" y1="96" x2="540" y2="548"/>
      <line x1="690" y1="96" x2="690" y2="548"/>
      <line x1="845" y1="96" x2="845" y2="548"/>
    </g>

    <g font-size="12" fill="#36424e" text-anchor="middle">
      <!-- 1 -->
      <line x1="90" y1="135" x2="238" y2="135" stroke="#40566b" stroke-width="1.6" marker-end="url(#iie-arrow)"/>
      <rect x="107" y="114" width="116" height="16" fill="#f5f7fb"/>
      <text x="165" y="126">1. plants a note</text>
      <!-- 2 -->
      <line x1="690" y1="185" x2="392" y2="185" stroke="#40566b" stroke-width="1.6" marker-end="url(#iie-arrow)"/>
      <rect x="452" y="164" width="176" height="16" fill="#f5f7fb"/>
      <text x="540" y="176">2. "Summarize this week"</text>
      <!-- 3 -->
      <line x1="390" y1="235" x2="242" y2="235" stroke="#40566b" stroke-width="1.6" marker-end="url(#iie-arrow)"/>
      <rect x="267" y="214" width="96" height="16" fill="#f5f7fb"/>
      <text x="315" y="226">3. find notes</text>
      <line x1="240" y1="270" x2="388" y2="270" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#iie-arrow)"/>
      <rect x="250" y="249" width="130" height="16" fill="#f5f7fb"/>
      <text x="315" y="261">notes (one planted)</text>
      <!-- 4 -->
      <line x1="390" y1="320" x2="538" y2="320" stroke="#40566b" stroke-width="1.6" marker-end="url(#iie-arrow)"/>
      <rect x="410" y="299" width="110" height="16" fill="#f5f7fb"/>
      <text x="465" y="311">4. prompt + notes</text>
      <!-- 5 -->
      <line x1="540" y1="375" x2="392" y2="375" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#iie-arrow)"/>
      <rect x="402" y="354" width="126" height="16" fill="#f5f7fb"/>
      <text x="465" y="366">5. summary + ![img]</text>
      <!-- 6 -->
      <line x1="390" y1="430" x2="688" y2="430" stroke="#40566b" stroke-width="1.6" marker-end="url(#iie-arrow)"/>
      <rect x="402" y="409" width="126" height="16" fill="#f5f7fb"/>
      <text x="465" y="421">6. render Markdown</text>
      <!-- 7 -->
      <line x1="690" y1="485" x2="843" y2="485" stroke="#b5524b" stroke-width="1.6" marker-end="url(#iie-arrow)"/>
      <rect x="706" y="464" width="124" height="16" fill="#f5f7fb"/>
      <text x="768" y="476">7. GET ?d=TASK-12</text>
    </g>

    <!-- attacker's log -->
    <rect x="780" y="504" width="130" height="30" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="845" y="524" font-size="12" fill="#6e2a24" text-anchor="middle">data in the log</text>

    <!-- control markers on the lifeline where each control runs -->
    <g font-size="12" font-weight="bold" fill="#294a2e" text-anchor="middle">
      <circle cx="390" cy="320" r="11" fill="#e7f3e9" stroke="#53845b" stroke-width="1.6"/>
      <text x="390" y="324">A</text>
      <circle cx="390" cy="430" r="11" fill="#e7f3e9" stroke="#53845b" stroke-width="1.6"/>
      <text x="390" y="434">B</text>
      <circle cx="690" cy="485" r="11" fill="#e7f3e9" stroke="#53845b" stroke-width="1.6"/>
      <text x="690" y="489">C</text>
    </g>

    <!-- legend -->
    <rect x="27" y="568" width="286" height="62" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <circle cx="49" cy="599" r="11" fill="#f5f7fb" stroke="#53845b" stroke-width="1.6"/>
    <text x="49" y="603" font-size="12" font-weight="bold" fill="#294a2e" text-anchor="middle">A</text>
    <text x="70" y="593" font-size="12.5" font-weight="bold" fill="#294a2e">Untrusted notes go in as data</text>
    <text x="70" y="612" font-size="12" fill="#36424e">datamarked, and no tools here</text>

    <rect x="327" y="568" width="286" height="62" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <circle cx="349" cy="599" r="11" fill="#f5f7fb" stroke="#53845b" stroke-width="1.6"/>
    <text x="349" y="603" font-size="12" font-weight="bold" fill="#294a2e" text-anchor="middle">B</text>
    <text x="370" y="593" font-size="12.5" font-weight="bold" fill="#294a2e">Output filter at the API</text>
    <text x="370" y="612" font-size="12" fill="#36424e">drops images from unknown hosts</text>

    <rect x="627" y="568" width="286" height="62" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <circle cx="649" cy="599" r="11" fill="#f5f7fb" stroke="#53845b" stroke-width="1.6"/>
    <text x="649" y="603" font-size="12" font-weight="bold" fill="#294a2e" text-anchor="middle">C</text>
    <text x="670" y="593" font-size="12.5" font-weight="bold" fill="#294a2e">CSP in the browser</text>
    <text x="670" y="612" font-size="12" fill="#36424e">img-src blocks what B misses</text>

    <text x="30" y="655" font-size="13" fill="#40566b">A planted note is enough: the model obeys it, and loading the image sends the data out.</text>
    <text x="30" y="674" font-size="13" fill="#40566b">A makes obeying less likely; B and C stop the leak even when the model does obey.</text>
  </g>
</svg>
