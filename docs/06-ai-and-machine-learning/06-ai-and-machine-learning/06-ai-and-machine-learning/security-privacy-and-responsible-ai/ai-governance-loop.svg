<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="agl-title agl-desc">
  <title id="agl-title">The NIST AI RMF functions as a loop for one AI feature</title>
  <desc id="agl-desc">Govern sits in the middle: policy, roles, the AI inventory, and a review board, and it applies across the other three functions. Map, at the top, writes the system card: purpose, users, data, risk tier, and applicable laws. An arrow labeled risks to test leads to Measure, at the bottom right: evaluation suites, red-team runs, privacy and bias checks. An arrow labeled results leads to Manage, at the bottom left: the launch decision, monitoring, incidents, and retirement. An arrow labeled changes and incidents leads back to Map, closing the loop. A note says ISO/IEC 42001 certifies the management system around such a loop. Caption: Govern sets the rules, Map writes the system card, Measure runs the evaluations, and Manage decides, monitors and feeds what it learns back into Map.</desc>
  <defs>
    <marker id="agl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">NIST AI RMF as a loop for one AI feature, with TaskFlow artifacts</text>

    <!-- Map -->
    <rect x="320" y="56" width="240" height="88" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="440" y="80" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">Map</text>
    <text x="440" y="100" font-size="11.5" fill="#36424e" text-anchor="middle">system card: purpose, users,</text>
    <text x="440" y="117" font-size="11.5" fill="#36424e" text-anchor="middle">data, risk tier, applicable laws</text>

    <!-- Govern -->
    <rect x="320" y="200" width="240" height="96" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.8"/>
    <text x="440" y="226" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Govern</text>
    <text x="440" y="246" font-size="11.5" fill="#36424e" text-anchor="middle">policy, roles, AI inventory,</text>
    <text x="440" y="263" font-size="11.5" fill="#36424e" text-anchor="middle">review board; applies across</text>
    <text x="440" y="280" font-size="11.5" fill="#36424e" text-anchor="middle">all other functions</text>

    <!-- Measure -->
    <rect x="600" y="330" width="250" height="88" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="725" y="354" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">Measure</text>
    <text x="725" y="374" font-size="11.5" fill="#36424e" text-anchor="middle">evaluation suites, red-team</text>
    <text x="725" y="391" font-size="11.5" fill="#36424e" text-anchor="middle">runs, privacy and bias checks</text>

    <!-- Manage -->
    <rect x="30" y="330" width="250" height="88" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="155" y="354" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">Manage</text>
    <text x="155" y="374" font-size="11.5" fill="#36424e" text-anchor="middle">launch decision, monitoring,</text>
    <text x="155" y="391" font-size="11.5" fill="#36424e" text-anchor="middle">incidents, retirement</text>

    <!-- loop arrows -->
    <g stroke="#40566b" stroke-width="1.8" fill="none">
      <path d="M560 100 C 700 100, 730 220, 728 326" marker-end="url(#agl-arrow)"/>
      <line x1="600" y1="380" x2="284" y2="380" marker-end="url(#agl-arrow)"/>
      <path d="M152 330 C 150 220, 180 100, 316 100" marker-end="url(#agl-arrow)"/>
    </g>
    <g font-size="12" fill="#36424e">
      <rect x="652" y="160" width="84" height="16" fill="#f5f7fb"/>
      <text x="655" y="172">risks to test</text>
      <rect x="415" y="384" width="50" height="16" fill="#f5f7fb"/>
      <text x="418" y="396">results</text>
      <rect x="98" y="168" width="118" height="16" fill="#f5f7fb"/>
      <text x="101" y="180">changes, incidents</text>
    </g>

    <!-- govern spokes -->
    <g stroke="#8062a8" stroke-width="1.3" stroke-dasharray="4 4">
      <line x1="440" y1="200" x2="440" y2="146"/>
      <line x1="530" y1="296" x2="640" y2="330"/>
      <line x1="350" y1="296" x2="240" y2="330"/>
    </g>

    <!-- ISO note -->
    <rect x="300" y="430" width="280" height="30" rx="8" fill="#ffffff" stroke="#8a96a3"/>
    <text x="440" y="450" font-size="11.5" fill="#36424e" text-anchor="middle">ISO/IEC 42001 certifies the management system</text>

    <text x="30" y="484" font-size="13" fill="#40566b">Govern sets the rules, Map writes the card, Measure tests, Manage decides and feeds lessons back to Map.</text>
  </g>
</svg>
