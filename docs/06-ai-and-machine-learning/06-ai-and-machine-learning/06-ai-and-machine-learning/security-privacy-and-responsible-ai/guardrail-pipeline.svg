<svg xmlns="http://www.w3.org/2000/svg" width="920" height="530" viewBox="0 0 920 530" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">Guardrails around a model call</title>
  <desc id="gp-desc">User input first passes cheap checks: length, rate limit, blocklist, and PII masking. Then two things start at the same time: the input classifiers, which run moderation and prompt-attack detection, and the model call. If the input classifiers flag the input, the model call is aborted. Otherwise the classifiers' verdict and the model's answer both go to the output checks: moderation, schema validation, grounding, and the link filter. Only then is the answer rendered or streamed to the user. Every check reports its scores to one versioned policy, which turns them into one of six actions: allow and log the scores, mask personal data, warn so the user can edit, give a supportive reply for self-harm intent, send to human review, or block with a clear message. Caption: cheap deterministic checks run first, classifiers run alongside the model, and one versioned policy turns every score into an action.</desc>
  <defs>
    <marker id="gp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="920" height="530" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Guardrails around a model call: check cheaply, classify in parallel, decide by policy</text>

    <!-- stages -->
    <rect x="20" y="150" width="120" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="80" y="177" font-size="14" font-weight="bold" fill="#66400f" text-anchor="middle">User input</text>
    <text x="80" y="196" font-size="11.5" fill="#36424e" text-anchor="middle">chat or comment</text>

    <rect x="170" y="140" width="160" height="84" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="250" y="164" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Cheap checks</text>
    <text x="250" y="184" font-size="11.5" fill="#36424e" text-anchor="middle">length, rate limit,</text>
    <text x="250" y="201" font-size="11.5" fill="#36424e" text-anchor="middle">blocklist, PII mask</text>

    <rect x="370" y="60" width="170" height="74" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="455" y="84" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Input classifiers</text>
    <text x="455" y="103" font-size="11.5" fill="#36424e" text-anchor="middle">moderation,</text>
    <text x="455" y="120" font-size="11.5" fill="#36424e" text-anchor="middle">prompt attack</text>

    <rect x="370" y="230" width="170" height="74" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="455" y="254" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">Model call</text>
    <text x="455" y="273" font-size="11.5" fill="#36424e" text-anchor="middle">starts at the same</text>
    <text x="455" y="290" font-size="11.5" fill="#36424e" text-anchor="middle">time as the checks</text>

    <rect x="580" y="140" width="170" height="84" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="665" y="164" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Output checks</text>
    <text x="665" y="184" font-size="11.5" fill="#36424e" text-anchor="middle">moderation, schema,</text>
    <text x="665" y="201" font-size="11.5" fill="#36424e" text-anchor="middle">grounding, links</text>

    <rect x="790" y="150" width="110" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="845" y="177" font-size="14" font-weight="bold" fill="#66400f" text-anchor="middle">Render</text>
    <text x="845" y="196" font-size="11.5" fill="#36424e" text-anchor="middle">or stream</text>

    <!-- flow arrows -->
    <g stroke="#40566b" stroke-width="1.6" fill="none">
      <line x1="140" y1="182" x2="168" y2="182" marker-end="url(#gp-arrow)"/>
      <line x1="330" y1="165" x2="368" y2="104" marker-end="url(#gp-arrow)"/>
      <line x1="330" y1="200" x2="368" y2="262" marker-end="url(#gp-arrow)"/>
      <line x1="540" y1="97" x2="578" y2="160" marker-end="url(#gp-arrow)"/>
      <line x1="540" y1="267" x2="578" y2="205" marker-end="url(#gp-arrow)"/>
      <line x1="750" y1="182" x2="788" y2="182" marker-end="url(#gp-arrow)"/>
    </g>
    <line x1="455" y1="134" x2="455" y2="227" stroke="#b5524b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#gp-arrow)"/>
    <rect x="461" y="172" width="98" height="16" fill="#f5f7fb"/>
    <text x="465" y="184" font-size="12" fill="#6e2a24">abort if flagged</text>
    <rect x="548" y="108" width="50" height="15" fill="#f5f7fb"/>
    <text x="551" y="120" font-size="12" fill="#36424e">verdict</text>
    <rect x="548" y="246" width="48" height="15" fill="#f5f7fb"/>
    <text x="551" y="258" font-size="12" fill="#36424e">answer</text>

    <!-- scores to policy -->
    <g stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
      <line x1="250" y1="224" x2="250" y2="346" marker-end="url(#gp-arrow)"/>
      <line x1="665" y1="224" x2="665" y2="346" marker-end="url(#gp-arrow)"/>
    </g>
    <rect x="256" y="318" width="40" height="15" fill="#f5f7fb"/>
    <text x="259" y="330" font-size="12" fill="#36424e">scores</text>
    <rect x="671" y="318" width="40" height="15" fill="#f5f7fb"/>
    <text x="674" y="330" font-size="12" fill="#36424e">scores</text>

    <!-- policy and actions -->
    <rect x="20" y="348" width="880" height="120" rx="10" fill="#ffffff" stroke="#8a96a3"/>
    <text x="40" y="374" font-size="14" font-weight="bold" fill="#36424e">One versioned policy turns every score into one action</text>

    <rect x="40" y="392" width="135" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="107" y="415" font-size="12.5" font-weight="bold" fill="#294a2e" text-anchor="middle">Allow</text>
    <text x="107" y="434" font-size="11" fill="#36424e" text-anchor="middle">log the scores</text>

    <rect x="184" y="392" width="135" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="251" y="415" font-size="12.5" font-weight="bold" fill="#263e5a" text-anchor="middle">Mask</text>
    <text x="251" y="434" font-size="11" fill="#36424e" text-anchor="middle">personal data replaced</text>

    <rect x="328" y="392" width="135" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="395" y="415" font-size="12.5" font-weight="bold" fill="#66400f" text-anchor="middle">Warn</text>
    <text x="395" y="434" font-size="11" fill="#36424e" text-anchor="middle">the user may edit</text>

    <rect x="472" y="392" width="135" height="56" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="539" y="415" font-size="12.5" font-weight="bold" fill="#294a2e" text-anchor="middle">Supportive reply</text>
    <text x="539" y="434" font-size="11" fill="#36424e" text-anchor="middle">for self-harm intent</text>

    <rect x="616" y="392" width="135" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="683" y="415" font-size="12.5" font-weight="bold" fill="#463365" text-anchor="middle">Human review</text>
    <text x="683" y="434" font-size="11" fill="#36424e" text-anchor="middle">queue, then decide</text>

    <rect x="760" y="392" width="125" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="822" y="415" font-size="12.5" font-weight="bold" fill="#6e2a24" text-anchor="middle">Block</text>
    <text x="822" y="434" font-size="11" fill="#36424e" text-anchor="middle">with a clear message</text>

    <text x="30" y="496" font-size="13" fill="#40566b">Cheap deterministic checks run first, classifiers run alongside the model, and one versioned</text>
    <text x="30" y="514" font-size="13" fill="#40566b">policy turns every score into an action that the product can explain.</text>
  </g>
</svg>
