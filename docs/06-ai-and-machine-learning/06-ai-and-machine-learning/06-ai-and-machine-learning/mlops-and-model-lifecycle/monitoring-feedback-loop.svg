<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="mfl-title mfl-desc">
  <title id="mfl-title">Monitoring, labels, and retraining as one loop</title>
  <desc id="mfl-desc">The TaskFlow API suggests a priority and writes a prediction log with the features, score, and model version. A daily drift monitor reads the log and checks missing values, PSI, KS tests, and predicted score shares. Users act on the suggestion by keeping or changing the priority, which produces labels days later; the labels are joined to the prediction log by request ID and feed a weekly performance monitor that reports precision, AUC, and slices. Both monitors feed trigger rules (schedule, number of new labels, performance drops, sustained drift), which start training but never promote. The training step takes a snapshot, trains, and compares the candidate with the champion as in the registry lesson; the deploy step moves the alias and runs a canary before full traffic, and the API then serves the new version. A warning notes the feedback loop: users tend to keep suggested values, so labels drift toward the model; a 5 percent holdout that sees no suggestion keeps some labels unbiased.</desc>
  <defs>
    <marker id="mfl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="900" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="25" y="30" width="250" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="55" font-size="14" font-weight="700" fill="#66400f">TaskFlow API</text>
    <text x="150" y="75" font-size="11.5" fill="#66400f">suggests a priority</text>
    <rect x="325" y="30" width="250" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="450" y="55" font-size="14" font-weight="700" fill="#263e5a">Prediction log</text>
    <text x="450" y="75" font-size="11.5" fill="#263e5a">features, score, model version</text>
    <rect x="625" y="30" width="250" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="750" y="55" font-size="14" font-weight="700" fill="#463365">Drift monitor (daily)</text>
    <text x="750" y="75" font-size="11.5" fill="#463365">nulls, PSI, KS, score shares</text>

    <rect x="25" y="160" width="250" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="185" font-size="14" font-weight="700" fill="#66400f">Users act</text>
    <text x="150" y="205" font-size="11.5" fill="#66400f">keep or change the priority</text>
    <rect x="325" y="160" width="250" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="450" y="185" font-size="14" font-weight="700" fill="#263e5a">Labels (days later)</text>
    <text x="450" y="205" font-size="11.5" fill="#263e5a">joined by request_id</text>
    <rect x="625" y="160" width="250" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="750" y="185" font-size="14" font-weight="700" fill="#463365">Performance monitor</text>
    <text x="750" y="205" font-size="11.5" fill="#463365">weekly precision, AUC, slices</text>

    <rect x="25" y="290" width="250" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="150" y="315" font-size="14" font-weight="700" fill="#294a2e">Deploy new version</text>
    <text x="150" y="335" font-size="11.5" fill="#294a2e">move alias, canary, full traffic</text>
    <rect x="325" y="290" width="250" height="60" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="450" y="315" font-size="14" font-weight="700" fill="#294a2e">Train and gate</text>
    <text x="450" y="335" font-size="11.5" fill="#294a2e">snapshot, train, compare</text>
    <rect x="625" y="290" width="250" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="750" y="315" font-size="14" font-weight="700" fill="#263e5a">Trigger rules</text>
    <text x="750" y="335" font-size="11.5" fill="#263e5a">schedule, labels, drops, drift</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M275 60H323" marker-end="url(#mfl-arrow)"/>
      <path d="M575 60H623" marker-end="url(#mfl-arrow)"/>
      <path d="M275 190H323" marker-end="url(#mfl-arrow)"/>
      <path d="M575 190H623" marker-end="url(#mfl-arrow)"/>
      <path d="M450 90V158" marker-end="url(#mfl-arrow)"/>
      <path d="M750 220V288" marker-end="url(#mfl-arrow)"/>
      <path d="M875 60H888V320H877" marker-end="url(#mfl-arrow)"/>
      <path d="M625 320H577" marker-end="url(#mfl-arrow)"/>
      <path d="M325 320H277" marker-end="url(#mfl-arrow)"/>
      <path d="M25 320H12V60H23" marker-end="url(#mfl-arrow)"/>
    </g>
    <path d="M150 90V158" fill="none" stroke="#b5524b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mfl-arrow)"/>
    <text x="158" y="128" font-size="11" font-style="italic" fill="#6e2a24" text-anchor="start">suggestion shapes the label</text>
    <text x="458" y="128" font-size="11" font-style="italic" fill="#36424e" text-anchor="start">join</text>
    <text x="682" y="258" font-size="11" font-style="italic" fill="#36424e" text-anchor="end">start training, never promote</text>

    <rect x="25" y="368" width="850" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="450" y="386" font-size="12" font-weight="700" fill="#6e2a24">Feedback loop: users tend to keep suggested values, so labels drift toward the model.</text>
    <text x="450" y="403" font-size="11.5" fill="#6e2a24">A 5% holdout that sees no suggestion keeps a stream of unbiased labels for evaluation.</text>

    <text x="450" y="436" font-size="13" fill="#40566b">Monitors start the pipeline; the gate and the canary still decide what reaches users.</text>
  </g>
</svg>
