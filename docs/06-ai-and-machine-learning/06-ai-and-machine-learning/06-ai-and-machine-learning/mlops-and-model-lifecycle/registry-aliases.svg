<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="rga-title rga-desc">
  <title id="rga-title">Registry versions with movable aliases</title>
  <desc id="rga-desc">Top panel, after three promotion attempts: registered model taskflow-priority has versions 1, 2 and 3. Version 1 is tagged approved and carries the previous alias, version 2 is tagged approved and carries the champion alias, and version 3 is tagged rejected and carries the challenger alias; the scoring server loads the champion, so it serves version 2. Bottom panel, after running the rollback: the champion alias moved back to version 1, which also still carries the previous alias, version 2 is now tagged rolled_back, version 3 stays rejected with the challenger alias, and the scoring server serves version 1 the next time it resolves the alias, with no rebuild. Versions are immutable; only the alias pointers move.</desc>
  <defs>
    <marker id="rga-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="132" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">After three</text>
    <text x="24" y="150" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">promotions</text>
    <text x="24" y="302" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">After</text>
    <text x="24" y="320" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">--rollback</text>

    <rect x="193" y="40" width="84" height="26" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="235" y="58" font-size="12" font-weight="700" fill="#463365">@previous</text>
    <rect x="410" y="40" width="90" height="26" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="455" y="58" font-size="12" font-weight="700" fill="#463365">@champion</text>
    <rect x="627" y="40" width="96" height="26" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="675" y="58" font-size="12" font-weight="700" fill="#463365">@challenger</text>

    <rect x="160" y="110" width="150" height="58" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="235" y="134" font-size="14" font-weight="700" fill="#263e5a">version 1</text>
    <text x="235" y="155" font-size="11.5" fill="#263e5a">approved</text>
    <rect x="380" y="110" width="150" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="455" y="134" font-size="14" font-weight="700" fill="#294a2e">version 2</text>
    <text x="455" y="155" font-size="11.5" fill="#294a2e">approved</text>
    <rect x="600" y="110" width="150" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="675" y="134" font-size="14" font-weight="700" fill="#6e2a24">version 3</text>
    <text x="675" y="155" font-size="11.5" fill="#6e2a24">rejected</text>

    <rect x="776" y="110" width="100" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="826" y="134" font-size="14" font-weight="700" fill="#66400f">Serving</text>
    <text x="826" y="155" font-size="11.5" fill="#66400f">loads v2</text>

    <path d="M24 200H876" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="148" y="214" width="84" height="26" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="190" y="232" font-size="12" font-weight="700" fill="#463365">@previous</text>
    <rect x="238" y="214" width="90" height="26" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="283" y="232" font-size="12" font-weight="700" fill="#463365">@champion</text>
    <rect x="627" y="214" width="96" height="26" rx="12" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="675" y="232" font-size="12" font-weight="700" fill="#463365">@challenger</text>

    <rect x="160" y="280" width="150" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="235" y="304" font-size="14" font-weight="700" fill="#294a2e">version 1</text>
    <text x="235" y="325" font-size="11.5" fill="#294a2e">approved</text>
    <rect x="380" y="280" width="150" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="455" y="304" font-size="14" font-weight="700" fill="#6e2a24">version 2</text>
    <text x="455" y="325" font-size="11.5" fill="#6e2a24">rolled_back</text>
    <rect x="600" y="280" width="150" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="675" y="304" font-size="14" font-weight="700" fill="#6e2a24">version 3</text>
    <text x="675" y="325" font-size="11.5" fill="#6e2a24">rejected</text>

    <rect x="776" y="280" width="100" height="58" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="826" y="304" font-size="14" font-weight="700" fill="#66400f">Serving</text>
    <text x="826" y="325" font-size="11.5" fill="#66400f">loads v1</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M235 66V108" marker-end="url(#rga-arrow)"/>
      <path d="M455 66V108" marker-end="url(#rga-arrow)"/>
      <path d="M675 66V108" marker-end="url(#rga-arrow)"/>
      <path d="M190 240L215 278" marker-end="url(#rga-arrow)"/>
      <path d="M283 240L257 278" marker-end="url(#rga-arrow)"/>
      <path d="M675 240V278" marker-end="url(#rga-arrow)"/>
    </g>
    <text x="540" y="188" font-size="11" font-style="italic" fill="#36424e">set_registered_model_alias(name, alias, version)</text>

    <text x="450" y="372" font-size="12" fill="#36424e">Every version is immutable and keeps its tags; serving resolves models:/taskflow-priority@champion at load time.</text>
    <text x="450" y="402" font-size="13" fill="#40566b">Promotion and rollback move a pointer: one API call, no rebuild, and the history stays intact.</text>
  </g>
</svg>
