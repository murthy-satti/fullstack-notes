<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="ecp-title ecp-desc">
  <title id="ecp-title">LLM evals in CI: pull requests and nightly runs</title>
  <desc id="ecp-desc">Two lanes. The pull-request lane: a pull request that changes src/ai or evals runs unit tests and the dataset manifest check, restores the response cache keyed on the model and the prompt hash, runs the promptfoo suite on the test split with code checks and a judge, and reaches the paired gate: on failure it blocks the merge, on success it uploads the report. A note under the first step says pull requests from forks get no secrets, so the eval job is skipped. The nightly lane on main: a schedule starts a run with no cache for fresh outputs, runs the full suite with three repeats per case, writes a drift report with flaky cases and slices, and compares with the baseline, alerting on drift. Between the two gates sits the committed baseline, used by both comparisons and changed only by reviewed pull requests. Pull requests get a fast, cached gate; the nightly run measures drift and flakiness.</desc>
  <defs>
    <marker id="ecp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="38" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Pull request</text>
    <rect x="24" y="50" width="146" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="97" y="74" font-size="13" font-weight="700" fill="#66400f">Pull request</text>
    <text x="97" y="94" font-size="11.5" fill="#66400f">changes src/ai</text>
    <text x="97" y="110" font-size="11.5" fill="#66400f">or evals/</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="190" y="50" width="146" height="76" rx="8"/>
      <rect x="356" y="50" width="146" height="76" rx="8"/>
      <rect x="522" y="50" width="146" height="76" rx="8"/>
    </g>
    <g fill="#463365">
      <text x="263" y="74" font-size="13" font-weight="700">Unit tests</text>
      <text x="263" y="94" font-size="11.5">+ manifest check</text>
      <text x="263" y="110" font-size="11.5">no model calls</text>
      <text x="429" y="74" font-size="13" font-weight="700">Restore cache</text>
      <text x="429" y="94" font-size="11.5">keyed on model</text>
      <text x="429" y="110" font-size="11.5">and prompt hash</text>
      <text x="595" y="74" font-size="13" font-weight="700">promptfoo suite</text>
      <text x="595" y="94" font-size="11.5">test split</text>
      <text x="595" y="110" font-size="11.5">checks + judge</text>
    </g>
    <rect x="690" y="50" width="166" height="76" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="773" y="74" font-size="13" font-weight="700" fill="#263e5a">Paired gate</text>
    <text x="773" y="94" font-size="11.5" fill="#6e2a24">fail: block the merge</text>
    <text x="773" y="110" font-size="11.5" fill="#294a2e">pass: upload report</text>

    <rect x="24" y="146" width="146" height="64" rx="8" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="97" y="168" font-size="11.5" font-weight="700" fill="#36424e">Fork pull requests</text>
    <text x="97" y="186" font-size="11.5" fill="#36424e">no secrets, so the</text>
    <text x="97" y="202" font-size="11.5" fill="#36424e">eval job is skipped</text>
    <path d="M97 126V142" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="3 3"/>

    <rect x="690" y="150" width="166" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="773" y="172" font-size="13" font-weight="700" fill="#263e5a">Committed baseline</text>
    <text x="773" y="192" font-size="11" fill="#263e5a">reviewed updates only</text>

    <text x="24" y="226" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Nightly on main</text>
    <rect x="24" y="238" width="146" height="76" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="97" y="262" font-size="13" font-weight="700" fill="#66400f">Schedule</text>
    <text x="97" y="282" font-size="11.5" fill="#66400f">main branch</text>
    <text x="97" y="298" font-size="11.5" fill="#66400f">no merge needed</text>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="190" y="238" width="146" height="76" rx="8"/>
      <rect x="356" y="238" width="146" height="76" rx="8"/>
      <rect x="522" y="238" width="146" height="76" rx="8"/>
    </g>
    <g fill="#463365">
      <text x="263" y="262" font-size="13" font-weight="700">No cache</text>
      <text x="263" y="282" font-size="11.5">fresh outputs</text>
      <text x="263" y="298" font-size="11.5">every night</text>
      <text x="429" y="262" font-size="13" font-weight="700">Full suite</text>
      <text x="429" y="282" font-size="11.5">3 repeats per case</text>
      <text x="429" y="298" font-size="11.5">all judge criteria</text>
      <text x="595" y="262" font-size="13" font-weight="700">Drift report</text>
      <text x="595" y="282" font-size="11.5">flaky cases</text>
      <text x="595" y="298" font-size="11.5">and slices</text>
    </g>
    <rect x="690" y="238" width="166" height="76" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="773" y="262" font-size="13" font-weight="700" fill="#294a2e">Compare</text>
    <text x="773" y="282" font-size="11.5" fill="#294a2e">with the baseline</text>
    <text x="773" y="298" font-size="11.5" fill="#294a2e">alert on drift</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M170 88H186" marker-end="url(#ecp-arrow)"/>
      <path d="M336 88H352" marker-end="url(#ecp-arrow)"/>
      <path d="M502 88H518" marker-end="url(#ecp-arrow)"/>
      <path d="M668 88H686" marker-end="url(#ecp-arrow)"/>
      <path d="M170 276H186" marker-end="url(#ecp-arrow)"/>
      <path d="M336 276H352" marker-end="url(#ecp-arrow)"/>
      <path d="M502 276H518" marker-end="url(#ecp-arrow)"/>
      <path d="M668 276H686" marker-end="url(#ecp-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M773 150V130" marker-end="url(#ecp-arrow)"/>
      <path d="M773 206V234" marker-end="url(#ecp-arrow)"/>
    </g>

    <text x="440" y="356" font-size="13" fill="#40566b">Pull requests get a fast, cached gate; the nightly run measures drift and flakiness.</text>
  </g>
</svg>
