<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="fbl-title fbl-desc">
  <title id="fbl-title">The user-feedback loop</title>
  <desc id="fbl-desc">The user-feedback loop as a cycle of six steps. One, TaskFlow returns an AI answer with its trace ID. Two, the user gives feedback: a thumbs up or down with a reason, or implicitly by editing the draft. Three, the backend stores the feedback with the user and the trace ID in its own database, and attaches a score to the trace in the tracing tool. Four, a weekly triage reads thumbs-down, edited drafts, and judge failures on sampled traces, and groups them into failure types. Five, the important failures become labeled evaluation cases in a new dataset version. Six, the CI gate runs them on every change and the improved prompt is deployed, which brings the loop back to step one. Feedback is only useful when it can be traced to the prompt, model, and data that produced the answer.</desc>
  <defs>
    <marker id="fbl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="315" y="24" width="230" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="50" font-size="13" font-weight="700" fill="#66400f">1. Answer with trace ID</text>
    <text x="430" y="70" font-size="11.5" fill="#66400f">response includes traceId</text>

    <rect x="580" y="118" width="250" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="705" y="144" font-size="13" font-weight="700" fill="#66400f">2. User feedback</text>
    <text x="705" y="164" font-size="11.5" fill="#66400f">thumbs and reason, or an edit</text>

    <rect x="580" y="270" width="250" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="705" y="296" font-size="13" font-weight="700" fill="#263e5a">3. Store and score</text>
    <text x="705" y="316" font-size="11.5" fill="#263e5a">own database + score on the trace</text>

    <rect x="315" y="364" width="230" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="390" font-size="13" font-weight="700" fill="#463365">4. Weekly triage</text>
    <text x="430" y="410" font-size="11.5" fill="#463365">thumbs-down, edits, judge fails</text>

    <rect x="30" y="270" width="250" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="155" y="296" font-size="13" font-weight="700" fill="#294a2e">5. New eval cases</text>
    <text x="155" y="316" font-size="11.5" fill="#294a2e">labeled, new dataset version</text>

    <rect x="30" y="118" width="250" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="155" y="144" font-size="13" font-weight="700" fill="#294a2e">6. CI gate, then deploy</text>
    <text x="155" y="164" font-size="11.5" fill="#294a2e">regressions blocked before merge</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M545 56H705V114" marker-end="url(#fbl-arrow)"/>
      <path d="M705 182V266" marker-end="url(#fbl-arrow)"/>
      <path d="M705 334V396H549" marker-end="url(#fbl-arrow)"/>
      <path d="M315 396H155V338" marker-end="url(#fbl-arrow)"/>
      <path d="M155 270V186" marker-end="url(#fbl-arrow)"/>
      <path d="M155 118V56H311" marker-end="url(#fbl-arrow)"/>
    </g>

    <text x="430" y="216" font-size="14" font-weight="700" fill="#36424e">Feedback becomes test cases</text>
    <text x="430" y="238" font-size="12" fill="#36424e">every step keys on the trace ID</text>

    <text x="430" y="456" font-size="13" fill="#40566b">Feedback is only useful when it can be traced to the prompt, model, and data behind the answer.</text>
  </g>
</svg>
