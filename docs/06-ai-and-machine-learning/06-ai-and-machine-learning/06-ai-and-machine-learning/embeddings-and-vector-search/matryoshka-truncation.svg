<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-labelledby="mtr-title mtr-desc">
  <title id="mtr-title">Matryoshka embeddings: nested prefixes and two-stage retrieval</title>
  <desc id="mtr-desc">Top: one 3,072-dimension Matryoshka embedding drawn as a bar, with its first 1,536, 768, and 256 values drawn as shorter bars aligned at the left, because each prefix is a usable embedding by itself. Raw float32 storage for one million vectors is 12.3 GB at 3,072 dimensions, 6.1 GB at 1,536, 3.1 GB at 768, and 1.0 GB at 256; retrieval quality falls gradually as the prefix shrinks, so measure recall at each size. Bottom: a pipeline for using prefixes. Slice the first k values, which only works for Matryoshka-trained models; re-normalize, because a prefix of a unit vector is shorter than 1; search the short vectors, which is fast and uses less memory; then rescore the top candidates with the full vectors, which recovers most of the recall.</desc>
  <defs>
    <marker id="mtr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="840" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="34" font-size="14" font-weight="700" fill="#263e5a">One embedding, nested prefixes (raw float32 storage per million vectors)</text>

    <rect x="40" y="52" width="760" height="32" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="56" y="73" font-size="12.5" font-weight="700" fill="#263e5a">3,072 dims (full vector): 12.3 GB</text>

    <rect x="40" y="96" width="380" height="32" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="56" y="117" font-size="12.5" font-weight="700" fill="#463365">first 1,536 values</text>
    <text x="434" y="117" font-size="12.5" fill="#463365">6.1 GB</text>

    <rect x="40" y="140" width="190" height="32" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="56" y="161" font-size="12.5" font-weight="700" fill="#66400f">first 768 values</text>
    <text x="244" y="161" font-size="12.5" fill="#66400f">3.1 GB</text>

    <rect x="40" y="184" width="64" height="32" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="72" y="205" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="middle">256</text>
    <text x="118" y="205" font-size="12.5" fill="#294a2e">1.0 GB</text>

    <rect x="520" y="126" width="280" height="90" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="536" y="148" font-size="12.5" font-weight="700" fill="#36424e">Shorter prefix</text>
    <text x="536" y="168" font-size="12" fill="#36424e">less memory, faster distance math</text>
    <text x="536" y="186" font-size="12" fill="#36424e">quality drops gradually</text>
    <text x="536" y="204" font-size="12" fill="#36424e">measure recall at each size</text>

    <path d="M40 236H800" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="40" y="262" font-size="14" font-weight="700" fill="#263e5a">Using prefixes safely</text>

    <rect x="40" y="276" width="170" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="125" y="298" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">slice the prefix</text>
    <text x="125" y="317" font-size="11.5" fill="#463365" text-anchor="middle">MRL models only</text>

    <rect x="236" y="276" width="170" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="321" y="298" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">re-normalize</text>
    <text x="321" y="317" font-size="11.5" fill="#463365" text-anchor="middle">length back to 1</text>

    <rect x="432" y="276" width="170" height="54" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="517" y="298" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">fast first pass</text>
    <text x="517" y="317" font-size="11.5" fill="#263e5a" text-anchor="middle">short vectors</text>

    <rect x="628" y="276" width="172" height="54" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="714" y="298" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">rescore top k</text>
    <text x="714" y="317" font-size="11.5" fill="#294a2e" text-anchor="middle">with the full vectors</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M210 303H234" marker-end="url(#mtr-arrow)"/>
      <path d="M406 303H430" marker-end="url(#mtr-arrow)"/>
      <path d="M602 303H626" marker-end="url(#mtr-arrow)"/>
    </g>

    <text x="420" y="362" font-size="13" fill="#40566b" text-anchor="middle">Pick the dimension by recall per gigabyte on your own evaluation set, not by habit.</text>
  </g>
</svg>
