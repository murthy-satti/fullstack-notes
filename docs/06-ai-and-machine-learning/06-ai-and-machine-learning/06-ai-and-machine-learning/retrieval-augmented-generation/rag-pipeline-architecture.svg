<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="rpa-title rpa-desc">
  <title id="rpa-title">TaskFlow RAG: indexing and query pipelines</title>
  <desc id="rpa-desc">On the left, the indexing pipeline runs when a document changes: source documents in Markdown, HTML and PDF are parsed and chunked with headings kept and tables whole, changed chunks are embedded in batches with the model from configuration, and the chunks are upserted before stale chunks are deleted, skipping unchanged text. The chunks land in the MongoDB knowledge_chunks collection in the middle, one document per chunk with text, url, heading path, embedding, embedding model, tenant ID and project ID, plus a vector index with filter fields. On the right, the query pipeline runs on every question: the user asks in TaskFlow Web, POST /api/ask runs the auth middleware and a zod body check, the server resolves the projects the user is a member of, embeds the question with the same model as the chunks, runs $vectorSearch for the top k chunks with a tenant and project pre-filter, sends the query vector and filter to the collection and gets the top k chunks back, builds a prompt with the sources and rules so the model writes a JSON answer, and validates the citations before showing the answer with links or withholding it.</desc>
  <defs>
    <marker id="rpa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="rpa-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">Two pipelines, one index</text>
    <text x="126" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Indexing: when a document changes</text>
    <text x="740" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Query: on every question</text>

    <rect x="16" y="74" width="220" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="126" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Source documents</text>
    <text x="126" y="114" text-anchor="middle" font-size="11.5" fill="#66400f">Markdown, HTML and PDF files</text>
    <line x1="126" y1="126" x2="126" y2="148" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="16" y="150" width="220" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="126" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Parse and chunk</text>
    <text x="126" y="190" text-anchor="middle" font-size="11.5" fill="#463365">headings kept, tables whole</text>
    <line x1="126" y1="202" x2="126" y2="224" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="16" y="226" width="220" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="126" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Embed changed chunks</text>
    <text x="126" y="266" text-anchor="middle" font-size="11.5" fill="#463365">batched, model from config</text>
    <line x1="126" y1="278" x2="126" y2="300" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="16" y="302" width="220" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="126" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Upsert, then delete stale</text>
    <text x="126" y="342" text-anchor="middle" font-size="11.5" fill="#263e5a">unchanged text is skipped</text>
    <line x1="236" y1="328" x2="284" y2="328" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="286" y="226" width="230" height="130" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="401" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">MongoDB knowledge_chunks</text>
    <text x="401" y="272" text-anchor="middle" font-size="11.5" fill="#263e5a">one document per chunk:</text>
    <text x="401" y="290" text-anchor="middle" font-size="11.5" fill="#263e5a">text, url, headingPath,</text>
    <text x="401" y="308" text-anchor="middle" font-size="11.5" fill="#263e5a">embedding, embeddingModel,</text>
    <text x="401" y="326" text-anchor="middle" font-size="11.5" fill="#263e5a">tenantId, projectId</text>
    <text x="401" y="344" text-anchor="middle" font-size="11.5" fill="#263e5a">+ vector index with filters</text>

    <rect x="616" y="74" width="248" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="740" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">User asks a question</text>
    <text x="740" y="111" text-anchor="middle" font-size="11.5" fill="#66400f">TaskFlow Web, signed in</text>
    <line x1="740" y1="120" x2="740" y2="130" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="616" y="132" width="248" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="740" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">POST /api/ask</text>
    <text x="740" y="169" text-anchor="middle" font-size="11.5" fill="#66400f">auth middleware, zod body check</text>
    <line x1="740" y1="178" x2="740" y2="188" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="616" y="190" width="248" height="46" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="740" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Resolve scope</text>
    <text x="740" y="227" text-anchor="middle" font-size="11.5" fill="#263e5a">projects the user is a member of</text>
    <line x1="740" y1="236" x2="740" y2="246" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="616" y="248" width="248" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="740" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Embed the question</text>
    <text x="740" y="285" text-anchor="middle" font-size="11.5" fill="#463365">same model as the chunks</text>
    <line x1="740" y1="294" x2="740" y2="304" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="616" y="306" width="248" height="46" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="740" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">$vectorSearch, top k</text>
    <text x="740" y="343" text-anchor="middle" font-size="11.5" fill="#263e5a">pre-filter: tenantId, projectId</text>
    <line x1="740" y1="352" x2="740" y2="362" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="616" y="364" width="248" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="740" y="383" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Prompt and generate</text>
    <text x="740" y="401" text-anchor="middle" font-size="11.5" fill="#463365">sources + rules, JSON answer</text>
    <line x1="740" y1="410" x2="740" y2="420" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>

    <rect x="616" y="422" width="248" height="46" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="740" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">Validate citations</text>
    <text x="740" y="459" text-anchor="middle" font-size="11.5" fill="#294a2e">show with links, or withhold</text>

    <line x1="616" y1="318" x2="518" y2="318" stroke="#40566b" stroke-width="1.5" marker-end="url(#rpa-arrow)"/>
    <rect x="525" y="290" width="84" height="16" rx="3" fill="#f5f7fb"/>
    <text x="567" y="302" text-anchor="middle" font-size="11" fill="#36424e">vector + filter</text>
    <line x1="516" y1="342" x2="614" y2="342" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rpa-arrow-dash)"/>
    <rect x="528" y="350" width="78" height="16" rx="3" fill="#f5f7fb"/>
    <text x="567" y="362" text-anchor="middle" font-size="11" fill="#36424e">top k chunks</text>

    <text x="440" y="502" text-anchor="middle" font-size="13" fill="#40566b">Same model for chunks and questions; scope before the search; citations checked after generation.</text>
  </g>
</svg>
