<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="rdf-title rdf-desc">
  <title id="rdf-title">Debugging a wrong RAG answer stage by stage</title>
  <desc id="rdf-desc">A wrong or missing answer is reported, and five questions are asked in order, each with the evidence to check written on the left. First, is the answer in the corpus at all, checked by searching the source documents; if not, it is an ingestion gap: add or fix the source and check parsing, OCR and deletions. Second, does the user's scope include that document, checked in the scope log; if not, refusing is correct, or the permission data is wrong. Third, is the source in the top k candidates, checked in the retrieved IDs and scores; if not, it is a retrieval miss: check query wording, chunking, the embedding model, filters and numCandidates, and try hybrid search or a reranker. Fourth, did the source reach the prompt, checked in the prompt's source list; if not, it is an assembly problem: token budget, deduplication, ordering or truncation. Fifth, did the answer use the source faithfully, checked with claims against sources; if not, it is a generation problem: instructions, the model, or conflicting sources. If all five answers are yes, look for a citation rendering bug or a wrong golden label.</desc>
  <defs>
    <marker id="rdf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">Debug a wrong answer from the source to the screen</text>

    <rect x="180" y="46" width="200" height="38" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="280" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Wrong or missing answer</text>
    <line x1="280" y1="84" x2="280" y2="100" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <text x="16" y="72" font-size="11.5" font-weight="bold" fill="#40566b">Evidence to check</text>

    <path d="M280 102 380 140 280 178 180 140z" fill="#e5efff" stroke="#4774aa"/>
    <text x="280" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">In the corpus</text>
    <text x="280" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">at all?</text>
    <text x="16" y="136" font-size="11.5" fill="#36424e">search the source</text>
    <text x="16" y="152" font-size="11.5" fill="#36424e">documents directly</text>
    <line x1="380" y1="140" x2="438" y2="140" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <rect x="394" y="120" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="406" y="131" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="440" y="116" width="424" height="48" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="452" y="136" font-size="13" font-weight="bold" fill="#6e2a24">Ingestion gap</text>
    <text x="452" y="154" font-size="11.5" fill="#6e2a24">add or fix the source; check parsing, OCR, lost deletes</text>
    <line x1="280" y1="178" x2="280" y2="196" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <text x="288" y="191" font-size="11" fill="#36424e">yes</text>

    <path d="M280 198 380 236 280 274 180 236z" fill="#e5efff" stroke="#4774aa"/>
    <text x="280" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">In the user's</text>
    <text x="280" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">scope?</text>
    <text x="16" y="232" font-size="11.5" fill="#36424e">scope log: tenant</text>
    <text x="16" y="248" font-size="11.5" fill="#36424e">and project IDs</text>
    <line x1="380" y1="236" x2="438" y2="236" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <rect x="394" y="216" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="406" y="227" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="440" y="212" width="424" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="452" y="232" font-size="13" font-weight="bold" fill="#294a2e">Refusal is correct</text>
    <text x="452" y="250" font-size="11.5" fill="#294a2e">or membership and document permissions are wrong</text>
    <line x1="280" y1="274" x2="280" y2="292" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <text x="288" y="287" font-size="11" fill="#36424e">yes</text>

    <path d="M280 294 380 332 280 370 180 332z" fill="#e5efff" stroke="#4774aa"/>
    <text x="280" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">In the top-k</text>
    <text x="280" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">candidates?</text>
    <text x="16" y="328" font-size="11.5" fill="#36424e">retrieved chunk</text>
    <text x="16" y="344" font-size="11.5" fill="#36424e">IDs and scores</text>
    <line x1="380" y1="332" x2="438" y2="332" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <rect x="394" y="312" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="406" y="323" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="440" y="300" width="424" height="64" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="452" y="320" font-size="13" font-weight="bold" fill="#6e2a24">Retrieval miss</text>
    <text x="452" y="338" font-size="11.5" fill="#6e2a24">query wording, chunking, embedding model, filters,</text>
    <text x="452" y="354" font-size="11.5" fill="#6e2a24">numCandidates; try hybrid search or a reranker</text>
    <line x1="280" y1="370" x2="280" y2="388" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <text x="288" y="383" font-size="11" fill="#36424e">yes</text>

    <path d="M280 390 380 428 280 466 180 428z" fill="#e5efff" stroke="#4774aa"/>
    <text x="280" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">Reached the</text>
    <text x="280" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">prompt?</text>
    <text x="16" y="424" font-size="11.5" fill="#36424e">the prompt's</text>
    <text x="16" y="440" font-size="11.5" fill="#36424e">source list</text>
    <line x1="380" y1="428" x2="438" y2="428" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <rect x="394" y="408" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="406" y="419" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="440" y="404" width="424" height="48" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="452" y="424" font-size="13" font-weight="bold" fill="#6e2a24">Context assembly</text>
    <text x="452" y="442" font-size="11.5" fill="#6e2a24">token budget, deduplication, ordering, truncation</text>
    <line x1="280" y1="466" x2="280" y2="484" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <text x="288" y="479" font-size="11" fill="#36424e">yes</text>

    <path d="M280 486 380 524 280 562 180 524z" fill="#e5efff" stroke="#4774aa"/>
    <text x="280" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">Used faithfully</text>
    <text x="280" y="536" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">in the answer?</text>
    <text x="16" y="520" font-size="11.5" fill="#36424e">claims checked</text>
    <text x="16" y="536" font-size="11.5" fill="#36424e">against sources</text>
    <line x1="380" y1="524" x2="438" y2="524" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <rect x="394" y="504" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="406" y="515" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="440" y="500" width="424" height="48" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="452" y="520" font-size="13" font-weight="bold" fill="#6e2a24">Generation problem</text>
    <text x="452" y="538" font-size="11.5" fill="#6e2a24">instructions, model choice, conflicting sources</text>
    <line x1="280" y1="562" x2="280" y2="580" stroke="#40566b" stroke-width="1.5" marker-end="url(#rdf-arrow)"/>
    <text x="288" y="575" font-size="11" fill="#36424e">yes</text>

    <rect x="140" y="582" width="280" height="38" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="280" y="606" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#463365">Citation rendering or a wrong label</text>

    <text x="652" y="606" text-anchor="middle" font-size="13" fill="#40566b">Stop at the first "no":</text>
    <text x="652" y="624" text-anchor="middle" font-size="13" fill="#40566b">later stages cannot fix it.</text>
  </g>
</svg>
