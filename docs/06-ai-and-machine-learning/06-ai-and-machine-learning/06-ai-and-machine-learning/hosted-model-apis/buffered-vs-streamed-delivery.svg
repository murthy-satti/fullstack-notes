<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="bsd-title bsd-desc">
  <title id="bsd-title">When the user sees the words, with and without proxy buffering</title>
  <desc id="bsd-desc">Three rows on a 0 to 8 second axis, an illustrative example. The provider emits small text chunks steadily from 0.6 seconds to about 6.9 seconds. With proxy buffering off, the browser receives each chunk a few milliseconds after the provider sends it, so the first words appear at about 0.6 seconds. With proxy buffering on, nothing arrives until a 4 or 8 KB buffer fills at about 3.6 seconds, when a burst of text appears at once, and the rest arrives in a second burst when the response ends at about 7 seconds. The model and its speed are identical in all rows; only the time the user first sees text changes.</desc>
  <rect width="880" height="320" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="160" y="77" text-anchor="end" font-size="12" font-weight="bold" fill="#263e5a">Provider emits</text>
    <path d="M220.2 62v22 M241.2 62v22 M262.1 62v22 M283.1 62v22 M304 62v22 M324.9 62v22 M345.9 62v22 M366.8 62v22 M387.8 62v22 M408.7 62v22 M429.6 62v22 M450.6 62v22 M471.5 62v22 M492.4 62v22 M513.4 62v22 M534.3 62v22 M555.2 62v22 M576.2 62v22 M597.1 62v22 M618.1 62v22 M639 62v22 M659.9 62v22 M680.9 62v22 M701.8 62v22 M722.8 62v22 M743.7 62v22" stroke="#4774aa" stroke-width="3"/>

    <text x="160" y="137" text-anchor="end" font-size="12" font-weight="bold" fill="#294a2e">Buffering off</text>
    <path d="M224.4 122v22 M245.4 122v22 M266.3 122v22 M287.2 122v22 M308.2 122v22 M329.1 122v22 M350.1 122v22 M371 122v22 M391.9 122v22 M412.9 122v22 M433.8 122v22 M454.8 122v22 M475.7 122v22 M496.6 122v22 M517.6 122v22 M538.5 122v22 M559.4 122v22 M580.4 122v22 M601.3 122v22 M622.2 122v22 M643.2 122v22 M664.1 122v22 M685.1 122v22 M706 122v22 M726.9 122v22 M747.9 122v22" stroke="#53845b" stroke-width="3"/>

    <text x="160" y="197" text-anchor="end" font-size="12" font-weight="bold" fill="#6e2a24">Buffering on</text>
    <rect x="467.5" y="180" width="8" height="26" rx="2" fill="#b5524b"/>
    <rect x="752.2" y="180" width="8" height="26" rx="2" fill="#b5524b"/>
    <rect x="484" y="186" width="122" height="15" fill="#f5f7fb"/>
    <text x="487" y="197" font-size="11.5" fill="#6e2a24">buffer full: a burst</text>
    <rect x="618" y="186" width="126" height="15" fill="#f5f7fb"/>
    <text x="740" y="197" text-anchor="end" font-size="11.5" fill="#6e2a24">response ends: rest</text>

    <line x1="220.2" y1="50" x2="220.2" y2="214" stroke="#8a96a3" stroke-dasharray="4 4"/>
    <text x="226" y="46" font-size="11.5" fill="#36424e">first token at 0.6 s</text>
    <line x1="471.5" y1="160" x2="471.5" y2="214" stroke="#8a96a3" stroke-dasharray="4 4"/>
    <text x="477" y="172" font-size="11.5" fill="#6e2a24">first visible text at 3.6 s</text>

    <line x1="170" y1="236" x2="840" y2="236" stroke="#8a96a3"/>
    <path d="M170 232v8 M253.8 232v8 M337.5 232v8 M421.3 232v8 M505 232v8 M588.8 232v8 M672.5 232v8 M756.3 232v8 M840 232v8" stroke="#8a96a3"/>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="170" y="256">0 s</text>
      <text x="253.8" y="256">1 s</text>
      <text x="337.5" y="256">2 s</text>
      <text x="421.3" y="256">3 s</text>
      <text x="505" y="256">4 s</text>
      <text x="588.8" y="256">5 s</text>
      <text x="672.5" y="256">6 s</text>
      <text x="756.3" y="256">7 s</text>
      <text x="840" y="256">8 s</text>
    </g>

    <text x="440" y="296" text-anchor="middle" font-size="13" fill="#40566b">Same model, same speed: proxy buffering only changes when the user first sees words (example timings).</text>
  </g>
</svg>
