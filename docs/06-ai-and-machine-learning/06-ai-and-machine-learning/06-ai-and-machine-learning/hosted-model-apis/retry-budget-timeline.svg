<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="rbt-title rbt-desc">
  <title id="rbt-title">Retries inside a total time budget</title>
  <desc id="rbt-desc">Two timelines on a 0 to 25 second axis. The first uses a 25-second total budget: attempt 1 to the primary model returns 429 after 1 second with Retry-After 2 seconds; the router waits 2 seconds; attempt 2 gets no answer and is cut off by the 15-second attempt timeout at 18 seconds; after a 1-second backoff the router has used its two attempts on this route and calls the fallback model, which answers 200 at about 21.5 seconds, inside the budget that ends at 25 seconds. The second timeline uses SDK defaults only: up to three attempts, each allowed to wait up to 10 minutes, so one user request can hang for more than 30 minutes.</desc>
  <defs>
    <marker id="rbt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="100" y="52" font-size="14" font-weight="bold" fill="#263e5a">With a 25 s total budget (15 s per attempt, 2 attempts per route)</text>

    <rect x="100" y="70" width="29.6" height="34" rx="4" fill="#fbe9e7" stroke="#b5524b"/>
    <rect x="129.6" y="70" width="59.2" height="34" rx="4" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="4 3"/>
    <rect x="188.8" y="70" width="444" height="34" rx="4" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="410.8" y="92" text-anchor="middle" font-size="12" fill="#6e2a24">attempt 2: no answer, cut off by the 15 s attempt timeout</text>
    <rect x="632.8" y="70" width="29.6" height="34" rx="4" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="4 3"/>
    <rect x="662.4" y="70" width="74" height="34" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    <text x="699.4" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#294a2e">200</text>

    <text x="115" y="124" text-anchor="middle" font-size="11.5" fill="#6e2a24">attempt 1: 429</text>
    <text x="159" y="140" text-anchor="middle" font-size="11.5" fill="#36424e">wait 2 s (Retry-After)</text>
    <text x="647" y="124" text-anchor="middle" font-size="11.5" fill="#36424e">backoff</text>
    <text x="699" y="140" text-anchor="middle" font-size="11.5" fill="#294a2e">fallback model</text>

    <line x1="840" y1="62" x2="840" y2="160" stroke="#b5524b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="832" y="156" text-anchor="end" font-size="11.5" fill="#6e2a24">budget ends: 503</text>

    <text x="100" y="192" font-size="14" font-weight="bold" fill="#263e5a">SDK defaults only (10-minute timeout, 2 retries)</text>
    <rect x="100" y="206" width="740" height="34" rx="4" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="460" y="228" text-anchor="middle" font-size="12" fill="#6e2a24">up to 3 attempts x 10 minutes each: a request can hang for 30+ minutes</text>
    <line x1="840" y1="223" x2="868" y2="223" stroke="#40566b" stroke-width="1.6" marker-end="url(#rbt-arrow)"/>

    <line x1="100" y1="268" x2="840" y2="268" stroke="#8a96a3"/>
    <g stroke="#8a96a3">
      <line x1="100" y1="264" x2="100" y2="272"/>
      <line x1="248" y1="264" x2="248" y2="272"/>
      <line x1="396" y1="264" x2="396" y2="272"/>
      <line x1="544" y1="264" x2="544" y2="272"/>
      <line x1="692" y1="264" x2="692" y2="272"/>
      <line x1="840" y1="264" x2="840" y2="272"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="100" y="288">0 s</text>
      <text x="248" y="288">5 s</text>
      <text x="396" y="288">10 s</text>
      <text x="544" y="288">15 s</text>
      <text x="692" y="288">20 s</text>
      <text x="840" y="288">25 s</text>
    </g>

    <text x="440" y="326" text-anchor="middle" font-size="13" fill="#40566b">A total budget turns slow failures into fast fallbacks; per-attempt timeouts alone do not.</text>
  </g>
</svg>
