<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="bjl-title bjl-desc">
  <title id="bjl-title">The life of a batch job</title>
  <desc id="bjl-desc">Top row: build a JSONL file with one request per line and a custom_id on each, upload the file with purpose batch, and create the batch with an endpoint and a 24-hour completion window. Middle row: the batch moves through the states validating, in_progress, finalizing and completed. Failure states sit below: failed when the input file is invalid, expired when 24 hours pass before processing finishes, and cancelled when you cancel it. Completed, expired and cancelled batches all lead to their output and error files, which can be partial for expired or cancelled batches. Bottom row: download the output and error files, match each result to its request by custom_id because the order is not guaranteed, and retry or report the failed lines in a later batch or with normal requests.</desc>
  <defs>
    <marker id="bjl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="bjl-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="28" width="250" height="54" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="145" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Build JSONL</text>
    <text x="145" y="70" text-anchor="middle" font-size="11.5" fill="#66400f">one request per line, each with custom_id</text>
    <rect x="315" y="28" width="250" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Upload the file</text>
    <text x="440" y="70" text-anchor="middle" font-size="11.5" fill="#463365">purpose: "batch"</text>
    <rect x="610" y="28" width="250" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="735" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Create the batch</text>
    <text x="735" y="70" text-anchor="middle" font-size="11.5" fill="#463365">endpoint + completion window 24h</text>
    <line x1="270" y1="55" x2="313" y2="55" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>
    <line x1="565" y1="55" x2="608" y2="55" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>
    <path d="M735 82 V108 H115 V138" fill="none" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>

    <rect x="40" y="140" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="115" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">validating</text>
    <rect x="250" y="140" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="325" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">in_progress</text>
    <rect x="460" y="140" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="535" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">finalizing</text>
    <rect x="670" y="140" width="150" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="745" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">completed</text>
    <line x1="190" y1="162" x2="248" y2="162" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>
    <line x1="400" y1="162" x2="458" y2="162" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>
    <line x1="610" y1="162" x2="668" y2="162" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>

    <rect x="40" y="218" width="150" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="115" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a24">failed</text>
    <text x="115" y="253" text-anchor="middle" font-size="11.5" fill="#6e2a24">invalid input file</text>
    <rect x="250" y="218" width="150" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="325" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a24">expired</text>
    <text x="325" y="253" text-anchor="middle" font-size="11.5" fill="#6e2a24">24 hours passed</text>
    <rect x="460" y="218" width="150" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="535" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a24">cancelled</text>
    <text x="535" y="253" text-anchor="middle" font-size="11.5" fill="#6e2a24">after cancelling</text>
    <line x1="115" y1="184" x2="115" y2="216" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>
    <line x1="325" y1="184" x2="325" y2="216" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>
    <line x1="535" y1="184" x2="535" y2="216" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>

    <path d="M745 184 V292 M325 262 V292 M535 262 V292 M745 292 H145" fill="none" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4"/>
    <line x1="145" y1="292" x2="145" y2="318" stroke="#60788d" stroke-width="1.6" marker-end="url(#bjl-ret)"/>
    <rect x="560" y="276" width="176" height="15" fill="#f5f7fb"/>
    <text x="648" y="287" text-anchor="middle" font-size="11.5" fill="#36424e">partial if expired or cancelled</text>

    <rect x="20" y="320" width="250" height="54" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="145" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Download results</text>
    <text x="145" y="362" text-anchor="middle" font-size="11.5" fill="#263e5a">output file and error file</text>
    <rect x="315" y="320" width="250" height="54" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="440" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Match by custom_id</text>
    <text x="440" y="362" text-anchor="middle" font-size="11.5" fill="#263e5a">output order is not guaranteed</text>
    <rect x="610" y="320" width="250" height="54" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="735" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#294a2e">Retry or report failures</text>
    <text x="735" y="362" text-anchor="middle" font-size="11.5" fill="#294a2e">next batch, or normal requests</text>
    <line x1="270" y1="347" x2="313" y2="347" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>
    <line x1="565" y1="347" x2="608" y2="347" stroke="#40566b" stroke-width="1.6" marker-end="url(#bjl-arrow)"/>

    <text x="440" y="404" text-anchor="middle" font-size="13" fill="#40566b">Submit now, collect within 24 hours, match by custom_id, and retry only the lines that failed.</text>
  </g>
</svg>
