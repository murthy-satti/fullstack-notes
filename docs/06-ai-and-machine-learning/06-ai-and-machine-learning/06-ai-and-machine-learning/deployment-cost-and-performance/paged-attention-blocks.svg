<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-labelledby="pab-title pab-desc">
  <title id="pab-title">Contiguous KV cache slabs compared with paged blocks</title>
  <desc id="pab-desc">Left panel: with contiguous allocation each of requests A, B, and C reserves a slab sized for its maximum length; only the first part of each slab holds tokens and the rest is reserved but never used, so request D is rejected because no free gap is as large as a slab; earlier systems stored actual token states in only 20 to 38 percent of cache memory. Right panel: with paged allocation memory is a grid of fixed-size blocks; blocks for requests A, B, C, and D are scattered anywhere in memory and allocated as tokens arrive; two shared-prefix blocks hold the system prompt once for both A and B, whose block tables point to them; D fits in blocks that slabs would have wasted, and waste is at most part of one block per sequence.</desc>
  <rect width="880" height="490" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="20" width="410" height="400" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="40" y="50" font-size="14" font-weight="bold" fill="#263e5a">Contiguous: one slab per request</text>

    <rect x="40" y="78" width="110" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="95" y="106" font-size="13" text-anchor="middle" fill="#66400f">A used</text>
    <rect x="150" y="78" width="260" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="280" y="106" font-size="12" text-anchor="middle" fill="#6e2a24">reserved, never used</text>

    <rect x="40" y="138" width="160" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="120" y="166" font-size="13" text-anchor="middle" fill="#66400f">B used</text>
    <rect x="200" y="138" width="210" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="305" y="166" font-size="12" text-anchor="middle" fill="#6e2a24">reserved, never used</text>

    <rect x="40" y="198" width="90" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="85" y="226" font-size="13" text-anchor="middle" fill="#66400f">C used</text>
    <rect x="130" y="198" width="280" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="270" y="226" font-size="12" text-anchor="middle" fill="#6e2a24">reserved, never used</text>

    <rect x="40" y="262" width="370" height="58" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="225" y="286" font-size="13" font-weight="bold" text-anchor="middle" fill="#6e2a24">Request D: rejected</text>
    <text x="225" y="306" font-size="12" text-anchor="middle" fill="#6e2a24">no free gap is as large as a full slab</text>

    <text x="40" y="356" font-size="12" fill="#36424e">Earlier systems: only 20-38% of the cache</text>
    <text x="40" y="374" font-size="12" fill="#36424e">held actual token states (vLLM paper).</text>

    <rect x="450" y="20" width="410" height="400" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="470" y="50" font-size="14" font-weight="bold" fill="#263e5a">Paged: fixed blocks, allocated on demand</text>

    <rect x="474" y="72" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="494" y="84" font-size="12" fill="#36424e">request block</text>
    <rect x="600" y="72" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="620" y="84" font-size="12" fill="#36424e">shared prefix</text>
    <rect x="726" y="72" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a96a3"/>
    <text x="746" y="84" font-size="12" fill="#36424e">free block</text>

    <rect x="474" y="110" width="40" height="30" rx="5" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="494" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">S</text>
    <rect x="520" y="110" width="40" height="30" rx="5" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="540" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">S</text>
    <rect x="566" y="110" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="586" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">A</text>
    <rect x="612" y="110" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="658" y="110" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="678" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">B</text>
    <rect x="704" y="110" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="750" y="110" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="770" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">A</text>
    <rect x="796" y="110" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="816" y="130" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">C</text>

    <rect x="474" y="146" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="520" y="146" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="540" y="166" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">D</text>
    <rect x="566" y="146" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="586" y="166" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">A</text>
    <rect x="612" y="146" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="658" y="146" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="678" y="166" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">B</text>
    <rect x="704" y="146" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="750" y="146" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="770" y="166" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">C</text>
    <rect x="796" y="146" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>

    <rect x="474" y="182" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="494" y="202" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">D</text>
    <rect x="520" y="182" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="566" y="182" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="612" y="182" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="632" y="202" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">C</text>
    <rect x="658" y="182" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="704" y="182" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="724" y="202" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">B</text>
    <rect x="750" y="182" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="796" y="182" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="816" y="202" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">A</text>

    <rect x="474" y="218" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="520" y="218" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="566" y="218" width="40" height="30" rx="5" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="586" y="238" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">D</text>
    <rect x="612" y="218" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="658" y="218" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="704" y="218" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="750" y="218" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="796" y="218" width="40" height="30" rx="5" fill="#ffffff" stroke="#8a96a3"/>

    <text x="474" y="280" font-size="12.5" fill="#36424e">A's table: S, S, then own blocks anywhere</text>
    <text x="474" y="300" font-size="12.5" fill="#36424e">B's table: the same S, S, then own blocks</text>
    <text x="474" y="320" font-size="12.5" fill="#36424e">D fits where slabs would have wasted space</text>

    <rect x="470" y="340" width="370" height="40" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="655" y="365" font-size="12.5" text-anchor="middle" fill="#294a2e">Waste: at most part of one block per sequence</text>

    <text x="440" y="458" font-size="13" text-anchor="middle" fill="#40566b">Paging the KV cache fits more sequences on the same GPU, and a shared prefix is stored only once.</text>
  </g>
</svg>
