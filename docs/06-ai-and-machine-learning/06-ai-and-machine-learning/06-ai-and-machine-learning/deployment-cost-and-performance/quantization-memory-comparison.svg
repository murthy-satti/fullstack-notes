<svg xmlns="http://www.w3.org/2000/svg" width="880" height="415" viewBox="0 0 880 415" role="img" aria-labelledby="qmc-title qmc-desc">
  <title id="qmc-title">Weight memory of an 8B model by quantization format</title>
  <desc id="qmc-desc">Horizontal bars of weight memory for one 8-billion-parameter model: 16-bit takes 14.9 GiB, FP8 or INT8 takes 7.5 GiB, 4-bit GPTQ or AWQ takes about 4.0 GiB including scales, and GGUF Q4_K_M takes about 4.5 GiB. A quality box says 16-bit is the reference, 8-bit usually shows a small loss, and 4-bit shows a larger, model-dependent loss that must be measured on your own evaluation set. A speed box says decode reads every weight at each step, so fewer bytes per weight speed up memory-bound decoding, and results should be benchmarked at real concurrency.</desc>
  <rect width="880" height="415" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="200" y="44" font-size="12" fill="#36424e">Weight memory, GiB (8 billion parameters)</text>

    <text x="20" y="92" font-size="13" font-weight="bold" fill="#263e5a">16-bit (BF16)</text>
    <rect x="200" y="70" width="447" height="34" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="655" y="92" font-size="13" font-weight="bold" fill="#263e5a">14.9</text>

    <text x="20" y="142" font-size="13" font-weight="bold" fill="#263e5a">FP8 or INT8</text>
    <rect x="200" y="120" width="225" height="34" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="433" y="142" font-size="13" font-weight="bold" fill="#263e5a">7.5</text>

    <text x="20" y="192" font-size="13" font-weight="bold" fill="#263e5a">4-bit GPTQ or AWQ</text>
    <rect x="200" y="170" width="120" height="34" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="328" y="192" font-size="13" font-weight="bold" fill="#263e5a">4.0</text>

    <text x="20" y="242" font-size="13" font-weight="bold" fill="#263e5a">GGUF Q4_K_M</text>
    <rect x="200" y="220" width="135" height="34" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="343" y="242" font-size="13" font-weight="bold" fill="#263e5a">4.5</text>

    <rect x="20" y="276" width="410" height="98" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="36" y="298" font-size="13" font-weight="bold" fill="#263e5a">Quality</text>
    <text x="36" y="318" font-size="12" fill="#294a2e">16-bit: the reference</text>
    <text x="36" y="336" font-size="12" fill="#36424e">8-bit: usually a small loss</text>
    <text x="36" y="354" font-size="12" fill="#6e2a24">4-bit: larger, model-dependent loss; measure it</text>

    <rect x="450" y="276" width="410" height="98" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="466" y="298" font-size="13" font-weight="bold" fill="#263e5a">Speed</text>
    <text x="466" y="318" font-size="12" fill="#36424e">Decode reads every weight at each step,</text>
    <text x="466" y="336" font-size="12" fill="#36424e">so fewer bytes speed up memory-bound decoding;</text>
    <text x="466" y="354" font-size="12" fill="#36424e">benchmark at your real concurrency</text>

    <text x="440" y="400" font-size="13" text-anchor="middle" fill="#40566b">Fewer bits fit more model and more cache on a GPU; quality is the cost you must measure.</text>
  </g>
</svg>
