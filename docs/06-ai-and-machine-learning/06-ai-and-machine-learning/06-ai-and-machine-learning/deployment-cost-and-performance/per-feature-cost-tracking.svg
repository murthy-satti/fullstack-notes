<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="pfc-title pfc-desc">
  <title id="pfc-title">Per-feature cost tracking pipeline</title>
  <desc id="pfc-desc">Every TaskFlow model call goes through one wrapper that records the feature, model, prompt version, and a hashed tenant id. The provider response carries a usage object with tokens by class, which is normalized into uncached input, cached input, cache writes, and output. The normalized usage feeds three sinks: Prometheus counters labeled by feature, model, and token type, with no tenant labels; logs and trace attributes such as gen_ai.usage, with ids only and no prompt or answer text; and a per-tenant usage store with daily totals in MongoDB. The tenant store feeds a budget check, which the wrapper consults before each call to allow it, switch to a smaller model, or reject it. Prometheus feeds dashboards of cost per feature and cost per completed task.</desc>
  <defs>
    <marker id="pfc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <path d="M770 60 V36 H120 V58" fill="none" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pfc-arrow)"/>
    <rect x="356" y="27" width="178" height="18" rx="4" fill="#f5f7fb"/>
    <text x="445" y="40" font-size="11.5" text-anchor="middle" fill="#36424e">checked before each call</text>

    <rect x="20" y="60" width="200" height="86" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="120" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">Model call wrapper</text>
    <text x="120" y="108" font-size="12" text-anchor="middle" fill="#66400f">feature, model, prompt</text>
    <text x="120" y="125" font-size="12" text-anchor="middle" fill="#66400f">version, hashed tenant</text>
    <line x1="220" y1="103" x2="258" y2="103" stroke="#40566b" stroke-width="1.6" marker-end="url(#pfc-arrow)"/>

    <rect x="260" y="60" width="160" height="86" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="340" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Provider response</text>
    <text x="340" y="108" font-size="12" text-anchor="middle" fill="#263e5a">usage object</text>
    <text x="340" y="125" font-size="12" text-anchor="middle" fill="#263e5a">tokens by class</text>
    <line x1="420" y1="103" x2="458" y2="103" stroke="#40566b" stroke-width="1.6" marker-end="url(#pfc-arrow)"/>

    <rect x="460" y="60" width="160" height="86" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="540" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">Normalize usage</text>
    <text x="540" y="108" font-size="12" text-anchor="middle" fill="#463365">uncached, cached,</text>
    <text x="540" y="125" font-size="12" text-anchor="middle" fill="#463365">writes, output</text>

    <rect x="680" y="60" width="180" height="86" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="770" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">Budget check</text>
    <text x="770" y="108" font-size="12" text-anchor="middle" fill="#463365">allow, smaller model,</text>
    <text x="770" y="125" font-size="12" text-anchor="middle" fill="#463365">or reject clearly</text>

    <line x1="540" y1="146" x2="540" y2="178" stroke="#40566b" stroke-width="1.6"/>
    <line x1="145" y1="178" x2="735" y2="178" stroke="#40566b" stroke-width="1.6"/>
    <line x1="145" y1="178" x2="145" y2="208" stroke="#40566b" stroke-width="1.6" marker-end="url(#pfc-arrow)"/>
    <line x1="440" y1="178" x2="440" y2="208" stroke="#40566b" stroke-width="1.6" marker-end="url(#pfc-arrow)"/>
    <line x1="735" y1="178" x2="735" y2="208" stroke="#40566b" stroke-width="1.6" marker-end="url(#pfc-arrow)"/>

    <rect x="20" y="210" width="250" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="145" y="236" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Prometheus counters</text>
    <text x="145" y="256" font-size="12" text-anchor="middle" fill="#263e5a">labels: feature, model, type</text>
    <text x="145" y="274" font-size="12" text-anchor="middle" fill="#263e5a">no tenant labels</text>

    <rect x="315" y="210" width="250" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="440" y="236" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Logs and trace attributes</text>
    <text x="440" y="256" font-size="12" text-anchor="middle" fill="#263e5a">gen_ai.usage.* attributes</text>
    <text x="440" y="274" font-size="12" text-anchor="middle" fill="#263e5a">ids only, no prompt text</text>

    <rect x="610" y="210" width="250" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="735" y="236" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Per-tenant usage store</text>
    <text x="735" y="256" font-size="12" text-anchor="middle" fill="#263e5a">daily totals in MongoDB</text>
    <text x="735" y="274" font-size="12" text-anchor="middle" fill="#263e5a">feeds quota checks</text>

    <line x1="800" y1="210" x2="800" y2="148" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pfc-arrow)"/>

    <line x1="145" y1="290" x2="145" y2="318" stroke="#40566b" stroke-width="1.6" marker-end="url(#pfc-arrow)"/>
    <rect x="20" y="320" width="250" height="62" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="145" y="345" font-size="13" font-weight="bold" text-anchor="middle" fill="#294a2e">Dashboards</text>
    <text x="145" y="365" font-size="12" text-anchor="middle" fill="#294a2e">cost per feature, per task</text>

    <text x="440" y="414" font-size="13" text-anchor="middle" fill="#40566b">One wrapper, low-cardinality metrics, and outcomes next to costs make spend explainable per feature.</text>
  </g>
</svg>
