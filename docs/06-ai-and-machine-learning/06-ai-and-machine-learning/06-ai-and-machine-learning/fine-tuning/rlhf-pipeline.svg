<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="rlp-title rlp-desc">
  <title id="rlp-title">The three stages of RLHF</title>
  <desc id="rlp-desc">Stage 1, supervised fine-tuning: a model is fine-tuned on demonstrations, prompts with written answers, producing the SFT model. Stage 2, reward model: labelers rank two answers to the same prompt, A better than B, and a reward model learns scores so that sigmoid of r(A) minus r(B) is high. Stage 3, reinforcement learning with PPO: the SFT model initializes both the policy and a frozen reference copy. The policy generates an answer, the reward model from stage 2 scores it, the reference model supplies a KL penalty, and a PPO update maximizes reward minus beta times KL, then updates the policy weights. A red note warns that without the KL penalty the policy learns to game the reward model, which is called reward hacking.</desc>
  <defs>
    <marker id="rlp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- stage 1 -->
    <text x="120" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#36424e">1. Supervised fine-tuning</text>
    <rect x="20" y="60" width="200" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="120" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Demonstrations</text>
    <text x="120" y="104" text-anchor="middle" font-size="11.5" fill="#66400f">prompt, written answer</text>
    <line x1="120" y1="120" x2="120" y2="158" stroke="#40566b" stroke-width="1.5" marker-end="url(#rlp-arrow)"/>
    <rect x="20" y="160" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="120" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">SFT model</text>

    <!-- stage 2 -->
    <text x="360" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#36424e">2. Reward model</text>
    <rect x="260" y="60" width="200" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="360" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Labelers rank answers</text>
    <text x="360" y="104" text-anchor="middle" font-size="11.5" fill="#66400f">A better than B</text>
    <line x1="360" y1="120" x2="360" y2="158" stroke="#40566b" stroke-width="1.5" marker-end="url(#rlp-arrow)"/>
    <rect x="260" y="160" width="200" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="360" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Reward model r</text>
    <text x="360" y="204" text-anchor="middle" font-size="11.5" fill="#463365">high sigmoid(r(A) - r(B))</text>

    <!-- stage 3 -->
    <text x="685" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#36424e">3. Reinforcement learning (PPO)</text>
    <rect x="520" y="70" width="140" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="590" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Policy</text>
    <text x="590" y="110" text-anchor="middle" font-size="11.5" fill="#263e5a">generates answers</text>
    <line x1="660" y1="95" x2="718" y2="95" stroke="#40566b" stroke-width="1.5" marker-end="url(#rlp-arrow)"/>
    <text x="689" y="87" text-anchor="middle" font-size="11.5" fill="#36424e">answer</text>
    <rect x="720" y="70" width="140" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="790" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Reward model</text>
    <text x="790" y="110" text-anchor="middle" font-size="11.5" fill="#463365">from stage 2</text>
    <rect x="720" y="160" width="140" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="790" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Reference</text>
    <text x="790" y="200" text-anchor="middle" font-size="11.5" fill="#263e5a">frozen SFT copy</text>
    <rect x="520" y="250" width="140" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="590" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">PPO update</text>
    <text x="590" y="292" text-anchor="middle" font-size="11.5" fill="#294a2e">reward - beta x KL</text>
    <path d="M790 120 V140 H690 V262 H662" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#rlp-arrow)"/>
    <text x="697" y="200" font-size="11.5" fill="#36424e">score</text>
    <path d="M790 210 V290 H662" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#rlp-arrow)"/>
    <text x="728" y="282" text-anchor="middle" font-size="11.5" fill="#36424e">KL penalty</text>
    <line x1="590" y1="250" x2="590" y2="122" stroke="#40566b" stroke-width="1.5" marker-end="url(#rlp-arrow)"/>
    <rect x="598" y="177" width="56" height="34" rx="4" fill="#f5f7fb"/>
    <text x="602" y="190" font-size="11.5" fill="#36424e">update</text>
    <text x="602" y="205" font-size="11.5" fill="#36424e">weights</text>

    <!-- SFT model initializes policy and reference -->
    <path d="M120 204 V330 H500 V95 H518" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#rlp-arrow)"/>
    <rect x="200" y="321" width="200" height="18" rx="4" fill="#f5f7fb"/>
    <text x="300" y="334" text-anchor="middle" font-size="11.5" fill="#36424e">initializes policy and reference</text>

    <!-- warning -->
    <rect x="20" y="352" width="840" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="440" y="375" text-anchor="middle" font-size="12.5" fill="#6e2a24">Without the KL penalty, the policy learns to game the reward model (reward hacking).</text>

    <text x="440" y="414" text-anchor="middle" font-size="13" fill="#40566b">RLHF turns cheap human rankings into a reward, then optimizes against it while staying near the SFT model.</text>
  </g>
</svg>
