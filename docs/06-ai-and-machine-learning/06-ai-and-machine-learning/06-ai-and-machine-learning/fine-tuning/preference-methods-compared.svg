<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="pmc-title pmc-desc">
  <title id="pmc-title">PPO-based RLHF, DPO, and GRPO compared</title>
  <desc id="pmc-desc">Three columns. PPO-based RLHF: data is prompts plus a reward model trained on rankings; models in memory are the policy, a reference, the reward model, and a value model; it trains online, sampling during training; watch out for complexity and reward hacking. DPO: data is preference pairs of prompt, chosen answer, and rejected answer; models are the policy and a reference, which is the initial policy when training a LoRA adapter; it trains offline with no sampling; watch out for length bias and pairs that came from a different model. GRPO with a verifiable reward: data is prompts plus a reward function in code; models are the policy, plus a reference only when beta is above zero; it trains online, sampling a group of answers per prompt; watch out for rewards that can be gamed. A footer says to start with SFT, add DPO or KTO for preferences, and use GRPO when quality can be checked by code.</desc>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- PPO RLHF -->
    <rect x="20" y="40" width="270" height="264" rx="8" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="20" y="40" width="270" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="155" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">PPO-based RLHF</text>
    <g font-size="11.5" fill="#36424e">
      <text x="34" y="100" font-size="12" font-weight="bold">Data</text>
      <text x="34" y="118">prompts + reward model from rankings</text>
      <text x="34" y="162" font-size="12" font-weight="bold">Models in memory</text>
      <text x="34" y="180">policy, reference, reward, value</text>
      <text x="34" y="224" font-size="12" font-weight="bold">Training</text>
      <text x="34" y="242">online: samples during training</text>
      <text x="34" y="270" font-size="12" font-weight="bold" fill="#6e2a24">Watch out for</text>
      <text x="34" y="288" fill="#6e2a24">complexity, reward hacking</text>
    </g>

    <!-- DPO -->
    <rect x="305" y="40" width="270" height="264" rx="8" fill="#ffffff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="305" y="40" width="270" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="440" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">DPO</text>
    <g font-size="11.5" fill="#36424e">
      <text x="319" y="100" font-size="12" font-weight="bold">Data</text>
      <text x="319" y="118">pairs: prompt, chosen, rejected</text>
      <text x="319" y="162" font-size="12" font-weight="bold">Models in memory</text>
      <text x="319" y="180">policy + reference (the initial</text>
      <text x="319" y="196">policy when training a LoRA adapter)</text>
      <text x="319" y="224" font-size="12" font-weight="bold">Training</text>
      <text x="319" y="242">offline: no sampling</text>
      <text x="319" y="270" font-size="12" font-weight="bold" fill="#6e2a24">Watch out for</text>
      <text x="319" y="288" fill="#6e2a24">length bias, off-policy pairs</text>
    </g>

    <!-- GRPO -->
    <rect x="590" y="40" width="270" height="264" rx="8" fill="#ffffff" stroke="#53845b" stroke-width="1.5"/>
    <rect x="590" y="40" width="270" height="36" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="725" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#294a2e">GRPO, verifiable reward</text>
    <g font-size="11.5" fill="#36424e">
      <text x="604" y="100" font-size="12" font-weight="bold">Data</text>
      <text x="604" y="118">prompts + reward function in code</text>
      <text x="604" y="162" font-size="12" font-weight="bold">Models in memory</text>
      <text x="604" y="180">policy (+ reference if beta &gt; 0)</text>
      <text x="604" y="224" font-size="12" font-weight="bold">Training</text>
      <text x="604" y="242">online: a group of answers per prompt</text>
      <text x="604" y="270" font-size="12" font-weight="bold" fill="#6e2a24">Watch out for</text>
      <text x="604" y="288" fill="#6e2a24">rewards that can be gamed</text>
    </g>

    <!-- footer -->
    <rect x="20" y="318" width="840" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="440" y="341" text-anchor="middle" font-size="12.5" fill="#66400f">Start with SFT; add DPO or KTO for preferences; use GRPO when quality can be checked by code.</text>

    <text x="440" y="382" text-anchor="middle" font-size="13" fill="#40566b">DPO drops the reward model and sampling; GRPO drops the value model but needs a strict verifier.</text>
  </g>
</svg>
