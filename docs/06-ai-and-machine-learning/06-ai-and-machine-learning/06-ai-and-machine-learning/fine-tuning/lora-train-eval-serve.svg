<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="ltes-title ltes-desc">
  <title id="ltes-title">Train, evaluate, and serve a LoRA adapter</title>
  <desc id="ltes-desc">Training data in train and validation JSONL files feeds SFTTrainer with a LoraConfig, which produces an adapter of about 84 megabytes. The adapter must pass three evaluation gates: task metrics on the test set, a general regression set, and safety and refusal cases. If it fails, a red arrow returns to training to adjust data or settings. If it passes, it goes to a vLLM server on one GPU that holds a single 16-bit base model shared by three adapters: taskflow-parser, meeting-summary, and parser-v2 as a canary. The TaskFlow API selects an adapter by putting its name in the model field of the request. A dashed alternative path merges the adapter into the base with merge_and_unload to create one standalone model.</desc>
  <defs>
    <marker id="ltes-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="ltes-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#b5524b"/></marker>
    <marker id="ltes-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- training -->
    <rect x="20" y="60" width="150" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="95" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Training data</text>
    <text x="95" y="104" text-anchor="middle" font-size="11.5" fill="#66400f">train + validation</text>
    <line x1="170" y1="90" x2="198" y2="90" stroke="#40566b" stroke-width="1.5" marker-end="url(#ltes-arrow)"/>
    <rect x="200" y="60" width="150" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="275" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">SFTTrainer</text>
    <text x="275" y="104" text-anchor="middle" font-size="11.5" fill="#463365">with LoraConfig</text>
    <line x1="350" y1="90" x2="378" y2="90" stroke="#40566b" stroke-width="1.5" marker-end="url(#ltes-arrow)"/>
    <rect x="380" y="65" width="120" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="440" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Adapter</text>
    <text x="440" y="104" text-anchor="middle" font-size="11.5" fill="#66400f">about 84 MB</text>
    <line x1="500" y1="90" x2="528" y2="104" stroke="#40566b" stroke-width="1.5" marker-end="url(#ltes-arrow)"/>

    <!-- merge alternative -->
    <line x1="440" y1="115" x2="440" y2="146" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ltes-arrow-dash)"/>
    <rect x="370" y="148" width="140" height="46" rx="8" fill="#ffffff" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="440" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#36424e">merge_and_unload</text>
    <text x="440" y="184" text-anchor="middle" font-size="11.5" fill="#36424e">standalone model</text>

    <!-- gates -->
    <text x="610" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#36424e">Evaluation gates</text>
    <rect x="530" y="40" width="160" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="610" y="65" text-anchor="middle" font-size="12" fill="#294a2e">Task metrics (test)</text>
    <rect x="530" y="88" width="160" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="610" y="113" text-anchor="middle" font-size="12" fill="#294a2e">General regression</text>
    <rect x="530" y="136" width="160" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="610" y="161" text-anchor="middle" font-size="12" fill="#294a2e">Safety and refusals</text>

    <!-- fail loop -->
    <path d="M610 176 V222 H275 V122" fill="none" stroke="#b5524b" stroke-width="1.5" marker-end="url(#ltes-arrow-red)"/>
    <rect x="335" y="213" width="210" height="18" rx="4" fill="#f5f7fb"/>
    <text x="440" y="226" text-anchor="middle" font-size="11.5" fill="#6e2a24">fails: adjust data or settings</text>

    <!-- pass to serving -->
    <path d="M690 108 H770 V248" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#ltes-arrow)"/>
    <text x="730" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#294a2e">pass</text>

    <!-- server -->
    <rect x="400" y="250" width="460" height="112" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="630" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">vLLM server, one GPU</text>
    <rect x="420" y="282" width="420" height="28" rx="6" fill="#ffffff" stroke="#4774aa" stroke-width="1.2"/>
    <text x="630" y="301" text-anchor="middle" font-size="12" fill="#263e5a">base model, 16-bit, loaded once and shared</text>
    <rect x="420" y="320" width="130" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.2"/>
    <text x="485" y="340" text-anchor="middle" font-size="11.5" fill="#66400f">taskflow-parser</text>
    <rect x="565" y="320" width="130" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.2"/>
    <text x="630" y="340" text-anchor="middle" font-size="11.5" fill="#66400f">meeting-summary</text>
    <rect x="710" y="320" width="130" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.2"/>
    <text x="775" y="340" text-anchor="middle" font-size="11.5" fill="#66400f">parser-v2, canary</text>

    <!-- client -->
    <rect x="160" y="282" width="190" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="255" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">TaskFlow API</text>
    <text x="255" y="323" text-anchor="middle" font-size="11.5" fill="#66400f">model: "taskflow-parser"</text>
    <line x1="350" y1="310" x2="398" y2="310" stroke="#40566b" stroke-width="1.5" marker-end="url(#ltes-arrow)"/>

    <text x="440" y="392" text-anchor="middle" font-size="13" fill="#40566b">Gate every adapter on evaluations, then serve many adapters over one shared base model.</text>
  </g>
</svg>
