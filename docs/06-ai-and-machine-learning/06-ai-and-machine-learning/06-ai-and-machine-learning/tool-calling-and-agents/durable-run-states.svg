<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="drs-title drs-desc">
  <title id="drs-title">States of a durable agent run</title>
  <desc id="drs-desc">A run document in MongoDB moves between states. A new run starts in running. After each step the worker saves a checkpoint with a new revision number, then continues. A step can pause the run in waiting for approval; the approval endpoint resumes it. The run ends in done after the last step, in failed when a step reports a failure that retrying cannot fix, or in stopped when a budget runs out. If a worker crashes mid-step, nothing is saved, and the next worker loads the last checkpoint and runs that step again, which is safe only because steps are idempotent.</desc>
  <defs>
    <marker id="drs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="150" width="130" height="56" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="105" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">New run</text>
    <text x="105" y="193" text-anchor="middle" font-size="12" fill="#36424e">step 0, rev 0</text>

    <rect x="290" y="150" width="170" height="56" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="375" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#263e5a">running</text>
    <text x="375" y="193" text-anchor="middle" font-size="12" fill="#36424e">worker runs next step</text>
    <line x1="170" y1="178" x2="288" y2="178" stroke="#40566b" stroke-width="1.6" marker-end="url(#drs-arrow)"/>

    <rect x="290" y="30" width="170" height="56" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="375" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#294a2e">Checkpoint</text>
    <text x="375" y="73" text-anchor="middle" font-size="12" fill="#36424e">save step, data, rev</text>
    <line x1="350" y1="148" x2="350" y2="88" stroke="#40566b" stroke-width="1.5" marker-end="url(#drs-arrow)"/>
    <line x1="400" y1="88" x2="400" y2="148" stroke="#40566b" stroke-width="1.5" marker-end="url(#drs-arrow)"/>
    <text x="250" y="124" text-anchor="middle" font-size="12" fill="#36424e">step finished</text>
    <text x="490" y="124" text-anchor="middle" font-size="12" fill="#36424e">continue</text>

    <rect x="590" y="30" width="250" height="56" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="715" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">waiting for approval</text>
    <text x="715" y="73" text-anchor="middle" font-size="12" fill="#36424e">no worker busy; can last days</text>
    <line x1="460" y1="160" x2="610" y2="88" stroke="#40566b" stroke-width="1.4" marker-end="url(#drs-arrow)"/>
    <line x1="660" y1="88" x2="466" y2="186" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#drs-arrow)"/>
    <rect x="566" y="120" width="96" height="20" rx="4" fill="#f5f7fb"/>
    <text x="614" y="134" text-anchor="middle" font-size="12" fill="#36424e">user resumes</text>

    <rect x="590" y="160" width="250" height="40" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="715" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#294a2e">done: last step saved</text>
    <rect x="590" y="214" width="250" height="40" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="715" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#6e2a24">failed: StepFailed</text>
    <rect x="590" y="268" width="250" height="40" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="715" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#6e2a24">stopped: budget used up</text>
    <line x1="460" y1="186" x2="588" y2="180" stroke="#40566b" stroke-width="1.4" marker-end="url(#drs-arrow)"/>
    <line x1="460" y1="196" x2="588" y2="234" stroke="#40566b" stroke-width="1.4" marker-end="url(#drs-arrow)"/>
    <line x1="440" y1="206" x2="588" y2="286" stroke="#40566b" stroke-width="1.4" marker-end="url(#drs-arrow)"/>

    <rect x="160" y="290" width="260" height="56" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="290" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#463365">Worker crash mid-step</text>
    <text x="290" y="333" text-anchor="middle" font-size="12" fill="#36424e">nothing saved for that step</text>
    <path d="M330 206 C330 250 300 260 300 288" fill="none" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#drs-arrow)"/>
    <path d="M200 288 C200 240 250 220 288 200" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#drs-arrow)"/>
    <rect x="58" y="238" width="160" height="20" rx="4" fill="#f5f7fb"/>
    <text x="138" y="252" text-anchor="middle" font-size="12" fill="#36424e">retry from checkpoint</text>

    <text x="440" y="384" text-anchor="middle" font-size="13" fill="#40566b">A step may run twice after a crash, so every step must be idempotent.</text>
  </g>
</svg>
