<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="oae-title oae-desc">
  <title id="oae-title">Orchestrator-workers and evaluator-optimizer</title>
  <desc id="oae-desc">Left: orchestrator-workers. A lead model reads a project goal and decides the subtasks at run time, here backend, frontend and QA. Each worker runs with its own context and budget and returns a short result. A final step merges the results into one draft plan. Right: evaluator-optimizer. A generator model writes a meeting summary, an evaluator checks it against a rubric and either passes it or returns feedback, and the generator revises. The loop stops on a pass or after two revisions.</desc>
  <defs>
    <marker id="oae-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="240" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#36424e">Orchestrator-workers</text>
    <text x="240" y="55" text-anchor="middle" font-size="12" fill="#40566b">plan a project from a goal</text>

    <rect x="125" y="70" width="230" height="56" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="240" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263e5a">Lead model</text>
    <text x="240" y="113" text-anchor="middle" font-size="12" fill="#36424e">picks subtasks at run time</text>

    <rect x="30" y="170" width="130" height="62" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="95" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#463365">Worker</text>
    <text x="95" y="216" text-anchor="middle" font-size="12" fill="#36424e">backend tasks</text>
    <rect x="175" y="170" width="130" height="62" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="240" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#463365">Worker</text>
    <text x="240" y="216" text-anchor="middle" font-size="12" fill="#36424e">frontend tasks</text>
    <rect x="320" y="170" width="130" height="62" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="385" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#463365">Worker</text>
    <text x="385" y="216" text-anchor="middle" font-size="12" fill="#36424e">QA tasks</text>
    <line x1="200" y1="126" x2="110" y2="168" stroke="#40566b" stroke-width="1.4" marker-end="url(#oae-arrow)"/>
    <line x1="240" y1="126" x2="240" y2="168" stroke="#40566b" stroke-width="1.4" marker-end="url(#oae-arrow)"/>
    <line x1="280" y1="126" x2="370" y2="168" stroke="#40566b" stroke-width="1.4" marker-end="url(#oae-arrow)"/>

    <rect x="125" y="280" width="230" height="56" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="240" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#294a2e">Merge</text>
    <text x="240" y="323" text-anchor="middle" font-size="12" fill="#36424e">one draft plan for review</text>
    <line x1="95" y1="232" x2="190" y2="278" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#oae-arrow)"/>
    <line x1="240" y1="262" x2="240" y2="278" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#oae-arrow)"/>
    <line x1="385" y1="232" x2="290" y2="278" stroke="#60788d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#oae-arrow)"/>
    <rect x="150" y="241" width="180" height="19" rx="4" fill="#f5f7fb"/>
    <text x="240" y="254" text-anchor="middle" font-size="12" fill="#40566b">own context and budget each</text>

    <line x1="480" y1="24" x2="480" y2="360" stroke="#c9d1db" stroke-width="1"/>

    <text x="680" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#36424e">Evaluator-optimizer</text>
    <text x="680" y="55" text-anchor="middle" font-size="12" fill="#40566b">a meeting summary</text>

    <rect x="565" y="70" width="230" height="56" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="680" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263e5a">Generator</text>
    <text x="680" y="113" text-anchor="middle" font-size="12" fill="#36424e">writes or revises the draft</text>

    <rect x="565" y="176" width="230" height="56" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="680" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#463365">Evaluator</text>
    <text x="680" y="219" text-anchor="middle" font-size="12" fill="#36424e">checks against a rubric</text>
    <line x1="660" y1="126" x2="660" y2="174" stroke="#40566b" stroke-width="1.6" marker-end="url(#oae-arrow)"/>
    <path d="M795 204 C850 204 850 98 797 98" fill="none" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#oae-arrow)"/>
    <rect x="806" y="140" width="56" height="22" rx="4" fill="#f5f7fb"/>
    <text x="834" y="155" text-anchor="middle" font-size="12" fill="#6e2a24">FAIL</text>

    <rect x="565" y="280" width="230" height="56" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="680" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#294a2e">Output</text>
    <text x="680" y="323" text-anchor="middle" font-size="12" fill="#36424e">PASS, or 2 revisions used</text>
    <line x1="680" y1="232" x2="680" y2="278" stroke="#40566b" stroke-width="1.6" marker-end="url(#oae-arrow)"/>

    <text x="440" y="398" text-anchor="middle" font-size="13" fill="#40566b">Both patterns cost several model calls per request; cap them with budgets.</text>
  </g>
</svg>
