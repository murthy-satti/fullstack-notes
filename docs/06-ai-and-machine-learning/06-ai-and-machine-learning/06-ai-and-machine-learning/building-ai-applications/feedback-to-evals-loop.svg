<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="fel-title fel-desc">
  <title id="fel-title">From thumbs up and down to evaluation sets</title>
  <desc id="fel-desc">A user rates an assistant message as helpful or not helpful, with optional reasons. The browser sends PUT to the feedback endpoint, which keeps one vote per user per message. The feedback collection stores the vote together with the model, prompt version, and trace ID copied from the stored message on the server. Implicit signals such as copy, regenerate, stop, and edit-and-resend are recorded alongside. A dashboard shows the not-helpful rate by model and prompt version. A sample of not-helpful votes goes to a review queue where people label why the answer failed and remove personal data. Reviewed cases become versioned eval set entries with an input and the expected behavior. A CI eval run blocks prompt or model changes that regress, and the fix ships back to the assistant.</desc>
  <defs>
    <marker id="fel-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="fel-arrow-async" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="860" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">From thumbs up and down to evaluation sets</text>

    <rect x="30" y="66" width="160" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="110" y="90" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Assistant message</text>
    <text x="110" y="110" font-size="11" fill="#66400f" text-anchor="middle">Helpful, Not helpful,</text>
    <text x="110" y="126" font-size="11" fill="#66400f" text-anchor="middle">optional reasons</text>
    <line x1="190" y1="106" x2="228" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#fel-arrow)"/>
    <rect x="230" y="66" width="180" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="320" y="90" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">PUT /api/feedback</text>
    <text x="320" y="110" font-size="11" fill="#263e5a" text-anchor="middle">one vote per user</text>
    <text x="320" y="126" font-size="11" fill="#263e5a" text-anchor="middle">per message</text>
    <line x1="410" y1="106" x2="448" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#fel-arrow)"/>
    <rect x="450" y="66" width="180" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="540" y="90" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">feedback collection</text>
    <text x="540" y="110" font-size="11" fill="#263e5a" text-anchor="middle">server adds model,</text>
    <text x="540" y="126" font-size="11" fill="#263e5a" text-anchor="middle">prompt version, trace ID</text>
    <line x1="630" y1="106" x2="668" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#fel-arrow)"/>
    <rect x="670" y="66" width="160" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="750" y="90" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Dashboard</text>
    <text x="750" y="110" font-size="11" fill="#463365" text-anchor="middle">Not helpful rate by</text>
    <text x="750" y="126" font-size="11" fill="#463365" text-anchor="middle">model and prompt</text>

    <line x1="540" y1="146" x2="540" y2="216" stroke="#40566b" stroke-width="1.6" marker-end="url(#fel-arrow)"/>
    <text x="532" y="186" font-size="11.5" fill="#36424e" text-anchor="end">sample of Not helpful</text>
    <rect x="670" y="218" width="160" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="750" y="242" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Implicit signals</text>
    <text x="750" y="262" font-size="11" fill="#66400f" text-anchor="middle">copy, regenerate,</text>
    <text x="750" y="278" font-size="11" fill="#66400f" text-anchor="middle">stop, edit and resend</text>
    <line x1="690" y1="218" x2="634" y2="148" stroke="#60788d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#fel-arrow-async)"/>

    <rect x="450" y="218" width="180" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="540" y="242" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Review queue</text>
    <text x="540" y="262" font-size="11" fill="#463365" text-anchor="middle">people label why it</text>
    <text x="540" y="278" font-size="11" fill="#463365" text-anchor="middle">failed; remove PII</text>
    <line x1="450" y1="258" x2="412" y2="258" stroke="#40566b" stroke-width="1.6" marker-end="url(#fel-arrow)"/>
    <rect x="230" y="218" width="180" height="80" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="320" y="242" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">Eval set</text>
    <text x="320" y="262" font-size="11" fill="#294a2e" text-anchor="middle">input and expected</text>
    <text x="320" y="278" font-size="11" fill="#294a2e" text-anchor="middle">behavior, versioned</text>
    <line x1="230" y1="258" x2="192" y2="258" stroke="#40566b" stroke-width="1.6" marker-end="url(#fel-arrow)"/>
    <rect x="30" y="218" width="160" height="80" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="110" y="242" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">CI eval run</text>
    <text x="110" y="262" font-size="11" fill="#294a2e" text-anchor="middle">blocks changes</text>
    <text x="110" y="278" font-size="11" fill="#294a2e" text-anchor="middle">that regress</text>
    <line x1="110" y1="218" x2="110" y2="148" stroke="#40566b" stroke-width="1.6" marker-end="url(#fel-arrow)"/>
    <text x="118" y="188" font-size="11.5" fill="#36424e">ship the fix</text>

    <text x="30" y="332" font-size="13" fill="#40566b">A vote is only useful when it is tied to the exact model, prompt, and trace that produced the answer.</text>
  </g>
</svg>
