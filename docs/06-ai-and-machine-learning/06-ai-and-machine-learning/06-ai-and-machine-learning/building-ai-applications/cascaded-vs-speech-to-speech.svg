<svg xmlns="http://www.w3.org/2000/svg" width="860" height="376" viewBox="0 0 860 376" role="img" aria-labelledby="cvs-title cvs-desc">
  <title id="cvs-title">Cascaded voice pipeline compared with speech-to-speech</title>
  <desc id="cvs-desc">Top: a cascaded pipeline. Microphone audio goes to turn detection, then speech to text, then a text model that can call tools, then text to speech, then the speaker. You choose each component and get text in the middle to log, moderate, and test, but every hop adds latency and the tone of the user's voice is lost. Bottom: speech-to-speech. Microphone audio goes to one realtime model that takes audio in and produces audio out, with turn detection, tools, and interruption handling built in, then to the speaker. It has the lowest latency and natural prosody, but audio tokens cost more than text, there is less choice of components, and behavior is harder to inspect.</desc>
  <defs>
    <marker id="cvs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="376" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Two ways to build a voice assistant</text>

    <text x="30" y="64" font-size="12.5" font-weight="bold" fill="#36424e">Cascaded: speech to text, a text model, text to speech</text>
    <rect x="30" y="76" width="90" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="75" y="111" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Mic</text>
    <line x1="120" y1="106" x2="144" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#cvs-arrow)"/>
    <rect x="146" y="76" width="120" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="206" y="102" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Turn</text>
    <text x="206" y="120" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">detection</text>
    <line x1="266" y1="106" x2="290" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#cvs-arrow)"/>
    <rect x="292" y="76" width="110" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="347" y="102" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Speech</text>
    <text x="347" y="120" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">to text</text>
    <line x1="402" y1="106" x2="426" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#cvs-arrow)"/>
    <rect x="428" y="76" width="120" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="488" y="102" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Text model</text>
    <text x="488" y="120" font-size="11" fill="#263e5a" text-anchor="middle">tool calls</text>
    <line x1="548" y1="106" x2="572" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#cvs-arrow)"/>
    <rect x="574" y="76" width="110" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="629" y="102" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Text to</text>
    <text x="629" y="120" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">speech</text>
    <line x1="684" y1="106" x2="708" y2="106" stroke="#40566b" stroke-width="1.6" marker-end="url(#cvs-arrow)"/>
    <rect x="710" y="76" width="120" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="770" y="111" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Speaker</text>
    <text x="30" y="160" font-size="11.5" fill="#294a2e">+ choose each component; text in the middle to log, moderate, and test</text>
    <text x="30" y="178" font-size="11.5" fill="#6e2a24">- every hop adds latency; the tone of the user's voice is lost in the transcript</text>

    <text x="30" y="216" font-size="12.5" font-weight="bold" fill="#36424e">Speech-to-speech: one realtime model</text>
    <rect x="30" y="228" width="90" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="75" y="263" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Mic</text>
    <line x1="120" y1="258" x2="144" y2="258" stroke="#40566b" stroke-width="1.6" marker-end="url(#cvs-arrow)"/>
    <rect x="146" y="228" width="538" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="415" y="254" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Realtime speech model</text>
    <text x="415" y="273" font-size="11.5" fill="#463365" text-anchor="middle">audio in and out; turn detection, tools, interruptions built in</text>
    <line x1="684" y1="258" x2="708" y2="258" stroke="#40566b" stroke-width="1.6" marker-end="url(#cvs-arrow)"/>
    <rect x="710" y="228" width="120" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="770" y="263" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Speaker</text>
    <text x="30" y="312" font-size="11.5" fill="#294a2e">+ lowest latency, natural prosody, interruptions handled by the model</text>
    <text x="30" y="330" font-size="11.5" fill="#6e2a24">- audio tokens cost more than text; fewer component choices; harder to inspect and moderate</text>

    <text x="30" y="362" font-size="13" fill="#40566b">Cascaded buys control and choice; speech-to-speech buys speed and naturalness.</text>
  </g>
</svg>
