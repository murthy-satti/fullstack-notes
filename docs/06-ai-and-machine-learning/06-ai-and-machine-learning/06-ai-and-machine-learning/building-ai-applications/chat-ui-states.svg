<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="cus-title cus-desc">
  <title id="cus-title">States of one chat turn in the UI</title>
  <desc id="cus-desc">A chat turn starts idle. Send moves it to submitted, where the user's message is already shown and the app waits for the first token. The first token moves it to streaming, and the done event moves it to complete. From submitted or streaming, a failed request or a dropped stream moves it to error. During streaming, Stop or the Escape key aborts the request and moves it to stopped, keeping the partial text. From complete, stopped, or error, the user can regenerate or retry, which sends a new request that replaces the last answer and returns the turn to submitted; a retry after an error keeps the user's message.</desc>
  <defs>
    <marker id="cus-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="cus-arrow-async" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="860" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">One chat turn in the UI: states and the controls between them</text>

    <path d="M830 260 H846 V70 H295 V92" fill="none" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#cus-arrow-async)"/>
    <rect x="440" y="60" width="260" height="20" rx="4" fill="#f5f7fb"/>
    <text x="570" y="74" font-size="11.5" fill="#36424e" text-anchor="middle">new request replaces the last answer</text>

    <rect x="30" y="96" width="120" height="48" rx="24" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="90" y="125" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">idle</text>
    <rect x="220" y="96" width="150" height="48" rx="24" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="295" y="125" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">submitted</text>
    <rect x="450" y="96" width="150" height="48" rx="24" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="525" y="125" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">streaming</text>
    <rect x="690" y="96" width="140" height="48" rx="24" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="760" y="125" font-size="14" font-weight="bold" fill="#294a2e" text-anchor="middle">complete</text>

    <line x1="150" y1="120" x2="218" y2="120" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <text x="184" y="139" font-size="11" fill="#36424e" text-anchor="middle">Send</text>
    <line x1="370" y1="120" x2="448" y2="120" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <text x="409" y="139" font-size="11" fill="#36424e" text-anchor="middle">first token</text>
    <line x1="600" y1="120" x2="688" y2="120" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <text x="644" y="139" font-size="11" fill="#36424e" text-anchor="middle">done event</text>

    <line x1="295" y1="144" x2="295" y2="234" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <rect x="210" y="178" width="170" height="20" rx="4" fill="#f5f7fb"/>
    <text x="295" y="192" font-size="11.5" fill="#36424e" text-anchor="middle">request or stream fails</text>
    <line x1="470" y1="144" x2="362" y2="234" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <line x1="525" y1="144" x2="525" y2="234" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <rect x="462" y="172" width="126" height="36" rx="4" fill="#f5f7fb"/>
    <text x="525" y="186" font-size="11.5" fill="#36424e" text-anchor="middle">Stop or Esc:</text>
    <text x="525" y="201" font-size="11.5" fill="#36424e" text-anchor="middle">abort, keep text</text>
    <line x1="760" y1="144" x2="760" y2="234" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <text x="750" y="194" font-size="11.5" fill="#36424e" text-anchor="end">Regenerate</text>

    <rect x="220" y="236" width="150" height="48" rx="24" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="295" y="265" font-size="14" font-weight="bold" fill="#6e2a24" text-anchor="middle">error</text>
    <rect x="450" y="236" width="150" height="48" rx="24" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="525" y="265" font-size="14" font-weight="bold" fill="#66400f" text-anchor="middle">stopped</text>
    <rect x="690" y="236" width="140" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="760" y="256" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Regenerate</text>
    <text x="760" y="274" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">or Retry</text>
    <line x1="600" y1="260" x2="688" y2="260" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <path d="M295 284 V312 H760 V288" fill="none" stroke="#40566b" stroke-width="1.6" marker-end="url(#cus-arrow)"/>
    <rect x="410" y="303" width="234" height="20" rx="4" fill="#f5f7fb"/>
    <text x="527" y="317" font-size="11.5" fill="#36424e" text-anchor="middle">Retry keeps the user's message</text>

    <text x="30" y="354" font-size="13" fill="#40566b">Every state has a visible control: Stop while busy, Regenerate or Retry when done, and no lost input.</text>
  </g>
</svg>
