<svg xmlns="http://www.w3.org/2000/svg" width="860" height="436" viewBox="0 0 860 436" role="img" aria-labelledby="fwd-title fwd-desc">
  <title id="fwd-title">Choosing an SDK or framework for a TypeScript app</title>
  <desc id="fwd-desc">A ladder of four questions. First: is this one provider and a few model calls? If yes, use the official provider SDK. If no: is it a React chat UI, or do you need several providers in TypeScript? If yes, use the Vercel AI SDK, with AI SDK Core and useChat. If no: is it a long-running agent that must resume or wait for human approval? If yes, use LangGraph, or Mastra or the OpenAI Agents SDK. If no: is retrieval over many document types the core of the product? If yes, use LlamaIndex, whose Python package is the most active. If none apply, the default is the provider SDK behind your own interface, adopting a framework only when a concrete need appears.</desc>
  <defs>
    <marker id="fwd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="436" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Choosing an SDK or framework (TypeScript backend)</text>

    <rect x="30" y="56" width="400" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="230" y="86" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">One provider and a few model calls?</text>
    <rect x="30" y="140" width="400" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="230" y="170" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">React chat UI, or many providers in TS?</text>
    <rect x="30" y="224" width="400" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="230" y="254" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Long-running agent with resume or approvals?</text>
    <rect x="30" y="308" width="400" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="230" y="338" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Retrieval over many document types is the core?</text>

    <line x1="230" y1="106" x2="230" y2="138" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>
    <text x="240" y="127" font-size="11.5" fill="#36424e">no</text>
    <line x1="230" y1="190" x2="230" y2="222" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>
    <text x="240" y="211" font-size="11.5" fill="#36424e">no</text>
    <line x1="230" y1="274" x2="230" y2="306" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>
    <text x="240" y="295" font-size="11.5" fill="#36424e">no</text>
    <line x1="230" y1="358" x2="230" y2="374" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>

    <line x1="430" y1="81" x2="518" y2="81" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>
    <text x="474" y="74" font-size="11.5" fill="#36424e" text-anchor="middle">yes</text>
    <line x1="430" y1="165" x2="518" y2="165" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>
    <text x="474" y="158" font-size="11.5" fill="#36424e" text-anchor="middle">yes</text>
    <line x1="430" y1="249" x2="518" y2="249" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>
    <text x="474" y="242" font-size="11.5" fill="#36424e" text-anchor="middle">yes</text>
    <line x1="430" y1="333" x2="518" y2="333" stroke="#40566b" stroke-width="1.6" marker-end="url(#fwd-arrow)"/>
    <text x="474" y="326" font-size="11.5" fill="#36424e" text-anchor="middle">yes</text>

    <rect x="520" y="56" width="310" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="675" y="76" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">Official provider SDK</text>
    <text x="675" y="95" font-size="11" fill="#294a2e" text-anchor="middle">openai, @anthropic-ai/sdk, @google/genai</text>
    <rect x="520" y="140" width="310" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="675" y="160" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">Vercel AI SDK</text>
    <text x="675" y="179" font-size="11" fill="#294a2e" text-anchor="middle">AI SDK Core on the server, useChat in React</text>
    <rect x="520" y="224" width="310" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="675" y="244" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">LangGraph</text>
    <text x="675" y="263" font-size="11" fill="#294a2e" text-anchor="middle">or Mastra, or the OpenAI Agents SDK</text>
    <rect x="520" y="308" width="310" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="675" y="328" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">LlamaIndex</text>
    <text x="675" y="347" font-size="11" fill="#294a2e" text-anchor="middle">the Python package is the most active</text>

    <rect x="30" y="376" width="800" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="430" y="398" font-size="12" fill="#263e5a" text-anchor="middle">None of these: the provider SDK behind your own interface; adopt a framework when a concrete need appears.</text>

    <text x="30" y="428" font-size="13" fill="#40566b">Pick the lowest layer that covers today's need; the interface keeps tomorrow's switch cheap.</text>
  </g>
</svg>
