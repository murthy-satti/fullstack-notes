<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="tel-title tel-desc">
  <title id="tel-title">Two generic ways to connect phone calls to a voice model</title>
  <desc id="tel-desc">A caller on the public phone network dials a number held at a telephony provider, which offers a call control API and webhooks. Option A, media streaming: the provider streams the call's audio frames over a WebSocket to your voice server, which bridges them to a realtime model API over another WebSocket and handles tools, transfers, and logging. Option B, SIP: the provider routes the call over a SIP trunk directly to a realtime API that accepts SIP; that API sends a webhook to your server, which accepts the call, configures the session, and controls it. Either way the application must handle transfer to a person, keypad input, recording and AI disclosure notices, hang-up, and never route emergency calls to the bot.</desc>
  <defs>
    <marker id="tel-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="tel-arrow-async" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Connecting phone calls to a voice model (generic)</text>

    <rect x="30" y="170" width="140" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="100" y="196" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Caller</text>
    <text x="100" y="215" font-size="11" fill="#66400f" text-anchor="middle">phone network</text>
    <line x1="170" y1="202" x2="208" y2="202" stroke="#40566b" stroke-width="1.6" marker-end="url(#tel-arrow)"/>
    <rect x="210" y="146" width="180" height="112" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="300" y="172" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Telephony provider</text>
    <text x="300" y="194" font-size="11" fill="#463365" text-anchor="middle">phone numbers, carriers</text>
    <text x="300" y="212" font-size="11" fill="#463365" text-anchor="middle">call control API</text>
    <text x="300" y="230" font-size="11" fill="#463365" text-anchor="middle">webhooks for call events</text>

    <text x="440" y="62" font-size="12" font-weight="bold" fill="#36424e">A: media streaming</text>
    <path d="M390 170 V110 H448" fill="none" stroke="#40566b" stroke-width="1.6" marker-end="url(#tel-arrow)"/>
    <rect x="398" y="82" width="46" height="18" rx="3" fill="#f5f7fb"/>
    <text x="421" y="95" font-size="10.5" fill="#36424e" text-anchor="middle">WS</text>
    <rect x="450" y="74" width="190" height="72" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="545" y="98" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Your voice server</text>
    <text x="545" y="117" font-size="11" fill="#263e5a" text-anchor="middle">bridges audio frames,</text>
    <text x="545" y="133" font-size="11" fill="#263e5a" text-anchor="middle">tools, transfers, logging</text>
    <line x1="640" y1="110" x2="688" y2="110" stroke="#40566b" stroke-width="1.6" marker-end="url(#tel-arrow)"/>
    <rect x="690" y="74" width="140" height="72" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="760" y="98" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Realtime API</text>
    <text x="760" y="117" font-size="11" fill="#263e5a" text-anchor="middle">over WebSocket</text>
    <text x="760" y="133" font-size="11" fill="#263e5a" text-anchor="middle">8 kHz phone audio</text>

    <text x="440" y="270" font-size="12" font-weight="bold" fill="#36424e">B: SIP to the model provider</text>
    <path d="M390 234 V316 H688" fill="none" stroke="#40566b" stroke-width="1.6" marker-end="url(#tel-arrow)"/>
    <rect x="452" y="306" width="72" height="18" rx="3" fill="#f5f7fb"/>
    <text x="488" y="319" font-size="10.5" fill="#36424e" text-anchor="middle">SIP trunk</text>
    <rect x="690" y="280" width="140" height="72" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="760" y="304" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Realtime API</text>
    <text x="760" y="323" font-size="11" fill="#263e5a" text-anchor="middle">accepts SIP calls</text>
    <rect x="470" y="190" width="170" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="555" y="214" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Your server</text>
    <text x="555" y="233" font-size="11" fill="#263e5a" text-anchor="middle">accepts and controls</text>
    <path d="M760 280 V220 H643" fill="none" stroke="#60788d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tel-arrow-async)"/>
    <text x="768" y="252" font-size="10.5" fill="#36424e">webhook</text>

    <rect x="30" y="366" width="800" height="28" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.2"/>
    <text x="430" y="385" font-size="11.5" fill="#6e2a24" text-anchor="middle">Always: transfer to a person, keypad input, recording and AI notices, hang-up; no emergency calls to a bot.</text>

    <text x="30" y="410" font-size="13" fill="#40566b">Media streaming gives you every audio frame; SIP hands the call to the model provider and you steer it.</text>
  </g>
</svg>
