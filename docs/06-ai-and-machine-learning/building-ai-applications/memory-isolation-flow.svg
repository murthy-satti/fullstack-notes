<svg xmlns="http://www.w3.org/2000/svg" width="860" height="428" viewBox="0 0 860 428" role="img" aria-labelledby="mif-title mif-desc">
  <title id="mif-title">Long-term memory write and read paths with per-user isolation</title>
  <desc id="mif-desc">Write path, after a turn: the finished turn, meaning the user message and the reply, goes to a small model that extracts memory candidates as structured output; a policy filter drops secrets and sensitive data and removes duplicates; accepted memories are stored in the memories collection with userId, workspaceId, text, embedding, and the source turn, and users can review, edit, and delete each memory. Read path, before a turn: a new message from TaskFlow Web arrives, the auth session supplies userId and workspaceId from the verified token, a vector search pre-filters on userId and workspaceId and returns matching facts from the memories collection, and the top five facts are added to the prompt instructions labeled as data, not instructions. Two rules apply: never let the model or the request body choose userId, so a prompt asking for another user's memories cannot change the filter; and deleting a user or a chat also deletes their memories and summaries.</desc>
  <defs>
    <marker id="mif-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="428" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Long-term memory: vetted writes, owner-filtered reads</text>

    <text x="30" y="64" font-size="12" font-weight="bold" fill="#36424e">Write path (after a turn)</text>
    <rect x="30" y="76" width="150" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="105" y="104" font-size="14" font-weight="bold" fill="#66400f" text-anchor="middle">Finished turn</text>
    <text x="105" y="124" font-size="11.5" fill="#66400f" text-anchor="middle">message and reply</text>
    <line x1="180" y1="111" x2="204" y2="111" stroke="#40566b" stroke-width="1.6" marker-end="url(#mif-arrow)"/>
    <rect x="206" y="76" width="176" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="294" y="98" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Extract candidates</text>
    <text x="294" y="118" font-size="11.5" fill="#463365" text-anchor="middle">structured output</text>
    <text x="294" y="134" font-size="11.5" fill="#463365" text-anchor="middle">from a small model</text>
    <line x1="382" y1="111" x2="406" y2="111" stroke="#40566b" stroke-width="1.6" marker-end="url(#mif-arrow)"/>
    <rect x="408" y="76" width="176" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="496" y="98" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Policy filter</text>
    <text x="496" y="118" font-size="11.5" fill="#463365" text-anchor="middle">drop secrets and</text>
    <text x="496" y="134" font-size="11.5" fill="#463365" text-anchor="middle">sensitive data; dedupe</text>
    <line x1="584" y1="111" x2="608" y2="111" stroke="#40566b" stroke-width="1.6" marker-end="url(#mif-arrow)"/>
    <rect x="610" y="76" width="220" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="720" y="98" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">memories collection</text>
    <text x="720" y="118" font-size="11.5" fill="#263e5a" text-anchor="middle">userId, workspaceId, text,</text>
    <text x="720" y="134" font-size="11.5" fill="#263e5a" text-anchor="middle">embedding, source turn</text>
    <text x="830" y="164" font-size="11" fill="#36424e" text-anchor="end">users can review, edit,</text>
    <text x="830" y="178" font-size="11" fill="#36424e" text-anchor="end">and delete each memory</text>

    <line x1="650" y1="146" x2="524" y2="211" stroke="#40566b" stroke-width="1.6" marker-end="url(#mif-arrow)"/>
    <rect x="536" y="170" width="106" height="20" rx="4" fill="#f5f7fb"/>
    <text x="589" y="184" font-size="11.5" fill="#36424e" text-anchor="middle">matching facts</text>

    <text x="30" y="204" font-size="12" font-weight="bold" fill="#36424e">Read path (before a turn)</text>
    <rect x="30" y="214" width="150" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="105" y="242" font-size="14" font-weight="bold" fill="#66400f" text-anchor="middle">New message</text>
    <text x="105" y="262" font-size="11.5" fill="#66400f" text-anchor="middle">from TaskFlow Web</text>
    <line x1="180" y1="249" x2="204" y2="249" stroke="#40566b" stroke-width="1.6" marker-end="url(#mif-arrow)"/>
    <rect x="206" y="214" width="176" height="70" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="294" y="236" font-size="14" font-weight="bold" fill="#294a2e" text-anchor="middle">Auth session</text>
    <text x="294" y="256" font-size="11.5" fill="#294a2e" text-anchor="middle">userId, workspaceId</text>
    <text x="294" y="272" font-size="11.5" fill="#294a2e" text-anchor="middle">from the verified token</text>
    <line x1="382" y1="249" x2="406" y2="249" stroke="#40566b" stroke-width="1.6" marker-end="url(#mif-arrow)"/>
    <rect x="408" y="214" width="176" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="496" y="236" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">Vector search</text>
    <text x="496" y="256" font-size="11.5" fill="#263e5a" text-anchor="middle">pre-filter on userId</text>
    <text x="496" y="272" font-size="11.5" fill="#263e5a" text-anchor="middle">and workspaceId</text>
    <line x1="584" y1="249" x2="608" y2="249" stroke="#40566b" stroke-width="1.6" marker-end="url(#mif-arrow)"/>
    <rect x="610" y="214" width="220" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="720" y="236" font-size="14" font-weight="bold" fill="#463365" text-anchor="middle">Prompt instructions</text>
    <text x="720" y="256" font-size="11.5" fill="#463365" text-anchor="middle">top 5 facts, labeled</text>
    <text x="720" y="272" font-size="11.5" fill="#463365" text-anchor="middle">as data, not instructions</text>

    <rect x="30" y="312" width="500" height="68" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="280" y="338" font-size="13" font-weight="bold" fill="#6e2a24" text-anchor="middle">Never let the model or the request body choose userId</text>
    <text x="280" y="360" font-size="11.5" fill="#6e2a24" text-anchor="middle">"show the memories of user 42" in a prompt must not change the filter</text>
    <rect x="556" y="312" width="274" height="68" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="693" y="334" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">Deletion cascades</text>
    <text x="693" y="352" font-size="11.5" fill="#263e5a" text-anchor="middle">deleting a user or chat also</text>
    <text x="693" y="368" font-size="11.5" fill="#263e5a" text-anchor="middle">deletes memories and summaries</text>

    <text x="30" y="414" font-size="13" fill="#40566b">Memories are written only after a policy check and read only through a server-side owner filter.</text>
  </g>
</svg>
