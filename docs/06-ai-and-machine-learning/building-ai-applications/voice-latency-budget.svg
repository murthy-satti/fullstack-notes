<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="vlb-title vlb-desc">
  <title id="vlb-title">Example latency budget for a voice reply</title>
  <desc id="vlb-desc">An example budget measured from the moment the user stops talking, with illustrative values. Cascaded pipeline: waiting for the end of the turn takes 500 milliseconds, the final speech-to-text result 150, the text model's first token 350, text to speech first audio 150, and network plus playout buffering 100, for about 1.25 seconds before the user hears a reply. Speech-to-speech: the same 500 millisecond end-of-turn wait, 300 milliseconds to the model's first audio, and 100 for network and playout, about 0.9 seconds. The end-of-turn wait is the largest single item in both.</desc>
  <rect width="860" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Where the time goes before the user hears a reply</text>
    <text x="30" y="52" font-size="12" fill="#36424e">Example budget from the moment the user stops talking (illustrative values: measure your own)</text>

    <g stroke="#c9d1db" stroke-width="1">
      <line x1="200" y1="76" x2="200" y2="380"/>
      <line x1="290" y1="76" x2="290" y2="380"/>
      <line x1="380" y1="76" x2="380" y2="380"/>
      <line x1="470" y1="76" x2="470" y2="380"/>
      <line x1="560" y1="76" x2="560" y2="380"/>
      <line x1="650" y1="76" x2="650" y2="380"/>
      <line x1="740" y1="76" x2="740" y2="380"/>
      <line x1="830" y1="76" x2="830" y2="380"/>
    </g>

    <text x="30" y="88" font-size="12.5" font-weight="bold" fill="#36424e">Cascaded</text>
    <text x="30" y="110" font-size="11.5" fill="#36424e">End-of-turn wait</text>
    <rect x="200" y="96" width="225" height="20" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="312" y="110" font-size="11" fill="#463365" text-anchor="middle">500 ms</text>
    <text x="30" y="138" font-size="11.5" fill="#36424e">Speech to text, final</text>
    <rect x="425" y="124" width="67.5" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="458" y="138" font-size="11" fill="#263e5a" text-anchor="middle">150</text>
    <text x="30" y="166" font-size="11.5" fill="#36424e">Model first token</text>
    <rect x="492.5" y="152" width="157.5" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="571" y="166" font-size="11" fill="#263e5a" text-anchor="middle">350 ms</text>
    <text x="30" y="194" font-size="11.5" fill="#36424e">Speech first audio</text>
    <rect x="650" y="180" width="67.5" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="684" y="194" font-size="11" fill="#263e5a" text-anchor="middle">150</text>
    <text x="30" y="222" font-size="11.5" fill="#36424e">Network and playout</text>
    <rect x="717.5" y="208" width="45" height="20" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
    <text x="740" y="222" font-size="11" fill="#36424e" text-anchor="middle">100</text>
    <rect x="548" y="236" width="232" height="22" rx="4" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="664" y="251" font-size="11.5" font-weight="bold" fill="#6e2a24" text-anchor="middle">reply heard after about 1.25 s</text>

    <text x="30" y="290" font-size="12.5" font-weight="bold" fill="#36424e">Speech-to-speech</text>
    <text x="30" y="312" font-size="11.5" fill="#36424e">End-of-turn wait</text>
    <rect x="200" y="298" width="225" height="20" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="312" y="312" font-size="11" fill="#463365" text-anchor="middle">500 ms</text>
    <text x="30" y="340" font-size="11.5" fill="#36424e">Model first audio</text>
    <rect x="425" y="326" width="135" height="20" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="492" y="340" font-size="11" fill="#263e5a" text-anchor="middle">300 ms</text>
    <text x="30" y="368" font-size="11.5" fill="#36424e">Network and playout</text>
    <rect x="560" y="354" width="45" height="20" rx="4" fill="#eef1f5" stroke="#8a96a3"/>
    <text x="582" y="368" font-size="11" fill="#36424e" text-anchor="middle">100</text>
    <rect x="610" y="354" width="222" height="22" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    <text x="721" y="369" font-size="11.5" font-weight="bold" fill="#294a2e" text-anchor="middle">reply heard after about 0.9 s</text>

    <line x1="200" y1="384" x2="830" y2="384" stroke="#8a96a3" stroke-width="1.4"/>
    <g font-size="11" fill="#36424e" text-anchor="middle">
      <text x="200" y="400">0</text>
      <text x="290" y="400">200</text>
      <text x="380" y="400">400</text>
      <text x="470" y="400">600</text>
      <text x="560" y="400">800</text>
      <text x="650" y="400">1,000</text>
      <text x="740" y="400">1,200</text><text x="30" y="400" text-anchor="start">milliseconds</text>
      <text x="830" y="400">1,400</text>
    </g>

    <text x="30" y="428" font-size="13" fill="#40566b">The end-of-turn wait is the biggest item: tune turn detection before buying faster models.</text>
  </g>
</svg>
