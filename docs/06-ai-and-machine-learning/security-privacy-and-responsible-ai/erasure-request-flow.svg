<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="erf-title erf-desc">
  <title id="erf-title">Handling a request to erase a user's AI data</title>
  <desc id="erf-desc">Five steps from left to right. One: the erasure request for a user arrives and is recorded. Two: delete the source data, such as the user's notes and tasks in the database. Three: delete derived data: vector chunks by source id, cached answers, and evaluation and feedback rows. Four: delete provider objects such as stored responses, files and vector stores through the provider's API, where a not-found answer counts as done and failures are retried, because the job is idempotent. Five: copies with a fixed time to live expire on their own: app logs after 30 days, provider abuse logs after up to 30 days, and backups after 35 days, so the longest time to live sets the date when no copy is left; the request is then marked complete in an audit record that holds no content. Two notes below: backups expire on their own schedule, and a restore must re-apply recorded deletions; fine-tuned weights cannot forget one user, so keep personal data out of training sets. Caption: deletion is a job with an inventory, retries, and a finish date, not a single query.</desc>
  <defs>
    <marker id="erf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Erasing one user's AI data: an inventory, retries, and a finish date</text>

    <rect x="20" y="70" width="160" height="130" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="35" y="94" font-size="13" font-weight="bold" fill="#66400f">1. Request</text>
    <text x="35" y="114" font-size="11.5" fill="#36424e">erase user 17;</text>
    <text x="35" y="131" font-size="11.5" fill="#36424e">record it with</text>
    <text x="35" y="148" font-size="11.5" fill="#36424e">a due date</text>

    <rect x="200" y="70" width="160" height="130" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="215" y="94" font-size="13" font-weight="bold" fill="#263e5a">2. Source data</text>
    <text x="215" y="114" font-size="11.5" fill="#36424e">notes and tasks</text>
    <text x="215" y="131" font-size="11.5" fill="#36424e">in the database</text>

    <rect x="380" y="70" width="160" height="130" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="395" y="94" font-size="13" font-weight="bold" fill="#263e5a">3. Derived data</text>
    <text x="395" y="114" font-size="11.5" fill="#36424e">vector chunks by</text>
    <text x="395" y="131" font-size="11.5" fill="#36424e">source id; cached</text>
    <text x="395" y="148" font-size="11.5" fill="#36424e">answers; eval and</text>
    <text x="395" y="165" font-size="11.5" fill="#36424e">feedback rows</text>

    <rect x="560" y="70" width="160" height="130" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="575" y="94" font-size="13" font-weight="bold" fill="#463365">4. Provider objects</text>
    <text x="575" y="114" font-size="11.5" fill="#36424e">responses, files,</text>
    <text x="575" y="131" font-size="11.5" fill="#36424e">vector stores via</text>
    <text x="575" y="148" font-size="11.5" fill="#36424e">the API; 404 = done</text>

    <rect x="740" y="70" width="160" height="130" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="755" y="94" font-size="13" font-weight="bold" fill="#294a2e">5. TTL copies</text>
    <text x="755" y="114" font-size="11.5" fill="#36424e">app logs 30 days,</text>
    <text x="755" y="131" font-size="11.5" fill="#36424e">abuse logs up to 30,</text>
    <text x="755" y="148" font-size="11.5" fill="#36424e">backups 35: done on</text>
    <text x="755" y="165" font-size="11.5" fill="#36424e">day 35; audit record</text>

    <g stroke="#40566b" stroke-width="1.6" fill="none">
      <line x1="180" y1="135" x2="198" y2="135" marker-end="url(#erf-arrow)"/>
      <line x1="360" y1="135" x2="378" y2="135" marker-end="url(#erf-arrow)"/>
      <line x1="540" y1="135" x2="558" y2="135" marker-end="url(#erf-arrow)"/>
      <line x1="720" y1="135" x2="738" y2="135" marker-end="url(#erf-arrow)"/>
    </g>

    <!-- retry loop on step 4 -->
    <path d="M610 200 C 600 250, 680 250, 670 202" fill="none" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#erf-arrow)"/>
    <text x="640" y="262" font-size="12" fill="#6e2a24" text-anchor="middle">failures retried; the job</text>
    <text x="640" y="278" font-size="12" fill="#6e2a24" text-anchor="middle">is safe to run twice</text>

    <!-- notes -->
    <rect x="20" y="300" width="430" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="35" y="322" font-size="12.5" font-weight="bold" fill="#263e5a">Backups</text>
    <text x="35" y="341" font-size="11.5" fill="#36424e">expire on their own schedule; a restore must re-apply</text>
    <text x="35" y="358" font-size="11.5" fill="#36424e">the deletions recorded since the backup was taken</text>

    <rect x="470" y="300" width="430" height="70" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="485" y="322" font-size="12.5" font-weight="bold" fill="#6e2a24">Fine-tuned models</text>
    <text x="485" y="341" font-size="11.5" fill="#36424e">weights cannot forget one user; keep personal data</text>
    <text x="485" y="358" font-size="11.5" fill="#36424e">out of training sets, or plan to retrain without it</text>

    <text x="30" y="404" font-size="13" fill="#40566b">Deletion is a job with an inventory, retries, and a finish date, not a single query.</text>
  </g>
</svg>
