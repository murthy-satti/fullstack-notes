<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">Where each agent protocol fits</title>
  <desc id="pl-desc">The TaskFlow agent sits in the middle. To use tools and data it connects as an MCP client to MCP servers, such as a docs search server. To delegate work to an agent owned by another team or company it uses A2A, reading that agent's Agent Card first. To call an ordinary REST API it uses tools generated from selected OpenAPI operations. An authorization server issues OAuth tokens, each limited to one audience and set of scopes, for every one of these connections.</desc>
  <defs>
    <marker id="pl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="30" y="150" width="230" height="96" rx="12" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="145" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#66400f">TaskFlow agent</text>
    <text x="145" y="202" text-anchor="middle" font-size="12" fill="#36424e">model + tool loop</text>
    <text x="145" y="222" text-anchor="middle" font-size="12" fill="#36424e">MCP client, A2A client</text>

    <rect x="560" y="40" width="290" height="80" rx="12" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="705" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#463365">MCP servers</text>
    <text x="705" y="90" text-anchor="middle" font-size="12" fill="#36424e">tools, resources, prompts</text>
    <text x="705" y="107" text-anchor="middle" font-size="12" fill="#36424e">e.g. a docs search server</text>

    <rect x="560" y="158" width="290" height="80" rx="12" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="705" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#66400f">Partner agent</text>
    <text x="705" y="208" text-anchor="middle" font-size="12" fill="#36424e">another team's or company's</text>
    <text x="705" y="225" text-anchor="middle" font-size="12" fill="#36424e">agent, found by its Agent Card</text>

    <rect x="560" y="276" width="290" height="80" rx="12" fill="#e5efff" stroke="#4774aa"/>
    <text x="705" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">REST API</text>
    <text x="705" y="326" text-anchor="middle" font-size="12" fill="#36424e">described by OpenAPI;</text>
    <text x="705" y="343" text-anchor="middle" font-size="12" fill="#36424e">selected operations become tools</text>

    <line x1="260" y1="176" x2="558" y2="84" stroke="#40566b" stroke-width="1.6" marker-end="url(#pl-arrow)"/>
    <rect x="336" y="108" width="140" height="22" rx="4" fill="#f5f7fb"/>
    <text x="406" y="123" text-anchor="middle" font-size="12" fill="#36424e">MCP: agent to tools</text>
    <line x1="260" y1="198" x2="558" y2="198" stroke="#40566b" stroke-width="1.6" marker-end="url(#pl-arrow)"/>
    <rect x="336" y="187" width="140" height="22" rx="4" fill="#f5f7fb"/>
    <text x="406" y="202" text-anchor="middle" font-size="12" fill="#36424e">A2A: agent to agent</text>
    <line x1="260" y1="220" x2="558" y2="312" stroke="#40566b" stroke-width="1.6" marker-end="url(#pl-arrow)"/>
    <rect x="320" y="266" width="172" height="22" rx="4" fill="#f5f7fb"/>
    <text x="406" y="281" text-anchor="middle" font-size="12" fill="#36424e">HTTP: OpenAPI tools</text>

    <rect x="30" y="300" width="230" height="70" rx="12" fill="#e5efff" stroke="#4774aa"/>
    <text x="145" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">Authorization server</text>
    <text x="145" y="350" text-anchor="middle" font-size="12" fill="#36424e">OAuth tokens per audience</text>
    <line x1="145" y1="298" x2="145" y2="248" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pl-arrow)"/>

    <text x="440" y="398" text-anchor="middle" font-size="13" fill="#40566b">MCP connects agents to capabilities, A2A to other agents; OAuth secures both.</text>
  </g>
</svg>
