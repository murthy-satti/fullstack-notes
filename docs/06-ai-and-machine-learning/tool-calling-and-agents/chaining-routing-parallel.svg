<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="crp-title crp-desc">
  <title id="crp-title">Prompt chaining, routing and parallelization</title>
  <desc id="crp-desc">Three workflow patterns from TaskFlow. Prompt chaining: a model step summarizes and extracts action items, a code gate checks that the items match the schema, and only then does the next step propose tasks; a failed gate sends the run to review. Routing: a fast model classifies the request and code sends it to one of four handlers: docs questions to the RAG answer, task changes to the task agent, meeting summaries to the summary chain, and anything else to a fallback reply. Parallelization: the same meeting notes go to two independent model calls at once, one summarizing and one extracting action items, and code combines the results.</desc>
  <defs>
    <marker id="crp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="62" font-size="14" font-weight="700" fill="#36424e">Prompt chaining</text>
    <text x="30" y="82" font-size="12" fill="#40566b">notes to draft tasks</text>
    <rect x="230" y="40" width="170" height="56" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="315" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263e5a">Model step</text>
    <text x="315" y="83" text-anchor="middle" font-size="12" fill="#36424e">summarize, extract</text>
    <rect x="440" y="40" width="170" height="56" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="525" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#463365">Code gate</text>
    <text x="525" y="83" text-anchor="middle" font-size="12" fill="#36424e">schema valid?</text>
    <rect x="650" y="40" width="190" height="56" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="745" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263e5a">Next step</text>
    <text x="745" y="83" text-anchor="middle" font-size="12" fill="#36424e">propose tasks</text>
    <line x1="400" y1="68" x2="438" y2="68" stroke="#40566b" stroke-width="1.6" marker-end="url(#crp-arrow)"/>
    <line x1="610" y1="68" x2="648" y2="68" stroke="#40566b" stroke-width="1.6" marker-end="url(#crp-arrow)"/>
    <line x1="525" y1="96" x2="525" y2="118" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#crp-arrow)"/>
    <text x="535" y="128" font-size="12" fill="#6e2a24">fail: send to review</text>

    <line x1="20" y1="148" x2="860" y2="148" stroke="#c9d1db" stroke-width="1"/>

    <text x="30" y="222" font-size="14" font-weight="700" fill="#36424e">Routing</text>
    <text x="30" y="242" font-size="12" fill="#40566b">one request, one handler</text>
    <rect x="230" y="200" width="170" height="56" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="315" y="224" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263e5a">Fast model</text>
    <text x="315" y="243" text-anchor="middle" font-size="12" fill="#36424e">classify request</text>
    <rect x="480" y="164" width="360" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="660" y="182" text-anchor="middle" font-size="12" fill="#36424e">docs_question: RAG answer</text>
    <rect x="480" y="198" width="360" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="660" y="216" text-anchor="middle" font-size="12" fill="#36424e">task_change: task agent with tools</text>
    <rect x="480" y="232" width="360" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="660" y="250" text-anchor="middle" font-size="12" fill="#36424e">meeting_summary: summary chain</text>
    <rect x="480" y="266" width="360" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="660" y="284" text-anchor="middle" font-size="12" fill="#36424e">other or unknown label: fallback reply</text>
    <line x1="400" y1="228" x2="478" y2="177" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>
    <line x1="400" y1="228" x2="478" y2="211" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>
    <line x1="400" y1="228" x2="478" y2="245" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>
    <line x1="400" y1="228" x2="478" y2="279" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>

    <line x1="20" y1="306" x2="860" y2="306" stroke="#c9d1db" stroke-width="1"/>

    <text x="30" y="372" font-size="14" font-weight="700" fill="#36424e">Parallelization</text>
    <text x="30" y="392" font-size="12" fill="#40566b">sectioning: split, run at once</text>
    <rect x="230" y="350" width="170" height="56" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="315" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#66400f">Meeting notes</text>
    <text x="315" y="393" text-anchor="middle" font-size="12" fill="#36424e">same input</text>
    <rect x="440" y="322" width="170" height="44" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="525" y="349" text-anchor="middle" font-size="12" fill="#36424e">model: summarize</text>
    <rect x="440" y="390" width="170" height="44" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="525" y="417" text-anchor="middle" font-size="12" fill="#36424e">model: extract items</text>
    <rect x="650" y="350" width="190" height="56" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="745" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#463365">Combine in code</text>
    <text x="745" y="393" text-anchor="middle" font-size="12" fill="#36424e">Promise.all</text>
    <line x1="400" y1="372" x2="438" y2="348" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>
    <line x1="400" y1="384" x2="438" y2="408" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>
    <line x1="610" y1="344" x2="648" y2="370" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>
    <line x1="610" y1="412" x2="648" y2="388" stroke="#40566b" stroke-width="1.4" marker-end="url(#crp-arrow)"/>

    <text x="440" y="458" text-anchor="middle" font-size="13" fill="#40566b">Workflows: code fixes the path, and the model fills in each step.</text>
  </g>
</svg>
