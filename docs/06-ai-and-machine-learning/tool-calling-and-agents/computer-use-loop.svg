<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="cul-title cul-desc">
  <title id="cul-title">The computer use and browser use loop</title>
  <desc id="cul-desc">The model runs at the provider; everything else runs in your environment. The model returns a batch of actions as tool_use blocks, for example left_click, type and screenshot. Your executor checks each action against policy, runs the batch in order against a sandboxed browser or desktop, and collects one result per action: OK for the click and the typing, and an image for the screenshot. All results go back in one message. The model looks at the new screenshot or page structure and chooses the next batch, until the task is done or a limit is reached.</desc>
  <defs>
    <marker id="cul-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="40" width="200" height="270" rx="12" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="6 4"/>
    <text x="120" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#36424e">Provider API</text>
    <rect x="40" y="130" width="160" height="80" rx="10" fill="#e5efff" stroke="#4774aa"/>
    <text x="120" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#263e5a">Model</text>
    <text x="120" y="181" text-anchor="middle" font-size="12" fill="#36424e">sees screenshots</text>
    <text x="120" y="198" text-anchor="middle" font-size="12" fill="#36424e">or page structure</text>

    <rect x="250" y="40" width="610" height="270" rx="12" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="6 4"/>
    <text x="555" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#36424e">Your environment</text>

    <rect x="280" y="84" width="230" height="110" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="395" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">Action batch (tool_use)</text>
    <text x="300" y="130" font-size="12" fill="#36424e">1. left_click ref_7</text>
    <text x="300" y="151" font-size="12" fill="#36424e">2. type "Q4 roadmap"</text>
    <text x="300" y="172" font-size="12" fill="#36424e">3. screenshot</text>

    <rect x="560" y="84" width="270" height="110" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="695" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#463365">Executor</text>
    <text x="695" y="130" text-anchor="middle" font-size="12" fill="#36424e">checks policy for each action</text>
    <text x="695" y="151" text-anchor="middle" font-size="12" fill="#36424e">runs them in order</text>
    <text x="695" y="172" text-anchor="middle" font-size="12" fill="#36424e">answers every block</text>

    <rect x="560" y="226" width="270" height="64" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="695" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#294a2e">Sandboxed browser or VM</text>
    <text x="695" y="272" text-anchor="middle" font-size="12" fill="#36424e">Playwright, VNC desktop, ...</text>

    <rect x="280" y="226" width="230" height="64" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="395" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">Results, one message</text>
    <text x="395" y="272" text-anchor="middle" font-size="12" fill="#36424e">OK, OK, image</text>

    <line x1="200" y1="150" x2="278" y2="140" stroke="#40566b" stroke-width="1.6" marker-end="url(#cul-arrow)"/>
    <line x1="510" y1="139" x2="558" y2="139" stroke="#40566b" stroke-width="1.6" marker-end="url(#cul-arrow)"/>
    <line x1="660" y1="194" x2="660" y2="224" stroke="#40566b" stroke-width="1.6" marker-end="url(#cul-arrow)"/>
    <line x1="730" y1="224" x2="730" y2="196" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cul-arrow)"/>
    <line x1="558" y1="258" x2="512" y2="258" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cul-arrow)"/>
    <line x1="280" y1="258" x2="202" y2="196" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cul-arrow)"/>

    <text x="440" y="350" text-anchor="middle" font-size="13" fill="#40566b">Each turn sends actions out and new screen state back, until the task ends or a limit hits.</text>
  </g>
</svg>
