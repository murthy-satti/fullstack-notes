<svg xmlns="http://www.w3.org/2000/svg" width="880" height="532" viewBox="0 0 880 532" role="img" aria-labelledby="ips-title ips-desc">
  <title id="ips-title">Document ingestion pipeline stages</title>
  <desc id="ips-desc">Document events (created, edited, moved, deleted, permissions changed) start the pipeline on the left. Eight stages run top to bottom in the centre: 1, fetch and detect the type by MIME type, size limit and file hash; 2, parse to structured text using a Markdown syntax tree, the main content of HTML, or the PDF text layer; 3, normalize Unicode, whitespace and running headers; 4, chunk by structure with sections, a size cap and tables kept whole; 5, enrich metadata with the breadcrumb, anchor, page and scope fields; 6, hash and plan the sync, deciding per chunk whether to embed, keep or delete; 7, embed new or changed chunks in batches, skipping unchanged text; 8, write the new chunks and then delete stale ones so the document never disappears. On the right, parse problems branch off stage 2: a scanned PDF with no text goes to OCR, and corrupt or oversized files go to a dead-letter queue with an alert. Stage 7 calls the embedding API with the configured model in batches of 128 and gets vectors back, and stage 8 upserts by _id and deletes stale _ids in the knowledge_chunks collection. A nightly reconciliation job on the left compares live documents with indexed document IDs and feeds stage 6 to fix missed events.</desc>
  <defs>
    <marker id="ips-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="ips-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="532" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">From a changed document to searchable chunks</text>

    <rect x="16" y="56" width="240" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="136" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Document events</text>
    <text x="136" y="96" text-anchor="middle" font-size="11.5" fill="#66400f">created, edited, moved, deleted,</text>
    <text x="136" y="112" text-anchor="middle" font-size="11.5" fill="#66400f">permissions changed</text>
    <line x1="256" y1="78" x2="298" y2="78" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="16" y="326" width="240" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="136" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Nightly reconciliation</text>
    <text x="136" y="366" text-anchor="middle" font-size="11.5" fill="#263e5a">live documents vs indexed docIds:</text>
    <text x="136" y="382" text-anchor="middle" font-size="11.5" fill="#263e5a">fixes missed events and orphans</text>
    <line x1="256" y1="358" x2="298" y2="358" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="56" width="280" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="440" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">1. Fetch and detect type</text>
    <text x="440" y="91" text-anchor="middle" font-size="11.5" fill="#263e5a">MIME type, size limit, file hash</text>
    <line x1="440" y1="100" x2="440" y2="110" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="112" width="280" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">2. Parse to structured text</text>
    <text x="440" y="147" text-anchor="middle" font-size="11.5" fill="#463365">Markdown AST, HTML main, PDF text</text>
    <line x1="440" y1="156" x2="440" y2="166" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="168" width="280" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">3. Normalize</text>
    <text x="440" y="203" text-anchor="middle" font-size="11.5" fill="#463365">Unicode, whitespace, running headers</text>
    <line x1="440" y1="212" x2="440" y2="222" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="224" width="280" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">4. Chunk by structure</text>
    <text x="440" y="259" text-anchor="middle" font-size="11.5" fill="#463365">sections, size cap, tables whole</text>
    <line x1="440" y1="268" x2="440" y2="278" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="280" width="280" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">5. Enrich metadata</text>
    <text x="440" y="315" text-anchor="middle" font-size="11.5" fill="#463365">breadcrumb, anchor, page, scope</text>
    <line x1="440" y1="324" x2="440" y2="334" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="336" width="280" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="440" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">6. Hash and plan the sync</text>
    <text x="440" y="371" text-anchor="middle" font-size="11.5" fill="#263e5a">embed, keep or delete per chunk</text>
    <line x1="440" y1="380" x2="440" y2="390" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="392" width="280" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">7. Embed new or changed chunks</text>
    <text x="440" y="427" text-anchor="middle" font-size="11.5" fill="#463365">batched; unchanged text skipped</text>
    <line x1="440" y1="436" x2="440" y2="446" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <rect x="300" y="448" width="280" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="440" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">8. Write new, then delete stale</text>
    <text x="440" y="483" text-anchor="middle" font-size="11.5" fill="#294a2e">the document never disappears</text>

    <rect x="624" y="104" width="240" height="64" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="744" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a24">Parse problems</text>
    <text x="744" y="144" text-anchor="middle" font-size="11.5" fill="#6e2a24">scanned PDF, no text: OCR first</text>
    <text x="744" y="160" text-anchor="middle" font-size="11.5" fill="#6e2a24">corrupt or huge: dead-letter + alert</text>
    <line x1="580" y1="134" x2="622" y2="134" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ips-arrow-dash)"/>

    <rect x="624" y="384" width="240" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="744" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Embedding API</text>
    <text x="744" y="425" text-anchor="middle" font-size="11.5" fill="#463365">EMBEDDING_MODEL, batches of 128</text>
    <line x1="580" y1="404" x2="622" y2="404" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>
    <line x1="622" y1="424" x2="582" y2="424" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ips-arrow-dash)"/>

    <rect x="624" y="448" width="240" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="744" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">knowledge_chunks</text>
    <text x="744" y="489" text-anchor="middle" font-size="11.5" fill="#263e5a">upsert by _id, delete stale _ids</text>
    <line x1="580" y1="470" x2="622" y2="470" stroke="#40566b" stroke-width="1.5" marker-end="url(#ips-arrow)"/>

    <text x="440" y="522" text-anchor="middle" font-size="13" fill="#40566b">Ingestion is a chain of small, retryable steps; only changed chunks reach the embedding API.</text>
  </g>
</svg>
