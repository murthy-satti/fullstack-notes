<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="csc-title csc-desc">
  <title id="csc-title">Four chunking strategies on the same runbook</title>
  <desc id="csc-desc">On the left, the deploy runbook is drawn as a column of blocks from top to bottom: an intro paragraph, the Before you deploy section, the Deploying section, a bash code block, the Rollbacks section, a table, and the After the deploy section. Four columns to the right show where each chunker places its chunk boundaries. Fixed-size chunks of 400 characters with 80 characters of overlap give 5 equal, overlapping windows that cut through sentences and through the code block. Recursive splitting at 400 characters with 80 overlap gives 5 chunks that break at paragraph and line boundaries, but one chunk ends with the Rollbacks heading, cut off from its section. Structure-aware chunking gives 6 chunks, one per section, with the code block kept with its section and the table as its own chunk. Semantic chunking places breaks where the meaning of neighbouring sentences shifts, which can fall inside sections and ignore headings, and it needs embedding calls to find them.</desc>
  <rect width="880" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">One runbook, four chunkers</text>
    <text x="116" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">deploy-runbook.md</text>
    <text x="307" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Fixed 400/80</text>
    <text x="463" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Recursive 400/80</text>
    <text x="619" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Structure-aware</text>
    <text x="775" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Semantic</text>

    <g font-size="11.5" fill="#36424e">
      <rect x="16" y="70" width="200" height="30" rx="6" fill="#ffffff" stroke="#8a96a3"/>
      <text x="26" y="89">Intro paragraph</text>
      <rect x="16" y="104" width="200" height="56" rx="6" fill="#ffffff" stroke="#8a96a3"/>
      <text x="26" y="124" font-weight="bold">## Before you deploy</text>
      <text x="26" y="142">paragraph</text>
      <rect x="16" y="164" width="200" height="56" rx="6" fill="#ffffff" stroke="#8a96a3"/>
      <text x="26" y="184" font-weight="bold">## Deploying</text>
      <text x="26" y="202">paragraph</text>
      <rect x="16" y="224" width="200" height="28" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <text x="26" y="242" fill="#463365">bash code block</text>
      <rect x="16" y="256" width="200" height="56" rx="6" fill="#ffffff" stroke="#8a96a3"/>
      <text x="26" y="276" font-weight="bold">### Rollbacks</text>
      <text x="26" y="294">paragraph</text>
      <rect x="16" y="316" width="200" height="44" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <text x="26" y="342" fill="#263e5a">table: situation, action, owner</text>
      <rect x="16" y="364" width="200" height="46" rx="6" fill="#ffffff" stroke="#8a96a3"/>
      <text x="26" y="384" font-weight="bold">## After the deploy</text>
      <text x="26" y="402">paragraph</text>
    </g>

    <g stroke="#4774aa" fill="#e5efff" fill-opacity="0.65">
      <rect x="244" y="70" width="126" height="97" rx="5"/>
      <rect x="244" y="147" width="126" height="97" rx="5"/>
      <rect x="244" y="224" width="126" height="97" rx="5"/>
      <rect x="244" y="301" width="126" height="97" rx="5"/>
      <rect x="244" y="378" width="126" height="32" rx="5"/>
    </g>
    <line x1="236" y1="244" x2="378" y2="244" stroke="#b5524b" stroke-width="2"/>
    <rect x="262" y="236" width="90" height="15" rx="3" fill="#fbe9e7"/>
    <text x="307" y="248" text-anchor="middle" font-size="11" fill="#6e2a24">cuts the code</text>

    <g stroke="#4774aa" fill="#e5efff" fill-opacity="0.65">
      <rect x="400" y="70" width="126" height="90" rx="5"/>
      <rect x="400" y="160" width="126" height="102" rx="5"/>
      <rect x="400" y="250" width="126" height="62" rx="5"/>
      <rect x="400" y="304" width="126" height="56" rx="5"/>
      <rect x="400" y="352" width="126" height="58" rx="5"/>
    </g>
    <line x1="392" y1="260" x2="534" y2="260" stroke="#b5524b" stroke-width="2"/>
    <rect x="402" y="264" width="122" height="15" rx="3" fill="#fbe9e7"/>
    <text x="463" y="276" text-anchor="middle" font-size="11" fill="#6e2a24">heading ends chunk 2</text>

    <g stroke="#53845b" fill="#e7f3e9">
      <rect x="556" y="70" width="126" height="30" rx="5"/>
      <rect x="556" y="104" width="126" height="56" rx="5"/>
      <rect x="556" y="164" width="126" height="88" rx="5"/>
      <rect x="556" y="256" width="126" height="56" rx="5"/>
      <rect x="556" y="316" width="126" height="44" rx="5"/>
      <rect x="556" y="364" width="126" height="46" rx="5"/>
    </g>
    <g font-size="11" fill="#294a2e" text-anchor="middle">
      <text x="619" y="89">intro</text>
      <text x="619" y="136">Before you deploy</text>
      <text x="619" y="206">Deploying + code</text>
      <text x="619" y="288">Rollbacks text</text>
      <text x="619" y="342">Rollbacks table</text>
      <text x="619" y="391">After the deploy</text>
    </g>

    <g stroke="#8062a8" fill="#f0e9fb">
      <rect x="712" y="70" width="126" height="70" rx="5"/>
      <rect x="712" y="144" width="126" height="106" rx="5"/>
      <rect x="712" y="254" width="126" height="76" rx="5"/>
      <rect x="712" y="334" width="126" height="76" rx="5"/>
    </g>
    <g font-size="11" fill="#463365" text-anchor="middle">
      <text x="775" y="109">topic: approval</text>
      <text x="775" y="201">topic: rollout</text>
      <text x="775" y="296">topic: undo</text>
      <text x="775" y="376">topic: follow-up</text>
    </g>

    <g font-size="11" text-anchor="middle" fill="#36424e">
      <text x="307" y="432">5 chunks; cuts mid-</text>
      <text x="307" y="448">sentence and code</text>
      <text x="463" y="432">5 chunks; a heading</text>
      <text x="463" y="448">can end a chunk</text>
      <text x="619" y="432">6 chunks; one per</text>
      <text x="619" y="448">section, blocks whole</text>
      <text x="775" y="432">breaks where meaning</text>
      <text x="775" y="448">shifts (embeddings)</text>
    </g>

    <text x="440" y="484" text-anchor="middle" font-size="13" fill="#40566b">Same runbook, four chunkers: structure-aware keeps each section, code block and table whole.</text>
  </g>
</svg>
