<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="rem-title rem-desc">
  <title id="rem-title">Which RAG metrics measure which stage</title>
  <desc id="rem-desc">Across the top, a RAG request flows through five boxes: a golden question with labels, the retriever, the top k chunks, the generator model, and the answer with citations. A bracket under the first three boxes marks the retrieval stage, and a bracket under the last three marks the generation stage. The retrieval panel on the left asks whether the right evidence arrived, with four metrics: hit at k and recall at k, which count expected sources found in the top k; MRR and nDCG at k, which measure how high the first and best sources rank; context precision or relevance, the share of retrieved chunks that are relevant; and a scope leak check that no chunk comes from outside the user's projects. The generation panel on the right asks whether the answer used the evidence well, with four metrics: faithfulness or groundedness, answer claims supported by the chunks; answer relevance, whether the answer addresses the question; correctness and fact coverage against the reference answer; and citation validity and abstention, meaning quotes are real and the system says not found when it should.</desc>
  <defs>
    <marker id="rem-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">Score each stage with its own metrics</text>

    <rect x="16" y="52" width="136" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="84" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Golden question</text>
    <text x="84" y="91" text-anchor="middle" font-size="11.5" fill="#66400f">+ expected sources</text>
    <line x1="152" y1="77" x2="190" y2="77" stroke="#40566b" stroke-width="1.5" marker-end="url(#rem-arrow)"/>
    <rect x="192" y="52" width="136" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="260" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Retriever</text>
    <text x="260" y="91" text-anchor="middle" font-size="11.5" fill="#263e5a">scope + search</text>
    <line x1="328" y1="77" x2="366" y2="77" stroke="#40566b" stroke-width="1.5" marker-end="url(#rem-arrow)"/>
    <rect x="368" y="52" width="136" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="436" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Top-k chunks</text>
    <text x="436" y="91" text-anchor="middle" font-size="11.5" fill="#263e5a">ranked, with scores</text>
    <line x1="504" y1="77" x2="542" y2="77" stroke="#40566b" stroke-width="1.5" marker-end="url(#rem-arrow)"/>
    <rect x="544" y="52" width="136" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="612" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Generator</text>
    <text x="612" y="91" text-anchor="middle" font-size="11.5" fill="#463365">model + prompt</text>
    <line x1="680" y1="77" x2="718" y2="77" stroke="#40566b" stroke-width="1.5" marker-end="url(#rem-arrow)"/>
    <rect x="720" y="52" width="144" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="792" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">Answer</text>
    <text x="792" y="91" text-anchor="middle" font-size="11.5" fill="#294a2e">+ citations</text>

    <path d="M16 112 V122 H504 V112" fill="none" stroke="#4774aa" stroke-width="1.5"/>
    <text x="260" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">retrieval stage</text>
    <path d="M368 150 V160 H864 V150" fill="none" stroke="#8062a8" stroke-width="1.5"/>
    <text x="616" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#463365">generation stage</text>

    <rect x="16" y="190" width="416" height="236" rx="10" fill="#ffffff" stroke="#c9d1db"/>
    <text x="224" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Retrieval: did the right evidence arrive?</text>
    <rect x="32" y="226" width="384" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="44" y="244" font-size="13" font-weight="bold" fill="#263e5a">hit@k, recall@k</text>
    <text x="44" y="261" font-size="11.5" fill="#263e5a">expected sources found in the top k</text>
    <rect x="32" y="276" width="384" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="44" y="294" font-size="13" font-weight="bold" fill="#263e5a">MRR, nDCG@k</text>
    <text x="44" y="311" font-size="11.5" fill="#263e5a">how high the first and the best sources rank</text>
    <rect x="32" y="326" width="384" height="44" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="44" y="344" font-size="13" font-weight="bold" fill="#263e5a">Context precision / relevance</text>
    <text x="44" y="361" font-size="11.5" fill="#263e5a">share of retrieved chunks that are relevant (often LLM-judged)</text>
    <rect x="32" y="376" width="384" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="44" y="394" font-size="13" font-weight="bold" fill="#6e2a24">Scope leak check</text>
    <text x="44" y="411" font-size="11.5" fill="#6e2a24">no retrieved chunk outside the user's projects: must be 0</text>

    <rect x="448" y="190" width="416" height="236" rx="10" fill="#ffffff" stroke="#c9d1db"/>
    <text x="656" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Generation: did the answer use it well?</text>
    <rect x="464" y="226" width="384" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="476" y="244" font-size="13" font-weight="bold" fill="#463365">Faithfulness / groundedness</text>
    <text x="476" y="261" font-size="11.5" fill="#463365">answer claims supported by the retrieved chunks</text>
    <rect x="464" y="276" width="384" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="476" y="294" font-size="13" font-weight="bold" fill="#463365">Answer relevance</text>
    <text x="476" y="311" font-size="11.5" fill="#463365">the answer addresses the question that was asked</text>
    <rect x="464" y="326" width="384" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="476" y="344" font-size="13" font-weight="bold" fill="#463365">Correctness, fact coverage</text>
    <text x="476" y="361" font-size="11.5" fill="#463365">matches the reference answer and its key facts</text>
    <rect x="464" y="376" width="384" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="476" y="394" font-size="13" font-weight="bold" fill="#294a2e">Citation validity, abstention</text>
    <text x="476" y="411" font-size="11.5" fill="#294a2e">quotes are real; says "not found" when it should</text>

    <text x="440" y="452" text-anchor="middle" font-size="13" fill="#40566b">Score the stages separately: a perfect generator cannot fix evidence that never arrived.</text>
  </g>
</svg>
