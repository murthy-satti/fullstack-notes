<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-labelledby="csp-title csp-desc">
  <title id="csp-title">Re-ingesting an edited document as a diff of chunk IDs</title>
  <desc id="csp-desc">On the left are the six stored chunks of version 1 of the runbook: intro a1f0, before b27c, deploying c3e1, rollbacks text d4a9, rollbacks table e5b2, and after f60d. On the right are the five chunks of version 2 after re-chunking: intro edited a7c4, before b27c, deploying edited c8d2, rollbacks text d4a9, and rollbacks table e5b2. In the middle, the sync plan keeps 3 chunks whose IDs and hashes match (b27c, d4a9, e5b2) with no embedding call, embeds 2 chunks whose text changed (a7c4, c8d2), and deletes 3 chunks that were edited or removed (a1f0, c3e1, f60d). Along the bottom, the order of operations is: first embed a7c4 and c8d2 while nothing is written yet, then upsert the new chunks and update the order of kept ones, and last delete a1f0, c3e1 and f60d.</desc>
  <defs>
    <marker id="csp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">Re-ingesting an edited runbook</text>
    <text x="136" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Stored chunks (v1)</text>
    <text x="440" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Sync plan</text>
    <text x="744" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Re-chunked (v2)</text>

    <g font-size="12">
      <rect x="16" y="70" width="240" height="30" rx="6" fill="#fbe9e7" stroke="#b5524b"/><text x="28" y="90" fill="#6e2a24">intro  :a1f0</text>
      <rect x="16" y="106" width="240" height="30" rx="6" fill="#e7f3e9" stroke="#53845b"/><text x="28" y="126" fill="#294a2e">before you deploy  :b27c</text>
      <rect x="16" y="142" width="240" height="30" rx="6" fill="#fbe9e7" stroke="#b5524b"/><text x="28" y="162" fill="#6e2a24">deploying  :c3e1</text>
      <rect x="16" y="178" width="240" height="30" rx="6" fill="#e7f3e9" stroke="#53845b"/><text x="28" y="198" fill="#294a2e">rollbacks text  :d4a9</text>
      <rect x="16" y="214" width="240" height="30" rx="6" fill="#e7f3e9" stroke="#53845b"/><text x="28" y="234" fill="#294a2e">rollbacks table  :e5b2</text>
      <rect x="16" y="250" width="240" height="30" rx="6" fill="#fbe9e7" stroke="#b5524b"/><text x="28" y="270" fill="#6e2a24">after the deploy  :f60d</text>

      <rect x="624" y="70" width="240" height="30" rx="6" fill="#f0e9fb" stroke="#8062a8"/><text x="636" y="90" fill="#463365">intro (edited)  :a7c4</text>
      <rect x="624" y="106" width="240" height="30" rx="6" fill="#e7f3e9" stroke="#53845b"/><text x="636" y="126" fill="#294a2e">before you deploy  :b27c</text>
      <rect x="624" y="142" width="240" height="30" rx="6" fill="#f0e9fb" stroke="#8062a8"/><text x="636" y="162" fill="#463365">deploying (edited)  :c8d2</text>
      <rect x="624" y="178" width="240" height="30" rx="6" fill="#e7f3e9" stroke="#53845b"/><text x="636" y="198" fill="#294a2e">rollbacks text  :d4a9</text>
      <rect x="624" y="214" width="240" height="30" rx="6" fill="#e7f3e9" stroke="#53845b"/><text x="636" y="234" fill="#294a2e">rollbacks table  :e5b2</text>
      <rect x="624" y="250" width="240" height="30" rx="6" fill="none" stroke="#8a96a3" stroke-dasharray="4 3"/><text x="636" y="270" fill="#60788d">section removed</text>
    </g>

    <rect x="300" y="70" width="280" height="62" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="440" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">Keep 3: b27c, d4a9, e5b2</text>
    <text x="440" y="113" text-anchor="middle" font-size="11.5" fill="#294a2e">same ID and hash: no embedding call</text>
    <rect x="300" y="144" width="280" height="62" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Embed 2: a7c4, c8d2</text>
    <text x="440" y="187" text-anchor="middle" font-size="11.5" fill="#463365">new text, new ID</text>
    <rect x="300" y="218" width="280" height="62" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="440" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a24">Delete 3: a1f0, c3e1, f60d</text>
    <text x="440" y="261" text-anchor="middle" font-size="11.5" fill="#6e2a24">edited away or removed</text>

    <text x="440" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Order of operations</text>
    <rect x="16" y="332" width="260" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="146" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">1. Embed a7c4, c8d2</text>
    <text x="146" y="374" text-anchor="middle" font-size="11.5" fill="#463365">nothing is written yet</text>
    <line x1="276" y1="360" x2="308" y2="360" stroke="#40566b" stroke-width="1.5" marker-end="url(#csp-arrow)"/>
    <rect x="310" y="332" width="260" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="440" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">2. Upsert new chunks</text>
    <text x="440" y="374" text-anchor="middle" font-size="11.5" fill="#263e5a">and update the order of kept ones</text>
    <line x1="570" y1="360" x2="602" y2="360" stroke="#40566b" stroke-width="1.5" marker-end="url(#csp-arrow)"/>
    <rect x="604" y="332" width="260" height="56" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="734" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a24">3. Delete a1f0, c3e1, f60d</text>
    <text x="734" y="374" text-anchor="middle" font-size="11.5" fill="#6e2a24">last, so the doc never vanishes</text>

    <text x="440" y="426" text-anchor="middle" font-size="13" fill="#40566b">Content-addressed IDs turn re-ingestion into a diff: unchanged text keeps its ID and its vector.</text>
  </g>
</svg>
