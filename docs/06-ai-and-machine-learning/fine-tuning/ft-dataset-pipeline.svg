<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="fdp-title fdp-desc">
  <title id="fdp-title">From curated examples to leakage-free splits</title>
  <desc id="fdp-desc">Three sources feed the dataset: production logs used with consent, expert-written examples, and reviewed synthetic examples. A Clean stage removes duplicates, strips personal data, and validates the gold answers. A Label and review stage applies written labeling rules and checks reviewer agreement. A Group split stage hashes the project ID so each project lands in one split: buckets 0 to 79 train, 80 to 89 validation, 90 to 99 test. Train and validation files go to Train candidate, which trains with SFT or LoRA and picks a checkpoint on validation. The test file goes to Evaluate, which scores the candidate and the prompted baseline on the test set only. A dashed loop returns from Evaluate to Label and review: error analysis adds examples where the model fails.</desc>
  <defs>
    <marker id="fdp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="fdp-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- sources -->
    <text x="100" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#36424e">Sources</text>
    <rect x="20" y="50" width="160" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="100" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Production logs</text>
    <text x="100" y="87" text-anchor="middle" font-size="11.5" fill="#66400f">used with consent</text>
    <rect x="20" y="110" width="160" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="100" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Expert examples</text>
    <text x="100" y="147" text-anchor="middle" font-size="11.5" fill="#66400f">written to the rules</text>
    <rect x="20" y="170" width="160" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="100" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Synthetic examples</text>
    <text x="100" y="207" text-anchor="middle" font-size="11.5" fill="#66400f">reviewed and labelled</text>
    <line x1="180" y1="74" x2="218" y2="118" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>
    <line x1="180" y1="134" x2="218" y2="140" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>
    <line x1="180" y1="194" x2="218" y2="162" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>

    <!-- clean -->
    <rect x="220" y="80" width="170" height="120" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="305" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Clean</text>
    <text x="305" y="130" text-anchor="middle" font-size="11.5" fill="#463365">remove duplicates</text>
    <text x="305" y="150" text-anchor="middle" font-size="11.5" fill="#463365">strip personal data</text>
    <text x="305" y="170" text-anchor="middle" font-size="11.5" fill="#463365">validate gold answers</text>
    <line x1="390" y1="140" x2="428" y2="140" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>

    <!-- label -->
    <rect x="430" y="80" width="160" height="120" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="510" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Label and review</text>
    <text x="510" y="134" text-anchor="middle" font-size="11.5" fill="#463365">written labeling rules</text>
    <text x="510" y="154" text-anchor="middle" font-size="11.5" fill="#463365">reviewer agreement</text>
    <line x1="590" y1="140" x2="628" y2="140" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>

    <!-- split -->
    <rect x="630" y="80" width="230" height="120" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="745" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Group split</text>
    <text x="745" y="124" text-anchor="middle" font-size="11.5" fill="#263e5a">hash(project_id) % 100</text>
    <text x="745" y="144" text-anchor="middle" font-size="11.5" fill="#263e5a">0-79 train</text>
    <text x="745" y="162" text-anchor="middle" font-size="11.5" fill="#263e5a">80-89 validation</text>
    <text x="745" y="180" text-anchor="middle" font-size="11.5" fill="#263e5a">90-99 test</text>

    <!-- outputs -->
    <line x1="790" y1="200" x2="790" y2="268" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>
    <rect x="796" y="226" width="70" height="18" rx="4" fill="#f5f7fb"/>
    <text x="800" y="239" font-size="11.5" fill="#36424e">train, val</text>
    <line x1="660" y1="200" x2="500" y2="268" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>
    <rect x="566" y="226" width="34" height="18" rx="4" fill="#f5f7fb"/>
    <text x="583" y="239" text-anchor="middle" font-size="11.5" fill="#36424e">test</text>

    <rect x="630" y="270" width="230" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="745" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#294a2e">Train candidate</text>
    <text x="745" y="310" text-anchor="middle" font-size="11.5" fill="#294a2e">SFT or LoRA on train;</text>
    <text x="745" y="326" text-anchor="middle" font-size="11.5" fill="#294a2e">pick a checkpoint on validation</text>
    <line x1="630" y1="302" x2="562" y2="302" stroke="#40566b" stroke-width="1.5" marker-end="url(#fdp-arrow)"/>

    <rect x="330" y="270" width="230" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="445" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#294a2e">Evaluate</text>
    <text x="445" y="310" text-anchor="middle" font-size="11.5" fill="#294a2e">test set only; score the</text>
    <text x="445" y="326" text-anchor="middle" font-size="11.5" fill="#294a2e">candidate and the baseline</text>

    <!-- error-analysis loop -->
    <path d="M330 302 H290 V232 H470 V204" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fdp-arrow-dash)"/>
    <text x="30" y="284" font-size="11.5" fill="#36424e">error analysis adds</text>
    <text x="30" y="300" font-size="11.5" fill="#36424e">examples where the</text>
    <text x="30" y="316" font-size="11.5" fill="#36424e">model fails</text>

    <text x="440" y="392" text-anchor="middle" font-size="13" fill="#40566b">Split by group before training, and let evaluation errors decide which examples to add next.</text>
  </g>
</svg>
