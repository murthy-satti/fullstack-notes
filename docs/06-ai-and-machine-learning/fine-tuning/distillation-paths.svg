<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="dsp-title dsp-desc">
  <title id="dsp-title">Off-policy and on-policy distillation</title>
  <desc id="dsp-desc">Top row, off-policy or sequence-level distillation: prompts go to a large teacher model, which writes answers; a validator keeps only answers that pass the schema and evaluation checks; the kept pairs train a small student with supervised fine-tuning. This works with a teacher behind an API. Bottom row, on-policy distillation as in GKD and TRL's DistillationTrainer: prompts go to the student, which writes its own answer; an open teacher with the same vocabulary gives its probability for every token of that answer; the student is updated to match the teacher's distribution, and the loop repeats, so the student learns from its own mistakes. A red bar says to check the teacher's license or terms, because some prohibit using outputs to train competing models.</desc>
  <defs>
    <marker id="dsp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="dsp-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- off-policy -->
    <text x="20" y="44" font-size="14" font-weight="bold" fill="#36424e">Off-policy (sequence-level) distillation</text>
    <rect x="20" y="62" width="130" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="85" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Prompts</text>
    <line x1="150" y1="87" x2="188" y2="87" stroke="#40566b" stroke-width="1.5" marker-end="url(#dsp-arrow)"/>
    <rect x="190" y="62" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="265" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Large teacher</text>
    <text x="265" y="101" text-anchor="middle" font-size="11.5" fill="#263e5a">writes answers</text>
    <line x1="340" y1="87" x2="378" y2="87" stroke="#40566b" stroke-width="1.5" marker-end="url(#dsp-arrow)"/>
    <rect x="380" y="62" width="160" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="460" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Validator</text>
    <text x="460" y="101" text-anchor="middle" font-size="11.5" fill="#463365">schema + eval checks</text>
    <line x1="540" y1="87" x2="578" y2="87" stroke="#40566b" stroke-width="1.5" marker-end="url(#dsp-arrow)"/>
    <rect x="580" y="62" width="160" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="660" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">Small student</text>
    <text x="660" y="101" text-anchor="middle" font-size="11.5" fill="#294a2e">trained with SFT</text>
    <text x="756" y="83" font-size="11.5" fill="#36424e">works with a</text>
    <text x="756" y="99" font-size="11.5" fill="#36424e">teacher behind</text>
    <text x="756" y="115" font-size="11.5" fill="#36424e">an API</text>

    <!-- divider -->
    <line x1="20" y1="150" x2="860" y2="150" stroke="#c9d1db" stroke-width="1"/>

    <!-- on-policy -->
    <text x="20" y="186" font-size="14" font-weight="bold" fill="#36424e">On-policy distillation (GKD, TRL DistillationTrainer)</text>
    <rect x="20" y="204" width="130" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="85" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">Prompts</text>
    <line x1="150" y1="229" x2="188" y2="229" stroke="#40566b" stroke-width="1.5" marker-end="url(#dsp-arrow)"/>
    <rect x="190" y="204" width="150" height="50" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="265" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">Student</text>
    <text x="265" y="243" text-anchor="middle" font-size="11.5" fill="#294a2e">writes its own answer</text>
    <line x1="340" y1="229" x2="378" y2="229" stroke="#40566b" stroke-width="1.5" marker-end="url(#dsp-arrow)"/>
    <rect x="380" y="204" width="180" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="470" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Open teacher</text>
    <text x="470" y="243" text-anchor="middle" font-size="11.5" fill="#263e5a">probability per token</text>
    <line x1="560" y1="229" x2="598" y2="229" stroke="#40566b" stroke-width="1.5" marker-end="url(#dsp-arrow)"/>
    <rect x="600" y="204" width="200" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="700" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Update student</text>
    <text x="700" y="243" text-anchor="middle" font-size="11.5" fill="#463365">match teacher distribution</text>
    <path d="M700 254 V292 H265 V256" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dsp-arrow-dash)"/>
    <rect x="348" y="283" width="270" height="18" rx="4" fill="#f5f7fb"/>
    <text x="483" y="296" text-anchor="middle" font-size="11.5" fill="#36424e">repeat: the student learns from its own mistakes</text>
    <text x="380" y="322" font-size="11.5" fill="#36424e">teacher and student must share the same vocabulary</text>

    <!-- terms -->
    <rect x="20" y="340" width="840" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="440" y="363" text-anchor="middle" font-size="12.5" fill="#6e2a24">Check the teacher's license or terms: some prohibit using outputs to train competing models.</text>

    <text x="440" y="404" text-anchor="middle" font-size="13" fill="#40566b">Off-policy needs only teacher answers; on-policy needs teacher probabilities but fixes the training mismatch.</text>
  </g>
</svg>
