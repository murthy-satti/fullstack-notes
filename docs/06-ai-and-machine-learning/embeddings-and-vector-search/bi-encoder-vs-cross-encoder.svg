<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="bce-title bce-desc">
  <title id="bce-title">Bi-encoders for retrieval compared with cross-encoders for reranking</title>
  <desc id="bce-desc">Left, a bi-encoder: the question goes through the embedding model to a query vector, and each document goes through the same model to a document vector that is computed once at indexing time and stored; cosine similarity between the vectors gives the score, so search is fast over millions of documents, but the model never sees the question and the document together. Right, a cross-encoder: the question and one document are fed together into a transformer that outputs a relevance score such as 0.91; it relates every question word to every document word and is more accurate, but every pair needs a model call, so it runs only on the top 20 to 150 candidates. Bottom: the pipeline retrieves broadly with bi-encoders and BM25, reranks narrowly with a cross-encoder, and sends the top 5 to 20 results to the model.</desc>
  <defs>
    <marker id="bce-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="215" y="34" font-size="14" font-weight="700" fill="#263e5a" text-anchor="middle">Bi-encoder (embedding model)</text>
    <text x="645" y="34" font-size="14" font-weight="700" fill="#294a2e" text-anchor="middle">Cross-encoder (reranker)</text>
    <path d="M430 20V270" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="30" y="54" width="110" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="85" y="79" font-size="12.5" font-weight="700" fill="#66400f" text-anchor="middle">question</text>
    <rect x="30" y="150" width="110" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="85" y="175" font-size="12.5" font-weight="700" fill="#66400f" text-anchor="middle">document</text>

    <rect x="170" y="54" width="100" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="220" y="79" font-size="12.5" font-weight="700" fill="#463365" text-anchor="middle">encoder</text>
    <rect x="170" y="150" width="100" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="220" y="175" font-size="12.5" font-weight="700" fill="#463365" text-anchor="middle">encoder</text>

    <rect x="300" y="54" width="110" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="355" y="79" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="middle">query vector</text>
    <rect x="300" y="150" width="110" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="355" y="175" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="middle">doc vector</text>
    <text x="355" y="208" font-size="11" fill="#263e5a" text-anchor="middle">stored at indexing</text>

    <rect x="300" y="102" width="110" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="355" y="127" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="middle">cosine</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M140 74H168" marker-end="url(#bce-arrow)"/>
      <path d="M140 170H168" marker-end="url(#bce-arrow)"/>
      <path d="M270 74H298" marker-end="url(#bce-arrow)"/>
      <path d="M270 170H298" marker-end="url(#bce-arrow)"/>
    </g>
    <path d="M410 74C422 80 422 112 412 118M410 170C422 164 422 132 412 126" fill="none" stroke="#60788d" stroke-width="1.6" stroke-dasharray="4 3"/>
    <g font-size="11.5" fill="#36424e">
      <text x="30" y="236">fast: documents encoded once, offline</text>
      <text x="30" y="254">blind spot: never sees both texts together</text>
    </g>

    <rect x="460" y="60" width="200" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="560" y="84" font-size="12.5" font-weight="700" fill="#66400f" text-anchor="middle">question + document</text>
    <text x="560" y="104" font-size="11.5" fill="#66400f" text-anchor="middle">one input, read together</text>

    <rect x="460" y="150" width="200" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="560" y="177" font-size="12.5" font-weight="700" fill="#463365" text-anchor="middle">transformer</text>

    <rect x="700" y="150" width="130" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="765" y="177" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="middle">relevance 0.91</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M560 120V148" marker-end="url(#bce-arrow)"/>
      <path d="M660 172H698" marker-end="url(#bce-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="460" y="236">accurate: relates every word to every word</text>
      <text x="460" y="254">costly: one model call per candidate pair</text>
    </g>

    <path d="M30 284H830" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="60" y="300" width="230" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="175" y="327" font-size="12.5" font-weight="700" fill="#263e5a" text-anchor="middle">retrieve broadly: 50 to 150</text>
    <rect x="330" y="300" width="230" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="445" y="327" font-size="12.5" font-weight="700" fill="#463365" text-anchor="middle">rerank narrowly</text>
    <rect x="600" y="300" width="200" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="700" y="327" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="middle">top 5 to 20 to the model</text>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M290 322H328" marker-end="url(#bce-arrow)"/>
      <path d="M560 322H598" marker-end="url(#bce-arrow)"/>
    </g>

    <text x="430" y="378" font-size="13" fill="#40566b" text-anchor="middle">Bi-encoders make search possible; cross-encoders make the top of the list right.</text>
  </g>
</svg>
