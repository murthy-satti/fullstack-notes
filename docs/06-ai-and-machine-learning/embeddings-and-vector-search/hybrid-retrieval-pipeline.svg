<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="hrp-title hrp-desc">
  <title id="hrp-title">A hybrid retrieval pipeline with fusion and reranking</title>
  <desc id="hrp-desc">A user question enters on the left and goes to two retrievers in parallel, both restricted to the user's workspace. Full-text search with BM25 returns its top 50 candidates and is good at exact IDs, names, and codes. Vector search returns its top 50 and is good at paraphrases and other languages. Reciprocal rank fusion with k equal to 60 merges the two lists using ranks only. A cross-encoder reranker reads the question with each of the fused candidates and keeps the best 8, with a timeout and a fallback to the fused order. The top results go to the model's context or the results page.</desc>
  <defs>
    <marker id="hrp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="300" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="24" y="112" width="118" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="83" y="136" font-size="14" font-weight="700" fill="#66400f" text-anchor="middle">question</text>
    <text x="83" y="155" font-size="11.5" fill="#66400f" text-anchor="middle">+ workspace</text>

    <rect x="182" y="40" width="190" height="72" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="277" y="64" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">full-text (BM25)</text>
    <text x="277" y="83" font-size="11.5" fill="#463365" text-anchor="middle">top 50, tenant filter</text>
    <text x="277" y="100" font-size="11.5" fill="#463365" text-anchor="middle">exact IDs, names, codes</text>

    <rect x="182" y="168" width="190" height="72" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="277" y="192" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">vector search</text>
    <text x="277" y="211" font-size="11.5" fill="#263e5a" text-anchor="middle">top 50, tenant filter</text>
    <text x="277" y="228" font-size="11.5" fill="#263e5a" text-anchor="middle">paraphrase, other languages</text>

    <rect x="412" y="112" width="130" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="477" y="136" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">RRF (k = 60)</text>
    <text x="477" y="155" font-size="11.5" fill="#463365" text-anchor="middle">ranks only</text>

    <rect x="582" y="112" width="130" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="647" y="136" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">rerank</text>
    <text x="647" y="155" font-size="11.5" fill="#263e5a" text-anchor="middle">cross-encoder</text>

    <rect x="752" y="112" width="86" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="795" y="136" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">top 8</text>
    <text x="795" y="155" font-size="11.5" fill="#294a2e" text-anchor="middle">to model</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M142 130 180 84" marker-end="url(#hrp-arrow)"/>
      <path d="M142 150 180 196" marker-end="url(#hrp-arrow)"/>
      <path d="M372 84 410 128" marker-end="url(#hrp-arrow)"/>
      <path d="M372 196 410 152" marker-end="url(#hrp-arrow)"/>
      <path d="M542 140H580" marker-end="url(#hrp-arrow)"/>
      <path d="M712 140H750" marker-end="url(#hrp-arrow)"/>
    </g>
    <rect x="584" y="188" width="126" height="22" rx="6" fill="#f5f7fb"/>
    <text x="647" y="203" font-size="11.5" fill="#36424e" text-anchor="middle">50 in, 8 out</text>
    <text x="647" y="222" font-size="11.5" fill="#36424e" text-anchor="middle">timeout + fallback</text>
    <text x="477" y="190" font-size="11.5" fill="#36424e" text-anchor="middle">up to 100 unique</text>

    <text x="430" y="280" font-size="13" fill="#40566b" text-anchor="middle">Retrieve broadly with two different retrievers, fuse by rank, then rerank a short list.</text>
  </g>
</svg>
