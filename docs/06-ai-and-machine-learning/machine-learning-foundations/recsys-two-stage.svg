<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="rts-title rts-desc">
  <title id="rts-title">The two-stage recommender architecture</title>
  <desc id="rts-desc">The two-stage recommender architecture for TaskFlow templates. A catalog of 600 templates, millions in large systems, feeds four candidate generators in parallel: a two-tower model with approximate nearest-neighbour search over a user embedding, item-item collaborative filtering for templates used together, content similarity for templates with similar text, and popular templates in the user's topics. Their outputs merge into a few hundred de-duplicated candidates. A ranking model, a gradient-boosted or neural model with rich features such as recency, team and context, scores every candidate. A re-ranking step removes templates the user already used, applies permissions, adds diversity and freshness, and shows the top 10. Impressions and clicks are logged and flow back as training data. Candidate generation is cheap with high recall; ranking is expensive and precise.</desc>
  <defs>
    <marker id="rts-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430.0" y="30" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Recommend from a large catalog: generate candidates, rank them, then apply rules</text>
    <rect x="30" y="150" width="130" height="86" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="95.0" y="172" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">Catalog</text>
    <text x="95.0" y="192" font-size="11.5" fill="#263e5a" text-anchor="middle">600 templates</text>
    <text x="95.0" y="209" font-size="11.5" fill="#263e5a" text-anchor="middle">millions in</text>
    <text x="95.0" y="226" font-size="11.5" fill="#263e5a" text-anchor="middle">large systems</text>
    <rect x="200" y="62" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="285.0" y="84" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">two-tower + ANN</text>
    <text x="285.0" y="104" font-size="11.5" fill="#463365" text-anchor="middle">user embedding</text>
    <path d="M160 193 C180 193 180 90 196 90" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <path d="M370 90 C392 90 392 193 408 193" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <rect x="200" y="132" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="285.0" y="154" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">item-item CF</text>
    <text x="285.0" y="174" font-size="11.5" fill="#463365" text-anchor="middle">used together</text>
    <path d="M160 193 C180 193 180 160 196 160" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <path d="M370 160 C392 160 392 193 408 193" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <rect x="200" y="202" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="285.0" y="224" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">content</text>
    <text x="285.0" y="244" font-size="11.5" fill="#463365" text-anchor="middle">similar text</text>
    <path d="M160 193 C180 193 180 230 196 230" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <path d="M370 230 C392 230 392 193 408 193" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <rect x="200" y="272" width="170" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="285.0" y="294" font-size="13" font-weight="700" fill="#463365" text-anchor="middle">popular</text>
    <text x="285.0" y="314" font-size="11.5" fill="#463365" text-anchor="middle">in your topics</text>
    <path d="M160 193 C180 193 180 300 196 300" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <path d="M370 300 C392 300 392 193 408 193" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <rect x="412" y="140" width="130" height="106" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="477.0" y="162" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">Candidates</text>
    <text x="477.0" y="182" font-size="11.5" fill="#66400f" text-anchor="middle">a few hundred,</text>
    <text x="477.0" y="199" font-size="11.5" fill="#66400f" text-anchor="middle">merged and</text>
    <text x="477.0" y="216" font-size="11.5" fill="#66400f" text-anchor="middle">de-duplicated</text>
    <path d="M542 193H566" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <rect x="570" y="130" width="130" height="126" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="635.0" y="152" font-size="13" font-weight="700" fill="#66400f" text-anchor="middle">Ranking</text>
    <text x="635.0" y="172" font-size="11.5" fill="#66400f" text-anchor="middle">GBDT or neural</text>
    <text x="635.0" y="189" font-size="11.5" fill="#66400f" text-anchor="middle">model with</text>
    <text x="635.0" y="206" font-size="11.5" fill="#66400f" text-anchor="middle">recency, team</text>
    <text x="635.0" y="223" font-size="11.5" fill="#66400f" text-anchor="middle">and context</text>
    <path d="M700 193H720" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rts-arrow)"/>
    <rect x="724" y="120" width="120" height="146" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="784.0" y="142" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">Re-ranking</text>
    <text x="784.0" y="162" font-size="11.5" fill="#294a2e" text-anchor="middle">drop used ones</text>
    <text x="784.0" y="179" font-size="11.5" fill="#294a2e" text-anchor="middle">permissions</text>
    <text x="784.0" y="196" font-size="11.5" fill="#294a2e" text-anchor="middle">diversity</text>
    <text x="784.0" y="213" font-size="11.5" fill="#294a2e" text-anchor="middle">freshness</text>
    <text x="784.0" y="230" font-size="11.5" fill="#294a2e" text-anchor="middle">top 10</text>
    <text x="200" y="356" font-size="12" font-weight="700" fill="#36424e">Candidate generation: cheap, high recall</text>
    <text x="570" y="300" font-size="12" font-weight="700" fill="#36424e">Ranking: expensive, precise</text>
    <path d="M783 266V330H95V240" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rts-arrow)"/>
    <rect x="372" y="322" width="150" height="16" fill="#f5f7fb"/>
    <text x="447" y="334" font-size="11.5" fill="#36424e" text-anchor="middle">impressions and clicks</text>
    <text x="430.0" y="386" font-size="13" fill="#40566b" text-anchor="middle">Each stage narrows the list; the logged results train the next version.</text>
  </g>
</svg>
