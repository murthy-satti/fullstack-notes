<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="crd-title crd-desc">
  <title id="crd-title">Reliability diagram: class weights distort probabilities, calibration restores them</title>
  <desc id="crd-desc">A reliability diagram for three versions of the LightGBM spam model on 6,000 test signups, using 8 bins with equal numbers of signups. The x axis is the mean predicted probability in a bin and the y axis is the fraction of signups in that bin that really were spam; a perfectly calibrated model lies on the dashed diagonal. The plain LightGBM model stays close to the diagonal. The model trained with scale_pos_weight 31.3 lies far below it: in its top bin it predicts 0.75 on average while only 0.17 are spam. After isotonic calibration on the validation set the points return to the diagonal. A table on the right lists test results: the plain model has ROC-AUC 0.899, mean predicted probability 0.032, Brier score 0.0252 and ECE 0.011; the weighted model has ROC-AUC 0.898, mean prediction 0.156, Brier 0.0789 and ECE 0.125; the calibrated model has ROC-AUC 0.894, mean prediction 0.032, Brier 0.0241 and ECE 0.002, against a true spam rate of 0.031.</desc>
  <rect width="860" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="30" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Do the spam probabilities mean what they say? (8 equal-size bins)</text>
    <rect x="90" y="74" width="300" height="300" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <path d="M90.0 374V379M85 374.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="90.0" y="392" font-size="11" fill="#36424e" text-anchor="middle">0</text>
    <text x="81" y="378.0" font-size="11" fill="#36424e" text-anchor="end">0</text>
    <path d="M165.0 374V379M85 299.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="165.0" y="392" font-size="11" fill="#36424e" text-anchor="middle">0.2</text>
    <text x="81" y="303.0" font-size="11" fill="#36424e" text-anchor="end">0.2</text>
    <path d="M240.0 374V379M85 224.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="240.0" y="392" font-size="11" fill="#36424e" text-anchor="middle">0.4</text>
    <text x="81" y="228.0" font-size="11" fill="#36424e" text-anchor="end">0.4</text>
    <path d="M315.0 374V379M85 149.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="315.0" y="392" font-size="11" fill="#36424e" text-anchor="middle">0.6</text>
    <text x="81" y="153.0" font-size="11" fill="#36424e" text-anchor="end">0.6</text>
    <path d="M390.0 374V379M85 74.0H90" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="390.0" y="392" font-size="11" fill="#36424e" text-anchor="middle">0.8</text>
    <text x="81" y="78.0" font-size="11" fill="#36424e" text-anchor="end">0.8</text>
    <text x="240.0" y="410" font-size="12" fill="#36424e" text-anchor="middle">mean predicted probability in the bin</text>
    <text x="90" y="66" font-size="12" fill="#36424e">observed spam rate in the bin</text>
    <path d="M90 374L390 74" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <text x="276" y="166" font-size="11.5" fill="#60788d" text-anchor="middle" transform="rotate(-45 276 166)">perfect calibration</text>
    <path d="M90.0 374.0 L90.2 373.5 L90.4 374.0 L90.9 372.0 L91.7 369.0 L93.2 369.0 L98.5 359.0 L170.4 308.5" stroke="#4774aa" stroke-width="2" fill="none"/>
    <circle cx="90.0" cy="374.0" r="4" fill="#4774aa"/>
    <circle cx="90.2" cy="373.5" r="4" fill="#4774aa"/>
    <circle cx="90.4" cy="374.0" r="4" fill="#4774aa"/>
    <circle cx="90.9" cy="372.0" r="4" fill="#4774aa"/>
    <circle cx="91.7" cy="369.0" r="4" fill="#4774aa"/>
    <circle cx="93.2" cy="369.0" r="4" fill="#4774aa"/>
    <circle cx="98.5" cy="359.0" r="4" fill="#4774aa"/>
    <circle cx="170.4" cy="308.5" r="4" fill="#4774aa"/>
    <path d="M90.2 374.0 L90.8 373.5 L92.2 373.5 L96.4 372.0 L106.6 370.5 L133.8 367.0 L209.3 359.0 L369.9 309.5" stroke="#b5524b" stroke-width="2" fill="none"/>
    <circle cx="90.2" cy="374.0" r="4" fill="#b5524b"/>
    <circle cx="90.8" cy="373.5" r="4" fill="#b5524b"/>
    <circle cx="92.2" cy="373.5" r="4" fill="#b5524b"/>
    <circle cx="96.4" cy="372.0" r="4" fill="#b5524b"/>
    <circle cx="106.6" cy="370.5" r="4" fill="#b5524b"/>
    <circle cx="133.8" cy="367.0" r="4" fill="#b5524b"/>
    <circle cx="209.3" cy="359.0" r="4" fill="#b5524b"/>
    <circle cx="369.9" cy="309.5" r="4" fill="#b5524b"/>
    <path d="M90.0 374.0 L90.3 373.5 L92.5 369.9 L99.5 366.6 L109.8 354.0 L177.6 295.7" stroke="#53845b" stroke-width="2" fill="none"/>
    <circle cx="90.0" cy="374.0" r="4" fill="#53845b"/>
    <circle cx="90.3" cy="373.5" r="4" fill="#53845b"/>
    <circle cx="92.5" cy="369.9" r="4" fill="#53845b"/>
    <circle cx="99.5" cy="366.6" r="4" fill="#53845b"/>
    <circle cx="109.8" cy="354.0" r="4" fill="#53845b"/>
    <circle cx="177.6" cy="295.7" r="4" fill="#53845b"/>
    <rect x="480" y="74" width="350" height="190" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="655" y="98" font-size="13" font-weight="700" fill="#36424e" text-anchor="middle">Test set, true spam rate 0.031</text>
    <text x="496" y="130" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="start">model</text>
    <text x="636" y="130" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="end">ROC-AUC</text>
    <text x="700" y="130" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="end">mean p</text>
    <text x="766" y="130" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="end">Brier</text>
    <text x="818" y="130" font-size="11.5" font-weight="700" fill="#36424e" text-anchor="end">ECE</text>
    <text x="496" y="160" font-size="12" fill="#263e5a" text-anchor="start">LightGBM</text>
    <text x="636" y="160" font-size="12" fill="#263e5a" text-anchor="end">0.899</text>
    <text x="700" y="160" font-size="12" fill="#263e5a" text-anchor="end">0.032</text>
    <text x="766" y="160" font-size="12" fill="#263e5a" text-anchor="end">0.0252</text>
    <text x="818" y="160" font-size="12" fill="#263e5a" text-anchor="end">0.011</text>
    <text x="496" y="190" font-size="12" fill="#6e2a24" text-anchor="start">+ class weights</text>
    <text x="636" y="190" font-size="12" fill="#6e2a24" text-anchor="end">0.898</text>
    <text x="700" y="190" font-size="12" fill="#6e2a24" text-anchor="end">0.156</text>
    <text x="766" y="190" font-size="12" fill="#6e2a24" text-anchor="end">0.0789</text>
    <text x="818" y="190" font-size="12" fill="#6e2a24" text-anchor="end">0.125</text>
    <text x="496" y="220" font-size="12" fill="#294a2e" text-anchor="start">+ isotonic</text>
    <text x="636" y="220" font-size="12" fill="#294a2e" text-anchor="end">0.894</text>
    <text x="700" y="220" font-size="12" fill="#294a2e" text-anchor="end">0.032</text>
    <text x="766" y="220" font-size="12" fill="#294a2e" text-anchor="end">0.0241</text>
    <text x="818" y="220" font-size="12" fill="#294a2e" text-anchor="end">0.002</text>
    <circle cx="492" cy="306" r="5" fill="#4774aa"/>
    <text x="504" y="310" font-size="12" fill="#36424e">LightGBM, no weights</text>
    <circle cx="492" cy="330" r="5" fill="#b5524b"/>
    <text x="504" y="334" font-size="12" fill="#36424e">+ scale_pos_weight 31.3</text>
    <circle cx="492" cy="354" r="5" fill="#53845b"/>
    <text x="504" y="358" font-size="12" fill="#36424e">+ isotonic calibration on validation</text>
    <text x="430" y="450" font-size="13" fill="#40566b" text-anchor="middle">Reweighting keeps the ranking but inflates scores; recalibrate on held-out data.</text>
  </g>
</svg>
