<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="ifp-title ifp-desc">
  <title id="ifp-title">Why isolation forests find anomalies: short isolation paths</title>
  <desc id="ifp-desc">Two scatter plots of the same cluster of normal points, illustrating how an isolation tree works. Left: one anomaly lies far from the cluster at the top right, and two random cuts are enough to leave it alone in its cell. Right: a normal point inside the cluster needs 8 random cuts, each splitting the current cell on a random feature at a random value, before it is alone. Each tree cuts a random feature at a random value until every point is alone; anomalies are few and different, so their average path length over all trees is short, which gives them a high anomaly score.</desc>
