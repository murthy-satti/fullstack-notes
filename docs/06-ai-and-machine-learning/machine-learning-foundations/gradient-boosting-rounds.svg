<svg xmlns="http://www.w3.org/2000/svg" width="860" height="444" viewBox="0 0 860 444" role="img" aria-labelledby="gbr-title gbr-desc">
  <title id="gbr-title">Two rounds of gradient boosting on three TaskFlow tasks</title>
  <desc id="gbr-desc">Training data: task A with an estimate of 1 hour took 2 hours, task B estimated 4 hours took 6, and task C estimated 8 hours took 10; the model predicts actual hours with squared error and a learning rate of 0.5. Round 0 predicts the mean, 6, for every task, leaving residuals of minus 4, 0 and plus 4 and a total squared error of 32. Tree 1 fits those residuals with the split estimate below 2 hours: task A's leaf outputs minus 4, and tasks B and C share a leaf of plus 2. Adding half of tree 1 gives predictions 4, 7 and 7, residuals minus 2, minus 1 and plus 3, and a squared error of 14. Tree 2 fits what is left with the split estimate below 6 hours: tasks A and B get minus 1.5 and task C gets plus 3. Adding half of tree 2 gives predictions 3.25, 6.25 and 8.5, residuals minus 1.25, minus 0.25 and plus 1.5, and a squared error of 3.875. The final model is 6 plus 0.5 times tree 1 plus 0.5 times tree 2. A bar chart shows the total squared error falling from 32 to 14 to 3.875.</desc>
  <defs>
    <marker id="gbr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="444" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="28" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">Gradient boosting by hand: predict hours to finish, learning rate 0.5</text>

    <rect x="40" y="44" width="780" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="69" font-size="12" fill="#66400f" text-anchor="middle">Training data: A (estimate 1 h, took 2 h), B (estimate 4 h, took 6 h), C (estimate 8 h, took 10 h)</text>

    <rect x="40" y="104" width="240" height="200" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g fill="#263e5a" text-anchor="middle">
      <text x="160" y="130" font-size="13" font-weight="700">Round 0: the mean</text>
      <text x="160" y="160" font-size="12">every task starts at 6 h</text>
      <text x="160" y="208" font-size="12">predictions  6 | 6 | 6</text>
      <text x="160" y="232" font-size="12">residuals  -4 | 0 | +4</text>
      <text x="160" y="280" font-size="12" font-weight="700">squared error 32</text>
    </g>

    <rect x="310" y="104" width="240" height="200" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <g fill="#463365" text-anchor="middle">
      <text x="430" y="130" font-size="13" font-weight="700">Tree 1 fits the residuals</text>
      <text x="430" y="154" font-size="12">split: estimate below 2 h?</text>
      <text x="430" y="172" font-size="12">leaves: A -4, B and C +2</text>
      <text x="430" y="190" font-size="12">add 0.5 x tree 1</text>
      <text x="430" y="214" font-size="12">predictions  4 | 7 | 7</text>
      <text x="430" y="238" font-size="12">residuals  -2 | -1 | +3</text>
      <text x="430" y="280" font-size="12" font-weight="700">squared error 14</text>
    </g>

    <rect x="580" y="104" width="240" height="200" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <g fill="#463365" text-anchor="middle">
      <text x="700" y="130" font-size="13" font-weight="700">Tree 2 fits what is left</text>
      <text x="700" y="154" font-size="12">split: estimate below 6 h?</text>
      <text x="700" y="172" font-size="12">leaves: A and B -1.5, C +3</text>
      <text x="700" y="190" font-size="12">add 0.5 x tree 2</text>
      <text x="700" y="214" font-size="11.5">predictions  3.25 | 6.25 | 8.5</text>
      <text x="700" y="238" font-size="11.5">residuals  -1.25 | -0.25 | +1.5</text>
      <text x="700" y="280" font-size="12" font-weight="700">squared error 3.875</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2">
      <path d="M282 204H306" marker-end="url(#gbr-arrow)"/>
      <path d="M552 204H576" marker-end="url(#gbr-arrow)"/>
    </g>

    <rect x="40" y="330" width="500" height="58" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="290" y="353" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="middle">Final model: F(x) = 6 + 0.5 x tree1(x) + 0.5 x tree2(x)</text>
    <text x="290" y="374" font-size="12" fill="#294a2e" text-anchor="middle">libraries add hundreds of trees with a smaller learning rate</text>

    <text x="580" y="338" font-size="12" font-weight="700" fill="#36424e">total squared error</text>
    <g font-size="11.5" fill="#36424e">
      <text x="580" y="356">round 0</text>
      <text x="580" y="374">round 1</text>
      <text x="580" y="392">round 2</text>
      <text x="796" y="356">32</text>
      <text x="712" y="374">14</text>
      <text x="664" y="392">3.875</text>
    </g>
    <g fill="#4774aa">
      <rect x="640" y="346" width="150" height="12" rx="2"/>
      <rect x="640" y="364" width="66" height="12" rx="2"/>
      <rect x="640" y="382" width="18" height="12" rx="2"/>
    </g>

    <text x="430" y="426" font-size="13" fill="#40566b" text-anchor="middle">Each tree fits the errors the earlier trees left; the learning rate keeps every step small.</text>
  </g>
</svg>
