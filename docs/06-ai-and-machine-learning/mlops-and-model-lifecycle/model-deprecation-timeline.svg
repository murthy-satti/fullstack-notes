<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="mdt-title mdt-desc">
  <title id="mdt-title">Migrating off a deprecated model within a 60-day notice</title>
  <desc id="mdt-desc">A plan for the shortest notice a provider promises, here 60 days from the deprecation notice on day 0 to the provider's shutdown on day 60. Inventory every use of the model from day 0 to day 5. Run offline evaluations on candidate models from day 3 to day 20. Fix prompts and parameters for the chosen model from day 8 to day 24. Run shadow traffic from day 21 to day 28. Run a canary at 10 percent and then 50 percent from day 29 to day 42. Move to full traffic with the old release kept as a rollback from day 43 to day 52. Keep days 52 to 60 as a buffer before the shutdown, so a late problem can still be fixed while the old model answers.</desc>
  <rect width="900" height="350" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M250 30V275"/>
      <path d="M860 30V275"/>
    </g>
    <text x="256" y="26" font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">notice</text>
    <text x="854" y="26" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="end">provider shutdown</text>

    <g font-size="12" fill="#36424e" text-anchor="start">
      <text x="24" y="55">Inventory every use</text>
      <text x="24" y="87">Offline evals on candidates</text>
      <text x="24" y="119">Fix prompts and parameters</text>
      <text x="24" y="151">Shadow traffic</text>
      <text x="24" y="183">Canary 10%, then 50%</text>
      <text x="24" y="215">Full traffic, rollback kept</text>
      <text x="24" y="247">Buffer</text>
    </g>

    <rect x="250" y="40" width="51" height="22" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="281" y="72" width="173" height="22" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="331" y="104" width="163" height="22" rx="4" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="464" y="136" width="71" height="22" rx="4" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <rect x="545" y="168" width="132" height="22" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="687" y="200" width="92" height="22" rx="4" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="779" y="232" width="81" height="22" rx="4" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>

    <path d="M250 275H860" stroke="#40566b" stroke-width="2"/>
    <g stroke="#40566b" stroke-width="2">
      <path d="M250 270V280"/>
      <path d="M402.5 270V280"/>
      <path d="M555 270V280"/>
      <path d="M707.5 270V280"/>
      <path d="M860 270V280"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="250" y="296">day 0</text>
      <text x="402.5" y="296">15</text>
      <text x="555" y="296">30</text>
      <text x="707.5" y="296">45</text>
      <text x="860" y="296" text-anchor="end">60</text>
    </g>

    <text x="450" y="330" font-size="13" fill="#40566b">Plan for the shortest notice any of your providers promises, and finish with a buffer.</text>
  </g>
</svg>
