<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="gho-title gho-desc">
  <title id="gho-title">Hosting options for open models, from least to most control</title>
  <desc id="gho-desc">Four options arranged from least control and no idle cost on the left to most control and paying while idle on the right. Per-token APIs for open models: no idle cost, the least operations work, the least control. Serverless GPU containers: per-second billing, scale to zero, cold starts. Managed model endpoints: your model on provider-managed instances, billed while running, medium operations work. GPU virtual machines or Kubernetes node pools: the lowest cost per GPU-hour, lower still when reserved or on spot, but you run everything and pay while idle. A note says the cheapest option depends on utilization: idle-free options win for spiky traffic and reserved GPUs win for steady high load.</desc>
  <defs>
    <marker id="gho-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="40" font-size="12" fill="#36424e">least control, no idle cost</text>
    <text x="860" y="40" font-size="12" text-anchor="end" fill="#36424e">most control, pays while idle</text>
    <line x1="20" y1="54" x2="858" y2="54" stroke="#40566b" stroke-width="1.6" marker-end="url(#gho-arrow)"/>

    <rect x="20" y="76" width="200" height="170" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="120" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">Per-token API</text>
    <text x="120" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">for open models</text>
    <text x="120" y="152" font-size="11.5" text-anchor="middle" fill="#463365">no idle cost</text>
    <text x="120" y="172" font-size="11.5" text-anchor="middle" fill="#463365">least operations work</text>
    <text x="120" y="192" font-size="11.5" text-anchor="middle" fill="#463365">least control</text>

    <rect x="233" y="76" width="200" height="170" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="333" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">Serverless GPU</text>
    <text x="333" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#463365">containers</text>
    <text x="333" y="152" font-size="11.5" text-anchor="middle" fill="#463365">per-second billing</text>
    <text x="333" y="172" font-size="11.5" text-anchor="middle" fill="#463365">scales to zero</text>
    <text x="333" y="192" font-size="11.5" text-anchor="middle" fill="#463365">cold starts</text>

    <rect x="446" y="76" width="200" height="170" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="546" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Managed model</text>
    <text x="546" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">endpoints</text>
    <text x="546" y="152" font-size="11.5" text-anchor="middle" fill="#263e5a">your model, managed</text>
    <text x="546" y="172" font-size="11.5" text-anchor="middle" fill="#263e5a">billed while running</text>
    <text x="546" y="192" font-size="11.5" text-anchor="middle" fill="#263e5a">medium operations work</text>

    <rect x="659" y="76" width="200" height="170" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="759" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">GPU VMs or</text>
    <text x="759" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Kubernetes pools</text>
    <text x="759" y="152" font-size="11.5" text-anchor="middle" fill="#263e5a">cheapest per GPU-hour</text>
    <text x="759" y="172" font-size="11.5" text-anchor="middle" fill="#263e5a">less when reserved or spot</text>
    <text x="759" y="192" font-size="11.5" text-anchor="middle" fill="#263e5a">you run everything</text>
    <text x="759" y="212" font-size="11.5" text-anchor="middle" fill="#263e5a">pays while idle</text>

    <rect x="20" y="266" width="839" height="58" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="440" y="290" font-size="12" text-anchor="middle" fill="#294a2e">The cheapest option depends on utilization: idle-free options win for spiky traffic,</text>
    <text x="440" y="308" font-size="12" text-anchor="middle" fill="#294a2e">and reserved GPUs win only when steady load keeps them busy.</text>

    <text x="440" y="358" font-size="13" text-anchor="middle" fill="#40566b">Move to the right only when steady traffic, privacy, or control requirements justify it.</text>
  </g>
</svg>
