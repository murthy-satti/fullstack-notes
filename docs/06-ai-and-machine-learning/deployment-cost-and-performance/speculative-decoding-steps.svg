<svg xmlns="http://www.w3.org/2000/svg" width="880" height="395" viewBox="0 0 880 395" role="img" aria-labelledby="spd-title spd-desc">
  <title id="spd-title">Speculative decoding: draft, verify, accept</title>
  <desc id="spd-desc">Step 1: a small draft model cheaply proposes four tokens, "is", "due", "on", and "Monday". Step 2: the large target model scores all four in one forward pass. Step 3: the target accepts "is", "due", and "on", rejects "Monday", and supplies its own token "Friday", so one target pass yields four tokens. A side panel explains that decode reads all weights per step, so checking four tokens costs about the same as generating one; the expected number of tokens per target pass is one minus a to the power k plus one, divided by one minus a, which gives 2.77 tokens for an acceptance rate of 0.7 with 4 drafted tokens and 1.42 tokens for 0.3; the output matches the target model's distribution.</desc>
  <defs>
    <marker id="spd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="395" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="52" font-size="13" font-weight="bold" fill="#263e5a">1. A small draft model proposes 4 tokens (cheap)</text>
    <rect x="60" y="66" width="80" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="100" y="89" font-size="13" text-anchor="middle" fill="#463365">is</text>
    <rect x="150" y="66" width="80" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="190" y="89" font-size="13" text-anchor="middle" fill="#463365">due</text>
    <rect x="240" y="66" width="80" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="280" y="89" font-size="13" text-anchor="middle" fill="#463365">on</text>
    <rect x="330" y="66" width="80" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="370" y="89" font-size="13" text-anchor="middle" fill="#463365">Monday</text>

    <line x1="235" y1="102" x2="235" y2="150" stroke="#40566b" stroke-width="1.6" marker-end="url(#spd-arrow)"/>

    <text x="40" y="140" font-size="13" font-weight="bold" fill="#263e5a">2. Large model checks</text>
    <rect x="60" y="152" width="350" height="40" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="235" y="177" font-size="13" text-anchor="middle" fill="#263e5a">checks all 4 tokens in one forward pass</text>

    <line x1="235" y1="192" x2="235" y2="246" stroke="#40566b" stroke-width="1.6" marker-end="url(#spd-arrow)"/>

    <text x="40" y="236" font-size="13" font-weight="bold" fill="#263e5a">3. Accept and fix</text>
    <rect x="60" y="248" width="80" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="100" y="271" font-size="13" text-anchor="middle" fill="#294a2e">is</text>
    <rect x="150" y="248" width="80" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="190" y="271" font-size="13" text-anchor="middle" fill="#294a2e">due</text>
    <rect x="240" y="248" width="80" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="280" y="271" font-size="13" text-anchor="middle" fill="#294a2e">on</text>
    <rect x="330" y="248" width="80" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="370" y="271" font-size="13" text-anchor="middle" fill="#6e2a24">Monday</text>
    <line x1="410" y1="266" x2="436" y2="266" stroke="#40566b" stroke-width="1.6" marker-end="url(#spd-arrow)"/>
    <rect x="440" y="248" width="80" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="480" y="271" font-size="13" text-anchor="middle" fill="#263e5a">Friday</text>
    <text x="190" y="304" font-size="12" text-anchor="middle" fill="#294a2e">accepted</text>
    <text x="370" y="304" font-size="12" text-anchor="middle" fill="#6e2a24">rejected</text>
    <text x="480" y="304" font-size="12" text-anchor="middle" fill="#263e5a">target's token</text>
    <text x="40" y="334" font-size="12.5" fill="#36424e">Result: 4 tokens from one pass of the large model instead of 1.</text>

    <rect x="560" y="40" width="290" height="270" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="576" y="64" font-size="14" font-weight="bold" fill="#263e5a">Why it is faster</text>
    <text x="576" y="90" font-size="12.5" fill="#36424e">Decode reads all weights per step,</text>
    <text x="576" y="110" font-size="12.5" fill="#36424e">so checking 4 tokens costs about</text>
    <text x="576" y="130" font-size="12.5" fill="#36424e">the same as generating 1.</text>
    <text x="576" y="162" font-size="12.5" font-weight="bold" fill="#36424e">Expected tokens per target pass:</text>
    <text x="576" y="182" font-size="12.5" fill="#36424e">(1 - a^(k+1)) / (1 - a)</text>
    <text x="576" y="202" font-size="12.5" fill="#294a2e">a = 0.7, k = 4: 2.77 tokens</text>
    <text x="576" y="222" font-size="12.5" fill="#6e2a24">a = 0.3, k = 4: 1.42 tokens</text>
    <text x="576" y="254" font-size="12.5" fill="#36424e">Output follows the target model's</text>
    <text x="576" y="274" font-size="12.5" fill="#36424e">distribution: quality is unchanged.</text>

    <text x="440" y="374" font-size="13" text-anchor="middle" fill="#40566b">One pass of the large model can yield several tokens when the draft is usually right.</text>
  </g>
</svg>
