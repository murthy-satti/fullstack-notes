<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="mrc-title mrc-desc">
  <title id="mrc-title">A cascade router from a small model to a large model</title>
  <desc id="mrc-desc">A panel states that the expected cost per request is 1 plus the escalation rate times 10, with a small model at 1 unit and a large model at 10 units; at 30% escalation that is 4 units, 60% cheaper than always using the large model; at 85% escalation it is 9.5 units and slower. The flow: a TaskFlow request reaches a decision, known simple feature; if yes, it goes to the small model, then to a second decision, valid and confident; if yes, the result is returned at a cost of 1 unit; if no, the request escalates to the large model, which adds 10 units, and the result is returned or the request fails clearly after validation. If the feature is known to be hard, the first decision sends it straight to the large model.</desc>
  <defs>
    <marker id="mrc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="22" width="840" height="88" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="36" y="46" font-size="12.5" font-weight="bold" fill="#36424e">Expected cost per request = 1 + escalation rate x 10 (small model 1 unit, large model 10 units)</text>
    <text x="36" y="70" font-size="12.5" fill="#294a2e">30% escalate: 4 units, 60% cheaper than always using the large model</text>
    <text x="36" y="94" font-size="12.5" fill="#6e2a24">85% escalate: 9.5 units and slower: route that feature straight to the large model</text>

    <rect x="20" y="170" width="120" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="80" y="191" font-size="13" font-weight="bold" text-anchor="middle" fill="#66400f">Request</text>
    <text x="80" y="208" font-size="12" text-anchor="middle" fill="#66400f">one feature</text>
    <line x1="140" y1="195" x2="158" y2="195" stroke="#40566b" stroke-width="1.6" marker-end="url(#mrc-arrow)"/>

    <path d="M220 150 L280 195 L220 240 L160 195 Z" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="220" y="192" font-size="12" text-anchor="middle" fill="#463365">known simple</text>
    <text x="220" y="208" font-size="12" text-anchor="middle" fill="#463365">feature?</text>

    <line x1="280" y1="195" x2="318" y2="195" stroke="#40566b" stroke-width="1.6" marker-end="url(#mrc-arrow)"/>
    <text x="299" y="186" font-size="11.5" text-anchor="middle" fill="#294a2e">yes</text>

    <rect x="320" y="170" width="140" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="390" y="191" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Small model</text>
    <text x="390" y="208" font-size="12" text-anchor="middle" fill="#263e5a">1 unit</text>
    <line x1="460" y1="195" x2="498" y2="195" stroke="#40566b" stroke-width="1.6" marker-end="url(#mrc-arrow)"/>

    <path d="M570 147 L640 195 L570 243 L500 195 Z" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="570" y="192" font-size="12" text-anchor="middle" fill="#463365">valid and</text>
    <text x="570" y="208" font-size="12" text-anchor="middle" fill="#463365">confident?</text>

    <line x1="640" y1="195" x2="678" y2="195" stroke="#40566b" stroke-width="1.6" marker-end="url(#mrc-arrow)"/>
    <text x="659" y="186" font-size="11.5" text-anchor="middle" fill="#294a2e">yes</text>

    <rect x="680" y="170" width="180" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="770" y="191" font-size="13" font-weight="bold" text-anchor="middle" fill="#294a2e">Return result</text>
    <text x="770" y="208" font-size="12" text-anchor="middle" fill="#294a2e">cost: 1 unit</text>

    <line x1="570" y1="243" x2="570" y2="298" stroke="#40566b" stroke-width="1.6" marker-end="url(#mrc-arrow)"/>
    <text x="580" y="275" font-size="11.5" fill="#6e2a24">no: escalate</text>

    <rect x="500" y="300" width="140" height="50" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="570" y="321" font-size="13" font-weight="bold" text-anchor="middle" fill="#263e5a">Large model</text>
    <text x="570" y="338" font-size="12" text-anchor="middle" fill="#263e5a">+10 units</text>
    <line x1="640" y1="325" x2="678" y2="325" stroke="#40566b" stroke-width="1.6" marker-end="url(#mrc-arrow)"/>

    <rect x="680" y="300" width="180" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="770" y="321" font-size="13" font-weight="bold" text-anchor="middle" fill="#294a2e">Return or fail</text>
    <text x="770" y="338" font-size="12" text-anchor="middle" fill="#294a2e">after validation</text>

    <path d="M220 240 V325 H498" fill="none" stroke="#40566b" stroke-width="1.6" marker-end="url(#mrc-arrow)"/>
    <rect x="276" y="316" width="168" height="18" rx="4" fill="#f5f7fb"/>
    <text x="360" y="329" font-size="11.5" text-anchor="middle" fill="#6e2a24">no: known hard feature</text>

    <text x="440" y="398" font-size="13" text-anchor="middle" fill="#40566b">Track the escalation rate per feature; escalated requests pay for both models and both latencies.</text>
  </g>
</svg>
