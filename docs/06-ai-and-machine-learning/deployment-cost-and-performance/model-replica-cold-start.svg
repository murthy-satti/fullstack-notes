<svg xmlns="http://www.w3.org/2000/svg" width="880" height="345" viewBox="0 0 880 345" role="img" aria-labelledby="mrs-title mrs-desc">
  <title id="mrs-title">Cold path and warm path for starting a model replica</title>
  <desc id="mrs-desc">Two timelines with illustrative timings, in minutes. Cold path on a new GPU node: provisioning the node takes about 4 minutes, pulling the engine image 2 minutes, downloading the weights 3 minutes, loading them onto the GPU 1 minute, and warm-up 1 minute, so the replica is ready after about 11 minutes. Warm path, with the node and image cached and the weights on local disk: loading takes 1 minute and warm-up 1 minute, so the replica is ready after about 2 minutes. A box lists mitigations: keep warm minimum replicas, pre-pull images, cache or stream weights, and scale on queue length early.</desc>
  <rect width="880" height="345" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="56" font-size="13" font-weight="bold" fill="#263e5a">Cold path</text>
    <text x="20" y="74" font-size="12" fill="#36424e">new GPU node</text>
    <rect x="190" y="44" width="220" height="36" rx="6" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="300" y="67" font-size="11.5" text-anchor="middle" fill="#6e2a24">new GPU node 4 min</text>
    <rect x="410" y="44" width="110" height="36" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="465" y="67" font-size="11.5" text-anchor="middle" fill="#463365">image 2 min</text>
    <rect x="520" y="44" width="165" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
    <text x="602" y="67" font-size="11.5" text-anchor="middle" fill="#263e5a">weights 3 min</text>
    <rect x="685" y="44" width="55" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="712" y="67" font-size="11.5" text-anchor="middle" fill="#66400f">load 1</text>
    <rect x="740" y="44" width="55" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="767" y="67" font-size="11.5" text-anchor="middle" fill="#66400f">warm 1</text>
    <text x="803" y="67" font-size="13" font-weight="bold" fill="#6e2a24">11 min</text>

    <text x="20" y="128" font-size="13" font-weight="bold" fill="#263e5a">Warm path</text>
    <text x="20" y="146" font-size="12" fill="#36424e">cached image and</text>
    <text x="20" y="162" font-size="12" fill="#36424e">weights on local disk</text>
    <rect x="190" y="116" width="55" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="217" y="139" font-size="11.5" text-anchor="middle" fill="#66400f">load 1</text>
    <rect x="245" y="116" width="55" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="272" y="139" font-size="11.5" text-anchor="middle" fill="#66400f">warm 1</text>
    <text x="308" y="139" font-size="13" font-weight="bold" fill="#294a2e">2 min</text>

    <line x1="190" y1="196" x2="850" y2="196" stroke="#8a96a3" stroke-width="1"/>
    <line x1="190" y1="192" x2="190" y2="200" stroke="#8a96a3"/>
    <line x1="300" y1="192" x2="300" y2="200" stroke="#8a96a3"/>
    <line x1="410" y1="192" x2="410" y2="200" stroke="#8a96a3"/>
    <line x1="520" y1="192" x2="520" y2="200" stroke="#8a96a3"/>
    <line x1="630" y1="192" x2="630" y2="200" stroke="#8a96a3"/>
    <line x1="740" y1="192" x2="740" y2="200" stroke="#8a96a3"/>
    <line x1="850" y1="192" x2="850" y2="200" stroke="#8a96a3"/>
    <text x="190" y="216" font-size="12" text-anchor="middle" fill="#36424e">0</text>
    <text x="300" y="216" font-size="12" text-anchor="middle" fill="#36424e">2</text>
    <text x="410" y="216" font-size="12" text-anchor="middle" fill="#36424e">4</text>
    <text x="520" y="216" font-size="12" text-anchor="middle" fill="#36424e">6</text>
    <text x="630" y="216" font-size="12" text-anchor="middle" fill="#36424e">8</text>
    <text x="740" y="216" font-size="12" text-anchor="middle" fill="#36424e">10</text>
    <text x="850" y="216" font-size="12" text-anchor="middle" fill="#36424e">12 min</text>

    <rect x="20" y="240" width="840" height="44" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="440" y="267" font-size="12" text-anchor="middle" fill="#294a2e">Mitigations: warm minimum replicas, pre-pulled images, cached or streamed weights, early scaling on queue length</text>

    <text x="440" y="322" font-size="13" text-anchor="middle" fill="#40566b">Illustrative timings: measure your own cold start, then size probes and scaling lead time from it.</text>
  </g>
</svg>
