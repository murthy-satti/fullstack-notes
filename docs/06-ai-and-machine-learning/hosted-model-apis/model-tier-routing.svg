<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="mtr-title mtr-desc">
  <title id="mtr-title">Routing TaskFlow features to model tiers</title>
  <desc id="mtr-desc">Four TaskFlow features on the left, parse task, project Q and A, meeting summary and agent plan, all send requests to a tier router in the middle, which uses a feature-to-tier table and validates outputs. The router sends parse-task requests to the fast tier (small, fastest, cheapest), project Q and A and meeting summaries to the standard tier (balanced quality, speed and cost), and agent planning to the deep tier (strongest reasoning, slowest, most expensive). A dashed arrow shows escalation from the fast tier to the standard tier when the fast tier's output fails validation. Below the tiers, a box notes that each tier has an evaluated fallback route at another provider for provider errors.</desc>
  <defs>
    <marker id="mtr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="mtr-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="50" width="180" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="110" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Parse task</text>
    <rect x="20" y="120" width="180" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="110" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Project Q&amp;A</text>
    <rect x="20" y="190" width="180" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="110" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Meeting summary</text>
    <rect x="20" y="260" width="180" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="110" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Agent plan</text>

    <g stroke="#40566b" stroke-width="1.6" fill="none">
      <path d="M200 75 L268 160" marker-end="url(#mtr-arrow)"/>
      <path d="M200 145 L268 170" marker-end="url(#mtr-arrow)"/>
      <path d="M200 215 L268 190" marker-end="url(#mtr-arrow)"/>
      <path d="M200 285 L268 200" marker-end="url(#mtr-arrow)"/>
    </g>

    <rect x="270" y="125" width="190" height="110" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="365" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Tier router</text>
    <text x="365" y="182" text-anchor="middle" font-size="11.5" fill="#463365">feature-to-tier table</text>
    <text x="365" y="200" text-anchor="middle" font-size="11.5" fill="#463365">validate each output</text>
    <text x="365" y="218" text-anchor="middle" font-size="11.5" fill="#463365">escalate on failure</text>

    <g stroke="#40566b" stroke-width="1.6" fill="none">
      <path d="M460 150 L598 78" marker-end="url(#mtr-arrow)"/>
      <path d="M460 180 L598 188" marker-end="url(#mtr-arrow)"/>
      <path d="M460 210 L598 296" marker-end="url(#mtr-arrow)"/>
    </g>
    <rect x="478" y="93" width="80" height="15" fill="#f5f7fb"/>
    <text x="518" y="104" text-anchor="middle" font-size="11.5" fill="#36424e">parse task</text>
    <rect x="474" y="166" width="104" height="15" fill="#f5f7fb"/>
    <text x="526" y="177" text-anchor="middle" font-size="11.5" fill="#36424e">Q&amp;A, summaries</text>
    <rect x="490" y="243" width="76" height="15" fill="#f5f7fb"/>
    <text x="528" y="254" text-anchor="middle" font-size="11.5" fill="#36424e">agent plan</text>

    <rect x="600" y="46" width="260" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="730" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Fast tier</text>
    <text x="730" y="92" text-anchor="middle" font-size="11.5" fill="#263e5a">small model: fastest, cheapest</text>
    <rect x="600" y="156" width="260" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="730" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Standard tier</text>
    <text x="730" y="202" text-anchor="middle" font-size="11.5" fill="#263e5a">balanced quality, speed and cost</text>
    <rect x="600" y="266" width="260" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="730" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Deep tier</text>
    <text x="730" y="312" text-anchor="middle" font-size="11.5" fill="#263e5a">strongest reasoning; slowest, priciest</text>

    <line x1="840" y1="110" x2="840" y2="154" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mtr-ret)"/>
    <rect x="696" y="125" width="138" height="15" fill="#f5f7fb"/>
    <text x="830" y="136" text-anchor="end" font-size="11.5" fill="#36424e">invalid output: escalate</text>

    <rect x="600" y="352" width="260" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="730" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#463365">Each tier: an evaluated fallback</text>
    <text x="730" y="387" text-anchor="middle" font-size="11.5" fill="#463365">at another provider, for provider errors</text>
    <line x1="730" y1="330" x2="730" y2="350" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mtr-ret)"/>

    <text x="440" y="424" text-anchor="middle" font-size="13" fill="#40566b">Send most traffic to the cheapest tier that passes its evaluation; escalate on evidence, not by default.</text>
  </g>
</svg>
