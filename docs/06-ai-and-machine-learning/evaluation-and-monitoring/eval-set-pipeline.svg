<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="esp-title esp-desc">
  <title id="esp-title">From case sources to a released evaluation set</title>
  <desc id="esp-desc">Five sources at the top: hand-written cases from the spec, production traces from consenting users, failure signals such as thumbs-down and edited drafts, incidents and bug reports, and synthetic variations for thin slices. All of them flow into the same seven stages. One, scrub personal data, replacing emails and phone numbers with placeholders. Two, deduplicate by hashing the normalized, scrubbed text. Three, draft slice tags with simple rules that labelers confirm. Four, label: write expectations, double-label a share, measure kappa, and adjudicate. Five, review coverage and fill thin slices to a minimum count. Six, assign the dev split for tuning or the test split for release decisions. Seven, release a version with a manifest of the file hash and counts, such as task-assistant at 1.3.0. Finally, every eval run records the dataset version and its hash. A rule at the bottom: a released case is never edited in place; it is retired with a reason and a new case is added with a new id.</desc>
  <defs>
    <marker id="esp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="880" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke="#bd7a20" stroke-width="2" fill="#fff0d9">
      <rect x="22" y="24" width="160" height="60" rx="8"/>
      <rect x="191" y="24" width="160" height="60" rx="8"/>
      <rect x="360" y="24" width="160" height="60" rx="8"/>
      <rect x="529" y="24" width="160" height="60" rx="8"/>
      <rect x="698" y="24" width="160" height="60" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#66400f">
      <text x="102" y="49">Hand-written</text>
      <text x="271" y="49">Production traces</text>
      <text x="440" y="49">Failure signals</text>
      <text x="609" y="49">Incidents</text>
      <text x="778" y="49">Synthetic</text>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="102" y="69">from the spec</text>
      <text x="271" y="69">consented, sampled</text>
      <text x="440" y="69">thumbs-down, edits</text>
      <text x="609" y="69">and bug reports</text>
      <text x="778" y="69">for thin slices</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M102 84V108M271 84V108M440 84V108M609 84V108M778 84V108M102 108H778"/>
      <path d="M119 108V146" marker-end="url(#esp-arrow)"/>
      <path d="M217 187H233" marker-end="url(#esp-arrow)"/>
      <path d="M431 187H447" marker-end="url(#esp-arrow)"/>
      <path d="M645 187H661" marker-end="url(#esp-arrow)"/>
      <path d="M761 224V258" marker-end="url(#esp-arrow)"/>
      <path d="M663 299H647" marker-end="url(#esp-arrow)"/>
      <path d="M449 299H433" marker-end="url(#esp-arrow)"/>
      <path d="M235 299H219" marker-end="url(#esp-arrow)"/>
    </g>

    <g stroke="#8062a8" stroke-width="2" fill="#f0e9fb">
      <rect x="21" y="150" width="196" height="74" rx="8"/>
      <rect x="235" y="150" width="196" height="74" rx="8"/>
      <rect x="449" y="150" width="196" height="74" rx="8"/>
      <rect x="663" y="150" width="196" height="74" rx="8"/>
      <rect x="663" y="262" width="196" height="74" rx="8"/>
      <rect x="449" y="262" width="196" height="74" rx="8"/>
    </g>
    <rect x="235" y="262" width="196" height="74" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="21" y="262" width="196" height="74" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>

    <g font-size="13" font-weight="700" fill="#463365">
      <text x="119" y="176">1. Scrub PII</text>
      <text x="333" y="176">2. Deduplicate</text>
      <text x="547" y="176">3. Draft slice tags</text>
      <text x="761" y="176">4. Label</text>
      <text x="761" y="288">5. Review coverage</text>
      <text x="547" y="288">6. Assign split</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="119" y="196">emails and phones</text>
      <text x="119" y="212">become placeholders</text>
      <text x="333" y="196">hash the normalized,</text>
      <text x="333" y="212">scrubbed text</text>
      <text x="547" y="196">simple rules;</text>
      <text x="547" y="212">labelers confirm</text>
      <text x="761" y="196">double-label a share,</text>
      <text x="761" y="212">measure kappa, adjudicate</text>
      <text x="761" y="308">fill thin slices</text>
      <text x="761" y="324">to a minimum count</text>
      <text x="547" y="308">dev: tuning prompts</text>
      <text x="547" y="324">test: release decisions</text>
    </g>
    <text x="333" y="288" font-size="13" font-weight="700" fill="#263e5a">7. Release a version</text>
    <text x="333" y="308" font-size="11.5" fill="#263e5a">manifest: hash and counts</text>
    <text x="333" y="324" font-size="11.5" fill="#263e5a">task-assistant@1.3.0</text>
    <text x="119" y="288" font-size="13" font-weight="700" fill="#294a2e">Eval runs</text>
    <text x="119" y="308" font-size="11.5" fill="#294a2e">record dataset@version</text>
    <text x="119" y="324" font-size="11.5" fill="#294a2e">and its hash</text>

    <rect x="21" y="360" width="838" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="440" y="387" font-size="12.5" fill="#6e2a24">A released case is never edited in place: retire it with a reason and add a new case with a new id.</text>

    <text x="440" y="438" font-size="13" fill="#40566b">Every source passes the same cleaning and labeling steps before it can change a score.</text>
  </g>
</svg>
