<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="tcd-title tcd-desc">
  <title id="tcd-title">Token and cost dashboard sketch</title>
  <desc id="tcd-desc">A sketch of a TaskFlow LLM dashboard with four panels, using illustrative data. Top left, tokens per hour by feature as stacked bars for six hours for the assistant, project Q&amp;A, meeting summaries, and the agent; the agent's share grows fastest. Top right, p95 latency by feature as lines over the same hours, with the agent highest at about 4 seconds and the assistant lowest at about 1 second. Bottom left, estimated cost per day by feature as horizontal bars: project Q&amp;A costs most because of long retrieved context, then the agent, then summaries, then the assistant. Bottom right, the thumbs-down share by prompt version: version 6 at 7 percent and version 7 at 4 percent. A note says the dashboard reads only low-cardinality labels: feature, operation, provider, model, and prompt version. Each panel answers one question; costs come from tokens times a price table kept in configuration.</desc>
