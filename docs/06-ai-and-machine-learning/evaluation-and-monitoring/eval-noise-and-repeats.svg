<svg xmlns="http://www.w3.org/2000/svg" width="870" height="420" viewBox="0 0 870 420" role="img" aria-labelledby="enr-title enr-desc">
  <title id="enr-title">Measuring through nondeterminism</title>
  <desc id="enr-desc">Two panels. Left panel, one case run five times with outcomes pass, pass, fail, pass, pass. The mean pass rate is 4 of 5, or 80 percent. pass at 5, at least one success, is a pass. pass hat 5, all five succeed, is a fail. Report pass hat k or the mean for users; pass at k measures what is possible. Right panel, the same suite run twice with no code change: on a scale from 80 to 96 percent, a shaded noise band from 87.0 to 94.6 percent shows the 95 percent margin of plus or minus 3.8 points for 240 cases at about 90 percent. Run A scores 90.8 percent and run B 88.3 percent, both inside the band. Below, a paired comparison of the same cases asks instead whether regressions and fixes are balanced: 16 regressions against 3 fixes gives McNemar p of 0.004, which is not chance. Measure through the noise: repeat, aggregate deliberately, and compare pairs.</desc>
  <rect width="870" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="24" y="20" width="400" height="344" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <rect x="446" y="20" width="400" height="344" rx="8" fill="none" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="40" y="48" font-size="14" font-weight="700" fill="#36424e">One case, five runs</text>
    <text x="462" y="48" font-size="14" font-weight="700" fill="#36424e">Same suite, two runs, no code change</text>

    <g stroke-width="2">
      <rect x="40" y="70" width="64" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="114" y="70" width="64" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="188" y="70" width="64" height="50" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="262" y="70" width="64" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="336" y="70" width="64" height="50" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g text-anchor="middle" font-size="11.5" fill="#36424e">
      <text x="72" y="88">run 1</text>
      <text x="146" y="88">run 2</text>
      <text x="220" y="88">run 3</text>
      <text x="294" y="88">run 4</text>
      <text x="368" y="88">run 5</text>
    </g>
    <g text-anchor="middle" font-size="13" font-weight="700">
      <text x="72" y="108" fill="#294a2e">pass</text>
      <text x="146" y="108" fill="#294a2e">pass</text>
      <text x="220" y="108" fill="#6e2a24">fail</text>
      <text x="294" y="108" fill="#294a2e">pass</text>
      <text x="368" y="108" fill="#294a2e">pass</text>
    </g>

    <rect x="40" y="146" width="360" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="56" y="171" font-size="12.5" fill="#263e5a">mean pass rate: 4 of 5 = 80%</text>
    <rect x="40" y="196" width="360" height="40" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="56" y="221" font-size="12.5" fill="#294a2e">pass@5, at least one success: pass</text>
    <rect x="40" y="246" width="360" height="40" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="56" y="271" font-size="12.5" fill="#6e2a24">pass^5, all five succeed: fail</text>
    <text x="40" y="318" font-size="12" fill="#36424e">Report pass^k or the mean for users;</text>
    <text x="40" y="336" font-size="12" fill="#36424e">pass@k only measures what is possible.</text>

    <rect x="618.8" y="104" width="161.5" height="44" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M470 126H810" stroke="#8a96a3" stroke-width="1.5"/>
    <g stroke="#8a96a3" stroke-width="1.5">
      <path d="M470 120V132M555 120V132M640 120V132M725 120V132M810 120V132"/>
    </g>
    <g text-anchor="middle" font-size="11.5" fill="#36424e">
      <text x="470" y="200">80%</text>
      <text x="555" y="200">84%</text>
      <text x="640" y="200">88%</text>
      <text x="725" y="200">92%</text>
      <text x="810" y="200">96%</text>
    </g>
    <path d="M699.5 92V160" stroke="#4774aa" stroke-width="3"/>
    <path d="M646.4 92V160" stroke="#4774aa" stroke-width="3"/>
    <text x="699.5" y="86" font-size="12" font-weight="700" fill="#263e5a" text-anchor="start">run A 90.8%</text>
    <text x="646.4" y="176" font-size="12" font-weight="700" fill="#263e5a" text-anchor="end">run B 88.3%</text>
    <text x="700" y="176" font-size="11.5" fill="#66400f" text-anchor="start">95% noise band</text>
    <text x="462" y="228" font-size="12" fill="#36424e">240 cases at about 90%: the 95% margin is about</text>
    <text x="462" y="246" font-size="12" fill="#36424e">plus or minus 3.8 points, so B is not a regression.</text>

    <rect x="462" y="262" width="368" height="92" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="478" y="284" font-size="13" font-weight="700" fill="#294a2e">Compare pairs instead</text>
    <text x="478" y="304" font-size="12" fill="#294a2e">same cases on both versions:</text>
    <text x="478" y="322" font-size="12" fill="#294a2e">16 regressions against 3 fixes</text>
    <text x="478" y="340" font-size="12" fill="#294a2e">McNemar p = 0.004: unbalanced, not chance</text>

    <text x="435" y="396" font-size="13" fill="#40566b" text-anchor="middle">Measure through the noise: repeat, aggregate deliberately, and compare pairs.</text>
  </g>
</svg>
