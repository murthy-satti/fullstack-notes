<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="cdm-title cdm-desc">
  <title id="cdm-title">How schema-constrained decoding chooses the next token</title>
  <desc id="cdm-desc">Top row: the JSON Schema says priority is one of low, medium, or high; the provider compiles it into a grammar, a state machine, once per schema and caches it, so the first request with a new schema can be slower. Middle row, one decoding step: the output so far is an opening brace, intent create_task, and the start of the priority string. The model scores possible next tokens: high 30 percent, urgent 25 percent, medium 18 percent, ASAP 15 percent, and low 12 percent. The grammar allows high, medium, and low, and blocks urgent and ASAP because the schema does not list them. The remaining scores are renormalized and sampled: high 50 percent, medium 30 percent, low 20 percent. Bottom: high is picked, the output now ends with priority high, and the grammar expects a comma or a closing brace next. The model still chooses; the grammar only removes choices the schema forbids.</desc>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <defs>
    <marker id="cdm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b">One decoding step with a schema: the grammar removes forbidden tokens before sampling</text>

    <g stroke-width="1.5">
      <rect x="24" y="46" width="270" height="62" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="334" y="46" width="270" height="62" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <text x="38" y="70" font-size="14" font-weight="700" fill="#263e5a">JSON Schema</text>
    <text x="38" y="92" font-size="12" fill="#36424e" font-family="Courier New, monospace">priority: low | medium | high</text>
    <text x="348" y="70" font-size="14" font-weight="700" fill="#463365">Grammar (a state machine)</text>
    <text x="348" y="92" font-size="11.5" fill="#36424e">compiled once per schema, then cached</text>
    <path d="M294 77H332" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cdm-arrow)"/>
    <text x="626" y="72" font-size="11.5" fill="#60788d">The first request with a new schema</text>
    <text x="626" y="89" font-size="11.5" fill="#60788d">can be slower while it compiles.</text>

    <g stroke-width="1.5">
      <rect x="24" y="134" width="200" height="196" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="244" y="134" width="200" height="196" rx="8" fill="#ffffff" stroke="#8a96a3"/>
      <rect x="464" y="134" width="180" height="196" rx="8" fill="#ffffff" stroke="#8a96a3"/>
      <rect x="664" y="134" width="192" height="196" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="38" y="160" fill="#66400f">Output so far</text>
      <text x="258" y="160" fill="#36424e">Next-token scores</text>
      <text x="478" y="160" fill="#36424e">Schema allows?</text>
      <text x="678" y="160" fill="#294a2e">Sample from the rest</text>
    </g>
    <g font-size="12" fill="#36424e" font-family="Courier New, monospace">
      <text x="38" y="196">{"intent":</text>
      <text x="38" y="216">"create_task",</text>
      <text x="38" y="236">"priority":"</text>
    </g>
    <text x="38" y="300" font-size="11.5" fill="#66400f">the next token is a priority</text>

    <g font-size="12" fill="#36424e">
      <text x="258" y="200">high</text>
      <text x="258" y="226">urgent</text>
      <text x="258" y="252">medium</text>
      <text x="258" y="278">ASAP</text>
      <text x="258" y="304">low</text>
    </g>
    <g fill="#8a96a3">
      <rect x="312" y="190" width="90" height="12" rx="2"/>
      <rect x="312" y="216" width="75" height="12" rx="2"/>
      <rect x="312" y="242" width="54" height="12" rx="2"/>
      <rect x="312" y="268" width="45" height="12" rx="2"/>
      <rect x="312" y="294" width="36" height="12" rx="2"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="408" y="200">30%</text>
      <text x="393" y="226">25%</text>
      <text x="372" y="252">18%</text>
      <text x="363" y="278">15%</text>
      <text x="354" y="304">12%</text>
    </g>

    <g font-size="12">
      <text x="478" y="200" fill="#294a2e">high: allowed</text>
      <text x="478" y="226" fill="#6e2a24">urgent: blocked</text>
      <text x="478" y="252" fill="#294a2e">medium: allowed</text>
      <text x="478" y="278" fill="#6e2a24">ASAP: blocked</text>
      <text x="478" y="304" fill="#294a2e">low: allowed</text>
    </g>

    <g font-size="12" fill="#294a2e">
      <text x="678" y="200">high</text>
      <text x="678" y="252">medium</text>
      <text x="678" y="304">low</text>
    </g>
    <g fill="#53845b">
      <rect x="734" y="190" width="80" height="12" rx="2"/>
      <rect x="734" y="242" width="48" height="12" rx="2"/>
      <rect x="734" y="294" width="32" height="12" rx="2"/>
    </g>
    <g font-size="11.5" fill="#294a2e">
      <text x="820" y="200">50%</text>
      <text x="788" y="252">30%</text>
      <text x="772" y="304">20%</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cdm-arrow)">
      <path d="M224 232H242"/>
      <path d="M444 232H462"/>
      <path d="M644 232H662"/>
    </g>

    <rect x="24" y="352" width="832" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="38" y="379" font-size="12" fill="#294a2e">Picked "high": the output now ends with "priority":"high" and the grammar expects a comma or a closing brace next.</text>

    <text x="440" y="424" font-size="13" fill="#40566b" text-anchor="middle">The model still chooses; the grammar only removes choices the schema forbids.</text>
  </g>
</svg>
