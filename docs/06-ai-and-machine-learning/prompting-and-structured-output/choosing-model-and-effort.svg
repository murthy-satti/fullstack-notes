<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="cme-title cme-desc">
  <title id="cme-title">Choosing between a fast model and a reasoning model, and the effort level</title>
  <desc id="cme-desc">A decision flow for one feature. Start with the feature's task. First question: does it need multi-step reasoning, such as planning under constraints, math, code, or reconciling conflicting information? If not, use a fast model with reasoning off or minimal, as for drafts, extraction, classification, and summaries. If it does, the second question: must the user see an answer within a few seconds? If yes, split the task or precompute so that most of it runs in the background, or use a reasoning model at low effort and accept the quality the evals show. If no, use a reasoning model starting at low or medium effort. Then run an effort sweep on the evaluation set and pick the lowest effort that meets the pass rate and the 95th percentile latency budget, and check answers with code wherever a rule can be written down. Reasoning is a per-feature setting chosen by measurement, not a global upgrade.</desc>
  <rect width="880" height="470" rx="14" fill="#f5f7fb"/>
  <defs>
    <marker id="cme-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b">Picking the model type and the effort level for one feature</text>

    <g stroke-width="1.5">
      <rect x="24" y="50" width="220" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <path d="M294 75L404 45L514 75L404 105Z" fill="#ffffff" stroke="#8a96a3"/>
      <rect x="560" y="40" width="296" height="76" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <path d="M294 185L404 155L514 185L404 215Z" fill="#ffffff" stroke="#8a96a3"/>
      <rect x="560" y="140" width="296" height="96" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="254" y="258" width="300" height="50" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="254" y="334" width="300" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="590" y="334" width="266" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>

    <text x="38" y="73" font-size="14" font-weight="700" fill="#66400f">A feature's task</text>
    <text x="38" y="91" font-size="11.5" fill="#36424e">for example, plan next week's work</text>

    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="middle">
      <text x="404" y="72">Multi-step</text>
      <text x="404" y="88">reasoning?</text>
      <text x="404" y="182">Answer needed</text>
      <text x="404" y="198">in seconds?</text>
    </g>

    <text x="574" y="64" font-size="14" font-weight="700" fill="#294a2e">Fast model, reasoning off or minimal</text>
    <text x="574" y="85" font-size="11.5" fill="#36424e">drafts, extraction, classification,</text>
    <text x="574" y="102" font-size="11.5" fill="#36424e">summaries</text>

    <text x="574" y="164" font-size="14" font-weight="700" fill="#66400f">Split the task or move it offline</text>
    <text x="574" y="185" font-size="11.5" fill="#36424e">precompute in the background, or use</text>
    <text x="574" y="202" font-size="11.5" fill="#36424e">low effort and accept what the evals</text>
    <text x="574" y="219" font-size="11.5" fill="#36424e">show for quality</text>

    <text x="268" y="280" font-size="14" font-weight="700" fill="#463365">Reasoning model</text>
    <text x="268" y="298" font-size="11.5" fill="#36424e">start at low or medium effort</text>

    <text x="268" y="356" font-size="14" font-weight="700" fill="#263e5a">Effort sweep on the eval set</text>
    <text x="268" y="375" font-size="11.5" fill="#36424e">lowest effort that meets the pass rate</text>
    <text x="268" y="391" font-size="11.5" fill="#36424e">and the p95 latency budget</text>

    <text x="604" y="356" font-size="14" font-weight="700" fill="#263e5a">Verify with code</text>
    <text x="604" y="375" font-size="11.5" fill="#36424e">check every rule you can write</text>
    <text x="604" y="391" font-size="11.5" fill="#36424e">down, whatever the effort</text>

    <g fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#cme-arrow)">
      <path d="M244 75H292"/>
      <path d="M514 75H558"/>
      <path d="M404 105V153"/>
      <path d="M514 185H558"/>
      <path d="M404 215V256"/>
      <path d="M404 308V332"/>
      <path d="M554 366H588"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="530" y="68">no</text>
      <text x="412" y="134">yes</text>
      <text x="528" y="178">yes</text>
      <text x="412" y="240">no</text>
    </g>

    <text x="440" y="440" font-size="13" fill="#40566b" text-anchor="middle">Reasoning is a per-feature setting chosen by measurement, not a global upgrade.</text>
  </g>
</svg>
