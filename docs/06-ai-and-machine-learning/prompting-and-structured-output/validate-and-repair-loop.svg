<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="vrl-title vrl-desc">
  <title id="vrl-title">Validate and repair loop for structured output</title>
  <desc id="vrl-desc">Step 1 calls the model with the schema and the messages. A decision asks how the model stopped. If it refused, explain it to the user and never repair it. If it was cut off by the token limit, fail fast or retry with a higher limit. If it completed, step 2 checks the shape: zod parses the JSON again, even when the provider enforced the schema. Step 3 checks business rules: a real date that is not in the past, a real project member, and at most five tags. A decision asks whether there are any problems. If not, the draft is returned for review, and nothing is saved until the user confirms. If there are problems, a second decision asks whether a repair attempt is left. If yes, step 4 adds the answer and the exact problems to the messages and calls the model again, looping back to step 1. If no repair is left, the feature falls back to the manual form, prefilled with the valid fields. Retry only what a retry can fix: rule violations, never refusals or truncation.</desc>
  <rect width="880" height="540" rx="14" fill="#f5f7fb"/>
  <defs>
    <marker id="vrl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#40566b">Validate, repair once, then fall back: the loop around every structured-output call</text>

    <g stroke-width="1.5">
      <rect x="230" y="44" width="280" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="550" y="104" width="306" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="550" y="156" width="306" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="230" y="208" width="280" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="290" width="280" height="56" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="550" y="372" width="306" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="24" y="232" width="190" height="86" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="24" y="452" width="456" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <path d="M300 150L370 118L440 150L370 182Z" fill="#ffffff" stroke="#8a96a3"/>
      <path d="M300 396L370 364L440 396L370 428Z" fill="#ffffff" stroke="#8a96a3"/>
      <path d="M60 396L120 364L180 396L120 428Z" fill="#ffffff" stroke="#8a96a3"/>
    </g>

    <g font-size="14" font-weight="700">
      <text x="244" y="68" fill="#66400f">1. Call the model</text>
      <text x="244" y="232" fill="#263e5a">2. Check the shape</text>
      <text x="244" y="314" fill="#263e5a">3. Check business rules</text>
      <text x="38" y="256" fill="#463365">4. Repair</text>
    </g>
    <g font-size="13" font-weight="700">
      <text x="564" y="123" fill="#6e2a24">Refused</text>
      <text x="564" y="175" fill="#6e2a24">Cut off by the token limit</text>
      <text x="564" y="392" fill="#294a2e">Return the draft for review</text>
      <text x="38" y="471" fill="#6e2a24">Fall back to the manual form</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="244" y="89">with the schema and the messages</text>
      <text x="564" y="140">Explain it to the user; never repair it</text>
      <text x="564" y="192">Fail fast or retry with a higher limit</text>
      <text x="244" y="253">zod parses the JSON again</text>
      <text x="244" y="335">real date, real member, at most 5 tags</text>
      <text x="564" y="410">Nothing is saved until the user confirms</text>
      <text x="38" y="276">Add the answer and the</text>
      <text x="38" y="293">exact problems to the</text>
      <text x="38" y="310">messages; call again</text>
      <text x="38" y="488">prefilled with the fields that passed the checks</text>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="middle">
      <text x="370" y="147">Stopped</text>
      <text x="370" y="163">how?</text>
      <text x="370" y="393">Any</text>
      <text x="370" y="409">problems?</text>
      <text x="120" y="393">Repair</text>
      <text x="120" y="409">left?</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#vrl-arrow)">
      <path d="M370 100V116"/>
      <path d="M440 150H500V126H548"/>
      <path d="M500 150V178H548"/>
      <path d="M370 182V206"/>
      <path d="M370 264V288"/>
      <path d="M370 346V362"/>
      <path d="M440 396H548"/>
      <path d="M300 396H182"/>
      <path d="M120 364V320"/>
      <path d="M120 232V72H228"/>
      <path d="M120 428V450"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="378" y="199">complete</text>
      <text x="494" y="388" text-anchor="middle">no</text>
      <text x="241" y="388" text-anchor="middle">yes</text>
      <text x="128" y="346">yes</text>
      <text x="128" y="443">no</text>
    </g>

    <text x="440" y="524" font-size="13" fill="#40566b" text-anchor="middle">Retry only what a retry can fix: rule violations, never refusals or truncation.</text>
  </g>
</svg>
