<svg xmlns="http://www.w3.org/2000/svg" width="780" height="530" viewBox="0 0 780 530" role="img" aria-labelledby="ptd-title ptd-desc">
  <title id="ptd-title">How readUpload blocks path traversal</title>
  <desc id="ptd-desc">The user-supplied name is passed to path.resolve(UPLOAD_ROOT, name), which turns any ../ segments into a real absolute path. If the result starts with UPLOAD_ROOT plus the path separator, the file is read; otherwise an Error("Invalid file path") is thrown and nothing is read. With UPLOAD_ROOT set to /app/uploads, report.pdf resolves inside the folder and is allowed, ../../etc/passwd resolves to /etc/passwd and is rejected, and ../uploads-evil/x resolves to /app/uploads-evil/x and is rejected only because the separator is part of the check.</desc>
  <defs>
    <marker id="ptd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="530" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="130" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="45" font-size="14" font-weight="700" fill="#36424e">user sends a file name</text>

    <rect x="100" y="80" width="300" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="250" y="101" font-size="14" font-weight="700" fill="#263e5a">path.resolve(UPLOAD_ROOT, name)</text>
    <text x="250" y="120" font-size="11.5" fill="#263e5a">turns ../ segments into a real path</text>

    <path d="M250 156 380 196 250 236 120 196z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="193" font-size="12" font-weight="700" fill="#36424e">starts with</text>
    <text x="250" y="207" font-size="12" font-weight="700" fill="#36424e">UPLOAD_ROOT + sep?</text>

    <rect x="470" y="172" width="286" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="613" y="192" font-size="14" font-weight="700" fill="#6b241c">throw new Error(...)</text>
    <text x="613" y="209" font-size="11.5" fill="#6b241c">"Invalid file path": nothing is read</text>

    <rect x="110" y="262" width="280" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="250" y="282" font-size="14" font-weight="700" fill="#294a2e">fs.readFile(target)</text>
    <text x="250" y="299" font-size="11.5" fill="#294a2e">the file is inside uploads/</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M250 60V78" marker-end="url(#ptd-arrow)"/>
      <path d="M250 132V154" marker-end="url(#ptd-arrow)"/>
      <path d="M380 196H468" marker-end="url(#ptd-arrow)"/>
      <path d="M250 236V260" marker-end="url(#ptd-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="424" y="188">no</text>
      <text x="262" y="252" text-anchor="start">yes</text>
    </g>

    <rect x="24" y="336" width="732" height="152" rx="10" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="40" y="360" font-size="13" font-weight="700" fill="#36424e" text-anchor="start">Examples with UPLOAD_ROOT = /app/uploads</text>
    <g font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="40" y="386">name sent</text>
      <text x="250" y="386">path.resolve result</text>
      <text x="520" y="386">outcome</text>
    </g>
    <line x1="40" y1="394" x2="740" y2="394" stroke="#dfe5ee" stroke-width="1.5"/>
    <g font-size="12.5" text-anchor="start">
      <text x="40" y="418" fill="#36424e">report.pdf</text>
      <text x="250" y="418" fill="#36424e">/app/uploads/report.pdf</text>
      <text x="520" y="418" font-weight="700" fill="#294a2e">allowed: inside the folder</text>
      <text x="40" y="444" fill="#36424e">../../etc/passwd</text>
      <text x="250" y="444" fill="#36424e">/etc/passwd</text>
      <text x="520" y="444" font-weight="700" fill="#6b241c">rejected: outside the folder</text>
      <text x="40" y="470" fill="#36424e">../uploads-evil/x</text>
      <text x="250" y="470" fill="#36424e">/app/uploads-evil/x</text>
      <text x="520" y="470" font-weight="700" fill="#6b241c">rejected only because of + sep</text>
    </g>
    <text x="390" y="514" font-size="13" fill="#40566b">Check the resolved path, never the raw input: "../" only becomes visible after resolving.</text>
  </g>
</svg>
