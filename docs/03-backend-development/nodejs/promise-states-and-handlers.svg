<svg xmlns="http://www.w3.org/2000/svg" width="800" height="414" viewBox="0 0 800 414" role="img" aria-labelledby="psh-title psh-desc">
  <title id="psh-title">Promise states and which chained handlers run</title>
  <desc id="psh-desc">A pending promise becomes fulfilled when resolve is called with a value, or rejected when reject is called or an error is thrown; once settled it never changes. In a chain of then(a), then(b), catch(c) and finally(d): on success, both then handlers run, catch is skipped, and finally runs. If a throws, then(b) is skipped, catch(c) handles the error, and finally runs.</desc>
  <defs>
    <marker id="psh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="414" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">1. Promise states</text>

    <rect x="24" y="86" width="152" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="100" y="108" font-size="14" font-weight="700" fill="#36424e">pending</text>
    <text x="100" y="126" font-size="11.5" fill="#36424e">no result yet</text>

    <rect x="360" y="40" width="220" height="152" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="380" y="50" width="180" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="470" y="72" font-size="14" font-weight="700" fill="#294a2e">fulfilled</text>
    <text x="470" y="90" font-size="11.5" fill="#294a2e">has a value</text>
    <rect x="380" y="128" width="180" height="52" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="470" y="150" font-size="14" font-weight="700" fill="#6b241c">rejected</text>
    <text x="470" y="168" font-size="11.5" fill="#6b241c">has a reason (Error)</text>

    <g text-anchor="start">
      <text x="598" y="104" font-size="13" font-weight="700" fill="#36424e">settled</text>
      <text x="598" y="122" font-size="11.5" fill="#36424e">final: it never</text>
      <text x="598" y="138" font-size="11.5" fill="#36424e">changes again</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M176 104H200V76H378" marker-end="url(#psh-arrow)"/>
      <path d="M176 120H200V154H378" marker-end="url(#psh-arrow)"/>
    </g>
    <g font-size="12" fill="#40566b" text-anchor="start">
      <text x="212" y="68">resolve(value)</text>
      <text x="212" y="146">reject(error) or throw</text>
    </g>

    <line x1="24" y1="212" x2="776" y2="212" stroke="#d5dce6" stroke-width="1.5"/>
    <text x="24" y="238" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">2. Which handlers run in a chain</text>

    <g text-anchor="start">
      <text x="24" y="274" font-size="13" font-weight="700" fill="#294a2e">success</text>
      <text x="24" y="290" font-size="11.5" fill="#36424e">no error</text>
      <text x="24" y="338" font-size="13" font-weight="700" fill="#6b241c">a throws</text>
      <text x="24" y="354" font-size="11.5" fill="#36424e">rejection</text>
    </g>

    <rect x="160" y="258" width="120" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="220" y="277" font-size="14" font-weight="700" fill="#294a2e">.then(a)</text>
    <text x="220" y="293" font-size="11.5" fill="#294a2e">runs</text>
    <rect x="320" y="258" width="120" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="380" y="277" font-size="14" font-weight="700" fill="#294a2e">.then(b)</text>
    <text x="380" y="293" font-size="11.5" fill="#294a2e">runs</text>
    <rect x="480" y="258" width="120" height="44" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="540" y="277" font-size="14" font-weight="700" fill="#8a96a3">.catch(c)</text>
    <text x="540" y="293" font-size="11.5" fill="#8a96a3">skipped</text>
    <rect x="640" y="258" width="120" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="700" y="277" font-size="14" font-weight="700" fill="#263e5a">.finally(d)</text>
    <text x="700" y="293" font-size="11.5" fill="#263e5a">runs</text>

    <rect x="160" y="322" width="120" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="220" y="341" font-size="14" font-weight="700" fill="#6b241c">.then(a)</text>
    <text x="220" y="357" font-size="11.5" fill="#6b241c">throws</text>
    <rect x="320" y="322" width="120" height="44" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="380" y="341" font-size="14" font-weight="700" fill="#8a96a3">.then(b)</text>
    <text x="380" y="357" font-size="11.5" fill="#8a96a3">skipped</text>
    <rect x="480" y="322" width="120" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="540" y="341" font-size="14" font-weight="700" fill="#66400f">.catch(c)</text>
    <text x="540" y="357" font-size="11.5" fill="#66400f">handles error</text>
    <rect x="640" y="322" width="120" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="700" y="341" font-size="14" font-weight="700" fill="#263e5a">.finally(d)</text>
    <text x="700" y="357" font-size="11.5" fill="#263e5a">runs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M280 280H318" marker-end="url(#psh-arrow)"/>
      <path d="M440 280H478" marker-end="url(#psh-arrow)"/>
      <path d="M600 280H638" marker-end="url(#psh-arrow)"/>
      <path d="M280 344H318" marker-end="url(#psh-arrow)"/>
      <path d="M440 344H478" marker-end="url(#psh-arrow)"/>
      <path d="M600 344H638" marker-end="url(#psh-arrow)"/>
    </g>
    <text x="400" y="398" font-size="13" fill="#40566b">A rejection skips .then handlers until a .catch; .finally runs on both paths.</text>
  </g>
</svg>
