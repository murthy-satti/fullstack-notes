<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="rl-title rl-desc">
  <title id="rl-title">The layers of the Node.js runtime</title>
  <desc id="rl-desc">Your JavaScript calls Node.js core modules such as node:fs, which call C++ bindings. The bindings hand JavaScript to V8 and I/O work to libuv, which contains the event loop and a thread pool and talks to the operating system. A call such as fs.readFile travels down the layers, and its result comes back up as a queued callback.</desc>
  <defs>
    <marker id="rl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rl-arrow-back" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="760" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="30" width="520" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="300" y="50" font-size="14" font-weight="700" fill="#66400f">Your JavaScript application</text>
    <text x="300" y="67" font-size="11.5" fill="#66400f">app.js calls fs.readFile(), http.createServer()</text>

    <rect x="40" y="96" width="520" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="116" font-size="14" font-weight="700" fill="#263e5a">Node.js core modules</text>
    <text x="300" y="133" font-size="11.5" fill="#263e5a">node:fs, node:http, node:net, node:crypto (written in JS)</text>

    <rect x="40" y="162" width="520" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="300" y="182" font-size="14" font-weight="700" fill="#463365">C++ bindings</text>
    <text x="300" y="199" font-size="11.5" fill="#463365">connect JavaScript functions to native code</text>

    <rect x="40" y="228" width="250" height="100" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="165" y="266" font-size="14" font-weight="700" fill="#294a2e">V8</text>
    <text x="165" y="286" font-size="11.5" fill="#294a2e">parses, JIT-compiles, runs JS</text>
    <text x="165" y="302" font-size="11.5" fill="#294a2e">garbage collection</text>

    <rect x="310" y="228" width="250" height="100" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="435" y="250" font-size="14" font-weight="700" fill="#36424e">libuv</text>
    <rect x="322" y="262" width="110" height="52" rx="6" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="377" y="284" font-size="13" font-weight="700" fill="#36424e">event loop</text>
    <text x="377" y="301" font-size="11.5" fill="#36424e">runs callbacks</text>
    <rect x="442" y="262" width="106" height="52" rx="6" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="495" y="284" font-size="13" font-weight="700" fill="#36424e">thread pool</text>
    <text x="495" y="301" font-size="11.5" fill="#36424e">4 threads</text>

    <rect x="40" y="348" width="520" height="46" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="368" font-size="14" font-weight="700" fill="#36424e">Operating system</text>
    <text x="300" y="385" font-size="11.5" fill="#36424e">sockets (epoll, kqueue, IOCP), files, timers</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M470 76V94" marker-end="url(#rl-arrow)"/>
      <path d="M470 142V160" marker-end="url(#rl-arrow)"/>
      <path d="M470 208V226" marker-end="url(#rl-arrow)"/>
      <path d="M470 328V346" marker-end="url(#rl-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M530 346V330" marker-end="url(#rl-arrow-back)"/>
      <path d="M530 226V210" marker-end="url(#rl-arrow-back)"/>
      <path d="M530 160V144" marker-end="url(#rl-arrow-back)"/>
      <path d="M530 94V78" marker-end="url(#rl-arrow-back)"/>
    </g>

    <g text-anchor="start">
      <path d="M590 112H624" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rl-arrow)"/>
      <text x="590" y="136" font-size="12" font-weight="700" fill="#40566b">call goes down</text>
      <text x="590" y="152" font-size="11.5" fill="#40566b">e.g. fs.readFile()</text>
      <path d="M590 196H624" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rl-arrow-back)"/>
      <text x="590" y="220" font-size="12" font-weight="700" fill="#40566b">result comes up</text>
      <text x="590" y="236" font-size="11.5" fill="#40566b">as a queued callback</text>
    </g>
    <text x="380" y="424" font-size="13" fill="#40566b">V8 only runs JavaScript; libuv and the OS do the I/O and report back to the event loop.</text>
  </g>
</svg>
