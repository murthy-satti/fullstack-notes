<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="cv-title cv-desc">
  <title id="cv-title">Loading and validating configuration at startup</title>
  <desc id="cv-desc">Shell or CI exports, container environment variables, and a local --env-file all end up in process.env, where every value is a string. config.js runs schema.safeParse(process.env). If validation fails, it prints the field errors and calls process.exit(1), so a bad deploy fails at startup. If it succeeds, values are coerced and defaults applied, for example PORT "8080" becomes the number 8080, and the result is frozen and exported as config. The rest of the app imports config and calls server.listen(config.PORT).</desc>
  <defs>
    <marker id="cv-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="228" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="138" y="44" font-size="13" font-weight="700" fill="#36424e">shell or CI exports</text>
    <text x="138" y="61" font-size="11.5" fill="#36424e">export PORT=8080</text>
    <rect x="276" y="24" width="228" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="44" font-size="13" font-weight="700" fill="#36424e">container environment</text>
    <text x="390" y="61" font-size="11.5" fill="#36424e">Docker, Kubernetes</text>
    <rect x="528" y="24" width="228" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="642" y="44" font-size="13" font-weight="700" fill="#36424e">--env-file=.env</text>
    <text x="642" y="61" font-size="11.5" fill="#36424e">local development</text>

    <rect x="250" y="100" width="280" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="119" font-size="14" font-weight="700" fill="#263e5a">process.env</text>
    <text x="390" y="136" font-size="11.5" fill="#263e5a">every value is a string</text>

    <rect x="250" y="168" width="280" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="187" font-size="14" font-weight="700" fill="#66400f">config.js</text>
    <text x="390" y="204" font-size="11.5" fill="#66400f">schema.safeParse(process.env)</text>

    <path d="M390 236 470 262 390 288 310 262z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="266" font-size="12" font-weight="700" fill="#36424e">valid?</text>

    <rect x="540" y="232" width="216" height="60" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="648" y="253" font-size="13" font-weight="700" fill="#6b241c">print fieldErrors</text>
    <text x="648" y="270" font-size="11.5" fill="#6b241c">process.exit(1): deploy</text>
    <text x="648" y="284" font-size="11.5" fill="#6b241c">fails now, not hours later</text>

    <rect x="230" y="314" width="320" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="334" font-size="13" font-weight="700" fill="#294a2e">Object.freeze(result.data)</text>
    <text x="390" y="353" font-size="11.5" fill="#294a2e">PORT "8080" → 8080, defaults applied</text>

    <rect x="230" y="390" width="320" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="410" font-size="13" font-weight="700" fill="#263e5a">app imports config</text>
    <text x="390" y="427" font-size="11.5" fill="#263e5a">server.listen(config.PORT)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M138 72V86H300V98" marker-end="url(#cv-arrow)"/>
      <path d="M390 72V98" marker-end="url(#cv-arrow)"/>
      <path d="M642 72V86H480V98" marker-end="url(#cv-arrow)"/>
      <path d="M390 144V166" marker-end="url(#cv-arrow)"/>
      <path d="M390 212V234" marker-end="url(#cv-arrow)"/>
      <path d="M470 262H538" marker-end="url(#cv-arrow)"/>
      <path d="M390 288V312" marker-end="url(#cv-arrow)"/>
      <path d="M390 366V388" marker-end="url(#cv-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="502" y="254">no</text>
      <text x="402" y="304" text-anchor="start">yes</text>
    </g>
    <text x="390" y="466" font-size="13" fill="#40566b">Read process.env in one place, validate once, and fail fast; the app never reads raw strings.</text>
  </g>
</svg>
