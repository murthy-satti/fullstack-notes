<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="tvi-title tvi-desc">
  <title id="tvi-title">Why setTimeout(fn, 0) and setImmediate order differs by context</title>
  <desc id="tvi-desc">When both are scheduled from the main module, the order depends on whether 1 millisecond has passed when the loop first reaches the timers phase: if yes the timeout runs first, if not the immediate runs first. When both are scheduled inside an I/O callback, which runs in the poll phase, the check phase comes next, so setImmediate always runs first and setTimeout runs in the next iteration's timers phase.</desc>
  <defs>
    <marker id="tvi-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="366" height="336" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="398" y="16" width="366" height="336" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="199" y="42" font-size="14" font-weight="700" fill="#36424e">From the main module</text>
    <text x="581" y="42" font-size="14" font-weight="700" fill="#36424e">Inside an I/O callback</text>

    <rect x="59" y="62" width="280" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="199" y="89" font-size="14" font-weight="700" fill="#66400f">Main module schedules both</text>

    <path d="M199 126 309 160 199 194 89 160z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="199" y="157" font-size="12" font-weight="700" fill="#36424e">1 ms passed when the</text>
    <text x="199" y="171" font-size="12" font-weight="700" fill="#36424e">loop reaches timers?</text>

    <rect x="30" y="236" width="160" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="110" y="259" font-size="14" font-weight="700" fill="#263e5a">timeout first</text>
    <text x="110" y="277" font-size="11.5" fill="#263e5a">then immediate</text>
    <rect x="208" y="236" width="160" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="288" y="259" font-size="14" font-weight="700" fill="#294a2e">immediate first</text>
    <text x="288" y="277" font-size="11.5" fill="#294a2e">timeout next iteration</text>
    <text x="199" y="326" font-size="12" font-style="italic" fill="#6b241c">order changes from run to run</text>

    <rect x="441" y="62" width="280" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="581" y="81" font-size="14" font-weight="700" fill="#66400f">I/O callback schedules both</text>
    <text x="581" y="98" font-size="11.5" fill="#66400f">it runs in the poll phase</text>
    <rect x="441" y="128" width="280" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="581" y="147" font-size="14" font-weight="700" fill="#294a2e">check phase comes next</text>
    <text x="581" y="164" font-size="11.5" fill="#294a2e">setImmediate callback runs</text>
    <rect x="441" y="194" width="280" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="581" y="213" font-size="14" font-weight="700" fill="#263e5a">next iteration: timers</text>
    <text x="581" y="230" font-size="11.5" fill="#263e5a">setTimeout callback runs</text>
    <rect x="461" y="262" width="240" height="34" rx="17" fill="#53845b"/>
    <text x="581" y="284" font-size="13" font-weight="700" fill="#ffffff">always: immediate, timeout</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M199 106V124" marker-end="url(#tvi-arrow)"/>
      <path d="M89 160H70V234" marker-end="url(#tvi-arrow)"/>
      <path d="M309 160H328V234" marker-end="url(#tvi-arrow)"/>
      <path d="M581 106V126" marker-end="url(#tvi-arrow)"/>
      <path d="M581 172V192" marker-end="url(#tvi-arrow)"/>
      <path d="M581 238V260" marker-end="url(#tvi-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="56" y="152">yes</text>
      <text x="344" y="152">no</text>
    </g>
    <text x="390" y="382" font-size="13" fill="#40566b">Inside I/O callbacks, use setImmediate when you need the callback to run before timers.</text>
  </g>
</svg>
