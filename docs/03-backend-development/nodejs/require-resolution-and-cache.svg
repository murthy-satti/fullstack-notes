<svg xmlns="http://www.w3.org/2000/svg" width="780" height="584" viewBox="0 0 780 584" role="img" aria-labelledby="rrc-title rrc-desc">
  <title id="rrc-title">How require() finds, runs and caches a CommonJS module</title>
  <desc id="rrc-desc">require returns a built-in module directly for names such as node:fs. A relative path like ./math tries ./math.js, ./math.json, ./math.node, then ./math/index.js; a bare name like express searches node_modules folders upward. If nothing is found, require throws an error with code MODULE_NOT_FOUND. If the resolved filename is already in the cache, require returns the cached module.exports without running the file again. Otherwise it wraps the file in a function, runs it once, caches module.exports, and returns it.</desc>
  <defs>
    <marker id="rrc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="584" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="270" y="20" width="240" height="40" rx="20" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="45" font-size="14" font-weight="700" fill="#66400f">require(specifier)</text>

    <path d="M390 80 500 112 390 144 280 112z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="109" font-size="12" font-weight="700" fill="#36424e">what kind of</text>
    <text x="390" y="123" font-size="12" font-weight="700" fill="#36424e">specifier?</text>

    <rect x="24" y="166" width="200" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="124" y="188" font-size="14" font-weight="700" fill="#294a2e">Return built-in</text>
    <text x="124" y="206" font-size="11.5" fill="#294a2e">node:fs, node:path</text>

    <rect x="260" y="166" width="260" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="186" font-size="14" font-weight="700" fill="#263e5a">Try file candidates</text>
    <text x="390" y="203" font-size="11.5" fill="#263e5a">./math.js, .json, .node,</text>
    <text x="390" y="217" font-size="11.5" fill="#263e5a">then ./math/index.js</text>

    <rect x="556" y="166" width="200" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="656" y="188" font-size="14" font-weight="700" fill="#263e5a">Search node_modules</text>
    <text x="656" y="206" font-size="11.5" fill="#263e5a">this folder, then upward</text>

    <path d="M390 250 490 280 390 310 290 280z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="277" font-size="12" font-weight="700" fill="#36424e">resolved to a</text>
    <text x="390" y="291" font-size="12" font-weight="700" fill="#36424e">filename?</text>

    <rect x="556" y="256" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="656" y="276" font-size="14" font-weight="700" fill="#6b241c">Throws an Error</text>
    <text x="656" y="293" font-size="11.5" fill="#6b241c">code: MODULE_NOT_FOUND</text>

    <path d="M390 336 490 366 390 396 290 366z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="363" font-size="12" font-weight="700" fill="#36424e">filename in</text>
    <text x="390" y="377" font-size="12" font-weight="700" fill="#36424e">require cache?</text>

    <rect x="556" y="342" width="200" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="656" y="362" font-size="14" font-weight="700" fill="#294a2e">Return cached</text>
    <text x="656" y="379" font-size="11.5" fill="#294a2e">module.exports, no re-run</text>

    <rect x="260" y="420" width="260" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="440" font-size="14" font-weight="700" fill="#66400f">Wrap in a function, run once</text>
    <text x="390" y="457" font-size="11.5" fill="#66400f">(exports, require, module, ...)</text>

    <rect x="260" y="488" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="507" font-size="14" font-weight="700" fill="#294a2e">Cache and return</text>
    <text x="390" y="524" font-size="11.5" fill="#294a2e">module.exports</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 60V78" marker-end="url(#rrc-arrow)"/>
      <path d="M280 112H124V164" marker-end="url(#rrc-arrow)"/>
      <path d="M390 144V164" marker-end="url(#rrc-arrow)"/>
      <path d="M500 112H656V164" marker-end="url(#rrc-arrow)"/>
      <path d="M390 222V248" marker-end="url(#rrc-arrow)"/>
      <path d="M656 222V236H420V248" marker-end="url(#rrc-arrow)"/>
      <path d="M490 280H554" marker-end="url(#rrc-arrow)"/>
      <path d="M390 310V334" marker-end="url(#rrc-arrow)"/>
      <path d="M490 366H554" marker-end="url(#rrc-arrow)"/>
      <path d="M390 396V418" marker-end="url(#rrc-arrow)"/>
      <path d="M390 468V486" marker-end="url(#rrc-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="200" y="104">built-in</text>
      <text x="402" y="158" text-anchor="start">./ or ../</text>
      <text x="580" y="104">bare name</text>
      <text x="522" y="272">no</text>
      <text x="402" y="327" text-anchor="start">yes</text>
      <text x="522" y="358">yes</text>
      <text x="402" y="412" text-anchor="start">no</text>
    </g>
    <text x="390" y="566" font-size="13" fill="#40566b">A module body runs only on the first require(); every later call gets the same object.</text>
  </g>
</svg>
