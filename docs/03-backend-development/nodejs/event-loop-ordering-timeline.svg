<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-labelledby="eot-title eot-desc">
  <title id="eot-title">Where each step of the ordering example runs</title>
  <desc id="eot-desc">During the timers phase of the first loop iteration, a timer callback logs A and B on the call stack while scheduling a nextTick, a promise, a setImmediate and a new timer. When the callback returns, the nextTick callback C runs, then the promise microtask D. The loop then reaches the check phase and runs the setImmediate callback E. The new timer F runs in the timers phase of the next iteration.</desc>
  <defs>
    <marker id="eot-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="186" y="22" width="356" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="364" y="39" font-size="12" font-weight="700" fill="#263e5a">iteration 1: timers phase</text>
    <rect x="550" y="22" width="80" height="24" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="590" y="39" font-size="12" font-weight="700" fill="#294a2e">check</text>
    <rect x="638" y="22" width="122" height="24" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="699" y="39" font-size="12" font-weight="700" fill="#263e5a">iteration 2: timers</text>

    <g fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5">
      <rect x="180" y="60" width="580" height="40" rx="6"/>
      <rect x="180" y="110" width="580" height="40" rx="6"/>
      <rect x="180" y="160" width="580" height="40" rx="6"/>
      <rect x="180" y="210" width="580" height="40" rx="6"/>
      <rect x="180" y="260" width="580" height="40" rx="6"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="78">call stack</text>
      <text x="24" y="94" font-size="11.5" font-weight="400">timer callback</text>
      <text x="24" y="135">nextTick queue</text>
      <text x="24" y="185">Promise microtasks</text>
      <text x="24" y="235">check phase</text>
      <text x="24" y="285">timers phase</text>
    </g>

    <rect x="200" y="64" width="150" height="32" rx="16" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 80H302" marker-end="url(#eot-arrow)"/>
      <path d="M334 88 395 122" marker-end="url(#eot-arrow)"/>
      <path d="M424 138 485 172" marker-end="url(#eot-arrow)"/>
      <path d="M514 188 575 222" marker-end="url(#eot-arrow)"/>
      <path d="M604 238 665 272" marker-end="url(#eot-arrow)"/>
    </g>

    <g font-size="14" font-weight="700">
      <circle cx="230" cy="80" r="14" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="230" y="85" fill="#66400f">A</text>
      <circle cx="320" cy="80" r="14" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="320" y="85" fill="#66400f">B</text>
      <circle cx="410" cy="130" r="14" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="410" y="135" fill="#463365">C</text>
      <circle cx="500" cy="180" r="14" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="500" y="185" fill="#463365">D</text>
      <circle cx="590" cy="230" r="14" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
      <text x="590" y="235" fill="#294a2e">E</text>
      <circle cx="680" cy="280" r="14" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="680" y="285" fill="#263e5a">F</text>
    </g>

    <g font-size="11.5" fill="#40566b" text-anchor="start">
      <text x="430" y="135">process.nextTick</text>
      <text x="520" y="185">Promise.then</text>
      <text x="610" y="235">setImmediate</text>
      <text x="700" y="285">setTimeout</text>
    </g>
    <text x="390" y="326" font-size="13" fill="#40566b">All four are scheduled inside the timer callback (between A and B).</text>
    <text x="390" y="344" font-size="13" fill="#40566b">Microtasks run before the loop moves on; the new timer waits for the next iteration.</text>
  </g>
</svg>
