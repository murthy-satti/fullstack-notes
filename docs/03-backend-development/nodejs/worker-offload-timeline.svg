<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="wot-title wot-desc">
  <title id="wot-title">CPU work on the main thread versus in a worker thread</title>
  <desc id="wot-desc">When request A resizes an image for two seconds on the main thread, requests B and C wait until it finishes. With a worker, the main thread hands the job to a worker with new Worker and workerData, then serves requests B, C and D while the worker resizes the image. The worker sends the result back with parentPort.postMessage, the main thread's message handler receives it, and the main thread replies to A.</desc>
  <defs>
    <marker id="wot-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="40" font-size="14" font-weight="700" fill="#6b241c" text-anchor="start">CPU work on the main thread</text>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="78">main thread</text>
      <text x="24" y="120">requests B, C</text>
    </g>
    <rect x="150" y="60" width="420" height="28" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="360" y="79" font-size="12" font-weight="700" fill="#6b241c">request A: 2 s of image resizing (blocking)</text>
    <rect x="570" y="60" width="80" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="610" y="79" font-size="11.5" fill="#263e5a">B</text>
    <rect x="650" y="60" width="80" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="690" y="79" font-size="11.5" fill="#263e5a">C</text>
    <rect x="200" y="104" width="370" height="26" rx="6" fill="#ffffff" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="385" y="122" font-size="11.5" fill="#6b241c">B and C arrived here and wait</text>

    <line x1="24" y1="158" x2="756" y2="158" stroke="#d5dce6" stroke-width="1.5"/>

    <text x="24" y="188" font-size="14" font-weight="700" fill="#294a2e" text-anchor="start">CPU work in a worker thread</text>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="226">main thread</text>
      <text x="24" y="314">worker thread</text>
    </g>
    <rect x="150" y="208" width="100" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="200" y="227" font-size="11.5" fill="#66400f">A: new Worker</text>
    <rect x="260" y="208" width="70" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="295" y="227" font-size="11.5" fill="#263e5a">B</text>
    <rect x="340" y="208" width="70" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="375" y="227" font-size="11.5" fill="#263e5a">C</text>
    <rect x="420" y="208" width="70" height="28" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="455" y="227" font-size="11.5" fill="#263e5a">D</text>
    <rect x="610" y="208" width="120" height="28" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="670" y="227" font-size="11.5" font-weight="700" fill="#294a2e">reply to A</text>

    <rect x="250" y="296" width="340" height="28" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="420" y="315" font-size="12" font-weight="700" fill="#463365">image resizing (2 s), off the main thread</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M220 236V310H248" marker-end="url(#wot-arrow)"/>
      <path d="M590 310H640V238" marker-end="url(#wot-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="160" y="270">workerData</text>
      <text x="630" y="270" text-anchor="end">parentPort.postMessage(result)</text>
      <text x="630" y="285" text-anchor="end">→ worker.on("message")</text>
    </g>
    <text x="390" y="368" font-size="13" fill="#40566b">The main thread stays free for other requests; only request A waits for its own result.</text>
  </g>
</svg>
