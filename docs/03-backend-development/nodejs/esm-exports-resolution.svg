<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="eer-title eer-desc">
  <title id="eer-title">How an ESM import of a package subpath is resolved through "exports"</title>
  <desc id="eer-desc">For import from "my-lib/utils", Node.js finds node_modules/my-lib/package.json. If the package defines an exports field, Node.js looks up the subpath "./utils"; if it is listed, the mapped file ./dist/utils.js is loaded, and if not, the import fails with ERR_PACKAGE_PATH_NOT_EXPORTED even if the file exists. A package without an exports field is resolved by file path, and ESM requires the full file name with its extension.</desc>
  <defs>
    <marker id="eer-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="230" y="20" width="320" height="40" rx="20" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="45" font-size="14" font-weight="700" fill="#66400f">import { x } from "my-lib/utils"</text>

    <rect x="250" y="80" width="280" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="100" font-size="14" font-weight="700" fill="#263e5a">Find the package</text>
    <text x="390" y="117" font-size="11.5" fill="#263e5a">node_modules/my-lib/package.json</text>

    <path d="M390 148 490 178 390 208 290 178z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="175" font-size="12" font-weight="700" fill="#36424e">has an "exports"</text>
    <text x="390" y="189" font-size="12" font-weight="700" fill="#36424e">field?</text>

    <rect x="24" y="154" width="200" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="124" y="176" font-size="14" font-weight="700" fill="#36424e">Resolve by path</text>
    <text x="124" y="194" font-size="11.5" fill="#36424e">my-lib/utils.js: extension</text>
    <text x="124" y="207" font-size="11.5" fill="#36424e">required in ESM</text>

    <path d="M390 232 490 262 390 292 290 262z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="259" font-size="12" font-weight="700" fill="#36424e">"./utils" listed</text>
    <text x="390" y="273" font-size="12" font-weight="700" fill="#36424e">in exports?</text>

    <rect x="512" y="238" width="252" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="638" y="258" font-size="14" font-weight="700" fill="#6b241c">Import fails</text>
    <text x="638" y="275" font-size="11.5" fill="#6b241c">ERR_PACKAGE_PATH_NOT_EXPORTED</text>

    <rect x="250" y="320" width="280" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="342" font-size="14" font-weight="700" fill="#294a2e">Load the mapped file</text>
    <text x="390" y="360" font-size="11.5" fill="#294a2e">"./utils": "./dist/utils.js"</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 60V78" marker-end="url(#eer-arrow)"/>
      <path d="M390 128V146" marker-end="url(#eer-arrow)"/>
      <path d="M290 178H226" marker-end="url(#eer-arrow)"/>
      <path d="M390 208V230" marker-end="url(#eer-arrow)"/>
      <path d="M490 262H510" marker-end="url(#eer-arrow)"/>
      <path d="M390 292V318" marker-end="url(#eer-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="258" y="170">no</text>
      <text x="402" y="224" text-anchor="start">yes</text>
      <text x="500" y="254">no</text>
      <text x="402" y="310" text-anchor="start">yes</text>
    </g>
    <text x="390" y="408" font-size="13" fill="#40566b">"exports" is the package's public API: unlisted files cannot be imported, even if they exist.</text>
  </g>
</svg>
