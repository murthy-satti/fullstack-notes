<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="cd-title cd-desc">
  <title id="cd-title">How the cluster module spreads connections across worker processes</title>
  <desc id="cd-desc">Clients connect to port 3000. The primary process accepts connections and distributes them round-robin to four worker processes, one per CPU core, each with its own memory and event loop. Workers do not share memory, so sessions, caches and rate-limit counters must live in an external store such as Redis or a database. When a worker exits, the primary's cluster.on("exit") handler calls cluster.fork() to start a replacement.</desc>
  <defs>
    <marker id="cd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="300" y="20" width="180" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="45" font-size="14" font-weight="700" fill="#36424e">clients → :3000</text>

    <rect x="200" y="84" width="380" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="105" font-size="14" font-weight="700" fill="#66400f">primary process</text>
    <text x="390" y="123" font-size="11.5" fill="#66400f">accepts connections, hands them out round-robin</text>

    <g font-size="14" font-weight="700">
      <rect x="24" y="186" width="166" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="107" y="209" fill="#263e5a">worker 1</text>
      <rect x="214" y="186" width="166" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="297" y="209" fill="#263e5a">worker 2</text>
      <rect x="404" y="186" width="166" height="60" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
      <text x="487" y="209" fill="#6b241c">worker 3 exits</text>
      <rect x="594" y="186" width="166" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="677" y="209" fill="#263e5a">worker 4</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="107" y="230">own memory + event loop</text>
      <text x="297" y="230">own memory + event loop</text>
      <text x="677" y="230">own memory + event loop</text>
    </g>
    <text x="487" y="230" font-size="11.5" fill="#6b241c">crash or out of memory</text>

    <rect x="404" y="282" width="166" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="487" y="301" font-size="13" font-weight="700" fill="#294a2e">new worker 3</text>
    <text x="487" y="318" font-size="11.5" fill="#294a2e">started by cluster.fork()</text>

    <rect x="140" y="370" width="500" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="391" font-size="14" font-weight="700" fill="#463365">shared state: Redis or a database</text>
    <text x="390" y="409" font-size="11.5" fill="#463365">sessions, caches, rate-limit counters (workers share no memory)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 60V82" marker-end="url(#cd-arrow)"/>
      <path d="M300 136V160H107V184" marker-end="url(#cd-arrow)"/>
      <path d="M360 136V172H297V184" marker-end="url(#cd-arrow)"/>
      <path d="M420 136V172H487V184" marker-end="url(#cd-arrow)"/>
      <path d="M480 136V160H677V184" marker-end="url(#cd-arrow)"/>
      <path d="M580 110H600V140H770V300H572" marker-end="url(#cd-arrow)"/>
    </g>
    <text x="680" y="132" font-size="11.5" font-style="italic" fill="#40566b">cluster.on("exit") → fork()</text>

    <g fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M107 246V396H138"/>
      <path d="M297 246V368"/>
      <path d="M487 326V368"/>
      <path d="M677 246V396H642"/>
    </g>
    <text x="390" y="452" font-size="13" fill="#40566b">More processes use more CPU cores; anything that must be shared lives outside them.</text>
  </g>
</svg>
