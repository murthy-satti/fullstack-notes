<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" role="img" aria-labelledby="ef-title ef-desc">
  <title id="ef-title">What happens when an EventEmitter emits an event</title>
  <desc id="ef-desc">When emit is called with the name "error" and an error listener is registered, the listener handles it; with no error listener, emit throws and the uncaught error crashes the process. For any other name, emit returns false if there are no listeners. Otherwise it calls each listener synchronously in registration order, here sendConfirmationEmail, updateAnalytics and reserveStock, and then returns true so the next line of code runs. If a listener throws, the remaining listeners are skipped.</desc>
  <defs>
    <marker id="ef-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="540" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="160" y="20" width="280" height="40" rx="20" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="300" y="45" font-size="14" font-weight="700" fill="#66400f">emit("order:created", order)</text>

    <path d="M300 80 400 110 300 140 200 110z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="107" font-size="12" font-weight="700" fill="#36424e">event name is</text>
    <text x="300" y="121" font-size="12" font-weight="700" fill="#36424e">"error"?</text>

    <path d="M600 80 700 110 600 140 500 110z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="600" y="107" font-size="12" font-weight="700" fill="#36424e">"error" listener</text>
    <text x="600" y="121" font-size="12" font-weight="700" fill="#36424e">registered?</text>

    <rect x="500" y="170" width="200" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="600" y="189" font-size="14" font-weight="700" fill="#294a2e">error listener runs</text>
    <text x="600" y="206" font-size="11.5" fill="#294a2e">the error is handled</text>

    <rect x="500" y="240" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="600" y="260" font-size="14" font-weight="700" fill="#6b241c">emit() throws</text>
    <text x="600" y="277" font-size="11.5" fill="#6b241c">uncaught: process crashes</text>

    <path d="M300 170 400 200 300 230 200 200z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="197" font-size="12" font-weight="700" fill="#36424e">any listeners</text>
    <text x="300" y="211" font-size="12" font-weight="700" fill="#36424e">for this name?</text>

    <rect x="20" y="178" width="130" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="85" y="197" font-size="14" font-weight="700" fill="#36424e">returns false</text>
    <text x="85" y="214" font-size="11.5" fill="#36424e">nothing runs</text>

    <rect x="170" y="262" width="260" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="281" font-size="14" font-weight="700" fill="#263e5a">listener 1</text>
    <text x="300" y="298" font-size="11.5" fill="#263e5a">sendConfirmationEmail(order)</text>
    <rect x="170" y="326" width="260" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="345" font-size="14" font-weight="700" fill="#263e5a">listener 2</text>
    <text x="300" y="362" font-size="11.5" fill="#263e5a">updateAnalytics(order)</text>
    <rect x="170" y="390" width="260" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="409" font-size="14" font-weight="700" fill="#263e5a">listener 3</text>
    <text x="300" y="426" font-size="11.5" fill="#263e5a">reserveStock(order)</text>

    <rect x="170" y="454" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="300" y="473" font-size="14" font-weight="700" fill="#294a2e">emit() returns true</text>
    <text x="300" y="490" font-size="11.5" fill="#294a2e">then the next line runs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 60V78" marker-end="url(#ef-arrow)"/>
      <path d="M400 110H498" marker-end="url(#ef-arrow)"/>
      <path d="M600 140V168" marker-end="url(#ef-arrow)"/>
      <path d="M700 110H740V264H702" marker-end="url(#ef-arrow)"/>
      <path d="M300 140V168" marker-end="url(#ef-arrow)"/>
      <path d="M200 200H152" marker-end="url(#ef-arrow)"/>
      <path d="M300 230V260" marker-end="url(#ef-arrow)"/>
      <path d="M300 306V324" marker-end="url(#ef-arrow)"/>
      <path d="M300 370V388" marker-end="url(#ef-arrow)"/>
      <path d="M300 434V452" marker-end="url(#ef-arrow)"/>
    </g>
    <path d="M438 262H446V434H438M446 348H456" fill="none" stroke="#8062a8" stroke-width="2" stroke-linejoin="round"/>
    <g font-size="11.5" fill="#463365" text-anchor="start">
      <text x="462" y="330">Synchronous, in the order</text>
      <text x="462" y="346">they were added, before</text>
      <text x="462" y="362">emit() returns. If one throws,</text>
      <text x="462" y="378">the rest are skipped.</text>
    </g>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="449" y="102">yes</text>
      <text x="720" y="102">no</text>
      <text x="612" y="160" text-anchor="start">yes</text>
      <text x="312" y="160" text-anchor="start">no</text>
      <text x="176" y="192">no</text>
      <text x="312" y="250" text-anchor="start">yes</text>
    </g>
    <text x="390" y="526" font-size="13" fill="#40566b">emit() runs every listener before it returns; an unhandled "error" event crashes the process.</text>
  </g>
</svg>
