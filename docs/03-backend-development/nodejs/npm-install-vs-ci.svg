<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="nic-title nic-desc">
  <title id="nic-title">What npm install and npm ci do with package-lock.json</title>
  <desc id="nic-desc">npm install reads package.json. If package-lock.json exists and still satisfies the ranges, it installs the locked versions; otherwise it resolves versions from the ranges and writes or updates the lockfile. npm ci requires a lockfile and fails if there is none or if package.json and the lockfile disagree; otherwise it deletes node_modules and installs exactly the locked versions without ever changing the lockfile.</desc>
  <defs>
    <marker id="nic-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="366" height="440" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="398" y="16" width="366" height="440" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="199" y="42" font-size="14" font-weight="700" fill="#36424e">npm install (development)</text>
    <text x="581" y="42" font-size="14" font-weight="700" fill="#36424e">npm ci (CI and production)</text>

    <rect x="69" y="60" width="260" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="199" y="85" font-size="14" font-weight="700" fill="#263e5a">Read package.json ranges</text>
    <path d="M199 120 299 152 199 184 99 152z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="199" y="149" font-size="12" font-weight="700" fill="#36424e">lockfile exists and</text>
    <text x="199" y="163" font-size="12" font-weight="700" fill="#36424e">fits the ranges?</text>
    <rect x="30" y="220" width="160" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="110" y="243" font-size="14" font-weight="700" fill="#294a2e">Install locked</text>
    <text x="110" y="261" font-size="11.5" fill="#294a2e">versions</text>
    <rect x="208" y="220" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="288" y="243" font-size="14" font-weight="700" fill="#66400f">Resolve ranges</text>
    <text x="288" y="261" font-size="11.5" fill="#66400f">newest matching</text>
    <rect x="208" y="300" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="288" y="323" font-size="14" font-weight="700" fill="#66400f">Write lockfile</text>
    <text x="288" y="341" font-size="11.5" fill="#66400f">package-lock changes</text>
    <rect x="69" y="384" width="260" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="199" y="403" font-size="14" font-weight="700" fill="#36424e">node_modules updated</text>
    <text x="199" y="420" font-size="11.5" fill="#36424e">tree may differ between days</text>

    <path d="M581 64 681 94 581 124 481 94z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="581" y="91" font-size="12" font-weight="700" fill="#36424e">package-lock.json</text>
    <text x="581" y="105" font-size="12" font-weight="700" fill="#36424e">exists?</text>
    <path d="M581 150 681 180 581 210 481 180z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="581" y="177" font-size="12" font-weight="700" fill="#36424e">package.json and</text>
    <text x="581" y="191" font-size="12" font-weight="700" fill="#36424e">lockfile in sync?</text>
    <rect x="606" y="230" width="146" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="679" y="250" font-size="14" font-weight="700" fill="#6b241c">Fails</text>
    <text x="679" y="267" font-size="11.5" fill="#6b241c">nothing installed</text>
    <rect x="451" y="236" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="521" y="255" font-size="13" font-weight="700" fill="#36424e">Delete</text>
    <text x="521" y="272" font-size="11.5" fill="#36424e">node_modules</text>
    <rect x="431" y="304" width="180" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="521" y="327" font-size="14" font-weight="700" fill="#294a2e">Install exactly</text>
    <text x="521" y="345" font-size="11.5" fill="#294a2e">the locked versions</text>
    <rect x="451" y="384" width="260" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="581" y="403" font-size="14" font-weight="700" fill="#294a2e">Identical tree every time</text>
    <text x="581" y="420" font-size="11.5" fill="#294a2e">lockfile never changes</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M199 100V118" marker-end="url(#nic-arrow)"/>
      <path d="M99 152H110V218" marker-end="url(#nic-arrow)"/>
      <path d="M299 152H288V218" marker-end="url(#nic-arrow)"/>
      <path d="M288 276V298" marker-end="url(#nic-arrow)"/>
      <path d="M110 276V370H199V382" marker-end="url(#nic-arrow)"/>
      <path d="M288 356V370H199V382" marker-end="url(#nic-arrow)"/>
      <path d="M681 94H700V228" marker-end="url(#nic-arrow)"/>
      <path d="M581 124V148" marker-end="url(#nic-arrow)"/>
      <path d="M681 180H700"/>
      <path d="M521 210V234" marker-end="url(#nic-arrow)"/>
      <path d="M521 280V302" marker-end="url(#nic-arrow)"/>
      <path d="M521 360V372H581V382" marker-end="url(#nic-arrow)"/>
    </g>
    <circle cx="700" cy="180" r="3.5" fill="#40566b"/>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="84" y="146">yes</text>
      <text x="316" y="146">no</text>
      <text x="716" y="88">no</text>
      <text x="593" y="140" text-anchor="start">yes</text>
      <text x="706" y="174">no</text>
      <text x="509" y="226" text-anchor="end">yes</text>
    </g>
    <text x="390" y="484" font-size="13" fill="#40566b">Commit package-lock.json; use npm ci wherever the install must be repeatable.</text>
  </g>
</svg>
