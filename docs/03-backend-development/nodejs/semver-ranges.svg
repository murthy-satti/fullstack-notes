<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-labelledby="svr-title svr-desc">
  <title id="svr-title">Which versions each semver range accepts</title>
  <desc id="svr-desc">For candidate versions 1.2.2, 1.2.3, 1.2.9, 1.3.0, 1.9.4 and 2.0.0: the exact range 1.2.3 accepts only 1.2.3. The tilde range ~1.2.3 accepts 1.2.3 and 1.2.9, up to but not including 1.3.0. The caret range ^1.2.3 accepts 1.2.3, 1.2.9, 1.3.0 and 1.9.4, up to but not including 2.0.0. No range accepts 1.2.2, which is older than 1.2.3.</desc>
  <rect width="780" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="46" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">range in package.json</text>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="250" y="46">1.2.2</text>
      <text x="340" y="46">1.2.3</text>
      <text x="430" y="46">1.2.9</text>
      <text x="520" y="46">1.3.0</text>
      <text x="610" y="46">1.9.4</text>
      <text x="700" y="46">2.0.0</text>
    </g>
    <g font-size="11" fill="#40566b">
      <text x="250" y="62">older</text>
      <text x="430" y="62">new patch</text>
      <text x="520" y="62">new minor</text>
      <text x="610" y="62">new minor</text>
      <text x="700" y="62">new major</text>
    </g>

    <g fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5">
      <rect x="20" y="78" width="740" height="52" rx="8"/>
      <rect x="20" y="140" width="740" height="52" rx="8"/>
      <rect x="20" y="202" width="740" height="52" rx="8"/>
    </g>
    <g text-anchor="start">
      <text x="36" y="102" font-size="15" font-weight="700" fill="#263e5a">1.2.3</text>
      <text x="36" y="119" font-size="11.5" fill="#36424e">exact version only</text>
      <text x="36" y="164" font-size="15" font-weight="700" fill="#263e5a">~1.2.3</text>
      <text x="36" y="181" font-size="11.5" fill="#36424e">&gt;=1.2.3 &lt;1.3.0 (patches)</text>
      <text x="36" y="226" font-size="15" font-weight="700" fill="#263e5a">^1.2.3</text>
      <text x="36" y="243" font-size="11.5" fill="#36424e">&gt;=1.2.3 &lt;2.0.0 (default)</text>
    </g>

    <rect x="326" y="150" width="118" height="32" rx="16" fill="#e8f5e9"/>
    <rect x="326" y="212" width="298" height="32" rx="16" fill="#e8f5e9"/>

    <g stroke-width="2.5">
      <circle cx="250" cy="104" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="340" cy="104" r="11" fill="#53845b" stroke="#53845b"/>
      <circle cx="430" cy="104" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="520" cy="104" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="610" cy="104" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="700" cy="104" r="11" fill="#ffffff" stroke="#b9c2cc"/>

      <circle cx="250" cy="166" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="340" cy="166" r="11" fill="#53845b" stroke="#53845b"/>
      <circle cx="430" cy="166" r="11" fill="#53845b" stroke="#53845b"/>
      <circle cx="520" cy="166" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="610" cy="166" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="700" cy="166" r="11" fill="#ffffff" stroke="#b9c2cc"/>

      <circle cx="250" cy="228" r="11" fill="#ffffff" stroke="#b9c2cc"/>
      <circle cx="340" cy="228" r="11" fill="#53845b" stroke="#53845b"/>
      <circle cx="430" cy="228" r="11" fill="#53845b" stroke="#53845b"/>
      <circle cx="520" cy="228" r="11" fill="#53845b" stroke="#53845b"/>
      <circle cx="610" cy="228" r="11" fill="#53845b" stroke="#53845b"/>
      <circle cx="700" cy="228" r="11" fill="#ffffff" stroke="#b9c2cc"/>
    </g>

    <g text-anchor="start" font-size="12">
      <circle cx="30" cy="282" r="7" fill="#53845b"/>
      <text x="44" y="286" fill="#36424e">npm may install it</text>
      <circle cx="190" cy="282" r="7" fill="#ffffff" stroke="#b9c2cc" stroke-width="2.5"/>
      <text x="204" y="286" fill="#36424e">outside the range</text>
      <text x="360" y="286" fill="#6b241c">Before 1.0.0 the caret is narrower: ^0.2.3 means &gt;=0.2.3 &lt;0.3.0</text>
    </g>
    <text x="390" y="316" font-size="13" fill="#40566b">The lockfile pins the one version actually installed; the range only limits upgrades.</text>
  </g>
</svg>
