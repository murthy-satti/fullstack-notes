<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="pc-title pc-desc">
  <title id="pc-title">What Promise.all, allSettled, race and any return for the same inputs</title>
  <desc id="pc-desc">Three input promises: P1 rejects with E1 at 100 milliseconds, P2 fulfills with b at 200 milliseconds, P3 fulfills with c at 300 milliseconds. Promise.all rejects at 100 milliseconds with E1. Promise.allSettled fulfills at 300 milliseconds with all three outcomes. Promise.race rejects at 100 milliseconds with E1 because P1 settles first. Promise.any fulfills at 200 milliseconds with b, the first fulfillment.</desc>
  <rect width="800" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke="#dfe5ee" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M420 44V384M580 44V384M740 44V384"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="260" y="36">0 ms</text>
      <text x="420" y="36">100 ms</text>
      <text x="580" y="36">200 ms</text>
      <text x="740" y="36">300 ms</text>
    </g>

    <text x="24" y="64" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">INPUTS</text>
    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="90">P1</text>
      <text x="24" y="122">P2</text>
      <text x="24" y="154">P3</text>
    </g>
    <g stroke="#8a96a3" stroke-width="3" stroke-linecap="round">
      <path d="M260 85H412"/>
      <path d="M260 117H572"/>
      <path d="M260 149H732"/>
    </g>
    <circle cx="420" cy="85" r="9" fill="#fde8e6" stroke="#b5473a" stroke-width="2.5"/>
    <circle cx="580" cy="117" r="9" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <circle cx="740" cy="149" r="9" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <g font-size="11.5" text-anchor="start">
      <text x="434" y="89" fill="#6b241c">rejects: E1</text>
      <text x="594" y="121" fill="#294a2e">fulfills: "b"</text>
      <text x="704" y="174" fill="#294a2e" text-anchor="end">fulfills: "c"</text>
    </g>

    <line x1="24" y1="186" x2="776" y2="186" stroke="#d5dce6" stroke-width="1.5"/>
    <text x="24" y="210" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">RESULTS</text>

    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="238">Promise.all</text>
      <text x="24" y="282">Promise.allSettled</text>
      <text x="24" y="326">Promise.race</text>
      <text x="24" y="370">Promise.any</text>
    </g>
    <g stroke="#8a96a3" stroke-width="3" stroke-linecap="round">
      <path d="M260 233H412"/>
      <path d="M260 277H732"/>
      <path d="M260 321H412"/>
      <path d="M260 365H572"/>
    </g>
    <circle cx="420" cy="233" r="9" fill="#fde8e6" stroke="#b5473a" stroke-width="2.5"/>
    <circle cx="740" cy="277" r="9" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <circle cx="420" cy="321" r="9" fill="#fde8e6" stroke="#b5473a" stroke-width="2.5"/>
    <circle cx="580" cy="365" r="9" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <g font-size="11.5" text-anchor="start">
      <text x="434" y="237" fill="#6b241c">rejects with E1 (first rejection)</text>
      <text x="726" y="301" fill="#294a2e" text-anchor="end">fulfills with all 3 outcomes: rejected E1, fulfilled b, fulfilled c</text>
      <text x="434" y="325" fill="#6b241c">rejects with E1 (first to settle)</text>
      <text x="594" y="369" fill="#294a2e">fulfills with "b"</text>
      <text x="594" y="384" fill="#294a2e">(first to fulfill)</text>
    </g>
    <text x="400" y="420" font-size="13" fill="#40566b">Same three inputs, four different answers: pick the combinator that matches your failure rule.</text>
  </g>
</svg>
