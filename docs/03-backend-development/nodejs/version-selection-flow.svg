<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" role="img" aria-labelledby="vsf-title vsf-desc">
  <title id="vsf-title">How a project's Node.js version is chosen and checked</title>
  <desc id="vsf-desc">Running nvm use in a project reads the .nvmrc file. If that version is not installed, nvm prints an error and you run nvm install. If it is installed, nvm puts it first on PATH for the current shell, so node resolves to that version. When npm install runs, npm compares the running version with the engines field in package.json. If it does not satisfy the range, npm warns about an unsupported engine, or fails if engine-strict is true. Otherwise dependencies install.</desc>
  <defs>
    <marker id="vsf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="180" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="45" font-size="14" font-weight="700" fill="#36424e">cd my-project, nvm use</text>

    <rect x="180" y="80" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="100" font-size="14" font-weight="700" fill="#263e5a">Read .nvmrc</text>
    <text x="300" y="117" font-size="11.5" fill="#263e5a">file contains: 24</text>

    <path d="M300 148 400 178 300 208 200 178z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="175" font-size="12" font-weight="700" fill="#36424e">version 24</text>
    <text x="300" y="189" font-size="12" font-weight="700" fill="#36424e">installed?</text>

    <rect x="500" y="154" width="256" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="628" y="174" font-size="14" font-weight="700" fill="#6b241c">nvm prints an error</text>
    <text x="628" y="191" font-size="11.5" fill="#6b241c">run nvm install 24, then retry</text>

    <rect x="180" y="228" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="248" font-size="14" font-weight="700" fill="#263e5a">Put v24 first on PATH</text>
    <text x="300" y="265" font-size="11.5" fill="#263e5a">for this shell only</text>

    <rect x="180" y="296" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="300" y="316" font-size="14" font-weight="700" fill="#263e5a">node resolves to v24</text>
    <text x="300" y="333" font-size="11.5" fill="#263e5a">node --version prints v24.x</text>

    <rect x="180" y="364" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="300" y="384" font-size="14" font-weight="700" fill="#66400f">npm install</text>
    <text x="300" y="401" font-size="11.5" fill="#66400f">reads package.json engines</text>

    <path d="M300 432 400 462 300 492 200 462z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="459" font-size="12" font-weight="700" fill="#36424e">satisfies</text>
    <text x="300" y="473" font-size="12" font-weight="700" fill="#36424e">"node": "&gt;=22"?</text>

    <rect x="500" y="438" width="256" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="628" y="458" font-size="14" font-weight="700" fill="#6b241c">Unsupported engine warning</text>
    <text x="628" y="475" font-size="11.5" fill="#6b241c">install fails if engine-strict=true</text>

    <rect x="180" y="512" width="240" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="300" y="539" font-size="14" font-weight="700" fill="#294a2e">Dependencies install</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M300 60V78" marker-end="url(#vsf-arrow)"/>
      <path d="M300 128V146" marker-end="url(#vsf-arrow)"/>
      <path d="M300 208V226" marker-end="url(#vsf-arrow)"/>
      <path d="M300 276V294" marker-end="url(#vsf-arrow)"/>
      <path d="M300 344V362" marker-end="url(#vsf-arrow)"/>
      <path d="M300 412V430" marker-end="url(#vsf-arrow)"/>
      <path d="M300 492V510" marker-end="url(#vsf-arrow)"/>
      <path d="M400 178H498" marker-end="url(#vsf-arrow)"/>
      <path d="M400 462H498" marker-end="url(#vsf-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="449" y="170">no</text>
      <text x="449" y="454">no</text>
      <text x="318" y="222" text-anchor="start">yes</text>
      <text x="318" y="506" text-anchor="start">yes</text>
    </g>
    <text x="390" y="584" font-size="13" fill="#40566b">.nvmrc chooses the version you run; engines checks it when packages install.</text>
  </g>
</svg>
