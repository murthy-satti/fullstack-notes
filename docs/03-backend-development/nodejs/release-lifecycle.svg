<svg xmlns="http://www.w3.org/2000/svg" width="780" height="310" viewBox="0 0 780 310" role="img" aria-labelledby="rlc-title rlc-desc">
  <title id="rlc-title">How Node.js major versions move through release phases</title>
  <desc id="rlc-desc">An even-numbered major version starts as Current with new features, becomes Active LTS with bug and security fixes and is recommended for production, then Maintenance LTS with critical fixes only, then end-of-life with no fixes. An odd-numbered major version is Current for a short time and then reaches end-of-life without ever becoming LTS.</desc>
  <defs>
    <marker id="rlc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="310" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="84" font-size="14" font-weight="700" fill="#36424e" text-anchor="start">Even major</text>
    <text x="24" y="101" font-size="11.5" fill="#36424e" text-anchor="start">e.g. 22, 24</text>
    <text x="24" y="224" font-size="14" font-weight="700" fill="#36424e" text-anchor="start">Odd major</text>
    <text x="24" y="241" font-size="11.5" fill="#36424e" text-anchor="start">e.g. 23, 25</text>

    <rect x="166" y="64" width="120" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="226" y="88" font-size="14" font-weight="700" fill="#263e5a">Current</text>
    <text x="226" y="106" font-size="11.5" fill="#263e5a">new features</text>

    <rect x="312" y="64" width="140" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <text x="382" y="88" font-size="14" font-weight="700" fill="#294a2e">Active LTS</text>
    <text x="382" y="106" font-size="11.5" fill="#294a2e">bug + security fixes</text>

    <rect x="478" y="64" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="553" y="88" font-size="14" font-weight="700" fill="#66400f">Maintenance LTS</text>
    <text x="553" y="106" font-size="11.5" fill="#66400f">critical fixes only</text>

    <rect x="654" y="64" width="110" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="709" y="88" font-size="14" font-weight="700" fill="#6b241c">End-of-life</text>
    <text x="709" y="106" font-size="11.5" fill="#6b241c">no fixes at all</text>

    <rect x="312" y="134" width="140" height="26" rx="13" fill="#53845b"/>
    <text x="382" y="152" font-size="11.5" font-weight="700" fill="#ffffff">use in production</text>

    <rect x="166" y="204" width="120" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="226" y="228" font-size="14" font-weight="700" fill="#263e5a">Current</text>
    <text x="226" y="246" font-size="11.5" fill="#263e5a">new features</text>

    <rect x="654" y="204" width="110" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="709" y="228" font-size="14" font-weight="700" fill="#6b241c">End-of-life</text>
    <text x="709" y="246" font-size="11.5" fill="#6b241c">no fixes at all</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M286 92H310" marker-end="url(#rlc-arrow)"/>
      <path d="M452 92H476" marker-end="url(#rlc-arrow)"/>
      <path d="M628 92H652" marker-end="url(#rlc-arrow)"/>
      <path d="M286 232H652" marker-end="url(#rlc-arrow)"/>
    </g>
    <text x="470" y="224" font-size="12" font-style="italic" fill="#40566b">short life; never becomes LTS</text>

    <line x1="24" y1="180" x2="756" y2="180" stroke="#d5dce6" stroke-width="1.5"/>
    <text x="390" y="292" font-size="13" fill="#40566b">Pick the newest Active LTS line; check the official schedule for exact dates.</text>
  </g>
</svg>
