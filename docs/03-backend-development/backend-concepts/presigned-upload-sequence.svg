<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="psu-title psu-desc">
  <title id="psu-title">Direct upload to object storage with a presigned URL</title>
  <desc id="psu-desc">The client asks the API to start an upload, sending the file name, type, and size. The API checks authentication, type, and size, creates a storage key and a pending record, and returns a presigned PUT URL that expires in five minutes. The client uploads the file bytes directly to object storage with that URL and gets 200 OK. The client then tells the API the upload is complete. The API checks the real size and type of the stored object, marks the record as uploaded, enqueues a scan and thumbnail job, and returns the file record. A worker reads the object, scans it, stores the variants, and marks the file available or deletes it if it is infected.</desc>
  <defs>
    <marker id="psu-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="psu-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="22" width="120" height="34" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="90" y="44" font-size="13" font-weight="700" fill="#36424e">Client</text>
    <rect x="240" y="22" width="120" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="300" y="44" font-size="13" font-weight="700" fill="#66400f">API server</text>
    <rect x="450" y="22" width="140" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="520" y="44" font-size="13" font-weight="700" fill="#463365">Object storage</text>
    <rect x="650" y="22" width="120" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="44" font-size="13" font-weight="700" fill="#263e5a">Worker</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M90 56V560M300 56V560M520 56V560M710 56V560"/>
    </g>

    <rect x="210" y="118" width="180" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="300" y="134" font-size="11.5" font-weight="700" fill="#66400f">check auth, type, size</text>
    <text x="300" y="150" font-size="11.5" fill="#66400f">create key, pending record</text>

    <rect x="210" y="382" width="180" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="300" y="398" font-size="11.5" font-weight="700" fill="#66400f">verify, mark uploaded</text>
    <text x="300" y="414" font-size="11.5" fill="#66400f">enqueue scan job</text>

    <rect x="630" y="512" width="160" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="710" y="528" font-size="11.5" font-weight="700" fill="#263e5a">mark available,</text>
    <text x="710" y="544" font-size="11.5" fill="#263e5a">or delete if infected</text>

    <g fill="#f5f7fb">
      <rect x="216" y="211" width="168" height="15"/>
      <rect x="276" y="243" width="48" height="15"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="195" y="84">1. POST /uploads</text>
      <text x="195" y="106">{ name, type, size }</text>
      <text x="195" y="174">2. { uploadUrl, key }</text>
      <text x="195" y="196">PUT URL expires in 5 min</text>
      <text x="300" y="222">3. PUT uploadUrl (file bytes)</text>
      <text x="300" y="254">200 OK</text>
      <text x="195" y="292">4. POST /uploads/:key/complete</text>
      <text x="410" y="328">HEAD object</text>
      <text x="410" y="360">real size + type</text>
      <text x="410" y="438">5. enqueue scan + thumbnails</text>
      <text x="195" y="466">200 { file }</text>
      <text x="615" y="494">GET, scan, store variants</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M90 90H298" marker-end="url(#psu-arrow)"/>
      <path d="M90 230H518" marker-end="url(#psu-arrow)"/>
      <path d="M90 300H298" marker-end="url(#psu-arrow)"/>
      <path d="M300 336H518" marker-end="url(#psu-arrow)"/>
      <path d="M300 444H708" marker-end="url(#psu-arrow)"/>
      <path d="M710 500H522" marker-end="url(#psu-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M300 180H92" marker-end="url(#psu-ret)"/>
      <path d="M520 260H92" marker-end="url(#psu-ret)"/>
      <path d="M520 366H302" marker-end="url(#psu-ret)"/>
      <path d="M300 472H92" marker-end="url(#psu-ret)"/>
    </g>
    <text x="400" y="584" font-size="13" fill="#40566b">The file bytes never pass through the API, but the API still verifies what actually arrived.</text>
  </g>
</svg>
