<svg xmlns="http://www.w3.org/2000/svg" width="800" height="652" viewBox="0 0 800 652" role="img" aria-labelledby="pkce-title pkce-desc">
  <title id="pkce-title">OAuth 2.0 authorization code flow with PKCE</title>
  <desc id="pkce-desc">The user clicks Connect. The client app creates a state value and a code_verifier and derives the code_challenge as the SHA-256 hash of the verifier. It redirects the browser to the authorization server's authorize endpoint with the client ID, scopes, state, and code_challenge. The user signs in and approves the scopes, and the authorization server redirects the browser back to the redirect URI with a single-use code and the same state. The client checks the state, then posts the code and the code_verifier to the token endpoint. The authorization server checks that the hash of the verifier matches the stored challenge and returns access, refresh, and ID tokens. The client calls the resource server API with the access token as a Bearer token.</desc>
  <defs>
    <marker id="pkce-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pkce-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="652" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="22" width="120" height="34" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="90" y="44" font-size="13" font-weight="700" fill="#36424e">User / browser</text>
    <rect x="220" y="22" width="140" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="290" y="44" font-size="13" font-weight="700" fill="#66400f">Client app</text>
    <rect x="430" y="22" width="160" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="510" y="44" font-size="13" font-weight="700" fill="#463365">Authorization server</text>
    <rect x="640" y="22" width="140" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="44" font-size="13" font-weight="700" fill="#263e5a">Resource server</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M90 56V590M290 56V590M510 56V590M710 56V590"/>
    </g>

    <rect x="180" y="104" width="220" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="290" y="120" font-size="11.5" font-weight="700" fill="#66400f">create state, code_verifier</text>
    <text x="290" y="136" font-size="11.5" fill="#66400f">challenge = SHA-256(verifier)</text>

    <rect x="420" y="240" width="180" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="510" y="256" font-size="11.5" font-weight="700" fill="#463365">3. user signs in</text>
    <text x="510" y="272" font-size="11.5" fill="#463365">and approves scopes</text>

    <rect x="190" y="352" width="200" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="290" y="372" font-size="11.5" font-weight="700" fill="#66400f">state matches stored value?</text>

    <rect x="420" y="438" width="180" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="510" y="454" font-size="11.5" font-weight="700" fill="#463365">SHA-256(verifier)</text>
    <text x="510" y="470" font-size="11.5" fill="#463365">== stored challenge?</text>

    <g fill="#f5f7fb">
      <rect x="192" y="184" width="210" height="34"/>
      <rect x="168" y="294" width="244" height="16"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="190" y="84">1. click Connect</text>
      <text x="190" y="162">2. 302 to /authorize</text>
      <text x="297" y="196">GET /authorize?client_id, scope,</text>
      <text x="297" y="212">state, code_challenge (S256)</text>
      <text x="290" y="306">4. 302 to redirect_uri?code=...&amp;state=...</text>
      <text x="190" y="334">code + state</text>
      <text x="400" y="404">5. POST /token</text>
      <text x="400" y="428">code + code_verifier</text>
      <text x="400" y="496">access, refresh, id tokens</text>
      <text x="400" y="532">6. API call, Bearer token</text>
      <text x="400" y="562">200 OK + data</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M90 90H288" marker-end="url(#pkce-arrow)"/>
      <path d="M90 226H508" marker-end="url(#pkce-arrow)"/>
      <path d="M90 340H288" marker-end="url(#pkce-arrow)"/>
      <path d="M290 410H508" marker-end="url(#pkce-arrow)"/>
      <path d="M290 538H708" marker-end="url(#pkce-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M290 168H92" marker-end="url(#pkce-ret)"/>
      <path d="M510 312H92" marker-end="url(#pkce-ret)"/>
      <path d="M510 502H292" marker-end="url(#pkce-ret)"/>
      <path d="M710 568H292" marker-end="url(#pkce-ret)"/>
    </g>

    <text x="400" y="614" font-size="12" fill="#40566b">Steps 2 to 4 are front channel (browser redirects); steps 5 and 6 are back channel (server to server).</text>
    <text x="400" y="636" font-size="13" fill="#40566b">The code passes through the browser but the verifier never does, so a stolen code is useless.</text>
  </g>
</svg>
