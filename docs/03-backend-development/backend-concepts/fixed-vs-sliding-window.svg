<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="fvs-title fvs-desc">
  <title id="fvs-title">The fixed window boundary burst compared with a sliding window</title>
  <desc id="fvs-desc">With a fixed window and a limit of 5 requests per minute, a client sends 5 requests at 12:00:59 that count against the 12:00 window and 5 more at 12:01:00 that count against the new 12:01 window, whose counter has just reset. All 10 are allowed within about two seconds, twice the intended rate. With a sliding window of 60 seconds, the requests at 12:01:00 are counted together with the 5 from the previous 60 seconds, so they are rejected with 429.</desc>
  <rect width="780" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="80" y="32" font-size="14" font-weight="700" fill="#263e5a" text-anchor="start">Fixed window: limit 5 per minute</text>
    <rect x="80" y="58" width="320" height="82" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="400" y="58" width="320" height="82" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="220" y="96" font-size="12" font-weight="700" fill="#263e5a">12:00 window</text>
    <text x="220" y="113" font-size="11.5" fill="#263e5a">count 5 of 5</text>
    <text x="580" y="96" font-size="12" font-weight="700" fill="#463365">12:01 window (reset to 0)</text>
    <text x="580" y="113" font-size="11.5" fill="#463365">count 5 of 5</text>
    <g fill="#53845b">
      <circle cx="388" cy="72" r="5"/><circle cx="388" cy="86" r="5"/><circle cx="388" cy="100" r="5"/><circle cx="388" cy="114" r="5"/><circle cx="388" cy="128" r="5"/>
      <circle cx="412" cy="72" r="5"/><circle cx="412" cy="86" r="5"/><circle cx="412" cy="100" r="5"/><circle cx="412" cy="114" r="5"/><circle cx="412" cy="128" r="5"/>
    </g>
    <path d="M380 50V44H420V50" fill="none" stroke="#b5473a" stroke-width="2"/>
    <text x="428" y="48" font-size="12" font-weight="700" fill="#6b241c" text-anchor="start">10 allowed in about 2 s: twice the limit</text>
    <path d="M80 150H720M80 146V154M400 146V154M720 146V154" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g font-size="11.5" fill="#40566b">
      <text x="80" y="168">12:00:00</text>
      <text x="400" y="168">12:01:00</text>
      <text x="720" y="168">12:02:00</text>
    </g>

    <text x="80" y="208" font-size="14" font-weight="700" fill="#66400f" text-anchor="start">Sliding window: limit 5 per 60 s</text>
    <rect x="92" y="226" width="320" height="82" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="230" y="264" font-size="12" font-weight="700" fill="#66400f">60 s before the new request</text>
    <text x="230" y="281" font-size="11.5" fill="#66400f">already holds 5 requests</text>
    <g fill="#53845b">
      <circle cx="388" cy="240" r="5"/><circle cx="388" cy="254" r="5"/><circle cx="388" cy="268" r="5"/><circle cx="388" cy="282" r="5"/><circle cx="388" cy="296" r="5"/>
    </g>
    <g fill="#b5473a">
      <circle cx="412" cy="240" r="5"/><circle cx="412" cy="254" r="5"/><circle cx="412" cy="268" r="5"/><circle cx="412" cy="282" r="5"/><circle cx="412" cy="296" r="5"/>
    </g>
    <text x="428" y="272" font-size="12" font-weight="700" fill="#6b241c" text-anchor="start">5 more at 12:01:00: rejected with 429</text>
    <path d="M80 318H720M80 314V322M400 314V322M720 314V322" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g font-size="11.5" fill="#40566b">
      <text x="80" y="336">12:00:00</text>
      <text x="400" y="336">12:01:00</text>
      <text x="720" y="336">12:02:00</text>
    </g>
    <g font-size="11.5" fill="#40566b" text-anchor="start">
      <circle cx="560" cy="200" r="5" fill="#53845b"/><text x="570" y="204">allowed</text>
      <circle cx="640" cy="200" r="5" fill="#b5473a"/><text x="650" y="204">rejected (429)</text>
    </g>
    <text x="390" y="372" font-size="13" fill="#40566b">A sliding window always looks back a full 60 s, so a burst cannot straddle a counter reset.</text>
  </g>
</svg>
