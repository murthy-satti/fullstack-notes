<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="ccg-title ccg-desc">
  <title id="ccg-title">Three checks a cookie-authenticated cross-origin request must pass</title>
  <desc id="ccg-desc">First, the frontend must call fetch with credentials set to include, or no cookie is sent. Second, the cookie's SameSite setting must allow it: Lax or Strict works for same-site requests, while cross-site requests need SameSite=None with Secure, otherwise the browser withholds the cookie. Third, the server must answer with Access-Control-Allow-Origin set to the exact origin and Access-Control-Allow-Credentials true, plus Vary: Origin; a wildcard or a missing header hides the response. Only when all three pass can JavaScript read the response.</desc>
  <defs>
    <marker id="ccg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="330" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="40" width="180" height="116" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="110" y="64" font-size="14" font-weight="700" fill="#66400f">1. Frontend</text>
    <g font-size="11.5" fill="#66400f">
      <text x="110" y="92">fetch(url, {</text>
      <text x="110" y="110">credentials: "include"</text>
      <text x="110" y="128">})</text>
    </g>
    <rect x="222" y="40" width="180" height="116" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="312" y="64" font-size="14" font-weight="700" fill="#463365">2. Cookie</text>
    <g font-size="11.5" fill="#463365">
      <text x="312" y="92">same-site API:</text>
      <text x="312" y="108">SameSite=Lax works</text>
      <text x="312" y="128">cross-site API:</text>
      <text x="312" y="144">SameSite=None; Secure</text>
    </g>
    <rect x="424" y="40" width="190" height="116" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="519" y="64" font-size="14" font-weight="700" fill="#263e5a">3. Server response</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="519" y="92">Allow-Origin: exact origin</text>
      <text x="519" y="110">Allow-Credentials: true</text>
      <text x="519" y="128">Vary: Origin</text>
    </g>
    <rect x="636" y="62" width="144" height="72" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="708" y="94" font-size="14" font-weight="700" fill="#294a2e">JS reads</text>
    <text x="708" y="112" font-size="11.5" fill="#294a2e">the user's data</text>

    <g fill="#fde8e6" stroke="#b5473a" stroke-width="2">
      <rect x="20" y="206" width="180" height="48" rx="8"/>
      <rect x="222" y="206" width="180" height="48" rx="8"/>
      <rect x="424" y="206" width="190" height="48" rx="8"/>
    </g>
    <g fill="#6b241c">
      <text x="110" y="226" font-size="13" font-weight="700">No cookie sent</text>
      <text x="110" y="243" font-size="11.5">request is anonymous</text>
      <text x="312" y="226" font-size="13" font-weight="700">Cookie withheld</text>
      <text x="312" y="243" font-size="11.5">browser drops it</text>
      <text x="519" y="226" font-size="13" font-weight="700">Response hidden</text>
      <text x="519" y="243" font-size="11.5">* or missing header</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 98H220" marker-end="url(#ccg-arrow)"/>
      <path d="M402 98H422" marker-end="url(#ccg-arrow)"/>
      <path d="M614 98H634" marker-end="url(#ccg-arrow)"/>
      <path d="M110 156V204" marker-end="url(#ccg-arrow)"/>
      <path d="M312 156V204" marker-end="url(#ccg-arrow)"/>
      <path d="M519 156V204" marker-end="url(#ccg-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#b5473a" text-anchor="start">
      <text x="118" y="186">if missing</text>
      <text x="320" y="186">if not allowed</text>
      <text x="527" y="186">if wrong</text>
    </g>
    <text x="400" y="290" font-size="13" fill="#40566b">All three must pass; a wildcard Allow-Origin never works with credentials.</text>
  </g>
</svg>
