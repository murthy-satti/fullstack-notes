<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="vtb-title vtb-desc">
  <title id="vtb-title">Validate on input at the trust boundary, encode on output</title>
  <desc id="vtb-desc">Untrusted input from browsers and mobile apps, partner APIs and webhooks, uploaded files, queues and other services, and environment configuration all pass through validation at the trust boundary. Invalid input is rejected early with 400 or 422 and field errors. Valid, typed data reaches the business logic, which applies semantic checks. When data leaves the core it is encoded for its destination: parameters for SQL, entity encoding for HTML, an argument array instead of a shell, and JSON escaping for logs.</desc>
  <defs>
    <marker id="vtb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="105" y="44" font-size="13" font-weight="700" fill="#40566b">Untrusted input</text>
    <text x="311" y="44" font-size="13" font-weight="700" fill="#40566b">Trust boundary</text>
    <text x="505" y="44" font-size="13" font-weight="700" fill="#40566b">Trusted core</text>
    <text x="700" y="44" font-size="13" font-weight="700" fill="#40566b">Encode per output</text>

    <g font-size="12.5" font-weight="700" fill="#36424e">
      <rect x="20" y="60" width="170" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="105" y="85">Browser / mobile app</text>
      <rect x="20" y="114" width="170" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="105" y="139">Partner API, webhook</text>
      <rect x="20" y="168" width="170" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="105" y="193">Uploaded files</text>
      <rect x="20" y="222" width="170" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="105" y="247">Queue, other service</text>
      <rect x="20" y="276" width="170" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="105" y="301">Env vars, config</text>
    </g>

    <rect x="236" y="60" width="150" height="256" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="311" y="96" font-size="14" font-weight="700" fill="#263e5a">Validate</text>
    <g font-size="11.5" fill="#263e5a">
      <text x="311" y="130">schema and types</text>
      <text x="311" y="152">lengths and ranges</text>
      <text x="311" y="174">allowlisted values</text>
      <text x="311" y="196">unknown fields stripped</text>
      <text x="311" y="218">normalize (trim, NFC)</text>
    </g>

    <rect x="236" y="352" width="150" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="311" y="372" font-size="14" font-weight="700" fill="#6b241c">400 / 422</text>
    <text x="311" y="389" font-size="11.5" fill="#6b241c">field errors, early</text>

    <rect x="430" y="148" width="150" height="80" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="505" y="178" font-size="14" font-weight="700" fill="#66400f">Business logic</text>
    <text x="505" y="198" font-size="11.5" fill="#66400f">semantic checks:</text>
    <text x="505" y="214" font-size="11.5" fill="#66400f">stock, dates, ownership</text>

    <rect x="620" y="60" width="160" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="700" y="80" font-size="14" font-weight="700" fill="#294a2e">SQL</text>
    <text x="700" y="97" font-size="11.5" fill="#294a2e">parameterized query</text>
    <rect x="620" y="124" width="160" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="700" y="144" font-size="14" font-weight="700" fill="#294a2e">HTML</text>
    <text x="700" y="161" font-size="11.5" fill="#294a2e">entity-encode output</text>
    <rect x="620" y="188" width="160" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="700" y="208" font-size="14" font-weight="700" fill="#294a2e">Shell</text>
    <text x="700" y="225" font-size="11.5" fill="#294a2e">argument array, no shell</text>
    <rect x="620" y="252" width="160" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="700" y="272" font-size="14" font-weight="700" fill="#294a2e">Logs</text>
    <text x="700" y="289" font-size="11.5" fill="#294a2e">JSON, escape newlines</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 80H234" marker-end="url(#vtb-arrow)"/>
      <path d="M190 134H234" marker-end="url(#vtb-arrow)"/>
      <path d="M190 188H234" marker-end="url(#vtb-arrow)"/>
      <path d="M190 242H234" marker-end="url(#vtb-arrow)"/>
      <path d="M190 296H234" marker-end="url(#vtb-arrow)"/>
      <path d="M311 316V350" marker-end="url(#vtb-arrow)"/>
      <path d="M386 188H428" marker-end="url(#vtb-arrow)"/>
      <path d="M580 188H600V84H618" marker-end="url(#vtb-arrow)"/>
      <path d="M600 148H618" marker-end="url(#vtb-arrow)"/>
      <path d="M600 188V212H618" marker-end="url(#vtb-arrow)"/>
      <path d="M600 212V276H618" marker-end="url(#vtb-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="342" y="338" text-anchor="start">invalid</text>
      <text x="407" y="180">valid</text>
    </g>
    <text x="400" y="426" font-size="13" fill="#40566b">Validate on input at every boundary; encode on output for the specific destination.</text>
  </g>
</svg>
