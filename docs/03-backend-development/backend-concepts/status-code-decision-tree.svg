<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="sdt-title sdt-desc">
  <title id="sdt-title">Which status code should an endpoint return?</title>
  <desc id="sdt-desc">A request is checked in order. Over the rate limit returns 429 with Retry-After. Missing or invalid credentials return 401 with WWW-Authenticate. Malformed or invalid input returns 400, or 422 for business-rule failures. A missing resource returns 404, or 410 if it was removed for good. A caller who is not allowed gets 403, or 404 to hide that the resource exists. A conflict with the current state returns 409. On success, return 200 with data, 201 with a Location header for a new resource, 202 if the work finishes later, or 204 when there is nothing to return. At any step, a server failure returns 500 for a bug, 502 for a bad upstream reply, 503 when overloaded or down, or 504 when an upstream timed out.</desc>
  <defs>
    <marker id="sdt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="700" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="20" width="240" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="43" font-size="14" font-weight="700" fill="#36424e">Request arrives</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M200 78 320 108 200 138 80 108z"/>
      <path d="M200 162 320 192 200 222 80 192z"/>
      <path d="M200 246 320 276 200 306 80 276z"/>
      <path d="M200 330 320 360 200 390 80 360z"/>
      <path d="M200 414 320 444 200 474 80 444z"/>
      <path d="M200 498 320 528 200 558 80 528z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="200" y="105">over the</text>
      <text x="200" y="119">rate limit?</text>
      <text x="200" y="189">credentials</text>
      <text x="200" y="203">valid?</text>
      <text x="200" y="273">input well formed</text>
      <text x="200" y="287">and valid?</text>
      <text x="200" y="357">resource</text>
      <text x="200" y="371">exists?</text>
      <text x="200" y="441">caller allowed on</text>
      <text x="200" y="455">this resource?</text>
      <text x="200" y="525">conflicts with</text>
      <text x="200" y="539">current state?</text>
    </g>

    <g fill="#fde8e6" stroke="#b5473a" stroke-width="2">
      <rect x="350" y="86" width="220" height="44" rx="8"/>
      <rect x="350" y="170" width="220" height="44" rx="8"/>
      <rect x="350" y="254" width="220" height="44" rx="8"/>
      <rect x="350" y="338" width="220" height="44" rx="8"/>
      <rect x="350" y="422" width="220" height="44" rx="8"/>
      <rect x="350" y="506" width="220" height="44" rx="8"/>
    </g>
    <g fill="#6b241c">
      <text x="460" y="105" font-size="14" font-weight="700">429 Too Many Requests</text>
      <text x="460" y="121" font-size="11.5">send Retry-After</text>
      <text x="460" y="189" font-size="14" font-weight="700">401 Unauthorized</text>
      <text x="460" y="205" font-size="11.5">send WWW-Authenticate</text>
      <text x="460" y="273" font-size="14" font-weight="700">400 Bad Request</text>
      <text x="460" y="289" font-size="11.5">or 422 for business rules</text>
      <text x="460" y="357" font-size="14" font-weight="700">404 Not Found</text>
      <text x="460" y="373" font-size="11.5">or 410 if removed for good</text>
      <text x="460" y="441" font-size="14" font-weight="700">403 Forbidden</text>
      <text x="460" y="457" font-size="11.5">or 404 to hide that it exists</text>
      <text x="460" y="525" font-size="14" font-weight="700">409 Conflict</text>
      <text x="460" y="541" font-size="11.5">duplicate or invalid state</text>
    </g>

    <rect x="590" y="84" width="194" height="384" rx="10" fill="#fffafa" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="687" y="106" font-size="12" font-weight="700" fill="#6b241c">At any step, if the</text>
    <text x="687" y="122" font-size="12" font-weight="700" fill="#6b241c">server itself fails:</text>
    <g fill="#fde8e6" stroke="#b5473a" stroke-width="2">
      <rect x="602" y="140" width="170" height="44" rx="8"/>
      <rect x="602" y="218" width="170" height="44" rx="8"/>
      <rect x="602" y="296" width="170" height="44" rx="8"/>
      <rect x="602" y="374" width="170" height="44" rx="8"/>
    </g>
    <g fill="#6b241c">
      <text x="687" y="159" font-size="13" font-weight="700">500 Internal Error</text>
      <text x="687" y="175" font-size="11.5">unhandled bug</text>
      <text x="687" y="237" font-size="13" font-weight="700">502 Bad Gateway</text>
      <text x="687" y="253" font-size="11.5">bad upstream reply</text>
      <text x="687" y="315" font-size="13" font-weight="700">503 Unavailable</text>
      <text x="687" y="331" font-size="11.5">overloaded or down</text>
      <text x="687" y="393" font-size="13" font-weight="700">504 Gateway Timeout</text>
      <text x="687" y="409" font-size="11.5">upstream timed out</text>
    </g>

    <g fill="#e8f5e9" stroke="#53845b" stroke-width="2">
      <rect x="40" y="600" width="170" height="48" rx="8"/>
      <rect x="226" y="600" width="170" height="48" rx="8"/>
      <rect x="412" y="600" width="170" height="48" rx="8"/>
      <rect x="598" y="600" width="170" height="48" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="125" y="620" font-size="14" font-weight="700">200 OK</text>
      <text x="125" y="637" font-size="11.5">data in the body</text>
      <text x="311" y="620" font-size="14" font-weight="700">201 Created</text>
      <text x="311" y="637" font-size="11.5">+ Location header</text>
      <text x="497" y="620" font-size="14" font-weight="700">202 Accepted</text>
      <text x="497" y="637" font-size="11.5">finishes later</text>
      <text x="683" y="620" font-size="14" font-weight="700">204 No Content</text>
      <text x="683" y="637" font-size="11.5">nothing to return</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 56V76" marker-end="url(#sdt-arrow)"/>
      <path d="M200 138V160" marker-end="url(#sdt-arrow)"/>
      <path d="M200 222V244" marker-end="url(#sdt-arrow)"/>
      <path d="M200 306V328" marker-end="url(#sdt-arrow)"/>
      <path d="M200 390V412" marker-end="url(#sdt-arrow)"/>
      <path d="M200 474V496" marker-end="url(#sdt-arrow)"/>
      <path d="M320 108H348" marker-end="url(#sdt-arrow)"/>
      <path d="M320 192H348" marker-end="url(#sdt-arrow)"/>
      <path d="M320 276H348" marker-end="url(#sdt-arrow)"/>
      <path d="M320 360H348" marker-end="url(#sdt-arrow)"/>
      <path d="M320 444H348" marker-end="url(#sdt-arrow)"/>
      <path d="M320 528H348" marker-end="url(#sdt-arrow)"/>
      <path d="M200 558V582H125V598" marker-end="url(#sdt-arrow)"/>
      <path d="M200 558V582H311V598" marker-end="url(#sdt-arrow)"/>
      <path d="M200 558V582H497V598" marker-end="url(#sdt-arrow)"/>
      <path d="M200 558V582H683V598" marker-end="url(#sdt-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="334" y="100">yes</text>
      <text x="334" y="184">no</text>
      <text x="334" y="268">no</text>
      <text x="334" y="352">no</text>
      <text x="334" y="436">no</text>
      <text x="334" y="520">yes</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="208" y="154">no</text>
      <text x="208" y="238">yes</text>
      <text x="208" y="322">yes</text>
      <text x="208" y="406">yes</text>
      <text x="208" y="490">yes</text>
    </g>
    <text x="420" y="576" font-size="12" font-weight="700" fill="#294a2e">no: succeeded, so what is the result?</text>
    <text x="400" y="684" font-size="13" fill="#40566b">Check in this order and return the first code that applies; pair each code with its header.</text>
  </g>
</svg>
