<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="pfd-title pfd-desc">
  <title id="pfd-title">Serving a private file with a short-lived signed URL</title>
  <desc id="pfd-desc">The client requests GET /api/invoices/42/download. The API checks the session and that the user owns invoice 42; if not, it returns 404 or 403. If allowed, it signs a GET URL that expires in five minutes and returns a 302 redirect to it. The client follows the URL to object storage or the CDN, which checks the signature and expiry and returns the file bytes with Content-Disposition: attachment. If the same URL is used after it expires, storage returns 403.</desc>
  <defs>
    <marker id="pfd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pfd-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="pfd-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="50" y="22" width="120" height="34" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="110" y="44" font-size="13" font-weight="700" fill="#36424e">Client</text>
    <rect x="320" y="22" width="120" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="380" y="44" font-size="13" font-weight="700" fill="#66400f">API</text>
    <rect x="580" y="22" width="140" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="650" y="44" font-size="13" font-weight="700" fill="#463365">Storage / CDN</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M110 56V456M380 56V456M650 56V456"/>
    </g>

    <rect x="290" y="104" width="180" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="380" y="120" font-size="11.5" font-weight="700" fill="#66400f">session valid and</text>
    <text x="380" y="136" font-size="11.5" fill="#66400f">user owns invoice 42?</text>

    <rect x="290" y="184" width="180" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="380" y="200" font-size="11.5" font-weight="700" fill="#66400f">sign GET URL</text>
    <text x="380" y="216" font-size="11.5" fill="#66400f">expires in 5 minutes</text>

    <rect x="570" y="300" width="160" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="650" y="316" font-size="11.5" font-weight="700" fill="#463365">check signature</text>
    <text x="650" y="332" font-size="11.5" fill="#463365">and expiry</text>

    <g fill="#f5f7fb">
      <rect x="320" y="275" width="120" height="15"/>
      <rect x="326" y="351" width="108" height="15"/>
      <rect x="290" y="375" width="180" height="15"/>
      <rect x="300" y="415" width="160" height="15"/>
      <rect x="350" y="441" width="60" height="15"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="245" y="84">1. GET /invoices/42/download</text>
      <text x="245" y="244">2. 302 Location: signed URL</text>
      <text x="380" y="286">3. GET signed URL</text>
      <text x="380" y="362">4. 200 file bytes</text>
      <text x="380" y="386">Content-Disposition: attachment</text>
      <text x="380" y="426">later: same URL, expired</text>
    </g>
    <text x="245" y="164" font-size="11.5" font-weight="700" fill="#6b241c">not allowed: 404 / 403</text>
    <text x="380" y="452" font-size="11.5" font-weight="700" fill="#6b241c">403</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M110 90H378" marker-end="url(#pfd-arrow)"/>
      <path d="M110 292H648" marker-end="url(#pfd-arrow)"/>
      <path d="M110 432H648" marker-end="url(#pfd-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M380 250H112" marker-end="url(#pfd-ret)"/>
      <path d="M650 368H112" marker-end="url(#pfd-ret)"/>
    </g>
    <g fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M380 170H112" marker-end="url(#pfd-bad)"/>
      <path d="M650 458H112" marker-end="url(#pfd-bad)"/>
    </g>
    <text x="390" y="486" font-size="13" fill="#40566b">The API decides who may download; the signed URL only carries that decision for a few minutes.</text>
  </g>
</svg>
