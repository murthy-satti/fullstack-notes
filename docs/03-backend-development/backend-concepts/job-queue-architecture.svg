<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="jqa-title jqa-desc">
  <title id="jqa-title">How a background job moves from the API to workers</title>
  <desc id="jqa-desc">The client posts to /api/exports. The API, acting as producer, saves the record, enqueues a job with the export ID, and immediately returns 202 Accepted with a Location header. The queue or broker, such as Redis, RabbitMQ, or SQS, delivers the job to one of several workers. If the job succeeds the worker saves the result and status in the database. If it fails and attempts are left, the job goes back to the queue after a backoff delay; if no attempts are left it moves to the dead-letter queue, where engineers are alerted and can inspect and replay it. The client polls the status URL, and the API reads the status from the database.</desc>
  <defs>
    <marker id="jqa-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="jqa-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="70" width="110" height="70" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="75" y="110" font-size="14" font-weight="700" fill="#36424e">Client</text>

    <rect x="230" y="70" width="150" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="305" y="96" font-size="14" font-weight="700" fill="#66400f">API (producer)</text>
    <text x="305" y="114" font-size="11.5" fill="#66400f">save record,</text>
    <text x="305" y="130" font-size="11.5" fill="#66400f">enqueue job</text>

    <rect x="440" y="70" width="150" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="515" y="96" font-size="14" font-weight="700" fill="#463365">Queue / broker</text>
    <text x="515" y="114" font-size="11.5" fill="#463365">Redis, RabbitMQ,</text>
    <text x="515" y="130" font-size="11.5" fill="#463365">SQS; stores durably</text>

    <rect x="640" y="70" width="140" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="710" y="96" font-size="14" font-weight="700" fill="#263e5a">Workers (× N)</text>
    <text x="710" y="114" font-size="11.5" fill="#263e5a">run the job,</text>
    <text x="710" y="130" font-size="11.5" fill="#263e5a">ack or fail</text>

    <rect x="230" y="186" width="150" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="305" y="206" font-size="14" font-weight="700" fill="#36424e">Database</text>
    <text x="305" y="223" font-size="11.5" fill="#36424e">status, result URL</text>

    <path d="M710 182 770 210 710 238 650 210z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="710" y="214" font-size="12" font-weight="700" fill="#36424e">succeeded?</text>
    <path d="M710 272 770 300 710 328 650 300z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="710" y="297" font-size="12" font-weight="700" fill="#36424e">attempts</text>
    <text x="710" y="311" font-size="12" font-weight="700" fill="#36424e">left?</text>

    <rect x="610" y="358" width="170" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="695" y="378" font-size="14" font-weight="700" fill="#6b241c">Dead-letter queue</text>
    <text x="695" y="395" font-size="11.5" fill="#6b241c">alert, inspect, replay</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M130 86H228" marker-end="url(#jqa-arrow)"/>
      <path d="M130 126H228" marker-end="url(#jqa-arrow)"/>
      <path d="M380 105H438" marker-end="url(#jqa-arrow)"/>
      <path d="M590 105H638" marker-end="url(#jqa-arrow)"/>
      <path d="M710 140V180" marker-end="url(#jqa-arrow)"/>
      <path d="M650 210H382" marker-end="url(#jqa-arrow)"/>
      <path d="M710 238V270" marker-end="url(#jqa-arrow)"/>
      <path d="M650 300H515V142" marker-end="url(#jqa-arrow)"/>
      <path d="M710 328V356" marker-end="url(#jqa-arrow)"/>
      <path d="M305 140V184" marker-end="url(#jqa-arrow)"/>
    </g>
    <path d="M228 106H132" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#jqa-ret)"/>
    <g font-size="11.5" fill="#36424e">
      <text x="179" y="80">POST /exports</text>
      <text x="179" y="100">202 + Location</text>
      <text x="179" y="120">GET status</text>
      <text x="409" y="98">enqueue</text>
      <text x="614" y="98">deliver</text>
      <text x="522" y="202">yes: save result</text>
      <text x="572" y="292">retry after backoff</text>
      <text x="337" y="166" text-anchor="start">reads status</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="720" y="256">no</text>
      <text x="720" y="346">no</text>
      <text x="636" y="318" text-anchor="end">yes</text>
    </g>
    <text x="400" y="426" font-size="13" fill="#40566b">The client gets an answer in milliseconds; the slow work happens later, with retries and a safety net.</text>
  </g>
</svg>
