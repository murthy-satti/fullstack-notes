<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="sqli-title sqli-desc">
  <title id="sqli-title">SQL injection with string concatenation versus a parameterized query</title>
  <desc id="sqli-desc">The client sends the email value ' OR '1'='1. With string concatenation the value is pasted into the SQL text, the quote ends the string literal, and OR '1'='1' becomes part of the query, so every row matches and all users are returned. With a parameterized query the SQL text uses a placeholder, the database compiles the query first and binds the value only as data, so no email matches and zero rows are returned.</desc>
  <defs>
    <marker id="sqli-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="376" height="356" rx="10" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <rect x="408" y="16" width="376" height="356" rx="10" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
    <text x="204" y="42" font-size="14" font-weight="700" fill="#6b241c">String concatenation</text>
    <text x="596" y="42" font-size="14" font-weight="700" fill="#294a2e">Parameterized query</text>

    <rect x="34" y="58" width="340" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="204" y="78" font-size="14" font-weight="700" fill="#36424e">Input from the client</text>
    <text x="204" y="95" font-size="11.5" font-family="Courier New, monospace" fill="#36424e">email = ' OR '1'='1</text>
    <rect x="426" y="58" width="340" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="596" y="78" font-size="14" font-weight="700" fill="#36424e">Input from the client</text>
    <text x="596" y="95" font-size="11.5" font-family="Courier New, monospace" fill="#36424e">email = ' OR '1'='1</text>

    <rect x="34" y="126" width="340" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="204" y="148" font-size="13" font-weight="700" fill="#66400f">value pasted into the SQL text</text>
    <text x="204" y="170" font-size="11.5" font-family="Courier New, monospace" fill="#66400f">SELECT * FROM users</text>
    <text x="204" y="184" font-size="11.5" font-family="Courier New, monospace" fill="#66400f">WHERE email = '' OR '1'='1'</text>
    <rect x="426" y="126" width="340" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="596" y="148" font-size="13" font-weight="700" fill="#66400f">text and value sent separately</text>
    <text x="596" y="170" font-size="11.5" font-family="Courier New, monospace" fill="#66400f">SELECT * FROM users WHERE email = $1</text>
    <text x="596" y="184" font-size="11.5" font-family="Courier New, monospace" fill="#66400f">params: [ "' OR '1'='1" ]</text>

    <rect x="34" y="210" width="340" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="204" y="232" font-size="13" font-weight="700" fill="#36424e">Database parses it</text>
    <text x="204" y="252" font-size="11.5" fill="#36424e">the quote ends the string; OR '1'='1' runs as code</text>
    <rect x="426" y="210" width="340" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="596" y="232" font-size="13" font-weight="700" fill="#36424e">Database compiles, then binds</text>
    <text x="596" y="252" font-size="11.5" fill="#36424e">the value can only ever be data, never SQL</text>

    <rect x="34" y="286" width="340" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="204" y="306" font-size="14" font-weight="700" fill="#6b241c">Every row matches</text>
    <text x="204" y="323" font-size="11.5" fill="#6b241c">all users returned</text>
    <rect x="426" y="286" width="340" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="596" y="306" font-size="14" font-weight="700" fill="#294a2e">No email matches</text>
    <text x="596" y="323" font-size="11.5" fill="#294a2e">0 rows returned</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M204 106V124" marker-end="url(#sqli-arrow)"/>
      <path d="M204 190V208" marker-end="url(#sqli-arrow)"/>
      <path d="M204 266V284" marker-end="url(#sqli-arrow)"/>
      <path d="M596 106V124" marker-end="url(#sqli-arrow)"/>
      <path d="M596 190V208" marker-end="url(#sqli-arrow)"/>
      <path d="M596 266V284" marker-end="url(#sqli-arrow)"/>
    </g>
    <text x="400" y="400" font-size="13" fill="#40566b">Escaping by hand is fragile; placeholders keep user input out of the query's structure.</text>
  </g>
</svg>
