<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="cbd-title cbd-desc">
  <title id="cbd-title">How the browser applies CORS to a fetch call</title>
  <desc id="cbd-desc">When page JavaScript calls fetch, a same-origin request involves no CORS. For a cross-origin request, a simple request (GET, HEAD, or POST with safelisted headers and a form or text body) is sent directly; anything else first needs a preflight OPTIONS request. If the server does not approve the preflight, the browser reports a CORS error and never sends the actual request. Once the actual request is sent with an Origin header, the browser checks the response: if Access-Control-Allow-Origin matches, JavaScript reads the response; if not, the response arrived but is hidden behind a CORS error.</desc>
  <defs>
    <marker id="cbd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="580" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="20" width="220" height="36" rx="18" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="43" font-size="14" font-weight="700" fill="#66400f">Page JS calls fetch()</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M400 80 520 110 400 140 280 110z"/>
      <path d="M400 180 520 210 400 240 280 210z"/>
      <path d="M130 280 240 310 130 340 20 310z"/>
      <path d="M400 380 520 410 400 440 280 410z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="400" y="107">same origin</text>
      <text x="400" y="121">as the page?</text>
      <text x="400" y="207">simple</text>
      <text x="400" y="221">request?</text>
      <text x="130" y="307">approved?</text>
      <text x="130" y="321">(2xx + Allow-*)</text>
      <text x="400" y="407">matching</text>
      <text x="400" y="421">Allow-Origin?</text>
    </g>

    <rect x="560" y="86" width="220" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="670" y="106" font-size="14" font-weight="700" fill="#294a2e">No CORS involved</text>
    <text x="670" y="123" font-size="11.5" fill="#294a2e">JS reads the response</text>

    <rect x="560" y="168" width="220" height="84" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g font-size="11.5" fill="#36424e">
      <text x="670" y="190" font-weight="700">Simple means all of:</text>
      <text x="670" y="208">GET, HEAD, or POST</text>
      <text x="670" y="224">only safelisted headers</text>
      <text x="670" y="240">form or text/plain body</text>
    </g>

    <rect x="20" y="186" width="220" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="130" y="206" font-size="14" font-weight="700" fill="#263e5a">Preflight: OPTIONS</text>
    <text x="130" y="223" font-size="11.5" fill="#263e5a">asks if method + headers are OK</text>
    <rect x="20" y="380" width="220" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="130" y="400" font-size="14" font-weight="700" fill="#6b241c">CORS error</text>
    <text x="130" y="417" font-size="11.5" fill="#6b241c">actual request is never sent</text>

    <rect x="280" y="288" width="240" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="400" y="307" font-size="14" font-weight="700" fill="#263e5a">Send actual request</text>
    <text x="400" y="323" font-size="11.5" fill="#263e5a">with the Origin header</text>

    <rect x="560" y="386" width="220" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="670" y="406" font-size="14" font-weight="700" fill="#6b241c">CORS error</text>
    <text x="670" y="423" font-size="11.5" fill="#6b241c">response arrived, but is hidden</text>
    <rect x="280" y="478" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="400" y="498" font-size="14" font-weight="700" fill="#294a2e">JS reads the response</text>
    <text x="400" y="515" font-size="11.5" fill="#294a2e">only exposed headers are visible</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 56V78" marker-end="url(#cbd-arrow)"/>
      <path d="M520 110H558" marker-end="url(#cbd-arrow)"/>
      <path d="M400 140V178" marker-end="url(#cbd-arrow)"/>
      <path d="M280 210H242" marker-end="url(#cbd-arrow)"/>
      <path d="M130 234V278" marker-end="url(#cbd-arrow)"/>
      <path d="M130 340V378" marker-end="url(#cbd-arrow)"/>
      <path d="M240 310H278" marker-end="url(#cbd-arrow)"/>
      <path d="M400 240V286" marker-end="url(#cbd-arrow)"/>
      <path d="M400 332V378" marker-end="url(#cbd-arrow)"/>
      <path d="M520 410H558" marker-end="url(#cbd-arrow)"/>
      <path d="M400 440V476" marker-end="url(#cbd-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="539" y="102">yes</text>
      <text x="261" y="202">no</text>
      <text x="259" y="302">yes</text>
      <text x="539" y="402">no</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="408" y="164">no</text>
      <text x="408" y="268">yes</text>
      <text x="138" y="364">no</text>
      <text x="408" y="464">yes</text>
    </g>
    <text x="400" y="556" font-size="13" fill="#40566b">The browser enforces CORS; the server still receives simple requests even when JS can't read them.</text>
  </g>
</svg>
