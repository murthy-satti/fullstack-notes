<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="cnf-title cnf-desc">
  <title id="cnf-title">How a server negotiates request and response formats</title>
  <desc id="cnf-desc">A request declares the format of its body with Content-Type and the formats it wants back with Accept and Accept-Encoding. The server first checks that it can read the body's Content-Type, answering 415 Unsupported Media Type if not. It then checks that it can produce a type listed in Accept, answering 406 Not Acceptable or falling back to a default format if not. Otherwise it picks the type with the highest q value and the best encoding, and responds with Content-Type, Content-Encoding, and Vary headers.</desc>
  <defs>
    <marker id="cnf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="56" width="250" height="150" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="145" y="78" font-size="14" font-weight="700" fill="#263e5a">Request</text>
    <g font-size="11.5" fill="#263e5a" text-anchor="start">
      <text x="34" y="102">POST /api/reports</text>
      <text x="34" y="122"><tspan font-weight="700">Content-Type:</tspan> application/json</text>
      <text x="34" y="142"><tspan font-weight="700">Accept:</tspan> application/json,</text>
      <text x="34" y="158">    text/csv;q=0.8</text>
      <text x="34" y="178"><tspan font-weight="700">Accept-Encoding:</tspan> br, gzip</text>
    </g>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M420 66 520 96 420 126 320 96z"/>
      <path d="M420 166 520 196 420 226 320 196z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="420" y="93">can read the</text>
      <text x="420" y="107">body's type?</text>
      <text x="420" y="193">can produce a</text>
      <text x="420" y="207">type in Accept?</text>
    </g>
    <rect x="300" y="262" width="240" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="420" y="281" font-size="13" font-weight="700" fill="#66400f">Pick highest q, best encoding</text>
    <text x="420" y="297" font-size="11.5" fill="#66400f">JSON (q=1) compressed with br</text>

    <rect x="566" y="74" width="214" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="673" y="93" font-size="13" font-weight="700" fill="#6b241c">415 Unsupported Media</text>
    <text x="673" y="109" font-size="11.5" fill="#6b241c">server can't read the body</text>
    <rect x="566" y="174" width="214" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="673" y="193" font-size="13" font-weight="700" fill="#6b241c">406 Not Acceptable</text>
    <text x="673" y="209" font-size="11.5" fill="#6b241c">or send a default format</text>

    <rect x="566" y="246" width="214" height="100" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="673" y="268" font-size="14" font-weight="700" fill="#294a2e">200 OK</text>
    <g font-size="11.5" fill="#294a2e" text-anchor="start">
      <text x="578" y="290">Content-Type: application/json</text>
      <text x="578" y="310">Content-Encoding: br</text>
      <text x="578" y="330">Vary: Accept, Accept-Encoding</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M270 96H318" marker-end="url(#cnf-arrow)"/>
      <path d="M420 126V164" marker-end="url(#cnf-arrow)"/>
      <path d="M420 226V260" marker-end="url(#cnf-arrow)"/>
      <path d="M520 96H564" marker-end="url(#cnf-arrow)"/>
      <path d="M520 196H564" marker-end="url(#cnf-arrow)"/>
      <path d="M540 284H564" marker-end="url(#cnf-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="542" y="88">no</text>
      <text x="542" y="188">no</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="428" y="150">yes</text>
      <text x="428" y="248">yes</text>
    </g>
    <text x="400" y="384" font-size="13" fill="#40566b">Content-Type describes what is sent; Accept describes what the client wants back.</text>
    <text x="400" y="404" font-size="12" fill="#36424e">Vary tells caches which request headers changed the response.</text>
  </g>
</svg>
