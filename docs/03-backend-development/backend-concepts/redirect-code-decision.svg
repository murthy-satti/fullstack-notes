<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="rcd-title rcd-desc">
  <title id="rcd-title">Choosing a redirect status code</title>
  <desc id="rcd-desc">If the move is permanent and clients must keep the method and body, use 308; if it is permanent for ordinary web pages, use 301. If the move is temporary and the goal is to show a result page with GET after a POST, use 303. Otherwise, for a temporary move where clients must keep the method and body, use 307, and for a simple temporary redirect, mostly of GET requests, use 302.</desc>
  <defs>
    <marker id="rcd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="490" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="300" y="16" width="200" height="34" rx="17" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="400" y="38" font-size="14" font-weight="700" fill="#36424e">Need to redirect</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M400 70 500 100 400 130 300 100z"/>
      <path d="M170 170 280 200 170 230 60 200z"/>
      <path d="M540 170 650 200 540 230 430 200z"/>
      <path d="M626 260 716 290 626 320 536 290z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="400" y="97">is the move</text>
      <text x="400" y="111">permanent?</text>
      <text x="170" y="197">must clients keep</text>
      <text x="170" y="211">method and body?</text>
      <text x="540" y="197">after a POST, show</text>
      <text x="540" y="211">a page via GET?</text>
      <text x="626" y="287">keep method</text>
      <text x="626" y="301">and body?</text>
    </g>

    <g stroke-width="2">
      <rect x="24" y="380" width="140" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="176" y="380" width="140" height="52" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="328" y="380" width="140" height="52" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="480" y="380" width="140" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="632" y="380" width="140" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="94" y="402" fill="#263e5a">308 Permanent</text>
      <text x="246" y="402" fill="#263e5a">301 Moved</text>
      <text x="398" y="402" fill="#294a2e">303 See Other</text>
      <text x="550" y="402" fill="#66400f">307 Temporary</text>
      <text x="702" y="402" fill="#66400f">302 Found</text>
    </g>
    <g font-size="11.5">
      <text x="94" y="420" fill="#263e5a">keeps POST + body</text>
      <text x="246" y="420" fill="#263e5a">web pages (GET)</text>
      <text x="398" y="420" fill="#294a2e">client GETs result</text>
      <text x="550" y="420" fill="#66400f">keeps POST + body</text>
      <text x="702" y="420" fill="#66400f">mostly for GET</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 50V68" marker-end="url(#rcd-arrow)"/>
      <path d="M300 100H170V168" marker-end="url(#rcd-arrow)"/>
      <path d="M500 100H540V168" marker-end="url(#rcd-arrow)"/>
      <path d="M170 230V340H94V378" marker-end="url(#rcd-arrow)"/>
      <path d="M170 230V340H246V378" marker-end="url(#rcd-arrow)"/>
      <path d="M540 230V246H398V378" marker-end="url(#rcd-arrow)"/>
      <path d="M540 230V246H626V258" marker-end="url(#rcd-arrow)"/>
      <path d="M626 320V350H550V378" marker-end="url(#rcd-arrow)"/>
      <path d="M626 320V350H702V378" marker-end="url(#rcd-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="236" y="92">yes</text>
      <text x="520" y="92">no</text>
      <text x="128" y="334">yes</text>
      <text x="212" y="334">no</text>
      <text x="460" y="240">yes</text>
      <text x="592" y="240">no</text>
      <text x="584" y="344">yes</text>
      <text x="668" y="344">no</text>
    </g>
    <text x="400" y="468" font-size="13" fill="#40566b">301 and 302 let clients turn POST into GET; 307 and 308 forbid it; 303 always switches to GET.</text>
  </g>
</svg>
