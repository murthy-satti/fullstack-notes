<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" role="img" aria-labelledby="hcv-title hcv-desc">
  <title id="hcv-title">How a cache decides between reusing, revalidating, and refetching</title>
  <desc id="hcv-desc">When the client needs GET /api/products/42, a cache with no copy fetches it and receives 200 with the body, an ETag, and Cache-Control, storing it unless no-store is set. If a stored copy is still fresh within max-age, it is served without any request. If it is stale, the cache sends a conditional GET with If-None-Match. If the server's ETag still matches, it answers 304 Not Modified with no body and the copy is reused; otherwise it answers 200 with a new body and ETag, which replaces the copy. With no-cache the copy is always revalidated, and with no-store nothing is stored.</desc>
  <defs>
    <marker id="hcv-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="20" width="280" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="43" font-size="14" font-weight="700" fill="#36424e">Client needs GET /api/products/42</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M220 82 330 112 220 142 110 112z"/>
      <path d="M220 178 330 208 220 238 110 208z"/>
      <path d="M220 350 330 380 220 410 110 380z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="220" y="109">copy in</text>
      <text x="220" y="123">the cache?</text>
      <text x="220" y="205">still fresh?</text>
      <text x="220" y="219">(age &lt; max-age)</text>
      <text x="220" y="377">server: ETag</text>
      <text x="220" y="391">unchanged?</text>
    </g>

    <rect x="420" y="88" width="340" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="590" y="108" font-size="14" font-weight="700" fill="#263e5a">Full GET: 200 OK + body</text>
    <text x="590" y="125" font-size="11.5" fill="#263e5a">stored with ETag and Cache-Control, unless no-store</text>
    <rect x="420" y="184" width="340" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="204" font-size="14" font-weight="700" fill="#294a2e">Serve the cached copy</text>
    <text x="590" y="221" font-size="11.5" fill="#294a2e">no request reaches the server at all</text>
    <rect x="90" y="270" width="260" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="290" font-size="14" font-weight="700" fill="#66400f">Conditional GET</text>
    <text x="220" y="307" font-size="11.5" fill="#66400f">If-None-Match: "a1b2c3"</text>
    <rect x="420" y="356" width="340" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="376" font-size="14" font-weight="700" fill="#294a2e">304 Not Modified</text>
    <text x="590" y="393" font-size="11.5" fill="#294a2e">no body; reuse the copy and renew its freshness</text>
    <rect x="90" y="446" width="260" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="220" y="466" font-size="14" font-weight="700" fill="#263e5a">200 OK + new ETag</text>
    <text x="220" y="483" font-size="11.5" fill="#263e5a">new body replaces the cached copy</text>

    <rect x="420" y="440" width="340" height="60" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="590" y="463" font-size="12" fill="#36424e"><tspan font-weight="700">no-cache:</tspan> skip "still fresh?" and always revalidate</text>
    <text x="590" y="483" font-size="12" fill="#36424e"><tspan font-weight="700">no-store:</tspan> never stored, so always a full GET</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M220 56V80" marker-end="url(#hcv-arrow)"/>
      <path d="M220 142V176" marker-end="url(#hcv-arrow)"/>
      <path d="M220 238V268" marker-end="url(#hcv-arrow)"/>
      <path d="M220 318V348" marker-end="url(#hcv-arrow)"/>
      <path d="M220 410V444" marker-end="url(#hcv-arrow)"/>
      <path d="M330 112H418" marker-end="url(#hcv-arrow)"/>
      <path d="M330 208H418" marker-end="url(#hcv-arrow)"/>
      <path d="M330 380H418" marker-end="url(#hcv-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="374" y="104">no</text>
      <text x="374" y="200">yes</text>
      <text x="374" y="372">yes</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="228" y="164">yes</text>
      <text x="228" y="258">no: stale</text>
      <text x="228" y="430">no</text>
    </g>
    <text x="390" y="540" font-size="13" fill="#40566b">Fresh copies cost nothing; stale copies cost one small request when the ETag still matches.</text>
  </g>
</svg>
