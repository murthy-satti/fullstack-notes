<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="jwt-title jwt-desc">
  <title id="jwt-title">JWT structure and the server's verification steps</title>
  <desc id="jwt-desc">A JWT has a header, a payload, and a signature, each base64url encoded and joined by dots. The header and payload are readable by anyone because the token is signed, not encrypted. The server verifies a token in order: parse the three parts, check the algorithm against its own allowlist, select the key by kid, verify the signature, and check exp, nbf, iss, and aud. Any failure rejects the request with 401 Unauthorized; only a fully verified token lets the handler trust sub and the other claims.</desc>
  <defs>
    <marker id="jwt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="38" font-size="13" font-weight="700" fill="#40566b">header . payload . signature   (each part base64url-encoded)</text>

    <rect x="30" y="54" width="190" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="125" y="76" font-size="14" font-weight="700" fill="#263e5a">Header</text>
    <text x="125" y="98" font-size="11.5" fill="#263e5a">"alg": "RS256"</text>
    <text x="125" y="116" font-size="11.5" fill="#263e5a">"kid": "key-2026-1"</text>
    <text x="240" y="104" font-size="22" font-weight="700" fill="#40566b">.</text>
    <rect x="260" y="54" width="250" height="84" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="385" y="76" font-size="14" font-weight="700" fill="#463365">Payload (claims)</text>
    <text x="385" y="96" font-size="11.5" fill="#463365">"sub": "u_42", "aud": "orders-api"</text>
    <text x="385" y="113" font-size="11.5" fill="#463365">"iss": "auth.example.com"</text>
    <text x="385" y="130" font-size="11.5" fill="#463365">"exp": 1790000000</text>
    <text x="530" y="104" font-size="22" font-weight="700" fill="#40566b">.</text>
    <rect x="550" y="54" width="200" height="84" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="650" y="76" font-size="14" font-weight="700" fill="#66400f">Signature</text>
    <text x="650" y="98" font-size="11.5" fill="#66400f">RS256 over</text>
    <text x="650" y="116" font-size="11.5" fill="#66400f">header + "." + payload</text>

    <text x="390" y="164" font-size="12" font-weight="700" fill="#6b241c">Signed, not encrypted: anyone can decode the header and payload.</text>

    <rect x="23" y="196" width="104" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="75" y="220" font-size="12.5" font-weight="700" fill="#36424e">1. Parse</text>
    <text x="75" y="238" font-size="11.5" fill="#36424e">3 parts?</text>
    <rect x="149" y="196" width="104" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="201" y="220" font-size="12.5" font-weight="700" fill="#36424e">2. alg in</text>
    <text x="201" y="238" font-size="11.5" fill="#36424e">your allowlist?</text>
    <rect x="275" y="196" width="104" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="327" y="220" font-size="12.5" font-weight="700" fill="#36424e">3. Pick key</text>
    <text x="327" y="238" font-size="11.5" fill="#36424e">by kid (JWKS)</text>
    <rect x="401" y="196" width="104" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="453" y="220" font-size="12.5" font-weight="700" fill="#36424e">4. Verify</text>
    <text x="453" y="238" font-size="11.5" fill="#36424e">signature</text>
    <rect x="527" y="196" width="104" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="579" y="220" font-size="12.5" font-weight="700" fill="#36424e">5. Check exp,</text>
    <text x="579" y="238" font-size="11.5" fill="#36424e">nbf, iss, aud</text>
    <rect x="653" y="196" width="104" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="705" y="220" font-size="12.5" font-weight="700" fill="#294a2e">6. Trust</text>
    <text x="705" y="238" font-size="11.5" fill="#294a2e">sub and claims</text>

    <rect x="23" y="300" width="608" height="40" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="327" y="325" font-size="14" font-weight="700" fill="#6b241c">Reject with 401 Unauthorized; never read claims from a failed token</text>
    <rect x="653" y="300" width="104" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="705" y="325" font-size="13" font-weight="700" fill="#294a2e">handler runs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M127 224H147" marker-end="url(#jwt-arrow)"/>
      <path d="M253 224H273" marker-end="url(#jwt-arrow)"/>
      <path d="M379 224H399" marker-end="url(#jwt-arrow)"/>
      <path d="M505 224H525" marker-end="url(#jwt-arrow)"/>
      <path d="M631 224H651" marker-end="url(#jwt-arrow)"/>
      <path d="M75 252V298" marker-end="url(#jwt-arrow)"/>
      <path d="M201 252V298" marker-end="url(#jwt-arrow)"/>
      <path d="M327 252V298" marker-end="url(#jwt-arrow)"/>
      <path d="M453 252V298" marker-end="url(#jwt-arrow)"/>
      <path d="M579 252V298" marker-end="url(#jwt-arrow)"/>
      <path d="M705 252V298" marker-end="url(#jwt-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="81" y="280">fail</text>
      <text x="207" y="280">fail</text>
      <text x="333" y="280">fail</text>
      <text x="459" y="280">fail</text>
      <text x="585" y="280">fail</text>
      <text x="711" y="280">pass</text>
    </g>
    <text x="390" y="370" font-size="12" fill="#40566b">Step 2 blocks "alg": "none" and algorithm confusion; step 5 blocks expired or wrong-audience tokens.</text>
    <text x="390" y="408" font-size="13" fill="#40566b">The server's configuration, not the token's header, decides how a token is verified.</text>
  </g>
</svg>
