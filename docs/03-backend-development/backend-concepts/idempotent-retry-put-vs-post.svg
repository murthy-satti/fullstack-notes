<svg xmlns="http://www.w3.org/2000/svg" width="780" height="372" viewBox="0 0 780 372" role="img" aria-labelledby="irp-title irp-desc">
  <title id="irp-title">Retrying an idempotent PUT versus a non-idempotent POST</title>
  <desc id="irp-desc">In both cases the client sends a request, the server applies it, and the response is lost, so the client retries the same request. Retrying PUT with email a@b.com leaves the email unchanged, so the end state is the same and the retry is safe. Retrying POST with amount 50 creates a second payment, so the customer is charged twice unless the API uses an idempotency key.</desc>
  <defs>
    <marker id="irp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="irp-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="372" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="364" height="316" rx="10" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="400" y="16" width="364" height="316" rx="10" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="198" y="40" font-size="13" font-weight="700" fill="#40566b">PUT is idempotent</text>
    <text x="582" y="40" font-size="13" font-weight="700" fill="#40566b">POST is not idempotent</text>

    <g stroke-width="2">
      <rect x="36" y="54" width="80" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="176" y="54" width="80" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="420" y="54" width="80" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="560" y="54" width="80" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="76" y="74">Client</text>
      <text x="216" y="74">Server</text>
      <text x="460" y="74">Client</text>
      <text x="600" y="74">Server</text>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M76 84V256"/>
      <path d="M216 84V256"/>
      <path d="M460 84V256"/>
      <path d="M600 84V256"/>
    </g>

    <g stroke-width="1.5">
      <rect x="248" y="98" width="120" height="30" rx="6" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="248" y="186" width="120" height="30" rx="6" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="632" y="98" width="120" height="30" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="632" y="186" width="120" height="30" rx="6" fill="#fde8e6" stroke="#b5473a"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="308" y="117" fill="#294a2e">email = a@b.com</text>
      <text x="308" y="205" fill="#294a2e">email = a@b.com</text>
      <text x="692" y="117" fill="#36424e">payments: 1</text>
      <text x="692" y="205" fill="#6b241c">payments: 2</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M76 112H214" marker-end="url(#irp-arrow)"/>
      <path d="M76 200H214" marker-end="url(#irp-arrow)"/>
      <path d="M460 112H598" marker-end="url(#irp-arrow)"/>
      <path d="M460 200H598" marker-end="url(#irp-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4">
      <path d="M216 150H156"/>
      <path d="M600 150H540"/>
      <path d="M216 238H78" marker-end="url(#irp-arrow-dash)"/>
      <path d="M600 238H462" marker-end="url(#irp-arrow-dash)"/>
    </g>
    <g fill="none" stroke="#b5473a" stroke-width="2.5" stroke-linecap="round">
      <path d="M140 142 156 158M156 142 140 158"/>
      <path d="M524 142 540 158M540 142 524 158"/>
    </g>

    <g font-size="11.5" fill="#40566b">
      <text x="146" y="104">PUT email=a@b.com</text>
      <text x="146" y="192">retry: same PUT</text>
      <text x="146" y="230">200 OK</text>
      <text x="530" y="104">POST amount=50</text>
      <text x="530" y="192">retry: same POST</text>
      <text x="530" y="230">201 Created</text>
    </g>
    <g font-size="11.5" fill="#b5473a">
      <text x="146" y="174">response lost</text>
      <text x="530" y="174">response lost</text>
    </g>

    <rect x="36" y="272" width="324" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="198" y="291" font-size="13" font-weight="700" fill="#294a2e">Same end state</text>
    <text x="198" y="307" font-size="11.5" fill="#294a2e">safe to retry automatically</text>
    <rect x="420" y="272" width="324" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="582" y="291" font-size="13" font-weight="700" fill="#6b241c">Charged twice</text>
    <text x="582" y="307" font-size="11.5" fill="#6b241c">needs an Idempotency-Key to retry safely</text>
    <text x="390" y="356" font-size="13" fill="#40566b">Retrying an idempotent request repeats nothing; retrying POST repeats the side effect.</text>
  </g>
</svg>
