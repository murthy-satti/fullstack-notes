<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580" role="img" aria-labelledby="scc-title scc-desc">
  <title id="scc-title">How the outcome of a request maps to the five status code classes</title>
  <desc id="scc-desc">When a request reaches the server, an interim reply such as 100 Continue is a 1xx code and the final answer still follows. If the request is invalid or not allowed, the client is at fault and the answer is 4xx; the client must fix the request. If the server or an upstream service failed, the server is at fault and the answer is 5xx; retrying later may work. If the client must go to another URL or reuse its cached copy, the answer is 3xx. Otherwise the request succeeded and the answer is 2xx.</desc>
  <defs>
    <marker id="scc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="580" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="20" width="240" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="180" y="43" font-size="14" font-weight="700" fill="#36424e">Request reaches the server</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M180 82 300 114 180 146 60 114z"/>
      <path d="M180 182 300 214 180 246 60 214z"/>
      <path d="M180 282 300 314 180 346 60 314z"/>
      <path d="M180 382 300 414 180 446 60 414z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="180" y="111">interim reply</text>
      <text x="180" y="125">needed first?</text>
      <text x="180" y="211">request valid</text>
      <text x="180" y="225">and allowed?</text>
      <text x="180" y="311">server or upstream</text>
      <text x="180" y="325">failed?</text>
      <text x="180" y="411">go elsewhere or</text>
      <text x="180" y="425">use the cache?</text>
    </g>

    <rect x="380" y="90" width="370" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="565" y="110" font-size="14" font-weight="700" fill="#36424e">1xx Informational</text>
    <text x="565" y="127" font-size="11.5" fill="#36424e">100, 101, 103: the final response still follows</text>
    <rect x="380" y="190" width="370" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="565" y="210" font-size="14" font-weight="700" fill="#6b241c">4xx Client error</text>
    <text x="565" y="227" font-size="11.5" fill="#6b241c">client's fault: fix the request; don't retry as is</text>
    <rect x="380" y="290" width="370" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="565" y="310" font-size="14" font-weight="700" fill="#6b241c">5xx Server error</text>
    <text x="565" y="327" font-size="11.5" fill="#6b241c">server's fault: retrying later may work</text>
    <rect x="380" y="390" width="370" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="565" y="410" font-size="14" font-weight="700" fill="#263e5a">3xx Redirection</text>
    <text x="565" y="427" font-size="11.5" fill="#263e5a">follow Location, or reuse the cached copy (304)</text>
    <rect x="60" y="478" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="180" y="498" font-size="14" font-weight="700" fill="#294a2e">2xx Success</text>
    <text x="180" y="515" font-size="11.5" fill="#294a2e">use the response</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M180 56V80" marker-end="url(#scc-arrow)"/>
      <path d="M180 146V180" marker-end="url(#scc-arrow)"/>
      <path d="M180 246V280" marker-end="url(#scc-arrow)"/>
      <path d="M180 346V380" marker-end="url(#scc-arrow)"/>
      <path d="M180 446V476" marker-end="url(#scc-arrow)"/>
      <path d="M300 114H378" marker-end="url(#scc-arrow)"/>
      <path d="M300 214H378" marker-end="url(#scc-arrow)"/>
      <path d="M300 314H378" marker-end="url(#scc-arrow)"/>
      <path d="M300 414H378" marker-end="url(#scc-arrow)"/>
    </g>
    <path d="M380 128H344V164H180" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4"/>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="339" y="106">yes</text>
      <text x="339" y="206">no</text>
      <text x="339" y="306">yes</text>
      <text x="339" y="406">yes</text>
    </g>
    <text x="172" y="168" font-size="12" font-weight="700" fill="#40566b" text-anchor="end">no</text>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="188" y="268">yes</text>
      <text x="188" y="368">no</text>
      <text x="188" y="466">no</text>
    </g>
    <text x="352" y="158" font-size="11.5" font-style="italic" fill="#60788d" text-anchor="start">then continue</text>
    <text x="390" y="560" font-size="13" fill="#40566b">The class tells the client who caused the outcome and how to react; the last two digits add detail.</text>
  </g>
</svg>
