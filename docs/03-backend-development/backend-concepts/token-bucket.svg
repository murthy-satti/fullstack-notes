<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="tkb-title tkb-desc">
  <title id="tkb-title">How a token bucket rate limiter decides each request</title>
  <desc id="tkb-desc">A bucket holds up to 10 tokens and is refilled with one token per second, never beyond its capacity. When a request arrives the limiter checks whether the bucket has a token. If it does, it removes one token and the request is handled with 200 OK. If the bucket is empty, the request is rejected with 429 Too Many Requests and a Retry-After header. A full bucket allows a burst of 10 requests, after which requests are limited to the refill rate.</desc>
  <defs>
    <marker id="tkb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="24" width="200" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="140" y="43" font-size="13" font-weight="700" fill="#294a2e">Refill +1 token / second</text>
    <text x="140" y="60" font-size="11.5" fill="#294a2e">never above capacity</text>

    <path d="M40 100V262Q40 282 60 282H220Q240 282 240 262V100" fill="#e5efff" stroke="#4774aa" stroke-width="2.5"/>
    <text x="140" y="128" font-size="13" font-weight="700" fill="#263e5a">capacity = 10</text>
    <text x="140" y="148" font-size="11.5" fill="#263e5a">6 tokens right now</text>
    <g stroke="#bd7a20" stroke-width="2">
      <circle cx="70" cy="248" r="13" fill="#fff0d9"/>
      <circle cx="105" cy="248" r="13" fill="#fff0d9"/>
      <circle cx="140" cy="248" r="13" fill="#fff0d9"/>
      <circle cx="175" cy="248" r="13" fill="#fff0d9"/>
      <circle cx="210" cy="248" r="13" fill="#fff0d9"/>
      <circle cx="70" cy="212" r="13" fill="#fff0d9"/>
    </g>
    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
      <circle cx="105" cy="212" r="13"/>
      <circle cx="140" cy="212" r="13"/>
      <circle cx="175" cy="212" r="13"/>
      <circle cx="210" cy="212" r="13"/>
    </g>

    <rect x="330" y="30" width="180" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="420" y="55" font-size="14" font-weight="700" fill="#36424e">Request arrives</text>

    <path d="M420 100 510 132 420 164 330 132z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="420" y="129" font-size="12" font-weight="700" fill="#36424e">token in</text>
    <text x="420" y="143" font-size="12" font-weight="700" fill="#36424e">the bucket?</text>

    <rect x="330" y="198" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="420" y="225" font-size="14" font-weight="700" fill="#66400f">Take 1 token</text>

    <rect x="330" y="270" width="180" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="420" y="290" font-size="14" font-weight="700" fill="#294a2e">Handle request</text>
    <text x="420" y="306" font-size="11.5" fill="#294a2e">200 OK</text>

    <rect x="570" y="108" width="190" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="665" y="128" font-size="14" font-weight="700" fill="#6b241c">429 Too Many Requests</text>
    <text x="665" y="145" font-size="11.5" fill="#6b241c">Retry-After: 1</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M140 68V96" marker-end="url(#tkb-arrow)"/>
      <path d="M420 70V98" marker-end="url(#tkb-arrow)"/>
      <path d="M420 164V196" marker-end="url(#tkb-arrow)"/>
      <path d="M420 242V268" marker-end="url(#tkb-arrow)"/>
      <path d="M510 132H568" marker-end="url(#tkb-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M330 132H244"/>
      <path d="M330 220H244" marker-end="url(#tkb-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="287" y="125">check</text>
      <text x="287" y="213">−1 token</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="434" y="185" text-anchor="start">yes</text>
      <text x="539" y="125">no</text>
    </g>
    <text x="390" y="346" font-size="12" fill="#40566b">A full bucket allows a burst of 10 at once; after that, about 1 request per second gets through.</text>
    <text x="390" y="372" font-size="13" fill="#40566b">Capacity sets the burst size; the refill rate sets the long-run average.</text>
  </g>
</svg>
