<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" role="img" aria-labelledby="otr-title otr-desc">
  <title id="otr-title">Where the ID token, access token, and refresh token go</title>
  <desc id="otr-desc">The authorization server returns three tokens to the client app. The ID token is read by the client itself to learn who signed in and is never sent to an API. The access token is sent to the resource server as a Bearer token, which checks its audience, scopes, and expiry. The refresh token is sent only back to the authorization server's token endpoint to obtain a new access token.</desc>
  <defs>
    <marker id="otr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="112" width="180" height="96" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="114" y="146" font-size="14" font-weight="700" fill="#463365">Authorization</text>
    <text x="114" y="164" font-size="14" font-weight="700" fill="#463365">server</text>
    <text x="114" y="186" font-size="11.5" fill="#463365">/token endpoint</text>

    <rect x="290" y="40" width="200" height="262" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="66" font-size="14" font-weight="700" fill="#66400f">Client app</text>
    <rect x="304" y="82" width="172" height="56" rx="8" fill="#ffffff" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="104" font-size="13" font-weight="700" fill="#463365">ID token (JWT)</text>
    <text x="390" y="122" font-size="11.5" fill="#463365">who signed in; client only</text>
    <rect x="304" y="154" width="172" height="56" rx="8" fill="#ffffff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="176" font-size="13" font-weight="700" fill="#263e5a">Access token</text>
    <text x="390" y="194" font-size="11.5" fill="#263e5a">short-lived, has scopes</text>
    <rect x="304" y="226" width="172" height="56" rx="8" fill="#ffffff" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="248" font-size="13" font-weight="700" fill="#294a2e">Refresh token</text>
    <text x="390" y="266" font-size="11.5" fill="#294a2e">long-lived, rotated on use</text>

    <rect x="576" y="134" width="180" height="96" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="666" y="166" font-size="14" font-weight="700" fill="#263e5a">Resource server</text>
    <text x="666" y="188" font-size="11.5" fill="#263e5a">checks aud, scopes,</text>
    <text x="666" y="205" font-size="11.5" fill="#263e5a">exp on every call</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M204 136H288" marker-end="url(#otr-arrow)"/>
      <path d="M476 182H574" marker-end="url(#otr-arrow)"/>
      <path d="M304 254H114V210" marker-end="url(#otr-arrow)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="246" y="128">issues all 3</text>
      <text x="525" y="174">Bearer</text>
      <text x="209" y="246">refresh_token grant</text>
    </g>
    <text x="390" y="326" font-size="12" font-weight="700" fill="#6b241c">Never send the ID token to an API as if it were an access token.</text>
    <text x="390" y="352" font-size="13" fill="#40566b">ID token: for the client. Access token: for the API. Refresh token: only to the token endpoint.</text>
  </g>
</svg>
