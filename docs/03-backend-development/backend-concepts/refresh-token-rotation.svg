<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="rtr-title rtr-desc">
  <title id="rtr-title">Refresh token rotation with reuse detection</title>
  <desc id="rtr-desc">The client signs in and receives access token A1 and refresh token R1. When A1 expires the client sends R1 to the token endpoint; the server marks R1 as used and returns A2 and a new refresh token R2. An attacker who stole R1 replays it; the server sees R1 was already used, detects reuse, and revokes the whole token family including R2, returning 401. When the real client next sends R2 it also gets 401 and must sign in again.</desc>
  <defs>
    <marker id="rtr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rtr-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="rtr-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="22" width="120" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="43" font-size="13" font-weight="700" fill="#36424e">Client</text>
    <rect x="320" y="22" width="160" height="32" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="43" font-size="13" font-weight="700" fill="#66400f">Auth server + store</text>
    <rect x="600" y="22" width="120" height="32" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="660" y="43" font-size="13" font-weight="700" fill="#6b241c">Attacker</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M120 54V452M400 54V452M660 54V452"/>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="260" y="82">1. sign in</text>
      <text x="260" y="114">2. access A1 (15 min) + refresh R1</text>
      <text x="260" y="160">3. A1 expired: POST /token with R1</text>
      <text x="260" y="254">4. access A2 + refresh R2</text>
      <text x="530" y="296">5. replays stolen R1</text>
      <text x="530" y="390">401</text>
      <text x="260" y="408">6. POST /token with R2</text>
      <text x="260" y="438">401: sign in again</text>
    </g>

    <rect x="300" y="186" width="200" height="40" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="400" y="202" font-size="11.5" font-weight="700" fill="#463365">mark R1 used, issue R2</text>
    <text x="400" y="218" font-size="11.5" fill="#463365">family F = R1 → R2</text>

    <rect x="290" y="316" width="220" height="44" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="400" y="334" font-size="11.5" font-weight="700" fill="#6b241c">R1 already used: reuse detected</text>
    <text x="400" y="351" font-size="11.5" fill="#6b241c">revoke family F (R2 too)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M120 88H398" marker-end="url(#rtr-arrow)"/>
      <path d="M120 166H398" marker-end="url(#rtr-arrow)"/>
      <path d="M120 414H398" marker-end="url(#rtr-arrow)"/>
    </g>
    <path d="M660 302H402" fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" marker-end="url(#rtr-bad)"/>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M400 120H122" marker-end="url(#rtr-ret)"/>
      <path d="M400 260H122" marker-end="url(#rtr-ret)"/>
      <path d="M400 396H658" marker-end="url(#rtr-ret)"/>
      <path d="M400 444H122" marker-end="url(#rtr-ret)"/>
    </g>
    <text x="390" y="482" font-size="13" fill="#40566b">Each refresh token works once; a second use means it was copied, so the whole family is revoked.</text>
  </g>
</svg>
