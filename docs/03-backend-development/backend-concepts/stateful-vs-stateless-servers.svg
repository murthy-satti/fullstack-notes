<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="sss-title sss-desc">
  <title id="sss-title">Stateful servers lose sessions behind a load balancer; stateless servers share them</title>
  <desc id="sss-desc">On the left, a load balancer sends a login request to Server A, which keeps session S1 in its own memory. The next request goes to Server B, which has no session, so the user gets 401 and looks logged out. On the right, Server A writes session S1 to a shared Redis session store, and Server B reads S1 from the store, so the second request succeeds with 200 OK on either server.</desc>
  <defs>
    <marker id="sss-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="364" height="336" rx="10" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <rect x="400" y="16" width="364" height="336" rx="10" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="198" y="42" font-size="13" font-weight="700" fill="#40566b">Stateful: session in server memory</text>
    <text x="582" y="42" font-size="13" font-weight="700" fill="#40566b">Stateless: shared session store</text>

    <rect x="134" y="58" width="128" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="198" y="81" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <rect x="118" y="120" width="160" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="198" y="139" font-size="14" font-weight="700" fill="#36424e">Load balancer</text>
    <text x="198" y="156" font-size="11.5" fill="#36424e">round robin</text>
    <rect x="36" y="208" width="140" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="106" y="230" font-size="14" font-weight="700" fill="#263e5a">Server A</text>
    <text x="106" y="248" font-size="11.5" fill="#263e5a">holds session S1</text>
    <rect x="220" y="208" width="140" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="290" y="230" font-size="14" font-weight="700" fill="#6b241c">Server B</text>
    <text x="290" y="248" font-size="11.5" fill="#6b241c">no session: 401</text>
    <text x="198" y="296" font-size="11.5" fill="#36424e">Request 2 reached Server B, which never</text>
    <text x="198" y="312" font-size="11.5" fill="#36424e">saw the login, so the user looks logged out.</text>
    <text x="198" y="328" font-size="11.5" fill="#36424e">Restarting Server A also loses S1.</text>

    <rect x="518" y="58" width="128" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="582" y="81" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <rect x="502" y="120" width="160" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="582" y="139" font-size="14" font-weight="700" fill="#36424e">Load balancer</text>
    <text x="582" y="156" font-size="11.5" fill="#36424e">round robin</text>
    <rect x="420" y="208" width="140" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="490" y="230" font-size="14" font-weight="700" fill="#263e5a">Server A</text>
    <text x="490" y="248" font-size="11.5" fill="#263e5a">writes S1 to store</text>
    <rect x="604" y="208" width="140" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="674" y="230" font-size="14" font-weight="700" fill="#294a2e">Server B</text>
    <text x="674" y="248" font-size="11.5" fill="#294a2e">reads S1: 200 OK</text>
    <rect x="502" y="296" width="160" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="582" y="315" font-size="14" font-weight="700" fill="#463365">Session store</text>
    <text x="582" y="332" font-size="11.5" fill="#463365">Redis: S1 = user 7</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M198 94V118" marker-end="url(#sss-arrow)"/>
      <path d="M160 164 112 205" marker-end="url(#sss-arrow)"/>
      <path d="M236 164 284 205" marker-end="url(#sss-arrow)"/>
      <path d="M582 94V118" marker-end="url(#sss-arrow)"/>
      <path d="M544 164 496 205" marker-end="url(#sss-arrow)"/>
      <path d="M620 164 668 205" marker-end="url(#sss-arrow)"/>
      <path d="M490 264 548 294" marker-end="url(#sss-arrow)"/>
      <path d="M674 264 616 294" marker-end="url(#sss-arrow)"/>
    </g>

    <g font-size="11.5" fill="#40566b">
      <text x="126" y="186" text-anchor="end">1: POST /login</text>
      <text x="268" y="186" text-anchor="start">2: GET /me</text>
      <text x="510" y="186" text-anchor="end">1: POST /login</text>
      <text x="652" y="186" text-anchor="start">2: GET /me</text>
      <text x="512" y="288" text-anchor="end">write S1</text>
      <text x="652" y="288" text-anchor="start">read S1</text>
    </g>
    <text x="390" y="380" font-size="13" fill="#40566b">Keep app servers stateless: shared state in a store lets any instance handle any request.</text>
  </g>
</svg>
