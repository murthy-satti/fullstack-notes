<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="rbj-title rbj-desc">
  <title id="rbj-title">Retries with exponential backoff and full jitter</title>
  <desc id="rbj-desc">A timeline shows four attempts. Attempt 1 fails with 503, and the client sleeps a random time up to 100 milliseconds, 63 in this run. Attempt 2 times out, and the client sleeps a random time up to 200 milliseconds, 141 here. Attempt 3 fails with 503, and the client sleeps up to 400 milliseconds, 287 here. Attempt 4 succeeds with 200 OK. Below, a flowchart shows the rule: when a call fails, check whether the failure is retryable; if not, return the error. If it is, check whether attempts are left; if not, give up. Otherwise sleep a random time between zero and the capped exponential delay, then retry the call.</desc>
  <defs>
    <marker id="rbj-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="50" y="34" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One run: base 100 ms, delay = random(0, base × 2^n)</text>

    <rect x="50" y="52" width="45" height="30" rx="5" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="72" y="72" font-size="12" font-weight="700" fill="#6b241c">#1</text>
    <rect x="152" y="52" width="45" height="30" rx="5" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="174" y="72" font-size="12" font-weight="700" fill="#6b241c">#2</text>
    <rect x="324" y="52" width="45" height="30" rx="5" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="346" y="72" font-size="12" font-weight="700" fill="#6b241c">#3</text>
    <rect x="627" y="52" width="45" height="30" rx="5" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="649" y="72" font-size="12" font-weight="700" fill="#294a2e">#4</text>
    <g font-size="11.5" fill="#36424e">
      <text x="72" y="98">503</text>
      <text x="174" y="98">timeout</text>
      <text x="346" y="98">503</text>
      <text x="649" y="98" font-weight="700" fill="#294a2e">200 OK</text>
    </g>

    <rect x="95" y="112" width="90" height="16" fill="#ffffff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="95" y="112" width="57" height="16" fill="#bcd2f0"/>
    <rect x="197" y="112" width="180" height="16" fill="#ffffff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="197" y="112" width="127" height="16" fill="#bcd2f0"/>
    <rect x="369" y="112" width="360" height="16" fill="#ffffff" stroke="#4774aa" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="369" y="112" width="258" height="16" fill="#bcd2f0"/>
    <g font-size="11.5" fill="#263e5a">
      <text x="140" y="146">max 100 ms</text>
      <text x="140" y="162">slept 63</text>
      <text x="287" y="146">max 200 ms</text>
      <text x="287" y="162">slept 141</text>
      <text x="549" y="146">max 400 ms</text>
      <text x="549" y="162">slept 287</text>
    </g>
    <path d="M50 178H740M50 174V182M230 174V182M410 174V182M590 174V182" fill="none" stroke="#40566b" stroke-width="1.5"/>
    <g font-size="11" fill="#40566b">
      <text x="50" y="194">0 ms</text>
      <text x="230" y="194">200</text>
      <text x="410" y="194">400</text>
      <text x="590" y="194">600</text>
    </g>

    <rect x="30" y="256" width="140" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="100" y="276" font-size="14" font-weight="700" fill="#6b241c">Call fails</text>
    <text x="100" y="293" font-size="11.5" fill="#6b241c">503, timeout, reset</text>

    <path d="M275 252 350 280 275 308 200 280z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="275" y="277" font-size="12" font-weight="700" fill="#36424e">retryable</text>
    <text x="275" y="291" font-size="12" font-weight="700" fill="#36424e">failure?</text>

    <path d="M455 252 530 280 455 308 380 280z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="455" y="277" font-size="12" font-weight="700" fill="#36424e">attempts</text>
    <text x="455" y="291" font-size="12" font-weight="700" fill="#36424e">left?</text>

    <rect x="565" y="256" width="205" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="667" y="276" font-size="13" font-weight="700" fill="#263e5a">sleep random(0,</text>
    <text x="667" y="293" font-size="11.5" fill="#263e5a">min(cap, base × 2^n))</text>

    <rect x="200" y="340" width="150" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="275" y="359" font-size="13" font-weight="700" fill="#6b241c">Return the error</text>
    <text x="275" y="375" font-size="11.5" fill="#6b241c">400, 401, 403, 404, 422</text>
    <rect x="380" y="340" width="150" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="455" y="359" font-size="13" font-weight="700" fill="#6b241c">Give up</text>
    <text x="455" y="375" font-size="11.5" fill="#6b241c">surface the last error</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M170 280H198" marker-end="url(#rbj-arrow)"/>
      <path d="M350 280H378" marker-end="url(#rbj-arrow)"/>
      <path d="M530 280H563" marker-end="url(#rbj-arrow)"/>
      <path d="M275 308V338" marker-end="url(#rbj-arrow)"/>
      <path d="M455 308V338" marker-end="url(#rbj-arrow)"/>
      <path d="M667 256V226H100V254" marker-end="url(#rbj-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="364" y="272">yes</text>
      <text x="547" y="272">yes</text>
      <text x="290" y="328" text-anchor="start">no</text>
      <text x="470" y="328" text-anchor="start">no</text>
    </g>
    <text x="384" y="220" font-size="11.5" font-style="italic" fill="#40566b">retry the call</text>
    <text x="400" y="420" font-size="13" fill="#40566b">Jitter spreads retries out, so thousands of clients do not hit a recovering service at the same instant.</text>
  </g>
</svg>
