<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="obs-title obs-desc">
  <title id="obs-title">How logs, metrics, and traces flow from an app to the on-call engineer</title>
  <desc id="obs-desc">App instances emit three signals. JSON logs go to standard output, a log agent ships them to a log store such as Loki or OpenSearch. Metrics are exposed on /metrics and scraped by Prometheus into a time-series database. Spans are sent by the OpenTelemetry SDK to an OpenTelemetry Collector and stored in a trace store such as Tempo or Jaeger. Grafana reads all three stores for dashboards, log search, trace views, and alert rules; when an alert fires, the on-call engineer is paged and follows a runbook.</desc>
  <defs>
    <marker id="obs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="85" y="44" font-size="13" font-weight="700" fill="#40566b">Emit</text>
    <text x="270" y="44" font-size="13" font-weight="700" fill="#40566b">Collect</text>
    <text x="470" y="44" font-size="13" font-weight="700" fill="#40566b">Store</text>
    <text x="685" y="44" font-size="13" font-weight="700" fill="#40566b">Use</text>

    <rect x="20" y="70" width="130" height="200" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="85" y="100" font-size="14" font-weight="700" fill="#66400f">App</text>
    <text x="85" y="118" font-size="14" font-weight="700" fill="#66400f">instances</text>
    <text x="85" y="160" font-size="11.5" fill="#66400f">pino (logs)</text>
    <text x="85" y="182" font-size="11.5" fill="#66400f">prom-client</text>
    <text x="85" y="204" font-size="11.5" fill="#66400f">OTel SDK</text>

    <rect x="190" y="76" width="160" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="270" y="96" font-size="14" font-weight="700" fill="#36424e">Log agent</text>
    <text x="270" y="113" font-size="11.5" fill="#36424e">reads stdout, ships</text>
    <rect x="190" y="146" width="160" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="270" y="166" font-size="14" font-weight="700" fill="#36424e">Prometheus</text>
    <text x="270" y="183" font-size="11.5" fill="#36424e">scrapes /metrics</text>
    <rect x="190" y="216" width="160" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="270" y="236" font-size="14" font-weight="700" fill="#36424e">OTel Collector</text>
    <text x="270" y="253" font-size="11.5" fill="#36424e">receives OTLP spans</text>

    <rect x="390" y="76" width="160" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="470" y="96" font-size="14" font-weight="700" fill="#263e5a">Log store</text>
    <text x="470" y="113" font-size="11.5" fill="#263e5a">Loki / OpenSearch</text>
    <rect x="390" y="146" width="160" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="470" y="166" font-size="14" font-weight="700" fill="#263e5a">Time-series DB</text>
    <text x="470" y="183" font-size="11.5" fill="#263e5a">counters, histograms</text>
    <rect x="390" y="216" width="160" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="470" y="236" font-size="14" font-weight="700" fill="#263e5a">Trace store</text>
    <text x="470" y="253" font-size="11.5" fill="#263e5a">Tempo / Jaeger</text>

    <rect x="590" y="70" width="190" height="200" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="685" y="100" font-size="14" font-weight="700" fill="#463365">Grafana</text>
    <text x="685" y="136" font-size="11.5" fill="#463365">RED dashboards</text>
    <text x="685" y="158" font-size="11.5" fill="#463365">log search by requestId</text>
    <text x="685" y="180" font-size="11.5" fill="#463365">trace waterfall view</text>
    <text x="685" y="202" font-size="11.5" fill="#463365">alert rules on SLOs</text>

    <rect x="590" y="310" width="190" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="685" y="330" font-size="14" font-weight="700" fill="#6b241c">On-call engineer</text>
    <text x="685" y="347" font-size="11.5" fill="#6b241c">paged, follows runbook</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M150 100H188" marker-end="url(#obs-arrow)"/>
      <path d="M150 170H188" marker-end="url(#obs-arrow)"/>
      <path d="M150 240H188" marker-end="url(#obs-arrow)"/>
      <path d="M350 100H388" marker-end="url(#obs-arrow)"/>
      <path d="M350 170H388" marker-end="url(#obs-arrow)"/>
      <path d="M350 240H388" marker-end="url(#obs-arrow)"/>
      <path d="M550 100H588" marker-end="url(#obs-arrow)"/>
      <path d="M550 170H588" marker-end="url(#obs-arrow)"/>
      <path d="M550 240H588" marker-end="url(#obs-arrow)"/>
      <path d="M685 270V308" marker-end="url(#obs-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="169" y="93">logs</text>
      <text x="169" y="163">pull</text>
      <text x="169" y="233">spans</text>
      <text x="726" y="294">alert fires</text>
    </g>
    <text x="300" y="320" font-size="12" fill="#40566b" text-anchor="middle">Every signal carries the same requestId / trace ID,</text>
    <text x="300" y="338" font-size="12" fill="#40566b" text-anchor="middle">so one ID links a metric spike to its traces and logs.</text>
    <text x="400" y="400" font-size="13" fill="#40566b">Metrics say something is wrong, traces show where, logs explain why.</text>
  </g>
</svg>
