<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="cbs-title cbs-desc">
  <title id="cbs-title">Circuit breaker states and transitions</title>
  <desc id="cbs-desc">In the closed state calls pass through to the dependency and failures are counted; successes keep it closed. When failures exceed a threshold, such as half of the last 20 calls, the breaker opens. In the open state calls fail immediately with a fallback or 503, without touching the dependency. After a cooldown timer expires the breaker moves to half-open and lets a few trial calls through. If the trial calls succeed it closes again; if a trial call fails it opens again.</desc>
  <defs>
    <marker id="cbs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="140" width="200" height="96" rx="12" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <text x="160" y="172" font-size="16" font-weight="700" fill="#294a2e">CLOSED</text>
    <text x="160" y="196" font-size="11.5" fill="#294a2e">calls pass through</text>
    <text x="160" y="214" font-size="11.5" fill="#294a2e">failures are counted</text>

    <rect x="520" y="140" width="200" height="96" rx="12" fill="#fde8e6" stroke="#b5473a" stroke-width="2.5"/>
    <text x="620" y="172" font-size="16" font-weight="700" fill="#6b241c">OPEN</text>
    <text x="620" y="196" font-size="11.5" fill="#6b241c">calls fail immediately</text>
    <text x="620" y="214" font-size="11.5" fill="#6b241c">fallback or 503, no call made</text>

    <rect x="290" y="330" width="200" height="96" rx="12" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="390" y="362" font-size="16" font-weight="700" fill="#66400f">HALF-OPEN</text>
    <text x="390" y="386" font-size="11.5" fill="#66400f">a few trial calls</text>
    <text x="390" y="404" font-size="11.5" fill="#66400f">are allowed through</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 176H518" marker-end="url(#cbs-arrow)"/>
      <path d="M680 236V378H492" marker-end="url(#cbs-arrow)"/>
      <path d="M290 378H100V238" marker-end="url(#cbs-arrow)"/>
      <path d="M450 330V290H580V238" marker-end="url(#cbs-arrow)"/>
      <path d="M120 140C120 88 200 88 200 138" marker-end="url(#cbs-arrow)"/>
    </g>
    <g font-size="12" fill="#36424e">
      <text x="389" y="152" font-weight="700">failures exceed threshold</text>
      <text x="389" y="168">e.g. 50% of the last 20 calls</text>
      <text x="690" y="300" text-anchor="start" font-weight="700">cooldown</text>
      <text x="690" y="316" text-anchor="start">expires</text>
      <text x="112" y="300" text-anchor="start" font-weight="700">trial calls</text>
      <text x="112" y="316" text-anchor="start">succeed</text>
      <text x="515" y="282" font-weight="700">a trial call fails</text>
      <text x="160" y="80" font-weight="700">success: stay closed</text>
    </g>
    <text x="390" y="40" font-size="13" font-weight="700" fill="#40566b">The breaker wraps every call to one dependency</text>
    <text x="390" y="446" font-size="13" fill="#40566b">Failing fast while open gives the dependency time to recover and keeps your threads free.</text>
  </g>
</svg>
