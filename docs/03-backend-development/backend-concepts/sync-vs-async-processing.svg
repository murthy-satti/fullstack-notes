<svg xmlns="http://www.w3.org/2000/svg" width="800" height="372" viewBox="0 0 800 372" role="img" aria-labelledby="sap-title sap-desc">
  <title id="sap-title">Synchronous versus asynchronous processing of a slow request</title>
  <desc id="sap-desc">Synchronously, the client sends POST /reports and waits while the server builds the report for two seconds, then receives 200 OK with the report. Asynchronously, the server enqueues a job and immediately returns 202 Accepted; a worker takes the job and builds the report, and the client later calls GET /reports/42 and receives 200 with status done.</desc>
  <defs>
    <marker id="sap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sap-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="372" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="150" y="34" font-size="13" font-weight="700" fill="#40566b">Synchronous</text>
    <text x="560" y="34" font-size="13" font-weight="700" fill="#40566b">Asynchronous</text>
    <path d="M310 20V352" fill="none" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="5 5"/>

    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M70 80V320"/>
      <path d="M230 80V320"/>
      <path d="M380 80V336"/>
      <path d="M500 80V336"/>
      <path d="M620 80V336"/>
      <path d="M740 80V336"/>
    </g>

    <g stroke-width="2">
      <rect x="22" y="48" width="96" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="182" y="48" width="96" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="332" y="48" width="96" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="452" y="48" width="96" height="32" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="572" y="48" width="96" height="32" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="692" y="48" width="96" height="32" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="70" y="69">Client</text>
      <text x="230" y="69">Server</text>
      <text x="380" y="69">Client</text>
      <text x="500" y="69">Server</text>
      <text x="620" y="69" fill="#463365">Queue</text>
      <text x="740" y="69" fill="#463365">Worker</text>
    </g>

    <rect x="63" y="114" width="14" height="136" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <rect x="223" y="118" width="14" height="118" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="733" y="206" width="14" height="74" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M77 112H221" marker-end="url(#sap-arrow)"/>
      <path d="M380 110H498" marker-end="url(#sap-arrow)"/>
      <path d="M500 140H618" marker-end="url(#sap-arrow)"/>
      <path d="M620 200H731" marker-end="url(#sap-arrow)"/>
      <path d="M380 296H498" marker-end="url(#sap-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4">
      <path d="M223 248H79" marker-end="url(#sap-arrow-dash)"/>
      <path d="M500 170H382" marker-end="url(#sap-arrow-dash)"/>
      <path d="M500 322H382" marker-end="url(#sap-arrow-dash)"/>
    </g>

    <g font-size="11.5" fill="#40566b">
      <text x="150" y="104">POST /reports</text>
      <text x="150" y="240">200 OK + report</text>
      <text x="440" y="102">1 POST /reports</text>
      <text x="560" y="132">2 enqueue job</text>
      <text x="440" y="162">3 202 Accepted</text>
      <text x="680" y="192">4 take job</text>
      <text x="440" y="288">5 GET /reports/42</text>
      <text x="440" y="314">6 200 status: done</text>
      <text x="56" y="186" text-anchor="end">waits</text>
      <text x="244" y="172" text-anchor="start">builds report</text>
      <text x="244" y="188" text-anchor="start">(2 s)</text>
      <text x="726" y="238" text-anchor="end">builds</text>
      <text x="726" y="254" text-anchor="end">(2 s)</text>
    </g>
    <text x="150" y="292" font-size="12" fill="#36424e">The client waits for</text>
    <text x="150" y="308" font-size="12" fill="#36424e">the whole 2 seconds.</text>
    <text x="560" y="358" font-size="12" fill="#36424e">The client is free after step 3 and checks back later.</text>
  </g>
</svg>
