<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="ocp-title ocp-desc">
  <title id="ocp-title">Why a new row breaks offset pagination but not cursor pagination</title>
  <desc id="ocp-desc">Page 1, requested with limit 5 and offset 0, returns orders 10 to 6, newest first. Then order 11 is inserted at the top. Page 2 by offset skips the first five rows of the new data, 11 to 7, and returns 6 to 2, so order 6 appears twice. Page 2 by cursor asks for rows after order 6 and returns 5 to 1, with no duplicates and no gaps.</desc>
  <rect width="800" height="410" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g text-anchor="start">
      <text x="20" y="72" font-size="13" font-weight="700" fill="#36424e">Page 1</text>
      <text x="20" y="88" font-size="11.5" fill="#36424e">?limit=5&amp;offset=0</text>
      <text x="20" y="186" font-size="13" font-weight="700" fill="#36424e">Data now</text>
      <text x="20" y="202" font-size="11.5" fill="#36424e">newest first</text>
      <text x="20" y="270" font-size="13" font-weight="700" fill="#6b241c">Page 2 by offset</text>
      <text x="20" y="286" font-size="11.5" fill="#6b241c">?limit=5&amp;offset=5</text>
      <text x="20" y="338" font-size="13" font-weight="700" fill="#294a2e">Page 2 by cursor</text>
      <text x="20" y="354" font-size="11.5" fill="#294a2e">?limit=5&amp;cursor=after-6</text>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="1.5">
      <rect x="250" y="58" width="40" height="36" rx="6"/>
      <rect x="296" y="58" width="40" height="36" rx="6"/>
      <rect x="342" y="58" width="40" height="36" rx="6"/>
      <rect x="388" y="58" width="40" height="36" rx="6"/>
      <rect x="434" y="58" width="40" height="36" rx="6"/>
    </g>
    <g font-size="13" font-weight="700" fill="#263e5a">
      <text x="270" y="81">10</text><text x="316" y="81">9</text><text x="362" y="81">8</text><text x="408" y="81">7</text><text x="454" y="81">6</text>
    </g>

    <rect x="250" y="104" width="300" height="26" rx="13" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="400" y="122" font-size="12" font-weight="700" fill="#66400f">Then order 11 is inserted at the top</text>

    <path d="M252 160V154H472V160" fill="none" stroke="#b5473a" stroke-width="1.5"/>
    <text x="362" y="150" font-size="11.5" fill="#b5473a">offset=5 skips these five</text>
    <rect x="250" y="172" width="40" height="36" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="296" y="172" width="40" height="36" rx="6"/>
      <rect x="342" y="172" width="40" height="36" rx="6"/>
      <rect x="388" y="172" width="40" height="36" rx="6"/>
      <rect x="434" y="172" width="40" height="36" rx="6"/>
      <rect x="480" y="172" width="40" height="36" rx="6"/>
      <rect x="526" y="172" width="40" height="36" rx="6"/>
      <rect x="572" y="172" width="40" height="36" rx="6"/>
      <rect x="618" y="172" width="40" height="36" rx="6"/>
      <rect x="664" y="172" width="40" height="36" rx="6"/>
      <rect x="710" y="172" width="40" height="36" rx="6"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="270" y="195" fill="#66400f">11</text><text x="316" y="195">10</text><text x="362" y="195">9</text><text x="408" y="195">8</text><text x="454" y="195">7</text><text x="500" y="195">6</text><text x="546" y="195">5</text><text x="592" y="195">4</text><text x="638" y="195">3</text><text x="684" y="195">2</text><text x="730" y="195">1</text>
    </g>
    <path d="M523 166V216" fill="none" stroke="#53845b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="531" y="230" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">cursor: after order 6</text>

    <rect x="480" y="256" width="40" height="36" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="526" y="256" width="40" height="36" rx="6"/>
      <rect x="572" y="256" width="40" height="36" rx="6"/>
      <rect x="618" y="256" width="40" height="36" rx="6"/>
      <rect x="664" y="256" width="40" height="36" rx="6"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="500" y="279" fill="#6b241c">6</text><text x="546" y="279">5</text><text x="592" y="279">4</text><text x="638" y="279">3</text><text x="684" y="279">2</text>
    </g>
    <text x="470" y="279" font-size="12" font-weight="700" fill="#b5473a" text-anchor="end">6 again: duplicate</text>

    <g fill="#e8f5e9" stroke="#53845b" stroke-width="1.5">
      <rect x="526" y="324" width="40" height="36" rx="6"/>
      <rect x="572" y="324" width="40" height="36" rx="6"/>
      <rect x="618" y="324" width="40" height="36" rx="6"/>
      <rect x="664" y="324" width="40" height="36" rx="6"/>
      <rect x="710" y="324" width="40" height="36" rx="6"/>
    </g>
    <g font-size="13" font-weight="700" fill="#294a2e">
      <text x="546" y="347">5</text><text x="592" y="347">4</text><text x="638" y="347">3</text><text x="684" y="347">2</text><text x="730" y="347">1</text>
    </g>
    <text x="516" y="347" font-size="12" font-weight="700" fill="#294a2e" text-anchor="end">no duplicates, no gaps</text>
    <text x="400" y="392" font-size="13" fill="#40566b">An offset counts positions, which shift when rows are added; a cursor remembers the last row seen.</text>
  </g>
</svg>
