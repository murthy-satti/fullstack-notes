<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="occ-title occ-desc">
  <title id="occ-title">OAuth client credentials flow between two services</title>
  <desc id="occ-desc">Service A posts to the authorization server's token endpoint with grant_type client_credentials, its own client authentication, and the scopes it needs. The authorization server returns an access token for service A's own permissions. Service A calls service B with the token as a Bearer token; service B verifies the issuer, audience, and scope, then returns the report data. No user is involved.</desc>
  <defs>
    <marker id="occ-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="occ-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="760" height="320" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="22" width="120" height="34" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="120" y="44" font-size="13" font-weight="700" fill="#66400f">Service A</text>
    <rect x="320" y="22" width="160" height="34" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="400" y="44" font-size="13" font-weight="700" fill="#463365">Authorization server</text>
    <rect x="600" y="22" width="120" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="660" y="44" font-size="13" font-weight="700" fill="#263e5a">Service B</text>

    <g stroke="#a7b1bc" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M120 56V272M400 56V272M660 56V272"/>
    </g>

    <rect x="570" y="190" width="180" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="660" y="206" font-size="11.5" font-weight="700" fill="#263e5a">verify token:</text>
    <text x="660" y="222" font-size="11.5" fill="#263e5a">iss, aud, exp, scope</text>

    <g font-size="11.5" fill="#36424e">
      <text x="260" y="84">1. POST /token</text>
      <text x="260" y="108">client_credentials + client auth</text>
      <text x="260" y="140">2. access_token (A's own scopes)</text>
      <text x="260" y="174">3. GET /reports</text>
      <text x="260" y="198">Authorization: Bearer</text>
      <text x="260" y="252">4. 200 OK + report data</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M120 90H398" marker-end="url(#occ-arrow)"/>
      <path d="M120 180H658" marker-end="url(#occ-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M400 146H122" marker-end="url(#occ-ret)"/>
      <path d="M660 258H122" marker-end="url(#occ-ret)"/>
    </g>
    <text x="380" y="302" font-size="13" fill="#40566b">No user is involved: the service authenticates as itself and receives only its own permissions.</text>
  </g>
</svg>
