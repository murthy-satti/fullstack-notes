<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" role="img" aria-labelledby="tdl-title tdl-desc">
  <title id="tdl-title">Test hooks around a real test database</title>
  <desc id="tdl-desc">before runs once: it starts MongoMemoryServer and connects a MongoClient. For every test, beforeEach clears the tasks collection with deleteMany so each test starts from a known state, then the it block sends supertest requests and makes assertions. While more tests remain, the cycle repeats from beforeEach. When none remain, after runs once to close the client and stop the in-memory server.</desc>
  <defs>
    <marker id="tdl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="370" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="266" y="44" width="502" height="208" rx="10" fill="#faf7fe" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="756" y="36" font-size="12" font-weight="700" fill="#8062a8" text-anchor="end">repeats for every it()</text>

    <rect x="24" y="70" width="220" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="134" y="90" font-size="14" font-weight="700" fill="#463365">before(): once</text>
    <text x="134" y="108" font-size="11.5" fill="#463365">MongoMemoryServer.create()</text>
    <text x="134" y="123" font-size="11.5" fill="#463365">MongoClient.connect(uri)</text>

    <rect x="280" y="70" width="220" height="60" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="90" font-size="14" font-weight="700" fill="#263e5a">beforeEach()</text>
    <text x="390" y="108" font-size="11.5" fill="#263e5a">tasks.deleteMany({})</text>
    <text x="390" y="123" font-size="11.5" fill="#263e5a">known starting state</text>

    <rect x="536" y="70" width="220" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="646" y="90" font-size="14" font-weight="700" fill="#66400f">it(): one test</text>
    <text x="646" y="108" font-size="11.5" fill="#66400f">supertest requests</text>
    <text x="646" y="123" font-size="11.5" fill="#66400f">status and body assertions</text>

    <path d="M646 168 736 198 646 228 556 198z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="646" y="203" font-size="12" font-weight="700" fill="#36424e">more tests?</text>

    <rect x="536" y="270" width="220" height="60" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="646" y="290" font-size="14" font-weight="700" fill="#294a2e">after(): once</text>
    <text x="646" y="308" font-size="11.5" fill="#294a2e">client.close()</text>
    <text x="646" y="323" font-size="11.5" fill="#294a2e">mongod.stop()</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 100H278" marker-end="url(#tdl-arrow)"/>
      <path d="M500 100H534" marker-end="url(#tdl-arrow)"/>
      <path d="M646 130V166" marker-end="url(#tdl-arrow)"/>
      <path d="M556 198H390V132" marker-end="url(#tdl-arrow)"/>
      <path d="M646 228V268" marker-end="url(#tdl-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="472" y="190">yes</text>
      <text x="662" y="266">no</text>
    </g>
    <text x="390" y="356" font-size="13" fill="#40566b">Start the database once, reset it before each test, and stop it once at the end.</text>
  </g>
</svg>
