<svg xmlns="http://www.w3.org/2000/svg" width="780" height="610" viewBox="0 0 780 610" role="img" aria-labelledby="cmd-title cmd-desc">
  <title id="cmd-title">What the cors() middleware does with each request</title>
  <desc id="cmd-desc">If the request has no Origin header it is not a cross-origin browser request and cors calls next with no CORS headers. If the origin is allowed, cors adds Access-Control-Allow-Origin, Allow-Credentials and Vary headers; if not, it adds no Allow-Origin header but does not block the request. An OPTIONS preflight is answered with 204 and the Allow-Methods and Allow-Headers headers, and the route never runs. Any other request calls next so the route handler runs. The browser then lets JavaScript read the response only if Allow-Origin matches the page origin; otherwise it reports a CORS error.</desc>
  <defs>
    <marker id="cmd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="610" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="20" width="200" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="45" font-size="14" font-weight="700" fill="#36424e">Request reaches cors()</text>

    <path d="M390 80 510 110 390 140 270 110z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="107" font-size="12" font-weight="700" fill="#36424e">Origin header</text>
    <text x="390" y="121" font-size="12" font-weight="700" fill="#36424e">present?</text>

    <rect x="560" y="86" width="196" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="658" y="106" font-size="14" font-weight="700" fill="#36424e">Not cross-origin</text>
    <text x="658" y="123" font-size="11.5" fill="#36424e">next() with no CORS headers</text>

    <path d="M390 170 510 200 390 230 270 200z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="197" font-size="12" font-weight="700" fill="#36424e">Origin allowed?</text>
    <text x="390" y="211" font-size="11" fill="#36424e">list, RegExp or function</text>

    <rect x="24" y="176" width="206" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="127" y="196" font-size="14" font-weight="700" fill="#6b241c">No Allow-Origin header</text>
    <text x="127" y="213" font-size="11.5" fill="#6b241c">server does not block it</text>

    <rect x="290" y="252" width="200" height="60" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="272" font-size="14" font-weight="700" fill="#294a2e">Add CORS headers</text>
    <text x="390" y="290" font-size="11.5" fill="#294a2e">Access-Control-Allow-Origin</text>
    <text x="390" y="305" font-size="11.5" fill="#294a2e">+ Allow-Credentials, Vary</text>

    <path d="M390 334 510 364 390 394 270 364z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="361" font-size="12" font-weight="700" fill="#36424e">OPTIONS</text>
    <text x="390" y="375" font-size="12" font-weight="700" fill="#36424e">preflight?</text>

    <rect x="560" y="340" width="196" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="658" y="360" font-size="14" font-weight="700" fill="#463365">Respond 204</text>
    <text x="658" y="377" font-size="11.5" fill="#463365">+ Allow-Methods / -Headers</text>
    <text x="658" y="406" font-size="11.5" font-style="italic" fill="#463365">route handler never runs</text>

    <rect x="290" y="416" width="200" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="436" font-size="14" font-weight="700" fill="#66400f">next(): route runs</text>
    <text x="390" y="453" font-size="11.5" fill="#66400f">response keeps CORS headers</text>

    <path d="M390 492 510 522 390 552 270 522z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="519" font-size="12" font-weight="700" fill="#36424e">Allow-Origin matches</text>
    <text x="390" y="533" font-size="12" font-weight="700" fill="#36424e">page origin?</text>

    <rect x="560" y="498" width="196" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="658" y="518" font-size="14" font-weight="700" fill="#294a2e">JavaScript reads it</text>
    <text x="658" y="535" font-size="11.5" fill="#294a2e">fetch() resolves normally</text>

    <rect x="24" y="498" width="206" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="127" y="518" font-size="14" font-weight="700" fill="#6b241c">CORS error</text>
    <text x="127" y="535" font-size="11.5" fill="#6b241c">fetch() rejects, data hidden</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 60V78" marker-end="url(#cmd-arrow)"/>
      <path d="M510 110H558" marker-end="url(#cmd-arrow)"/>
      <path d="M390 140V168" marker-end="url(#cmd-arrow)"/>
      <path d="M270 200H232" marker-end="url(#cmd-arrow)"/>
      <path d="M390 230V250" marker-end="url(#cmd-arrow)"/>
      <path d="M127 224V364H268" marker-end="url(#cmd-arrow)"/>
      <path d="M390 312V332" marker-end="url(#cmd-arrow)"/>
      <path d="M510 364H558" marker-end="url(#cmd-arrow)"/>
      <path d="M390 394V414" marker-end="url(#cmd-arrow)"/>
      <path d="M390 464V490" marker-end="url(#cmd-arrow)"/>
      <path d="M510 522H558" marker-end="url(#cmd-arrow)"/>
      <path d="M270 522H232" marker-end="url(#cmd-arrow)"/>
    </g>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="534" y="103">no</text>
      <text x="406" y="158">yes</text>
      <text x="251" y="193">no</text>
      <text x="406" y="245">yes</text>
      <text x="534" y="357">yes</text>
      <text x="404" y="409">no</text>
      <text x="534" y="515">yes</text>
      <text x="251" y="515">no</text>
    </g>
    <text x="400" y="482" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">browser receives the response</text>
    <text x="390" y="590" font-size="13" fill="#40566b">cors() never rejects a request: a disallowed origin only loses its headers, and the browser hides the response.</text>
  </g>
</svg>
