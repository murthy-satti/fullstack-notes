<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510" role="img" aria-labelledby="sfl-title sfl-desc">
  <title id="sfl-title">How express.static answers a file request</title>
  <desc id="sfl-desc">express.static maps the URL path to a file inside its root folder. A path that tries to escape the root with ../ is refused and never served; with the default fallthrough: true the middleware calls next, so the request usually ends as a 404, and only with fallthrough: false does it become a 403 Forbidden error. If no file exists (dotfiles are ignored by default) it calls next, so the next static folder and then the routes are tried, ending at a single-page-app fallback that sends index.html or at the 404 handler. If the file exists and the browser's If-None-Match equals the file's ETag, the response is 304 Not Modified with an empty body; otherwise it is 200 with the file and Cache-Control, ETag and Last-Modified headers.</desc>
  <defs>
    <marker id="sfl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="510" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="24" width="200" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="49" font-size="14" font-weight="700" fill="#36424e">GET /css/site.css</text>

    <rect x="270" y="84" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="104" font-size="14" font-weight="700" fill="#263e5a">express.static("public")</text>
    <text x="390" y="121" font-size="11.5" fill="#263e5a">looks for public/css/site.css</text>

    <path d="M390 138 500 168 390 198 280 168z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="165" font-size="12" font-weight="700" fill="#36424e">path escapes</text>
    <text x="390" y="179" font-size="12" font-weight="700" fill="#36424e">the root (../)?</text>
    <path d="M390 228 500 258 390 288 280 258z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="255" font-size="12" font-weight="700" fill="#36424e">file exists?</text>
    <text x="390" y="269" font-size="11" fill="#36424e">dotfiles ignored</text>
    <path d="M390 318 500 348 390 378 280 348z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="345" font-size="12" font-weight="700" fill="#36424e">If-None-Match</text>
    <text x="390" y="359" font-size="12" font-weight="700" fill="#36424e">equals ETag?</text>

    <rect x="270" y="410" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="430" font-size="14" font-weight="700" fill="#294a2e">200 + the file</text>
    <text x="390" y="447" font-size="11.5" fill="#294a2e">Cache-Control, ETag, Last-Modified</text>

    <rect x="530" y="136" width="226" height="64" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="643" y="157" font-size="14" font-weight="700" fill="#6b241c">Refused, not served</text>
    <text x="643" y="174" font-size="11.5" fill="#6b241c">default: next(), usually a 404</text>
    <text x="643" y="190" font-size="11.5" fill="#6b241c">403 only with fallthrough: false</text>
    <rect x="530" y="324" width="226" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="643" y="344" font-size="14" font-weight="700" fill="#294a2e">304 Not Modified</text>
    <text x="643" y="361" font-size="11.5" fill="#294a2e">empty body, cached copy used</text>

    <rect x="20" y="234" width="230" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="135" y="254" font-size="14" font-weight="700" fill="#36424e">next()</text>
    <text x="135" y="271" font-size="11.5" fill="#36424e">fallthrough: true (default)</text>
    <rect x="20" y="310" width="230" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="135" y="330" font-size="14" font-weight="700" fill="#36424e">Next static folder</text>
    <text x="135" y="347" font-size="11.5" fill="#36424e">then routes; first match wins</text>
    <rect x="20" y="386" width="230" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="135" y="406" font-size="14" font-weight="700" fill="#66400f">SPA fallback or 404</text>
    <text x="135" y="423" font-size="11.5" fill="#66400f">/{*splat} sends index.html</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 64V82" marker-end="url(#sfl-arrow)"/>
      <path d="M390 132V136" marker-end="url(#sfl-arrow)"/>
      <path d="M390 198V226" marker-end="url(#sfl-arrow)"/>
      <path d="M390 288V316" marker-end="url(#sfl-arrow)"/>
      <path d="M390 378V408" marker-end="url(#sfl-arrow)"/>
      <path d="M500 168H528" marker-end="url(#sfl-arrow)"/>
      <path d="M500 348H528" marker-end="url(#sfl-arrow)"/>
      <path d="M280 258H252" marker-end="url(#sfl-arrow)"/>
      <path d="M135 282V308" marker-end="url(#sfl-arrow)"/>
      <path d="M135 358V384" marker-end="url(#sfl-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="514" y="161">yes</text>
      <text x="406" y="216">no</text>
      <text x="266" y="251">no</text>
      <text x="408" y="306">yes</text>
      <text x="514" y="341">yes</text>
      <text x="406" y="398">no</text>
    </g>
    <text x="390" y="490" font-size="13" fill="#40566b">By default a miss or a refused path is not an error: express.static calls next() and the request moves on.</text>
  </g>
</svg>
