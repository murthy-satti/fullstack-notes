<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" role="img" aria-labelledby="vmf-title vmf-desc">
  <title id="vmf-title">How a validation middleware protects a route handler</title>
  <desc id="vmf-desc">A POST /customers/12/orders request first passes through express.json. If the body is not valid JSON the response is 400 Bad Request. Otherwise validate runs schema.safeParse on each configured location such as params and body. If there are any issues, the response is 422 Validation failed with a list of issues giving location, path, and message, and the handler never runs. If there are none, req.validated holds the parsed data with coerced types and unknown keys removed; the route handler reads req.validated.body, and the service and database receive only checked data.</desc>
  <defs>
    <marker id="vmf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="20" width="280" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="45" font-size="14" font-weight="700" fill="#36424e">POST /customers/12/orders</text>

    <rect x="100" y="80" width="280" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="100" font-size="14" font-weight="700" fill="#263e5a">express.json()</text>
    <text x="240" y="117" font-size="11.5" fill="#263e5a">parses the raw body</text>

    <path d="M240 146 340 174 240 202 140 174z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="178" font-size="12" font-weight="700" fill="#36424e">valid JSON?</text>

    <rect x="440" y="150" width="300" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="590" y="170" font-size="14" font-weight="700" fill="#6b241c">400 Bad Request</text>
    <text x="590" y="187" font-size="11.5" fill="#6b241c">the body is not valid JSON</text>

    <rect x="100" y="222" width="280" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="244" font-size="14" font-weight="700" fill="#263e5a">validate({ params, body })</text>
    <text x="240" y="263" font-size="11.5" fill="#263e5a">schema.safeParse(req[location]) for each</text>

    <path d="M240 296 340 326 240 356 140 326z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="330" font-size="12" font-weight="700" fill="#36424e">any issues?</text>

    <rect x="440" y="300" width="300" height="52" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="590" y="321" font-size="14" font-weight="700" fill="#6b241c">422 Validation failed</text>
    <text x="590" y="339" font-size="11.5" fill="#6b241c">issues: [{ location, path, message }]</text>
    <text x="590" y="372" font-size="11.5" font-style="italic" fill="#6b241c">the handler never runs</text>

    <rect x="100" y="376" width="280" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="240" y="396" font-size="14" font-weight="700" fill="#463365">req.validated = result.data</text>
    <text x="240" y="413" font-size="11.5" fill="#463365">coerced types, unknown keys removed</text>

    <rect x="100" y="442" width="280" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="240" y="462" font-size="14" font-weight="700" fill="#66400f">Route handler</text>
    <text x="240" y="479" font-size="11.5" fill="#66400f">reads req.validated.body</text>

    <rect x="100" y="508" width="280" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="240" y="528" font-size="14" font-weight="700" fill="#294a2e">Service and database</text>
    <text x="240" y="545" font-size="11.5" fill="#294a2e">receive only checked data</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M240 60V78" marker-end="url(#vmf-arrow)"/>
      <path d="M240 128V144" marker-end="url(#vmf-arrow)"/>
      <path d="M340 174H438" marker-end="url(#vmf-arrow)"/>
      <path d="M240 202V220" marker-end="url(#vmf-arrow)"/>
      <path d="M240 278V294" marker-end="url(#vmf-arrow)"/>
      <path d="M340 326H438" marker-end="url(#vmf-arrow)"/>
      <path d="M240 356V374" marker-end="url(#vmf-arrow)"/>
      <path d="M240 424V440" marker-end="url(#vmf-arrow)"/>
      <path d="M240 490V506" marker-end="url(#vmf-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="389" y="166">no</text>
      <text x="389" y="318">yes</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="250" y="216">yes</text>
      <text x="250" y="370">no</text>
    </g>
    <text x="390" y="584" font-size="13" fill="#40566b">Validation runs before the handler, so bad input is rejected with every problem listed at once.</text>
  </g>
</svg>
