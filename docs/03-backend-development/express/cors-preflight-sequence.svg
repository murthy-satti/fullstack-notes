<svg xmlns="http://www.w3.org/2000/svg" width="780" height="570" viewBox="0 0 780 570" role="img" aria-labelledby="cps-title cps-desc">
  <title id="cps-title">A CORS preflight followed by the real request</title>
  <desc id="cps-desc">The browser sends an OPTIONS preflight with Origin, Access-Control-Request-Method and Access-Control-Request-Headers. The cors middleware answers 204 No Content with Access-Control-Allow-Origin, Allow-Methods and Allow-Headers, and the route is not called. The browser then sends the real POST with its Origin header; cors sets the CORS headers and calls next, the route handler responds 201 Created with Access-Control-Allow-Origin, and the browser lets JavaScript read the body.</desc>
  <defs>
    <marker id="cps-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cps-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="570" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="15" y="20" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="90" y="40" font-size="14" font-weight="700" fill="#263e5a">Browser</text>
    <text x="90" y="57" font-size="11.5" fill="#263e5a">page: app.example.com</text>
    <rect x="395" y="20" width="150" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="470" y="40" font-size="14" font-weight="700" fill="#36424e">cors()</text>
    <text x="470" y="57" font-size="11.5" fill="#36424e">api.example.com</text>
    <rect x="615" y="20" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="690" y="40" font-size="14" font-weight="700" fill="#66400f">Route handler</text>
    <text x="690" y="57" font-size="11.5" fill="#66400f">POST /api/orders</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M90 68V256M90 292V476M90 512V522"/>
      <path d="M470 68V522"/>
      <path d="M690 68V522"/>
    </g>

    <g text-anchor="start" fill="#36424e">
      <text x="104" y="98" font-size="12" font-weight="700">1. OPTIONS /api/orders (preflight)</text>
      <text x="104" y="113" font-size="11">Origin: https://app.example.com</text>
      <text x="104" y="127" font-size="11">Access-Control-Request-Method: POST</text>
      <text x="104" y="141" font-size="11">Access-Control-Request-Headers: content-type, authorization</text>

      <text x="104" y="182" font-size="12" font-weight="700">2. 204 No Content</text>
      <text x="104" y="197" font-size="11">Access-Control-Allow-Origin: https://app.example.com</text>
      <text x="104" y="211" font-size="11">Access-Control-Allow-Methods: GET,POST</text>
      <text x="104" y="225" font-size="11">Access-Control-Allow-Headers: content-type,authorization</text>

      <text x="104" y="316" font-size="12" font-weight="700">3. POST /api/orders (the real request)</text>
      <text x="104" y="331" font-size="11">Origin: https://app.example.com</text>

      <text x="484" y="374" font-size="12" font-weight="700">4. next()</text>
      <text x="484" y="388" font-size="11">CORS headers already set on res</text>

      <text x="104" y="426" font-size="12" font-weight="700">5. 201 Created</text>
      <text x="104" y="441" font-size="11">Access-Control-Allow-Origin: https://app.example.com</text>

      <text x="482" y="196" font-size="11.5" font-style="italic" fill="#463365">preflight ends here;</text>
      <text x="482" y="211" font-size="11.5" font-style="italic" fill="#463365">the route is not called</text>
    </g>

    <rect x="15" y="256" width="150" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="90" y="271" font-size="11.5" font-weight="700" fill="#36424e">preflight passed:</text>
    <text x="90" y="285" font-size="11.5" fill="#36424e">send the real request</text>

    <rect x="15" y="476" width="150" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="90" y="491" font-size="11.5" font-weight="700" fill="#294a2e">origin matches:</text>
    <text x="90" y="505" font-size="11.5" fill="#294a2e">JS reads the body</text>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M90 154H468" stroke="#40566b" marker-end="url(#cps-arrow)"/>
      <path d="M470 238H92" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#cps-ret)"/>
      <path d="M90 344H468" stroke="#40566b" marker-end="url(#cps-arrow)"/>
      <path d="M470 398H688" stroke="#40566b" marker-end="url(#cps-arrow)"/>
      <path d="M690 454H92" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#cps-ret)"/>
    </g>
    <text x="390" y="550" font-size="13" fill="#40566b">Two round trips: the preflight asks permission, then the real request runs the route.</text>
  </g>
</svg>
