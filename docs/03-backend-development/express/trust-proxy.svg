<svg xmlns="http://www.w3.org/2000/svg" width="780" height="466" viewBox="0 0 780 466" role="img" aria-labelledby="tpx-title tpx-desc">
  <title id="tpx-title">What the trust proxy setting changes behind a reverse proxy</title>
  <desc id="tpx-desc">A browser at 203.0.113.5 connects over HTTPS to an Nginx proxy at 10.0.0.2, which forwards the request over HTTP to Express and adds X-Forwarded-For: 203.0.113.5 and X-Forwarded-Proto: https. If trust proxy is set to 1, req.ip is 203.0.113.5 and req.protocol is https. If it is not set, req.ip is the proxy's 10.0.0.2 and req.protocol is http. If trust proxy is enabled but no proxy sits in front of the app, a client can send its own X-Forwarded-For header, such as 1.2.3.4, and req.ip becomes that spoofed value, which breaks rate limiting and audit logs.</desc>
  <defs>
    <marker id="tpx-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="466" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="160" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="104" y="64" font-size="14" font-weight="700" fill="#36424e">Browser</text>
    <text x="104" y="82" font-size="11.5" fill="#36424e">IP 203.0.113.5</text>
    <rect x="300" y="40" width="180" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="64" font-size="14" font-weight="700" fill="#36424e">Nginx (proxy)</text>
    <text x="390" y="82" font-size="11.5" fill="#36424e">IP 10.0.0.2, ends TLS</text>
    <rect x="596" y="40" width="160" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="676" y="64" font-size="14" font-weight="700" fill="#66400f">Express app</text>
    <text x="676" y="82" font-size="11.5" fill="#66400f">socket is from 10.0.0.2</text>

    <rect x="400" y="116" width="180" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="490" y="134" font-size="11.5" fill="#463365">X-Forwarded-For: 203.0.113.5</text>
    <text x="490" y="151" font-size="11.5" fill="#463365">X-Forwarded-Proto: https</text>
    <path d="M538 116V72" fill="none" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <path d="M676 186 751 214 676 242 601 214z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="676" y="211" font-size="12" font-weight="700" fill="#36424e">"trust proxy"</text>
    <text x="676" y="225" font-size="12" font-weight="700" fill="#36424e">set to 1?</text>

    <rect x="556" y="268" width="200" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="656" y="290" font-size="12" font-weight="700" fill="#294a2e">req.ip = "203.0.113.5"</text>
    <text x="656" y="308" font-size="12" font-weight="700" fill="#294a2e">req.protocol = "https"</text>

    <rect x="322" y="188" width="218" height="52" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="431" y="210" font-size="12" font-weight="700" fill="#6b241c">req.ip = "10.0.0.2" (proxy)</text>
    <text x="431" y="228" font-size="12" font-weight="700" fill="#6b241c">req.protocol = "http"</text>

    <text x="24" y="356" font-size="13" font-weight="700" fill="#6b241c" text-anchor="start">Danger: trust proxy enabled, but no proxy in front of the app</text>
    <rect x="24" y="368" width="160" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="104" y="390" font-size="14" font-weight="700" fill="#36424e">Any client</text>
    <text x="104" y="407" font-size="11.5" fill="#36424e">writes its own header</text>
    <rect x="404" y="368" width="160" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="484" y="390" font-size="14" font-weight="700" fill="#66400f">Express app</text>
    <text x="484" y="407" font-size="11.5" fill="#66400f">trust proxy = 1</text>
    <rect x="596" y="368" width="160" height="52" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="676" y="390" font-size="12" font-weight="700" fill="#6b241c">req.ip = "1.2.3.4"</text>
    <text x="676" y="407" font-size="11.5" fill="#6b241c">spoofed IP</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M184 68H298" marker-end="url(#tpx-arrow)"/>
      <path d="M480 68H594" marker-end="url(#tpx-arrow)"/>
      <path d="M676 96V184" marker-end="url(#tpx-arrow)"/>
      <path d="M676 242V266" marker-end="url(#tpx-arrow)"/>
      <path d="M601 214H542" marker-end="url(#tpx-arrow)"/>
      <path d="M184 394H402" marker-end="url(#tpx-arrow)"/>
      <path d="M564 394H594" marker-end="url(#tpx-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="241" y="60">HTTPS</text>
      <text x="508" y="60">HTTP</text>
      <text x="690" y="260" text-anchor="start">yes</text>
      <text x="572" y="206">no</text>
    </g>
    <text x="293" y="386" font-size="11.5" fill="#40566b">X-Forwarded-For: 1.2.3.4</text>
    <text x="390" y="450" font-size="13" fill="#40566b">Trust exactly the proxy hops you control; otherwise forwarded headers are just client input.</text>
  </g>
</svg>
