<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="nsi-title nsi-desc">
  <title id="nsi-title">NoSQL operator injection, with and without validation</title>
  <desc id="nsi-desc">A login request sends a password that is an object, {"$ne": null}, instead of a string. Without validation, User.findOne receives the request values directly, MongoDB treats $ne as an operator meaning any password that is not null, and the attacker logs in as admin without knowing the password. With validation first, the schema requires password to be a string, the check fails because it is an object, and the API returns 400 Bad Request before any query runs.</desc>
  <defs>
    <marker id="nsi-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="170" y="20" width="440" height="60" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="42" font-size="14" font-weight="700" fill="#36424e">POST /login</text>
    <text x="390" y="64" font-size="11.5" fill="#36424e">{"email": "admin@example.com", "password": {"$ne": null}}</text>

    <text x="40" y="120" font-size="13" font-weight="700" fill="#6b241c" text-anchor="start">Without validation</text>
    <text x="740" y="120" font-size="13" font-weight="700" fill="#294a2e" text-anchor="end">Validated first</text>

    <rect x="40" y="132" width="320" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="152" font-size="14" font-weight="700" fill="#66400f">User.findOne({ email, password })</text>
    <text x="200" y="169" font-size="11.5" fill="#66400f">request values passed straight in</text>
    <rect x="40" y="212" width="320" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="232" font-size="14" font-weight="700" fill="#36424e">MongoDB sees an operator</text>
    <text x="200" y="249" font-size="11.5" fill="#36424e">password: { $ne: null } means "any value"</text>
    <rect x="40" y="292" width="320" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="200" y="312" font-size="14" font-weight="700" fill="#6b241c">Logged in as admin</text>
    <text x="200" y="329" font-size="11.5" fill="#6b241c">no password needed</text>

    <rect x="420" y="132" width="320" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="580" y="152" font-size="14" font-weight="700" fill="#263e5a">Schema: password is a string</text>
    <text x="580" y="169" font-size="11.5" fill="#263e5a">validate(loginSchema) runs first</text>
    <rect x="420" y="212" width="320" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="232" font-size="14" font-weight="700" fill="#36424e">Check fails</text>
    <text x="580" y="249" font-size="11.5" fill="#36424e">password is an object, not a string</text>
    <rect x="420" y="292" width="320" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="312" font-size="14" font-weight="700" fill="#294a2e">400 Bad Request</text>
    <text x="580" y="329" font-size="11.5" fill="#294a2e">the query never runs</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M280 80 230 128" marker-end="url(#nsi-arrow)"/>
      <path d="M500 80 550 128" marker-end="url(#nsi-arrow)"/>
      <path d="M200 180V210" marker-end="url(#nsi-arrow)"/>
      <path d="M200 260V290" marker-end="url(#nsi-arrow)"/>
      <path d="M580 180V210" marker-end="url(#nsi-arrow)"/>
      <path d="M580 260V290" marker-end="url(#nsi-arrow)"/>
    </g>
    <text x="390" y="378" font-size="13" fill="#40566b">Checking types before building a query keeps request data from turning into query operators.</text>
  </g>
</svg>
