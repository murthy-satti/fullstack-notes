<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590" role="img" aria-labelledby="upc-title upc-desc">
  <title id="upc-title">Uploading through the server versus directly with a presigned URL</title>
  <desc id="upc-desc">In the first flow the browser posts the whole file to Express, which sends the same bytes to S3 with PutObjectCommand and then returns 201 with the key, so the file crosses the network twice and passes through server memory. In the second flow the browser asks Express for a presigned URL, Express signs it locally with getSignedUrl for 300 seconds and returns the URL and key, the browser PUTs the file straight to S3, and then posts only the key to Express at /uploads/confirm, which checks the object and saves metadata.</desc>
  <defs>
    <marker id="upc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="upc-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="590" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="75" y="20" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="150" y="40" font-size="14" font-weight="700" fill="#263e5a">Browser</text>
    <text x="150" y="57" font-size="11.5" fill="#263e5a">has the file</text>
    <rect x="345" y="20" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="420" y="40" font-size="14" font-weight="700" fill="#66400f">Express API</text>
    <text x="420" y="57" font-size="11.5" fill="#66400f">Multer or presigner</text>
    <rect x="595" y="20" width="150" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="670" y="40" font-size="14" font-weight="700" fill="#463365">Object storage</text>
    <text x="670" y="57" font-size="11.5" fill="#463365">S3 bucket</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M150 68V540"/>
      <path d="M420 68V332M420 366V540"/>
      <path d="M670 68V540"/>
    </g>
    <path d="M20 84H760M20 286H760" stroke="#c3ccd7" stroke-width="1.5"/>
    <rect x="20" y="75" width="190" height="20" rx="10" fill="#ece6f7"/>
    <text x="115" y="89" font-size="12" font-weight="700" fill="#463365">A. Through your server</text>
    <rect x="20" y="277" width="270" height="20" rx="10" fill="#ece6f7"/>
    <text x="155" y="291" font-size="12" font-weight="700" fill="#463365">B. Direct upload with a presigned URL</text>

    <g text-anchor="start" fill="#36424e">
      <text x="162" y="114" font-size="12" font-weight="700">1. POST /profile/avatar</text>
      <text x="162" y="128" font-size="11">multipart body: the whole file</text>
      <text x="432" y="160" font-size="12" font-weight="700">2. PutObjectCommand</text>
      <text x="432" y="174" font-size="11">the same bytes again</text>
      <text x="432" y="206" font-size="12" font-weight="700">3. 200 OK</text>
      <text x="162" y="234" font-size="12" font-weight="700">4. 201 { key }</text>
      <text x="162" y="268" font-size="11.5" font-style="italic" fill="#b5473a">The file crosses the network twice and passes through server memory.</text>

      <text x="162" y="316" font-size="12" font-weight="700">1. POST /uploads/presign</text>
      <text x="162" y="388" font-size="12" font-weight="700">3. { url, key }</text>
      <text x="162" y="424" font-size="12" font-weight="700">4. PUT to the presigned URL</text>
      <text x="162" y="438" font-size="11">file bytes go straight to S3</text>
      <text x="432" y="472" font-size="12" font-weight="700">5. 200 OK</text>
      <text x="162" y="502" font-size="12" font-weight="700">6. POST /uploads/confirm { key }</text>
      <text x="162" y="516" font-size="11">server checks it, saves metadata</text>
    </g>

    <rect x="345" y="332" width="150" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="420" y="347" font-size="11.5" font-weight="700" fill="#66400f">2. getSignedUrl()</text>
    <text x="420" y="361" font-size="11.5" fill="#66400f">signed locally, 300 s</text>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 138H418" stroke="#40566b" marker-end="url(#upc-arrow)"/>
      <path d="M420 184H668" stroke="#40566b" marker-end="url(#upc-arrow)"/>
      <path d="M670 214H422" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#upc-ret)"/>
      <path d="M420 244H152" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#upc-ret)"/>
      <path d="M150 326H418" stroke="#40566b" marker-end="url(#upc-arrow)"/>
      <path d="M420 398H152" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#upc-ret)"/>
      <path d="M150 448H668" stroke="#40566b" marker-end="url(#upc-arrow)"/>
      <path d="M670 480H152" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#upc-ret)"/>
      <path d="M150 526H418" stroke="#40566b" marker-end="url(#upc-arrow)"/>
    </g>
    <text x="390" y="570" font-size="13" fill="#40566b">With a presigned URL the server only signs and records; the large file never touches it.</text>
  </g>
</svg>
