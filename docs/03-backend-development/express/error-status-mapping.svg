<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" role="img" aria-labelledby="esm-title esm-desc">
  <title id="esm-title">How the central error handler picks a status code</title>
  <desc id="esm-desc">When an error reaches errorHandler(err, req, res, next), it first checks res.headersSent; if true it returns next(err) and Express closes the connection. Otherwise, if the error is an AppError its own status such as 401, 403, 404, 409, or 422 is used with a safe detail. If err.type was set by express.json, entity.parse.failed becomes 400 and entity.too.large becomes 413. If err.code is 11000, a MongoDB duplicate key, the status is 409 Conflict. Anything else becomes 500 Internal Server Error with a generic detail and the real cause only in the logs. Every branch except headersSent then logs with the request ID and responds with res.status(status).type("application/problem+json").json with title, status, and detail.</desc>
  <defs>
    <marker id="esm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="820" height="640" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="20" width="280" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="45" font-size="13" font-weight="700" fill="#36424e">errorHandler(err, req, res, next)</text>

    <path d="M220 82 330 110 220 138 110 110z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="114" font-size="12" font-weight="700" fill="#36424e">res.headersSent?</text>
    <path d="M220 172 330 200 220 228 110 200z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="204" font-size="12" font-weight="700" fill="#36424e">instanceof AppError?</text>
    <path d="M220 262 330 290 220 318 110 290z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="287" font-size="12" font-weight="700" fill="#36424e">err.type set by</text>
    <text x="220" y="301" font-size="12" font-weight="700" fill="#36424e">express.json()?</text>
    <path d="M220 352 330 380 220 408 110 380z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="384" font-size="12" font-weight="700" fill="#36424e">err.code === 11000?</text>

    <rect x="420" y="86" width="340" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="590" y="106" font-size="14" font-weight="700" fill="#6b241c">return next(err)</text>
    <text x="590" y="123" font-size="11.5" fill="#6b241c">too late to send JSON; Express closes the connection</text>
    <rect x="420" y="176" width="340" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="590" y="196" font-size="14" font-weight="700" fill="#66400f">status = err.status</text>
    <text x="590" y="213" font-size="11.5" fill="#66400f">e.g. 401, 403, 404, 409, 422 with a safe detail</text>
    <rect x="420" y="266" width="340" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="590" y="286" font-size="14" font-weight="700" fill="#263e5a">entity.parse.failed: 400</text>
    <text x="590" y="303" font-size="11.5" fill="#263e5a">entity.too.large: 413</text>
    <rect x="420" y="356" width="340" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="590" y="376" font-size="14" font-weight="700" fill="#463365">409 Conflict</text>
    <text x="590" y="393" font-size="11.5" fill="#463365">MongoDB duplicate key</text>

    <rect x="90" y="440" width="260" height="52" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="220" y="461" font-size="14" font-weight="700" fill="#6b241c">500 Internal Server Error</text>
    <text x="220" y="479" font-size="11.5" fill="#6b241c">generic detail; real cause only in logs</text>

    <rect x="90" y="520" width="670" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="425" y="542" font-size="14" font-weight="700" fill="#294a2e">Log with requestId, then respond</text>
    <text x="425" y="562" font-size="11.5" fill="#294a2e">res.status(status).type("application/problem+json").json({ title, status, detail })</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M220 60V80" marker-end="url(#esm-arrow)"/>
      <path d="M330 110H418" marker-end="url(#esm-arrow)"/>
      <path d="M220 138V170" marker-end="url(#esm-arrow)"/>
      <path d="M330 200H418" marker-end="url(#esm-arrow)"/>
      <path d="M220 228V260" marker-end="url(#esm-arrow)"/>
      <path d="M330 290H418" marker-end="url(#esm-arrow)"/>
      <path d="M220 318V350" marker-end="url(#esm-arrow)"/>
      <path d="M330 380H418" marker-end="url(#esm-arrow)"/>
      <path d="M220 408V438" marker-end="url(#esm-arrow)"/>
      <path d="M220 492V518" marker-end="url(#esm-arrow)"/>
      <path d="M760 200H790"/>
      <path d="M760 290H790"/>
      <path d="M760 380H790"/>
      <path d="M790 200V548H762" marker-end="url(#esm-arrow)"/>
    </g>
    <circle cx="790" cy="290" r="3.5" fill="#40566b"/>
    <circle cx="790" cy="380" r="3.5" fill="#40566b"/>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="374" y="102">yes</text>
      <text x="374" y="192">yes</text>
      <text x="374" y="282">yes</text>
      <text x="374" y="372">yes</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="230" y="158">no</text>
      <text x="230" y="248">no</text>
      <text x="230" y="338">no</text>
      <text x="230" y="428">no</text>
    </g>
    <text x="410" y="614" font-size="13" fill="#40566b">Known errors keep their meaning; anything unexpected becomes a generic 500 that leaks nothing.</text>
  </g>
</svg>
