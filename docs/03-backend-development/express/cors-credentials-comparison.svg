<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="ccc-title ccc-desc">
  <title id="ccc-title">Credentialed CORS needs an explicit origin, not a wildcard</title>
  <desc id="ccc-desc">On the left, cors is configured with origin star and credentials true. The browser sends fetch with credentials include, the response says Access-Control-Allow-Origin star with Allow-Credentials true, and the browser rejects it because a wildcard is not allowed with credentials, so the result is a CORS error. On the right, cors uses the exact origin https://app.example.com with credentials true. The response echoes that origin with Allow-Credentials true and Vary Origin, so the cookie is sent and the body is readable, provided the cookie itself uses SameSite None and Secure.</desc>
  <defs>
    <marker id="ccc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="360" height="434" rx="10" fill="#fdfafa" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="400" y="20" width="360" height="434" rx="10" fill="#f9fcf9" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="200" y="46" font-size="14" font-weight="700" fill="#6b241c">Fails: wildcard + credentials</text>
    <text x="580" y="46" font-size="14" font-weight="700" fill="#294a2e">Works: explicit origin</text>

    <rect x="35" y="60" width="330" height="62" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="79" font-size="14" font-weight="700" fill="#36424e">cors() options</text>
    <text x="200" y="97" font-size="11.5" fill="#36424e">origin: "*"</text>
    <text x="200" y="112" font-size="11.5" fill="#36424e">credentials: true</text>
    <rect x="415" y="60" width="330" height="62" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="79" font-size="14" font-weight="700" fill="#36424e">cors() options</text>
    <text x="580" y="97" font-size="11.5" fill="#36424e">origin: "https://app.example.com"</text>
    <text x="580" y="112" font-size="11.5" fill="#36424e">credentials: true</text>

    <rect x="35" y="142" width="330" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="200" y="162" font-size="14" font-weight="700" fill="#263e5a">Browser request with cookie</text>
    <text x="200" y="179" font-size="11.5" fill="#263e5a">fetch(url, { credentials: "include" })</text>
    <rect x="415" y="142" width="330" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="580" y="162" font-size="14" font-weight="700" fill="#263e5a">Browser request with cookie</text>
    <text x="580" y="179" font-size="11.5" fill="#263e5a">fetch(url, { credentials: "include" })</text>

    <rect x="35" y="210" width="330" height="76" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="232" font-size="14" font-weight="700" fill="#36424e">Response headers</text>
    <text x="200" y="254" font-size="11" fill="#36424e">Access-Control-Allow-Origin: *</text>
    <text x="200" y="270" font-size="11" fill="#36424e">Access-Control-Allow-Credentials: true</text>
    <rect x="415" y="210" width="330" height="76" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="229" font-size="14" font-weight="700" fill="#36424e">Response headers</text>
    <text x="580" y="247" font-size="11" fill="#36424e">Access-Control-Allow-Origin: https://app.example.com</text>
    <text x="580" y="262" font-size="11" fill="#36424e">Access-Control-Allow-Credentials: true</text>
    <text x="580" y="277" font-size="11" fill="#36424e">Vary: Origin</text>

    <path d="M200 306 310 336 200 366 90 336z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="333" font-size="12" font-weight="700" fill="#36424e">Allow-Origin * with</text>
    <text x="200" y="347" font-size="12" font-weight="700" fill="#36424e">credentials?</text>
    <path d="M580 306 690 336 580 366 470 336z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="333" font-size="12" font-weight="700" fill="#36424e">exact origin and</text>
    <text x="580" y="347" font-size="12" font-weight="700" fill="#36424e">credentials true?</text>

    <rect x="35" y="390" width="330" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="200" y="410" font-size="14" font-weight="700" fill="#6b241c">CORS error</text>
    <text x="200" y="427" font-size="11.5" fill="#6b241c">browser refuses: * is never valid with credentials</text>
    <rect x="415" y="390" width="330" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="410" font-size="14" font-weight="700" fill="#294a2e">Cookie sent, body readable</text>
    <text x="580" y="427" font-size="11.5" fill="#294a2e">cookie also needs SameSite=None; Secure</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 122V140" marker-end="url(#ccc-arrow)"/>
      <path d="M200 190V208" marker-end="url(#ccc-arrow)"/>
      <path d="M200 286V304" marker-end="url(#ccc-arrow)"/>
      <path d="M200 366V388" marker-end="url(#ccc-arrow)"/>
      <path d="M580 122V140" marker-end="url(#ccc-arrow)"/>
      <path d="M580 190V208" marker-end="url(#ccc-arrow)"/>
      <path d="M580 286V304" marker-end="url(#ccc-arrow)"/>
      <path d="M580 366V388" marker-end="url(#ccc-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="210" y="382">rejected</text>
      <text x="590" y="382">yes</text>
    </g>
    <text x="390" y="482" font-size="13" fill="#40566b">With credentials, the browser accepts only the exact page origin in Access-Control-Allow-Origin.</text>
  </g>
</svg>
