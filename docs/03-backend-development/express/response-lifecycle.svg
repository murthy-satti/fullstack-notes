<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="rlc-title rlc-desc">
  <title id="rlc-title">The states of an Express response and when ERR_HTTP_HEADERS_SENT is thrown</title>
  <desc id="rlc-desc">A response starts not sent, with res.headersSent false; res.status, res.set, res.cookie, and res.type change it without sending. res.json, res.send, or res.end send the status, headers, and body at once and finish the response, setting res.headersSent to true. Alternatively the first res.write sends the headers and starts streaming; more res.write calls add chunks and res.end finishes. Changing the status or headers while streaming, or sending again after the response finished, throws ERR_HTTP_HEADERS_SENT: Cannot set headers after they are sent to the client.</desc>
  <defs>
    <marker id="rlc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rlc-arrow-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="800" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="150" width="180" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="114" y="176" font-size="14" font-weight="700" fill="#263e5a">Not sent yet</text>
    <text x="114" y="195" font-size="11.5" fill="#263e5a">res.headersSent = false</text>

    <rect x="280" y="40" width="170" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="365" y="66" font-size="14" font-weight="700" fill="#66400f">Streaming</text>
    <text x="365" y="85" font-size="11.5" fill="#66400f">headers fixed, body open</text>

    <rect x="596" y="150" width="180" height="64" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="686" y="176" font-size="14" font-weight="700" fill="#294a2e">Finished</text>
    <text x="686" y="195" font-size="11.5" fill="#294a2e">res.headersSent = true</text>

    <rect x="580" y="20" width="210" height="86" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="686" y="45" font-size="13" font-weight="700" fill="#6b241c">ERR_HTTP_HEADERS_SENT</text>
    <text x="686" y="66" font-size="11.5" fill="#6b241c">Cannot set headers after</text>
    <text x="686" y="82" font-size="11.5" fill="#6b241c">they are sent to the client</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M204 198H594" marker-end="url(#rlc-arrow)"/>
      <path d="M114 150V72H278" marker-end="url(#rlc-arrow)"/>
      <path d="M420 104V166H594" marker-end="url(#rlc-arrow)"/>
      <path d="M310 104V130H360V106" marker-end="url(#rlc-arrow)"/>
      <path d="M74 214V244H154V216" marker-end="url(#rlc-arrow)"/>
    </g>
    <g fill="none" stroke="#b5473a" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4">
      <path d="M450 62H578" marker-end="url(#rlc-arrow-err)"/>
      <path d="M686 150V108" marker-end="url(#rlc-arrow-err)"/>
    </g>

    <g font-size="11.5" fill="#40566b">
      <text x="196" y="64">first res.write()</text>
      <text x="335" y="148">more res.write()</text>
      <text x="507" y="158">res.end()</text>
      <text x="400" y="190" font-weight="700">res.json(), res.send(), res.end()</text>
      <text x="400" y="216" font-style="italic">status, headers and body sent at once</text>
      <text x="114" y="262">res.status(), res.set(),</text>
      <text x="114" y="277">res.cookie(), res.type()</text>
    </g>
    <g font-size="11.5" fill="#6b241c">
      <text x="514" y="40">change status</text>
      <text x="514" y="53">or headers</text>
      <text x="694" y="134" text-anchor="start">send again</text>
    </g>
    <text x="400" y="318" font-size="13" fill="#40566b">Once the first byte of the body is sent, the status and headers can no longer change.</text>
  </g>
</svg>
