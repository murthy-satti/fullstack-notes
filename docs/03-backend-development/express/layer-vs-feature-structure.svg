<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="lvf-title lvf-desc">
  <title id="lvf-title">Which files one change touches in layer-based and feature-based structures</title>
  <desc id="lvf-desc">In a layer-based structure the tasks files are spread across four folders, routes, controllers, services and repositories, each also holding users files, so changing the tasks feature touches four folders. In a feature-based structure all tasks files, including the schemas, live in modules/tasks, and users files live in modules/users, so the same change touches one folder.</desc>
  <rect width="780" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="38" font-size="14" font-weight="700" fill="#36424e">Layer-based: one change, four folders</text>
    <text x="580" y="38" font-size="14" font-weight="700" fill="#36424e">Feature-based: one change, one folder</text>
    <path d="M390 24V340" stroke="#c3ccd7" stroke-width="1.5"/>

    <g fill="#ffffff" stroke="#8a96a3" stroke-width="1.5">
      <rect x="40" y="56" width="320" height="64" rx="8"/>
      <rect x="40" y="128" width="320" height="64" rx="8"/>
      <rect x="40" y="200" width="320" height="64" rx="8"/>
      <rect x="40" y="272" width="320" height="64" rx="8"/>
      <rect x="420" y="56" width="320" height="136" rx="8"/>
      <rect x="420" y="220" width="320" height="116" rx="8"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="54" y="76">src/routes/</text>
      <text x="54" y="148">src/controllers/</text>
      <text x="54" y="220">src/services/</text>
      <text x="54" y="292">src/repositories/</text>
      <text x="434" y="76">src/modules/tasks/</text>
      <text x="434" y="240">src/modules/users/</text>
    </g>

    <g stroke-width="1.5">
      <rect x="54" y="86" width="146" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="208" y="86" width="140" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="54" y="158" width="146" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="208" y="158" width="140" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="54" y="230" width="146" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="208" y="230" width="140" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="54" y="302" width="146" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="208" y="302" width="140" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>

      <rect x="434" y="86" width="146" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="588" y="86" width="140" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="434" y="120" width="146" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="588" y="120" width="140" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="434" y="154" width="146" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20"/>

      <rect x="434" y="250" width="146" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="588" y="250" width="140" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="434" y="284" width="146" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="588" y="284" width="140" height="26" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
    </g>
    <g font-size="11.5">
      <text x="127" y="103" fill="#66400f">tasks.routes.js</text>
      <text x="278" y="103" fill="#36424e">users.routes.js</text>
      <text x="127" y="175" fill="#66400f">tasks.controller.js</text>
      <text x="278" y="175" fill="#36424e">users.controller.js</text>
      <text x="127" y="247" fill="#66400f">tasks.service.js</text>
      <text x="278" y="247" fill="#36424e">users.service.js</text>
      <text x="127" y="319" fill="#66400f">tasks.repository.js</text>
      <text x="278" y="319" fill="#36424e">users.repository.js</text>

      <text x="507" y="103" fill="#66400f">tasks.routes.js</text>
      <text x="658" y="103" fill="#66400f">tasks.controller.js</text>
      <text x="507" y="137" fill="#66400f">tasks.service.js</text>
      <text x="658" y="137" fill="#66400f">tasks.repository.js</text>
      <text x="507" y="171" fill="#66400f">tasks.schemas.js</text>

      <text x="507" y="267" fill="#36424e">users.routes.js</text>
      <text x="658" y="267" fill="#36424e">users.controller.js</text>
      <text x="507" y="301" fill="#36424e">users.service.js</text>
      <text x="658" y="301" fill="#36424e">users.repository.js</text>
    </g>

    <rect x="232" y="352" width="18" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="258" y="364" font-size="12" fill="#40566b" text-anchor="start">files touched when the tasks feature changes</text>
    <text x="390" y="388" font-size="13" fill="#40566b">Both keep the same layers inside; feature folders keep one feature's files together.</text>
  </g>
</svg>
