<svg xmlns="http://www.w3.org/2000/svg" width="780" height="490" viewBox="0 0 780 490" role="img" aria-labelledby="ptp-title ptp-desc">
  <title id="ptp-title">A typical production layout for an Express API</title>
  <desc id="ptp-desc">Clients connect over HTTPS to a load balancer or nginx, which terminates TLS, compresses responses, serves static files, and spreads requests over several identical, stateless Express instances, checking each one with GET /readyz. Every instance keeps its own database connection pool and shares the same database, Redis for sessions and rate-limit counters, and object storage for uploaded files. The total database connections equal the pool size times the number of instances.</desc>
  <defs>
    <marker id="ptp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="490" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="20" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="38" font-size="14" font-weight="700" fill="#263e5a">Clients</text>
    <text x="390" y="55" font-size="11.5" fill="#263e5a">browsers, mobile apps</text>

    <rect x="210" y="96" width="360" height="62" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="116" font-size="14" font-weight="700" fill="#36424e">Load balancer or nginx</text>
    <text x="390" y="134" font-size="11.5" fill="#36424e">TLS termination, compression,</text>
    <text x="390" y="149" font-size="11.5" fill="#36424e">static files, spreads requests</text>

    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="590" y="112">health check:</text>
      <text x="590" y="127">GET /readyz on each</text>
      <text x="590" y="142">instance; failing ones</text>
      <text x="590" y="157">get no traffic</text>
    </g>

    <rect x="60" y="214" width="180" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="236" font-size="14" font-weight="700" fill="#66400f">Express instance</text>
    <text x="150" y="255" font-size="11.5" fill="#66400f">stateless, own DB pool</text>
    <rect x="300" y="214" width="180" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="236" font-size="14" font-weight="700" fill="#66400f">Express instance</text>
    <text x="390" y="255" font-size="11.5" fill="#66400f">stateless, own DB pool</text>
    <rect x="540" y="214" width="180" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="630" y="236" font-size="14" font-weight="700" fill="#66400f">Express instance</text>
    <text x="630" y="255" font-size="11.5" fill="#66400f">stateless, own DB pool</text>

    <rect x="60" y="340" width="180" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="150" y="362" font-size="14" font-weight="700" fill="#463365">Database</text>
    <text x="150" y="381" font-size="11.5" fill="#463365">limited connections</text>
    <rect x="300" y="340" width="180" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="362" font-size="14" font-weight="700" fill="#463365">Redis</text>
    <text x="390" y="381" font-size="11.5" fill="#463365">sessions, rate-limit counts</text>
    <rect x="540" y="340" width="180" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="630" y="362" font-size="14" font-weight="700" fill="#463365">Object storage</text>
    <text x="630" y="381" font-size="11.5" fill="#463365">uploaded files</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 64V94" marker-end="url(#ptp-arrow)"/>
      <path d="M300 158 160 212" marker-end="url(#ptp-arrow)"/>
      <path d="M390 158V212" marker-end="url(#ptp-arrow)"/>
      <path d="M480 158 620 212" marker-end="url(#ptp-arrow)"/>
      <path d="M150 270V306H630V270"/>
      <path d="M390 270V306"/>
      <path d="M150 306V338" marker-end="url(#ptp-arrow)"/>
      <path d="M390 306V338" marker-end="url(#ptp-arrow)"/>
      <path d="M630 306V338" marker-end="url(#ptp-arrow)"/>
    </g>
    <text x="400" y="84" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">HTTPS</text>
    <text x="400" y="192" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">HTTP + X-Forwarded-*</text>
    <text x="270" y="327" font-size="11.5" font-style="italic" fill="#40566b">shared by every instance</text>

    <text x="390" y="428" font-size="12" font-weight="700" fill="#b5473a">Total DB connections = pool size x number of instances</text>
    <text x="390" y="470" font-size="13" fill="#40566b">No state lives inside an instance, so any instance can serve any request and be replaced freely.</text>
  </g>
</svg>
