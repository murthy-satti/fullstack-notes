<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="bps-title bps-desc">
  <title id="bps-title">Which parser handles a request body, and what express.json() does inside</title>
  <desc id="bps-desc">The Content-Type header picks the parser: application/json goes to express.json and gives an object; application/x-www-form-urlencoded goes to express.urlencoded and gives an object of strings; text/plain goes to express.text and gives a string; application/octet-stream goes to express.raw and gives a Buffer; multipart/form-data goes to multer on the route and gives req.body fields plus req.file or req.files. Any other type, or no body, leaves req.body undefined. Inside express.json the parser reads the stream and raises 413 entity.too.large if the body exceeds the limit, decodes the text and raises 415 for an unsupported charset, then calls JSON.parse and raises 400 entity.parse.failed for invalid JSON; otherwise req.body is set and next() is called.</desc>
  <defs>
    <marker id="bps-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="580" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="150" y="36" font-size="13" font-weight="700" fill="#40566b">Content-Type header</text>
    <text x="400" y="36" font-size="13" font-weight="700" fill="#40566b">Parser that runs</text>
    <text x="650" y="36" font-size="13" font-weight="700" fill="#40566b">req.body becomes</text>

    <g font-size="12" font-weight="700" fill="#463365">
      <rect x="24" y="48" width="252" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="150" y="70">application/json</text>
      <rect x="24" y="94" width="252" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="150" y="116">application/x-www-form-urlencoded</text>
      <rect x="24" y="140" width="252" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="150" y="162">text/plain</text>
      <rect x="24" y="186" width="252" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="150" y="208">application/octet-stream</text>
      <rect x="24" y="232" width="252" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="150" y="254">multipart/form-data</text>
      <rect x="24" y="278" width="252" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="150" y="300" fill="#36424e">any other type, or no body</text>
    </g>

    <g font-size="12.5" font-weight="700" fill="#263e5a">
      <rect x="320" y="48" width="160" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="400" y="70">express.json()</text>
      <rect x="320" y="94" width="160" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="400" y="116">express.urlencoded()</text>
      <rect x="320" y="140" width="160" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="400" y="162">express.text()</text>
      <rect x="320" y="186" width="160" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="400" y="208">express.raw()</text>
      <rect x="320" y="232" width="160" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="400" y="254" fill="#66400f">multer (on the route)</text>
      <rect x="320" y="278" width="160" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="400" y="300" fill="#36424e">none matches</text>
    </g>

    <g font-size="12" fill="#294a2e">
      <rect x="524" y="48" width="252" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="650" y="70">object, e.g. { name: "Asha" }</text>
      <rect x="524" y="94" width="252" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="650" y="116">object of strings, e.g. { age: "30" }</text>
      <rect x="524" y="140" width="252" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="650" y="162">string</text>
      <rect x="524" y="186" width="252" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="650" y="208">Buffer of the exact bytes</text>
      <rect x="524" y="232" width="252" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="650" y="254">text fields + req.file / req.files</text>
      <rect x="524" y="278" width="252" height="36" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="650" y="300" fill="#6b241c" font-weight="700">undefined (Express 5)</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M276 66H318" marker-end="url(#bps-arrow)"/>
      <path d="M276 112H318" marker-end="url(#bps-arrow)"/>
      <path d="M276 158H318" marker-end="url(#bps-arrow)"/>
      <path d="M276 204H318" marker-end="url(#bps-arrow)"/>
      <path d="M276 250H318" marker-end="url(#bps-arrow)"/>
      <path d="M276 296H318" marker-end="url(#bps-arrow)"/>
      <path d="M480 66H522" marker-end="url(#bps-arrow)"/>
      <path d="M480 112H522" marker-end="url(#bps-arrow)"/>
      <path d="M480 158H522" marker-end="url(#bps-arrow)"/>
      <path d="M480 204H522" marker-end="url(#bps-arrow)"/>
      <path d="M480 250H522" marker-end="url(#bps-arrow)"/>
      <path d="M480 296H522" marker-end="url(#bps-arrow)"/>
    </g>

    <path d="M24 346H776" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="374" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Inside express.json(): the steps and the errors they raise</text>

    <rect x="24" y="398" width="130" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="89" y="418" font-size="13" font-weight="700" fill="#263e5a">Read stream</text>
    <text x="89" y="435" font-size="11.5" fill="#263e5a">count the bytes</text>
    <path d="M240 394 305 422 240 450 175 422z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="419" font-size="11.5" font-weight="700" fill="#36424e">over limit</text>
    <text x="240" y="432" font-size="11.5" font-weight="700" fill="#36424e">(100kb)?</text>
    <rect x="345" y="398" width="130" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="410" y="418" font-size="13" font-weight="700" fill="#263e5a">Decode text</text>
    <text x="410" y="435" font-size="11.5" fill="#263e5a">inflate, charset</text>
    <path d="M560 394 625 422 560 450 495 422z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="560" y="419" font-size="11.5" font-weight="700" fill="#36424e">JSON.parse</text>
    <text x="560" y="432" font-size="11.5" font-weight="700" fill="#36424e">succeeds?</text>
    <rect x="662" y="398" width="114" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="719" y="418" font-size="13" font-weight="700" fill="#294a2e">req.body set</text>
    <text x="719" y="435" font-size="11.5" fill="#294a2e">then next()</text>

    <rect x="170" y="490" width="140" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="240" y="510" font-size="13" font-weight="700" fill="#6b241c">413</text>
    <text x="240" y="527" font-size="11.5" fill="#6b241c">entity.too.large</text>
    <rect x="340" y="490" width="140" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="410" y="510" font-size="13" font-weight="700" fill="#6b241c">415</text>
    <text x="410" y="527" font-size="11.5" fill="#6b241c">unsupported charset</text>
    <rect x="490" y="490" width="140" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="560" y="510" font-size="13" font-weight="700" fill="#6b241c">400</text>
    <text x="560" y="527" font-size="11.5" fill="#6b241c">entity.parse.failed</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M154 422H173" marker-end="url(#bps-arrow)"/>
      <path d="M305 422H343" marker-end="url(#bps-arrow)"/>
      <path d="M475 422H493" marker-end="url(#bps-arrow)"/>
      <path d="M625 422H660" marker-end="url(#bps-arrow)"/>
      <path d="M240 450V488" marker-end="url(#bps-arrow)"/>
      <path d="M410 446V488" marker-end="url(#bps-arrow)"/>
      <path d="M560 450V488" marker-end="url(#bps-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="324" y="414">no</text>
      <text x="642" y="414">yes</text>
      <text x="252" y="474" text-anchor="start">yes</text>
      <text x="418" y="474" text-anchor="start">bad charset</text>
      <text x="572" y="474" text-anchor="start">no</text>
    </g>
    <text x="400" y="564" font-size="13" fill="#40566b">A parser only runs when the Content-Type matches; its errors carry a status for your error handler.</text>
  </g>
</svg>
