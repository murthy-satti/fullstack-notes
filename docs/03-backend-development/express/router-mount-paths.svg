<svg xmlns="http://www.w3.org/2000/svg" width="780" height="456" viewBox="0 0 780 456" role="img" aria-labelledby="rmp-title rmp-desc">
  <title id="rmp-title">How mounted routers change req.baseUrl and req.path</title>
  <desc id="rmp-desc">A request for GET /api/v1/users/1/posts?sort=new reaches the app, where req.baseUrl is empty and req.path is /api/v1/users/1/posts. app.use("/api/v1", v1) strips /api/v1, so inside the v1 router req.baseUrl is /api/v1 and req.path is /users/1/posts. v1.use("/users/:userId/posts", postsRouter) strips that prefix, so inside postsRouter req.baseUrl is /api/v1/users/1/posts and req.path is /, and router.get("/") handles it. req.originalUrl keeps the full URL throughout. With mergeParams true, req.params contains userId "1"; with the default false, req.params is empty.</desc>
  <defs>
    <marker id="rmp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="456" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="732" height="44" rx="22" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="39" font-size="14" font-weight="700" fill="#36424e">GET /api/v1/users/1/posts?sort=new</text>
    <text x="390" y="56" font-size="11.5" fill="#36424e">req.originalUrl keeps this full URL at every level</text>

    <text x="177" y="88" font-size="13" font-weight="700" fill="#40566b">Code handling the request</text>
    <text x="455" y="88" font-size="13" font-weight="700" fill="#40566b">req.baseUrl</text>
    <text x="668" y="88" font-size="13" font-weight="700" fill="#40566b">req.path</text>

    <rect x="24" y="98" width="306" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="177" y="122" font-size="14" font-weight="700" fill="#263e5a">app</text>
    <text x="177" y="140" font-size="11.5" fill="#263e5a">app.use("/api/v1", v1)</text>
    <rect x="350" y="98" width="210" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="455" y="131" font-size="13" fill="#36424e">"" (empty)</text>
    <rect x="580" y="98" width="176" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="668" y="131" font-size="13" fill="#36424e">/api/v1/users/1/posts</text>

    <rect x="24" y="184" width="306" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="177" y="208" font-size="14" font-weight="700" fill="#463365">v1 router</text>
    <text x="177" y="226" font-size="11.5" fill="#463365">v1.use("/users/:userId/posts", postsRouter)</text>
    <rect x="350" y="184" width="210" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="455" y="217" font-size="13" fill="#36424e">/api/v1</text>
    <rect x="580" y="184" width="176" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="668" y="217" font-size="13" fill="#36424e">/users/1/posts</text>

    <rect x="24" y="270" width="306" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="177" y="294" font-size="14" font-weight="700" fill="#66400f">postsRouter</text>
    <text x="177" y="312" font-size="11.5" fill="#66400f">router.get("/") handler runs</text>
    <rect x="350" y="270" width="210" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="455" y="303" font-size="13" fill="#36424e">/api/v1/users/1/posts</text>
    <rect x="580" y="270" width="176" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="668" y="303" font-size="13" fill="#36424e">/</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M177 154V182" marker-end="url(#rmp-arrow)"/>
      <path d="M177 240V268" marker-end="url(#rmp-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="188" y="173">strips the mount path "/api/v1"</text>
      <text x="188" y="259">strips "/users/1/posts"</text>
    </g>

    <text x="24" y="352" font-size="12" font-weight="700" fill="#40566b" text-anchor="start">Inside postsRouter, req.params depends on mergeParams:</text>
    <rect x="24" y="362" width="358" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="203" y="382" font-size="14" font-weight="700" fill="#294a2e">Router({ mergeParams: true })</text>
    <text x="203" y="399" font-size="11.5" fill="#294a2e">req.params = { userId: "1" }</text>
    <rect x="398" y="362" width="358" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="577" y="382" font-size="14" font-weight="700" fill="#6b241c">Router() (default: false)</text>
    <text x="577" y="399" font-size="11.5" fill="#6b241c">req.params = {} and userId is undefined</text>

    <text x="390" y="440" font-size="13" fill="#40566b">Each mount strips its prefix from req.path and appends it to req.baseUrl.</text>
  </g>
</svg>
