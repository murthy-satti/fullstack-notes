<svg xmlns="http://www.w3.org/2000/svg" width="780" height="664" viewBox="0 0 780 664" role="img" aria-labelledby="sls-title sls-desc">
  <title id="sls-title">Login, an authenticated request, and logout with express-session</title>
  <desc id="sls-desc">At login the browser posts credentials, Express verifies them and regenerates the session, saves the user ID in the session store, and replies with a signed sid cookie that is HttpOnly, Secure and SameSite Lax. On a later request the browser sends the cookie, Express verifies its signature, loads the session from the store and uses req.session.userId. At logout Express destroys the session in the store and clears the cookie.</desc>
  <defs>
    <marker id="sls-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sls-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="664" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="95" y="20" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="170" y="40" font-size="14" font-weight="700" fill="#263e5a">Browser</text>
    <text x="170" y="57" font-size="11.5" fill="#263e5a">stores the cookie</text>
    <rect x="375" y="20" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="450" y="40" font-size="14" font-weight="700" fill="#66400f">Express</text>
    <text x="450" y="57" font-size="11.5" fill="#66400f">express-session</text>
    <rect x="615" y="20" width="150" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="690" y="40" font-size="14" font-weight="700" fill="#463365">Session store</text>
    <text x="690" y="57" font-size="11.5" fill="#463365">Redis or MongoDB</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M170 68V616"/>
      <path d="M450 68V616"/>
      <path d="M690 68V616"/>
    </g>
    <g stroke="#c3ccd7" stroke-width="1.5">
      <path d="M20 84H760M20 300H760M20 508H760"/>
    </g>
    <g font-size="12" font-weight="700" fill="#8062a8" text-anchor="start">
      <text x="24" y="102">Login</text>
      <text x="24" y="318">Later request</text>
      <text x="24" y="526">Logout</text>
    </g>

    <rect x="365" y="140" width="170" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="450" y="155" font-size="11.5" font-weight="700" fill="#66400f">verifyCredentials() ok</text>
    <text x="450" y="169" font-size="11.5" fill="#66400f">req.session.regenerate()</text>
    <rect x="365" y="358" width="170" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="450" y="373" font-size="11.5" font-weight="700" fill="#36424e">verify the signature,</text>
    <text x="450" y="387" font-size="11.5" fill="#36424e">then look up the ID</text>

    <g text-anchor="start" fill="#36424e">
      <text x="182" y="104" font-size="12" font-weight="700">1. POST /login</text>
      <text x="182" y="118" font-size="11">{ email, password }</text>
      <text x="462" y="196" font-size="12" font-weight="700">3. save sess:&lt;newId&gt;</text>
      <text x="462" y="210" font-size="11">{ userId: "42", role: "admin" }</text>
      <text x="182" y="244" font-size="12" font-weight="700">4. 200 OK</text>
      <text x="182" y="258" font-size="11">Set-Cookie: sid=s:&lt;id&gt;.&lt;signature&gt;</text>
      <text x="182" y="272" font-size="11">HttpOnly; Secure; SameSite=Lax</text>
      <text x="182" y="322" font-size="12" font-weight="700">5. GET /account</text>
      <text x="182" y="336" font-size="11">Cookie: sid=s:&lt;id&gt;.&lt;signature&gt;</text>
      <text x="462" y="414" font-size="12" font-weight="700">7. get sess:&lt;id&gt;</text>
      <text x="462" y="446" font-size="12" font-weight="700">8. { userId: "42", role }</text>
      <text x="182" y="480" font-size="12" font-weight="700">9. 200 OK, req.session.userId</text>
      <text x="182" y="530" font-size="12" font-weight="700">10. POST /logout</text>
      <text x="462" y="562" font-size="12" font-weight="700">11. destroy sess:&lt;id&gt;</text>
      <text x="182" y="594" font-size="12" font-weight="700">12. 204, clearCookie("sid")</text>
    </g>
    <text x="352" y="150" font-size="12" font-weight="700" fill="#36424e" text-anchor="end">2.</text>
    <text x="352" y="368" font-size="12" font-weight="700" fill="#36424e" text-anchor="end">6.</text>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M170 128H448" stroke="#40566b" marker-end="url(#sls-arrow)"/>
      <path d="M450 220H688" stroke="#40566b" marker-end="url(#sls-arrow)"/>
      <path d="M450 282H172" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#sls-ret)"/>
      <path d="M170 346H448" stroke="#40566b" marker-end="url(#sls-arrow)"/>
      <path d="M450 424H688" stroke="#40566b" marker-end="url(#sls-arrow)"/>
      <path d="M690 456H452" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#sls-ret)"/>
      <path d="M450 490H172" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#sls-ret)"/>
      <path d="M170 540H448" stroke="#40566b" marker-end="url(#sls-arrow)"/>
      <path d="M450 572H688" stroke="#40566b" marker-end="url(#sls-arrow)"/>
      <path d="M450 604H172" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#sls-ret)"/>
    </g>
    <text x="390" y="646" font-size="13" fill="#40566b">The cookie carries only a signed session ID; the user data stays in the session store.</text>
  </g>
</svg>
