<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="rsc-title rsc-desc">
  <title id="rsc-title">Choosing the status code for res.redirect()</title>
  <desc id="rsc-desc">If the move is permanent and the method and body must be kept, use 308 Permanent Redirect; if permanent but the method may change, use 301 Moved Permanently, where browsers may turn POST into GET. If the move is temporary and the method and body must be kept, use 307 Temporary Redirect. If temporary and the redirect follows a form POST to show a result page, use 303 See Other, whose follow-up is always GET; otherwise 302 Found, the Express default. Never redirect to a URL taken from user input without an allowlist, because that is an open redirect.</desc>
  <defs>
    <marker id="rsc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="20" width="180" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="45" font-size="14" font-weight="700" fill="#36424e">Need a redirect</text>

    <path d="M120 80 210 110 120 140 30 110z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="107" font-size="12" font-weight="700" fill="#36424e">permanent</text>
    <text x="120" y="121" font-size="12" font-weight="700" fill="#36424e">move?</text>

    <path d="M400 80 490 110 400 140 310 110z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="400" y="107" font-size="12" font-weight="700" fill="#36424e">keep method</text>
    <text x="400" y="121" font-size="12" font-weight="700" fill="#36424e">and body?</text>

    <path d="M120 268 210 298 120 328 30 298z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="295" font-size="12" font-weight="700" fill="#36424e">keep method</text>
    <text x="120" y="309" font-size="12" font-weight="700" fill="#36424e">and body?</text>

    <path d="M120 375 222 410 120 445 18 410z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="120" y="407" font-size="12" font-weight="700" fill="#36424e">after a form POST,</text>
    <text x="120" y="421" font-size="12" font-weight="700" fill="#36424e">show a result?</text>

    <rect x="590" y="78" width="190" height="64" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="685" y="98" font-size="14" font-weight="700" fill="#294a2e">308 Permanent Redirect</text>
    <text x="685" y="115" font-size="11.5" fill="#294a2e">same method and body</text>
    <text x="685" y="132" font-size="11.5" font-style="italic" fill="#294a2e">res.redirect(308, url)</text>

    <rect x="305" y="178" width="190" height="64" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="400" y="198" font-size="14" font-weight="700" fill="#294a2e">301 Moved Permanently</text>
    <text x="400" y="215" font-size="11.5" fill="#294a2e">POST may become GET</text>
    <text x="400" y="232" font-size="11.5" font-style="italic" fill="#294a2e">res.redirect(301, url)</text>

    <rect x="305" y="266" width="190" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="400" y="286" font-size="14" font-weight="700" fill="#263e5a">307 Temporary Redirect</text>
    <text x="400" y="303" font-size="11.5" fill="#263e5a">same method and body</text>
    <text x="400" y="320" font-size="11.5" font-style="italic" fill="#263e5a">res.redirect(307, url)</text>

    <rect x="305" y="378" width="190" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="400" y="398" font-size="14" font-weight="700" fill="#263e5a">303 See Other</text>
    <text x="400" y="415" font-size="11.5" fill="#263e5a">follow-up is always GET</text>
    <text x="400" y="432" font-size="11.5" font-style="italic" fill="#263e5a">res.redirect(303, url)</text>

    <rect x="25" y="488" width="190" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="120" y="508" font-size="14" font-weight="700" fill="#263e5a">302 Found</text>
    <text x="120" y="525" font-size="11.5" fill="#263e5a">Express default</text>
    <text x="120" y="542" font-size="11.5" font-style="italic" fill="#263e5a">res.redirect(url)</text>

    <rect x="250" y="488" width="530" height="64" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="515" y="512" font-size="14" font-weight="700" fill="#6b241c">Open redirect: never redirect to raw user input</text>
    <text x="515" y="532" font-size="11.5" fill="#6b241c">?next=https://evil.example must be checked against an allowlist first</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 60V78" marker-end="url(#rsc-arrow)"/>
      <path d="M210 110H308" marker-end="url(#rsc-arrow)"/>
      <path d="M490 110H588" marker-end="url(#rsc-arrow)"/>
      <path d="M400 140V176" marker-end="url(#rsc-arrow)"/>
      <path d="M120 140V266" marker-end="url(#rsc-arrow)"/>
      <path d="M210 298H303" marker-end="url(#rsc-arrow)"/>
      <path d="M120 328V373" marker-end="url(#rsc-arrow)"/>
      <path d="M222 410H303" marker-end="url(#rsc-arrow)"/>
      <path d="M120 445V486" marker-end="url(#rsc-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="255" y="102">yes</text>
      <text x="535" y="102">yes</text>
      <text x="255" y="290">yes</text>
      <text x="262" y="402">yes</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="408" y="164">no</text>
      <text x="128" y="206">no (temporary)</text>
      <text x="128" y="358">no</text>
      <text x="128" y="470">no</text>
    </g>
    <text x="400" y="580" font-size="13" fill="#40566b">Decide permanent or temporary first, then whether the follow-up request must keep its method.</text>
  </g>
</svg>
