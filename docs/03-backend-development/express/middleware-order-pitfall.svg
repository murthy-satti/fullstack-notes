<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" role="img" aria-labelledby="mop-title mop-desc">
  <title id="mop-title">A body parser registered after a route never runs for that route</title>
  <desc id="mop-desc">Wrong order: app.post("/notes", handler) is registered before app.use(express.json()). A POST /notes request reaches the handler first, req.body is undefined, and the handler responds 400 or throws; express.json is never reached for this request. Right order: app.use(express.json()) is registered first, parses the body and calls next(), so the handler sees req.body and responds 201 Created.</desc>
  <defs>
    <marker id="mop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="34" font-size="13" font-weight="700" fill="#6b241c">Wrong: parser registered after the route</text>
    <text x="580" y="34" font-size="13" font-weight="700" fill="#294a2e">Right: parser registered before routes</text>
    <path d="M390 24V300" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="100" y="50" width="200" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="73" font-size="13" font-weight="700" fill="#36424e">POST /notes</text>
    <rect x="40" y="108" width="320" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="128" font-size="13" font-weight="700" fill="#66400f">1. app.post("/notes", handler)</text>
    <text x="200" y="145" font-size="11.5" fill="#66400f">registered first, so it runs first</text>
    <rect x="40" y="178" width="320" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="200" y="198" font-size="13" font-weight="700" fill="#6b241c">req.body is undefined</text>
    <text x="200" y="215" font-size="11.5" fill="#6b241c">handler responds 400, or throws</text>
    <rect x="40" y="248" width="320" height="48" rx="8" fill="#f5f7fb" stroke="#8a96a3" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="200" y="268" font-size="13" font-weight="700" fill="#8a96a3">2. app.use(express.json())</text>
    <text x="200" y="285" font-size="11.5" fill="#8a96a3">never reached: response already sent</text>

    <rect x="480" y="50" width="200" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="73" font-size="13" font-weight="700" fill="#36424e">POST /notes</text>
    <rect x="420" y="108" width="320" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="580" y="128" font-size="13" font-weight="700" fill="#263e5a">1. app.use(express.json())</text>
    <text x="580" y="145" font-size="11.5" fill="#263e5a">parses the body, calls next()</text>
    <rect x="420" y="178" width="320" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="580" y="198" font-size="13" font-weight="700" fill="#66400f">2. app.post("/notes", handler)</text>
    <text x="580" y="215" font-size="11.5" fill="#66400f">req.body = { text: "..." }</text>
    <rect x="420" y="248" width="320" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="268" font-size="13" font-weight="700" fill="#294a2e">201 Created</text>
    <text x="580" y="285" font-size="11.5" fill="#294a2e">res.status(201).json(note)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 86V106" marker-end="url(#mop-arrow)"/>
      <path d="M200 156V176" marker-end="url(#mop-arrow)"/>
      <path d="M580 86V106" marker-end="url(#mop-arrow)"/>
      <path d="M580 156V176" marker-end="url(#mop-arrow)"/>
      <path d="M580 226V246" marker-end="url(#mop-arrow)"/>
    </g>
    <text x="390" y="324" font-size="13" fill="#40566b">Express runs entries in registration order, so parsers and other shared middleware go first.</text>
  </g>
</svg>
