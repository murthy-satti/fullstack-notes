<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" role="img" aria-labelledby="arl-title arl-desc">
  <title id="arl-title">Registering stores a password hash; logging in compares against it</title>
  <desc id="arl-desc">Registration posts an email and password, validates them (400 if invalid, 409 if the email is taken), hashes the password with argon2.hash using a random salt, and saves only the hash before returning 201 Created. Login posts an email and password, looks up the user (using a dummy hash when there is none), and checks the password with argon2.verify. A match creates a session or issues tokens; a mismatch returns 401 with the same message whether the email or the password was wrong.</desc>
  <defs>
    <marker id="arl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="38" font-size="13" font-weight="700" fill="#8062a8" text-anchor="start">Register</text>

    <rect x="24" y="50" width="163" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="105" y="72" font-size="14" font-weight="700" fill="#263e5a">POST /auth/register</text>
    <text x="105" y="90" font-size="11.5" fill="#263e5a">email + password</text>
    <rect x="213" y="50" width="163" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="294" y="72" font-size="14" font-weight="700" fill="#36424e">Validate input</text>
    <text x="294" y="90" font-size="11.5" fill="#36424e">length, email unique</text>
    <rect x="402" y="50" width="163" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="483" y="72" font-size="14" font-weight="700" fill="#66400f">argon2.hash()</text>
    <text x="483" y="90" font-size="11.5" fill="#66400f">random salt inside hash</text>
    <rect x="591" y="50" width="165" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="673" y="72" font-size="14" font-weight="700" fill="#294a2e">Save, 201 Created</text>
    <text x="673" y="90" font-size="11.5" fill="#294a2e">passwordHash only</text>
    <text x="294" y="122" font-size="11.5" font-style="italic" fill="#b5473a">400 invalid, 409 email taken</text>

    <path d="M20 146H760" stroke="#c3ccd7" stroke-width="1.5"/>
    <text x="24" y="172" font-size="13" font-weight="700" fill="#8062a8" text-anchor="start">Log in</text>

    <rect x="24" y="184" width="163" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="105" y="206" font-size="14" font-weight="700" fill="#263e5a">POST /auth/login</text>
    <text x="105" y="224" font-size="11.5" fill="#263e5a">email + password</text>
    <rect x="213" y="184" width="163" height="52" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="294" y="206" font-size="14" font-weight="700" fill="#36424e">Find user</text>
    <text x="294" y="224" font-size="11.5" fill="#36424e">dummy hash if none</text>
    <path d="M483 180 563 210 483 240 403 210z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="483" y="207" font-size="12" font-weight="700" fill="#36424e">argon2.verify()</text>
    <text x="483" y="221" font-size="12" font-weight="700" fill="#36424e">matches?</text>
    <rect x="591" y="184" width="165" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="673" y="206" font-size="14" font-weight="700" fill="#294a2e">Logged in</text>
    <text x="673" y="224" font-size="11.5" fill="#294a2e">session or JWT issued</text>
    <rect x="393" y="266" width="180" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="483" y="286" font-size="14" font-weight="700" fill="#6b241c">401 Unauthorized</text>
    <text x="483" y="303" font-size="11.5" fill="#6b241c">same message either way</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M187 76H211" marker-end="url(#arl-arrow)"/>
      <path d="M376 76H400" marker-end="url(#arl-arrow)"/>
      <path d="M565 76H589" marker-end="url(#arl-arrow)"/>
      <path d="M187 210H211" marker-end="url(#arl-arrow)"/>
      <path d="M376 210H401" marker-end="url(#arl-arrow)"/>
      <path d="M563 210H589" marker-end="url(#arl-arrow)"/>
      <path d="M483 240V264" marker-end="url(#arl-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="576" y="202">yes</text>
      <text x="498" y="257">no</text>
    </g>
    <text x="230" y="300" font-size="13" fill="#40566b">The plain password is never stored;</text>
    <text x="230" y="318" font-size="13" fill="#40566b">only its salted hash is compared.</text>
  </g>
</svg>
