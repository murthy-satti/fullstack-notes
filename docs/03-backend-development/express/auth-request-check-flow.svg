<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" role="img" aria-labelledby="arc-title arc-desc">
  <title id="arc-title">How a protected route decides between 401, 403, 404 and 200</title>
  <desc id="arc-desc">For a request to a protected route, authentication runs first: a missing cookie or Bearer token returns 401 Login required, and a token that fails jwt.verify because of its signature, expiry or issuer returns 401 with WWW-Authenticate Bearer. A valid token sets req.user. Authorization follows: requireRole returns 403 Forbidden if the role is not allowed, and an ownership check returns 404 Not Found when the order belongs to another user, so its existence is not revealed. Only then does the route handler return 200.</desc>
  <defs>
    <marker id="arc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="160" y="24" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="49" font-size="14" font-weight="700" fill="#36424e">GET /orders/:id</text>

    <path d="M280 86 380 116 280 146 180 116z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="113" font-size="12" font-weight="700" fill="#36424e">cookie or Bearer</text>
    <text x="280" y="127" font-size="12" font-weight="700" fill="#36424e">token present?</text>
    <path d="M280 176 380 206 280 236 180 206z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="203" font-size="12" font-weight="700" fill="#36424e">jwt.verify() ok?</text>
    <text x="280" y="217" font-size="11" fill="#36424e">signature, exp, iss</text>
    <rect x="160" y="264" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="280" y="284" font-size="14" font-weight="700" fill="#263e5a">req.user = { id, role }</text>
    <text x="280" y="301" font-size="11.5" fill="#263e5a">who is calling is now known</text>
    <path d="M280 330 380 360 280 390 180 360z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="357" font-size="12" font-weight="700" fill="#36424e">requireRole:</text>
    <text x="280" y="371" font-size="12" font-weight="700" fill="#36424e">role allowed?</text>
    <path d="M280 410 380 440 280 470 180 440z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="280" y="437" font-size="12" font-weight="700" fill="#36424e">order.userId ===</text>
    <text x="280" y="451" font-size="12" font-weight="700" fill="#36424e">req.user.id?</text>
    <rect x="160" y="496" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="280" y="516" font-size="14" font-weight="700" fill="#294a2e">Route handler: 200</text>
    <text x="280" y="533" font-size="11.5" fill="#294a2e">res.json(order)</text>

    <rect x="460" y="92" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="600" y="112" font-size="14" font-weight="700" fill="#6b241c">401 Unauthorized</text>
    <text x="600" y="129" font-size="11.5" fill="#6b241c">"Missing bearer token"</text>
    <rect x="460" y="182" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="600" y="202" font-size="14" font-weight="700" fill="#6b241c">401 Token expired / invalid</text>
    <text x="600" y="219" font-size="11.5" fill="#6b241c">+ WWW-Authenticate: Bearer</text>
    <rect x="460" y="336" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="600" y="356" font-size="14" font-weight="700" fill="#6b241c">403 Forbidden</text>
    <text x="600" y="373" font-size="11.5" fill="#6b241c">valid user, role not allowed</text>
    <rect x="460" y="416" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="600" y="436" font-size="14" font-weight="700" fill="#6b241c">404 Not Found</text>
    <text x="600" y="453" font-size="11.5" fill="#6b241c">hides that the order exists</text>

    <g fill="none" stroke="#8062a8" stroke-width="1.5">
      <path d="M140 86H128V236H140"/>
      <path d="M140 330H128V470H140"/>
    </g>
    <g font-size="12" font-weight="700" fill="#8062a8" text-anchor="end">
      <text x="120" y="165">Authentication</text>
      <text x="120" y="404">Authorization</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M280 64V84" marker-end="url(#arc-arrow)"/>
      <path d="M280 146V174" marker-end="url(#arc-arrow)"/>
      <path d="M280 236V262" marker-end="url(#arc-arrow)"/>
      <path d="M280 312V328" marker-end="url(#arc-arrow)"/>
      <path d="M280 390V408" marker-end="url(#arc-arrow)"/>
      <path d="M280 470V494" marker-end="url(#arc-arrow)"/>
      <path d="M380 116H458" marker-end="url(#arc-arrow)"/>
      <path d="M380 206H458" marker-end="url(#arc-arrow)"/>
      <path d="M380 360H458" marker-end="url(#arc-arrow)"/>
      <path d="M380 440H458" marker-end="url(#arc-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="419" y="109">no</text>
      <text x="419" y="199">no</text>
      <text x="419" y="353">no</text>
      <text x="419" y="433">no</text>
      <text x="296" y="164">yes</text>
      <text x="296" y="254">yes</text>
      <text x="296" y="402">yes</text>
      <text x="296" y="486">yes</text>
    </g>
    <text x="390" y="578" font-size="13" fill="#40566b">401 means "who are you?", 403 means "not allowed"; checking ownership stops one user reading another's data.</text>
  </g>
</svg>
