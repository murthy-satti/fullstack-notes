<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Training and test data split</title>
  <desc id="desc">A dataset is separated before fitting; training examples update the model while held-out test examples are reserved for final evaluation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="560" y="34" font-size="19" font-weight="bold">Keep held-out examples out of training</text>
    <rect x="60" y="88" width="250" height="110" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
    <text x="185" y="128" font-size="16" font-weight="bold">Labeled examples</text>
    <text x="185" y="158" font-size="13">Images + correct digits</text>
    <path d="M314 143 H354" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="362" y="65" width="320" height="74" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
    <text x="522" y="96" font-size="16" font-weight="bold">Training split</text>
    <text x="522" y="121" font-size="13">Fit preprocessing + model</text>
    <rect x="362" y="155" width="320" height="74" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="522" y="186" font-size="16" font-weight="bold">Held-out test split</text>
    <text x="522" y="211" font-size="13">Evaluate after fitting</text>
    <path d="M686 102 H732 V143 H772" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M686 192 H732 V153" fill="none" stroke="#526477" stroke-width="3"/>
    <rect x="780" y="88" width="280" height="110" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
    <text x="920" y="128" font-size="16" font-weight="bold">Compare predictions</text>
    <text x="920" y="158" font-size="13">Metrics + error review</text>
  </g>
</svg>
