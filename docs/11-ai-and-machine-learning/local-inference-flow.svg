<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">Local model inference flow</title>
  <desc id="desc">A local application sends a request to a model runtime, which loads permitted model weights from disk, uses available compute hardware, and returns an inference result.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="30" y="85" width="175" height="80" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="117" y="119" font-size="18">Local app</text><text x="117" y="144" font-size="13">request + UI</text>
    <rect x="270" y="85" width="190" height="80" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="365" y="119" font-size="17">Model runtime</text><text x="365" y="144" font-size="13">loads + serves</text>
    <rect x="525" y="35" width="165" height="70" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="607" y="65" font-size="17">Model weights</text><text x="607" y="87" font-size="13">disk + license</text>
    <rect x="525" y="145" width="165" height="70" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="607" y="175" font-size="17">CPU / GPU</text><text x="607" y="197" font-size="13">memory + speed</text>
    <rect x="755" y="85" width="135" height="80" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="822" y="119" font-size="17">Result</text><text x="822" y="144" font-size="13">local response</text>
    <path d="M205 125H265 M460 107L520 82 M460 143L520 177 M690 82L750 112 M690 177L750 138" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
