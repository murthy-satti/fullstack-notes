<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">AI evaluation and improvement loop</title>
  <desc id="desc">A versioned system runs on a representative test set, results are measured against task criteria and reviewed, failures are analyzed, and changes are tested before a new release is monitored.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="35" y="85" width="160" height="82" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="115" y="119" font-size="17">Versioned system</text><text x="115" y="145" font-size="13">model + prompt</text>
    <rect x="260" y="85" width="160" height="82" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="340" y="119" font-size="17">Test examples</text><text x="340" y="145" font-size="13">representative set</text>
    <rect x="485" y="85" width="160" height="82" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="565" y="119" font-size="17">Measure + review</text><text x="565" y="145" font-size="13">task criteria</text>
    <rect x="710" y="85" width="175" height="82" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="797" y="119" font-size="17">Analyze failures</text><text x="797" y="145" font-size="13">fix + regression test</text>
    <path d="M195 126H255 M420 126H480 M645 126H705" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M797 172V215H115V172" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="455" y="240" font-size="13" fill="#465565">Release only after checks; monitor production outcomes and re-evaluate changes.</text>
  </g>
</svg>
