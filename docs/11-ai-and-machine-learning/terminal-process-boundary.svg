<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 260" role="img" aria-labelledby="title desc">
  <title id="title">Terminal command process boundary</title>
  <desc id="desc">A shell parses a command and starts a process that inherits an identity, working directory, environment, filesystem access, and possible child processes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="35" y="76" width="180" height="90" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="125" y="112" font-size="18">Terminal</text><text x="125" y="140" font-size="13">input + output UI</text>
    <rect x="280" y="76" width="180" height="90" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="370" y="112" font-size="18">Shell</text><text x="370" y="140" font-size="13">parses + starts program</text>
    <rect x="525" y="58" width="205" height="126" rx="14" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="627" y="98" font-size="18">Process</text><text x="627" y="126" font-size="13">user identity + cwd</text><text x="627" y="149" font-size="13">environment + handles</text><text x="627" y="170" font-size="13">OS access checks</text>
    <rect x="795" y="76" width="190" height="90" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="890" y="112" font-size="18">Resources</text><text x="890" y="140" font-size="13">files / network / children</text>
    <path d="M215 121H275 M460 121H520 M730 121H790" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="510" y="225" font-size="14" fill="#465565">A sandbox changes the process permissions; it does not change model weights.</text>
  </g>
</svg>
