<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" role="img" aria-labelledby="title desc">
  <title id="title">Machine-learning math training loop</title>
  <desc id="desc">Inputs and parameters produce predictions; a loss compares predictions with targets, gradients are computed, and an optimizer updates parameters.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="22" y="74" width="145" height="76" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="94" y="106" font-size="17">Input batch</text><text x="94" y="130" font-size="13">features + targets</text>
    <rect x="205" y="74" width="150" height="76" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="280" y="106" font-size="17">Model</text><text x="280" y="130" font-size="13">parameters θ</text>
    <rect x="393" y="74" width="150" height="76" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="468" y="106" font-size="17">Prediction</text><text x="468" y="130" font-size="13">forward pass</text>
    <rect x="581" y="74" width="150" height="76" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="656" y="106" font-size="17">Loss + gradient</text><text x="656" y="130" font-size="13">measure error</text>
    <rect x="769" y="74" width="185" height="76" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="861" y="106" font-size="17">Optimizer update</text><text x="861" y="130" font-size="13">θ ← θ − η∇L</text>
    <path d="M167 112H200 M355 112H388 M543 112H576 M731 112H764" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M861 156V194H280V156" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="570" y="218" font-size="13" fill="#465565">Repeat on batches; evaluate separately on held-out examples.</text>
  </g>
</svg>
