<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">AI application trust boundaries</title>
  <desc id="desc">User input and retrieved documents are untrusted data. A trusted backend authenticates the user, checks permissions, filters retrieval, validates proposed tools, and only then exposes approved results to the model or executes actions.</desc>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="22" y="52" width="205" height="175" rx="16" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="124" y="82" font-size="18" font-weight="bold">Untrusted inputs</text><text x="124" y="117" font-size="14">user prompt</text><text x="124" y="145" font-size="14">uploaded / retrieved text</text><text x="124" y="173" font-size="14">model tool proposal</text><text x="124" y="204" font-size="12">never grant access by itself</text>
    <rect x="282" y="35" width="390" height="210" rx="18" fill="#e9f7ef" stroke="#47845c" stroke-width="3"/>
    <text x="477" y="67" font-size="19" font-weight="bold">Trusted application backend</text>
    <rect x="320" y="91" width="145" height="50" rx="9" fill="#ffffff" stroke="#47845c"/><text x="392" y="121" font-size="14">Authenticate</text>
    <rect x="490" y="91" width="145" height="50" rx="9" fill="#ffffff" stroke="#47845c"/><text x="562" y="121" font-size="14">Authorize data</text>
    <rect x="320" y="164" width="145" height="50" rx="9" fill="#ffffff" stroke="#47845c"/><text x="392" y="194" font-size="14">Validate output</text>
    <rect x="490" y="164" width="145" height="50" rx="9" fill="#ffffff" stroke="#47845c"/><text x="562" y="194" font-size="14">Approve tools</text>
    <rect x="742" y="84" width="195" height="112" rx="14" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
    <text x="839" y="124" font-size="19">Model</text><text x="839" y="153" font-size="13">generates or proposes</text><text x="839" y="175" font-size="12">not a policy authority</text>
    <path d="M227 137H277 M672 137H737" fill="none" stroke="#526477" stroke-width="3"/>
    <path d="M277 128L287 137L277 146 M732 128L742 137L732 146" fill="none" stroke="#526477" stroke-width="3"/>
    <text x="477" y="267" font-size="13" fill="#465565">Authorization and side-effect controls belong in trusted code, not only in prompts.</text>
  </g>
</svg>
