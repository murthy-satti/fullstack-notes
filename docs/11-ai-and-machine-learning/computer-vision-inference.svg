<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Pretrained image classification example</title>
  <desc id="desc">Model-specific transforms convert an image into a tensor, a model returns scores, and the application maps the winning class index to its label.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="560" y="34" font-size="19" font-weight="bold">Pretrained image classification</text>
    <rect x="38" y="78" width="210" height="112" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
    <text x="143" y="118" font-size="16" font-weight="bold">Decoded image</text>
    <text x="143" y="148" font-size="13">RGB pixels</text>
    <path d="M252 134 H282" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="290" y="78" width="230" height="112" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
    <text x="405" y="118" font-size="16" font-weight="bold">Weights transform</text>
    <text x="405" y="148" font-size="13">Resize + tensor + normalize</text>
    <path d="M524 134 H554" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="562" y="78" width="210" height="112" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="667" y="118" font-size="16" font-weight="bold">Model inference</text>
    <text x="667" y="148" font-size="13">Scores per class</text>
    <path d="M776 134 H806" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="814" y="78" width="268" height="112" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
    <text x="948" y="118" font-size="16" font-weight="bold">Map index to label</text>
    <text x="948" y="148" font-size="13">Prediction, not certainty</text>
  </g>
</svg>
