<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 255" role="img" aria-labelledby="title desc">
  <title id="title">Video understanding workflow</title>
  <desc id="desc">A video container is inspected, selected frames and audio are decoded with timestamps, modality-specific analysis is performed, and evidence-linked results are returned.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="25" y="75" width="155" height="84" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="102" y="108" font-size="17">Container</text><text x="102" y="133" font-size="13">video + audio streams</text>
    <rect x="220" y="75" width="175" height="84" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="307" y="108" font-size="17">Decode + sample</text><text x="307" y="133" font-size="13">frames with timestamps</text>
    <rect x="435" y="34" width="165" height="62" rx="10" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="517" y="72" font-size="16">Visual frames</text>
    <rect x="435" y="137" width="165" height="62" rx="10" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="517" y="175" font-size="16">Audio segments</text>
    <rect x="645" y="75" width="165" height="84" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="727" y="108" font-size="17">Analyze</text><text x="727" y="133" font-size="13">vision / speech model</text>
    <rect x="855" y="75" width="145" height="84" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="927" y="108" font-size="17">Answer</text><text x="927" y="133" font-size="13">evidence + time links</text>
    <path d="M180 117H215 M395 108L430 68 M395 132L430 168 M600 68L640 100 M600 168L640 134 M810 117H850" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="510" y="231" font-size="13" fill="#465565">Sparse frame sampling can miss brief events; preserve timestamps and limits.</text>
  </g>
</svg>
