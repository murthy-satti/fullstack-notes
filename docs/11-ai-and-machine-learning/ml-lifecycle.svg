<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">Machine-learning lifecycle</title>
  <desc id="desc">A machine-learning workflow defines a task, prepares representative data, trains a model, evaluates it on held-out examples, deploys it, and monitors outcomes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <g fill="#e8f1ff" stroke="#4776b8" stroke-width="2"><rect x="20" y="76" width="130" height="76" rx="12"/><rect x="180" y="76" width="130" height="76" rx="12"/><rect x="340" y="76" width="130" height="76" rx="12"/><rect x="500" y="76" width="130" height="76" rx="12"/><rect x="660" y="76" width="130" height="76" rx="12"/><rect x="820" y="76" width="120" height="76" rx="12"/></g>
    <text x="85" y="108" font-size="17">Define task</text><text x="85" y="132" font-size="13">success + limits</text>
    <text x="245" y="108" font-size="17">Prepare data</text><text x="245" y="132" font-size="13">quality + rights</text>
    <text x="405" y="108" font-size="17">Train</text><text x="405" y="132" font-size="13">fit parameters</text>
    <text x="565" y="108" font-size="17">Evaluate</text><text x="565" y="132" font-size="13">held-out examples</text>
    <text x="725" y="108" font-size="17">Deploy</text><text x="725" y="132" font-size="13">bounded use</text>
    <text x="880" y="108" font-size="17">Monitor</text><text x="880" y="132" font-size="13">quality + drift</text>
    <path d="M150 114H175 M310 114H335 M470 114H495 M630 114H655 M790 114H815" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
