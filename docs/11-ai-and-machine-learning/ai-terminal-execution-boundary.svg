<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 260" role="img" aria-labelledby="title desc">
  <title id="title">AI terminal execution boundary</title>
  <desc id="desc">A model proposes an operation; the host checks policy and approval, runs an isolated process with bounded permissions, filters output, and returns it to the model.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="20" y="80" width="145" height="84" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/><text x="92" y="113" font-size="17">Model</text><text x="92" y="138" font-size="13">proposes action</text>
    <rect x="205" y="80" width="170" height="84" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/><text x="290" y="113" font-size="17">Host policy</text><text x="290" y="138" font-size="13">scope + approval</text>
    <rect x="415" y="64" width="190" height="116" rx="14" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/><text x="510" y="105" font-size="17">Sandboxed process</text><text x="510" y="132" font-size="13">identity + permissions</text><text x="510" y="154" font-size="13">time + output bounds</text>
    <rect x="645" y="80" width="155" height="84" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/><text x="722" y="113" font-size="17">Filter result</text><text x="722" y="138" font-size="13">stdout + status</text>
    <rect x="845" y="80" width="155" height="84" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/><text x="922" y="113" font-size="17">Model observes</text><text x="922" y="138" font-size="13">not authority</text>
    <path d="M165 122H200 M375 122H410 M605 122H640 M800 122H840" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="510" y="220" font-size="14" fill="#465565">Execution uses the process identity; a model request is not permission.</text>
  </g>
</svg>
