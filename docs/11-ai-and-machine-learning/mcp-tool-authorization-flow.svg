<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">MCP tool authorization boundary</title>
  <desc id="desc">A host checks a proposed tool call and user authorization before invocation, then treats the result as untrusted context.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="560.0" y="34" font-size="19" font-weight="bold">MCP tool authorization boundary</text>
    <rect x="24.0" y="78" width="187.2" height="112" rx="12" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
    <text x="117.6" y="118" font-size="16" font-weight="bold">Model proposal</text>
    <text x="117.6" y="146" font-size="13">Tool + arguments</text>
    <path d="M215.2 134.0 H240.2" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="245.2" y="78" width="187.2" height="112" rx="12" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
    <text x="338.8" y="118" font-size="16" font-weight="bold">Validate schema</text>
    <text x="338.8" y="146" font-size="13">Known capability</text>
    <path d="M436.4 134.0 H461.4" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="466.4" y="78" width="187.2" height="112" rx="12" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="560.0" y="118" font-size="16" font-weight="bold">Authorize user</text>
    <text x="560.0" y="146" font-size="13">Consent if needed</text>
    <path d="M657.6 134.0 H682.6" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="687.6" y="78" width="187.2" height="112" rx="12" fill="#f3eaff" stroke="#8056aa" stroke-width="2"/>
    <text x="781.2" y="118" font-size="16" font-weight="bold">Invoke server</text>
    <text x="781.2" y="146" font-size="13">Least privilege</text>
    <path d="M878.8 134.0 H903.8" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="908.8" y="78" width="187.2" height="112" rx="12" fill="#fff0e8" stroke="#b7683e" stroke-width="2"/>
    <text x="1002.4" y="118" font-size="16" font-weight="bold">Inspect result</text>
    <text x="1002.4" y="146" font-size="13">Untrusted data</text>
  </g>
</svg>
