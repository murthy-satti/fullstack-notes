<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Fine-tuning workflow</title>
  <desc id="desc">A team defines a behavior gap, curates permitted training examples and a held-out test set, fine-tunes a pretrained model, evaluates quality and regressions, and deploys a versioned model if it meets criteria.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <g stroke-width="2"><rect x="20" y="82" width="145" height="82" rx="12" fill="#e8f1ff" stroke="#4776b8"/><rect x="205" y="82" width="155" height="82" rx="12" fill="#e9f7ef" stroke="#47845c"/><rect x="400" y="82" width="150" height="82" rx="12" fill="#fff4dd" stroke="#bd8730"/><rect x="590" y="82" width="150" height="82" rx="12" fill="#f3eaff" stroke="#8056aa"/><rect x="780" y="82" width="155" height="82" rx="12" fill="#fff0e8" stroke="#b7683e"/></g>
    <text x="92" y="116" font-size="16">Define behavior</text><text x="92" y="141" font-size="12">baseline + gap</text>
    <text x="282" y="116" font-size="16">Curate examples</text><text x="282" y="141" font-size="12">rights + held-out set</text>
    <text x="475" y="116" font-size="16">Adapt base model</text><text x="475" y="141" font-size="12">fine-tune</text>
    <text x="665" y="116" font-size="16">Evaluate</text><text x="665" y="141" font-size="12">quality + regressions</text>
    <text x="857" y="116" font-size="16">Version + deploy</text><text x="857" y="141" font-size="12">monitor outcomes</text>
    <path d="M165 123H200 M360 123H395 M550 123H585 M740 123H775" fill="none" stroke="#526477" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="480" y="210" font-size="14" fill="#465565">Fine-tuning changes behavior; it is not a reliable substitute for current retrieval.</text>
  </g>
</svg>
