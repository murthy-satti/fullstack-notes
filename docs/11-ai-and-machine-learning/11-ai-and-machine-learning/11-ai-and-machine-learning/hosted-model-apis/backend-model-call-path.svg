<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="bmp-title bmp-desc">
  <title id="bmp-title">One model call from TaskFlow Web through the backend</title>
  <desc id="bmp-desc">A sequence diagram with five lifelines: TaskFlow Web in the browser, the Express API, the AI router that runs callWithFallback, the primary model at provider A, and the fallback model at provider B. The browser sends POST parse-task. The Express API authenticates the user, validates the input, claims the idempotency key and reserves token quota in MongoDB. It passes a chat request with a time budget to the AI router. Attempt 1 to the primary model returns 429 with retry-after 1 second. After waiting, attempt 2 returns 429 insufficient_quota, which retrying cannot fix, so the router moves to the fallback route at provider B, which returns 200 with text and usage. The router returns the result to Express, which settles the quota with the real token count and stores the result for replays, then answers the browser with 200 and the draft task.</desc>
  <defs>
    <marker id="bmp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="bmp-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="540" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="25" y="28" width="130" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="90" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">TaskFlow Web</text>
    <text x="90" y="65" text-anchor="middle" font-size="11.5" fill="#66400f">browser</text>
    <rect x="205" y="28" width="130" height="46" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="270" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Express API</text>
    <text x="270" y="65" text-anchor="middle" font-size="11.5" fill="#263e5a">auth, quota, replay</text>
    <rect x="385" y="28" width="130" height="46" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="450" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">AI router</text>
    <text x="450" y="65" text-anchor="middle" font-size="11.5" fill="#463365">callWithFallback()</text>
    <rect x="565" y="28" width="130" height="46" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="630" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Primary model</text>
    <text x="630" y="65" text-anchor="middle" font-size="11.5" fill="#263e5a">provider A</text>
    <rect x="735" y="28" width="130" height="46" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="800" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Fallback model</text>
    <text x="800" y="65" text-anchor="middle" font-size="11.5" fill="#263e5a">provider B</text>

    <g stroke="#8a96a3" stroke-dasharray="4 4">
      <line x1="90" y1="74" x2="90" y2="492"/>
      <line x1="270" y1="74" x2="270" y2="492"/>
      <line x1="450" y1="74" x2="450" y2="492"/>
      <line x1="630" y1="74" x2="630" y2="492"/>
      <line x1="800" y1="74" x2="800" y2="492"/>
    </g>

    <line x1="90" y1="105" x2="268" y2="105" stroke="#40566b" stroke-width="1.6" marker-end="url(#bmp-arrow)"/>
    <rect x="122" y="88" width="112" height="15" fill="#f5f7fb"/>
    <text x="178" y="99" text-anchor="middle" font-size="12" fill="#36424e">POST /parse-task</text>

    <rect x="190" y="118" width="160" height="58" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="270" y="136" text-anchor="middle" font-size="11.5" fill="#36424e">auth, validate input</text>
    <text x="270" y="152" text-anchor="middle" font-size="11.5" fill="#36424e">claim idempotency key</text>
    <text x="270" y="168" text-anchor="middle" font-size="11.5" fill="#36424e">reserve token quota</text>

    <line x1="270" y1="198" x2="448" y2="198" stroke="#40566b" stroke-width="1.6" marker-end="url(#bmp-arrow)"/>
    <rect x="290" y="181" width="140" height="15" fill="#f5f7fb"/>
    <text x="360" y="192" text-anchor="middle" font-size="12" fill="#36424e">request + 25 s budget</text>

    <line x1="450" y1="228" x2="628" y2="228" stroke="#40566b" stroke-width="1.6" marker-end="url(#bmp-arrow)"/>
    <rect x="505" y="211" width="70" height="15" fill="#f5f7fb"/>
    <text x="540" y="222" text-anchor="middle" font-size="12" fill="#36424e">attempt 1</text>

    <line x1="630" y1="254" x2="452" y2="254" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#bmp-ret)"/>
    <rect x="474" y="237" width="132" height="15" fill="#f5f7fb"/>
    <text x="540" y="248" text-anchor="middle" font-size="12" fill="#6e2a24">429, retry-after 1 s</text>

    <line x1="450" y1="284" x2="628" y2="284" stroke="#40566b" stroke-width="1.6" marker-end="url(#bmp-arrow)"/>
    <rect x="472" y="267" width="136" height="15" fill="#f5f7fb"/>
    <text x="540" y="278" text-anchor="middle" font-size="12" fill="#36424e">attempt 2, after 1 s</text>

    <line x1="630" y1="310" x2="452" y2="310" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#bmp-ret)"/>
    <rect x="466" y="293" width="148" height="15" fill="#f5f7fb"/>
    <text x="540" y="304" text-anchor="middle" font-size="12" fill="#6e2a24">429 insufficient_quota</text>

    <line x1="450" y1="342" x2="798" y2="342" stroke="#40566b" stroke-width="1.6" marker-end="url(#bmp-arrow)"/>
    <rect x="660" y="325" width="110" height="15" fill="#f5f7fb"/>
    <text x="715" y="336" text-anchor="middle" font-size="12" fill="#36424e">fallback route</text>

    <line x1="800" y1="368" x2="452" y2="368" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#bmp-ret)"/>
    <rect x="655" y="351" width="120" height="15" fill="#f5f7fb"/>
    <text x="715" y="362" text-anchor="middle" font-size="12" fill="#294a2e">200: text + usage</text>

    <line x1="450" y1="398" x2="272" y2="398" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#bmp-ret)"/>
    <rect x="322" y="381" width="76" height="15" fill="#f5f7fb"/>
    <text x="360" y="392" text-anchor="middle" font-size="12" fill="#36424e">ChatResult</text>

    <rect x="190" y="412" width="160" height="42" rx="8" fill="#ffffff" stroke="#c9d1db"/>
    <text x="270" y="430" text-anchor="middle" font-size="11.5" fill="#36424e">settle quota (real tokens)</text>
    <text x="270" y="446" text-anchor="middle" font-size="11.5" fill="#36424e">store result for replays</text>

    <line x1="270" y1="476" x2="92" y2="476" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#bmp-ret)"/>
    <rect x="132" y="459" width="96" height="15" fill="#f5f7fb"/>
    <text x="180" y="470" text-anchor="middle" font-size="12" fill="#294a2e">200 { draft }</text>

    <text x="440" y="522" text-anchor="middle" font-size="13" fill="#40566b">Retries and fallback stay inside one time budget; the browser only ever talks to your API.</text>
  </g>
</svg>
