<svg xmlns="http://www.w3.org/2000/svg" width="880" height="545" viewBox="0 0 880 545" role="img" aria-labelledby="met-title met-desc">
  <title id="met-title">Deciding what to do with a failed model call</title>
  <desc id="met-desc">A flowchart. A provider call failed. First decision: was the caller aborted? If yes, stop and log, because nobody is waiting. If no, second decision: is the failure temporary? If yes, retry the same route after the Retry-After delay or an exponential backoff, within the time budget; examples are timeouts, 429 rate limits, 5xx errors and 529 overloaded. When attempts or the budget are used up, move to the next route. If the failure is not temporary, third decision: could another route succeed? If yes, try the next route, a fallback model or provider; examples are a quota or spend-cap 429, 401 or 403, and 404 model not found. If no, fail fast and return a 4xx to the client so the request is fixed; examples are 400, 413, 422 and incomplete output. If every route fails, return 503 and show a retry message.</desc>
  <defs>
    <marker id="met-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="545" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="340" y="28" width="200" height="42" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="440" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Provider call failed</text>

    <line x1="440" y1="70" x2="440" y2="98" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <path d="M440 100 L540 140 L440 180 L340 140 Z" fill="#ffffff" stroke="#8a96a3"/>
    <text x="440" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#36424e">Caller aborted?</text>

    <line x1="540" y1="140" x2="638" y2="140" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <text x="589" y="133" text-anchor="middle" font-size="11.5" fill="#36424e">yes</text>
    <rect x="640" y="112" width="220" height="56" rx="8" fill="#ffffff" stroke="#8a96a3"/>
    <text x="750" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#36424e">Stop and log</text>
    <text x="750" y="154" text-anchor="middle" font-size="11.5" fill="#36424e">nobody is waiting for it</text>

    <line x1="440" y1="180" x2="440" y2="208" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <text x="452" y="198" font-size="11.5" fill="#36424e">no</text>
    <path d="M440 210 L540 250 L440 290 L340 250 Z" fill="#ffffff" stroke="#8a96a3"/>
    <text x="440" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#36424e">Temporary?</text>

    <line x1="340" y1="250" x2="262" y2="250" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <text x="301" y="243" text-anchor="middle" font-size="11.5" fill="#36424e">yes</text>
    <rect x="20" y="207" width="240" height="86" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="140" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#294a2e">Retry the same route</text>
    <text x="140" y="248" text-anchor="middle" font-size="11.5" fill="#294a2e">after Retry-After or backoff,</text>
    <text x="140" y="264" text-anchor="middle" font-size="11.5" fill="#294a2e">inside the time budget</text>
    <text x="140" y="282" text-anchor="middle" font-size="11.5" fill="#294a2e">timeouts, 429, 5xx, 529</text>

    <line x1="140" y1="293" x2="140" y2="328" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <rect x="149" y="303" width="162" height="15" fill="#f5f7fb"/>
    <text x="152" y="314" font-size="11.5" fill="#36424e">attempts or budget used up</text>

    <line x1="440" y1="290" x2="440" y2="318" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <text x="452" y="308" font-size="11.5" fill="#36424e">no</text>
    <path d="M440 320 L540 360 L440 400 L340 360 Z" fill="#ffffff" stroke="#8a96a3"/>
    <text x="440" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#36424e">Another route</text>
    <text x="440" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#36424e">could succeed?</text>

    <line x1="340" y1="360" x2="262" y2="360" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <text x="301" y="353" text-anchor="middle" font-size="11.5" fill="#36424e">yes</text>
    <rect x="20" y="330" width="240" height="72" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="140" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Try the next route</text>
    <text x="140" y="371" text-anchor="middle" font-size="11.5" fill="#463365">fallback model or provider</text>
    <text x="140" y="389" text-anchor="middle" font-size="11.5" fill="#463365">quota 429, 401, 403, 404 model</text>

    <line x1="540" y1="360" x2="638" y2="360" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <text x="589" y="353" text-anchor="middle" font-size="11.5" fill="#36424e">no</text>
    <rect x="640" y="325" width="220" height="72" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="750" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2a24">Fail fast</text>
    <text x="750" y="366" text-anchor="middle" font-size="11.5" fill="#6e2a24">return a 4xx; fix the request</text>
    <text x="750" y="384" text-anchor="middle" font-size="11.5" fill="#6e2a24">400, 413, 422, incomplete</text>

    <line x1="140" y1="402" x2="140" y2="438" stroke="#40566b" stroke-width="1.6" marker-end="url(#met-arrow)"/>
    <rect x="149" y="412" width="104" height="15" fill="#f5f7fb"/>
    <text x="152" y="423" font-size="11.5" fill="#36424e">every route failed</text>
    <rect x="20" y="440" width="240" height="52" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="140" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e2a24">Return 503</text>
    <text x="140" y="480" text-anchor="middle" font-size="11.5" fill="#6e2a24">and show a retry message</text>

    <text x="440" y="525" text-anchor="middle" font-size="13" fill="#40566b">Classify first: only temporary errors are retried, and some 429s are billing problems that never clear.</text>
  </g>
</svg>
