    <text x="30" y="52" font-size="12" fill="#36424e">Numbers from the budget test: 40 stored turns, one new message, input budget 2,850 tokens</text>

    <text x="30" y="80" font-size="12" font-weight="bold" fill="#36424e">Stored history in MongoDB, oldest to newest</text>
