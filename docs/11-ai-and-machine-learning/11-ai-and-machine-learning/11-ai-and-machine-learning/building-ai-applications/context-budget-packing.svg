<svg xmlns="http://www.w3.org/2000/svg" width="860" height="424" viewBox="0 0 860 424" role="img" aria-labelledby="cbp-title cbp-desc">
  <title id="cbp-title">Packing a chat turn into the context window</title>
  <desc id="cbp-desc">A stored history of 40 turns is shown oldest to newest. Turns 16 to 40 are the newest turns that fit and are kept, turn 4 is pinned and also kept, and turns 1 to 3 and 5 to 15 are evicted. Evicted turns go to a background summarizer job, which folds them into the rolling summary. The request is a bar across the context window: instructions, saved memories, the summary, the kept recent turns, and the new message make up the input budget, followed by reserved output tokens and a five percent safety margin. The input budget is the window minus reserved output, times one minus the margin, which is 2,850 tokens in the test.</desc>
  <defs>
    <marker id="cbp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="cbp-arrow-async" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="860" height="424" rx="14" fill="#f5f7fb"/>
