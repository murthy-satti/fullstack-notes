    <text x="190" y="286" font-size="11" fill="#463365" text-anchor="middle">user facts</text>
    <rect x="238" y="246" width="96" height="52" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="286" y="268" font-size="12" font-weight="bold" fill="#263e5a" text-anchor="middle">Summary</text>
    <text x="286" y="286" font-size="11" fill="#263e5a" text-anchor="middle">older turns</text>
    <rect x="334" y="246" width="226" height="52" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="447" y="268" font-size="12" font-weight="bold" fill="#66400f" text-anchor="middle">Recent turns (kept)</text>
    <text x="447" y="286" font-size="11" fill="#66400f" text-anchor="middle">pinned 4 plus turns 16-40</text>
    <rect x="560" y="246" width="104" height="52" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.2"/>
    <text x="612" y="268" font-size="12" font-weight="bold" fill="#66400f" text-anchor="middle">New message</text>
    <text x="612" y="286" font-size="11" fill="#66400f" text-anchor="middle">turn 41</text>
    <rect x="664" y="246" width="128" height="52" rx="6" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
