    <path d="M30 306 V313 H664 V306" fill="none" stroke="#8a96a3" stroke-width="1.4"/>
    <text x="347" y="330" font-size="12" fill="#36424e" text-anchor="middle">input budget = (window - reserved output) x (1 - margin) = 2,850 tokens in the test</text>
    <path d="M30 340 V347 H830 V340" fill="none" stroke="#8a96a3" stroke-width="1.4"/>
    <text x="430" y="364" font-size="12" fill="#36424e" text-anchor="middle">context window of the configured model (input plus output)</text>

    <rect x="30" y="378" width="14" height="14" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="50" y="390" font-size="11.5" fill="#36424e">kept: newest turns that fit</text>
    <rect x="230" y="378" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="250" y="390" font-size="11.5" fill="#36424e">pinned: always kept</text>
    <rect x="400" y="378" width="14" height="14" rx="3" fill="#eef1f5" stroke="#8a96a3"/>
    <text x="420" y="390" font-size="11.5" fill="#36424e">evicted: summarized, not silently dropped</text>
    <text x="30" y="414" font-size="13" fill="#40566b">Fixed parts first, then the newest turns that fit; evicted turns live on in the summary.</text>
