    <line x1="170" y1="134" x2="170" y2="156" stroke="#40566b" stroke-width="1.6" marker-end="url(#cbp-arrow)"/>
    <rect x="30" y="160" width="290" height="54" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
