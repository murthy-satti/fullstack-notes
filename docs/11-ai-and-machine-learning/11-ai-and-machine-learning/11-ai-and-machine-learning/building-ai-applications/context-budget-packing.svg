    <text x="175" y="202" font-size="11.5" fill="#463365" text-anchor="middle">folds evicted turns into the summary</text>
    <line x1="286" y1="214" x2="286" y2="244" stroke="#60788d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cbp-arrow-async)"/>

