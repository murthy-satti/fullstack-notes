    <text x="86" y="268" font-size="12" font-weight="bold" fill="#463365" text-anchor="middle">Instructions</text>
    <text x="86" y="286" font-size="11" fill="#463365" text-anchor="middle">system prompt</text>
    <rect x="142" y="246" width="96" height="52" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
