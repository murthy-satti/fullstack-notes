<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="bis-title bis-desc">
  <title id="bis-title">Barge-in: the caller interrupts the assistant</title>
  <desc id="bis-desc">Four lifelines: the caller, the playback side (phone line or browser), your server, and the realtime model. The model streams reply audio for item_1 to your server, which forwards audio frames to the playback side; 1,000 milliseconds are queued and the caller has heard 640 milliseconds when they start talking. Their audio keeps streaming to the model, which emits a speech started event. Your server tells the playback side to clear the 360 milliseconds not yet played, and sends conversation item truncate for item_1 with an audio end of 640 milliseconds. The model cancels the reply, and the stored reply now ends where the caller stopped hearing it, so the next answer does not assume the caller heard the rest.</desc>
  <defs>
    <marker id="bis-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Barge-in: keep only what the caller actually heard</text>

    <rect x="40" y="50" width="120" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="100" y="73" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Caller</text>
    <rect x="230" y="50" width="140" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="300" y="73" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Playback side</text>
    <rect x="450" y="50" width="140" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="520" y="73" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Your server</text>
    <rect x="670" y="50" width="150" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="745" y="73" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Realtime model</text>
    <g stroke="#8a96a3" stroke-width="1.2" stroke-dasharray="4 4">
      <line x1="100" y1="86" x2="100" y2="390"/>
      <line x1="300" y1="86" x2="300" y2="390"/>
      <line x1="520" y1="86" x2="520" y2="390"/>
      <line x1="745" y1="86" x2="745" y2="390"/>
    </g>

    <line x1="745" y1="118" x2="523" y2="118" stroke="#40566b" stroke-width="1.6" marker-end="url(#bis-arrow)"/>
    <rect x="550" y="100" width="170" height="16" rx="3" fill="#f5f7fb"/>
    <text x="635" y="112" font-size="11" fill="#36424e" text-anchor="middle">reply audio, item_1</text>
    <line x1="520" y1="150" x2="303" y2="150" stroke="#40566b" stroke-width="1.6" marker-end="url(#bis-arrow)"/>
    <rect x="320" y="132" width="184" height="16" rx="3" fill="#f5f7fb"/>
    <text x="412" y="144" font-size="11" fill="#36424e" text-anchor="middle">frames: 1,000 ms queued</text>
    <line x1="300" y1="182" x2="103" y2="182" stroke="#40566b" stroke-width="1.6" marker-end="url(#bis-arrow)"/>
    <rect x="130" y="164" width="144" height="16" rx="3" fill="#f5f7fb"/>
    <text x="202" y="176" font-size="11" fill="#36424e" text-anchor="middle">caller hears 640 ms</text>

    <line x1="100" y1="218" x2="742" y2="218" stroke="#40566b" stroke-width="1.6" marker-end="url(#bis-arrow)"/>
    <rect x="128" y="200" width="274" height="16" rx="3" fill="#f5f7fb"/>
    <text x="265" y="212" font-size="11" fill="#36424e" text-anchor="middle">caller starts talking (audio streams in)</text>
    <line x1="745" y1="252" x2="523" y2="252" stroke="#40566b" stroke-width="1.6" marker-end="url(#bis-arrow)"/>
    <rect x="550" y="234" width="170" height="16" rx="3" fill="#f5f7fb"/>
    <text x="635" y="246" font-size="11" fill="#36424e" text-anchor="middle">speech_started</text>
    <line x1="520" y1="286" x2="303" y2="286" stroke="#b5524b" stroke-width="1.8" marker-end="url(#bis-arrow)"/>
    <rect x="316" y="268" width="192" height="16" rx="3" fill="#f5f7fb"/>
    <text x="412" y="280" font-size="11" fill="#6e2a24" text-anchor="middle">clear: drop 360 ms unplayed</text>
    <line x1="520" y1="320" x2="742" y2="320" stroke="#b5524b" stroke-width="1.8" marker-end="url(#bis-arrow)"/>
    <rect x="530" y="302" width="204" height="16" rx="3" fill="#f5f7fb"/>
    <text x="632" y="314" font-size="11" fill="#6e2a24" text-anchor="middle">truncate item_1 at 640 ms</text>

    <rect x="590" y="340" width="240" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="710" y="358" font-size="11.5" fill="#294a2e" text-anchor="middle">reply cancelled; the stored reply</text>
    <text x="710" y="374" font-size="11.5" fill="#294a2e" text-anchor="middle">ends where the caller stopped</text>

    <text x="30" y="416" font-size="13" fill="#40566b">Stop the audio fast, then correct the history, or the model will assume the caller heard everything.</text>
  </g>
</svg>
