<svg xmlns="http://www.w3.org/2000/svg" width="860" height="404" viewBox="0 0 860 404" role="img" aria-labelledby="adb-title adb-desc">
  <title id="adb-title">Keeping SDKs and frameworks behind your own interface</title>
  <desc id="adb-desc">TaskFlow features, namely task creation, project Q and A, meeting summaries, and the task agent, all call one TaskFlow AI service, an interface the team owns with functions such as parseTask, answerQuestion, summarizeNote, and runAgent; the service owns prompts, schemas, validation, and tracing. Behind it sit adapters: an AI SDK adapter that can reach OpenAI, Anthropic, Google, or a local model; a LangGraph adapter used only for the agent workflow; and a fake adapter for tests with no network. TaskFlow owns prompts, schemas, conversation data, eval sets, and traces; SDKs, frameworks, and providers are replaceable.</desc>
  <defs>
    <marker id="adb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="404" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#36424e">Limiting lock-in: one interface, swappable adapters</text>

    <rect x="30" y="64" width="160" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="110" y="91" font-size="12.5" font-weight="bold" fill="#66400f" text-anchor="middle">Task creation</text>
    <rect x="30" y="120" width="160" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="110" y="147" font-size="12.5" font-weight="bold" fill="#66400f" text-anchor="middle">Project Q&amp;A</text>
    <rect x="30" y="176" width="160" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="110" y="203" font-size="12.5" font-weight="bold" fill="#66400f" text-anchor="middle">Meeting summaries</text>
    <rect x="30" y="232" width="160" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="110" y="259" font-size="12.5" font-weight="bold" fill="#66400f" text-anchor="middle">Task agent</text>
    <line x1="190" y1="86" x2="228" y2="86" stroke="#40566b" stroke-width="1.5" marker-end="url(#adb-arrow)"/>
    <line x1="190" y1="142" x2="228" y2="142" stroke="#40566b" stroke-width="1.5" marker-end="url(#adb-arrow)"/>
    <line x1="190" y1="198" x2="228" y2="198" stroke="#40566b" stroke-width="1.5" marker-end="url(#adb-arrow)"/>
    <line x1="190" y1="254" x2="228" y2="254" stroke="#40566b" stroke-width="1.5" marker-end="url(#adb-arrow)"/>

    <rect x="230" y="64" width="220" height="212" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="340" y="88" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">TaskFlow AI service</text>
    <text x="340" y="106" font-size="11" fill="#263e5a" text-anchor="middle">an interface your team owns</text>
    <text x="250" y="134" font-size="11.5" fill="#263e5a">parseTask(text)</text>
    <text x="250" y="154" font-size="11.5" fill="#263e5a">answerQuestion(question)</text>
    <text x="250" y="174" font-size="11.5" fill="#263e5a">summarizeNote(noteId)</text>
    <text x="250" y="194" font-size="11.5" fill="#263e5a">runAgent(messages)</text>
    <text x="340" y="230" font-size="11" fill="#263e5a" text-anchor="middle">owns prompts, schemas,</text>
    <text x="340" y="246" font-size="11" fill="#263e5a" text-anchor="middle">validation, and tracing</text>

    <line x1="450" y1="96" x2="488" y2="96" stroke="#40566b" stroke-width="1.5" marker-end="url(#adb-arrow)"/>
    <line x1="450" y1="172" x2="488" y2="172" stroke="#40566b" stroke-width="1.5" marker-end="url(#adb-arrow)"/>
    <line x1="450" y1="248" x2="488" y2="248" stroke="#40566b" stroke-width="1.5" marker-end="url(#adb-arrow)"/>
    <rect x="490" y="68" width="160" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="570" y="92" font-size="12.5" font-weight="bold" fill="#463365" text-anchor="middle">AI SDK adapter</text>
    <text x="570" y="110" font-size="11" fill="#463365" text-anchor="middle">most features</text>
    <rect x="490" y="144" width="160" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="570" y="168" font-size="12.5" font-weight="bold" fill="#463365" text-anchor="middle">LangGraph adapter</text>
    <text x="570" y="186" font-size="11" fill="#463365" text-anchor="middle">agent workflow only</text>
    <rect x="490" y="220" width="160" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="570" y="244" font-size="12.5" font-weight="bold" fill="#463365" text-anchor="middle">Fake adapter</text>
    <text x="570" y="262" font-size="11" fill="#463365" text-anchor="middle">tests, no network</text>

    <rect x="700" y="64" width="130" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="765" y="89" font-size="12.5" fill="#263e5a" text-anchor="middle">OpenAI</text>
    <rect x="700" y="116" width="130" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="765" y="141" font-size="12.5" fill="#263e5a" text-anchor="middle">Anthropic</text>
    <rect x="700" y="168" width="130" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="765" y="193" font-size="12.5" fill="#263e5a" text-anchor="middle">Google</text>
    <rect x="700" y="220" width="130" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="765" y="245" font-size="12.5" fill="#263e5a" text-anchor="middle">Local model</text>
    <g stroke="#40566b" stroke-width="1.2">
      <line x1="650" y1="90" x2="698" y2="84" marker-end="url(#adb-arrow)"/>
      <line x1="650" y1="94" x2="698" y2="134" marker-end="url(#adb-arrow)"/>
      <line x1="650" y1="98" x2="698" y2="186" marker-end="url(#adb-arrow)"/>
      <line x1="650" y1="102" x2="698" y2="238" marker-end="url(#adb-arrow)"/>
      <line x1="650" y1="168" x2="698" y2="90" marker-end="url(#adb-arrow)"/>
      <line x1="650" y1="174" x2="698" y2="142" marker-end="url(#adb-arrow)"/>
    </g>

    <rect x="30" y="300" width="420" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="240" y="323" font-size="13" font-weight="bold" fill="#294a2e" text-anchor="middle">Owned by TaskFlow</text>
    <text x="240" y="342" font-size="11.5" fill="#294a2e" text-anchor="middle">prompts, schemas, conversation data, eval sets, traces</text>
    <rect x="490" y="300" width="340" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="660" y="323" font-size="13" font-weight="bold" fill="#463365" text-anchor="middle">Replaceable</text>
    <text x="660" y="342" font-size="11.5" fill="#463365" text-anchor="middle">SDKs, frameworks, providers</text>

    <text x="30" y="386" font-size="13" fill="#40566b">Lock-in lives in the data and code shapes you let a framework own, not in the import line.</text>
  </g>
</svg>
