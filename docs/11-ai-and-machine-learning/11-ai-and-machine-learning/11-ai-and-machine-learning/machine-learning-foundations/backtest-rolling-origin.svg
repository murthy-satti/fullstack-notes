<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="bro-title bro-desc">
  <title id="bro-title">Backtesting a weekly forecast from four rolling origins</title>
  <desc id="bro-desc">A rolling-origin backtest over 20 weeks of hourly TaskFlow traffic, one cell per week from 4 May to 14 September 2026. The first four weeks are warm-up, needed to compute four-week lag features. Four forecasts are made, each from a Monday origin: 24 August, 31 August, 7 September, which is a holiday, and 14 September. For each origin the model trains on every earlier week and forecasts the next 168 hours; the training window grows by one week per row and later weeks stay unused. A table on the right gives the mean absolute error in requests per hour for the seasonal naive forecast and for LightGBM: 72.6 and 55.0 from 24 August, 73.3 and 65.6 from 31 August, 163.6 and 49.8 for the holiday week, and 168.4 and 60.0 for the week after it, when the seasonal naive forecast copies the holiday dip. The means are 119.4 and 57.6.</desc>
