<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="tfh-title tfh-desc">
  <title id="tfh-title">Daily and weekly seasonality, and a holiday that breaks the seasonal naive forecast</title>
  <desc id="tfh-desc">Hourly TaskFlow API requests for two weeks, from Monday 31 August to Sunday 13 September 2026, on a scale from 0 to 3,000 requests per hour. Every weekday shows an afternoon peak near 2,400 requests and a night low near 500; weekends are much quieter. A dashed line marks the forecast origin, Monday 7 September, which is a public holiday shaded in orange, when traffic stayed low all day. For the week after the origin, the seasonal naive forecast copies the previous week and predicts a normal Monday peak, missing the holiday; its mean absolute error for the week is 164 requests per hour. The LightGBM forecast, which knows the holiday calendar, follows the low Monday and the normal days after it, with a mean absolute error of 50.</desc>
