<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="rmt-title rmt-desc">
  <title id="rmt-title">Recall at 3, reciprocal rank, and nDCG at 3 for two result lists</title>
  <desc id="rmt-desc">The question is how do we undo a broken release. Judgments: the runbook n1 and the incident review n4 have grade 3, the rollback checklist n8 has grade 1, all others grade 0. The BM25 list is n7 with grade 0, n4 with grade 3, n1 with grade 3, n3 with grade 0, and n2 with grade 0. It scores recall at 3 of 0.667, because two of the three relevant notes are in the top 3, reciprocal rank 0.5, because the first relevant result is at position 2, and nDCG at 3 of 0.664. The fused list is n1 with grade 3, n4 with grade 3, n3 with grade 0, n7 with grade 0, and n8 with grade 1. It has the same recall at 3 of 0.667 but reciprocal rank 1.0 and nDCG at 3 of 0.958. On the right: recall at k counts relevant results in the top k divided by all relevant; reciprocal rank is 1 divided by the position of the first relevant result; nDCG at k sums 2 to the power of the grade minus 1, divided by log base 2 of the position plus 1, and divides by the same sum for the ideal order.</desc>
  <rect width="840" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="420" y="32" font-size="14" font-weight="700" fill="#36424e" text-anchor="middle">"how do we undo a broken release"   grades: n1 = 3, n4 = 3, n8 = 1, others 0</text>

    <text x="160" y="64" font-size="14" font-weight="700" fill="#463365" text-anchor="middle">BM25 list</text>
    <text x="440" y="64" font-size="14" font-weight="700" fill="#294a2e" text-anchor="middle">Fused list (RRF)</text>

    <g font-size="12">
      <rect x="40" y="78" width="240" height="32" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="54" y="99" fill="#36424e"><tspan font-weight="700">1  n7</tspan>  postmortem guide</text><text x="268" y="99" fill="#36424e" text-anchor="end">grade 0</text>
      <rect x="40" y="118" width="240" height="32" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="54" y="139" fill="#294a2e"><tspan font-weight="700">2  n4</tspan>  incident review</text><text x="268" y="139" fill="#294a2e" text-anchor="end">grade 3</text>
      <rect x="40" y="158" width="240" height="32" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="54" y="179" fill="#294a2e"><tspan font-weight="700">3  n1</tspan>  rollback runbook</text><text x="268" y="179" fill="#294a2e" text-anchor="end">grade 3</text>
      <rect x="40" y="198" width="240" height="32" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="54" y="219" fill="#36424e"><tspan font-weight="700">4  n3</tspan>  release notes</text><text x="268" y="219" fill="#36424e" text-anchor="end">grade 0</text>
      <rect x="40" y="238" width="240" height="32" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="54" y="259" fill="#36424e"><tspan font-weight="700">5  n2</tspan>  TF-1432 ticket</text><text x="268" y="259" fill="#36424e" text-anchor="end">grade 0</text>

      <rect x="320" y="78" width="240" height="32" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="334" y="99" fill="#294a2e"><tspan font-weight="700">1  n1</tspan>  rollback runbook</text><text x="548" y="99" fill="#294a2e" text-anchor="end">grade 3</text>
      <rect x="320" y="118" width="240" height="32" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="334" y="139" fill="#294a2e"><tspan font-weight="700">2  n4</tspan>  incident review</text><text x="548" y="139" fill="#294a2e" text-anchor="end">grade 3</text>
      <rect x="320" y="158" width="240" height="32" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="334" y="179" fill="#36424e"><tspan font-weight="700">3  n3</tspan>  release notes</text><text x="548" y="179" fill="#36424e" text-anchor="end">grade 0</text>
      <rect x="320" y="198" width="240" height="32" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="334" y="219" fill="#36424e"><tspan font-weight="700">4  n7</tspan>  postmortem guide</text><text x="548" y="219" fill="#36424e" text-anchor="end">grade 0</text>
      <rect x="320" y="238" width="240" height="32" rx="8" fill="#f3faf4" stroke="#53845b" stroke-width="1.5"/>
      <text x="334" y="259" fill="#294a2e"><tspan font-weight="700">5  n8</tspan>  rollback checklist</text><text x="548" y="259" fill="#294a2e" text-anchor="end">grade 1</text>
    </g>

    <path d="M40 194H560" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="300" y="282" font-size="11" fill="#36424e" text-anchor="middle">metrics at k = 3 use the rows above the dashed line</text>

    <rect x="40" y="298" width="240" height="72" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <g font-size="12.5" fill="#6e2a24">
      <text x="54" y="320">recall@3 = 2/3 = <tspan font-weight="700">0.667</tspan></text>
      <text x="54" y="340">reciprocal rank = 1/2 = <tspan font-weight="700">0.500</tspan></text>
      <text x="54" y="360">nDCG@3 = <tspan font-weight="700">0.664</tspan></text>
    </g>
    <rect x="320" y="298" width="240" height="72" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="12.5" fill="#294a2e">
      <text x="334" y="320">recall@3 = 2/3 = <tspan font-weight="700">0.667</tspan></text>
      <text x="334" y="340">reciprocal rank = 1/1 = <tspan font-weight="700">1.000</tspan></text>
      <text x="334" y="360">nDCG@3 = <tspan font-weight="700">0.958</tspan></text>
    </g>

    <rect x="590" y="78" width="230" height="292" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="12" fill="#263e5a">
      <text x="604" y="100" font-weight="700">recall@k</text>
      <text x="604" y="118">relevant in top k / all relevant</text>
      <text x="604" y="136">did the evidence make it in?</text>
      <text x="604" y="168" font-weight="700">reciprocal rank (MRR)</text>
      <text x="604" y="186">1 / position of first relevant</text>
      <text x="604" y="204">how soon is the first hit?</text>
      <text x="604" y="236" font-weight="700">nDCG@k</text>
      <text x="604" y="254">sum of (2^grade - 1) / log2(pos + 1)</text>
      <text x="604" y="272">divided by the ideal order's sum</text>
      <text x="604" y="290">are the best results on top?</text>
      <text x="604" y="322">ideal here: 3, 3, 1</text>
      <text x="604" y="340">IDCG@3 = 7 + 7/1.585 + 1/2</text>
      <text x="604" y="358">= 11.917</text>
    </g>

    <text x="420" y="402" font-size="13" fill="#40566b" text-anchor="middle">Same recall, very different usefulness: measure order as well as coverage.</text>
  </g>
</svg>
