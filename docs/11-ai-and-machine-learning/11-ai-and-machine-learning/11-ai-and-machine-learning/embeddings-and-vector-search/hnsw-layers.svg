<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="hnl-title hnl-desc">
  <title id="hnl-title">How an HNSW index searches its layers</title>
  <desc id="hnl-desc">Three stacked layers of a hierarchical navigable small world graph. Layer 2 at the top holds three vectors joined by long links. Layer 1 holds seven vectors. Layer 0 at the bottom holds every vector, linked to close neighbors. The query enters at the top layer, moves greedily along links to the vector closest to the query, drops to the same vector one layer down, and repeats. On layer 0 it explores the neighborhood while keeping a candidate list of size ef_search, drawn as green vectors, and returns the best k. On the right: m is the number of links per node, where more links give better recall but use more memory; ef_construction is the candidate list size while building, where bigger gives a better graph but a slower build; hnsw.ef_search is the candidate list size while searching, where bigger gives higher recall at higher latency.</desc>
  <defs>
    <marker id="hnl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="hnl-arrow-o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#bd7a20"/>
    </marker>
  </defs>
  <rect width="840" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="40" width="520" height="88" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="40" y="144" width="520" height="88" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <rect x="40" y="248" width="520" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="12" font-weight="700" fill="#263e5a">
      <text x="52" y="60">layer 2: few vectors, long links</text>
      <text x="52" y="164">layer 1</text>
      <text x="52" y="268">layer 0: every vector, short links</text>
    </g>

    <g stroke="#8a96a3" stroke-width="1.3" fill="none">
      <path d="M110 92 250 106M250 106 390 90"/>
      <path d="M90 196 160 214 250 188 320 216 390 198 450 182 520 208M160 214 320 216M250 188 390 198M390 198 520 208"/>
      <path d="M70 300 100 322 130 292 160 316 190 290 220 320 250 296 280 318 310 292 340 314 370 296 400 320 430 310 450 296 470 318 500 284 525 308M100 322 160 316M190 290 250 296M310 292 370 296M430 310 470 318M450 296 500 284"/>
    </g>

    <g fill="#ffffff" stroke="#4774aa" stroke-width="2">
      <circle cx="110" cy="92" r="6"/><circle cx="250" cy="106" r="6"/><circle cx="390" cy="90" r="6"/>
      <circle cx="90" cy="196" r="6"/><circle cx="160" cy="214" r="6"/><circle cx="250" cy="188" r="6"/><circle cx="320" cy="216" r="6"/><circle cx="390" cy="198" r="6"/><circle cx="450" cy="182" r="6"/><circle cx="520" cy="208" r="6"/>
      <circle cx="70" cy="300" r="5"/><circle cx="100" cy="322" r="5"/><circle cx="130" cy="292" r="5"/><circle cx="160" cy="316" r="5"/><circle cx="190" cy="290" r="5"/><circle cx="220" cy="320" r="5"/><circle cx="250" cy="296" r="5"/><circle cx="280" cy="318" r="5"/><circle cx="310" cy="292" r="5"/><circle cx="340" cy="314" r="5"/><circle cx="370" cy="296" r="5"/><circle cx="400" cy="320" r="5"/>
    </g>
    <g fill="#e7f3e9" stroke="#53845b" stroke-width="2.4">
      <circle cx="430" cy="310" r="6"/><circle cx="450" cy="296" r="6"/><circle cx="470" cy="318" r="6"/><circle cx="500" cy="284" r="6"/><circle cx="525" cy="308" r="6"/>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2.4">
      <rect x="474" y="80" width="14" height="14" rx="3"/>
      <rect x="474" y="184" width="14" height="14" rx="3"/>
      <rect x="474" y="292" width="14" height="14" rx="3"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <text x="494" y="78">query</text>
    </g>

    <g fill="none" stroke="#bd7a20" stroke-width="3" stroke-linecap="round">
      <path d="M116 91 382 90" marker-end="url(#hnl-arrow-o)"/>
      <path d="M396 196 442 184" marker-end="url(#hnl-arrow-o)"/>
    </g>
    <g fill="none" stroke="#bd7a20" stroke-width="2" stroke-dasharray="5 4">
      <path d="M390 97V190"/>
      <path d="M450 189V288"/>
    </g>
    <rect x="300" y="129" width="80" height="14" fill="#f5f7fb"/>
    <text x="340" y="140" font-size="11" fill="#66400f" text-anchor="middle">drop a layer</text>
    <text x="300" y="80" font-size="11" fill="#66400f" text-anchor="middle">greedy move</text>

    <rect x="590" y="40" width="230" height="88" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="606" y="62" font-size="13" font-weight="700" fill="#463365">m (default 16)</text>
    <text x="606" y="82" font-size="11.5" fill="#463365">links per node</text>
    <text x="606" y="100" font-size="11.5" fill="#463365">bigger: better recall,</text>
    <text x="606" y="116" font-size="11.5" fill="#463365">more memory, slower build</text>

    <rect x="590" y="144" width="230" height="88" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="606" y="166" font-size="13" font-weight="700" fill="#463365">ef_construction (64)</text>
    <text x="606" y="186" font-size="11.5" fill="#463365">candidates while building</text>
    <text x="606" y="204" font-size="11.5" fill="#463365">bigger: better graph,</text>
    <text x="606" y="220" font-size="11.5" fill="#463365">slower build</text>

    <rect x="590" y="248" width="230" height="100" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="606" y="270" font-size="13" font-weight="700" fill="#294a2e">hnsw.ef_search (40)</text>
    <text x="606" y="290" font-size="11.5" fill="#294a2e">candidates while searching</text>
    <text x="606" y="308" font-size="11.5" fill="#294a2e">(green: the candidate list)</text>
    <text x="606" y="326" font-size="11.5" fill="#294a2e">bigger: higher recall,</text>
    <text x="606" y="342" font-size="11.5" fill="#294a2e">higher latency</text>

    <text x="420" y="398" font-size="13" fill="#40566b" text-anchor="middle">Upper layers get the search near the query fast; layer 0 refines it within the ef_search budget.</text>
  </g>
</svg>
