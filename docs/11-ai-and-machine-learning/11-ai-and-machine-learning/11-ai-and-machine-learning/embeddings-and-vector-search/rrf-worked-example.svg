<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" role="img" aria-labelledby="rrf-title rrf-desc">
  <title id="rrf-title">Reciprocal rank fusion worked example for the query TF-1432 rollback</title>
  <desc id="rrf-desc">Left: the BM25 list ranks n2, the TF-1432 ticket, first and n8, the rollback checklist, second. Middle: the vector list ranks n8 first, then n1, the rollback runbook, then n4, the incident review, then n2, then n5, the TF-1398 ticket. Right: the fused list with k equal to 60. n8 scores 1/62 plus 1/61, 0.0325. n2 scores 1/61 plus 1/64, 0.0320. n1 scores 1/62, 0.0161. n4 scores 1/63, 0.0159. n5 scores 1/65, 0.0154. The two documents found by both retrievers, n8 and n2, take the top places. Only ranks are used, so BM25 scores and cosine similarities never need a common scale.</desc>
  <rect width="840" height="390" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="140" y="40" fill="#463365">BM25 list</text>
      <text x="370" y="40" fill="#263e5a">Vector list</text>
      <text x="670" y="40" fill="#294a2e">Fused with RRF (k = 60)</text>
    </g>

    <g font-size="12">
      <rect x="40" y="58" width="200" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="54" y="80" fill="#463365"><tspan font-weight="700">1  n2</tspan>  TF-1432 ticket</text>
      <rect x="40" y="102" width="200" height="34" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="54" y="124" fill="#463365"><tspan font-weight="700">2  n8</tspan>  rollback checklist</text>

      <rect x="270" y="58" width="200" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="284" y="80" fill="#263e5a"><tspan font-weight="700">1  n8</tspan>  rollback checklist</text>
      <rect x="270" y="102" width="200" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="284" y="124" fill="#263e5a"><tspan font-weight="700">2  n1</tspan>  rollback runbook</text>
      <rect x="270" y="146" width="200" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="284" y="168" fill="#263e5a"><tspan font-weight="700">3  n4</tspan>  incident review</text>
      <rect x="270" y="190" width="200" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="284" y="212" fill="#263e5a"><tspan font-weight="700">4  n2</tspan>  TF-1432 ticket</text>
      <rect x="270" y="234" width="200" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="284" y="256" fill="#263e5a"><tspan font-weight="700">5  n5</tspan>  TF-1398 ticket</text>

      <rect x="510" y="58" width="310" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="524" y="80" fill="#294a2e"><tspan font-weight="700">n8</tspan>  1/62 + 1/61 = <tspan font-weight="700">0.0325</tspan>  (both lists)</text>
      <rect x="510" y="102" width="310" height="34" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
      <text x="524" y="124" fill="#294a2e"><tspan font-weight="700">n2</tspan>  1/61 + 1/64 = <tspan font-weight="700">0.0320</tspan>  (both lists)</text>
      <rect x="510" y="146" width="310" height="34" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="524" y="168" fill="#36424e"><tspan font-weight="700">n1</tspan>  1/62 = 0.0161  (vector only)</text>
      <rect x="510" y="190" width="310" height="34" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="524" y="212" fill="#36424e"><tspan font-weight="700">n4</tspan>  1/63 = 0.0159  (vector only)</text>
      <rect x="510" y="234" width="310" height="34" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="524" y="256" fill="#36424e"><tspan font-weight="700">n5</tspan>  1/65 = 0.0154  (vector only)</text>
    </g>

    <rect x="40" y="290" width="780" height="50" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="430" y="312" font-size="13" font-weight="700" fill="#36424e" text-anchor="middle">RRF(d) = sum over the lists that contain d of  weight / (60 + rank)</text>
    <text x="430" y="331" font-size="12" fill="#36424e" text-anchor="middle">rank 1 adds 1/61 = 0.0164; rank 10 adds 1/70 = 0.0143: appearing twice beats ranking first once</text>

    <text x="420" y="370" font-size="13" fill="#40566b" text-anchor="middle">Only positions are used, so BM25 scores and cosine similarities never need a common scale.</text>
  </g>
</svg>
