<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="rem-title rem-desc">
  <title id="rem-title">Re-embedding note chunks from version 1 to version 2 without downtime</title>
  <desc id="rem-desc">A timeline of seven steps. 1, expand: add a new vector field and a new index for the version 2 model. 2, dual-write: every new or edited chunk is embedded with both models. 3, backfill: older chunks are re-embedded in resumable batches. 4, evaluate: compare recall at 10 of both indexes on the evaluation set and shadow real queries. 5, cut over through configuration, canary traffic first. 6, keep version 1 during a rollback window. 7, contract: drop the version 1 field and index. Three lanes run under the steps. Queries use the version 1 index until the cutover at step 5 and the version 2 index after it. Writes go to version 1 only before step 2, to both versions from step 2 until the end of the rollback window, and to version 2 only after it. The backfill runs during step 3 and the recall comparison during step 4. Old and new vectors never share an index.</desc>
  <defs>
    <marker id="rem-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="340" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="430" y="30" font-size="14" font-weight="700" fill="#263e5a" text-anchor="middle">Moving note chunks from embedding v1 to v2</text>

    <path d="M60 110H818" stroke="#40566b" stroke-width="2" marker-end="url(#rem-arrow)"/>
    <g fill="#ffffff" stroke="#40566b" stroke-width="2">
      <circle cx="100" cy="110" r="7"/>
      <circle cx="210" cy="110" r="7"/>
      <circle cx="320" cy="110" r="7"/>
      <circle cx="430" cy="110" r="7"/>
      <circle cx="540" cy="110" r="7"/>
      <circle cx="650" cy="110" r="7"/>
      <circle cx="760" cy="110" r="7"/>
    </g>
    <g font-size="12" text-anchor="middle" fill="#36424e">
      <text x="100" y="66" font-weight="700">1. expand</text>
      <text x="100" y="83">field + index</text>
      <text x="210" y="66" font-weight="700">2. dual-write</text>
      <text x="210" y="83">new and edited</text>
      <text x="320" y="66" font-weight="700">3. backfill</text>
      <text x="320" y="83">old chunks</text>
      <text x="430" y="66" font-weight="700">4. evaluate</text>
      <text x="430" y="83">recall@10</text>
      <text x="540" y="66" font-weight="700">5. cut over</text>
      <text x="540" y="83">canary first</text>
      <text x="650" y="66" font-weight="700">6. rollback</text>
      <text x="650" y="83">window</text>
      <text x="760" y="66" font-weight="700">7. contract</text>
      <text x="760" y="83">drop v1</text>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="24" y="154">reads</text>
      <text x="24" y="200">writes</text>
      <text x="24" y="246">jobs</text>
    </g>

    <rect x="76" y="136" width="464" height="28" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="308" y="155" font-size="12" font-weight="700" fill="#263e5a" text-anchor="middle">queries use the v1 index</text>
    <rect x="540" y="136" width="270" height="28" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="675" y="155" font-size="12" font-weight="700" fill="#294a2e" text-anchor="middle">queries use the v2 index</text>

    <rect x="76" y="182" width="134" height="28" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="143" y="201" font-size="12" font-weight="700" fill="#263e5a" text-anchor="middle">v1 only</text>
    <rect x="210" y="182" width="495" height="28" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="372" y="201" font-size="12" font-weight="700" fill="#463365" text-anchor="middle">dual-write v1 + v2</text>
    <rect x="705" y="182" width="105" height="28" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="757" y="201" font-size="12" font-weight="700" fill="#294a2e" text-anchor="middle">v2 only</text>

    <rect x="268" y="228" width="104" height="28" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="320" y="247" font-size="11.5" font-weight="700" fill="#66400f" text-anchor="middle">backfill</text>
    <rect x="378" y="228" width="104" height="28" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="430" y="247" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="middle">recall check</text>

    <path d="M540 128V266" stroke="#b5524b" stroke-width="1.8" stroke-dasharray="5 4"/>
    <rect x="490" y="268" width="100" height="22" rx="6" fill="#f5f7fb"/>
    <text x="540" y="283" font-size="11.5" font-weight="700" fill="#6e2a24" text-anchor="middle">config switch</text>

    <text x="430" y="322" font-size="13" fill="#40566b" text-anchor="middle">Old and new vectors never share an index; production reads v1 until the evaluated cutover.</text>
  </g>
</svg>
