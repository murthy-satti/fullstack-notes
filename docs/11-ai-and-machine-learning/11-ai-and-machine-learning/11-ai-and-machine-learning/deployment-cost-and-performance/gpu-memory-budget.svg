<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="gmb-title gmb-desc">
  <title id="gmb-title">GPU memory budget for four serving setups</title>
  <desc id="gmb-desc">Four stacked bars of GPU memory drawn to the same scale, treating GPU sizes as GiB, each split into weights, runtime overhead, KV cache, and an unused 10 percent reserve. An 8B model in 16-bit on a 24 GB GPU: 14.9 GiB of weights, 2 GiB runtime, 4.7 GiB of KV cache, enough for 4.7 full 8K-token conversations. The same model with 4-bit weights: 4.0 GiB of weights and 15.6 GiB of cache, 15.6 conversations. The 16-bit 8B model on an 80 GB GPU: 14.9 GiB of weights and 55.1 GiB of cache, 55.1 conversations. A 70B model with 4-bit weights and an FP8 cache on one 80 GB GPU: 35.5 GiB of weights and 34.5 GiB of cache, 27.6 conversations.</desc>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="220" y="26" width="14" height="14" rx="3" fill="#e5efff" stroke="#4774aa"/>
    <text x="240" y="38" font-size="12" fill="#36424e">weights</text>
    <rect x="320" y="26" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a96a3"/>
    <text x="340" y="38" font-size="12" fill="#36424e">runtime</text>
    <rect x="420" y="26" width="14" height="14" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="440" y="38" font-size="12" fill="#36424e">KV cache</text>
    <rect x="530" y="26" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="3 2"/>
    <text x="550" y="38" font-size="12" fill="#36424e">10% reserve</text>
    <text x="760" y="74" font-size="11.5" fill="#36424e">8K conversations</text>

    <text x="20" y="104" font-size="13" font-weight="bold" fill="#263e5a">8B, 16-bit</text>
    <text x="20" y="121" font-size="12" fill="#36424e">24 GB GPU</text>
    <rect x="220" y="90" width="97" height="36" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="268" y="113" font-size="12" text-anchor="middle" fill="#263e5a">14.9 GiB</text>
    <rect x="317" y="90" width="13" height="36" rx="2" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="330" y="90" width="31" height="36" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
    <rect x="361" y="90" width="16" height="36" rx="2" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="3 2"/>
    <text x="760" y="113" font-size="13" font-weight="bold" fill="#6e2a24">4.7</text>

    <text x="20" y="164" font-size="13" font-weight="bold" fill="#263e5a">8B, 4-bit weights</text>
    <text x="20" y="181" font-size="12" fill="#36424e">24 GB GPU</text>
    <rect x="220" y="150" width="26" height="36" rx="3" fill="#e5efff" stroke="#4774aa"/>
    <rect x="246" y="150" width="13" height="36" rx="2" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="259" y="150" width="101" height="36" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="309" y="173" font-size="12" text-anchor="middle" fill="#463365">15.6 GiB</text>
    <rect x="360" y="150" width="16" height="36" rx="2" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="3 2"/>
    <text x="760" y="173" font-size="13" font-weight="bold" fill="#263e5a">15.6</text>

    <text x="20" y="224" font-size="13" font-weight="bold" fill="#263e5a">8B, 16-bit</text>
    <text x="20" y="241" font-size="12" fill="#36424e">80 GB GPU</text>
    <rect x="220" y="210" width="97" height="36" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="268" y="233" font-size="12" text-anchor="middle" fill="#263e5a">14.9 GiB</text>
    <rect x="317" y="210" width="13" height="36" rx="2" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="330" y="210" width="358" height="36" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="509" y="233" font-size="12" text-anchor="middle" fill="#463365">55.1 GiB of KV cache</text>
    <rect x="688" y="210" width="52" height="36" rx="3" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="3 2"/>
    <text x="760" y="233" font-size="13" font-weight="bold" fill="#294a2e">55.1</text>

    <text x="20" y="284" font-size="13" font-weight="bold" fill="#263e5a">70B, 4-bit, FP8 cache</text>
    <text x="20" y="301" font-size="12" fill="#36424e">80 GB GPU</text>
    <rect x="220" y="270" width="231" height="36" rx="4" fill="#e5efff" stroke="#4774aa"/>
    <text x="335" y="293" font-size="12" text-anchor="middle" fill="#263e5a">35.5 GiB of weights</text>
    <rect x="451" y="270" width="13" height="36" rx="2" fill="#ffffff" stroke="#8a96a3"/>
    <rect x="464" y="270" width="224" height="36" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="576" y="293" font-size="12" text-anchor="middle" fill="#463365">34.5 GiB of KV cache</text>
    <rect x="688" y="270" width="52" height="36" rx="3" fill="#ffffff" stroke="#8a96a3" stroke-dasharray="3 2"/>
    <text x="760" y="293" font-size="13" font-weight="bold" fill="#263e5a">27.6</text>

    <text x="220" y="340" font-size="12" fill="#36424e">Scale: 6.5 px per GiB. Runtime reserve assumed at 2 GiB per GPU.</text>
    <text x="440" y="380" font-size="13" text-anchor="middle" fill="#40566b">Weights are a fixed cost per replica; what remains becomes KV cache, and the cache sets concurrency.</text>
  </g>
</svg>
