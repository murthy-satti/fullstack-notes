<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="fvr-title fvr-desc">
  <title id="fvr-title">Where time and output tokens go in a fast model and a reasoning model</title>
  <desc id="fvr-desc">An illustrative comparison of the same request sent to a fast model and to a reasoning model. On the time axis, the fast model processes the input and starts streaming the answer almost at once, so the first visible token arrives early. The reasoning model processes the input, then spends a long stretch generating hidden reasoning tokens, and only then streams the answer, so the first visible token arrives late. A second pair of bars shows billed output tokens: the fast model is billed for the answer only; the reasoning model is billed for the hidden reasoning tokens plus the answer, which makes its output many times larger even though the visible answer is the same size. Reasoning buys accuracy on hard problems with time and output tokens you never see.</desc>
  <rect width="880" height="380" rx="14" fill="#f5f7fb"/>
  <defs>
    <marker id="fvr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b">The same request on two kinds of model (illustrative proportions)</text>

    <text x="24" y="58" font-size="12" font-weight="700" fill="#40566b">Time to answer</text>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="24" y="92">Fast model</text>
      <text x="24" y="146">Reasoning model</text>
    </g>

    <g stroke-width="1.5">
      <rect x="200" y="72" width="30" height="30" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="72" width="130" height="30" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="200" y="126" width="30" height="30" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="230" y="126" width="470" height="30" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="700" y="126" width="130" height="30" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="295" y="92" fill="#294a2e">answer streams</text>
      <text x="465" y="146" fill="#463365">reasoning tokens: hidden from the user</text>
      <text x="765" y="146" fill="#294a2e">answer streams</text>
    </g>
    <path d="M200 176H846" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#fvr-arrow)"/>
    <text x="846" y="194" font-size="11.5" fill="#40566b" text-anchor="end">time</text>
    <text x="200" y="194" font-size="11.5" fill="#40566b">input processed</text>

    <g stroke="#b5524b" stroke-width="2">
      <path d="M230 66V108"/>
      <path d="M700 120V162"/>
    </g>
    <g font-size="11.5" fill="#6e2a24">
      <text x="368" y="92">first visible token arrives early</text>
      <text x="540" y="116">first visible token arrives late</text>
    </g>

    <text x="24" y="236" font-size="12" font-weight="700" fill="#40566b">Billed output tokens</text>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="24" y="268">Fast model</text>
      <text x="24" y="314">Reasoning model</text>
    </g>
    <g stroke-width="1.5">
      <rect x="200" y="250" width="60" height="28" rx="4" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="200" y="296" width="400" height="28" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="600" y="296" width="60" height="28" rx="4" fill="#e7f3e9" stroke="#53845b"/>
    </g>
    <g font-size="11.5">
      <text x="272" y="268" fill="#294a2e">answer only</text>
      <text x="400" y="314" fill="#463365" text-anchor="middle">reasoning tokens, billed as output</text>
      <text x="630" y="314" fill="#294a2e" text-anchor="middle">answer</text>
      <text x="672" y="314" fill="#36424e">same visible answer</text>
    </g>

    <text x="440" y="360" font-size="13" fill="#40566b" text-anchor="middle">Reasoning buys accuracy on hard problems with time and output tokens you never see.</text>
  </g>
</svg>
