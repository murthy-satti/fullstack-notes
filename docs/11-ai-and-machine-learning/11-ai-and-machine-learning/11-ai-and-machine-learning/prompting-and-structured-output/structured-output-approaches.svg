<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="soa-title soa-desc">
  <title id="soa-title">Three ways to get structured data from a model</title>
  <desc id="soa-desc">Three columns compare JSON mode, schema-constrained output, and tool-based extraction. JSON mode: you ask for a JSON response type and include the word JSON in the prompt; it guarantees syntactically valid JSON unless the output is cut off; it does not guarantee key names, types, required fields, or allowed values; use it only for older models without schema support, and prefer a schema. Schema-constrained output: you send a JSON Schema with the request in strict mode; the output matches the schema unless the model refuses or is cut off; correct values and rules that span several fields are not guaranteed; it is the default for extracting data. Tool-based extraction: you define a tool whose parameters are the schema and the model calls it; the arguments match the schema when the tool is marked strict; it is not guaranteed that the model calls the tool or that the values are correct; use it when the model must also choose between several actions. The bottom strips summarize: shape not enforced, shape enforced during decoding, shape enforced for strict tools. Constrained decoding fixes the shape; your validator still checks the values.</desc>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b">Three ways to get structured data from a model</text>

    <g stroke-width="1.5">
      <rect x="24" y="48" width="264" height="300" rx="8" fill="#ffffff" stroke="#c9d1db"/>
      <rect x="308" y="48" width="264" height="300" rx="8" fill="#ffffff" stroke="#c9d1db"/>
      <rect x="592" y="48" width="264" height="300" rx="8" fill="#ffffff" stroke="#c9d1db"/>
      <rect x="24" y="48" width="264" height="42" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="308" y="48" width="264" height="42" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="592" y="48" width="264" height="42" rx="8" fill="#e5efff" stroke="#4774aa"/>
      <rect x="24" y="358" width="264" height="36" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
      <rect x="308" y="358" width="264" height="36" rx="8" fill="#e7f3e9" stroke="#53845b"/>
      <rect x="592" y="358" width="264" height="36" rx="8" fill="#e5efff" stroke="#4774aa"/>
    </g>

    <g font-size="14" font-weight="700">
      <text x="38" y="74" fill="#6e2a24">JSON mode</text>
      <text x="322" y="74" fill="#294a2e">Schema-constrained output</text>
      <text x="606" y="74" fill="#263e5a">Tool-based extraction</text>
    </g>

    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="38" y="114">How you ask</text>
      <text x="38" y="175">Guaranteed</text>
      <text x="38" y="236">Not guaranteed</text>
      <text x="38" y="297">Use it when</text>
      <text x="322" y="114">How you ask</text>
      <text x="322" y="175">Guaranteed</text>
      <text x="322" y="236">Not guaranteed</text>
      <text x="322" y="297">Use it when</text>
      <text x="606" y="114">How you ask</text>
      <text x="606" y="175">Guaranteed</text>
      <text x="606" y="236">Not guaranteed</text>
      <text x="606" y="297">Use it when</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="38" y="132">A JSON response type, plus the</text>
      <text x="38" y="149">word JSON in the prompt</text>
      <text x="38" y="193">Syntactically valid JSON</text>
      <text x="38" y="210">(unless the output is cut off)</text>
      <text x="38" y="254">Key names, types, required</text>
      <text x="38" y="271">fields, allowed values</text>
      <text x="38" y="315">Older models without schema</text>
      <text x="38" y="332">support; prefer a schema</text>

      <text x="322" y="132">A JSON Schema sent with the</text>
      <text x="322" y="149">request, in strict mode</text>
      <text x="322" y="193">Output matches the schema, unless</text>
      <text x="322" y="210">the model refuses or is cut off</text>
      <text x="322" y="254">Correct values, and rules that</text>
      <text x="322" y="271">span several fields</text>
      <text x="322" y="315">Extracting data: the default</text>
      <text x="322" y="332">for most features</text>

      <text x="606" y="132">A tool whose parameters are the</text>
      <text x="606" y="149">schema; the model calls the tool</text>
      <text x="606" y="193">Arguments match the schema when</text>
      <text x="606" y="210">the tool is marked strict</text>
      <text x="606" y="254">That the model calls the tool,</text>
      <text x="606" y="271">or that the values are correct</text>
      <text x="606" y="315">The model must also choose</text>
      <text x="606" y="332">between several actions</text>
    </g>

    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="156" y="381" fill="#6e2a24">Shape: not enforced</text>
      <text x="440" y="381" fill="#294a2e">Shape: enforced during decoding</text>
      <text x="724" y="381" fill="#263e5a">Shape: enforced for strict tools</text>
    </g>

    <text x="440" y="424" font-size="13" fill="#40566b" text-anchor="middle">Constrained decoding fixes the shape; your validator still checks the values.</text>
  </g>
</svg>
