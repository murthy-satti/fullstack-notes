<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="mof-title mof-desc">
  <title id="mof-title">OAuth for a remote MCP server</title>
  <desc id="mof-desc">Sequence between four participants: the MCP client in an AI host, the user's browser, the authorization server, and the TaskFlow MCP server. The client calls the server without a token and gets 401 with a WWW-Authenticate header naming the protected resource metadata URL. The client reads that metadata to learn the authorization server, then reads the authorization server's metadata. It opens the browser for an authorization request with PKCE and a resource parameter naming the MCP server; the user signs in and consents. The client exchanges the code and verifier, with the same resource, for an access token whose audience is the MCP server. It retries the call with the bearer token. The server checks issuer, audience, expiry and scope, and runs the tool. It never forwards the client's token to other APIs.</desc>
  <defs>
    <marker id="mof-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="880" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="30" y="20" width="150" height="38" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="105" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">MCP client</text>
    <rect x="250" y="20" width="150" height="38" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="325" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">User's browser</text>
    <rect x="460" y="20" width="190" height="38" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="555" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#263e5a">Authorization server</text>
    <rect x="700" y="20" width="160" height="38" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="780" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#463365">MCP server</text>

    <line x1="105" y1="58" x2="105" y2="420" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="325" y1="58" x2="325" y2="420" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="555" y1="58" x2="555" y2="420" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="780" y1="58" x2="780" y2="420" stroke="#c9d1db" stroke-width="1.5" stroke-dasharray="4 4"/>

    <line x1="105" y1="88" x2="778" y2="88" stroke="#40566b" stroke-width="1.5" marker-end="url(#mof-arrow)"/>
    <rect x="325" y="69" width="230" height="17" rx="4" fill="#f5f7fb"/>
    <text x="440" y="82" text-anchor="middle" font-size="12" fill="#36424e">1. tools/call without a token</text>
    <line x1="780" y1="118" x2="107" y2="118" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mof-arrow)"/>
    <rect x="275" y="99" width="330" height="17" rx="4" fill="#f5f7fb"/>
    <text x="440" y="112" text-anchor="middle" font-size="12" fill="#36424e">2. 401, WWW-Authenticate: resource_metadata</text>
    <line x1="105" y1="148" x2="778" y2="148" stroke="#40566b" stroke-width="1.5" marker-end="url(#mof-arrow)"/>
    <rect x="268" y="129" width="344" height="17" rx="4" fill="#f5f7fb"/>
    <text x="440" y="142" text-anchor="middle" font-size="12" fill="#36424e">3. GET protected resource metadata (RFC 9728)</text>
    <line x1="105" y1="178" x2="553" y2="178" stroke="#40566b" stroke-width="1.5" marker-end="url(#mof-arrow)"/>
    <rect x="230" y="159" width="200" height="17" rx="4" fill="#f5f7fb"/>
    <text x="330" y="172" text-anchor="middle" font-size="12" fill="#36424e">4. GET auth server metadata</text>
    <line x1="105" y1="212" x2="323" y2="212" stroke="#40566b" stroke-width="1.5" marker-end="url(#mof-arrow)"/>
    <text x="215" y="205" text-anchor="middle" font-size="12" fill="#36424e">5. open authorize URL</text>
    <line x1="325" y1="246" x2="553" y2="246" stroke="#40566b" stroke-width="1.5" marker-end="url(#mof-arrow)"/>
    <text x="440" y="239" text-anchor="middle" font-size="12" fill="#36424e">6. PKCE + resource, user consents</text>
    <line x1="553" y1="280" x2="107" y2="280" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mof-arrow)"/>
    <rect x="245" y="261" width="170" height="17" rx="4" fill="#f5f7fb"/>
    <text x="330" y="274" text-anchor="middle" font-size="12" fill="#36424e">7. code via redirect</text>
    <line x1="105" y1="314" x2="553" y2="314" stroke="#40566b" stroke-width="1.5" marker-end="url(#mof-arrow)"/>
    <rect x="172" y="295" width="316" height="17" rx="4" fill="#f5f7fb"/>
    <text x="330" y="308" text-anchor="middle" font-size="12" fill="#36424e">8. code + verifier + resource for a token</text>
    <line x1="105" y1="348" x2="778" y2="348" stroke="#40566b" stroke-width="1.5" marker-end="url(#mof-arrow)"/>
    <rect x="279" y="329" width="322" height="17" rx="4" fill="#f5f7fb"/>
    <text x="440" y="342" text-anchor="middle" font-size="12" fill="#36424e">9. tools/call, Bearer token (aud = server)</text>
    <rect x="630" y="358" width="230" height="60" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="745" y="376" text-anchor="middle" font-size="12" fill="#36424e">10. check issuer, audience,</text>
    <text x="745" y="393" text-anchor="middle" font-size="12" fill="#36424e">expiry and scope; never</text>
    <text x="745" y="410" text-anchor="middle" font-size="12" fill="#36424e">pass the token on</text>

    <text x="440" y="452" text-anchor="middle" font-size="13" fill="#40566b">The resource parameter binds the token to one server, so it is useless anywhere else.</text>
  </g>
</svg>
