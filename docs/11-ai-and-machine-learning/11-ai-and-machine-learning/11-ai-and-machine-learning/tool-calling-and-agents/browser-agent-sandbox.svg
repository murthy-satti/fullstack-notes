<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="bas-title bas-desc">
  <title id="bas-title">Sandbox for a browser agent</title>
  <desc id="bas-desc">The browser agent runs in a disposable container or virtual machine with a non-root user, a read-only root file system, no host mounts and CPU and memory limits. Inside it, a browser with a fresh profile and no saved credentials is driven by the executor, which checks URLs, keeps risky members disabled and asks a person to approve actions through the TaskFlow approval screen. All traffic leaves through an egress proxy that allows only the task's domains and blocks private ranges and the cloud metadata address. Allowed traffic reaches the vendor portal; traffic to internal services, the metadata endpoint or other sites is refused.</desc>
  <defs>
    <marker id="bas-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="bas-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#b5524b"/></marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="20" y="30" width="430" height="330" rx="12" fill="#e5efff" stroke="#4774aa"/>
    <text x="40" y="56" font-size="14" font-weight="700" fill="#263e5a">Disposable container or VM</text>
    <text x="40" y="76" font-size="12" fill="#36424e">non-root, read-only root FS, no host mounts,</text>
    <text x="40" y="94" font-size="12" fill="#36424e">CPU and memory limits, deleted after the task</text>

    <rect x="44" y="114" width="382" height="92" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="235" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#463365">Executor</text>
    <text x="235" y="160" text-anchor="middle" font-size="12" fill="#36424e">URL check before and after navigation</text>
    <text x="235" y="178" text-anchor="middle" font-size="12" fill="#36424e">risky members off, approval for actions</text>
    <text x="235" y="196" text-anchor="middle" font-size="12" fill="#36424e">logs every action and screenshot</text>

    <rect x="44" y="236" width="382" height="100" rx="10" fill="#ffffff" stroke="#4774aa"/>
    <text x="235" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#263e5a">Browser</text>
    <text x="235" y="284" text-anchor="middle" font-size="12" fill="#36424e">fresh profile, no saved logins or cookies</text>
    <text x="235" y="302" text-anchor="middle" font-size="12" fill="#36424e">dedicated low-privilege account if a login</text>
    <text x="235" y="320" text-anchor="middle" font-size="12" fill="#36424e">is unavoidable</text>
    <line x1="235" y1="206" x2="235" y2="234" stroke="#40566b" stroke-width="1.6" marker-end="url(#bas-arrow)"/>

    <rect x="490" y="30" width="370" height="70" rx="10" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="675" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#66400f">TaskFlow approval screen</text>
    <text x="675" y="78" text-anchor="middle" font-size="12" fill="#36424e">a person approves each consequential action</text>
    <line x1="426" y1="150" x2="488" y2="76" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#bas-arrow)"/>

    <rect x="490" y="200" width="200" height="110" rx="10" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="590" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#463365">Egress proxy</text>
    <text x="590" y="248" text-anchor="middle" font-size="12" fill="#36424e">task's domains only</text>
    <text x="590" y="266" text-anchor="middle" font-size="12" fill="#36424e">blocks private ranges</text>
    <text x="590" y="284" text-anchor="middle" font-size="12" fill="#36424e">and 169.254.169.254</text>
    <line x1="426" y1="286" x2="488" y2="262" stroke="#40566b" stroke-width="1.6" marker-end="url(#bas-arrow)"/>

    <rect x="730" y="140" width="130" height="52" rx="10" fill="#e7f3e9" stroke="#53845b"/>
    <text x="795" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#294a2e">Vendor portal</text>
    <text x="795" y="181" text-anchor="middle" font-size="12" fill="#36424e">allowed</text>
    <rect x="730" y="214" width="130" height="52" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="795" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6e2a24">Internal APIs</text>
    <text x="795" y="255" text-anchor="middle" font-size="12" fill="#36424e">refused</text>
    <rect x="730" y="288" width="130" height="52" rx="10" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="795" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6e2a24">Other sites</text>
    <text x="795" y="329" text-anchor="middle" font-size="12" fill="#36424e">refused</text>
    <line x1="690" y1="236" x2="728" y2="170" stroke="#40566b" stroke-width="1.6" marker-end="url(#bas-arrow)"/>
    <line x1="690" y1="252" x2="728" y2="242" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#bas-arrow-red)"/>
    <line x1="690" y1="270" x2="728" y2="312" stroke="#b5524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#bas-arrow-red)"/>

    <text x="440" y="400" text-anchor="middle" font-size="13" fill="#40566b">Assume the page will try to misuse the agent; each layer limits what that can reach.</text>
  </g>
</svg>
