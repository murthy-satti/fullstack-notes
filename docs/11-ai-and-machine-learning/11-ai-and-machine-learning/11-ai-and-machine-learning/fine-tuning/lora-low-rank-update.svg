<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="llu-title llu-desc">
  <title id="llu-title">The LoRA update beside a frozen weight matrix</title>
  <desc id="llu-desc">An input vector x of size 4,096 takes two paths. The frozen path multiplies by W, a 4,096 by 4,096 matrix with 16.8 million weights that are not trained. The trainable path multiplies by A, 16 by 4,096, then by B, 4,096 by 16, which starts at zero, and then scales by alpha over r. A and B together hold 131,072 weights, 0.8 percent of W. Both paths are added to produce the output h. After training, the product of B and A times alpha over r can be merged into W once, so the model has no extra latency, or kept as a separate adapter file that can be swapped.</desc>
  <defs>
    <marker id="llu-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
  </defs>
  <rect width="860" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- input -->
    <rect x="20" y="170" width="110" height="50" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="75" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">x</text>
    <text x="75" y="210" text-anchor="middle" font-size="11.5" fill="#66400f">4,096 values</text>
    <line x1="130" y1="185" x2="198" y2="112" stroke="#40566b" stroke-width="1.5" marker-end="url(#llu-arrow)"/>
    <line x1="130" y1="205" x2="198" y2="272" stroke="#40566b" stroke-width="1.5" marker-end="url(#llu-arrow)"/>

    <!-- frozen path -->
    <rect x="200" y="40" width="180" height="140" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="290" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">W (frozen)</text>
    <text x="290" y="114" text-anchor="middle" font-size="12" fill="#263e5a">4,096 x 4,096</text>
    <text x="290" y="134" text-anchor="middle" font-size="12" fill="#263e5a">16.8 million weights</text>
    <path d="M380 110 H720 V130" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#llu-arrow)"/>
    <text x="550" y="100" text-anchor="middle" font-size="12" fill="#36424e">frozen path: W x</text>

    <!-- trainable path -->
    <rect x="200" y="250" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="290" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#66400f">A: 16 x 4,096</text>
    <text x="290" y="285" text-anchor="middle" font-size="11.5" fill="#66400f">trainable, random init</text>
    <line x1="380" y1="272" x2="418" y2="272" stroke="#40566b" stroke-width="1.5" marker-end="url(#llu-arrow)"/>
    <rect x="420" y="250" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="510" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#66400f">B: 4,096 x 16</text>
    <text x="510" y="285" text-anchor="middle" font-size="11.5" fill="#66400f">trainable, starts at zero</text>
    <line x1="600" y1="272" x2="622" y2="272" stroke="#40566b" stroke-width="1.5" marker-end="url(#llu-arrow)"/>
    <circle cx="650" cy="272" r="26" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="650" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#463365">alpha/r</text>
    <path d="M676 272 H720 V170" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#llu-arrow)"/>
    <text x="400" y="322" text-anchor="middle" font-size="12" fill="#36424e">trainable path: (alpha / r) B A x</text>
    <text x="400" y="342" text-anchor="middle" font-size="12" fill="#36424e">A + B = 131,072 weights, 0.8% of W</text>

    <!-- sum and output -->
    <circle cx="720" cy="150" r="18" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
    <text x="720" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#36424e">+</text>
    <line x1="738" y1="150" x2="768" y2="150" stroke="#40566b" stroke-width="1.5" marker-end="url(#llu-arrow)"/>
    <rect x="770" y="128" width="70" height="44" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="805" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#294a2e">h</text>

    <!-- after training -->
    <rect x="20" y="368" width="820" height="56" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="430" y="390" text-anchor="middle" font-size="12.5" fill="#294a2e">After training: merge once, W + (alpha / r) B A, for a standalone model with no extra latency,</text>
    <text x="430" y="410" text-anchor="middle" font-size="12.5" fill="#294a2e">or keep A and B as a separate adapter file that can be loaded and swapped at serving time.</text>

    <text x="430" y="452" text-anchor="middle" font-size="13" fill="#40566b">LoRA trains a small low-rank change beside each frozen layer instead of the layer itself.</text>
  </g>
</svg>
