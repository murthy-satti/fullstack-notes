<svg xmlns="http://www.w3.org/2000/svg" width="860" height="700" viewBox="0 0 860 700" role="img" aria-labelledby="wft-title wft-desc">
  <title id="wft-title">Should we fine-tune? A decision flow</title>
  <desc id="wft-desc">Start from a failing evaluation case. First question: is the failure about missing, private, or changing knowledge? If yes, use retrieval or a tool. If no, second question: is the output invalid JSON or the wrong shape? If yes, enforce a schema with structured output and validation. If no, third question: does a strong prompt with examples pass the evaluation? If yes, ship the prompt and keep the evaluation as a regression test; if it passes but is too slow or costly at high volume, run a fine-tuning experiment with a smaller model. If no, fourth question: is the behavior gap consistent, the task stable, and are hundreds of good examples available? If yes, run a fine-tuning experiment that must beat the prompted baseline on the test set. If no, collect and label data and improve the prompt meanwhile.</desc>
  <defs>
    <marker id="wft-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="wft-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="860" height="700" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- start -->
    <rect x="160" y="20" width="280" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="300" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">A failing evaluation case</text>
    <line x1="300" y1="60" x2="300" y2="83" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>

    <!-- decision 1 -->
    <polygon points="300,85 450,130 300,175 150,130" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
    <text x="300" y="126" text-anchor="middle" font-size="12" fill="#36424e">Missing, private, or</text>
    <text x="300" y="142" text-anchor="middle" font-size="12" fill="#36424e">changing knowledge?</text>
    <line x1="450" y1="130" x2="558" y2="130" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="504" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#294a2e">Yes</text>
    <rect x="560" y="104" width="280" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="700" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Use RAG or a tool</text>
    <text x="700" y="144" text-anchor="middle" font-size="11.5" fill="#263e5a">retrieval, citations, live data</text>
    <line x1="300" y1="175" x2="300" y2="208" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="310" y="196" font-size="12" font-weight="bold" fill="#6e2a24">No</text>

    <!-- decision 2 -->
    <polygon points="300,210 450,255 300,300 150,255" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
    <text x="300" y="251" text-anchor="middle" font-size="12" fill="#36424e">Invalid JSON or</text>
    <text x="300" y="267" text-anchor="middle" font-size="12" fill="#36424e">wrong output shape?</text>
    <line x1="450" y1="255" x2="558" y2="255" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="504" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#294a2e">Yes</text>
    <rect x="560" y="229" width="280" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="700" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#263e5a">Enforce a schema</text>
    <text x="700" y="269" text-anchor="middle" font-size="11.5" fill="#263e5a">structured output, validation</text>
    <line x1="300" y1="300" x2="300" y2="333" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="310" y="321" font-size="12" font-weight="bold" fill="#6e2a24">No</text>

    <!-- decision 3 -->
    <polygon points="300,335 450,380 300,425 150,380" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
    <text x="300" y="376" text-anchor="middle" font-size="12" fill="#36424e">Strong prompt with</text>
    <text x="300" y="392" text-anchor="middle" font-size="12" fill="#36424e">examples passes eval?</text>
    <line x1="450" y1="380" x2="558" y2="380" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="504" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#294a2e">Yes</text>
    <rect x="560" y="354" width="280" height="52" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="700" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#294a2e">Ship the prompt</text>
    <text x="700" y="394" text-anchor="middle" font-size="11.5" fill="#294a2e">keep the eval as a regression test</text>
    <line x1="300" y1="425" x2="300" y2="458" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="310" y="446" font-size="12" font-weight="bold" fill="#6e2a24">No</text>

    <!-- high-volume path -->
    <line x1="700" y1="406" x2="700" y2="477" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#wft-arrow-dash)"/>
    <rect x="596" y="433" width="208" height="18" rx="4" fill="#f5f7fb"/>
    <text x="700" y="446" text-anchor="middle" font-size="11.5" fill="#36424e">too slow or costly at volume</text>

    <!-- decision 4 -->
    <polygon points="300,460 450,505 300,550 150,505" fill="#ffffff" stroke="#40566b" stroke-width="1.5"/>
    <text x="300" y="501" text-anchor="middle" font-size="12" fill="#36424e">Consistent gap, stable task,</text>
    <text x="300" y="517" text-anchor="middle" font-size="12" fill="#36424e">hundreds of good examples?</text>
    <line x1="450" y1="505" x2="558" y2="505" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="504" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#294a2e">Yes</text>
    <rect x="560" y="479" width="280" height="52" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="700" y="501" text-anchor="middle" font-size="14" font-weight="bold" fill="#66400f">Fine-tuning experiment</text>
    <text x="700" y="519" text-anchor="middle" font-size="11.5" fill="#66400f">must beat the prompted baseline</text>
    <line x1="300" y1="550" x2="300" y2="583" stroke="#40566b" stroke-width="1.5" marker-end="url(#wft-arrow)"/>
    <text x="310" y="571" font-size="12" font-weight="bold" fill="#6e2a24">No</text>
    <rect x="150" y="585" width="300" height="52" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="300" y="607" text-anchor="middle" font-size="14" font-weight="bold" fill="#463365">Collect and label data</text>
    <text x="300" y="625" text-anchor="middle" font-size="11.5" fill="#463365">improve the prompt meanwhile</text>

    <text x="430" y="676" text-anchor="middle" font-size="13" fill="#40566b">Fine-tuning is the last rung: it fixes consistent behavior gaps and cost at volume, not knowledge.</text>
  </g>
</svg>
