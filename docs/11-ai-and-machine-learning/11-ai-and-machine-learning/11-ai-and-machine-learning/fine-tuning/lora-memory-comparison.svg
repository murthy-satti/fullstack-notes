<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="lmc-title lmc-desc">
  <title id="lmc-title">Training memory for an 8B model: full fine-tuning, LoRA, and QLoRA</title>
  <desc id="lmc-desc">Three horizontal bars on a shared scale from 0 to 128 gigabytes, for an 8-billion-parameter model with a rank-16 adapter on all linear layers, before activations. Full fine-tuning: 128 GB, made of 16 GB of 16-bit weights and 112 GB of gradients, master weights, and Adam state. LoRA on a 16-bit base: about 16.7 GB, almost all frozen weights, plus a thin sliver of about 0.7 GB for the adapter and its optimizer state. QLoRA on a 4-bit base: about 4.7 GB, 4 GB of 4-bit weights plus the same sliver. A legend explains the colors, and a note says activations add more memory and grow with batch size and sequence length.</desc>
  <rect width="860" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <!-- axis -->
    <g font-size="11.5" fill="#36424e" text-anchor="middle">
      <text x="220" y="44">0</text><text x="370" y="44">32 GB</text><text x="520" y="44">64 GB</text><text x="670" y="44">96 GB</text><text x="820" y="44">128 GB</text>
    </g>
    <g stroke="#c9d1db" stroke-width="1">
      <line x1="220" y1="52" x2="220" y2="272"/><line x1="370" y1="52" x2="370" y2="272"/><line x1="520" y1="52" x2="520" y2="272"/><line x1="670" y1="52" x2="670" y2="272"/><line x1="820" y1="52" x2="820" y2="272"/>
    </g>

    <!-- full fine-tuning -->
    <text x="20" y="84" font-size="13" font-weight="bold" fill="#36424e">Full fine-tuning</text>
    <text x="20" y="101" font-size="11.5" fill="#36424e">16 bytes per weight</text>
    <rect x="220" y="68" width="75" height="40" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="257" y="93" text-anchor="middle" font-size="11.5" fill="#263e5a">16 GB</text>
    <rect x="295" y="68" width="525" height="40" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <text x="557" y="93" text-anchor="middle" font-size="12" fill="#6e2a24">gradients, master weights, Adam state: 112 GB</text>

    <!-- LoRA -->
    <text x="20" y="164" font-size="13" font-weight="bold" fill="#36424e">LoRA, 16-bit base</text>
    <text x="20" y="181" font-size="11.5" fill="#36424e">frozen weights + adapter</text>
    <rect x="220" y="148" width="75" height="40" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="295" y="148" width="4" height="40" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="312" y="173" font-size="12.5" font-weight="bold" fill="#263e5a">about 16.7 GB</text>

    <!-- QLoRA -->
    <text x="20" y="244" font-size="13" font-weight="bold" fill="#36424e">QLoRA, 4-bit base</text>
    <text x="20" y="261" font-size="11.5" fill="#36424e">NF4 weights + adapter</text>
    <rect x="220" y="228" width="19" height="40" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="239" y="228" width="4" height="40" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="256" y="253" font-size="12.5" font-weight="bold" fill="#294a2e">about 4.7 GB</text>

    <!-- legend -->
    <g font-size="11.5" fill="#36424e">
      <rect x="20" y="292" width="14" height="14" fill="#e5efff" stroke="#4774aa"/><text x="40" y="304">16-bit weights</text>
      <rect x="150" y="292" width="14" height="14" fill="#e7f3e9" stroke="#53845b"/><text x="170" y="304">4-bit weights</text>
      <rect x="275" y="292" width="14" height="14" fill="#fff0d9" stroke="#bd7a20"/><text x="295" y="304">adapter + its optimizer state (0.7 GB)</text>
      <rect x="560" y="292" width="14" height="14" fill="#fbe9e7" stroke="#b5524b"/><text x="580" y="304">gradients and optimizer state</text>
    </g>

    <text x="430" y="342" text-anchor="middle" font-size="13" fill="#40566b">Estimates before activations, which add more memory and grow with batch size and sequence length.</text>
  </g>
</svg>
