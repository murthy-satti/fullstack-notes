<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="psp-title psp-desc">
  <title id="psp-title">Privilege separation with a planner, a controller, and a quarantined model</title>
  <desc id="psp-desc">The user asks: email me this week's summary. The request goes to the controller, which is plain code. The controller sends only the request to the privileged LLM, which writes a plan of tool calls: one, notes equals search_notes for this week; two, a variable S equals the quarantined model's summary of the notes; three, send_email to the signed-in user with body S. The plan is fixed before any note is read, and the controller runs it. Inside a dashed red untrusted zone, step 1 fetches the notes, one of which is planted, and passes them to the quarantined LLM, which has no tools and returns only a value, S, to the controller. Step 3 sends S through a policy check that requires the recipient to be the signed-in user, and only then does send_email run. A note explains that when a note carries an injection, only S, the summary text, can change; the plan, the tools and the recipient were fixed before any note was read. Caption: the privileged LLM plans from the request alone, and the quarantined LLM's output reaches the controller as a value that is never fed back to the planner.</desc>
  <defs>
    <marker id="psp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Privilege separation: the planner never reads untrusted text</text>

    <!-- untrusted zone -->
    <rect x="18" y="376" width="478" height="114" rx="10" fill="none" stroke="#b5524b" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="30" y="478" font-size="12" fill="#6e2a24">Untrusted zone: text here may carry instructions</text>

    <!-- user -->
    <rect x="30" y="215" width="130" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="45" y="239" font-size="14" font-weight="bold" fill="#66400f">User</text>
    <text x="45" y="257" font-size="11.5" fill="#36424e">"Email me this</text>
    <text x="45" y="273" font-size="11.5" fill="#36424e">week's summary"</text>

    <!-- privileged LLM -->
    <rect x="250" y="62" width="230" height="72" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="265" y="86" font-size="14" font-weight="bold" fill="#463365">Privileged LLM</text>
    <text x="265" y="105" font-size="11.5" fill="#36424e">sees only the request,</text>
    <text x="265" y="122" font-size="11.5" fill="#36424e">writes a plan of tool calls</text>

    <!-- plan -->
    <rect x="560" y="50" width="310" height="100" rx="8" fill="#ffffff" stroke="#8a96a3"/>
    <text x="575" y="72" font-size="12.5" font-weight="bold" fill="#36424e">Plan, fixed before any note is read</text>
    <text x="575" y="94" font-size="12" fill="#36424e">1. notes = search_notes(this week)</text>
    <text x="575" y="113" font-size="12" fill="#36424e">2. $S = quarantined.summarize(notes)</text>
    <text x="575" y="132" font-size="12" fill="#36424e">3. send_email(to: me, body: $S)</text>

    <!-- controller -->
    <rect x="250" y="200" width="230" height="100" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.6"/>
    <text x="265" y="224" font-size="14" font-weight="bold" fill="#263e5a">Controller (plain code)</text>
    <text x="265" y="244" font-size="11.5" fill="#36424e">runs the plan step by step,</text>
    <text x="265" y="261" font-size="11.5" fill="#36424e">keeps values in variables,</text>
    <text x="265" y="278" font-size="11.5" fill="#36424e">checks policy before acting</text>

    <!-- search_notes tool -->
    <rect x="30" y="392" width="170" height="64" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="45" y="414" font-size="14" font-weight="bold" fill="#263e5a">search_notes</text>
    <text x="45" y="431" font-size="11.5" fill="#36424e">returns notes,</text>
    <text x="45" y="447" font-size="11.5" fill="#6e2a24">one of them planted</text>

    <!-- quarantined LLM -->
    <rect x="250" y="392" width="230" height="64" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="265" y="414" font-size="14" font-weight="bold" fill="#463365">Quarantined LLM</text>
    <text x="265" y="431" font-size="11.5" fill="#36424e">reads the notes; no tools;</text>
    <text x="265" y="447" font-size="11.5" fill="#36424e">returns only a value</text>

    <!-- policy and action -->
    <rect x="560" y="215" width="150" height="70" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="575" y="239" font-size="14" font-weight="bold" fill="#294a2e">Policy check</text>
    <text x="575" y="257" font-size="11.5" fill="#36424e">recipient must be</text>
    <text x="575" y="273" font-size="11.5" fill="#36424e">the signed-in user</text>
    <rect x="750" y="215" width="120" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="765" y="239" font-size="14" font-weight="bold" fill="#263e5a">send_email</text>
    <text x="765" y="257" font-size="11.5" fill="#36424e">runs only if</text>
    <text x="765" y="273" font-size="11.5" fill="#36424e">the check passes</text>

    <!-- outcome note -->
    <rect x="560" y="330" width="310" height="100" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="575" y="352" font-size="12.5" font-weight="bold" fill="#294a2e">When a note carries an injection</text>
    <text x="575" y="372" font-size="12" fill="#36424e">only $S, the summary text, can change.</text>
    <text x="575" y="391" font-size="12" fill="#36424e">The plan, the tools, and the recipient</text>
    <text x="575" y="410" font-size="12" fill="#36424e">were fixed before any note was read.</text>

    <!-- arrows -->
    <g stroke="#40566b" stroke-width="1.6" fill="none">
      <line x1="160" y1="250" x2="248" y2="250" marker-end="url(#psp-arrow)"/>
      <line x1="330" y1="200" x2="330" y2="136" marker-end="url(#psp-arrow)"/>
      <line x1="480" y1="98" x2="558" y2="98" marker-end="url(#psp-arrow)"/>
      <line x1="600" y1="150" x2="482" y2="206" marker-end="url(#psp-arrow)"/>
      <line x1="275" y1="300" x2="150" y2="390" marker-end="url(#psp-arrow)"/>
      <line x1="200" y1="424" x2="248" y2="424" stroke="#b5524b" marker-end="url(#psp-arrow)"/>
      <line x1="480" y1="250" x2="558" y2="250" marker-end="url(#psp-arrow)"/>
      <line x1="710" y1="250" x2="748" y2="250" marker-end="url(#psp-arrow)"/>
    </g>
    <line x1="400" y1="392" x2="400" y2="302" stroke="#60788d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#psp-arrow)"/>

    <!-- arrow labels -->
    <g font-size="12" fill="#36424e">
      <rect x="176" y="230" width="56" height="15" fill="#f5f7fb"/>
      <text x="180" y="242">request</text>
      <rect x="336" y="160" width="86" height="15" fill="#f5f7fb"/>
      <text x="340" y="172">request only</text>
      <rect x="497" y="78" width="46" height="15" fill="#f5f7fb"/>
      <text x="500" y="90">writes</text>
      <rect x="512" y="166" width="32" height="15" fill="#f5f7fb"/>
      <text x="515" y="178">runs</text>
      <rect x="148" y="320" width="58" height="15" fill="#f5f7fb"/>
      <text x="152" y="332">1. fetch</text>
      <rect x="203" y="400" width="42" height="15" fill="#f5f7fb"/>
      <text x="206" y="412">notes</text>
      <rect x="406" y="330" width="88" height="15" fill="#f5f7fb"/>
      <text x="410" y="342">2. $S, a value</text>
      <rect x="486" y="230" width="70" height="15" fill="#f5f7fb"/>
      <text x="489" y="242">3. send $S</text>
    </g>

    <text x="30" y="521" font-size="13" fill="#40566b">The privileged LLM plans from the request alone. The quarantined LLM reads the notes but has no tools,</text>
    <text x="30" y="540" font-size="13" fill="#40566b">and its output reaches the controller as a value that is never fed back to the planner.</text>
  </g>
</svg>
