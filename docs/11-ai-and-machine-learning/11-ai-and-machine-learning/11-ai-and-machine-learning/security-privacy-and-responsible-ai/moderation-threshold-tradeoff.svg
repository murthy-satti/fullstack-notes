<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="mtt-title mtt-desc">
  <title id="mtt-title">Precision, recall, and false alarms across moderation thresholds</title>
  <desc id="mtt-desc">A line chart for a synthetic set of 10,000 shared comments in which 50, or 0.5%, violate the harassment policy. The x axis is the blocking threshold from 0.1 to 0.9. Precision rises from 0.07 at 0.1 to 0.23 at 0.2, 0.49 at 0.3, 0.81 at 0.4, 0.96 at 0.5, and 1.00 from 0.6 upward. Recall falls from 1.00 at 0.1 and 0.2 to 0.98 at 0.3, 0.96 at 0.4, 0.88 at 0.5, 0.78 at 0.6, 0.62 at 0.7, 0.48 at 0.8, and 0.34 at 0.9. False alarms per 10,000 comments are 679, 164, 52, 11, 2, and then 0. A dashed marker at 0.4 shows the chosen threshold: the highest one that keeps recall at or above 0.90. A side panel explains the counts: at 0.4, 48 violations are caught, 2 are missed, and there are 11 false alarms; at 0.2 all 50 are caught with 164 false alarms; at 0.6, 39 are caught with none. Caption: when violations are rare, false alarms dominate at low thresholds, so pick the threshold from your own labeled data and a recall target.</desc>
  <rect width="900" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Choosing a threshold: precision, recall, and false alarms (synthetic data)</text>

    <!-- axes and grid -->
    <g stroke="#c9d1db" stroke-width="1">
      <line x1="80" y1="80" x2="620" y2="80"/>
      <line x1="80" y1="200" x2="620" y2="200"/>
    </g>
    <line x1="80" y1="320" x2="620" y2="320" stroke="#8a96a3" stroke-width="1.4"/>
    <line x1="80" y1="70" x2="80" y2="320" stroke="#8a96a3" stroke-width="1.4"/>
    <g font-size="12" fill="#36424e" text-anchor="end">
      <text x="72" y="84">1.0</text>
      <text x="72" y="204">0.5</text>
      <text x="72" y="324">0</text>
    </g>
    <g font-size="12" fill="#36424e" text-anchor="middle">
      <text x="80" y="338">0.1</text>
      <text x="147.5" y="338">0.2</text>
      <text x="215" y="338">0.3</text>
      <text x="282.5" y="338">0.4</text>
      <text x="350" y="338">0.5</text>
      <text x="417.5" y="338">0.6</text>
      <text x="485" y="338">0.7</text>
      <text x="552.5" y="338">0.8</text>
      <text x="620" y="338">0.9</text>
    </g>
    <text x="350" y="356" font-size="12" fill="#40566b" text-anchor="middle">blocking threshold</text>

    <!-- chosen threshold -->
    <line x1="282.5" y1="70" x2="282.5" y2="320" stroke="#53845b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <rect x="290" y="250" width="182" height="34" rx="6" fill="#e7f3e9" stroke="#53845b"/>
    <text x="298" y="264" font-size="11.5" font-weight="bold" fill="#294a2e">0.4: highest with recall 0.90+</text>
    <text x="298" y="279" font-size="11.5" fill="#36424e">recall 0.96, precision 0.81</text>

    <!-- recall -->
    <polyline points="80,80 147.5,80 215,85.2 282.5,89.6 350,108.8 417.5,132.8 485,171.2 552.5,204.8 620,238.4" fill="none" stroke="#53845b" stroke-width="2.4"/>
    <g fill="#53845b">
      <circle cx="80" cy="80" r="3.5"/><circle cx="147.5" cy="80" r="3.5"/><circle cx="215" cy="85.2" r="3.5"/>
      <circle cx="282.5" cy="89.6" r="3.5"/><circle cx="350" cy="108.8" r="3.5"/><circle cx="417.5" cy="132.8" r="3.5"/>
      <circle cx="485" cy="171.2" r="3.5"/><circle cx="552.5" cy="204.8" r="3.5"/><circle cx="620" cy="238.4" r="3.5"/>
    </g>
    <!-- precision -->
    <polyline points="80,303.2 147.5,264.8 215,202.4 282.5,125.6 350,89.6 417.5,80 485,80 552.5,80 620,80" fill="none" stroke="#4774aa" stroke-width="2.4"/>
    <g fill="#4774aa">
      <circle cx="80" cy="303.2" r="3.5"/><circle cx="147.5" cy="264.8" r="3.5"/><circle cx="215" cy="202.4" r="3.5"/>
      <circle cx="282.5" cy="125.6" r="3.5"/><circle cx="350" cy="89.6" r="3.5"/><circle cx="417.5" cy="80" r="3.5"/>
      <circle cx="485" cy="80" r="3.5"/><circle cx="552.5" cy="80" r="3.5"/><circle cx="620" cy="80" r="3.5"/>
    </g>

    <!-- legend -->
    <line x1="512" y1="282" x2="536" y2="282" stroke="#4774aa" stroke-width="2.4"/>
    <text x="542" y="286" font-size="12" fill="#263e5a">precision</text>
    <line x1="512" y1="302" x2="536" y2="302" stroke="#53845b" stroke-width="2.4"/>
    <text x="542" y="306" font-size="12" fill="#294a2e">recall</text>

    <!-- false alarms row -->
    <g font-size="12" font-weight="bold" fill="#6e2a24" text-anchor="middle">
      <text x="80" y="384">679</text>
      <text x="147.5" y="384">164</text>
      <text x="215" y="384">52</text>
      <text x="282.5" y="384">11</text>
      <text x="350" y="384">2</text>
      <text x="417.5" y="384">0</text>
      <text x="485" y="384">0</text>
      <text x="552.5" y="384">0</text>
      <text x="620" y="384">0</text>
    </g>
    <text x="80" y="404" font-size="12" fill="#40566b">false alarms per 10,000 comments at each threshold</text>

    <!-- side panel -->
    <rect x="650" y="80" width="230" height="240" rx="8" fill="#ffffff" stroke="#8a96a3"/>
    <text x="665" y="104" font-size="13" font-weight="bold" fill="#36424e">10,000 comments,</text>
    <text x="665" y="121" font-size="13" font-weight="bold" fill="#36424e">50 violate (0.5%)</text>
    <text x="665" y="150" font-size="12" font-weight="bold" fill="#294a2e">At 0.4</text>
    <text x="665" y="168" font-size="12" fill="#36424e">48 caught, 2 missed,</text>
    <text x="665" y="185" font-size="12" fill="#36424e">11 false alarms</text>
    <text x="665" y="214" font-size="12" font-weight="bold" fill="#6e2a24">At 0.2</text>
    <text x="665" y="232" font-size="12" fill="#36424e">50 caught, 164 false alarms:</text>
    <text x="665" y="249" font-size="12" fill="#36424e">most flags are wrong</text>
    <text x="665" y="278" font-size="12" font-weight="bold" fill="#263e5a">At 0.6</text>
    <text x="665" y="296" font-size="12" fill="#36424e">39 caught, 0 false alarms</text>

    <text x="30" y="440" font-size="13" fill="#40566b">When violations are rare, false alarms dominate at low thresholds. Pick the threshold from your</text>
    <text x="30" y="458" font-size="13" fill="#40566b">own labeled data and a recall target, and re-check it when the provider updates its model.</text>
  </g>
</svg>
