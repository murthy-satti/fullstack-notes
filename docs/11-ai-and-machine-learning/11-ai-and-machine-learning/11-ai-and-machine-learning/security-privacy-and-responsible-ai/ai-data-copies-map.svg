<svg xmlns="http://www.w3.org/2000/svg" width="920" height="570" viewBox="0 0 920 570" role="img" aria-labelledby="adc-title adc-desc">
  <title id="adc-title">Where copies of one AI request end up</title>
  <desc id="adc-desc">A user's meeting note goes to the TaskFlow API, which sends it on to eight places. Inside the model provider, outside your systems: abuse-monitoring logs, kept up to 30 days by default and removed by zero data retention or modified abuse monitoring; stored state such as responses, files and vector stores, kept until you delete them; and a short-lived prompt cache. Inside your own systems: an answer cache keyed by user and prompt with a short time to live; app logs that should hold metadata rather than text, with a 30 day time to live; traces, where content capture is off by default in the OpenTelemetry GenAI conventions; the vector store holding chunks of notes, deleted by source id; and evaluation and feedback sets holding copied examples, deleted by user id. Caption: one summary request can leave copies in eight places, and each needs a retention period and a deletion path keyed by user.</desc>
  <defs>
    <marker id="adc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="920" height="570" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="30" y="34" font-size="15" font-weight="bold" fill="#36424e">Where copies of one AI request end up</text>

    <!-- provider group -->
    <rect x="620" y="56" width="280" height="290" rx="10" fill="none" stroke="#8062a8" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="636" y="78" font-size="12.5" font-weight="bold" fill="#463365">Model provider (outside your systems)</text>

    <rect x="640" y="92" width="240" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="655" y="114" font-size="13" font-weight="bold" fill="#463365">Abuse-monitoring logs</text>
    <text x="655" y="133" font-size="11.5" fill="#36424e">up to 30 days by default;</text>
    <text x="655" y="150" font-size="11.5" fill="#36424e">ZDR or MAM removes them</text>

    <rect x="640" y="174" width="240" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="655" y="196" font-size="13" font-weight="bold" fill="#463365">Stored state</text>
    <text x="655" y="215" font-size="11.5" fill="#36424e">responses, files, vector stores:</text>
    <text x="655" y="232" font-size="11.5" fill="#36424e">kept until you delete them</text>

    <rect x="640" y="256" width="240" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="655" y="278" font-size="13" font-weight="bold" fill="#463365">Prompt cache</text>
    <text x="655" y="297" font-size="11.5" fill="#36424e">short-lived; on some providers</text>
    <text x="655" y="314" font-size="11.5" fill="#36424e">up to about 24 hours</text>

    <!-- source and API -->
    <rect x="30" y="200" width="150" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="105" y="227" font-size="13" font-weight="bold" fill="#66400f" text-anchor="middle">Meeting note</text>
    <text x="105" y="246" font-size="11.5" fill="#36424e" text-anchor="middle">names, emails, tasks</text>

    <rect x="260" y="192" width="200" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="1.6"/>
    <text x="360" y="225" font-size="14" font-weight="bold" fill="#263e5a" text-anchor="middle">TaskFlow API</text>
    <text x="360" y="245" font-size="11.5" fill="#36424e" text-anchor="middle">builds the prompt</text>

    <rect x="260" y="70" width="200" height="66" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="360" y="94" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Answer cache</text>
    <text x="360" y="113" font-size="11.5" fill="#36424e" text-anchor="middle">keyed by user and prompt;</text>
    <text x="360" y="129" font-size="11.5" fill="#36424e" text-anchor="middle">short TTL</text>

    <!-- your systems row -->
    <rect x="20" y="380" width="580" height="130" rx="10" fill="none" stroke="#4774aa" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="588" y="504" font-size="12.5" font-weight="bold" fill="#263e5a" text-anchor="end">Your systems</text>

    <rect x="32" y="410" width="132" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="98" y="432" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">App logs</text>
    <text x="98" y="451" font-size="11.5" fill="#36424e" text-anchor="middle">metadata, not text;</text>
    <text x="98" y="468" font-size="11.5" fill="#36424e" text-anchor="middle">30-day TTL</text>

    <rect x="174" y="410" width="132" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="240" y="432" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Traces</text>
    <text x="240" y="451" font-size="11.5" fill="#36424e" text-anchor="middle">content capture</text>
    <text x="240" y="468" font-size="11.5" fill="#36424e" text-anchor="middle">off by default</text>

    <rect x="316" y="410" width="132" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="382" y="432" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Vector store</text>
    <text x="382" y="451" font-size="11.5" fill="#36424e" text-anchor="middle">note chunks;</text>
    <text x="382" y="468" font-size="11.5" fill="#36424e" text-anchor="middle">delete by source id</text>

    <rect x="458" y="410" width="132" height="80" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="524" y="432" font-size="13" font-weight="bold" fill="#263e5a" text-anchor="middle">Evals, feedback</text>
    <text x="524" y="451" font-size="11.5" fill="#36424e" text-anchor="middle">copied examples;</text>
    <text x="524" y="468" font-size="11.5" fill="#36424e" text-anchor="middle">delete by user id</text>

    <!-- arrows -->
    <g stroke="#40566b" stroke-width="1.5" fill="none">
      <line x1="180" y1="232" x2="258" y2="232" marker-end="url(#adc-arrow)"/>
      <line x1="360" y1="192" x2="360" y2="138" marker-end="url(#adc-arrow)"/>
      <line x1="460" y1="210" x2="638" y2="127" marker-end="url(#adc-arrow)"/>
      <line x1="460" y1="226" x2="638" y2="209" marker-end="url(#adc-arrow)"/>
      <line x1="460" y1="250" x2="638" y2="291" marker-end="url(#adc-arrow)"/>
      <line x1="300" y1="272" x2="98" y2="408" marker-end="url(#adc-arrow)"/>
      <line x1="330" y1="272" x2="240" y2="408" marker-end="url(#adc-arrow)"/>
      <line x1="380" y1="272" x2="382" y2="408" marker-end="url(#adc-arrow)"/>
      <line x1="420" y1="272" x2="524" y2="408" marker-end="url(#adc-arrow)"/>
    </g>

    <text x="30" y="538" font-size="13" fill="#40566b">One summary request can leave copies in eight places. Each needs a retention period and a</text>
    <text x="30" y="556" font-size="13" fill="#40566b">deletion path keyed by user, and the provider's copies are governed by its terms and your settings.</text>
  </g>
</svg>
