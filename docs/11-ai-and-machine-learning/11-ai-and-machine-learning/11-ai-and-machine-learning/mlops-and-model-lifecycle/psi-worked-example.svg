<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="psw-title psw-desc">
  <title id="psw-title">Computing the population stability index</title>
  <desc id="psw-desc">PSI is the sum over bins of current share minus reference share, times the natural log of current share over reference share. Bins are cut at the reference quintiles, so each holds 20 percent of the reference data. This week the five bins hold 35, 25, 15, 15 and 10 percent. Their contributions are 0.084, 0.011, 0.014, 0.014 and 0.069, which add up to a PSI of 0.193. On a scale where below 0.10 is little shift, 0.10 to 0.25 is worth investigating, and above 0.25 is a significant shift, 0.193 falls in the investigate band. Bins that lose data contribute as much as bins that gain it, because both terms in each product change sign together.</desc>
  <rect width="860" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="330" y="36" font-size="13" font-weight="700" fill="#40566b">PSI = Σ (current − reference) × ln(current / reference)</text>
    <rect x="650" y="24" width="14" height="14" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="670" y="36" font-size="11.5" fill="#263e5a" text-anchor="start">reference (training)</text>
    <rect x="650" y="46" width="14" height="14" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="670" y="58" font-size="11.5" fill="#66400f" text-anchor="start">current (this week)</text>

    <path d="M60 220H760" stroke="#8a96a3" stroke-width="1.5"/>

    <rect x="86" y="140" width="40" height="80" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="134" y="80" width="40" height="140" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="226" y="140" width="40" height="80" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="274" y="120" width="40" height="100" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="366" y="140" width="40" height="80" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="414" y="160" width="40" height="60" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="506" y="140" width="40" height="80" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="554" y="160" width="40" height="60" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="646" y="140" width="40" height="80" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <rect x="694" y="180" width="40" height="40" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>

    <g font-size="11" fill="#36424e">
      <text x="106" y="134">20%</text><text x="154" y="74">35%</text>
      <text x="246" y="134">20%</text><text x="294" y="114">25%</text>
      <text x="386" y="134">20%</text><text x="434" y="154">15%</text>
      <text x="526" y="134">20%</text><text x="574" y="154">15%</text>
      <text x="666" y="134">20%</text><text x="714" y="174">10%</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="130" y="238">bin 1</text><text x="270" y="238">bin 2</text><text x="410" y="238">bin 3</text>
      <text x="550" y="238">bin 4</text><text x="690" y="238">bin 5</text>
    </g>
    <g font-size="11.5" font-weight="700" fill="#463365">
      <text x="130" y="258">+0.084</text><text x="270" y="258">+0.011</text><text x="410" y="258">+0.014</text>
      <text x="550" y="258">+0.014</text><text x="690" y="258">+0.069</text>
    </g>

    <text x="430" y="281" font-size="13" font-weight="700" fill="#263e5a">PSI = 0.084 + 0.011 + 0.014 + 0.014 + 0.069 = 0.193</text>

    <rect x="120" y="306" width="155" height="18" fill="#e7f3e9" stroke="#53845b" stroke-width="1.5"/>
    <rect x="275" y="306" width="232.5" height="18" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <rect x="507.5" y="306" width="232.5" height="18" fill="#fbe9e7" stroke="#b5524b" stroke-width="1.5"/>
    <path d="M419 300V330" stroke="#263e5a" stroke-width="3"/>
    <text x="419" y="296" font-size="11" font-weight="700" fill="#263e5a">0.193</text>
    <g font-size="11" fill="#36424e">
      <text x="197.5" y="342">below 0.10: little shift</text>
      <text x="391" y="342">0.10 to 0.25: investigate</text>
      <text x="623.75" y="342">above 0.25: significant shift</text>
    </g>

    <text x="430" y="382" font-size="13" fill="#40566b">Shares that shrink count as much as shares that grow: every bin adds a positive amount.</text>
  </g>
</svg>
