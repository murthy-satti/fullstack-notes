<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="jcal-title jcal-desc">
  <title id="jcal-title">Calibrating a judge against expert labels</title>
  <desc id="jcal-desc">Calibrating the faithfulness judge on 120 expert labels, shown as a two by two confusion matrix. Experts passed 84 summaries: the judge passed 81 and failed 3. Experts failed 36: the judge passed 13, which are missed failures, and failed 23. Below the matrix: agreement 86.7 percent, true positive rate 96.4 percent, 81 of 84, true negative rate 63.9 percent, 23 of 36, and kappa 0.66. On the right, the correction for production numbers: the judge passes 88.0 percent of production summaries; the estimated true pass rate is the observed rate plus TNR minus 1, divided by TPR plus TNR minus 1, which is 0.519 divided by 0.603, or 86.0 percent. A warning notes that 13 of 36 real failures were missed, so the FAIL definition should be fixed first. A judge is calibrated like any instrument: measure its errors on expert labels before trusting its numbers.</desc>
  <defs>
    <marker id="jcal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="34" font-size="13" font-weight="700" fill="#40566b">Faithfulness judge, 120 held-out expert labels</text>
    <g font-size="12.5" font-weight="700" fill="#36424e" text-anchor="middle">
      <text x="225" y="66">judge: pass</text>
      <text x="355" y="66">judge: fail</text>
    </g>
    <g font-size="12.5" fill="#36424e" text-anchor="end">
      <text x="152" y="113">experts: pass (84)</text>
      <text x="152" y="183">experts: fail (36)</text>
    </g>
    <rect x="160" y="76" width="130" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <rect x="290" y="76" width="130" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="160" y="146" width="130" height="64" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <rect x="290" y="146" width="130" height="64" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="225" y="112" fill="#294a2e">81</text>
      <text x="355" y="112" fill="#66400f">3</text>
      <text x="225" y="182" fill="#6e2a24">13</text>
      <text x="355" y="182" fill="#294a2e">23</text>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="225" y="130" fill="#294a2e">agree</text>
      <text x="355" y="130" fill="#66400f">too strict</text>
      <text x="225" y="200" fill="#6e2a24">missed failures</text>
      <text x="355" y="200" fill="#294a2e">agree</text>
    </g>

    <rect x="24" y="236" width="396" height="104" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <g font-size="12.5" fill="#263e5a">
      <text x="40" y="262">agreement: 86.7% (104 of 120)</text>
      <text x="40" y="282">true positive rate (TPR): 96.4% (81 of 84)</text>
      <text x="40" y="302">true negative rate (TNR): 63.9% (23 of 36)</text>
      <text x="40" y="322">Cohen's kappa: 0.66</text>
    </g>

    <rect x="460" y="56" width="376" height="190" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="478" y="82" font-size="14" font-weight="700" fill="#463365">Correcting production numbers</text>
    <g font-size="12.5" fill="#463365">
      <text x="478" y="106">the judge passes 88.0% of production summaries</text>
      <text x="478" y="134">true = (observed + TNR - 1) / (TPR + TNR - 1)</text>
      <text x="478" y="156">= (0.880 + 0.639 - 1) / (0.964 + 0.639 - 1)</text>
      <text x="478" y="178">= 0.519 / 0.603</text>
      <text x="478" y="206" font-weight="700">estimated true pass rate: 86.0%</text>
      <text x="478" y="228">unstable when TPR + TNR is close to 1</text>
    </g>
    <path d="M420 174H456" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#jcal-arrow)"/>

    <rect x="460" y="266" width="376" height="74" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="478" y="292" font-size="13" font-weight="700" fill="#6e2a24">13 of 36 real failures were passed</text>
    <text x="478" y="314" font-size="12" fill="#6e2a24">sharpen the FAIL definition and examples,</text>
    <text x="478" y="330" font-size="12" fill="#6e2a24">then measure again on untouched labels</text>

    <text x="430" y="392" font-size="13" fill="#40566b" text-anchor="middle">Measure a judge's errors on expert labels before trusting its numbers.</text>
  </g>
</svg>
