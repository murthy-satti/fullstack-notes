<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="pps-title pps-desc">
  <title id="pps-title">Pairwise judging in both orders</title>
  <desc id="pps-desc">One comparison: the same meeting notes with summary A from the current prompt and summary B from a new prompt. It goes to the judge twice: call one shows A first and B second; call two shows B first and A second. The two verdicts are mapped back to A and B. If both calls prefer B, B wins. If both prefer A, A wins. If the verdict follows the slot instead of the content, the pair is scored as a tie and counted as one flip. A results panel shows a simulation of 300 pairs with a judge that picks the first slot 30 percent of the time: B is truly better on 54.3 percent of pairs; with A always shown first the judge reports a B win rate of 32.3 percent; with both orders and ties counted half it reports 50.7 percent; 42.0 percent of verdicts flipped with the order. Judging both orders cancels position bias and measures it as the flip rate.</desc>
  <defs>
    <marker id="pps-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="860" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="24" y="104" width="210" height="104" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="129" y="130" font-size="14" font-weight="700" fill="#66400f" text-anchor="middle">One comparison</text>
    <g font-size="12" fill="#66400f" text-anchor="middle">
      <text x="129" y="152">same meeting notes</text>
      <text x="129" y="170">A: current prompt</text>
      <text x="129" y="188">B: new prompt</text>
    </g>

    <rect x="290" y="40" width="250" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="415" y="68" font-size="14" font-weight="700" fill="#463365" text-anchor="middle">Judge call 1</text>
    <text x="415" y="90" font-size="12" fill="#463365" text-anchor="middle">FIRST = A, SECOND = B</text>
    <rect x="290" y="202" width="250" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="415" y="230" font-size="14" font-weight="700" fill="#463365" text-anchor="middle">Judge call 2</text>
    <text x="415" y="252" font-size="12" fill="#463365" text-anchor="middle">FIRST = B, SECOND = A</text>

    <rect x="612" y="40" width="224" height="62" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="724" y="66" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">Both calls prefer B</text>
    <text x="724" y="86" font-size="12" fill="#294a2e" text-anchor="middle">B wins</text>
    <rect x="612" y="124" width="224" height="62" rx="8" fill="#e7f3e9" stroke="#53845b" stroke-width="2"/>
    <text x="724" y="150" font-size="13" font-weight="700" fill="#294a2e" text-anchor="middle">Both calls prefer A</text>
    <text x="724" y="170" font-size="12" fill="#294a2e" text-anchor="middle">A wins</text>
    <rect x="612" y="208" width="224" height="64" rx="8" fill="#fbe9e7" stroke="#b5524b" stroke-width="2"/>
    <text x="724" y="234" font-size="13" font-weight="700" fill="#6e2a24" text-anchor="middle">Verdict follows the slot</text>
    <text x="724" y="254" font-size="12" fill="#6e2a24" text-anchor="middle">tie; count one flip</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M234 140H262V75H286" marker-end="url(#pps-arrow)"/>
      <path d="M234 172H262V237H286" marker-end="url(#pps-arrow)"/>
      <path d="M540 75H580M540 237H580M580 75V240"/>
      <path d="M580 71H608" marker-end="url(#pps-arrow)"/>
      <path d="M580 155H608" marker-end="url(#pps-arrow)"/>
      <path d="M580 240H608" marker-end="url(#pps-arrow)"/>
    </g>
    <rect x="550" y="108" width="60" height="16" fill="#f5f7fb"/>
    <text x="580" y="120" font-size="11.5" fill="#36424e" text-anchor="middle">map back</text>

    <rect x="24" y="300" width="812" height="104" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="430" y="324" font-size="13" font-weight="700" fill="#263e5a" text-anchor="middle">Simulation: 300 pairs, a judge that picks the first slot 30% of the time</text>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="126" y="360" fill="#263e5a">54.3%</text>
      <text x="330" y="360" fill="#b5524b">32.3%</text>
      <text x="534" y="360" fill="#53845b">50.7%</text>
      <text x="738" y="360" fill="#263e5a">42.0%</text>
    </g>
    <g font-size="12" fill="#263e5a" text-anchor="middle">
      <text x="126" y="384">B truly better</text>
      <text x="330" y="384">one order, A always first</text>
      <text x="534" y="384">both orders, ties count half</text>
      <text x="738" y="384">verdicts flipped</text>
    </g>

    <text x="430" y="432" font-size="13" fill="#40566b" text-anchor="middle">Judging both orders cancels position bias and measures it as the flip rate.</text>
  </g>
</svg>
