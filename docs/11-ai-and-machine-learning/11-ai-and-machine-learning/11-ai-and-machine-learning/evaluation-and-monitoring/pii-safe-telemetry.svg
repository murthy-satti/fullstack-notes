<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="pst-title pst-desc">
  <title id="pst-title">Layers that keep personal data out of traces</title>
  <desc id="pst-desc">Four layers that keep personal data out of traces. In the TaskFlow API: content capture is off by default; when it is turned on, text passes through redactForTelemetry, which replaces emails, phone numbers, card numbers, and secret-looking keys before it reaches a span; users are recorded by a pseudonymous ID, never by email. The API sends spans over OTLP to the OpenTelemetry Collector, where the redaction processor masks the content attributes and any value that matches email or card patterns and adds a count of masked values, and tail sampling keeps errors, slow traces, and ten percent of the rest. Backends such as Langfuse and the general tracing and metrics system receive only redacted spans. When full content is genuinely needed, for example for a support investigation, it goes from the API to a restricted content store with separate access control and short retention, and spans carry only a reference URI. Each layer assumes the one before it can fail.</desc>
  <defs>
    <marker id="pst-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pst-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="880" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <rect x="24" y="50" width="250" height="180" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="40" y="76" font-size="14" font-weight="700" fill="#66400f">1. TaskFlow API</text>
    <g font-size="12" fill="#66400f">
      <text x="40" y="102">content capture off by default</text>
      <text x="40" y="124">when on: redactForTelemetry()</text>
      <text x="40" y="140">masks contact data and keys</text>
      <text x="40" y="162">users as pseudonymous IDs</text>
      <text x="40" y="184">spans carry a reference URI,</text>
      <text x="40" y="200">never the full content</text>
    </g>

    <rect x="330" y="50" width="250" height="180" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="346" y="76" font-size="14" font-weight="700" fill="#463365">2. OTel Collector</text>
    <g font-size="12" fill="#463365">
      <text x="346" y="102">redaction processor:</text>
      <text x="346" y="118">masks content attributes</text>
      <text x="346" y="134">and email or card values,</text>
      <text x="346" y="150">counts what it masked</text>
      <text x="346" y="176">tail sampling: all errors,</text>
      <text x="346" y="192">slow traces, 10% of the rest</text>
    </g>

    <rect x="636" y="50" width="220" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="652" y="76" font-size="14" font-weight="700" fill="#263e5a">3. Langfuse</text>
    <text x="652" y="98" font-size="12" fill="#263e5a">redacted spans only</text>
    <text x="652" y="116" font-size="12" fill="#263e5a">retention and access set</text>
    <rect x="636" y="150" width="220" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="652" y="176" font-size="14" font-weight="700" fill="#263e5a">3. Tracing, metrics</text>
    <text x="652" y="198" font-size="12" fill="#263e5a">general backends</text>
    <text x="652" y="216" font-size="12" fill="#263e5a">low-cardinality labels</text>

    <rect x="330" y="290" width="250" height="84" rx="8" fill="#e5efff" stroke="#b5524b" stroke-width="2"/>
    <text x="346" y="316" font-size="14" font-weight="700" fill="#6e2a24">4. Restricted store</text>
    <text x="346" y="338" font-size="12" fill="#263e5a">separate access control</text>
    <text x="346" y="356" font-size="12" fill="#263e5a">short retention, audited reads</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M274 140H326" marker-end="url(#pst-arrow)"/>
      <path d="M580 110H608V90H632" marker-end="url(#pst-arrow)"/>
      <path d="M608 110V190H632" marker-end="url(#pst-arrow)"/>
    </g>
    <rect x="282" y="122" width="40" height="14" fill="#f5f7fb"/>
    <text x="302" y="133" font-size="11.5" fill="#36424e" text-anchor="middle">OTLP</text>
    <path d="M149 230V332H326" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pst-arrow-ret)"/>
    <text x="160" y="272" font-size="11.5" fill="#36424e">full content, when needed</text>

    <text x="440" y="418" font-size="13" fill="#40566b" text-anchor="middle">Each layer assumes the one before it can fail.</text>
  </g>
</svg>
