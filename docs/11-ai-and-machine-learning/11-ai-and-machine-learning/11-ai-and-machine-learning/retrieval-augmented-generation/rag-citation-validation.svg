<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="rcv-title rcv-desc">
  <title id="rcv-title">Validating model citations before showing an answer</title>
  <desc id="rcv-desc">The model output is JSON with answerable true, an answer containing markers S1 and S2, and a list of citations, each a source ID with a quote. For each citation, a first decision asks whether the source ID was one of the sources sent; if not, the citation is rejected as not a source that was sent. If yes, a second decision asks whether the quote is found in that source's text; if not, it is rejected because the quote is not in the source text. If yes, the citation is kept with its title and url for the user interface, and the loop continues with the next citation. After all citations are checked, a final check asks whether the answer is answerable, has at least one kept citation, and every S-number marker in the text is backed by a kept citation. If yes, the answer is shown with citation links. If no, the answer is withheld with a message that no supported answer was found, and the problems are logged for review.</desc>
  <defs>
    <marker id="rcv-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="rcv-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="510" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">Citations are claims too: check them before the user sees them</text>

    <rect x="16" y="52" width="230" height="150" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="131" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Model output (JSON)</text>
    <g font-size="11.5" fill="#463365">
      <text x="30" y="100">answerable: true</text>
      <text x="30" y="120">answer: "... [S1] ... [S2]"</text>
      <text x="30" y="140">citations:</text>
      <text x="42" y="160">S1: "run the rollback..."</text>
      <text x="42" y="180">S2: "rollbacks revert..."</text>
    </g>
    <line x1="246" y1="100" x2="298" y2="100" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>

    <path d="M400 54 500 100 400 146 300 100z" fill="#e5efff" stroke="#4774aa"/>
    <text x="400" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">Source ID</text>
    <text x="400" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">was sent?</text>
    <line x1="500" y1="100" x2="558" y2="100" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>
    <rect x="514" y="80" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="526" y="91" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="560" y="78" width="304" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="712" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6e2a24">Reject: not a source that was sent</text>

    <line x1="400" y1="146" x2="400" y2="180" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>
    <rect x="406" y="155" width="28" height="14" rx="3" fill="#f5f7fb"/>
    <text x="420" y="166" text-anchor="middle" font-size="11" fill="#36424e">yes</text>

    <path d="M400 182 500 228 400 274 300 228z" fill="#e5efff" stroke="#4774aa"/>
    <text x="400" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">Quote found in</text>
    <text x="400" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">that source?</text>
    <line x1="500" y1="228" x2="558" y2="228" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>
    <rect x="514" y="208" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="526" y="219" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="560" y="206" width="304" height="44" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="712" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6e2a24">Reject: quote not in the source text</text>

    <line x1="400" y1="274" x2="400" y2="298" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>
    <rect x="406" y="279" width="28" height="14" rx="3" fill="#f5f7fb"/>
    <text x="420" y="290" text-anchor="middle" font-size="11" fill="#36424e">yes</text>
    <rect x="300" y="300" width="200" height="46" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="400" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">Keep citation</text>
    <text x="400" y="337" text-anchor="middle" font-size="11.5" fill="#294a2e">title and url for the UI</text>

    <path d="M300 323 H131 V204" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rcv-arrow-dash)"/>
    <rect x="170" y="306" width="90" height="14" rx="3" fill="#f5f7fb"/>
    <text x="215" y="317" text-anchor="middle" font-size="11" fill="#36424e">next citation</text>

    <line x1="400" y1="346" x2="400" y2="370" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>
    <rect x="410" y="351" width="126" height="14" rx="3" fill="#f5f7fb"/>
    <text x="414" y="362" font-size="11" fill="#36424e">all citations checked</text>
    <rect x="250" y="372" width="300" height="84" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="400" y="397" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Final check</text>
    <text x="400" y="418" text-anchor="middle" font-size="11.5" fill="#263e5a">answerable, at least one kept citation,</text>
    <text x="400" y="436" text-anchor="middle" font-size="11.5" fill="#263e5a">and every [Sn] marker backed?</text>

    <line x1="550" y1="393" x2="598" y2="393" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>
    <rect x="558" y="373" width="28" height="14" rx="3" fill="#f5f7fb"/>
    <text x="572" y="384" text-anchor="middle" font-size="11" fill="#36424e">yes</text>
    <rect x="600" y="370" width="264" height="46" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="732" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#294a2e">Show answer with citation links</text>
    <text x="732" y="407" text-anchor="middle" font-size="11.5" fill="#294a2e">each link opens the cited section</text>

    <line x1="550" y1="447" x2="598" y2="447" stroke="#40566b" stroke-width="1.5" marker-end="url(#rcv-arrow)"/>
    <rect x="562" y="427" width="24" height="14" rx="3" fill="#f5f7fb"/>
    <text x="574" y="438" text-anchor="middle" font-size="11" fill="#36424e">no</text>
    <rect x="600" y="424" width="264" height="46" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="732" y="444" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6e2a24">Withhold: no supported answer</text>
    <text x="732" y="461" text-anchor="middle" font-size="11.5" fill="#6e2a24">log the problems for review</text>

    <text x="440" y="494" text-anchor="middle" font-size="13" fill="#40566b">A quote that is not in the cited source, or a source that was never sent, means the answer is not shown.</text>
  </g>
</svg>
