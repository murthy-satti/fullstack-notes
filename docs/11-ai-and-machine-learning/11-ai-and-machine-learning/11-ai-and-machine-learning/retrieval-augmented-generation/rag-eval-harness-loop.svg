<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="rhl-title rhl-desc">
  <title id="rhl-title">The RAG evaluation harness as a regression gate</title>
  <desc id="rhl-desc">A golden set file of questions, users, expected sources and key facts feeds the RAG system under test, which runs with a specific configuration of chunker, k, prompt and models. Each case produces scores for retrieval, grounding, abstention, facts and leaks, which are averaged into a summary and compared with the stored baseline. A decision asks whether any metric fell below the baseline minus the tolerance, or whether any chunk leaked. If yes, the job fails and the change is blocked. If no, the job passes and the dashboard is updated. Two feedback loops return to the golden set: failures found in production and in reviews become new golden cases, and a passing run becomes the new baseline only on purpose, with the update-baseline flag after a reviewed improvement.</desc>
  <defs>
    <marker id="rhl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#40566b"/></marker>
    <marker id="rhl-arrow-dash" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 8 4 0 8z" fill="#60788d"/></marker>
  </defs>
  <rect width="880" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="440" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#36424e">Every change to prompts, chunking or models runs the golden set</text>

    <rect x="16" y="60" width="190" height="70" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
    <text x="111" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#66400f">golden.jsonl</text>
    <text x="111" y="101" text-anchor="middle" font-size="11.5" fill="#66400f">questions, users,</text>
    <text x="111" y="118" text-anchor="middle" font-size="11.5" fill="#66400f">expected sources, facts</text>
    <line x1="206" y1="95" x2="236" y2="95" stroke="#40566b" stroke-width="1.5" marker-end="url(#rhl-arrow)"/>

    <rect x="238" y="60" width="190" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="333" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">RAG under test</text>
    <text x="333" y="101" text-anchor="middle" font-size="11.5" fill="#263e5a">chunker, k, prompt,</text>
    <text x="333" y="118" text-anchor="middle" font-size="11.5" fill="#263e5a">models (one config)</text>
    <line x1="428" y1="95" x2="458" y2="95" stroke="#40566b" stroke-width="1.5" marker-end="url(#rhl-arrow)"/>

    <rect x="460" y="60" width="190" height="70" rx="8" fill="#f0e9fb" stroke="#8062a8"/>
    <text x="555" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#463365">Per-case scores</text>
    <text x="555" y="101" text-anchor="middle" font-size="11.5" fill="#463365">retrieval, grounding,</text>
    <text x="555" y="118" text-anchor="middle" font-size="11.5" fill="#463365">abstention, facts, leaks</text>
    <line x1="650" y1="95" x2="680" y2="95" stroke="#40566b" stroke-width="1.5" marker-end="url(#rhl-arrow)"/>

    <rect x="682" y="60" width="182" height="70" rx="8" fill="#e5efff" stroke="#4774aa"/>
    <text x="773" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#263e5a">Summary</text>
    <text x="773" y="101" text-anchor="middle" font-size="11.5" fill="#263e5a">means per metric,</text>
    <text x="773" y="118" text-anchor="middle" font-size="11.5" fill="#263e5a">vs baseline.json</text>
    <line x1="773" y1="130" x2="773" y2="160" stroke="#40566b" stroke-width="1.5" marker-end="url(#rhl-arrow)"/>

    <path d="M773 162 863 214 773 266 683 214z" fill="#e5efff" stroke="#4774aa"/>
    <text x="773" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">Below baseline</text>
    <text x="773" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">- tolerance, or</text>
    <text x="773" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#263e5a">leaks &gt; 0?</text>

    <line x1="683" y1="214" x2="652" y2="214" stroke="#40566b" stroke-width="1.5" marker-end="url(#rhl-arrow)"/>
    <rect x="656" y="194" width="28" height="14" rx="3" fill="#f5f7fb"/>
    <text x="670" y="205" text-anchor="middle" font-size="11" fill="#36424e">yes</text>
    <rect x="430" y="190" width="220" height="48" rx="8" fill="#fbe9e7" stroke="#b5524b"/>
    <text x="540" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#6e2a24">Fail the job</text>
    <text x="540" y="228" text-anchor="middle" font-size="11.5" fill="#6e2a24">block the merge, show the metric</text>

    <line x1="773" y1="266" x2="773" y2="296" stroke="#40566b" stroke-width="1.5" marker-end="url(#rhl-arrow)"/>
    <text x="781" y="286" font-size="11" fill="#36424e">no</text>
    <rect x="682" y="298" width="182" height="48" rx="8" fill="#e7f3e9" stroke="#53845b"/>
    <text x="773" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#294a2e">Pass</text>
    <text x="773" y="336" text-anchor="middle" font-size="11.5" fill="#294a2e">update the dashboard</text>

    <rect x="16" y="190" width="300" height="56" rx="8" fill="#ffffff" stroke="#8a96a3"/>
    <text x="166" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">New failure cases</text>
    <text x="166" y="231" text-anchor="middle" font-size="11.5" fill="#36424e">from production, user reports, reviews</text>
    <path d="M111 190 V132" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rhl-arrow-dash)"/>

    <rect x="16" y="290" width="440" height="56" rx="8" fill="#ffffff" stroke="#8a96a3"/>
    <text x="236" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#36424e">Baseline changes only on purpose</text>
    <text x="236" y="331" text-anchor="middle" font-size="11.5" fill="#36424e">--update-baseline after a reviewed improvement</text>
    <path d="M682 322 H458" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rhl-arrow-dash)"/>

    <text x="440" y="384" text-anchor="middle" font-size="13" fill="#40566b">The golden set grows from real failures; the baseline only moves when someone decides it should.</text>
  </g>
</svg>
