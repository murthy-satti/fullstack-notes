<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Vectors, similarity, and probabilities</title>
  <desc id="desc">Vectors can be compared geometrically for retrieval, while model logits can be normalized into a probability distribution for candidate choices.</desc>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17212b">
    <rect x="35" y="70" width="245" height="112" rx="14" fill="#e8f1ff" stroke="#4776b8" stroke-width="2"/>
    <text x="157" y="102" font-size="18" font-weight="bold">Vector space</text><text x="157" y="130" font-size="14">query vector q</text><text x="157" y="154" font-size="14">candidate vectors d₁, d₂</text>
    <path d="M280 126H360" stroke="#526477" stroke-width="3"/>
    <path d="M350 117L362 126L350 135" fill="none" stroke="#526477" stroke-width="3"/>
    <rect x="365" y="70" width="235" height="112" rx="14" fill="#e9f7ef" stroke="#47845c" stroke-width="2"/>
    <text x="482" y="102" font-size="18" font-weight="bold">Similarity score</text><text x="482" y="130" font-size="14">cosine / dot product</text><text x="482" y="154" font-size="13">rank, not proof</text>
    <path d="M600 126H680" stroke="#526477" stroke-width="3"/>
    <path d="M670 117L682 126L670 135" fill="none" stroke="#526477" stroke-width="3"/>
    <rect x="685" y="70" width="240" height="112" rx="14" fill="#fff4dd" stroke="#bd8730" stroke-width="2"/>
    <text x="805" y="102" font-size="18" font-weight="bold">Logits → softmax</text><text x="805" y="130" font-size="14">scores → normalized values</text><text x="805" y="154" font-size="13">calibration still required</text>
    <text x="480" y="220" font-size="13" fill="#465565">Similarity and probability answer different questions.</text>
  </g>
</svg>
