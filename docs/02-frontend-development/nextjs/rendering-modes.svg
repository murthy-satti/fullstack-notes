<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of client rendering, server rendering, static generation, and ISR</title>
  <desc id="desc">Client rendering builds much of the interface in the browser. Server rendering generates HTML for a request. Static generation prepares reusable output ahead of requests. Incremental static regeneration serves cached output and refreshes it based on time or an explicit invalidation.</desc>
  <defs>
    <style>
      .head{fill:#e2f1ff;stroke:#2463a6;stroke-width:2;rx:10}
      .body{fill:#f7f9fc;stroke:#8090a5;stroke-width:1.5;rx:8}
      .title{font:700 17px Arial,sans-serif;fill:#172334}
      .text{font:14px Arial,sans-serif;fill:#26364b}
    </style>
  </defs>
  <rect x="20" y="20" width="425" height="155" class="head"/>
  <text x="232" y="50" text-anchor="middle" class="title">CSR: browser builds/updates UI</text>
  <rect x="40" y="68" width="115" height="78" class="body"/>
  <text x="97" y="98" text-anchor="middle" class="text">HTML + JS</text>
  <text x="97" y="122" text-anchor="middle" class="text">downloaded</text>
  <rect x="185" y="68" width="115" height="78" class="body"/>
  <text x="242" y="98" text-anchor="middle" class="text">Browser runs</text>
  <text x="242" y="122" text-anchor="middle" class="text">app code</text>
  <rect x="330" y="68" width="95" height="78" class="body"/>
  <text x="377" y="98" text-anchor="middle" class="text">UI shown</text>
  <text x="377" y="122" text-anchor="middle" class="text">and updated</text>
  <text x="165" y="111" text-anchor="middle" class="text">→</text>
  <text x="310" y="111" text-anchor="middle" class="text">→</text>
  <rect x="475" y="20" width="425" height="155" class="head"/>
  <text x="687" y="50" text-anchor="middle" class="title">SSR: output generated per request</text>
  <rect x="495" y="68" width="115" height="78" class="body"/>
  <text x="552" y="98" text-anchor="middle" class="text">Request</text>
  <text x="552" y="122" text-anchor="middle" class="text">arrives</text>
  <rect x="640" y="68" width="115" height="78" class="body"/>
  <text x="697" y="98" text-anchor="middle" class="text">Server renders</text>
  <text x="697" y="122" text-anchor="middle" class="text">HTML</text>
  <rect x="785" y="68" width="95" height="78" class="body"/>
  <text x="832" y="98" text-anchor="middle" class="text">HTML sent</text>
  <text x="832" y="122" text-anchor="middle" class="text">to browser</text>
  <text x="620" y="111" text-anchor="middle" class="text">→</text>
  <text x="765" y="111" text-anchor="middle" class="text">→</text>
  <rect x="20" y="205" width="425" height="165" class="head"/>
  <text x="232" y="235" text-anchor="middle" class="title">SSG: output prepared ahead of request</text>
  <rect x="40" y="255" width="115" height="80" class="body"/>
  <text x="97" y="286" text-anchor="middle" class="text">Build or</text>
  <text x="97" y="310" text-anchor="middle" class="text">preparation</text>
  <rect x="185" y="255" width="115" height="80" class="body"/>
  <text x="242" y="286" text-anchor="middle" class="text">Reusable</text>
  <text x="242" y="310" text-anchor="middle" class="text">HTML cached</text>
  <rect x="330" y="255" width="95" height="80" class="body"/>
  <text x="377" y="286" text-anchor="middle" class="text">Requests</text>
  <text x="377" y="310" text-anchor="middle" class="text">reuse output</text>
  <text x="165" y="300" text-anchor="middle" class="text">→</text>
  <text x="310" y="300" text-anchor="middle" class="text">→</text>
  <rect x="475" y="205" width="425" height="165" class="head"/>
  <text x="687" y="235" text-anchor="middle" class="title">ISR: reuse output, then refresh by policy</text>
  <rect x="495" y="255" width="115" height="80" class="body"/>
  <text x="552" y="286" text-anchor="middle" class="text">Serve cached</text>
  <text x="552" y="310" text-anchor="middle" class="text">route output</text>
  <rect x="640" y="255" width="115" height="80" class="body"/>
  <text x="697" y="286" text-anchor="middle" class="text">Time threshold</text>
  <text x="697" y="310" text-anchor="middle" class="text">or invalidation</text>
  <rect x="785" y="255" width="95" height="80" class="body"/>
  <text x="832" y="286" text-anchor="middle" class="text">Refresh for</text>
  <text x="832" y="310" text-anchor="middle" class="text">later request</text>
  <text x="620" y="300" text-anchor="middle" class="text">→</text>
  <text x="765" y="300" text-anchor="middle" class="text">→</text>
</svg>
