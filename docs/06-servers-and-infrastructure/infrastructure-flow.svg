<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">A request travels through web infrastructure</title>
  <desc id="desc">A visitor uses DNS to find a CDN or proxy, which forwards a request to an application server.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#355c7d"/>
    </marker>
    <style>
      .box{fill:#eef5fb;stroke:#355c7d;stroke-width:2}.txt{font:16px sans-serif;fill:#17324d}.small{font:13px sans-serif;fill:#355c7d}.line{stroke:#355c7d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="18" y="58" width="112" height="62" rx="10" class="box"/>
  <text x="74" y="84" text-anchor="middle" class="txt">Visitor</text>
  <text x="74" y="104" text-anchor="middle" class="small">browser</text>
  <rect x="178" y="58" width="112" height="62" rx="10" class="box"/>
  <text x="234" y="84" text-anchor="middle" class="txt">DNS</text>
  <text x="234" y="104" text-anchor="middle" class="small">find the service</text>
  <rect x="338" y="58" width="126" height="62" rx="10" class="box"/>
  <text x="401" y="84" text-anchor="middle" class="txt">CDN / proxy</text>
  <text x="401" y="104" text-anchor="middle" class="small">cache or route</text>
  <rect x="512" y="58" width="112" height="62" rx="10" class="box"/>
  <text x="568" y="84" text-anchor="middle" class="txt">Server</text>
  <text x="568" y="104" text-anchor="middle" class="small">app response</text>
  <path d="M130 89H170" class="line"/>
  <path d="M290 89H330" class="line"/>
  <path d="M464 89H504" class="line"/>
  <text x="320" y="157" text-anchor="middle" class="small">DNS locates a destination; proxies and servers handle the request.</text>
</svg>
