<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">Secure development learning cycle</title>
  <desc id="description">Design leads to implementation, then testing, then monitoring; feedback returns from monitoring to design.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#315b74"/>
    </marker>
  </defs>
  <rect width="720" height="180" rx="14" fill="#f3f7fa"/>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle">
    <g fill="#fff" stroke="#315b74" stroke-width="2">
      <rect x="34" y="58" width="142" height="60" rx="10"/>
      <rect x="214" y="58" width="142" height="60" rx="10"/>
      <rect x="394" y="58" width="142" height="60" rx="10"/>
      <rect x="574" y="58" width="112" height="60" rx="10"/>
    </g>
    <g fill="#17384b" font-weight="600">
      <text x="105" y="94">Design</text>
      <text x="285" y="94">Implement</text>
      <text x="465" y="94">Test</text>
      <text x="630" y="94">Monitor</text>
    </g>
    <g stroke="#315b74" stroke-width="3" marker-end="url(#arrow)">
      <path d="M180 88 H205"/>
      <path d="M360 88 H385"/>
      <path d="M540 88 H565"/>
      <path d="M628 126 C570 166 145 166 102 126"/>
    </g>
    <text x="365" y="158" fill="#315b74" font-size="13">Use observations to improve the next design</text>
  </g>
</svg>
