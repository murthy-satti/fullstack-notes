<svg xmlns="http://www.w3.org/2000/svg" width="780" height="672" viewBox="0 0 780 672" role="img" aria-labelledby="scg-title scg-desc">
  <title id="scg-title">How the URL shortener picks a short code</title>
  <desc id="scg-desc">On POST /v1/links, a custom alias is validated and used as the code. Otherwise the server takes the next ID from its leased block, leasing a new block of 10,000 IDs from the allocator when the block is used up. The ID is scrambled with a reversible transform, base62-encoded and padded to 7 characters. The code is inserted only if it is absent. If the code is taken, an alias request gets 409 Conflict and a generated code is skipped in favor of the next ID; otherwise the API returns 201 Created.</desc>
  <defs>
    <marker id="scg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="672" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="20" width="200" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="43" font-size="14" font-weight="700" fill="#36424e">POST /v1/links</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <path d="M390 70 490 100 390 130 290 100z"/>
      <path d="M390 210 480 240 390 270 300 240z"/>
      <path d="M390 488 470 516 390 544 310 516z"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="390" y="97">custom alias</text>
      <text x="390" y="111">given?</text>
      <text x="390" y="237">leased block</text>
      <text x="390" y="251">used up?</text>
      <text x="390" y="513">code</text>
      <text x="390" y="527">taken?</text>
    </g>

    <rect x="30" y="78" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="130" y="96" font-size="14" font-weight="700" fill="#263e5a">Validate alias</text>
    <text x="130" y="113" font-size="11.5" fill="#263e5a">4–32 chars, not reserved</text>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="280" y="152" width="220" height="44" rx="8"/>
      <rect x="560" y="218" width="200" height="44" rx="8"/>
      <rect x="280" y="294" width="220" height="44" rx="8"/>
      <rect x="280" y="358" width="220" height="44" rx="8"/>
      <rect x="280" y="422" width="220" height="44" rx="8"/>
      <rect x="540" y="488" width="220" height="56" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#66400f">
      <text x="390" y="170">Next ID from block</text>
      <text x="660" y="236">Lease a new block</text>
      <text x="390" y="312">Scramble the ID</text>
      <text x="390" y="376">Base62 encode</text>
      <text x="390" y="440">Conditional insert</text>
      <text x="650" y="507">Code collision</text>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="390" y="187">server-local, no network call</text>
      <text x="660" y="253">allocator: nextStart += 10,000</text>
      <text x="390" y="329">reversible, so still unique</text>
      <text x="390" y="393">pad to 7 chars, e.g. aZ3kP9q</text>
      <text x="390" y="457">put only if the code is absent</text>
      <text x="650" y="524">alias → 409 Conflict</text>
      <text x="650" y="539">generated → take the next ID</text>
    </g>

    <rect x="280" y="572" width="220" height="44" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="390" y="590" font-size="14" font-weight="700" fill="#294a2e">201 Created</text>
    <text x="390" y="607" font-size="11.5" fill="#294a2e">returns the short URL</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 56V68" marker-end="url(#scg-arrow)"/>
      <path d="M290 100H232" marker-end="url(#scg-arrow)"/>
      <path d="M390 130V150" marker-end="url(#scg-arrow)"/>
      <path d="M390 196V208" marker-end="url(#scg-arrow)"/>
      <path d="M480 240H558" marker-end="url(#scg-arrow)"/>
      <path d="M660 218V174H502" marker-end="url(#scg-arrow)"/>
      <path d="M390 270V292" marker-end="url(#scg-arrow)"/>
      <path d="M390 338V356" marker-end="url(#scg-arrow)"/>
      <path d="M390 402V420" marker-end="url(#scg-arrow)"/>
      <path d="M130 122V444H278" marker-end="url(#scg-arrow)"/>
      <path d="M390 466V486" marker-end="url(#scg-arrow)"/>
      <path d="M390 544V570" marker-end="url(#scg-arrow)"/>
      <path d="M470 516H538" marker-end="url(#scg-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="261" y="92">yes</text>
      <text x="400" y="145" text-anchor="start">no</text>
      <text x="519" y="232">yes</text>
      <text x="400" y="286" text-anchor="start">no</text>
      <text x="400" y="562" text-anchor="start">no</text>
      <text x="504" y="508">yes</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="581" y="167">new block</text>
      <text x="140" y="290" text-anchor="start">alias is the code</text>
    </g>
    <text x="390" y="650" font-size="13" fill="#40566b">The conditional insert is the final guarantee: two links can never share a code.</text>
  </g>
</svg>
