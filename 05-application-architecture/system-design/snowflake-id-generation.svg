<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" role="img" aria-labelledby="sfi-title sfi-desc">
  <title id="sfi-title">Snowflake-style ID: 64-bit layout and how each new ID is generated</title>
  <desc id="sfi-desc">A 64-bit ID holds an unused sign bit, a 41-bit millisecond timestamp since a custom epoch, a 10-bit worker ID, and a 12-bit sequence. To generate an ID, read the current millisecond. If it is earlier than the last one, refuse because the clock moved back. If it equals the last millisecond, add one to the sequence, and if the sequence wraps to zero, wait for the next millisecond. Otherwise reset the sequence to zero. Then shift and combine the timestamp, worker ID, and sequence.</desc>
  <defs>
    <marker id="sfi-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="600" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="28" font-size="13" font-weight="700" fill="#40566b">64-bit ID layout (most significant bit first)</text>
    <g stroke-width="2">
      <rect x="30" y="40" width="40" height="48" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="70" y="40" width="400" height="48" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="470" y="40" width="140" height="48" rx="6" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="610" y="40" width="140" height="48" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="50" y="69" fill="#36424e">0</text>
      <text x="270" y="69" fill="#263e5a">41 bits: ms since custom epoch</text>
      <text x="540" y="69" fill="#294a2e">10 bits: worker</text>
      <text x="680" y="69" fill="#66400f">12 bits: sequence</text>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="50" y="106">1 bit</text>
      <text x="270" y="106">about 69 years of range</text>
      <text x="540" y="106">1,024 workers</text>
      <text x="680" y="106">4,096 per ms</text>
    </g>

    <rect x="150" y="136" width="200" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="159" font-size="14" font-weight="700" fill="#36424e">nextId() called</text>

    <path d="M250 192 350 222 250 252 150 222z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="219" font-size="12" font-weight="700" fill="#36424e">now earlier than</text>
    <text x="250" y="233" font-size="12" font-weight="700" fill="#36424e">last ms?</text>

    <rect x="420" y="200" width="290" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="565" y="219" font-size="14" font-weight="700" fill="#6b241c">Refuse: clock moved back</text>
    <text x="565" y="236" font-size="11.5" fill="#6b241c">never reuse an earlier timestamp</text>

    <path d="M250 282 350 312 250 342 150 312z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="309" font-size="12" font-weight="700" fill="#36424e">same ms as</text>
    <text x="250" y="323" font-size="12" font-weight="700" fill="#36424e">the last ID?</text>

    <rect x="420" y="290" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="510" y="317" font-size="14" font-weight="700" fill="#66400f">sequence + 1</text>

    <path d="M510 370 590 400 510 430 430 400z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="510" y="397" font-size="12" font-weight="700" fill="#36424e">sequence</text>
    <text x="510" y="411" font-size="12" font-weight="700" fill="#36424e">wrapped to 0?</text>

    <rect x="614" y="380" width="152" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="690" y="405" font-size="14" font-weight="700" fill="#66400f">Wait for next ms</text>

    <rect x="150" y="372" width="200" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="250" y="397" font-size="14" font-weight="700" fill="#66400f">sequence = 0</text>

    <rect x="150" y="476" width="440" height="60" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="370" y="497" font-size="14" font-weight="700" fill="#294a2e">Build the ID</text>
    <text x="370" y="514" font-size="11.5" fill="#294a2e">(now − epoch) &lt;&lt; 22 | worker &lt;&lt; 12 | sequence</text>
    <text x="370" y="529" font-size="11.5" fill="#294a2e">send it to JavaScript clients as a string</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 172V190" marker-end="url(#sfi-arrow)"/>
      <path d="M350 222H418" marker-end="url(#sfi-arrow)"/>
      <path d="M250 252V280" marker-end="url(#sfi-arrow)"/>
      <path d="M350 312H418" marker-end="url(#sfi-arrow)"/>
      <path d="M510 334V368" marker-end="url(#sfi-arrow)"/>
      <path d="M590 400H612" marker-end="url(#sfi-arrow)"/>
      <path d="M250 342V370" marker-end="url(#sfi-arrow)"/>
      <path d="M250 412V474" marker-end="url(#sfi-arrow)"/>
      <path d="M510 430V474" marker-end="url(#sfi-arrow)"/>
      <path d="M690 420V506H592" marker-end="url(#sfi-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="384" y="214">yes</text>
      <text x="260" y="270" text-anchor="start">no</text>
      <text x="384" y="304">yes</text>
      <text x="260" y="360" text-anchor="start">no</text>
      <text x="520" y="452" text-anchor="start">no</text>
      <text x="601" y="392">yes</text>
    </g>
    <text x="700" y="456" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">then</text>
    <text x="700" y="471" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">seq = 0</text>
    <text x="390" y="578" font-size="13" fill="#40566b">IDs sort by time and need no coordination beyond unique worker IDs.</text>
  </g>
</svg>
