<svg xmlns="http://www.w3.org/2000/svg" width="800" height="516" viewBox="0 0 800 516" role="img" aria-labelledby="fos-title fos-desc">
  <title id="fos-title">Fan-out on write, fan-out on read, and the hybrid</title>
  <desc id="fos-desc">Fan-out on write: a new post is written once, then fan-out workers insert its ID into every follower's feed, so a reader needs one cache lookup but writes grow with follower count. Fan-out on read: the post is written once to the author's timeline, and when a reader opens the feed the feed service reads the timelines of every followed account and merges them, so writes are cheap but reads grow with accounts followed. Hybrid: posts from regular authors below about 100,000 followers are pushed into followers' feeds, celebrity posts stay in their own timeline, and the feed service merges the cached feed with pulled celebrity posts.</desc>
  <defs>
    <marker id="fos-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="516" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#c3ccd7" stroke-width="1.5">
      <rect x="15" y="20" width="244" height="450" rx="10"/>
      <rect x="278" y="20" width="244" height="450" rx="10"/>
      <rect x="541" y="20" width="244" height="450" rx="10"/>
    </g>
    <g font-size="13" font-weight="700" fill="#40566b">
      <text x="137" y="44">Fan-out on write (push)</text>
      <text x="400" y="44">Fan-out on read (pull)</text>
      <text x="663" y="44">Hybrid</text>
    </g>

    <g stroke-width="2" fill="#e5efff" stroke="#4774aa">
      <rect x="37" y="60" width="200" height="40" rx="8"/>
      <rect x="300" y="60" width="200" height="40" rx="8"/>
      <rect x="551" y="56" width="105" height="48" rx="8"/>
      <rect x="671" y="56" width="105" height="48" rx="8"/>
      <rect x="87" y="320" width="100" height="40" rx="8"/>
      <rect x="350" y="320" width="100" height="40" rx="8"/>
      <rect x="613" y="320" width="100" height="40" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#263e5a">
      <text x="137" y="85">New post</text>
      <text x="400" y="85">New post</text>
      <text x="603" y="76">Regular</text>
      <text x="723" y="76">Celebrity</text>
      <text x="137" y="345">Reader F2</text>
      <text x="400" y="345">Reader</text>
      <text x="663" y="345">Reader</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="603" y="94">&lt; 100k followers</text>
      <text x="723" y="94">&gt; 100k followers</text>
    </g>

    <g stroke-width="2" fill="#fff0d9" stroke="#bd7a20">
      <rect x="47" y="140" width="180" height="44" rx="8"/>
      <rect x="320" y="240" width="160" height="44" rx="8"/>
      <rect x="573" y="240" width="180" height="44" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#66400f">
      <text x="137" y="158">Fan-out workers</text>
      <text x="400" y="258">Feed service</text>
      <text x="663" y="258">Feed service</text>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="137" y="175">1 insert per follower</text>
      <text x="400" y="275">merge + sort N lists</text>
      <text x="663" y="275">merge both, then rank</text>
    </g>

    <g stroke-width="2" fill="#f0e9fb" stroke="#8062a8">
      <rect x="27" y="248" width="70" height="32" rx="6"/>
      <rect x="102" y="248" width="70" height="32" rx="6"/>
      <rect x="177" y="248" width="70" height="32" rx="6"/>
      <rect x="290" y="150" width="70" height="36" rx="6"/>
      <rect x="365" y="150" width="70" height="36" rx="6"/>
      <rect x="440" y="150" width="70" height="36" rx="6"/>
      <rect x="551" y="150" width="105" height="44" rx="8"/>
      <rect x="671" y="150" width="105" height="44" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="62" y="268">feed:F1</text>
      <text x="137" y="268">feed:F2</text>
      <text x="212" y="268">feed:F3</text>
      <text x="325" y="173">A1</text>
      <text x="400" y="173">A2</text>
      <text x="475" y="173">A3</text>
      <text x="603" y="168">Follower</text>
      <text x="603" y="184">feeds</text>
      <text x="723" y="168">Own</text>
      <text x="723" y="184">timeline</text>
    </g>
    <text x="440" y="142" font-size="11.5" fill="#463365">author timelines</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M137 100V138" marker-end="url(#fos-arrow)"/>
      <path d="M100 184L64 246" marker-end="url(#fos-arrow)"/>
      <path d="M137 184V246" marker-end="url(#fos-arrow)"/>
      <path d="M174 184L210 246" marker-end="url(#fos-arrow)"/>
      <path d="M137 280V318" marker-end="url(#fos-arrow)"/>
      <path d="M325 100V148" marker-end="url(#fos-arrow)"/>
      <path d="M360 240L330 189" marker-end="url(#fos-arrow)"/>
      <path d="M400 240V189" marker-end="url(#fos-arrow)"/>
      <path d="M440 240L470 189" marker-end="url(#fos-arrow)"/>
      <path d="M400 320V286" marker-end="url(#fos-arrow)"/>
      <path d="M603 104V148" marker-end="url(#fos-arrow)"/>
      <path d="M723 104V148" marker-end="url(#fos-arrow)"/>
      <path d="M613 240L605 196" marker-end="url(#fos-arrow)"/>
      <path d="M713 240L721 196" marker-end="url(#fos-arrow)"/>
      <path d="M663 320V286" marker-end="url(#fos-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="147" y="124" text-anchor="start">write once</text>
      <text x="111" y="214">insert</text>
      <text x="147" y="303" text-anchor="start">1 read</text>
      <text x="335" y="128" text-anchor="start">1 write</text>
      <text x="372" y="226">read all</text>
      <text x="410" y="306" text-anchor="start">open</text>
      <text x="613" y="128" text-anchor="start">push ID</text>
      <text x="733" y="128" text-anchor="start">store</text>
      <text x="603" y="226" text-anchor="end">cached</text>
      <text x="723" y="226" text-anchor="start">pull</text>
      <text x="673" y="306" text-anchor="start">open</text>
    </g>

    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="137" y="394">write: O(followers)</text>
      <text x="137" y="412">read: 1 cache lookup</text>
      <text x="400" y="394">write: 1 insert</text>
      <text x="400" y="412">read: O(accounts followed)</text>
      <text x="663" y="394">push below the threshold</text>
      <text x="663" y="412">pull above it</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="137" y="440">cheap reads, celebrity posts hurt</text>
      <text x="400" y="440">cheap writes, expensive reads</text>
      <text x="663" y="440">bounded writes, cheap reads</text>
    </g>
    <text x="400" y="498" font-size="13" fill="#40566b">Hybrid: push for most authors, pull high-follower accounts at read time.</text>
  </g>
</svg>
