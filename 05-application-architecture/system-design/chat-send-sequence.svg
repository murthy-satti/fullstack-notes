<svg xmlns="http://www.w3.org/2000/svg" width="800" height="716" viewBox="0 0 800 716" role="img" aria-labelledby="chs-title chs-desc">
  <title id="chs-title">Sending a chat message: ack, delivery and read receipts, and the offline push path</title>
  <desc id="chs-desc">A's app sends a message with client ID c-7f3a. The chat service deduplicates it, assigns sequence 1048, stores it, and acknowledges it, so A shows sent. If B is online, the chat service delivers the message, B's app reports it delivered and later read, the chat service records B's last read sequence, and A receives delivered and read receipts. If B is offline, the chat service finds no session, sends a push job to APNs or FCM, and when B opens the app it fetches every message after the last sequence it has.</desc>
  <defs>
    <marker id="chs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="chs-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="716" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="120" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="80" y="40" font-size="14" font-weight="700" fill="#263e5a">A's app</text>
    <text x="80" y="57" font-size="11.5" fill="#263e5a">sender</text>
    <rect x="195" y="20" width="130" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="260" y="40" font-size="14" font-weight="700" fill="#66400f">Chat service</text>
    <text x="260" y="57" font-size="11.5" fill="#66400f">via WS gateways</text>
    <rect x="365" y="20" width="130" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="40" font-size="14" font-weight="700" fill="#463365">Messages DB</text>
    <text x="430" y="57" font-size="11.5" fill="#463365">+ watermarks</text>
    <rect x="540" y="20" width="120" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="600" y="40" font-size="14" font-weight="700" fill="#263e5a">B's app</text>
    <text x="600" y="57" font-size="11.5" fill="#263e5a">recipient</text>
    <rect x="685" y="20" width="100" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="735" y="40" font-size="14" font-weight="700" fill="#36424e">APNs/FCM</text>
    <text x="735" y="57" font-size="11.5" fill="#36424e">push</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M80 68V672"/>
      <path d="M260 68V672"/>
      <path d="M430 68V672"/>
      <path d="M600 68V672"/>
      <path d="M735 68V672"/>
    </g>
    <g stroke="#c3ccd7" stroke-width="1.5">
      <path d="M20 84H780M20 282H780M20 476H780"/>
    </g>
    <g font-size="12" font-weight="700" fill="#8062a8" text-anchor="start">
      <text x="24" y="102">Send</text>
      <text x="24" y="300">B online</text>
      <text x="24" y="494">B offline</text>
    </g>

    <rect x="195" y="140" width="130" height="34" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="260" y="154" font-size="11.5" font-weight="700" fill="#66400f">dedupe by c-7f3a</text>
    <text x="260" y="168" font-size="11.5" fill="#66400f">assign seq 1048</text>
    <rect x="195" y="500" width="130" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="514" font-size="11.5" font-weight="700" fill="#36424e">no session for B</text>
    <text x="260" y="528" font-size="11.5" fill="#36424e">in the registry</text>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="end">
      <text x="187" y="161">2.</text>
      <text x="187" y="521">12.</text>
    </g>

    <g text-anchor="start" fill="#36424e">
      <text x="92" y="108" font-size="12" font-weight="700">1. send c-7f3a</text>
      <text x="92" y="122" font-size="11">body: "On my way!"</text>
      <text x="272" y="198" font-size="12" font-weight="700">3. insert seq 1048</text>
      <text x="272" y="222" font-size="12" font-weight="700">4. ok</text>
      <text x="92" y="240" font-size="12" font-weight="700">5. ack seq 1048</text>
      <text x="92" y="254" font-size="11">A shows ✓ sent</text>
      <text x="272" y="310" font-size="12" font-weight="700">6. message seq 1048</text>
      <text x="272" y="338" font-size="12" font-weight="700">7. delivered, upToSeq 1048</text>
      <text x="92" y="364" font-size="12" font-weight="700">8. delivered ✓✓</text>
      <text x="272" y="396" font-size="12" font-weight="700">9. read, upToSeq 1048</text>
      <text x="272" y="422" font-size="12" font-weight="700">10. lastReadSeq = 1048</text>
      <text x="92" y="448" font-size="12" font-weight="700">11. read receipt</text>
      <text x="272" y="548" font-size="12" font-weight="700">13. push job (via the push queue)</text>
      <text x="612" y="576" font-size="12" font-weight="700">14. alert</text>
      <text x="272" y="600" font-size="12" font-weight="700">15. B opens the app</text>
      <text x="272" y="614" font-size="11">GET messages?afterSeq=1040</text>
      <text x="272" y="644" font-size="12" font-weight="700">16. messages 1041–1048</text>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 128H258" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M260 206H428" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M430 230H262" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#chs-ret)"/>
      <path d="M260 262H82" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#chs-ret)"/>
      <path d="M260 318H598" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M600 346H262" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M260 372H82" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#chs-ret)"/>
      <path d="M600 404H262" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M260 430H428" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M260 456H82" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#chs-ret)"/>
      <path d="M260 556H733" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M735 584H602" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#chs-ret)"/>
      <path d="M600 622H262" stroke="#40566b" marker-end="url(#chs-arrow)"/>
      <path d="M260 652H598" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#chs-ret)"/>
    </g>
    <text x="400" y="698" font-size="13" fill="#40566b">The server sequence number orders messages and lets clients fetch any gap after reconnecting.</text>
  </g>
</svg>
