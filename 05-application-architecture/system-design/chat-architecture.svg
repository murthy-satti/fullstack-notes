<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="cha-title cha-desc">
  <title id="cha-title">Chat architecture: how a message reaches online and offline recipients</title>
  <desc id="cha-desc">User A sends a message over a WebSocket to WebSocket gateway 1, which forwards it to the chat service. The chat service saves it in the messages database and acknowledges it back to A, looks up which gateway holds each recipient in the session registry, and publishes the message on pub/sub. Gateway 2 receives it and pushes it to user B over B's socket. Gateways refresh presence with heartbeats. For an offline recipient, the chat service enqueues a push job, and the push service notifies user C through APNs or FCM.</desc>
  <defs>
    <marker id="cha-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="560" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke-width="2" fill="#e5efff" stroke="#4774aa">
      <rect x="20" y="60" width="120" height="52" rx="8"/>
      <rect x="20" y="250" width="120" height="52" rx="8"/>
      <rect x="20" y="440" width="120" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#263e5a">
      <text x="80" y="81">User A</text>
      <text x="80" y="271">User B</text>
      <text x="80" y="461">User C</text>
    </g>
    <g font-size="11.5" fill="#263e5a">
      <text x="80" y="99">sender, online</text>
      <text x="80" y="289">recipient, online</text>
      <text x="80" y="479">recipient, offline</text>
    </g>

    <g stroke-width="2" fill="#fff0d9" stroke="#bd7a20">
      <rect x="210" y="60" width="140" height="52" rx="8"/>
      <rect x="210" y="250" width="140" height="52" rx="8"/>
      <rect x="430" y="60" width="160" height="52" rx="8"/>
      <rect x="630" y="440" width="150" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#66400f">
      <text x="280" y="81">WS gateway 1</text>
      <text x="280" y="271">WS gateway 2</text>
      <text x="510" y="81">Chat service</text>
      <text x="705" y="461">Push service</text>
    </g>
    <g font-size="11.5" fill="#66400f">
      <text x="280" y="99">holds A's socket</text>
      <text x="280" y="289">holds B's socket</text>
      <text x="510" y="99">dedupe, assign seq</text>
      <text x="705" y="479">APNs / FCM</text>
    </g>

    <g stroke-width="2" fill="#f0e9fb" stroke="#8062a8">
      <rect x="210" y="153" width="140" height="52" rx="8"/>
      <rect x="640" y="60" width="140" height="52" rx="8"/>
      <rect x="630" y="153" width="150" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365">
      <text x="280" y="174">Presence</text>
      <text x="710" y="81">Messages DB</text>
      <text x="705" y="174">Session registry</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="280" y="192">Redis, TTL 90 s</text>
      <text x="710" y="99">by conversation</text>
      <text x="705" y="192">user → gateway</text>
    </g>

    <g stroke-width="2" fill="#eef1f5" stroke="#8a96a3">
      <rect x="420" y="250" width="140" height="52" rx="8"/>
      <rect x="420" y="440" width="160" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="490" y="271">Pub/sub</text>
      <text x="500" y="461">Push queue</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="490" y="289">deliver:{gatewayId}</text>
      <text x="500" y="479">offline recipients</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M140 76H208" marker-end="url(#cha-arrow)"/>
      <path d="M350 76H428" marker-end="url(#cha-arrow)"/>
      <path d="M590 76H638" marker-end="url(#cha-arrow)"/>
      <path d="M590 104L630 160" marker-end="url(#cha-arrow)"/>
      <path d="M490 112V248" marker-end="url(#cha-arrow)"/>
      <path d="M420 276H352" marker-end="url(#cha-arrow)"/>
      <path d="M210 276H142" marker-end="url(#cha-arrow)"/>
      <path d="M280 112V151" marker-end="url(#cha-arrow)"/>
      <path d="M280 250V207" marker-end="url(#cha-arrow)"/>
      <path d="M575 112V438" marker-end="url(#cha-arrow)"/>
      <path d="M580 466H628" marker-end="url(#cha-arrow)"/>
      <path d="M705 492V520H80V494" marker-end="url(#cha-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round">
      <path d="M428 98H352" marker-end="url(#cha-arrow)"/>
      <path d="M208 98H142" marker-end="url(#cha-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="174" y="69">1. send</text>
      <text x="389" y="69">2. send</text>
      <text x="614" y="69">3. save</text>
      <text x="389" y="114">ack, seq</text>
      <text x="174" y="126">ack</text>
      <text x="616" y="124" text-anchor="start">4. lookup</text>
      <text x="480" y="190" text-anchor="end">5. publish</text>
      <text x="386" y="268">6. deliver</text>
      <text x="176" y="268">7. message</text>
      <text x="290" y="136" text-anchor="start">heartbeat</text>
      <text x="290" y="232" text-anchor="start">heartbeat</text>
      <text x="585" y="380" text-anchor="start">8. offline: push job</text>
      <text x="604" y="458">9. send</text>
      <text x="390" y="514">10. notification via APNs / FCM</text>
    </g>
    <text x="400" y="546" font-size="13" fill="#40566b">Stored once, routed via the session registry and pub/sub; offline recipients get a push.</text>
  </g>
</svg>
