<svg xmlns="http://www.w3.org/2000/svg" width="760" height="444" viewBox="0 0 760 444" role="img" aria-labelledby="sdl-title sdl-desc">
  <title id="sdl-title">System design is a loop: find the bottleneck, deep dive, revise, re-check</title>
  <desc id="sdl-desc">Requirements and estimates feed a high-level design. The design is checked at ten times the load and under failures to find the bottleneck. If the design meets the requirements, wrap up. If not, deep dive on that part and pick a fix such as a cache, sharding, a queue, replicas, or async work, then revise the design and update the numbers, and check the revised design again.</desc>
  <defs>
    <marker id="sdl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="760" height="444" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="20" width="220" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="150" y="45" font-size="14" font-weight="700" fill="#36424e">Requirements + estimates</text>

    <rect x="40" y="96" width="220" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="150" y="119" font-size="14" font-weight="700" fill="#66400f">High-level design</text>
    <text x="150" y="138" font-size="11.5" fill="#66400f">components + read/write paths</text>

    <rect x="500" y="96" width="220" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="610" y="119" font-size="14" font-weight="700" fill="#463365">Find the bottleneck</text>
    <text x="610" y="138" font-size="11.5" fill="#463365">what breaks first at 10×?</text>

    <path d="M610 196 720 232 610 268 500 232z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="610" y="229" font-size="12" font-weight="700" fill="#36424e">meets the</text>
    <text x="610" y="243" font-size="12" font-weight="700" fill="#36424e">requirements?</text>

    <rect x="262" y="204" width="200" height="60" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="362" y="225" font-size="14" font-weight="700" fill="#66400f">Deep dive</text>
    <text x="362" y="242" font-size="11.5" fill="#66400f">pick a fix: cache, shard,</text>
    <text x="362" y="257" font-size="11.5" fill="#66400f">queue, replica, async</text>

    <rect x="40" y="204" width="180" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="130" y="227" font-size="14" font-weight="700" fill="#263e5a">Revise the design</text>
    <text x="130" y="246" font-size="11.5" fill="#263e5a">and update the numbers</text>

    <rect x="500" y="300" width="220" height="52" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="610" y="321" font-size="14" font-weight="700" fill="#294a2e">Wrap up</text>
    <text x="610" y="339" font-size="11.5" fill="#294a2e">summary, risks, next steps</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 60V94" marker-end="url(#sdl-arrow)"/>
      <path d="M260 124H498" marker-end="url(#sdl-arrow)"/>
      <path d="M610 152V194" marker-end="url(#sdl-arrow)"/>
      <path d="M500 232H464" marker-end="url(#sdl-arrow)"/>
      <path d="M262 232H222" marker-end="url(#sdl-arrow)"/>
      <path d="M130 204V154" marker-end="url(#sdl-arrow)"/>
      <path d="M610 268V298" marker-end="url(#sdl-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="379" y="116">check at 10× load and on failure</text>
      <text x="242" y="224">apply</text>
      <text x="140" y="183" text-anchor="start">re-check</text>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="482" y="224">no</text>
      <text x="620" y="288" text-anchor="start">yes</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="380" y="380">Example: the database runs at 90% CPU → deep dive: add a cache and read replicas →</text>
      <text x="380" y="397">re-estimate the database load → it now has headroom → wrap up.</text>
    </g>
    <text x="380" y="428" font-size="13" fill="#40566b">Each deep dive can change the numbers or the design; loop until the requirements are met.</text>
  </g>
</svg>
