<svg xmlns="http://www.w3.org/2000/svg" width="800" height="684" viewBox="0 0 800 684" role="img" aria-labelledby="rls-title rls-desc">
  <title id="rls-title">The atomic Redis check for allowed, denied, and Redis-down requests</title>
  <desc id="rls-desc">Allowed: the client calls the API, the gateway matches the rules and sends one EVALSHA to Redis, which atomically refills the bucket and takes a token, replies allowed with 187 tokens left, and the client gets 200 OK with RateLimit headers. Bucket empty: Redis replies denied with a 4,000 millisecond wait and the client gets 429 with Retry-After 4. Redis unavailable: the call times out after 10 milliseconds and the gateway follows the rule's fail mode, allowing general API traffic with a local fallback limit but rejecting sign-in, OTP and SMS requests.</desc>
  <defs>
    <marker id="rls-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rls-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="684" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="20" width="140" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="110" y="40" font-size="14" font-weight="700" fill="#263e5a">Client</text>
    <text x="110" y="57" font-size="11.5" fill="#263e5a">API key key_8f3c</text>
    <rect x="330" y="20" width="140" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="40" font-size="14" font-weight="700" fill="#66400f">API gateway</text>
    <text x="400" y="57" font-size="11.5" fill="#66400f">rate-limit middleware</text>
    <rect x="620" y="20" width="140" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="690" y="40" font-size="14" font-weight="700" fill="#463365">Redis</text>
    <text x="690" y="57" font-size="11.5" fill="#463365">bucket per key</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M110 68V646"/>
      <path d="M400 68V646"/>
      <path d="M690 68V646"/>
    </g>
    <g stroke="#c3ccd7" stroke-width="1.5">
      <path d="M20 84H780M20 348H780M20 498H780"/>
    </g>
    <g font-size="12" font-weight="700" fill="#8062a8" text-anchor="start">
      <text x="24" y="102">Allowed</text>
      <text x="24" y="366">Bucket empty</text>
      <text x="24" y="516">Redis unavailable</text>
    </g>

    <rect x="330" y="146" width="140" height="32" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="160" font-size="11.5" font-weight="700" fill="#66400f">match rules</text>
    <text x="400" y="173" font-size="11.5" fill="#66400f">pro plan: 1,000/min</text>
    <rect x="605" y="232" width="170" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="690" y="247" font-size="11.5" font-weight="700" fill="#463365">one atomic script</text>
    <text x="690" y="261" font-size="11.5" fill="#463365">refill, take 1 token</text>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="end">
      <text x="322" y="166">2.</text>
      <text x="597" y="254">4.</text>
    </g>

    <g text-anchor="start" fill="#36424e">
      <text x="122" y="110" font-size="12" font-weight="700">1. GET /v1/orders</text>
      <text x="122" y="124" font-size="11">X-API-Key: key_8f3c</text>
      <text x="412" y="198" font-size="12" font-weight="700">3. EVALSHA token_bucket</text>
      <text x="412" y="212" font-size="11">rl:{key_8f3c}:pro, 200, 16.67, 1</text>
      <text x="412" y="284" font-size="12" font-weight="700">5. {1, 187, 0}: allowed</text>
      <text x="122" y="308" font-size="12" font-weight="700">6. 200 OK (from the service)</text>
      <text x="122" y="322" font-size="11">RateLimit headers, 187 left</text>
      <text x="122" y="382" font-size="12" font-weight="700">7. GET /v1/orders</text>
      <text x="412" y="408" font-size="12" font-weight="700">8. EVALSHA (same key)</text>
      <text x="412" y="434" font-size="12" font-weight="700">9. {0, 0, 4000}: denied</text>
      <text x="122" y="458" font-size="12" font-weight="700" fill="#6b241c">10. 429 Too Many Requests</text>
      <text x="122" y="472" font-size="11" fill="#6b241c">Retry-After: 4</text>
      <text x="122" y="532" font-size="12" font-weight="700">11. POST /login</text>
      <text x="412" y="558" font-size="12" font-weight="700">12. EVALSHA</text>
      <text x="648" y="570" font-size="11.5" font-weight="700" fill="#6b241c">✕ timeout (10 ms)</text>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 132H398" stroke="#40566b" marker-end="url(#rls-arrow)"/>
      <path d="M400 220H688" stroke="#40566b" marker-end="url(#rls-arrow)"/>
      <path d="M690 292H402" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#rls-ret)"/>
      <path d="M400 330H112" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#rls-ret)"/>
      <path d="M110 390H398" stroke="#40566b" marker-end="url(#rls-arrow)"/>
      <path d="M400 416H688" stroke="#40566b" marker-end="url(#rls-arrow)"/>
      <path d="M690 442H402" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#rls-ret)"/>
      <path d="M400 480H112" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#rls-ret)"/>
      <path d="M110 540H398" stroke="#40566b" marker-end="url(#rls-arrow)"/>
      <path d="M400 566H640" stroke="#40566b" marker-end="url(#rls-arrow)"/>
    </g>

    <text x="400" y="584" font-size="12" font-weight="700" fill="#36424e">13. follow the rule's failMode</text>
    <rect x="228" y="592" width="164" height="42" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="310" y="609" font-size="12" font-weight="700" fill="#294a2e">fail open → allow</text>
    <text x="310" y="625" font-size="11.5" fill="#294a2e">general API, local limit</text>
    <rect x="408" y="592" width="164" height="42" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="490" y="609" font-size="12" font-weight="700" fill="#6b241c">fail closed → reject</text>
    <text x="490" y="625" font-size="11.5" fill="#6b241c">sign-in, OTP, SMS</text>

    <text x="400" y="668" font-size="13" fill="#40566b">Read, refill, and take run as one script, so two gateways can never spend the same token.</text>
  </g>
</svg>
