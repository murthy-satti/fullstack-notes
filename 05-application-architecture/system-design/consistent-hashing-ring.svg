<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="chr-title chr-desc">
  <title id="chr-title">Consistent hashing: adding a node moves only the keys just before its points</title>
  <desc id="chr-desc">Left: servers A, B and C each have three virtual nodes on a hash ring, and nine keys each belong to the next virtual node clockwise. Right: server D is added with three virtual nodes placed between A and B. Only the three keys that sit between an A point and the new D point move to D; the other six keys keep their owners. With hash of key modulo N, going from 3 to 4 servers would move about 75 percent of keys.</desc>
  <defs>
    <marker id="chr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="36" font-size="13" font-weight="700" fill="#40566b">Before: servers A, B, C (3 virtual nodes each)</text>
    <text x="580" y="36" font-size="13" font-weight="700" fill="#40566b">After adding server D: 3 of 9 keys move</text>

    <g fill="none" stroke="#8a96a3" stroke-width="2">
      <circle cx="200" cy="215" r="110"/>
      <circle cx="580" cy="215" r="110"/>
      <path d="M200 99V111M580 99V111"/>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M156 95A128 128 0 0 1 244 95" marker-end="url(#chr-arrow)"/>
      <path d="M536 95A128 128 0 0 1 624 95" marker-end="url(#chr-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="200" y="76">clockwise</text>
      <text x="580" y="76">clockwise</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="200" y="125">0</text>
      <text x="580" y="125">0</text>
      <text x="200" y="230">0 … 2^32 − 1</text>
      <text x="580" y="230">0 … 2^32 − 1</text>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e">
      <text x="200" y="212">hash ring</text>
      <text x="580" y="212">hash ring</text>
    </g>

    <g stroke-width="2">
      <circle cx="215.3" cy="128.3" r="6" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="244" cy="138.8" r="6" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="269.3" cy="160.8" r="6" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="287.7" cy="207.3" r="6" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="272.1" cy="265.5" r="6" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="244" cy="291.2" r="6" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="162.8" cy="294.8" r="6" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="112" cy="215" r="6" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="156" cy="138.8" r="6" fill="#f0e9fb" stroke="#8062a8"/>

      <circle cx="595.3" cy="128.3" r="6" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="649.3" cy="160.8" r="6" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="667.7" cy="207.3" r="6" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="652.1" cy="265.5" r="6" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="542.8" cy="294.8" r="6" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="536" cy="138.8" r="6" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g stroke-width="3" fill="#fff0d9" stroke="#bd7a20">
      <circle cx="624" cy="138.8" r="7"/>
      <circle cx="624" cy="291.2" r="7"/>
      <circle cx="492" cy="215" r="7"/>
    </g>

    <g stroke-width="2">
      <circle cx="237.6" cy="111.6" r="12" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="270.7" cy="299.3" r="12" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="91.7" cy="234.1" r="12" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="295.3" cy="160" r="12" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="200" cy="325" r="12" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="104.7" cy="160" r="12" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="308.3" cy="234.1" r="12" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="129.3" cy="299.3" r="12" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="162.4" cy="111.6" r="12" fill="#f0e9fb" stroke="#8062a8"/>

      <circle cx="617.6" cy="111.6" r="12" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="650.7" cy="299.3" r="12" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="471.7" cy="234.1" r="12" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="675.3" cy="160" r="12" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="580" cy="325" r="12" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="484.7" cy="160" r="12" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="688.3" cy="234.1" r="12" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="509.3" cy="299.3" r="12" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="542.4" cy="111.6" r="12" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="650.7" cy="130.7" r="12" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="617.6" cy="318.4" r="12" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="471.7" cy="195.9" r="12" fill="#fff0d9" stroke="#bd7a20"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="237.6" y="115.6" fill="#263e5a">A</text>
      <text x="270.7" y="303.3" fill="#263e5a">A</text>
      <text x="91.7" y="238.1" fill="#263e5a">A</text>
      <text x="295.3" y="164" fill="#294a2e">B</text>
      <text x="200" y="329" fill="#294a2e">B</text>
      <text x="104.7" y="164" fill="#294a2e">B</text>
      <text x="308.3" y="238.1" fill="#463365">C</text>
      <text x="129.3" y="303.3" fill="#463365">C</text>
      <text x="162.4" y="115.6" fill="#463365">C</text>

      <text x="617.6" y="115.6" fill="#263e5a">A</text>
      <text x="650.7" y="303.3" fill="#263e5a">A</text>
      <text x="471.7" y="238.1" fill="#263e5a">A</text>
      <text x="675.3" y="164" fill="#294a2e">B</text>
      <text x="580" y="329" fill="#294a2e">B</text>
      <text x="484.7" y="164" fill="#294a2e">B</text>
      <text x="688.3" y="238.1" fill="#463365">C</text>
      <text x="509.3" y="303.3" fill="#463365">C</text>
      <text x="542.4" y="115.6" fill="#463365">C</text>
      <text x="650.7" y="134.7" fill="#66400f">D</text>
      <text x="617.6" y="322.4" fill="#66400f">D</text>
      <text x="471.7" y="199.9" fill="#66400f">D</text>
    </g>

    <g stroke-width="2">
      <circle cx="56" cy="374" r="9" fill="#e5efff" stroke="#4774aa"/>
      <circle cx="78" cy="374" r="9" fill="#e8f5e9" stroke="#53845b"/>
      <circle cx="100" cy="374" r="9" fill="#f0e9fb" stroke="#8062a8"/>
      <circle cx="122" cy="374" r="9" fill="#fff0d9" stroke="#bd7a20"/>
      <circle cx="440" cy="374" r="6" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <circle cx="610" cy="374" r="7" fill="#fff0d9" stroke="#bd7a20" stroke-width="3"/>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="140" y="378">virtual nodes of servers A, B, C, D</text>
      <text x="454" y="378">key, colored by its owner</text>
      <text x="624" y="378">key moved to D</text>
    </g>
    <text x="390" y="420" font-size="12" font-weight="700" fill="#40566b">hash(key) % N from 3 to 4 servers moves about 75% of keys; consistent hashing moves about 1/4.</text>
    <text x="390" y="456" font-size="13" fill="#40566b">Each key belongs to the next node clockwise; D only takes keys from the arcs just before its points.</text>
  </g>
</svg>
