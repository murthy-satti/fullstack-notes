<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="bbr-title bbr-desc">
  <title id="bbr-title">Where each building block sits on a request path</title>
  <desc id="bbr-desc">The client resolves the name with DNS, fetches static files from the CDN, and sends API calls to the load balancer, which forwards them through the API gateway to stateless app servers. App servers read from the cache, go to the database on a cache miss or a write, publish jobs to a message queue, and store files in object storage. Workers consume the queue and update the search index. On a cache miss the CDN fetches from the origin, here object storage.</desc>
  <defs>
    <marker id="bbr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="570" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="320" y="20" width="160" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="400" y="40" font-size="14" font-weight="700" fill="#263e5a">Client</text>
    <text x="400" y="58" font-size="11.5" fill="#263e5a">browser or mobile app</text>

    <g stroke-width="2" fill="#eef1f5" stroke="#8a96a3">
      <rect x="40" y="110" width="170" height="52" rx="8"/>
      <rect x="315" y="110" width="170" height="52" rx="8"/>
      <rect x="590" y="110" width="170" height="52" rx="8"/>
      <rect x="315" y="196" width="170" height="52" rx="8"/>
      <rect x="380" y="400" width="160" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="125" y="131">DNS</text>
      <text x="400" y="131">Load balancer</text>
      <text x="675" y="131">CDN</text>
      <text x="400" y="217">API gateway</text>
      <text x="460" y="421">Message queue</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="125" y="150">name → IP address</text>
      <text x="400" y="150">health checks, TLS</text>
      <text x="675" y="150">static + cached content</text>
      <text x="400" y="236">auth, rate limits</text>
      <text x="460" y="440">async jobs, events</text>
    </g>

    <rect x="290" y="282" width="220" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="305" font-size="14" font-weight="700" fill="#66400f">App servers</text>
    <text x="400" y="324" font-size="11.5" fill="#66400f">stateless, scale out</text>
    <rect x="380" y="480" width="160" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="460" y="500" font-size="14" font-weight="700" fill="#66400f">Workers</text>
    <text x="460" y="517" font-size="11.5" fill="#66400f">consume jobs</text>

    <g stroke-width="2" fill="#f0e9fb" stroke="#8062a8">
      <rect x="30" y="400" width="150" height="52" rx="8"/>
      <rect x="205" y="400" width="150" height="52" rx="8"/>
      <rect x="580" y="400" width="170" height="52" rx="8"/>
      <rect x="580" y="480" width="170" height="48" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365">
      <text x="105" y="421">Cache</text>
      <text x="280" y="421">Database</text>
      <text x="665" y="421">Object storage</text>
      <text x="665" y="500">Search index</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="105" y="440">Redis, hot reads</text>
      <text x="280" y="440">source of truth</text>
      <text x="665" y="440">files and media</text>
      <text x="665" y="517">full-text queries</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M325 60L198 108" marker-end="url(#bbr-arrow)"/>
      <path d="M400 68V108" marker-end="url(#bbr-arrow)"/>
      <path d="M475 60L602 108" marker-end="url(#bbr-arrow)"/>
      <path d="M400 162V194" marker-end="url(#bbr-arrow)"/>
      <path d="M400 248V280" marker-end="url(#bbr-arrow)"/>
      <path d="M320 338L135 398" marker-end="url(#bbr-arrow)"/>
      <path d="M360 338L292 398" marker-end="url(#bbr-arrow)"/>
      <path d="M440 338L455 398" marker-end="url(#bbr-arrow)"/>
      <path d="M480 338L630 398" marker-end="url(#bbr-arrow)"/>
      <path d="M460 452V478" marker-end="url(#bbr-arrow)"/>
      <path d="M540 504H578" marker-end="url(#bbr-arrow)"/>
    </g>
    <path d="M700 162V398" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#bbr-arrow)"/>

    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="250" y="76" text-anchor="end">1. resolve name</text>
      <text x="410" y="92" text-anchor="start">2. API call</text>
      <text x="550" y="76" text-anchor="start">static files</text>
      <text x="240" y="354" text-anchor="end">read, hit?</text>
      <text x="306" y="378" text-anchor="end">miss or write</text>
      <text x="456" y="376" text-anchor="start">publish</text>
      <text x="576" y="356" text-anchor="start">files</text>
      <text x="470" y="470" text-anchor="start">consume</text>
      <text x="559" y="497">index</text>
      <text x="710" y="268" text-anchor="start">cache miss:</text>
      <text x="710" y="283" text-anchor="start">fetch origin</text>
    </g>
    <text x="400" y="554" font-size="13" fill="#40566b">Static content comes from the CDN; API calls pass the load balancer and gateway to stateless app servers.</text>
  </g>
</svg>
