<svg xmlns="http://www.w3.org/2000/svg" width="800" height="488" viewBox="0 0 800 488" role="img" aria-labelledby="lat-title lat-desc">
  <title id="lat-title">Approximate latency of common operations on a log scale</title>
  <desc id="lat-desc">On a scale where each gridline is ten times slower: an L1 cache reference takes about 1 nanosecond, a main memory reference about 100 nanoseconds, reading 1 MB from memory 50 to 100 microseconds, a random SSD read about 0.1 milliseconds, a round trip inside a data center about 0.5 milliseconds, reading 1 MB from an NVMe SSD 0.3 to 1 millisecond, a round trip between availability zones 1 to 2 milliseconds, a hard disk seek or reading 1 MB from a hard disk 5 to 10 milliseconds, and a round trip between continents 70 to 150 milliseconds. Memory is about 1,000 times faster than an SSD random read.</desc>
  <defs>
    <marker id="lat-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="488" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="28" font-size="13" font-weight="700" fill="#40566b">Log scale: each gridline is 10× slower than the one before</text>
    <g stroke="#c3ccd7" stroke-width="1.5">
      <path d="M310 66V392M360 66V392M410 66V392M460 66V392M510 66V392M560 66V392M610 66V392M660 66V392M710 66V392M760 66V392"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="310" y="58">1 ns</text>
      <text x="360" y="58">10 ns</text>
      <text x="410" y="58">100 ns</text>
      <text x="460" y="58">1 µs</text>
      <text x="510" y="58">10 µs</text>
      <text x="560" y="58">100 µs</text>
      <text x="610" y="58">1 ms</text>
      <text x="660" y="58">10 ms</text>
      <text x="710" y="58">100 ms</text>
      <text x="760" y="58">1 s</text>
    </g>

    <g font-size="12" fill="#36424e" text-anchor="end">
      <text x="296" y="90">CPU L1 cache reference</text>
      <text x="296" y="122">Main memory reference</text>
      <text x="296" y="154">Read 1 MB from memory</text>
      <text x="296" y="186">SSD random 4 KB read</text>
      <text x="296" y="218">Round trip in a data center</text>
      <text x="296" y="250">Read 1 MB from NVMe SSD</text>
      <text x="296" y="282">Round trip between zones</text>
      <text x="296" y="314">Hard disk seek</text>
      <text x="296" y="346">Read 1 MB from hard disk</text>
      <text x="296" y="378">Round trip between continents</text>
    </g>

    <g stroke-width="2">
      <rect x="310" y="77" width="8" height="18" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="310" y="109" width="100" height="18" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="310" y="141" width="244" height="18" rx="4" fill="#e5efff" stroke="#4774aa"/>
      <rect x="310" y="173" width="250" height="18" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="310" y="205" width="285" height="18" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="310" y="237" width="287" height="18" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="310" y="269" width="309" height="18" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="310" y="301" width="342" height="18" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="310" y="333" width="342" height="18" rx="4" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="310" y="365" width="400" height="18" rx="4" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="11.5" font-weight="700" text-anchor="start">
      <text x="326" y="90" fill="#263e5a">~1 ns</text>
      <text x="418" y="122" fill="#263e5a">~100 ns</text>
      <text x="562" y="154" fill="#263e5a">~50–100 µs</text>
      <text x="568" y="186" fill="#66400f">~0.1 ms</text>
      <text x="603" y="218" fill="#463365">~0.5 ms</text>
      <text x="605" y="250" fill="#66400f">~0.3–1 ms</text>
      <text x="627" y="282" fill="#463365">~1–2 ms</text>
      <text x="660" y="314" fill="#66400f">~5–10 ms</text>
      <text x="660" y="346" fill="#66400f">~5–10 ms</text>
      <text x="718" y="378" fill="#463365">~70–150 ms</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M485 406H558" marker-end="url(#lat-arrow)"/>
      <path d="M485 406H412" marker-end="url(#lat-arrow)"/>
    </g>
    <text x="485" y="426" font-size="12" font-weight="700" fill="#40566b">memory vs SSD random read: about 1,000×</text>

    <g stroke-width="2">
      <rect x="40" y="440" width="16" height="12" rx="3" fill="#e5efff" stroke="#4774aa"/>
      <rect x="170" y="440" width="16" height="12" rx="3" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="300" y="440" width="16" height="12" rx="3" fill="#f0e9fb" stroke="#8062a8"/>
    </g>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="62" y="451">CPU and memory</text>
      <text x="192" y="451">disk and SSD</text>
      <text x="322" y="451">network round trips</text>
    </g>
    <text x="400" y="476" font-size="13" fill="#40566b">Memory beats SSD by ~1,000×; one cross-continent round trip outweighs most request work.</text>
  </g>
</svg>
