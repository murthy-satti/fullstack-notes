<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="rla-title rla-desc">
  <title id="rla-title">Distributed rate limiter inside the API gateway</title>
  <desc id="rla-desc">A client request passes the CDN, WAF and load balancer to an API gateway. The gateway authenticates the request, identifies the client key, matches cached rules, and makes one Lua call to the Redis Cluster that holds a token bucket per client. If allowed, the request goes to the services with RateLimit headers. If denied, the client receives 429 with Retry-After. Rules are edited through the rules admin API, stored in the rules database, and reloaded by gateways on change events. Gateways send allowed and denied counts to monitoring.</desc>
  <defs>
    <marker id="rla-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="540" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="210" width="100" height="52" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="70" y="231" font-size="14" font-weight="700" fill="#263e5a">Client</text>
    <text x="70" y="249" font-size="11.5" fill="#263e5a">API key</text>

    <g stroke-width="2" fill="#eef1f5" stroke="#8a96a3">
      <rect x="160" y="210" width="140" height="52" rx="8"/>
      <rect x="170" y="40" width="160" height="52" rx="8"/>
      <rect x="630" y="40" width="150" height="52" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="230" y="231">CDN/WAF + LB</text>
      <text x="250" y="61">Rules admin API</text>
      <text x="705" y="61">Monitoring</text>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="230" y="249">volumetric attacks</text>
      <text x="250" y="79">versioned rules</text>
      <text x="705" y="79">allowed vs denied</text>
    </g>

    <rect x="355" y="140" width="240" height="196" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="475" y="162" font-size="14" font-weight="700" fill="#66400f">API gateway</text>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="371" y="176" width="208" height="30" rx="6"/>
      <rect x="371" y="214" width="208" height="30" rx="6"/>
      <rect x="371" y="252" width="208" height="30" rx="6"/>
      <rect x="371" y="290" width="208" height="30" rx="6"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="475" y="196">1. authenticate</text>
      <text x="475" y="234">2. identify the client key</text>
      <text x="475" y="272">3. match cached rules</text>
      <text x="475" y="310">4. one Lua call to Redis</text>
    </g>

    <g stroke-width="2" fill="#f0e9fb" stroke="#8062a8">
      <rect x="380" y="40" width="180" height="52" rx="8"/>
      <rect x="380" y="410" width="190" height="56" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#463365">
      <text x="470" y="61">Rules DB</text>
      <text x="475" y="433">Redis Cluster</text>
    </g>
    <g font-size="11.5" fill="#463365">
      <text x="470" y="79">rules, per-customer overrides</text>
      <text x="475" y="452">token bucket per client key</text>
    </g>

    <rect x="650" y="166" width="130" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="715" y="189" font-size="14" font-weight="700" fill="#294a2e">Services</text>
    <text x="715" y="207" font-size="11.5" fill="#294a2e">RateLimit headers</text>
    <rect x="650" y="262" width="130" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="715" y="285" font-size="14" font-weight="700" fill="#6b241c">429 response</text>
    <text x="715" y="303" font-size="11.5" fill="#6b241c">Retry-After: 4</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 236H158" marker-end="url(#rla-arrow)"/>
      <path d="M300 236H353" marker-end="url(#rla-arrow)"/>
      <path d="M455 336V408" marker-end="url(#rla-arrow)"/>
      <path d="M595 194H648" marker-end="url(#rla-arrow)"/>
      <path d="M595 290H648" marker-end="url(#rla-arrow)"/>
      <path d="M330 66H378" marker-end="url(#rla-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M500 408V338" marker-end="url(#rla-arrow)"/>
      <path d="M470 92V138" marker-end="url(#rla-arrow)"/>
      <path d="M580 140L682 94" marker-end="url(#rla-arrow)"/>
      <path d="M715 318V492H70V264" marker-end="url(#rla-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="139" y="228">call</text>
      <text x="326" y="228">forward</text>
      <text x="445" y="376" text-anchor="end">EVALSHA</text>
      <text x="510" y="376" text-anchor="start">allowed, remaining</text>
      <text x="621" y="186">allowed</text>
      <text x="621" y="282">denied</text>
      <text x="354" y="66">save</text>
      <text x="480" y="120" text-anchor="start">change event: reload</text>
      <text x="640" y="128" text-anchor="start">metrics</text>
      <text x="300" y="486">429 + Retry-After back to the client</text>
    </g>
    <text x="400" y="522" font-size="13" fill="#40566b">Each request costs one Redis round trip; rules are cached in every gateway and reloaded on change.</text>
  </g>
</svg>
