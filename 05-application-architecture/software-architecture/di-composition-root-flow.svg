<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-labelledby="dic-title dic-desc">
  <title id="dic-title">Dependency injection: wiring once at startup, then one request through the layers</title>
  <desc id="dic-desc">At startup the composition root creates a Mongo order repository, a Stripe gateway and a logger, and passes them to makeOrderService, which returns the orderService object; tests call the same factory with an in-memory repository and a fake gateway instead. Per request, POST /orders/42/pay reaches a thin route handler, which calls orderService.pay(42). The service calls orderRepository.findById on MongoDB, then paymentGateway.charge on the Stripe API, then logger.info, and the handler sends the response.</desc>
  <defs>
    <marker id="dic-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="dic-arrow-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="748" height="200" rx="10" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="30" y="38" font-size="13" font-weight="700" fill="#36424e" text-anchor="start">1. At startup: main.js (composition root), runs once</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="30" y="54" width="230" height="36" rx="8"/>
      <rect x="30" y="102" width="230" height="36" rx="8"/>
      <rect x="30" y="150" width="230" height="36" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#463365">
      <text x="145" y="77">makeMongoOrderRepository(db)</text>
      <text x="145" y="125">makeStripeGateway(STRIPE_KEY)</text>
      <text x="145" y="173">logger</text>
    </g>
    <rect x="320" y="96" width="200" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="420" y="116" font-size="13" font-weight="700" fill="#66400f">makeOrderService({...})</text>
    <text x="420" y="133" font-size="11.5" fill="#66400f">receives its dependencies</text>
    <rect x="580" y="104" width="170" height="32" rx="16" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="665" y="125" font-size="13" font-weight="700" fill="#294a2e">orderService</text>
    <rect x="580" y="156" width="170" height="44" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="665" y="175" font-size="11.5" font-weight="700" fill="#36424e">in tests instead:</text>
    <text x="665" y="191" font-size="11" fill="#36424e">in-memory repo, fake charge()</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 72H290V110H318" marker-end="url(#dic-arrow)"/>
      <path d="M260 120H318" marker-end="url(#dic-arrow)"/>
      <path d="M260 168H290V130H318" marker-end="url(#dic-arrow)"/>
      <path d="M520 120H578" marker-end="url(#dic-arrow)"/>
    </g>
    <path d="M580 178H550V140H520" fill="none" stroke="#60788d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dic-arrow-b)"/>
    <text x="300" y="66" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">injected</text>

    <rect x="16" y="230" width="748" height="250" rx="10" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="30" y="252" font-size="13" font-weight="700" fill="#36424e" text-anchor="start">2. Per request: POST /orders/42/pay</text>

    <rect x="30" y="300" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="105" y="319" font-size="13" font-weight="700" fill="#263e5a">route handler</text>
    <text x="105" y="336" font-size="11.5" fill="#263e5a">thin: parse, respond</text>
    <rect x="230" y="300" width="170" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="315" y="319" font-size="13" font-weight="700" fill="#66400f">orderService.pay(42)</text>
    <text x="315" y="336" font-size="11.5" fill="#66400f">business logic</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="470" y="268" width="180" height="40" rx="8"/>
      <rect x="470" y="324" width="180" height="40" rx="8"/>
      <rect x="470" y="380" width="180" height="40" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="560" y="293">orderRepository.findById</text>
      <text x="560" y="349">paymentGateway.charge</text>
      <text x="560" y="405">logger.info</text>
    </g>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="676" y="272" width="76" height="32" rx="8"/>
      <rect x="676" y="328" width="76" height="32" rx="8"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="714" y="293">MongoDB</text>
      <text x="714" y="349">Stripe</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 322H228" marker-end="url(#dic-arrow)"/>
      <path d="M400 316H430V288H468" marker-end="url(#dic-arrow)"/>
      <path d="M400 328H468" marker-end="url(#dic-arrow)"/>
      <path d="M400 336H430V400H468" marker-end="url(#dic-arrow)"/>
      <path d="M650 288H674" marker-end="url(#dic-arrow)"/>
      <path d="M650 344H674" marker-end="url(#dic-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#40566b">
      <text x="452" y="282">1</text>
      <text x="452" y="322">2</text>
      <text x="452" y="394">3</text>
    </g>
    <path d="M315 344V440H105V346" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#dic-arrow-b)"/>
    <text x="210" y="434" font-size="11.5" fill="#40566b">returns; handler sends the response</text>

    <path d="M750 120H760V214H315V298" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="330" y="228" font-size="11" font-style="italic" fill="#294a2e" text-anchor="start">same object, created once at startup</text>
    <text x="390" y="504" font-size="13" fill="#40566b">The service never creates its dependencies; swapping Mongo or Stripe changes only main.js.</text>
  </g>
</svg>
