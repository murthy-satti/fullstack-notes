<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="car-title car-desc">
  <title id="car-title">Clean architecture rings and the dependency rule</title>
  <desc id="car-desc">Four nested rings: frameworks and drivers such as Express, the MongoDB driver and the Stripe SDK on the outside; interface adapters such as OrdersController and MongoOrderRepository; use cases such as PlaceOrder, CancelOrder and RefundPayment, which also define the OrderRepository port; and entities such as Order, Money and OrderLine at the center. Source-code dependencies point inward: MongoOrderRepository implements the OrderRepository port defined by the use cases. At runtime the use case still calls the Mongo repository, but only through that port.</desc>
  <defs>
    <marker id="car-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="car-arrow-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="780" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="520" height="410" rx="28" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <rect x="52" y="64" width="456" height="322" rx="24" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <rect x="84" y="108" width="392" height="234" rx="20" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <rect x="128" y="152" width="304" height="90" rx="16" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>

    <text x="280" y="42" font-size="13" font-weight="700" fill="#36424e">Frameworks and drivers</text>
    <text x="280" y="57" font-size="11.5" fill="#36424e">Express, MongoDB driver, Stripe SDK</text>
    <text x="280" y="84" font-size="13" font-weight="700" fill="#463365">Interface adapters</text>
    <text x="280" y="100" font-size="11.5" fill="#463365">OrdersController, repository implementations</text>
    <text x="280" y="128" font-size="13" font-weight="700" fill="#66400f">Use cases</text>
    <text x="280" y="144" font-size="11.5" fill="#66400f">PlaceOrder, CancelOrder, RefundPayment</text>
    <text x="280" y="186" font-size="14" font-weight="700" fill="#294a2e">Entities</text>
    <text x="280" y="204" font-size="11.5" fill="#294a2e">Order, Money, OrderLine</text>
    <text x="280" y="222" font-size="11" font-style="italic" fill="#294a2e">depend on nothing</text>

    <rect x="120" y="258" width="150" height="34" rx="8" fill="#ffffff" stroke="#bd7a20" stroke-width="2"/>
    <text x="195" y="273" font-size="12" font-weight="700" fill="#66400f">OrderRepository</text>
    <text x="195" y="286" font-size="10.5" fill="#66400f">port (an interface)</text>
    <rect x="96" y="348" width="174" height="30" rx="8" fill="#ffffff" stroke="#8062a8" stroke-width="2"/>
    <text x="183" y="368" font-size="12" font-weight="700" fill="#463365">MongoOrderRepository</text>

    <path d="M183 348V294" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#car-arrow-p)"/>
    <text x="194" y="330" font-size="11" font-style="italic" fill="#463365" text-anchor="start">implements</text>

    <g fill="none" stroke="#40566b" stroke-width="2.5" stroke-linecap="round">
      <path d="M420 420V392" marker-end="url(#car-arrow)"/>
      <path d="M420 382V348" marker-end="url(#car-arrow)"/>
      <path d="M420 336V246" marker-end="url(#car-arrow)"/>
    </g>
    <text x="430" y="300" font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">imports</text>
    <text x="430" y="315" font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">point</text>
    <text x="430" y="330" font-size="11.5" font-weight="700" fill="#40566b" text-anchor="start">inward</text>

    <rect x="560" y="20" width="200" height="410" rx="10" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="660" y="46" font-size="13" font-weight="700" fill="#36424e">The dependency rule</text>
    <g font-size="11.5" fill="#36424e" text-anchor="start">
      <text x="574" y="76">Code in an inner ring</text>
      <text x="574" y="92">never mentions an outer</text>
      <text x="574" y="108">ring: no imports, no types,</text>
      <text x="574" y="124">no framework objects.</text>
      <text x="574" y="160">When the core needs</text>
      <text x="574" y="176">something from outside,</text>
      <text x="574" y="192">it defines a port, and an</text>
      <text x="574" y="208">outer ring implements it.</text>
      <text x="574" y="244">At runtime, PlaceOrder</text>
      <text x="574" y="260">still calls the Mongo code,</text>
      <text x="574" y="276">but only through the</text>
      <text x="574" y="292">OrderRepository port.</text>
      <text x="574" y="328">Swap MongoDB for another</text>
      <text x="574" y="344">database: write a new</text>
      <text x="574" y="360">adapter; the inner rings</text>
      <text x="574" y="376">do not change.</text>
    </g>
    <text x="390" y="456" font-size="13" fill="#40566b">Business rules sit in the middle and depend on nothing; details live in the outer rings.</text>
  </g>
</svg>
