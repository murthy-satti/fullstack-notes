<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="orch-title orch-desc">
  <title id="orch-title">Orchestration: one workflow sends commands and tracks the state</title>
  <desc id="orch-desc">The order workflow orchestrator sends ChargePayment to Payments and waits for the reply; on PaymentSucceeded it records the state PAYMENT_DONE and sends ReserveStock to Inventory; on StockReserved it records STOCK_RESERVED and sends CreateShipment to Shipping; on ShipmentCreated it records COMPLETED. If Payments replies PaymentFailed, the orchestrator moves the order to CANCELLED. The whole process is visible in one place.</desc>
  <defs>
    <marker id="orch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="orch-arrow-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="250" height="316" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="149" y="48" font-size="14" font-weight="700" fill="#66400f">Order workflow</text>
    <text x="149" y="64" font-size="11.5" fill="#66400f">orchestrator: persists its state</text>

    <g fill="#ffffff" stroke="#bd7a20" stroke-width="1.5">
      <rect x="64" y="80" width="170" height="30" rx="15"/>
      <rect x="64" y="150" width="170" height="30" rx="15"/>
      <rect x="64" y="220" width="170" height="30" rx="15"/>
    </g>
    <rect x="64" y="290" width="170" height="30" rx="15" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="149" y="100">STARTED</text>
      <text x="149" y="170">PAYMENT_DONE</text>
      <text x="149" y="240">STOCK_RESERVED</text>
    </g>
    <text x="149" y="310" font-size="12" font-weight="700" fill="#294a2e">COMPLETED</text>
    <g fill="none" stroke="#bd7a20" stroke-width="1.5">
      <path d="M149 110V148" marker-end="url(#orch-arrow)"/>
      <path d="M149 180V218" marker-end="url(#orch-arrow)"/>
      <path d="M149 250V288" marker-end="url(#orch-arrow)"/>
    </g>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="560" y="70" width="196" height="56" rx="8"/>
      <rect x="560" y="140" width="196" height="56" rx="8"/>
      <rect x="560" y="210" width="196" height="56" rx="8"/>
    </g>
    <g font-size="14" font-weight="700" fill="#263e5a">
      <text x="658" y="103">Payments</text>
      <text x="658" y="173">Inventory</text>
      <text x="658" y="243">Shipping</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M274 84H558" marker-end="url(#orch-arrow)"/>
      <path d="M274 154H558" marker-end="url(#orch-arrow)"/>
      <path d="M274 224H558" marker-end="url(#orch-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M558 112H276" marker-end="url(#orch-arrow-b)"/>
      <path d="M558 182H276" marker-end="url(#orch-arrow-b)"/>
      <path d="M558 252H276" marker-end="url(#orch-arrow-b)"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="416" y="78" font-weight="700">1. ChargePayment</text>
      <text x="416" y="106">2. PaymentSucceeded</text>
      <text x="416" y="148" font-weight="700">3. ReserveStock</text>
      <text x="416" y="176">4. StockReserved</text>
      <text x="416" y="218" font-weight="700">5. CreateShipment</text>
      <text x="416" y="246">6. ShipmentCreated</text>
    </g>

    <rect x="300" y="290" width="456" height="50" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="528" y="310" font-size="12.5" font-weight="700" fill="#6b241c">If step 2 is PaymentFailed instead:</text>
    <text x="528" y="328" font-size="11.5" fill="#6b241c">the orchestrator moves the order to CANCELLED and stops</text>
    <g font-size="11.5" fill="#40566b" text-anchor="start">
      <path d="M300 368H340" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#orch-arrow)"/>
      <text x="348" y="372">command</text>
      <path d="M430 368H470" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#orch-arrow-b)"/>
      <text x="478" y="372">reply / event</text>
    </g>
    <text x="390" y="394" font-size="12" fill="#40566b">The flow and its state live in one place, easy to read and monitor; the orchestrator knows every step.</text>
  </g>
</svg>
