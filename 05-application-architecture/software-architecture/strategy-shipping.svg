<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="sts-title sts-desc">
  <title id="sts-title">Strategy pattern: choosing a shipping calculator at runtime</title>
  <desc id="sts-desc">shippingCost(order, method) looks up shippingStrategies[method]. If no strategy exists, it throws a ValidationError for an unknown shipping method. Otherwise it calls the chosen function: standard returns 0 when totalCents is at least 10,000 and 499 otherwise, express always returns 1499, and pickup returns 0. For example, an order of 12,500 cents with method standard costs 0. Adding a new method means adding one entry to the map, without changing shippingCost.</desc>
  <defs>
    <marker id="sts-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="190" y="20" width="300" height="40" rx="20" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="340" y="45" font-size="14" font-weight="700" fill="#66400f">shippingCost(order, method)</text>

    <rect x="200" y="80" width="280" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="340" y="99" font-size="13" font-weight="700" fill="#263e5a">look up the strategy</text>
    <text x="340" y="116" font-size="11.5" fill="#263e5a">shippingStrategies[method]</text>

    <path d="M340 144 430 172 340 200 250 172z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="340" y="176" font-size="12" font-weight="700" fill="#36424e">found?</text>

    <rect x="500" y="150" width="256" height="44" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="628" y="169" font-size="13" font-weight="700" fill="#6b241c">throw ValidationError</text>
    <text x="628" y="186" font-size="11.5" fill="#6b241c">"Unknown shipping method"</text>

    <rect x="24" y="244" width="232" height="70" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2.5"/>
    <text x="140" y="266" font-size="14" font-weight="700" fill="#294a2e">standard</text>
    <text x="140" y="284" font-size="11.5" fill="#294a2e">totalCents &gt;= 10_000</text>
    <text x="140" y="300" font-size="11.5" fill="#294a2e">? 0 : 499</text>
    <rect x="274" y="244" width="232" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="272" font-size="14" font-weight="700" fill="#263e5a">express</text>
    <text x="390" y="292" font-size="11.5" fill="#263e5a">always 1499</text>
    <rect x="524" y="244" width="232" height="70" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="640" y="272" font-size="14" font-weight="700" fill="#263e5a">pickup</text>
    <text x="640" y="292" font-size="11.5" fill="#263e5a">always 0</text>

    <rect x="24" y="334" width="232" height="44" rx="8" fill="#ffffff" stroke="#53845b" stroke-width="1.5"/>
    <text x="140" y="352" font-size="11.5" font-weight="700" fill="#294a2e">example: 12,500 cents, "standard"</text>
    <text x="140" y="369" font-size="11.5" fill="#294a2e">returns 0 (free shipping)</text>
    <rect x="274" y="334" width="482" height="44" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="515" y="352" font-size="11.5" font-weight="700" fill="#36424e">new method later? add one entry to the map</text>
    <text x="515" y="369" font-size="11.5" fill="#36424e">shippingCost itself never changes (open/closed principle)</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M340 60V78" marker-end="url(#sts-arrow)"/>
      <path d="M340 124V142" marker-end="url(#sts-arrow)"/>
      <path d="M430 172H498" marker-end="url(#sts-arrow)"/>
      <path d="M340 200V222H140V242" marker-end="url(#sts-arrow)"/>
      <path d="M340 222H390V242" marker-end="url(#sts-arrow)"/>
      <path d="M390 222H640V242" marker-end="url(#sts-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="464" y="164">no</text>
      <text x="352" y="216" text-anchor="start">yes: call it</text>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="200" y="236">"standard"</text>
      <text x="420" y="236" text-anchor="start">"express"</text>
      <text x="610" y="236" text-anchor="end">"pickup"</text>
    </g>
    <text x="390" y="410" font-size="13" fill="#40566b">The caller passes a key; the map decides which interchangeable function runs.</text>
  </g>
</svg>
