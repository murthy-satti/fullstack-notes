<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="sdc-title sdc-desc">
  <title id="sdc-title">Why serverless functions exhaust database connections, and how a proxy helps</title>
  <desc id="sdc-desc">Without a proxy, a traffic spike makes the API gateway start hundreds of function environments, each opening its own database connection, until the database reaches its connection limit and refuses new ones. With a connection proxy such as Amazon RDS Proxy or PgBouncer, every environment connects to the proxy instead, and the proxy multiplexes them onto a small, steady pool of real database connections. In both cases, each environment creates its client in module scope with a pool size of one and reuses it while warm.</desc>
  <defs>
    <marker id="sdc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="366" height="350" rx="10" fill="none" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="398" y="16" width="366" height="350" rx="10" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="199" y="42" font-size="14" font-weight="700" fill="#6b241c">Without a proxy</text>
    <text x="581" y="42" font-size="14" font-weight="700" fill="#294a2e">With a connection proxy</text>

    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="109" y="56" width="180" height="32" rx="8"/>
      <rect x="491" y="56" width="180" height="32" rx="8"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#36424e">
      <text x="199" y="77">API Gateway: spike</text>
      <text x="581" y="77">API Gateway: spike</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5" font-size="11" font-weight="700">
      <rect x="34" y="120" width="70" height="34" rx="6"/>
      <rect x="114" y="120" width="70" height="34" rx="6"/>
      <rect x="194" y="120" width="70" height="34" rx="6"/>
      <rect x="296" y="120" width="70" height="34" rx="6"/>
      <rect x="416" y="120" width="70" height="34" rx="6"/>
      <rect x="496" y="120" width="70" height="34" rx="6"/>
      <rect x="576" y="120" width="70" height="34" rx="6"/>
      <rect x="678" y="120" width="70" height="34" rx="6"/>
    </g>
    <g font-size="11" font-weight="700" fill="#66400f">
      <text x="69" y="141">fn env 1</text>
      <text x="149" y="141">fn env 2</text>
      <text x="229" y="141">fn env 3</text>
      <text x="331" y="141">env 300</text>
      <text x="451" y="141">fn env 1</text>
      <text x="531" y="141">fn env 2</text>
      <text x="611" y="141">fn env 3</text>
      <text x="713" y="141">env 300</text>
    </g>
    <g font-size="16" font-weight="700" fill="#bd7a20">
      <text x="280" y="142">…</text>
      <text x="662" y="142">…</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M199 88V108H69V118" marker-end="url(#sdc-arrow)"/>
      <path d="M199 108H331V118" marker-end="url(#sdc-arrow)"/>
      <path d="M149 108V118" marker-end="url(#sdc-arrow)"/>
      <path d="M229 108V118" marker-end="url(#sdc-arrow)"/>
      <path d="M581 88V108H451V118" marker-end="url(#sdc-arrow)"/>
      <path d="M581 108H713V118" marker-end="url(#sdc-arrow)"/>
      <path d="M531 108V118" marker-end="url(#sdc-arrow)"/>
      <path d="M611 108V118" marker-end="url(#sdc-arrow)"/>
    </g>

    <g fill="none" stroke="#b5473a" stroke-width="1.5">
      <path d="M69 154L170 262" marker-end="url(#sdc-arrow)"/>
      <path d="M149 154L186 262" marker-end="url(#sdc-arrow)"/>
      <path d="M229 154L210 262" marker-end="url(#sdc-arrow)"/>
      <path d="M331 154L232 262" marker-end="url(#sdc-arrow)"/>
    </g>
    <text x="300" y="214" font-size="11" font-style="italic" fill="#6b241c">1 connection each</text>
    <rect x="64" y="264" width="270" height="56" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="199" y="286" font-size="13" font-weight="700" fill="#6b241c">database: limit reached</text>
    <text x="199" y="304" font-size="11.5" fill="#6b241c">new connections refused, requests fail</text>

    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M451 154L560 196" marker-end="url(#sdc-arrow)"/>
      <path d="M531 154L568 196" marker-end="url(#sdc-arrow)"/>
      <path d="M611 154L594 196" marker-end="url(#sdc-arrow)"/>
      <path d="M713 154L604 196" marker-end="url(#sdc-arrow)"/>
    </g>
    <rect x="481" y="198" width="200" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="581" y="215" font-size="12.5" font-weight="700" fill="#463365">RDS Proxy / PgBouncer</text>
    <text x="581" y="230" font-size="10.5" fill="#463365">multiplexes client connections</text>
    <g fill="none" stroke="#53845b" stroke-width="2.5">
      <path d="M551 238V262" marker-end="url(#sdc-arrow)"/>
      <path d="M581 238V262" marker-end="url(#sdc-arrow)"/>
      <path d="M611 238V262" marker-end="url(#sdc-arrow)"/>
    </g>
    <rect x="446" y="264" width="270" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="581" y="286" font-size="13" font-weight="700" fill="#294a2e">database: a few connections</text>
    <text x="581" y="304" font-size="11.5" fill="#294a2e">small, steady pool held by the proxy</text>
    <text x="199" y="344" font-size="11" fill="#6b241c">connections grow with concurrency</text>
    <text x="581" y="344" font-size="11" fill="#294a2e">database sees a stable number</text>

    <rect x="16" y="380" width="748" height="44" rx="8" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <text x="390" y="398" font-size="11.5" fill="#36424e">In every environment: create the client outside the handler with maxPoolSize: 1 and reuse it while warm.</text>
    <text x="390" y="415" font-size="11.5" fill="#36424e">Alternatives: HTTP-based data stores such as DynamoDB, or a concurrency limit on the function.</text>
    <text x="390" y="448" font-size="13" fill="#40566b">Functions scale out by copies; a database scales by connections. A proxy sits between the two.</text>
  </g>
</svg>
