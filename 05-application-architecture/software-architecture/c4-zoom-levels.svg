<svg xmlns="http://www.w3.org/2000/svg" width="780" height="680" viewBox="0 0 780 680" role="img" aria-labelledby="c4-title c4-desc">
  <title id="c4-title">The four C4 zoom levels for an online shop</title>
  <desc id="c4-desc">Level 1 shows the Online Shop as one box: a customer places orders, and the shop charges cards through a payment provider and sends emails through an email service. Level 2 zooms into the shop: a React web app calls a Node.js API over JSON and HTTPS, the API uses SQL against the orders database and publishes to a message queue consumed by a worker. Level 3 zooms into the API: OrdersController calls OrderService, which uses OrderRepository and PaymentClient. Level 4 zooms into OrderService and shows its fields and methods.</desc>
  <defs>
    <marker id="c4-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="680" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5">
      <rect x="20" y="16" width="740" height="128" rx="10"/>
      <rect x="20" y="156" width="740" height="160" rx="10"/>
      <rect x="20" y="328" width="740" height="156" rx="10"/>
      <rect x="20" y="496" width="740" height="140" rx="10"/>
    </g>
    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="36" y="38">Level 1 · System context</text>
      <text x="36" y="178">Level 2 · Containers inside Online Shop</text>
      <text x="36" y="350">Level 3 · Components inside the API</text>
      <text x="36" y="518">Level 4 · Code inside OrderService</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="end">
      <text x="744" y="38">audience: everyone</text>
      <text x="744" y="178">audience: technical people</text>
      <text x="744" y="350">audience: developers, architects</text>
      <text x="744" y="518">usually generated, rarely drawn</text>
    </g>

    <rect x="36" y="60" width="130" height="48" rx="24" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="101" y="81" font-size="14" font-weight="700" fill="#36424e">Customer</text>
    <text x="101" y="98" font-size="11.5" fill="#36424e">person</text>
    <rect x="290" y="60" width="180" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="380" y="81" font-size="14" font-weight="700" fill="#66400f">Online Shop</text>
    <text x="380" y="98" font-size="11.5" fill="#66400f">the system</text>
    <rect x="590" y="52" width="154" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="667" y="75" font-size="13" font-weight="700" fill="#36424e">Payment provider</text>
    <rect x="590" y="96" width="154" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="667" y="119" font-size="13" font-weight="700" fill="#36424e">Email service</text>

    <rect x="36" y="198" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="111" y="217" font-size="14" font-weight="700" fill="#263e5a">Web app</text>
    <text x="111" y="234" font-size="11.5" fill="#263e5a">React</text>
    <rect x="290" y="198" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="380" y="217" font-size="14" font-weight="700" fill="#66400f">API</text>
    <text x="380" y="234" font-size="11.5" fill="#66400f">Node.js</text>
    <rect x="594" y="198" width="150" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="669" y="217" font-size="14" font-weight="700" fill="#463365">Orders DB</text>
    <text x="669" y="234" font-size="11.5" fill="#463365">database</text>
    <rect x="470" y="256" width="120" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="530" y="275" font-size="13" font-weight="700" fill="#36424e">Message</text>
    <text x="530" y="292" font-size="13" font-weight="700" fill="#36424e">queue</text>
    <rect x="630" y="256" width="114" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="687" y="275" font-size="14" font-weight="700" fill="#263e5a">Worker</text>
    <text x="687" y="292" font-size="11.5" fill="#263e5a">consumes jobs</text>

    <rect x="36" y="370" width="190" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="131" y="389" font-size="14" font-weight="700" fill="#263e5a">OrdersController</text>
    <text x="131" y="406" font-size="11.5" fill="#263e5a">HTTP routes</text>
    <rect x="290" y="370" width="180" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="380" y="389" font-size="14" font-weight="700" fill="#66400f">OrderService</text>
    <text x="380" y="406" font-size="11.5" fill="#66400f">business rules</text>
    <rect x="554" y="370" width="190" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="649" y="389" font-size="14" font-weight="700" fill="#263e5a">OrderRepository</text>
    <text x="649" y="406" font-size="11.5" fill="#263e5a">SQL queries</text>
    <rect x="554" y="430" width="190" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="649" y="447" font-size="14" font-weight="700" fill="#263e5a">PaymentClient</text>
    <text x="649" y="463" font-size="11.5" fill="#263e5a">calls the provider</text>

    <rect x="250" y="530" width="280" height="94" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="549" font-size="14" font-weight="700" fill="#66400f">OrderService</text>
    <path d="M250 557H530M250 595H530" stroke="#bd7a20" stroke-width="1.5"/>
    <g font-size="12" fill="#66400f" text-anchor="start">
      <text x="266" y="574">- orders: OrderRepository</text>
      <text x="266" y="589">- payments: PaymentClient</text>
      <text x="266" y="613">+ placeOrder(customerId, items)</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M166 84H288" marker-end="url(#c4-arrow)"/>
      <path d="M470 70H588" marker-end="url(#c4-arrow)"/>
      <path d="M470 100H500V114H588" marker-end="url(#c4-arrow)"/>
      <path d="M186 220H288" marker-end="url(#c4-arrow)"/>
      <path d="M470 220H592" marker-end="url(#c4-arrow)"/>
      <path d="M380 242V278H468" marker-end="url(#c4-arrow)"/>
      <path d="M590 278H628" marker-end="url(#c4-arrow)"/>
      <path d="M226 392H288" marker-end="url(#c4-arrow)"/>
      <path d="M470 392H552" marker-end="url(#c4-arrow)"/>
      <path d="M380 414V450H552" marker-end="url(#c4-arrow)"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="227" y="76">places orders</text>
      <text x="529" y="62">charges cards</text>
      <text x="544" y="108">sends emails</text>
      <text x="237" y="212">JSON / HTTPS</text>
      <text x="531" y="212">SQL</text>
      <text x="420" y="271">publishes</text>
      <text x="257" y="384">calls</text>
      <text x="511" y="384">reads, writes</text>
      <text x="466" y="444">charges</text>
    </g>
    <g font-size="11.5" font-weight="700" font-style="italic" fill="#bd7a20">
      <text x="380" y="128">zoom in ↓</text>
      <text x="282" y="268" text-anchor="end">zoom into API ↓</text>
      <text x="282" y="440" text-anchor="end">zoom into OrderService ↓</text>
    </g>
    <text x="390" y="662" font-size="13" fill="#40566b">Each level zooms into one box of the level above; label every arrow with what flows and how.</text>
  </g>
</svg>
