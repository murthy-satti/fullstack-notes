<svg xmlns="http://www.w3.org/2000/svg" width="780" height="550" viewBox="0 0 780 550" role="img" aria-labelledby="lil-title lil-desc">
  <title id="lil-title">What happens when an event invokes a Lambda function: cold and warm starts</title>
  <desc id="lil-desc">An event such as an HTTP request, an S3 upload, an SQS message or a schedule arrives. If no idle warm environment exists, Lambda performs a cold start: it allocates a sandbox, downloads the code, starts the Node.js runtime and runs the INIT code in module scope, such as creating a MongoClient and connecting. If an idle warm environment exists, it is reused and INIT is skipped. Either way, the handler runs with the event and context and returns a result. The environment then waits, paused, so a later event can reuse it, and Lambda eventually shuts idle environments down at a time you cannot control. Each environment handles one request at a time, so concurrent requests use more environments.</desc>
  <defs>
    <marker id="lil-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lil-arrow-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="550" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="250" y="18" width="280" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="43" font-size="13" font-weight="700" fill="#36424e">event: HTTP, S3, SQS, schedule</text>

    <path d="M390 78 500 110 390 142 280 110z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="107" font-size="12" font-weight="700" fill="#36424e">idle warm environment</text>
    <text x="390" y="121" font-size="12" font-weight="700" fill="#36424e">for this function?</text>

    <rect x="24" y="150" width="260" height="210" rx="10" fill="#fff8f6" stroke="#b5473a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="164" y="170" font-size="12.5" font-weight="700" fill="#6b241c" text-anchor="start">COLD START</text><text x="36" y="170" font-size="11" font-style="italic" fill="#6b241c" text-anchor="start">slower</text>
    <g fill="#fde8e6" stroke="#b5473a" stroke-width="1.5">
      <rect x="44" y="182" width="220" height="32" rx="6"/>
      <rect x="44" y="226" width="220" height="32" rx="6"/>
      <rect x="44" y="270" width="220" height="32" rx="6"/>
    </g>
    <g font-size="12" font-weight="700" fill="#6b241c">
      <text x="154" y="203">1. allocate a sandbox</text>
      <text x="154" y="247">2. download the code</text>
      <text x="154" y="291">3. start the Node.js runtime</text>
    </g>
    <rect x="44" y="314" width="220" height="38" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="154" y="330" font-size="12" font-weight="700" fill="#66400f">4. run INIT (module scope)</text>
    <text x="154" y="345" font-size="10.5" fill="#66400f">new MongoClient(...), connect()</text>

    <rect x="496" y="150" width="260" height="96" rx="10" fill="#f4fbf5" stroke="#53845b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="636" y="170" font-size="12.5" font-weight="700" fill="#294a2e" text-anchor="start">WARM START</text><text x="508" y="170" font-size="11" font-style="italic" fill="#294a2e" text-anchor="start">fast</text>
    <rect x="516" y="182" width="220" height="48" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="626" y="202" font-size="12" font-weight="700" fill="#294a2e">reuse the environment</text>
    <text x="626" y="219" font-size="10.5" fill="#294a2e">INIT skipped; client already connected</text>

    <rect x="270" y="380" width="240" height="46" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="390" y="400" font-size="13" font-weight="700" fill="#66400f">handler(event, context)</text>
    <text x="390" y="417" font-size="11" fill="#66400f">runs on every invocation, returns a result</text>
    <rect x="270" y="448" width="240" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="467" font-size="12.5" font-weight="700" fill="#36424e">environment waits, paused</text>
    <text x="390" y="484" font-size="11" fill="#36424e">kept for possible reuse</text>
    <rect x="24" y="448" width="200" height="44" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="124" y="467" font-size="12" font-weight="700" fill="#36424e">shut down when idle</text>
    <text x="124" y="484" font-size="10.5" fill="#36424e">you cannot control when</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 58V76" marker-end="url(#lil-arrow)"/>
      <path d="M280 110H154V180" marker-end="url(#lil-arrow)"/>
      <path d="M500 110H626V180" marker-end="url(#lil-arrow)"/>
      <path d="M154 214V224" marker-end="url(#lil-arrow)"/>
      <path d="M154 258V268" marker-end="url(#lil-arrow)"/>
      <path d="M154 302V312" marker-end="url(#lil-arrow)"/>
      <path d="M154 352V403H268" marker-end="url(#lil-arrow)"/>
      <path d="M548 230V403H512" marker-end="url(#lil-arrow)"/>
      <path d="M390 426V446" marker-end="url(#lil-arrow)"/>
      <path d="M270 470H226" marker-end="url(#lil-arrow)"/>
    </g>
    <path d="M510 470H766V206H738" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lil-arrow-b)"/>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="218" y="102">no</text>
      <text x="562" y="102">yes</text>
    </g>
    <text x="640" y="488" font-size="11" font-style="italic" fill="#40566b">next event may reuse it</text>
    

    <rect x="574" y="268" width="182" height="88" rx="8" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.5"/>
    <g font-size="11" fill="#36424e" text-anchor="start">
      <text x="584" y="286" font-weight="700">One request per environment</text>
      <text x="584" y="303">10 requests at once means</text>
      <text x="584" y="318">10 environments in parallel;</text>
      <text x="584" y="333">a traffic spike creates new</text>
      <text x="584" y="348">ones, each with a cold start.</text>
    </g>
    <text x="390" y="530" font-size="13" fill="#40566b">Put expensive setup in module scope: it runs once per environment, not once per request.</text>
  </g>
</svg>
