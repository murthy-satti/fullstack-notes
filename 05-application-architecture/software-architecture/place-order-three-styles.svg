<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="pots-title pots-desc">
  <title id="pots-title">The same "place order" request in a monolith, a modular monolith, and microservices</title>
  <desc id="pots-desc">In a monolith, the orders code calls inventory and payments with in-process function calls inside one process, and everything is saved in one database in one transaction. In a modular monolith, orders calls only the public APIs of the inventory and payments modules, still in process, and each module owns its own schema in one shared database. In microservices, the request enters through an API gateway to the orders service, which calls the payments service over HTTP or gRPC and notifies the inventory service with an event through a broker; each service has its own database, so there is no shared transaction.</desc>
  <defs>
    <marker id="pots-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#36424e">
      <text x="138" y="34">Monolith</text>
      <text x="400" y="34">Modular monolith</text>
      <text x="662" y="34">Microservices</text>
    </g>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2" font-size="12" font-weight="700">
      <rect x="83" y="46" width="110" height="28" rx="14"/>
      <rect x="345" y="46" width="110" height="28" rx="14"/>
      <rect x="607" y="46" width="110" height="28" rx="14"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="138" y="65">POST /orders</text>
      <text x="400" y="65">POST /orders</text>
      <text x="662" y="65">POST /orders</text>
    </g>

    <rect x="24" y="92" width="228" height="198" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="244" y="108" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="end">one process</text>
    <rect x="48" y="122" width="180" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="138" y="145" font-size="13" font-weight="700" fill="#66400f">orders code</text>
    <rect x="40" y="198" width="94" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="87" y="221" font-size="12.5" font-weight="700" fill="#263e5a">inventory</text>
    <rect x="142" y="198" width="94" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="189" y="221" font-size="12.5" font-weight="700" fill="#263e5a">payments</text>
    <text x="138" y="262" font-size="11.5" fill="#40566b">plain function calls;</text>
    <text x="138" y="277" font-size="11.5" fill="#40566b">any code can reach any table</text>
    <rect x="48" y="312" width="180" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="138" y="337" font-size="13" font-weight="700" fill="#463365">one database</text>

    <rect x="286" y="92" width="228" height="198" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="506" y="108" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="end">one process</text>
    <rect x="310" y="122" width="180" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="145" font-size="13" font-weight="700" fill="#66400f">orders module</text>
    <rect x="302" y="198" width="94" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="349" y="221" font-size="12.5" font-weight="700" fill="#263e5a">inventory</text>
    <rect x="404" y="198" width="94" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="451" y="221" font-size="12.5" font-weight="700" fill="#263e5a">payments</text>
    <g fill="#ffffff" stroke="#4774aa" stroke-width="1.5">
      <rect x="333" y="188" width="32" height="14" rx="3"/>
      <rect x="435" y="188" width="32" height="14" rx="3"/>
    </g>
    <g font-size="9.5" font-weight="700" fill="#263e5a">
      <text x="349" y="199">API</text>
      <text x="451" y="199">API</text>
    </g>
    <text x="400" y="262" font-size="11.5" fill="#40566b">in-process calls, but only</text>
    <text x="400" y="277" font-size="11.5" fill="#40566b">through each module's public API</text>
    <rect x="302" y="312" width="196" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <path d="M367 312V352M433 312V352" stroke="#8062a8" stroke-width="1.5"/>
    <g font-size="11" font-weight="700" fill="#463365">
      <text x="334" y="330">orders</text>
      <text x="334" y="344">schema</text>
      <text x="400" y="330">inventory</text>
      <text x="400" y="344">schema</text>
      <text x="466" y="330">payments</text>
      <text x="466" y="344">schema</text>
    </g>

    <rect x="602" y="92" width="120" height="30" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="662" y="112" font-size="12.5" font-weight="700" fill="#36424e">API gateway</text>
    <rect x="552" y="140" width="144" height="36" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="624" y="163" font-size="13" font-weight="700" fill="#66400f">orders service</text>
    <rect x="706" y="140" width="66" height="36" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="739" y="155" font-size="11" font-weight="700" fill="#463365">orders</text>
    <text x="739" y="169" font-size="11" font-weight="700" fill="#463365">DB</text>
    <rect x="552" y="236" width="104" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="604" y="259" font-size="12.5" font-weight="700" fill="#263e5a">payments</text>
    <rect x="668" y="236" width="104" height="36" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="720" y="259" font-size="12.5" font-weight="700" fill="#263e5a">inventory</text>
    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="552" y="312" width="104" height="40" rx="8"/>
      <rect x="668" y="312" width="104" height="40" rx="8"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#463365">
      <text x="604" y="336">payments DB</text>
      <text x="720" y="336">inventory DB</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M138 74V120" marker-end="url(#pots-arrow)"/>
      <path d="M110 158V196" marker-end="url(#pots-arrow)"/>
      <path d="M166 158V196" marker-end="url(#pots-arrow)"/>
      <path d="M138 290V310" marker-end="url(#pots-arrow)"/>
      <path d="M400 74V120" marker-end="url(#pots-arrow)"/>
      <path d="M372 158V186" marker-end="url(#pots-arrow)"/>
      <path d="M428 158V186" marker-end="url(#pots-arrow)"/>
      <path d="M400 290V310" marker-end="url(#pots-arrow)"/>
      <path d="M662 74V90" marker-end="url(#pots-arrow)"/>
      <path d="M662 122V138" marker-end="url(#pots-arrow)"/>
      <path d="M604 176V234" marker-end="url(#pots-arrow)"/>
      <path d="M696 158H704" marker-end="url(#pots-arrow)"/>
      <path d="M604 272V310" marker-end="url(#pots-arrow)"/>
      <path d="M720 272V310" marker-end="url(#pots-arrow)"/>
    </g>
    <path d="M680 176V234" fill="none" stroke="#40566b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pots-arrow)"/>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="596" y="206" text-anchor="end">HTTP</text>
      <text x="596" y="220" text-anchor="end">(network)</text>
      <text x="688" y="206" text-anchor="start">event via</text>
      <text x="688" y="220" text-anchor="start">broker</text>
    </g>

    <g font-size="11.5" fill="#36424e">
      <text x="138" y="384"><tspan font-weight="700">calls:</tspan> function calls</text>
      <text x="138" y="402"><tspan font-weight="700">data:</tspan> one DB, one transaction</text>
      <text x="138" y="420"><tspan font-weight="700">deploy:</tspan> one unit</text>
      <text x="400" y="384"><tspan font-weight="700">calls:</tspan> public module APIs</text>
      <text x="400" y="402"><tspan font-weight="700">data:</tspan> one DB, schema per module</text>
      <text x="400" y="420"><tspan font-weight="700">deploy:</tspan> one unit</text>
      <text x="662" y="384"><tspan font-weight="700">calls:</tspan> HTTP/gRPC + events</text>
      <text x="662" y="402"><tspan font-weight="700">data:</tspan> one DB per service</text>
      <text x="662" y="420"><tspan font-weight="700">deploy:</tspan> each service alone</text>
    </g>
    <path d="M269 92V430M531 92V430" stroke="#d5dce6" stroke-width="1.5"/>
    <text x="400" y="472" font-size="13" fill="#40566b">Same feature, three structures: what changes is how parts call each other and who owns the data.</text>
  </g>
</svg>
