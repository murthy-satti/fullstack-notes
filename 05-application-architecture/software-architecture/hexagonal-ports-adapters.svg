<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="hex-title hex-desc">
  <title id="hex-title">Hexagonal architecture for "place an order": ports and adapters</title>
  <desc id="hex-desc">On the driving side, an Express HTTP controller built by makeOrdersRouter, a CLI command, a queue consumer and a test all call the inbound port placeOrder. Inside the application core, the placeOrder use case from makePlaceOrder uses the domain rules in createOrder. On the driven side, the core defines outbound ports OrderRepository, PaymentGateway and Notifier, implemented by the Mongo order repository, the in-memory order repository, a Stripe payment adapter and an SMTP email adapter. main.js, the composition root, chooses one adapter per port and passes it in.</desc>
  <defs>
    <marker id="hex-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="hex-arrow-p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#8062a8"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="108" y="38" font-size="12.5" font-weight="700" fill="#40566b">DRIVING side</text>
    <text x="108" y="54" font-size="11.5" fill="#40566b">calls the application</text>
    <text x="686" y="38" font-size="12.5" font-weight="700" fill="#40566b">DRIVEN side</text>
    <text x="686" y="54" font-size="11.5" fill="#40566b">called by the application</text>

    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="20" y="72" width="176" height="44" rx="8"/>
      <rect x="20" y="132" width="176" height="36" rx="8"/>
      <rect x="20" y="184" width="176" height="36" rx="8"/>
      <rect x="20" y="236" width="176" height="44" rx="8"/>
    </g>
    <text x="108" y="91" font-size="13" font-weight="700" fill="#263e5a">HTTP controller</text>
    <text x="108" y="108" font-size="11.5" fill="#263e5a">makeOrdersRouter (Express)</text>
    <text x="108" y="155" font-size="13" font-weight="700" fill="#263e5a">CLI command</text>
    <text x="108" y="207" font-size="13" font-weight="700" fill="#263e5a">Queue consumer</text>
    <text x="108" y="255" font-size="13" font-weight="700" fill="#263e5a">Test</text>
    <text x="108" y="272" font-size="11.5" fill="#263e5a">calls placeOrder directly</text>

    <path d="M335 92 465 92 530 210 465 328 335 328 270 210z" fill="#fff0d9" stroke="#bd7a20" stroke-width="2.5"/>
    <text x="400" y="122" font-size="13" font-weight="700" fill="#66400f">application core</text>
    <rect x="336" y="136" width="128" height="44" rx="8" fill="#ffffff" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="400" y="155" font-size="12.5" font-weight="700" fill="#66400f">placeOrder</text>
    <text x="400" y="171" font-size="11" fill="#66400f">use case</text>
    <rect x="336" y="236" width="128" height="44" rx="8" fill="#ffffff" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="400" y="255" font-size="12.5" font-weight="700" fill="#66400f">Order rules</text>
    <text x="400" y="271" font-size="11" fill="#66400f">createOrder (domain)</text>

    <rect x="232" y="197" width="104" height="26" rx="13" fill="#ffffff" stroke="#4774aa" stroke-width="2"/>
    <text x="284" y="214" font-size="11.5" font-weight="700" fill="#263e5a">placeOrder()</text>
    <g fill="#ffffff" stroke="#8062a8" stroke-width="2">
      <rect x="476" y="130" width="112" height="24" rx="12"/>
      <rect x="482" y="198" width="112" height="24" rx="12"/>
      <rect x="476" y="266" width="84" height="24" rx="12"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#463365">
      <text x="532" y="146">OrderRepository</text>
      <text x="538" y="214">PaymentGateway</text>
      <text x="518" y="282">Notifier</text>
    </g>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="600" y="72" width="184" height="44" rx="8"/>
      <rect x="600" y="124" width="184" height="44" rx="8"/>
      <rect x="616" y="188" width="168" height="44" rx="8"/>
      <rect x="600" y="256" width="184" height="44" rx="8"/>
    </g>
    <text x="692" y="91" font-size="13" font-weight="700" fill="#463365">Mongo repository</text>
    <text x="692" y="108" font-size="11.5" fill="#463365">makeMongoOrderRepository</text>
    <text x="692" y="143" font-size="13" font-weight="700" fill="#463365">In-memory repository</text>
    <text x="692" y="160" font-size="11.5" fill="#463365">for tests</text>
    <text x="700" y="207" font-size="13" font-weight="700" fill="#463365">Stripe adapter</text>
    <text x="700" y="224" font-size="11.5" fill="#463365">payments</text>
    <text x="692" y="275" font-size="13" font-weight="700" fill="#463365">SMTP adapter</text>
    <text x="692" y="292" font-size="11.5" fill="#463365">email</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M196 94H214V204H230" marker-end="url(#hex-arrow)"/>
      <path d="M196 150H214"/>
      <path d="M196 202H214"/>
      <path d="M196 258H214V216H230" marker-end="url(#hex-arrow)"/>
      <path d="M400 180V234" marker-end="url(#hex-arrow)"/>
    </g>
    <g fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M600 94H596V138H590" marker-end="url(#hex-arrow-p)"/>
      <path d="M600 146H590" marker-end="url(#hex-arrow-p)"/>
      <path d="M616 210H596" marker-end="url(#hex-arrow-p)"/>
      <path d="M600 278H562" marker-end="url(#hex-arrow-p)"/>
    </g>
    <text x="410" y="212" font-size="11" font-style="italic" fill="#66400f" text-anchor="start">uses</text>

    <rect x="200" y="352" width="400" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="400" y="372" font-size="13" font-weight="700" fill="#36424e">main.js (composition root)</text>
    <text x="400" y="389" font-size="11.5" fill="#36424e">picks one adapter per port and passes it to makePlaceOrder</text>

    <g text-anchor="start" font-size="11.5" fill="#36424e">
      <path d="M160 432H200" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#hex-arrow)"/>
      <text x="210" y="436">calls the core through its inbound port</text>
      <path d="M160 456H200" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hex-arrow-p)"/>
      <text x="210" y="460">implements an outbound port the core defines</text>
    </g>
    <text x="400" y="488" font-size="13" fill="#40566b">The core imports nothing from outside; every arrow points into the hexagon.</text>
  </g>
</svg>
