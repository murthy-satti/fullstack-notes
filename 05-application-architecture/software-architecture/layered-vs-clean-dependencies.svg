<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="lvc-title lvc-desc">
  <title id="lvc-title">Dependency direction: layered architecture versus ports and adapters</title>
  <desc id="lvc-desc">In a layered design, the controller imports the order service, the service imports the Mongo order repository, and the repository imports the MongoDB driver, so business rules depend on the database. With ports and adapters or clean architecture, the controller imports the placeOrder use case, the use case depends only on the OrderRepository port it defines, and the Mongo order repository imports that port and implements it. The arrow between the business logic and the database code is reversed.</desc>
  <defs>
    <marker id="lvc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lvc-arrow-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
    <marker id="lvc-arrow-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="780" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="366" height="380" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="398" y="16" width="366" height="380" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="199" y="42" font-size="14" font-weight="700" fill="#36424e">Layered</text>
    <text x="581" y="42" font-size="14" font-weight="700" fill="#36424e">Ports and adapters / clean</text>

    <rect x="89" y="62" width="220" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="199" y="81" font-size="13" font-weight="700" fill="#263e5a">OrdersController</text>
    <text x="199" y="98" font-size="11.5" fill="#263e5a">presentation layer</text>
    <rect x="89" y="142" width="220" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="199" y="161" font-size="13" font-weight="700" fill="#66400f">OrderService</text>
    <text x="199" y="178" font-size="11.5" fill="#66400f">business rules</text>
    <rect x="89" y="222" width="220" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="199" y="241" font-size="13" font-weight="700" fill="#463365">MongoOrderRepository</text>
    <text x="199" y="258" font-size="11.5" fill="#463365">data access layer</text>
    <rect x="89" y="302" width="220" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="199" y="327" font-size="13" font-weight="700" fill="#36424e">MongoDB driver</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M199 106V140" marker-end="url(#lvc-arrow)"/>
      <path d="M199 266V300" marker-end="url(#lvc-arrow)"/>
    </g>
    <path d="M199 186V220" fill="none" stroke="#b5473a" stroke-width="3" marker-end="url(#lvc-arrow-r)"/>
    <text x="210" y="208" font-size="11.5" font-weight="700" fill="#6b241c" text-anchor="start">business imports</text>
    <text x="210" y="122" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">imports</text>
    <text x="210" y="288" font-size="11" font-style="italic" fill="#40566b" text-anchor="start">imports</text>
    <text x="199" y="370" font-size="11.5" fill="#6b241c">Rules are tied to MongoDB and</text>
    <text x="199" y="385" font-size="11.5" fill="#6b241c">hard to test without a database.</text>

    <rect x="471" y="62" width="220" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="581" y="81" font-size="13" font-weight="700" fill="#263e5a">OrdersController</text>
    <text x="581" y="98" font-size="11.5" fill="#263e5a">driving adapter</text>
    <rect x="431" y="142" width="300" height="84" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="581" y="160" font-size="11.5" font-weight="700" fill="#66400f">core</text>
    <rect x="447" y="170" width="130" height="44" rx="8" fill="#ffffff" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="512" y="189" font-size="12.5" font-weight="700" fill="#66400f">placeOrder</text>
    <text x="512" y="205" font-size="11" fill="#66400f">use case</text>
    <rect x="589" y="170" width="130" height="44" rx="8" fill="#ffffff" stroke="#8062a8" stroke-width="1.5"/>
    <text x="654" y="189" font-size="12.5" font-weight="700" fill="#463365">OrderRepository</text>
    <text x="654" y="205" font-size="11" fill="#463365">port it defines</text>
    <rect x="544" y="262" width="220" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="654" y="281" font-size="13" font-weight="700" fill="#463365">MongoOrderRepository</text>
    <text x="654" y="298" font-size="11.5" fill="#463365">driven adapter</text>
    <rect x="544" y="334" width="220" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="654" y="359" font-size="13" font-weight="700" fill="#36424e">MongoDB driver</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M512 106V168" marker-end="url(#lvc-arrow)"/>
      <path d="M577 192H587" marker-end="url(#lvc-arrow)"/>
      <path d="M654 306V332" marker-end="url(#lvc-arrow)"/>
    </g>
    <path d="M654 262V216" fill="none" stroke="#53845b" stroke-width="3" marker-end="url(#lvc-arrow-g)"/>
    <text x="664" y="244" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">implements</text>
    <text x="664" y="258" font-size="11.5" font-weight="700" fill="#294a2e" text-anchor="start">(points up)</text>
    <text x="414" y="296" font-size="11.5" fill="#294a2e" text-anchor="start">Core imports</text>
    <text x="414" y="311" font-size="11.5" fill="#294a2e" text-anchor="start">nothing outside</text>
    <text x="414" y="326" font-size="11.5" fill="#294a2e" text-anchor="start">itself: test it with</text>
    <text x="414" y="341" font-size="11.5" fill="#294a2e" text-anchor="start">an in-memory</text><text x="414" y="356" font-size="11.5" fill="#294a2e" text-anchor="start">repository.</text>

    <text x="390" y="426" font-size="13" fill="#40566b">Arrows are source-code dependencies: the one between rules and database code is inverted.</text>
  </g>
</svg>
