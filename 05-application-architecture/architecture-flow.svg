<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Application architecture request flow</title>
  <desc id="desc">A user request reaches an application, which may check a cache, access a primary data store, or send background work to a queue and worker. Results return to the user.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#35634e"/>
    </marker>
    <style>
      .box { fill: #f2f8f4; stroke: #35634e; stroke-width: 2; rx: 12; }
      .title { font: 700 19px sans-serif; fill: #1e3e30; }
      .text { font: 15px sans-serif; fill: #315445; }
      .arrow { stroke: #35634e; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font: 14px sans-serif; fill: #35634e; }
    </style>
  </defs>
  <rect x="30" y="120" width="150" height="85" class="box"/>
  <text x="105" y="155" text-anchor="middle" class="title">User</text>
  <text x="105" y="182" text-anchor="middle" class="text">request / result</text>
  <rect x="255" y="120" width="180" height="85" class="box"/>
  <text x="345" y="155" text-anchor="middle" class="title">Application</text>
  <text x="345" y="182" text-anchor="middle" class="text">business rules</text>
  <rect x="520" y="35" width="165" height="80" class="box"/>
  <text x="602" y="68" text-anchor="middle" class="title">Cache</text>
  <text x="602" y="94" text-anchor="middle" class="text">temporary copy</text>
  <rect x="520" y="145" width="165" height="80" class="box"/>
  <text x="602" y="178" text-anchor="middle" class="title">Data store</text>
  <text x="602" y="204" text-anchor="middle" class="text">durable records</text>
  <rect x="520" y="260" width="165" height="70" class="box"/>
  <text x="602" y="290" text-anchor="middle" class="title">Queue</text>
  <text x="602" y="315" text-anchor="middle" class="text">deferred work</text>
  <rect x="745" y="260" width="130" height="70" class="box"/>
  <text x="810" y="290" text-anchor="middle" class="title">Worker</text>
  <text x="810" y="315" text-anchor="middle" class="text">background task</text>
  <path d="M180 162 L245 162" class="arrow"/>
  <text x="210" y="147" class="label">request</text>
  <path d="M435 145 L510 85" class="arrow"/>
  <text x="462" y="100" class="label">check</text>
  <path d="M435 170 L510 185" class="arrow"/>
  <text x="458" y="192" class="label">read / write</text>
  <path d="M435 198 L510 280" class="arrow"/>
  <text x="460" y="252" class="label">publish work</text>
  <path d="M685 295 L735 295" class="arrow"/>
  <text x="703" y="280" class="label">consume</text>
  <path d="M255 182 C215 240, 110 245, 105 215" class="arrow"/>
  <text x="145" y="247" class="label">response</text>
</svg>
