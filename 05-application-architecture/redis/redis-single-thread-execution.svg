<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="rst-title rst-desc">
  <title id="rst-title">Redis runs every client's commands one at a time on its main thread</title>
  <desc id="rst-desc">Several clients send commands such as KEYS *, GET user:42:name and INCR page:views. Network I/O, optionally spread over I/O threads, reads and parses them, but the main thread executes one command at a time, so each command is atomic. On the main thread timeline, KEYS * walks every key and takes a long time; client B's GET arrives early but waits until KEYS * finishes before it runs, followed by INCR.</desc>
  <defs>
    <marker id="rst-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rst-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="109" y="60" font-size="14" font-weight="700" fill="#263e5a">Client A</text>
    <text x="109" y="77" font-size="11.5" fill="#263e5a">KEYS *</text>
    <rect x="24" y="104" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="109" y="124" font-size="14" font-weight="700" fill="#263e5a">Client B</text>
    <text x="109" y="141" font-size="11.5" fill="#263e5a">GET user:42:name</text>
    <rect x="24" y="168" width="170" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="109" y="188" font-size="14" font-weight="700" fill="#263e5a">Client C</text>
    <text x="109" y="205" font-size="11.5" fill="#263e5a">INCR page:views</text>

    <rect x="236" y="40" width="160" height="176" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="316" y="112" font-size="14" font-weight="700" fill="#36424e">Network I/O</text>
    <text x="316" y="131" font-size="11.5" fill="#36424e">read and parse RESP</text>
    <text x="316" y="147" font-size="11.5" fill="#36424e">(optional I/O threads)</text>

    <rect x="446" y="40" width="310" height="176" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="601" y="66" font-size="14" font-weight="700" fill="#66400f">Main thread</text>
    <text x="601" y="84" font-size="11.5" fill="#66400f">executes one command at a time</text>
    <rect x="466" y="104" width="130" height="34" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="531" y="126" font-size="12" font-weight="700" fill="#6b241c">KEYS *</text>
    <rect x="606" y="104" width="64" height="34" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="638" y="126" font-size="12" font-weight="700" fill="#294a2e">GET</text>
    <rect x="680" y="104" width="64" height="34" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="712" y="126" font-size="12" font-weight="700" fill="#263e5a">INCR</text>
    <text x="601" y="166" font-size="11.5" fill="#66400f">each command is atomic:</text>
    <text x="601" y="182" font-size="11.5" fill="#66400f">nothing runs in the middle of it</text>
    <text x="601" y="204" font-size="11.5" font-style="italic" fill="#66400f">replies go back over each connection</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M194 64H234" marker-end="url(#rst-arrow)"/>
      <path d="M194 128H234" marker-end="url(#rst-arrow)"/>
      <path d="M194 192H234" marker-end="url(#rst-arrow)"/>
      <path d="M396 128H444" marker-end="url(#rst-arrow)"/>
    </g>
    <text x="420" y="120" font-size="11" font-style="italic" fill="#40566b">queue</text>

    <text x="24" y="264" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Main thread timeline</text>
    <rect x="60" y="282" width="440" height="34" rx="4" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="280" y="304" font-size="12" font-weight="700" fill="#6b241c">KEYS * walks every key in the database</text>
    <rect x="500" y="282" width="60" height="34" rx="4" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="530" y="304" font-size="12" font-weight="700" fill="#294a2e">GET</text>
    <rect x="560" y="282" width="64" height="34" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="592" y="304" font-size="12" font-weight="700" fill="#263e5a">INCR</text>
    <path d="M60 330H748" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#rst-arrow)"/>
    <text x="740" y="350" font-size="11.5" fill="#40566b" text-anchor="end">time</text>

    <path d="M130 334V380H530V320" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#rst-err)"/>
    <circle cx="130" cy="330" r="4" fill="#b5473a"/>
    <text x="138" y="354" font-size="11.5" fill="#b5473a" text-anchor="start">client B's GET arrives here</text>
    <text x="330" y="398" font-size="11.5" font-style="italic" fill="#b5473a">waits until KEYS * finishes, then runs</text>

    <text x="390" y="440" font-size="13" fill="#40566b">One slow command (KEYS *, a huge DEL, a long Lua script) delays every client; prefer SCAN and UNLINK.</text>
  </g>
</svg>
