<svg xmlns="http://www.w3.org/2000/svg" width="780" height="548" viewBox="0 0 780 548" role="img" aria-labelledby="fwr-title fwr-desc">
  <title id="fwr-title">The fixed-window rate limiter middleware, step by step</title>
  <desc id="fwr-desc">For POST /auth/login with a limit of 10 per 900-second window, the middleware computes the current window number with Math.floor(Date.now() / 1000 / 900), builds the key rate:login:req.ip:window, and runs INCR and EXPIRE key 900 NX in one MULTI/EXEC so the counter always gets a TTL, set only on the first request of the window. It sets RateLimit-Limit and RateLimit-Remaining headers. If the count is above 10 it responds 429 Too Many Requests with Retry-After 900; otherwise it calls next and the login handler runs. Because each window counts only its own requests, 10 requests at 12:14:59 and 10 more at 12:15:00 are all allowed.</desc>
  <defs>
    <marker id="fwr-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="548" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="140" y="20" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="45" font-size="14" font-weight="700" fill="#36424e">POST /auth/login</text>

    <rect x="140" y="80" width="240" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="100" font-size="14" font-weight="700" fill="#36424e">Current window number</text>
    <text x="260" y="117" font-size="11.5" fill="#36424e">Math.floor(Date.now() / 1000 / 900)</text>
    <rect x="140" y="148" width="240" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="168" font-size="14" font-weight="700" fill="#36424e">Build the key</text>
    <text x="260" y="185" font-size="11.5" fill="#36424e">rate:login:&lt;req.ip&gt;:&lt;window&gt;</text>
    <rect x="140" y="216" width="240" height="80" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="260" y="236" font-size="14" font-weight="700" fill="#263e5a">MULTI ... EXEC</text>
    <text x="260" y="254" font-size="11.5" fill="#263e5a">INCR key, giving count</text>
    <text x="260" y="270" font-size="11.5" fill="#263e5a">EXPIRE key 900 NX</text>
    <text x="260" y="286" font-size="11.5" fill="#263e5a">TTL set only on the first hit</text>
    <rect x="140" y="316" width="240" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="336" font-size="14" font-weight="700" fill="#36424e">RateLimit-* headers</text>
    <text x="260" y="353" font-size="11.5" fill="#36424e">Remaining = max(0, 10 - count)</text>
    <path d="M260 384 360 414 260 444 160 414z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="260" y="418" font-size="12" font-weight="700" fill="#36424e">count &gt; 10?</text>
    <rect x="140" y="464" width="240" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="260" y="489" font-size="14" font-weight="700" fill="#294a2e">next(): loginHandler runs</text>
    <rect x="420" y="390" width="300" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="570" y="410" font-size="14" font-weight="700" fill="#6b241c">429 Too Many Requests</text>
    <text x="570" y="427" font-size="11.5" fill="#6b241c">Retry-After: 900</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M260 60V78" marker-end="url(#fwr-arrow)"/>
      <path d="M260 128V146" marker-end="url(#fwr-arrow)"/>
      <path d="M260 196V214" marker-end="url(#fwr-arrow)"/>
      <path d="M260 296V314" marker-end="url(#fwr-arrow)"/>
      <path d="M260 364V382" marker-end="url(#fwr-arrow)"/>
      <path d="M260 444V462" marker-end="url(#fwr-arrow)"/>
      <path d="M360 414H418" marker-end="url(#fwr-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="389" y="407">yes</text>
      <text x="274" y="458">no</text>
    </g>

    <rect x="420" y="80" width="336" height="216" rx="10" fill="#faf7fe" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="588" y="104" font-size="13" font-weight="700" fill="#463365">Burst at a window boundary</text>
    <text x="514" y="140" font-size="11.5" fill="#463365">window 12:00-12:15</text>
    <text x="680" y="140" font-size="11.5" fill="#463365">window 12:15-12:30</text>
    <path d="M598 124V230" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g fill="#b5473a">
      <rect x="562" y="176" width="2.5" height="34"/><rect x="566" y="176" width="2.5" height="34"/>
      <rect x="570" y="176" width="2.5" height="34"/><rect x="574" y="176" width="2.5" height="34"/>
      <rect x="578" y="176" width="2.5" height="34"/><rect x="582" y="176" width="2.5" height="34"/>
      <rect x="586" y="176" width="2.5" height="34"/><rect x="590" y="176" width="2.5" height="34"/>
      <rect x="594" y="176" width="2.5" height="34"/><rect x="558" y="176" width="2.5" height="34"/>
      <rect x="602" y="176" width="2.5" height="34"/><rect x="606" y="176" width="2.5" height="34"/>
      <rect x="610" y="176" width="2.5" height="34"/><rect x="614" y="176" width="2.5" height="34"/>
      <rect x="618" y="176" width="2.5" height="34"/><rect x="622" y="176" width="2.5" height="34"/>
      <rect x="626" y="176" width="2.5" height="34"/><rect x="630" y="176" width="2.5" height="34"/>
      <rect x="634" y="176" width="2.5" height="34"/><rect x="638" y="176" width="2.5" height="34"/>
    </g>
    <path d="M436 210H744" stroke="#40566b" stroke-width="2" fill="none" marker-end="url(#fwr-arrow)"/>
    <text x="548" y="230" font-size="11" fill="#463365" text-anchor="end">10 at 12:14:59</text>
    <text x="650" y="230" font-size="11" fill="#463365" text-anchor="start">10 at 12:15:00</text>
    <text x="588" y="262" font-size="11.5" font-weight="700" fill="#b5473a">20 requests in 2 s, all allowed:</text>
    <text x="588" y="278" font-size="11.5" fill="#b5473a">each window counts only its own</text>

    <text x="390" y="530" font-size="13" fill="#40566b">One atomic MULTI keeps the counter and its TTL together; sliding windows remove the boundary burst.</text>
  </g>
</svg>
