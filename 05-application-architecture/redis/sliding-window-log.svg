<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="swl-title swl-desc">
  <title id="swl-title">A sliding-window log in a sorted set</title>
  <desc id="swl-desc">Each request is a member of the sorted set rate:sliding:clientId, scored by its timestamp. For a new request, one MULTI runs four commands in order: ZREMRANGEBYSCORE key 0 (now - windowMs) removes the three requests older than the window; ZADD key now with a unique member records this request; ZCARD key counts the five requests left in the window; PEXPIRE key windowMs lets idle clients' keys disappear. The count of 5 is within a limit of 5, so the request is allowed.</desc>
  <defs>
    <marker id="swl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="36" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Members of rate:sliding:&lt;clientId&gt;, scored by timestamp</text>

    <rect x="380" y="56" width="340" height="94" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="550" y="74" font-size="11.5" font-weight="700" fill="#294a2e">the window: last windowMs</text>
    <path d="M60 130H748" stroke="#40566b" stroke-width="2" fill="none" marker-end="url(#swl-arrow)"/>
    <text x="748" y="152" font-size="11.5" fill="#40566b" text-anchor="end">time</text>

    <g fill="#fde8e6" stroke="#b5473a" stroke-width="2">
      <circle cx="120" cy="110" r="9"/><circle cx="220" cy="110" r="9"/><circle cx="320" cy="110" r="9"/>
    </g>
    <g stroke="#b5473a" stroke-width="2" stroke-linecap="round">
      <path d="M114 104 126 116M126 104 114 116M214 104 226 116M226 104 214 116M314 104 326 116M326 104 314 116"/>
    </g>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <circle cx="430" cy="110" r="9"/><circle cx="510" cy="110" r="9"/><circle cx="590" cy="110" r="9"/><circle cx="650" cy="110" r="9"/>
    </g>
    <circle cx="700" cy="110" r="9" fill="#53845b" stroke="#294a2e" stroke-width="2"/>
    <text x="220" y="90" font-size="11.5" font-style="italic" fill="#b5473a">older than the window: removed</text>
    <text x="700" y="92" font-size="11.5" font-weight="700" fill="#294a2e">new</text>
    <path d="M380 124V140M700 124V140" stroke="#40566b" stroke-width="2"/>
    <text x="380" y="168" font-size="11.5" fill="#40566b">now - windowMs</text>
    <text x="700" y="168" font-size="11.5" fill="#40566b">now</text>

    <text x="390" y="200" font-size="12" font-weight="700" fill="#8062a8">one MULTI / EXEC, in this order</text>
    <g fill="#e5efff" stroke="#4774aa" stroke-width="2">
      <rect x="24" y="212" width="170" height="82" rx="8"/>
      <rect x="214" y="212" width="170" height="82" rx="8"/>
      <rect x="404" y="212" width="170" height="82" rx="8"/>
      <rect x="594" y="212" width="162" height="82" rx="8"/>
    </g>
    <g fill="#263e5a">
      <text x="109" y="233" font-size="12" font-weight="700">1. ZREMRANGEBYSCORE</text>
      <text x="109" y="250" font-size="11">key 0 (now - windowMs)</text>
      <text x="109" y="276" font-size="11.5" font-style="italic">removes the 3 old ones</text>
      <text x="299" y="233" font-size="12" font-weight="700">2. ZADD</text>
      <text x="299" y="250" font-size="11">key now "&lt;now&gt;:&lt;uuid&gt;"</text>
      <text x="299" y="276" font-size="11.5" font-style="italic">records this request</text>
      <text x="489" y="233" font-size="12" font-weight="700">3. ZCARD key</text>
      <text x="489" y="250" font-size="11">count = results[2]</text>
      <text x="489" y="276" font-size="11.5" font-style="italic">5 in the window</text>
      <text x="675" y="233" font-size="12" font-weight="700">4. PEXPIRE</text>
      <text x="675" y="250" font-size="11">key windowMs</text>
      <text x="675" y="276" font-size="11.5" font-style="italic">idle keys vanish</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M194 253H212" marker-end="url(#swl-arrow)"/>
      <path d="M384 253H402" marker-end="url(#swl-arrow)"/>
      <path d="M574 253H592" marker-end="url(#swl-arrow)"/>
      <path d="M489 294V318" marker-end="url(#swl-arrow)"/>
    </g>
    <rect x="364" y="320" width="250" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="489" y="345" font-size="14" font-weight="700" fill="#294a2e">count 5 &lt;= limit 5: allowed</text>
    <text x="390" y="386" font-size="13" fill="#40566b">Accurate with no boundary burst, but it stores one member per request in the window.</text>
  </g>
</svg>
