<svg xmlns="http://www.w3.org/2000/svg" width="780" height="468" viewBox="0 0 780 468" role="img" aria-labelledby="psf-title psf-desc">
  <title id="psf-title">Pub/Sub delivers only to subscribers connected at that moment</title>
  <desc id="psf-desc">Subscribers A and B subscribe to chat:room:1. Subscriber C is offline. The publisher sends PUBLISH chat:room:1 "hello". Redis stores nothing: it pushes a copy to A and B right away and replies to the publisher with (integer) 2, the number of receivers. C gets no copy and never will. When C reconnects and subscribes again, it receives only messages published after that.</desc>
  <defs>
    <marker id="psf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="psf-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="468" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="20" width="120" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="90" y="40" font-size="14" font-weight="700" fill="#66400f">Publisher</text>
    <text x="90" y="57" font-size="11.5" fill="#66400f">chat service</text>
    <rect x="205" y="20" width="130" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="270" y="40" font-size="14" font-weight="700" fill="#36424e">Redis</text>
    <text x="270" y="57" font-size="11.5" fill="#36424e">stores nothing</text>
    <rect x="380" y="20" width="120" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="440" y="40" font-size="14" font-weight="700" fill="#263e5a">Subscriber A</text>
    <text x="440" y="57" font-size="11.5" fill="#263e5a">online</text>
    <rect x="520" y="20" width="120" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="580" y="40" font-size="14" font-weight="700" fill="#263e5a">Subscriber B</text>
    <text x="580" y="57" font-size="11.5" fill="#263e5a">online</text>
    <rect x="645" y="20" width="120" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="705" y="40" font-size="14" font-weight="700" fill="#6b241c">Subscriber C</text>
    <text x="705" y="57" font-size="11.5" fill="#6b241c">offline</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M90 68V420M270 68V420M440 68V420M580 68V420"/>
      <path d="M705 320V360M705 396V420"/>
    </g>
    <path d="M705 68V320" stroke="#e3b5ae" stroke-width="1.5" stroke-dasharray="2 6"/>

    <g text-anchor="start" fill="#36424e">
      <text x="282" y="96" font-size="11" font-weight="700">1. SUBSCRIBE chat:room:1</text>
      <text x="452" y="124" font-size="12" font-weight="700">2. SUBSCRIBE</text>
      <text x="100" y="160" font-size="12" font-weight="700">3. PUBLISH chat:room:1</text>
      <text x="100" y="174" font-size="11">"hello"</text>
      <text x="282" y="210" font-size="12" font-weight="700">4. message "hello"</text>
      <text x="452" y="238" font-size="12" font-weight="700">5. message "hello"</text>
      <text x="100" y="268" font-size="12" font-weight="700">6. (integer) 2</text>
      <text x="100" y="282" font-size="11">copies delivered</text>
      <text x="282" y="356" font-size="12" font-weight="700">7. SUBSCRIBE again</text>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M440 104H272" stroke="#40566b" marker-end="url(#psf-arrow)"/>
      <path d="M580 134H272" stroke="#40566b" marker-end="url(#psf-arrow)"/>
      <path d="M90 184H268" stroke="#40566b" marker-end="url(#psf-arrow)"/>
      <path d="M270 220H438" stroke="#40566b" marker-end="url(#psf-arrow)"/>
      <path d="M270 248H578" stroke="#40566b" marker-end="url(#psf-arrow)"/>
      <path d="M270 292H92" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#psf-ret)"/>
      <path d="M705 340H272" stroke="#40566b" marker-end="url(#psf-arrow)"/>
    </g>

    <path d="M697 240 713 256M713 240 697 256" stroke="#b5473a" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="645" y="264" width="120" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="705" y="284" font-size="11.5" font-weight="700" fill="#6b241c">no copy, ever</text>
    <text x="705" y="300" font-size="11.5" fill="#6b241c">"hello" is lost</text>
    <rect x="645" y="360" width="120" height="36" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="705" y="375" font-size="11.5" font-weight="700" fill="#294a2e">gets only messages</text>
    <text x="705" y="389" font-size="11.5" fill="#294a2e">published from now</text>

    <text x="390" y="450" font-size="13" fill="#40566b">Fire-and-forget, at most once: no storage, no acknowledgment, no retry.</text>
  </g>
</svg>
