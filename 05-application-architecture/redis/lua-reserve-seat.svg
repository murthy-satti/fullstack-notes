<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="lrs-title lrs-desc">
  <title id="lrs-title">The RESERVE_SEAT Lua script runs as one atomic step on the server</title>
  <desc id="lrs-desc">Client A calls redis.eval with the RESERVE_SEAT script, keys event:9:seats and event:9:attendees, and argument user:42. On the main thread the script reads left with GET KEYS[1]. If left is 0 or less it returns 0, meaning sold out. Otherwise it runs DECR KEYS[1] and SADD KEYS[2] ARGV[1] and returns 1. Client B's DECR event:9:seats arrives while the script runs and waits until the script returns, so it can never slip between the check and the writes. A script that runs longer than 5 seconds makes Redis answer other clients with BUSY errors.</desc>
  <defs>
    <marker id="lrs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="480" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="20" width="300" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="220" y="40" font-size="14" font-weight="700" fill="#263e5a">Client A: redis.eval(RESERVE_SEAT)</text>
    <text x="220" y="57" font-size="11.5" fill="#263e5a">keys: seats, attendees; args: user:42</text>

    <rect x="24" y="92" width="440" height="342" rx="10" fill="#fffaf2" stroke="#bd7a20" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="40" y="114" font-size="12.5" font-weight="700" fill="#66400f" text-anchor="start">Main thread: nothing else runs until it returns</text>

    <rect x="100" y="126" width="240" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="146" font-size="14" font-weight="700" fill="#36424e">left = GET KEYS[1]</text>
    <text x="220" y="163" font-size="11.5" fill="#36424e">event:9:seats, so left = 1</text>
    <path d="M220 192 310 220 220 248 130 220z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="220" y="225" font-size="12" font-weight="700" fill="#36424e">left &lt;= 0?</text>
    <rect x="100" y="268" width="240" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="293" font-size="14" font-weight="700" fill="#66400f">DECR KEYS[1]</text>
    <rect x="100" y="324" width="240" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="220" y="349" font-size="14" font-weight="700" fill="#66400f">SADD KEYS[2] ARGV[1]</text>
    <rect x="100" y="380" width="240" height="40" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="220" y="405" font-size="14" font-weight="700" fill="#294a2e">return 1: booked</text>
    <rect x="340" y="200" width="112" height="40" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="396" y="225" font-size="13" font-weight="700" fill="#6b241c">return 0</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M220 68V124" marker-end="url(#lrs-arrow)"/>
      <path d="M220 174V190" marker-end="url(#lrs-arrow)"/>
      <path d="M220 248V266" marker-end="url(#lrs-arrow)"/>
      <path d="M220 308V322" marker-end="url(#lrs-arrow)"/>
      <path d="M220 364V378" marker-end="url(#lrs-arrow)"/>
      <path d="M310 220H338" marker-end="url(#lrs-arrow)"/>
    </g>
    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="324" y="212">yes</text>
      <text x="234" y="262">no</text>
    </g>

    <rect x="520" y="126" width="236" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="638" y="146" font-size="14" font-weight="700" fill="#463365">Client B</text>
    <text x="638" y="163" font-size="11.5" fill="#463365">DECR event:9:seats arrives</text>
    <path d="M638 174V378" fill="none" stroke="#8062a8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lrs-arrow)"/>
    <text x="648" y="260" font-size="11.5" font-style="italic" fill="#463365" text-anchor="start">waits for the</text>
    <text x="648" y="275" font-size="11.5" font-style="italic" fill="#463365" text-anchor="start">script to return</text>
    <rect x="520" y="380" width="236" height="40" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="638" y="405" font-size="13" font-weight="700" fill="#463365">then runs: seats becomes 0</text>
    <path d="M464 400H518" fill="none" stroke="#c3ccd7" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="390" y="456" font-size="13" fill="#40566b">The check and both writes are one atomic step; scripts over 5 s make other clients get BUSY.</text>
  </g>
</svg>
