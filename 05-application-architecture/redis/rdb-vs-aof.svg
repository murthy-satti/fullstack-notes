<svg xmlns="http://www.w3.org/2000/svg" width="780" height="566" viewBox="0 0 780 566" role="img" aria-labelledby="rva-title rva-desc">
  <title id="rva-title">How RDB snapshots and the AOF log reach disk, and what a crash loses</title>
  <desc id="rva-desc">A write such as SET order:1001 paid is applied to the in-memory dataset. RDB: when a save rule like save 300 100 fires or BGSAVE runs, Redis forks a child process that shares memory by copy-on-write, writes the snapshot to a temp file while the parent keeps serving, and renames it to dump.rdb when complete. AOF: every write command is appended to the log, and appendfsync decides when it is fsynced: always before the reply, everysec once per second in the background, or no, leaving it to the operating system; AOF rewrite compacts the log. After a crash at 12:04, RDB alone loses every write since the 12:00 snapshot, while AOF with everysec loses only about the last second.</desc>
  <defs>
    <marker id="rva-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="566" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="290" y="20" width="200" height="36" rx="18" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="43" font-size="14" font-weight="700" fill="#36424e">SET order:1001 paid</text>
    <rect x="290" y="72" width="200" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="90" font-size="14" font-weight="700" fill="#263e5a">Dataset in memory</text>
    <text x="390" y="107" font-size="11.5" fill="#263e5a">the write is applied</text>

    <rect x="20" y="146" width="360" height="252" rx="10" fill="#faf7fe" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="36" y="168" font-size="14" font-weight="700" fill="#463365" text-anchor="start">RDB snapshot</text>
    <rect x="400" y="146" width="360" height="252" rx="10" fill="#faf7fe" stroke="#8062a8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="744" y="168" font-size="14" font-weight="700" fill="#463365" text-anchor="end">AOF log</text>

    <rect x="60" y="180" width="280" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="205" font-size="14" font-weight="700" fill="#36424e">save 300 100, or BGSAVE</text>
    <rect x="60" y="236" width="280" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="254" font-size="14" font-weight="700" fill="#66400f">fork(): child process</text>
    <text x="200" y="271" font-size="11.5" fill="#66400f">copy-on-write; parent keeps serving</text>
    <rect x="60" y="296" width="280" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="321" font-size="14" font-weight="700" fill="#36424e">Child writes a temp file</text>
    <rect x="60" y="350" width="280" height="38" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="200" y="374" font-size="14" font-weight="700" fill="#294a2e">Rename to dump.rdb when done</text>

    <rect x="440" y="180" width="280" height="40" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="580" y="205" font-size="14" font-weight="700" fill="#66400f">Append the command</text>
    <path d="M580 236 670 262 580 288 490 262z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="580" y="266" font-size="12" font-weight="700" fill="#36424e">appendfsync</text>
    <rect x="410" y="306" width="110" height="46" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="465" y="325" font-size="13" font-weight="700" fill="#294a2e">always</text>
    <text x="465" y="342" font-size="11.5" fill="#294a2e">disk before reply</text>
    <rect x="525" y="306" width="110" height="46" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="580" y="325" font-size="13" font-weight="700" fill="#263e5a">everysec</text>
    <text x="580" y="342" font-size="11.5" fill="#263e5a">fsync each 1 s</text>
    <rect x="640" y="306" width="110" height="46" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="695" y="325" font-size="13" font-weight="700" fill="#6b241c">no</text>
    <text x="695" y="342" font-size="11.5" fill="#6b241c">the OS decides</text>
    <text x="580" y="380" font-size="11.5" font-style="italic" fill="#463365">AOF rewrite (BGREWRITEAOF) compacts the log</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M390 56V70" marker-end="url(#rva-arrow)"/>
      <path d="M330 116 220 176" marker-end="url(#rva-arrow)"/>
      <path d="M450 116 560 176" marker-end="url(#rva-arrow)"/>
      <path d="M200 220V234" marker-end="url(#rva-arrow)"/>
      <path d="M200 280V294" marker-end="url(#rva-arrow)"/>
      <path d="M200 336V348" marker-end="url(#rva-arrow)"/>
      <path d="M580 220V234" marker-end="url(#rva-arrow)"/>
      <path d="M560 288 475 304" marker-end="url(#rva-arrow)"/>
      <path d="M580 288V304" marker-end="url(#rva-arrow)"/>
      <path d="M600 288 685 304" marker-end="url(#rva-arrow)"/>
    </g>

    <text x="24" y="426" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">After a crash at 12:04, what is lost?</text>
    <rect x="150" y="438" width="350" height="24" rx="4" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="325" y="455" font-size="11.5" font-weight="700" fill="#6b241c">RDB only: every write since 12:00</text>
    <rect x="486" y="470" width="14" height="20" rx="3" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="478" y="485" font-size="11.5" font-weight="700" fill="#6b241c" text-anchor="end">AOF everysec: about the last second</text>
    <path d="M60 504H748" stroke="#40566b" stroke-width="2" fill="none" marker-end="url(#rva-arrow)"/>
    <path d="M150 498V510" stroke="#40566b" stroke-width="2"/>
    <path d="M500 432V510" stroke="#b5473a" stroke-width="2.5"/>
    <text x="150" y="526" font-size="11.5" fill="#40566b">12:00 last snapshot</text>
    <text x="500" y="526" font-size="11.5" font-weight="700" fill="#b5473a">12:04 crash</text>
    <text x="390" y="552" font-size="13" fill="#40566b">Persistence survives a restart on the same disk; replicas and backups cover losing the machine.</text>
  </g>
</svg>
