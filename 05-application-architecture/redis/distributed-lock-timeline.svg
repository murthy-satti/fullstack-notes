<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="dlt-title dlt-desc">
  <title id="dlt-title">A Redis lock whose holder pauses past the TTL</title>
  <desc id="dlt-desc">At 0 seconds client A runs SET lock:report token tA NX PX 30000 and gets OK. At 10 seconds client B tries SET NX and gets nil because A holds the lock. A then pauses, for example in a long garbage collection, and at 30 seconds the lock expires. At 32 seconds B acquires it with token tB and starts working. A resumes at 36 seconds, so both clients do the protected work at the same time. When A finishes at 40 seconds, its release script sees that the key holds tB, not tA, and returns 0, so B's lock is not deleted. B releases its own lock at 45 seconds. The token protects B's lock, but only fencing tokens can stop the overlap from corrupting data.</desc>
  <defs>
    <marker id="dlt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="400" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="504" y="80" width="96" height="216" fill="#fde8e6" opacity="0.7"/>
    <text x="552" y="72" font-size="11.5" font-weight="700" fill="#b5473a">overlap: both do the work</text>

    <g font-size="13" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="24" y="115">Client A</text>
      <text x="24" y="195">Redis key</text>
      <text x="24" y="275">Client B</text>
    </g>

    <rect x="120" y="94" width="96" height="32" rx="5" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="168" y="115" font-size="11.5" font-weight="700" fill="#66400f">work</text>
    <rect x="216" y="94" width="336" height="32" rx="5" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="384" y="115" font-size="11.5" fill="#36424e">paused: long GC pause, slow VM</text>
    <rect x="552" y="94" width="48" height="32" rx="5" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="576" y="115" font-size="11.5" font-weight="700" fill="#66400f">work</text>

    <rect x="120" y="174" width="360" height="32" rx="5" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
    <text x="300" y="195" font-size="11.5" font-weight="700" fill="#263e5a">held by A (value tA)</text>
    <rect x="504" y="174" width="156" height="32" rx="5" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
    <text x="582" y="195" font-size="11.5" font-weight="700" fill="#463365">held by B (value tB)</text>
    <path d="M480 166V214" stroke="#b5473a" stroke-width="2.5"/>

    <rect x="504" y="254" width="156" height="32" rx="5" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="582" y="275" font-size="11.5" font-weight="700" fill="#66400f">work</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M124 126V172" marker-end="url(#dlt-arrow)"/>
      <path d="M240 254V208" marker-end="url(#dlt-arrow)"/>
      <path d="M508 254V208" marker-end="url(#dlt-arrow)"/>
      <path d="M600 126V172" marker-end="url(#dlt-arrow)"/>
      <path d="M660 254V208" marker-end="url(#dlt-arrow)"/>
    </g>

    <g font-size="11" text-anchor="start" fill="#36424e">
      <text x="132" y="146">SET lock:report tA NX PX 30000</text>
      <text x="132" y="160">reply: OK</text>
      <text x="248" y="232">SET ... NX</text>
      <text x="248" y="246">reply: (nil), A holds it</text>
      <text x="514" y="232">SET tB NX PX</text>
      <text x="514" y="246">reply: OK</text>
      <text x="666" y="232">release: DEL</text>
      <text x="666" y="246">reply: 1</text>
      <text x="608" y="146" fill="#294a2e" font-weight="700">release: GET = tB, not tA</text>
      <text x="608" y="160" fill="#294a2e">reply: 0, B's lock kept</text>
    </g>
    <text x="474" y="152" font-size="11.5" font-weight="700" fill="#b5473a" text-anchor="end">TTL ends at 30 s</text>

    <path d="M120 318H752" stroke="#40566b" stroke-width="2" fill="none" marker-end="url(#dlt-arrow)"/>
    <g stroke="#40566b" stroke-width="1.5">
      <path d="M120 314V322M240 314V322M360 314V322M480 314V322M600 314V322M720 314V322"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="120" y="338">0 s</text>
      <text x="240" y="338">10 s</text>
      <text x="360" y="338">20 s</text>
      <text x="480" y="338">30 s</text>
      <text x="600" y="338">40 s</text>
      <text x="720" y="338">50 s</text>
    </g>
    <text x="390" y="378" font-size="13" fill="#40566b">The token keeps A from deleting B's lock; only fencing tokens stop the overlap corrupting data.</text>
  </g>
</svg>
