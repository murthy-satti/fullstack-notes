<svg xmlns="http://www.w3.org/2000/svg" width="780" height="530" viewBox="0 0 780 530" role="img" aria-labelledby="wme-title wme-desc">
  <title id="wme-title">WATCH, MULTI and EXEC: an optimistic transaction aborted by a conflict</title>
  <desc id="wme-desc">Client A watches event:9:seats and reads it as "1", so it decides to book the seat. Before A runs EXEC, client B runs DECR event:9:seats and gets 0; Redis marks A's watched key as changed. A sends MULTI, then DECR event:9:seats and SADD event:9:attendees user:42, which are queued. When A sends EXEC, Redis returns nil: the transaction is aborted and none of the queued commands ran. A retries: it watches and reads again, sees "0", calls UNWATCH, and reports the event as sold out.</desc>
  <defs>
    <marker id="wme-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="wme-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="wme-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="780" height="530" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="45" y="20" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="120" y="40" font-size="14" font-weight="700" fill="#263e5a">Client A</text>
    <text x="120" y="57" font-size="11.5" fill="#263e5a">dedicated connection</text>
    <rect x="315" y="20" width="150" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="390" y="40" font-size="14" font-weight="700" fill="#36424e">Redis</text>
    <text x="390" y="57" font-size="11.5" fill="#36424e">event:9:seats = 1</text>
    <rect x="585" y="20" width="150" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="660" y="40" font-size="14" font-weight="700" fill="#463365">Client B</text>
    <text x="660" y="57" font-size="11.5" fill="#463365">books the same seat</text>

    <g stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5">
      <path d="M120 68V184M120 216V436M120 470V484"/>
      <path d="M390 68V284M390 316V484"/>
      <path d="M660 68V484"/>
    </g>

    <g text-anchor="start" fill="#36424e">
      <text x="132" y="98" font-size="12" font-weight="700">1. WATCH event:9:seats</text>
      <text x="132" y="134" font-size="12" font-weight="700">2. GET event:9:seats</text>
      <text x="132" y="162" font-size="11.5" fill="#60788d">"1"</text>
      <text x="402" y="234" font-size="12" font-weight="700">3. DECR event:9:seats</text>
      <text x="402" y="264" font-size="11.5" fill="#60788d">(integer) 0</text>
      <text x="132" y="334" font-size="12" font-weight="700">4. MULTI, DECR event:9:seats,</text>
      <text x="132" y="348" font-size="12" font-weight="700">SADD event:9:attendees user:42</text>
      <text x="132" y="376" font-size="11.5" fill="#60788d">OK, QUEUED, QUEUED</text>
      <text x="132" y="398" font-size="12" font-weight="700">5. EXEC</text>
      <text x="132" y="426" font-size="12" font-weight="700" fill="#b5473a">(nil): aborted, nothing ran</text>
    </g>

    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M120 106H388" stroke="#40566b" marker-end="url(#wme-arrow)"/>
      <path d="M120 142H388" stroke="#40566b" marker-end="url(#wme-arrow)"/>
      <path d="M390 168H122" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#wme-ret)"/>
      <path d="M660 242H392" stroke="#40566b" marker-end="url(#wme-arrow)"/>
      <path d="M390 270H658" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#wme-ret)"/>
      <path d="M120 356H388" stroke="#40566b" marker-end="url(#wme-arrow)"/>
      <path d="M390 382H122" stroke="#60788d" stroke-dasharray="6 4" marker-end="url(#wme-ret)"/>
      <path d="M120 406H388" stroke="#40566b" marker-end="url(#wme-arrow)"/>
      <path d="M390 432H122" stroke="#b5473a" stroke-dasharray="6 4" marker-end="url(#wme-err)"/>
    </g>

    <rect x="45" y="184" width="150" height="32" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="120" y="205" font-size="11.5" font-weight="700" fill="#66400f">seats &gt; 0: book it</text>
    <rect x="300" y="284" width="180" height="32" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="390" y="305" font-size="11.5" font-weight="700" fill="#6b241c">watched key changed</text>
    <rect x="30" y="436" width="180" height="34" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="120" y="451" font-size="11.5" font-weight="700" fill="#263e5a">retry: WATCH, GET "0"</text>
    <text x="120" y="465" font-size="11.5" fill="#263e5a">UNWATCH, sold out</text>

    <text x="390" y="512" font-size="13" fill="#40566b">No lock is held: a conflict is detected at EXEC, and the client retries with fresh data.</text>
  </g>
</svg>
