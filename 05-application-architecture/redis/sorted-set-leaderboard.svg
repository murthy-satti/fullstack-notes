<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="ssl-title ssl-desc">
  <title id="ssl-title">A sorted-set leaderboard: ZADD, ZINCRBY, then ZRANGE REV</title>
  <desc id="ssl-desc">ZADD leaderboard 120 ada 95 sam 140 lee stores three members kept in score order: sam 95, ada 120, lee 140. ZINCRBY leaderboard 30 sam raises sam to 125, so sam moves above ada without any re-sorting in the application. ZRANGE leaderboard 0 2 REV WITHSCORES returns the top three from highest score: lee 140, sam 125, ada 120, and ZREVRANK leaderboard ada returns 2. Internally the sorted set keeps a hash table from member to score, which makes ZSCORE O(1), and a skip list in score order, which makes ZRANGE and ZRANK O(log N).</desc>
  <defs>
    <marker id="ssl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="430" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="220" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="134" y="44" font-size="14" font-weight="700" fill="#66400f">ZADD leaderboard</text>
    <text x="134" y="61" font-size="11.5" fill="#66400f">120 ada 95 sam 140 lee</text>
    <rect x="290" y="24" width="220" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="44" font-size="14" font-weight="700" fill="#66400f">ZINCRBY leaderboard</text>
    <text x="400" y="61" font-size="11.5" fill="#66400f">30 sam</text>
    <rect x="556" y="24" width="200" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="656" y="44" font-size="14" font-weight="700" fill="#66400f">ZRANGE leaderboard</text>
    <text x="656" y="61" font-size="11.5" fill="#66400f">0 2 REV WITHSCORES</text>

    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="134" y="98">stored low to high by score</text>
      <text x="400" y="98">sam moves up; no app re-sort</text>
      <text x="656" y="98">read from the highest score</text>
    </g>

    <g stroke-width="1.5">
      <rect x="44" y="110" width="180" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="44" y="148" width="180" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="44" y="186" width="180" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="310" y="110" width="180" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="310" y="148" width="180" height="32" rx="6" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="310" y="186" width="180" height="32" rx="6" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="566" y="110" width="180" height="32" rx="6" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="566" y="148" width="180" height="32" rx="6" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="566" y="186" width="180" height="32" rx="6" fill="#e8f5e9" stroke="#53845b"/>
    </g>
    <g font-size="12.5" font-weight="700" text-anchor="start">
      <text x="58" y="131" fill="#36424e">sam</text>
      <text x="58" y="169" fill="#36424e">ada</text>
      <text x="58" y="207" fill="#36424e">lee</text>
      <text x="324" y="131" fill="#36424e">ada</text>
      <text x="324" y="169" fill="#66400f">sam</text>
      <text x="324" y="207" fill="#36424e">lee</text>
      <text x="580" y="131" fill="#294a2e">1) lee</text>
      <text x="580" y="169" fill="#294a2e">2) sam</text>
      <text x="580" y="207" fill="#294a2e">3) ada</text>
    </g>
    <g font-size="12.5" text-anchor="end">
      <text x="210" y="131" fill="#36424e">95</text>
      <text x="210" y="169" fill="#36424e">120</text>
      <text x="210" y="207" fill="#36424e">140</text>
      <text x="476" y="131" fill="#36424e">120</text>
      <text x="476" y="169" fill="#66400f">95 + 30 = 125</text>
      <text x="476" y="207" fill="#36424e">140</text>
      <text x="732" y="131" fill="#294a2e">140</text>
      <text x="732" y="169" fill="#294a2e">125</text>
      <text x="732" y="207" fill="#294a2e">120</text>
    </g>

    <rect x="566" y="232" width="180" height="40" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="656" y="249" font-size="12" font-weight="700" fill="#263e5a">ZREVRANK leaderboard ada</text>
    <text x="656" y="264" font-size="11.5" fill="#263e5a">(integer) 2</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M224 164H308" marker-end="url(#ssl-arrow)"/>
      <path d="M490 164H564" marker-end="url(#ssl-arrow)"/>
    </g>

    <text x="24" y="304" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Inside one sorted set key</text>
    <rect x="24" y="316" width="356" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="202" y="338" font-size="14" font-weight="700" fill="#463365">Hash table: member to score</text>
    <text x="202" y="357" font-size="11.5" fill="#463365">ZSCORE leaderboard sam is O(1)</text>
    <rect x="400" y="316" width="356" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="578" y="338" font-size="14" font-weight="700" fill="#463365">Skip list in score order</text>
    <text x="578" y="357" font-size="11.5" fill="#463365">ZADD, ZRANGE, ZRANK are O(log N)</text>
    <path d="M380 344H400" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="408" font-size="13" fill="#40566b">Updates and rank queries are one command each, and concurrent ZINCRBY calls never lose points.</text>
  </g>
</svg>
