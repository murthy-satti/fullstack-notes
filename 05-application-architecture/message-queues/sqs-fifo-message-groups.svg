<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-labelledby="fmg-title fmg-desc">
  <title id="fmg-title">FIFO message groups: ordered within a group, parallel across groups</title>
  <desc id="fmg-desc">Top: messages arrive in a FIFO queue as A1, B1, A2, C1, B2, A3, with one group ID per order. Consumer 1 processes group A in order (A1, then A2, then A3) while consumer 2 processes groups B and C at the same time. Bottom: every message uses one constant group ID, so consumer 1 must process m1, m2, m3 one at a time while consumer 2 has nothing it is allowed to take.</desc>
  <defs>
    <marker id="fmg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="360" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="30" font-size="13" font-weight="700" fill="#294a2e">MessageGroupId per order: ordered within a group, parallel across groups</text>
    <text x="36" y="58" font-size="11.5" fill="#40566b" text-anchor="start">orders.fifo, in arrival order</text>
    <g stroke-width="2">
      <rect x="36" y="66" width="50" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="92" y="66" width="50" height="36" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="148" y="66" width="50" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
      <rect x="204" y="66" width="50" height="36" rx="6" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="260" y="66" width="50" height="36" rx="6" fill="#f0e9fb" stroke="#8062a8"/>
      <rect x="316" y="66" width="50" height="36" rx="6" fill="#e5efff" stroke="#4774aa"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="61" y="89" fill="#263e5a">A1</text>
      <text x="117" y="89" fill="#463365">B1</text>
      <text x="173" y="89" fill="#263e5a">A2</text>
      <text x="229" y="89" fill="#294a2e">C1</text>
      <text x="285" y="89" fill="#463365">B2</text>
      <text x="341" y="89" fill="#263e5a">A3</text>
    </g>
    <rect x="470" y="50" width="290" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="615" y="69" font-size="14" font-weight="700" fill="#66400f">Consumer 1</text>
    <text x="615" y="85" font-size="11.5" fill="#66400f">group A: A1, then A2, then A3</text>
    <rect x="470" y="106" width="290" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="615" y="125" font-size="14" font-weight="700" fill="#66400f">Consumer 2</text>
    <text x="615" y="141" font-size="11.5" fill="#66400f">groups B and C: B1, B2 and C1</text>

    <path d="M30 174H750" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="390" y="200" font-size="13" font-weight="700" fill="#6b241c">One constant MessageGroupId: everything waits in a single line</text>
    <text x="36" y="226" font-size="11.5" fill="#40566b" text-anchor="start">orders.fifo, every message in group "all"</text>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="2">
      <rect x="36" y="234" width="50" height="36" rx="6"/><rect x="92" y="234" width="50" height="36" rx="6"/><rect x="148" y="234" width="50" height="36" rx="6"/>
      <rect x="204" y="234" width="50" height="36" rx="6"/><rect x="260" y="234" width="50" height="36" rx="6"/><rect x="316" y="234" width="50" height="36" rx="6"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e">
      <text x="61" y="257">m1</text><text x="117" y="257">m2</text><text x="173" y="257">m3</text>
      <text x="229" y="257">m4</text><text x="285" y="257">m5</text><text x="341" y="257">m6</text>
    </g>
    <rect x="470" y="218" width="290" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="615" y="237" font-size="14" font-weight="700" fill="#66400f">Consumer 1</text>
    <text x="615" y="253" font-size="11.5" fill="#66400f">m1, then m2, then m3 ... one at a time</text>
    <rect x="470" y="274" width="290" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="615" y="293" font-size="14" font-weight="700" fill="#36424e">Consumer 2</text>
    <text x="615" y="309" font-size="11.5" fill="#36424e">idle: the group is locked by consumer 1</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M372 78 468 72" marker-end="url(#fmg-arrow)"/>
      <path d="M372 92 468 124" marker-end="url(#fmg-arrow)"/>
      <path d="M372 246 468 240" marker-end="url(#fmg-arrow)"/>
    </g>
    <path d="M372 262 468 296" fill="none" stroke="#8a96a3" stroke-width="2" stroke-dasharray="5 4"/>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="420" y="68">group A</text>
      <text x="405" y="136">groups B, C</text>
      <text x="420" y="236">in flight: m1</text>
      <text x="400" y="312">nothing to take</text>
    </g>
    <text x="390" y="342" font-size="13" fill="#40566b">Use the order or account ID as MessageGroupId so different groups run in parallel.</text>
  </g>
</svg>
