<svg xmlns="http://www.w3.org/2000/svg" width="780" height="566" viewBox="0 0 780 566" role="img" aria-labelledby="pmd-title pmd-desc">
  <title id="pmd-title">Transient failures are retried with backoff; poison messages end in the dead-letter queue</title>
  <desc id="pmd-desc">A message is delivered from the queue to the consumer. If processing succeeds it is acked and deleted. If the error is permanent, such as invalid data, it goes straight to the dead-letter queue. If it is transient and attempts remain, it is retried later with exponential backoff and redelivered to the queue. When the attempt limit is reached it also goes to the dead-letter queue, which alerts the owner; after a fix the messages are redriven to the queue.</desc>
  <defs>
    <marker id="pmd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="pmd-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="566" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="110" y="40" width="240" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="60" font-size="14" font-weight="700" fill="#36424e">Queue</text>
    <text x="230" y="77" font-size="11.5" fill="#36424e">orders.email</text>

    <rect x="110" y="108" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="230" y="128" font-size="14" font-weight="700" fill="#66400f">Consumer handles it</text>
    <text x="230" y="145" font-size="11.5" fill="#66400f">attempt n</text>

    <path d="M230 178 330 208 230 238 130 208z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="212" font-size="12" font-weight="700" fill="#36424e">succeeded?</text>
    <path d="M230 268 330 298 230 328 130 298z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="295" font-size="12" font-weight="700" fill="#36424e">permanent</text>
    <text x="230" y="309" font-size="12" font-weight="700" fill="#36424e">error?</text>
    <path d="M230 358 330 388 230 418 130 388z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="385" font-size="12" font-weight="700" fill="#36424e">attempts</text>
    <text x="230" y="399" font-size="12" font-weight="700" fill="#36424e">below max?</text>

    <rect x="110" y="448" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="230" y="468" font-size="14" font-weight="700" fill="#66400f">Retry later</text>
    <text x="230" y="485" font-size="11.5" fill="#66400f">exponential backoff + jitter</text>

    <rect x="450" y="184" width="280" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="204" font-size="14" font-weight="700" fill="#294a2e">Ack / delete</text>
    <text x="590" y="221" font-size="11.5" fill="#294a2e">done</text>
    <rect x="450" y="274" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="590" y="294" font-size="14" font-weight="700" fill="#6b241c">Dead-letter queue</text>
    <text x="590" y="311" font-size="11.5" fill="#6b241c">invalid data, unknown type, a bug</text>
    <rect x="450" y="364" width="280" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="590" y="384" font-size="14" font-weight="700" fill="#36424e">Alert, inspect, fix</text>
    <text x="590" y="401" font-size="11.5" fill="#36424e">DLQ depth above 0 pages the owner</text>
    <rect x="450" y="448" width="280" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="590" y="468" font-size="14" font-weight="700" fill="#294a2e">Redrive to the queue</text>
    <text x="590" y="485" font-size="11.5" fill="#294a2e">safe because consumers are idempotent</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 88V106" marker-end="url(#pmd-arrow)"/>
      <path d="M230 156V176" marker-end="url(#pmd-arrow)"/>
      <path d="M230 238V266" marker-end="url(#pmd-arrow)"/>
      <path d="M230 328V356" marker-end="url(#pmd-arrow)"/>
      <path d="M230 418V446" marker-end="url(#pmd-arrow)"/>
      <path d="M330 208H448" marker-end="url(#pmd-arrow)"/>
      <path d="M330 298H448" marker-end="url(#pmd-arrow)"/>
      <path d="M330 388H390V312H448" marker-end="url(#pmd-arrow)"/>
      <path d="M590 322V362" marker-end="url(#pmd-arrow)"/>
      <path d="M590 412V446" marker-end="url(#pmd-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round">
      <path d="M110 472H60V64H108" marker-end="url(#pmd-ret)"/>
      <path d="M730 472H756V22H230V38" marker-end="url(#pmd-ret)"/>
    </g>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="389" y="201">yes</text>
      <text x="389" y="291">yes</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="240" y="101">deliver</text>
      <text x="240" y="257">no</text>
      <text x="240" y="347">no</text>
      <text x="240" y="437">yes</text>
      <text x="338" y="406">no: limit reached</text>
      <text x="66" y="262">redeliver</text>
      <text x="600" y="17">redrive</text>
    </g>
    <text x="390" y="540" font-size="13" fill="#40566b">Retries handle transient errors; permanent errors and exhausted retries go to the DLQ.</text>
  </g>
</svg>
