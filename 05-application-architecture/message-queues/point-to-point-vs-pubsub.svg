<svg xmlns="http://www.w3.org/2000/svg" width="780" height="372" viewBox="0 0 780 372" role="img" aria-labelledby="ptp-title ptp-desc">
  <title id="ptp-title">Point-to-point queues share work; publish/subscribe gives every subscriber a copy</title>
  <desc id="ptp-desc">Left: a producer publishes messages m1 to m4 to a queue. Each message is delivered to exactly one of three competing workers: worker A gets m1 and m4, worker B gets m2, worker C gets m3. Right: a producer publishes m1 to a topic or exchange, which copies it to three subscribers, email, analytics and inventory, each through its own queue.</desc>
  <defs>
    <marker id="ptp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="372" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="32" font-size="13" font-weight="700" fill="#263e5a">Point-to-point (work queue)</text>
    <text x="200" y="50" font-size="11.5" fill="#40566b">each message goes to ONE worker</text>
    <text x="580" y="32" font-size="13" font-weight="700" fill="#463365">Publish/subscribe (fan-out)</text>
    <text x="580" y="50" font-size="11.5" fill="#40566b">each subscriber gets its OWN copy</text>
    <path d="M390 20V320" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="130" y="66" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="200" y="85" font-size="14" font-weight="700" fill="#263e5a">Producer</text>
    <text x="200" y="101" font-size="11.5" fill="#263e5a">orders API</text>
    <rect x="110" y="148" width="180" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="200" y="168" font-size="14" font-weight="700" fill="#36424e">Queue</text>
    <text x="200" y="185" font-size="11.5" fill="#36424e">m1  m2  m3  m4</text>

    <rect x="24" y="262" width="104" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="76" y="282" font-size="14" font-weight="700" fill="#66400f">Worker A</text>
    <text x="76" y="299" font-size="11.5" fill="#66400f">process + ack</text>
    <rect x="148" y="262" width="104" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="200" y="282" font-size="14" font-weight="700" fill="#66400f">Worker B</text>
    <text x="200" y="299" font-size="11.5" fill="#66400f">process + ack</text>
    <rect x="272" y="262" width="104" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="324" y="282" font-size="14" font-weight="700" fill="#66400f">Worker C</text>
    <text x="324" y="299" font-size="11.5" fill="#66400f">process + ack</text>

    <rect x="510" y="66" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="580" y="85" font-size="14" font-weight="700" fill="#263e5a">Producer</text>
    <text x="580" y="101" font-size="11.5" fill="#263e5a">orders API</text>
    <rect x="490" y="148" width="180" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="580" y="168" font-size="14" font-weight="700" fill="#463365">Topic / exchange</text>
    <text x="580" y="185" font-size="11.5" fill="#463365">copies every message</text>

    <rect x="404" y="262" width="104" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="456" y="282" font-size="14" font-weight="700" fill="#294a2e">Email</text>
    <text x="456" y="299" font-size="11.5" fill="#294a2e">own queue: m1</text>
    <rect x="528" y="262" width="104" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="282" font-size="14" font-weight="700" fill="#294a2e">Analytics</text>
    <text x="580" y="299" font-size="11.5" fill="#294a2e">own queue: m1</text>
    <rect x="652" y="262" width="104" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="704" y="282" font-size="14" font-weight="700" fill="#294a2e">Inventory</text>
    <text x="704" y="299" font-size="11.5" fill="#294a2e">own queue: m1</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 110V146" marker-end="url(#ptp-arrow)"/>
      <path d="M160 196 84 260" marker-end="url(#ptp-arrow)"/>
      <path d="M200 196V260" marker-end="url(#ptp-arrow)"/>
      <path d="M240 196 316 260" marker-end="url(#ptp-arrow)"/>
      <path d="M580 110V146" marker-end="url(#ptp-arrow)"/>
      <path d="M540 196 464 260" marker-end="url(#ptp-arrow)"/>
      <path d="M580 196V260" marker-end="url(#ptp-arrow)"/>
      <path d="M620 196 696 260" marker-end="url(#ptp-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="208" y="133" text-anchor="start">publish m1-m4</text>
      <text x="112" y="226" text-anchor="end">m1, m4</text>
      <text x="208" y="234" text-anchor="start">m2</text>
      <text x="288" y="226" text-anchor="start">m3</text>
      <text x="588" y="133" text-anchor="start">publish m1</text>
      <text x="492" y="226" text-anchor="end">copy</text>
      <text x="588" y="234" text-anchor="start">copy</text>
      <text x="668" y="226" text-anchor="start">copy</text>
    </g>
    <text x="390" y="350" font-size="13" fill="#40566b">A queue shares work among competing consumers; a topic gives every subscriber a copy.</text>
  </g>
</svg>
