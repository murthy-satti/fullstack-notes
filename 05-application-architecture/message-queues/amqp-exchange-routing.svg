<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="amq-title amq-desc">
  <title id="amq-title">How direct, topic, and fanout exchanges route a published message to queues</title>
  <desc id="amq-desc">Direct: a message published with key pdf reaches the pdf-jobs queue bound with key pdf, not image-jobs. Topic: a message with key order.eu.created matches bindings *.eu.* and order.#, so eu-orders and all-orders get copies, while us-orders bound with *.us.* does not. Fanout: the key is ignored and the email, audit and analytics queues all get a copy. Consumers read from the queues that received the message.</desc>
  <defs>
    <marker id="amq-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="12.5" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="20" y="34">Direct: the routing key must equal the binding key</text>
      <text x="20" y="158">Topic: * matches exactly one word, # matches zero or more words</text>
      <text x="20" y="322">Fanout: every bound queue gets a copy; the key is ignored</text>
    </g>

    <g font-size="14" font-weight="700">
      <rect x="20" y="66" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="90" y="85" fill="#263e5a">Producer</text>
      <rect x="210" y="66" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="280" y="85" fill="#463365">direct</text>
      <rect x="20" y="204" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="90" y="223" fill="#263e5a">Producer</text>
      <rect x="210" y="204" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="280" y="223" fill="#463365">topic</text>
      <rect x="20" y="372" width="140" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="90" y="391" fill="#263e5a">Producer</text>
      <rect x="210" y="372" width="140" height="44" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="280" y="391" fill="#463365">fanout</text>
    </g>
    <g font-size="11.5">
      <text x="90" y="101" fill="#263e5a">key: pdf</text>
      <text x="280" y="101" fill="#463365">exchange</text>
      <text x="90" y="239" fill="#263e5a">order.eu.created</text>
      <text x="280" y="239" fill="#463365">exchange</text>
      <text x="90" y="407" fill="#263e5a">any key</text>
      <text x="280" y="407" fill="#463365">exchange</text>
    </g>

    <g stroke-width="2">
      <rect x="470" y="52" width="150" height="34" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="470" y="94" width="150" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="470" y="167" width="150" height="34" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="470" y="209" width="150" height="34" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="470" y="251" width="150" height="34" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="470" y="335" width="150" height="34" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="470" y="377" width="150" height="34" rx="8" fill="#e8f5e9" stroke="#53845b"/>
      <rect x="470" y="419" width="150" height="34" rx="8" fill="#e8f5e9" stroke="#53845b"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="545" y="74" fill="#294a2e">pdf-jobs</text>
      <text x="545" y="116" fill="#36424e">image-jobs</text>
      <text x="545" y="189" fill="#294a2e">eu-orders</text>
      <text x="545" y="231" fill="#294a2e">all-orders</text>
      <text x="545" y="273" fill="#36424e">us-orders</text>
      <text x="545" y="357" fill="#294a2e">email</text>
      <text x="545" y="399" fill="#294a2e">audit</text>
      <text x="545" y="441" fill="#294a2e">analytics</text>
    </g>

    <g fill="#fff0d9" stroke="#bd7a20" stroke-width="2">
      <rect x="660" y="52" width="120" height="34" rx="17"/>
      <rect x="660" y="167" width="120" height="34" rx="17"/>
      <rect x="660" y="209" width="120" height="34" rx="17"/>
      <rect x="660" y="335" width="120" height="34" rx="17"/>
      <rect x="660" y="377" width="120" height="34" rx="17"/>
      <rect x="660" y="419" width="120" height="34" rx="17"/>
    </g>
    <g font-size="12" font-weight="700" fill="#66400f">
      <text x="720" y="73">consumer</text>
      <text x="720" y="188">consumer</text>
      <text x="720" y="230">consumer</text>
      <text x="720" y="356">consumer</text>
      <text x="720" y="398">consumer</text>
      <text x="720" y="440">consumer</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M160 88H208" marker-end="url(#amq-arrow)"/>
      <path d="M160 226H208" marker-end="url(#amq-arrow)"/>
      <path d="M160 394H208" marker-end="url(#amq-arrow)"/>
      <path d="M350 84 468 70" marker-end="url(#amq-arrow)"/>
      <path d="M350 220 468 186" marker-end="url(#amq-arrow)"/>
      <path d="M350 226H468" marker-end="url(#amq-arrow)"/>
      <path d="M350 388 468 354" marker-end="url(#amq-arrow)"/>
      <path d="M350 394H468" marker-end="url(#amq-arrow)"/>
      <path d="M350 400 468 434" marker-end="url(#amq-arrow)"/>
      <path d="M620 69H658" marker-end="url(#amq-arrow)"/>
      <path d="M620 184H658" marker-end="url(#amq-arrow)"/>
      <path d="M620 226H658" marker-end="url(#amq-arrow)"/>
      <path d="M620 352H658" marker-end="url(#amq-arrow)"/>
      <path d="M620 394H658" marker-end="url(#amq-arrow)"/>
      <path d="M620 436H658" marker-end="url(#amq-arrow)"/>
    </g>
    <g fill="none" stroke="#8a96a3" stroke-width="2" stroke-dasharray="5 4">
      <path d="M350 92 468 111"/>
      <path d="M350 232 468 268"/>
    </g>

    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="185" y="80">publish</text>
      <text x="185" y="218">publish</text>
      <text x="185" y="386">publish</text>
      <text x="462" y="60" text-anchor="end">binding: pdf</text>
      <text x="462" y="136" text-anchor="end">image: no match</text>
      <text x="462" y="178" text-anchor="end">*.eu.*</text>
      <text x="462" y="220" text-anchor="end">order.#</text>
      <text x="462" y="292" text-anchor="end">*.us.*: no match</text>
      <text x="462" y="388" text-anchor="end">copy</text>
    </g>
    <text x="400" y="496" font-size="13" fill="#40566b">Producers publish to an exchange; bindings decide which queues get a copy; consumers read queues.</text>
  </g>
</svg>
