<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="kpg-title kpg-desc">
  <title id="kpg-title">Keys choose partitions, and each consumer group splits the partitions between its members</title>
  <desc id="kpg-desc">A producer hashes each record key to a partition of the orders topic: ord_9 to P0, ord_3 to P1, ord_7 to P2. Each partition is an append-only log with numbered offsets. In consumer group email, consumer A reads P0 and P1 and consumer B reads P2; the group's committed offset on P0 means the next record it reads is offset 4. Group analytics has one consumer, X, that reads all three partitions independently. If consumer B leaves, a rebalance reassigns P2 to consumer A.</desc>
  <defs>
    <marker id="kpg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="kpg-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="460" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="152" width="150" height="50" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="99" y="173" font-size="14" font-weight="700" fill="#263e5a">Producer</text>
    <text x="99" y="191" font-size="11.5" fill="#263e5a">hash(key) % 3</text>

    <rect x="232" y="64" width="262" height="206" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="244" y="84" font-size="12" font-weight="700" fill="#36424e" text-anchor="start">topic: orders</text>
    <text x="482" y="84" font-size="11.5" fill="#40566b" text-anchor="end">offsets: oldest to newest</text>

    <g fill="#f0e9fb" stroke="#8062a8" stroke-width="2">
      <rect x="244" y="100" width="34" height="34" rx="6"/>
      <rect x="244" y="160" width="34" height="34" rx="6"/>
      <rect x="244" y="220" width="34" height="34" rx="6"/>
    </g>
    <g font-size="12" font-weight="700" fill="#463365">
      <text x="261" y="121">P0</text>
      <text x="261" y="181">P1</text>
      <text x="261" y="241">P2</text>
    </g>
    <g fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5">
      <rect x="286" y="100" width="28" height="34" rx="4"/><rect x="316" y="100" width="28" height="34" rx="4"/><rect x="346" y="100" width="28" height="34" rx="4"/><rect x="376" y="100" width="28" height="34" rx="4"/><rect x="406" y="100" width="28" height="34" rx="4"/><rect x="436" y="100" width="28" height="34" rx="4"/>
      <rect x="286" y="160" width="28" height="34" rx="4"/><rect x="316" y="160" width="28" height="34" rx="4"/><rect x="346" y="160" width="28" height="34" rx="4"/><rect x="376" y="160" width="28" height="34" rx="4"/>
      <rect x="286" y="220" width="28" height="34" rx="4"/><rect x="316" y="220" width="28" height="34" rx="4"/><rect x="346" y="220" width="28" height="34" rx="4"/><rect x="376" y="220" width="28" height="34" rx="4"/><rect x="406" y="220" width="28" height="34" rx="4"/>
    </g>
    <g font-size="11.5" fill="#36424e">
      <text x="300" y="121">0</text><text x="330" y="121">1</text><text x="360" y="121">2</text><text x="390" y="121">3</text><text x="420" y="121">4</text><text x="450" y="121">5</text>
      <text x="300" y="181">0</text><text x="330" y="181">1</text><text x="360" y="181">2</text><text x="390" y="181">3</text>
      <text x="300" y="241">0</text><text x="330" y="241">1</text><text x="360" y="241">2</text><text x="390" y="241">3</text><text x="420" y="241">4</text>
    </g>
    <path d="M405 94V140" stroke="#53845b" stroke-width="2.5"/>
    <text x="286" y="152" font-size="11.5" fill="#294a2e" text-anchor="start">email: next offset 4</text>

    <rect x="536" y="64" width="240" height="150" rx="10" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="656" y="84" font-size="12" font-weight="700" fill="#36424e">group: email</text>
    <rect x="552" y="96" width="208" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="656" y="115" font-size="14" font-weight="700" fill="#66400f">consumer A</text>
    <text x="656" y="131" font-size="11.5" fill="#66400f">assigned P0, P1</text>
    <rect x="552" y="154" width="208" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="656" y="173" font-size="14" font-weight="700" fill="#66400f">consumer B</text>
    <text x="656" y="189" font-size="11.5" fill="#66400f">assigned P2</text>

    <rect x="536" y="232" width="240" height="96" rx="10" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="656" y="252" font-size="12" font-weight="700" fill="#36424e">group: analytics</text>
    <rect x="552" y="264" width="208" height="44" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="656" y="283" font-size="14" font-weight="700" fill="#66400f">consumer X</text>
    <text x="656" y="299" font-size="11.5" fill="#66400f">assigned P0, P1, P2</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 168 242 121" marker-end="url(#kpg-arrow)"/>
      <path d="M174 177H242" marker-end="url(#kpg-arrow)"/>
      <path d="M174 186 242 233" marker-end="url(#kpg-arrow)"/>
      <path d="M468 117 550 114" marker-end="url(#kpg-arrow)"/>
      <path d="M408 177 550 126" marker-end="url(#kpg-arrow)"/>
      <path d="M438 237 550 176" marker-end="url(#kpg-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round">
      <path d="M468 125 550 276" marker-end="url(#kpg-ret)"/>
      <path d="M408 185 550 284" marker-end="url(#kpg-ret)"/>
      <path d="M438 245 550 292" marker-end="url(#kpg-ret)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="205" y="137" text-anchor="end">ord_9</text>
      <text x="208" y="171">ord_3</text>
      <text x="178" y="230" text-anchor="start">ord_7</text>
    </g>

    <rect x="232" y="352" width="544" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="504" y="374" font-size="13" font-weight="700" fill="#36424e">Rebalance</text>
    <text x="504" y="394" font-size="11.5" fill="#36424e">if consumer B crashes or leaves, the group reassigns P2 to consumer A</text>
    <text x="400" y="440" font-size="13" fill="#40566b">Same key, same partition, same order; within a group each partition has one consumer.</text>
  </g>
</svg>
