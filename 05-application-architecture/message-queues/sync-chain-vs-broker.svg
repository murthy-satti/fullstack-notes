<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="scb-title scb-desc">
  <title id="scb-title">A synchronous call chain compared with the same work through a broker</title>
  <desc id="scb-desc">Synchronous: the client posts an order, the orders API calls a slow email provider, the call times out after 30 seconds and the client gets a 500 error. Through a broker: the client posts an order, the API saves it and publishes a message to a queue, and immediately returns 201 Created. An email worker consumes from the queue at a steady pace and sends the email, retrying if the provider is down.</desc>
  <defs>
    <marker id="scb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="scb-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
    <marker id="scb-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#53845b"/>
    </marker>
  </defs>
  <rect width="780" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="30" font-size="13" font-weight="700" fill="#6b241c">Synchronous chain: the user waits on every dependency</text>
    <rect x="30" y="60" width="110" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="85" y="80" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <text x="85" y="97" font-size="11.5" fill="#36424e">browser</text>
    <rect x="250" y="60" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="325" y="80" font-size="14" font-weight="700" fill="#66400f">Orders API</text>
    <text x="325" y="97" font-size="11.5" fill="#66400f">saves the order</text>
    <rect x="520" y="60" width="200" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="620" y="80" font-size="14" font-weight="700" fill="#6b241c">Email provider</text>
    <text x="620" y="97" font-size="11.5" fill="#6b241c">slow or down</text>
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M140 76H248" stroke="#40566b" marker-end="url(#scb-arrow)"/>
      <path d="M400 76H518" stroke="#40566b" marker-end="url(#scb-arrow)"/>
      <path d="M520 96H402" stroke="#b5473a" stroke-dasharray="5 4" marker-end="url(#scb-red)"/>
      <path d="M250 96H142" stroke="#b5473a" stroke-dasharray="5 4" marker-end="url(#scb-red)"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="194" y="70">1  POST /orders</text>
      <text x="459" y="70">2  send receipt</text>
      <text x="461" y="126" fill="#6b241c">3  timeout after 30 s</text>
      <text x="196" y="126" fill="#6b241c">4  500 error to user</text>
    </g>
    <text x="390" y="156" font-size="11.5" fill="#6b241c">Checkout is as slow as the slowest dependency, and fails whenever it fails.</text>
    <path d="M30 174H750" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="390" y="202" font-size="13" font-weight="700" fill="#294a2e">Through a broker: respond now, do the slow work later</text>
    <rect x="30" y="230" width="110" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="85" y="250" font-size="14" font-weight="700" fill="#36424e">Client</text>
    <text x="85" y="267" font-size="11.5" fill="#36424e">browser</text>
    <rect x="210" y="230" width="140" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="280" y="250" font-size="14" font-weight="700" fill="#66400f">Orders API</text>
    <text x="280" y="267" font-size="11.5" fill="#66400f">saves + publishes</text>
    <rect x="420" y="230" width="130" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="485" y="250" font-size="14" font-weight="700" fill="#36424e">Queue</text>
    <text x="485" y="267" font-size="11.5" fill="#36424e">buffers bursts</text>
    <rect x="620" y="230" width="130" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="685" y="250" font-size="14" font-weight="700" fill="#66400f">Email worker</text>
    <text x="685" y="267" font-size="11.5" fill="#66400f">steady pace</text>
    <rect x="620" y="340" width="130" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="685" y="360" font-size="14" font-weight="700" fill="#263e5a">Email provider</text>
    <text x="685" y="377" font-size="11.5" fill="#263e5a">may be down</text>
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M140 246H208" stroke="#40566b" marker-end="url(#scb-arrow)"/>
      <path d="M350 246H418" stroke="#40566b" marker-end="url(#scb-arrow)"/>
      <path d="M210 266H142" stroke="#53845b" stroke-dasharray="5 4" marker-end="url(#scb-ret)"/>
      <path d="M550 254H618" stroke="#40566b" marker-end="url(#scb-arrow)"/>
      <path d="M685 278V338" stroke="#40566b" marker-end="url(#scb-arrow)"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="174" y="240">1  POST</text>
      <text x="384" y="240">2  publish</text>
      <text x="176" y="296" fill="#294a2e">3  201 Created</text>
      <text x="584" y="247">4  consume</text>
      <text x="677" y="314" text-anchor="end">5  send, retry if down</text>
    </g>
    <g font-size="11.5" fill="#294a2e" text-anchor="start">
      <text x="30" y="332">A burst of 10,000 orders becomes a backlog that</text>
      <text x="30" y="348">workers drain at a safe rate; an email outage</text>
      <text x="30" y="364">delays emails, not checkouts.</text>
    </g>
    <text x="390" y="420" font-size="13" fill="#40566b">The broker separates the user's response from slow, unreliable work.</text>
  </g>
</svg>
