<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="tob-title tob-desc">
  <title id="tob-title">The dual-write problem and how a transactional outbox fixes it</title>
  <desc id="tob-desc">Dual write: the order service commits the order to the database, then tries to publish OrderPlaced to the broker, but the process crashes, so the order exists and the event is lost. Transactional outbox: the service writes the order row and an outbox row in one database transaction. A relay reads new outbox rows, publishes them to the broker, waits for the broker's confirm, and marks the rows published. The broker delivers the event to consumers, which deduplicate by message ID because the relay can publish a row more than once.</desc>
  <defs>
    <marker id="tob-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="tob-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
    <marker id="tob-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="390" y="28" font-size="13" font-weight="700" fill="#6b241c">Dual write: two separate writes, no shared transaction</text>
    <rect x="24" y="78" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="98" font-size="14" font-weight="700" fill="#66400f">Order service</text>
    <text x="99" y="115" font-size="11.5" fill="#66400f">placeOrder()</text>
    <rect x="330" y="48" width="170" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="415" y="67" font-size="14" font-weight="700" fill="#263e5a">Database</text>
    <text x="415" y="83" font-size="11.5" fill="#263e5a">orders</text>
    <rect x="330" y="116" width="170" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="415" y="135" font-size="14" font-weight="700" fill="#36424e">Broker</text>
    <text x="415" y="151" font-size="11.5" fill="#36424e">order-events</text>
    <rect x="560" y="92" width="196" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="658" y="112" font-size="14" font-weight="700" fill="#6b241c">Event lost</text>
    <text x="658" y="129" font-size="11.5" fill="#6b241c">order exists, nobody hears</text>
    <path d="M174 92 328 72" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#tob-arrow)"/>
    <path d="M174 112 328 136" fill="none" stroke="#b5473a" stroke-width="2" marker-end="url(#tob-red)"/>
    <path d="M500 138 558 124" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tob-red)"/>
    <text x="245" y="70" font-size="11.5" fill="#40566b">1  INSERT + COMMIT: ok</text>
    <text x="245" y="148" font-size="11.5" fill="#6b241c">2  publish: process crashes</text>
    <path d="M24 180H756" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="390" y="206" font-size="13" font-weight="700" fill="#294a2e">Transactional outbox: one local transaction, then a relay publishes</text>
    <rect x="24" y="246" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="99" y="266" font-size="14" font-weight="700" fill="#66400f">Order service</text>
    <text x="99" y="283" font-size="11.5" fill="#66400f">placeOrder()</text>
    <rect x="228" y="228" width="210" height="84" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="333" y="249" font-size="14" font-weight="700" fill="#263e5a">One transaction</text>
    <text x="333" y="268" font-size="11.5" fill="#263e5a">INSERT INTO orders ...</text>
    <text x="333" y="284" font-size="11.5" fill="#263e5a">INSERT INTO outbox ...</text>
    <text x="333" y="300" font-size="11.5" fill="#263e5a">COMMIT: both or neither</text>
    <rect x="500" y="246" width="120" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="560" y="266" font-size="14" font-weight="700" fill="#66400f">Relay</text>
    <text x="560" y="283" font-size="11.5" fill="#66400f">polls or CDC</text>
    <rect x="650" y="246" width="110" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="705" y="266" font-size="14" font-weight="700" fill="#36424e">Broker</text>
    <text x="705" y="283" font-size="11.5" fill="#36424e">confirms</text>
    <rect x="650" y="362" width="110" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="705" y="382" font-size="14" font-weight="700" fill="#294a2e">Consumers</text>
    <text x="705" y="399" font-size="11.5" fill="#294a2e">dedupe by ID</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M174 270H226" marker-end="url(#tob-arrow)"/>
      <path d="M438 262H498" marker-end="url(#tob-arrow)"/>
      <path d="M620 262H648" marker-end="url(#tob-arrow)"/>
      <path d="M705 294V360" marker-end="url(#tob-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round">
      <path d="M650 282H622" marker-end="url(#tob-ret)"/>
      <path d="M560 294V352H333V314" marker-end="url(#tob-ret)"/>
    </g>
    <g font-size="11.5" fill="#40566b">
      <text x="200" y="262">1 write</text>
      <text x="468" y="255">2 read</text>
      <text x="634" y="238">3 publish</text>
      <text x="634" y="312">4 confirm</text>
      <text x="446" y="346">5  mark row published</text>
      <text x="697" y="332" text-anchor="end">6 deliver</text>
    </g>
    <text x="390" y="450" font-size="13" fill="#40566b">The event is stored if and only if the order commits; the relay publishes it at least once.</text>
  </g>
</svg>
