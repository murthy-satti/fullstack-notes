<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="idc-title idc-desc">
  <title id="idc-title">An idempotent consumer records each message ID in the same transaction as its change</title>
  <desc id="idc-desc">A message arrives. The consumer begins a transaction and inserts the message ID into processed_messages. If no new row is inserted, the message is a duplicate: it rolls back and acks without repeating the effect. If the row is new, it applies the business change. If the query or commit fails, it rolls back and does not ack, so the broker redelivers the message later. Otherwise it commits and then acks.</desc>
  <defs>
    <marker id="idc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="idc-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="760" height="580" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="24" width="240" height="40" rx="20" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="49" font-size="14" font-weight="700" fill="#36424e">Message msg_42 arrives</text>

    <rect x="120" y="84" width="240" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="240" y="104" font-size="14" font-weight="700" fill="#263e5a">BEGIN</text>
    <text x="240" y="121" font-size="11.5" fill="#263e5a">one database transaction</text>

    <rect x="120" y="152" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="240" y="172" font-size="14" font-weight="700" fill="#66400f">INSERT message ID</text>
    <text x="240" y="189" font-size="11.5" fill="#66400f">into processed_messages</text>

    <path d="M240 222 340 252 240 282 140 252z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="249" font-size="12" font-weight="700" fill="#36424e">new row</text>
    <text x="240" y="263" font-size="12" font-weight="700" fill="#36424e">inserted?</text>

    <rect x="120" y="304" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="240" y="324" font-size="14" font-weight="700" fill="#66400f">Apply business change</text>
    <text x="240" y="341" font-size="11.5" fill="#66400f">UPDATE accounts SET balance ...</text>

    <path d="M240 374 340 404 240 434 140 404z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="240" y="401" font-size="12" font-weight="700" fill="#36424e">query or</text>
    <text x="240" y="415" font-size="12" font-weight="700" fill="#36424e">commit failed?</text>

    <rect x="120" y="456" width="240" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="240" y="476" font-size="14" font-weight="700" fill="#294a2e">COMMIT, then ack</text>
    <text x="240" y="493" font-size="11.5" fill="#294a2e">effect and ID saved together</text>

    <rect x="440" y="228" width="280" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="580" y="248" font-size="14" font-weight="700" fill="#294a2e">Duplicate: ROLLBACK, ack</text>
    <text x="580" y="265" font-size="11.5" fill="#294a2e">already processed, skip the effect</text>

    <rect x="440" y="380" width="280" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="580" y="400" font-size="14" font-weight="700" fill="#6b241c">ROLLBACK, do not ack</text>
    <text x="580" y="417" font-size="11.5" fill="#6b241c">broker redelivers later</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 64V82" marker-end="url(#idc-arrow)"/>
      <path d="M240 132V150" marker-end="url(#idc-arrow)"/>
      <path d="M240 200V220" marker-end="url(#idc-arrow)"/>
      <path d="M240 282V302" marker-end="url(#idc-arrow)"/>
      <path d="M240 352V372" marker-end="url(#idc-arrow)"/>
      <path d="M240 434V454" marker-end="url(#idc-arrow)"/>
      <path d="M340 252H438" marker-end="url(#idc-arrow)"/>
      <path d="M340 404H438" marker-end="url(#idc-arrow)"/>
    </g>
    <path d="M720 404H742V44H362" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#idc-ret)"/>
    <text x="560" y="37" font-size="11.5" font-style="italic" fill="#40566b">redeliver the same message</text>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="389" y="245">no</text>
      <text x="389" y="397">yes</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="250" y="297">yes</text>
      <text x="250" y="449">no</text>
    </g>
    <text x="380" y="556" font-size="13" fill="#40566b">The message ID and the change commit together, so a redelivery is detected and skipped.</text>
  </g>
</svg>
