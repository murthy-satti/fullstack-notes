<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-labelledby="ccp-title ccp-desc">
  <title id="ccp-title">The claim-check pattern sends a reference through the broker and the payload through object storage</title>
  <desc id="ccp-desc">1: the producer uploads a 40 MB payload to object storage. 2: it publishes a small message containing the export ID and the object key to the broker. 3: the broker delivers the small message to the consumer. 4: the consumer gets the object by its key from storage. 5: storage returns the payload. 6: the consumer acks the message. A lifecycle rule deletes payloads only after the queue and dead-letter queue retention have passed, so replays still find them.</desc>
  <defs>
    <marker id="ccp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="ccp-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="760" height="448" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4">
      <path d="M90 72V330"/><path d="M280 72V330"/><path d="M470 72V330"/><path d="M660 72V330"/>
    </g>
    <rect x="15" y="24" width="150" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="90" y="44" font-size="14" font-weight="700" fill="#263e5a">Producer</text>
    <text x="90" y="61" font-size="11.5" fill="#263e5a">export service</text>
    <rect x="205" y="24" width="150" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="280" y="44" font-size="14" font-weight="700" fill="#463365">Object storage</text>
    <text x="280" y="61" font-size="11.5" fill="#463365">S3 bucket</text>
    <rect x="395" y="24" width="150" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="470" y="44" font-size="14" font-weight="700" fill="#36424e">Broker</text>
    <text x="470" y="61" font-size="11.5" fill="#36424e">queue</text>
    <rect x="585" y="24" width="150" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="660" y="44" font-size="14" font-weight="700" fill="#66400f">Consumer</text>
    <text x="660" y="61" font-size="11.5" fill="#66400f">worker</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M90 110H278" marker-end="url(#ccp-arrow)"/>
      <path d="M90 150H468" marker-end="url(#ccp-arrow)"/>
      <path d="M470 190H658" marker-end="url(#ccp-arrow)"/>
      <path d="M660 230H282" marker-end="url(#ccp-arrow)"/>
      <path d="M660 300H472" marker-end="url(#ccp-arrow)"/>
    </g>
    <path d="M280 262H658" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ccp-ret)"/>
    <g font-size="11.5" fill="#40566b">
      <text x="185" y="104">1  PUT payload (40 MB)</text>
      <text x="375" y="144">2  publish {exportId, key}</text>
      <text x="565" y="184">3  deliver small message</text>
      <text x="375" y="224">4  GET exports/77.json</text>
      <text x="565" y="256">5  payload (40 MB)</text>
      <text x="565" y="294">6  ack</text>
    </g>
    <rect x="40" y="350" width="680" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="380" y="377" font-size="11.5" fill="#36424e">Lifecycle rule: delete payloads only after the queue and DLQ retention, so replays still find them</text>
    <text x="380" y="428" font-size="13" fill="#40566b">The message carries a small reference; the large payload travels through object storage.</text>
  </g>
</svg>
