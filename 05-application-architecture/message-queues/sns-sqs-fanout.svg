<svg xmlns="http://www.w3.org/2000/svg" width="780" height="468" viewBox="0 0 780 468" role="img" aria-labelledby="snf-title snf-desc">
  <title id="snf-title">SNS fans one published event out to a separate SQS queue per consumer</title>
  <desc id="snf-desc">The orders API publishes an event to the SNS topic order-events. SNS pushes a copy to three SQS subscriptions: email-queue and analytics-queue receive all events, while search-queue has a filter policy and receives only OrderPlaced. Each queue is polled by its own worker. Messages that fail in search-queue more than maxReceiveCount times move to search-dlq.</desc>
  <defs>
    <marker id="snf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="780" height="468" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="186" width="140" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="94" y="206" font-size="14" font-weight="700" fill="#66400f">Orders API</text>
    <text x="94" y="223" font-size="11.5" fill="#66400f">PublishCommand</text>
    <rect x="214" y="176" width="160" height="68" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="294" y="200" font-size="14" font-weight="700" fill="#463365">SNS topic</text>
    <text x="294" y="218" font-size="11.5" fill="#463365">order-events</text>
    <text x="294" y="234" font-size="11.5" fill="#463365">pushes a copy each</text>

    <g stroke-width="2">
      <rect x="460" y="60" width="170" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="460" y="186" width="170" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="460" y="312" width="170" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3"/>
      <rect x="670" y="60" width="100" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="670" y="186" width="100" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="670" y="312" width="100" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20"/>
      <rect x="460" y="392" width="170" height="40" rx="8" fill="#fde8e6" stroke="#b5473a"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="545" y="80" fill="#36424e">email-queue</text>
      <text x="545" y="206" fill="#36424e">analytics-queue</text>
      <text x="545" y="332" fill="#36424e">search-queue</text>
      <text x="720" y="80" fill="#66400f">email</text>
      <text x="720" y="206" fill="#66400f">analytics</text>
      <text x="720" y="332" fill="#66400f">indexer</text>
      <text x="545" y="417" fill="#6b241c">search-dlq</text>
    </g>
    <g font-size="11.5">
      <text x="545" y="97" fill="#36424e">SQS, all events</text>
      <text x="545" y="223" fill="#36424e">SQS, all events</text>
      <text x="545" y="349" fill="#36424e">SQS, filtered</text>
      <text x="720" y="97" fill="#66400f">worker</text>
      <text x="720" y="223" fill="#66400f">worker</text>
      <text x="720" y="349" fill="#66400f">worker</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M164 210H212" marker-end="url(#snf-arrow)"/>
      <path d="M374 196 458 92" marker-end="url(#snf-arrow)"/>
      <path d="M374 210H458" marker-end="url(#snf-arrow)"/>
      <path d="M374 224 458 328" marker-end="url(#snf-arrow)"/>
      <path d="M630 84H668" marker-end="url(#snf-arrow)"/>
      <path d="M630 210H668" marker-end="url(#snf-arrow)"/>
      <path d="M630 336H668" marker-end="url(#snf-arrow)"/>
      <path d="M545 360V390" marker-end="url(#snf-arrow)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="188" y="202">publish</text>
      <text x="452" y="76" text-anchor="end">all events</text>
      <text x="452" y="203" text-anchor="end">all events</text>
      <text x="452" y="356" text-anchor="end">filter: OrderPlaced</text>
      <text x="649" y="77">poll</text>
      <text x="649" y="203">poll</text>
      <text x="649" y="329">poll</text>
      <text x="553" y="380" text-anchor="start">after maxReceiveCount</text>
    </g>
    <text x="390" y="456" font-size="13" fill="#40566b">Each subscriber has its own queue, so a slow or failing consumer never affects the others.</text>
  </g>
</svg>
