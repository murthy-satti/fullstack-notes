<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="sml-title sml-desc">
  <title id="sml-title">The life of an SQS message: visible, in flight, then deleted, redelivered, dead-lettered, or expired</title>
  <desc id="sml-desc">SendMessage puts a message in the visible state. ReceiveMessage moves it to in flight, invisible to other consumers for the visibility timeout, and increments its receive count; ChangeMessageVisibility can extend the timeout. DeleteMessage moves it to deleted. If the timeout expires without a delete, it becomes visible again. When its receive count exceeds maxReceiveCount, the redrive policy moves it to the dead-letter queue. If the retention period ends first, it expires.</desc>
  <defs>
    <marker id="sml-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="sml-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="150" width="130" height="44" rx="22" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="95" y="177" font-size="14" font-weight="700" fill="#36424e">SendMessage</text>

    <rect x="230" y="140" width="170" height="64" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="315" y="166" font-size="14" font-weight="700" fill="#263e5a">Visible</text>
    <text x="315" y="184" font-size="11.5" fill="#263e5a">waiting in the queue</text>
    <rect x="520" y="140" width="200" height="64" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="620" y="166" font-size="14" font-weight="700" fill="#66400f">In flight (invisible)</text>
    <text x="620" y="184" font-size="11.5" fill="#66400f">visibility timeout running</text>

    <rect x="520" y="300" width="200" height="50" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="620" y="321" font-size="14" font-weight="700" fill="#294a2e">Deleted</text>
    <text x="620" y="338" font-size="11.5" fill="#294a2e">processing succeeded</text>
    <rect x="230" y="300" width="170" height="50" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="315" y="321" font-size="14" font-weight="700" fill="#6b241c">Dead-letter queue</text>
    <text x="315" y="338" font-size="11.5" fill="#6b241c">via redrive policy</text>
    <rect x="30" y="300" width="130" height="50" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="95" y="321" font-size="14" font-weight="700" fill="#36424e">Expired</text>
    <text x="95" y="338" font-size="11.5" fill="#36424e">retention ended</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 172H228" marker-end="url(#sml-arrow)"/>
      <path d="M400 160H518" marker-end="url(#sml-arrow)"/>
      <path d="M620 204V298" marker-end="url(#sml-arrow)"/>
      <path d="M315 204V298" marker-end="url(#sml-arrow)"/>
      <path d="M260 204V262H95V298" marker-end="url(#sml-arrow)"/>
      <path d="M600 140V112H660V138" marker-end="url(#sml-arrow)"/>
    </g>
    <path d="M518 186H402" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#sml-ret)"/>

    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="194" y="164">send</text>
      <text x="459" y="138">ReceiveMessage</text>
      <text x="459" y="153">(receive count + 1)</text>
      <text x="460" y="222">timeout, not deleted</text>
      <text x="630" y="104">ChangeMessageVisibility: extend</text>
      <text x="628" y="255" text-anchor="start">DeleteMessage</text>
      <text x="323" y="244" text-anchor="start">receive count above</text>
      <text x="323" y="258" text-anchor="start">maxReceiveCount</text>
      <text x="100" y="256" text-anchor="start">retention period ends</text>
    </g>
    <text x="390" y="396" font-size="13" fill="#40566b">A received message is only hidden; deleting it is the acknowledgement.</text>
  </g>
</svg>
