<svg xmlns="http://www.w3.org/2000/svg" width="780" height="636" viewBox="0 0 780 636" role="img" aria-labelledby="rak-title rak-desc">
  <title id="rak-title">What happens to a RabbitMQ message after ack, nack with requeue, or nack without requeue</title>
  <desc id="rak-desc">The orders.email quorum queue pushes messages to a consumer, at most 10 unacked at a time because of the prefetch count. If the handler succeeds, the consumer acks and the broker deletes the message. If it fails with a transient error on the first attempt, it nacks with requeue and the broker redelivers it. Otherwise it nacks without requeue and the message goes to the dead-letter exchange orders.dlx and on to the dead-letter queue. A requeued message that exceeds the queue's delivery limit is also dead-lettered.</desc>
  <defs>
    <marker id="rak-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="rak-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="636" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="110" y="30" width="240" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="50" font-size="14" font-weight="700" fill="#36424e">orders.email</text>
    <text x="230" y="67" font-size="11.5" fill="#36424e">quorum queue, x-delivery-limit: 5</text>

    <rect x="110" y="108" width="240" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="230" y="128" font-size="14" font-weight="700" fill="#66400f">Consumer</text>
    <text x="230" y="145" font-size="11.5" fill="#66400f">runs the handler</text>

    <path d="M230 180 330 210 230 240 130 210z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="207" font-size="12" font-weight="700" fill="#36424e">handler</text>
    <text x="230" y="221" font-size="12" font-weight="700" fill="#36424e">succeeded?</text>
    <path d="M230 270 330 300 230 330 130 300z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="230" y="297" font-size="12" font-weight="700" fill="#36424e">transient error,</text>
    <text x="230" y="311" font-size="12" font-weight="700" fill="#36424e">first attempt?</text>

    <rect x="110" y="370" width="240" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="230" y="390" font-size="14" font-weight="700" fill="#6b241c">nack(msg, false, false)</text>
    <text x="230" y="407" font-size="11.5" fill="#6b241c">reject without requeue</text>
    <rect x="110" y="450" width="240" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="230" y="470" font-size="14" font-weight="700" fill="#463365">Dead-letter exchange</text>
    <text x="230" y="487" font-size="11.5" fill="#463365">orders.dlx, adds x-death header</text>
    <rect x="110" y="530" width="240" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="230" y="550" font-size="14" font-weight="700" fill="#6b241c">Dead-letter queue</text>
    <text x="230" y="567" font-size="11.5" fill="#6b241c">orders.email.dlq: alert, inspect</text>

    <rect x="440" y="186" width="290" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="585" y="206" font-size="14" font-weight="700" fill="#294a2e">channel.ack(msg)</text>
    <text x="585" y="223" font-size="11.5" fill="#294a2e">broker deletes the message</text>
    <rect x="440" y="276" width="290" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="585" y="296" font-size="14" font-weight="700" fill="#66400f">nack(msg, false, true)</text>
    <text x="585" y="313" font-size="11.5" fill="#66400f">requeue: redelivered = true</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 78V106" marker-end="url(#rak-arrow)"/>
      <path d="M230 156V178" marker-end="url(#rak-arrow)"/>
      <path d="M230 240V268" marker-end="url(#rak-arrow)"/>
      <path d="M230 330V368" marker-end="url(#rak-arrow)"/>
      <path d="M230 418V448" marker-end="url(#rak-arrow)"/>
      <path d="M230 498V528" marker-end="url(#rak-arrow)"/>
      <path d="M330 210H438" marker-end="url(#rak-arrow)"/>
      <path d="M330 300H438" marker-end="url(#rak-arrow)"/>
      <path d="M585 324V474H352" marker-end="url(#rak-arrow)"/>
    </g>
    <path d="M730 300H756V54H352" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#rak-ret)"/>

    <g font-size="12" font-weight="700" fill="#40566b">
      <text x="384" y="203">yes</text>
      <text x="384" y="293">yes</text>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">
      <text x="240" y="97">push (prefetch: at most 10 unacked)</text>
      <text x="240" y="259">no</text>
      <text x="240" y="353">no</text>
      <text x="240" y="519">route to the DLQ</text>
      <text x="370" y="466">delivery limit exceeded</text>
      <text x="520" y="48">redeliver</text>
    </g>
    <text x="390" y="612" font-size="13" fill="#40566b">ack deletes; nack with requeue retries; nack without requeue or the delivery limit dead-letters.</text>
  </g>
</svg>
