<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="lru-title lru-desc">
  <title id="lru-title">How an O(1) LRU cache uses a hash map and a doubly linked list</title>
  <desc id="lru-desc">A hash map finds any key's node in O(1). The doubly linked list orders nodes from the head, most recently used, to the tail, least recently used. At the start the list is C, A, D, B. get(D) unlinks D and relinks it right after the head, giving D, C, A, B. set(E) when the cache is full at capacity 4 removes the tail node B and deletes it from the map, then inserts E at the head, giving E, D, C, A.</desc>
  <defs>
    <marker id="lru-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="lru-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#40566b"/>
    </marker>
    <marker id="lru-arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#bd7a20"/>
    </marker>
    <marker id="lru-arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="800" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="48" font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">hash map</text>
    <rect x="170" y="26" width="510" height="38" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="425" y="44" font-size="12.5" font-weight="700" fill="#463365">Map: key → node   (A, B, C, D)</text>
    <text x="425" y="58" font-size="11" fill="#463365">finds any node in O(1); the list below keeps the order</text>
    <text x="200" y="84" font-size="11" fill="#40566b">most recent</text>
    <text x="650" y="84" font-size="11" fill="#40566b">least recent</text>

    <g font-size="12.5" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="115">1. start</text>
      <text x="24" y="235">2. get(D)</text>
      <text x="24" y="355">3. set(E),</text>
      <text x="24" y="371">full (cap 4)</text>
    </g>

    <g font-size="12" font-weight="700">
      <rect x="170" y="90" width="60" height="40" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="200" y="115" fill="#36424e">head</text>
      <rect x="620" y="90" width="60" height="40" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="650" y="115" fill="#36424e">tail</text>
      <rect x="170" y="210" width="60" height="40" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="200" y="235" fill="#36424e">head</text>
      <rect x="620" y="210" width="60" height="40" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="650" y="235" fill="#36424e">tail</text>
      <rect x="170" y="330" width="60" height="40" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="200" y="355" fill="#36424e">head</text>
      <rect x="620" y="330" width="60" height="40" rx="6" fill="#f5f7fb" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="650" y="355" fill="#36424e">tail</text>
    </g>

    <g font-size="15" font-weight="700">
      <rect x="260" y="90" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="290" y="116" fill="#263e5a">C</text>
      <rect x="350" y="90" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="380" y="116" fill="#263e5a">A</text>
      <rect x="440" y="90" width="60" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="470" y="116" fill="#66400f">D</text>
      <rect x="530" y="90" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="560" y="116" fill="#263e5a">B</text>

      <rect x="260" y="210" width="60" height="40" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="290" y="236" fill="#66400f">D</text>
      <rect x="350" y="210" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="380" y="236" fill="#263e5a">C</text>
      <rect x="440" y="210" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="470" y="236" fill="#263e5a">A</text>
      <rect x="530" y="210" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="560" y="236" fill="#263e5a">B</text>

      <rect x="260" y="330" width="60" height="40" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
      <text x="290" y="356" fill="#294a2e">E</text>
      <rect x="350" y="330" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="380" y="356" fill="#263e5a">D</text>
      <rect x="440" y="330" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="470" y="356" fill="#263e5a">C</text>
      <rect x="530" y="330" width="60" height="40" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="560" y="356" fill="#263e5a">A</text>
      <rect x="700" y="330" width="60" height="40" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="730" y="356" fill="#6b241c">B</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M233 110H257" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M323 110H347" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M413 110H437" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M503 110H527" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M593 110H617" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M233 230H257" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M323 230H347" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M413 230H437" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M503 230H527" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M593 230H617" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M233 350H257" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M323 350H347" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M413 350H437" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M503 350H527" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
      <path d="M593 350H617" marker-start="url(#lru-arrow-start)" marker-end="url(#lru-arrow)"/>
    </g>

    <path d="M470 132C470 172 290 166 290 206" fill="none" stroke="#bd7a20" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#lru-arrow-amber)"/>
    <text x="500" y="166" font-size="11.5" font-weight="700" fill="#66400f" text-anchor="start">D: unlink, relink after head, O(1)</text>

    <path d="M680 350H698" fill="none" stroke="#b5473a" stroke-width="2" marker-end="url(#lru-arrow-red)"/>
    <text x="730" y="318" font-size="11.5" font-weight="700" fill="#6b241c">evicted</text>
    <text x="290" y="318" font-size="11.5" font-weight="700" fill="#294a2e">new at head</text>
    <text x="510" y="394" font-size="11.5" fill="#40566b">remove the node before tail (B), map.delete("B"), then add E after head</text>

    <text x="400" y="424" font-size="13" fill="#40566b">Every get and set touches only a few pointers, so both run in constant time.</text>
  </g>
</svg>
