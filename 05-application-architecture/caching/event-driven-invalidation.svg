<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="edi-title edi-desc">
  <title id="edi-title">Event-driven cache invalidation with a MongoDB change stream</title>
  <desc id="edi-desc">An API service, a background job, and an admin script all write to MongoDB. After each commit, the change stream delivers an event such as an update to _id 42 to an invalidator running products.watch(). The invalidator saves the stream's resume token after each event so it can continue after a restart. It reads the tagged keys with SMEMBERS tag:product:42 and then deletes product:42, the tag set, and every tagged key such as list:category:books and search:abc from Redis. The next reads reload fresh data.</desc>
  <defs>
    <marker id="edi-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="edi-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="94" y="43" font-size="13" font-weight="700" fill="#36424e">API service</text>
    <text x="94" y="59" font-size="11" fill="#36424e">UPDATE price</text>
    <rect x="180" y="24" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="250" y="43" font-size="13" font-weight="700" fill="#36424e">Background job</text>
    <text x="250" y="59" font-size="11" fill="#36424e">bulk import</text>
    <rect x="336" y="24" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="406" y="43" font-size="13" font-weight="700" fill="#36424e">Admin script</text>
    <text x="406" y="59" font-size="11" fill="#36424e">manual fix</text>

    <rect x="60" y="130" width="180" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="150" y="153" font-size="14" font-weight="700" fill="#263e5a">MongoDB</text>
    <text x="150" y="172" font-size="11.5" fill="#263e5a">commits (replica set)</text>
    <rect x="330" y="130" width="200" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="430" y="153" font-size="14" font-weight="700" fill="#66400f">Invalidator</text>
    <text x="430" y="172" font-size="11.5" fill="#66400f">for await ... products.watch()</text>
    <rect x="610" y="130" width="170" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="695" y="153" font-size="13" font-weight="700" fill="#36424e">Resume token</text>
    <text x="695" y="172" font-size="11.5" fill="#36424e">saved after each event</text>

    <rect x="130" y="250" width="600" height="76" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="430" y="270" font-size="13" font-weight="700" fill="#463365">Redis cache: these keys are deleted</text>
    <g font-size="11.5" font-weight="700" fill="#6b241c">
      <rect x="146" y="282" width="110" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="201" y="302">product:42</text>
      <rect x="268" y="282" width="128" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="332" y="302">tag:product:42</text>
      <rect x="408" y="282" width="160" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="488" y="302">list:category:books</text>
      <rect x="580" y="282" width="134" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="647" y="302">search:abc</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M94 68V96"/>
      <path d="M250 68V96"/>
      <path d="M406 68V96"/>
      <path d="M94 96H406"/>
      <path d="M150 96V128" marker-end="url(#edi-arrow)"/>
      <path d="M240 158H328" marker-end="url(#edi-arrow)"/>
      <path d="M400 186V248" marker-end="url(#edi-arrow)"/>
      <path d="M460 186V248" marker-end="url(#edi-arrow)"/>
    </g>
    <circle cx="150" cy="96" r="3.5" fill="#40566b"/>
    <path d="M530 158H608" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#edi-arrow-ret)"/>

    <g font-size="11.5" fill="#40566b">
      <text x="284" y="150" font-weight="700">change event</text>
      <text x="284" y="174">update _id 42</text>
      <text x="569" y="150">store</text>
      <text x="162" y="116" text-anchor="start" font-style="italic">every writer</text>
      <text x="392" y="222" text-anchor="end">1. SMEMBERS tag:product:42</text>
      <text x="468" y="222" text-anchor="start">2. DEL product:42, tag set, tagged keys</text>
    </g>
    <text x="400" y="358" font-size="13" fill="#40566b">Invalidation runs only after a commit and catches every writer, not just the code paths that remember to delete.</text>
  </g>
</svg>
