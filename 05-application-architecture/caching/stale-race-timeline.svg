<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="srt-title srt-desc">
  <title id="srt-title">The stale-data race with write-then-delete, and how delayed double delete removes it</title>
  <desc id="srt-desc">The race: a reader misses the cache and runs SELECT, getting the old price 10. Meanwhile a writer runs UPDATE price 12 and then DEL key. The reader's SET price 10 lands after the delete, so the cache holds the stale price 10 until its TTL expires while the database holds 12. The fix: the writer deletes the key, updates the database, waits about 500 ms, and deletes the key again. A racing reader may briefly store price 10, but the second delete removes it, and the next read misses and loads price 12.</desc>
  <defs>
    <marker id="srt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="28" font-size="13" font-weight="700" fill="#6b241c" text-anchor="start">The race: write the database, then delete (correct order, still racy)</text>
    <path d="M660 22H776" fill="none" stroke="#40566b" stroke-width="1.5" marker-end="url(#srt-arrow)"/>
    <text x="700" y="18" font-size="11" fill="#40566b">time</text>

    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="65">Reader</text>
      <text x="24" y="115">Writer</text>
      <text x="24" y="159">Cache</text>
      <text x="24" y="193">Database</text>
    </g>
    <g font-size="11.5" font-weight="700">
      <rect x="120" y="46" width="80" height="30" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="160" y="66" fill="#36424e">GET: miss</text>
      <rect x="210" y="46" width="124" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="272" y="66" fill="#66400f">SELECT: price=10</text>
      <rect x="560" y="46" width="130" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
      <text x="625" y="66" fill="#6b241c">SET price=10 (old)</text>
      <rect x="350" y="96" width="120" height="30" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="410" y="116" fill="#263e5a">UPDATE price=12</text>
      <rect x="480" y="96" width="70" height="30" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="515" y="116" fill="#463365">DEL key</text>
    </g>
    <text x="566" y="116" font-size="11.5" font-style="italic" fill="#6b241c" text-anchor="start">SET lands after the DEL</text>

    <rect x="120" y="144" width="440" height="22" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1"/>
    <text x="340" y="159" font-size="11" fill="#36424e">empty</text>
    <rect x="560" y="144" width="216" height="22" rx="4" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="668" y="159" font-size="11.5" font-weight="700" fill="#6b241c">price=10, stale until TTL</text>
    <rect x="120" y="178" width="230" height="22" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1"/>
    <text x="235" y="193" font-size="11" fill="#36424e">price=10</text>
    <rect x="350" y="178" width="426" height="22" rx="4" fill="#e5efff" stroke="#4774aa" stroke-width="1"/>
    <text x="563" y="193" font-size="11" fill="#263e5a">price=12</text>

    <path d="M24 222H776" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="248" font-size="13" font-weight="700" fill="#294a2e" text-anchor="start">Fix: delayed double delete (delete, write, wait, delete again)</text>

    <g font-size="12" font-weight="700" fill="#40566b" text-anchor="start">
      <text x="24" y="285">Reader</text>
      <text x="24" y="335">Writer</text>
      <text x="24" y="379">Cache</text>
    </g>
    <g font-size="11.5" font-weight="700">
      <rect x="200" y="266" width="110" height="30" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="255" y="286" fill="#66400f">SELECT: price=10</text>
      <rect x="400" y="266" width="130" height="30" rx="6" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
      <text x="465" y="286" fill="#6b241c">SET price=10 (old)</text>
      <rect x="650" y="266" width="126" height="30" rx="6" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="713" y="286" fill="#294a2e">next GET: loads 12</text>
      <rect x="120" y="316" width="70" height="30" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="1.5"/>
      <text x="155" y="336" fill="#463365">DEL key</text>
      <rect x="250" y="316" width="120" height="30" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="310" y="336" fill="#263e5a">UPDATE price=12</text>
      <rect x="560" y="316" width="80" height="30" rx="6" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="600" y="336" fill="#463365">DEL again</text>
    </g>
    <path d="M370 331H558" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#srt-arrow)"/>
    <text x="464" y="326" font-size="11.5" font-style="italic" fill="#40566b">wait ~500 ms</text>

    <rect x="120" y="364" width="280" height="22" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1"/>
    <text x="260" y="379" font-size="11" fill="#36424e">empty</text>
    <rect x="400" y="364" width="160" height="22" rx="4" fill="#fde8e6" stroke="#b5473a" stroke-width="1.5"/>
    <text x="480" y="379" font-size="11" font-weight="700" fill="#6b241c">price=10 (briefly)</text>
    <rect x="560" y="364" width="90" height="22" rx="4" fill="#eef1f5" stroke="#8a96a3" stroke-width="1"/>
    <text x="605" y="379" font-size="11" fill="#36424e">empty</text>
    <rect x="650" y="364" width="126" height="22" rx="4" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
    <text x="713" y="379" font-size="11" font-weight="700" fill="#294a2e">price=12</text>

    <text x="400" y="420" font-size="13" fill="#40566b">The second delete removes a stale value written by a racing reader; keep a TTL as the final safety net.</text>
  </g>
</svg>
