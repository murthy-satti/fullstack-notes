<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="cly-title cly-desc">
  <title id="cly-title">One request passing through the cache layers</title>
  <desc id="cly-desc">A GET /products/42 request checks the browser cache, then the CDN edge, then the reverse proxy, then the application's in-process cache, then Redis, and finally the database. At each cache layer a hit responds from there and the remaining layers are skipped; a miss passes the request to the next layer. The response travels back the same way and each layer may store a copy with a TTL. Layers closer to the user save more work but give less control over freshness.</desc>
  <defs>
    <marker id="cly-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cly-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
    <marker id="cly-arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8 0 0 4 8 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="310" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="32" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">One GET /products/42 request, left to right until a layer has it</text>

    <g font-size="12.5" font-weight="700">
      <rect x="18" y="50" width="104" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="70" y="73" fill="#263e5a">Browser</text>
      <rect x="150" y="50" width="104" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="202" y="73" fill="#263e5a">CDN edge</text>
      <rect x="282" y="50" width="104" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
      <text x="334" y="73" fill="#263e5a">Reverse proxy</text>
      <rect x="414" y="50" width="104" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="466" y="73" fill="#463365">In-process</text>
      <rect x="546" y="50" width="104" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="598" y="73" fill="#463365">Redis</text>
      <rect x="678" y="50" width="104" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="730" y="73" fill="#66400f">Database</text>
    </g>
    <g font-size="11" >
      <text x="70" y="92" fill="#263e5a">one user</text>
      <text x="202" y="92" fill="#263e5a">near the user</text>
      <text x="334" y="92" fill="#263e5a">near servers</text>
      <text x="466" y="92" fill="#463365">one instance</text>
      <text x="598" y="92" fill="#463365">all instances</text>
      <text x="730" y="92" fill="#66400f">source of truth</text>
    </g>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M122 78H148" marker-end="url(#cly-arrow)"/>
      <path d="M254 78H280" marker-end="url(#cly-arrow)"/>
      <path d="M386 78H412" marker-end="url(#cly-arrow)"/>
      <path d="M518 78H544" marker-end="url(#cly-arrow)"/>
      <path d="M650 78H676" marker-end="url(#cly-arrow)"/>
    </g>
    <g font-size="11" font-style="italic" fill="#40566b">
      <text x="135" y="70">miss</text>
      <text x="267" y="70">miss</text>
      <text x="399" y="70">miss</text>
      <text x="531" y="70">miss</text>
      <text x="663" y="70">miss</text>
    </g>

    <g fill="none" stroke="#53845b" stroke-width="1.5" stroke-linecap="round">
      <path d="M70 106V122" marker-end="url(#cly-arrow)"/>
      <path d="M202 106V122" marker-end="url(#cly-arrow)"/>
      <path d="M334 106V122" marker-end="url(#cly-arrow)"/>
      <path d="M466 106V122" marker-end="url(#cly-arrow)"/>
      <path d="M598 106V122" marker-end="url(#cly-arrow)"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#294a2e">
      <rect x="26" y="124" width="88" height="26" rx="13" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="70" y="141">hit: respond</text>
      <rect x="158" y="124" width="88" height="26" rx="13" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="202" y="141">hit: respond</text>
      <rect x="290" y="124" width="88" height="26" rx="13" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="334" y="141">hit: respond</text>
      <rect x="422" y="124" width="88" height="26" rx="13" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="466" y="141">hit: respond</text>
      <rect x="554" y="124" width="88" height="26" rx="13" fill="#e8f5e9" stroke="#53845b" stroke-width="1.5"/>
      <text x="598" y="141">hit: respond</text>
    </g>
    <rect x="678" y="124" width="104" height="26" rx="13" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
    <text x="730" y="141" font-size="11.5" font-weight="700" fill="#66400f">query runs</text>
    <path d="M730 106V122" fill="none" stroke="#bd7a20" stroke-width="1.5" stroke-linecap="round" marker-end="url(#cly-arrow)"/>

    <path d="M730 150V184H72" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cly-arrow-ret)"/>
    <text x="400" y="204" font-size="11.5" fill="#40566b">response travels back; each layer may store a copy with a TTL</text>

    <path d="M60 240H740" fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" marker-start="url(#cly-arrow-start)" marker-end="url(#cly-arrow)"/>
    <g font-size="11.5" fill="#40566b">
      <text x="24" y="262" text-anchor="start">closer to the user: saves more work,</text>
      <text x="24" y="277" text-anchor="start">less control over freshness</text>
      <text x="776" y="262" text-anchor="end">closer to the source: fresher,</text>
      <text x="776" y="277" text-anchor="end">but each request costs more</text>
    </g>
    <text x="400" y="300" font-size="13" fill="#40566b">A hit at any layer ends the request there; only misses reach the database.</text>
  </g>
</svg>
