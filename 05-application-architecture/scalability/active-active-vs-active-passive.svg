<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 0 800 376" role="img" aria-labelledby="aap-title aap-desc">
  <title id="aap-title">Active-active and active-passive redundancy when one copy fails</title>
  <desc id="aap-desc">Active-active: a load balancer health-checks two app servers that each take 50 percent of traffic. When app B fails its health check it is removed from rotation and app A receives all traffic within seconds, so A needs headroom for the full load. Active-passive: app servers write to a database primary that replicates synchronously to a standby. When the primary fails, the standby is promoted and the app servers send writes to it, which takes seconds to minutes.</desc>
  <defs>
    <marker id="aap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="aap-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
    <marker id="aap-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="376" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="205" y="30" font-size="13" font-weight="700" fill="#263e5a">Active-active: every copy serves traffic</text>
    <text x="600" y="30" font-size="13" font-weight="700" fill="#463365">Active-passive: a standby waits</text>
    <path d="M405 20V310" stroke="#c9d1db" stroke-width="1.5"/>

    <rect x="135" y="52" width="140" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="205" y="71" font-size="14" font-weight="700" fill="#36424e">Load balancer</text>
    <text x="205" y="87" font-size="11.5" fill="#36424e">health checks</text>
    <rect x="40" y="166" width="150" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="115" y="186" font-size="14" font-weight="700" fill="#294a2e">App A</text>
    <text x="115" y="203" font-size="11.5" fill="#294a2e">takes 100% now</text>
    <rect x="220" y="166" width="150" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="295" y="186" font-size="14" font-weight="700" fill="#6b241c">App B fails</text>
    <text x="295" y="203" font-size="11.5" fill="#6b241c">health check fails</text>
    <path d="M190 96 120 164" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#aap-arrow)"/>
    <path d="M220 96 290 164" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aap-red)"/>
    <text x="146" y="128" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="end">all traffic</text>
    <text x="264" y="128" font-size="11.5" font-style="italic" fill="#6b241c" text-anchor="start">removed</text>
    <g font-size="11.5" fill="#36424e">
      <text x="205" y="246">Before: each copy takes 50% of traffic.</text>
      <text x="205" y="264">B fails its health check, so the load</text>
      <text x="205" y="282">balancer sends 100% to A in seconds.</text>
      <text x="205" y="300" font-weight="700">A needs headroom for the full load.</text>
    </g>

    <rect x="525" y="52" width="150" height="44" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="600" y="71" font-size="14" font-weight="700" fill="#36424e">App servers</text>
    <text x="600" y="87" font-size="11.5" fill="#36424e">send writes</text>
    <rect x="420" y="166" width="150" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="495" y="186" font-size="14" font-weight="700" fill="#6b241c">Primary fails</text>
    <text x="495" y="203" font-size="11.5" fill="#6b241c">was taking writes</text>
    <rect x="630" y="166" width="150" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="705" y="186" font-size="14" font-weight="700" fill="#294a2e">Standby promoted</text>
    <text x="705" y="203" font-size="11.5" fill="#294a2e">now the primary</text>
    <path d="M570 96 495 164" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aap-red)"/>
    <path d="M630 96 705 164" fill="none" stroke="#40566b" stroke-width="2" marker-end="url(#aap-arrow)"/>
    <path d="M570 190H628" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aap-ret)"/>
    <text x="525" y="128" font-size="11.5" font-style="italic" fill="#6b241c" text-anchor="end">before</text>
    <text x="676" y="128" font-size="11.5" font-style="italic" fill="#40566b" text-anchor="start">after failover</text>
    <text x="599" y="183" font-size="11.5" font-style="italic" fill="#40566b">sync</text>
    <g font-size="11.5" fill="#36424e">
      <text x="600" y="246">Before: the standby replicates every</text>
      <text x="600" y="264">write but serves no traffic.</text>
      <text x="600" y="282">Failover: detect, promote, repoint apps.</text>
      <text x="600" y="300" font-weight="700">Takes seconds to minutes.</text>
    </g>
    <text x="400" y="352" font-size="13" fill="#40566b">Active-active absorbs a failure at once; active-passive suits databases but needs a failover step.</text>
  </g>
</svg>
