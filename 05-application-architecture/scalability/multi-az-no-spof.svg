<svg xmlns="http://www.w3.org/2000/svg" width="800" height="444" viewBox="0 0 800 444" role="img" aria-labelledby="maz-title maz-desc">
  <title id="maz-title">Removing single points of failure by spreading every layer across availability zones</title>
  <desc id="maz-desc">Before: one load balancer, one app server, and one database without a replica all run in availability zone a, so any one failure stops the service. After: a managed load balancer spans three zones and sends traffic to an app instance in each zone. All app instances write to the database primary in zone a, which replicates synchronously to a standby in zone b and asynchronously to a read replica in zone c. If zone a fails, the load balancer drops its app instance and the standby is promoted.</desc>
  <defs>
    <marker id="maz-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="maz-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="444" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="145" y="30" font-size="13" font-weight="700" fill="#6b241c">Before: single points of failure</text>
    <rect x="30" y="48" width="230" height="290" rx="10" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="42" y="66" font-size="12" font-weight="700" fill="#36424e" text-anchor="start">AZ a</text>
    <rect x="55" y="78" width="180" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="145" y="98" font-size="14" font-weight="700" fill="#6b241c">Load balancer</text>
    <text x="145" y="115" font-size="11.5" fill="#6b241c">single instance</text>
    <rect x="55" y="168" width="180" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="145" y="188" font-size="14" font-weight="700" fill="#6b241c">App server</text>
    <text x="145" y="205" font-size="11.5" fill="#6b241c">single instance</text>
    <rect x="55" y="258" width="180" height="48" rx="8" fill="#fde8e6" stroke="#b5473a" stroke-width="2"/>
    <text x="145" y="278" font-size="14" font-weight="700" fill="#6b241c">Database</text>
    <text x="145" y="295" font-size="11.5" fill="#6b241c">no replica</text>
    <text x="145" y="362" font-size="11.5" fill="#6b241c">Any one failure stops the service.</text>
    <path d="M280 20V380" stroke="#c9d1db" stroke-width="1.5"/>

    <text x="535" y="30" font-size="13" font-weight="700" fill="#294a2e">After: redundant across three availability zones</text>
    <rect x="300" y="48" width="470" height="40" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="535" y="73" font-size="13" font-weight="700" fill="#36424e">Load balancer (managed, spans all zones)</text>
    <g fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="6 4">
      <rect x="300" y="104" width="136" height="280" rx="10"/>
      <rect x="467" y="104" width="136" height="280" rx="10"/>
      <rect x="634" y="104" width="136" height="280" rx="10"/>
    </g>
    <g font-size="12" font-weight="700" fill="#36424e" text-anchor="start">
      <text x="310" y="122">AZ a</text><text x="477" y="122">AZ b</text><text x="644" y="122">AZ c</text>
    </g>
    <g fill="#e8f5e9" stroke="#53845b" stroke-width="2">
      <rect x="308" y="134" width="120" height="44" rx="8"/>
      <rect x="475" y="134" width="120" height="44" rx="8"/>
      <rect x="642" y="134" width="120" height="44" rx="8"/>
    </g>
    <g fill="#294a2e">
      <text x="368" y="153" font-size="14" font-weight="700">app</text><text x="368" y="169" font-size="11.5">instance</text>
      <text x="535" y="153" font-size="14" font-weight="700">app</text><text x="535" y="169" font-size="11.5">instance</text>
      <text x="702" y="153" font-size="14" font-weight="700">app</text><text x="702" y="169" font-size="11.5">instance</text>
    </g>
    <rect x="308" y="246" width="120" height="48" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="368" y="266" font-size="14" font-weight="700" fill="#263e5a">DB primary</text>
    <text x="368" y="283" font-size="11.5" fill="#263e5a">takes writes</text>
    <rect x="475" y="246" width="120" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="535" y="266" font-size="14" font-weight="700" fill="#36424e">DB standby</text>
    <text x="535" y="283" font-size="11.5" fill="#36424e">sync copy</text>
    <rect x="642" y="246" width="120" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="702" y="266" font-size="14" font-weight="700" fill="#463365">Read replica</text>
    <text x="702" y="283" font-size="11.5" fill="#463365">async copy</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M145 126V166" marker-end="url(#maz-arrow)"/>
      <path d="M145 216V256" marker-end="url(#maz-arrow)"/>
      <path d="M368 88V132" marker-end="url(#maz-arrow)"/>
      <path d="M535 88V132" marker-end="url(#maz-arrow)"/>
      <path d="M702 88V132" marker-end="url(#maz-arrow)"/>
      <path d="M368 178V244" marker-end="url(#maz-arrow)"/>
      <path d="M528 178 402 244" marker-end="url(#maz-arrow)"/>
      <path d="M694 178 422 246" marker-end="url(#maz-arrow)"/>
    </g>
    <g fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round">
      <path d="M428 270H473" marker-end="url(#maz-ret)"/>
      <path d="M368 294V330H702V296" marker-end="url(#maz-ret)"/>
    </g>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="451" y="262">sync</text>
      <text x="535" y="346">async replication</text>
      <text x="390" y="226" text-anchor="start">writes</text>
    </g>
    <text x="535" y="402" font-size="11.5" fill="#294a2e">If AZ a fails: the load balancer drops its app and the standby is promoted.</text>
    <text x="400" y="430" font-size="13" fill="#40566b">Every layer has a copy in another zone, so one failure no longer stops the service.</text>
  </g>
</svg>
