<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="asl-title asl-desc">
  <title id="asl-title">The autoscaling control loop</title>
  <desc id="asl-desc">The autoscaler measures the metric, for example an average CPU of 90 percent across 4 pods against a target of 60 percent. It computes the desired count, ceil(4 times 90 divided by 60) equals 6, and applies limits: a minimum of 2, a maximum of 20, and a cooldown. It adds 2 instances quickly. New instances get no traffic until their readiness check passes; then the load balancer routes to all 6, the metric falls toward 60 percent, and the loop measures again. Scaling in is slower: when the desired count is lower, it waits a stabilization window of 300 seconds, then sends SIGTERM so readiness fails and in-flight requests drain, and then removes the instance.</desc>
  <defs>
    <marker id="asl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="asl-arrow-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="800" height="470" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="24" y="30" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Scale out: target tracking, average CPU target 60%</text>

    <rect x="40" y="46" width="200" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="140" y="69" font-size="13.5" font-weight="700" fill="#263e5a">1. Measure</text>
    <text x="140" y="88" font-size="11.5" fill="#263e5a">average CPU 90% on 4 pods</text>
    <rect x="300" y="46" width="200" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="400" y="69" font-size="13.5" font-weight="700" fill="#66400f">2. Compute desired</text>
    <text x="400" y="88" font-size="11.5" fill="#66400f">ceil(4 × 90 / 60) = 6</text>
    <rect x="560" y="46" width="200" height="56" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="660" y="69" font-size="13.5" font-weight="700" fill="#36424e">3. Apply limits</text>
    <text x="660" y="88" font-size="11.5" fill="#36424e">min 2, max 20, cooldown</text>

    <rect x="560" y="196" width="200" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="660" y="219" font-size="13.5" font-weight="700" fill="#294a2e">4. Add 2 instances</text>
    <text x="660" y="238" font-size="11.5" fill="#294a2e">scale out quickly</text>

    <path d="M460 194 535 224 460 254 385 224z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="460" y="221" font-size="11.5" font-weight="700" fill="#36424e">readiness</text>
    <text x="460" y="235" font-size="11.5" font-weight="700" fill="#36424e">check passes?</text>
    <rect x="390" y="284" width="140" height="36" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="460" y="300" font-size="11" fill="#36424e">starting: no traffic yet</text>
    <text x="460" y="313" font-size="11" fill="#36424e">(pools, config, warm-up)</text>

    <rect x="40" y="196" width="200" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="140" y="219" font-size="13.5" font-weight="700" fill="#463365">5. LB routes to all 6</text>
    <text x="140" y="238" font-size="11.5" fill="#463365">load spreads across pods</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 74H298" marker-end="url(#asl-arrow)"/>
      <path d="M500 74H558" marker-end="url(#asl-arrow)"/>
      <path d="M660 102V194" marker-end="url(#asl-arrow)"/>
      <path d="M560 224H537" marker-end="url(#asl-arrow)"/>
      <path d="M385 224H242" marker-end="url(#asl-arrow)"/>
      <path d="M450 254V282" marker-end="url(#asl-arrow)"/>
      <path d="M140 196V104" marker-end="url(#asl-arrow)"/>
    </g>
    <path d="M470 284V256" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" marker-end="url(#asl-arrow-ret)"/>
    <g font-size="11.5" fill="#40566b">
      <text x="313" y="216" font-weight="700">yes</text>
      <text x="438" y="272" font-weight="700" text-anchor="end">no</text>
      <text x="478" y="272" text-anchor="start" font-style="italic">re-check</text>
      <text x="148" y="146" text-anchor="start" font-style="italic">metric falls</text>
      <text x="148" y="161" text-anchor="start" font-style="italic">toward 60%;</text>
      <text x="148" y="176" text-anchor="start" font-style="italic">measure again</text>
      <text x="668" y="146" text-anchor="start" font-style="italic">6 &gt; 4</text>
    </g>

    <path d="M24 342H776" stroke="#c9d1db" stroke-width="1.5"/>
    <text x="24" y="366" font-size="13" font-weight="700" fill="#40566b" text-anchor="start">Scale in: slowly, and without dropping requests</text>
    <g font-size="12" font-weight="700">
      <rect x="20" y="378" width="180" height="48" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
      <text x="110" y="398" fill="#66400f">desired &lt; current</text>
      <text x="110" y="414" font-size="11" font-weight="400" fill="#66400f">e.g. traffic drops at night</text>
      <rect x="214" y="378" width="180" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
      <text x="304" y="398" fill="#36424e">wait 300 s</text>
      <text x="304" y="414" font-size="11" font-weight="400" fill="#36424e">stabilization window</text>
      <rect x="408" y="378" width="180" height="48" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
      <text x="498" y="398" fill="#463365">SIGTERM, then drain</text>
      <text x="498" y="414" font-size="11" font-weight="400" fill="#463365">readiness fails; requests finish</text>
      <rect x="602" y="378" width="178" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
      <text x="691" y="398" fill="#294a2e">instance removed</text>
      <text x="691" y="414" font-size="11" font-weight="400" fill="#294a2e">no request was dropped</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M200 402H212" marker-end="url(#asl-arrow)"/>
      <path d="M394 402H406" marker-end="url(#asl-arrow)"/>
      <path d="M588 402H600" marker-end="url(#asl-arrow)"/>
    </g>
    <text x="400" y="456" font-size="13" fill="#40566b">Scale out fast, scale in slowly, and send traffic only to instances that report ready.</text>
  </g>
</svg>
