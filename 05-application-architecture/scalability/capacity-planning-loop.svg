<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="cpl-title cpl-desc">
  <title id="cpl-title">Capacity planning is a loop from forecast to monitoring and back</title>
  <desc id="cpl-desc">Step 1: forecast the peak from trend, seasons and launches. Step 2: load test to find the maximum requests per second per instance within the SLO. Step 3: set headroom, targeting 50 to 70 percent utilization and enough spare capacity to lose a zone. Step 4: provision the baseline, configure autoscaling and raise quotas. Step 5: monitor saturation, p99 latency and cost. If the forecast is wrong or a resource is near its limit, re-forecast and repeat; otherwise keep watching.</desc>
  <defs>
    <marker id="cpl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="cpl-ret" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#60788d"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="50" width="210" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="135" y="74" font-size="14" font-weight="700" fill="#263e5a">1. Forecast the peak</text>
    <text x="135" y="92" font-size="11.5" fill="#263e5a">trend, seasons, launches</text>
    <rect x="285" y="50" width="210" height="56" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="390" y="74" font-size="14" font-weight="700" fill="#263e5a">2. Load test</text>
    <text x="390" y="92" font-size="11.5" fill="#263e5a">max RPS per instance at SLO</text>
    <rect x="540" y="50" width="210" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="645" y="74" font-size="14" font-weight="700" fill="#66400f">3. Set headroom</text>
    <text x="645" y="92" font-size="11.5" fill="#66400f">target 50-70%, lose a zone</text>
    <rect x="540" y="230" width="210" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="645" y="254" font-size="14" font-weight="700" fill="#294a2e">4. Provision, autoscale</text>
    <text x="645" y="272" font-size="11.5" fill="#294a2e">baseline + autoscaling, quotas</text>
    <rect x="285" y="230" width="210" height="56" rx="8" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="390" y="254" font-size="14" font-weight="700" fill="#463365">5. Monitor</text>
    <text x="390" y="272" font-size="11.5" fill="#463365">saturation, p99, cost</text>
    <path d="M135 222 235 258 135 294 35 258z" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="135" y="255" font-size="12" font-weight="700" fill="#36424e">forecast wrong or</text>
    <text x="135" y="269" font-size="12" font-weight="700" fill="#36424e">near a limit?</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 78H283" marker-end="url(#cpl-arrow)"/>
      <path d="M495 78H538" marker-end="url(#cpl-arrow)"/>
      <path d="M645 106V228" marker-end="url(#cpl-arrow)"/>
      <path d="M540 258H497" marker-end="url(#cpl-arrow)"/>
      <path d="M285 258H237" marker-end="url(#cpl-arrow)"/>
      <path d="M135 222V108" marker-end="url(#cpl-arrow)"/>
    </g>
    <path d="M135 294V330H390V288" fill="none" stroke="#60788d" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#cpl-ret)"/>
    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="653" y="170" text-anchor="start">sized plan</text>
      <text x="518" y="250">deploy</text>
      <text x="261" y="250">metrics</text>
      <text x="143" y="168" text-anchor="start">yes: re-forecast</text>
      <text x="262" y="346">no: keep watching</text>
    </g>
    <text x="390" y="396" font-size="13" fill="#40566b">A loop, not a one-off: re-forecast when reality drifts and before big events.</text>
  </g>
</svg>
