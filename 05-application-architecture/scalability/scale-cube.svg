<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="scb-title scb-desc">
  <title id="scb-title">The scale cube: clone, split by function, split by data</title>
  <desc id="scb-desc">Starting from a monolith running as one instance, the X axis clones it: a load balancer spreads requests over identical API copies, which is simple but every copy still needs all the data. The Y axis splits by function into services such as orders, users, and search, giving independent scaling but more network calls. The Z axis splits by data into shards, for example customers A to M on shard 1 and N to Z on shard 2, which scales data and writes but makes cross-shard queries hard.</desc>
  <defs>
    <marker id="scb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="230" y="270" width="140" height="48" rx="8" fill="#eef1f5" stroke="#8a96a3" stroke-width="2"/>
    <text x="300" y="290" font-size="14" font-weight="700" fill="#36424e">Monolith</text>
    <text x="300" y="307" font-size="11.5" fill="#36424e">one instance</text>

    <g fill="none" stroke="#40566b" stroke-width="2.5" stroke-linecap="round">
      <path d="M370 294H564" marker-end="url(#scb-arrow)"/>
      <path d="M300 270V122" marker-end="url(#scb-arrow)"/>
      <path d="M262 318 200 389" marker-end="url(#scb-arrow)"/>
    </g>
    <text x="468" y="286" font-size="12" font-weight="700" fill="#263e5a">X-axis: clone</text>
    <text x="468" y="310" font-size="11" fill="#263e5a">identical copies</text>
    <text x="290" y="192" font-size="12" font-weight="700" fill="#463365" text-anchor="end">Y-axis: split</text>
    <text x="290" y="207" font-size="12" font-weight="700" fill="#463365" text-anchor="end">by function</text>
    <text x="250" y="358" font-size="12" font-weight="700" fill="#294a2e" text-anchor="start">Z-axis: split by data</text>

    <rect x="572" y="244" width="208" height="100" rx="10" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="676" y="262" font-size="13" font-weight="700" fill="#263e5a">X: clone</text>
    <rect x="636" y="270" width="80" height="22" rx="6" fill="#eef1f5" stroke="#8a96a3" stroke-width="1.5"/>
    <text x="676" y="285" font-size="11.5" font-weight="700" fill="#36424e">LB</text>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <rect x="586" y="306" width="54" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="613" y="324">API</text>
      <rect x="649" y="306" width="54" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="676" y="324">API</text>
      <rect x="712" y="306" width="54" height="28" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="739" y="324">API</text>
    </g>
    <g fill="none" stroke="#40566b" stroke-width="1.5">
      <path d="M660 292 613 306M676 292V306M692 292 739 306"/>
    </g>
    <text x="676" y="362" font-size="11" fill="#263e5a">every copy still needs all the data</text>

    <rect x="176" y="56" width="248" height="62" rx="10" fill="#f0e9fb" stroke="#8062a8" stroke-width="2"/>
    <text x="300" y="74" font-size="13" font-weight="700" fill="#463365">Y: split by function</text>
    <g font-size="11.5" font-weight="700" fill="#66400f">
      <rect x="188" y="84" width="70" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="223" y="101">orders</text>
      <rect x="265" y="84" width="70" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="300" y="101">users</text>
      <rect x="342" y="84" width="70" height="26" rx="6" fill="#fff0d9" stroke="#bd7a20" stroke-width="1.5"/>
      <text x="377" y="101">search</text>
    </g>
    <text x="434" y="92" font-size="11" fill="#463365" text-anchor="start">independent scaling;</text>
    <text x="434" y="107" font-size="11" fill="#463365" text-anchor="start">more network calls</text>

    <rect x="160" y="392" width="320" height="62" rx="10" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="320" y="410" font-size="13" font-weight="700" fill="#294a2e">Z: split by data (shards)</text>
    <g font-size="11.5" font-weight="700" fill="#263e5a">
      <rect x="172" y="420" width="146" height="26" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="245" y="437">shard 1: customers A–M</text>
      <rect x="324" y="420" width="146" height="26" rx="6" fill="#e5efff" stroke="#4774aa" stroke-width="1.5"/>
      <text x="397" y="437">shard 2: customers N–Z</text>
    </g>
    <text x="320" y="472" font-size="11" fill="#294a2e">scales data and writes; cross-shard queries are hard</text>
    <text x="640" y="452" font-size="12.5" fill="#40566b">Usual order: X first,</text>
    <text x="640" y="470" font-size="12.5" fill="#40566b">then Y as teams grow,</text>
    <text x="640" y="488" font-size="12.5" fill="#40566b">Z when data outgrows one DB.</text>
  </g>
</svg>
