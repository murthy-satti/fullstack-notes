<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="qrm-title qrm-desc">
  <title id="qrm-title">With N = 3, W = 2 and R = 2, every read overlaps the latest successful write</title>
  <desc id="qrm-desc">A writer sends version 2 to all three replicas and succeeds once replicas A and B acknowledge, because W is 2. Replica C is slow and still holds version 1. A reader asks two replicas, B and C, because R is 2, and gets v2 from B and v1 from C. It compares versions and returns v2. Because R plus W is 4, more than N of 3, every read set shares at least one replica with every successful write set; here that replica is B.</desc>
  <defs>
    <marker id="qrm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#40566b"/>
    </marker>
    <marker id="qrm-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#b5473a"/>
    </marker>
  </defs>
  <rect width="760" height="440" rx="14" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="36" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="115" y="55" font-size="14" font-weight="700" fill="#263e5a">Writer</text>
    <text x="115" y="71" font-size="11.5" fill="#263e5a">write v2, W = 2</text>

    <rect x="40" y="200" width="150" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="115" y="223" font-size="14" font-weight="700" fill="#294a2e">Replica A</text>
    <text x="115" y="241" font-size="11.5" fill="#294a2e">has v2</text>
    <rect x="297" y="192" width="166" height="72" rx="10" fill="none" stroke="#53845b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="305" y="200" width="150" height="56" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="380" y="223" font-size="14" font-weight="700" fill="#294a2e">Replica B</text>
    <text x="380" y="241" font-size="11.5" fill="#294a2e">has v2</text>
    <rect x="570" y="200" width="150" height="56" rx="8" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="645" y="223" font-size="14" font-weight="700" fill="#66400f">Replica C</text>
    <text x="645" y="241" font-size="11.5" fill="#66400f">still v1 (missed it)</text>

    <rect x="570" y="330" width="150" height="44" rx="8" fill="#e5efff" stroke="#4774aa" stroke-width="2"/>
    <text x="645" y="349" font-size="14" font-weight="700" fill="#263e5a">Reader</text>
    <text x="645" y="365" font-size="11.5" fill="#263e5a">read, R = 2</text>
    <rect x="40" y="328" width="330" height="48" rx="8" fill="#e8f5e9" stroke="#53845b" stroke-width="2"/>
    <text x="205" y="348" font-size="14" font-weight="700" fill="#294a2e">Reader returns v2</text>
    <text x="205" y="365" font-size="11.5" fill="#294a2e">newest version wins; B is in both sets</text>

    <g fill="none" stroke="#40566b" stroke-width="2" stroke-linecap="round">
      <path d="M115 80V198" marker-end="url(#qrm-arrow)"/>
      <path d="M190 64 376 190" marker-end="url(#qrm-arrow)"/>
      <path d="M590 330 466 262" marker-end="url(#qrm-arrow)"/>
      <path d="M645 330V258" marker-end="url(#qrm-arrow)"/>
      <path d="M568 352H372" marker-end="url(#qrm-arrow)"/>
    </g>
    <path d="M190 52 640 198" fill="none" stroke="#b5473a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#qrm-red)"/>

    <g font-size="11.5" font-style="italic" fill="#40566b">
      <text x="123" y="150" text-anchor="start">write, ack</text>
      <text x="262" y="132" text-anchor="end">write, ack</text>
      <text x="500" y="118" fill="#6b241c">slow: not applied yet</text>
      <text x="508" y="314" text-anchor="end">read: v2</text>
      <text x="653" y="298" text-anchor="start">read: v1</text>
      <text x="470" y="344">compare versions</text>
    </g>
    <text x="380" y="420" font-size="13" fill="#40566b">R + W = 4 &gt; N = 3, so every read set shares a replica with every successful write.</text>
  </g>
</svg>
