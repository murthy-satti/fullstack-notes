<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">CSS box model layers</title>
  <desc id="desc">The CSS box model surrounds content with padding, then border, then margin. The border-box sizing option includes content, padding, and border in the declared width.</desc>
  <defs>
    <style>
      .margin{fill:#fff0d6;stroke:#b87918;stroke-width:2}
      .border{fill:#f6d8d8;stroke:#9b4242;stroke-width:2}
      .padding{fill:#e2f1ff;stroke:#2463a6;stroke-width:2}
      .content{fill:#e7f6ee;stroke:#2b7650;stroke-width:2}
      .label{font:700 18px Arial,sans-serif;fill:#172334}
      .small{font:15px Arial,sans-serif;fill:#26364b}
    </style>
  </defs>
  <rect x="50" y="35" width="620" height="250" rx="8" class="margin"/>
  <text x="360" y="65" text-anchor="middle" class="label">Margin</text>
  <rect x="110" y="82" width="500" height="165" rx="6" class="border"/>
  <text x="360" y="112" text-anchor="middle" class="label">Border</text>
  <rect x="165" y="125" width="390" height="95" rx="6" class="padding"/>
  <text x="360" y="153" text-anchor="middle" class="label">Padding</text>
  <rect x="245" y="165" width="230" height="38" rx="4" class="content"/>
  <text x="360" y="190" text-anchor="middle" class="small">Content box</text>
  <text x="360" y="320" text-anchor="middle" class="small">With box-sizing: border-box, declared width includes content + padding + border.</text>
</svg>
