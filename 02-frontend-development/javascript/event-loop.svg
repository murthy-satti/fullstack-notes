<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript event loop overview</title>
  <desc id="desc">Synchronous JavaScript runs on the call stack. Promise reactions wait in the microtask queue, other callbacks wait in the task queue, and the event loop schedules ready work between browser rendering opportunities.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#43536b"/>
    </marker>
    <style>
      .box{fill:#f4f7fb;stroke:#43536b;stroke-width:2;rx:12}
      .accent{fill:#e2f1ff;stroke:#2463a6;stroke-width:2;rx:12}
      .title{font:700 18px Arial,sans-serif;fill:#172334}
      .text{font:15px Arial,sans-serif;fill:#26364b}
      .arrow{stroke:#43536b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="25" y="100" width="180" height="90" class="accent"/>
  <text x="115" y="135" text-anchor="middle" class="title">Call stack</text>
  <text x="115" y="162" text-anchor="middle" class="text">Run current JS job</text>
  <rect x="275" y="35" width="190" height="80" class="box"/>
  <text x="370" y="68" text-anchor="middle" class="title">Microtask queue</text>
  <text x="370" y="94" text-anchor="middle" class="text">Promise reactions</text>
  <rect x="275" y="175" width="190" height="80" class="box"/>
  <text x="370" y="208" text-anchor="middle" class="title">Task queue</text>
  <text x="370" y="234" text-anchor="middle" class="text">Timers, user events</text>
  <rect x="580" y="100" width="250" height="90" class="accent"/>
  <text x="705" y="135" text-anchor="middle" class="title">Event loop</text>
  <text x="705" y="162" text-anchor="middle" class="text">Schedule ready work</text>
  <path d="M205 120L270 90" class="arrow"/>
  <path d="M205 170L270 205" class="arrow"/>
  <path d="M465 80L575 120" class="arrow"/>
  <path d="M465 210L575 170" class="arrow"/>
  <path d="M580 190C530 280 250 285 180 195" class="arrow"/>
  <text x="690" y="235" text-anchor="middle" class="text">Rendering can occur between jobs</text>
</svg>
