<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="title description">
  <title id="title">Frontend technologies form a rendered page</title>
  <desc id="description">HTML provides structure, CSS provides presentation, and JavaScript provides behavior. The browser combines them into a web page.</desc>
  <rect width="640" height="220" rx="14" fill="#f3f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="22" y="58" width="150" height="96" rx="10" fill="#dceeff" stroke="#3478b8" stroke-width="2"/>
    <text x="97" y="94" font-size="21" font-weight="700" fill="#183c5b">HTML</text>
    <text x="97" y="122" font-size="14" fill="#183c5b">structure</text>
    <rect x="190" y="58" width="150" height="96" rx="10" fill="#e7f5e9" stroke="#43844b" stroke-width="2"/>
    <text x="265" y="94" font-size="21" font-weight="700" fill="#254c2c">CSS</text>
    <text x="265" y="122" font-size="14" fill="#254c2c">presentation</text>
    <rect x="358" y="58" width="150" height="96" rx="10" fill="#fff0d9" stroke="#bd7a20" stroke-width="2"/>
    <text x="433" y="94" font-size="21" font-weight="700" fill="#66400f">JavaScript</text>
    <text x="433" y="122" font-size="14" fill="#66400f">behavior</text>
    <path d="M518 106h37m-9-9 9 9-9 9" fill="none" stroke="#40566b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="563" y="58" width="60" height="96" rx="10" fill="#ffffff" stroke="#526b82" stroke-width="2"/>
    <text x="593" y="97" font-size="13" font-weight="700" fill="#263a4d">Browser</text>
    <text x="593" y="121" font-size="12" fill="#263a4d">page</text>
    <text x="320" y="192" font-size="13" fill="#40566b">The browser combines structure, presentation, and behavior.</text>
  </g>
</svg>
