<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc">
  <title id="title">React update cycle</title>
  <desc id="desc">An event causes a state update. React renders the component tree, reconciles the result with the previous UI, commits necessary DOM changes, and the browser displays the result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#43536b"/>
    </marker>
    <style>
      .box{fill:#e2f1ff;stroke:#2463a6;stroke-width:2;rx:12}
      .green{fill:#e7f6ee;stroke:#2b7650;stroke-width:2;rx:12}
      .title{font:700 17px Arial,sans-serif;fill:#172334}
      .text{font:14px Arial,sans-serif;fill:#26364b}
      .arrow{stroke:#43536b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="25" y="85" width="140" height="90" class="box"/>
  <text x="95" y="120" text-anchor="middle" class="title">Event</text>
  <text x="95" y="146" text-anchor="middle" class="text">User action</text>
  <rect x="205" y="85" width="150" height="90" class="box"/>
  <text x="280" y="120" text-anchor="middle" class="title">State update</text>
  <text x="280" y="146" text-anchor="middle" class="text">Setter called</text>
  <rect x="395" y="85" width="145" height="90" class="box"/>
  <text x="467" y="120" text-anchor="middle" class="title">Render</text>
  <text x="467" y="146" text-anchor="middle" class="text">Calculate UI</text>
  <rect x="580" y="85" width="155" height="90" class="box"/>
  <text x="657" y="120" text-anchor="middle" class="title">Reconcile</text>
  <text x="657" y="146" text-anchor="middle" class="text">Find differences</text>
  <rect x="775" y="85" width="90" height="90" class="green"/>
  <text x="820" y="120" text-anchor="middle" class="title">Commit</text>
  <text x="820" y="146" text-anchor="middle" class="text">DOM update</text>
  <path d="M165 130L200 130" class="arrow"/>
  <path d="M355 130L390 130" class="arrow"/>
  <path d="M540 130L575 130" class="arrow"/>
  <path d="M735 130L770 130" class="arrow"/>
  <text x="440" y="220" text-anchor="middle" class="text">Browser paints the committed result; not every render changes the DOM</text>
</svg>
