<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Browser JavaScript runtime</title>
  <desc id="desc">JavaScript executes on the main thread. It can ask browser APIs to perform work. When work completes, callbacks enter queues and the event loop schedules them when the call stack is available. Rendering also needs opportunities on the main thread.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#43536b"/>
    </marker>
    <style>
      .box{fill:#f4f7fb;stroke:#43536b;stroke-width:2;rx:12}
      .blue{fill:#e2f1ff;stroke:#2463a6;stroke-width:2;rx:12}
      .green{fill:#e7f6ee;stroke:#2b7650;stroke-width:2;rx:12}
      .title{font:700 18px Arial,sans-serif;fill:#172334}
      .text{font:14px Arial,sans-serif;fill:#26364b}
      .arrow{stroke:#43536b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="25" y="115" width="180" height="95" class="blue"/>
  <text x="115" y="151" text-anchor="middle" class="title">JS call stack</text>
  <text x="115" y="178" text-anchor="middle" class="text">One job runs to completion</text>
  <rect x="285" y="30" width="200" height="90" class="box"/>
  <text x="385" y="66" text-anchor="middle" class="title">Browser APIs</text>
  <text x="385" y="92" text-anchor="middle" class="text">Network, timers, DOM</text>
  <rect x="285" y="210" width="200" height="90" class="box"/>
  <text x="385" y="246" text-anchor="middle" class="title">Callback queues</text>
  <text x="385" y="272" text-anchor="middle" class="text">Ready work waits here</text>
  <rect x="585" y="115" width="165" height="95" class="blue"/>
  <text x="667" y="151" text-anchor="middle" class="title">Event loop</text>
  <text x="667" y="178" text-anchor="middle" class="text">Schedules next job</text>
  <rect x="785" y="115" width="100" height="95" class="green"/>
  <text x="835" y="151" text-anchor="middle" class="title">Render</text>
  <text x="835" y="178" text-anchor="middle" class="text">When ready</text>
  <path d="M205 140L280 95" class="arrow"/>
  <path d="M385 120L385 205" class="arrow"/>
  <path d="M485 250L580 190" class="arrow"/>
  <path d="M585 145L210 145" class="arrow"/>
  <path d="M750 162L780 162" class="arrow"/>
  <text x="665" y="235" text-anchor="middle" class="text">Stack must be available</text>
</svg>
