<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Next.js server and browser rendering boundary</title>
  <desc id="desc">A browser request reaches the Next.js server, which loads data and renders server components and initial HTML. Client component code is also sent to the browser where React hydrates interactive parts. Later interactions may trigger browser updates or new server requests.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#43536b"/>
    </marker>
    <style>
      .box{fill:#f4f7fb;stroke:#43536b;stroke-width:2;rx:12}
      .blue{fill:#e2f1ff;stroke:#2463a6;stroke-width:2;rx:12}
      .green{fill:#e7f6ee;stroke:#2b7650;stroke-width:2;rx:12}
      .title{font:700 17px Arial,sans-serif;fill:#172334}
      .text{font:14px Arial,sans-serif;fill:#26364b}
      .arrow{stroke:#43536b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#2463a6;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="25" y="105" width="150" height="95" class="green"/>
  <text x="100" y="143" text-anchor="middle" class="title">Browser</text>
  <text x="100" y="170" text-anchor="middle" class="text">Request route</text>
  <rect x="245" y="65" width="300" height="175" class="blue"/>
  <text x="395" y="98" text-anchor="middle" class="title">Next.js server</text>
  <text x="395" y="133" text-anchor="middle" class="text">Load permitted data</text>
  <text x="395" y="160" text-anchor="middle" class="text">Render Server Components</text>
  <text x="395" y="187" text-anchor="middle" class="text">Prepare HTML and client references</text>
  <rect x="615" y="65" width="250" height="175" class="green"/>
  <text x="740" y="98" text-anchor="middle" class="title">Browser UI</text>
  <text x="740" y="133" text-anchor="middle" class="text">Display initial HTML</text>
  <text x="740" y="160" text-anchor="middle" class="text">Load client code</text>
  <text x="740" y="187" text-anchor="middle" class="text">Hydrate interactive parts</text>
  <path d="M175 130L240 130" class="arrow"/>
  <path d="M545 130L610 130" class="arrow"/>
  <path d="M615 210C480 300 210 290 100 205" class="dash"/>
  <text x="390" y="285" text-anchor="middle" class="text">Interactions may update locally or request server work</text>
</svg>
